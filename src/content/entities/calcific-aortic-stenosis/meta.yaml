id: calcific-aortic-stenosis
module: o17
tier: core
kind: disease
names:
  it: "Stenosi aortica calcifica"
  en: "Calcific aortic stenosis"
  eponyms: []
  synonyms:
    it: ["Stenosi aortica degenerativa", "Stenosi aortica senile"]
    en: ["Degenerative aortic stenosis", "Senile calcific aortic stenosis"]
  abbreviations: ["AS"]
summary:
  it: "Restringimento dell'orifizio della valvola aortica per deposizione di calcio nei lembi, su valvola degenerata, bicuspide o reumatica, con ipertrofia concentrica del ventricolo sinistro."
  en: "Narrowing of the aortic valve orifice from calcium deposited in the cusps, on a degenerative, bicuspid or rheumatic valve, with concentric left ventricular hypertrophy."
lenses:
  system: [heart]
  process: [pathologic-calcification, cellular-adaptation]
  pattern: [dystrophic-calcification, hypertrophy]
  presentation: []
  marker: []
  group: [degenerative]
learningObjectives:
  - it: "Elencare le tre condizioni in cui si sviluppa la stenosi aortica calcifica: reumatica, degenerativa e su valvola bicuspide."
    en: "List the three settings of calcific aortic stenosis: rheumatic, degenerative and bicuspid."
  - it: "Distinguere la valvola reumatica da quella degenerativa o bicuspide in base alla fusione commissurale."
    en: "Tell a rheumatic valve from a degenerative or bicuspid one by commissural fusion."
  - it: "Descrivere la calcificazione come processo attivo e spiegare perché le statine non la prevengono."
    en: "Describe calcification as an active process and explain why statins do not prevent it."
  - it: "Collegare la stenosi grave all'ipertrofia concentrica del ventricolo sinistro e alla sua evoluzione."
    en: "Link severe stenosis to concentric left ventricular hypertrophy and its evolution."
  - it: "Riconoscere la calcificazione dell'anulus mitralico come reperto diverso e di solito silente."
    en: "Recognize mitral annular calcification as a different, usually silent finding."
prerequisites: [hypertrophy]
relations:
  - type: differentialOf
    target: rheumatic-heart-disease
    note:
      it: "La valvola reumatica ha commissure fuse; quella degenerativa o bicuspide no."
      en: "The rheumatic valve has fused commissures; the degenerative or bicuspid one does not."
  - type: sharesMechanism
    target: atherosclerosis
    note:
      it: "Meccanismi e fattori di rischio simili (LDL, infiammazione), ma le statine non prevengono la stenosi."
      en: "Similar mechanisms and risk factors (LDL, inflammation), but statins do not prevent the stenosis."
  - type: causes
    target: cardiac-hypertrophy-and-heart-failure
    note:
      it: "La stenosi grave causa ipertrofia ventricolare sinistra e infine scompenso."
      en: "Severe stenosis causes left ventricular hypertrophy and eventually failure."
quickCheck:
  - id: calcific-aortic-stenosis-q1
    q:
      it: "Quali sono le tre condizioni in cui si sviluppa la stenosi aortica calcifica?"
      en: "What are the three settings in which calcific aortic stenosis develops?"
    a:
      it: "Malattia reumatica della valvola aortica, degenerazione senile di una valvola tricuspide e valvola bicuspide congenita."
      en: "Rheumatic aortic valve disease, senile degeneration of a tricuspid valve, and a congenital bicuspid valve."
    kind: short
  - id: calcific-aortic-stenosis-q2
    q:
      it: "Quale reperto macroscopico fa pensare a una causa reumatica?"
      en: "Which gross finding points to a rheumatic cause?"
    a:
      it: "La fusione delle commissure, assente nella forma degenerativa e nella valvola bicuspide."
      en: "Fused commissures, absent in the degenerative form and in the bicuspid valve."
    kind: short
  - id: calcific-aortic-stenosis-q3
    q:
      it: "La calcificazione della valvola aortica è un semplice deposito passivo?"
      en: "Is aortic valve calcification simple passive deposition?"
    a:
      it: "No. Cellule valvolari vive la guidano attivamente, con un fenotipo simile a quello degli osteoblasti."
      en: "No. Living valve cells drive it actively, taking on an osteoblast-like phenotype."
    kind: short
  - id: calcific-aortic-stenosis-q4
    q:
      it: "Che cosa provoca nel ventricolo sinistro una stenosi aortica grave?"
      en: "What does severe aortic stenosis do to the left ventricle?"
    a:
      it: "Una marcata ipertrofia concentrica; alla fine il ventricolo si dilata e va in insufficienza."
      en: "Marked concentric hypertrophy; eventually the ventricle dilates and fails."
    kind: short
  - id: calcific-aortic-stenosis-q5
    q:
      it: "Quanto conta di solito la calcificazione dell'anulus mitralico dal punto di vista funzionale?"
      en: "How much does mitral annular calcification usually matter functionally?"
    a:
      it: "Raramente crea problemi funzionali, anche se è frequente negli anziani."
      en: "It rarely causes functional trouble, although it is common among the elderly."
    kind: short
selfExplain:
  - it: "Perché una valvola bicuspide, non stenotica alla nascita, può diventare stenotica con l'età?"
    en: "Why can a bicuspid valve, not stenotic at birth, become stenotic with age?"
  - it: "Perché una valvola aortica strutturalmente normale può calcificare dopo una lunga esposizione al flusso turbolento?"
    en: "Why can a structurally normal aortic valve calcify after long exposure to turbulent flow?"
