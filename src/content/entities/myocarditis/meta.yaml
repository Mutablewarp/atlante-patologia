summary:
  it: "Infiammazione del miocardio con necrosi dei miociti, esclusa la cardiopatia ischemica; le cause più frequenti sono virali, ma esistono forme da ipersensibilità, a cellule giganti e sarcoidea."
  en: "Inflammation of the myocardium with myocyte necrosis, excluding ischemic heart disease; viruses are the commonest cause, but hypersensitivity, giant cell and sarcoid forms exist."
