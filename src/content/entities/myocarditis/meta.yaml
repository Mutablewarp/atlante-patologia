relations:
  - type: causes
    target: dilated-cardiomyopathy
    note:
      it: "Una mancata eliminazione del virus o un'attivazione immunitaria persistente possono portare a cardiomiopatia dilatativa."
      en: "Failed viral clearance or persistent immune activation can lead to dilated cardiomyopathy."
  - type: mimics
    target: myocardial-infarction
    note:
      it: "Una necrosi estesa può somigliare a un infarto acuto; la miocardite da ipersensibilità può dare dolore toracico e ECG da ischemia."
      en: "Extensive necrosis can resemble an acute infarct; hypersensitivity myocarditis can give chest pain and ischemic ECG changes."
  - type: sameLesionOtherOrgan
    target: sarcoidosis
    note:
      it: "La sarcoidosi cardiaca è una miocardite granulomatosa."
      en: "Cardiac sarcoidosis is a granulomatous myocarditis."
  - type: complicationOf
    target: infective-endocarditis
    note:
      it: "Emboli settici dell'endocardite possono dare microascessi miocardici."
      en: "Septic emboli from endocarditis can cause myocardial microabscesses."
quickCheck:
  - id: myocarditis-q1
    q:
      it: "Perché i bambini sono particolarmente colpiti dalla miocardite da coxsackievirus?"
      en: "Why are children particularly affected by coxsackievirus myocarditis?"
    a:
      it: "Il recettore CAR, usato da coxsackievirus e adenovirus per entrare nei miociti, è particolarmente abbondante nei bambini."
      en: "The CAR receptor, which coxsackievirus and adenovirus use to enter myocytes, is especially abundant in children."
    kind: short
  - id: myocarditis-q2
    q:
      it: "Quale infiltrato fa pensare a una miocardite da ipersensibilità, e che cosa manca di solito?"
      en: "Which infiltrate suggests hypersensitivity myocarditis, and what is usually absent?"
    a:
      it: "Un infiltrato ricco di eosinofili, interstiziale e perivascolare; di solito manca la necrosi dei miociti."
      en: "An eosinophil-rich, interstitial and perivascular infiltrate; myocyte necrosis is usually absent."
    kind: short
  - id: myocarditis-q3
    q:
      it: "Come si distinguono la miocardite a cellule giganti e la sarcoidosi cardiaca?"
      en: "How do giant cell myocarditis and cardiac sarcoidosis differ?"
    a:
      it: "La miocardite a cellule giganti ha molte cellule giganti ma nessun granuloma; la sarcoidosi ha granulomi non caseosi."
      en: "Giant cell myocarditis has many giant cells but no granulomas; sarcoidosis has noncaseating granulomas."
    kind: short
  - id: myocarditis-q4
    q:
      it: "Che cosa serve per affermare che una miocardite è davvero virale?"
      en: "What is needed to call a myocarditis truly viral?"
    a:
      it: "Servono studi speciali che trovino genomi virali nel tessuto della biopsia cardiaca; altrimenti la causa virale resta indiretta."
      en: "Special studies must find viral genomes in heart biopsy tissue; otherwise the viral cause stays circumstantial."
    kind: short
  - id: myocarditis-q5
    q:
      it: "Come si gestisce una miocardite da ipersensibilità sintomatica?"
      en: "How is symptomatic hypersensitivity myocarditis managed?"
    a:
      it: "Si sospende il farmaco responsabile e si possono aggiungere corticosteroidi o altri immunosoppressori."
      en: "The offending drug is withdrawn, and corticosteroids or other immunosuppressants may be added."
    kind: short
