learningObjectives:
  - it: "Definire la miocardite e distinguerla dalla cardiopatia ischemica."
    en: "Define myocarditis and distinguish it from ischemic heart disease."
  - it: "Elencare le cause infettive e non infettive, con i virus più frequenti."
    en: "List the infectious and noninfectious causes, with the most frequent viruses."
  - it: "Descrivere le due fasi della miocardite virale e il loro quadro istologico."
    en: "Describe the two phases of viral myocarditis and their histology."
  - it: "Riconoscere le forme da ipersensibilità, a cellule giganti e sarcoidea in base all'infiltrato."
    en: "Recognize the hypersensitivity, giant cell and sarcoid forms from the infiltrate."
  - it: "Spiegare il ruolo e i limiti della biopsia endomiocardica e le complicanze principali."
    en: "Explain the role and limits of endomyocardial biopsy and the main complications."
