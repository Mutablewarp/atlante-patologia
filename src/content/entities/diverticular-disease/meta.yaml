quickCheck:
  - id: diverticular-disease-q1
    q:
      it: "Perché i diverticoli del colon sono detti pseudodiverticoli?"
      en: "Why are colonic diverticula called pseudodiverticula?"
    a:
      it: "Perché erniano solo mucosa e sottomucosa attraverso la muscolare, mentre un diverticolo vero comprende tutti gli strati della parete."
      en: "Because only mucosa and submucosa herniate through the muscle, whereas a true diverticulum contains all layers of the wall."
    kind: short
  - id: diverticular-disease-q2
    q:
      it: "Quali complicanze può dare la diverticolite?"
      en: "Which complications can diverticulitis cause?"
    a:
      it: "Perforazione con ascesso, peritonite generalizzata (poco frequente), ostruzione da fibrosi e fistole verso strutture vicine, come vescica o vagina."
      en: "Perforation with abscess, generalized peritonitis (infrequent), obstruction from fibrosis, and fistulas to neighboring structures such as the bladder or vagina."
    kind: short
  - id: diverticular-disease-q3
    q:
      it: "Come si presenta il sanguinamento da diverticoli?"
      en: "How does bleeding from diverticula present?"
    a:
      it: "In modo improvviso, indolore e abbondante, soprattutto nell'anziano."
      en: "Suddenly, painlessly and heavily, mainly in the elderly."
    kind: short
