summary:
  it: "Condizione del colon, soprattutto sigma, in cui mucosa e sottomucosa erniano attraverso la parete muscolare formando pseudodiverticoli (diverticolosi), che possono infiammarsi, perforarsi, dare ascessi, fistole o sanguinamento."
  en: "Condition of the colon, mainly the sigmoid, in which mucosa and submucosa herniate through the muscular wall to form pseudodiverticula (diverticulosis), which can become inflamed, perforate, form abscesses or fistulas, or bleed."
