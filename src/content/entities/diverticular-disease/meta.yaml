learningObjectives:
  - it: "Spiegare perché i diverticoli del colon sono pseudodiverticoli e non diverticoli veri."
    en: "Explain why colonic diverticula are pseudodiverticula and not true diverticula."
  - it: "Collegare dieta povera di fibre, aumento di pressione intraluminale e punti deboli della parete alla formazione dei diverticoli."
    en: "Link a low-fiber diet, raised intraluminal pressure and weak points of the wall to diverticulum formation."
  - it: "Elencare le complicanze della diverticolite: ascesso, perforazione, fistola, ostruzione."
    en: "List the complications of diverticulitis: abscess, perforation, fistula, obstruction."
  - it: "Distinguere il sanguinamento diverticolare, improvviso e indolore, dalla diverticolite con dolore e febbre."
    en: "Distinguish diverticular bleeding, sudden and painless, from diverticulitis with pain and fever."
