    en: "Tell me about acute and subacute endocarditis: which organisms, and on which valves?"
    focus: [definition, high-yield]
    level: 1
  - it: "Dove si trovano le vegetazioni sulla valvola e che cosa contengono al microscopio?"
    en: "Where are the vegetations on the valve, and what do they contain under the microscope?"
    focus: [gross, micro]
    level: 1
  - it: "Perché una valvola viene colonizzata dai batteri? Mi descriva i passaggi."
    en: "Why does a valve become colonized by bacteria? Walk me through the steps."
    focus: [pathogenesis, high-yield]
    level: 2
  - it: "Mi parli delle complicanze emboliche e di quelle immunomediate dell'endocardite infettiva."
    en: "Tell me about the embolic and the immune-mediated complications of infective endocarditis."
    focus: [clinical, high-yield]
    level: 2
  - it: "Come distingue l'endocardite infettiva dall'endocardite trombotica non batterica?"
    en: "How do you tell infective endocarditis from nonbacterial thrombotic endocarditis?"
    focus: [differential, traps]
