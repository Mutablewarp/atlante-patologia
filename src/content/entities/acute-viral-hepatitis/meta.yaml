    focus: [etiology, clinical]
    level: 1
  - it: "Che cosa vede al microscopio in un'epatite virale acuta?"
    en: "What do you see under the microscope in acute viral hepatitis?"
    focus: [micro]
    level: 1
  - it: "Come distingue la necrosi a ponte dalla necrosi submassiva e da quella massiva?"
    en: "How do you tell bridging necrosis from submassive and massive necrosis?"
    focus: [micro, high-yield]
    level: 3
  - it: "Mi parli dell'epatite fulminante: quando si parla di epatite fulminante e come può finire?"
    en: "Tell me about fulminant hepatitis: when is the term used, and how can it end?"
    focus: [prognosis, micro]
    level: 2
  - it: "Perché nell'epatite B il danno agli epatociti non è causato direttamente dal virus?"
    en: "Why is hepatocyte injury in hepatitis B not caused directly by the virus?"
    focus: [pathogenesis]
    level: 2
  - it: "Come distingue un paziente guarito e immune dall'epatite B da uno che ha solo avuto l'infezione in passato?"
    en: "How do you tell a patient who has recovered from hepatitis B and is immune from one who has only had the infection in the past?"
    focus: [diagnosis, traps]
    level: 3
