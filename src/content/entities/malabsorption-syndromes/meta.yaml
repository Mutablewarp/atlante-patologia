learningObjectives:
  - it: "Distinguere i difetti della fase luminale da quelli della fase intestinale che causano malassorbimento."
    en: "Distinguish the defects of the luminal phase from those of the intestinal phase that cause malabsorption."
  - it: "Descrivere il quadro istologico della biopsia duodenale nella celiachia, nella sprue tropicale e nell'enteropatia autoimmune."
    en: "Describe the biopsy picture of celiac disease, tropical sprue and autoimmune enteropathy."
  - it: "Riconoscere la malattia di Whipple dai macrofagi schiumosi PAS-positivi."
    en: "Recognize Whipple disease from PAS-positive foamy macrophages."
  - it: "Scegliere il test appropriato: grassi fecali, D-xilosio, breath test, sierologia."
    en: "Choose the appropriate test: fecal fat, D-xylose, breath test, serology."
