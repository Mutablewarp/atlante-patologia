    note:
      it: "La celiachia è una causa mucosale di malassorbimento."
      en: "Celiac disease is a mucosal cause of malabsorption."
quickCheck:
  - id: malabsorption-syndromes-q1
    q:
      it: "In quali due fasi può fallire l'assorbimento?"
      en: "In which two phases can absorption fail?"
    a:
      it: "Nella fase luminale, cioè nel lume, e nella fase intestinale, cioè nelle cellule della mucosa."
      en: "In the luminal phase, inside the lumen, and in the intestinal phase, inside the mucosal cells."
    kind: short
  - id: malabsorption-syndromes-q2
    q:
      it: "Quale reperto istologico e quale colorazione indicano la malattia di Whipple?"
      en: "Which histologic finding and which stain point to Whipple disease?"
    a:
      it: "Macrofagi schiumosi nei villi, fortemente PAS-positivi."
      en: "Foamy macrophages in the villi, strongly PAS positive."
    kind: short
  - id: malabsorption-syndromes-q3
    q:
      it: "Perché la dieta senza glutine non aiuta nell'enteropatia autoimmune?"
      en: "Why does a gluten-free diet not help in autoimmune enteropathy?"
    a:
      it: "Il danno è immunomediato contro l'epitelio, non innescato dal glutine: servono immunosoppressori."
      en: "The injury is immune-mediated against the epithelium, not triggered by gluten: immunosuppressants are needed."
    kind: short
selfExplain:
  - it: "Perché la malattia di Whipple causa malassorbimento pur colpendo macrofagi e non gli enterociti?"
    en: "Why does Whipple disease cause malabsorption although it affects macrophages rather than enterocytes?"
  - it: "Perché la mancanza di disaccaridasi del bordo a spazzola lascia gli zuccheri della dieta non assorbiti?"
    en: "Why does a lack of brush-border disaccharidases leave dietary sugars unabsorbed?"
