summary:
  it: "Gruppo di condizioni in cui l'intestino assorbe in modo inadeguato nutrienti importanti, per difetti della fase luminale o della fase intestinale."
  en: "A group of conditions in which the gut absorbs important nutrients inadequately, through defects of the luminal phase or the intestinal phase."
