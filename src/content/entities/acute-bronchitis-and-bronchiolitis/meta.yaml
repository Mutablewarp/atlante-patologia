learningObjectives:
  - it: "Elencare gli agenti infettivi e gli irritanti inalati che causano bronchite e bronchiolite acute."
    en: "List the infectious agents and inhaled irritants that cause acute bronchitis and bronchiolitis."
  - it: "Descrivere il quadro morfologico delle bronchioliti da adenovirus e da virus respiratorio sinciziale."
    en: "Describe the morphology of adenovirus and respiratory syncytial virus bronchiolitis."
  - it: "Spiegare come una bronchiolite acuta può esitare in cicatrice, obliterazione bronchiolare e bronchiectasie."
    en: "Explain how acute bronchiolitis can end in scarring, bronchiolar obliteration and bronchiectasis."
  - it: "Riconoscere la bronchiolite costrittiva e distinguerla dalla granulomatosi broncocentrica."
    en: "Recognize constrictive bronchiolitis and distinguish it from bronchocentric granulomatosis."
prerequisites: [acute-inflammation]
relations:
  - type: causes
    target: bronchiectasis
    note:
      it: "Morbillo, pertosse e gas irritanti possono lasciare come esito bronchiectasie."
      en: "Measles, pertussis and irritant gases can leave bronchiectasis as a sequela."
  - type: differentialOf
    target: chronic-bronchitis
    note:
      it: "Le infezioni acute delle vie aeree possono causare riacutizzazioni della bronchite cronica."
      en: "Acute airway infections can flare chronic bronchitis."
  - type: differentialOf
    target: bacterial-pneumonia
    note:
      it: "Infezione delle vie aeree contro infezione del parenchima polmonare."
      en: "Airway infection versus infection of the lung parenchyma."
quickCheck:
  - id: acute-bronchitis-and-bronchiolitis-q1
    q:
      it: "Quali tre virus sono gli esempi classici di agenti di bronchiolite?"
      en: "Which three viruses are the classic examples of bronchiolitis agents?"
    a:
      it: "Adenovirus, virus respiratorio sinciziale e morbillo."
      en: "Adenovirus, respiratory syncytial virus and measles."
    kind: short
  - id: acute-bronchitis-and-bronchiolitis-q2
    q:
      it: "Perché la bronchiolite da adenovirus può lasciare un esito grave?"
      en: "Why can adenovirus bronchiolitis leave a serious sequela?"
    a:
      it: "Guarisce per fibrosi: i bronchioli possono restare occlusi o obliterati da tessuto fibroso lasso (bronchiolite costrittiva)."
      en: "It heals by fibrosis, so bronchioles may stay occluded or obliterated by loose fibrous tissue (constrictive bronchiolitis)."
    kind: short
  - id: acute-bronchitis-and-bronchiolitis-q3
    q:
      it: "Una radiografia o una TC normali escludono una bronchiolite costrittiva?"
      en: "Does a normal chest radiograph or CT exclude constrictive bronchiolitis?"
    a:
      it: "No: possono essere normali, oppure mostrare iperinsufflazione per intrappolamento di aria a valle dei bronchioli obliterati."
      en: "No: they may be normal, or show overinflation from air trapping beyond the obliterated bronchioles."
    kind: short
