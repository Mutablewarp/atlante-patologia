summary:
  it: "Infiammazione acuta dei bronchi e dei bronchioli da infezioni (adenovirus, virus respiratorio sinciziale, morbillo, pertosse) o da gas irritanti, che può guarire oppure esitare in fibrosi e bronchiolite costrittiva."
  en: "Acute inflammation of the bronchi and bronchioles caused by infection (adenovirus, respiratory syncytial virus, measles, pertussis) or irritant gases, which may heal or end in fibrosis and constrictive bronchiolitis."
lenses:
  system: [respiratory]
