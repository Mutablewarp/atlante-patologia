relations:
  - type: complicationOf
    target: cirrhosis
    note:
      it: "La cirrosi è la causa più comune di ipertensione portale nei paesi occidentali."
      en: "Cirrhosis is the most common cause of portal hypertension in the Western world."
  - type: sharesMechanism
    target: thrombosis
    note:
      it: "La trombosi della vena porta o delle vene epatiche ostruisce il flusso."
      en: "Thrombosis of the portal or hepatic veins obstructs flow."
  - type: differentialOf
    target: pulmonary-hypertension
    note:
      it: "L'ipertensione portopolmonare è un'ipertensione polmonare in corso di ipertensione portale."
      en: "Portopulmonary hypertension is pulmonary hypertension in the setting of portal hypertension."
quickCheck:
  - id: portal-hypertension-q1
    q:
      it: "In quali tre sedi può trovarsi l'ostacolo al flusso portale e in quale di esse il gradiente pressorio epatico è di solito normale?"
      en: "In which three places can the obstruction to portal flow lie, and in which is the hepatic venous pressure gradient usually normal?"
    a:
      it: "Prima dei sinusoidi, nei sinusoidi o dopo di essi; il gradiente è di solito normale nel blocco post-sinusoidale."
      en: "Before the sinusoids, in them or after them; the gradient is usually normal in postsinusoidal block."
    kind: short
  - id: portal-hypertension-q2
    q:
      it: "Perché l'ascite compare nell'ipertensione portale?"
      en: "Why does ascites appear in portal hypertension?"
    a:
      it: "La vasodilatazione riduce il volume arterioso efficace; i reni trattengono sodio e acqua, la pressione sinusoidale è alta e l'albumina è bassa."
      en: "Vasodilation lowers effective arterial volume; the kidneys retain sodium and water, sinusoidal pressure is high and albumin is low."
    kind: short
  - id: portal-hypertension-q3
    q:
      it: "Quale reperto nel liquido ascitico stabilisce la diagnosi di peritonite batterica spontanea?"
      en: "Which finding in ascitic fluid establishes spontaneous bacterial peritonitis?"
    a:
      it: "Più di 250 neutrofili per microlitro."
      en: "More than 250 neutrophils per microliter."
    kind: short
  - id: portal-hypertension-q4
    q:
      it: "Qual è la complicanza più importante dell'ipertensione portale e che cosa può provocare?"
      en: "What is the most important complication of portal hypertension, and what can it cause?"
    a:
      it: "Le varici esofagee, che sanguinano nel tratto gastrointestinale superiore, a volte in modo massivo."
      en: "Esophageal varices, which bleed into the upper gastrointestinal tract, sometimes massively."
    kind: short
