summary:
  it: "Aumento della pressione nel circolo portale per un ostacolo al flusso, pre-sinusoidale, sinusoidale o post-sinusoidale, con varici, ascite, splenomegalia e complicanze renali e polmonari."
  en: "Raised pressure in the portal circuit from an obstruction to flow, presinusoidal, sinusoidal or postsinusoidal, with varices, ascites, splenomegaly and kidney and lung complications."
