  group: [vascular]
learningObjectives:
  - it: "Classificare l'ipertensione portale in pre-sinusoidale, sinusoidale e post-sinusoidale, con una causa per ciascun tipo."
    en: "Classify portal hypertension as presinusoidal, sinusoidal or postsinusoidal, with one cause for each."
  - it: "Spiegare perché in cirrosi la pressione portale sale e come nascono ascite, sindrome epatorenale ed epatopolmonare."
    en: "Explain why portal pressure rises in cirrhosis and how ascites, hepatorenal and hepatopulmonary syndromes arise."
  - it: "Descrivere varici, splenomegalia e peritonite batterica spontanea con i criteri diagnostici principali."
    en: "Describe varices, splenomegaly and spontaneous bacterial peritonitis with the main diagnostic criteria."
  - it: "Riconoscere il quadro macroscopico e microscopico della sindrome di Budd-Chiari."
    en: "Recognize the gross and microscopic picture of Budd–Chiari syndrome."
