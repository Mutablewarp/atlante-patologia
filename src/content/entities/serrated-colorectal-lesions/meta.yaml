quickCheck:
  - id: serrated-colorectal-lesions-q1
    q:
      it: "Quali tre tipi di polipo serrato si distinguono?"
      en: "Which three types of serrated polyp are distinguished?"
    a:
      it: "Polipo iperplastico, adenoma serrato sessile e adenoma serrato tradizionale."
      en: "Hyperplastic polyp, sessile serrated adenoma and traditional serrated adenoma."
    kind: short
  - id: serrated-colorectal-lesions-q2
    q:
      it: "Quali alterazioni molecolari caratterizzano l'adenoma serrato sessile?"
      en: "Which molecular changes characterize the sessile serrated adenoma?"
    a:
      it: "Ipermetilazione del promotore di MLH1, mutazioni di BRAF e instabilità dei microsatelliti."
      en: "MLH1 promoter hypermethylation, BRAF mutations and microsatellite instability."
    kind: short
  - id: serrated-colorectal-lesions-q3
    q:
      it: "Quale reperto istologico distingue l'adenoma serrato sessile dal polipo iperplastico?"
      en: "Which histologic finding separates a sessile serrated adenoma from a hyperplastic polyp?"
    a:
      it: "La seghettatura arriva fino alla base delle cripte, con basi dilatate e cripte a stivale, a L o a T rovesciata."
      en: "Serration reaches the crypt bases, with dilated bases and boot-, L- or inverted T-shaped crypts."
    kind: free
  - id: serrated-colorectal-lesions-q4
    q:
      it: "In quale parte del colon sorge tipicamente l'adenoma serrato sessile?"
      en: "Where in the colon does the sessile serrated adenoma typically arise?"
    a:
      it: "Nel colon destro."
      en: "In the right colon."
    kind: short
selfExplain:
  - it: "Perché l'adenoma serrato sessile va asportato completamente, a differenza del polipo iperplastico?"
    en: "Why is the sessile serrated adenoma removed entirely, unlike the hyperplastic polyp?"
  - it: "Perché la seghettatura raggiunge la base delle cripte nell'adenoma serrato sessile?"
    en: "Why does the serration reach the crypt base in the sessile serrated adenoma?"
examQuestions:
  - it: "Mi parli dei polipi serrati del colon-retto: quali tipi conosce e quali sono premaligni?"
    en: "Tell me about serrated colorectal polyps: which types do you know, and which are premalignant?"
    focus: [definition, prognosis]
    level: 1
  - it: "Che cosa vede al microscopio in un adenoma serrato sessile e come lo distingue da un polipo iperplastico?"
    en: "What do you see under the microscope in a sessile serrated adenoma, and how do you tell it from a hyperplastic polyp?"
    focus: [micro, differential]
    level: 3
  - it: "Perché l'adenoma serrato sessile è considerato un precursore del carcinoma colorettale? Quali alterazioni molecolari ha?"
    en: "Why is the sessile serrated adenoma considered a precursor of colorectal carcinoma, and which molecular changes does it show?"
    focus: [pathogenesis, prognosis]
    level: 2
