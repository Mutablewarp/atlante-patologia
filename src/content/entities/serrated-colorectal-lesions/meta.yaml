summary:
  it: "Gruppo di polipi colorettali con cripte a dente di sega: il polipo iperplastico è benigno, mentre l'adenoma serrato sessile e quello tradizionale sono lesioni precancerose."
  en: "A group of colorectal polyps with saw-toothed crypts: the hyperplastic polyp is benign, whereas the sessile and traditional serrated adenomas are premalignant."
learningObjectives:
  - it: "Distinguere polipo iperplastico, adenoma serrato sessile e adenoma serrato tradizionale."
    en: "Distinguish hyperplastic polyp, sessile serrated adenoma and traditional serrated adenoma."
  - it: "Descrivere la via serrata (BRAF, CIMP, instabilità dei microsatelliti)."
    en: "Describe the serrated pathway (BRAF, CIMP, microsatellite instability)."
  - it: "Riconoscere le cripte a stivale, a L e a T rovesciata dell'adenoma serrato sessile."
    en: "Recognize the boot-, L- and inverted T-shaped crypts of the sessile serrated adenoma."
  - it: "Spiegare perché le lesioni serrate premaligne vanno asportate completamente."
    en: "Explain why premalignant serrated lesions are removed entirely."
