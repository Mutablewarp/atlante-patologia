relations:
  - type: differentialOf
    target: colorectal-adenoma
    note:
      it: "Entrambi sono polipi precancerosi, ma l'adenoma convenzionale è displastico per definizione."
      en: "Both are premalignant polyps, but the conventional adenoma is dysplastic by definition."
  - type: causes
    target: colorectal-adenocarcinoma
    note:
