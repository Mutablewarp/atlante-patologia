  - it: "Mi parli della vasculite da ipersensibilità: quali vasi colpisce e perché la si considera una reazione a materiale estraneo?"
    en: "Tell me about hypersensitivity vasculitis: which vessels does it involve, and why is it regarded as a reaction to outside material?"
    focus: [definition, etiology, pathogenesis]
    level: 1
  - it: "Che cosa vede al microscopio in una biopsia cutanea di vasculite leucocitoclastica, e in quali vasi?"
    en: "What do you see under the microscope in a skin biopsy of leukocytoclastic vasculitis, and in which vessels?"
    focus: [micro, diagnosis]
    level: 2
  - it: "Quali organi può coinvolgere la porpora di Schönlein-Henoch e come la distingue dalla poliangioite microscopica?"
    en: "Which organs can Henoch–Schönlein purpura involve, and how do you tell it from microscopic polyangiitis?"
    focus: [clinical, prognosis, differential]
    level: 3
