  - it: "Perché l'infiammazione transmurale porta a fissurazioni e fistole, e dove possono aprirsi le fistole?"
    en: "Why does transmural inflammation lead to fissures and fistulas, and where can the fistulas open?"
    focus: [pathogenesis, gross]
