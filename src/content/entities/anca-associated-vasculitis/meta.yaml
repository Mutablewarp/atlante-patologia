editionNote:
  it: "La nomenclatura è cambiata (granulomatosi di Wegener diventata GPA, sindrome di Churg-Strauss diventata EGPA), e terapia e dati di sopravvivenza del testo di riferimento possono essere superati."
  en: "The nomenclature changed (Wegener granulomatosis became GPA, Churg-Strauss syndrome became EGPA), and the treatment and survival figures of the reference text may be out of date."
