  - it: "Come distingue una neoplasia benigna da una maligna in base a differenziazione, architettura, invasione e metastasi?"
    en: "How do you tell a benign from a malignant tumor using differentiation, architecture, invasion and metastasis?"
    focus: [definition, micro]
    level: 3
  - it: "Perché una neoplasia benigna può essere letale e una maligna indolente?"
    en: "Why can a benign tumor be lethal and a malignant one indolent?"
    focus: [clinical, traps]
    level: 2
  - it: "Mi parli della velocità di crescita: come si esprime e perché la conta delle mitosi non basta?"
    en: "Tell me about growth rate: how is it expressed, and why is the mitotic count not enough?"
    focus: [prognosis, traps]
    level: 2
  - it: "Come distingue un carcinoma in situ da un carcinoma invasivo?"
    en: "How do you tell carcinoma in situ from invasive carcinoma?"
    focus: [pathogenesis, differential, prognosis]
