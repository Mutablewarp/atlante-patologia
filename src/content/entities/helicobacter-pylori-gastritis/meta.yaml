summary:
  it: "Gastrite cronica causata da Helicobacter pylori, che vive sulla superficie delle cellule foveolari, di solito con predominanza antrale; è la principale causa di ulcera peptica e un fattore di rischio per adenocarcinoma gastrico e linfoma MALT."
  en: "Chronic gastritis caused by Helicobacter pylori, which lives on the surface of foveolar cells, usually antral-predominant; the main cause of peptic ulcer and a risk factor for gastric adenocarcinoma and MALT lymphoma."
