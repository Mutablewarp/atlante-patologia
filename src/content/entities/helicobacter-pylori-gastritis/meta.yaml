learningObjectives:
  - it: "Descrivere la gastrite cronica attiva da Helicobacter pylori a predominanza antrale e il suo quadro istologico."
    en: "Describe antral-predominant chronic active gastritis from Helicobacter pylori and its histology."
  - it: "Spiegare come ureasi, vacA e cagA permettono al batterio di sopravvivere e di danneggiare la mucosa senza invaderla."
    en: "Explain how urease, vacA and cagA let the bacterium survive and damage the mucosa without invading it."
  - it: "Indicare come si mettono in evidenza i batteri in biopsia: ematossilina-eosina, argento di Warthin-Starry, immunocolorazione."
    en: "State how the organisms are shown on biopsy: H&E, Warthin-Starry silver stain, immunostaining."
  - it: "Collegare l'infezione ad atrofia multifocale con metaplasia intestinale, ulcera, adenocarcinoma e linfoma MALT."
    en: "Link the infection to multifocal atrophy with intestinal metaplasia, ulcer, adenocarcinoma and MALT lymphoma."
prerequisites: [chronic-inflammation]
relations:
  - type: causes
    target: peptic-ulcer-disease
    note:
      it: "La gastrite cronica da Helicobacter è la causa più comune di ulcera peptica."
      en: "Chronic Helicobacter gastritis is the most common cause of peptic ulcer disease."
  - type: causes
    target: gastric-adenocarcinoma
    note:
      it: "Sequenza: infiammazione, metaplasia intestinale, displasia, adenocarcinoma."
      en: "Sequence: inflammation, intestinal metaplasia, dysplasia, adenocarcinoma."
  - type: causes
    target: gastric-malt-lymphoma
    note:
      it: "L'infezione espone al linfoma gastrico del tessuto linfoide associato alle mucose."
      en: "The infection predisposes to gastric lymphoma of mucosa-associated lymphoid tissue."
  - type: differentialOf
    target: autoimmune-gastritis
    note:
      it: "Autoimmune: limitata a corpo e fondo, anticorpi anti-cellule parietali e anti-fattore intrinseco."
      en: "Autoimmune: limited to body and fundus, anti-parietal cell and anti-intrinsic factor antibodies."
  - type: differentialOf
    target: acute-gastritis-and-reactive-gastropathy
    note:
      it: "Gli neutrofili nella gastrite da Helicobacter non indicano gastrite acuta."
      en: "Neutrophils in Helicobacter gastritis do not mean acute gastritis."
quickCheck:
  - id: helicobacter-pylori-gastritis-q1
    q:
      it: "Come fa Helicobacter pylori a sopravvivere nell'ambiente acido dello stomaco?"
      en: "How does Helicobacter pylori survive in the acidic stomach?"
    a:
      it: "Produce ureasi, che trasforma l'urea in ammoniaca; l'ammoniaca, base, neutralizza l'acido."
      en: "It makes urease, which turns urea into ammonia; ammonia, a base, neutralizes the acid."
    kind: short
  - id: helicobacter-pylori-gastritis-q2
    q:
      it: "Quale colorazione speciale si usa più spesso per vedere i batteri e che cosa evidenzia?"
      en: "Which special stain is used most often to see the bacteria, and what does it show?"
    a:
      it: "L'impregnazione argentica, come Warthin-Starry: evidenzia piccoli bacilli curvilinei sulla superficie delle cellule foveolari."
      en: "Silver impregnation, such as Warthin-Starry: it highlights small curvilinear bacilli on the surface of foveolar cells."
    kind: short
  - id: helicobacter-pylori-gastritis-q3
    q:
      it: "Gli neutrofili in una gastrite da Helicobacter indicano una gastrite acuta?"
      en: "Do neutrophils in Helicobacter gastritis indicate acute gastritis?"
    a:
      it: "No: segnalano riacutizzazioni di una gastrite cronica sottostante e possono formare ascessi nelle fossette."
      en: "No: they mark flares of an underlying chronic gastritis and may form pit abscesses."
    kind: short
  - id: helicobacter-pylori-gastritis-q4
    q:
      it: "Con quali tre malattie è collegata l'infezione cronica da Helicobacter?"
      en: "Which three diseases is chronic Helicobacter infection linked to?"
    a:
      it: "Ulcera peptica, adenocarcinoma gastrico e linfoma MALT gastrico."
      en: "Peptic ulcer disease, gastric adenocarcinoma and gastric MALT lymphoma."
    kind: short
