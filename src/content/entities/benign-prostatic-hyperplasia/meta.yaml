names:
  it: "Iperplasia prostatica benigna"
  en: "Benign prostatic hyperplasia"
  eponyms: []
  synonyms:
    it: ["Iperplasia nodulare della prostata"]
    en: ["Nodular prostatic hyperplasia", "Nodular hyperplasia of the prostate"]
  abbreviations: ["BPH", "IPB"]
summary:
  it: "Proliferazione nodulare benigna di ghiandole e stroma nella zona di transizione periuretrale della prostata, guidata dagli androgeni, che comprime l'uretra e ostruisce il deflusso dell'urina."
  en: "Benign nodular proliferation of glands and stroma in the periurethral transitional zone of the prostate, driven by androgens, that compresses the urethra and obstructs urine outflow."
