summary:
  it: Le aritmie letali nascono quando un substrato strutturale fisso, come una cicatrice o un'ipertrofia fibrotica, incontra un fattore scatenante transitorio, mentre alcune canalopatie colpiscono cuori strutturalmente normali.
  en: Lethal arrhythmias arise when a fixed structural substrate, such as a scar or fibrotic hypertrophy, meets a transient trigger, while some channelopathies strike structurally normal hearts.
learningObjectives:
  - it: Distinguere substrato e fattore scatenante nella genesi delle aritmie letali.
    en: Distinguish substrate from trigger in the genesis of lethal arrhythmias.
  - it: Descrivere il sistema di conduzione e le vie accessorie.
    en: Describe the conduction system and accessory pathways.
  - it: Elencare le cause principali di morte improvvisa per fascia di età.
    en: List the main causes of sudden death by age group.
  - it: Riconoscere le canalopatie come causa di morte improvvisa in cuori normali.
    en: Recognize channelopathies as a cause of sudden death in normal hearts.
