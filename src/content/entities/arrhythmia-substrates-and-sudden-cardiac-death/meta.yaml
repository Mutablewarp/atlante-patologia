quickCheck:
  - id: arrhythmia-substrates-and-sudden-cardiac-death-q1
    q:
      it: Perché un substrato da solo spesso non basta a causare un'aritmia letale?
      en: Why is a substrate alone often not enough to cause a lethal arrhythmia?
    a:
      it: Serve di solito anche un fattore scatenante transitorio, come l'ischemia acuta.
      en: A transient trigger, such as acute ischemia, is usually needed as well.
    kind: short
  - id: arrhythmia-substrates-and-sudden-cardiac-death-q2
    q:
      it: Qual è l'accoppiata più frequente di substrato e fattore scatenante?
      en: What is the most common pairing of substrate and trigger?
    a:
      it: Ischemia acuta in un'area con un infarto guarito.
      en: Acute ischemia in an area with a healed infarct.
    kind: short
  - id: arrhythmia-substrates-and-sudden-cardiac-death-q3
    q:
      it: Un cuore normale all'autopsia esclude una morte aritmica?
      en: Does a normal heart at autopsy exclude an arrhythmic death?
    a:
      it: No, le canalopatie possono uccidere senza lesioni strutturali.
      en: No, channelopathies can kill without a structural lesion.
    kind: short
selfExplain:
  - it: Perché la morte improvvisa si verifica più spesso quando un'ischemia acuta colpisce un cuore con un infarto guarito?
    en: Why does sudden death most often occur when acute ischemia strikes a heart with a healed infarct?
  - it: Perché la diagnosi di morte aritmica non si esclude se il cuore appare normale?
    en: Why is an arrhythmic death not ruled out when the heart looks normal?
