  - it: "Quali colorazioni userebbe per confermare un GIST, e che cosa riconosce l'anticorpo anti-CD117?"
    en: "Which stains would you use to confirm a GIST, and what does the anti-CD117 antibody recognize?"
    focus: [ancillary]
