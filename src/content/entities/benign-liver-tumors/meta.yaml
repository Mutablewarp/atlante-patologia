    en: "Tell me about hepatocellular adenoma: subtypes, gross appearance and risks."
    focus: [etiology, gross, micro]
    level: 1
  - it: "Come distingue l'iperplasia nodulare focale dall'adenoma epatocellulare e dalla cirrosi?"
    en: "How do you tell focal nodular hyperplasia from hepatocellular adenoma and from cirrhosis?"
    focus: [gross, micro, differential]
    level: 3
  - it: "Perché l'iperplasia nodulare focale non è una neoplasia, e perché l'adenoma beta-catenina attivato richiede più attenzione?"
    en: "Why is focal nodular hyperplasia not a neoplasm, and why does the beta-catenin-activated adenoma need more attention?"
    focus: [pathogenesis, prognosis]
    level: 2
