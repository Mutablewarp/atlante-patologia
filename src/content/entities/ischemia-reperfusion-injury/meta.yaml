id: ischemia-reperfusion-injury
module: g01
tier: core
kind: process
names:
  it: "Danno da ischemia-riperfusione"
  en: "Ischemia–reperfusion injury"
  eponyms: []
  synonyms:
    it: ["Danno da riperfusione", "Lesione da ischemia-riperfusione"]
    en: ["Reperfusion injury", "Ischemia/reperfusion injury"]
  abbreviations: ["I/R", "IRI"]
summary:
  it: "Danno aggiuntivo che si verifica quando il flusso ematico ritorna in un tessuto ischemico, sostenuto da un'esplosione di specie reattive dell'ossigeno, dal sovraccarico di calcio, dall'apertura del poro di transizione di permeabilità mitocondriale e dall'infiammazione."
  en: "Additional damage caused when blood flow returns to ischemic tissue, driven by a burst of reactive oxygen species, calcium overload, opening of the mitochondrial permeability transition pore and inflammation."
lenses:
  system: [general, heart]
  process: [cell-injury, hypoxic-ischemic-injury, oxidative-injury, irreversible-injury]
  pattern: [necrosis-coagulative]   # no term for contraction band necrosis; closest existing term
  presentation: [ischemic-event]
  marker: []
  group: [vascular]
learningObjectives:
  - it: "Spiegare perché il ritorno dell'ossigeno, pur salvando le cellule con danno reversibile, può ucciderne altre."
    en: "Explain why the return of oxygen, while rescuing reversibly injured cells, can kill others."
  - it: "Descrivere le tre fonti di specie reattive dell'ossigeno durante la riperfusione: xantina ossidasi, mitocondri e neutrofili."
    en: "Describe the three sources of reactive oxygen species during reperfusion: xanthine oxidase, mitochondria and neutrophils."
  - it: "Collegare il sovraccarico di calcio e l'apertura del poro di transizione di permeabilità mitocondriale alla morte cellulare."
    en: "Link calcium overload and opening of the mitochondrial permeability transition pore to cell death."
  - it: "Riconoscere l'infarto riperfuso: aspetto emorragico e necrosi a bande di contrazione."
    en: "Recognize the reperfused infarct: hemorrhagic appearance and contraction band necrosis."
  - it: "Spiegare il precondizionamento ischemico e i tre possibili esiti della riperfusione a seconda della durata dell'ischemia."
    en: "Explain ischemic preconditioning and the three possible outcomes of reperfusion depending on how long ischemia lasted."
prerequisites: [hypoxic-ischemic-injury]
relations:
  - type: sharesMechanism
    target: oxidative-injury
    note:
      it: "Le specie reattive dell'ossigeno sono il principale motore del danno da riperfusione."
      en: "Reactive oxygen species are the main driver of reperfusion injury."
  - type: sharesMechanism
    target: apoptosis
    note:
      it: "L'apertura del poro mitocondriale libera il citocromo c, che può innescare la via intrinseca dell'apoptosi."
      en: "Opening of the mitochondrial pore releases cytochrome c, which can trigger intrinsic apoptosis."
  - type: complicationOf
    target: myocardial-infarction
    note:
      it: "Si verifica quando un infarto in evoluzione viene riperfuso, spontaneamente oppure con trombolisi o angioplastica coronarica."
      en: "Occurs when an evolving infarct is reperfused, spontaneously or by thrombolysis or coronary intervention."
quickCheck:
  - id: ischemia-reperfusion-injury-q1
    q:
      it: "Quali sono le tre fonti principali di specie reattive dell'ossigeno durante la riperfusione?"
      en: "What are the three main sources of reactive oxygen species during reperfusion?"
    a:
      it: "La xantina ossidasi (soprattutto endoteliale), i mitocondri e i neutrofili reclutati."
      en: "Xanthine oxidase (mainly endothelial), mitochondria and recruited neutrophils."
    kind: short
  - id: ischemia-reperfusion-injury-q2
    q:
      it: "Perché la xantina ossidasi produce superossido proprio al momento della riperfusione?"
      en: "Why does xanthine oxidase produce superoxide precisely at reperfusion?"
    a:
      it: "Durante l'ischemia si accumulano xantina e altre purine derivate dall'ATP, ma l'enzima richiede ossigeno: quando l'ossigeno ritorna, converte il substrato in acido urico generando superossido."
      en: "During ischemia xanthine and other ATP-derived purines accumulate, but the enzyme needs oxygen: when oxygen returns it converts the substrate to uric acid and generates superoxide."
    kind: free
  - id: ischemia-reperfusion-injury-q3
    q:
      it: "Quale reperto istologico è caratteristico dell'infarto miocardico acuto riperfuso?"
      en: "Which histologic finding is characteristic of a reperfused acute myocardial infarct?"
    a:
      it: "La necrosi a bande di contrazione: bande eosinofile trasversali di sarcomeri ipercontratti, dovute all'ingresso massivo di calcio."
      en: "Contraction band necrosis: transverse eosinophilic bands of hypercontracted sarcomeres caused by massive calcium influx."
    kind: short
  - id: ischemia-reperfusion-injury-q4
    q:
      it: "Che cosa succede alla cellula quando il poro di transizione di permeabilità mitocondriale resta aperto?"
      en: "What happens to the cell when the mitochondrial permeability transition pore stays open?"
    a:
      it: "Il potenziale di membrana mitocondriale crolla, il mitocondrio si rigonfia, la sintesi di ATP crolla e il citocromo c passa nel citosol, dove può attivare l'apoptosi."
      en: "The mitochondrial membrane potential collapses, the mitochondrion swells, ATP synthesis falls sharply and cytochrome c enters the cytosol, where it can activate apoptosis."
    kind: free
selfExplain:
  - it: "Perché la rapida correzione del pH intracellulare alla riperfusione peggiora il sovraccarico di calcio?"
    en: "Why does rapid correction of intracellular pH at reperfusion worsen calcium overload?"
  - it: "Perché l'ossido nitrico è protettivo in condizioni normali ma dannoso durante la riperfusione?"
    en: "Why is nitric oxide protective in normal conditions but harmful during reperfusion?"
  - it: "Perché la durata dell'ischemia stabilisce se la riperfusione salva le cellule, le danneggia o è ormai irrilevante?"
    en: "Why does the duration of ischemia decide whether reperfusion heals, harms or no longer matters?"
chain:
  - pathology:
      it: "Infarto miocardico riperfuso, emorragico, con necrosi a bande di contrazione"
      en: "Reperfused myocardial infarct, hemorrhagic, with contraction band necrosis"
    sign:
      it: "Occlusione coronarica acuta trattata con trombolisi o angioplastica coronarica"
      en: "Acute coronary occlusion treated by thrombolysis or coronary intervention"
    lab:
      it: "Aumento della troponina cardiaca (necrosi miocardica)"
      en: "Raised cardiac troponin (myocardial necrosis)"
examQuestions:
  - it: "Mi parli del danno da ischemia-riperfusione: che cos'è e in quali situazioni cliniche si verifica?"
    en: "Tell me about ischemia–reperfusion injury: what is it, and in which clinical settings does it occur?"
    focus: [definition, etiology]
    level: 1
  - it: "Che cosa vede, a occhio nudo e al microscopio, in un infarto miocardico riperfuso, e con quali tecniche lo studierebbe?"
    en: "What do you see, with the naked eye and under the microscope, in a reperfused myocardial infarct, and which techniques would you use to study it?"
    focus: [gross, micro, ancillary]
    level: 1
  - it: "Perché il ritorno dell'ossigeno può uccidere cellule che erano ancora vive? Mi descriva i meccanismi, partendo dalle fonti di specie reattive dell'ossigeno."
    en: "Why can the return of oxygen kill cells that were still alive? Describe the mechanisms, starting from the sources of reactive oxygen species."
    focus: [pathogenesis, high-yield]
    level: 2
  - it: "Che ruolo ha il calcio nel danno da riperfusione? Mi spieghi il legame con il poro di transizione di permeabilità mitocondriale e con le bande di contrazione."
    en: "What role does calcium play in reperfusion injury? Explain how it links to the mitochondrial permeability transition pore and to contraction bands."
    focus: [pathogenesis, micro, ancillary]
    level: 2
  - it: "Come distingue un infarto miocardico riperfuso da uno dovuto a un'occlusione persistente? E le bande di contrazione bastano a dimostrare che c'è stata riperfusione?"
    en: "How do you tell a reperfused myocardial infarct from one caused by persistent occlusion? And are contraction bands enough to prove that reperfusion took place?"
    focus: [gross, differential, traps]
    level: 3
  - it: "Un paziente con infarto acuto viene trattato con trombolisi o con angioplastica coronarica: da che cosa dipende l'effetto della riperfusione sul suo miocardio? Che cosa sono il miocardio stordito e il precondizionamento ischemico?"
    en: "A patient with acute infarction is treated with thrombolysis or coronary intervention: what decides the effect of reperfusion on the myocardium? What are stunned myocardium and ischemic preconditioning?"
    focus: [prognosis, clinical]
    level: 3
