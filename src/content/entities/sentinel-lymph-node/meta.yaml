quickCheck:
  - id: sentinel-lymph-node-q1
    q:
      it: "Che cos'è il linfonodo sentinella?"
      en: "What is the sentinel lymph node?"
    a:
      it: "Il primo linfonodo della via di drenaggio regionale del tumore, quello con maggiore probabilità di contenere metastasi."
      en: "The first node on the tumor's regional drainage path, the one most likely to contain metastases."
    kind: short
  - id: sentinel-lymph-node-q2
    q:
      it: "Perché un linfonodo sentinella mammario negativo è utile al chirurgo?"
      en: "Why is a negative breast sentinel node useful to the surgeon?"
    a:
      it: "Permette di evitare la dissezione ascellare e quindi linfedema e danno nervoso."
      en: "It lets the surgeon avoid axillary dissection and so lymphedema and nerve damage."
    kind: short
  - id: sentinel-lymph-node-q3
    q:
      it: "Perché una micrometastasi dormiente resiste alla terapia adiuvante?"
      en: "Why does a dormant micrometastasis resist adjuvant therapy?"
    a:
      it: "Perché la terapia agisce meglio sulle cellule che si dividono rapidamente, mentre la dormienza è un equilibrio tra bassa proliferazione e bassa morte cellulare."
      en: "Because the therapy works best on fast-dividing cells, while dormancy is a balance of low proliferation and low cell death."
    kind: short
  - id: sentinel-lymph-node-q4
    q:
      it: "Come si individua il linfonodo sentinella durante l'intervento?"
      en: "How does the surgeon find the sentinel node during the operation?"
    a:
      it: "Seguendo il flusso linfatico con un colorante iniettato e un isotopo radioattivo."
      en: "By tracing lymph flow with an injected dye plus a radioactive isotope."
    kind: short
