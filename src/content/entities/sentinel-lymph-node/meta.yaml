learningObjectives:
  - it: "Definire il linfonodo sentinella e spiegare perché se ne esegue la biopsia."
    en: "Define the sentinel node and explain why it is biopsied."
  - it: "Distinguere cellule tumorali isolate, micrometastasi e macrometastasi linfonodali."
    en: "Distinguish isolated tumor cells, micrometastases and macrometastases in a node."
  - it: "Descrivere la mappatura con colorante e isotopo radioattivo."
    en: "Describe mapping with dye and radioactive isotope."
  - it: "Spiegare come un linfonodo sentinella negativo o positivo cambia chirurgia e prognosi nel carcinoma mammario e nel melanoma."
    en: "Explain how a negative or positive sentinel node changes surgery and prognosis in breast cancer and melanoma."
  - it: "Spiegare perché le micrometastasi dormienti sfuggono alla terapia adiuvante."
    en: "Explain why dormant micrometastases escape adjuvant therapy."
