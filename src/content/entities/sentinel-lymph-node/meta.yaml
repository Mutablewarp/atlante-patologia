summary:
  it: "Il linfonodo sentinella è il primo linfonodo della via di drenaggio di un tumore e il più probabile sede di metastasi; la sua biopsia stadia i linfonodi regionali e può evitare dissezioni più estese."
  en: "The sentinel node is the first node on a tumor's drainage path and the most likely site of metastasis; its biopsy stages the regional nodes and can spare a wider dissection."
