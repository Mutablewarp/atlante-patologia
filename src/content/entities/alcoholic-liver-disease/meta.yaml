    level: 1
  - it: "Che cosa vede al microscopio in un'epatite alcolica?"
    en: "What do you see under the microscope in alcoholic hepatitis?"
    focus: [micro]
    level: 1
  - it: "Mi parli della cirrosi alcolica: come si arriva a questo quadro?"
    en: "Tell me about alcoholic cirrhosis: how does the liver get there?"
    focus: [definition, micro, prognosis]
    level: 2
  - it: "Perché nell'epatopatia alcolica l'astensione è la terapia migliore, e che cosa cambia per la prognosi?"
    en: "Why is abstinence the best treatment in alcoholic liver disease, and what does it change for prognosis?"
    focus: [pathogenesis, prognosis]
    level: 2
  - it: "Come distingue l'epatite alcolica da un'epatite virale acuta?"
    en: "How do you tell alcoholic hepatitis from acute viral hepatitis?"
