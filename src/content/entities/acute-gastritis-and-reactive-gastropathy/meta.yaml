tier: extended
kind: disease
names:
  it: "Gastrite acuta e gastropatia reattiva (chimica)"
  en: "Acute gastritis and reactive (chemical) gastropathy"
  eponyms: []
  synonyms:
    it: ["Gastropatia chimica", "Gastrite acuta emorragica", "Gastrite acuta erosiva"]
    en: ["Chemical gastropathy", "Acute hemorrhagic gastritis", "Acute erosive gastritis"]
  abbreviations: []
summary:
  it: "Danno acuto della mucosa gastrica, emorragico o erosivo, e risposta iperplastica della mucosa a sostanze irritanti, soprattutto FANS, con iperplasia delle cellule foveolari e poca infiammazione."
  en: "Acute, hemorrhagic or erosive injury of the gastric mucosa, and a hyperplastic mucosal response to irritants, mostly NSAIDs, with foveolar hyperplasia and little inflammation."
