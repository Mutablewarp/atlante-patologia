learningObjectives:
  - it: "Elencare i meccanismi di difesa della mucosa gastrica e gli agenti che li sopraffanno."
    en: "List the defenses of the gastric mucosa and the agents that overwhelm them."
  - it: "Descrivere l'aspetto macroscopico della gastrite acuta: erosioni superficiali, multiple, emorragiche."
    en: "Describe the gross appearance of acute gastritis: shallow, multiple, hemorrhagic erosions."
  - it: "Riconoscere l'iperplasia foveolare con fossette a cavatappi nella gastropatia reattiva."
    en: "Recognize foveolar hyperplasia with corkscrew pits in reactive gastropathy."
  - it: "Indicare le cause della gastropatia reattiva e il trattamento di scelta."
    en: "State the causes of reactive gastropathy and the treatment of choice."
prerequisites: []
relations:
  - type: differentialOf
    target: peptic-ulcer-disease
    note:
      it: "Entrambe possono dare ulcere gastriche; la gastrite acuta le dà superficiali e multiple."
      en: "Both can give gastric ulcers; acute gastritis gives shallow, multiple ones."
quickCheck:
  - id: acute-gastritis-and-reactive-gastropathy-q1
    q:
      it: "Perché i FANS possono danneggiare la mucosa gastrica?"
      en: "Why can NSAIDs damage the gastric mucosa?"
    a:
      it: "Inibiscono la sintesi delle prostaglandine, che aiutano a mantenere lo strato di muco."
      en: "They inhibit prostaglandin synthesis, and prostaglandins help maintain the mucus layer."
    kind: short
  - id: acute-gastritis-and-reactive-gastropathy-q2
    q:
      it: "Che cosa si vede al microscopio nella gastropatia reattiva?"
      en: "What is seen under the microscope in reactive gastropathy?"
    a:
      it: "Iperplasia foveolare con fossette irregolari a cavatappi, talvolta muscolatura liscia aumentata nella lamina propria, e poca infiammazione."
      en: "Foveolar hyperplasia with irregular corkscrew pits, sometimes more smooth muscle in the lamina propria, and little inflammation."
    kind: short
  - id: acute-gastritis-and-reactive-gastropathy-q3
    q:
      it: "Qual è il trattamento di scelta della gastropatia reattiva?"
      en: "What is the treatment of choice for reactive gastropathy?"
    a:
      it: "Sospendere l'agente responsabile."
      en: "Withdraw the offending agent."
    kind: short
  - id: acute-gastritis-and-reactive-gastropathy-q4
    q:
      it: "Com'è la gastrite acuta all'esame macroscopico?"
      en: "How does acute gastritis look grossly?"
    a:
      it: "Nella maggior parte dei casi è emorragica, con ulcere multiple e di solito superficiali."
      en: "It is hemorrhagic in most cases, with ulcers that are multiple and typically shallow."
    kind: short
selfExplain:
  - it: "Perché la gastropatia reattiva mostra poca infiammazione pur essendo una lesione della mucosa?"
    en: "Why does reactive gastropathy show little inflammation although it injures the mucosa?"
  - it: "Perché sospendere l'agente responsabile è il trattamento preferito della gastropatia reattiva?"
    en: "Why is stopping the offending agent the preferred treatment of reactive gastropathy?"
