names:
  it: "Esofagiti infettive, chimiche e iatrogene"
  en: "Infectious, chemical and iatrogenic esophagitis"
  eponyms: []
  synonyms:
    it: ["Esofagite da Candida", "Esofagite erpetica", "Esofagite da citomegalovirus", "Esofagite da caustici", "Esofagite da farmaci"]
    en: ["Candida esophagitis", "Herpetic esophagitis", "CMV esophagitis", "Caustic esophagitis", "Pill esophagitis"]
