summary:
  it: "Lesioni infiammatorie della mucosa esofagea causate da Candida, herpes simplex o citomegalovirus nei pazienti immunodepressi, da caustici e farmaci ingeriti, da malattie sistemiche o da trattamenti medici."
  en: "Inflammatory injury of the esophageal mucosa caused by Candida, herpes simplex or cytomegalovirus in immunosuppressed patients, by swallowed corrosives and pills, by systemic disease, or by medical treatment."
