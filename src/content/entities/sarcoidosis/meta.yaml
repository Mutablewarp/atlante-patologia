  marker: [laboratory]
  group: [inflammatory, immune]
learningObjectives:
  - it: "Descrivere il granuloma sarcoidotico non caseoso e la sua distribuzione nel polmone."
    en: "Describe the noncaseating sarcoid granuloma and its distribution in the lung."
  - it: "Elencare gli organi extrapolmonari colpiti, con il rischio di blocco e aritmie nel coinvolgimento cardiaco."
    en: "List the extrapulmonary organs involved, including the risk of heart block and arrhythmias in cardiac disease."
  - it: "Spiegare il ruolo dei linfociti T helper CD4+ nella formazione dei granulomi."
    en: "Explain the role of CD4+ helper T cells in granuloma formation."
  - it: "Spiegare perché la diagnosi richiede istologia, imaging e laboratorio insieme, e distinguere la sarcoidosi dalla polmonite da ipersensibilità."
    en: "Explain why the diagnosis needs histology, imaging and laboratory data together, and distinguish sarcoidosis from hypersensitivity pneumonitis."
