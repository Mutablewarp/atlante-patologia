relations:
  - type: differentialOf
    target: hypersensitivity-pneumonitis
    note:
      it: "Entrambe mostrano granulomi non caseosi; nella polmonite da ipersensibilità sono mal formati e si associano a polmonite cellulare bronchiolocentrica."
      en: "Both show noncaseating granulomas; in hypersensitivity pneumonitis they are poorly formed and accompany a bronchiolocentric cellular pneumonia."
  - type: sharesMechanism
    target: granulomatous-inflammation
    note:
      it: "Risposta T helper che recluta macrofagi e forma granulomi."
      en: "A helper T-cell response that recruits macrophages and forms granulomas."
  - type: sameLesionOtherOrgan
    target: myocarditis
    note:
      it: "La sarcoidosi cardiaca è una miocardite granulomatosa fortemente aritmogena."
      en: "Cardiac sarcoidosis is a highly arrhythmogenic granulomatous myocarditis."
quickCheck:
  - id: sarcoidosis-q1
    q:
      it: "Quali sono le due sedi più frequenti della sarcoidosi?"
      en: "Which are the two most frequent sites of sarcoidosis?"
    a:
      it: "Il polmone e i linfonodi ilari, che possono essere colpiti anche separatamente."
      en: "The lung and the hilar lymph nodes, which can also be involved separately."
    kind: short
  - id: sarcoidosis-q2
    q:
      it: "Che aspetto hanno i granulomi sarcoidotici e che cosa di solito manca?"
      en: "What do sarcoid granulomas look like, and what is usually missing?"
    a:
      it: "Sono noduli ben definiti di macrofagi epitelioidi e cellule giganti multinucleate; la necrosi significativa è rara."
      en: "They are well-defined nodules of epithelioid macrophages and multinucleated giant cells; significant necrosis is uncommon."
    kind: short
  - id: sarcoidosis-q3
    q:
      it: "Perché la sola biopsia con granulomi non basta per diagnosticare la sarcoidosi?"
      en: "Why is a biopsy with granulomas alone not enough to diagnose sarcoidosis?"
    a:
      it: "Nessun esame di laboratorio è specifico e altre malattie granulomatose, come la polmonite da ipersensibilità cronica, mostrano granulomi simili: serve la correlazione clinica, radiologica e di laboratorio."
      en: "No laboratory test is specific and other granulomatous diseases, such as chronic hypersensitivity pneumonitis, show similar granulomas: clinical, radiologic and laboratory correlation is needed."
    kind: short
