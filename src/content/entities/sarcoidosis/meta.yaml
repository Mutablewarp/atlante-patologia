summary:
  it: "Malattia granulomatosa multisistemica ad eziologia ignota, con granulomi epitelioidi non caseosi che colpiscono più spesso polmone e linfonodi ilari, ma anche cute, occhio e cuore."
  en: "Multisystem granulomatous disease of unknown cause, with noncaseating epithelioid granulomas that most often involve the lung and hilar nodes, but also skin, eye and heart."
