id: bacterial-pneumonia
module: o18
tier: core
kind: disease
names:
  it: "Polmoniti batteriche (polmonite lobare e broncopolmonite)"
  en: "Bacterial pneumonia (lobar pneumonia and bronchopneumonia)"
  eponyms: []
  synonyms:
    it: ["Polmonite lobare", "Broncopolmonite"]
    en: ["Lobar pneumonia", "Bronchopneumonia"]
  abbreviations: []
summary:
  it: "Infiammazione batterica del parenchima polmonare con consolidamento, lobare (stadi di congestione, epatizzazione rossa e grigia, risoluzione) o a focolai broncopneumonici, classificata soprattutto in base al germe."
  en: "Bacterial inflammation of the lung parenchyma with consolidation, either lobar (congestion, red and gray hepatization, resolution) or in bronchopneumonic foci, classified mainly by the causative organism."
lenses:
  system: [respiratory]
  process: [acute-inflammation]
  pattern: []
  presentation: [fever, dyspnea, chest-pain]
  marker: [special-stains]
  group: [infectious, inflammatory]
learningObjectives:
  - it: "Distinguere la polmonite lobare dalla broncopolmonite per distribuzione e contesto clinico."
    en: "Distinguish lobar pneumonia from bronchopneumonia by distribution and clinical setting."
  - it: "Descrivere in ordine gli stadi della polmonite pneumococcica: edema/congestione, epatizzazione rossa, epatizzazione grigia, risoluzione."
    en: "Describe in order the stages of pneumococcal pneumonia: edema/congestion, red hepatization, gray hepatization, resolution."
  - it: "Associare ai principali germi (pneumococco, Klebsiella, stafilococco, Legionella, anaerobi) il loro quadro tipico."
    en: "Match the main organisms (pneumococcus, Klebsiella, staphylococcus, Legionella, anaerobes) to their typical picture."
  - it: "Spiegare il ruolo dell'aspirazione nella patogenesi."
    en: "Explain the role of aspiration in pathogenesis."
  - it: "Elencare le complicanze polmonari, pleuriche e sistemiche."
    en: "List the pulmonary, pleural and systemic complications."
prerequisites: []
relations:
  - type: differentialOf
    target: atypical-and-viral-pneumonia
    note:
      it: "Esordio insidioso e bronchiolite con infiltrato linfoplasmacellulare, invece dell'essudato alveolare neutrofilo."
      en: "Insidious onset and bronchiolitis with a lymphoplasmacytic infiltrate, instead of a neutrophilic alveolar exudate."
  - type: differentialOf
    target: tuberculosis
    note:
      it: "Granuloma con necrosi caseosa invece di essudato alveolare."
      en: "Granuloma with caseous necrosis instead of an alveolar exudate."
  - type: causes
    target: lung-abscess
    note:
      it: "Gli anaerobi aspirati e lo stafilococco possono causare polmonite necrotizzante con ascesso."
      en: "Aspirated anaerobes and staphylococci can cause necrotizing pneumonia with abscess."
quickCheck:
  - id: bacterial-pneumonia-q1
    q:
      it: "Quali sono gli stadi della polmonite lobare pneumococcica, in ordine?"
      en: "What are the stages of pneumococcal lobar pneumonia, in order?"
    a:
      it: "Edema/congestione, epatizzazione rossa, epatizzazione grigia, risoluzione."
      en: "Edema/congestion, red hepatization, gray hepatization, resolution."
    kind: short
  - id: bacterial-pneumonia-q2
    q:
      it: "In che cosa la broncopolmonite differisce dalla polmonite lobare?"
      en: "How does bronchopneumonia differ from lobar pneumonia?"
    a:
      it: "Ha focolai separati centrati su bronchi e bronchioli, invece di un lobo intero solido, ed è tipica dei malati terminali."
      en: "It has separate foci centered on bronchi and bronchioles, instead of a whole solid lobe, and is typical of terminally ill patients."
    kind: short
  - id: bacterial-pneumonia-q3
    q:
      it: "Quali sono le complicanze della polmonite pneumococcica?"
      en: "What are the complications of pneumococcal pneumonia?"
    a:
      it: "Pleurite, versamento pleurico, empiema, batteriemia (endocardite, meningite), polmonite organizzativa con carnificazione, raramente ascesso."
      en: "Pleuritis, pleural effusion, empyema, bacteremia (endocarditis, meningitis), organizing pneumonia with carnification, rarely abscess."
    kind: short
  - id: bacterial-pneumonia-q4
    q:
      it: "Da dove arrivano di solito i batteri della polmonite?"
      en: "Where do the bacteria of pneumonia usually come from?"
    a:
      it: "Dai residenti normali di orofaringe e rinofaringe, portati agli alveoli dalle secrezioni aspirate."
      en: "From the normal residents of the oropharynx and nasopharynx, carried to the alveoli by aspirated secretions."
    kind: short
