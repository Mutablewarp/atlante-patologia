summary:
  it: "Necrosi di un'area di polmone per perdita dell'apporto ematico, di solito dopo embolia polmonare in un paziente con scompenso cardiaco o malattia polmonare cronica; è tipicamente un infarto rosso, piramidale, con la base sulla pleura."
  en: "Death of an area of lung after loss of its blood supply, usually after pulmonary embolism in a patient with heart failure or chronic lung disease; typically a red, pyramidal infarct with its base on the pleura."
