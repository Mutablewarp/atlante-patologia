summary:
  it: "Condizioni di rischio e lesioni precursori, in particolare la displasia e la neoplasia intraepiteliale, in cui un epitelio cronicamente danneggiato può progredire verso il cancro e che si sorvegliano o si rimuovono."
  en: "Risk conditions and precursor lesions, above all dysplasia and intraepithelial neoplasia, in which a chronically injured epithelium can progress toward cancer and which are monitored or removed."
