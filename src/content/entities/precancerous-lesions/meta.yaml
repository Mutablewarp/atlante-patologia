    en: "What do you see under the microscope in a dysplastic epithelium, and how do low-grade and high-grade dysplasia differ?"
    focus: [micro, ancillary]
    level: 1
  - it: "Perché la displasia può tornare alla normalità e perché il carcinoma in situ è sempre guaribile?"
    en: "Why can dysplasia return to normal, and why is carcinoma in situ invariably curable?"
    focus: [definition, prognosis]
    level: 2
  - it: "Perché i pazienti con esofago di Barrett vengono sottoposti a sorveglianza endoscopica e che cosa cambia se compare la displasia?"
    en: "Why are patients with Barrett esophagus kept under endoscopic surveillance, and what changes if dysplasia appears?"
    focus: [diagnosis, prognosis]
