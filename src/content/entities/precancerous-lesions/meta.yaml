learningObjectives:
  - it: "Distinguere una condizione di rischio (per esempio la metaplasia) da una lesione precursore (la displasia)."
    en: "Distinguish a risk condition (for example metaplasia) from a precursor lesion (dysplasia)."
  - it: "Descrivere i quadri microscopici della displasia e la gradazione bassa/alta."
    en: "Describe the microscopic features of dysplasia and low-grade versus high-grade grading."
  - it: "Collocare il carcinoma in situ rispetto alla membrana basale."
    en: "Place carcinoma in situ relative to the basement membrane."
  - it: "Spiegare la logica della sorveglianza usando l'esofago di Barrett e gli adenomi del colon."
    en: "Explain the logic of surveillance using Barrett esophagus and colon adenomas."
prerequisites: [metaplasia, dysplasia]
relations:
  - type: differentialOf
    target: metaplasia
    note:
      it: "Sostituzione di un tipo cellulare maturo con un altro, contro crescita e maturazione disordinate."
      en: "Replacement of one mature cell type by another, versus disordered growth and maturation."
  - type: prerequisiteOf
    target: carcinoma-in-situ
    note:
      it: "Il carcinoma in situ segue la displasia grave, senza superare la membrana basale."
      en: "Carcinoma in situ follows severe dysplasia and does not cross the basement membrane."
  - type: sameLesionOtherOrgan
    target: barrett-esophagus
    note:
      it: "Modello di metaplasia con possibile displasia e sorveglianza endoscopica."
      en: "A model of metaplasia with possible dysplasia and endoscopic surveillance."
  - type: sameLesionOtherOrgan
    target: cervical-squamous-intraepithelial-lesion
    note:
      it: "Displasia cervicale da HPV, vicina al carcinoma in situ nelle forme gravi."
      en: "HPV-related cervical dysplasia, close to carcinoma in situ when severe."
quickCheck:
  - id: precancerous-lesions-q1
    q:
      it: "Qual è la differenza tra una condizione di rischio e una lesione precursore?"
      en: "What is the difference between a risk condition and a precursor lesion?"
    a:
      it: "Nella condizione di rischio (per esempio la metaplasia) il cancro insorge più spesso; la lesione precursore è la displasia, tappa morfologica verso il cancro."
      en: "In a risk condition (for example metaplasia) cancer arises more often; the precursor lesion is dysplasia, a morphologic step toward cancer."
    kind: short
  - id: precancerous-lesions-q2
    q:
      it: "Che cosa distingue il carcinoma in situ da un carcinoma invasivo?"
      en: "What separates carcinoma in situ from invasive carcinoma?"
    a:
      it: "Le cellule neoplastiche non superano la membrana basale; per questo il carcinoma in situ è sempre guaribile."
      en: "The neoplastic cells do not cross the basement membrane, which is why carcinoma in situ is invariably curable."
    kind: short
  - id: precancerous-lesions-q3
    q:
      it: "Perché i pazienti con esofago di Barrett fanno endoscopie di sorveglianza?"
      en: "Why do patients with Barrett esophagus have surveillance endoscopies?"
    a:
      it: "Per scoprire precocemente la displasia, perché il rischio di adenocarcinoma cresce con l'estensione del segmento e con il grado di displasia."
      en: "To find dysplasia early, because the adenocarcinoma risk grows with segment length and dysplasia grade."
    kind: short
  - id: precancerous-lesions-q4
    q:
      it: "Che cosa si osserva al microscopio in un epitelio displastico?"
      en: "What do you see under the microscope in a dysplastic epithelium?"
    a:
      it: "Cellule disomogenee per dimensioni e forma, nuclei ingranditi, scuri e irregolari, maturazione disordinata e mitosi lontane dallo strato basale."
      en: "Cells uneven in size and shape, enlarged dark irregular nuclei, disordered maturation and mitoses far from the basal layer."
    kind: short
  - id: precancerous-lesions-q5
    q:
      it: "Quando un polipo asportato è guarito con la sola polipectomia completa?"
      en: "When does complete polypectomy alone cure a removed polyp?"
    a:
      it: "Quando la displasia non si estende oltre la mucosa."
      en: "When the dysplasia does not extend beyond the mucosa."
    kind: short
selfExplain:
  - it: "Perché la displasia può regredire mentre il cancro no?"
    en: "Why can dysplasia regress when cancer cannot?"
  - it: "Perché la sorveglianza endoscopica cerca la displasia e non il cancro già invasivo?"
    en: "Why does endoscopic surveillance look for dysplasia rather than established invasive cancer?"
  - it: "Perché la polipectomia completa guarisce una lesione la cui displasia non supera la mucosa?"
    en: "Why does complete polypectomy cure a lesion whose dysplasia stays within the mucosa?"
