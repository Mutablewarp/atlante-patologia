learningObjectives:
  - it: "Definire le bronchiectasie e distinguere la forma ostruttiva da quella non ostruttiva."
    en: "Define bronchiectasis and distinguish the obstructive from the nonobstructive form."
  - it: "Elencare le cause ereditarie e acquisite, compresa la sindrome di Kartagener."
    en: "List the inherited and acquired causes, including Kartagener syndrome."
  - it: "Spiegare il circolo vizioso tra muco ristagnante, infezione e distruzione della parete bronchiale."
    en: "Explain the vicious cycle of pooled mucus, infection and destruction of the bronchial wall."
  - it: "Descrivere l'aspetto macroscopico e microscopico e i pattern cilindrico, varicoso e sacculare."
    en: "Describe the gross and microscopic findings and the cylindrical, varicose and saccular patterns."
  - it: "Riconoscere le complicanze e sapere che la TC è l'esame diagnostico definitivo."
    en: "Recognize the complications and know that CT is the definitive diagnostic test."
