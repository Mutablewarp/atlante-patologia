summary:
  it: "Dilatazione bronchiale permanente dovuta alla distruzione della muscolatura e delle fibre elastiche della parete, che segue ostruzione o infezioni ricorrenti delle vie aeree."
  en: "Permanent bronchial dilation caused by destruction of the muscle and elastic tissue of the wall, following obstruction or recurrent airway infection."
