relations:
  - type: complicationOf
    target: cystic-fibrosis
    note:
      it: "La fibrosi cistica è una causa ereditaria di bronchiectasie generalizzate."
      en: "Cystic fibrosis is an inherited cause of generalized bronchiectasis."
  - type: complicationOf
    target: chronic-bronchitis
    note:
      it: "La bronchite cronica è una condizione acquisita che predispone alle bronchiectasie."
      en: "Chronic bronchitis is an acquired condition that predisposes to bronchiectasis."
  - type: differentialOf
    target: atelectasis
    note:
      it: "Nella sindrome del lobo medio l'atelettasia si associa a bronchiectasie nello stesso polmone."
      en: "In right middle lobe syndrome, atelectasis comes with bronchiectasis in the same lung."
quickCheck:
  - id: bronchiectasis-q1
    q:
      it: "Quali sono le due grandi categorie eziologiche delle bronchiectasie?"
      en: "What are the two broad etiologic categories of bronchiectasis?"
    a:
      it: "Ostruttiva (localizzata, a valle di un blocco di un bronco centrale) e non ostruttiva (dopo infezioni o difetti delle difese delle vie aeree)."
      en: "Obstructive (localized, beyond a block of a central bronchus) and nonobstructive (after infection or defects in airway defenses)."
    kind: short
  - id: bronchiectasis-q2
    q:
      it: "Qual è la triade della sindrome di Kartagener?"
      en: "What is the triad of Kartagener syndrome?"
    a:
      it: "Destrocardia, bronchiectasie e sinusite."
      en: "Dextrocardia, bronchiectasis and sinusitis."
    kind: short
  - id: bronchiectasis-q3
    q:
      it: "Qual è l'esame che pone la diagnosi definitiva?"
      en: "Which test makes the definitive diagnosis?"
    a:
      it: "La TC del polmone."
      en: "CT of the lung."
    kind: short
  - id: bronchiectasis-q4
    q:
      it: "Quali complicanze minacciano il paziente con malattia di lunga durata?"
      en: "Which complications threaten a patient with long-standing disease?"
    a:
      it: "Ipossia cronica e ipertensione polmonare."
      en: "Chronic hypoxia and pulmonary hypertension."
    kind: short
selfExplain:
