editionNote:
  it: "La classificazione e i gradi dei tumori neuroendocrini sono cambiati tra le edizioni; le soglie di Ki-67 vanno verificate su una classificazione aggiornata."
  en: "The classification and grades of neuroendocrine tumors changed between editions; check the Ki-67 cut-offs in a current classification."
