editionNote:
  it: "La classificazione è cambiata: la malattia da depositi densi, un tempo MPGN di tipo II, rientra oggi nella glomerulopatia da C3; i testi più vecchi usano la vecchia suddivisione."
  en: "The classification changed: dense deposit disease, once type II MPGN, now belongs to C3 glomerulopathy; older texts use the old split."
