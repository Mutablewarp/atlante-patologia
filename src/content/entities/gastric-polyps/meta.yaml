  - type: complicationOf
    target: helicobacter-pylori-gastritis
    note:
      it: "I polipi iperplastici si sviluppano nella gastrite cronica."
      en: "Hyperplastic polyps develop in chronic gastritis."
  - type: differentialOf
    target: gastric-adenocarcinoma
    note:
      it: "L'adenoma gastrico può associarsi al carcinoma, ma meno che nel colon."
      en: "Gastric adenoma may be linked to carcinoma, but less than in the colon."
quickCheck:
  - id: gastric-polyps-q1
    q:
      it: "In che cosa i polipi gastrici si distinguono da quelli del colon quanto alla natura neoplastica?"
      en: "How do gastric polyps differ from colonic polyps in terms of being neoplastic?"
    a:
      it: "La maggior parte dei polipi gastrici non è una vera neoplasia, a differenza di quanto accade nel colon."
      en: "Most gastric polyps are not true neoplasms, unlike in the colon."
    kind: short
  - id: gastric-polyps-q2
    q:
      it: "Quale tipo di polipo gastrico è oggi il più comune e in quale contesto?"
      en: "Which gastric polyp is now the most common, and in what setting?"
    a:
      it: "Il polipo delle ghiandole fundiche, in chi assume inibitori di pompa protonica."
      en: "The fundic gland polyp, in people taking proton pump inhibitors."
    kind: short
  - id: gastric-polyps-q3
    q:
      it: "In che cosa differiscono la malattia di Ménétrier e la sindrome di Zollinger-Ellison, pur ispessendo entrambe le pliche?"
      en: "How do Ménétrier disease and Zollinger–Ellison syndrome differ, though both thicken the folds?"
    a:
      it: "Nella Ménétrier prolifera l'epitelio foveolare; nella Zollinger-Ellison le cellule parietali, per un gastrinoma."
      en: "In Ménétrier the foveolar epithelium proliferates; in Zollinger–Ellison the parietal cells do, because of a gastrinoma."
    kind: short
  - id: gastric-polyps-q4
    q:
      it: "Quali sindromi, oltre alla FAP, danno polipi gastrici multipli?"
      en: "Besides FAP, which syndromes give multiple gastric polyps?"
    a:
      it: "Cowden, Cronkhite-Canada, Peutz-Jeghers e poliposi giovanile familiare."
      en: "Cowden, Cronkhite-Canada, Peutz-Jeghers and familial juvenile polyposis."
    kind: short
  - id: gastric-polyps-q5
    q:
      it: "Che cosa mostra al microscopio un adenoma gastrico, in ogni sua forma?"
      en: "What does a gastric adenoma show under the microscope, whatever its type?"
    a:
      it: "È displastico per definizione, sia di tipo foveolare sia intestinale."
      en: "It is dysplastic by definition, whether foveolar or intestinal in type."
    kind: short
selfExplain:
