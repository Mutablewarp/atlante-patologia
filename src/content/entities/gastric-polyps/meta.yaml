relations:
  - type: sameLesionOtherOrgan
    target: colorectal-adenoma
    note:
      it: "L'adenoma gastrico è meno strettamente legato al carcinoma di quello colorettale."
      en: "A gastric adenoma is less tightly linked to carcinoma than a colorectal one."
  - type: sharesMechanism
    target: familial-adenomatous-polyposis
