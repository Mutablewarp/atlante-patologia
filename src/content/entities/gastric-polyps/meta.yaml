summary:
  it: "Rilievi della mucosa gastrica, per lo più non neoplastici: polipi delle ghiandole fundiche, polipi iperplastici e adenomi, più i polipi delle sindromi poliposiche."
  en: "Raised areas of gastric mucosa, mostly non-neoplastic: fundic gland polyps, hyperplastic polyps and adenomas, plus the polyps of polyposis syndromes."
