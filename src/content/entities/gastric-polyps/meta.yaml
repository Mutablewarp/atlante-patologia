learningObjectives:
  - it: "Distinguere i polipi delle ghiandole fundiche, i polipi iperplastici e gli adenomi gastrici per contesto e morfologia."
    en: "Tell fundic gland polyps, hyperplastic polyps and gastric adenomas apart by setting and morphology."
  - it: "Spiegare perché la maggior parte dei polipi gastrici non è neoplastica, a differenza di quelli del colon."
    en: "Explain why most gastric polyps are not neoplastic, unlike colonic ones."
  - it: "Elencare le sindromi poliposiche che coinvolgono lo stomaco."
    en: "List the polyposis syndromes that involve the stomach."
  - it: "Riconoscere la malattia di Ménétrier come ispessimento delle pliche da iperplasia foveolare, non come polipo."
    en: "Recognize Ménétrier disease as fold thickening from foveolar hyperplasia, not a polyp."
