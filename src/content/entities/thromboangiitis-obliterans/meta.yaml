summary:
  it: "Vasculite infiammatoria trombotizzante delle arterie di medio e piccolo calibro degli arti distali, tipica dei fumatori forti, con microascessi neutrofili nella parete e gangrena delle estremità."
  en: "Inflammatory, thrombosing vasculitis of medium and small arteries of the distal limbs, typical of heavy smokers, with neutrophilic microabscesses in the wall and gangrene of the extremities."
lenses:
  system: [vessels]
  process: [acute-inflammation, thrombosis-embolism]
