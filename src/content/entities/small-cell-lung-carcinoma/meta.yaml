  - id: small-cell-lung-carcinoma-q2
    q:
      it: "Perché la maggior parte dei pazienti è in stadio avanzato alla prima visita?"
      en: "Why are most patients at an advanced stage when first seen?"
    a:
      it: "Perché il tumore cresce e metastatizza rapidamente."
      en: "Because the tumor grows and metastasizes rapidly."
    kind: short
  - id: small-cell-lung-carcinoma-q3
    q:
      it: "Come viene trattato un carcinoma a piccole cellule combinato con una componente non a piccole cellule?"
      en: "How is a small cell carcinoma combined with a non-small cell component treated?"
    a:
      it: "Come un carcinoma a piccole cellule, perché il comportamento segue la componente a piccole cellule."
      en: "As a small cell carcinoma, because behavior follows the small cell component."
    kind: short
