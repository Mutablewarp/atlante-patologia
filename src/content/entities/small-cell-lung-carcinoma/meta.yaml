summary:
  it: "Tumore epiteliale polmonare altamente maligno con caratteri neuroendocrini, legato al fumo di sigaretta, che cresce e metastatizza rapidamente ed è inizialmente molto sensibile alla chemioterapia."
  en: "A highly malignant epithelial lung tumor with neuroendocrine features, tied to cigarette smoking, that grows and metastasizes rapidly and is at first very sensitive to chemotherapy."
