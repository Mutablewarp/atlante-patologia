learningObjectives:
  - it: "Descrivere l'aspetto microscopico del carcinoma a piccole cellule: cellule piccole con citoplasma scarso, cromatina finemente granulare, nucleoli poco evidenti, mitosi numerose e necrosi."
    en: "Describe the microscopic picture of small cell carcinoma: small cells with scant cytoplasm, finely granular chromatin, inconspicuous nucleoli, many mitoses and necrosis."
  - it: "Indicare i marcatori neuroendocrini usati per confermare la diagnosi."
    en: "Name the neuroendocrine markers used to support the diagnosis."
  - it: "Elencare le sindromi paraneoplastiche associate al tumore."
    en: "List the paraneoplastic syndromes associated with the tumor."
  - it: "Spiegare perché la maggior parte dei pazienti arriva in fase avanzata."
    en: "Explain why most patients are first seen at an advanced stage."
  - it: "Distinguere il carcinoma a piccole cellule dal carcinoma neuroendocrino a grandi cellule e dagli altri carcinomi polmonari."
    en: "Distinguish small cell carcinoma from large cell neuroendocrine carcinoma and from other lung carcinomas."
