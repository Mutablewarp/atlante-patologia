id: dystrophic-calcification
module: g01
tier: core
kind: process
names:
  it: "Calcificazione distrofica"
  en: "Dystrophic calcification"
  eponyms: []
  synonyms:
    it: ["Mineralizzazione distrofica", "Calcificazione eterotopica (di tipo distrofico)"]
    en: ["Dystrophic mineralization", "Heterotopic calcification (dystrophic type)"]
  abbreviations: []
summary:
  it: "Deposito extracellulare di sali di calcio in tessuti danneggiati o necrotici, con metabolismo del calcio e calcemia normali."
  en: "Extracellular deposition of calcium salts in injured or necrotic tissue, with normal calcium metabolism and normal serum calcium."
lenses:
  system: [general, vessels, heart, breast]
  process: [pathologic-calcification, extracellular-accumulation, cell-death, necrosis]
  pattern: [dystrophic-calcification]
  presentation: [incidental-finding, mass-lesion]
  marker: [special-stains, von-kossa, alizarin-red, calcium-phosphate]
  group: [degenerative]
learningObjectives:
  - it: "Definire la calcificazione distrofica e distinguerla dalla calcificazione metastatica per causa, sede e valori di calcemia."
    en: "Define dystrophic calcification and distinguish it from metastatic calcification by cause, site and serum calcium."
  - it: "Spiegare come le membrane di cellule morte o morenti forniscano acidi grassi che legano il calcio e ne innescano la precipitazione."
    en: "Explain how the membranes of dead or dying cells supply fatty acids that bind calcium and start its precipitation."
  - it: "Elencare i contesti tipici: necrosi caseosa tubercolare, steatonecrosi, ateromi, valvole cardiache, infarti renali, necrosi tumorale, corpi psammomatosi."
    en: "List the typical settings: tuberculous caseous necrosis, fat necrosis, atheromas, heart valves, renal infarcts, tumor necrosis, psammoma bodies."
  - it: "Riconoscere il calcio all'ematossilina-eosina (depositi basofili) e con la colorazione di von Kossa (depositi neri)."
    en: "Recognize calcium on H&E (basophilic deposits) and with the von Kossa stain (black)."
  - it: "Discutere quando la calcificazione distrofica è clinicamente silente e quando causa malattia, come nella stenosi aortica calcifica."
    en: "Discuss when dystrophic calcification is clinically silent and when it causes disease, as in calcific aortic stenosis."
prerequisites: []
relations:
  - type: differentialOf
    target: metastatic-calcification
    note:
      it: "Stesso deposito di sali di calcio: nella forma distrofica in un tessuto danneggiato con calcemia normale, nella metastatica in un tessuto sano per un aumento del prodotto calcio-fosforo (ipercalcemia e/o iperfosfatemia)."
      en: "Same calcium salt deposit: damaged tissue with normal serum calcium versus healthy tissue with a raised calcium-phosphate product (hypercalcemia and/or hyperphosphatemia)."
  - type: complicationOf
    target: caseous-necrosis
    note:
      it: "I focolai caseosi tubercolari del polmone e dei linfonodi calcificano spesso."
      en: "Tuberculous caseous foci in lung and lymph nodes often calcify."
  - type: complicationOf
    target: fat-necrosis
    note:
      it: "Gli acidi grassi liberati legano il calcio formando saponi; nella mammella il focolaio calcificato può simulare un tumore."
      en: "Released fatty acids bind calcium as soaps; in the breast the calcified focus can mimic a tumor."
  - type: complicationOf
    target: coagulative-necrosis
    note:
      it: "Gli infarti di vecchia data, per esempio renali, possono andare incontro a calcificazione distrofica."
      en: "Old infarcts, for example in the kidney, may undergo dystrophic calcification."
  - type: complicationOf
    target: atherosclerosis
    note:
      it: "Le placche aterosclerotiche calcificate irrigidiscono la parete arteriosa."
      en: "Calcified atherosclerotic plaques stiffen the arterial wall."
quickCheck:
  - id: dystrophic-calcification-q1
    q:
      it: "Qual è la calcemia tipica nella calcificazione distrofica, e perché?"
      en: "What is the typical serum calcium in dystrophic calcification, and why?"
    a:
      it: "Normale: il deposito è innescato da un danno tissutale locale, non da un disturbo del metabolismo del calcio."
      en: "Normal: deposition is triggered by local tissue injury, not by a disorder of calcium metabolism."
    kind: short
  - id: dystrophic-calcification-q2
    q:
      it: "Che aspetto ha il calcio in ematossilina-eosina e quale colorazione speciale lo evidenzia in nero?"
      en: "What does calcium look like on H&E, and which special stain shows it black?"
    a:
      it: "Depositi amorfi basofili (blu-viola intenso); la colorazione di von Kossa li colora di nero."
      en: "Amorphous basophilic (deep blue-purple) deposits; the von Kossa stain colors them black."
    kind: short
  - id: dystrophic-calcification-q3
    q:
      it: "Che cosa sono i corpi psammomatosi e in quali tumori si trovano?"
      en: "What are psammoma bodies and in which tumors are they found?"
    a:
      it: "Piccole calcificazioni distrofiche sferiche a lamelle concentriche; tipiche del carcinoma papillare della tiroide, del carcinoma sieroso ovarico di basso grado e del meningioma."
      en: "Small spherical, concentrically laminated dystrophic calcifications; typical of papillary thyroid carcinoma, low-grade serous ovarian carcinoma and meningioma."
    kind: short
  - id: dystrophic-calcification-q4
    q:
      it: "Perché la calcificazione di una valvola aortica è un problema, mentre quella di un linfonodo tubercolare di solito no?"
      en: "Why is calcification of an aortic valve a problem, while calcification of a tuberculous lymph node usually is not?"
    a:
      it: "Perché la valvola deve restare flessibile: le cuspidi calcificate e rigide non si aprono del tutto e ostacolano il flusso; il linfonodo calcificato non ha una funzione meccanica da perdere."
      en: "Because the valve must stay flexible: rigid calcified cusps cannot open fully and obstruct flow; a calcified lymph node has no mechanical function to lose."
    kind: free
selfExplain:
  - it: "Perché le cellule morte accumulano calcio mentre quelle vive mantengono un gradiente di calcio così marcato?"
    en: "Why do dead cells take up calcium while living cells maintain such a large calcium gradient?"
  - it: "Perché la calcificazione della valvola aortica è considerata un processo attivo e non un semplice deposito passivo su tessuto morto?"
    en: "Why is aortic valve calcification considered an active process rather than passive mineral deposition on dead tissue?"
  - it: "Come mai le microcalcificazioni lineari e ramificate alla mammografia fanno sospettare un carcinoma duttale in situ?"
    en: "Why do linear, branching microcalcifications on mammography raise suspicion of ductal carcinoma in situ?"
chain:
  - pathology:
      it: "Calcificazione distrofica delle cuspidi aortiche (stenosi aortica calcifica)"
      en: "Dystrophic calcification of the aortic cusps (calcific aortic stenosis)"
    sign:
      it: "Paziente anziano, di solito oltre i 60 anni, con ipertrofia concentrica del ventricolo sinistro"
      en: "Older patient, usually over 60, with concentric left ventricular hypertrophy"
    lab:
      it: "Calcemia normale; all'imaging valvola calcificata con apertura ridotta"
      en: "Normal serum calcium; imaging shows a calcified valve that opens poorly"
  - pathology:
      it: "Calcificazione distrofica della necrosi intraduttale (carcinoma duttale in situ di tipo comedonico)"
      en: "Dystrophic calcification of intraductal necrosis (comedo-type ductal carcinoma in situ)"
    sign:
      it: "Spesso asintomatico; riscontro allo screening"
      en: "Often no symptoms; found at screening"
    lab:
      it: "Mammografia: microcalcificazioni lineari e ramificate"
      en: "Mammography: linear, branching microcalcifications"
examQuestions:
  - it: "Mi parli della calcificazione distrofica: che cos'è, in quali contesti si forma e com'è di solito la calcemia?"
    en: "Tell me about dystrophic calcification: what is it, in which settings does it form, and what is the serum calcium usually like?"
    focus: [definition, etiology]
    level: 1
  - it: "Che cosa vede al microscopio in un focolaio di calcificazione distrofica e con quali colorazioni conferma che si tratta di calcio? E che cosa sono i corpi psammomatosi?"
    en: "What do you see under the microscope in a focus of dystrophic calcification, and which stains confirm that it is calcium? And what are psammoma bodies?"
    focus: [micro, ancillary]
    level: 1
  - it: "Perché un tessuto necrotico calcifica anche se la calcemia è normale? Mi spieghi come gli acidi grassi liberi innescano il deposito e perché la steatonecrosi ne è l'esempio più chiaro."
    en: "Why does necrotic tissue calcify even when serum calcium is normal? Explain how free fatty acids start the deposit, and why fat necrosis is the clearest example."
    focus: [pathogenesis]
    level: 2
  - it: "Mi parli della stenosi aortica calcifica: dove si formano i noduli calcifici e perché la si considera un processo attivo e non un semplice deposito su tessuto morto?"
    en: "Tell me about calcific aortic stenosis: where do the calcified nodules form, and why is it seen as an active process rather than simple deposition on dead tissue?"
    focus: [gross, pathogenesis]
    level: 2
  - it: "Come distingue la calcificazione distrofica da quella metastatica? Come classificherebbe il calcio di un infarto renale e quello della nefrocalcinosi di un paziente ipercalcemico?"
    en: "How do you tell dystrophic from metastatic calcification? How would you classify the calcium in a renal infarct, and in the nephrocalcinosis of a hypercalcemic patient?"
    focus: [definition, differential, traps]
    level: 3
  - it: "Una mammografia di screening mostra microcalcificazioni lineari e ramificate: che cosa sospetta, come si studiano in anatomia patologica e quali lesioni benigne possono calcificare anch'esse?"
    en: "A screening mammogram shows linear, branching microcalcifications: what do you suspect, how does the pathologist study them, and which benign lesions can calcify too?"
    focus: [diagnosis, ancillary, traps]
    level: 3
