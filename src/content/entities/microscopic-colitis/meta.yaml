    target: ulcerative-colitis
    note:
      it: "Colon macroscopicamente normale e ghiandole normali, a differenza della rettocolite ulcerosa."
      en: "Grossly normal colon and normal glands, unlike ulcerative colitis."
  - type: differentialOf
    target: crohn-disease
    note:
      it: "Colon macroscopicamente normale e ghiandole normali, a differenza della malattia di Crohn."
      en: "Grossly normal colon and normal glands, unlike Crohn disease."
quickCheck:
  - id: microscopic-colitis-q1
    q:
      it: "Perché una colonscopia normale non esclude la colite microscopica?"
      en: "Why does a normal colonoscopy not exclude microscopic colitis?"
    a:
      it: "Perché il colon appare normale all'esame macroscopico e solo la valutazione microscopica delle biopsie mostra l'anomalia."
      en: "Because the colon looks grossly normal and only microscopic evaluation of biopsies shows the abnormality."
    kind: short
  - id: microscopic-colitis-q2
    q:
      it: "Che cosa distingue la colite collagenosica da quella linfocitaria?"
      en: "What distinguishes collagenous colitis from lymphocytic colitis?"
    a:
      it: "Entrambe hanno linfociti intraepiteliali aumentati, ma solo quella collagenosica ha una banda di collagene sottoepiteliale ispessita."
      en: "Both have increased intraepithelial lymphocytes, but only collagenous colitis has a thickened subepithelial collagen band."
    kind: short
  - id: microscopic-colitis-q3
    q:
      it: "Perché si eseguono biopsie multiple di tutto il colon?"
      en: "Why are multiple biopsies of the whole colon taken?"
    a:
      it: "Le alterazioni possono prevalere nel colon destro e la banda di collagene è irregolare, quindi un singolo prelievo può non bastare."
      en: "Changes may be more pronounced in the right colon and the collagen band is irregular, so a single sample may not be enough."
    kind: short
selfExplain:
  - it: "Perché la colite collagenosica può richiedere più biopsie?"
    en: "Why can collagenous colitis require several biopsies?"
  - it: "Perché l'architettura ghiandolare normale aiuta a distinguere la colite microscopica dalle malattie infiammatorie croniche intestinali?"
    en: "Why does normal gland architecture help separate microscopic colitis from inflammatory bowel disease?"
