id: microscopic-colitis
module: o19
tier: extended
kind: disease
names:
  it: "Colite microscopica (collagenosica e linfocitaria)"
  en: "Microscopic colitis"
  eponyms: []
  synonyms:
    it: ["Colite collagenosica", "Colite linfocitaria"]
    en: ["Collagenous colitis", "Lymphocytic colitis"]
  abbreviations: []
summary:
  it: "Colite cronica con diarrea acquosa in cui il colon appare normale all'esame macroscopico e la diagnosi si basa sulla biopsia: linfocitosi intraepiteliale nella forma linfocitaria, banda di collagene sottoepiteliale ispessita in quella collagenosica."
  en: "Chronic colitis with watery diarrhea in which the colon looks grossly normal and the diagnosis rests on biopsy: intraepithelial lymphocytosis in the lymphocytic form, a thickened subepithelial collagen band in the collagenous form."
lenses:
  system: [gastrointestinal]
  process: [chronic-inflammation]
  pattern: []
  presentation: []
  marker: []
  group: [inflammatory, immune]
learningObjectives:
  - it: "Riconoscere la diarrea acquosa cronica con colon macroscopicamente normale come presentazione della colite microscopica."
    en: "Recognize chronic watery diarrhea with a grossly normal colon as the presentation of microscopic colitis."
  - it: "Distinguere al microscopio la colite linfocitaria (linfociti intraepiteliali) da quella collagenosica (banda di collagene ispessita)."
    en: "Tell lymphocytic colitis (intraepithelial lymphocytes) from collagenous colitis (thickened collagen band) under the microscope."
  - it: "Spiegare perché servono biopsie multiple e casuali di tutto il colon."
    en: "Explain why multiple random biopsies of the whole colon are needed."
  - it: "Distinguere la colite microscopica dalle malattie infiammatorie croniche intestinali in base all'architettura delle ghiandole."
    en: "Separate microscopic colitis from inflammatory bowel disease by gland architecture."
