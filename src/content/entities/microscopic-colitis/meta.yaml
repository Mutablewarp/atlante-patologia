  - it: "Perché in un paziente con diarrea acquosa cronica e colonscopia normale si eseguono biopsie casuali di tutto il colon?"
    en: "Why do you take random biopsies of the whole colon in a patient with chronic watery diarrhea and a normal colonoscopy?"
    focus: [diagnosis, high-yield]
    level: 2
