summary:
  it: "Malattia delle vie aeree definita clinicamente da tosse produttiva cronica senza altra causa, con ipertrofia delle ghiandole mucose, aumento delle cellule caliciformi e frequente associazione con enfisema."
  en: "Airway disease defined clinically by chronic productive cough without another cause, with mucous gland hypertrophy, more goblet cells and frequent overlap with emphysema."
