quickCheck:
  - id: urothelial-metaplastic-lesions-q1
    q:
      it: Che differenza c'è tra una gemma e un nido di Brunn?
      en: What separates a Brunn bud from a Brunn nest?
    a:
      it: La gemma è ancora un'invaginazione della superficie; il nido è nella lamina propria, staccato dalla superficie.
      en: A bud is still an invagination of the surface; a nest lies in the lamina propria, detached from the surface.
    kind: short
  - id: urothelial-metaplastic-lesions-q2
    q:
      it: A che cosa corrisponde la cistite cistica?
      en: What does cystitis cystica correspond to?
    a:
      it: A nidi di Brunn cistici rivestiti da urotelio normale.
      en: To cystic Brunn nests lined by normal urothelium.
    kind: short
  - id: urothelial-metaplastic-lesions-q3
    q:
      it: Queste lesioni sono preneoplastiche?
      en: Are these lesions preneoplastic?
    a:
      it: No, non ci sono prove; i pazienti però hanno un rischio più alto di carcinoma.
      en: No evidence says so, although patients carry a higher cancer risk.
    kind: short
