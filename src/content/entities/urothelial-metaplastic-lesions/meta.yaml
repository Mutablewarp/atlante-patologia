names:
  it: Lesioni proliferative e metaplastiche benigne dell'urotelio
  en: Benign proliferative and metaplastic urothelial lesions
  eponyms: []
  synonyms:
    it: [nidi di Brunn, cistite cistica e ghiandolare, metaplasia nefrogenica, adenoma nefrogenico]
    en: [Brunn nests, cystitis cystica and glandularis, nephrogenic metaplasia, nephrogenic adenoma]
  abbreviations: []
summary:
  it: Alterazioni non neoplastiche dell'urotelio, soprattutto vescicale, che comprendono gemme e nidi di Brunn, cistite cistica e ghiandolare, metaplasia squamosa e metaplasia nefrogenica.
  en: Non-neoplastic changes of the urothelium, mostly in the bladder, including Brunn buds and nests, cystitis cystica and glandularis, squamous metaplasia and nephrogenic metaplasia.
learningObjectives:
  - it: Distinguere le gemme di Brunn dai nidi di Brunn.
    en: Tell Brunn buds from Brunn nests.
  - it: Descrivere cistite cistica, cistite ghiandolare, metaplasia squamosa e metaplasia nefrogenica.
    en: Describe cystitis cystica, cystitis glandularis, squamous metaplasia and nephrogenic metaplasia.
  - it: Spiegare perché queste lesioni non sono preneoplastiche anche se si associano a un rischio più alto di carcinoma.
    en: Explain why these lesions are not preneoplastic even though they go with a higher cancer risk.
