summary:
  it: "Infiammazione acuta o cronica della vescica, per lo più infettiva (coliformi), con forme particolari come cistite interstiziale, malacoplachia e cistite da schistosomiasi."
  en: "Acute or chronic inflammation of the bladder, mostly infectious (coliforms), with special forms such as interstitial cystitis, malakoplakia and schistosomal cystitis."
lenses:
  system: [urinary-male-genital]
  process: [acute-inflammation, chronic-inflammation, granulomatous-inflammation]
  pattern: [metaplasia, granuloma]
  presentation: [hematuria]
  marker: [pas, laboratory]
  group: [inflammatory, infectious]
learningObjectives:
  - it: "Elencare i principali fattori di rischio e gli agenti causali della cistite."
    en: "List the main risk factors and causative agents of cystitis."
  - it: "Descrivere il quadro macroscopico e microscopico della cistite acuta e cronica."
    en: "Describe the gross and microscopic picture of acute and chronic cystitis."
  - it: "Riconoscere le forme speciali: emorragica, interstiziale, eosinofila, malacoplachia e da schistosomi."
    en: "Recognize the special forms: hemorrhagic, interstitial, eosinophilic, malakoplakia and schistosomal."
  - it: "Spiegare perché l'atipia di un urotelio infiammato non va scambiata per cancro."
    en: "Explain why atypia in an inflamed urothelium must not be mistaken for cancer."
prerequisites: []
relations:
  - type: differentialOf
    target: urothelial-metaplastic-lesions
    note:
      it: "Cistite cistica e ghiandolare sono lesioni benigne dell'urotelio, da non confondere con il cancro."
      en: "Cystitis cystica and glandularis are benign urothelial lesions, not to be confused with cancer."
  - type: differentialOf
    target: tuberculosis
    note:
      it: "La cistite granulomatosa è caratteristica della tubercolosi."
      en: "Granulomatous cystitis is characteristic of tuberculosis."
  - type: mimics
    target: urothelial-carcinoma
    note:
      it: "L'atipia reattiva di una vescica infiammata non va scambiata per malignità."
      en: "Reactive atypia of an inflamed bladder must not be mistaken for malignancy."
quickCheck:
  - id: cystitis-q1
    q:
      it: "Quali batteri causano più spesso la cistite?"
      en: "Which bacteria most often cause cystitis?"
    a:
      it: "I batteri coliformi, soprattutto Escherichia coli."
      en: "Coliform bacteria, above all Escherichia coli."
    kind: short
  - id: cystitis-q2
    q:
      it: "Quale reperto fa pensare a una cistite interstiziale e non batterica?"
      en: "Which finding points to interstitial rather than bacterial cystitis?"
    a:
      it: "Urinocolture quasi sempre negative; nelle fasi croniche può comparire l'ulcera di Hunner."
      en: "Urine cultures almost always negative; a Hunner ulcer can appear in chronic stages."
    kind: short
  - id: cystitis-q3
    q:
      it: "Quale reperto istologico identifica la malacoplachia?"
      en: "Which histologic finding identifies malakoplakia?"
    a:
      it: "Macrofagi con granuli PAS-positivi e corpi di Michaelis-Gutmann."
      en: "Macrophages with PAS-positive granules and Michaelis-Gutmann bodies."
    kind: short
  - id: cystitis-q4
    q:
      it: "Quale tumore della vescica si associa tipicamente alla schistosomiasi?"
      en: "Which bladder cancer is typically linked to schistosomiasis?"
    a:
      it: "Il carcinoma squamocellulare, frequente dove S. haematobium è endemico."
      en: "Squamous cell carcinoma, frequent where S. haematobium is endemic."
    kind: short
  - id: cystitis-q5
    q:
      it: "Come va interpretata l'atipia dell'epitelio in una vescica infiammata?"
      en: "How should epithelial atypia in an inflamed bladder be read?"
    a:
      it: "Di solito è transitoria e non va scambiata per malignità."
      en: "It is usually transient and must not be mistaken for malignancy."
    kind: free
