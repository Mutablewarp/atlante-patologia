    focus: [micro, diagnosis]
    level: 1
  - it: "Mi parli del teratoma testicolare: perché contiene tessuti così diversi e può diventare maligno?"
    en: "Tell me about testicular teratoma: why does it contain such different tissues, and can it become malignant?"
    focus: [pathogenesis, micro, prognosis]
    level: 2
  - it: "Mi parli dei tumori germinali misti: quali componenti possono contenere e come si tratta uno con una quota di seminoma?"
    en: "Tell me about mixed germ cell tumors: which components can they contain, and how is one with a seminoma part managed?"
    focus: [definition, diagnosis, traps]
