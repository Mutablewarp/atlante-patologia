learningObjectives:
  - it: "Riconoscere che quasi tutti i tumori della laringe sono carcinomi squamosi, in prevalenza maschi fumatori."
    en: "Recognize that almost all laryngeal cancers are squamous cell carcinomas, mostly in male smokers."
  - it: "Distinguere le sedi glottica, sopraglottica, transglottica e sottoglottica."
    en: "Distinguish the glottic, supraglottic, transglottic and infraglottic sites."
  - it: "Collegare ogni sede alla diffusione linfonodale e alla chirurgia necessaria."
    en: "Link each site to nodal spread and the surgery it needs."
