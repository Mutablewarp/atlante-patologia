quickCheck:
  - id: laryngeal-squamous-cell-carcinoma-q1
    q:
      it: "Quale sede laringea ha la prognosi migliore e metastatizza tardi ai linfonodi?"
      en: "Which laryngeal site has the best prognosis and metastasizes late to nodes?"
    a:
      it: "La sede glottica, limitata alle corde vocali vere."
      en: "The glottic site, confined to the true vocal cords."
    kind: short
  - id: laryngeal-squamous-cell-carcinoma-q2
    q:
      it: "In quali strutture nasce un carcinoma sopraglottico e cosa risparmia per definizione?"
      en: "Which structures does a supraglottic carcinoma arise in, and what does it spare by definition?"
    a:
      it: "Ventricolo, false corde o epiglottide; risparmia le corde vocali vere."
      en: "The ventricle, false cords or epiglottis; it spares the true cords."
    kind: short
  - id: laryngeal-squamous-cell-carcinoma-q3
    q:
      it: "Quale istotipo costituisce quasi tutti i tumori laringei?"
      en: "Which histologic type makes up almost all laryngeal cancers?"
    a:
      it: "Il carcinoma squamoso."
      en: "Squamous cell carcinoma."
    kind: short
  - id: laryngeal-squamous-cell-carcinoma-q4
    q:
      it: "Quando un carcinoma si definisce transglottico?"
      en: "When is a carcinoma called transglottic?"
    a:
      it: "Quando sono coinvolte sia le corde vocali vere sia le false corde."
      en: "When both the true and the false cords are involved."
    kind: short
