summary:
  it: "Carcinoma squamoso della laringe, tipico dei fumatori maschi, classificato per sede (glottico, sopraglottico, transglottico, sottoglottico) con diversa tendenza alla metastasi linfonodale."
  en: "Squamous cell carcinoma of the larynx, typical of male smokers, classified by site (glottic, supraglottic, transglottic, infraglottic) with different tendencies to nodal metastasis."
