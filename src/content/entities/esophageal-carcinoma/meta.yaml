learningObjectives:
  - it: "Confrontare carcinoma squamoso e adenocarcinoma dell'esofago per sede, fattori di rischio e lesione precursore."
    en: "Compare squamous carcinoma and adenocarcinoma of the esophagus by site, risk factors and precursor lesion."
  - it: "Descrivere l'aspetto macroscopico e microscopico dei due istotipi."
    en: "Describe the gross and microscopic appearance of the two histologic types."
  - it: "Collegare la sede del tumore alle stazioni linfonodali interessate dalla diffusione."
    en: "Link tumor site to the lymph node groups involved in spread."
  - it: "Elencare i segni clinici e le complicanze: disfagia, sanguinamento, fistola tracheoesofagea, invasione del mediastino."
    en: "List clinical signs and complications: dysphagia, bleeding, tracheoesophageal fistula, mediastinal invasion."
prerequisites: [dysplasia, metaplasia]
relations:
  - type: complicationOf
    target: barrett-esophagus
    note:
      it: "L'adenocarcinoma insorge dalla displasia nell'esofago di Barrett."
      en: "Adenocarcinoma arises from dysplasia in Barrett esophagus."
  - type: differentialOf
    target: gastrointestinal-stromal-tumor
    note:
      it: "Tumore sottomucoso a cellule fusate, ma nell'esofago per lo più benigno e muscolare liscio."
      en: "A spindle cell submucosal tumor, but in the esophagus mostly benign and smooth muscle in origin."
  - type: differentialOf
    target: gastric-adenocarcinoma
    note:
      it: "Le pliche gastriche indicano l'inizio dello stomaco e aiutano a definire la sede della giunzione."
      en: "Gastric folds mark the start of the stomach and help place the junction."
  - type: sameLesionOtherOrgan
    target: laryngeal-squamous-cell-carcinoma
    note:
      it: "Carcinoma squamoso delle vie aerodigestive, con fumo e alcol tra i fattori di rischio."
      en: "Squamous carcinoma of the aerodigestive tract, with smoking and alcohol among the risk factors."
quickCheck:
  - id: esophageal-carcinoma-q1
    q:
      it: "Quale istotipo prevale nel mondo e quale in Nord America, Europa occidentale e Australia?"
      en: "Which type predominates worldwide, and which in North America, Western Europe and Australia?"
    a:
      it: "Nel mondo prevale il carcinoma squamoso; in Nord America, Europa occidentale e Australia prevale l'adenocarcinoma."
      en: "Squamous carcinoma predominates worldwide; adenocarcinoma predominates in North America, Western Europe and Australia."
    kind: short
  - id: esophageal-carcinoma-q2
    q:
      it: "Da quale lesione precursore e in quale sede nasce di solito l'adenocarcinoma?"
      en: "From which precursor lesion and in which site does adenocarcinoma usually arise?"
    a:
      it: "Dalla displasia nell'esofago di Barrett, nell'esofago distale o alla giunzione gastroesofagea."
      en: "From dysplasia in Barrett esophagus, in the distal esophagus or at the gastroesophageal junction."
    kind: short
  - id: esophageal-carcinoma-q3
    q:
      it: "Quali linfonodi drenano un tumore del terzo inferiore dell'esofago?"
      en: "Which lymph nodes drain a tumor of the lower third of the esophagus?"
    a:
      it: "Quelli retroperitoneali, celiaci e gastrici sinistri, seguendo i linfatici dell'arteria gastrica sinistra."
      en: "Retroperitoneal, celiac and left gastric nodes, following the lymphatics of the left gastric artery."
    kind: short
