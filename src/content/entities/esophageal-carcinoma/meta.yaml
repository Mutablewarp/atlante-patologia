summary:
  it: "Tumore maligno epiteliale dell'esofago, per lo più carcinoma squamoso (prevalente nel mondo, nel terzo medio e superiore) o adenocarcinoma (prevalente in Occidente, sul fondo di un esofago di Barrett, nel tratto distale)."
  en: "Malignant epithelial tumor of the esophagus, mostly squamous cell carcinoma (most common worldwide, middle and upper thirds) or adenocarcinoma (predominant in the West, on a background of Barrett esophagus, distal)."
