learningObjectives:
  - it: "Elencare le cause dell'ascesso polmonare: aspirazione, post-polmonite, emboli settici e ostruzione bronchiale."
    en: "List the causes of lung abscess: aspiration, post-pneumonic, septic emboli and bronchial obstruction."
  - it: "Spiegare perché l'aspirazione porta ad ascesso e perché è colpito più spesso il polmone destro."
    en: "Explain why aspiration leads to abscess and why the right lung is more often involved."
  - it: "Descrivere la morfologia macroscopica e microscopica di un ascesso polmonare acuto e della sua evoluzione."
    en: "Describe the gross and microscopic morphology of an acute lung abscess and how it evolves."
  - it: "Riconoscere l'attinomicosi polmonare, i suoi granuli di zolfo e le sue complicanze, e distinguerla dalla nocardiosi."
    en: "Recognize pulmonary actinomycosis, its sulfur granules and its complications, and tell it from nocardiosis."
prerequisites: [acute-inflammation]
relations:
  - type: differentialOf
    target: bacterial-pneumonia
    note:
      it: "La polmonite batterica è un'infiammazione intra-alveolare; la polmonite necrotizzante può evolvere in ascesso."
      en: "Bacterial pneumonia is an intra-alveolar inflammation; a necrotizing pneumonia can progress to abscess."
  - type: sharesMechanism
    target: pulmonary-embolism
    note:
      it: "Emboli polmonari infetti possono seminare ascessi."
      en: "Infected pulmonary emboli can seed abscesses."
quickCheck:
  - id: lung-abscess-q1
    q:
      it: "Qual è la causa più frequente di ascesso polmonare e quale condizione vi predispone di più?"
      en: "What is the most common cause of lung abscess, and which condition predisposes to it most often?"
    a:
      it: "L'aspirazione di contenuto orofaringeo; la condizione predisponente più comune è l'alcolismo."
      en: "Aspiration of oropharyngeal contents; alcoholism is the most common predisposing condition."
    kind: short
  - id: lung-abscess-q2
    q:
      it: "Quali due condizioni servono perché l'aspirazione dia un ascesso?"
      en: "Which two conditions are needed for aspiration to produce an abscess?"
    a:
      it: "Un grande carico di batteri anaerobi nel cavo orale e un riflesso della tosse o una clearance tracheobronchiale alterati."
      en: "A large load of anaerobic bacteria in the mouth, and an impaired cough reflex or tracheobronchial clearance."
    kind: short
  - id: lung-abscess-q3
    q:
      it: "Che cosa sono i granuli di zolfo e in quale infezione si trovano?"
      en: "What are sulfur granules and in which infection do they occur?"
    a:
      it: "Piccole particelle gialle formate da filamenti a clava ai margini delle colonie, tipiche dell'attinomicosi."
      en: "Small yellow particles made of club-shaped filaments at the colony edge, typical of actinomycosis."
    kind: short
  - id: lung-abscess-q4
    q:
      it: "Quali complicanze può dare l'estensione degli ascessi attinomicotici?"
      en: "Which complications can follow when actinomycotic abscesses spread?"
    a:
      it: "Se raggiungono la pleura possono comparire fistola broncopolmonare o empiema pleurico; possono anche invadere la parete toracica."
      en: "When they reach the pleura, a bronchopulmonary fistula or pleural empyema may follow; they may also invade the chest wall."
    kind: short
