summary:
  it: "Raccolta localizzata di pus con distruzione del parenchima polmonare, più spesso da aspirazione di batteri anaerobi orofaringei."
  en: "A localized collection of pus with destruction of lung parenchyma, most often from aspiration of oropharyngeal anaerobic bacteria."
