names:
  it: "Gangrena"
  en: "Gangrene"
  eponyms: []
  synonyms:
    it: ["Necrosi gangrenosa", "Gangrena secca", "Gangrena umida", "Gangrena gassosa (mionecrosi clostridica)"]
    en: ["Gangrenous necrosis", "Dry gangrene", "Wet gangrene", "Gas gangrene (clostridial myonecrosis)"]
  abbreviations: []
summary:
  it: "Termine clinico e macroscopico che indica la necrosi di un'ampia massa di tessuto, di solito di un arto o di un tratto di intestino: secca se ischemica (necrosi coagulativa), umida se sovrainfettata e colliquata, gassosa se causata dalle tossine dei clostridi."
  en: "Clinical and gross term for necrosis of a large mass of tissue, usually a limb or a bowel segment: dry when ischemic (coagulative necrosis), wet when infected and liquefied, gas when caused by clostridial toxins."
lenses:
  system: [general, vessels, gastrointestinal, muscle-nerve, skin]
  process: [cell-death, necrosis, hypoxic-ischemic-injury, thrombosis-embolism, acute-inflammation]
  pattern: [gangrene, necrosis-coagulative, necrosis-liquefactive]
  presentation: [ischemic-event]
  marker: [special-stains]
  group: [vascular, infectious, metabolic]
learningObjectives:
  - it: "Spiegare perché la gangrena è un termine clinico e macroscopico e non un quadro istologico autonomo di necrosi."
    en: "Explain why gangrene is a clinical and gross term rather than a separate histologic pattern of necrosis."
  - it: "Distinguere gangrena secca, umida e gassosa per causa, meccanismo e aspetto macroscopico e microscopico."
    en: "Distinguish dry, wet and gas gangrene by cause, mechanism, and gross and microscopic appearance."
  - it: "Elencare le cause principali di gangrena degli arti (aterosclerosi, embolia, diabete, vasculopatie dei piccoli vasi, congelamento) e dell'intestino."
    en: "List the main causes of limb gangrene (atherosclerosis, embolism, diabetes, small-vessel disease, frostbite) and of bowel gangrene."
  - it: "Descrivere l'azione della tossina α di Clostridium perfringens e spiegare perché nella gangrena gassosa i neutrofili sono scarsi."
    en: "Describe the action of Clostridium perfringens α toxin and why neutrophils are scarce in gas gangrene."
  - it: "Riconoscere l'aspetto dell'intestino infartuato e collegarlo all'occlusione arteriosa o venosa mesenterica."
    en: "Recognize the appearance of infarcted bowel and link it to mesenteric arterial or venous occlusion."
prerequisites: [coagulative-necrosis, liquefactive-necrosis]
relations:
  - type: sharesMechanism
    target: coagulative-necrosis
    note:
      it: "La gangrena secca è una necrosi coagulativa ischemica su vasta scala."
      en: "Dry gangrene is ischemic coagulative necrosis on a large scale."
  - type: sharesMechanism
    target: infarction
    note:
      it: "La gangrena secca di un arto è in sostanza un grande infarto pallido."
      en: "Dry gangrene of a limb is essentially a large pale infarct."
  - type: complicationOf
    target: atherosclerosis
    note:
      it: "La trombosi su placca nelle arterie degli arti inferiori o in quelle mesenteriche causa gangrena."
      en: "Thrombosis on a plaque in leg or mesenteric arteries causes gangrene."
  - type: prerequisiteOf
    target: clostridial-myonecrosis
    note:
      it: "La gangrena gassosa è la forma clostridica di gangrena."
      en: "Gas gangrene is the clostridial form of gangrene."
  - type: prerequisiteOf
    target: diabetic-foot-gangrene
    note:
      it: "La gangrena del piede diabetico nasce dall'insieme di arteriopatia periferica, neuropatia e infezione."
      en: "Diabetic foot gangrene arises from peripheral arterial disease, neuropathy and infection."
  - type: sameLesionOtherOrgan
    target: ischemic-bowel-disease
    note:
      it: "L'infarto intestinale transmurale è la gangrena dell'intestino."
      en: "Transmural bowel infarction is gangrene of the gut."
quickCheck:
  - id: gangrene-q1
    q:
      it: "Che tipo di necrosi si osserva al microscopio in una gangrena secca del piede?"
      en: "What type of necrosis is seen under the microscope in dry gangrene of the foot?"
    a:
      it: "Necrosi coagulativa: la gangrena secca è in sostanza un grande infarto pallido da occlusione arteriosa."
      en: "Coagulative necrosis: dry gangrene is essentially a large pale infarct caused by arterial occlusion."
    kind: short
  - id: gangrene-q2
    q:
      it: "Che cosa trasforma una gangrena secca in gangrena umida?"
      en: "What turns dry gangrene into wet gangrene?"
    a:
      it: "La sovrainfezione batterica del tessuto morto: i neutrofili richiamati liberano enzimi che lo colliquano, fino alla formazione di un ascesso."
      en: "Bacterial infection of the dead tissue: recruited neutrophils release enzymes that liquefy it, up to an abscess."
    kind: short
  - id: gangrene-q3
    q:
      it: "Quale tossina causa la gangrena gassosa e come agisce?"
      en: "Which toxin causes gas gangrene and how does it act?"
    a:
      it: "La tossina α di Clostridium perfringens (tipo A), una fosfolipasi (lecitinasi) che distrugge le membrane delle fibre muscolari, dei leucociti e degli eritrociti."
      en: "Clostridium perfringens (type A) α toxin, a phospholipase (lecithinase) that destroys the membranes of muscle fibers, leukocytes and red cells."
    kind: short
  - id: gangrene-q4
    q:
      it: "Perché nella gangrena gassosa i neutrofili sono scarsi, a differenza di quanto avviene nella gangrena umida?"
      en: "Why are neutrophils scarce in gas gangrene, unlike in wet gangrene?"
    a:
      it: "Perché la tossina clostridica distrugge verosimilmente anche i leucociti."
      en: "Because the clostridial toxin probably destroys leukocytes as well."
    kind: short
selfExplain:
  - it: "Perché la gangrena secca resta asciutta e ben delimitata, mentre l'infezione batterica la rende umida e colliquata?"
    en: "Why does dry gangrene stay dry and well demarcated, whereas bacterial infection makes it wet and liquefied?"
  - it: "Perché la gangrena gassosa può distruggere anche un muscolo con un normale apporto di sangue?"
    en: "Why can gas gangrene destroy muscle that had a normal blood supply?"
  - it: "Perché la trombosi di una vena mesenterica può portare a un infarto intestinale anche quando le arterie sono pervie?"
    en: "Why can thrombosis of a mesenteric vein lead to bowel infarction even though the arteries are open?"
chain:
  - pathology:
      it: "Occlusione embolica di un'arteria dell'arto inferiore con necrosi ischemica"
      en: "Embolic occlusion of a leg artery with ischemic necrosis"
    sign:
      it: "Arto freddo, doloroso e senza polsi"
      en: "Cold, painful, pulseless limb"
    lab:
      it: "Diagnosi clinica; il tessuto amputato mostra necrosi coagulativa"
      en: "Clinical diagnosis; amputated tissue shows coagulative necrosis"
  - pathology:
      it: "Mionecrosi clostridica con emolisi da tossina α"
      en: "Clostridial myonecrosis with α-toxin hemolysis"
    sign:
      it: "Dolore improvviso e intenso alla ferita, cute scura e secrezione maleodorante con bolle di gas"
      en: "Sudden severe wound pain, darkened skin and foul discharge with gas bubbles"
    lab:
      it: "Bacilli gram-positivi con pochi neutrofili; anemia emolitica"
      en: "Gram-positive rods with few neutrophils; hemolytic anemia"
  - pathology:
      it: "Infarto intestinale da occlusione arteriosa mesenterica"
      en: "Bowel infarction from mesenteric arterial occlusion"
    sign:
      it: "Addome acuto, talvolta preceduto da angina addominale"
      en: "Acute abdomen, sometimes preceded by abdominal angina"
    lab:
      it: "Gas nella parete intestinale e nelle vene mesenteriche"
      en: "Gas in the bowel wall and mesenteric veins"
