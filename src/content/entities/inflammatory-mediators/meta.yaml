quickCheck:
  - id: inflammatory-mediators-q1
    q:
      it: "Quale fattore collega le cascate della coagulazione, delle chinine e del complemento?"
      en: "Which factor links the coagulation, kinin and complement cascades?"
    a:
      it: "Il fattore XII (fattore di Hageman) attivato."
      en: "Activated factor XII (Hageman factor)."
    kind: short
  - id: inflammatory-mediators-q2
    q:
      it: "Quali prodotti dell'acido arachidonico bloccano l'aspirina e i FANS?"
      en: "Which arachidonic acid products do aspirin and NSAIDs block?"
    a:
      it: "Bloccano la ciclossigenasi, quindi i prostanoidi, ma non i leucotrieni né le lipossine."
      en: "They block cyclooxygenase, so the prostanoids, but not the leukotrienes or lipoxins."
    kind: short
  - id: inflammatory-mediators-q3
    q:
      it: "Quali tre citochine sono i pirogeni endogeni?"
      en: "Which three cytokines are the endogenous pyrogens?"
    a:
      it: "IL-1, IL-6 e TNFα."
      en: "IL-1, IL-6 and TNFα."
    kind: short
