learningObjectives:
  - it: "Distinguere i mediatori derivati dal plasma da quelli derivati dalle cellule."
    en: "Tell plasma-derived mediators from cell-derived mediators."
  - it: "Elencare i principali mediatori: ammine vasoattive, metaboliti dell'acido arachidonico, citochine e chemochine, complemento, chinine e ossido nitrico."
    en: "List the main mediators: vasoactive amines, arachidonic acid metabolites, cytokines and chemokines, complement, kinins and nitric oxide."
  - it: "Spiegare come il fattore XII colleghi coagulazione, chinine e complemento."
    en: "Explain how factor XII links coagulation, kinins and complement."
