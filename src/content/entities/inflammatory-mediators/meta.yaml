summary:
  it: "Segnali chimici, derivati dal plasma o dalle cellule, che dilatano i vasi, ne aumentano la permeabilità e richiamano le cellule infiammatorie nella sede del danno."
  en: "Chemical signals, derived from plasma or from cells, that dilate vessels, raise their permeability and recruit inflammatory cells to the site of injury."
