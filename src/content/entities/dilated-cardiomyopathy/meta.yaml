summary:
  it: "Malattia primitiva del miocardio con dilatazione di entrambi i ventricoli e contrattilità ridotta, che evolve verso lo scompenso cardiaco; può essere genetica o secondaria ad alcol, farmaci, gravidanza o miocardite."
  en: "Primary disease of the heart muscle with dilation of both ventricles and impaired contractility, progressing to heart failure; it may be genetic or secondary to alcohol, drugs, pregnancy or myocarditis."
lenses:
  system: [heart]
  process: [cell-injury, chronic-inflammation]
