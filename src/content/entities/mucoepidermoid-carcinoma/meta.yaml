relations:
  - type: differentialOf
    target: adenoid-cystic-carcinoma
    note:
      it: "Entrambi sono tumori maligni delle ghiandole salivari, ma l'adenoide cistico ha la fusione MYB-NFIB."
      en: "Both are malignant salivary tumors, but adenoid cystic carcinoma has the MYB-NFIB fusion."
  - type: differentialOf
