learningObjectives:
  - it: "Riconoscere le tre popolazioni cellulari del carcinoma mucoepidermoide: cellule mucipare, epidermoidi e intermedie."
    en: "Recognize the three cell populations of mucoepidermoid carcinoma: mucus-secreting, epidermoid and intermediate cells."
  - it: "Descrivere come cambia il quadro istologico dal basso all'alto grado."
    en: "Describe how the histologic picture changes from low to high grade."
  - it: "Indicare la traslocazione t(11;19) e la fusione MECT1-MAML2."
    en: "State the t(11;19) translocation and the MECT1-MAML2 fusion."
