      it: "Tumore benigno della parotide con cisti rivestite da oncociti e tessuto linfoide."
      en: "Benign parotid tumor with oncocyte-lined cysts and lymphoid tissue."
quickCheck:
  - id: mucoepidermoid-carcinoma-q1
    q:
      it: "Quali tre tipi cellulari formano il carcinoma mucoepidermoide?"
      en: "Which three cell types make up mucoepidermoid carcinoma?"
    a:
      it: "Cellule mucipare, cellule epidermoidi e cellule intermedie."
      en: "Mucus-secreting, epidermoid and intermediate cells."
    kind: short
  - id: mucoepidermoid-carcinoma-q2
    q:
      it: "Quale fusione genica è caratteristica e da quale traslocazione deriva?"
      en: "Which gene fusion is characteristic, and which translocation produces it?"
    a:
      it: "La fusione MECT1-MAML2, prodotta dalla t(11;19)."
      en: "The MECT1-MAML2 fusion, produced by t(11;19)."
    kind: short
  - id: mucoepidermoid-carcinoma-q3
    q:
      it: "In che modo il grado determina la terapia?"
      en: "How does grade determine treatment?"
    a:
      it: "I tumori di basso grado si trattano con la chirurgia; quelli di alto grado richiedono chirurgia e radioterapia."
      en: "Low-grade tumors are treated with surgery; high-grade tumors need surgery plus radiation therapy."
    kind: short
  - id: mucoepidermoid-carcinoma-q4
    q:
      it: "Le cellule epidermoidi producono cheratina?"
      en: "Do the epidermoid cells make keratin?"
    a:
      it: "No: somigliano a cellule squamose, ma non producono cheratina e non mostrano ponti intercellulari."
      en: "No: they resemble squamous cells but make no keratin and show no bridges between cells."
    kind: short
