summary:
  it: "Tumore maligno delle ghiandole salivari che origina dall'epitelio duttale ed è formato da cellule mucipare, epidermoidi e intermedie; spesso porta la fusione MECT1-MAML2, e il grado istologico guida prognosi e terapia."
  en: "Malignant salivary gland tumor arising from ductal epithelium and made of mucus-secreting, epidermoid and intermediate cells; it often carries the MECT1-MAML2 fusion, and histologic grade guides prognosis and treatment."
