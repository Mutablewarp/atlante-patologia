summary:
  it: La colecistite è l'infiammazione della colecisti, acuta (di solito calcolotica) o cronica, con complicanze come empiema, gangrena e perforazione.
  en: Cholecystitis is inflammation of the gallbladder, acute (usually calculous) or chronic, with complications such as empyema, gangrene and perforation.
learningObjectives:
  - it: Distinguere la colecistite acuta calcolotica da quella alitiasica.
    en: Distinguish calculous from acalculous acute cholecystitis.
  - it: Spiegare come l'ostruzione del dotto cistico danneggia la mucosa.
    en: Explain how cystic duct obstruction injures the mucosa.
  - it: Descrivere le complicanze della colecistite acuta (empiema, gangrena, perforazione).
    en: Describe the complications of acute cholecystitis (empyema, gangrene, perforation).
  - it: Riconoscere la colecistite cronica, la colecisti a porcellana e la colesterolosi.
    en: Recognize chronic cholecystitis, porcelain gallbladder and cholesterolosis.
