quickCheck:
  - id: cholecystitis-q1
    q:
      it: Quale percentuale di colecistiti acute è associata a calcoli?
      en: What share of acute cholecystitis is associated with gallstones?
    a:
      it: Circa il 90%; il resto è alitiasico.
      en: About 90%; the rest is acalculous.
    kind: short
  - id: cholecystitis-q2
    q:
      it: Quale reperto microscopico caratterizza la colecistite cronica?
      en: Which microscopic finding characterizes chronic cholecystitis?
    a:
      it: Parete fibrotica infiammata attraversata dai seni di Rokitansky-Aschoff.
      en: A fibrotic, inflamed wall penetrated by Rokitansky-Aschoff sinuses.
    kind: short
  - id: cholecystitis-q3
    q:
      it: Quali sono le complicanze gravi della colecistite acuta batterica?
      en: What are the severe complications of bacterial acute cholecystitis?
    a:
      it: Empiema, gangrena e perforazione.
      en: Empyema, gangrene and perforation.
    kind: free
  - id: cholecystitis-q4
    q:
      it: Che cos'è la colecisti a porcellana?
      en: What is a porcelain gallbladder?
    a:
      it: È la calcificazione della parete dopo un'infiammazione di lunga durata.
      en: It is calcification of the wall after long-standing inflammation.
    kind: short
selfExplain:
  - it: Perché un calcolo nel dotto cistico danneggia la mucosa della colecisti?
    en: Why does a stone in the cystic duct damage the gallbladder mucosa?
  - it: Perché la colesterolosi di solito non dà sintomi?
    en: Why does cholesterolosis usually cause no symptoms?
  - it: Perché l'ostruzione biliare di solito precede l'infezione batterica nella colecistite acuta?
    en: Why does biliary obstruction usually come before bacterial infection in acute cholecystitis?
