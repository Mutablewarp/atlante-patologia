learningObjectives:
  - it: "Definire la malattia di Kawasaki come vasculite necrotizzante acuta dell'infanzia e ricordarne il nome alternativo."
    en: "Define Kawasaki disease as an acute necrotizing vasculitis of childhood and recall its alternative name."
  - it: "Elencare le manifestazioni cliniche principali: febbre, esantema, lesioni congiuntivali e orali, linfoadenite."
    en: "List the main clinical features: fever, rash, conjunctival and oral lesions, lymphadenitis."
  - it: "Descrivere gli aneurismi coronarici e le lesioni della lamina elastica interna."
    en: "Describe the coronary aneurysms and the defects of the internal elastic lamina."
  - it: "Spiegare il ruolo ipotizzato dei superantigeni nella patogenesi."
    en: "Explain the proposed role of superantigens in pathogenesis."
