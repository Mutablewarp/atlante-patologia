summary:
  it: "Vasculite necrotizzante acuta dell'infanzia che colpisce soprattutto le arterie coronarie e può causare aneurismi coronarici."
  en: "Acute necrotizing vasculitis of early childhood that mainly targets the coronary arteries and can cause coronary aneurysms."
