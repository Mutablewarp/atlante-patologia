    target: anca-associated-vasculitis
    note:
      it: "La sindrome di Churg–Strauss colpisce giovani con asma e ricchi eosinofili, non bambini con aneurismi coronarici."
      en: "Churg–Strauss syndrome affects young people with asthma and many eosinophils, not young children with coronary aneurysms."
  - type: differentialOf
    target: thromboangiitis-obliterans
    note:
      it: "La malattia di Buerger è una vasculite occlusiva delle arterie distali dei fumatori."
