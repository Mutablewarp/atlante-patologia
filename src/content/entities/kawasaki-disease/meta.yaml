    en: "What do you see under the microscope in a coronary artery from a fatal case of Kawasaki disease, and what complication results?"
    focus: [micro, prognosis]
    level: 2
  - it: "Perché si sospetta che un superantigene possa avere un ruolo nella malattia di Kawasaki?"
    en: "Why is a superantigen suspected to play a role in Kawasaki disease?"
    focus: [etiology, pathogenesis]
    level: 3
