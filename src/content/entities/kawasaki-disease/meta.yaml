quickCheck:
  - id: kawasaki-disease-q1
    q:
      it: "Quale vaso è il bersaglio principale della malattia di Kawasaki e quale lesione ne è la complicanza tipica?"
      en: "Which vessels are the main target of Kawasaki disease, and what is its typical complication?"
    a:
      it: "Le arterie coronarie; la complicanza tipica è l'aneurisma coronarico."
      en: "The coronary arteries; the typical complication is a coronary aneurysm."
    kind: short
  - id: kawasaki-disease-q2
    q:
      it: "Che cos'è un superantigene e perché è un candidato come trigger?"
      en: "What is a superantigen, and why is it a candidate trigger?"
    a:
      it: "Una molecola virale o batterica che lega il MHC di classe II e la regione Vβ del recettore T e attiva in massa la risposta immune."
      en: "A viral or bacterial molecule that binds MHC class II and the Vβ region of the T-cell receptor and strongly activates the immune response."
    kind: short
  - id: kawasaki-disease-q3
    q:
      it: "Che cosa mostra al microscopio una sezione di coronaria in un caso fatale?"
      en: "What does a coronary section from a fatal case show under the microscope?"
    a:
      it: "Ampi difetti della lamina elastica interna con piccoli aneurismi pieni di trombo."
      en: "Large defects in the internal elastic lamina, with small thrombus-filled aneurysms."
    kind: short
selfExplain:
  - it: "Perché l'attivazione massiva dei linfociti T da parte di un superantigene può danneggiare la parete coronarica?"
    en: "Why can massive T-cell activation by a superantigen damage the coronary wall?"
  - it: "Perché un difetto della lamina elastica interna favorisce la formazione di un aneurisma?"
    en: "Why does a defect in the internal elastic lamina favor aneurysm formation?"
