summary:
  it: "Accumulo di liquido nella cavità pleurica (idrotorace, piotorace ed empiema, emotorace, chilotorace), spesso accompagnato da pleurite, da distinguere dallo pneumotorace, che è aria nello spazio pleurico."
  en: "Accumulation of fluid in the pleural cavity (hydrothorax, pyothorax and empyema, hemothorax, chylothorax), often with pleuritis, to be told apart from pneumothorax, which is air in the pleural space."
