learningObjectives:
  - it: "Definire il versamento pleurico e distinguere idrotorace, piotorace, empiema, emotorace e chilotorace in base all'aspetto del liquido."
    en: "Define pleural effusion and tell hydrothorax, pyothorax, empyema, hemothorax and chylothorax apart by the look of the fluid."
  - it: "Collegare ciascun tipo di versamento alle sue cause principali."
    en: "Link each type of effusion to its main causes."
  - it: "Descrivere la pleurite e il dolore toracico inspiratorio che la caratterizza."
    en: "Describe pleuritis and the inspiratory chest pain that marks it."
  - it: "Distinguere lo pneumotorace spontaneo, traumatico e iperteso, e riconoscere la fistola broncopleurica."
    en: "Distinguish spontaneous, traumatic and tension pneumothorax, and recognize a bronchopleural fistula."
