relations:
  - type: complicationOf
    target: pulmonary-infarction
    note:
      it: "Un infarto polmonare che raggiunge la superficie del polmone può causare pleurite e un versamento ematico."
      en: "A pulmonary infarct reaching the lung surface can cause pleuritis and a blood-stained effusion."
  - type: complicationOf
    target: cardiac-hypertrophy-and-heart-failure
    note:
      it: "L'insufficienza cardiaca aumenta la pressione idrostatica capillare e può dare idrotorace."
      en: "Heart failure raises capillary hydrostatic pressure and can produce hydrothorax."
  - type: complicationOf
    target: bacterial-pneumonia
    note:
      it: "Una polmonite batterica che raggiunge la superficie pleurica può dare piotorace."
      en: "A bacterial pneumonia reaching the pleural surface can cause pyothorax."
quickCheck:
  - id: pleural-effusion-and-pleural-fluid-cytology-q1
    q:
      it: "Quali due meccanismi producono un idrotorace?"
      en: "Which two mechanisms produce hydrothorax?"
    a:
      it: "Un aumento della pressione idrostatica capillare (per esempio nello scompenso cardiaco) o una bassa pressione oncotica sierica (per esempio nella sindrome nefrosica, nella cirrosi o nella denutrizione grave)."
      en: "Raised capillary hydrostatic pressure (for example in heart failure) or low serum oncotic pressure (for example in nephrotic syndrome, cirrhosis or severe starvation)."
    kind: short
  - id: pleural-effusion-and-pleural-fluid-cytology-q2
    q:
      it: "Che differenza c'è tra piotorace ed empiema?"
      en: "What is the difference between pyothorax and empyema?"
    a:
      it: "Il piotorace è un versamento torbido ricco di neutrofili; l'empiema è la sua variante con pus denso, spesso saccato e con fibrosi."
      en: "Pyothorax is a turbid, neutrophil-rich effusion; empyema is its variant with thick pus, often loculated and with fibrosis."
    kind: short
  - id: pleural-effusion-and-pleural-fluid-cytology-q3
    q:
      it: "Perché un chilotorace è un reperto preoccupante?"
      en: "Why is chylothorax a worrying finding?"
    a:
      it: "Perché indica un'ostruzione linfatica, che fa pensare a una malattia dei linfonodi del mediastino posteriore, come un linfoma."
      en: "Because it signals lymphatic obstruction, which suggests disease of the posterior mediastinal lymph nodes, such as lymphoma."
    kind: short
  - id: pleural-effusion-and-pleural-fluid-cytology-q4
    q:
      it: "Qual è la causa abituale dello pneumotorace spontaneo?"
      en: "What usually causes spontaneous pneumothorax?"
    a:
      it: "La rottura di una bolla enfisematosa sottopleurica."
      en: "Rupture of a subpleural emphysematous bleb."
    kind: short
