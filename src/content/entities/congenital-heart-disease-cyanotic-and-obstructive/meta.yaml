  - it: "Come distingue la stenosi aortica da valvola bicuspide congenita da quella calcifica dell'adulto, e quali sindromi si associano alle stenosi polmonare e aortica?"
    en: "How do you place congenital bicuspid aortic stenosis next to calcific aortic stenosis, and which syndromes go with pulmonary and aortic stenosis?"
    focus: [etiology, clinical, differential]
