    focus: [gross, pathogenesis, clinical]
    level: 1
  - it: "Perché nella trasposizione delle grandi arterie il neonato sopravvive solo se esiste una comunicazione tra i due circoli?"
    en: "Why does a newborn with transposition of the great arteries survive only if a communication joins the two circuits?"
    focus: [pathogenesis, high-yield]
    level: 2
  - it: "Mi parli della coartazione aortica: come si presenta e che cosa vede alla radiografia?"
    en: "Tell me about coarctation of the aorta: how does it present, and what do you see on the chest film?"
    focus: [clinical, diagnosis]
    level: 1
  - it: "Perché un neonato con ipoplasia del cuore sinistro può apparire sano alla nascita e che ruolo ha il dotto arterioso?"
