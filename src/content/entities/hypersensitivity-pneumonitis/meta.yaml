learningObjectives:
  - it: "Elencare i principali antigeni inalati responsabili e le malattie professionali che ne derivano."
    en: "List the main inhaled antigens and the occupational diseases they cause."
  - it: "Spiegare il ruolo combinato dell'ipersensibilità di tipo III e di tipo IV."
    en: "Explain the combined role of type III and type IV hypersensitivity."
  - it: "Descrivere l'istologia della forma cronica: infiltrato interstiziale bronchiolocentrico, granulomi mal formati non caseosi, polmonite organizzativa."
    en: "Describe the histology of the chronic form: bronchiolocentric interstitial infiltrate, poorly formed noncaseating granulomas, organizing pneumonia."
  - it: "Distinguere la forma acuta da quella cronica fibrosante per clinica, istologia e necessità di biopsia."
    en: "Tell the acute form from the chronic fibrosing form by clinical picture, histology and need for biopsy."
