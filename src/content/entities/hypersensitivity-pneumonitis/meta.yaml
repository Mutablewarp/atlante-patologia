summary:
  it: "Reazione immunitaria del polmone ad antigeni inalati, con infiammazione interstiziale acuta o cronica centrata sui bronchioli, granulomi mal formati e, nella fase finale, fibrosi."
  en: "Immune reaction of the lung to inhaled antigens, with acute or chronic interstitial inflammation centered on bronchioles, poorly formed granulomas and, in the end stage, fibrosis."
