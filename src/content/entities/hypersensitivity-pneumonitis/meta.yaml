relations:
  - type: sharesMechanism
    target: hypersensitivity-reactions
    note:
      it: "Combina ipersensibilità da immunocomplessi (tipo III) e cellulo-mediata (tipo IV)."
      en: "Combines immune complex (type III) and cell-mediated (type IV) hypersensitivity."
  - type: differentialOf
    target: sarcoidosis
    note:
      it: "Entrambe sono malattie granulomatose polmonari; qui un antigene inalato è la causa."
      en: "Both are granulomatous lung diseases; here an inhaled antigen is the cause."
  - type: differentialOf
    target: idiopathic-pulmonary-fibrosis
    note:
      it: "La fibrosi terminale può assomigliare alla polmonite interstiziale usuale."
      en: "End-stage fibrosis can resemble usual interstitial pneumonia."
quickCheck:
  - id: hypersensitivity-pneumonitis-q1
    q:
      it: "Quali due tipi di ipersensibilità si combinano nella polmonite da ipersensibilità?"
      en: "Which two types of hypersensitivity combine in hypersensitivity pneumonitis?"
    a:
      it: "Il tipo III (da immunocomplessi) e il tipo IV (cellulo-mediato); il contributo di ciascuno è ancora discusso."
      en: "Type III (immune complex) and type IV (cell-mediated); the share of each is still debated."
    kind: short
  - id: hypersensitivity-pneumonitis-q2
    q:
      it: "Quali sono i tre reperti istologici della forma cronica?"
      en: "What are the three histologic findings of the chronic form?"
    a:
      it: "Polmonite interstiziale cellulare bronchiolocentrica, granulomi non caseosi mal formati e polmonite organizzativa."
      en: "Bronchiolocentric cellular interstitial pneumonia, poorly formed noncaseating granulomas and organizing pneumonia."
    kind: short
  - id: hypersensitivity-pneumonitis-q3
    q:
      it: "Qual è l'unico trattamento adeguato?"
      en: "What is the only adequate treatment?"
    a:
      it: "Rimuovere l'antigene responsabile; gli steroidi possono aiutare nelle forme acute e in alcune croniche."
      en: "Removing the offending antigen; steroids may help in acute forms and in some chronic cases."
    kind: short
  - id: hypersensitivity-pneumonitis-q4
    q:
      it: "Qual è la malattia prototipo e quando compaiono i sintomi dopo l'esposizione?"
      en: "Which disease is the prototype, and when do symptoms start after exposure?"
    a:
      it: "Il polmone del contadino, causato dal fieno ammuffito; i sintomi compaiono 4-6 ore dopo l'ingresso nel fienile."
      en: "Farmer's lung, caused by moldy hay; symptoms begin 4 to 6 hours after entering the barn."
    kind: short
