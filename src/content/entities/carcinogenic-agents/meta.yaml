summary:
  it: "Agenti chimici, fisici e infettivi (fumo, aflatossina, raggi UV, amianto, virus oncogeni, Helicobacter pylori) che danneggiano i geni della cellula e ne avviano la trasformazione tumorale."
  en: "Chemical, physical and infectious agents (smoke, aflatoxin, UV light, asbestos, oncogenic viruses, Helicobacter pylori) that damage cellular genes and start tumor development."
