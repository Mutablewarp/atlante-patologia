learningObjectives:
  - it: "Elencare i principali cancerogeni chimici, fisici e biologici."
    en: "List the main chemical, physical and biological carcinogens."
  - it: "Associare ogni virus oncogeno al tumore umano che causa."
    en: "Match each oncogenic virus with the human tumor it causes."
  - it: "Spiegare perché la maggior parte dei cancerogeni chimici richiede attivazione metabolica."
    en: "Explain why most chemical carcinogens need metabolic activation."
  - it: "Descrivere come si valuta il potenziale cancerogeno di un agente."
    en: "Describe how the carcinogenic potential of an agent is assessed."
