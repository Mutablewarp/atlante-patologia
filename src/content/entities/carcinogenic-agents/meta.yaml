quickCheck:
  - id: carcinogenic-agents-q1
    q:
      it: "Perché molti cancerogeni chimici poco reattivi sono comunque potenti?"
      en: "Why are many chemically inert carcinogens still potent?"
    a:
      it: "Perché la maggior parte è procancerogena: enzimi la trasformano in una forma più reattiva, come gli epossidi."
      en: "Because most are procarcinogens: enzymes convert them into a more reactive form, such as epoxides."
    kind: short
  - id: carcinogenic-agents-q2
    q:
      it: "Quale lesione del DNA è tipica dei raggi UV?"
      en: "Which DNA lesion is typical of UV light?"
    a:
      it: "I dimeri di pirimidina, che nessun altro cancerogeno causa."
      en: "Pyrimidine dimers, which no other carcinogen causes."
    kind: short
  - id: carcinogenic-agents-q3
    q:
      it: "Quale virus oncogeno è un retrovirus e quale tumore causa?"
      en: "Which oncogenic virus is a retrovirus, and which tumor does it cause?"
    a:
      it: "HTLV-1, che causa la leucemia/linfoma a cellule T dell'adulto."
      en: "HTLV-1, which causes adult T-cell leukemia/lymphoma."
    kind: short
  - id: carcinogenic-agents-q4
    q:
      it: "Quale saggio si usa per lo screening della mutagenicità delle sostanze chimiche?"
      en: "Which assay is used to screen chemicals for mutagenicity?"
    a:
      it: "Il test di Ames: la cancerogenicità segue la mutagenicità, quindi i saggi di mutagenicità servono da screening."
      en: "The Ames test: carcinogenicity tracks mutagenicity, so mutagenicity assays screen chemicals."
    kind: short
  - id: carcinogenic-agents-q5
    q:
      it: "L'infezione da HHV8 basta da sola a causare il sarcoma di Kaposi?"
      en: "Is HHV8 infection alone enough to cause Kaposi sarcoma?"
    a:
      it: "No. Il sarcoma di Kaposi sembra richiedere HHV8, ma il virus da solo non basta."
      en: "No. Kaposi sarcoma seems to need HHV8, but the virus alone is not enough."
    kind: short
selfExplain:
  - it: "Perché l'infezione da HHV8 non porta sempre al sarcoma di Kaposi?"
    en: "Why does HHV8 infection not always lead to Kaposi sarcoma?"
  - it: "Perché un mutageno non è sempre un cancerogeno?"
    en: "Why is a mutagen not always a carcinogen?"
examQuestions:
