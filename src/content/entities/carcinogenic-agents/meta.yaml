    en: "Tell me about the main chemical and physical carcinogens and the tumors they cause."
    focus: [definition, high-yield]
    level: 1
  - it: "Mi parli dei virus oncogeni: quali tumori umani causano e come agiscono i virus a DNA?"
    en: "Tell me about the oncogenic viruses: which human tumors do they cause, and how do DNA viruses act?"
    focus: [definition, differential]
    level: 2
  - it: "Come si dimostra che un agente è cancerogeno, e perché è difficile nell'uomo?"
    en: "How do you show that an agent is carcinogenic, and why is it hard in humans?"
    focus: [diagnosis]
    level: 3
