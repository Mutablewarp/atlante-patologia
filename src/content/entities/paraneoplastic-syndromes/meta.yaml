  system: [general, endocrine, skin]
  process: [neoplasia]
  pattern: []
  presentation: [hypercalcemia]
  marker: [laboratory]
  group: [neoplastic]
learningObjectives:
  - it: "Definire una sindrome paraneoplastica e distinguerla dall'invasione o dalle metastasi."
    en: "Define a paraneoplastic syndrome and distinguish it from invasion or metastasis."
  - it: "Collegare ACTH ectopico, ADH e peptide simile al paratormone ai tumori che li producono."
    en: "Link ectopic ACTH, ADH and the parathormone-like peptide to the tumors that make them."
  - it: "Riconoscere acantosi nigricans, dermatomiosite e sindrome di Sweet come segni cutanei di tumore."
    en: "Recognize acanthosis nigricans, dermatomyositis and Sweet syndrome as skin signs of cancer."
  - it: "Distinguere la cachessia neoplastica dal digiuno."
    en: "Distinguish cancer cachexia from starvation."
