summary:
  it: "Effetti a distanza di un tumore non dovuti a invasione o metastasi, come sindromi endocrine, cutanee e cachessia, che possono essere la prima manifestazione del cancro."
  en: "Remote effects of a tumor not caused by invasion or metastasis, such as endocrine and skin syndromes and cachexia, which may be the first sign of cancer."
