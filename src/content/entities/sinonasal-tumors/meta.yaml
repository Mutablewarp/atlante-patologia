  - it: "Che cosa vede al microscopio in un neuroblastoma olfattivo e quali colorazioni userebbe per confermarlo?"
    en: "What do you see under the microscope in an olfactory neuroblastoma, and which stains would you use to confirm it?"
    focus: [micro, ancillary]
    level: 2
  - it: "Perché nel linfoma NK/T di tipo nasale compare necrosi dei tessuti vicini?"
    en: "Why does nasal-type NK/T-cell lymphoma cause necrosis of the adjacent tissue?"
    focus: [pathogenesis, micro]
    level: 2
  - it: "Come distingue un linfoma NK/T nasale da una granulomatosi con poliangioite?"
