learningObjectives:
  - it: "Descrivere la morfologia della pancreatite cronica: fibrosi, atrofia acinare e dotti dilatati con tappi calcificati."
    en: "Describe the morphology of chronic pancreatitis: fibrosis, acinar atrophy and dilated ducts with calcified plugs."
  - it: "Spiegare come l'alcol favorisce la formazione di tappi proteici e il circolo vizioso verso la fibrosi."
    en: "Explain how alcohol promotes protein plugs and the vicious circle toward fibrosis."
  - it: "Distinguere le forme alcolica, ereditaria (PRSS1), da fibrosi cistica e autoimmune di tipo 1 e 2."
    en: "Distinguish the alcoholic, hereditary (PRSS1), cystic fibrosis and autoimmune type 1 and 2 forms."
  - it: "Elencare le complicanze e riconoscere le forme che simulano un carcinoma pancreatico."
    en: "List the complications and recognize the forms that mimic pancreatic carcinoma."
