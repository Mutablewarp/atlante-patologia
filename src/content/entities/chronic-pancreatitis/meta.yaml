summary:
  it: "Distruzione progressiva del parenchima pancreatico con sostituzione fibrosa, causata soprattutto dall'alcol, ma anche da fattori genetici e autoimmuni (tipo IgG4)."
  en: "Progressive destruction of pancreatic parenchyma with fibrous replacement, caused mainly by alcohol but also by genetic and autoimmune (IgG4) factors."
