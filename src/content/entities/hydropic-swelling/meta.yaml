id: hydropic-swelling
module: g01
tier: core
kind: process
names:
  it: "Rigonfiamento idropico (degenerazione idropica)"
  en: "Hydropic (cellular) swelling"
  eponyms: []
  synonyms:
    it: ["Rigonfiamento cellulare", "Degenerazione idropica", "Degenerazione vacuolare", "Rigonfiamento torbido (termine storico)", "Tumefazione torbida (termine storico)"]
    en: ["Cellular swelling", "Hydropic change", "Hydropic degeneration", "Vacuolar degeneration", "Cloudy swelling (historical term)"]
  abbreviations: []
summary:
  it: "Aumento reversibile del volume cellulare per ingresso di acqua, causato dall'insufficienza della pompa Na+/K+ e dalla perdita del controllo ionico di membrana."
  en: "Reversible increase in cell volume from water influx, caused by failure of the Na+/K+ pump and of membrane ion control."
lenses:
  system: [general]
  process: [cell-injury, reversible-injury, hypoxic-ischemic-injury]
  pattern: [cellular-swelling]
  presentation: []
  marker: []
  group: [degenerative]
learningObjectives:
  - it: "Spiegare come un difetto della membrana plasmatica, della pompa Na+/K+-ATPasi o della produzione di ATP porti all'ingresso di acqua nella cellula."
    en: "Explain how failure of the plasma membrane, the Na+/K+-ATPase or ATP supply leads to water entering the cell."
  - it: "Descrivere l'aspetto al microscopio ottico e le alterazioni ultrastrutturali del rigonfiamento idropico."
    en: "Describe the light-microscopic appearance and the ultrastructural changes of hydropic swelling."
  - it: "Distinguere il rigonfiamento idropico (reversibile) dalla steatosi e dalla necrosi coagulativa (irreversibile)."
    en: "Distinguish hydropic swelling (reversible) from fatty change and from coagulative necrosis (irreversible)."
  - it: "Riconoscere esempi d'organo: fegato, edema cerebrale citotossico, epitelio esofageo."
    en: "Recognize organ examples: liver, cytotoxic cerebral edema, esophageal epithelium."
  - it: "Spiegare come si studia il rigonfiamento idropico: che cosa cercare in ematossilina-eosina, quali colorazioni escludono glicogeno e grassi e che cosa aggiunge la microscopia elettronica."
    en: "Explain how hydropic swelling is studied: what to look for on H&E, which stains rule out glycogen and fat, and what electron microscopy adds."
prerequisites: []
relations:
  - type: differentialOf
    target: fatty-change
    note:
      it: "Entrambe reversibili: citoplasma pallido e diffusamente rigonfio contro vacuoli lipidici distinti."
      en: "Both reversible: diffusely swollen pale cytoplasm versus discrete lipid vacuoles."
  - type: differentialOf
    target: coagulative-necrosis
    note:
      it: "Danno reversibile e morte cellulare a confronto: nucleo normale nel primo; picnosi, carioressi e cariolisi nella seconda."
      en: "Reversible injury versus cell death: normal nucleus versus pyknosis, karyorrhexis and karyolysis."
quickCheck:
  - id: hydropic-swelling-q1
    q:
      it: "Quali tre elementi, se compromessi, portano al rigonfiamento idropico?"
      en: "Which three components, when they fail, lead to hydropic swelling?"
    a:
      it: "La membrana plasmatica, la pompa del sodio (Na+/K+-ATPasi) e l'ATP che la alimenta."
      en: "The plasma membrane, the sodium pump (Na+/K+-ATPase) and the ATP that fuels it."
    kind: short
  - id: hydropic-swelling-q2
    q:
      it: "Al microscopio elettronico, in quale compartimento si raccoglie la maggior parte dell'acqua in eccesso?"
      en: "In which compartment does most of the excess water collect on electron microscopy?"
    a:
      it: "Nelle cisterne del reticolo endoplasmatico, che appaiono dilatate."
      en: "In the endoplasmic reticulum cisternae, which appear dilated."
    kind: short
  - id: hydropic-swelling-q3
    q:
      it: "Quale reperto al microscopio ottico aiuta a distinguere il rigonfiamento idropico dalla necrosi coagulativa?"
      en: "Which light-microscopic finding helps distinguish hydropic swelling from coagulative necrosis?"
    a:
      it: "Nel rigonfiamento idropico il nucleo resta normale e in sede; nella necrosi compaiono picnosi, carioressi o cariolisi e il citoplasma diventa più eosinofilo."
      en: "In hydropic swelling the nucleus stays normal and in place; in necrosis there is pyknosis, karyorrhexis or karyolysis and the cytoplasm becomes more eosinophilic."
    kind: short
  - id: hydropic-swelling-q4
    q:
      it: "Perché l'ischemia provoca rigonfiamento cellulare?"
      en: "Why does ischemia cause cell swelling?"
    a:
      it: "Senza ossigeno la cellula non produce ATP per via aerobica; la pompa Na+/K+ si ferma, il Na+ si accumula e l'acqua lo segue per mantenere l'isosmolarità."
      en: "Without oxygen the cell cannot make ATP aerobically; the Na+/K+ pump stalls, Na+ accumulates and water follows to keep the cell isosmotic."
    kind: free
selfExplain:
  - it: "Perché l'accumulo di sodio, e non l'ingresso diretto di acqua, è l'evento primario del rigonfiamento idropico?"
    en: "Why is sodium accumulation, rather than water entry itself, the primary event in hydropic swelling?"
  - it: "Perché il rigonfiamento idropico è considerato reversibile, mentre la comparsa di alterazioni nucleari indica morte cellulare?"
    en: "Why is hydropic swelling considered reversible, whereas the appearance of nuclear changes signals cell death?"
  - it: "In che modo l'acidosi intracellulare dell'ischemia aggrava prima il carico di sodio e poi quello di calcio?"
    en: "How does intracellular acidosis in ischemia worsen the sodium load and then the calcium load?"
chain: []
examQuestions:
  - it: "Mi parli del rigonfiamento idropico: che cos'è, quali cause lo provocano e perché lo si considera un danno reversibile?"
    en: "Tell me about hydropic swelling: what is it, what causes it, and why is it considered reversible injury?"
    focus: [definition, etiology, prognosis]
    level: 1
  - it: "Perché una cellula ischemica si rigonfia? Mi descriva i passaggi dalla caduta dell'ATP all'ingresso di acqua e al sovraccarico di calcio."
    en: "Why does an ischemic cell swell? Take me through the steps from the fall in ATP to water entry and calcium overload."
    focus: [pathogenesis]
    level: 2
  - it: "Che cosa vede al microscopio ottico in un epatocita con rigonfiamento idropico, e che cosa aggiunge la microscopia elettronica?"
    en: "What do you see under the light microscope in a hepatocyte with hydropic swelling, and what does electron microscopy add?"
    focus: [micro, ancillary]
    level: 1
  - it: "Come distingue il rigonfiamento idropico dalla necrosi coagulativa, dalla steatosi e dall'accumulo di glicogeno, e quali colorazioni userebbe?"
    en: "How do you tell hydropic swelling from coagulative necrosis, fatty change and glycogen accumulation, and which stains would you use?"
    focus: [differential, ancillary, traps]
    level: 3
  - it: "Che cos'è l'edema cerebrale citotossico, in che cosa differisce dall'edema vasogenico e perché l'edema dell'encefalo può essere mortale?"
    en: "What is cytotoxic cerebral edema, how does it differ from vasogenic edema, and why can brain edema be fatal?"
    focus: [clinical, traps, prognosis]
    level: 3
  - it: "In quali malattie del fegato e dell'esofago si osserva il rigonfiamento idropico, e che cosa può dire, e che cosa no, una biopsia epatica?"
    en: "In which liver and esophageal diseases is hydropic swelling seen, and what can a liver biopsy tell you, and what can it not?"
    focus: [clinical, etiology, ancillary]
    level: 2
