summary:
  it: "Necrosi ischemica del rene: l'infarto è un'area pallida a cuneo da occlusione arteriosa, per lo più embolica; la necrosi corticale è una necrosi estesa della corticale, tipica dello shock e del distacco di placenta."
  en: "Ischemic necrosis of the kidney: an infarct is a pale wedge from arterial occlusion, mostly embolic; cortical necrosis is widespread necrosis of the cortex, typical of shock and placental abruption."
