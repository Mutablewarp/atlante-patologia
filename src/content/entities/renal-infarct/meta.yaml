  system: [kidney]
  process: [necrosis, hypoxic-ischemic-injury, thrombosis-embolism]
  pattern: [necrosis-coagulative, dystrophic-calcification]
  presentation: [ischemic-event, hematuria]
  marker: []
  group: [vascular]
learningObjectives:
  - it: "Descrivere l'infarto renale pallido a cuneo con base sulla capsula e le sue fonti emboliche."
    en: "Describe the pale wedge-shaped renal infarct with its base on the capsule and its embolic sources."
  - it: "Spiegare perché la necrosi corticale colpisce la corticale e risparmia la midollare."
    en: "Explain why cortical necrosis hits the cortex and spares the medulla."
  - it: "Collegare la necrosi corticale allo shock e al distacco prematuro di placenta."
    en: "Link cortical necrosis to shock and premature placental separation."
  - it: "Distinguere l'infarto dalla necrosi corticale e dal danno tubulare acuto."
    en: "Tell an infarct from cortical necrosis and from acute tubular injury."
prerequisites: [coagulative-necrosis]
relations:
  - type: sameLesionOtherOrgan
    target: coagulative-necrosis
    note:
      it: "L'infarto renale è un'area cuneiforme di necrosi coagulativa."
      en: "A renal infarct is a wedge-shaped area of coagulative necrosis."
  - type: differentialOf
    target: acute-tubular-injury
    note:
      it: "Anche il danno tubulare acuto dà insufficienza renale acuta, ma più spesso reversibile."
      en: "Acute tubular injury also gives acute renal failure, but more often reversible."
  - type: sameLesionOtherOrgan
    target: myocardial-infarction
    note:
      it: "Anche l'infarto miocardico può essere fonte di emboli da trombo murale."
      en: "A myocardial infarct can also be a source of emboli from mural thrombus."
quickCheck:
  - id: renal-infarct-q1
    q:
      it: "Che aspetto ha un infarto renale embolico recente?"
      en: "What does a recent embolic renal infarct look like?"
    a:
      it: "Un'area pallida a cuneo con la base sulla capsula e un bordo emorragico."
      en: "A pale wedge with its base on the capsule and a hemorrhagic border."
    kind: short
  - id: renal-infarct-q2
    q:
      it: "In quale contesto classico compare la necrosi corticale?"
      en: "In which classic setting does cortical necrosis appear?"
    a:
      it: "Nello shock, classicamente il distacco prematuro di placenta a fine gravidanza."
      en: "In shock, classically premature placental separation late in pregnancy."
    kind: short
  - id: renal-infarct-q3
    q:
      it: "Perché la necrosi corticale risparmia la midollare?"
      en: "Why does cortical necrosis spare the medulla?"
    a:
      it: "I vasa recta nascono dalle arteriole efferenti iuxtamidollari, a monte dei vasi della corticale esterna."
      en: "The vasa recta arise from juxtamedullary efferent arterioles, upstream of the outer cortical vessels."
    kind: short
  - id: renal-infarct-q4
    q:
      it: "Perché l'occlusione dell'arteria renale principale raramente infarta tutto il rene?"
      en: "Why does main renal artery occlusion rarely infarct the whole kidney?"
    a:
      it: "Il circolo collaterale in genere mantiene vitale l'organo."
      en: "Collateral circulation generally keeps the organ alive."
    kind: short
selfExplain:
  - it: "Perché un'occlusione dell'arteria renale principale raramente infarta l'intero rene?"
    en: "Why does occlusion of the main renal artery rarely infarct the whole kidney?"
  - it: "Perché restano sottili bande di corticale vitale sotto la capsula?"
    en: "Why do thin rims of viable cortex remain under the capsule?"
