  - it: "Mi parli della progressione da PanIN ad adenocarcinoma duttale invasivo: quali geni sono coinvolti e in quale ordine?"
    en: "Tell me about the progression from PanIN to invasive ductal adenocarcinoma: which genes are involved, and in what order?"
    focus: [pathogenesis]
    level: 1
  - it: "Che cosa vede al microscopio in un adenocarcinoma duttale del pancreas ben differenziato?"
    en: "What do you see under the microscope in a well-differentiated pancreatic ductal adenocarcinoma?"
    focus: [micro]
    level: 1
  - it: "Perché il dolore compare presto e persiste in questo tumore?"
    en: "Why does the pain appear early and persist in this tumor?"
    focus: [micro, clinical]
    level: 2
  - it: "Come distingue un tumore della testa del pancreas da uno del corpo o della coda, per sintomi e stadio alla diagnosi?"
    en: "How do you tell a tumor of the pancreatic head from one of the body or tail, in symptoms and stage at diagnosis?"
    focus: [gross, clinical]
    level: 3
  - it: "Un paziente sano ha una tromboflebite migrante senza causa evidente: che cosa pensa e come procede?"
    en: "A healthy patient has migratory thrombophlebitis with no obvious cause: what do you think, and how do you proceed?"
    focus: [clinical, traps]
