  - it: "Che cosa vede in un carcinoma gastrico con linite plastica e perché la superficie della mucosa può ingannare?"
    en: "What do you see in gastric carcinoma with linitis plastica, and why can the mucosal surface be misleading?"
    focus: [gross, clinical]
    level: 2
  - it: "Come distingue un'ulcera gastrica maligna da una benigna?"
    en: "How do you tell a malignant gastric ulcer from a benign one?"
    focus: [gross, diagnosis, differential]
    level: 3
