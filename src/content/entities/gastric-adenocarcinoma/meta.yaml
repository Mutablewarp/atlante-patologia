    en: "Tell me about early and advanced gastric cancer: how are they defined, and what is the prognosis?"
    focus: [prognosis]
    level: 1
  - it: "Mi parli del carcinoma gastrico diffuso ereditario."
    en: "Tell me about hereditary diffuse gastric cancer."
    focus: [etiology, micro, prognosis]
