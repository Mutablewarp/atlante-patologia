summary:
  it: "Malattia colestatica cronica del fegato, di causa ignota, in cui infiammazione e fibrosi restringono e poi ostruiscono le vie biliari intra- ed extraepatiche; è spesso associata a colite ulcerosa e predispone al colangiocarcinoma."
  en: "A chronic cholestatic liver disease of unknown cause in which inflammation and fibrosis narrow and then block the intrahepatic and extrahepatic bile ducts; often linked to ulcerative colitis and to a risk of cholangiocarcinoma."
