relations:
  - type: differentialOf
    target: primary-biliary-cholangitis
    note:
      it: "Entrambe sono colangiopatie croniche con stadi istologici analoghi, ma la PSC colpisce soprattutto uomini e dotti grandi."
      en: "Both are chronic cholangiopathies with similar histologic stages, but PSC mostly affects men and large ducts."
  - type: causes
    target: cholangiocarcinoma
    note:
      it: "Il colangiocarcinoma compare in fino al 20% dei pazienti con PSC."
      en: "Cholangiocarcinoma develops in up to 20% of PSC patients."
  - type: causes
    target: cirrhosis
    note:
      it: "La PSC evolve verso la cirrosi biliare secondaria."
      en: "PSC progresses to secondary biliary cirrhosis."
quickCheck:
  - id: primary-sclerosing-cholangitis-q1
    q:
      it: "Con quale malattia intestinale è associata circa due terzi dei casi di PSC?"
      en: "With which bowel disease are about two thirds of PSC cases associated?"
    a:
      it: "Con la colite ulcerosa."
      en: "Ulcerative colitis."
    kind: short
  - id: primary-sclerosing-cholangitis-q2
    q:
      it: "Quale aspetto istologico e quale aspetto colangiografico sono tipici della PSC?"
      en: "Which histologic and which cholangiographic appearance are typical of PSC?"
    a:
      it: "Fibrosi periduttale concentrica «a buccia di cipolla» e dotti biliari «a corona di rosario» per il coinvolgimento segmentario."
      en: "Concentric onion-skin periductal fibrosis, and beaded bile ducts because the disease is segmental."
    kind: short
  - id: primary-sclerosing-cholangitis-q3
    q:
      it: "Quale neoplasia maligna complica la PSC e in quale frazione dei pazienti?"
      en: "Which malignancy complicates PSC and in what fraction of patients?"
    a:
      it: "Il colangiocarcinoma, fino al 20% dei pazienti."
      en: "Cholangiocarcinoma, in up to 20% of patients."
    kind: short
