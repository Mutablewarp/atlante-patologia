learningObjectives:
  - it: "Definire la colangite sclerosante primitiva e indicarne l'associazione con le malattie infiammatorie intestinali, soprattutto la colite ulcerosa."
    en: "Define primary sclerosing cholangitis and state its association with inflammatory bowel disease, mainly ulcerative colitis."
  - it: "Descrivere la fibrosi periduttale «a buccia di cipolla» e i quattro stadi istologici."
    en: "Describe onion-skin periductal fibrosis and the four histologic stages."
  - it: "Spiegare perché la colangiografia mostra dotti «a corona di rosario» e che cosa significa colangite sclerosante a piccoli dotti."
    en: "Explain why cholangiography shows beaded ducts and what small duct PSC means."
  - it: "Elencare le complicanze, in particolare il colangiocarcinoma, e il ruolo e i limiti del trapianto di fegato."
    en: "List the complications, especially cholangiocarcinoma, and the role and limits of liver transplantation."
