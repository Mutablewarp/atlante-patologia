summary:
  it: "Malattia polmonare cronica in cui gli spazi aerei distali ai bronchioli terminali sono dilatati per distruzione delle pareti, senza fibrosi; la causa principale è il fumo di sigaretta."
  en: "Chronic lung disease in which airspaces beyond the terminal bronchioles are enlarged by destruction of their walls, without fibrosis; the main cause is cigarette smoking."
