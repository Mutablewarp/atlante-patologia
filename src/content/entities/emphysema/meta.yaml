quickCheck:
  - id: emphysema-q1
    q:
      it: "Perché il fumo di sigaretta favorisce l'enfisema?"
      en: "Why does cigarette smoking promote emphysema?"
    a:
      it: "Aumenta i neutrofili con elastasi e ossida l'α1-antitripsina, così l'elastasi agisce senza opposizione e distrugge il tessuto elastico delle pareti."
      en: "It raises neutrophils carrying elastase and oxidizes α1-antitrypsin, so elastase acts unopposed and destroys elastic tissue in the walls."
    kind: short
  - id: emphysema-q2
    q:
      it: "Quale tipo di enfisema è tipico del deficit di α1-antitripsina e quale del fumatore?"
      en: "Which type of emphysema is typical of α1-antitrypsin deficiency, and which of the smoker?"
    a:
      it: "Panacinare nel deficit di α1-antitripsina; centrolobulare, soprattutto nei lobi superiori, nel fumatore."
      en: "Panacinar in α1-antitrypsin deficiency; centrilobular, mainly in the upper lobes, in the smoker."
    kind: short
  - id: emphysema-q3
    q:
      it: "Perché il \"pink puffer\" mantiene una saturazione quasi normale?"
      en: "Why does the \"pink puffer\" keep a near-normal saturation?"
    a:
      it: "Perché la frequenza respiratoria e il volume minuto aumentati mantengono la saturazione dell'emoglobina vicina alla norma."
      en: "Because the raised respiratory rate and minute volume keep hemoglobin saturation near normal."
    kind: short
  - id: emphysema-q4
    q:
      it: "Dove si trovano le lesioni nell'enfisema paraseptale e quale complicanza può dare?"
      en: "Where do the lesions of paraseptal emphysema lie, and which complication can they cause?"
    a:
      it: "Sotto la pleura, tipicamente all'apice di un lobo superiore; la rottura di un focus può causare pneumotorace spontaneo."
      en: "Under the pleura, typically at the apex of an upper lobe; rupture of a focus may cause spontaneous pneumothorax."
    kind: short
  - id: emphysema-q5
    q:
      it: "L'enfisema comporta fibrosi?"
      en: "Does emphysema involve fibrosis?"
    a:
      it: "No: le pareti degli spazi aerei vengono distrutte senza fibrosi."
      en: "No: the airspace walls are destroyed without fibrosis."
    kind: short
selfExplain:
  - it: "Perché la perdita del tessuto elastico distale riduce il ritorno elastico e peggiora l'ostruzione al flusso?"
    en: "Why does loss of distal elastic tissue reduce elastic recoil and worsen airflow obstruction?"
  - it: "Perché un deficit di α1-antitripsina porta a distruzione delle pareti alveolari?"
    en: "Why does α1-antitrypsin deficiency lead to destruction of the alveolar walls?"
  - it: "Perché la gravità conta più del tipo anatomico quando i pattern coesistono?"
    en: "Why does severity matter more than anatomic type when patterns coexist?"
