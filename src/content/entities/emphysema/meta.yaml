  system: [respiratory]
  process: [chronic-inflammation, cell-injury]
  pattern: []
  presentation: [dyspnea]
  marker: [laboratory, molecular]
  group: [toxic-environmental, genetic]
learningObjectives:
  - it: "Definire l'enfisema e spiegare perché la gravità conta più del tipo anatomico."
    en: "Define emphysema and explain why severity matters more than anatomic type."
  - it: "Descrivere il tipo centrolobulare, panacinare e paraseptale (localizzato) e le bolle, con la sede preferenziale di ciascuno."
    en: "Describe the centrilobular, panacinar and paraseptal (localized) types and bullae, with the preferred site of each."
  - it: "Spiegare lo squilibrio tra proteasi e antiproteasi e il ruolo del fumo e del deficit di α1-antitripsina."
    en: "Explain the protease–antiprotease imbalance and the role of smoking and α1-antitrypsin deficiency."
  - it: "Distinguere il quadro clinico dell'enfisema (\"pink puffer\") da quello della bronchite cronica (\"blue bloater\")."
    en: "Distinguish the clinical picture of emphysema (\"pink puffer\") from that of chronic bronchitis (\"blue bloater\")."
