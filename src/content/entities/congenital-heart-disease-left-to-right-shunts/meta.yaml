id: congenital-heart-disease-left-to-right-shunts
module: o17
tier: core
kind: disease
names:
  it: "Cardiopatie congenite con shunt sinistro-destro"
  en: "Congenital heart disease with left-to-right shunt"
  eponyms: ["Eisenmenger complex"]
  synonyms:
    it: ["Cardiopatie congenite cianotiche tardive"]
    en: ["Cyanose tardive group"]
  abbreviations: [VSD, ASD, PDA, AVSD]
summary:
  it: "Malformazioni cardiache presenti alla nascita (difetti del setto interventricolare e interatriale, dotto arterioso pervio, canale atrioventricolare) in cui il sangue passa dal lato sinistro, a pressione maggiore, a quello destro e che possono invertire lo shunt tardivamente (Eisenmenger)."
  en: "Heart malformations present at birth (ventricular and atrial septal defects, patent ductus arteriosus, AV canal) in which blood flows from the higher-pressure left side to the right and which can later reverse the shunt (Eisenmenger)."
lenses:
  system: [heart]
  process: [thrombosis-embolism]
  pattern: [hypertrophy]
  presentation: [dyspnea]
  marker: []
  group: [developmental, genetic]
learningObjectives:
  - it: "Definire le cardiopatie congenite con shunt sinistro-destro e distinguerle dai gruppi cianotico e privo di shunt."
    en: "Define left-to-right shunt congenital heart disease and distinguish it from the cyanotic and no-shunt groups."
  - it: "Descrivere sede e aspetto di DIV, DIA, dotto arterioso pervio e canale atrioventricolare."
    en: "Describe the site and appearance of VSD, ASD, patent ductus arteriosus and AV canal."
  - it: "Spiegare come l'aumento delle resistenze vascolari polmonari inverta lo shunt (Eisenmenger) e provochi cianosi tardiva."
    en: "Explain how rising pulmonary vascular resistance reverses the shunt (Eisenmenger) and causes late cyanosis."
  - it: "Elencare le complicanze principali, compresa l'embolia paradossa, e le opzioni di trattamento."
    en: "List the main complications, including paradoxical embolism, and the treatment options."
