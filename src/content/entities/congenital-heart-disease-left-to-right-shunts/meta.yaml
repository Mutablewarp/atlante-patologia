quickCheck:
  - id: congenital-heart-disease-left-to-right-shunts-q1
    q:
      it: "Perché lo shunt di un DIV si inverte dopo anni?"
      en: "Why does the shunt of a VSD reverse after years?"
    a:
      it: "L'eccesso di flusso polmonare ispessisce le arterie polmonari e aumenta le resistenze; quando la pressione ventricolare destra supera la sinistra, il sangue passa da destra a sinistra (Eisenmenger)."
      en: "Excess pulmonary flow thickens the pulmonary arteries and raises resistance; when right ventricular pressure exceeds the left, blood flows right to left (Eisenmenger)."
    kind: short
  - id: congenital-heart-disease-left-to-right-shunts-q2
    q:
      it: "Qual è la differenza tra DIA tipo ostium secundum e forame ovale pervio?"
      en: "What is the difference between an ostium secundum ASD and a patent foramen ovale?"
    a:
      it: "Il difetto ostium secundum è una vera carenza del setto interatriale; il forame ovale pervio è una valvola a lembo che non si è saldata completamente."
      en: "An ostium secundum defect is a true deficiency of the atrial septum; a patent foramen ovale is a flap valve that did not seal completely."
    kind: short
  - id: congenital-heart-disease-left-to-right-shunts-q3
    q:
      it: "Che cos'è un canale atrioventricolare completo e perché si forma?"
      en: "What is a complete AV canal and why does it form?"
    a:
      it: "Una valvola atrioventricolare unica e condivisa con difetti del setto interatriale e interventricolare, dovuta alla mancata fusione dei cuscinetti endocardici atrioventricolari."
      en: "One shared AV valve with atrial and ventricular septal defects, from failed fusion of the AV endocardial cushions."
    kind: short
  - id: congenital-heart-disease-left-to-right-shunts-q4
    q:
      it: "Perché in alcuni neonati si somministra prostaglandina E2 invece di chiudere il dotto?"
      en: "Why is prostaglandin E2 given to some newborns instead of closing the ductus?"
    a:
      it: "Perché in alcuni difetti cardiaci la sopravvivenza dipende da uno shunt attraverso il dotto, che va quindi mantenuto aperto."
      en: "Because in some cardiac defects survival depends on a shunt through the ductus, which must be kept open."
    kind: short
