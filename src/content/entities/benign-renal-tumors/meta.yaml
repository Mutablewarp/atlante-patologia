  - it: "Elencare i principali tumori renali benigni e la cellula di origine dell'oncocitoma."
    en: "List the main benign renal tumors and the cell of origin of oncocytoma."
  - it: "Descrivere la composizione e l'aspetto macroscopico dell'angiomiolipoma e la sua associazione con la sclerosi tuberosa."
    en: "Describe the composition and gross appearance of angiomyolipoma and its association with tuberous sclerosis."
