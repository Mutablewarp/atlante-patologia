    target: renal-cell-carcinoma
    note:
      it: "Le cellule simili a quelle del carcinoma a cellule chiare, cromofobo o dei dotti collettori escludono la diagnosi di adenoma."
      en: "Cells resembling clear cell, chromophobe or collecting duct carcinoma rule out an adenoma."
  - type: differentialOf
