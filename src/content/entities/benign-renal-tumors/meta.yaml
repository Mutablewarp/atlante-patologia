quickCheck:
  - id: benign-renal-tumors-q1
    q:
      it: "Quali tre tessuti compongono l'angiomiolipoma?"
      en: "Which three tissues make up an angiomyolipoma?"
    a:
      it: "Tessuto adiposo maturo, muscolatura liscia e vasi a parete spessa."
      en: "Mature fat, smooth muscle and thick-walled vessels."
    kind: short
  - id: benign-renal-tumors-q2
    q:
      it: "Perché la dimensione non basta a definire un adenoma renale?"
      en: "Why is size not enough to define a renal adenoma?"
    a:
      it: "Perché tutti i carcinomi iniziano come lesioni piccole."
      en: "Because every carcinoma starts out as a small lesion."
    kind: short
  - id: benign-renal-tumors-q3
    q:
      it: "Da quale cellula deriva l'oncocitoma e perché ha un aspetto granulare?"
      en: "Which cell does oncocytoma derive from, and why does it look granular?"
    a:
      it: "Dalle cellule intercalate del dotto collettore; il citoplasma è pieno di mitocondri."
      en: "From intercalated cells of the collecting duct; the cytoplasm is packed with mitochondria."
    kind: short
  - id: benign-renal-tumors-q4
    q:
      it: "Quanti pazienti con sclerosi tuberosa hanno un angiomiolipoma, e vale il contrario?"
      en: "How many patients with tuberous sclerosis have an angiomyolipoma, and does the reverse hold?"
    a:
      it: "L'80% dei pazienti con sclerosi tuberosa ha un angiomiolipoma, ma nella maggior parte dei pazienti con angiomiolipoma la sclerosi tuberosa è assente."
      en: "Angiomyolipomas are found in 80% of patients with tuberous sclerosis, but in most people with an angiomyolipoma tuberous sclerosis is absent."
    kind: short
