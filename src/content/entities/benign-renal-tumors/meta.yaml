summary:
  it: "Gruppo di neoplasie renali benigne o a basso rischio (adenoma papillare, oncocitoma, fibroma midollare, angiomiolipoma, nefroma mesoblastico) da distinguere dai carcinomi."
  en: "A group of benign or low-risk kidney neoplasms (papillary adenoma, oncocytoma, medullary fibroma, angiomyolipoma, mesoblastic nephroma) to be told apart from carcinomas."
