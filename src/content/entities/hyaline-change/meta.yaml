  - it: "Che cosa vede al microscopio in un'arteriola renale con ialinosi da nefrosclerosi ipertensiva?"
    en: "What do you see under the microscope in a kidney arteriole with hyaline change from hypertensive nephrosclerosis?"
    focus: [micro, pathogenesis]
    level: 1
  - it: "Mi parli dell'ialinosi di Crooke: dove si osserva e da che cosa è prodotta?"
    en: "Tell me about Crooke hyalinization: where is it seen and what produces it?"
    focus: [etiology, pathogenesis, micro]
    level: 2
  - it: "Che cosa vede al microscopio nel glomerulo diabetico che ricorda l'ialinosi, e che cosa mostrerebbero l'immunofluorescenza e la microscopia elettronica?"
    en: "What do you see in the diabetic glomerulus that recalls hyaline change, and what would immunofluorescence and electron microscopy show?"
    focus: [micro, ancillary]
    level: 2
  - it: "Come distingue l'ialinosi arteriolare dall'arteriosclerosi delle piccole arterie muscolari, e che cosa è il materiale ialinizzato di un'isola diabetica?"
