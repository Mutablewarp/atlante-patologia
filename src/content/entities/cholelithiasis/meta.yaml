quickCheck:
  - id: cholelithiasis-q1
    q:
      it: "Quale tipo di calcolo è associato a emolisi cronica e quale a colangite batterica?"
      en: "Which stone type goes with chronic hemolysis and which with bacterial cholangitis?"
    a:
      it: "L'emolisi cronica si associa ai calcoli pigmentari neri; la colangite batterica ai calcoli pigmentari bruni."
      en: "Chronic hemolysis goes with black pigment stones; bacterial cholangitis goes with brown pigment stones."
    kind: short
  - id: cholelithiasis-q2
    q:
      it: "Perché l'estrogeno favorisce i calcoli di colesterolo?"
      en: "Why do estrogens favor cholesterol stones?"
    a:
      it: "Aumentano la secrezione epatica di colesterolo e riducono quella degli acidi biliari, sovrassaturando la bile."
      en: "They raise hepatic cholesterol secretion and lower bile acid secretion, which supersaturates the bile."
    kind: short
  - id: cholelithiasis-q3
    q:
      it: "Quali complicanze può causare un calcolo che entra nel coledoco?"
      en: "Which complications can a stone entering the common bile duct cause?"
    a:
      it: "Ittero ostruttivo, colangite e pancreatite."
      en: "Obstructive jaundice, cholangitis and pancreatitis."
    kind: short
