learningObjectives:
  - it: "Distinguere i calcoli di colesterolo da quelli pigmentari (neri e bruni) per aspetto, sede e condizioni associate."
    en: "Distinguish cholesterol stones from pigment stones (black and brown) by appearance, site and associated conditions."
  - it: "Elencare i fattori di rischio dei calcoli di colesterolo e spiegarne il meccanismo."
    en: "List the risk factors for cholesterol stones and explain their mechanism."
  - it: "Descrivere come si forma un calcolo di colesterolo: bile sovrassatura, nucleazione e stasi."
    en: "Describe how a cholesterol stone forms: supersaturated bile, nucleation and stasis."
  - it: "Elencare le complicanze dell'ostruzione del dotto cistico e del coledoco."
    en: "List the complications of cystic duct and common bile duct obstruction."
