      en: "Most cases of acute cholecystitis occur in people with stones."
  - type: causes
    target: acute-pancreatitis
    note:
      it: "I calcoli nel coledoco sono la causa più comune di pancreatite acuta in chi non beve alcol."
      en: "Stones in the common duct are the most common cause of acute pancreatitis in non-drinkers."
  - type: sharesMechanism
