summary:
  it: "Presenza di uno o più calcoli nel lume della colecisti o nelle vie biliari extraepatiche, di colesterolo (più frequenti nei paesi industrializzati) o pigmentari, spesso silenti ma causa di colica biliare e di complicanze da ostruzione."
  en: "One or more stones in the gallbladder lumen or extrahepatic bile ducts, either cholesterol (commoner in industrialized countries) or pigment, often silent but a cause of biliary colic and obstructive complications."
