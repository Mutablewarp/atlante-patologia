summary:
  it: "Malattia del muscolo cardiaco, per lo più da mutazioni dei geni del sarcomero, con ipertrofia ventricolare sinistra non spiegata dal carico emodinamico, disarray dei miociti e rischio di morte improvvisa."
  en: "Heart muscle disease, mostly from sarcomere gene mutations, with left ventricular hypertrophy not explained by hemodynamic load, myocyte disarray and a risk of sudden death."
lenses:
  system: [heart]
  process: [cellular-adaptation]
  pattern: [hypertrophy]
  presentation: [dyspnea, chest-pain]
  marker: [molecular]
  group: [genetic]
learningObjectives:
  - it: "Definire la cardiomiopatia ipertrofica e le cause secondarie di ipertrofia da escludere."
    en: "Define hypertrophic cardiomyopathy and the secondary causes of hypertrophy that must be excluded."
  - it: "Nominare i geni del sarcomero più frequentemente coinvolti e spiegare il meccanismo di gain-of-function."
    en: "Name the sarcomere genes most often involved and explain the gain-of-function mechanism."
  - it: "Descrivere l'ipertrofia settale asimmetrica, l'ostruzione all'efflusso e il disarray dei miociti."
    en: "Describe asymmetric septal hypertrophy, outflow obstruction and myocyte disarray."
  - it: "Spiegare sintomi e rischio di morte improvvisa, anche in pazienti asintomatici."
    en: "Explain the symptoms and the risk of sudden death, even in symptom-free patients."
prerequisites: [hypertrophy]
relations:
  - type: differentialOf
    target: dilated-cardiomyopathy
    note:
      it: "Gli stessi geni possono causare la forma dilatativa per perdita di funzione."
      en: "The same genes can cause the dilated form through loss of function."
  - type: differentialOf
    target: hypertensive-heart-disease
    note:
      it: "Qui l'ipertrofia è spiegata dal sovraccarico pressorio."
      en: "Here the hypertrophy is explained by pressure overload."
  - type: differentialOf
    target: arrhythmogenic-cardiomyopathy
    note:
      it: "Malattia del desmosoma con aritmie ventricolari precoci."
      en: "Desmosome disease with early ventricular arrhythmias."
quickCheck:
  - id: hypertrophic-cardiomyopathy-q1
    q:
      it: "Perché una mutazione di un gene espresso solo nei miociti altera anche la matrice extracellulare?"
      en: "Why does a mutation in a gene expressed only in myocytes also change the extracellular matrix?"
    a:
      it: "La maggior forza e il segnale del calcio attivano vie di crescita, e i miociti secernono mediatori profibrotici come il TGFβ che stimolano fibroblasti e matrice."
      en: "The extra force and calcium signaling activate growth pathways, and myocytes secrete profibrotic mediators such as TGFβ that stimulate fibroblasts and matrix."
    kind: short
  - id: hypertrophic-cardiomyopathy-q2
    q:
      it: "Quale reperto istologico è il più caratteristico, e dove è più marcato?"
      en: "Which histologic finding is most characteristic, and where is it most marked?"
    a:
      it: "Il disarray delle miofibre, più marcato nel setto interventricolare."
      en: "Myofiber disarray, most marked in the interventricular septum."
    kind: short
  - id: hypertrophic-cardiomyopathy-q3
    q:
      it: "Quali cause di ipertrofia vanno escluse prima di porre diagnosi?"
      en: "Which causes of hypertrophy must be excluded before making the diagnosis?"
    a:
      it: "Ipertensione, stenosi aortica e ipertrofia fisiologica degli atleti molto allenati."
      en: "Hypertension, aortic stenosis and physiologic hypertrophy of highly trained athletes."
    kind: short
  - id: hypertrophic-cardiomyopathy-q4
    q:
      it: "Il rischio di morte improvvisa riguarda solo i pazienti sintomatici?"
      en: "Is the risk of sudden death limited to symptomatic patients?"
    a:
      it: "No: anche i pazienti senza sintomi possono morire improvvisamente."
      en: "No: even patients without symptoms can die suddenly."
    kind: short
selfExplain:
  - it: "Perché il setto ipertrofico può causare ostruzione all'efflusso del ventricolo sinistro?"
    en: "Why can the hypertrophic septum obstruct left ventricular outflow?"
  - it: "Perché l'intervento sull'ostruzione non elimina il rischio di morte improvvisa?"
    en: "Why does treating the obstruction not remove the risk of sudden death?"
chain:
