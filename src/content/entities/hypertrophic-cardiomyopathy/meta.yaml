  - it: "Che cosa vede al microscopio nella cardiomiopatia ipertrofica, e il disarray dei miociti è sufficiente per la diagnosi?"
    en: "What do you see under the microscope in hypertrophic cardiomyopathy, and is myocyte disarray enough to make the diagnosis?"
    focus: [micro, traps]
