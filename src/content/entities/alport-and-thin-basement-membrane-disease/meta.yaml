kind: disease
names:
  it: "Sindrome di Alport e malattia delle membrane basali sottili"
  en: "Alport syndrome and thin basement membrane disease"
  eponyms: ["Alport"]
  synonyms:
    it: ["Nefrite ereditaria", "Ematuria familiare benigna"]
    en: ["Hereditary nephritis", "Benign familial hematuria"]
