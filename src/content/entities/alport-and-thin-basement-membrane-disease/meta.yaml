relations:
  - type: differentialOf
    target: iga-nephropathy
    note:
      it: "Entrambe sono cause frequenti di ematuria glomerulare asintomatica."
      en: "Both are common causes of asymptomatic glomerular hematuria."
  - type: differentialOf
    target: focal-segmental-glomerulosclerosis
    note:
      it: "Varianti di COL4A3 e COL4A4 si trovano anche in adulti con FSGS."
      en: "COL4A3 and COL4A4 variants are also found in adults with FSGS."
quickCheck:
  - id: alport-and-thin-basement-membrane-disease-q1
    q:
      it: "Quale proteina è difettosa nella sindrome di Alport e qual è il gene più spesso coinvolto?"
      en: "Which protein is defective in Alport syndrome, and which gene is most often involved?"
    a:
      it: "Il collagene di tipo IV; il gene più spesso coinvolto è COL4A5, sul cromosoma X."
      en: "Type IV collagen; the gene most often involved is COL4A5, on the X chromosome."
    kind: short
  - id: alport-and-thin-basement-membrane-disease-q2
    q:
      it: "Che cosa mostra la microscopia elettronica nella sindrome di Alport?"
      en: "What does electron microscopy show in Alport syndrome?"
    a:
      it: "Una membrana basale ispessita in modo irregolare, con lamina densa divisa in più strati attorno ad aree elettronlucenti."
      en: "An irregularly thickened basement membrane whose lamina densa is split into layers around electron-lucent areas."
    kind: short
  - id: alport-and-thin-basement-membrane-disease-q3
    q:
      it: "Come si distingue clinicamente la malattia delle membrane basali sottili dalla sindrome di Alport?"
      en: "How does thin basement membrane disease differ clinically from Alport syndrome?"
    a:
      it: "Dà di solito solo ematuria, senza insufficienza renale né proteinuria importante; la sindrome di Alport evolve in insufficienza renale."
      en: "It usually causes only hematuria, without renal failure or substantial proteinuria; Alport syndrome progresses to renal failure."
    kind: short
  - id: alport-and-thin-basement-membrane-disease-q4
    q:
      it: "Quale reperto uditivo e quale esordio urinario si osservano nei maschi con la forma legata all'X?"
      en: "Which hearing finding and which urinary onset are seen in males with the X-linked form?"
    a:
      it: "L'ematuria compare presto nei ragazzi; circa la metà dei maschi perde l'udito neurosensoriale per le alte frequenze."
      en: "Hematuria appears early in boys; half of the males lose high-frequency sensorineural hearing."
    kind: short
