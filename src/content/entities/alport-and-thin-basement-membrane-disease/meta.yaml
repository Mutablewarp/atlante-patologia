summary:
  it: "Malattie ereditarie del collagene di tipo IV della membrana basale glomerulare: nella sindrome di Alport nefrite con sordità neurosensoriale, nella malattia delle membrane basali sottili ematuria familiare benigna."
  en: "Inherited disorders of type IV collagen of the glomerular basement membrane: Alport syndrome causes nephritis with sensorineural hearing loss, thin basement membrane disease causes benign familial hematuria."
lenses:
  system: [kidney]
  process: []
  pattern: []
  presentation: [hematuria]
  marker: [molecular]
  group: [genetic]
learningObjectives:
  - it: "Collegare i difetti del collagene di tipo IV (COL4A5, COL4A3, COL4A4) alla sindrome di Alport."
    en: "Link type IV collagen defects (COL4A5, COL4A3, COL4A4) to Alport syndrome."
  - it: "Descrivere il reperto in microscopia elettronica della membrana basale nella sindrome di Alport."
    en: "Describe the electron microscopy finding of the basement membrane in Alport syndrome."
  - it: "Riconoscere ematuria e sordità neurosensoriale come quadro clinico della forma legata all'X."
    en: "Recognize hematuria and sensorineural hearing loss as the clinical picture of the X-linked form."
  - it: "Distinguere la malattia delle membrane basali sottili dalla sindrome di Alport e dalle altre cause di ematuria glomerulare."
    en: "Distinguish thin basement membrane disease from Alport syndrome and other causes of glomerular hematuria."
