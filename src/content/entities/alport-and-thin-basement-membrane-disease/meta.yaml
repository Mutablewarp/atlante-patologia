  - it: "Quale forma di nefrite ereditaria si chiama sindrome di Alport, e quali difetti extrarenali possono accompagnare la nefrite ereditaria?"
    en: "Which form of hereditary nephritis is called Alport syndrome, and which extrarenal defects can accompany hereditary nephritis?"
  - it: "Perché la malattia delle membrane basali sottili e la sindrome di Alport differiscono nel decorso pur coinvolgendo gli stessi geni?"
    en: "Why do thin basement membrane disease and Alport syndrome differ in course although they involve the same genes?"
