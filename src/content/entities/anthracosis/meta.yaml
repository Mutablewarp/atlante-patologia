learningObjectives:
  - it: "Descrivere il pigmento antracotico e i macrofagi carichi di carbonio nelle macule da polvere di carbone."
    en: "Describe anthracotic pigment and the carbon-laden macrophages of coal-dust macules."
  - it: "Distinguere macule e noduli da polvere di carbone e spiegare perché i noduli indicano la presenza di silice."
    en: "Distinguish coal-dust macules from nodules and explain why nodules point to silica."
  - it: "Definire la pneumoconiosi complicata (fibrosi massiva progressiva) rispetto a quella semplice."
    en: "Define complicated CWP (progressive massive fibrosis) versus simple CWP."
  - it: "Riconoscere la sindrome di Caplan e distinguere i noduli di Caplan dai noduli reumatoidi."
    en: "Recognize Caplan syndrome and tell Caplan nodules from rheumatoid nodules."
prerequisites: [pigment-accumulation]
relations:
  - type: differentialOf
    target: silicosis
    note:
      it: "Noduli a spirale di collagene con silicati birifrangenti, invece di macrofagi carichi di carbone."
      en: "Whorled collagen nodules with birefringent silicates, rather than carbon-laden macrophages."
  - type: differentialOf
    target: asbestos-related-disease
    note:
      it: "Fibrosi interstiziale diffusa da fibre di asbesto."
      en: "Diffuse interstitial fibrosis from asbestos fibers."
quickCheck:
  - id: anthracosis-q1
    q:
      it: "Perché il carbonio amorfo da solo non causa fibrosi, mentre la polvere di carbone mista a silice sì?"
      en: "Why does amorphous carbon alone not cause fibrosis, while coal dust mixed with silica does?"
    a:
      it: "Il carbonio non uccide i macrofagi alveolari ed è una polvere di disturbo; la silice è fortemente fibrogena."
      en: "Carbon does not kill alveolar macrophages and is a nuisance dust; silica is strongly fibrogenic."
    kind: short
  - id: anthracosis-q2
    q:
      it: "Quale lesione definisce la pneumoconiosi complicata dei minatori di carbone?"
      en: "Which lesion defines complicated coal workers' pneumoconiosis?"
    a:
      it: "Una lesione di 2,0 cm o più, su uno sfondo di pneumoconiosi semplice."
      en: "A lesion of 2.0 cm or more, on a background of simple CWP."
    kind: short
  - id: anthracosis-q3
    q:
      it: "Che cos'è la sindrome di Caplan e in chi è stata descritta per la prima volta?"
      en: "What is Caplan syndrome and in whom was it first described?"
    a:
      it: "Noduli reumatoidi polmonari, descritti per la prima volta in minatori di carbone con artrite reumatoide; oggi anche con altre pneumoconiosi."
      en: "Pulmonary rheumatoid nodules, first described in coal miners with rheumatoid arthritis; now also with other pneumoconioses."
    kind: short
selfExplain:
  - it: "Perché un nodulo con stroma fibroso da polvere di carbone fa pensare alla silice?"
    en: "Why does a coal-dust nodule with a fibrotic stroma suggest silica?"
  - it: "Perché in un minatore con grave ostruzione delle vie aeree si pensa prima al fumo che alla pneumoconiosi semplice?"
    en: "Why, in a miner with severe airflow obstruction, do you think of smoking before simple pneumoconiosis?"
