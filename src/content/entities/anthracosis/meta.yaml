kind: disease
names:
  it: "Antracosi e pneumoconiosi dei minatori di carbone"
  en: "Anthracosis and coal workers' pneumoconiosis"
  eponyms: ["Caplan syndrome"]
  synonyms:
    it: ["Pneumoconiosi da carbone", "Antracosilicosi"]
    en: ["Coal workers' pneumoconiosis", "Anthracosilicosis"]
  abbreviations: ["CWP", "PMF"]
summary:
  it: "Malattia polmonare da inalazione di polvere di carbone: l'antracosi semplice è un accumulo innocuo di carbonio nei macrofagi, mentre la fibrosi compare quando la polvere contiene silice, fino alla fibrosi massiva progressiva."
  en: "Lung disease from inhaling coal dust: simple anthracosis is a harmless carbon deposit in macrophages, while fibrosis appears when the dust contains silica, up to progressive massive fibrosis."
lenses:
  system: [respiratory]
  process: [intracellular-accumulation, repair-fibrosis]
  pattern: [pigment-deposits]
  presentation: []
  marker: []
