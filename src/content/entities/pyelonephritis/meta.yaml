    en: "Why do vesicoureteral reflux and obstruction lead to chronic pyelonephritis?"
    focus: [etiology, pathogenesis]
    level: 2
  - it: "Che cosa vede al microscopio in una pielonefrite acuta e quali complicanze può dare?"
    en: "What do you see under the microscope in acute pyelonephritis, and what complications can it cause?"
    focus: [micro, prognosis]
    level: 1
  - it: "Che cosa vede in una pielonefrite cronica da reflusso, a occhio nudo e al microscopio, e che cos'è la tiroidizzazione?"
    en: "What do you see in chronic pyelonephritis from reflux, grossly and under the microscope, and what is thyroidization?"
    focus: [gross, micro]
    level: 2
  - it: "Come distingue una pielonefrite xantogranulomatosa da un carcinoma renale, e il quadro cronico da un'uropatia ostruttiva?"
    en: "How do you tell xanthogranulomatous pyelonephritis from renal cell carcinoma, and chronic pyelonephritis from obstructive uropathy?"
    focus: [gross, differential]
