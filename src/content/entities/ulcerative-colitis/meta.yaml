learningObjectives:
  - it: "Descrivere la distribuzione continua della colite ulcerosa a partire dal retto e la sua limitazione alla mucosa."
    en: "Describe the continuous distribution of ulcerative colitis from the rectum and its restriction to the mucosa."
  - it: "Riconoscere ascessi criptici, distorsione architetturale e pseudopolipi infiammatori."
    en: "Recognize crypt abscesses, architectural distortion and inflammatory pseudopolyps."
  - it: "Distinguere la colite ulcerosa dalla colite di Crohn con i criteri macroscopici e microscopici."
    en: "Distinguish ulcerative colitis from Crohn colitis using gross and microscopic criteria."
  - it: "Spiegare megacolon tossico, displasia e sorveglianza colonscopica per il rischio di cancro."
    en: "Explain toxic megacolon, dysplasia and surveillance colonoscopy for cancer risk."
