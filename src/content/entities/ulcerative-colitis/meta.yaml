summary:
  it: "Malattia infiammatoria cronica del retto e del colon che parte dal retto, si estende in modo continuo verso l'alto e resta limitata soprattutto alla mucosa."
  en: "Chronic inflammatory disease of the rectum and colon that starts in the rectum, spreads continuously upward and stays largely within the mucosa."
