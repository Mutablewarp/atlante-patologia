relations:
  - type: differentialOf
    target: crohn-disease
    note:
      it: "Malattia continua e mucosale contro malattia segmentaria e transmurale con granulomi."
      en: "Continuous mucosal disease versus segmental transmural disease with granulomas."
  - type: mimics
    target: infectious-enterocolitis
    note:
      it: "Le infezioni batteriche e amebiche possono simulare la colite ulcerosa e vanno escluse."
      en: "Bacterial and amebic infections can mimic ulcerative colitis and must be excluded."
  - type: causes
    target: colorectal-adenocarcinoma
    note:
      it: "La malattia di lunga durata predispone a displasia e carcinoma colorettale."
      en: "Long-standing disease predisposes to dysplasia and colorectal carcinoma."
quickCheck:
  - id: ulcerative-colitis-q1
    q:
      it: "Quali tre caratteri riassumono la distribuzione della colite ulcerosa?"
      en: "Which three features summarize the distribution of ulcerative colitis?"
    a:
      it: "Inizia dal retto, è continua senza lesioni a salto ed è limitata alla mucosa."
      en: "It starts in the rectum, is continuous without skip lesions and is limited to the mucosa."
    kind: short
  - id: ulcerative-colitis-q2
    q:
      it: "Perché nella colite ulcerosa mancano stenosi e fistole?"
      en: "Why are strictures and fistulas absent in ulcerative colitis?"
    a:
      it: "Richiedono il coinvolgimento di muscolare e sierosa, mentre la malattia resta mucosale."
      en: "They need involvement of the muscularis and serosa, while the disease stays mucosal."
    kind: short
  - id: ulcerative-colitis-q3
    q:
      it: "Quando serve la sorveglianza colonscopica e che cosa si cerca?"
      en: "When is surveillance colonoscopy needed and what is sought?"
    a:
      it: "Nei pazienti con malattia stabilita, con biopsie sistematiche per individuare la displasia; il rischio cresce con estensione e durata."
      en: "In patients with established disease, with systematic biopsies to find dysplasia; risk grows with extent and duration."
    kind: short
