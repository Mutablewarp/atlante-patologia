    en: "Tell me about arrhythmogenic cardiomyopathy: which desmosomal genes are involved, and which gene is most often mutated in the classical right ventricular form?"
    focus: [definition, etiology]
    level: 1
  - it: "Che cosa vede al microscopio, e che aspetto ha il ventricolo destro, in un cuore con cardiomiopatia aritmogena?"
    en: "What do you see under the microscope, and how does the right ventricle look, in a heart with arrhythmogenic cardiomyopathy?"
    focus: [gross, micro]
    level: 1
  - it: "Perché in questa malattia può esserci una morte improvvisa in un giovane con un cuore poco alterato?"
    en: "Why can this disease cause sudden death in a young person whose heart looks little changed?"
    focus: [clinical, prognosis, traps]
    level: 2
  - it: "Perché all'autopsia, dopo una morte improvvisa, la diagnosi può sfuggire?"
    en: "Why can the diagnosis be missed at autopsy after a sudden death?"
    focus: [micro, diagnosis, traps]
