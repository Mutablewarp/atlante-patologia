  - it: "Come distingue la cardiomiopatia aritmogena dalle cardiomiopatie dilatativa, ipertrofica e restrittiva?"
    en: "How do you tell arrhythmogenic cardiomyopathy from dilated, hypertrophic and restrictive cardiomyopathy?"
    focus: [differential, high-yield]
