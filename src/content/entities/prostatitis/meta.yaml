learningObjectives:
  - it: "Distinguere prostatite acuta, cronica batterica, non batterica e granulomatosa."
    en: "Distinguish acute, chronic bacterial, nonbacterial and granulomatous prostatitis."
  - it: "Descrivere il quadro istologico tipico di ciascuna forma."
    en: "Describe the typical histology of each form."
  - it: "Spiegare perché una prostatite cronica può far aumentare il PSA e perché spesso si arriva alla diagnosi con una biopsia."
    en: "Explain why chronic prostatitis can raise PSA and why the diagnosis often comes from a biopsy."
  - it: "Elencare le cause rare di prostatite granulomatosa, compreso il BCG."
    en: "List the rare causes of granulomatous prostatitis, including BCG."
