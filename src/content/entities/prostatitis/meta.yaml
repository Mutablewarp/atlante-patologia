quickCheck:
  - id: prostatitis-q1
    q:
      it: "Quali sono le quattro forme di prostatite da conoscere?"
      en: "What are the four forms of prostatitis to know?"
    a:
      it: "Acuta, cronica batterica, non batterica e granulomatosa."
      en: "Acute, chronic bacterial, nonbacterial and granulomatous."
    kind: short
  - id: prostatitis-q2
    q:
      it: "Che cosa mostrano spesso le biopsie prostatiche fatte per sospetto cancro?"
      en: "What do prostate biopsies taken for suspected cancer often show?"
    a:
      it: "Spesso risultano mostrare una prostatite cronica."
      en: "They often turn out to show chronic prostatitis."
    kind: short
  - id: prostatitis-q3
    q:
      it: "Qual è l'aspetto istologico più comune della prostatite non batterica?"
      en: "What is the most common histology of nonbacterial prostatitis?"
    a:
      it: "Ghiandole dilatate piene di neutrofili e macrofagi schiumosi, circondate da cellule infiammatorie croniche."
      en: "Enlarged gland lumens holding neutrophils and foamy macrophages, with chronic inflammatory cells in the tissue around them."
    kind: short
  - id: prostatitis-q4
    q:
      it: "Qual è la causa più comune di prostatite granulomatosa?"
      en: "What is the most common cause of granulomatous prostatitis?"
    a:
      it: "Nella maggior parte dei casi la causa non viene dimostrata; solo di rado si trova un agente specifico, come Histoplasma, BCG o M. tuberculosis."
      en: "In most cases no cause is demonstrated; only occasionally is a specific agent found, such as Histoplasma, BCG or M. tuberculosis."
    kind: short
  - id: prostatitis-q5
    q:
      it: "Come si arriva alla diagnosi di prostatite non batterica?"
      en: "How is nonbacterial prostatitis diagnosed?"
    a:
      it: "In pratica per esclusione, dopo aver escluso altre condizioni."
      en: "In practice by exclusion, after other conditions have been ruled out."
    kind: short
