summary:
  it: "Infiammazione della prostata, acuta o cronica, in genere da coliformi ma spesso senza causa identificata; può aumentare il PSA e imitare un carcinoma."
  en: "Inflammation of the prostate, acute or chronic, usually from coliform bacteria but often without an identified cause; it can raise PSA and mimic carcinoma."
