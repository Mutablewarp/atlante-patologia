learningObjectives:
  - it: "Descrivere la base genetica della poliposi adenomatosa familiare e il ruolo di APC nella via Wnt/β-catenina."
    en: "Describe the genetic basis of familial adenomatous polyposis and the role of APC in the Wnt/β-catenin pathway."
  - it: "Riconoscere l'aspetto macroscopico e microscopico dei polipi adenomatosi della malattia."
    en: "Recognize the gross and microscopic appearance of the adenomatous polyps of the disease."
  - it: "Distinguere le varianti: forma attenuata, sindrome di Gardner, sindrome di Turcot e poliposi associata a MYH."
    en: "Distinguish the variants: attenuated FAP, Gardner syndrome, Turcot syndrome and MYH-associated polyposis."
  - it: "Spiegare perché la colectomia profilattica è la terapia curativa."
    en: "Explain why prophylactic colectomy is the curative treatment."
