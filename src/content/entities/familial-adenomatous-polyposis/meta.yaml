quickCheck:
  - id: familial-adenomatous-polyposis-q1
    q:
      it: "Quale gene è mutato nella poliposi adenomatosa familiare e in quale via di segnale agisce?"
      en: "Which gene is mutated in familial adenomatous polyposis, and in which signaling pathway does it act?"
    a:
      it: "APC, un gene oncosoppressore sul cromosoma 5q21-22, che partecipa alla via Wnt/β-catenina."
      en: "APC, a tumor suppressor gene at 5q21-22 that takes part in the Wnt/β-catenin pathway."
    kind: short
  - id: familial-adenomatous-polyposis-q2
    q:
      it: "Qual è la differenza tra FAP classica e FAP attenuata?"
      en: "How does attenuated FAP differ from classic FAP?"
    a:
      it: "Nella forma attenuata gli adenomi sono meno di 100 e il cancro compare in media circa 15 anni dopo."
      en: "Attenuated FAP has fewer than 100 adenomas, and cancer appears on average about 15 years later."
    kind: short
  - id: familial-adenomatous-polyposis-q3
    q:
      it: "Quale intervento è curativo se eseguito prima della comparsa del cancro?"
      en: "Which intervention is curative if done before cancer appears?"
    a:
      it: "La colectomia totale."
      en: "Total colectomy."
    kind: short
  - id: familial-adenomatous-polyposis-q4
    q:
      it: "Quali lesioni extracoloniche caratterizzano la sindrome di Gardner?"
      en: "Which extracolonic lesions characterize Gardner syndrome?"
    a:
      it: "Osteomi, tumori desmoidi e cisti epidermoidi."
      en: "Osteomas, desmoid tumors and epidermoid cysts."
    kind: short
  - id: familial-adenomatous-polyposis-q5
    q:
      it: "Come si trasmette la poliposi associata a MYH, e in che cosa differisce dalla FAP da APC?"
      en: "How is MYH-associated polyposis inherited, and how does it differ from APC-related FAP?"
    a:
      it: "Si trasmette in modo recessivo, con mutazione di entrambi gli alleli di MYH, e ha un quadro clinico che si sovrappone alla FAP."
      en: "It is inherited recessively, with both MYH alleles mutated, and its clinical picture overlaps with FAP."
    kind: short
selfExplain:
  - it: "In che modo APC, attraverso la via Wnt/β-catenina, influenza le cellule della mucosa del colon?"
    en: "How does APC, through the Wnt/β-catenin pathway, influence the cells of the colonic mucosa?"
  - it: "Perché la colectomia totale deve essere eseguita prima della comparsa del cancro per essere curativa?"
    en: "Why must total colectomy be done before cancer appears to be curative?"
