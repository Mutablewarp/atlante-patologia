summary:
  it: "Sindrome ereditaria autosomica dominante da mutazione germinale di APC, con centinaia o migliaia di adenomi nel colon-retto e carcinoma colorettale inevitabile se non si interviene."
  en: "Autosomal dominant inherited syndrome from a germline APC mutation, with hundreds to thousands of colorectal adenomas and inevitable colorectal cancer if untreated."
