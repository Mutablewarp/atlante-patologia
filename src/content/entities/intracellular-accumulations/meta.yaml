      it: "α1-antitripsina mutante (PiZ) trattenuta nel reticolo endoplasmatico degli epatociti"
      en: "Mutant (PiZ) α1-antitrypsin retained in the hepatocyte endoplasmic reticulum"
    sign:
      it: "Ittero colestatico neonatale; più tardi cirrosi ed enfisema"
      en: "Neonatal cholestatic jaundice; later cirrhosis and emphysema"
    lab:
      it: "Iperbilirubinemia coniugata; alla biopsia, globuli epatocitari PAS-positivi resistenti alla diastasi"
      en: "Conjugated hyperbilirubinemia; PAS-positive, diastase-resistant hepatocyte globules on biopsy"
  - pathology:
      it: "Accumulo di glicogeno nel fegato per deficit di glucosio-6-fosfatasi (malattia di von Gierke)"
      en: "Hepatic glycogen storage from glucose-6-phosphatase deficiency (von Gierke disease)"
    sign:
      it: "Epatomegalia marcata e crisi ipoglicemiche nel lattante"
      en: "Marked hepatomegaly and hypoglycemic episodes in infancy"
    lab:
      it: "Ipoglicemia; acidosi lattica durante infezioni intercorrenti"
      en: "Hypoglycemia; lactic acidosis during intercurrent infections"
