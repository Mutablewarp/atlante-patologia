relations:
  - type: complicationOf
    target: multiple-myeloma
    note:
      it: "È la nefropatia più frequente del mieloma multiplo."
      en: "It is the most common kidney disease of multiple myeloma."
  - type: differentialOf
    target: amyloidosis
    note:
      it: "Una proteinuria in range nefrosico nel mieloma orienta verso l'amiloidosi AL."
      en: "Nephrotic-range proteinuria in myeloma points toward AL amyloidosis."
quickCheck:
  - id: light-chain-cast-nephropathy-q1
    q:
      it: "Perché si formano i cilindri nei tubuli distali?"
      en: "Why do casts form in the distal tubules?"
    a:
      it: "Nell'urina acida le catene leggere si legano alla glicoproteina di Tamm–Horsfall secreta dalle cellule tubulari distali."
      en: "In acidic urine, light chains bind Tamm–Horsfall glycoprotein secreted by distal tubular cells."
    kind: short
  - id: light-chain-cast-nephropathy-q2
    q:
      it: "In quali due modi le catene leggere danneggiano il rene?"
      en: "In which two ways do light chains damage the kidney?"
    a:
      it: "Tossicità diretta sull'epitelio tubulare e ostruzione tubulare da parte dei cilindri."
      en: "Direct toxicity to tubular epithelium and tubular obstruction by casts."
    kind: short
  - id: light-chain-cast-nephropathy-q3
    q:
      it: "Un paziente con mieloma ha proteinuria in range nefrosico: quale diagnosi è più probabile?"
      en: "A myeloma patient has nephrotic-range proteinuria: which diagnoses are more likely?"
    a:
      it: "Amiloidosi AL o malattia da deposizione di catene leggere, piuttosto che nefropatia da cilindri."
      en: "AL amyloidosis or light-chain deposition disease rather than cast nephropathy."
    kind: short
selfExplain:
  - it: "Perché l'urina acida favorisce la formazione dei cilindri?"
    en: "Why does acidic urine favor cast formation?"
  - it: "Perché i cilindri e le catene leggere libere insieme riducono la funzione renale?"
    en: "Why do casts and free light chains together reduce kidney function?"
