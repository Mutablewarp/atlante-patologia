names:
  it: "Nefropatia da cilindri (rene da mieloma)"
  en: "Light-chain cast nephropathy (myeloma kidney)"
  eponyms: []
  synonyms:
    it: ["Rene da mieloma"]
    en: ["Myeloma kidney"]
  abbreviations: []
summary:
  it: "Danno renale da catene leggere monoclonali nelle urine, che lesionano l'epitelio tubulare e formano cilindri ostruenti; è la nefropatia più frequente nel mieloma multiplo."
  en: "Kidney injury from monoclonal light chains in the urine, which damage tubular epithelium and form obstructing casts; the most common kidney disease in multiple myeloma."
lenses:
  system: [kidney, hematolymphoid]
  process: [extracellular-accumulation, repair-fibrosis]
  pattern: [hyaline-change]
  presentation: []
  marker: [ihc]
  group: [neoplastic]
learningObjectives:
  - it: "Spiegare come le catene leggere libere formano cilindri con la proteina di Tamm–Horsfall nell'urina acida."
    en: "Explain how free light chains form casts with Tamm–Horsfall protein in acidic urine."
  - it: "Riconoscere al microscopio i cilindri ialini fratturati con cellule giganti."
    en: "Recognize fractured hyaline casts with giant cells under the microscope."
  - it: "Indicare i due meccanismi del danno renale: tossicità tubulare e ostruzione."
    en: "State the two mechanisms of kidney damage: tubular toxicity and obstruction."
  - it: "Distinguere la nefropatia da cilindri dall'amiloidosi AL e dalla malattia da deposizione di catene leggere."
    en: "Distinguish cast nephropathy from AL amyloidosis and light-chain deposition disease."
