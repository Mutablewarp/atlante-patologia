    en: "What do you see under the microscope in a biopsy of chronic viral hepatitis? Tell me about interface hepatitis, ground-glass hepatocytes and lymphoid aggregates."
    focus: [micro]
    level: 1
  - it: "Mi parli di HBV, HCV e HDV: genoma, trasmissione e rapporto tra HDV e HBV."
    en: "Tell me about HBV, HCV and HDV: genome, transmission, and the relationship between HDV and HBV."
    focus: [etiology]
    level: 1
  - it: "Quando la biopsia epatica è utile nell'epatite C e che cosa cercherebbe, con quali colorazioni?"
    en: "When is a liver biopsy useful in hepatitis C, and what would you look for, with which stains?"
    focus: [ancillary, micro]
    level: 2
  - it: "Perché il danno epatico nell'epatite B cronica dipende dalla risposta immunitaria e come cambia nelle tre fasi della malattia?"
    en: "Why does liver injury in chronic hepatitis B depend on the immune response, and how does it change across the three phases of the disease?"
    focus: [pathogenesis]
    level: 2
  - it: "Come distingue un'infezione cronica da HBV da una guarigione, in base a HBsAg, anti-HBs e anti-HBc?"
    en: "How do you tell chronic HBV infection from recovery, using HBsAg, anti-HBs and anti-HBc?"
    focus: [diagnosis]
    level: 3
  - it: "Come distingue l'epatite virale cronica dall'epatite virale acuta e dall'epatite autoimmune?"
    en: "How do you tell chronic viral hepatitis from acute viral hepatitis and from autoimmune hepatitis?"
    focus: [differential, micro]
    level: 3
