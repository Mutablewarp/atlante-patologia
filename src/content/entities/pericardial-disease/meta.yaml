learningObjectives:
  - it: "Spiegare perché un versamento pericardico rapido, anche piccolo, causa tamponamento mentre uno lento è tollerato."
    en: "Explain why a rapid pericardial effusion, even a small one, causes tamponade while a slow one is tolerated."
  - it: "Distinguere le forme di pericardite acuta (fibrinosa, purulenta, emorragica) per aspetto e cause."
    en: "Distinguish the forms of acute pericarditis (fibrinous, purulent, hemorrhagic) by appearance and cause."
  - it: "Descrivere la pericardite costrittiva come esito cicatriziale e il quadro che simula uno scompenso destro."
    en: "Describe constrictive pericarditis as a scarring outcome and the picture that mimics right heart failure."
  - it: "Riconoscere il dolore pericarditico e lo sfregamento pericardico e distinguerli dall'infarto."
    en: "Recognize pericarditic pain and the friction rub and tell them apart from infarction."
