relations:
  - type: complicationOf
    target: myocardial-infarction
    note:
      it: "La rottura della parete libera ventricolare causa emopericardio; l'infarto può dare anche pericardite."
      en: "Rupture of the ventricular free wall causes hemopericardium; infarction can also cause pericarditis."
  - type: complicationOf
    target: rheumatic-heart-disease
    note:
      it: "La pericardite può complicare la febbre reumatica."
      en: "Pericarditis may complicate rheumatic fever."
  - type: sharesMechanism
    target: myocarditis
    note:
      it: "Le cause della pericardite sono simili a quelle della miocardite."
      en: "The causes of pericarditis are similar to those of myocarditis."
  - type: mimics
    target: cardiac-hypertrophy-and-heart-failure
    note:
      it: "La pericardite costrittiva può simulare uno scompenso cardiaco destro."
      en: "Constrictive pericarditis may mimic right heart failure."
quickCheck:
  - id: pericardial-disease-q1
    q:
      it: "Perché un piccolo versamento che si forma in fretta può causare tamponamento, mentre un versamento grande e lento no?"
      en: "Why can a small, fast effusion cause tamponade while a large, slow one does not?"
    a:
      it: "Un pericardio distendibile lentamente si adatta; un aumento rapido alza la pressione nel sacco oltre la pressione venosa centrale e limita il riempimento."
      en: "A slowly stretched pericardium adapts; a rapid rise lifts sac pressure above central venous pressure and limits filling."
    kind: short
  - id: pericardial-disease-q2
    q:
      it: "Come si distingue il dolore della pericardite da quello dell'infarto?"
      en: "How does pericarditis pain differ from infarct pain?"
    a:
      it: "Non si irradia lungo il braccio sinistro, e si associa a sfregamento pericardico."
      en: "It does not radiate down the left arm, and a friction rub is present."
    kind: short
  - id: pericardial-disease-q3
    q:
      it: "Perché la pericardite costrittiva non è una forma di infiammazione attiva?"
      en: "Why is constrictive pericarditis not an active inflammation?"
    a:
      it: "Perché è l'esito di una guarigione esuberante dopo un danno acuto: il sacco è obliterato da tessuto fibroso denso."
      en: "Because it is the outcome of overshooting healing after acute injury: the sac is obliterated by dense fibrous tissue."
    kind: short
  - id: pericardial-disease-q4
    q:
      it: "Qual è la forma più frequente di pericardite acuta e quale segno clinico causa?"
      en: "What is the most common form of acute pericarditis and which clinical sign does it cause?"
    a:
      it: "La pericardite fibrinosa: le superfici ruvide causano lo sfregamento pericardico."
      en: "Fibrinous pericarditis: its rough surfaces cause a friction rub."
    kind: short
  - id: pericardial-disease-q5
    q:
      it: "Qual è la causa più comune di emopericardio?"
      en: "What is the most common cause of hemopericardium?"
    a:
      it: "La rottura della parete libera ventricolare in un infarto."
      en: "Rupture of the ventricular free wall at an infarct."
    kind: short
