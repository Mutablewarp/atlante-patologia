summary:
  it: "Raccolta di liquido nella cavità pericardica (versamento, fino al tamponamento cardiaco) e infiammazione del pericardio, acuta (sierosa, fibrinosa, purulenta, emorragica) o cronica costrittiva."
  en: "Fluid collecting in the pericardial cavity (effusion, up to cardiac tamponade) and inflammation of the pericardium, acute (serous, fibrinous, purulent, hemorrhagic) or chronic constrictive."
