quickCheck:
  - id: pseudomembranous-colitis-q1
    q:
      it: "Perché una terapia antibiotica favorisce la colite da C. difficile?"
      en: "Why does antibiotic therapy favor C. difficile colitis?"
    a:
      it: "Gli antibiotici uccidono la flora intestinale protettiva; C. difficile, più resistente, si insedia e produce le tossine A e B."
      en: "Antibiotics kill the protective gut flora; the more resistant C. difficile gains a foothold and makes toxins A and B."
    kind: short
  - id: pseudomembranous-colitis-q2
    q:
      it: "Che cosa fanno la tossina A e la tossina B?"
      en: "What do toxin A and toxin B do?"
    a:
      it: "La tossina A attiva e recluta mediatori dell'infiammazione; la tossina B è direttamente citotossica."
      en: "Toxin A activates and recruits inflammatory mediators; toxin B is directly cytotoxic."
    kind: short
  - id: pseudomembranous-colitis-q3
    q:
      it: "Quali complicanze può dare la colite fulminante?"
      en: "Which complications can fulminant colitis cause?"
    a:
      it: "Perforazione del colon, megacolon tossico e morte."
      en: "Colonic perforation, toxic megacolon and death."
    kind: short
