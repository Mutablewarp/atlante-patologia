relations:
  - type: differentialOf
    target: pulmonary-hypertension
    note:
      it: "Il cuore polmonare ipertrofizza il ventricolo destro, non il sinistro."
      en: "Cor pulmonale thickens the right ventricle, not the left."
  - type: sharesMechanism
    target: ischemic-heart-disease
    note:
      it: "L'ipertensione si associa a un'aterosclerosi coronarica più grave."
      en: "Hypertension goes with more severe coronary atherosclerosis."
  - type: prerequisiteOf
    target: cardiac-hypertrophy-and-heart-failure
    note:
      it: "È una causa di ipertrofia seguita da scompenso."
