quickCheck:
  - id: hypertensive-heart-disease-q1
    q:
      it: "Che aspetto ha la cavità del ventricolo sinistro nelle fasi iniziali?"
      en: "What does the left ventricular cavity look like in the early stage?"
    a:
      it: "Non è dilatata: la parete è ispessita in modo uniforme (ipertrofia concentrica)."
      en: "It is not dilated: the wall is thickened evenly (concentric hypertrophy)."
    kind: short
  - id: hypertensive-heart-disease-q2
    q:
      it: "Che effetto ha l'ipertrofia miocardica sullo stress di parete aumentato?"
      en: "What does myocardial hypertrophy do to the raised wall stress?"
    a:
      it: "Riporta lo stress di parete elevato verso la norma."
      en: "It brings the elevated wall stress back toward normal."
    kind: short
  - id: hypertensive-heart-disease-q3
    q:
      it: "Qual è la principale causa di morte nell'ipertensione non trattata?"
      en: "What is the main cause of death in untreated hypertension?"
    a:
      it: "Lo scompenso cardiaco."
      en: "Heart failure."
    kind: short
selfExplain:
  - it: "Perché oltre un certo limite l'ipertrofia smette di compensare?"
    en: "Why does hypertrophy stop compensating beyond a certain limit?"
  - it: "Perché l'ipertensione aumenta il rischio di ischemia miocardica?"
    en: "Why does hypertension raise the risk of myocardial ischemia?"
examQuestions:
  - it: "Mi parli della cardiopatia ipertensiva: quando si può porre questa diagnosi e che aspetto ha il cuore?"
    en: "Tell me about hypertensive heart disease: when can the diagnosis be made, and what does the heart look like?"
    focus: [diagnosis, gross]
    level: 1
  - it: "Perché il ventricolo sinistro si ispessisce nell'ipertensione e che effetto ha questo sullo stress di parete?"
    en: "Why does the left ventricle thicken in hypertension, and what does this do to wall stress?"
    focus: [etiology, pathogenesis]
    level: 2
  - it: "Come distingue un'ipertrofia da ipertensione sistemica da quella del cuore polmonare, e quali complicanze fatali si attende nell'ipertensione non trattata?"
    en: "How do you tell hypertrophy from systemic hypertension from that of cor pulmonale, and which fatal complications do you expect in untreated hypertension?"
    focus: [differential, prognosis]
    level: 3
