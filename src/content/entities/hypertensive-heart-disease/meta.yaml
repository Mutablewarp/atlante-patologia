learningObjectives:
  - it: "Definire la cardiopatia ipertensiva e il criterio di esclusione di altre cause di cuore ingrandito."
    en: "Define hypertensive heart disease and the criterion of excluding other causes of an enlarged heart."
  - it: "Descrivere l'ipertrofia concentrica del ventricolo sinistro a livello macroscopico e microscopico."
    en: "Describe concentric left ventricular hypertrophy grossly and microscopically."
  - it: "Spiegare perché la disfunzione diastolica compare e come porta allo scompenso."
    en: "Explain why diastolic dysfunction appears and how it leads to heart failure."
  - it: "Elencare le complicanze e le cause di morte dell'ipertensione non trattata."
    en: "List the complications and causes of death of untreated hypertension."
