summary:
  it: "Danno cardiaco da ipertensione arteriosa di lunga durata: ipertrofia concentrica del ventricolo sinistro, disfunzione diastolica e, se non trattata, scompenso cardiaco."
  en: "Cardiac damage from long-standing hypertension: concentric left ventricular hypertrophy, diastolic dysfunction and, if untreated, heart failure."
