summary:
  it: "Formazione, dentro un vaso o una cavità cardiaca, di una massa di sangue coagulato aderente all'endotelio, favorita da lesione endoteliale, stasi o turbolenza e stato di ipercoagulabilità."
  en: "Formation, inside a vessel or heart chamber, of a mass of clotted blood attached to the endothelium, favored by endothelial injury, stasis or turbulence, and a hypercoagulable state."
