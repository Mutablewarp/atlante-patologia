quickCheck:
  - id: lung-carcinoid-tumors-q1
    q:
      it: "Quali due criteri rendono atipico un carcinoide polmonare?"
      en: "Which two criteria make a lung carcinoid atypical?"
    a:
      it: "Da 2 a 10 mitosi per 2 mm² oppure la presenza di necrosi."
      en: "2 to 10 mitoses per 2 mm² or the presence of necrosis."
    kind: short
  - id: lung-carcinoid-tumors-q2
    q:
      it: "Perché un carcinoide centrale può causare polmonite?"
      en: "Why can a central carcinoid cause pneumonia?"
    a:
      it: "Cresce nel lume del bronco e lo ostruisce: il polmone a valle si infiamma (polmonite post-ostruttiva)."
      en: "It grows into the bronchial lumen and obstructs it, so the lung beyond becomes inflamed (postobstructive pneumonia)."
    kind: short
  - id: lung-carcinoid-tumors-q3
    q:
      it: "Il carcinoide polmonare è legato al fumo di sigaretta?"
      en: "Is lung carcinoid related to cigarette smoking?"
    a:
      it: "No, non è correlato al fumo di sigaretta."
      en: "No, it is not related to cigarette smoking."
    kind: short
  - id: lung-carcinoid-tumors-q4
    q:
      it: "Quale carcinoide ha la prognosi migliore dopo chirurgia, e con quali numeri?"
      en: "Which carcinoid has the better prognosis after surgery, and with what numbers?"
    a:
      it: "Il tipico: sopravvivenza a cinque anni del 90%, contro il 60% dell'atipico."
      en: "The typical one: 90% five-year survival, against 60% for atypical."
    kind: short
  - id: lung-carcinoid-tumors-q5
    q:
      it: "La sindrome da carcinoide è frequente nei carcinoidi polmonari?"
      en: "Is carcinoid syndrome common in lung carcinoids?"
    a:
      it: "No: la maggior parte dei carcinoidi è endocrinologicamente silente e la sindrome compare nell'1% dei casi, di solito con metastasi epatiche."
      en: "No: most carcinoids are endocrinologically silent and the syndrome occurs in 1% of cases, usually with liver metastases."
    kind: short
selfExplain:
