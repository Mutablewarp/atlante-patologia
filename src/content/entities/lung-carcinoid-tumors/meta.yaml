learningObjectives:
  - it: "Distinguere il carcinoide tipico da quello atipico in base a mitosi e necrosi."
    en: "Distinguish typical from atypical carcinoid by mitoses and necrosis."
  - it: "Descrivere l'aspetto macroscopico del carcinoide centrale e le sue conseguenze sul bronco."
    en: "Describe the gross appearance of a central carcinoid and its effect on the bronchus."
  - it: "Riconoscere la presentazione clinica, compresa la sindrome da carcinoide."
    en: "Recognize the clinical presentation, including carcinoid syndrome."
  - it: "Confrontare prognosi e metastasi linfonodali dei due sottotipi."
    en: "Compare prognosis and nodal metastasis of the two subtypes."
