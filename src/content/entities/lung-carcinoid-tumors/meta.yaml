    en: "Why does atypical carcinoid have a worse prognosis than typical carcinoid?"
  - it: "Perché un carcinoide centrale può causare sintomi respiratori anche se cresce lentamente?"
    en: "Why can a central carcinoid cause respiratory symptoms even though it grows slowly?"
