  synonyms:
    it: ["Carcinoide bronchiale"]
    en: ["Bronchial carcinoid"]
  abbreviations: []
summary:
  it: "Tumori neuroendocrini del polmone, tipici o atipici, che nascono dalle cellule neuroendocrine dell'epitelio bronchiale; l'atipia si riconosce da mitosi e necrosi."
  en: "Neuroendocrine tumors of the lung, typical or atypical, arising from bronchial neuroendocrine cells; atypia is recognized by mitoses and necrosis."
