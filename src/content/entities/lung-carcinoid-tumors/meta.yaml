editionNote:
  it: "La classificazione dei tumori neuroendocrini del polmone è cambiata tra le edizioni: i valori soglia di mitosi e necrosi vanno confrontati con la classificazione OMS in vigore."
  en: "The classification of lung neuroendocrine tumors has changed between editions: check the mitosis and necrosis cut-offs against the current WHO classification."
names:
  it: "Tumori carcinoidi polmonari"
  en: "Pulmonary carcinoid tumors"
