quickCheck:
  - id: atelectasis-q1
    q:
      it: "Perché un bronco completamente ostruito porta al collasso del segmento a valle?"
      en: "Why does a completely blocked bronchus collapse the segment beyond it?"
    a:
      it: "Il gas degli alveoli passa nel sangue e non viene sostituito, quindi la regione collassa."
      en: "The alveolar gas passes into the blood and is not replaced, so the region collapses."
    kind: short
  - id: atelectasis-q2
    q:
      it: "In quale direzione si sposta il mediastino nell'atelettasia grave da ostruzione e in quella da compressione grave?"
      en: "Which way does the mediastinum shift in severe obstructive collapse and in severe compression?"
    a:
      it: "Verso il lato colpito nell'ostruzione; lontano dal lato colpito nella compressione."
      en: "Toward the affected side in obstruction; away from it in compression."
    kind: short
  - id: atelectasis-q3
    q:
      it: "Quali complicanze può dare un'atelettasia di lunga durata?"
      en: "Which complications can long-standing atelectasis cause?"
    a:
      it: "Fibrosi del polmone collassato, polmonite o ascessi a valle e bronchiectasie."
      en: "Fibrosis of the collapsed lung, pneumonia or abscesses beyond the block, and bronchiectasis."
    kind: short
selfExplain:
