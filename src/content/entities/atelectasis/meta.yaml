learningObjectives:
  - it: "Definire l'atelettasia come collasso di tessuto polmonare in precedenza espanso."
    en: "Define atelectasis as collapse of previously expanded lung tissue."
  - it: "Spiegare perché l'ostruzione completa di un bronco porta al collasso del segmento a valle."
    en: "Explain why complete bronchial obstruction collapses the segment beyond it."
  - it: "Distinguere l'atelettasia da ostruzione da quella da compressione, anche per lo spostamento del mediastino."
    en: "Tell obstructive from compressive atelectasis, including the direction of mediastinal shift."
  - it: "Descrivere le conseguenze di un collasso prolungato, fibrosi e bronchiectasie."
    en: "Describe the consequences of prolonged collapse: fibrosis and bronchiectasis."
