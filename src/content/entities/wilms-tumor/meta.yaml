    focus: [etiology, pathogenesis]
    level: 2
  - it: "Che cos'è l'anaplasia nel tumore di Wilms e che peso ha sulla prognosi?"
    en: "What is anaplasia in Wilms tumor, and how does it affect the prognosis?"
    focus: [micro, prognosis]
