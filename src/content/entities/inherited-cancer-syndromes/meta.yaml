learningObjectives:
  - it: "Definire una sindrome tumorale ereditaria e indicarne la frequenza tra tutti i tumori."
    en: "Define an inherited cancer syndrome and state how common it is among all cancers."
  - it: "Spiegare perché il portatore è eterozigote e perché nel tumore vanno perduti entrambi gli alleli."
    en: "Explain why the carrier is heterozygous and why both alleles are lost in the tumor."
