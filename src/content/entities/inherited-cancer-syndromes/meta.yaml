  - it: "Perché nel tumore di un portatore sono inattivati entrambi gli alleli, pur essendo il portatore eterozigote?"
    en: "Why are both alleles inactivated in a carrier's tumor, when the carrier is heterozygous?"
    focus: [micro]
    level: 2
  - it: "Come distingue una sindrome tumorale ereditaria da un tumore sporadico e da una semplice aggregazione familiare?"
