summary:
  it: "Condizioni dovute a mutazioni germinali, soprattutto di geni oncosoppressori e di riparo del DNA, che conferiscono un'elevata suscettibilità al cancro; rappresentano circa l'1% dei tumori."
  en: "Conditions caused by germline mutations, mostly of tumor suppressor and DNA repair genes, that confer a high susceptibility to cancer; they account for about 1% of cancers."
