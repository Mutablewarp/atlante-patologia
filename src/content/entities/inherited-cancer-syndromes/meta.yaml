quickCheck:
  - id: inherited-cancer-syndromes-q1
    q:
      it: "Che cosa si eredita in una sindrome tumorale ereditaria?"
      en: "What is inherited in an inherited cancer syndrome?"
    a:
      it: "Un'elevata suscettibilità al cancro, non il tumore: nel tumore va perso anche il secondo allele."
      en: "A high susceptibility to cancer, not the tumor: the second allele is lost in the tumor."
    kind: short
  - id: inherited-cancer-syndromes-q2
    q:
      it: "Qual è il genotipo germinale di un portatore e quale quello del tumore?"
      en: "What is the germline genotype of a carrier, and what is that of the tumor?"
    a:
      it: "Il portatore è eterozigote; nel tumore entrambi gli alleli oncosoppressori sono inattivati, per perdita di eterozigosi."
      en: "The carrier is heterozygous; in the tumor both tumor suppressor alleles are inactivated through loss of heterozygosity."
    kind: short
  - id: inherited-cancer-syndromes-q3
    q:
      it: "La perdita germinale di PTEN (sindrome di Cowden) causa soprattutto tumori maligni?"
      en: "Does germline PTEN loss (Cowden syndrome) mainly cause malignant tumors?"
    a:
      it: "No: è associata soprattutto ad amartomi benigni, benché la riduzione di PTEN sia frequente in molti tumori maligni."
      en: "No: it is mainly associated with benign hamartomas, although reduced PTEN is common in many malignancies."
    kind: short
selfExplain:
  - it: "Perché un solo allele mutato ereditato comporta un rischio elevato di cancro?"
    en: "Why does one inherited mutated allele carry a high cancer risk?"
  - it: "Perché le sindromi ereditarie spiegano solo circa l'1% dei tumori, pur essendo l'aggregazione familiare più frequente?"
    en: "Why do inherited syndromes explain only about 1% of cancers, even though familial clustering is more common?"
examQuestions:
  - it: "Mi parli delle sindromi tumorali ereditarie: che cosa si eredita e quali geni sono coinvolti?"
