      it: "Necrosi fibrinoide delle arteriole renali nell'ipertensione maligna"
      en: "Fibrinoid necrosis of renal arterioles in malignant hypertension"
    sign:
      it: "Cefalea e disturbi visivi"
      en: "Headache and visual disturbance"
    lab:
      it: "Ematuria e proteinuria"
      en: "Hematuria and proteinuria"
  - pathology:
      it: "Necrosi fibrinoide delle venule cutanee superficiali (vasculite leucocitoclastica)"
      en: "Fibrinoid necrosis of superficial skin venules (leukocytoclastic vasculitis)"
    sign:
      it: "Porpora palpabile agli arti inferiori"
      en: "Palpable purpura on the legs"
    lab:
      it: "Biopsia cutanea con necrosi fibrinoide e neutrofili"
      en: "Skin biopsy with fibrinoid necrosis and neutrophils"
  - pathology:
      it: "Microangiopatia trombotica con necrosi fibrinoide arteriolare"
      en: "Thrombotic microangiopathy with arteriolar fibrinoid necrosis"
    sign:
      it: "Ipertensione e insufficienza renale"
      en: "Hypertension and renal failure"
    lab:
      it: "Anemia emolitica con schistociti e piastrinopenia"
      en: "Hemolytic anemia with schistocytes and thrombocytopenia"
examQuestions:
  - it: "Mi parli della necrosi fibrinoide: che cos'è e in quali condizioni la ritrova?"
    en: "Tell me about fibrinoid necrosis: what is it, and in which conditions do you find it?"
    focus: [definition, etiology, high-yield]
    level: 1
  - it: "Che cosa vede al microscopio, in una sezione colorata con ematossilina-eosina, nella parete di un vaso con necrosi fibrinoide? E perché il termine «necrosi» è in parte improprio?"
    en: "What do you see under the microscope, in a section stained with hematoxylin and eosin, in the wall of a vessel with fibrinoid necrosis? And why is the word \"necrosis\" partly misleading?"
    focus: [micro, definition, traps]
    level: 1
  - it: "Come si arriva alla necrosi fibrinoide nelle vasculiti da immunocomplessi? Mi descriva il ruolo del complemento e dei neutrofili."
    en: "How do immune complex vasculitides lead to fibrinoid necrosis? Describe the roles of complement and neutrophils."
    focus: [pathogenesis, high-yield]
    level: 2
  - it: "Quali colorazioni e quali altre tecniche userebbe per studiare una biopsia con necrosi fibrinoide, per esempio una biopsia renale?"
    en: "Which stains and which other techniques would you use to study a biopsy with fibrinoid necrosis, for example a kidney biopsy?"
    focus: [ancillary, diagnosis]
    level: 2
  - it: "Come distingue la necrosi fibrinoide dall'arteriolosclerosi ialina, dall'amiloide e da un trombo di fibrina?"
    en: "How do you tell fibrinoid necrosis from hyaline arteriolosclerosis, from amyloid and from a fibrin thrombus?"
    focus: [differential, traps, ancillary]
    level: 3
  - it: "Un paziente con ipertensione maligna: che cosa trova nelle arteriole del rene, che cosa segue alla necrosi fibrinoide e quali segni clinici e di laboratorio si aspetta?"
    en: "A patient with malignant hypertension: what do you find in the arterioles of the kidney, what follows the fibrinoid necrosis, and which clinical and laboratory signs do you expect?"
    focus: [micro, clinical, diagnosis]
