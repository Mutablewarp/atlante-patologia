summary:
  it: "Crescita di un tumore maligno nei tessuti circostanti e diffusione delle sue cellule a sedi non contigue, per via linfatica, ematica o attraverso le cavità corporee: la causa della maggior parte dei decessi per cancro."
  en: "Growth of a malignant tumor into the surrounding tissue and spread of its cells to non-contiguous sites by lymphatic, blood or body-cavity routes: the cause of most cancer deaths."
