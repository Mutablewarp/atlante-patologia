      en: "Carcinoma in situ has not crossed the basement membrane; invasion begins when it does."
quickCheck:
  - id: invasion-and-metastasis-q1
    q:
      it: "Che cosa distingue un carcinoma in situ da un carcinoma invasivo?"
      en: "What separates a carcinoma in situ from an invasive carcinoma?"
    a:
      it: "Il carcinoma in situ non ha attraversato la membrana basale epiteliale, quello invasivo sì."
      en: "A carcinoma in situ has not crossed the epithelial basement membrane; an invasive one has."
    kind: short
  - id: invasion-and-metastasis-q2
    q:
      it: "Perché i tumori addominali drenati dal sistema portale metastatizzano spesso al fegato?"
      en: "Why do abdominal tumors drained by the portal system often metastasize to the liver?"
    a:
      it: "Perché il flusso venoso dall'organo d'origine porta le cellule tumorali al letto vascolare epatico."
      en: "Because venous flow from the organ of origin carries tumor cells to the hepatic vascular bed."
    kind: short
  - id: invasion-and-metastasis-q3
    q:
      it: "Perché la perdita di E-caderina favorisce l'invasione?"
      en: "Why does loss of E-cadherin favor invasion?"
    a:
      it: "L'E-caderina lega tra loro le cellule epiteliali e ne frena la motilità; senza di essa le cellule si staccano e si muovono."
      en: "E-cadherin binds epithelial cells together and restrains motility; without it the cells detach and move."
    kind: short
  - id: invasion-and-metastasis-q4
    q:
      it: "Perché la stadiazione prevede il decorso meglio del grado?"
      en: "Why does staging predict the course better than grading?"
    a:
      it: "Perché la stadiazione riflette il comportamento reale del tumore nel paziente; anche tumori di basso grado possono essere molto aggressivi."
      en: "Because staging reflects the tumor's actual behavior in the patient; even low-grade tumors can be very aggressive."
    kind: short
  - id: invasion-and-metastasis-q5
    q:
      it: "La dormienza di una micrometastasi è uno stato di quiete assoluta?"
      en: "Is dormancy of a micrometastasis a state of complete rest?"
    a:
      it: "No. Le cellule continuano a proliferare e a morire a ritmi bassi che si bilanciano."
      en: "No. The cells keep proliferating and dying at low rates that offset each other."
    kind: short
