  presentation: [lymphadenopathy, mass-lesion]
  marker: [ihc]
  group: [neoplastic]
learningObjectives:
  - it: "Definire invasione e metastasi e distinguere il carcinoma in situ dal carcinoma invasivo."
    en: "Define invasion and metastasis and distinguish carcinoma in situ from invasive carcinoma."
  - it: "Descrivere le tappe della cascata metastatica, dalla transizione epitelio-mesenchimale alla dormienza."
    en: "Describe the steps of the metastatic cascade, from epithelial-mesenchymal transition to dormancy."
  - it: "Confrontare le vie di diffusione linfatica, ematica e per disseminazione nelle cavità corporee."
    en: "Compare lymphatic, hematogenous and body-cavity spread."
  - it: "Spiegare il tropismo d'organo con l'ipotesi del seme e del terreno."
    en: "Explain organ tropism with the seed and soil hypothesis."
  - it: "Leggere una stadiazione TNM e spiegare perché lo stadio prevede il decorso meglio del grado."
    en: "Read a TNM stage and explain why stage predicts the course better than grade."
