  - it: "Mi parli della carcinosi linfangitica: da quali tumori primitivi deriva e come si diffonde?"
    en: "Tell me about lymphangitic carcinoma: which primary tumors cause it and how does it spread?"
    focus: [etiology, pathogenesis]
    level: 1
  - it: "Che cosa vede al microscopio in una metastasi polmonare, e che cosa suggerisce una crescita lepidica mucinosa?"
    en: "What do you see under the microscope in a lung metastasis, and what does a mucinous lepidic pattern suggest?"
    focus: [micro, etiology]
    level: 2
  - it: "Perché la carcinosi linfangitica dà un quadro reticolonodulare alla radiografia del torace?"
    en: "Why does lymphangitic carcinoma give a reticulonodular pattern on the chest radiograph?"
    focus: [pathogenesis, diagnosis]
    level: 2
  - it: "Come distingue le metastasi nodulari «a palla di cannone» dalla carcinosi linfangitica?"
    en: "How do you tell cannon ball nodular metastases from lymphangitic carcinoma?"
    focus: [gross, diagnosis, differential]
    level: 3
