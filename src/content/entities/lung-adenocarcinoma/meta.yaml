names:
  it: "Adenocarcinoma polmonare"
  en: "Lung adenocarcinoma"
  eponyms: []
  synonyms:
    it: []
    en: ["Pulmonary adenocarcinoma"]
  abbreviations: ["AAH", "AIS", "MIA"]
summary:
  it: "Carcinoma polmonare con differenziazione ghiandolare, oggi il sottotipo più frequente e il più comune nei non fumatori, classificato in base al pattern di crescita predominante."
  en: "Lung carcinoma with glandular differentiation, now the most frequent subtype and the most common in nonsmokers, classified by its predominant growth pattern."
lenses:
  system: [respiratory]
  process: [neoplasia]
  pattern: [dysplasia]
  presentation: [mass-lesion]
