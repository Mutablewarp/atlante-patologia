editionNote:
  it: "La classificazione dell'adenocarcinoma polmonare è stata rivista di recente (termine «bronchioloalveolare» abbandonato); la scheda segue una sola edizione del testo di riferimento, quindi termini e percentuali vanno confrontati con una fonte aggiornata."
  en: "The classification of lung adenocarcinoma was revised recently (the term bronchioloalveolar was dropped); this card follows one edition of the reference, so terms and percentages should be checked against a current source."
status: published
