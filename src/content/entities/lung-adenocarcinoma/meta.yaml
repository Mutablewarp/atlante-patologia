    en: "Tell me about lung adenocarcinoma in nonsmokers: how common is it, and who is affected?"
    focus: [definition, etiology, clinical]
    level: 1
  - it: "Perché si ritiene che l'AAH sia un precursore dell'adenocarcinoma, e che cosa resta incerto?"
    en: "Why is AAH thought to be a precursor of adenocarcinoma, and what is still uncertain?"
    focus: [pathogenesis]
