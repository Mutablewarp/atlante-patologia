    en: "Why is AAH thought to be a precursor of adenocarcinoma?"
  - it: "Perché, dopo resezione completa, conta stabilire quale pattern di crescita predomina?"
    en: "Why does it matter, after complete resection, to establish which growth pattern predominates?"
