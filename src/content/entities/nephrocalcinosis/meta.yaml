learningObjectives:
  - it: "Distinguere la nefrocalcinosi metastatica (da ipercalcemia) da quella distrofica (in tessuto danneggiato)."
    en: "Distinguish metastatic nephrocalcinosis (from hypercalcemia) from dystrophic calcification (in injured tissue)."
  - it: "Elencare gli stati ipercalcemici che portano a nefrocalcinosi."
    en: "List the hypercalcemic states that lead to nephrocalcinosis."
  - it: "Descrivere dove si depositano il calcio e i cristalli di urato nei tubuli e nell'interstizio."
    en: "Describe where calcium and urate crystals deposit in the tubules and interstitium."
