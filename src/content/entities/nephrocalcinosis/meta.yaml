relations:
  - type: sharesMechanism
    target: metastatic-calcification
    note:
      it: "La nefrocalcinosi da ipercalcemia è una calcificazione metastatica."
      en: "Nephrocalcinosis from hypercalcemia is metastatic calcification."
  - type: sharesMechanism
    target: dystrophic-calcification
    note:
      it: "La calcificazione di infarti o necrosi corticale è distrofica."
