summary:
  it: "Deposito di calcio nel parenchima renale (spesso da ipercalcemia) o di cristalli di urato nei tubuli e nell'interstizio (da iperuricemia, per esempio nella gotta o nella sindrome da lisi tumorale)."
  en: "Deposition of calcium in the renal parenchyma (often from hypercalcemia) or of urate crystals in the tubules and interstitium (from hyperuricemia, for example in gout or tumor lysis syndrome)."
