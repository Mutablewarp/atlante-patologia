    note:
      it: "L'ipercalcemia grave può dare nefrocalcinosi."
      en: "Severe hypercalcemia can cause nephrocalcinosis."
quickCheck:
  - id: nephrocalcinosis-q1
    q:
      it: "Perché la nefrocalcinosi da ipercalcemia è detta calcificazione metastatica?"
      en: "Why is nephrocalcinosis from hypercalcemia called metastatic calcification?"
    a:
      it: "Perché il calcio precipita nel rene per l'eccesso nel sangue e non per un danno locale."
      en: "Because calcium precipitates in the kidney from excess in the blood, not from local injury."
    kind: short
  - id: nephrocalcinosis-q2
    q:
      it: "Come si vedono i cristalli di urato in istologia?"
      en: "How are urate crystals seen in histology?"
    a:
      it: "Sono amorfi dopo la processazione di routine ma birifrangenti nelle sezioni al congelatore."
      en: "They are amorphous after routine processing but birefringent in frozen sections."
    kind: short
  - id: nephrocalcinosis-q3
    q:
      it: "Quale reperto è diagnostico di nefropatia uratica cronica?"
      en: "Which finding is diagnostic of chronic urate nephropathy?"
    a:
      it: "Il tofo gottoso."
      en: "The gouty tophus."
    kind: short
  - id: nephrocalcinosis-q4
    q:
      it: "Quali stati ipercalcemici portano a nefrocalcinosi?"
      en: "Which hypercalcemic states lead to nephrocalcinosis?"
    a:
      it: "Sarcoidosi, eccesso di vitamina D, tumori che distruggono l'osso e iperparatiroidismo primario."
      en: "Sarcoidosis, vitamin D excess, bone-destroying tumors and primary hyperparathyroidism."
    kind: short
  - id: nephrocalcinosis-q5
    q:
      it: "Che cosa indicano le strie gialle nelle papille?"
      en: "What do yellow streaks in the papillae point to?"
    a:
      it: "Una nefropatia uratica acuta, con acido urico cristallizzato nei dotti collettori."
      en: "Acute urate nephropathy, with uric acid crystallized inside the collecting ducts."
    kind: short
