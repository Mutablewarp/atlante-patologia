quickCheck:
  - id: liver-metastases-q1
    q:
      it: "Qual è la neoplasia maligna più frequente nel fegato?"
      en: "What is the most common malignancy in the liver?"
    a:
      it: "La metastasi da un altro organo."
      en: "A metastasis from another organ."
    kind: short
  - id: liver-metastases-q2
    q:
      it: "Quali tumori primitivi metastatizzano più spesso al fegato?"
      en: "Which primary tumors most often metastasize to the liver?"
    a:
      it: "Tumori di apparato gastrointestinale, mammella e polmone; spesso anche pancreas, melanoma e neoplasie ematologiche."
      en: "Cancers of the gastrointestinal tract, breast and lung; often also pancreas, melanoma and hematologic malignancies."
    kind: short
  - id: liver-metastases-q3
    q:
      it: "Solo certi tumori possono dare metastasi epatiche?"
      en: "Can only certain tumors metastasize to the liver?"
    a:
      it: "No, qualsiasi tumore può farlo."
      en: "No, any tumor can."
    kind: short
