      en: "Classic cause of macronodular cirrhosis."
quickCheck:
  - id: cirrhosis-q1
    q:
      it: "Quali tre processi producono la cirrosi?"
      en: "Which three processes produce cirrhosis?"
    a:
      it: "Morte e rigenerazione degli epatociti, deposizione di matrice da parte delle cellule stellate attivate e alterazione dell'architettura vascolare."
      en: "Hepatocyte death and regeneration, matrix deposition by activated stellate cells, and altered vascular architecture."
    kind: short
  - id: cirrhosis-q2
    q:
      it: "Quale pattern di cirrosi è tipico dell'alcol e quale dell'epatite cronica?"
      en: "Which cirrhosis pattern is typical of alcohol and which of chronic hepatitis?"
    a:
      it: "Micronodulare per l'alcol, con noduli di meno di 3 mm; macronodulare per l'epatite cronica."
      en: "Micronodular for alcohol, with nodules under 3 mm; macronodular for chronic hepatitis."
    kind: short
  - id: cirrhosis-q3
    q:
      it: "Perché la cirrosi causa ipertensione portale?"
      en: "Why does cirrhosis cause portal hypertension?"
    a:
      it: "La fibrosi ostruisce i sinusoidi intraepatici, ostacola l'afflusso portale e fa salire la pressione nella vena porta."
      en: "Fibrosis obstructs the intrahepatic sinusoids, impedes portal inflow and raises portal vein pressure."
    kind: short
selfExplain:
  - it: "Perché nella cirrosi avanzata spesso non si riesce più a risalire alla causa dall'aspetto morfologico?"
    en: "Why can the cause often no longer be recognized from the morphology in advanced cirrhosis?"
  - it: "Perché l'insufficienza epatica provoca sanguinamento?"
    en: "Why does hepatic failure cause bleeding?"
