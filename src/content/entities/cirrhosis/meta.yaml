id: cirrhosis
module: o20
tier: core
kind: disease
names:
  it: "Cirrosi epatica"
  en: "Cirrhosis"
  eponyms: ["Laennec cirrhosis"]
  synonyms:
    it: ["Cirrosi"]
    en: ["Hepatic cirrhosis"]
  abbreviations: []
summary:
  it: "Distruzione dell'architettura normale del fegato da parte di setti fibrosi attorno a noduli rigenerativi di epatociti, conseguenza di una necrosi epatocitaria persistente."
  en: "Liver disease in which lasting hepatocyte necrosis leads to fibrous septa and regenerating nodules that replace the normal structure."
lenses:
  system: [liver-biliary]
  process: [chronic-inflammation, repair-fibrosis]
  pattern: [hyaline-change, fatty-change]
  presentation: [jaundice, edema, organomegaly]
  marker: [laboratory]
  group: [inflammatory, toxic-environmental, metabolic]
learningObjectives:
  - it: "Definire la cirrosi come fibrosi con noduli rigenerativi consecutiva a necrosi epatocitaria persistente."
    en: "Define cirrhosis as fibrosis with regenerative nodules following persistent hepatocyte necrosis."
  - it: "Distinguere la cirrosi micronodulare da quella macronodulare e collegarle alle cause più tipiche."
    en: "Distinguish micronodular from macronodular cirrhosis and link each to its typical causes."
  - it: "Elencare le principali cause di cirrosi e spiegare che cosa si intende per cirrosi criptogenetica."
    en: "List the major causes of cirrhosis and explain what cryptogenic cirrhosis means."
  - it: "Descrivere le conseguenze dell'insufficienza epatica: ittero, encefalopatia, coagulopatia, ipoalbuminemia."
    en: "Describe the consequences of hepatic failure: jaundice, encephalopathy, coagulopathy, hypoalbuminemia."
prerequisites: []
relations:
  - type: causes
    target: portal-hypertension
    note:
      it: "La fibrosi ostruisce i sinusoidi intraepatici e fa aumentare la pressione portale."
      en: "Fibrosis obstructs intrahepatic sinusoids and raises portal pressure."
  - type: complicationOf
    target: alcoholic-liver-disease
    note:
      it: "Causa prototipica della cirrosi micronodulare."
      en: "Prototypical cause of micronodular cirrhosis."
  - type: complicationOf
