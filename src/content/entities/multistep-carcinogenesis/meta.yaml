learningObjectives:
  - it: "Spiegare l'origine clonale di un tumore da una singola cellula."
    en: "Explain the clonal origin of a tumor from a single cell."
  - it: "Distinguere le mutazioni driver dalle mutazioni passenger."
    en: "Distinguish driver mutations from passenger mutations."
  - it: "Descrivere come proto-oncogeni, oncosoppressori, pRb e p53 controllano il ciclo cellulare."
    en: "Describe how proto-oncogenes, tumor suppressors, pRb and p53 control the cell cycle."
  - it: "Elencare i principali sistemi di riparazione del DNA e le sindromi associate."
    en: "List the main DNA repair systems and the syndromes linked to them."
  - it: "Spiegare perché il tempo di raddoppiamento non coincide con il conteggio mitotico."
