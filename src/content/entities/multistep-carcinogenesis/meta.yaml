quickCheck:
  - id: multistep-carcinogenesis-q1
    q:
      it: "Da quante cellule ha origine un tumore e che cosa si accumula nei suoi discendenti?"
      en: "From how many cells does a tumor arise, and what accumulates in its descendants?"
    a:
      it: "Da una sola cellula; nei discendenti si accumulano mutazioni e alterazioni dell'espressione genica."
      en: "From a single cell; mutations and gene-expression changes accumulate in its descendants."
    kind: short
  - id: multistep-carcinogenesis-q2
    q:
      it: "Qual è la differenza tra mutazione driver e passenger?"
      en: "What is the difference between a driver and a passenger mutation?"
    a:
      it: "Le driver spingono lo sviluppo del tumore e sono relativamente poche; le passenger sono «al seguito» e il loro ruolo è per lo più ignoto."
      en: "Drivers propel tumor development and are relatively few; passengers are along for the ride and their role is mostly unknown."
    kind: short
  - id: multistep-carcinogenesis-q3
    q:
      it: "Che cosa fa p53 dopo un danno al DNA?"
      en: "What does p53 do after DNA damage?"
    a:
      it: "Arresta il ciclo per consentire la riparazione; se questa non è possibile induce apoptosi."
      en: "It halts the cycle to allow repair; if repair is impossible it triggers apoptosis."
    kind: short
