id: restrictive-cardiomyopathy
module: o17
tier: core
kind: disease
names:
  it: "Cardiomiopatia restrittiva"
  en: "Restrictive cardiomyopathy"
  eponyms: []
  synonyms:
    it: ["Cardiomiopatia restrittiva primaria (idiopatica)"]
    en: ["Primary (idiopathic) restrictive cardiomyopathy"]
  abbreviations: ["RCM"]
summary:
  it: "Gruppo di malattie in cui i ventricoli, irrigiditi, si riempiono male in diastole mentre funzione sistolica e spessore parietale restano normali o quasi, con cause primarie (genetiche) e secondarie (amiloide, malattia endomiocardica, accumulo di ferro o di desmina, malattie da accumulo)."
  en: "A group of diseases in which stiff ventricles fill poorly in diastole while systolic function and wall thickness stay normal or near normal, with primary (genetic) and secondary causes (amyloid, endomyocardial disease, iron or desmin accumulation, storage diseases)."
lenses:
  system: [heart]
  process: [extracellular-accumulation, intracellular-accumulation, proteostasis]
  pattern: [pigment-deposits]
  presentation: [dyspnea, edema]
  marker: [special-stains]
  group: [genetic, metabolic]
learningObjectives:
  - it: "Definire la cardiomiopatia restrittiva come insufficienza diastolica con funzione sistolica e spessore parietale normali o quasi."
    en: "Define restrictive cardiomyopathy as diastolic failure with normal or near-normal systolic function and wall thickness."
  - it: "Distinguere la forma primaria (idiopatica) dalle forme secondarie: amiloidosi, malattia endomiocardica, emocromatosi, desminopatie e malattie da accumulo."
    en: "Distinguish the primary (idiopathic) form from the secondary forms: amyloidosis, endomyocardial disease, hemochromatosis, desminopathies and storage diseases."
  - it: "Riconoscere l'amiloidosi cardiaca con rosso Congo, birifrangenza verde e reperti di ECG ed ecocardiogramma."
    en: "Recognize cardiac amyloidosis by Congo red, green birefringence, and ECG and echocardiographic findings."
  - it: "Descrivere i tre stadi della malattia endomiocardica."
    en: "Describe the three stages of endomyocardial disease."
  - it: "Confrontare la cardiomiopatia restrittiva con la pericardite costrittiva e con le altre cardiomiopatie."
    en: "Compare restrictive cardiomyopathy with constrictive pericarditis and with the other cardiomyopathies."
prerequisites: []
relations:
  - type: differentialOf
    target: pericardial-disease
    note:
      it: "Emodinamica simile alla pericardite costrittiva, di cui può essere difficile distinguerla."
      en: "Hemodynamics resemble constrictive pericarditis, from which it may be hard to distinguish."
  - type: sharesMechanism
    target: hypertrophic-cardiomyopathy
    note:
      it: "Condividono geni sarcomerici come MYH7 e TNNI3."
      en: "They share sarcomeric genes such as MYH7 and TNNI3."
  - type: differentialOf
    target: dilated-cardiomyopathy
    note:
      it: "Ventricolo dilatato nella DCM, spessore parietale normale nella restrittiva."
      en: "Dilated ventricle in DCM, normal wall thickness in RCM."
  - type: differentialOf
    target: arrhythmogenic-cardiomyopathy
    note:
      it: "Sostituzione fibroadiposa del miocardio nella cardiomiopatia aritmogena."
      en: "Fibrofatty replacement of myocardium in arrhythmogenic cardiomyopathy."
  - type: causes
    target: amyloidosis
    note:
      it: "L'amiloide nel miocardio produce un quadro restrittivo."
      en: "Amyloid in the myocardium produces a restrictive picture."
quickCheck:
  - id: restrictive-cardiomyopathy-q1
    q:
      it: "Quale funzione è compromessa nella cardiomiopatia restrittiva, e quale è conservata?"
      en: "Which function is impaired in restrictive cardiomyopathy, and which is preserved?"
    a:
      it: "È compromessa la funzione diastolica (riempimento); la funzione sistolica e lo spessore parietale sono normali o quasi."
      en: "Diastolic function (filling) is impaired; systolic function and wall thickness are normal or near normal."
    kind: short
  - id: restrictive-cardiomyopathy-q2
    q:
      it: "Elenca le cause secondarie di cardiomiopatia restrittiva."
      en: "List the secondary causes of restrictive cardiomyopathy."
    a:
      it: "Amiloide o carcinoma metastatico nell'interstizio, malattia endomiocardica, emocromatosi, aggregati di desmina, sarcoidosi e malattie da accumulo."
      en: "Amyloid or metastatic carcinoma in the interstitium, endomyocardial disease, hemochromatosis, desmin aggregates, sarcoidosis and storage diseases."
    kind: short
  - id: restrictive-cardiomyopathy-q3
    q:
      it: "Con quali esami si riconosce l'amiloide cardiaca e si distingue AL da ATTR?"
      en: "How is cardiac amyloid recognized, and how are AL and ATTR told apart?"
    a:
      it: "Rosso Congo con birifrangenza verde in luce polarizzata; la spettrometria di massa su biopsia cardiaca distingue AL da ATTR."
      en: "Congo red with green birefringence under polarized light; mass spectrometry of a heart biopsy separates AL from ATTR."
    kind: short
selfExplain:
  - it: "Perché in un ventricolo rigido l'atrio si dilata e compare congestione venosa?"
    en: "Why do the atria dilate and venous congestion appear when the ventricle is stiff?"
  - it: "Perché la forma primaria può avere una biopsia quasi normale pur avendo una diastole alterata?"
    en: "Why can primary RCM have a nearly normal biopsy despite abnormal diastole?"
