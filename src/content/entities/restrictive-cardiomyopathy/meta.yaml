  - it: "Come distingue la cardiomiopatia restrittiva dalla cardiomiopatia ipertrofica, da quella dilatativa e da quella aritmogena?"
    en: "How do you tell restrictive cardiomyopathy from hypertrophic, dilated and arrhythmogenic cardiomyopathy?"
    focus: [differential]
    level: 3
  - it: "Mi parli dell'amiloidosi cardiaca: quali colorazioni e quali esami userebbe?"
    en: "Tell me about cardiac amyloidosis: which stains and tests would you use?"
    focus: [ancillary, diagnosis]
