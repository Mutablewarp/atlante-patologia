    en: "Tell me about Wilson disease: which gene is mutated and what does its protein do?"
    focus: [definition, etiology]
    level: 1
  - it: "Che cosa vede nel fegato, nel cervello e nell'occhio nella malattia di Wilson?"
    en: "What do you see in the liver, the brain and the eye in Wilson disease?"
    focus: [gross, micro]
    level: 1
  - it: "Perché nella malattia di Wilson la ceruloplasmina sierica è molto bassa, pur essendo alto il rame nei tessuti?"
    en: "Why is serum ceruloplasmin very low in Wilson disease even though tissue copper is high?"
    focus: [pathogenesis, diagnosis]
