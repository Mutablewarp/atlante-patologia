  - it: "Un giovane adulto ha un disturbo del movimento e segni di epatopatia. A quale malattia pensa e quali reperti la sosterrebbero?"
    en: "A young adult has a movement disorder and signs of liver disease. Which disease do you think of, and which findings would support it?"
