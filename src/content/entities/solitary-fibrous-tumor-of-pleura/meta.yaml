quickCheck:
  - id: solitary-fibrous-tumor-of-pleura-q1
    q:
      it: "Da quale tessuto origina il tumore fibroso solitario della pleura?"
      en: "From which tissue does the pleural solitary fibrous tumor arise?"
    a:
      it: "Dal connettivo sottomesoteliale, non dal mesotelio."
      en: "From submesothelial connective tissue, not from mesothelium."
    kind: short
  - id: solitary-fibrous-tumor-of-pleura-q2
    q:
      it: "Che aspetto ha di solito la massa a occhio nudo?"
      en: "What does the mass usually look like to the naked eye?"
    a:
      it: "È di solito peduncolata, con superficie di taglio grigio-biancastra e spesso a vortici."
      en: "It is usually pedunculated, with a gray-white cut surface that is often whorled."
    kind: short
  - id: solitary-fibrous-tumor-of-pleura-q3
    q:
      it: "Il tumore è sempre benigno? Quali reperti fanno pensare a malignità?"
      en: "Is the tumor always benign? Which findings suggest malignancy?"
    a:
      it: "No: la maggior parte è benigna, ma alcuni sono maligni; fanno pensare a malignità la necrosi e la marcata variabilità cellulare."
      en: "No: most are benign but a few are malignant; necrosis and marked cell variability suggest malignancy."
    kind: short
