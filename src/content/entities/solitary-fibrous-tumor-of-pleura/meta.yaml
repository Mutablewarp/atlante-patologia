  - it: "Descrivere l'aspetto macroscopico di un tumore fibroso solitario della pleura: massa peduncolata, spesso grande, con superficie di taglio grigio-biancastra."
    en: "Describe the gross appearance of a pleural solitary fibrous tumor: a pedunculated, often large mass with a gray-white cut surface."
  - it: "Riconoscere al microscopio il «pattern senza pattern» di cellule fusate con collagene."
    en: "Recognize the \"patternless pattern\" of spindle cells with collagen under the microscope."
