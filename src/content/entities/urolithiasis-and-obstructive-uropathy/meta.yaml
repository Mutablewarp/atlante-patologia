names:
  it: Urolitiasi, ostruzione e idronefrosi
  en: Urolithiasis, obstruction and hydronephrosis
  eponyms: []
  synonyms:
    it: [calcolosi urinaria, uropatia ostruttiva]
    en: [urinary stones, obstructive uropathy, renal stones]
  abbreviations: []
summary:
  it: I calcoli urinari e le ostruzioni delle vie urinarie bloccano il flusso dell'urina e possono dilatare la via escretrice (idronefrosi), fino all'atrofia del rene.
  en: Urinary stones and other blockages of the urinary tract impede urine flow and can dilate the collecting system (hydronephrosis), leading to renal atrophy.
learningObjectives:
  - it: Distinguere i quattro tipi principali di calcoli (calcio, infettivi, acido urico, cistina).
    en: Distinguish the four main stone types (calcium, infection, uric acid, cystine).
  - it: Elencare le sedi e le cause di ostruzione ureterale, intrinseche ed estrinseche.
    en: List the sites and causes of ureteral obstruction, intrinsic and extrinsic.
  - it: Descrivere le alterazioni macroscopiche e microscopiche dell'idronefrosi.
    en: Describe the gross and microscopic changes of hydronephrosis.
  - it: Spiegare come l'ureterite si associa all'ostruzione.
    en: Explain how ureteritis relates to obstruction.
