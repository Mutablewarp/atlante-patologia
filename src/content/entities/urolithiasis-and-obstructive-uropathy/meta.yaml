quickCheck:
  - id: urolithiasis-and-obstructive-uropathy-q1
    q:
      it: Quali sono i quattro tipi principali di calcoli renali?
      en: What are the four main types of renal stones?
    a:
      it: Calcio (ossalato o fosfato), infettivi (struvite), acido urico e cistina.
      en: Calcium (oxalate or phosphate), infection (struvite), uric acid and cystine.
    kind: short
  - id: urolithiasis-and-obstructive-uropathy-q2
    q:
      it: Quale calcolo non si vede alla radiografia semplice?
      en: Which stone is not seen on a plain radiograph?
    a:
      it: Il calcolo di acido urico puro, radiotrasparente.
      en: The pure uric acid stone, which is radiolucent.
    kind: short
  - id: urolithiasis-and-obstructive-uropathy-q3
    q:
      it: Quali strutture del rene si dilatano per prime nell'idronefrosi e quali sono risparmiate?
      en: Which renal structures dilate first in hydronephrosis, and which are spared?
    a:
      it: Si dilatano prima i dotti collettori; i glomeruli sono in genere risparmiati.
      en: The collecting ducts dilate first; the glomeruli are usually spared.
    kind: short
