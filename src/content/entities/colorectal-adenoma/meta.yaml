    en: "Explain why high-grade dysplasia is not the same as invasive carcinoma."
  - it: "Riconoscere la poliposi adenomatosa familiare come causa ereditaria di adenomi."
    en: "Recognize familial adenomatous polyposis as an inherited cause of adenomas."
