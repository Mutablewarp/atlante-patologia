learningObjectives:
  - it: "Distinguere adenomi tubulari, villosi e tubulo-villosi in base all'architettura."
    en: "Distinguish tubular, villous and tubulovillous adenomas by architecture."
  - it: "Descrivere la displasia di basso e di alto grado."
    en: "Describe low-grade and high-grade dysplasia."
  - it: "Elencare i fattori che aumentano il rischio di cancro in un adenoma."
    en: "List the features that raise the cancer risk of an adenoma."
