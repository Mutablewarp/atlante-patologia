quickCheck:
  - id: colorectal-adenoma-q1
    q:
      it: "Quali tre caratteristiche di un adenoma ne aumentano il rischio di cancro?"
      en: "Which three features of an adenoma raise its cancer risk?"
    a:
      it: "Le dimensioni maggiori, la displasia di alto grado e la componente villosa."
      en: "Larger size, high-grade dysplasia and a villous component."
    kind: short
  - id: colorectal-adenoma-q2
    q:
      it: "Che cosa serve per diagnosticare un adenocarcinoma invasivo in un polipo?"
      en: "What is needed to diagnose invasive adenocarcinoma in a polyp?"
    a:
      it: "Ghiandole neoplastiche al di sotto della muscularis mucosae."
      en: "Neoplastic glands below the muscularis mucosae."
    kind: short
  - id: colorectal-adenoma-q3
    q:
      it: "Qual è il tipo di adenoma più frequente e quale il meno frequente?"
      en: "Which adenoma type is the most common and which the least common?"
    a:
      it: "Il più frequente è il tubulare, il meno frequente il villoso."
      en: "Tubular is the most common, villous the least common."
    kind: short
  - id: colorectal-adenoma-q4
    q:
      it: "Quale quota di architettura villosa definisce un adenoma tubulo-villoso?"
      en: "What share of villous architecture defines a tubulovillous adenoma?"
    a:
      it: "Una componente villosa compresa tra il 25% e il 75%."
      en: "A villous share between 25% and 75%."
    kind: short
selfExplain:
