  - it: "Che cosa vede a occhio nudo nella pancreatite acuta grave, nella ghiandola e nel grasso circostante?"
    en: "What do you see grossly in severe acute pancreatitis, in the gland and in the surrounding fat?"
    focus: [gross, micro]
    level: 1
  - it: "Quali complicanze può avere la pancreatite acuta e che cosa può succedere a una pseudocisti?"
    en: "Which complications can acute pancreatitis have, and what can happen to a pseudocyst?"
    focus: [clinical, prognosis]
