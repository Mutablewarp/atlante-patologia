summary:
  it: "Proliferazione epiteliale maligna confinata all'epitelio di origine, senza superamento della membrana basale, quindi senza capacità di metastatizzare."
  en: "Malignant epithelial proliferation confined to its epithelium of origin, with no crossing of the basement membrane and therefore no ability to metastasize."
