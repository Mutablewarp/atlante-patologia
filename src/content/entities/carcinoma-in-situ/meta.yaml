quickCheck:
  - id: carcinoma-in-situ-q1
    q:
      it: "Quale reperto distingue il carcinoma in situ dal carcinoma invasivo?"
      en: "Which finding separates carcinoma in situ from invasive carcinoma?"
    a:
      it: "La membrana basale è integra: le cellule non sono entrate nello stroma."
      en: "The basement membrane is intact: the cells have not entered the stroma."
    kind: short
  - id: carcinoma-in-situ-q2
    q:
      it: "Perché il carcinoma in situ non può dare metastasi?"
      en: "Why can carcinoma in situ not metastasize?"
    a:
      it: "Per metastatizzare le cellule devono prima superare la membrana basale e raggiungere i vasi."
      en: "To metastasize, cells must first pass the basement membrane and reach vessels."
    kind: short
  - id: carcinoma-in-situ-q3
    q:
      it: "Quali tumori non hanno uno stadio in situ?"
      en: "Which cancers have no in situ stage?"
    a:
      it: "Quelli che originano da cellule prive di membrana basale sottostante, come le cellule linfoidi."
      en: "Those arising from cells with no basement membrane beneath them, such as lymphoid cells."
    kind: short
  - id: carcinoma-in-situ-q4
    q:
      it: "Che cosa si vede nel carcinoma uroteliale in situ?"
      en: "What is seen in urothelial carcinoma in situ?"
    a:
      it: "Cellule atipiche in tutto lo spessore dell'urotelio, con membrana basale integra e senza invasione dello stroma."
      en: "Atypical cells throughout the urothelium, with an intact basement membrane and no invasion of the stroma."
    kind: short
