learningObjectives:
  - it: "Definire il carcinoma in situ come proliferazione maligna che non ha superato la membrana basale."
    en: "Define carcinoma in situ as a malignant proliferation that has not crossed the basement membrane."
  - it: "Riconoscere l'atipia a tutto spessore con membrana basale integra."
    en: "Recognize full-thickness atypia with an intact basement membrane."
  - it: "Citare esempi d'organo: HSIL/CIN 3 della cervice e carcinoma uroteliale in situ."
    en: "Name organ examples: cervical HSIL/CIN-3 and urothelial carcinoma in situ."
  - it: "Spiegare perché il carcinoma in situ non metastatizza e distinguere la microinvasione."
    en: "Explain why carcinoma in situ cannot metastasize and tell microinvasion apart."
