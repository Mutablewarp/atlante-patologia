summary:
  it: "Malattia delle vie aeree con ostruzione episodica e reversibile del flusso, sostenuta da infiammazione TH2 ed eosinofila, con tappi di muco, ipertrofia della muscolatura liscia e ispessimento della membrana basale."
  en: "Airway disease with episodic, reversible airflow obstruction driven by TH2 and eosinophilic inflammation, with mucus plugs, smooth muscle hyperplasia and a thickened basement membrane."
