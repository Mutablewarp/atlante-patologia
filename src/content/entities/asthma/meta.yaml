  group: [immune, inflammatory]
learningObjectives:
  - it: "Descrivere la via TH2/IgE/eosinofili che porta a broncocostrizione, secrezione di muco ed edema."
    en: "Describe the TH2, IgE and eosinophil pathway that leads to bronchoconstriction, mucus secretion and edema."
  - it: "Riconoscere i reperti morfologici dell'asma: tappi di muco, spirali di Curschmann, cristalli di Charcot-Leyden, ipertrofia muscolare e ispessimento della membrana basale."
    en: "Recognize the morphology of asthma: mucus plugs, Curschmann spirals, Charcot-Leyden crystals, muscle hyperplasia and basement membrane thickening."
  - it: "Elencare i principali fattori scatenanti, compresi aspirina e beta-bloccanti."
    en: "List the main triggers, including aspirin and β-blockers."
  - it: "Distinguere l'asma dall'enfisema e dalla bronchite cronica."
    en: "Distinguish asthma from emphysema and chronic bronchitis."
prerequisites: []
relations:
  - type: differentialOf
    target: emphysema
    note:
      it: "Ostruzione episodica e reversibile contro declino progressivo della funzione respiratoria."
      en: "Episodic, reversible obstruction versus progressive decline in lung function."
  - type: differentialOf
    target: chronic-bronchitis
    note:
      it: "Entrambe le condizioni causano ostruzione bronchiale, ma l'asma procede per attacchi."
      en: "Both cause bronchial obstruction, but asthma proceeds in attacks."
  - type: sharesMechanism
    target: hypersensitivity-reactions
    note:
      it: "L'asma allergico è una reazione di ipersensibilità di tipo I mediata da IgE."
      en: "Allergic asthma is an IgE-mediated type I hypersensitivity reaction."
quickCheck:
  - id: asthma-q1
    q:
      it: "Quali due tipi di cellule attiva un allergene inalato in una persona sensibilizzata, e che cosa secernono?"
      en: "Which two cell types does an inhaled allergen engage in a sensitized person, and what do they secrete?"
    a:
      it: "Mastociti con IgE di superficie e cellule TH2; entrambi secernono istamina e altri mediatori di tipo I, più IL-4 e IL-5."
      en: "IgE-bearing mast cells and TH2 cells; both secrete histamine and other type I mediators, plus IL-4 and IL-5."
    kind: short
  - id: asthma-q2
    q:
      it: "Quali reperti istologici e citologici sono tipici dell'asma?"
      en: "Which histologic and cytologic findings are typical of asthma?"
    a:
      it: "Tappi di muco con eosinofili, spirali di Curschmann, cristalli di Charcot-Leyden, ipertrofia della muscolatura liscia e delle ghiandole e ispessimento della membrana basale."
      en: "Mucus plugs with eosinophils, Curschmann spirals, Charcot-Leyden crystals, smooth muscle and gland hyperplasia, and a thickened basement membrane."
    kind: short
  - id: asthma-q3
    q:
      it: "Come si distingue l'asma dall'enfisema sul piano clinico?"
      en: "How does asthma differ clinically from emphysema?"
    a:
      it: "L'asma procede per episodi con ostruzione reversibile; l'enfisema comporta un declino inesorabile della funzione respiratoria."
      en: "Asthma runs in episodes with reversible obstruction; emphysema causes an inexorable decline in lung function."
    kind: short
