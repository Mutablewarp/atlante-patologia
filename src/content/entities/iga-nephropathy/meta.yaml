summary:
  it: "Glomerulonefrite da immunocomplessi a predominanza di IgA1 depositati nel mesangio, la più frequente nei paesi sviluppati, con ematuria ricorrente spesso dopo infezioni delle vie respiratorie."
  en: "Glomerulonephritis from IgA1-dominant immune complexes in the mesangium, the most common in developed countries, with recurrent hematuria often during respiratory infections."
lenses:
  system: [kidney]
  process: [hypersensitivity, chronic-inflammation]
  pattern: []
  presentation: [hematuria]
  marker: [ihc]
  group: [immune, inflammatory]
learningObjectives:
  - it: "Descrivere il reperto diagnostico: IgA mesangiali in immunofluorescenza, uguali o più intense di IgG e IgM."
    en: "Describe the diagnostic finding: mesangial IgA on immunofluorescence, equal to or stronger than IgG and IgM."
  - it: "Spiegare come l'IgA1 con glicosilazione anomala porta alla formazione e al deposito di immunocomplessi nel mesangio."
    en: "Explain how abnormally glycosylated IgA1 leads to immune complex formation and mesangial deposition."
  - it: "Collegare le riacutizzazioni alle infezioni respiratorie e gastrointestinali e riconoscere le forme di presentazione cliniche."
    en: "Link flares to respiratory and gastrointestinal infections and recognize the clinical presentations."
  - it: "Distinguere la nefropatia a IgA dalla vasculite a IgA, dalla nefrite lupica e dalla glomerulonefrite anti-GBM."
    en: "Distinguish IgA nephropathy from IgA vasculitis, lupus nephritis and anti-GBM glomerulonephritis."
prerequisites: []
relations:
  - type: sameMarker
    target: hypersensitivity-vasculitis
    note:
      it: "La vasculite a IgA (porpora di Schönlein-Henoch) condivide il deposito di IgA, ma interessa i piccoli vasi di tutto il corpo."
      en: "IgA vasculitis (Henoch–Schönlein purpura) shares IgA deposition but affects small vessels throughout the body."
  - type: differentialOf
    target: lupus-nephritis
    note:
      it: "Spettro di lesioni simile, di solito meno grave nella nefropatia a IgA."
      en: "Similar spectrum of lesions, usually milder in IgA nephropathy."
  - type: differentialOf
    target: crescentic-glomerulonephritis
    note:
      it: "Nella glomerulonefrite anti-GBM l'IgG è lineare lungo la membrana basale, non mesangiale."
      en: "In anti-GBM glomerulonephritis IgG is linear along the basement membrane, not mesangial."
quickCheck:
  - id: iga-nephropathy-q1
    q:
      it: "Qual è il reperto diagnostico in immunofluorescenza?"
      en: "What is the diagnostic immunofluorescence finding?"
    a:
      it: "Colorazione mesangiale per IgA, più intensa o uguale a quella per IgG o IgM, quasi sempre con C3."
      en: "Mesangial IgA staining more intense than or equal to IgG or IgM, almost always with C3."
    kind: short
  - id: iga-nephropathy-q2
    q:
      it: "Che cosa c'è di anomalo nell'IgA1 dei pazienti?"
      en: "What is abnormal about IgA1 in patients?"
    a:
      it: "Le estremità delle catene O-legate della cerniera hanno meno galattosio e meno acido sialico del normale."
      en: "The ends of the O-linked hinge chains carry less galactose and less sialic acid than normal."
    kind: short
  - id: iga-nephropathy-q3
    q:
      it: "Con quali eventi coincidono spesso le riacutizzazioni?"
      en: "What events do flares often coincide with?"
    a:
      it: "Con infezioni delle vie respiratorie superiori (e gastrointestinali)."
      en: "Upper respiratory tract (and gastrointestinal) infections."
    kind: short
  - id: iga-nephropathy-q4
    q:
      it: "Come si distingue la nefropatia a IgA dalla glomerulonefrite anti-GBM all'immunofluorescenza?"
      en: "How does immunofluorescence separate IgA nephropathy from anti-GBM glomerulonephritis?"
    a:
      it: "Nella anti-GBM l'IgG è lineare lungo la membrana basale, non IgA mesangiale; oltre il 90% dei pazienti ha semilune."
      en: "Anti-GBM disease shows linear IgG along the basement membrane, not mesangial IgA, and over 90% of patients have crescents."
    kind: short
