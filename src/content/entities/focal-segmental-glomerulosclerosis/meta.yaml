  - it: "Perché la perdita di nefroni può causare una GSFS?"
    en: "Why can a loss of nephrons cause FSGS?"
  - it: "Perché la recidiva nel trapianto suggerisce una causa sistemica?"
    en: "Why does recurrence in a graft suggest a systemic cause?"
  - it: "Perché i podociti sono particolarmente vulnerabili quando i glomeruli si ingrandiscono?"
    en: "Why are podocytes especially vulnerable when glomeruli enlarge?"
