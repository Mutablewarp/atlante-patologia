id: mitral-valve-prolapse
module: o17
tier: core
kind: disease
names:
  it: "Prolasso della valvola mitrale"
  en: "Mitral valve prolapse"
  eponyms: []
  synonyms:
    it: ["Sindrome della valvola mitrale floscia"]
    en: ["Floppy mitral valve syndrome"]
  abbreviations: ["MVP"]
summary:
  it: "Alterazione della valvola mitrale in cui i lembi, ridondanti per degenerazione mixomatosa, si protrudono nell'atrio sinistro durante la sistole; di solito è asintomatica, ma può causare rigurgito."
  en: "A mitral valve disorder in which leaflets made redundant by myxomatous degeneration billow into the left atrium in systole; usually asymptomatic, but it can cause regurgitation."
lenses:
  system: [heart]
  process: [extracellular-accumulation]
  pattern: []
  presentation: [incidental-finding]
  marker: []
  group: [degenerative, genetic]
learningObjectives:
  - it: "Descrivere l'aspetto macroscopico e microscopico della valvola mitrale floscia: lembi ridondanti, corde allungate, tessuto mixomatoso nella spongiosa."
    en: "Describe the gross and microscopic appearance of a floppy mitral valve: redundant leaflets, elongated chordae, myxomatous tissue in the spongiosa."
  - it: "Distinguere le forme primarie (non sindromiche) da quelle secondarie (sindromiche) e citare il ruolo del TGFβ."
    en: "Distinguish primary (nonsyndromic) from secondary (syndromic) forms and state the role of TGFβ."
  - it: "Elencare le complicanze: rigurgito significativo, endocardite, rottura delle corde con valvola flail, morte improvvisa."
    en: "List the complications: significant regurgitation, endocarditis, chordal rupture with a flail valve, sudden death."
  - it: "Spiegare come la disfunzione dei muscoli papillari, di solito ischemica, causa rigurgito mitralico."
    en: "Explain how papillary muscle dysfunction, usually ischemic, causes mitral regurgitation."
