      en: "Ischemic papillary muscle dysfunction is another cause of mitral regurgitation."
  - type: sharesMechanism
    target: marfan-syndrome
    note:
      it: "Oltre il 90% dei pazienti con sindrome di Marfan ha prolasso mitralico; è coinvolto il TGFβ."
      en: "More than 90% of patients with Marfan syndrome have prolapse; TGFβ signaling is involved."
  - type: causes
    target: infective-endocarditis
    note:
      it: "L'endocardite è una complicanza potenzialmente grave."
      en: "Endocarditis is a potentially serious complication."
quickCheck:
  - id: mitral-valve-prolapse-q1
    q:
      it: "Quale strato del lembo valvolare contiene il tessuto mixomatoso nel prolasso mitralico?"
      en: "Which layer of the leaflet holds the myxomatous tissue in mitral valve prolapse?"
    a:
      it: "La spongiosa, lo strato intermedio del lembo, dove si accumulano proteoglicani."
      en: "The spongiosa, the middle layer of the leaflet, where proteoglycans accumulate."
    kind: short
  - id: mitral-valve-prolapse-q2
    q:
      it: "Che cos'è una valvola mitrale flail e come si forma?"
      en: "What is a flail mitral valve and how does it form?"
    a:
      it: "Una valvola totalmente incompetente, dovuta alla rottura di più corde tendinee danneggiate."
      en: "A totally incompetent valve caused by rupture of several damaged chordae tendineae."
    kind: short
  - id: mitral-valve-prolapse-q3
    q:
      it: "Qual è la causa più frequente di disfunzione dei muscoli papillari e perché questi muscoli sono vulnerabili?"
      en: "What most often causes papillary muscle dysfunction, and why are these muscles vulnerable?"
    a:
      it: "L'ischemia: sono irrorati da rami terminali di arterie coronarie intramiocardiche."
      en: "Ischemia: they are supplied by terminal branches of intramyocardial coronary arteries."
    kind: short
selfExplain:
  - it: "Perché la degenerazione mixomatosa di lembi e corde porta a rigurgito mitralico?"
    en: "Why does myxomatous degeneration of leaflets and chordae lead to mitral regurgitation?"
  - it: "Perché un breve episodio di angina può causare un rigurgito mitralico temporaneo?"
    en: "Why can a brief episode of angina cause temporary mitral regurgitation?"
