      en: "Hypercalcemia and hypercalciuria; diffuse renal calcification on imaging"
  - pathology:
      it: "Calcificazione metastatica nell'insufficienza renale cronica terminale"
      en: "Metastatic calcification in end-stage chronic kidney disease"
    sign:
      it: "Calcificazioni dei tessuti molli e dei vasi all'imaging"
      en: "Soft-tissue and vascular calcification on imaging"
    lab:
      it: "Iperfosfatemia con calcemia normale o bassa; iperparatiroidismo secondario"
      en: "Hyperphosphatemia with normal or low serum calcium; secondary hyperparathyroidism"
examQuestions:
  - it: "Mi parli della calcificazione metastatica: che cos'è e quali condizioni la provocano?"
    en: "Tell me about metastatic calcification: what is it, and which conditions cause it?"
    focus: [definition, etiology]
    level: 1
  - it: "Che cosa vede al microscopio nel rene di un paziente con nefrocalcinosi da ipercalcemia, e con quali colorazioni conferma che i depositi sono di calcio?"
    en: "What do you see under the microscope in the kidney of a patient with nephrocalcinosis from hypercalcemia, and which stains confirm that the deposits are calcium?"
    focus: [micro, ancillary]
    level: 1
  - it: "Mi spieghi perché l'insufficienza renale cronica può causare calcificazioni metastatiche anche senza ipercalcemia: che ruolo hanno il fosfato, la vitamina D attiva e il paratormone?"
    en: "Explain why chronic kidney disease can cause metastatic calcification even without hypercalcemia: what roles do phosphate, active vitamin D and parathyroid hormone play?"
    focus: [pathogenesis, etiology]
    level: 2
  - it: "Quali sono le sedi tipiche della calcificazione metastatica, e perché il calcio si deposita proprio lì?"
    en: "What are the typical sites of metastatic calcification, and why does calcium settle there in particular?"
    focus: [micro, pathogenesis]
    level: 2
  - it: "Come distingue una calcificazione metastatica da una calcificazione distrofica? Quali dati morfologici e di laboratorio userebbe?"
    en: "How do you tell metastatic from dystrophic calcification? Which morphological and laboratory findings would you use?"
    focus: [definition, differential, diagnosis]
    level: 3
  - it: "In un paziente con insufficienza renale cronica terminale, come si manifesta una calcificazione metastatica del polmone? Con quali esami la riconosce, e può regredire?"
    en: "In a patient with end-stage chronic kidney disease, how does metastatic calcification of the lung present? Which tests reveal it, and can it regress?"
    focus: [clinical, diagnosis, prognosis]
    level: 3
