    en: [congestive heart failure, cardiac failure]
  abbreviations: [HF, CHF, HFpEF]
summary:
  it: L'ipertrofia dei miociti compensa un sovraccarico del cuore, ma se il danno persiste il ventricolo si dilata e si arriva allo scompenso, con congestione di polmoni, fegato e altri organi.
  en: Myocyte hypertrophy compensates for cardiac overload, but with persisting injury the ventricle dilates and heart failure follows, with congestion of lungs, liver and other organs.
learningObjectives:
  - it: Distinguere ipertrofia concentrica, eccentrica e fisiologica.
    en: Distinguish concentric, eccentric and physiologic hypertrophy.
  - it: Spiegare i meccanismi di compenso e di scompenso.
    en: Explain the mechanisms of compensation and decompensation.
  - it: Confrontare scompenso sinistro e destro e i loro quadri clinici.
    en: Compare left-sided and right-sided failure and their clinical pictures.
  - it: Descrivere gli effetti dello scompenso su polmone, fegato, rene e cervello.
    en: Describe the effects of failure on lung, liver, kidney and brain.
