quickCheck:
  - id: cardiac-hypertrophy-and-heart-failure-q1
    q:
      it: Che cosa distingue l'ipertrofia concentrica da quella eccentrica?
      en: What separates concentric from eccentric hypertrophy?
    a:
      it: Nella concentrica la parete si ispessisce senza dilatazione della camera; nell'eccentrica la camera si dilata e i miociti si allungano.
      en: In concentric hypertrophy the wall thickens without a larger chamber; in eccentric hypertrophy the chamber dilates and the myocytes lengthen.
    kind: short
  - id: cardiac-hypertrophy-and-heart-failure-q2
    q:
      it: Quali sintomi dà lo scompenso sinistro e quali segni lo scompenso destro?
      en: Which symptoms does left-sided failure cause, and which signs does right-sided failure cause?
    a:
      it: Sinistro, dispnea da sforzo, ortopnea e dispnea parossistica notturna; destro, giugulari distese, edema declive, fegato ingrossato e ascite.
      en: Left-sided, dyspnea on exertion, orthopnea and paroxysmal nocturnal dyspnea; right-sided, distended jugular veins, leg edema, enlarged liver and ascites.
    kind: short
  - id: cardiac-hypertrophy-and-heart-failure-q3
    q:
      it: Che cosa spinge l'organismo a trattenere sodio e liquidi quando la gittata è bassa?
      en: What makes the body retain sodium and fluid when output is low?
    a:
      it: Il flusso al rene si riduce e la risposta renina-angiotensina-aldosterone fa trattenere sodio e liquidi.
      en: Kidney flow falls, and the renin-angiotensin-aldosterone response makes the body retain sodium and fluid.
    kind: free
  - id: cardiac-hypertrophy-and-heart-failure-q4
    q:
      it: Che cosa si vede al microscopio nel polmone da scompenso sinistro cronico?
      en: What is seen under the microscope in the lung in chronic left-sided failure?
    a:
      it: Macrofagi alveolari carichi di emosiderina, le cellule dello scompenso, derivati da globuli rossi usciti dai capillari congesti.
      en: Alveolar macrophages carrying hemosiderin, the heart failure cells, from red cells that leaked out of congested capillaries.
    kind: short
  - id: cardiac-hypertrophy-and-heart-failure-q5
    q:
      it: Quale esame del sangue si usa come biomarcatore della gravità dello scompenso?
      en: Which blood test serves as a biomarker of how severe heart failure is?
    a:
      it: Il livello ematico di BNP.
      en: The blood BNP level.
    kind: short
selfExplain:
  - it: Perché un cuore scompensato mantiene la gittata solo con pressioni di riempimento più alte?
    en: Why does a failing heart keep its output only at a higher filling pressure?
  - it: Perché lo scompenso sinistro porta nel tempo allo scompenso destro?
    en: Why does left-sided failure lead in time to right-sided failure?
