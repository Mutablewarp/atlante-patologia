    en: "Tell me about the four main types of renal cell carcinoma: their frequency and cell of origin."
    focus: [definition, pathogenesis]
    level: 1
  - it: "Perché la perdita del gene VHL porta al carcinoma a cellule chiare?"
    en: "Why does loss of the VHL gene lead to clear cell carcinoma?"
    focus: [pathogenesis]
    level: 2
  - it: "Come si assegna il grado nucleare WHO/ISUP in un carcinoma a cellule renali?"
    en: "How is the WHO/ISUP nuclear grade assigned in renal cell carcinoma?"
    focus: [micro]
    level: 2
  - it: "Quali sindromi paraneoplastiche può dare il carcinoma a cellule renali, e attraverso quali sostanze?"
    en: "Which paraneoplastic syndromes can renal cell carcinoma cause, and through which substances?"
    focus: [clinical]
    level: 2
  - it: "Che cosa vede al microscopio in un carcinoma a cellule chiare, e come lo distingue da un carcinoma cromofobo?"
    en: "What do you see under the microscope in a clear cell carcinoma, and how do you tell it from a chromophobe carcinoma?"
    focus: [micro, ancillary]
    level: 3
