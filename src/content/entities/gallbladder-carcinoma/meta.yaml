quickCheck:
  - id: gallbladder-carcinoma-q1
    q:
      it: "Quali condizioni della colecisti aumentano il rischio di carcinoma?"
      en: "Which gallbladder conditions raise the risk of carcinoma?"
    a:
      it: "Calcoli con colecistite cronica e la colecisti a porcellana, cioè calcificata."
      en: "Gallstones with chronic cholecystitis, and a porcelain (calcified) gallbladder."
    kind: short
  - id: gallbladder-carcinoma-q2
    q:
      it: "Perché il carcinoma della colecisti è quasi sempre incurabile alla diagnosi?"
      en: "Why is gallbladder carcinoma almost always incurable at diagnosis?"
    a:
      it: "I sintomi ricordano la calcolosi e compaiono tardi; solo i tumori scoperti per caso alla colecistectomia sono di fatto guariti."
      en: "Symptoms mimic gallstone disease and appear late; only tumors found by chance at cholecystectomy are in practice cured."
    kind: short
  - id: gallbladder-carcinoma-q3
    q:
      it: "Perché il carcinoma delle vie biliari ha una prognosi un po' migliore di quello della colecisti?"
      en: "Why does bile duct carcinoma do somewhat better than gallbladder carcinoma?"
    a:
      it: "Ostruisce il dotto e dà ittero ostruttivo precocemente."
      en: "It blocks the duct and causes obstructive jaundice early."
    kind: short
