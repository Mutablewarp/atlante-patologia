learningObjectives:
  - it: "Definire l'endocardite trombotica non batterica e riconoscerne il contesto clinico (tumori, stati di deperimento)."
    en: "Define nonbacterial thrombotic endocarditis and recognize its clinical setting (cancer, wasting states)."
  - it: "Descrivere l'endocardite di Libman–Sacks nel lupus: sede e dimensioni delle vegetazioni."
    en: "Describe Libman–Sacks endocarditis in lupus: site and size of the vegetations."
  - it: "Distinguere le vegetazioni sterili da quelle dell'endocardite infettiva e della cardiopatia reumatica."
    en: "Tell sterile vegetations from those of infective endocarditis and rheumatic heart disease."
  - it: "Indicare la complicanza principale dell'endocardite trombotica non batterica."
    en: "State the main complication of nonbacterial thrombotic endocarditis."
