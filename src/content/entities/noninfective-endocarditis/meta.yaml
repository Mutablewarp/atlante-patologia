relations:
  - type: differentialOf
    target: infective-endocarditis
    note:
      it: "Aspetto simile, ma vegetazioni sterili, senza infiammazione e senza distruzione valvolare."
      en: "Similar look, but sterile vegetations without inflammation or valve destruction."
  - type: differentialOf
    target: rheumatic-heart-disease
    note:
      it: "Lembi ispessiti e fusi nella malattia reumatica cronica."
      en: "Thickened, fused leaflets in chronic rheumatic disease."
  - type: sharesMechanism
    target: disseminated-intravascular-coagulation
    note:
      it: "Può accompagnare la coagulazione intravascolare disseminata."
      en: "May accompany disseminated intravascular coagulation."
  - type: sameLesionOtherOrgan
    target: systemic-lupus-erythematosus
    note:
      it: "L'endocardite di Libman–Sacks è la lesione cardiaca più evidente del lupus."
      en: "Libman–Sacks endocarditis is the most striking cardiac lesion of lupus."
quickCheck:
  - id: noninfective-endocarditis-q1
    q:
      it: "In quali contesti compare l'endocardite trombotica non batterica?"
      en: "In which settings does nonbacterial thrombotic endocarditis occur?"
    a:
      it: "Soprattutto con tumori (adenocarcinomi di pancreas e polmone, neoplasie ematologiche) e altre malattie debilitanti, anche con coagulazione intravascolare disseminata."
      en: "Mainly with cancer (adenocarcinomas of pancreas and lung, hematologic malignancies) and other wasting diseases, also with disseminated intravascular coagulation."
    kind: short
  - id: noninfective-endocarditis-q2
    q:
      it: "Perché l'endocardite trombotica non batterica non è un'endocardite infettiva?"
      en: "Why is nonbacterial thrombotic endocarditis not infective endocarditis?"
    a:
      it: "Le vegetazioni sono sterili, senza microrganismi né infiammazione, e non distruggono la valvola."
      en: "The vegetations are sterile, with no microorganisms or inflammation, and they do not destroy the valve."
    kind: short
  - id: noninfective-endocarditis-q3
    q:
      it: "Dove si trovano di solito le vegetazioni di Libman–Sacks e che esito hanno?"
      en: "Where do Libman–Sacks vegetations usually sit and how do they end?"
    a:
      it: "Sulla valvola mitrale, di solito sul versante atriale; di norma guariscono senza cicatrice e senza deficit funzionale."
      en: "On the mitral valve, usually the atrial surface; they usually heal without scarring or functional deficit."
    kind: short
  - id: noninfective-endocarditis-q4
    q:
      it: "Di che cosa sono fatte le vegetazioni dell'endocardite trombotica non batterica?"
      en: "What are the vegetations of nonbacterial thrombotic endocarditis made of?"
    a:
      it: "Di masse di piastrine e fibrina, senza microrganismi né infiammazione."
      en: "Platelet–fibrin masses with neither microorganisms nor inflammation."
    kind: short
  - id: noninfective-endocarditis-q5
    q:
      it: "Qual è il pericolo principale dell'endocardite trombotica non batterica?"
      en: "What is the main hazard of nonbacterial thrombotic endocarditis?"
    a:
      it: "L'embolizzazione a distanza, che può dare infarti in molti organi, anche se è rara."
      en: "Distant embolization, which can infarct many organs, although it is rare."
    kind: short
selfExplain:
