    en: "Tell me about tuberculosis: how infection differs from active disease, and how primary, progressive primary, secondary and miliary forms differ."
    focus: [definition, gross, clinical]
    level: 1
  - it: "Che cosa vede al microscopio in un granuloma tubercolare e come si forma la necrosi caseosa?"
    en: "What do you see under the microscope in a tuberculous granuloma, and how does caseous necrosis arise?"
    focus: [pathogenesis, micro]
    level: 2
  - it: "Perché il bacillo tubercolare sopravvive nei macrofagi e che cosa lo contiene?"
    en: "Why does the tubercle bacillus survive in macrophages, and what contains it?"
    focus: [pathogenesis]
    level: 2
  - it: "Quali colorazioni userebbe per mettere in evidenza il bacillo e perché il Gram non basta?"
    en: "Which stains would you use to show the bacillus, and why is the Gram stain not enough?"
    focus: [etiology, ancillary]
    level: 2
  - it: "Come distingue la tubercolosi dalla lebbra tubercoloide e da altre cause di necrosi caseosa?"
    en: "How do you tell tuberculosis from tuberculoid leprosy and from other causes of caseous necrosis?"
    focus: [differential, traps]
    level: 3
  - it: "Quali sono gli esiti e le complicanze della tubercolosi secondaria?"
    en: "What are the outcomes and complications of secondary tuberculosis?"
    focus: [prognosis, clinical]
