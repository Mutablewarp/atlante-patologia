learningObjectives:
  - it: "Distinguere l'emangioma capillare, giovanile e cavernoso in base all'aspetto microscopico."
    en: "Tell capillary, juvenile and cavernous hemangioma apart by their microscopic appearance."
  - it: "Riconoscere il tumore glomico e l'emangioendotelioma come lesioni intermedie o particolari."
    en: "Recognize glomus tumor and hemangioendothelioma as special or intermediate lesions."
  - it: "Descrivere angiosarcoma e sarcoma di Kaposi (HHV-8) e il ruolo dell'immunocolorazione endoteliale."
    en: "Describe angiosarcoma and Kaposi sarcoma (HHV-8) and the role of endothelial immunostaining."
  - it: "Distinguere i linfangiomi capillare e cistico."
    en: "Distinguish capillary and cystic lymphangioma."
