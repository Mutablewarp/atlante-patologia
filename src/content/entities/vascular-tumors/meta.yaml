    target: fibroblastic-tumors
    note:
      it: "Il sarcoma di Kaposi cellulato può simulare il fibrosarcoma."
      en: "Cellular Kaposi sarcoma can mimic fibrosarcoma."
quickCheck:
  - id: vascular-tumors-q1
    q:
      it: "Che cos'è una macchia a vino di porto?"
      en: "What is a port wine stain?"
    a:
      it: "Un emangioma cavernoso situato nella cute."
      en: "A cavernous hemangioma located in the skin."
    kind: short
  - id: vascular-tumors-q2
    q:
      it: "Dove si trova tipicamente il tumore glomico e quale sintomo dà?"
      en: "Where is a glomus tumor typically found, and what symptom does it cause?"
    a:
      it: "Sotto l'unghia di dita delle mani o dei piedi; è insolitamente doloroso."
      en: "Under the nails of fingers or toes; it is unusually painful."
    kind: short
  - id: vascular-tumors-q3
    q:
      it: "Quale virus causa il sarcoma di Kaposi e basta l'infezione per la malattia?"
      en: "Which virus causes Kaposi sarcoma, and is infection alone enough for the disease?"
    a:
      it: "L'herpesvirus umano 8 (HHV-8); no, solo una piccola parte degli infetti sviluppa il tumore."
      en: "Human herpesvirus 8 (HHV-8); no, only a small fraction of infected people develop the tumor."
    kind: short
  - id: vascular-tumors-q4
    q:
      it: "Come si riconosce un linfangioma cistico da un vaso sanguigno?"
      en: "How do you tell a cystic lymphangioma from a blood vessel?"
    a:
      it: "I suoi spazi non contengono globuli rossi né bianchi; le cisti rivestite da endotelio contengono liquido, non sangue."
      en: "Its spaces contain no red or white blood cells; the endothelium-lined cysts hold fluid, not blood."
    kind: short
  - id: vascular-tumors-q5
    q:
      it: "Il sarcoma di Kaposi è un tumore maligno: uccide spesso il paziente?"
      en: "Kaposi sarcoma is malignant: does it often kill the patient?"
    a:
      it: "Raramente: può interessare molte sedi, ma di rado causa la morte."
      en: "Rarely: it can involve many sites, but it seldom causes death."
    kind: short
selfExplain:
