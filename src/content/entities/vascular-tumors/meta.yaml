  - it: "Perché l'infezione da HHV-8 da sola non basta per diagnosticare il sarcoma di Kaposi?"
    en: "Why is HHV-8 infection alone not enough to diagnose Kaposi sarcoma?"
  - it: "Perché gli spazi di un linfangioma cistico non contengono sangue?"
    en: "Why do the spaces of a cystic lymphangioma contain no blood?"
