summary:
  it: "Gruppo di lesioni dei vasi sanguigni e linfatici, dagli emangiomi benigni all'angiosarcoma e al sarcoma di Kaposi, maligni."
  en: "A group of blood and lymphatic vessel lesions, from benign hemangiomas to malignant angiosarcoma and Kaposi sarcoma."
