kind: disease
editionDependent: true
editionNote:
  it: "La classificazione di leucoplachia, cheratosi e displasia dell'epitelio laringeo è cambiata tra le edizioni; la scheda non riporta gradi e va confrontata con la classificazione OMS corrente."
  en: "The classification of leukoplakia, keratosis and laryngeal epithelial dysplasia changed between editions; this card gives no grades and should be checked against the current WHO classification."
status: published
