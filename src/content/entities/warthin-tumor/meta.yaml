summary:
  it: "Tumore benigno della parotide, il più frequente degli adenomi monomorfi: spazi ghiandolari cistici rivestiti da oncociti in un denso tessuto linfoide, spesso bilaterale o multifocale."
  en: "Benign parotid tumor, the most common monomorphic adenoma: cystic glandular spaces lined by oncocytes within dense lymphoid tissue, sometimes bilateral or multifocal."
