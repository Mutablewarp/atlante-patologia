learningObjectives:
  - it: "Descrivere l'aspetto microscopico del tumore di Warthin: cisti con papille rivestite da oncociti e stroma linfoide con centri germinativi."
    en: "Describe the microscopic appearance of Warthin tumor: papillary cysts lined by oncocytes with a lymphoid stroma with germinal centers."
  - it: "Ricordare i dati epidemiologici distintivi: più frequente nell'uomo, dopo i 50 anni, talvolta bilaterale o multifocale."
    en: "Recall the distinctive epidemiology: more common in men, after age 50, sometimes bilateral or multifocal."
  - it: "Definire l'oncocita e distinguere il tumore di Warthin dall'oncocitoma."
    en: "Define the oncocyte and distinguish Warthin tumor from oncocytoma."
prerequisites: [benign-vs-malignant-tumors]
relations:
  - type: differentialOf
    target: pleomorphic-adenoma
    note:
      it: "Entrambi sono tumori salivari benigni, ma lo stroma è linfoide nel Warthin e condromixoide nell'adenoma pleomorfo."
      en: "Both are benign salivary tumors, but the stroma is lymphoid in Warthin tumor and chondromyxoid in pleomorphic adenoma."
  - type: differentialOf
    target: mucoepidermoid-carcinoma
    note:
      it: "Entrambi hanno spazi cistici; il carcinoma mucoepidermoide contiene cellule squamose, mucipare e intermedie."
      en: "Both have cystic spaces; mucoepidermoid carcinoma contains squamous, mucus-secreting and intermediate cells."
quickCheck:
  - id: warthin-tumor-q1
    q:
      it: "Quali componenti compongono l'istologia del tumore di Warthin?"
      en: "Which components make up the histology of Warthin tumor?"
    a:
      it: "Cisti con proiezioni papillari rivestite da oncociti eosinofili, circondate da denso tessuto linfoide con centri germinativi."
      en: "Cysts with papillary projections lined by eosinophilic oncocytes, surrounded by dense lymphoid tissue with germinal centers."
    kind: short
  - id: warthin-tumor-q2
    q:
      it: "Che cosa lo distingue dagli altri tumori salivari per sesso e lateralità?"
      en: "What sets it apart from other salivary tumors in sex and laterality?"
    a:
      it: "È l'unico tumore salivare più frequente nell'uomo e può essere bilaterale (15% dei casi) o multifocale in una ghiandola."
      en: "It is the only salivary tumor more common in men, and it can be bilateral (15% of cases) or multifocal within one gland."
    kind: short
  - id: warthin-tumor-q3
    q:
      it: "Che cos'è un oncocita?"
      en: "What is an oncocyte?"
    a:
      it: "Una cellula epiteliale benigna rigonfia di mitocondri, con citoplasma di aspetto granulare al microscopio ottico."
      en: "A benign epithelial cell swollen with mitochondria, with granular-looking cytoplasm under the light microscope."
    kind: short
