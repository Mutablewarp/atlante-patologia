    note:
      it: "Le varici esofagee complicano l'ipertensione portale."
      en: "Esophageal varices complicate portal hypertension."
quickCheck:
  - id: venous-disease-q1
    q:
      it: "Quali tre fattori favoriscono la trombosi venosa profonda?"
      en: "Which three factors favor deep vein thrombosis?"
    a:
      it: "Danno endoteliale, stasi e stato di ipercoagulabilità."
      en: "Endothelial injury, stasis and a hypercoagulable state."
    kind: short
  - id: venous-disease-q2
    q:
      it: "Qual è la differenza tra tromboflebite e flebotrombosi?"
      en: "What is the difference between thrombophlebitis and phlebothrombosis?"
    a:
      it: "La tromboflebite è un'infiammazione venosa con trombosi secondaria; la flebotrombosi è una trombosi senza infezione o infiammazione iniziale."
      en: "Thrombophlebitis is venous inflammation with secondary thrombosis; phlebothrombosis is thrombosis without an initiating infection or inflammation."
    kind: short
  - id: venous-disease-q3
    q:
      it: "Da dove origina la maggior parte degli emboli polmonari?"
      en: "Where do most pulmonary emboli originate?"
    a:
      it: "Dalle vene profonde degli arti inferiori; quelli fatali si formano per lo più nelle vene ilio-femorali."
      en: "From the deep veins of the legs; the fatal ones form mostly in the iliofemoral veins."
    kind: short
  - id: venous-disease-q4
    q:
      it: "Qual è la causa principale delle varici esofagee?"
      en: "What is the main cause of esophageal varices?"
    a:
      it: "L'ipertensione portale, di cui la cirrosi epatica è la causa principale; l'emorragia da varici può essere fatale."
      en: "Portal hypertension, of which liver cirrhosis is the chief cause; bleeding from the varices may be fatal."
    kind: short
  - id: venous-disease-q5
    q:
      it: "Qual è la sede più frequente della trombosi venosa e dove di solito comincia?"
      en: "Where does venous thrombosis occur most often, and where does it usually start?"
    a:
      it: "Quasi sempre nelle vene profonde della gamba; il trombo di solito inizia nelle vene del polpaccio, spesso nelle tasche sopra le valvole."
      en: "Almost always in the deep leg veins; the thrombus usually starts in the calf veins, often in the pockets above the valves."
    kind: short
selfExplain:
  - it: "Perché dopo una TVP l'insufficienza venosa cronica è quasi inevitabile?"
    en: "Why is chronic venous insufficiency almost inevitable after a DVT?"
  - it: "Perché un paziente operato che si alza per la prima volta dal letto può morire all'improvviso?"
    en: "Why can a postoperative patient die suddenly on first getting out of bed?"
