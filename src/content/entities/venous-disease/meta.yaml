summary:
  it: "Malattie delle vene: dilatazione e tortuosità delle vene superficiali (varici) e formazione di trombi nel circolo venoso profondo, soprattutto degli arti inferiori, con rischio di embolia polmonare."
  en: "Diseases of the veins: dilated, tortuous superficial veins (varices) and thrombus formation in the deep venous system, mainly of the legs, with a risk of pulmonary embolism."
