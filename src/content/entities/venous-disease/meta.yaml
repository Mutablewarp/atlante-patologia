learningObjectives:
  - it: "Elencare i fattori di rischio delle varici degli arti inferiori."
    en: "List the risk factors for varicose veins of the legs."
  - it: "Spiegare perché la trombosi venosa profonda segue la stessa triade della trombosi arteriosa."
    en: "Explain why deep vein thrombosis follows the same triad as arterial thrombosis."
  - it: "Distinguere tromboflebite e flebotrombosi."
    en: "Distinguish thrombophlebitis from phlebothrombosis."
  - it: "Indicare le sedi di varici (arti inferiori, esofago, emorroidi) e la loro causa."
    en: "Name the sites of varices (legs, esophagus, hemorrhoids) and their causes."
  - it: "Descrivere la TVP come sorgente di embolia polmonare e le sue sequele croniche."
    en: "Describe DVT as the source of pulmonary embolism and its chronic sequelae."
