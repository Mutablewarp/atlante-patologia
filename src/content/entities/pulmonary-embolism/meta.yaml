  - it: "Come distingue l'ipertensione polmonare da emboli ricorrenti da altre forme di ipertensione polmonare?"
    en: "How do you tell pulmonary hypertension from recurrent emboli apart from other forms of pulmonary hypertension?"
    focus: [pathogenesis, differential]
    level: 3
