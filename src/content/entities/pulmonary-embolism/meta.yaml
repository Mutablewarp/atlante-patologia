    en: "Tell me about pulmonary embolism: where do the emboli come from, and who is at risk?"
    focus: [definition, etiology]
    level: 1
  - it: "Come distingue un'embolia polmonare massiva da una di piccole dimensioni, per meccanismo ed esito?"
    en: "How do you tell a massive pulmonary embolism from a small one, in mechanism and outcome?"
    focus: [pathogenesis, prognosis]
    level: 3
  - it: "Perché la maggior parte delle piccole embolie non dà infarto e, quando lo dà, l'infarto polmonare è emorragico?"
    en: "Why do most small emboli not cause an infarct, and why is a pulmonary infarct hemorrhagic when it does occur?"
    focus: [pathogenesis, gross]
    level: 2
  - it: "Che cosa vede in un'arteria polmonare quando un tromboembolo si è organizzato?"
    en: "What do you see in a pulmonary artery after a thromboembolus has organized?"
    focus: [micro]
