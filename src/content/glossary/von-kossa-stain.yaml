id: von-kossa-stain
term:
  it: "Colorazione di von Kossa"
  en: "von Kossa stain"
definition:
  it: "Colorazione speciale che colora in nero i depositi di calcio, in modo più specifico dell'ematossilina-eosina, su cui il calcio appare blu-violaceo intenso. Conferma le calcificazioni distrofiche e metastatiche e, sull'osso non decalcificato, distingue l'osso mineralizzato (nero) dall'osteoide."
  en: "Special stain that colors calcium deposits black, more specifically than H&E, on which calcium appears deep blue-purple. It confirms dystrophic and metastatic calcification and, on undecalcified bone, separates mineralized bone (black) from osteoid."
aliases:
  it: ["metodo di von Kossa"]
  en: ["von Kossa method"]
see: [dystrophic-calcification, metastatic-calcification]
