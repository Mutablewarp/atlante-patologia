id: efferocytosis
term:
  it: "Efferocitosi"
  en: "Efferocytosis"
definition:
  it: "Rimozione delle cellule morte o morenti da parte di macrofagi e di cellule vicine (epiteli, fibroblasti), guidata da segnali «find me» ed «eat me». Una rimozione rapida evita che contenuti tossici e infiammazione danneggino il tessuto sano."
  en: "Clearance of dead and dying cells by macrophages and by neighboring cells such as epithelial cells and fibroblasts, guided by “find-me” and “eat-me” signals. Prompt removal keeps toxic contents and inflammation away from healthy tissue."
aliases:
  it: ["fagocitosi delle cellule apoptotiche"]
  en: ["clearance of apoptotic cells"]
see: [apoptosis]
