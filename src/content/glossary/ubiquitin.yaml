id: ubiquitin
term:
  it: "Ubiquitina"
  en: "Ubiquitin"
definition:
  it: "Proteina conservata di 76 amminoacidi che la cascata enzimatica E1-E2-E3 coniuga alle proteine bersaglio. Le catene di ubiquitina legate tramite la lisina 48 destinano le proteine al proteasoma; le altre ubiquitinazioni regolano traffico, endocitosi e riparazione del DNA."
  en: "A conserved 76-amino-acid protein that the E1–E2–E3 enzyme cascade attaches to target proteins. Ubiquitin chains linked through lysine 48 mark proteins for proteasomal destruction; other ubiquitin tags regulate trafficking, endocytosis and DNA repair."
aliases:
  it: ["ubiquitinazione", "Ub"]
  en: ["ubiquitination", "Ub"]
see: [protein-quality-control, atrophy]
