id: mallory-denk-bodies
term:
  it: "Corpi di Mallory-Denk"
  en: "Mallory–Denk bodies"
definition:
  it: "Inclusioni eosinofile a matassa o a zolla, spesso perinucleari, negli epatociti rigonfi («ballooning»). Sono aggregati di filamenti intermedi di citocheratina, tipici dell'epatite alcolica ma presenti anche in steatoepatite non alcolica, colestasi croniche, malattia di Wilson e carcinoma epatocellulare."
  en: "Ropy or clumped eosinophilic inclusions, often near the nucleus, in injured, ballooned hepatocytes. They are aggregates of cytokeratin intermediate filaments, typical of alcoholic hepatitis but also seen in nonalcoholic steatohepatitis, chronic cholestasis, Wilson disease and hepatocellular carcinoma."
aliases:
  it: ["corpi di Mallory", "ialina di Mallory", "ialina alcolica"]
  en: ["Mallory bodies", "Mallory hyaline", "Mallory–Denk hyalins", "alcoholic hyaline"]
see: [intracellular-accumulations, fatty-change, protein-quality-control]
