id: proteasome
term:
  it: "Proteasoma"
  en: "Proteasome"
definition:
  it: "Complesso proteasico cilindrico. Nella forma 26S i cappucci regolatori 19S riconoscono le proteine ubiquitinate, recuperano l'ubiquitina e, consumando ATP, le immettono nella camera catalitica 20S, che le taglia in peptidi. Smaltisce le proteine mal ripiegate e contribuisce all'atrofia."
  en: "A cylindrical protease complex. In the 26S form, 19S caps recognize ubiquitin-tagged proteins, recycle the ubiquitin and, using ATP, feed it into the 20S core, which cuts it into peptides. It disposes of misfolded proteins and contributes to atrophy."
aliases:
  it: ["proteasoma 26S", "sistema ubiquitina-proteasoma"]
  en: ["26S proteasome", "ubiquitin–proteasome system", "UPS"]
see: [protein-quality-control, atrophy]
