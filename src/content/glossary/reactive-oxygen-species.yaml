id: reactive-oxygen-species
term:
  it: "Specie reattive dell'ossigeno (ROS)"
  en: "Reactive oxygen species (ROS)"
definition:
  it: "Derivati dell'ossigeno parzialmente ridotti e molto reattivi: anione superossido, perossido di idrogeno e radicale idrossile, il più dannoso. Derivano da perdite di elettroni mitocondriali, enzimi P450 e NADPH ossidasi dei fagociti; li neutralizzano SOD, catalasi e glutatione perossidasi."
  en: "Partially reduced, highly reactive oxygen derivatives: superoxide, hydrogen peroxide and the hydroxyl radical, the most damaging. They arise from mitochondrial electron leaks, P450 enzymes and phagocyte NADPH oxidase, and are normally neutralized by SOD, catalase and glutathione peroxidase."
aliases:
  it: ["ROS", "radicali liberi dell'ossigeno"]
  en: ["ROS", "oxygen free radicals"]
see: [oxidative-injury, ischemia-reperfusion-injury]
