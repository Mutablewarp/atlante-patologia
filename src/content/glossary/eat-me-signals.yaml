id: eat-me-signals
term:
  it: "Segnali «eat me»"
  en: "Eat-me signals"
definition:
  it: "Molecole esposte sulla superficie delle cellule morenti, come la fosfatidilserina (normalmente confinata al foglietto interno della membrana) e la calreticulina. I fagociti le riconoscono e inglobano la cellula, che perde anche i segnali protettivi «don't eat me»."
  en: "Molecules exposed on the surface of dying cells, such as phosphatidylserine (normally confined to the membrane's inner leaflet) and calreticulin. Phagocytes recognize them and engulf the cell, which also loses its protective “don’t-eat-me” signals."
aliases:
  it: ["esposizione della fosfatidilserina", "segnali «mangiami»"]
  en: ["phosphatidylserine exposure"]
see: [apoptosis]
