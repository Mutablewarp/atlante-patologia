id: karyolysis
term:
  it: "Cariolisi"
  en: "Karyolysis"
definition:
  it: "Progressivo sbiadimento della colorazione nucleare fino alla scomparsa del nucleo, man mano che la cromatina si dissolve; in alternativa il nucleo picnotico viene espulso. È un'alterazione tardiva della necrosi, che lascia cellule morte anucleate ed eosinofile."
  en: "Progressive fading of nuclear staining until the nucleus disappears, as its chromatin is lost; alternatively the pyknotic nucleus is extruded. It is a late nuclear change in necrosis, leaving anucleate, eosinophilic dead cells."
aliases:
  it: []
  en: []
see: [coagulative-necrosis]
