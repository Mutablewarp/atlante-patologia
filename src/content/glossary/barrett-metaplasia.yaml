id: barrett-metaplasia
term:
  it: "Metaplasia di Barrett"
  en: "Barrett metaplasia"
definition:
  it: "Sostituzione dell'epitelio pavimentoso (squamoso) dell'esofago distale con epitelio ghiandolare di tipo intestinale con cellule caliciformi, adattamento al reflusso gastroesofageo cronico: la mucosa ghiandolare resiste meglio ad acido e pepsina. Può sviluppare displasia, perciò richiede sorveglianza endoscopica."
  en: "Replacement of the squamous lining of the distal esophagus by intestinal-type glandular epithelium with goblet cells, an adaptation to chronic gastroesophageal reflux; glandular mucosa resists acid and pepsin better. Dysplasia can arise within it, so patients undergo endoscopic surveillance."
aliases:
  it: ["metaplasia intestinale dell'esofago"]
  en: ["intestinal metaplasia of the esophagus"]
see: [metaplasia, dysplasia]
