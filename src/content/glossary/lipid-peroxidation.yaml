id: lipid-peroxidation
term:
  it: "Perossidazione lipidica"
  en: "Lipid peroxidation"
definition:
  it: "Ossidazione autopropagante dei lipidi di membrana. Il radicale idrossile sottrae idrogeno a un acido grasso insaturo; il radicale lipidico lega ossigeno e attacca l'acido grasso successivo. Le membrane perdono integrità e i residui non degradabili contribuiscono alla lipofuscina."
  en: "A self-propagating oxidation of membrane lipids. The hydroxyl radical pulls hydrogen off an unsaturated fatty acid; the resulting lipid radical takes up oxygen and attacks the next fatty acid. Membranes lose integrity, and undegradable residues contribute to lipofuscin."
aliases:
  it: ["perossidazione dei lipidi di membrana"]
  en: ["membrane lipid peroxidation"]
see: [oxidative-injury, pigment-accumulation]
