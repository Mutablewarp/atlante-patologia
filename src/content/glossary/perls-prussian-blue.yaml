id: perls-prussian-blue
term:
  it: "Colorazione di Perls (blu di Prussia)"
  en: "Perls Prussian blue stain"
definition:
  it: "Colorazione istochimica (reazione di Perls) che colora di blu intenso il ferro tissutale, soprattutto l'emosiderina; conferma il sovraccarico di ferro, come nell'emocromatosi, e distingue l'emosiderina da altri pigmenti bruni come lipofuscina e melanina."
  en: "Histochemical stain (Perls reaction) that turns tissue iron, mainly hemosiderin, bright blue; it confirms iron overload, as in hemochromatosis, and separates hemosiderin from other brown pigments such as lipofuscin and melanin."
aliases:
  it: ["reazione di Perls", "blu di Prussia", "Perls"]
  en: ["Prussian blue", "Perls stain", "Perls reaction"]
see: [pigment-accumulation, intracellular-accumulations]
