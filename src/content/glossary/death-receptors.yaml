id: death-receptors
term:
  it: "Recettori di morte"
  en: "Death receptors"
definition:
  it: "Recettori di superficie come Fas e il recettore del TNF, i cui «domini di morte» citoplasmatici formano un complesso di segnalazione (DISC) quando si lega il ligando. Il complesso attiva la caspasi-8 e avvia la via estrinseca dell'apoptosi."
  en: "Cell-surface receptors such as Fas and the TNF receptor whose cytoplasmic “death domains” assemble a signaling complex (DISC) when their ligand binds. The complex activates caspase-8 and launches the extrinsic pathway of apoptosis."
aliases:
  it: ["recettori della morte", "DISC"]
  en: ["death receptor", "DISC"]
see: [apoptosis, necroptosis]
