id: lipofuscin
term:
  it: "Lipofuscina"
  en: "Lipofuscin"
definition:
  it: "Granuli bruno-dorati di residui lipidici e proteici ossidati, legati tra loro e resistenti all'eliminazione autofagica: il classico pigmento «da usura». Aumenta con l'età, soprattutto in neuroni, cardiomiociti ed epatociti, ed è evidente negli organi atrofici."
  en: "Golden-brown granules of oxidized lipid and protein residues, cross-linked and resistant to autophagic clearance: the classic “wear-and-tear” pigment. It builds up with age, mainly in neurons, cardiac myocytes and hepatocytes, and stands out in atrophic organs."
aliases:
  it: ["pigmento da usura", "pigmento dell'invecchiamento"]
  en: ["wear-and-tear pigment", "age pigment"]
see: [pigment-accumulation, atrophy, oxidative-injury]
