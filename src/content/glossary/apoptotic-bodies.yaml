id: apoptotic-bodies
term:
  it: "Corpi apoptotici"
  en: "Apoptotic bodies"
definition:
  it: "Frammenti di una cellula apoptotica avvolti da membrana, con citoplasma denso ed eosinofilo, spesso senza nucleo. Macrofagi o cellule vicine li fagocitano prima che si rompano, senza infiammazione. Nel fegato corrispondono ai corpi di Councilman (acidofili)."
  en: "Membrane-bound fragments of an apoptotic cell, with dense eosinophilic cytoplasm and often no nucleus. Macrophages or neighboring cells engulf them before their contents leak, so no inflammation follows. In the liver they appear as Councilman (acidophilic) bodies."
aliases:
  it: ["corpi di Councilman", "corpi acidofili"]
  en: ["Councilman bodies", "acidophilic bodies", "acidophil bodies"]
see: [apoptosis]
