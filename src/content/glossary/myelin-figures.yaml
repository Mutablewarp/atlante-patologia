id: myelin-figures
term:
  it: "Figure mieliniche"
  en: "Myelin figures"
definition:
  it: "Vortici concentrici «a bulbo di cipolla» di materiale lipidico membranoso visibili al microscopio elettronico. Indicano un accumulo di lipidi, per esempio del ganglioside GM2 nei neuroni nella malattia di Tay-Sachs, una malattia da accumulo lisosomiale."
  en: "Concentric, onion-like whorls of membranous lipid seen by electron microscopy. They mark accumulated lipid, for example GM2 ganglioside stored within neurons in Tay–Sachs disease, a lysosomal storage disorder."
aliases:
  it: ["figure mielinoidi"]
  en: ["myelin bodies"]
see: [intracellular-accumulations]
