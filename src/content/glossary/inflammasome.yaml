id: inflammasome
term:
  it: "Inflammasoma"
  en: "Inflammasome"
definition:
  it: "Complesso multiproteico citosolico che si assembla quando recettori di riconoscimento come i recettori NOD-like (NLR) percepiscono molecole microbiche o irritanti come i cristalli. Converte la procaspasi-1 in caspasi-1, che attiva citochine infiammatorie e può uccidere la cellula per piroptosi."
  en: "A cytosolic multiprotein complex assembled when pattern-recognition receptors such as NOD-like receptors sense microbial molecules or irritants like crystals. It converts procaspase-1 to caspase-1, which activates inflammatory cytokines and can kill the cell by pyroptosis."
aliases:
  it: ["inflammasomi"]
  en: ["inflammasomes"]
see: [pyroptosis]
