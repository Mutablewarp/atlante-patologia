id: apoptosome
term:
  it: "Apoptosoma"
  en: "Apoptosome"
definition:
  it: "Complesso citosolico che si forma quando il citocromo c uscito dai mitocondri lega APAF-1 e ATP e recluta la procaspasi-9. Attiva la caspasi-9, che a sua volta attiva caspasi esecutrici come la caspasi-3: è il fulcro della via intrinseca."
  en: "A cytosolic protein complex formed when cytochrome c released from mitochondria binds APAF-1 and ATP and recruits procaspase-9. It activates caspase-9, which in turn switches on executioner caspases such as caspase-3: the hub of the intrinsic pathway."
aliases:
