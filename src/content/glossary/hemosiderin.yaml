id: hemosiderin
term:
  it: "Emosiderina"
  en: "Hemosiderin"
definition:
  it: "Forma di deposito del ferro: granuli giallo-bruni di ferritina parzialmente denaturata, soprattutto nei macrofagi di milza, midollo e fegato, nelle sedi di vecchie emorragie e, nel sovraccarico di ferro, nelle cellule parenchimali. Il Perls la colora di blu."
  en: "Iron-storage pigment: yellow-brown granules of partly denatured, clumped ferritin. Found mainly in macrophages of spleen, marrow and liver, at sites of old hemorrhage and, in iron overload, in parenchymal cells; Perls stain colors it blue."
aliases:
  it: ["pigmento emosiderinico"]
  en: ["haemosiderin"]
see: [pigment-accumulation, intracellular-accumulations]
