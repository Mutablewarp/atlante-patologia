id: bcl-2-family
term:
  it: "Famiglia BCL-2"
  en: "BCL-2 family"
definition:
  it: "Proteine con domini BH (omologia BCL-2) che governano l'apoptosi mitocondriale. BAX e BAK forano la membrana esterna e liberano il citocromo c; BCL-2, BCL-XL e MCL-1 li bloccano; i membri «solo BH3» (BIM, BID), sensori di stress, li attivano."
  en: "Proteins with BH (BCL-2 homology) domains that govern mitochondrial apoptosis. BAX and BAK perforate the outer membrane and release cytochrome c; BCL-2, BCL-XL and MCL-1 block them; BH3-only members (BIM, BID), sensors of stress, activate them."
aliases:
  it: ["proteine della famiglia BCL-2", "proteine «solo BH3»"]
  en: ["Bcl-2 family proteins", "BH3-only proteins"]
see: [apoptosis, autophagy]
