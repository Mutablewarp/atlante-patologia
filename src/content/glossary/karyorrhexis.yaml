id: karyorrhexis
term:
  it: "Carioressi"
  en: "Karyorrhexis"
definition:
  it: "Frammentazione di un nucleo picnotico in numerosi piccoli frammenti basofili dispersi nel citoplasma. Segue la picnosi nelle cellule necrotiche ed è tipica anche dell'apoptosi, nella quale l'intera cellula si suddivide poi in corpi apoptotici."
  en: "Fragmentation of a pyknotic nucleus into many small basophilic pieces scattered through the cytoplasm. It follows pyknosis in necrotic cells and is also typical of apoptosis, in which the whole cell then breaks up into apoptotic bodies."
aliases:
  it: ["cariorressi", "frammentazione nucleare"]
  en: ["nuclear fragmentation"]
see: [coagulative-necrosis, apoptosis]
