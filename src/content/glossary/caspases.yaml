id: caspases
term:
  it: "Caspasi"
  en: "Caspases"
definition:
  it: "Proteasi a cisteina sintetizzate come procaspasi inattive e attivate a cascata. Le caspasi iniziatrici (8, 9) attivano le esecutrici (3, 6, 7), che scindono le proteine cellulari e smontano la cellula nell'apoptosi; la caspasi-1 media invece la piroptosi."
  en: "Cysteine proteases made as inactive procaspases and activated in cascades. Initiator caspases (8, 9) switch on executioner caspases (3, 6, 7), which cleave cellular proteins and dismantle the cell in apoptosis; caspase-1 instead drives pyroptosis."
aliases:
  it: ["procaspasi", "caspasi esecutrici", "caspasi iniziatrici"]
  en: ["caspase", "procaspases", "executioner caspases", "initiator caspases"]
see: [apoptosis, pyroptosis]
