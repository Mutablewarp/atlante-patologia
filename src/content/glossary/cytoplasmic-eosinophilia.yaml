id: cytoplasmic-eosinophilia
term:
  it: "Eosinofilia citoplasmatica"
  en: "Cytoplasmic eosinophilia"
definition:
  it: "Colorazione rosa-rossa più intensa del citoplasma di una cellula morta o morente all'ematossilina-eosina. L'RNA citoplasmatico, che normalmente lega l'ematossilina blu, viene rapidamente degradato e prevale l'eosina: è un segno precoce di necrosi coagulativa."
  en: "Deeper pink-red staining of a dead or dying cell's cytoplasm on H&E. Cytoplasmic RNA, which normally binds blue hematoxylin, is rapidly degraded, so eosin dominates; it is an early light-microscopic clue to coagulative necrosis."
aliases:
  it: ["ipereosinofilia citoplasmatica"]
  en: ["hypereosinophilia of necrotic cells"]
see: [coagulative-necrosis, apoptosis]
