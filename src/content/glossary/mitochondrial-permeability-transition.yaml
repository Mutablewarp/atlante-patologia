id: mitochondrial-permeability-transition
term:
  it: "Poro di transizione della permeabilità mitocondriale (MPTP)"
  en: "Mitochondrial permeability transition pore (MPTP)"
definition:
  it: "Canale della membrana mitocondriale interna, normalmente chiuso. Sovraccarico di calcio, ROS o pH basso lo aprono: acqua e ioni invadono la matrice, crollano potenziale di membrana e sintesi di ATP, il mitocondrio si rigonfia e libera citocromo c."
  en: "A normally closed channel of the inner mitochondrial membrane. Calcium overload, ROS or low pH open it: water and ions flood the matrix, membrane potential and ATP synthesis collapse, mitochondria swell and cytochrome c escapes."
aliases:
  it: ["MPTP", "transizione di permeabilità mitocondriale"]
  en: ["MPTP", "mitochondrial permeability transition", "permeability transition pore"]
see: [hypoxic-ischemic-injury, ischemia-reperfusion-injury, apoptosis]
