id: ghost-cells
term:
  it: "Cellule fantasma"
  en: "Ghost cells"
definition:
  it: "Cellule morte per necrosi coagulativa che per un certo tempo conservano la forma e l'architettura del tessuto mentre i nuclei scompaiono: l'area appare come un'«ombra» rosa e priva di nuclei del tessuto originario. Tipiche degli infarti ischemici."
  en: "Dead cells in coagulative necrosis that keep their shape and the tissue architecture for a time while their nuclei vanish, so the area looks like a pink, nucleus-free shadow of the original tissue. Typical of ischemic infarcts."
aliases:
  it: ["profili cellulari fantasma", "ombre cellulari"]
  en: ["ghost outlines", "ghost cell outlines"]
see: [coagulative-necrosis]
