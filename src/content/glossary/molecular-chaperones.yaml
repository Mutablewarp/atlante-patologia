id: molecular-chaperones
term:
  it: "Chaperoni molecolari (proteine da shock termico)"
  en: "Molecular chaperones (heat shock proteins)"
definition:
  it: "Proteine, per lo più proteine da shock termico (HSP70, HSP90 e altre), che ripiegano i polipeptidi neosintetizzati, riparano quelli danneggiati, impediscono l'aggregazione e guidano le proteine a destinazione. Calore, ossidanti o ischemia le inducono; le proteine irreparabili vengono degradate."
  en: "Proteins, mostly heat shock proteins (HSP70, HSP90 and others), that fold new polypeptides, refold damaged ones, prevent aggregation and escort proteins to their destination. Stress such as heat, oxidants or ischemia induces them; proteins beyond repair are degraded."
aliases:
  it: ["proteine da shock termico", "HSP", "chaperon molecolari", "proteine chaperone"]
  en: ["heat shock proteins", "HSP", "chaperones"]
see: [protein-quality-control]
