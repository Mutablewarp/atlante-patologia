id: hyaline
term:
  it: "Ialino (materiale ialino)"
  en: "Hyaline"
definition:
  it: "Termine descrittivo per qualsiasi materiale omogeneo, vitreo ed eosinofilo all'ematossilina-eosina, senza implicazioni sulla sua natura. Gli esempi sono eterogenei: proteine plasmatiche nelle membrane ialine polmonari, materiale di membrana basale nell'arteriolosclerosi ialina, filamenti di citocheratina nella ialina alcolica (Mallory-Denk)."
  en: "Descriptive label for any homogeneous, glassy, pink material on H&E, with no implication about its nature. Examples differ completely: plasma proteins in pulmonary hyaline membranes, basement-membrane material in hyaline arteriolosclerosis, cytokeratin filaments in alcoholic (Mallory–Denk) hyaline."
aliases:
  it: ["sostanza ialina", "alterazione ialina"]
  en: ["hyaline change", "hyalin"]
see: [intracellular-accumulations, fibrinoid-necrosis]
