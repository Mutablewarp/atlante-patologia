id: cytochrome-c
term:
  it: "Citocromo c"
  en: "Cytochrome c"
definition:
  it: "Proteina della catena di trasporto degli elettroni legata alla membrana mitocondriale interna, verso lo spazio intermembrana. Quando le membrane mitocondriali diventano permeabili passa nel citosol, lega APAF-1 e forma l'apoptosoma; la sua perdita riduce anche la produzione di ATP."
  en: "An electron-transport protein bound to the inner mitochondrial membrane, facing the intermembrane space. Released into the cytosol when mitochondrial membranes become permeable, it binds APAF-1 to build the apoptosome; its loss also lowers ATP production."
aliases:
  it: ["Cyt c"]
  en: ["Cyt c"]
see: [apoptosis, hypoxic-ischemic-injury]
