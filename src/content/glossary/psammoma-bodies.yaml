id: psammoma-bodies
term:
  it: "Corpi psammomatosi"
  en: "Psammoma bodies"
definition:
  it: "Piccole calcificazioni rotonde a lamelle concentriche (calcosferiti), una forma di calcificazione distrofica che si sviluppa, per esempio, in papille tumorali in degenerazione. Tipiche del carcinoma papillare della tiroide, dei tumori sierosi dell'ovaio e del meningioma."
  en: "Small, round, concentrically laminated calcifications (calcospherites), a form of dystrophic calcification that arises, for example, in degenerating tumor papillae. Classic in papillary thyroid carcinoma, serous ovarian tumors and meningioma."
aliases:
  it: ["calcosferiti", "corpi di psammoma"]
  en: ["calcospherites", "psammoma body"]
see: [dystrophic-calcification]
