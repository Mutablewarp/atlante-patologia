id: fenton-reaction
term:
  it: "Reazione di Fenton"
  en: "Fenton reaction"
definition:
  it: "La reazione Fe²⁺ + H₂O₂ → Fe³⁺ + OH⁻ + OH•, in cui il ferro ferroso (o lo ione rameoso Cu⁺) trasforma il perossido di idrogeno in radicale idrossile. Spiega perché ferro e rame liberi amplificano il danno ossidativo."
  en: "The reaction Fe²⁺ + H₂O₂ → Fe³⁺ + OH⁻ + OH•, in which ferrous iron (or cuprous copper, Cu⁺) turns hydrogen peroxide into the hydroxyl radical. It explains why free iron and copper amplify oxidative injury."
aliases:
  it: []
  en: []
see: [oxidative-injury, pigment-accumulation]
