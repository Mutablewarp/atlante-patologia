id: autophagosome
term:
  it: "Autofagosoma"
  en: "Autophagosome"
definition:
  it: "Vacuolo delimitato da membrana tipico della macroautofagia. Una membrana aperta, il fagoforo, avvolge una porzione di citoplasma o organelli danneggiati e si chiude; l'autofagosoma si fonde con un lisosoma, i cui enzimi riducono il contenuto a piccole molecole riutilizzabili."
  en: "Membrane-bound vacuole of macroautophagy. An open membrane, the phagophore, wraps a portion of cytoplasm or damaged organelles and seals; the autophagosome then fuses with a lysosome, whose enzymes break the cargo into reusable small molecules."
aliases:
  it: ["vacuolo autofagico", "fagoforo"]
  en: ["autophagic vacuole", "phagophore"]
see: [autophagy]
