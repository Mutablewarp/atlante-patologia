id: pyknosis
term:
  it: "Picnosi"
  en: "Pyknosis"
definition:
  it: "Il nucleo si riduce a una massa piccola, densa e intensamente basofila per condensazione della cromatina. È la prima delle tre alterazioni nucleari della morte cellulare, presente nella necrosi e nell'apoptosi; può evolvere in carioressi o cariolisi."
  en: "Shrinkage of the nucleus into a small, dense, deeply basophilic mass as chromatin condenses. It is the first of the three nuclear changes of cell death, seen in necrosis and apoptosis, and may progress to karyorrhexis or karyolysis."
aliases:
  it: ["picnosi nucleare"]
  en: ["pycnosis"]
see: [coagulative-necrosis, apoptosis]
