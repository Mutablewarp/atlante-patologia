id: fat-stains
term:
  it: "Colorazioni per i grassi (Oil Red O, Sudan)"
  en: "Fat stains (oil red O, Sudan)"
definition:
  it: "Colorazioni lipidiche come l'Oil Red O, che colora in rosso i grassi neutri, e gli analoghi coloranti Sudan. Richiedono sezioni al criostato: la processazione in paraffina scioglie i grassi e lascia vacuoli vuoti, come nella steatosi o nell'embolia adiposa."
  en: "Lipid stains such as oil red O, which colors neutral fat red, and the similar Sudan dyes. They need frozen sections, because routine paraffin processing dissolves fat and leaves empty vacuoles, as in fatty change or fat embolism."
aliases:
  it: ["Oil Red O", "Sudan", "colorazioni lipidiche"]
  en: ["oil red O", "Sudan stain", "lipid stains"]
see: [fatty-change, intracellular-accumulations]
