id: saponification
term:
  it: "Saponificazione"
  en: "Saponification"
definition:
  it: "Formazione di saponi di calcio nella necrosi adiposa: le lipasi liberano acidi grassi dai trigliceridi e questi legano il calcio. Macroscopicamente i saponi appaiono bianco-gessosi, all'ematossilina-eosina come depositi amorfi basofili; nella pancreatite grave possono ridurre la calcemia."
  en: "Formation of calcium soaps in fat necrosis: lipases release fatty acids from triglycerides, and the fatty acids bind calcium. The soaps look chalky white grossly and amorphous basophilic on H&E; in severe pancreatitis they can lower blood calcium."
aliases:
  it: ["saponi di calcio", "saponificazione dei grassi"]
  en: ["calcium soaps", "fat saponification"]
see: [fat-necrosis, dystrophic-calcification]
