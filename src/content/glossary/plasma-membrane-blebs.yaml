id: plasma-membrane-blebs
term:
  it: "Bolle della membrana plasmatica (blebs)"
  en: "Plasma membrane blebs"
definition:
  it: "Estroflessioni circoscritte della membrana plasmatica ripiene di citoplasma. Nel danno reversibile possono staccarsi senza uccidere la cellula; nell'apoptosi la formazione di bolle (blebbing) precede la frammentazione della cellula in corpi apoptotici delimitati da membrana."
  en: "Focal bulges of the plasma membrane filled with cytoplasm. In reversible injury they may pinch off without killing the cell; in apoptosis, blebbing precedes fragmentation of the cell into membrane-bound apoptotic bodies."
aliases:
  it: ["blebbing", "bolle di membrana"]
  en: ["blebbing", "membrane blebs"]
see: [hydropic-swelling, apoptosis]
