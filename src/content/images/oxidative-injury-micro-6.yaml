lookFor:
  it: "Cerca il blu in tutto il campo: non ce n'è; i granuli bruni restano del loro colore."
  en: "Look for blue anywhere in the field: there is none; the brown granules keep their own colour."
caption:
  it: >-
    La stessa biopsia con una colorazione per il ferro (la fonte non ne indica il metodo); le punte di freccia gialle
    sono degli autori. Il campo ricorda quello in EE a piccolo ingrandimento, con una vena al centro. I nuclei sono rosa
    per la controcolorazione e gli epatociti quasi incolori, così il pigmento risalta con il suo colore naturale:
    granuli bruni raccolti fra cellule vicine, proprio dove li mostrava l'EE. In nessun punto compare il blu. Se fossero
    emosiderina, cioè ferro di deposito, la colorazione li avrebbe resi blu, come nell'immagine con il blu di Prussia di
    questa scheda. L'emosiderina è quindi esclusa e, insieme ai granuli fini e uniformi dentro gli epatociti visti in
    EE, il quadro depone per la lipofuscina; gli autori hanno anche mostrato che i granuli si anneriscono con un metodo
    all'argento (Fontana-Masson, pannello c della figura originale, qui non riprodotto). Perché conta in questa scheda:
    ferro e lipofuscina sono entrambi bruni in EE ma stanno ai due capi opposti del processo. Il ferro libero alimenta
    la reazione di Fenton, che produce il radicale ossidrile; la lipofuscina è ciò che resta dopo che i radicali hanno
    danneggiato lipidi e proteine.
  en: >-
    The same biopsy with an iron stain (the source does not name the method); the yellow arrowheads are the authors'.
    The field resembles the low-power H&E view, with a vein in the middle. The nuclei are pink from the counterstain and
    the hepatocytes almost colourless, so the pigment stands out in its own natural colour: brown granules gathered
    between neighbouring cells, just where the H&E showed them. Nothing anywhere has turned blue. Had they been
    haemosiderin, that is stored iron, the stain would have coloured them blue, as in the Prussian blue image on this
    card. So haemosiderin is excluded and, together with the fine, uniform granules inside hepatocytes on H&E, the
    picture points to lipofuscin; the authors also showed the granules blackening with a silver method (Fontana-Masson,
    panel c of the source figure, not reproduced here). Why it matters on this card: iron and lipofuscin are both brown
    on H&E but stand at opposite ends of the process. Free iron drives the Fenton reaction, which makes the hydroxyl
    radical; lipofuscin is what remains after radicals have damaged lipids and proteins.
alt:
  it: >-
    Micrografia di fegato con una colorazione per il ferro: fondo rosa pallido con molti piccoli nuclei rosa; al centro
    un lume vascolare chiaro e allungato scende dall'alto verso il basso a sinistra; granuli bruni sparsi a gruppi tra
    gli epatociti, nessuna traccia di blu; quattro punte di freccia gialle indicano gruppi di granuli; in alto a
    sinistra la lettera d in un riquadro bianco, in basso a destra una barra di scala da 50 µm.
  en: >-
    Micrograph of liver with an iron stain: a pale pink background with many small pink nuclei; in the middle a pale,
    elongated vessel lumen runs from the top down to the lower left; brown granules in scattered groups between the
    hepatocytes and no trace of blue; four yellow arrowheads point to groups of granules; the letter d in a white box
    at the top left and a 50 µm scale bar at the bottom right.
