lookFor:
  it: >-
    Guarda come l'epitelio ricopre un asse centrale ramificato di tessuto rosa, e segui i rami fino alla base del
    polipo.
  en: >-
    Look at how the epithelium covers a branching central core of pink tissue, and follow the branches down to the base
    of the polyp.
caption:
  it: >-
    Polipo intestinale di tipo Peutz–Jeghers, EE a basso ingrandimento. Parti dalla forma: il polipo è frondoso, con
    molte estroflessioni rivestite da epitelio. Al centro un asse rosa e ramificato, il tessuto di sostegno,
    si apre a ventaglio verso le frange. Le ghiandole tra i rami hanno un aspetto ordinato, non atipico.
  en: >-
    Intestinal polyp of Peutz–Jeghers type, H&E at low power. Start with the shape: the polyp is frond-like, with many
    epithelium-covered outgrowths. A pink, branching core of supporting tissue fans out toward the fronds. The glands
    between the branches look orderly, not atypical.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina di un polipo frondoso: epitelio ghiandolare su un asse
    centrale rosa e ramificato che si divide verso la periferia.
  en: >-
    Low-power H&E micrograph of a frond-like polyp: glandular epithelium over a pink branching central core that divides
    toward the periphery.
