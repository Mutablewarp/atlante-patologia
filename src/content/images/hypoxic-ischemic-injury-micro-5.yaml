lookFor:
  it: "Su ogni neurone verifica tre cose: corpo raggrinzito e angolato, citoplasma liscio rosa intenso, nucleo piccolo e scuro senza nucleolo."
  en: "Check three things on each neuron: a shrunken, angular body, smooth deep pink cytoplasm, a small dark nucleus without a nucleolus."
caption:
  it: >-
    Stessa serie dell'immagine a piccolo ingrandimento, EE a forte ingrandimento: il quadro classico del danno neuronale
    ipossico-ischemico acuto, il «neurone rosso». Osserva i tre neuroni piramidali in alto a sinistra, al centro e in
    basso al centro. Il corpo cellulare è raggrinzito e angolato, il citoplasma è liscio e di un rosa intenso, senza i
    granuli bluastri di un neurone sano, e il nucleo è piccolo, scuro e omogeneo, senza nucleolo visibile: è la
    picnosi. Il lungo dendrite è ancora attaccato, quindi per ora la cellula conserva il suo profilo. Un alone chiaro
    separa ogni corpo cellulare dal neuropilo circostante, pieno di piccoli vacuoli rotondi, e accanto al neurone in
    basso si vedono due piccoli nuclei scuri di cellule gliali. Nel loro insieme queste alterazioni indicano che il
    neurone ha superato il punto di non ritorno; negli infarti cerebrali questo quadro si osserva
    quando il paziente è sopravvissuto circa 6–24 ore. Raggrinzito + rosa intenso + nucleo piccolo e scuro = neurone
    rosso = neurone morto.
  en: >-
    From the same series as the low-power view, H&E at high power: the classic picture of acute hypoxic-ischemic
    injury of a neuron, the "red neuron". Look at the three pyramidal neurons at the upper left, in the centre and at
    the lower centre. Each cell body is shrunken and angular, its cytoplasm is smooth and intensely pink, without the
    bluish granules of a healthy neuron, and its nucleus is small, dark and uniform, with no nucleolus to be seen:
    this is pyknosis. The long dendrite is still attached, so for now the cell keeps its outline. A clear halo
    separates each cell body from the surrounding neuropil, which is full of small round holes, and two small dark
    glial nuclei lie next to the lower neuron. Taken together, these changes mean that the neuron has passed the
    point of no return; in brain infarcts this picture is seen once the patient has survived about 6–24
    hours. Shrunken + deep pink + small dark nucleus = red neuron = dead neuron.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento: tre neuroni triangolari con citoplasma rosa intenso e
    nucleo piccolo e scuro, ciascuno con un lungo prolungamento sottile diretto in basso a destra e un alone bianco
    intorno al corpo cellulare, su uno sfondo rosa pieno di piccoli fori chiari rotondi; due piccoli nuclei scuri
    accanto al neurone più in basso.
  en: >-
    High-power H&E micrograph: three triangular neurons with deep pink cytoplasm and small dark nuclei, each with a
    long, thin process running towards the lower right and a white halo around the cell body, on a pink background
    full of small, round clear holes; two small dark nuclei sit next to the lowest neuron.
