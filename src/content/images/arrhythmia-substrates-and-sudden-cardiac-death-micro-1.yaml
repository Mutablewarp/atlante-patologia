lookFor:
  it: Cerca le isole di cellule adipose chiare dentro il tessuto rosa e denso e nota quanto sono rari i nuclei nella cicatrice.
  en: Look for the islands of pale fat cells inside the dense pink tissue, and note how few nuclei the scar contains.
caption:
  it: >-
    Cicatrice di un infarto miocardico guarito, EE a medio ingrandimento. Il campo è occupato da tessuto rosa, denso e
    povero di nuclei: è la cicatrice fibrosa che ha sostituito il miocardio. Al centro e in alto si vedono isole di
    cellule adipose, vuote e chiare. In basso a sinistra restano fasci di miociti con nuclei più numerosi. Questo
    tessuto cicatriziale è il substrato strutturale fisso su cui un fattore scatenante, come una nuova ischemia, può
    innescare un'aritmia.
  en: >-
    Scar of a healed myocardial infarction, H&E at medium power. The field is filled with dense, pink tissue that has
    few nuclei: this is the fibrous scar that replaced the myocardium. Islands of pale, empty-looking fat cells lie in
    the center and at the top. At the lower left, bundles of myocytes with more nuclei remain. This scar tissue is the
    fixed structural substrate on which a trigger, such as new ischemia, can set off an arrhythmia.
alt:
  it: >-
    Micrografia in ematossilina-eosina di cuore: un ampio campo di tessuto rosa fibroso con pochi nuclei, isole di
    cellule adipose chiare al centro e in alto, piccoli vasi con globuli rossi e, in basso a sinistra, fasci di
    miociti residui.
  en: >-
    H&E micrograph of heart: a broad field of pink fibrous tissue with few nuclei, islands of pale fat cells in the
    center and at the top, small vessels containing red blood cells, and bundles of residual myocytes at the lower
    left.
