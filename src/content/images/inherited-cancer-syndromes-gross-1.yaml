lookFor:
  it: "Segui la mucosa lungo tutto il viscere: non è liscia, ma coperta in modo diffuso da numerosissime piccole escrescenze."
  en: "Follow the mucosa along the whole bowel: it is not smooth but covered throughout by very many small growths."
caption:
  it: >-
    Colon fissato in formalina, aperto e sospeso in un contenitore di vetro: è la poliposi adenomatosa familiare, una
    sindrome tumorale ereditaria. Guarda la superficie interna lungo tutto il tratto, dal ceco al retto: non c'è un
    singolo polipo, ma un tappeto di piccole formazioni polipoidi che rende la mucosa irregolare e a rilievo. La
    diffusione a tutto il viscere distingue questo quadro da un polipo sporadico isolato. L'immagine è un pezzo da museo,
    senza scala né orientamento esplicito: serve a riconoscere il quadro d'insieme, non a misurare.
  en: >-
    Formalin-fixed colon, opened and suspended in a glass jar: familial adenomatous polyposis, an inherited cancer
    syndrome. Look at the inner surface along the whole length, from cecum to rectum: there is no single polyp but a
    carpet of small polypoid growths that makes the mucosa bumpy and raised. Involvement of the whole bowel sets this
    picture apart from an isolated sporadic polyp. This is a museum specimen with no scale or explicit orientation: use
    it to recognize the overall pattern, not to measure.
alt:
  it: >-
    Fotografia di un intestino crasso aperto, appeso in un recipiente di vetro con liquido di conservazione, a forma di
    arco rovesciato; la superficie interna appare grigio-rosata, rugosa e irregolare per numerose piccole escrescenze.
  en: >-
    Photograph of an opened large intestine hanging in a glass jar of preservative fluid in an inverted U shape; the
    inner surface looks gray-pink, rough and uneven with many small growths.
