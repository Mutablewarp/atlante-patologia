lookFor:
  it: "Cerca i globuli rosa intenso, rotondi e di dimensioni diverse, nel citoplasma degli epatociti; in EE sono meno evidenti che in PAS."
  en: "Look for intense pink, round globules of different sizes in the hepatocyte cytoplasm; on H&E they are less obvious than on PAS."
caption:
  it: >-
    Fegato con deficit di α1-antitripsina, EE a forte ingrandimento. Gli epatociti hanno citoplasma rosa e alcuni
    contengono globuli rotondi rosa intenso, di dimensioni diverse, vicino a piccoli vacuoli vuoti. In EE questi globuli
    si riconoscono con difficoltà e si confermano con la PAS dopo diastasi (immagine precedente). A sinistra una
    fascia di connettivo con piccole cellule infiammatorie.
  en: >-
    Liver with α1-antitrypsin deficiency, H&E, high power. The hepatocytes have pink cytoplasm and some contain round,
    intense pink globules of different sizes beside small empty vacuoles. On H&E these globules are hard to spot and are
    confirmed with PAS after diastase (previous image). At the left a band of connective tissue holds small
    inflammatory cells.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina: epatociti rosa con nuclei rotondi vescicolosi; al centro a destra
    alcune cellule contengono globuli rosa intenso e piccoli vacuoli vuoti; una stretta fascia di connettivo scende
    in diagonale a sinistra.
  en: >-
    H&E micrograph of liver: pink hepatocytes with round vesicular nuclei; at center right a few cells contain intense
    pink globules and small empty vacuoles; a narrow band of connective tissue runs diagonally on the left.
