orientation:
  it: Superficie di taglio, bronchi in sezione trasversa.
  en: Cut surface, bronchi in cross-section.
lookFor:
  it: Confronta l'ampiezza di ogni lume bronchiale con i piccoli vasi accanto, poi guarda il tessuto pallido e spesso intorno ai lumi.
  en: Compare the width of each bronchial lumen with the small vessels beside it, then look at the pale thick tissue around the lumens.
caption:
  it: >-
    Superficie di taglio di polmone con bronchiectasie. Guarda prima i lumi bronchiali, rotondi e scuri, in sezione
    trasversa: sono molto più larghi di quanto dovrebbero essere così vicino alla periferia. Poi osserva il tessuto
    bianco e spesso che li circonda: è la fibrosi peribronchiale. Il parenchima nero tra i bronchi è il polmone
    residuo.
  en: >-
    Cut surface of lung with bronchiectasis. Look first at the round, dark bronchial lumens cut in cross-section: they
    are far wider than a bronchus should be this close to the periphery. Then look at the thick white tissue around them,
    which is peribronchial fibrosis. The black tissue between the bronchi is the remaining lung.
alt:
  it: >-
    Fotografia di una superficie di taglio di polmone su fondo blu: più bronchi dilatati in sezione trasversa, con lumi
    scuri e pareti spesse e biancastre, in mezzo a tessuto fibroso chiaro e a zone nere.
  en: >-
    Photograph of a cut lung surface on a blue background: several dilated bronchi in cross-section with dark lumens and
    thick whitish walls, set in pale fibrous tissue and black areas.
