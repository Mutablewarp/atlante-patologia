lookFor:
  it: "Guarda il contorno e la superficie: una massa unica, ben delimitata, pallida e di aspetto compatto, senza necrosi o emorragia evidenti."
  en: "Look at the outline and the surface: a single, well-demarcated, pale, firm-looking mass with no obvious necrosis or hemorrhage."
caption:
  it: >-
    Tumore fibroso solitario della pleura, preparato macroscopico. Osserva prima i margini: la massa è unica, ben
    delimitata e lobulata. Poi guarda la superficie: è pallida, rosa-biancastra, lucida e fibrosa, senza aree evidenti
    di necrosi o emorragia.
  en: >-
    Solitary fibrous tumor of the pleura, gross specimen. Look at the edges first: the mass is single, well demarcated
    and lobulated. Then look at the surface: it is pale, pink-white, glistening and fibrous, with no obvious area of
    necrosis or hemorrhage.
alt:
  it: >-
    Fotografia di una grande massa ovale, rosa-biancastra e lucida, con superficie fibrosa e qualche tratto rosso ai
    margini, su fondo blu scuro.
  en: >-
    Photograph of a large oval pink-white glistening mass with a fibrous surface and a few red areas at the edges, on a
    dark blue background.
