orientation:
  it: "Veduta intraoperatoria dell'addome aperto: l'ansa gangrenosa occupa il centro, l'intestino tenue sano curva sotto di essa."
  en: "Operative view into the open abdomen: the gangrenous loop fills the centre and healthy small bowel curves beneath it."
lookFor:
  it: "Confronta i due colori: il rosa lucido dell'intestino tenue vivo e il grigio-verde chiazzato di scuro dell'ansa morta."
  en: "Compare the two colours: the glossy pink of the living small bowel and the grey-green, dark-mottled colour of the dead loop."
caption:
  it: >-
    Intervento per volvolo del sigma con gangrena: l'ansa torta è stata estratta dall'addome aperto e sotto di essa si
    vede un'ansa di intestino tenue sano. Parti dal contrasto di colore. Il tenue è rosa e lucido, il colore di una
    parete viva e ben perfusa. L'ansa del sigma è enormemente distesa e grigio-verdastra, chiazzata di zone grigio
    scuro o nero-violacee, più cupe in basso a destra; la parete è così stirata e sottile da lasciar intravedere i
    vasi. Le piccole appendici di grasso giallo sulla superficie (appendici epiploiche) ricordano che si tratta di
    colon. Quando un'ansa ruota attorno all'asse del proprio mesentere, i vasi che vi decorrono vengono strozzati con
    essa: le vene, a parete sottile, si chiudono per prime, così il sangue continua ad arrivare ma non riesce a
    defluire, finché cede anche l'afflusso arterioso. Inoltre l'ansa torta resta chiusa a entrambe le estremità, e gas
    e liquidi la distendono. Il risultato è un infarto emorragico dell'intero spessore della parete: è questo che si
    intende per gangrena dell'intestino. La micrografia in EE di un'ansa di tenue torta, in questa scheda, mostra lo
    stesso processo: sangue in tutti gli strati e vasi dilatati, pieni di emazie. L'intestino morto non trattiene più i
    batteri intestinali, quindi si infetta presto e può perforarsi: è un'emergenza chirurgica e il tratto gangrenoso
    va resecato.
  en: >-
    Operation for volvulus of the sigmoid colon with gangrene: the twisted loop has been lifted out of the open
    abdomen, and a loop of healthy small bowel lies beneath it. Start with the contrast in colour. The small bowel is
    pink and glossy, the colour of a living, well-perfused wall. The sigmoid loop is hugely distended and grey-green,
    mottled with dark grey to purple-black patches that are darkest at its lower right; its wall is stretched so thin
    that vessels show through it. The small yellow tags of fat on its surface (appendices epiploicae) are a reminder
    that this is colon. When a loop rotates around the axis of its own mesentery, the vessels running in that
    mesentery are wrung along with it: the thin-walled veins close first, so blood keeps coming in but cannot drain
    out, until the arterial inflow fails too. The twisted loop is also closed off at both ends, so gas and fluid build
    up and distend it. The result is a hemorrhagic infarct of the whole thickness of the wall, which is what gangrene
    of the bowel means. The H&E micrograph of a twisted small-bowel loop on this card shows the same process: blood
    in every layer and vessels distended with red cells. Dead bowel no longer holds back the gut bacteria,
    so it is soon infected and can perforate: this is a surgical emergency, and the gangrenous segment is resected.
alt:
  it: >-
    Fotografia a colori scattata durante un intervento addominale: al centro un'ansa intestinale enormemente distesa,
    lucida e grigio-verdastra con chiazze scure, tra divaricatori metallici; sotto di essa curva un'ansa rosa di
    intestino tenue; sullo sfondo teli verdi, un camice blu e mani guantate.
  en: >-
    Colour photograph taken during abdominal surgery: a hugely distended, glossy, grey-green bowel loop with dark
    mottling fills the centre between metal retractors; a pink loop of small bowel curves beneath it; green drapes, a
    blue gown and gloved hands are in the background.
