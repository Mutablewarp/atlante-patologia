lookFor:
  it: "Confronta l'epitelio ghiandolare a sinistra con la superficie rosa e il tessuto sottostante a destra."
  en: "Compare the glandular epithelium at the left with the pink surface and the tissue beneath it at the right."
caption:
  it: >-
    Stesso margine ulcerativo a medio ingrandimento, EE. A sinistra un epitelio ghiandolare con nuclei allungati e
    mucina. A destra, sotto una superficie rosa fatta di materiale amorfo con cellule sparse, il tessuto contiene
    molte cellule, piccoli vasi con globuli rossi e fibre rosa.
  en: >-
    The same ulcer edge at medium power, H&E. At the left, glandular epithelium with elongated nuclei and mucin. At
    the right, beneath a pink surface of amorphous material with scattered cells, the tissue holds many cells, small
    vessels with red blood cells and pink fibers.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a sinistra un'ansa di epitelio ghiandolare violaceo; a destra una superficie
    rosa amorfa con cellule sparse e, sotto, tessuto cellulare con piccoli vasi.
  en: >-
    H&E micrograph: at the left a fold of purple glandular epithelium; at the right a pink amorphous surface with
    scattered cells and, below it, cellular tissue with small vessels.
