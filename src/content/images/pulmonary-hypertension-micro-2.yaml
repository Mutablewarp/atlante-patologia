lookFor:
  it: "Cerca al centro il piccolo vaso con parete a strati concentrici e, sotto, il groviglio cellulare con piccoli canali."
  en: "Find the small vessel with a concentrically layered wall at the center, and below it the cellular tangle with small channels."
caption:
  it: >-
    Polmone in EE a medio ingrandimento, da ipertensione polmonare. Al centro, in alto, un piccolo vaso ha la parete
    ispessita a strati concentrici e il lume quasi chiuso. Sotto, una massa cellulare ricca di nuclei fusati forma un
    groviglio di piccoli canali: l'autore la descrive come lesione angiomatoide, che ricorda una lesione plessiforme.
    Intorno il parenchima mostra spazi aerei, congestione e cellule infiammatorie sparse.
  en: >-
    Lung, H&E at medium power, from pulmonary hypertension. At the top center a small vessel has a wall thickened in
    concentric layers and an almost closed lumen. Below it, a cellular mass rich in spindle nuclei forms a tangle of
    small channels: the author describes it as an angiomatoid lesion, which resembles a plexiform lesion. Around it the
    parenchyma shows air spaces, congestion and scattered inflammatory cells.
alt:
  it: >-
    Micrografia di polmone in ematossilina-eosina: piccolo vaso con parete a strati concentrici in alto al centro,
    sotto un nodulo cellulare con canali minuti, circondato da alveoli e capillari congesti.
  en: >-
    H&E micrograph of lung: a small vessel with a concentrically layered wall at the top center, below it a cellular
    nodule with tiny channels, surrounded by alveoli and congested capillaries.
