lookFor:
  it: "Cerca i miociti più rossi e omogenei, senza striature, e i piccoli nuclei scuri e rotondi dei linfociti negli spazi tra le fibre."
  en: "Look for the redder, homogeneous myocytes without striations, and the small dark round lymphocyte nuclei in the spaces between fibers."
caption:
  it: >-
    Miocardite linfocitica, EE ad alto ingrandimento. Parti dai miociti conservati, con striature visibili e nuclei
    grandi e chiari. Cerca poi le cellule rosse e omogenee, senza striature, in basso al centro: sono miociti necrotici.
    Intorno a loro, nell'interstizio, ci sono molti piccoli nuclei scuri e rotondi: linfociti.
  en: >-
    Lymphocytic myocarditis, H&E at high power. Start with the preserved myocytes, which show striations and large pale
    nuclei. Then find the red, homogeneous cells without striations at the bottom center: these are necrotic myocytes.
    Around them, in the interstitium, lie many small dark round nuclei: lymphocytes.
alt:
  it: >-
    Micrografia di miocardio in ematossilina-eosina: fibre muscolari rosa con striature, separate da spazi in cui si
    trovano molte piccole cellule con nucleo scuro e rotondo; in basso alcune cellule muscolari più rosse e omogenee.
  en: >-
    H&E micrograph of myocardium: pink striated muscle fibers separated by spaces that hold many small cells with dark
    round nuclei; at the bottom a few redder, homogeneous muscle cells.
