lookFor:
  it: Cerca il frammento di calcolo, scuro e fratturato, e confrontalo con la mucosa rosa-viola della colecisti in basso.
  en: Find the dark, fractured stone fragment and compare it with the pink-purple gallbladder mucosa at the bottom.
caption:
  it: >-
    Colecisti con calcolo, EE a basso ingrandimento. Parti dal frammento di calcolo al centro: è bruno scuro, privo di
    cellule e attraversato da fessure. Poi guarda in basso la parete della colecisti, con l'epitelio colonnare e il
    connettivo rosa. Il calcolo è materiale acellulare nel lume, non tessuto: le fessure si formano durante il taglio.
  en: >-
    Gallbladder with a stone, H&E at low power. Start with the stone fragment in the center: it is dark brown, has no
    cells and is crossed by cracks. Then look at the gallbladder wall at the bottom, with columnar epithelium and pink
    connective tissue. The stone is acellular material in the lumen, not tissue: the cracks form during sectioning.
alt:
  it: >-
    Micrografia in ematossilina-eosina su fondo bianco: al centro un frammento bruno scuro, screpolato da fessure chiare;
    in basso una fascia rosa-viola di parete con epitelio ghiandolare e piccoli nuclei blu.
  en: >-
    H&E micrograph on a white background: in the center a dark brown fragment broken by pale cracks; along the bottom a
    pink-purple band of wall with glandular epithelium and small blue nuclei.
