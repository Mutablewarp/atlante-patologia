lookFor:
  it: "Cerca la cavità centrale con contenuto necrotico, poi guarda il polmone attorno: è consolidato e più scuro."
  en: "Find the central cavity with necrotic contents, then look at the lung around it: it is consolidated and darker."
caption:
  it: >-
    Sezione di polmone con un ascesso. Al centro c'è una cavità irregolare, riempita di materiale necrotico e
    purulento giallastro e di aree scure emorragiche. Il parenchima intorno è compatto e più scuro del polmone sano:
    è consolidato. In basso a destra si vede la pleura viscerale, liscia e lucida.
  en: >-
    Cut section of lung with an abscess. In the center is an irregular cavity filled with yellowish necrotic and
    purulent material and dark hemorrhagic areas. The parenchyma around it is firm and darker than normal lung: it is
    consolidated. At the lower right the visceral pleura is smooth and glistening.
alt:
  it: >-
    Fotografia di una sezione di polmone fissato: al centro una cavità irregolare con materiale giallastro e zone
    scure; intorno, tessuto polmonare bruno-rossastro compatto; in basso a destra, la pleura grigio-azzurra.
  en: >-
    Photograph of a cut section of fixed lung: an irregular central cavity with yellowish material and dark areas;
    around it, firm reddish-brown lung tissue; at the lower right, the grayish-blue pleura.
