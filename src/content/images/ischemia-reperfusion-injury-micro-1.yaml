caption:
  it: >-
    Infarto miocardico riperfuso, EE: necrosi a bande di contrazione. A piccolo ingrandimento segui l'orientamento delle
    fibre, che corrono in diagonale dal basso a sinistra verso l'alto a destra; al margine sinistro restano lunghe,
    sottili e colorate in modo uniforme. Poi spostati al centro: qui i miociti sono spezzati in blocchi irregolari di
    citoplasma rosso acceso (ipereosinofilo), attraversati da bande trasversali dense e grossolane e separati da spazi
    chiari; i nuclei sono pochi. Il meccanismo da ricordare: quando il sangue torna in cellule con la membrana già
    danneggiata, il calcio entra in massa e le miofibrille ancora capaci di contrarsi si ipercontraggono e si
    frammentano. È il quadro istologico tipico della riperfusione (per esempio dopo trombolisi o angioplastica), ma può
    comparire anche quando le catecolamine sono molto elevate.
  en: >-
    Reperfused myocardial infarct, H&E: contraction band necrosis. At low power, follow the fibers, which run diagonally
    from lower left to upper right; at the left edge they are still long, slender and evenly stained. Then move to the
    center: here the myocytes are broken into irregular blocks of bright red (hypereosinophilic) cytoplasm, crossed by
    coarse, dense transverse bands and separated by clear spaces; few nuclei remain. The mechanism to remember: when
    blood returns to cells whose membranes are already damaged, calcium floods in and the myofibrils that can still
    contract hypercontract and tear apart. This is the classic histological sign of reperfusion (for example after
    thrombolysis or angioplasty), but it can also appear when catecholamine levels are very high.
alt:
  it: >-
    Micrografia di miocardio in ematossilina-eosina a medio ingrandimento: fibre muscolari orientate in diagonale; al
    centro sono frammentate in blocchi irregolari rosso acceso separati da spazi bianchi, mentre al margine sinistro
    restano allungate e uniformi; pochi nuclei violacei sparsi.
  en: >-
    Medium-power H&E micrograph of myocardium: muscle fibers run diagonally; in the center they are broken into
    irregular bright red blocks separated by white spaces, while at the left edge they stay long and uniform; a few
    scattered violet nuclei.
