lookFor:
  it: "Scorri la carota bioptica e confronta i glomeruli: cerca quello con una porzione del gomitolo sostituita da materiale rosa compatto, mentre il resto del gomitolo è conservato."
  en: "Scan the biopsy core and compare the glomeruli: look for one in which part of the tuft is replaced by dense pink material while the rest of the tuft is preserved."
caption:
  it: >-
    Glomerulosclerosi focale segmentaria, variante ilare, biopsia renale, PAS a basso ingrandimento. Parti dalla carota
    bioptica e individua il glomerulo a destra: una parte del gomitolo, verso l'ilo, è occupata da materiale rosa
    compatto, mentre il resto delle anse resta aperto. Questo è l'aspetto segmentario. I tubuli intorno mostrano
    atrofia e la membrana basale ispessita in alcuni tratti. Per i dettagli passa all'ingrandimento maggiore.
  en: >-
    Focal segmental glomerulosclerosis, hilar variant, kidney biopsy, PAS at low power. Start from the biopsy core and
    find the glomerulus on the right: one part of the tuft, toward the hilum, is filled with dense pink material while
    the rest of the loops stay open. This is the segmental pattern. Some surrounding tubules show atrophy and
    thickened basement membranes. Move on to the higher power for detail.
alt:
  it: >-
    Micrografia PAS a basso ingrandimento di una carota bioptica renale: tubuli rosa pallido e, a destra, un glomerulo
    con un segmento del gomitolo occupato da materiale rosa intenso, mentre il resto delle anse capillari è aperto.
  en: >-
    Low-power PAS micrograph of a kidney biopsy core: pale pink tubules and, on the right, a glomerulus in which one
    segment of the tuft is filled with deep pink material while the rest of the capillary loops are open.
