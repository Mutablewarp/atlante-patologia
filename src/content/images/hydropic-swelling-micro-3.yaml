orientation:
  it: "Gli epatociti occupano la parte alta e il centro; lungo il margine inferiore corre uno spazio portale."
  en: "Hepatocytes fill the top and the centre; a portal tract runs along the bottom edge."
lookFor:
  it: "Confronta con l'EE: le stesse cellule chiare ora sono piene di granuli magenta."
  en: "Compare with the H&E: the same kind of clear cells is now packed with magenta granules."
caption:
  it: >-
    Stessa serie didattica colorata con il PAS (acido periodico-Schiff). Il PAS colora il glicogeno di magenta, e qui
    gli epatociti che in EE sembravano vuoti sono stipati di granuli rosso-magenta scuro, tra cui spiccano molti minuscoli
    puntini non colorati. Lungo il margine inferiore corre uno spazio portale, con connettivo e un piccolo vaso, che
    prende poco colore: il segnale intenso appartiene agli epatociti. Concetto chiave: una positività PAS intensa in
    cellule chiare e rigonfie fa pensare al glicogeno. Attenzione: il PAS colora anche altre sostanze (per esempio i
    globuli di α1-antitripsina mal ripiegata di un'altra malattia del fegato), quindi la sola positività PAS non è una
    prova. La prova è il controllo con diastasi, nell'immagine successiva.
  en: >-
    The same teaching set stained with PAS (periodic acid–Schiff). PAS colours glycogen magenta, and here the
    hepatocytes that looked empty on H&E are packed with dark magenta-red granules, dotted with many tiny unstained
    specks. Along the bottom edge runs a portal tract, with connective tissue and a small vessel, that takes
    little colour: the strong signal belongs to the hepatocytes. Key point: intense PAS staining of pale, swollen
    cells points to glycogen. Pitfall: PAS also colours other substances (for example the misfolded α1-antitrypsin
    globules of another liver disease), so a positive PAS alone is not proof. The proof is the diastase control in the
    next image.
alt:
  it: >-
    Micrografia di fegato colorata con PAS: i due terzi superiori pieni di epatociti con citoplasma granulare
    rosso-magenta scuro e minuscoli puntini bianchi; lungo il margine inferiore una banda viola più chiara di
    connettivo con cellule chiare e un piccolo vaso rotondo.
  en: >-
    PAS-stained micrograph of liver: the upper two thirds filled with hepatocytes whose cytoplasm is dark magenta-red
    and granular, with tiny white specks; along the bottom a paler purple band of connective tissue with clear cells
    and a small round vessel.
