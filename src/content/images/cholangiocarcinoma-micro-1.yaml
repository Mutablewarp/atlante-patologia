lookFor:
  it: "Confronta i cordoni ordinati di epatociti con le cellule tumorali piccole, in ghiandole e nidi, immerse in uno stroma fibroso."
  en: "Compare the orderly cords of hepatocytes with the smaller tumor cells in glands and nests set in a fibrous stroma."
caption:
  it: >-
    Colangiocarcinoma, EE a forte ingrandimento. Parti dagli epatociti, grandi e rosa, in cordoni ordinati con nuclei
    rotondi, in basso a sinistra: sono il fegato normale. Spostati poi verso il centro e verso destra: qui le cellule
    sono più piccole e scure, formano piccole ghiandole e nidi e si infiltrano tra gli epatociti, dentro uno stroma
    fibroso con infiammazione. Questa crescita di ghiandole in uno stroma desmoplastico è la firma istologica del
    tumore dei dotti biliari.
  en: >-
    Cholangiocarcinoma, H&E at high power. Start with the large pink hepatocytes in orderly cords with round nuclei,
    at the lower left: this is the normal liver. Then move to the center and to the right: here the cells are smaller
    and darker, form small glands and nests and infiltrate between the hepatocytes, within a fibrous stroma with
    inflammation. This growth of glands in a desmoplastic stroma is the histologic signature of a bile duct tumor.
alt:
  it: >-
    Micrografia in ematossilina-eosina: in basso a sinistra cordoni di epatociti rosa con nuclei rotondi; al centro e a
    destra cellule più piccole e scure in ghiandole e nidi irregolari, tra fibre rosa e cellule infiammatorie.
  en: >-
    H&E micrograph: at the lower left, cords of pink hepatocytes with round nuclei; in the center and on the right,
    smaller, darker cells in irregular glands and nests among pink fibers and inflammatory cells.
