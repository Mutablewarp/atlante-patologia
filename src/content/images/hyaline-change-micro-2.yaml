lookFor:
  it: "Cerca le arteriole con parete spessa, magenta e omogenea, e il lume ridotto a una fessura."
  en: "Look for arterioles with a thick, magenta, homogeneous wall and a lumen reduced to a slit."
caption:
  it: >-
    Ialinosi arteriolare renale, PAS, ad alto ingrandimento. A destra, due arteriole hanno la parete sostituita da
    materiale rosa-magenta omogeneo e il lume è ridotto a una fessura. A sinistra, la colorazione PAS mette in evidenza
    le membrane basali dei tubuli come linee magenta sottili. Il materiale ialino delle arteriole è più spesso e uniforme.
    La biopsia viene da un rene con nefropatia cronica da trapianto.
  en: >-
    Renal arteriolar hyalinosis, PAS, at high power. On the right, two arterioles have walls replaced by homogeneous
    pink-magenta material, and their lumens are reduced to a slit. On the left, the PAS stain outlines the tubular
    basement membranes as thin magenta lines. The hyaline material in the arterioles is thicker and more uniform. The
    biopsy comes from a kidney with chronic allograft nephropathy.
alt:
  it: >-
    Micrografia PAS rosa e magenta: a sinistra tubuli con membrane basali magenta sottili; a destra due arteriole rotonde
    con parete spessa, omogenea e magenta, e un piccolo lume centrale.
  en: >-
    Pink and magenta PAS micrograph: tubules with thin magenta basement membranes on the left; on the right two round
    arterioles with thick, homogeneous magenta walls and a small central lumen.
