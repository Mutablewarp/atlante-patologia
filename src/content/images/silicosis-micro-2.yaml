lookFor:
  it: "Cerca i piccoli noduli cellulari che sporgono nello spazio aereo e confrontali con il nodulo collagenizzato dell'immagine precedente."
  en: "Find the small cellular nodules bulging into the air space and compare them with the collagenized nodule in the previous image."
caption:
  it: >-
    Polmone con silicosi, basso ingrandimento: una fase più precoce. Piccoli noduli cellulari, ricchi di macrofagi e
    fibroblasti, occupano e deformano il parenchima; nel nodulo al centro c'è una zona rosa pallido più compatta. Non
    hanno ancora la struttura a vortice del nodulo silicotico maturo.
  en: >-
    Lung with silicosis, low power: an earlier phase. Small cellular nodules, rich in macrophages and fibroblasts, fill
    and distort the parenchyma; the nodule at center has a denser pale pink zone. They do not yet show the whorled
    structure of the mature silicotic nodule.
alt:
  it: "Sezione di polmone rosa e viola a basso ingrandimento: piccoli noduli cellulari fra spazi aerei chiari, con una zona rosa pallido compatta al centro."
  en: "Pink and purple lung section at low power: small cellular nodules between pale air spaces, with a compact pale pink zone at the center."
