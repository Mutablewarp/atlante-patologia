lookFor:
  it: "Cerca ciò che è nero: solo il nodulo necrotico. Poi torna all'EE e confronta le stesse zone."
  en: "Find what is black: only the necrotic nodule. Then switch back to H&E and compare the same zones."
caption:
  it: >-
    Lo stesso nodulo colorato con il metodo di von Kossa, sempre in visione panoramica del vetrino. La differenza con
    l'EE salta all'occhio: tutto il nodulo necrotico è grigio-nero, comprese le zone che in EE tendevano al rosa,
    mentre il polmone intorno e l'orlo che delimita la lesione restano chiari; solo la zona centrale sfilacciata è più
    pallida. Il nero indica i depositi di calcio, e il fatto che riempiano il nodulo e si fermino al suo bordo dice che
    il calcio si è posato sul tessuto tumorale morto, non sul polmone vivo. Perché usare questa colorazione?
    L'ematossilina colora di blu molte strutture, tra cui il calcio; il nero della von Kossa indica il calcio in modo
    molto più affidabile, perciò serve a confermare una calcificazione sospettata in EE e a vederne l'estensione reale.
    Collegamento con l'esame: calcio basofilo in EE e nero con la von Kossa; la forma distrofica richiede un tessuto
    danneggiato o morto e di solito si accompagna, come in questo caso, a esami del metabolismo del calcio normali.
  en: >-
    The same nodule stained by the von Kossa method, again as a whole-mount view of the slide. The difference from H&E
    is striking: the whole necrotic nodule is grey-black, including the zones that leaned towards pink on H&E, while
    the surrounding lung and the rim that bounds the lesion stay pale; only the frayed central zone is lighter. The
    black marks the calcium deposits, and the way they fill the nodule and stop at its edge tells you the calcium
    settled on dead tumour tissue, not on living lung. Why use this stain? Haematoxylin colours many structures blue,
    calcium among them; the black of von Kossa points to calcium far more reliably, so it confirms a calcification
    suspected on H&E and shows its true extent. Exam link: calcium is basophilic on H&E and black with von Kossa; the
    dystrophic form needs damaged or dead tissue and usually comes, as in this case, with normal tests of calcium
    metabolism.
alt:
  it: >-
    Sezione panoramica colorata con von Kossa: lo stesso grande nodulo lobulato appare grigio-nero in modo uniforme,
    con il centro più chiaro, mentre il polmone e l'orlo intorno sono quasi bianchi, con un tenue alone rosa.
  en: >-
    Low-power whole-mount von Kossa section: the same large, lobulated nodule is evenly grey-black with a lighter
    centre, while the surrounding lung and rim are almost white with a faint pink tinge.
