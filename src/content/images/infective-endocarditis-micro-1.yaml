caption:
  it: >-
    Vegetazione di endocardite batterica su una valvola riparata, EE. Parti dalla massa rosa pallido di fibrina, a destra.
    In alto a sinistra ci sono neutrofili con nuclei lobati, inseriti nel materiale pallido. In basso a sinistra una zona
    viola scuro e granulare è una colonia batterica. Fibrina e neutrofili, in un contesto clinico adatto, bastano a
    riconoscere una vegetazione batterica anche senza colonie visibili. Le etichette in inglese sono già nell'immagine.
  en: >-
    Vegetation of bacterial endocarditis on a repaired valve, H&E. Start with the pale pink mass of fibrin on the right.
    At the upper left, neutrophils with lobed nuclei lie in pale material. At the lower left a dark purple granular area
    is a bacterial colony. In a fitting clinical setting, fibrin and neutrophils are enough to recognize a bacterial
    vegetation even when no colonies are visible. The labels are already in the image.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a destra un'ampia area rosa omogenea etichettata fibrina; in alto a sinistra
    numerosi piccoli nuclei scuri di neutrofili tra spazi chiari; in basso a sinistra un'area viola scura granulare con
    una freccia, etichettata colonie batteriche.
  en: >-
    H&E micrograph: a broad homogeneous pink area labeled fibrin on the right; many small dark neutrophil nuclei among
    clear spaces at the upper left; a dark purple granular area with an arrow, labeled bacterial colonies, at the lower
    left.
lookFor:
  it: "Distingui prima la fibrina rosa, poi i neutrofili con nuclei scuri e lobati, infine le colonie batteriche viola scuro."
  en: "Tell the pink fibrin first, then the neutrophils with dark lobed nuclei, then the dark purple bacterial colonies."
