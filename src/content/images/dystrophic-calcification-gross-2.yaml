lookFor:
  it: "Scorri le fette dall'alto in basso e guarda il nodulo bianco-gessoso comparire, ingrandirsi e poi ridursi."
  en: "Go through the slices from top to bottom and watch the chalky-white nodule appear, grow and shrink again."
caption:
  it: >-
    Polmone asportato chirurgicamente insieme al tumore e tagliato a fette seriate, disposte in ordine accanto a un
    righello in centimetri. Il pezzo viene da un adenocarcinoma polmonare che si era ridotto dopo un inibitore dei checkpoint
    immunitari (anti-PD-1) seguito da chemioterapia. Comincia dalle fette in alto: polmone spugnoso, grigio-bruno, senza
    nulla di particolare. Poi scendi lungo la serie: in quattro fette consecutive compare un nodulo a margini netti,
    bianco-crema, opaco e asciutto come gesso, in alcuni punti circondato da un sottile orlo bruno chiaro. È l'aspetto a
    occhio nudo di un tessuto necrotico calcificato: al taglio un tessuto così può risultare granuloso o duro come un
    sasso. Al microscopio non era sopravvissuta nessuna cellula tumorale: il nodulo era tessuto morto (necrosi
    coagulativa) incrostato di sali di calcio, come mostrano le sezioni in EE e con la colorazione di von Kossa dello
    stesso nodulo. Perché distrofica? Gli esami del metabolismo del calcio nel sangue erano tutti normali: ad attirare il
    calcio è stato il tessuto tumorale ucciso dalla terapia, non un disturbo generale. Attenzione: un nodulo polmonare
    calcificato fa pensare prima di tutto a un vecchio granuloma tubercolare, e infatti la tubercolosi è stata esclusa;
    qui invece il calcio segnava un tumore ormai morto.
  en: >-
    Lung removed at surgery together with the tumour and cut into serial slices, laid out in order beside a ruler in
    centimetres. The
    specimen comes from a lung adenocarcinoma that had shrunk after an immune checkpoint inhibitor (anti-PD-1) followed
    by chemotherapy. Start with the slices at the top: spongy, grey-brown lung with nothing unusual. Then work down the
    series: in four consecutive slices a sharply bounded nodule appears, cream-white, opaque and dry like chalk, edged
    in places by a thin tan rim. This is what necrotic tissue that has calcified looks like to the naked eye; when cut,
    tissue of this kind can feel gritty or as hard as stone. Under the microscope not a single tumour cell had
    survived: the nodule was dead tissue (coagulative necrosis) encrusted with calcium salts, as the H&E and von Kossa
    sections of the same nodule show. Why dystrophic? Blood tests of calcium metabolism were all normal: what drew the
    calcium was the tumour tissue killed by the treatment, not a systemic disorder. Pitfall: a calcified lung
    nodule first brings an old tuberculous granuloma to mind, and tuberculosis was indeed ruled out; here the calcium
    marked a tumour that had died.
alt:
  it: >-
    Fotografia di otto fette di polmone asportato, disposte in colonna su fondo blu accanto a un righello
    bianco graduato in centimetri. Le tre fette in alto e quella in basso sono brune e spugnose; ciascuna delle quattro
    fette intermedie contiene un nodulo bianco-crema, gessoso e a margini netti, più grande nella sesta fetta.
  en: >-
    Photograph of eight slices of resected lung laid out in a column on a blue background, beside a white ruler
    marked in centimetres. The top three slices and the bottom one are brown and spongy; each of the four slices in
    between contains a sharply bounded, cream-white, chalky nodule, largest in the sixth slice.
