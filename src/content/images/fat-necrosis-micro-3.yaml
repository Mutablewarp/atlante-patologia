caption:
  it: >-
    Steatonecrosi in un caso di pancreatite acuta grave, ematossilina-eosina (EE) a piccolo ingrandimento: è la forma
    enzimatica, quella in cui gli enzimi pancreatici attivati digeriscono il tessuto adiposo. Prima orientati. La metà
    destra del campo è occupata da lobuli di grasso morto, trasformati in una massa rosa pallido e sfumata in cui si
    intuiscono appena i contorni degli adipociti di un tempo, senza nuclei. Lungo il loro margine inferiore sinistro
    corre una banda densa, viola scuro, gremita di cellule infiammatorie; il terzo sinistro del campo è invece un
    tessuto più lasso, con piccoli vasi e cellule fusate, che circonda la lesione. Ora cerca il reperto chiave nella
    zona di passaggio tra questo tessuto e il grasso necrotico, in alto e in basso poco a sinistra del centro: piccole
    zolle irregolari, a margini netti, così scure da sembrare nero-violacee. Nelle note della pagina di origine
    l'autore le indica come depositi di calcio. Sono i saponi di calcio della steatonecrosi: una volta che la lipasi
    ha staccato gli acidi grassi dai trigliceridi, questi catturano il calcio (saponificazione), e i sali di calcio
    trattengono con forza l'ematossilina, per questo appaiono blu-neri (basofili). A occhio nudo gli stessi saponi
    formano le chiazze bianco-gesso della steatonecrosi (confronta la foto macroscopica di questa scheda). Per
    dimostrare che si tratta davvero di calcio si ricorre alla colorazione di von Kossa, più specifica dell'EE, che
    li colora di nero.
  en: >-
    Fat necrosis in a case of severe acute pancreatitis, H&E at low power: the enzymatic form, in which activated
    pancreatic enzymes digest adipose tissue. Orient yourself first. The right half of the field is taken up by
    lobules of dead fat, turned into a pale pink, smudged mass in which only faint outlines of the former fat cells
    can be traced, with no nuclei. Along their lower-left edge runs a dense, dark purple band crowded with
    inflammatory cells, while the left third of the field is a looser tissue with small vessels and spindle cells that
    surrounds the lesion. Now look for the key finding in the transition zone between that tissue and the dead fat,
    above and below the centre-left: small, irregular clods with sharp edges, so dark that they look black-violet. In
    the notes on the source page the author marks them as calcium deposits. They are the calcium soaps of fat
    necrosis: once lipase has stripped the fatty acids from the triglycerides, the acids capture calcium
    (saponification), and calcium salts hold haematoxylin strongly, which is why they look blue-black (basophilic).
    With the naked eye the same soaps make the chalky white patches of fat necrosis (compare the gross photograph on
    this card). To prove that the clods really are calcium, the laboratory uses the von Kossa stain, which is more
    specific than H&E and colours them black.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento: la metà destra è occupata da tessuto rosa pallido e
    sfumato, con contorni cellulari appena visibili e senza nuclei, delimitato da una banda diagonale viola scuro di
    cellule fitte; il terzo sinistro mostra connettivo rosa con piccoli vasi e molti piccoli nuclei; tra le due zone,
    in alto e in basso poco a sinistra del centro, alcune piccole zolle a margini netti, quasi nero-violacee.
  en: >-
    Low-power haematoxylin and eosin micrograph: the right half is filled with pale pink, smudged tissue with faint
    cell outlines and no nuclei, edged by a diagonal dark purple band of densely packed cells; the left third shows
    pink connective tissue with small vessels and many small nuclei; between the two, above and below the
    centre-left, lie a few small, sharply outlined, almost black-violet clods.
