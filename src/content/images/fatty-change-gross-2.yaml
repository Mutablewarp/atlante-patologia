lookFor:
  it: "Percorri la superficie di taglio da un margine all'altro: un unico giallo pallido uniforme, senza noduli né cicatrici."
  en: "Run your eye across the cut surface from edge to edge: one even pale yellow, with no nodules and no scars."
caption:
  it: >-
    Grosso fegato steatosico, pezzo anatomico da museo conservato in liquido fissativo (l'etichetta francese «GROS
    FOIE GRAS» significa «grosso fegato grasso»; 1046 è il numero di catalogo). A sinistra vedi la superficie esterna
    di un lobo, liscia e lucida; a destra un'ampia superficie di taglio. Parti da quest'ultima: è di un giallo
    camoscio pallido uniforme da un margine all'altro, interrotta solo da piccoli orifizi vascolari e da qualche
    sottile parete di vaso ramificata, senza noduli e senza cicatrici fibrose. Il tessuto bitorzoluto al centro,
    attorno ai grossi vasi, è connettivo e non parenchima epatico: escludilo quando giudichi il colore. Concetto
    chiave: il grasso accumulato negli epatociti rende il fegato giallo e l'organo si ingrandisce; nei forti bevitori
    può arrivare a pesare fino a tre volte il normale. Attenzione: tutta la foto ha una dominante giallo-verde data
    dal liquido di conservazione e dall'illuminazione, e il tessuto fissato perde il colore del fresco; valuta perciò
    l'uniformità più che la tonalità esatta. Una superficie di taglio omogenea distingue anche la steatosi semplice
    dalla cirrosi, nella quale il taglio si frammenta in noduli tondeggianti separati da tessuto cicatriziale chiaro.
  en: >-
    Large fatty liver, a museum specimen kept in fixative (the French label "GROS FOIE GRAS" means "large fatty
    liver"; 1046 is its catalogue number). On the left you see the smooth, glossy outer surface of one lobe; on the
    right, a broad cut surface. Start with the cut surface: it is an even pale buff-yellow from edge to edge, broken
    only by small vessel openings and a few thin, branching vessel walls, with no nodules and no fibrous scars. The
    lumpy tissue in the centre, around the large vessels, is connective tissue, not liver parenchyma: leave it out
    when you judge the colour. Key point: the fat stored in hepatocytes turns the liver yellow and the organ
    enlarges; in heavy drinkers it can weigh up to three times normal. Pitfall: the whole photograph has a
    yellow-green cast from the preserving fluid and the lighting, and fixed tissue loses its fresh colour, so judge
    the evenness rather than the exact shade. An even cut surface also sets simple fatty change apart from cirrhosis,
    where the cut surface breaks up into rounded nodules separated by pale scar tissue.
alt:
  it: >-
    Fotografia macroscopica di un fegato intero in una teca da museo su fondo giallo-verde: a sinistra la superficie
    esterna liscia di un grosso lobo; a destra un'ampia superficie di taglio piatta, di colore giallo camoscio pallido
    uniforme, con piccoli fori vascolari e senza noduli; al centro tessuto connettivo chiaro e bitorzoluto attorno ai
    vasi; in alto a sinistra un'etichetta stampata «1046 FOIE» e in basso a sinistra «GROS FOIE GRAS».
  en: >-
    Gross photograph of a whole liver in a museum display box against a yellow-green background: on the left the
    smooth outer surface of a large lobe; on the right a wide, flat cut surface of even pale buff-yellow with small
    vessel holes and no nodules; pale, lumpy connective tissue around vessels in the centre; a printed label "1046
    FOIE" at the top left and "GROS FOIE GRAS" at the bottom left.
