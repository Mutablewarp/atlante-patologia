caption:
  it: >-
    Adenocarcinoma della prostata, biopsia con ago, colorazione HPS a medio ingrandimento. Ghiandole piccole, con lumi
    aperti, si infiltrano nello stroma fibroso e sono disposte senza il normale assetto lobulare.
  en: >-
    Prostatic adenocarcinoma, needle core biopsy, HPS stain at medium power. Small glands with open lumens infiltrate the
    fibrous stroma and lack the normal lobular arrangement.
alt:
  it: >-
    Micrografia di una biopsia con ago: molte ghiandole piccole con lumi chiari e nuclei scuri, sparse in uno stroma
    fibroso rosa-arancio, su sfondo bianco.
  en: >-
    Micrograph of a needle core: many small glands with pale lumens and dark nuclei, scattered in pink-orange fibrous
    stroma on a white background.
