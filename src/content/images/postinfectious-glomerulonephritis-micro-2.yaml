caption:
  it: "Biopsia renale, colorazione PAS, a forte ingrandimento. I due glomeruli grandi sono ipercellulari, con molti nuclei nei gomitoli e anse capillari poco visibili; il glomerulo in basso a sinistra è meno cellulare."
  en: "Kidney biopsy, PAS stain, high magnification. The two large glomeruli are hypercellular, with many nuclei in the tufts and capillary loops hard to see; the glomerulus at lower left is less cellular."
