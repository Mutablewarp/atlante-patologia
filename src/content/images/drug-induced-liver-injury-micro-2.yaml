lookFor:
  it: "Individua i due spazi chiari con dentro un materiale color ocra-arancio: è la bile nel canalicolo dilatato. Cerca poi granuli dello stesso colore dentro gli epatociti vicini."
  en: "Find the two clear spaces holding ocher-orange material: that is bile in a dilated canaliculus. Then look for granules of the same color inside the nearby hepatocytes."
caption:
  it: >-
    Colestasi epatica, H&E ad alto ingrandimento. Due spazi dilatati contengono tappi di bile color ocra-arancio.
    Piccoli granuli dello stesso colore sono visibili anche nel citoplasma di alcuni epatociti. Accanto, un piccolo
    infiltrato infiammatorio. È la stessa area della veduta a basso ingrandimento.
  en: >-
    Liver cholestasis, H&E at high power. Two dilated spaces hold ocher-orange bile plugs. Small granules of the same
    color are also visible in the cytoplasm of some hepatocytes. Next to them is a small inflammatory infiltrate. It
    is the same specimen as the low-power view.
alt:
  it: >-
    Micrografia ad alto ingrandimento in H&E: epatociti rosa con nuclei rotondi viola, due spazi chiari irregolari
    riempiti di materiale arancio-ocra e, a sinistra, un gruppo di piccole cellule infiammatorie.
  en: >-
    High-power H&E micrograph: pink hepatocytes with round purple nuclei, two irregular clear spaces filled with
    orange-ocher material and, on the left, a cluster of small inflammatory cells.
