lookFor:
  it: "Guarda prima le aree pallide e compatte del parenchima, poi i noduli ingrossati accanto all'ilo del polmone di destra nella foto."
  en: "Look first at the pale, solid areas of the parenchyma, then at the enlarged nodules beside the hilum of the lung on the right of the photo."
caption:
  it: >-
    Sezioni di due polmoni con sarcoidosi, su fondo blu. Il parenchima mostra ampie aree pallide e compatte, dove i
    granulomi confluiscono. Accanto all'ilo del polmone di destra nella foto si vedono linfonodi ilari molto ingrossati,
    rotondi e di color rosato. Polmone e linfonodi ilari sono le sedi più frequenti della malattia.
  en: >-
    Cut sections of two lungs with sarcoidosis, on a blue background. The parenchyma shows broad pale, solid areas where
    granulomas run together. Beside the hilum of the lung on the right of the photo there are markedly enlarged hilar
    lymph nodes, round and pinkish. The lung and hilar nodes are the most frequent sites of the disease.
alt:
  it: "Due sezioni di polmone rosso-brunastro su fondo blu, con aree grigio-giallastre compatte e, vicino all'ilo di destra, alcuni linfonodi ingrossati e rotondi."
  en: "Two cut sections of reddish-brown lung on a blue background, with solid gray-yellow areas and, near the hilum on the right, several enlarged round lymph nodes."
