lookFor:
  it: "Guarda la superficie di taglio nel suo insieme: non è liscia e omogenea, ma screziata, con aree pallide e aree brunastre. I piccoli fori scuri sono lumi vascolari."
  en: "Look at the cut surface as a whole: it is not smooth and uniform but mottled, with pale and brownish areas. The small dark holes are vessel lumens."
caption:
  it: >-
    Cirrosi alcolica, superficie di taglio del fegato (campione autoptico). Il parenchima è screziato: aree pallide
    alternate ad aree brunastre, invece del colore uniforme di un fegato normale. Le zone chiare corrispondono a
    una fitta rete di tessuto cicatriziale. I fori scuri sono lumi vascolari tagliati; in basso a destra si vede un
    grosso vaso con il tessuto connettivo che lo circonda.
  en: >-
    Alcoholic cirrhosis, cut surface of the liver (autopsy specimen). The parenchyma is mottled, with pale areas
    alternating with brownish areas, instead of the uniform color of a normal liver. The pale zones correspond to a
    dense network of scar tissue. The dark holes are cut vessel lumens; at the lower right a large vessel is seen
    with the connective tissue around it.
alt:
  it: >-
    Fotografia ravvicinata della superficie di taglio di un fegato, di colore giallo-brunastro e screziata di aree
    più chiare, con numerosi piccoli lumi vascolari scuri e, in basso a destra, un grosso vaso con la parete rosea.
  en: >-
    Close-up photograph of the cut surface of a liver, yellow-brown and mottled with paler areas, with many small
    dark vessel lumens and, at the lower right, a large vessel with a pink wall.
