caption:
  it: >-
    Atrofia da denervazione del muscolo scheletrico in una biopsia muscolare, sezione trasversale colorata con HPS
    (ematossilina-floxina-zafferano, una variante dell'ematossilina-eosina in cui lo zafferano colora il collagene di
    giallo-arancio), a medio ingrandimento. È la vista di routine della stessa biopsia che le altre immagini della serie
    mostrano con l'ATPasi. Parti dal quadro d'insieme: le fibre, tagliate di traverso, sono raccolte in fascicoli
    separati da setti perimisiali arancioni. Poi confronta le fibre fra loro. Nel muscolo normale sono poligonali e di
    calibro abbastanza uniforme; qui fibre grandi e tondeggianti stanno accanto a fibre molto più piccole, e molte fibre
    grandi hanno una zona centrale più scura: sono le fibre a bersaglio (target) descritte per questa biopsia, un segno
    che denervazione e reinnervazione sono in corso. Con una colorazione di routine le fibre atrofiche passano
    facilmente inosservate, perché sembrano semplici fibre piccole; è l'ATPasi a mostrare quali fibre si sono ridotte
    e a quale tipo appartengono. Attenzione: la variabilità di calibro da sola non basta per parlare di denervazione;
    anche l'atrofia selettiva delle fibre di tipo II (da disuso, da terapia cortisonica cronica, nella cachessia o
    nell'anziano) può avere un aspetto molto simile all'ematossilina-eosina, e la distinzione richiede l'istochimica.
  en: >-
    Denervation atrophy of skeletal muscle in a muscle biopsy, transverse section stained with HPS
    (haematoxylin-phloxine-saffron, a variant of H&E in which saffron colours collagen orange-yellow), intermediate
    power. This is the routine view of the same biopsy that the other images of the set show with the ATPase reaction.
    Start with the overview: the fibres, cut across, are packed into fascicles separated by orange perimysial septa.
    Then compare the fibres with one another. In normal muscle they are polygonal and of fairly even size; here large,
    rounded fibres sit next to much smaller ones, and many large fibres have a darker central zone: these are the
    target fibres described for this biopsy, a sign that denervation and reinnervation are under way. On a routine
    stain the atrophic fibres are easy to overlook, because they look like ordinary small fibres; it is the ATPase
    reaction that shows which fibres have shrunk and to which type they belong. Pitfall: variation in fibre size alone
    does not prove denervation; selective atrophy of type II fibres (from disuse, long-term corticosteroid therapy,
    cachexia or old age) can look very similar on H&E, and telling them apart needs histochemistry.
alt:
  it: >-
    Micrografia rosa acceso di muscolo tagliato di traverso: numerose fibre poligonali di dimensioni diverse raccolte
    in fascicoli, alcune grandi fibre tonde con il centro rosso più scuro, piccoli nuclei blu scuro ai margini delle
    fibre e bande arancioni di tessuto connettivo che attraversano il campo in diagonale, con qualche fessura bianca.
  en: >-
    Bright pink micrograph of muscle cut across: many polygonal fibres of mixed sizes packed into fascicles, several
    large round fibres with a darker red centre, small dark blue nuclei at the fibre edges, and orange bands of
    connective tissue crossing the field diagonally, with a few white clefts.
