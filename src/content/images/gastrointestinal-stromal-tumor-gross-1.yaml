caption:
  it: >-
    Tumore stromale gastrointestinale dello stomaco, pezzo operatorio sezionato. Guarda prima il contorno: la massa è
    ben delimitata e spinge contro la parete circostante. Poi osserva la superficie di taglio: è compatta, pallida,
    biancastra o rosata, con piccole macchie rosso-brune di emorragia sparse nel tessuto.
  en: >-
    Gastrointestinal stromal tumor of the stomach, cut surface of the resected specimen. Look at the outline first: the
    mass is well circumscribed and pushes against the surrounding wall. Then look at the cut surface: it is solid and
    pale, whitish to pink, with small red-brown spots of hemorrhage scattered through the tissue.
alt:
  it: >-
    Fotografia di una massa sezionata su fondo nero: superficie di taglio compatta, color crema-rosato, con piccole
    macchie rosso-brune e una zona scura di emorragia a destra; margine liscio a sinistra.
  en: >-
    Photograph of a sliced mass on a black background: a solid, cream-pink cut surface with small red-brown spots and a
    dark hemorrhagic area on the right; smooth edge at the left.
