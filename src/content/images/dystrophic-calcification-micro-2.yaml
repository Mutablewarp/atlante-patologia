caption:
  it: >-
    Microcalcificazione distrofica in un carcinoma duttale in situ (DCIS) della mammella, EE a forte ingrandimento. La
    massa frastagliata a sinistra, viola scuro quasi nera, è fosfato di calcio: densa, frammentata in schegge angolose e
    vitree, con un centro più chiaro e cristallino. Il calcio è molto basofilo, perciò si colora più intensamente di
    qualsiasi nucleo del campo. Osserva la messa a fuoco: il deposito è nitido, mentre le cellule tumorali attorno (in
    basso a destra, nuclei affollati intorno a spazi rotondi) appaiono sfocate. Il deposito, duro, sporge dal piano della
    sezione: è un indizio utile per distinguere il calcio vero da un gruppo scuro di cellule ammassate. Perché è
    distrofica? Il calcio precipita su cellule morte, detriti o secrezioni all'interno del dotto, cioè in un tessuto già
    alterato, con calcemia normale. Collegamento clinico: sono proprio queste microcalcificazioni che la mammografia
    rileva, e spesso sono loro a portare alla biopsia che diagnostica il DCIS.
  en: >-
    Dystrophic microcalcification in ductal carcinoma in situ (DCIS) of the breast, H&E at high power. The jagged, dark
    purple to almost black mass on the left is calcium phosphate: dense, broken into angular, glassy shards, with a
    paler, crystalline centre. Calcium is strongly basophilic, so it stains deeper than any nucleus in the field. Look at
    the focus: the deposit is sharp, while the tumour cells around it (lower right, crowded nuclei around round spaces)
    look blurred. The hard deposit stands out of the plane of the section, a useful clue to tell true calcium from a
    dark cluster of crowded cells. Why dystrophic? The calcium precipitates on dead cells, debris or secretions inside
    the duct, that is, in tissue that is already abnormal, while blood calcium is normal. Clinical link: these
    microcalcifications are exactly what mammography detects, and they often lead to the biopsy that diagnoses DCIS.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: a sinistra una grande massa viola scuro, quasi nera,
    frammentata in schegge angolose con un centro più chiaro; attorno, tessuto mammario sfocato con cellule dai nuclei
    affollati e spazi bianchi rotondi in basso a destra e stroma rosa in alto a destra.
  en: >-
    High-power H&E micrograph: on the left a large dark purple, almost black mass broken into angular shards with a
    paler centre; around it, out-of-focus breast tissue with crowded nuclei and round white spaces at the lower right
    and pink stroma at the upper right.
