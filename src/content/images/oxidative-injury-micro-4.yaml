# journal, volume and DOI confirmed on PubMed). Its JATS <license> is https://creativecommons.org/licenses/by/4.0/
# ("Copyright © 2025, Omameuda et al."). Figure 2 shows the authors' own liver biopsy and its legend carries no
# third-party credit or "reproduced with permission" note, so CC BY 4.0 covers it; CC BY needs no owner approval.
# Histology only; nothing identifies the patient. The file is a full-resolution crop of panel a of Figure 2 as embedded
# in the article PDF of the PMC open-access record (pmc-oa-opendata, PMC12664704.1); the PMC web figure is too small.
# Group hepatic-lipofuscin-omameuda = panels a (H&E, low power), b (H&E, high power) and d (iron stain) of this
# biopsy. Panel c (Fontana-Masson) is left out: its stain code would be "other", like panel d's, and the viewer's
# switch would then show two identical labels. The vein is called only "vein": the source does not name it.
# Re-checked 2026-11-09: the PMC OA record (PMC12664704.1.json) gives license_code "CC BY", not retracted; the crop
# matches the PDF figure (2892 × 2164 px) at offset 22,20 with a mean pixel difference of 1.6/255 (JPEG noise only).
# The article reports no steatosis, inflammation, fibrosis or cholestasis in this biopsy: hence "no other lesion".
