lookFor:
  it: "Lascia stare i nuclei e guarda il citoplasma dentro i cerchi: sul rosa si stende una lieve polvere bruna."
  en: "Ignore the nuclei and look at the cytoplasm inside the circles: a faint brown dust lies over the pink."
caption:
  it: >-
    Biopsia epatica di un adulto in valutazione per la donazione di fegato da vivente, EE a piccolo ingrandimento (×100
    secondo la fonte); i cerchi neri sono degli autori. A parte il pigmento, gli autori non hanno trovato altre lesioni
    nella biopsia. Una vena a parete sottile scende al centro del campo e intorno le lamine di epatociti sembrano
    normali. Guarda meglio il citoplasma, soprattutto dentro i cerchi: in molti epatociti c'è una lieve polvere bruna che
    il rosa dell'eosina non spiega. A questo ingrandimento si coglie solo la tinta: passa alla vista a forte
    ingrandimento della stessa serie per vedere i granuli, poi alla colorazione per il ferro per capire che cosa non
    sono. La diagnosi è stata lipofuscina: lipidi e proteine danneggiati dall'ossidazione che la cellula non è riuscita
    né a digerire né a eliminare. Gli epatociti si dividono solo di rado, perciò trattengono ciò che non riescono a
    smaltire e negli anni il pigmento aumenta. Trappola: in EE un pigmento bruno negli epatociti non basta a dargli un
    nome, perché lipofuscina ed emosiderina, la forma di deposito del ferro, possono sembrare uguali.
  en: >-
    Liver biopsy from an adult under evaluation for living liver donation, H&E at low power (×100 in the source); the
    black circles are the authors'. Apart from the pigment, the authors found no other lesion in the biopsy. A
    thin-walled vein runs down the middle of the field and the hepatocyte plates around it look normal. Look again at
    the cytoplasm, above all inside the circles: many hepatocytes carry a faint brown dust that the pink of eosin does
    not explain. At this power you only catch the tint: switch to the high-power view of this set to see the granules,
    then to the iron stain to learn what they are not. The diagnosis was lipofuscin: lipids and proteins damaged by
    oxidation that the cell could neither digest nor get rid of. Hepatocytes divide only rarely, so they hold on to what
    they cannot clear, and the pigment builds up over the years. Pitfall: on H&E a brown pigment in hepatocytes is not
    enough to name it, because lipofuscin and haemosiderin, the storage form of iron, can look the same.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina a piccolo ingrandimento: un lume vascolare bianco e stretto scende
    dal centro in alto verso il basso a sinistra; il resto del campo è occupato da epatociti rosa in lamine con molti
    piccoli nuclei viola; tre cerchi neri tracciati sull'immagine racchiudono gruppi di epatociti dal citoplasma
    lievemente brunastro; in alto a sinistra la lettera a in un riquadro bianco, in basso a destra una barra di scala
    da 50 µm.
  en: >-
    Low-power H&E micrograph of liver: a narrow white vessel lumen runs from the top centre down to the lower left;
    pink hepatocytes in plates with many small purple nuclei fill the rest of the field; three black circles drawn on
    the image enclose groups of hepatocytes with a faintly brownish cytoplasm; the letter a in a white box at the top
    left and a 50 µm scale bar at the bottom right.
