caption:
  it: >-
    Calcificazione distrofica e metastatica. La distrofica si forma in tessuti morti o danneggiati con calcemia normale: gli
    acidi grassi liberati dalle cellule morenti legano il calcio (ateromi, valvole cardiache danneggiate, linfonodi
    tubercolari, tumori). La metastatica si forma in tessuti sani quando la calcemia è alta, per esempio in insufficienza
    renale cronica, eccesso di vitamina D o iperparatiroidismo primitivo, e colpisce soprattutto setti alveolari, tubuli
    renali e vasi. In entrambe i depositi appaiono blu-violacei con l'ematossilina-eosina.
  en: >-
    Dystrophic and metastatic calcification. Dystrophic calcification forms in dead or damaged tissue with normal serum
    calcium: fatty acids released by dying cells bind calcium (atheroma, damaged heart valves, tuberculous lymph nodes,
    tumours). Metastatic calcification forms in healthy tissue when serum calcium is high, for example in chronic renal
    failure, vitamin D excess or primary hyperparathyroidism, and mainly affects alveolar septa, renal tubules and
    vessels. In both, the deposits look blue-purple on haematoxylin and eosin.
alt:
  it: >-
    Tabella a due colonne. A sinistra un tessuto rosa con un focolaio necrotico pieno di granuli blu e un indicatore del
    calcio a metà; a destra alveoli normali con granuli blu sulle pareti e un indicatore del calcio pieno. Sotto, righe
    per calcemia, tessuto, meccanismo, esempi e sedi tipiche.
  en: >-
    Two-column table. On the left, pink tissue with a necrotic focus full of blue granules and a calcium gauge half
    full; on the right, normal alveoli with blue granules on their walls and a full calcium gauge. Below, rows for serum
    calcium, tissue, mechanism, examples and typical sites.
