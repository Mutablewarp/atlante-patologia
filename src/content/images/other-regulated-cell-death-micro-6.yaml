orientation:
  it: "Superficie cutanea con lo strato corneo in alto, derma in basso."
  en: "Skin surface with the keratin layer at the top, dermis at the bottom."
lookFor:
  it: "Guarda la metà inferiore dell'epidermide: cerca cheratinociti isolati, raggrinziti e rosso intenso, con linfociti scuri appoggiati accanto."
  en: "Look at the lower half of the epidermis: find single shrunken, deep-pink keratinocytes with dark lymphocytes pressed against them."
caption:
  it: >-
    Uccisione da parte di linfociti citotossici, vista nel tessuto: cute con malattia del trapianto contro l'ospite
    (GVHD), ematossilina-eosina a forte ingrandimento. Dopo un trapianto di midollo osseo o di cellule staminali, i
    linfociti T arrivati con il trapianto possono aggredire i tessuti del ricevente, e la cute è uno dei bersagli
    principali. Orientati: in alto lo strato corneo, al centro l'epidermide, in basso il derma lasso. Poi guarda la metà
    inferiore dell'epidermide: piccoli linfociti con nuclei scuri e irregolari vi sono penetrati e stanno tra i
    cheratinociti. In mezzo a loro spiccano singoli cheratinociti raggrinziti, tondeggianti e rosso intenso, con un
    nucleo denso o frammentato, a volte dentro un alone chiaro: sono cheratinociti apoptotici. Ad alcuni di essi si
    accostano linfociti (satellitosi), la traccia di una cellula uccisa per contatto diretto. I granuli bruni verso la
    base sono melanina caduta nel derma superficiale dalle cellule basali danneggiate. Da ricordare: il linfocita T
    citotossico uccide il bersaglio soprattutto accendendo l'apoptosi, liberando perforina e granzimi (il granzima B
    taglia Bid in tBid e attiva la procaspasi 3) oppure attraverso il ligando di Fas; all'ematossilina-eosina le due vie
    sono indistinguibili, perché entrambe finiscono nell'apoptosi. Cellule morte singole e sparse, con linfociti
    accanto, sono il segno del danno cellulo-mediato, che si ritrova anche nell'eritema multiforme.
  en: >-
    Killing by cytotoxic lymphocytes, seen in tissue: skin with graft-versus-host disease (GVHD), H&E at high power.
    After a bone-marrow or stem-cell transplant, T cells that came with the graft can attack the recipient's tissues,
    and the skin is one of their main targets. Get your bearings: the keratin layer is at the top, the epidermis in the middle and
    the loose dermis below. Then look at the lower half of the epidermis: small lymphocytes with dark, irregular nuclei
    have moved into it and lie between the keratinocytes. Among them, single keratinocytes stand out because they are
    shrunken, rounded and deep pink, with a dense or broken-up nucleus, sometimes in a clear halo: these are apoptotic
    keratinocytes. Lymphocytes sit right against some of them (satellitosis), the trace of a cell killed by direct
    contact. The brown granules near the base are melanin that has dropped from damaged basal cells into the upper
    dermis. Key point: a cytotoxic T cell kills its target mainly by switching on apoptosis, either by releasing
    perforin and granzymes (granzyme B cuts Bid to tBid and activates procaspase-3) or through Fas ligand; on H&E the
    two routes look the same, because both end in apoptosis. Single, scattered dead cells with lymphocytes beside them
    are the mark of cell-mediated injury, which is also seen in erythema multiforme.
alt:
  it: >-
    Micrografia in ematossilina-eosina di cute in sezione verticale: in alto uno strato corneo rosa e ondulato, sotto
    l'epidermide e nella metà inferiore il derma rosa pallido e lasso. Nell'epidermide inferiore molti piccoli nuclei
    scuri di linfociti stanno fra cheratinociti più grandi con nuclei ovali chiari; due cheratinociti, uno in alto a
    destra negli strati superficiali e uno più in basso a destra del centro, sono piccoli, tondi e rosa acceso con
    frammenti nucleari scuri, e quello inferiore ha linfociti accanto. Granuli bruni sparsi si trovano vicino al
    confine con il derma.
  en: >-
    H&E micrograph of skin in vertical section: a wavy pink keratin layer at the top, the epidermis below it and pale
    pink, loose dermis in the lower half. The lower epidermis holds many small, dark lymphocyte nuclei between larger
    keratinocytes with pale oval nuclei; two keratinocytes, one high in the epidermis at upper right and one lower down
    right of centre, are small, round and bright pink with dark nuclear fragments, and the lower one has lymphocytes
    beside it. Scattered brown granules lie near the junction with the dermis.
