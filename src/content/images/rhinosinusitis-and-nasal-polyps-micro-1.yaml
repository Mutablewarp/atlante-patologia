lookFor:
  it: Guarda prima i lobi di tessuto rosa rivestiti da un sottile bordo scuro di epitelio, poi lo stroma lasso al loro interno.
  en: Look first at the pink lobes of tissue edged by a thin dark line of epithelium, then at the loose stroma inside them.
caption:
  it: >-
    Polipo nasale infiammatorio, EE a basso ingrandimento (ingrandimento indicato dall'autore: 25x). Il polipo è fatto
    di lobi rosa che sporgono nello spazio vuoto. Ogni lobo è rivestito da un sottile bordo scuro di epitelio
    respiratorio e ha un nucleo di stroma lasso, con piccole ghiandole e vasi. Passa poi all'immagine ad alto
    ingrandimento per vedere le cellule dello stroma.
  en: >-
    Inflammatory nasal polyp, H&E at low power (magnification given by the author: 25x). The polyp is made of pink
    lobes that bulge into the empty space. Each lobe is lined by a thin dark edge of respiratory epithelium and has a
    core of loose stroma, with small glands and vessels. Then move to the high-power image to see the cells in the
    stroma.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: lobi di tessuto rosa con piccole ghiandole e vasi,
    rivestiti da un sottile bordo di epitelio scuro, separati da spazi vuoti; in basso a destra un'ansa di epitelio con
    un ammasso di cellule scure sotto di essa.
  en: >-
    Low-power H&E micrograph: lobes of pink tissue with small glands and vessels, lined by a thin dark edge of
    epithelium and separated by empty spaces; at the lower right a fold of epithelium with a cluster of dark cells
    beneath it.
