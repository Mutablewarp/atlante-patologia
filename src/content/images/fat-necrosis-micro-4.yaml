stain: H&E
magnification: medium power (original magnification ×200)
lookFor:
  it: "Dal basso verso l'alto: adipociti vivi, poi la banda viola di grasso morto con spazi a fessura; infiltrato infiammatorio ed emorragia a sinistra."
  en: "Bottom to top: living fat cells, then the purple band of dead fat with slit-like spaces; inflammation and bleeding at the left."
caption:
  it: >-
    Pannicolite pancreatica: biopsia cutanea profonda di uno dei noduli rossi e dolenti comparsi su braccia e gambe
    di una paziente pochi giorni dopo una colangiopancreatografia retrograda endoscopica (ERCP), con amilasi e lipasi
    sieriche aumentate. È la steatonecrosi enzimatica che compare lontano dal pancreas: si ritiene che gli enzimi
    pancreatici, portati dal sangue, raggiungano il grasso sottocutaneo e lo digeriscano. Ematossilina-eosina,
    ingrandimento originale ×200. Leggi il campo dal basso verso l'alto. In basso il lobulo adiposo è ancora vivo:
    adipociti grandi, rotondi e vuoti, con pareti sottili, stretti l'uno all'altro. Al centro corre una banda di
    grasso morto: gli adipociti hanno perso il nucleo e la forma rotonda, gli spazi dei lipidi si sono ridotti a
    fessure e a buchi irregolari e tutta la banda ha preso una tinta viola (basofila). A sinistra, tra le due zone,
    ci sono cellule infiammatorie e globuli rossi usciti dai vasi; gli autori descrivono linfociti e neutrofili e
    classificano il quadro come pannicolite lobulare, perché l'infiammazione occupa i lobuli adiposi più che i setti
    che li separano. Perché il viola conta: nella steatonecrosi gli acidi grassi liberati dalla lipasi legano il
    calcio, e il calcio trattiene l'ematossilina. Passa al forte ingrandimento e alla colorazione di von Kossa della
    stessa biopsia per vederlo da vicino e per dimostrare che si tratta di calcio.
  en: >-
    Pancreatic panniculitis: a deep skin biopsy from one of the painful red nodules that appeared on the arms and
    legs of a patient a few days after an endoscopic retrograde cholangiopancreatography (ERCP), with raised serum
    amylase and lipase. It is enzymatic fat necrosis arising far from the pancreas: pancreatic enzymes carried in the
    blood are thought to reach the subcutaneous fat and digest it. H&E, original magnification ×200. Read the field
    from the bottom up. At the bottom the fat lobule is still alive: large, round, empty fat cells with thin walls,
    pressed against one another. Across the middle runs a band of dead fat: the fat cells have lost their nuclei and
    their round shape, the lipid spaces have shrunk to slits and irregular holes, and the whole band has taken on a
    purple (basophilic) tint. At the left, between the two zones, there are inflammatory cells and red blood cells
    that have left the vessels; the authors describe lymphocytes and neutrophils and class the picture as a lobular
    panniculitis, because the inflammation fills the fat lobules rather than the septa between them. Why the purple
    matters: in fat necrosis the fatty acids freed by lipase bind calcium, and calcium holds haematoxylin. Switch to
    the high-power view and to the von Kossa stain of the same biopsy to see it up close and to prove that it is
    calcium.
alt:
  it: >-
    Micrografia in ematossilina-eosina a medio ingrandimento, con la lettera B in alto a sinistra: nella metà
    inferiore grandi spazi bianchi rotondi a parete sottile; al centro una banda orizzontale viola con spazi chiari
    allungati e irregolari; a sinistra, tra le due zone, numerosi puntini rossi e piccoli nuclei scuri.
  en: >-
    Medium-power haematoxylin and eosin micrograph with the letter B at the top left: in the lower half, large round
    white spaces with thin walls; across the middle, a horizontal purple band holding elongated, irregular clear
    spaces; at the left, between the two zones, many red dots and small dark nuclei.
