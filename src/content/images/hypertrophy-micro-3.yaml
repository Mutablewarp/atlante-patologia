stain: "Masson's trichrome"
magnification: "medium power (scale bars 100 µm in the source)"
lookFor:
  it: "Segui il blu: in A sottili filamenti tra i singoli miociti, in B ampie aree che hanno preso il posto dei miociti."
  en: "Follow the blue: in A thin strands between single myocytes, in B broad areas that have taken the place of myocytes."
caption:
  it: >-
    Tricromica di Masson su biopsie della parete del ventricolo sinistro (regione inferobasale) di pazienti con
    prolasso della valvola mitrale sottoposti a riparazione della valvola; barre di scala 100 µm. In questa
    colorazione i miociti sono rossi e il collagene blu, quindi una fibrosi facile da perdere in ematossilina-eosina
    salta all'occhio. Pannello A, fibrosi interstiziale: quasi tutto il campo è fatto di miociti rossi tagliati
    trasversalmente, ma tra di essi corrono sottili filamenti blu che avvolgono singole cellule e piccoli gruppi; i
    miociti però sono conservati. Pannello B, fibrosi sostitutiva: dove i miociti sono morti il collagene ne ha preso
    il posto in ampie aree blu, e i superstiti restano come isole rosse sparse o brevi fasci. Perché conta per
    l'ipertrofia: un certo grado di fibrosi interstiziale accompagna praticamente ogni cuore con ipertrofia patologica
    e irrigidisce la parete, così il ventricolo si riempie male (disfunzione diastolica); la fibrosi sostitutiva
    indica invece che dei miociti sono morti. Attenzione: la fonte non riporta le dimensioni dei miociti e gli autori collegano la fibrosi
    del prolasso soprattutto allo stress meccanico locale sulla parete vicina alla valvola; usa quindi questa figura
    per imparare i due quadri della tricromica, non come esempio di ipertrofia, e giudica le dimensioni dei miociti in
    ematossilina-eosina, rispetto al miocardio normale, come nelle altre micrografie di questa scheda.
  en: >-
    Masson's trichrome on biopsies of the left ventricular wall (inferobasal region) from patients with mitral valve
    prolapse who underwent valve repair; scale bars 100 µm. In this stain myocytes are red and collagen is blue, so
    fibrosis that is easy to miss on H&E stands out. Panel A, interstitial fibrosis: most of the field is red myocytes
    cut across, but thin blue strands run between them and wrap single cells and small groups; the myocytes
    themselves are preserved. Panel B, replacement fibrosis: where myocytes have died, collagen has taken their place
    in broad blue areas, and the survivors are left as scattered red islands or short bundles. Why this matters for
    hypertrophy: some interstitial fibrosis goes with practically every pathologically hypertrophied heart, and it
    stiffens the wall, so the ventricle fills poorly (diastolic dysfunction); replacement fibrosis, by contrast, means
    that myocytes have died.
    Pitfall: the source does not report myocyte size, and the authors relate the fibrosis of prolapse mainly to local
    mechanical stress on the wall next to the valve; so use this figure to learn the two trichrome patterns, not as an
    example of hypertrophy, and judge myocyte size on H&E against normal myocardium, as in the other micrographs on
    this card.
alt:
  it: >-
    Due micrografie affiancate in rosso e blu, ciascuna con una barra di scala nera in basso a sinistra. A sinistra,
    pannello A: profili rossi rotondeggianti e fitti, separati da una sottile rete di linee blu, con qualche chiazza blu
    più grande. A destra, pannello B: ampie aree blu con piccole isole rosse sparse e, nella metà sinistra, alcuni
    fasci rossi allungati che attraversano il campo.
  en: >-
    Two side-by-side micrographs in red and blue, each with a black scale bar at the bottom left. Left, panel A:
    closely packed, rounded red profiles separated by a fine network of blue lines, with a few larger blue patches.
    Right, panel B: wide blue areas with small, scattered red islands and, in its left half, a few elongated red
    bundles crossing the field.
