# License check (2026-11-08): Fig. 1 of Dieterlen M-T et al., "Histopathological insights into mitral valve
# prolapse-induced fibrosis", Front Cardiovasc Med 2023;10:1057986, doi:10.3389/fcvm.2023.1057986, PMID 36960475,
# PMC10028262 (identifiers confirmed in PubMed). The article's <permissions> block (Europe PMC and PMC open-access XML)
# grants CC BY 4.0, copyright 2023 the authors; the figure legend describes the authors' own biopsies and carries no
# "reproduced from" or permission note, so the licence covers the figure. File: the 3000 × 1000 px figure image embedded
# in the article PDF of the PMC open-access record (PMC10028262.1), because the web figure is only 750 × 250 px. The
# authors relate the regional fibrosis of mitral valve prolapse to local mechanical stress rather than to volume
# overload (abstract) and report no myocyte size, so the caption uses the figure only to teach the two trichrome
# patterns and does not call this myocardium hypertrophic. No `section` (panel A is cut across, panel B in mixed
# planes), no `objective` and no `mpp` (the source states only the 100 µm scale bars). Caption facts checked against
# rubin-8e ch. 17 pp. 640 (interstitial and replacement fibrosis) and 663 (fibrosis stiffens the ventricle, diastolic
# dysfunction). Annotations placed by inspection.
