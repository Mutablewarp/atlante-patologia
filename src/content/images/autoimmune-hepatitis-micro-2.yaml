lookFor:
  it: "Guarda l'addensamento viola in basso e osserva come le cellule infiammatorie si insinuano tra gli epatociti rosa vicini, rendendo irregolare il margine."
  en: "Look at the purple cluster at the bottom and note how inflammatory cells creep in among the neighboring pink hepatocytes, leaving a ragged edge."
caption:
  it: >-
    Epatite autoimmune, H&E ad alto ingrandimento. In basso un denso infiltrato di cellule infiammatorie a nucleo
    scuro, che al margine si mescola agli epatociti vicini. Gli epatociti, rosa con nucleo rotondo, formano cordoni
    nella parte alta dell'immagine. Il reperto da cercare è l'infiltrato che invade il parenchima dal bordo.
  en: >-
    Autoimmune hepatitis, H&E at high power. At the bottom is a dense infiltrate of dark-nucleated inflammatory
    cells, mixing with the neighboring hepatocytes at its edge. The hepatocytes, pink with round nuclei, form
    cords in the upper part of the image. The finding to look for is the infiltrate spilling into the parenchyma
    from the edge.
alt:
  it: >-
    Micrografia ad alto ingrandimento di fegato con H&E: cordoni di epatociti rosa con nuclei rotondi in alto e,
    in basso, un denso ammasso di piccole cellule infiammatorie con nuclei viola scuri.
  en: >-
    High-power micrograph of liver with H&E: cords of pink hepatocytes with round nuclei above and, below, a dense
    cluster of small inflammatory cells with dark purple nuclei.
