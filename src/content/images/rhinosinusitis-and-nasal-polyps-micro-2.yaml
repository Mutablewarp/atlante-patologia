lookFor:
  it: Guarda prima l'epitelio ciliato in alto, poi lo stroma sotto di esso, pallido e pieno di cellule rotonde sparse.
  en: Look first at the ciliated epithelium at the top, then at the stroma below it, pale and full of scattered round cells.
caption:
  it: >-
    Polipo nasale infiammatorio, EE ad alto ingrandimento (ingrandimento indicato dall'autore: 100x). In alto c'è
    l'epitelio respiratorio, a più file di nuclei, con le ciglia sulla superficie. Sotto, lo stroma è chiaro, edematoso,
    con fibre sottili e molte cellule rotonde sparse, in gran parte con citoplasma rosso-arancio: sono compatibili con
    eosinofili. Edema e infiltrato ricco di eosinofili sono il quadro tipico dei polipi di origine allergica.
  en: >-
    Inflammatory nasal polyp, H&E at high power (magnification given by the author: 100x). At the top is respiratory
    epithelium, with several rows of nuclei and cilia on the surface. Below it the stroma is pale and edematous, with
    thin fibers and many scattered round cells, most with red-orange cytoplasm: they are consistent with eosinophils.
    Edema and an eosinophil-rich infiltrate are the typical picture of polyps of allergic origin.
alt:
  it: >-
    Micrografia in ematossilina-eosina ad alto ingrandimento: in alto una banda di epitelio viola, stratificato, con
    margine superficiale irregolare; sotto, un ampio stroma pallido a rete lassa con numerose cellule rotonde sparse,
    molte con citoplasma rosso-arancio.
  en: >-
    High-power H&E micrograph: at the top a band of purple, layered epithelium with an uneven surface edge; below it a
    wide pale stroma in a loose mesh with many scattered round cells, many with red-orange cytoplasm.
