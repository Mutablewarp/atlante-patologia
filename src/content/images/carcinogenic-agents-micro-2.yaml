lookFor:
  it: "Cerca gli spazi irregolari a fessura tra i fasci di collagene, rivestiti da cellule endoteliali fusate, con globuli rossi e un infiltrato infiammatorio."
  en: "Look for the irregular slit-like spaces between collagen bundles, lined by spindle endothelial cells, with red cells and an inflammatory infiltrate."
caption:
  it: >-
    Sarcoma di Kaposi della cute, lesione maculare, EE ad alto ingrandimento. Parti dal collagene rosa del derma e
    cerca gli spazi irregolari a fessura che lo dissecano: sono rivestiti da cellule endoteliali fusate con nuclei
    scuri. Dentro alcuni spazi si vedono globuli rossi, intorno un infiltrato infiammatorio. È il tumore associato a
    HHV8, l'esempio di virus oncogeno a DNA della scheda.
  en: >-
    Kaposi sarcoma of the skin, macular lesion, H&E at high power. Start from the pink dermal collagen and look for
    the irregular slit-like spaces that dissect it: they are lined by spindle endothelial cells with dark nuclei. Some
    spaces hold red cells, and an inflammatory infiltrate lies around them. This is the tumor associated with HHV8,
    the card's example of an oncogenic DNA virus.
alt:
  it: >-
    Micrografia di cute in ematossilina-eosina: collagene rosa dissecato da spazi irregolari a fessura, rivestiti da
    cellule fusate con nuclei scuri, con alcuni globuli rossi nei lumi e cellule infiammatorie sparse.
  en: >-
    H&E micrograph of skin: pink collagen dissected by irregular slit-like spaces lined by spindle cells with dark
    nuclei, a few red cells in the lumens and scattered inflammatory cells.
