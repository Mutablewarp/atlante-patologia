lookFor:
  it: "Trova il piccolo dotto biliare al centro e segui l'anello di connettivo rosa e pallido che lo circonda."
  en: "Find the small bile duct at the center and follow the ring of pale pink connective tissue around it."
caption:
  it: >-
    Stesso caso, EE a più forte ingrandimento (barra 0,2 mm). Al centro un piccolo dotto biliare dal lume ridotto è
    circondato da un manicotto di connettivo rosa pallido con nuclei fusati, indicato dalle quattro frecce
    dell'autore: è la fibrosi periduttale concentrica della colangite sclerosante primitiva. Intorno si vedono
    epatociti con nuclei rotondi.
  en: >-
    Same case, H&E at higher power (0.2 mm bar). At the center a small bile duct with a narrow lumen is surrounded by a
    collar of pale pink connective tissue with spindle nuclei, marked by the author's four arrows: this is the
    concentric periductal fibrosis of primary sclerosing cholangitis. Hepatocytes with round nuclei lie around it.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: un piccolo dotto biliare al centro, circondato da uno
    spesso anello di connettivo rosa pallido con nuclei allungati e da quattro frecce nere; in alto a destra epatociti
    violacei; in alto a sinistra una barra di scala di 0,2 mm.
  en: >-
    High-power H&E micrograph: a small bile duct at the center, surrounded by a thick ring of pale pink connective
    tissue with elongated nuclei and by four black arrows; purple hepatocytes at the upper right; a 0.2 mm scale bar at
    the upper left.
