lookFor:
  it: "Cerca i noduli rosa pallido, rotondi e ben delimitati, e osserva se hanno un centro necrotico: qui non c'è."
  en: "Find the pale pink, round, well-defined nodules and check whether they have a necrotic center: here they do not."
caption:
  it: >-
    Linfonodo con sarcoidosi, EE a basso ingrandimento. Il tessuto è occupato da molti noduli rosa pallido, rotondi, sia
    isolati sia confluenti, separati da sottili bande di linfociti più scuri. Sono granulomi senza necrosi centrale e
    hanno più o meno lo stesso aspetto: il parenchima linfoide normale resta solo ai margini.
  en: >-
    Lymph node with sarcoidosis, H&E at low power. The tissue is filled with many pale pink, round nodules, some single
    and some merged, separated by thin bands of darker lymphocytes. They are granulomas without central necrosis and
    look much alike; normal lymphoid tissue is left only at the edges.
alt:
  it: "Sezione di linfonodo colorata con ematossilina-eosina a basso ingrandimento: numerosi noduli rosa pallido, rotondi e confluenti, separati da bande viola scuro di linfociti."
  en: "Hematoxylin-eosin lymph node section at low power: numerous pale pink, round, merging nodules separated by dark purple bands of lymphocytes."
