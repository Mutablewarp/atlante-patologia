lookFor:
  it: "Cerca i sottili bastoncelli rosso-viola sul fondo azzurro: sono i bacilli acido-resistenti."
  en: "Look for the thin red-purple rods on the blue background: these are the acid-fast bacilli."
caption:
  it: >-
    Colorazione di Ziehl-Neelsen per bacilli acido-resistenti, a forte ingrandimento. Guarda i sottili bastoncelli
    rosso-viola, sparsi e spesso lievemente curvi, sul fondo azzurro del controcolorante. Si distinguono da pochi
    granuli scuri perché hanno forma allungata. Questa colorazione mostra il bacillo, che con il Gram non si vede.
  en: >-
    Ziehl-Neelsen stain for acid-fast bacilli, at high power. Look at the thin red-purple rods, scattered and often
    slightly curved, on the blue counterstain background. They differ from a few dark granules by their elongated shape.
    This stain shows the bacillus, which the Gram stain does not.
alt:
  it: >-
    Campo microscopico con fondo azzurro granuloso e cellule rosate tenui; sparsi nel campo, numerosi piccoli bastoncelli
    sottili rosso-viola.
  en: >-
    Microscope field with a granular blue background and faint pinkish cells; scattered across it are many small thin
    red-purple rods.
