caption:
  it: >-
    Miocardio normale (a, a sinistra, adulto giovane) e miocardio ipertrofico (b, a destra, scompenso cardiaco da cuore
    ipertrofico), EE allo stesso ingrandimento (barra 50 µm). Parti dall'insieme: in a le fibre sono sottili, parallele
    e fitte, con nuclei piccoli e allungati a sigaro; in b le fibre sono chiaramente più larghe e meno regolari. Poi
    guarda i nuclei: in b sono ingranditi, più tondeggianti o rettangolari "a vagone" (box-car), con cromatina più
    grossolana, segno dell'aumento del DNA (poliploidia) che accompagna la crescita della cellula. Gli autori descrivono
    anche una lieve fibrosi interstiziale. Concetto chiave: le fibre sono più grandi, non più numerose; i
    cardiomiociti sono cellule perenni, quindi il cuore aumenta di massa per ipertrofia. Attenzione: confronta le
    larghezze solo allo stesso ingrandimento e su fibre tagliate per il lungo, perché un taglio obliquo fa sembrare le
    fibre più larghe.
  en: >-
    Normal myocardium (a, left, young adult) and hypertrophic myocardium (b, right, heart failure from a hypertrophic
    heart), H&E at the same magnification (scale bar 50 µm). Start with the overall texture: in a the fibres are slim,
    parallel and closely packed, with small, elongated, cigar-shaped nuclei; in b the fibres are clearly wider and less
    regular. Then look at the nuclei: in b they are enlarged, rounder or rectangular "box-car" nuclei with coarser
    chromatin, a sign of the increased DNA content (polyploidy) that goes with the growth of the cell. The authors also
    describe slight interstitial fibrosis. Key point: the fibres are bigger, not more numerous; cardiac myocytes are
    permanent cells, so the heart gains mass by hypertrophy. Pitfall: compare widths only at the same magnification and
    on fibres cut lengthwise, because an oblique cut makes fibres look wider.
alt:
  it: >-
    Due micrografie affiancate di muscolo cardiaco in ematossilina-eosina, con barra di scala in basso a destra in
    ciascuna. A sinistra, pannello a: fibre rosa sottili e parallele in diagonale, con piccoli nuclei viola allungati. A
    destra, pannello b: fibre rosa più larghe e irregolari con nuclei viola più grandi e tondeggianti e spazi chiari tra
    le fibre.
  en: >-
    Two side-by-side H&E micrographs of heart muscle, each with a scale bar at the bottom right. Left, panel a: slim,
    parallel pink fibres running diagonally, with small elongated purple nuclei. Right, panel b: wider, irregular pink
    fibres with larger, rounder purple nuclei and pale spaces between the fibres.
