lookFor:
  it: "Confronta il testicolo tagliato, dal colore uniforme, con il tessuto epididimario e perilesionale vicino, più irregolare e di colore variabile."
  en: "Compare the cut testis, with its uniform color, with the nearby epididymal and surrounding tissue, which is more irregular and varied in color."
caption:
  it: >-
    Epididimo e testicolo con tubercolosi, preparato macroscopico su fondo blu. Parti dal testicolo sezionato, a destra,
    con la superficie di taglio uniforme e giallo-rosata. Poi guarda il tessuto a sinistra e in basso, che comprende
    l'epididimo: è irregolare, con aree pallide e rosse, e non ha più l'aspetto normale. È il quadro macroscopico
    dell'epididimo-orchite tubercolare, di cui il microscopio mostra i granulomi caseosi.
  en: >-
    Epididymis and testis with tuberculosis, gross specimen on a blue background. Start with the sectioned testis on the
    right, with its uniform yellow-pink cut surface. Then look at the tissue to the left and below, which includes the
    epididymis: it is irregular, with pale and red areas, and no longer looks normal. This is the gross picture of
    tuberculous epididymo-orchitis, whose caseating granulomas the microscope shows.
alt:
  it: >-
    Preparato macroscopico su fondo blu: un testicolo sezionato, con superficie di taglio liscia e giallo-rosata, e
    tessuto epididimario irregolare, pallido e rosso, che si estende verso il basso e a sinistra.
  en: >-
    Gross specimen on a blue background: a sectioned testis with a smooth yellow-pink cut surface, and irregular pale
    and red epididymal tissue extending downward and to the left.
