caption:
  it: >-
    Un autofagosoma colto sul fatto, al microscopio elettronico a trasmissione (rene di topo trattato con
    tunicamicina, una sostanza che provoca stress del reticolo endoplasmatico). Parti dal quadro d'insieme: il fondo
    grigio e granulare è il citoplasma, i corpi scuri e allungati con sottili striature interne sono mitocondri. Poi
    cerca quello al centro, indicato dalla punta di freccia: a differenza dei vicini è chiuso in un sottile anello
    chiaro delimitato da due membrane parallele (freccia). Questo involucro a doppia membrana è il segno distintivo
    dell'autofagosoma: il fagoforo si è richiuso attorno a una porzione di citoplasma, qui un intero mitocondrio con
    un po' di citosol, e la isola per consegnarla al lisosoma. Quando il bersaglio è un mitocondrio si parla di
    mitofagia. Il passo successivo, che qui non si vede, è la fusione con un lisosoma: si forma un autolisosoma, il
    cui contenuto viene digerito, e ciò che non si digerisce può restare come corpo residuo (lipofuscina).
    All'ematossilina-eosina l'autofagia di solito non si riconosce: per dimostrarla servono la microscopia
    elettronica o marcatori come LC3.
  en: >-
    An autophagosome caught in the act, seen by transmission electron microscopy (mouse kidney after tunicamycin, a
    drug that causes endoplasmic reticulum stress). Begin with the overall view: the grey, granular background is
    cytoplasm, and the dark, elongated bodies with fine internal striations are mitochondria. Then find the one in
    the centre, marked by the arrowhead: unlike its neighbours, it sits inside a thin pale ring bounded by two
    parallel membranes (arrow). That double-membrane envelope is the hallmark of an autophagosome: the phagophore has
    closed around a portion of cytoplasm, here a whole mitochondrion with some cytosol, and isolates it for delivery
    to a lysosome. When the cargo is a mitochondrion the process is called mitophagy. The next step, not shown here,
    is fusion with a lysosome to form an autolysosome, whose contents are digested; whatever cannot be digested may
    remain as a residual body (lipofuscin). Autophagy is usually not recognisable on H&E: electron microscopy or
    markers such as LC3 are needed to demonstrate it.
alt:
  it: >-
    Micrografia elettronica in bianco e nero: al centro un grande mitocondrio scuro e allungato è racchiuso da un
    sottile bordo chiaro delimitato da due membrane parallele; una punta di freccia nera a sinistra indica il
    mitocondrio e una freccia nera in basso indica la doppia membrana; intorno, altri mitocondri e piccole vescicole
    nel citoplasma grigio.
  en: >-
    Black-and-white electron micrograph: in the centre a large, dark, elongated mitochondrion is enclosed by a thin
    pale rim bounded by two parallel membranes; a black arrowhead on the left points to the mitochondrion and a black
    arrow at the bottom points to the double membrane; other mitochondria and small vesicles lie in the surrounding
    grey cytoplasm.
