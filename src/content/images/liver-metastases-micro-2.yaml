lookFor:
  it: "Cerca le cellule tumorali in file ghiandolari con lume al centro, nella metà inferiore, e confrontale con il tessuto più chiaro e lasso in alto."
  en: "Find the tumor cells in gland-like rows around lumina, in the lower half, and compare them with the paler, looser tissue at the top."
caption:
  it: >-
    Stesso nodulo, EE a maggior ingrandimento, fotografato attraverso l'oculare (l'immagine è verticale). In alto c'è
    tessuto più chiaro e lasso. Nella metà inferiore le cellule tumorali, più rosa intenso e con nuclei più scuri, si
    dispongono in file attorno a spazi vuoti, a formare strutture ghiandolari, diverse dall'architettura a trabecole
    del fegato.
  en: >-
    Same nodule, H&E at higher power, photographed through the eyepiece (the image is vertical). At the top there is
    paler, looser tissue. In the lower half the tumor cells, a deeper pink with darker nuclei, line up around empty
    spaces to form gland-like structures, unlike the cord architecture of the liver.
alt:
  it: >-
    Campo circolare di un vetrino in ematossilina-eosina su sfondo scuro: in alto tessuto rosa chiaro e lasso, in basso
    cellule più scure disposte in file attorno a spazi vuoti.
  en: >-
    Circular field of an H&E slide on a dark background: pale, loose pink tissue at the top and, below, darker cells
    lined up in rows around empty spaces.
