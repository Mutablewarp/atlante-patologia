stain: H&E
caption:
  it: >-
    Lipofuscina nel miocardio, EE. È la traccia visibile del danno ossidativo cronico: un residuo di lipidi e proteine
    perossidati che i lisosomi non riescono a digerire e che si accumula negli anni nelle cellule che non si dividono,
    come i cardiomiociti e i neuroni. A piccolo ingrandimento guarda l'insieme: fibre cardiache tagliate in senso
    longitudinale, rosse, separate da spazi chiari. Poi avvicinati e segui i nuclei: ai loro poli, in un alone fusiforme
    più chiaro del sarcoplasma, si raccolgono granuli fini di colore bruno-giallastro. Il pigmento non danneggia la
    cellula di per sé e non indica una malattia: aumenta con l'età ed è più evidente quando l'organo si atrofizza
    (atrofia bruna del cuore). Attenzione a non confonderlo con l'emosiderina, che forma granuli più grossolani e si
    colora di blu con il metodo di Perls.
  en: >-
    Lipofuscin in the myocardium, H&E. It is the visible trace of chronic oxidative injury: a residue of peroxidised
    lipids and proteins that lysosomes cannot digest and that builds up over the years in cells that no longer divide,
    such as cardiac myocytes and neurons. At low power, take in the whole field: cardiac fibres cut lengthwise, red,
    separated by clear spaces. Then move closer and follow the nuclei: at their poles, in a paler spindle-shaped zone of
    sarcoplasm, fine yellow-brown granules gather. The pigment does not harm the cell by itself and does not signal
    disease: it increases with age and is more conspicuous when the organ shrinks (brown atrophy of the heart). Do not
    mistake it for haemosiderin, which forms coarser granules and stains blue with Perls' method.
alt:
  it: >-
    Micrografia in ematossilina-eosina di miocardio in un campo circolare su fondo nero: fibre muscolari rosse e striate,
    disposte in fasci paralleli obliqui e separate da spazi chiari; accanto a molti nuclei viola si vedono piccoli aloni
    allungati e chiari pieni di granuli bruni.
  en: >-
    H&E micrograph of myocardium in a circular field on a black background: red, striated muscle fibres arranged in
    parallel oblique bundles and separated by clear spaces; next to many purple nuclei there are small, elongated pale
    zones filled with brown granules.
