lookFor:
  it: >-
    Cerca il collagene colorato di blu: guarda se forma una banda sotto l'epitelio di superficie e quanto è spessa.
  en: >-
    Look for the blue-stained collagen: see whether it forms a band under the surface epithelium and how thick it is.
caption:
  it: >-
    Biopsia di colon in colite collagenosica, colorazione tricromica ad alto ingrandimento. Il collagene è azzurro e il
    resto del tessuto è rosso. Cerca la banda azzurra sotto l'epitelio di superficie, tra le aperture delle ghiandole:
    è il collagene sottoepiteliale ispessito. Tra le ghiandole la lamina propria è fitta di piccole cellule
    infiammatorie.
  en: >-
    Colon biopsy in collagenous colitis, trichrome stain at high power. Collagen is blue and the rest of the tissue is
    red. Look for the blue band under the surface epithelium, between the gland openings: it is the thickened
    subepithelial collagen. Between the glands the lamina propria is crowded with small inflammatory cells.
alt:
  it: >-
    Micrografia ad alto ingrandimento con colorazione tricromica di mucosa colica: strisce azzurre di collagene sotto
    l'epitelio di superficie e ghiandole rosse, con piccole cellule infiammatorie tra le ghiandole.
  en: >-
    High-power trichrome micrograph of colonic mucosa: blue streaks of collagen under the surface epithelium and red
    glands, with small inflammatory cells between the glands.
