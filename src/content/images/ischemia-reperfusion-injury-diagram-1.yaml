caption:
  it: >-
    Il precondizionamento ischemico in laboratorio: pressione del ventricolo sinistro registrata in due esperimenti su
    cuori isolati di ratto perfusi con la tecnica di Langendorff (etichette in inglese: reperfusion significa
    riperfusione). Come si legge: il tempo scorre da sinistra a destra, in ore; ogni battito è un tratto verticale che
    va dalla pressione di riposo alla pressione di picco, per cui un cuore che batte disegna una banda nera compatta, e
    l'altezza della banda indica la forza con cui il ventricolo si contrae. Il riquadro in alto a sinistra dilata 2
    secondi per mostrare i singoli battiti. Traccia A, senza precondizionamento: dopo un inizio normale, a circa 0,1 h
    la banda crolla, perché tutto il cuore viene reso ischemico, e resta piatta per circa 20 minuti. Quando il flusso
    ritorna (circa 0,45 h) i battiti riprendono, ma piccoli, sopra una pressione di riposo che resta alta (circa
    40-70 mmHg invece che vicina allo zero); anche dopo circa 40 minuti di riperfusione restano sotto la metà
    dell'altezza iniziale. Traccia B, con precondizionamento: prima dell'ischemia lunga il cuore riceve tre brevi cicli
    di ischemia e riperfusione, di circa 5 minuti ciascuno. L'ischemia lunga che segue (da circa 0,7 a 1,03 h) dura
    più o meno quanto quella di A, eppure dopo la riperfusione i battiti recuperano gran parte dell'altezza iniziale e
    la pressione di riposo resta bassa. È il precondizionamento ischemico: brevi episodi di ischemia non letali rendono
    il miocardio più resistente a un episodio successivo più lungo. Due avvertenze per l'esame. La registrazione misura
    la funzione, non la morte cellulare: un recupero scarso può dipendere da miociti morti oppure da miociti storditi,
    vivi ma poco contrattili per ore (miocardio stordito), e il tracciato non li distingue. E la traccia A non è un
    argomento contro la riperfusione: senza riperfusione il cuore non batterebbe affatto; il danno da riperfusione è il
    danno in più che si aggiunge nel momento in cui il flusso ritorna.
  en: >-
    Ischemic preconditioning in the laboratory: left ventricular pressure recorded in two experiments on isolated rat
    hearts perfused by the Langendorff technique. How to read it: time runs from left to right, in hours; every
    heartbeat is a vertical stroke from the resting pressure up to the peak pressure, so a beating heart draws a solid
    black band, and the height of the band shows how strongly the ventricle contracts. The inset at the top left
    stretches 2 seconds so that single beats can be seen. Trace A, without preconditioning: after a normal start, the
    band collapses at about 0.1 h, when the whole heart is made ischemic, and stays flat for about 20 minutes. When flow
    returns (about 0.45 h) the beats come back, but small, riding on a resting pressure that stays high (about 40-70
    mmHg instead of near zero); even after some 40 minutes of reperfusion they reach less than half of their starting
    height. Trace B, with preconditioning: before the long ischemia the heart receives three brief cycles of ischemia
    and reperfusion, about 5 minutes each. The long ischemia that follows (from about 0.7 to 1.03 h) lasts roughly as
    long as in A, yet after reperfusion the beats regain most of their starting height and the resting pressure stays
    low. This is ischemic preconditioning: short, non-lethal bouts of ischemia make the myocardium more resistant to a
    later, longer one. Two cautions for the exam. The recording measures function, not cell death: a weak recovery can
    come from dead myocytes or from stunned ones, alive but contracting poorly for hours (stunned myocardium), and the
    trace cannot tell them apart. And trace A is no argument against reperfusion: without reperfusion the heart would
    not beat at all; reperfusion injury is the extra damage added at the moment flow returns.
alt:
  it: >-
    Due tracciati neri di pressione su fondo bianco, con la pressione in mmHg sull'asse verticale e il tempo in ore su
    quello orizzontale. In alto (A): un riquadro con singoli battiti, poi una banda nera alta, un lungo tratto piatto e
    basso e, dopo un sottile picco verticale, una banda più stretta che resta in alto sull'asse della pressione. In
    basso (B): una banda alta interrotta da tre brevi pause, poi un lungo tratto piatto e basso indicato da una freccia
    con la parola ischemia, poi una banda alta indicata dalla parola reperfusion.
  en: >-
    Two black pressure traces on a white background, with pressure in mmHg on the vertical axis and time in hours on
    the horizontal axis. Top (A): an inset of single beats, then a tall black band, a long flat low stretch and, after a
    thin vertical spike, a narrower band that rides high on the pressure axis. Bottom (B): a tall band interrupted by
    three short gaps, then a long flat low stretch marked by an arrow labeled ischemia, then a tall band labeled
    reperfusion.
