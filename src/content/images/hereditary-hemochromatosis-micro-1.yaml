caption:
  it: "Biopsia epatica con colorazione di Perls (blu di Prussia): i granuli blu di ferro si concentrano negli epatociti di un lato del campione, mentre il lato opposto, con numerosi vacuoli di grasso, ne è quasi privo. La barra indica 500 µm."
  en: "Liver biopsy with a Perls (Prussian blue) stain: blue iron granules are concentrated in the hepatocytes on one side of the specimen, while the opposite side, with many fat vacuoles, has almost none. The bar is 500 µm."
alt:
  it: "Frammento di tessuto epatico a basso ingrandimento: a sinistra granuli blu scuro nel citoplasma degli epatociti su fondo rosa, a destra molti vacuoli chiari rotondi quasi senza colore blu."
  en: "Low-power liver tissue fragment: on the left, dark blue granules in hepatocyte cytoplasm on a pink background; on the right, many round clear vacuoles with almost no blue."
