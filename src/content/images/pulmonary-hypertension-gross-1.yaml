caption:
  it: >-
    Cuore aperto in un caso di cuore polmonare, preparato fissato su fondo blu. Guarda le cavità aperte con le trabecole
    carnee e le corde tendinee, e confronta lo spessore della parete libera del ventricolo destro con quello del setto
    e del ventricolo sinistro: nel cuore polmonare la parete destra è ispessita (ipertrofia del ventricolo destro).
  en: >-
    Opened heart from a case of cor pulmonale, fixed specimen on a blue background. Look at the opened chambers with
    their trabeculae and tendinous cords, and compare the thickness of the right ventricular free wall with that of the
    septum and the left ventricle: in cor pulmonale the right wall is thickened (right ventricular hypertrophy).
alt:
  it: >-
    Fotografia di un cuore sezionato su fondo blu: cavità aperte con trabecole e corde tendinee rosa, valvole in alto e
    miocardio rosso-bruno ai bordi.
  en: >-
    Photograph of a sectioned heart on a blue background: opened chambers with pink trabeculae and tendinous cords,
    valves at the top and red-brown myocardium at the edges.
