orientation:
  it: "Fetta coronale di un cervello fissato, in un contenitore da museo; l'ascesso è nell'emisfero a destra nella foto, in alto."
  en: "Coronal slice of a fixed brain in a museum jar; the abscess is in the hemisphere on the right of the photograph, near the top."
lookFor:
  it: "Segui il contorno dell'ascesso: una parete liscia, chiara e netta separa il contenuto della cavità dal cervello intorno."
  en: "Trace the outline of the abscess: a smooth, pale, sharp wall separates the contents of the cavity from the brain around it."
caption:
  it: >-
    Ascesso cerebrale del lobo parietale, fetta coronale di un cervello fissato e conservato in un contenitore da museo
    (le etichette stampate in francese riportano il numero di catalogo e la diagnosi, «ascesso del lobo parietale»).
    Trova la lesione rotonda in alto a destra nella fetta, subito sotto la corteccia. La chiave è la parete: una fascia
    liscia e chiara, di spessore uniforme, nettamente separata dal cervello intorno. È la capsula fibrosa, che si forma
    nell'arco di giorni o settimane mentre i fibroblasti circoscrivono l'infezione. Dentro c'è la cavità, con un
    contenuto più chiaro: il tessuto cerebrale che c'era è stato colliquato dagli enzimi dei neutrofili e sostituito
    dal pus. Confrontala con il resto della fetta, dove la corteccia grigia e la sostanza bianca conservano il loro
    aspetto normale. Questa forma rotonda, con una parete regolare, è ciò che alla RM con mezzo di contrasto appare
    come un anello liscio di spessore uniforme. Non farti distrarre dalla chiazza bruno-nerastra più in basso, nella
    sostanza grigia profonda (talamo) dello stesso lato: sembra sangue, la scheda d'archivio non la spiega e non fa
    parte dell'ascesso. Le micrografie di ascesso cerebrale di questa scheda mostrano lo stesso tipo di parete al
    microscopio, in un altro caso.
  en: >-
    Brain abscess in the parietal lobe, coronal slice of a fixed brain kept in a museum jar (the printed French labels
    give the catalogue number and the diagnosis, "abscess in the parietal lobe"). Find the round lesion at the top
    right of the slice, just beneath the cortex. Its wall is the key: a smooth, pale band of even thickness, sharply
    set off from the brain around it. This is the fibrous capsule, which forms over days to weeks as fibroblasts wall
    off the infection. Inside lies the cavity, with paler contents: the brain tissue that was there has been
    liquefied by the enzymes of neutrophils and replaced by pus. Compare it with the rest of the slice, where the grey
    cortex and the white matter keep their normal pattern. This round shape with an even wall is what contrast MRI
    shows as a smooth ring of even thickness. Do not be distracted by the dark brown-black patch lower down, in
    the deep grey matter (thalamus) of the same side: it looks like blood, the archive record does not explain it, and
    it is not part of the abscess. The brain-abscess micrographs on this card show the same kind of wall under the
    microscope, in another case.
alt:
  it: >-
    Fotografia a colori di una fetta coronale di cervello fissato, di colore beige-giallastro, in un contenitore da
    museo, con due etichette stampate in francese: «826 CERVEAU» in alto a sinistra e «ABCES AU LOBE PARIETAL» in
    basso a sinistra. In alto a destra nella fetta una lesione rotonda con una parete liscia e chiara a doppio
    contorno e un contenuto chiaro; più in basso, vicino alla linea mediana, una chiazza irregolare bruno-nerastra.
  en: >-
    Colour photograph of a coronal slice of a fixed brain, beige-yellow, in a museum jar, with two printed French
    labels: "826 CERVEAU" at the top left and "ABCES AU LOBE PARIETAL" at the bottom left. At the top right of the
    slice, a round lesion with a smooth, pale, double-contoured wall and pale contents; lower down, near the midline,
    an irregular dark brown-black patch.
