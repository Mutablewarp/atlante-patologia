caption:
  it: >-
    Lo stesso studio a ingrandimento maggiore (20000× come stampato sulla micrografia), su un'altra biopsia renale
    umana. Trova la punta di freccia al centro: indica un piccolo sacco rotondo con un doppio contorno e un contenuto più
    denso, che si trova dentro un pedicello, uno dei sottili prolungamenti con cui il podocita avvolge dall'esterno i
    capillari glomerulari. Gli autori hanno contato strutture come questa come autofagosomi, cioè vescicole che
    racchiudono citoplasma non ancora digerito, e contarle era uno dei due modi con cui lo studio misurava l'attività
    autofagica (l'altro era l'immunoistochimica per LC3). Il doppio involucro di membrana è il segno distintivo dell'autofagosoma; a questa risoluzione si vede solo
    come un doppio contorno. Confronta con la vista a ingrandimento minore della serie: il sacco è minuscolo rispetto
    alla cellula, per cui nelle biopsie umane gli autofagosomi vanno cercati ad alto ingrandimento e non si vedono al
    microscopio ottico di routine.
  en: >-
    The same study at higher magnification (20000× printed on the micrograph), from another human renal biopsy. Find
    the arrowhead in the centre: it points to a small round sac with a double outline and denser contents, lying inside
    a foot process (pedicel), one of the slender extensions with which the podocyte wraps the outside of the glomerular
    capillaries. The authors counted structures like this one as autophagosomes, that is, vesicles that enclose
    cytoplasm not yet digested, and counting them was one of the study's two measures of autophagic activity (the
    other was immunostaining for LC3). A double
    membrane envelope is the hallmark of an autophagosome; at this resolution it shows only as a double outline. Compare
    with the lower-magnification view in this set: the sac is tiny compared with the cell, so in human biopsies
    autophagosomes have to be searched for at high magnification and are not seen on routine light microscopy.
alt:
  it: >-
    Micrografia elettronica in bianco e nero ad alto ingrandimento. Un'ampia fascia grigia di citoplasma attraversa
    l'immagine in diagonale dal basso a sinistra all'alto a destra, con una sottile membrana ondulata lungo il lato
    superiore; sopra di essa lo sfondo è chiaro. Sotto la fascia, prolungamenti grigi digitiformi stanno in uno spazio
    chiaro. Al centro una punta di freccia nera indica, dentro uno di questi prolungamenti, un piccolo sacco rotondo a
    doppio contorno con il centro più scuro. In basso una striscia di dati riporta Mag 20000 x, HV 50 kV e una barra di
    scala di 2 µm; il codice del campione è coperto.
  en: >-
    Black-and-white electron micrograph at high magnification. A broad grey band of cytoplasm runs diagonally from lower
    left to upper right, with a thin wavy membrane along its upper side; above it the background is pale. Below the
    band, grey finger-like processes lie in a pale space. In the centre a black arrowhead points to a small round sac
    with a double outline and a darker centre inside one of these processes. At the bottom a data strip reads Mag 20000
    x, HV 50 kV, with a 2 µm scale bar; the specimen code is blanked out.
