lookFor:
  it: "Segui le bande che si alternano: rosse (ricche di eritrociti) e rosa pallide (piastrine e fibrina)."
  en: "Follow the alternating bands: red (rich in erythrocytes) and pale pink (platelets and fibrin)."
caption:
  it: >-
    Tromboembolo polmonare recente a basso ingrandimento. Guarda prima il quadro d'insieme: una massa che riempie un
    vaso, con la parete a destra e in basso. Poi segui le bande che si alternano: quelle rosse sono ricche di
    eritrociti, quelle rosa pallide sono fatte di piastrine e fibrina. Questa alternanza sono le linee di Zahn, il
    segno che il coagulo si è formato in un vaso con sangue in movimento.
  en: >-
    Recent pulmonary thromboembolus at low power. First take in the whole picture: a mass filling a vessel, with the
    wall at the right and bottom. Then follow the alternating bands: the red ones are rich in erythrocytes, the pale
    pink ones are made of platelets and fibrin. This alternation is the lines of Zahn, the sign that the clot formed in
    a vessel with flowing blood.
alt:
  it: >-
    Micrografia a basso ingrandimento di un tromboembolo: una massa rosa con ampie zone rosso intenso e bande più pallide
    e granulari disposte in strati alternati, circondata sul lato destro e in basso dalla parete del vaso.
  en: >-
    Low-power micrograph of a thromboembolus: a pink mass with broad deep-red areas and paler granular bands arranged
    in alternating layers, bordered at the right and bottom by the vessel wall.
