lookFor:
  it: "Individua prima il linfonodo ricco di linfociti, poi cerca gli ammassi di ghiandole che non dovrebbero trovarsi lì."
  en: "Find the lymphocyte-rich node first, then look for gland-forming clusters that do not belong there."
caption:
  it: >-
    Linfonodo con metastasi di carcinoma del colon-retto, EE a basso ingrandimento. Riconosci prima il linfonodo: una
    massa viola scuro di linfociti, con la capsula e il tessuto adiposo rosa-chiaro a destra. Al centro, dove ci
    aspetteremmo solo linfociti, ci sono strutture ghiandolari irregolari con lume, circondate da stroma rosato: sono le
    cellule del tumore primitivo arrivate fin qui per via linfatica. Il passo successivo è l'alto ingrandimento, per
    vedere i nuclei.
  en: >-
    Lymph node with metastatic colorectal carcinoma, H&E at low power. Recognize the node first: a dark purple mass of
    lymphocytes, with the capsule and pale pink fat at the right. In the center, where only lymphocytes should be, there
    are irregular gland-forming structures with lumens, surrounded by pink stroma: these are cells of the primary tumor
    that arrived here through the lymphatics. The next step is the high-power view, to see the nuclei.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: un linfonodo denso di piccole cellule viola scuro, con al
    centro gruppi di ghiandole irregolari rosa-violacee e, in basso a destra, tessuto adiposo con capsula.
  en: >-
    Low-power H&E micrograph: a lymph node dense with small dark purple cells, with clusters of irregular pink-purple
    glands in its center and fat with a capsule at the lower right.
