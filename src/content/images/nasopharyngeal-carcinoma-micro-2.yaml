lookFor:
  it: Guarda i nuclei vescicolosi e il nucleolo evidente, poi i confini cellulari poco netti e i linfociti piccoli e scuri tra le cellule tumorali.
  en: Look at the vesicular nuclei and the conspicuous nucleoli, then the ill-defined cell borders and the small dark lymphocytes among the tumor cells.
caption:
  it: >-
    Carcinoma nasofaringeo, EE ad alto ingrandimento. Le cellule tumorali sono grandi, con nuclei rotondi od ovali
    chiari (vescicolosi), e nucleoli ben visibili. I confini cellulari sono poco definiti, per cui le cellule
    sembrano formare un unico strato continuo. Tra le cellule tumorali si vedono piccoli linfociti dal nucleo scuro e
    rotondo. Sono presenti anche rari nuclei molto scuri e picnotici. Nell'insieme il quadro è quello di un carcinoma
    indifferenziato.
  en: >-
    Nasopharyngeal carcinoma, H&E at high power. The tumor cells are large, with round to oval pale (vesicular)
    nuclei and clearly visible nucleoli. Cell borders are poorly defined, so the cells seem to form one continuous
    layer. Small lymphocytes with dark round nuclei lie among the tumor cells. A few very dark, pyknotic nuclei are also
    present. Overall the picture is that of an undifferentiated carcinoma.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: cellule grandi con nuclei chiari e nucleoli evidenti,
    confini cellulari sfumati, piccoli linfociti scuri sparsi e alcune bande rosa di stroma.
  en: >-
    High-power H&E micrograph: large cells with pale nuclei and prominent nucleoli, blurred cell borders, scattered
    small dark lymphocytes and a few pink bands of stroma.
