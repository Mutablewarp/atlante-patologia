caption:
  it: >-
    Mezze sezioni coronali di un encefalo sano (a sinistra) e di un encefalo con malattia di Alzheimer grave (a
    destra), accostate per il confronto (composizione ritoccata diffusa dal National Institute on Aging statunitense).
    È il quadro macroscopico classico dell'atrofia di un intero organo per perdita di cellule. Confronta le due metà
    dall'esterno verso l'interno: nell'encefalo malato i giri sono sottili e i solchi beanti, il nastro corticale è
    assottigliato e la sostanza bianca è ridotta. Poi guarda le cavità: il ventricolo laterale e il suo corno
    temporale sono dilatati e occupano lo spazio lasciato dal tessuto perso (idrocefalo ex vacuo), mentre l'ippocampo,
    nella parte mediale del lobo temporale, è rimpicciolito. Nelle malattie neurodegenerative l'encefalo si riduce
    soprattutto perché i neuroni muoiono e non vengono sostituiti, non solo perché le singole cellule si rimpiccioliscono;
    con il normale invecchiamento si osserva una riduzione più lieve e diffusa. Attenzione: i ventricoli dilatati da
    soli non bastano a dire atrofia; anche l'idrocefalo ostruttivo li dilata, ma lì i giri sono appiattiti e i solchi
    compressi anziché allargati.
  en: >-
    Coronal half-slices of a healthy brain (left) and of a brain with severe Alzheimer disease (right), placed side by
    side for comparison (retouched composite released by the US National Institute on Aging). This is the classic gross
    picture of atrophy of a whole organ through cell loss. Compare the two halves from the outside in: in the diseased
    brain the gyri are thin and the sulci gape, the cortical ribbon is thinned and the white matter is reduced. Then
    look at the cavities: the lateral ventricle and its temporal horn are enlarged and fill the space left by the lost
    tissue (hydrocephalus ex vacuo), while the hippocampus, in the medial temporal lobe, has shrunk. In
    neurodegenerative disease the brain becomes smaller mainly because neurons die and are not replaced, not only
    because single cells shrink; normal ageing brings a milder, diffuse shrinkage. Pitfall: enlarged ventricles alone
    do not prove atrophy; obstructive hydrocephalus also enlarges them, but there the gyri are flattened and the sulci
    compressed rather than widened.
alt:
  it: >-
    Due mezze sezioni coronali di encefalo accostate su fondo bianco: a sinistra un emisfero rosato con giri pieni,
    solchi stretti e ventricolo a fessura; a destra un emisfero più piccolo e pallido, con giri sottili separati da
    solchi larghi e cavità ventricolari scure e dilatate al centro e in basso.
  en: >-
    Two coronal half-slices of brain side by side on a white background: on the left a pinkish hemisphere with plump
    gyri, narrow sulci and a slit-like ventricle; on the right a smaller, paler hemisphere with thin gyri separated by
    wide sulci and dark, enlarged ventricular cavities in the centre and lower part.
