lookFor:
  it: "Confronta le aree nocciola pallido con il polmone più scuro attorno, senza farti distrarre dagli anelli bianchi."
  en: "Compare the pale tan areas with the darker lung around them, and do not let the white rings distract you."
caption:
  it: >-
    Calcificazione metastatica del polmone: particolare della superficie di taglio, con ogni probabilità all'autopsia (la
    fonte non lo dice; nella foto non c'è una scala). Prima orientati: tutto il campo è polmone, e i piccoli anelli e
    le fessure bianche sparsi qua e là sono vie aeree e vasi sezionati di traverso. Poi confronta i colori. Al centro e in alto a destra ci sono aree irregolari, a
    carta geografica, di colore nocciola pallido e dall'aspetto finemente poroso, mentre il polmone attorno è bruno più
    scuro; secondo la fonte le aree nocciola pallido sono la calcificazione metastatica. Al taglio un polmone così può
    risultare granuloso, perché il minerale irrigidisce le pareti alveolari (vedi le micrografie di questa scheda).
    Perché «metastatica»: il calcio precipita in un polmone che prima non era danneggiato, a causa di un eccesso
    sistemico di calcio o di fosfato, per esempio nell'insufficienza renale cronica o nell'iperparatiroidismo primario; la fonte
    non indica la causa in questo paziente. Attenzione: a occhio nudo il quadro è sfumato, facile da non vedere o da
    scambiare per un comune addensamento; la conferma viene dal microscopio, dove le pareti alveolari mostrano depositi
    viola scuro in EE che diventano neri con la von Kossa.
  en: >-
    Metastatic calcification of the lung: close-up of a cut surface, most likely at autopsy (the source does not say;
    there is no scale in the photograph).
    Orient yourself first: the whole field is lung, and the small white rings and slits scattered across it are airways
    and vessels cut across. Then compare the colours. Irregular, map-like areas in the centre and at the upper right are
    pale tan and finely porous, while the lung around them is darker brown; according to the source, the pale tan areas
    are the metastatic calcification. Lung like this can feel gritty under the knife, because mineral now stiffens the
    alveolar walls (see the micrographs of this card). Why "metastatic": calcium precipitates in lung that was not
    damaged beforehand, driven by a systemic excess of calcium or phosphate, for example in chronic kidney disease or
    primary hyperparathyroidism; the source does not give the cause in this patient. Pitfall: to the naked eye the
    change is subtle, easily overlooked or taken for an ordinary consolidation; it is proven under the microscope, where
    the alveolar walls carry dark purple deposits on H&E that turn black with von Kossa.
alt:
  it: >-
    Fotografia ravvicinata, su fondo blu, della superficie di taglio di un polmone: aree irregolari color nocciola
    pallido, finemente porose, al centro e in alto a destra, circondate da tessuto bruno più scuro, con molti piccoli
    anelli e fessure bianchi; pieghe di pleura ai margini.
  en: >-
    Close-up photograph, on a blue background, of the cut surface of a lung: irregular pale tan, finely porous areas in
    the centre and at the upper right, surrounded by darker brown tissue, with many small white rings and slits; folds
    of pleura at the edges.
