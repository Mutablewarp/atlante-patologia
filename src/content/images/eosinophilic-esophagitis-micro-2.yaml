lookFor:
  it: "Cerca le cellule con nucleo bilobato e citoplasma rosso-arancio tra le cellule squamose, soprattutto vicino alla superficie."
  en: "Look for cells with a bilobed nucleus and red-orange cytoplasm among the squamous cells, especially near the surface."
caption:
  it: >-
    Stessa biopsia di esofagite eosinofila, EE ad alto ingrandimento. Guarda tra le cellule squamose: sono sparsi molti
    eosinofili, con nucleo bilobato e citoplasma rosso-arancio, e vicino alla superficie formano gruppi fitti. Gli
    spazi chiari tra le cellule indicano edema intercellulare. In basso i cerchi rossi sono le papille congeste.
  en: >-
    Same biopsy of eosinophilic esophagitis, H&E at high power. Look among the squamous cells: many eosinophils are
    scattered there, with a bilobed nucleus and red-orange cytoplasm, and near the surface they form dense groups. The
    clear spaces between cells point to intercellular edema. At the bottom the red circles are the congested papillae.
alt:
  it: >-
    Micrografia ad alto ingrandimento, in ematossilina-eosina, di epitelio pavimentoso stratificato esofageo: cellule
    squamose con nucleo tondo, numerosi piccoli eosinofili rosso-arancio sparsi tra di esse e in gruppi vicino al
    bordo superiore, papille rosso vivo in basso.
  en: >-
    High-power H&E micrograph of esophageal stratified squamous epithelium: squamous cells with round nuclei, many
    small red-orange eosinophils scattered among them and in clusters near the upper edge, bright red papillae at the
    bottom.
