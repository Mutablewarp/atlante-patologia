caption:
  it: >-
    Tre valvole aortiche stenotiche asportate in chirurgia, viste dal versante aortico, ciascuna sopra un righello di
    riferimento. Sono tutte calcificate, ma la sede del calcio orienta verso la causa. Parti da C, la forma
    degenerativa legata all'età: le tre cuspidi sono mostrate separate e in questa forma le commissure di solito non
    sono fuse. Noduli calcifici irregolari, giallo-brunastri, si addensano alla base di ogni cuspide, mentre la
    porzione verso il margine libero è molto meno colpita e in parte traslucida. I noduli irrigidiscono la cuspide
    proprio alla cerniera, così la valvola non riesce più ad aprirsi del tutto. Confronta poi A, una valvola
    post-infiammatoria (reumatica): cuspidi spesse, commissure fuse (asterischi, dove gli autori segnalano anche
    noduli calcifici) e un orifizio piccolo, triangolare e rigido. In B, una valvola bicuspide congenita, il calcio
    segue il rafe, la cresta rimasta dove due cuspidi non si sono separate (punte di freccia nere), e altrove forma
    noduli voluminosi con marcato ispessimento fibroso (punte di freccia rosse). Perché distrofica? Il calcio si
    deposita in un tessuto valvolare danneggiato e non richiede una calcemia elevata; nella valvola il processo è
    anche attivo, perché le cellule interstiziali assumono un comportamento simil-osteoblastico. È l'esempio classico
    di calcificazione distrofica che causa malattia: la stenosi aortica calcifica.
  en: >-
    Three stenotic aortic valves removed at surgery, seen from the aortic side, each above a ruler for scale. All
    three are calcified, yet where the calcium sits points to the cause. Start with C, the age-related (degenerative)
    form: the three cusps are shown apart, and in this form the commissures are usually not fused. Irregular
    tan-brown calcified nodules crowd the base of each cusp, while the part towards the free edge is much less
    affected and partly translucent. Nodules at the hinge stiffen the cusp, so the valve can no longer open fully.
    Then compare A, a post-inflammatory (rheumatic) valve: thick cusps, fused commissures (asterisks, where the
    authors also mark calcified nodules) and a small, rigid, triangular opening. In B, a congenitally bicuspid valve,
    calcium follows the raphe, the ridge left where two cusps failed to separate (black arrowheads), and elsewhere
    builds bulky nodules with marked fibrous thickening (red arrowheads). Why dystrophic? The calcium settles in
    damaged valve tissue and does not need high blood calcium; in the valve the process is also active, because the
    interstitial cells take on an osteoblast-like behaviour. This is the classic case of dystrophic calcification that
    causes disease: calcific aortic stenosis.
alt:
  it: >-
    Tre fotografie affiancate su fondo verde, ciascuna sopra un righello. A: una valvola aortica intera che forma un
    anello spesso, bianco-giallastro, attorno a una piccola apertura triangolare, con un asterisco su ciascuna delle
    tre giunzioni tra le cuspidi. B: una valvola pallida e ispessita con due cuspidi, tre punte di freccia nere lungo
    una cresta della cuspide inferiore e tre punte di freccia rosse all'estremità destra della cuspide superiore,
    accanto a un'area grigio-brunastra. C: tre cuspidi separate, ciascuna con noduli irregolari giallo-bruni lungo un
    margine e tessuto più chiaro e sottile nel resto.
  en: >-
    Three photographs side by side on a green background, each above a ruler. A: a whole aortic valve forming a
    thick, yellowish-white ring around a small triangular opening, with an asterisk at each of the three junctions
    between cusps. B: a pale, thickened valve with two cusps, three black arrowheads along a ridge on the lower cusp
    and three red arrowheads at the right end of the upper cusp, beside a grey-brown area. C: three separate cusps,
    each with irregular tan-brown lumps along one edge and paler, thinner tissue elsewhere.
