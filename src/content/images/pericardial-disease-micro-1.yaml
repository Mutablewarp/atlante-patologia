lookFor:
  it: >-
    Parti dalla superficie libera in alto e scendi verso il tessuto adiposo: cerca l'essudato rosa e i leucociti, poi
    i vasi dilatati e pieni di sangue.
  en: >-
    Start at the free surface at the top and move down towards the fat: look for the pink exudate and the leukocytes,
    then the dilated, blood-filled vessels.
caption:
  it: >-
    Pericardite acuta, EE a medio ingrandimento. Parti dalla superficie libera in alto: uno strato di materiale rosa
    con filamenti, globuli rossi e cellule infiammatorie si stacca dal tessuto sottostante, ed è l'essudato di
    superficie. Sotto, il connettivo sottomesotelico è infiltrato da cellule infiammatorie con nuclei scuri. Più in
    basso i vasi sono dilatati e pieni di globuli rossi (congestione), con leucociti lungo le pareti, e il tessuto
    adiposo ha un aspetto ancora ordinato, senza una cicatrice fibrosa. Questo quadro è tipico di un processo acuto,
    non di una pericardite costrittiva.
  en: >-
    Acute pericarditis, H&E at medium power. Start at the free surface at the top: a layer of pink material with
    strands, red cells and inflammatory cells lies loosely over the tissue below, and this is the surface exudate.
    Beneath it, the subsurface connective tissue is infiltrated by inflammatory cells with dark nuclei. Further down
    the vessels are dilated and packed with red cells (congestion), with leukocytes along their walls, and the fat
    still looks orderly, with no fibrous scar. This picture is typical of an acute process, not of constrictive
    pericarditis.
alt:
  it: >-
    Micrografia in ematossilina-eosina: in alto uno strato rosa di essudato con globuli rossi e cellule infiammatorie;
    sotto, connettivo infiltrato da piccole cellule scure, vasi dilatati pieni di sangue rosso e, in basso, tessuto
    adiposo con grandi spazi vuoti.
  en: >-
    H&E micrograph: at the top a pink layer of exudate with red cells and inflammatory cells; beneath it, connective
    tissue infiltrated by small dark cells, dilated vessels full of red blood, and, at the bottom, fat with large empty
    spaces.
