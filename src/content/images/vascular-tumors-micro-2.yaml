lookFor:
  it: "Segui i fasci di cellule fusate e nota i globuli rossi extravasati tra di loro."
  en: "Follow the bundles of spindle cells and note the extravasated red blood cells between them."
caption:
  it: >-
    Sarcoma di Kaposi, EE a medio ingrandimento. Segui prima i fasci intrecciati di cellule fusate, dai nuclei
    allungati e violacei, che riempiono il campo. Tra i fasci osserva i numerosi globuli rossi, di un rosso vivo:
    stanno in fessure vascolari irregolari o fuori dai vasi. A differenza dell'emangioma, qui prevalgono le cellule
    fusate, non i canali ben formati.
  en: >-
    Kaposi sarcoma, H&E at medium power. Follow first the interlacing bundles of spindle cells, with elongated purple
    nuclei, that fill the field. Between the bundles look at the many bright red blood cells: they lie in irregular
    vascular slits or outside vessels. Unlike a hemangioma, spindle cells dominate here, not
    well-formed channels.
alt:
  it: >-
    Micrografia in ematossilina-eosina: fasci intrecciati di cellule fusate violacee, con molti globuli rossi rossi
    sparsi tra i fasci.
  en: >-
    H&E micrograph: interlacing bundles of purple spindle cells with many bright red blood cells scattered between
    the bundles.
