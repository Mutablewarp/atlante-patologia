lookFor:
  it: "Cerca nel setto i dotti biliari e le cellule infiammatorie, poi guarda gli epatociti dei noduli ai lati."
  en: "Look in the septum for bile ducts and inflammatory cells, then at the hepatocytes of the nodules on either side."
caption:
  it: >-
    Iperplasia nodulare focale, EE a ingrandimento intermedio, stessa lesione della vista a basso ingrandimento. Il
    setto fibroso al centro contiene piccoli dotti biliari e cellule infiammatorie; ai lati gli epatociti formano
    noduli.
  en: >-
    Focal nodular hyperplasia, H&E at medium power, the same lesion as the low-power view. The fibrous septum in the
    center contains small bile ducts and inflammatory cells; on either side the hepatocytes form nodules.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina a medio ingrandimento: un setto fibroso violaceo con piccoli dotti e
    cellule infiammatorie attraversa il campo, tra aree rosa di epatociti.
  en: >-
    Medium-power H&E micrograph of liver: a purple fibrous septum with small ducts and inflammatory cells crosses the
    field between pink areas of hepatocytes.
