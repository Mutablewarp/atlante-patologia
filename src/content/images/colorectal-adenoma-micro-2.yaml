lookFor:
  it: "Segui i nuclei: perdono l'ordine in file parallele e diventano più rotondi e disordinati."
  en: "Follow the nuclei: they lose their orderly parallel rows and become rounder and haphazard."
caption:
  it: >-
    Adenoma tubulo-villoso con displasia di alto grado, EE ad alto ingrandimento. Guarda i bordi liberi: le frange sono
    rivestite da un epitelio spesso, con molti strati di nuclei. Dove i nuclei restano allungati e paralleli, come
    nella displasia di basso grado, l'ordine è conservato. Dove perdono la polarità, diventano più tondi e disposti
    in modo disordinato. Questa perdita di polarità è il segno principale dell'alto grado.
  en: >-
    Tubulovillous adenoma with high-grade dysplasia, H&E at high power. Look at the free edges: the fronds are lined
    by thick epithelium with many layers of nuclei. Where the nuclei stay elongated and parallel, as in low-grade
    dysplasia, order is kept. Where they lose polarity, they become rounder and arranged haphazardly. This loss of
    polarity is the main sign of high grade.
alt:
  it: >-
    Micrografia in ematossilina-eosina ad alto ingrandimento: frange rivestite da epitelio violaceo spesso, con nuclei
    affollati su più strati, e spazi vuoti bianchi tra le frange; in basso un po' di connettivo rosa con rari
    leucociti.
  en: >-
    High-power H&E micrograph: fronds lined by thick purple epithelium with nuclei crowded in several layers, and
    white empty spaces between the fronds; a little pink connective tissue with scattered leukocytes at the bottom.
