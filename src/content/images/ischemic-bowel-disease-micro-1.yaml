lookFor:
  it: >-
    Parti dalla forma d'insieme dei frammenti di mucosa, poi osserva le ghiandole: dimensioni e forma variano e la
    lamina propria tra di esse è occupata da un tessuto rosa-violaceo, non da ghiandole ben ordinate.
  en: >-
    Start from the overall shape of the mucosal fragments, then study the glands: their size and shape vary, and the
    lamina propria between them is filled with pink-purple tissue instead of tidy, evenly spaced glands.
caption:
  it: >-
    Biopsia di colon in colite ischemica, EE a basso ingrandimento. Osserva due frammenti di mucosa con ghiandole
    irregolari per calibro e forma, immerse in una lamina propria ricca di cellule. Qui si valuta il quadro d'insieme;
    i dettagli dell'epitelio e dello stroma si vedono nella vista a ingrandimento maggiore dello stesso caso.
  en: >-
    Colon biopsy in ischemic colitis, H&E at low power. Note two fragments of mucosa with glands of uneven caliber and
    shape, set in a cell-rich lamina propria. This view is for the overall pattern; the epithelium and stroma are seen
    in the higher-power view of the same case.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: due frammenti di mucosa colica rosa-violacei con ghiandole
    allungate e irregolari, su fondo bianco, con un sottile strato rosa lungo il margine superiore.
  en: >-
    Low-power H&E micrograph: two pink-purple fragments of colonic mucosa with elongated, irregular glands on a white
    background, with a thin pink layer along the upper edge.
