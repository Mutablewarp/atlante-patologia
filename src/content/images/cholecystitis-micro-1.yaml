lookFor:
  it: Segui il profilo delle pieghe mucose rivestite da epitelio alto e guarda quanto è cellulare il connettivo che le separa.
  en: Follow the outline of the mucosal folds lined by tall epithelium and note how cellular the connective tissue between them is.
caption:
  it: >-
    Parete della colecisti, EE a basso ingrandimento (campo circolare del microscopio; l'autore la indica come colecistite acuta). Parti dal profilo delle pieghe mucose,
    rivestite da un epitelio colonnare, e dai lumi che si incontrano fra di esse. Poi osserva il tessuto che le separa:
    è più denso e più viola di un normale connettivo, perché ricco di piccole cellule. Il campo mostra l'architettura, non
    il dettaglio delle singole cellule infiammatorie, che servono a più forte ingrandimento.
  en: >-
    Gallbladder wall, H&E at low power (circular microscope field; the author labels it acute cholecystitis). Start with the outline of the mucosal folds,
    lined by a columnar epithelium, and the lumens between them. Then look at the tissue that separates the folds: it is
    denser and more purple than plain connective tissue because it is rich in small cells. The field shows the
    architecture, not the detail of single inflammatory cells, which needs higher power.
alt:
  it: >-
    Micrografia in ematossilina-eosina, campo rotondo: numerose pieghe ramificate rivestite da un epitelio rosa-viola alto,
    con spazi chiari tra le pieghe e un connettivo più denso e violaceo intorno; a destra un'ampia area chiara quasi vuota.
  en: >-
    H&E micrograph in a round field: many branching folds lined by tall pink-purple epithelium, with clear spaces between
    the folds and denser, purplish connective tissue around them; on the right a broad pale, almost empty area.
