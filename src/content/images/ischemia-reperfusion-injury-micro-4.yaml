caption:
  it: >-
    Stessa serie a forte ingrandimento (400x secondo la fonte): qui le bande di contrazione si leggono bene. Le fibre
    ora sono inclinate dall'alto a sinistra verso il basso a destra. Guarda prima l'area segnata a sinistra del centro:
    la fibra è attraversata da alcune barre dense, rosa acceso, in parte a zigzag, separate da citoplasma più pallido e
    finemente granuloso. Ogni barra è un ammasso di sarcomeri ipercontratti; la normale striatura, fine e a intervalli
    regolari, è scomparsa. Barre simili e tratti di un rosa intenso e omogeneo si ripetono in tutto il campo: il danno
    coinvolge un'intera area di miociti, non una singola cellula. Poi controlla i nuclei: quasi nessuna fibra ne ha
    uno (cariolisi), segno che questi miociti sono morti. Più in basso e a destra delle bande, una fila di fini granuli
    bruno-dorati corrisponde alla lipofuscina, il pigmento da usura che di norma si raccoglie ai poli del nucleo; qui
    accanto non si vede alcun nucleo. Infine, gli spazi tra le fibre sono allargati da liquido di edema pallido e
    contengono cellule infiammatorie rotonde e scure, che la fonte identifica come monociti. Ricorda il significato:
    una necrosi a bande di contrazione estesa è il segno istologico tipico dell'infarto riperfuso, ma da sola dimostra
    soltanto un ingresso massivo di calcio, che può essere causato anche da un eccesso di catecolamine.
  en: >-
    Same series at high power (400x according to the source): here the contraction bands are easy to read. The fibers
    now slant from the upper left to the lower right. Look first at the marked area left of center: the fiber is
    crossed by a few dense, bright pink bars, some of them zigzag, separated by paler, finely granular cytoplasm. Each
    bar is a clump of hypercontracted sarcomeres; the normal striation, fine and evenly spaced, is gone. Similar bars
    and smooth, deep pink segments recur all over the field: the damage involves a whole area of myocytes, not a single
    cell. Then check the nuclei: almost none of the fibers has one (karyolysis), a sign that these myocytes are dead.
    Below and to the right of the bands, a line of fine golden-brown granules is lipofuscin, the wear-and-tear pigment
    that normally collects at the poles of the nucleus; no nucleus is visible beside it here. Finally, the spaces
    between the fibers are widened by pale edema fluid and hold round, dark inflammatory cells, which the source
    identifies as monocytes. Remember what it means: extensive contraction band necrosis is the typical microscopic
    sign of a reperfused infarct, but on its own it proves only a massive entry of calcium, which catecholamine excess
    can also cause.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento di muscolo cardiaco: fibre rosa inclinate dall'alto a
    sinistra verso il basso a destra; al loro interno barre dense, rosa acceso, in parte a zigzag, si alternano a tratti
    più pallidi e granulosi; quasi nessun nucleo nelle fibre; in una fibra una fila di fini granuli bruno-dorati; ampi
    spazi bianchi tra le fibre contengono piccole cellule rotonde viola scuro, raccolte soprattutto a sinistra del
    centro.
  en: >-
    High-power H&E micrograph of heart muscle: pink fibers slant from the upper left to the lower right; inside them,
    dense bright pink bars, some of them zigzag, alternate with paler granular stretches; almost no nuclei in the
    fibers; a line of fine golden-brown granules in one fiber; widened white spaces between the fibers hold small, round,
    dark purple cells, clustered mostly left of center.
