caption:
  it: >-
    Necrosi del tessuto adiposo non enzimatica, insorta nel sottocute di un gluteo dopo iniezioni intramuscolari: è
    l'equivalente della forma traumatica, in cui sono le lipasi degli stessi adipociti danneggiati a liberare gli
    acidi grassi. Qui la lesione è in fase avanzata, di riparazione. A piccolo ingrandimento colpiscono gli spazi
    vuoti di dimensioni molto diverse, alcuni enormi e di forma irregolare: sono adipociti morti confluiti in
    microcisti oleose (pseudocisti lipidiche), il cui contenuto si è sciolto durante l'allestimento del preparato.
    Poi guarda ciò che sta fra gli spazi: uno stroma rosa denso di collagene, più compatto in alto a destra
    (fibrosi), con istiociti e cellule infiammatorie che rivestono le cavità. Gli autori descrivono numerose cellule
    giganti multinucleate da corpo estraneo, che a questa risoluzione non si riconoscono una per una. È la sequenza
    tipica: necrosi e infiammazione acuta all'inizio, poi i lipidi vengono inglobati da macrofagi schiumosi e cellule
    giganti, infine fibrosi e talora calcificazione distrofica; per questo la lesione diventa dura e può simulare un
    tumore, soprattutto nella mammella.
  en: >-
    Non-enzymatic fat necrosis in the subcutis of a buttock after intramuscular injections: the equivalent of the
    traumatic form, in which lipases from the injured adipocytes themselves release the fatty acids. Here the lesion
    is late, in the healing phase. At low power the striking feature is the empty spaces of very different sizes,
    some huge and irregular: dead adipocytes have merged into oil microcysts (lipid pseudocysts) whose contents
    dissolved during tissue processing. Then look at what lies between the spaces: a dense pink collagenous stroma,
    most compact at the upper right (fibrosis), with histiocytes and inflammatory cells lining the cavities. The
    authors describe numerous multinucleated foreign-body giant cells, which cannot be picked out one by one at this
    resolution. This is the usual sequence: necrosis and acute inflammation first, then uptake of the lipid by foamy
    macrophages and giant cells, finally fibrosis and sometimes dystrophic calcification; that is why the lesion
    becomes firm and can mimic a tumour, especially in the breast.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento: numerosi spazi bianchi vuoti, rotondi o irregolari e
    di grandezza molto variabile, immersi in uno stroma rosa intenso con molti piccoli nuclei; in alto a destra lo
    stroma è più compatto e fibroso.
  en: >-
    Low-power haematoxylin and eosin micrograph: many empty white spaces, round or irregular and of very variable
    size, set in an intensely pink stroma with many small nuclei; at the upper right the stroma is denser and
    fibrous.
