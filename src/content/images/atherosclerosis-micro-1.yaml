caption:
  it: "Placca con cappuccio fibroso: a basso ingrandimento un cappuccio fibroso (FC) spesso copre un nucleo necrotico (NC) ricco di lipidi; il riquadro a destra mostra a maggior ingrandimento il nucleo con detriti e fessure da cristalli. Arteria intracranica, H&E."
  en: "Fibrous cap atheroma: at low power a thick fibrous cap (FC) covers a lipid-rich necrotic core (NC); the inset on the right shows the core at higher power with debris and clefts. Intracranial artery, H&E."
alt:
  it: "Due pannelli di una placca in H&E: a sinistra una placca rosa con cappuccio fibroso sopra e un'area centrale pallida e vuota; a destra l'ingrandimento di quell'area, con frammenti e fessure."
  en: "Two H&E panels of a plaque: on the left a pink plaque with a fibrous cap on top and a pale, empty-looking central area; on the right a magnified view of that area, with fragments and clefts."
