lookFor:
  it: "Cerca gli ammassi di granuli neri nel tessuto linfoide viola: sono il pigmento antracotico trattenuto dai macrofagi."
  en: "Look for the clumps of black granules in the purple lymphoid tissue: this is anthracotic pigment held by macrophages."
caption:
  it: >-
    Linfonodo toracico con antracosi, EE a basso ingrandimento. Tra le zone viola di tessuto linfoide si vedono ammassi
    e fini granuli neri, più fitti a sinistra e più radi a destra. È il pigmento carbonioso accumulato nel linfonodo.
  en: >-
    Thoracic lymph node with anthracosis, H&E at low power. Within the purple lymphoid tissue there are clumps and fine
    granules of black material, denser on the left and sparser on the right. This is carbon pigment stored in the node.
alt:
  it: "Sezione di linfonodo colorata con ematossilina-eosina a basso ingrandimento: tessuto viola con ammassi e granuli neri sparsi e alcune aree rosa."
  en: "Hematoxylin-eosin lymph node section at low power: purple tissue with scattered black clumps and granules and a few pink areas."
