lookFor:
  it: >-
    Confronta il lato sinistro, con pieghe normali, con il destro, dove la mucosa ha perso le pieghe ed è rossa e
    granulare.
  en: >-
    Compare the left side, with normal folds, with the right side, where the mucosa has lost its folds and is red and
    granular.
caption:
  it: >-
    Colon aperto lungo l'asse maggiore e fissato in formalina. A sinistra la mucosa conserva le pieghe normali. Verso
    destra le pieghe scompaiono e la superficie diventa rossa, granulare e coperta da piccoli rilievi (pseudopolipi). Il
    passaggio dal tratto normale a quello malato è graduale e l'area colpita è continua, senza zone sane intercalate.
    Il righello in alto dà la scala in centimetri.
  en: >-
    Colon opened lengthwise and fixed in formalin. On the left the mucosa keeps its normal folds. Moving right, the
    folds disappear and the surface turns red, granular and covered with small raised bumps (pseudopolyps). The change
    from normal to diseased bowel is gradual and the affected area is continuous, with no healthy stretches in between.
    The ruler at the top gives the scale in centimeters.
alt:
  it: >-
    Fotografia di un segmento di colon aperto: a sinistra mucosa beige con pieghe regolari, a destra mucosa rosso scuro
    con superficie granulosa e piccoli rilievi, grasso giallo sotto il bordo inferiore e un righello in alto.
  en: >-
    Photograph of an opened colon segment: on the left beige mucosa with regular folds, on the right dark red mucosa
    with a granular surface and small bumps, yellow fat below the lower edge and a ruler at the top.
