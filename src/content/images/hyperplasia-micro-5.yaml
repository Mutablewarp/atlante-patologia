lookFor:
  it: "Controlla i nuclei: allungati e simili ovunque significa nessuna atipia; un focolaio di nuclei tondeggianti e diversi farebbe pensare a una EIN."
  en: "Check the nuclei: elongated and alike everywhere means no atypia; a focus of rounder, different nuclei would suggest EIN."
caption:
  it: >-
    L'iperplasia endometriale senza atipie mostrata a piccolo ingrandimento in questa scheda, qui vista a ingrandimento
    maggiore: stesso autore, stesso titolo, foto scattate a due minuti di distanza con la stessa fotocamera (EE). Serve
    per il passaggio che il piccolo ingrandimento non può risolvere: le cellule. Le ghiandole sono quasi a contatto
    l'una con l'altra, con contorni irregolari, e le separano solo sottili strisce di stroma con piccoli nuclei scuri.
    Ora leggi l'epitelio: cellule cilindriche alte, con nuclei situati ad altezze leggermente diverse
    (pseudostratificazione), ma allungati, simili tra loro e ancora disposti perpendicolarmente alla base della
    cellula, come nell'endometrio proliferativo normale. Nella nota dell'autore all'immagine a piccolo ingrandimento le
    cellule sono descritte come prive di atipie, nonostante l'architettura complessa. È questo il punto: nell'iperplasia
    non atipica le cellule hanno lo stesso aspetto in tutto il campione, perché il tessuto è normale e reagisce soltanto
    a un eccesso di estrogeni. La EIN richiede invece un cambiamento focale: rispetto alle ghiandole di fondo dello
    stesso campione, un gruppo circoscritto di ghiandole ha cellule diverse, di solito con nuclei più tondeggianti e più
    citoplasma. Il titolo del file usa il vecchio nome «iperplasia complessa senza atipie»; lo schema OMS del 2014
    adottato in questa scheda distingue solo due gruppi, l'iperplasia non atipica e la EIN.
  en: >-
    Higher-power view of the endometrial hyperplasia without atypia shown at low power on this card: same author, same
    title, photographed two minutes apart with the same camera (H&E). It is here for the step that low power cannot
    settle, the cells. The glands lie almost back to back, with irregular outlines, and only thin strips of stroma with
    small dark nuclei separate them. Now read the epithelium: tall columnar cells whose nuclei sit at slightly
    different heights (pseudostratification), yet are elongated, alike and still lined up at right angles to the base
    of the cell, as in normal proliferative endometrium. In the author's own note on the low-power image, the cells are
    bland even though the architecture is complex. That is the point: in nonatypical hyperplasia the cells look the
    same all over the sample, because the tissue is normal and is only reacting to too much estrogen. EIN needs a focal
    change instead: compared with the background glands of the same sample, one circumscribed group of glands has
    different cells, typically with rounder nuclei and more cytoplasm. The file title uses the older name "complex
    hyperplasia without atypia"; the 2014 WHO scheme used on this card keeps only two groups, nonatypical hyperplasia
    and EIN.
alt:
  it: >-
    Micrografia di endometrio in ematossilina-eosina a ingrandimento maggiore: ghiandole fittamente stipate con lumi
    bianchi e irregolari, rivestite da cellule viola alte con nuclei allungati su più file; sottili strisce di stroma
    con piccoli nuclei scuri tra le ghiandole; alcuni globuli rossi in alto a sinistra.
  en: >-
    Higher-power H&E micrograph of endometrium: tightly packed glands with white, irregular lumens, lined by tall
    purple cells with elongated nuclei in several rows; thin strips of stroma with small dark nuclei between the
    glands; a few red blood cells at upper left.
