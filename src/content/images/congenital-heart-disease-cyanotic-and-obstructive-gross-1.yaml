caption:
  it: >-
    Aorta con coartazione, preparato fissato e aperto, visto dal lato anteriore. Segui la parete dall'arco in alto,
    dove escono i vasi, verso il basso: il lume si restringe in un tratto focale subito dopo l'arco, poi riprende il
    calibro più avanti. È la sede tipica della coartazione, in corrispondenza del dotto. Le etichette bianche sono
    del preparato originale.
  en: >-
    Aorta with coarctation, a fixed specimen opened and seen from the anterior side. Follow the wall from the arch at
    the top, where the branch vessels arise, downward: the lumen narrows over a short segment just past the arch, then
    regains its caliber further down. This is the typical site of coarctation, at the level of the ductus. The white
    labels belong to the original specimen.
alt:
  it: >-
    Preparato di aorta aperta longitudinalmente, di colore bruno-arancio, in un contenitore trasparente; la parete si
    restringe nella parte alta, sotto l'arco. Due etichette bianche riportano "158 AORTE" e "COARCTATION".
  en: >-
    A tan-orange aorta opened lengthwise in a clear container; the wall narrows in the upper part, below the arch. Two
    white labels read "158 AORTE" and "COARCTATION".
lookFor:
  it: Cerca il punto in cui il calibro dell'aorta si riduce, appena dopo l'origine dei vasi dell'arco.
  en: Look for the point where the aortic caliber drops, just past the origin of the arch vessels.
