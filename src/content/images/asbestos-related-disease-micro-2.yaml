lookFor:
  it: "Osserva la forma a manubrio: un'asta chiara segmentata con un rigonfiamento bruno scuro a ciascuna estremità."
  en: "Look at the dumbbell shape: a pale segmented shaft with a dark brown knob at each end."
caption:
  it: >-
    Corpi dell'asbesto a forma di manubrio, ad alto ingrandimento. Ogni corpo ha un'asta dorata segmentata e due
    estremità rigonfie bruno scuro, molto più lunghe dei nuclei delle cellule vicine. Sono fibre rivestite di ferro,
    qui isolate su uno sfondo chiaro tra poche cellule.
  en: >-
    Dumbbell-shaped asbestos bodies, high power. Each body has a golden segmented shaft and two swollen dark-brown
    ends, much longer than the nuclei of the nearby cells. They are iron-coated fibers, here isolated on a pale
    background among a few cells.
alt:
  it: >-
    Micrografia a fondo rosa pallido con due lunghe strutture dorate segmentate, ciascuna con un'estremità rigonfia
    bruno scuro, disposte a V e circondate da piccole cellule con nuclei violacei.
  en: >-
    Micrograph on a pale pink background with two long golden segmented structures, each with swollen dark-brown ends,
    arranged in a V and surrounded by small cells with purple nuclei.
