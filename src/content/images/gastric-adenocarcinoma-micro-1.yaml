lookFor:
  it: "Parti dalla mucosa di superficie in alto, poi segui in basso il passaggio da ghiandole ben formate a un'area rosa di cellule sparse."
  en: "Start at the surface mucosa at the top, then follow the change downward from well-formed glands to a pink area of scattered cells."
caption:
  it: >-
    Carcinoma gastrico a cellule con castone, EE a basso ingrandimento. In alto la mucosa di superficie conserva le
    fossette e le ghiandole ordinate. Scendendo, le ghiandole si diradano e al loro posto compare un'ampia area rosa
    e violacea fatta di piccoli elementi isolati che si infiltrano nella parete senza formare ghiandole. In basso a
    destra lo spazio chiaro è tessuto adiposo.
  en: >-
    Gastric signet ring cell carcinoma, H&E at low power. At the top the surface mucosa keeps its pits and orderly
    glands. Moving down, the glands thin out and a broad pink and purple area takes their place, made of small isolated
    cells that infiltrate the wall without forming glands. The pale space at the lower right is fat.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: in alto una mucosa con fossette e ghiandole regolari; sotto,
    una vasta zona rosa e violacea di piccole cellule disperse; in basso a destra un'area chiara di tessuto adiposo.
  en: >-
    Low-power H&E micrograph: at the top a mucosa with pits and regular glands; below, a broad pink and purple zone of
    small scattered cells; at the lower right a pale area of fat.
