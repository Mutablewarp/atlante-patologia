orientation:
  it: "Lume bronchiale in alto, parete del bronco in basso."
  en: "Bronchial lumen at the top, bronchial wall at the bottom."
lookFor:
  it: "Cerca le ciglia lungo la superficie: non ci sono. Poi controlla che le cellule maturino in ordine, appiattendosi verso il lume, con nuclei uniformi."
  en: "Look for cilia along the surface: there are none. Then check that the cells mature in order, flattening towards the lumen, with uniform nuclei."
caption:
  it: >-
    Metaplasia squamosa del rivestimento bronchiale, EE a forte ingrandimento. Ricorda prima il rivestimento normale:
    un epitelio cilindrico pseudostratificato ciliato (epitelio respiratorio) con cellule caliciformi sparse. Qui invece
    tutta la superficie è coperta da un epitelio pavimentoso pluristratificato: molti strati di cellule poligonali con
    nuclei rotondi od ovali, che verso il lume si appiattiscono e diventano più rosa. Percorri il margine libero: non ci
    sono ciglia né cellule caliciformi. Sotto l'epitelio c'è il connettivo lasso della parete bronchiale, con piccoli
    vasi congesti. Il punto chiave: i nuclei sono uniformi e le cellule si appiattiscono in modo ordinato dalla base
    alla superficie; è questa maturazione ordinata a distinguere la metaplasia dalla displasia. La metaplasia squamosa
    è tipica dei bronchi dei fumatori di lunga data. Un rivestimento privo di cellule caliciformi e di ciglia non può
    né secernere né far scorrere lo strato di muco: è il prezzo di una superficie che tollera meglio il fumo. Se
    l'irritazione cessa, di solito il rivestimento torna cilindrico; se persiste, su questo terreno possono insorgere
    displasia e poi carcinoma squamoso.
  en: >-
    Squamous metaplasia of the bronchial lining, H&E at high power. First recall the normal lining: a pseudostratified
    ciliated columnar epithelium (respiratory epithelium) with scattered goblet cells. Here, instead, the whole surface
    is covered by a stratified squamous epithelium: many layers of polygonal cells with round to oval nuclei, which
    flatten and turn pinker towards the lumen. Run along the free surface: there are no cilia and no goblet cells.
    Under the epithelium lies the loose connective tissue of the bronchial wall, with small congested vessels. Key
    point: the nuclei are uniform and the cells flatten in an orderly way from base to surface; this orderly
    maturation is what separates metaplasia from dysplasia. Squamous metaplasia is typical of the bronchi of
    long-term smokers. A lining without goblet cells and cilia can neither secrete nor move the mucus blanket: that is
    the price of a surface that tolerates smoke better. If the irritation stops, the lining usually returns to
    columnar; if it persists, dysplasia and later squamous cell carcinoma can arise on this ground.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento: nella parte alta del campo una banda spessa formata da
    molti strati di cellule con nuclei viola, più appiattite e rosa lungo il margine superiore, sotto uno sfondo
    chiaro; sotto la banda, un connettivo lasso rosa con nuclei scuri sparsi e alcuni piccoli vasi rossi.
  en: >-
    High-power H&E micrograph: across the upper part of the field, a thick band made of many layers of cells with
    purple nuclei, flatter and pinker along its top edge, under a pale background; below the band, pink loose
    connective tissue with scattered dark nuclei and a few small red blood vessels.
