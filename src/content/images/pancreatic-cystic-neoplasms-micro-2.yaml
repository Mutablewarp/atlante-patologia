lookFor:
  it: "Guarda il rivestimento delle cavità: una sola fila di cellule piccole, piatte o cubiche, senza muco evidente né stroma di tipo ovarico."
  en: "Look at the lining of the cavities: a single row of small, flat or cuboidal cells, with no obvious mucin and no ovarian-type stroma."
caption:
  it: >-
    Neoplasia cistica sierosa (cistoadenoma sieroso microcistico) del pancreas, EE a medio ingrandimento. A sinistra
    molte piccole cisti vuote, separate da setti di connettivo fibroso rosa. Ogni cavità è rivestita da un solo strato
    di cellule piccole, piatte o cubiche, con nuclei scuri e regolari. A destra restano gli acini pancreatici normali,
    di colore viola più intenso. Il confronto con la neoplasia mucinosa è utile: qui il rivestimento è sottile e i setti
    sono fibrosi, non cellulati.
  en: >-
    Serous cystic neoplasm (serous microcystic cystadenoma) of the pancreas, H&E at medium power. On the left are many
    small empty cysts separated by septa of pink fibrous tissue. Each cavity is lined by a single layer of small, flat
    or cuboidal cells with dark, regular nuclei. On the right, normal pancreatic acini remain, a deeper purple. Compare
    it with the mucinous neoplasm: here the lining is thin and the septa are fibrous, not cellular.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a sinistra numerose piccole cavità cistiche vuote con rivestimento sottile,
    separate da connettivo rosa; a destra lobuli di parenchima pancreatico normale, più scuri.
  en: >-
    H&E micrograph: on the left numerous small empty cystic spaces with a thin lining, separated by pink connective
    tissue; on the right lobules of darker, normal pancreatic parenchyma.
