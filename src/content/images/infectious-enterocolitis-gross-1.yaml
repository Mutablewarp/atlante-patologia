orientation:
  it: "Segmento aperto longitudinalmente, mucosa rivolta verso l'alto."
  en: "Segment opened lengthwise, mucosal surface up."
lookFor:
  it: "Segui la mucosa lungo il segmento aperto: cerca le fasce trasversali con la parete ispessita e la mucosa ulcerata, tra tratti di pliche conservate."
  en: "Follow the mucosa along the opened segment: look for transverse bands of thickened wall with ulcerated mucosa between stretches of preserved folds."
caption:
  it: >-
    Intestino tenue aperto, tubercolosi intestinale (macroscopia). Guarda prima i tratti con le pliche mucose ancora
    ben visibili, poi le fasce chiare e ispessite che attraversano la parete: lì la mucosa è sostituita da aree
    ulcerate, giallastre e opache, disposte trasversalmente rispetto all'asse dell'intestino. Questa disposizione ad
    anello, con ispessimento della parete, spiega perché la guarigione può lasciare una stenosi e perché il quadro
    può simulare il Crohn o un carcinoma.
  en: >-
    Opened small bowel, intestinal tuberculosis (gross). First look at the stretches where the mucosal folds are still
    well seen, then at the pale, thickened bands that cross the wall: there the mucosa is replaced by ulcerated,
    yellowish, opaque areas lying across the long axis of the bowel. This ring-like arrangement with a thickened wall
    explains why healing can leave a stricture and why the picture can mimic Crohn disease or carcinoma.
alt:
  it: >-
    Fotografia di un segmento di intestino tenue aperto su fondo blu scuro: pliche mucose verdastre ben evidenti e,
    in tre punti, fasce trasversali con parete ispessita e chiara e superficie mucosa ulcerata, giallastra.
  en: >-
    Photograph of an opened segment of small bowel on a dark blue background: well-defined greenish mucosal folds and,
    in three places, transverse bands with a thickened, pale wall and an ulcerated, yellowish mucosal surface.
