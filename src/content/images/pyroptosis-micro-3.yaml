lookFor:
  it: "Leggi riga per riga e confronta la superficie: grappoli di bolle (apoptosi), un pallone gonfio (necroptosi), una cellula piatta con poche bolle tonde (piroptosi)."
  en: "Read row by row and compare the surface: clusters of beads (apoptosis), a swollen balloon (necroptosis), a flat cell with a few round bubbles (pyroptosis)."
caption:
  it: >-
    Tre morti programmate viste dall'esterno: micrografie al microscopio elettronico a scansione (SEM) di cellule
    macrofagiche di topo in coltura (linea RAW264.7), cinque cellule per riga, una riga per ciascun tipo di morte. Il
    SEM mostra solo la superficie della cellula, in rilievo: qui si giudica la forma della cellula e della sua membrana,
    non l'interno. Apoptosi (riga in alto, TNF più uno Smac-mimetico): la cellula si scompone in un grappolo di bolle
    rotonde delimitate da membrana, da cui derivano i corpi apoptotici, e sottili filamenti la tengono spesso ancorata
    al supporto; la membrana non si rompe. Necroptosi (riga centrale, stesso stimolo più zVAD, un inibitore delle
    caspasi): la cellula si arrotonda e si gonfia come un pallone, e in alcuni punti la superficie appare ruvida e
    lacerata, dove la membrana cede. Piroptosi (riga in basso: LPS come segnale di innesco, o priming, poi nigericina,
    che attiva l'inflammasoma NLRP3): i macrofagi restano distesi e piatti sul supporto ed emettono poche bolle lisce e
    rotonde, che gli autori chiamano corpi piroptotici, grandi più o meno come i corpi apoptotici (1–5 µm); nelle ultime
    due cellule il citoplasma appiattito appare eroso e bucherellato. In questo studio le cellule piroptotiche si sono
    rigonfiate poco, a differenza di quelle necroptotiche: gli autori lo attribuiscono al poro di gasdermina D, che, a
    differenza del canale MLKL della necroptosi, lascia passare gli ioni senza selezionarli. Il nostro testo di
    riferimento descrive invece la cellula piroptotica come una cellula che si gonfia e poi scoppia; le due descrizioni
    concordano sul punto decisivo, la rottura della membrana plasmatica, con fuoriuscita del contenuto cellulare e
    infiammazione, cioè l'opposto dell'apoptosi. Sono cellule in coltura: nelle sezioni di tessuto questi dettagli di
    superficie non si vedono.
  en: >-
    Three programmed deaths seen from outside: scanning electron micrographs (SEM) of cultured mouse macrophage-like
    cells (RAW264.7 line), five cells per row, one row for each way of dying. SEM shows only the cell surface, in
    relief, so here you judge the shape of the cell and of its membrane, not its inside. Apoptosis (top row, TNF plus a
    Smac mimetic): the cell breaks up into a cluster of round, membrane-bound blebs, which give rise to apoptotic
    bodies, and thin strands often still tie it to the support; the membrane does not break. Necroptosis (middle row,
    the same stimulus plus zVAD, a caspase inhibitor): the cell rounds up and swells like a balloon, and in places its
    surface looks rough and torn, where the membrane gives way. Pyroptosis (bottom row: LPS priming, then nigericin,
    which activates the NLRP3 inflammasome): the macrophages stay spread flat on the support and put out a few smooth,
    round bubbles, which the authors call pyroptotic bodies, roughly the size of apoptotic bodies (1–5 µm); in the last
    two cells the flattened cytoplasm looks eroded and full of small holes. In this study the pyroptotic cells swelled
    little, unlike the necroptotic ones: the authors put this down to the gasdermin D pore, which, unlike the MLKL
    channel of necroptosis, lets ions through without selecting them. Our main textbook, by contrast, describes the
    pyroptotic cell as swelling and then bursting; both accounts agree on the decisive point, the rupture of the plasma
    membrane, with release of the cell contents and inflammation, the opposite of apoptosis. These are cultured cells:
    in tissue sections such surface details cannot be seen.
alt:
  it: >-
    Figura di microscopia elettronica a scansione, in grigio su fondo scuro, con tre righe di cinque cellule singole
    incorniciate in verde (Apoptosis), rosso (Necroptosis) e viola (Pyroptosis). Riga in alto: cellule coperte da
    grappoli di piccole sfere rotonde, con sottili filamenti. Riga centrale: grandi cellule arrotondate e gonfie, con
    zone ruvide e spugnose. Riga in basso: cellule piatte distese sulla superficie con poche bolle lisce e rotonde; le
    ultime due sono lamine piatte con un centro rilevato e molti piccoli fori.
  en: >-
    Scanning electron microscopy figure, grey on a dark background, with three rows of five single cells framed in green
    (Apoptosis), red (Necroptosis) and purple (Pyroptosis). Top row: cells covered by clusters of small round beads,
    with thin threads. Middle row: large, rounded, swollen cells with rough, frothy patches. Bottom row: flat cells
    spread on the surface with a few smooth round bubbles; the last two are flat sheets with a raised centre and many
    small holes.
