lookFor:
  it: "Da sinistra a destra: linfociti, istiociti epitelioidi con due cellule di Langhans, poi il margine della necrosi."
  en: "Left to right: lymphocytes, epithelioid histiocytes with two Langhans cells, then the edge of the necrosis."
caption:
  it: >-
    La stessa lesione del linfonodo a forte ingrandimento (la fonte non indica la colorazione; dall'aspetto è
    un'ematossilina-eosina). Leggi il campo da sinistra a destra, cioè dalla periferia del granuloma verso la necrosi.
    Lungo il margine sinistro c'è una fascia di piccoli linfociti, con nuclei tondi e scuri e pochissimo citoplasma. Al
    centro dominano gli istiociti epitelioidi: nuclei ovali o allungati, chiari, e citoplasma rosa pallido dai limiti
    sfumati, tanto che le cellule sembrano fondersi l'una nell'altra. Fra di essi ci sono due cellule giganti di
    Langhans, grandi cellule con abbondante citoplasma rosa e molti nuclei allineati lungo il bordo a ferro di cavallo,
    più evidente in quella in basso a destra. In alto a destra il tessuto si trasforma in un materiale rosa pallido,
    finemente granulare, quasi senza nuclei: è il margine della necrosi caseosa. Perché conta: la necrosi caseosa si
    riconosce dentro questa cornice di macrofagi epitelioidi, cellule giganti e linfociti; le cellule di Langhans
    nascono dalla fusione di macrofagi attivati. Non confonderle con le cellule giganti da corpo estraneo, nelle quali i
    nuclei sono sparsi in tutto il citoplasma, che spesso contiene il materiale estraneo.
  en: >-
    The same lymph node lesion at high power (the source does not name the stain; it looks like H&E). Read the field
    from left to right, that is, from the periphery of the granuloma towards the necrosis. Along the left edge runs a
    band of small lymphocytes, with round dark nuclei and very little cytoplasm. The centre is dominated by epithelioid
    histiocytes: oval or elongated pale nuclei and pale pink cytoplasm with blurred borders, so that the cells seem to
    merge into one another. Among them lie two Langhans giant cells, large cells with abundant pink cytoplasm and many
    nuclei lined up along the edge in a horseshoe, clearest in the one at the lower right. At the upper right the tissue
    turns into pale pink, finely granular material with hardly any nuclei: this is the edge of the caseous necrosis.
    Why it matters: caseous necrosis is recognised within this frame of epithelioid macrophages, giant cells and
    lymphocytes; Langhans cells arise from the fusion of activated macrophages. Do not confuse them with foreign-body
    giant cells, whose nuclei are scattered throughout the cytoplasm, which often holds the foreign material.
alt:
  it: >-
    Micrografia rosa a forte ingrandimento: a sinistra molti piccoli nuclei tondi e scuri; al centro cellule chiare con
    nuclei ovali e due grandi cellule rosa con nuclei disposti lungo il bordo, una in alto a sinistra e una in basso a
    destra; in alto a destra un'area rosa pallida e granulare quasi priva di nuclei.
  en: >-
    High-power pink micrograph: on the left many small round dark nuclei; in the centre pale cells with oval nuclei and
    two large pink cells with nuclei along their edge, one at the upper left and one at the lower right; at the upper
    right a pale pink granular area almost free of nuclei.
