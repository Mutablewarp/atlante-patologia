lookFor:
  it: "Segui i nidi di cellule rosa grandi e poligonali e osserva le bande rosa pallido di collagene che li separano."
  en: "Follow the nests of large pink polygonal cells and note the pale pink bands of collagen that separate them."
caption:
  it: >-
    Variante fibrolamellare del carcinoma epatocellulare, H&E a medio ingrandimento. Nidi e cordoni di cellule grandi,
    poligonali, con citoplasma rosa granulare e nuclei con nucleolo evidente, sono separati da fasci di collagene.
    Alcune cellule contengono piccoli vacuoli chiari.
  en: >-
    Fibrolamellar variant of hepatocellular carcinoma, H&E at medium power. Nests and cords of large polygonal cells
    with granular pink cytoplasm and nuclei with a visible nucleolus are separated by bundles of collagen. A few
    cells contain small clear vacuoles.
alt:
  it: >-
    Micrografia H&E a medio ingrandimento: gruppi di cellule rosa grandi con nuclei scuri e rotondi, divisi da fasci
    rosa pallido di tessuto fibroso orientati in varie direzioni.
  en: >-
    Medium-power H&E micrograph: groups of large pink cells with round dark nuclei, divided by pale pink bundles of
    fibrous tissue running in several directions.
