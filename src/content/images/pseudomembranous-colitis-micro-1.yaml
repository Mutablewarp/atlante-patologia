lookFor:
  it: "Trova il getto di essudato rosa-violaceo che esce dalla superficie e seguilo fino alle cripte danneggiate alla sua base."
  en: "Find the erupting plume of pink-purple exudate and trace it down to the damaged crypts at its base."
caption:
  it: >-
    Colon, EE a basso ingrandimento. Parti dalla mucosa conservata ai due lati, con cripte regolari e piene di
    lume. Al centro la superficie è rotta e da lì esce un getto di essudato che si apre a ventaglio sopra la mucosa:
    è il classico aspetto "a vulcano" della pseudomembrana. Sotto l'eruzione le cripte sono rade, dilatate e
    circondate da infiammazione, e la lamina propria è congesta.
  en: >-
    Colon, H&E at low power. Start with the preserved mucosa on both sides, with regular crypts and open lumens. In the
    center the surface is broken and a plume of exudate erupts from it and spreads out over the mucosa: this is the
    classic "volcano" look of a pseudomembrane. Beneath the eruption the crypts are sparse, dilated and surrounded by
    inflammation, and the lamina propria is congested.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: ai lati mucosa del colon con cripte regolari; al centro
    un getto di essudato rosa-violaceo che emerge dalla superficie e si espande verso l'alto, su cripte alterate e
    tessuto infiammato.
  en: >-
    Low-power H&E micrograph: colonic mucosa with regular crypts at the sides; in the center a plume of pink-purple
    exudate rises from the surface and spreads upward, over altered crypts and inflamed tissue.
