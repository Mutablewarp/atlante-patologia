lookFor:
  it: "Guarda i nuclei: dimensioni e forma variabili, cromatina scura, e qualche cellula con citoplasma rosa e nucleo picnotico."
  en: "Look at the nuclei: variable size and shape, dark chromatin, and a few cells with pink cytoplasm and a pyknotic nucleus."
caption:
  it: >-
    Carcinoma squamoso dell'esofago, EE ad alto ingrandimento, stessa lesione della veduta precedente. In alto la
    cheratina contiene nuclei residui circondati da un alone chiaro. Sotto, le cellule tumorali hanno nuclei grandi,
    scuri e di forma irregolare, con alcune figure mitotiche, e formano nidi arrotondati.
  en: >-
    Esophageal squamous cell carcinoma, H&E at high power, same lesion as the previous view. At the top the keratin
    holds retained nuclei with a clear halo. Below, the tumor cells have large, dark, irregularly shaped nuclei, with
    some mitotic figures, and form rounded nests.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: in alto cheratina rosa pallido con nuclei piccoli e scuri
    in uno spazio chiaro; in basso cellule viola con nuclei irregolari, raggruppate in nidi.
  en: >-
    High-power H&E micrograph: at the top pale pink keratin with small dark nuclei in clear spaces; below, purple cells
    with irregular nuclei grouped in nests.
