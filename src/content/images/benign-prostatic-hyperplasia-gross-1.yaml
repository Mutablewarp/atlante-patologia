lookFor:
  it: "Segui lo strumento metallico nell'uretra e guarda il tessuto prostatico attorno: è aumentato di volume e compatto, con la parte superiore che sporge."
  en: "Follow the metal instrument in the urethra and look at the prostatic tissue around it: it is enlarged and firm, with the upper part bulging."
caption:
  it: >-
    Prostata asportata per iperplasia prostatica benigna, con un lobo mediano molto voluminoso. Uno strumento metallico
    segna il percorso dell'uretra, che attraversa il tessuto ingrandito. Il righello a sinistra dà la scala (il pezzo è
    lungo quasi 7 cm).
  en: >-
    Prostate removed for benign prostatic hyperplasia, with a very large median lobe. A metal instrument marks the
    course of the urethra, which runs through the enlarged tissue. The ruler on the left gives the scale (the specimen
    is almost 7 cm long).
alt:
  it: >-
    Fotografia di un pezzo operatorio di prostata su telo verde: tessuto rosso-rosato, ingrandito, con uno strumento
    metallico scuro al centro nell'uretra e un righello graduato a sinistra.
  en: >-
    Photograph of a prostate specimen on a green drape: enlarged pink-red tissue with a dark metal instrument in the
    urethra at the center and a graduated ruler on the left.
