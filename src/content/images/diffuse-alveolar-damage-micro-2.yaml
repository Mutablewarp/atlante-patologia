lookFor:
  it: "Cerca le pareti alveolari ispessite da tessuto fibroblastico e, indicati dalle frecce, i residui di membrane ialine."
  en: "Look for alveolar walls thickened by fibroblastic tissue and, marked by the arrows, remnants of hyaline membranes."
caption:
  it: >-
    Fase organizzativa del danno alveolare diffuso (qui in un caso idiopatico). Le pareti alveolari sono ispessite da
    una proliferazione di fibroblasti in una matrice lassa e mucoide, e gli spazi aerei restano aperti ma deformati.
    Le frecce nere indicano residui di membrane ialine, rosa e omogenei, ancora aderenti alla parete: ricordano che la
    fase essudativa è appena finita. A destra un alveolo contiene una massa di fibrina. Confronta con l'immagine della
    fase essudativa: qui il tessuto non è più solo edema e membrane, ma si sta riparando.
  en: >-
    Organizing phase of diffuse alveolar damage (here in an idiopathic case). The alveolar walls are thickened by
    fibroblasts in a loose, myxoid matrix, and the air spaces stay open but distorted. The black arrows mark remnants
    of hyaline membranes, pink and homogeneous, still stuck to the wall: they show that the exudative phase has only
    just ended. At the right an alveolus holds a mass of fibrin. Compare with the exudative-phase image: here the
    tissue is no longer just edema and membranes, but is being repaired.
alt:
  it: >-
    Micrografia di polmone con pareti alveolari ispessite e cellulari, spazi aerei chiari e irregolari, pochi globuli
    rossi sparsi e quattro frecce nere che indicano sottili bande rosa lungo le pareti.
  en: >-
    Micrograph of lung with thickened, cellular alveolar walls, pale irregular air spaces, a few scattered red cells
    and four black arrows pointing at thin pink bands along the walls.
