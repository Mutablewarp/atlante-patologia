lookFor:
  it: "Individua la chiazza bianca piatta e seguine il margine irregolare; poi ricorda che dall'aspetto non si ricava il grado: solo la biopsia lo dà."
  en: "Find the flat white patch and follow its irregular edge; then remember that its look cannot give you the grade, only a biopsy can."
caption:
  it: >-
    Fotografia clinica del cavo orale: il lato sinistro della lingua, con i denti dell'arcata inferiore lungo il bordo
    in basso a destra come riferimento. Al centro c'è una chiazza bianca piatta di circa 1 cm (misura indicata dalla
    fonte), dal contorno irregolare, su una mucosa per il resto rosea e umida; i puntini bianchi brillanti sparsi nella
    foto sono riflessi della saliva. Clinicamente è una leucoplachia, cioè una chiazza bianca della mucosa orale: il
    termine descrive ciò che il clinico vede e non è una diagnosi. Il colore bianco dipende di solito da uno strato di
    cheratina ispessito in superficie, e al microscopio una chiazza di questo tipo può rivelarsi qualunque cosa, da un
    innocuo ispessimento della cheratina fino a un carcinoma squamocellulare invasivo. Dalla foto non si può capire
    quale sia: lo dice solo la biopsia. In questo caso la biopsia, eseguita prima della foto, ha mostrato una displasia
    grave, cioè una lesione precancerosa di alto grado. Per l'esame: la leucoplachia è legata soprattutto a tabacco e
    alcol, e la lingua è la sede più frequente del carcinoma squamocellulare del cavo orale; una chiazza rossa
    (eritroplachia), o aree rosse dentro una chiazza bianca, rende ancora più forte il sospetto di displasia grave o di
    carcinoma. Attenzione: una chiazza bianca può essere anche una candidosi o un lichen planus, un motivo in più per
    ricorrere alla biopsia invece di diagnosticare a occhio.
  en: >-
    Clinical photograph inside the mouth: the left side of the tongue, with the lower teeth along the bottom right edge
    for orientation. In the centre lies a flat white patch about 1 cm across (size given by the source), with an
    irregular outline, on otherwise pink, moist mucosa; the bright white specks scattered over the picture are
    reflections from saliva. Clinically this is a leukoplakia, a white patch of the oral mucosa: the word describes what
    the clinician sees and is not a diagnosis. The white colour usually comes from a thickened layer of keratin on the
    surface, and under the microscope a patch like this can turn out to be anything from a harmless thickening of the
    keratin to an invasive squamous cell carcinoma. Nothing on the photograph tells you which; only a biopsy does. Here
    the biopsy, taken before the photograph, showed severe dysplasia, a high-grade precursor lesion. For the exam:
    leukoplakia is linked above all to tobacco and alcohol, and the tongue is the most frequent site of oral squamous
    cell carcinoma; a red patch (erythroplakia), or red areas inside a white one, raises the suspicion of severe
    dysplasia or carcinoma even further. Pitfall: a white patch can also be candidiasis or lichen planus, one more
    reason to biopsy rather than diagnose by eye.
alt:
  it: >-
    Fotografia a colori ravvicinata dell'interno della bocca: la mucosa rosea e umida del lato della lingua riempie
    l'inquadratura, con una chiazza bianca piatta e irregolare a sinistra del centro. I denti inferiori corrono lungo il
    bordo in basso a destra e in alto a destra si vede parte del labbro con alcuni peli. Aree marezzate blu-violacee si
    trovano a destra della chiazza e in basso a sinistra; piccoli riflessi brillanti di saliva sono sparsi
    nell'immagine.
  en: >-
    Close-up colour photograph inside the mouth: the pink, moist mucosa of the side of the tongue fills the frame, with
    a flat, irregular white patch left of centre. Lower teeth run along the bottom right edge, and part of the lip with
    a few hairs shows at the top right. Bluish-purple mottled areas lie to the right of the patch and at the lower
    left; small bright reflections of saliva are scattered across the image.
