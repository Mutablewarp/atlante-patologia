lookFor:
  it: "Osserva prima i setti alveolari ispessiti da cellule infiammatorie, poi cerca le cellule giganti multinucleate a sinistra e il tappo di polmonite organizzativa in basso a sinistra."
  en: "First note the alveolar septa thickened by inflammatory cells, then look for the multinucleated giant cells at left and the plug of organizing pneumonia at lower left."
caption:
  it: >-
    Polmonite da ipersensibilità cronica, EE a basso ingrandimento. Gli alveoli restano aperti, ma i setti sono ispessiti
    da un infiltrato infiammatorio cronico e in alcune zone formano ammassi più scuri. A sinistra si vedono cellule
    giganti multinucleate nell'interstizio; in basso a sinistra c'è un tappo di polmonite organizzativa.
  en: >-
    Chronic hypersensitivity pneumonitis, H&E at low power. The air spaces stay open, but the septa are thickened by a
    chronic inflammatory infiltrate that forms darker clusters in places. Multinucleated giant cells sit in the
    interstitium at left, and a plug of organizing pneumonia lies at lower left.
alt:
  it: "Sezione di polmone colorata con ematossilina-eosina a basso ingrandimento: spazi alveolari chiari con setti ispessiti e ricchi di cellule infiammatorie viola, sotto una sottile pleura rosa."
  en: "Hematoxylin-eosin lung section at low power: pale air spaces with septa thickened by purple inflammatory cells, beneath a thin pink pleura."
