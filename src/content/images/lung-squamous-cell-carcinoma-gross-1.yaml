caption:
  it: >-
    Carcinoma squamoso del bronco, superficie di taglio (il riquadro con la scala indica 1 e 2). A sinistra la massa
    pallida, friabile e in parte necrotica occupa e ostruisce il lume bronchiale, cioè la sede centrale tipica di
    questo tumore. Il bronco a valle è infiammato e contiene muco. A destra il parenchima polmonare è chiazzato di nero
    per il pigmento di carbone, tipico dei fumatori.
  en: >-
    Squamous cell carcinoma of the bronchus, cut surface (the scale card reads 1 and 2). At the left, a pale, friable,
    partly necrotic mass fills and obstructs the bronchial lumen, the typical central site of this tumor. The bronchus
    beyond it is inflamed and holds mucus. At the right, the lung parenchyma is mottled with black carbon pigment, as
    is common in smokers.
alt:
  it: >-
    Fotografia macroscopica di polmone sezionato: a sinistra una massa biancastra e irregolare nel bronco; al centro
    le pareti bronchiali rosse e infiammate con tracce di muco; a destra tessuto polmonare rosso con macchie nere; in
    basso a destra un cartoncino con la scala.
  en: >-
    Gross photograph of a cut lung: at the left an irregular whitish mass in the bronchus; in the center reddened,
    inflamed bronchial walls with some mucus; at the right red lung tissue with black spots; at the lower right a small
    scale card.
