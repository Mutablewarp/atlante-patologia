lookFor:
  it: "Segui le cripte dalla superficie fino alla muscularis mucosae e controlla se l'allargamento arriva alla base."
  en: "Follow the crypts from the surface down to the muscularis mucosae and see whether the widening reaches the base."
caption:
  it: >-
    Adenoma serrato sessile del colon trasverso (0,4 cm), EE a basso ingrandimento. Parti dalla superficie e segui le
    cripte verso il basso, fino alla fascia rosa della muscularis mucosae. Le cripte sono larghe, con il lume pieno di
    muco chiaro, e il profilo seghettato non si ferma alla parte alta: arriva fino alle basi, che appaiono dilatate.
  en: >-
    Sessile serrated adenoma of the transverse colon (0.4 cm), H&E at low power. Start at the surface and follow the
    crypts downward to the pink band of the muscularis mucosae. The crypts are wide, with lumens full of pale mucus, and
    the saw-toothed outline does not stop in the upper part: it reaches the bases, which look dilated.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un polipo del colon: file di cripte allungate e dilatate, con lume chiaro e
    contorno ondulato, sopra una sottile fascia rosa e uno spazio vuoto in basso.
  en: >-
    H&E micrograph of a colon polyp: rows of elongated, dilated crypts with pale lumens and a wavy outline, above a thin
    pink band and an empty space below.
