lookFor:
  it: >-
    Guarda le ghiandole: quali sono dilatate e piene di muco, e come appare il tessuto rosa che le circonda.
  en: >-
    Look at the glands: which ones are dilated and filled with mucus, and what the surrounding pink tissue looks like.
caption:
  it: >-
    Polipo giovanile, EE a basso ingrandimento. Parti dalle ghiandole: molte sono dilatate a cisti, con il lume vuoto o
    pieno di muco. Tra le cisti il tessuto di sostegno è abbondante, rosa e ricco di piccole cellule infiammatorie
    e di vasi. A destra restano ghiandole allungate e più regolari.
  en: >-
    Juvenile polyp, H&E at low power. Start with the glands: many are dilated into cysts, with an empty lumen or one
    filled with mucus. Between the cysts the supporting tissue is abundant, pink, and rich in small inflammatory cells
    and vessels. Elongated, more regular glands remain at the right.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: grandi ghiandole cistiche dilatate in un tessuto di
    sostegno rosa e cellulato, con ghiandole allungate a destra.
  en: >-
    Low-power H&E micrograph: large dilated cystic glands in a pink, cellular supporting tissue, with elongated glands
    at the right.
