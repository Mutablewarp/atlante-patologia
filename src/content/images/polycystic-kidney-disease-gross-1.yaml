orientation:
  it: "Rene sezionato a metà: si vede la superficie di taglio, con la scala in centimetri a sinistra."
  en: "Kidney cut in half: the cut surface is shown, with the centimeter scale on the left."
lookFor:
  it: "Guarda la superficie di taglio: il parenchima normale è quasi scomparso, sostituito da cisti di dimensioni diverse."
  en: "Look at the cut surface: almost no normal parenchyma is left, replaced by cysts of many different sizes."
caption:
  it: >-
    Rene policistico dell'adulto (ADPKD), superficie di taglio di un rene asportato. Parti dal contorno: l'organo è
    ingrandito e deformato. Poi guarda l'interno: cisti di tutte le dimensioni, a pareti sottili, con contenuto
    trasparente o emorragico, separate da sottili setti di tessuto. Del parenchima normale resta solo qualche zona rossa
    in alto. La scala in centimetri a sinistra aiuta a valutare le dimensioni.
  en: >-
    Adult polycystic kidney (ADPKD), cut surface of a nephrectomy specimen. Start with the outline: the organ is
    enlarged and distorted. Then look inside: cysts of every size with thin walls and clear or hemorrhagic contents,
    separated by thin septa of tissue. Only a few red areas of normal parenchyma remain at the top. The centimeter scale
    on the left helps you judge size.
alt:
  it: >-
    Fotografia di un rene tagliato a metà su sfondo nero: la superficie di taglio è occupata da numerose cisti
    rotonde, grandi e piccole, con contenuto trasparente o scuro, separate da setti chiari; in alto restano alcune zone
    rosse di parenchima. A sinistra, un righello in centimetri.
  en: >-
    Photograph of a kidney cut in half on a black background: the cut surface is filled with many round cysts, large
    and small, with clear or dark contents, separated by pale septa; a few red areas of parenchyma remain at the top. A
    centimeter ruler is at the left.
