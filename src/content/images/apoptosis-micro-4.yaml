lookFor:
  it: "Cerca alla base delle cripte, in basso a destra, i piccoli punti scuri dentro l'epitelio, poi verifica che la lamina propria intorno non contenga neutrofili."
  en: "Scan the crypt bases at lower right for tiny dark dots inside the epithelium, then check that the lamina propria around them holds no neutrophils."
caption:
  it: >-
    Biopsia rettale di un adulto HIV-positivo con diarrea, EE a medio ingrandimento; secondo la scheda della fonte, nel
    campione non c'erano infiammazione né agenti infettivi riconoscibili. Parti dall'architettura: cripte alte e
    regolari, piene di cellule caliciformi gonfie di muco, poggiano sulla banda rosa della muscularis mucosae in basso, e
    la lamina propria tra una cripta e l'altra è chiara e povera di cellule. Poi spostati in basso a destra: alcune
    cripte sono più sottili e più violacee, con meno cellule caliciformi, e alla base sono punteggiate da piccole
    particelle rotonde e scure. Ogni punto è il nucleo condensato o frammentato di una singola cellula epiteliale morta
    per apoptosi. Il concetto chiave: le cellule muoiono una alla volta dentro un epitelio che resta integro, e nella
    lamina propria non compaiono neutrofili, perché i corpi apoptotici vengono fagocitati senza scatenare infiammazione.
    Passa all'immagine a forte ingrandimento dello stesso caso per vedere da vicino i corpi apoptotici. Nell'intestino,
    corpi apoptotici alla base delle cripte con scarsa infiammazione sono il reperto principale della malattia del
    trapianto contro l'ospite (GVHD); alcuni farmaci e, come qui, l'infezione da HIV possono dare un quadro simile,
    quindi è il contesto clinico a orientare la diagnosi.
  en: >-
    Rectal biopsy from an HIV-positive adult with diarrhoea, H&E at medium power; according to the source record, the
    sample showed no inflammation and no recognisable infective agent. Start with the architecture: tall, regular
    crypts full of mucus-swollen goblet cells rest on the pink band of the muscularis mucosae at the bottom, and the
    lamina propria between the crypts is pale and holds few cells. Then move to the lower right: some crypts are
    thinner and more purple, with fewer goblet cells, and their bases are dotted with small, round, dark particles. Each
    dot is the condensed or fragmented nucleus of a single epithelial cell that has died by apoptosis. Key point: the
    cells die one at a time inside an epithelium that stays intact, and no neutrophils appear in the lamina propria,
    because apoptotic bodies are engulfed without triggering inflammation. Switch to the high-power image of the same
    case to see the apoptotic bodies up close. In the bowel, apoptotic bodies at the base of the crypts with little
    inflammation are the main finding of graft-versus-host disease (GVHD); some drugs and, as here, HIV infection can
    produce a similar picture, so the clinical setting guides the diagnosis.
alt:
  it: >-
    Micrografia in ematossilina-eosina a medio ingrandimento di mucosa rettale: cripte parallele piene di vacuoli chiari
    di muco scendono dall'alto verso il basso, una banda rosa di muscolatura liscia corre lungo il margine inferiore e le
    cripte in basso a destra sono più sottili e scure, con piccoli punti scuri sparsi vicino alla base.
  en: >-
    Medium-power H&E micrograph of rectal mucosa: parallel crypts filled with clear mucus vacuoles run from top to
    bottom, a pink band of smooth muscle lies along the lower edge, and the crypts at lower right are thinner and
    darker, with small dark dots scattered near their bases.
