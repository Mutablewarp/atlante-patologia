caption:
  it: >-
    Biopsia di colon, EE a basso ingrandimento. Parti dalla mucosa in alto a sinistra, con cripte in file ordinate, poi
    segui verso destra: sotto la mucosa compare un denso infiltrato linfoide e, dentro di esso, due aree rosa pallide
    rotondeggianti, i granulomi. L'infiltrato che arriva in profondità, fuori dalla sola mucosa, è un indizio di
    infiammazione che non si ferma in superficie.
  en: >-
    Colon biopsy, H&E at low power. Start from the mucosa at the upper left, with crypts in orderly rows, then follow to
    the right: below the mucosa there is a dense lymphoid infiltrate and, within it, two rounded pale pink areas, the
    granulomas. An infiltrate that reaches deeper than the mucosa alone hints at inflammation that does not stop at the
    surface.
alt:
  it: >-
    Micrografia a basso ingrandimento di un frammento di biopsia colica in ematossilina-eosina: a sinistra cripte
    allineate, a destra un denso infiltrato di cellule infiammatorie con due noduli rosa pallidi rotondeggianti.
  en: >-
    Low-power H&E micrograph of a colon biopsy fragment: aligned crypts on the left and, on the right, a dense
    inflammatory cell infiltrate with two rounded pale pink nodules.
lookFor:
  it: "Cerca i due noduli rosa pallidi dentro l'infiltrato linfoide sotto la mucosa."
  en: "Look for the two pale pink nodules inside the lymphoid infiltrate beneath the mucosa."
