lookFor:
  it: "Confronta dimensioni e contorno dei glomeruli con i tubuli intorno: i gomitoli sono grandi, lobulati e ricchi di cellule?"
  en: "Compare the size and outline of the glomeruli with the tubules around them: are the tufts large, lobulated and crowded with cells?"
caption:
  it: >-
    Biopsia renale, PAS a basso ingrandimento. Parti dai glomeruli: tre grandi in alto, uno più piccolo in basso. I
    gomitoli sono lobulati e affollati, perché le cellule mesangiali ed endoteliali
    sono aumentate. Intorno, i tubuli e l'interstizio mostrano un infiltrato infiammatorio. Questo è il quadro
    lobulare della glomerulonefrite membranoproliferativa; il dettaglio delle pareti capillari si vede
    nell'ingrandimento maggiore.
  en: >-
    Kidney biopsy, PAS stain at low power. Start with the glomeruli: three large ones above, a smaller one below. The
    tufts look lobulated and crowded, because the mesangial and endothelial cells are increased. Around them, the
    tubules and interstitium show an inflammatory infiltrate. This is the lobular pattern of membranoproliferative
    glomerulonephritis; the detail of the capillary walls is in the higher-power view.
alt:
  it: >-
    Micrografia PAS di un frustolo di biopsia renale in una fascia orizzontale: tre glomeruli grandi e lobulati, uno
    più piccolo in basso, tra tubuli con lume chiaro e interstizio con cellule infiammatorie, tutto in rosa e viola.
  en: >-
    PAS micrograph of a horizontal strip of kidney biopsy: three large, lobulated glomeruli and a smaller one below,
    among tubules with clear lumens and an interstitium with inflammatory cells, all in pink and purple.
