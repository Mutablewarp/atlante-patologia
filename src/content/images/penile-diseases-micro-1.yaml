caption:
  it: >-
    Carcinoma squamoso del pene, EE a basso ingrandimento. In alto l'epitelio è ispessito e ricoperto da uno strato
    rosa di cheratina. In basso, nel connettivo pieno di cellule infiammatorie, compaiono isole e lingue di epitelio
    squamoso che penetrano in profondità: questa invasione oltre la superficie distingue il carcinoma invasivo da una
    lesione solo in situ.
  en: >-
    Squamous carcinoma of the penis, H&E at low power. At the top the epithelium is thickened and covered by a pink
    layer of keratin. Below, in connective tissue full of inflammatory cells, islands and tongues of squamous
    epithelium push deep: this invasion beyond the surface separates invasive carcinoma from a lesion that is only in
    situ.
alt:
  it: >-
    Micrografia in ematossilina-eosina: epitelio squamoso ispessito con cheratina rosa in superficie e, in basso, un
    connettivo denso di piccole cellule scure con isole di epitelio tumorale.
  en: >-
    H&E micrograph: thickened squamous epithelium with pink keratin at the surface and, below, connective tissue dense
    with small dark cells that contains islands of tumor epithelium.
lookFor:
  it: "Segui il bordo tra epitelio e connettivo e cerca le isole di cellule squamose staccate dalla superficie."
  en: "Follow the border between epithelium and connective tissue and look for squamous islands cut off from the surface."
