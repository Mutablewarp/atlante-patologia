lookFor:
  it: "Cerca le ghiandole del corpo gastrico: sono disposte in modo irregolare, in un connettivo ricco di cellule infiammatorie."
  en: "Look at the glands of the gastric body: they are irregularly arranged in a connective tissue rich in inflammatory cells."
caption:
  it: >-
    Biopsia del corpo gastrico, EE a basso ingrandimento. La mucosa è infiltrata da molte cellule infiammatorie e le
    ghiandole sono disposte in modo irregolare, con aree di aspetto chiaro e mucoso. È il quadro d'insieme della
    gastrite atrofica autoimmune, da guardare prima di passare all'immagine a forte ingrandimento.
  en: >-
    Biopsy of the gastric body, H&E at low power. The mucosa is infiltrated by many inflammatory cells and the glands
    are irregularly arranged, with pale, mucus-like areas. This is the overview of autoimmune atrophic gastritis, to
    study before moving to the high-power image.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un frammento bioptico: ghiandole irregolari, alcune con aspetto chiaro, in un
    connettivo rosa-violaceo ricco di piccoli nuclei scuri.
  en: >-
    H&E micrograph of a biopsy fragment: irregular glands, some with a pale look, in a pink-purple connective tissue
    rich in small dark nuclei.
