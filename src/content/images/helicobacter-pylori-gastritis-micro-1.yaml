caption:
  it: >-
    Biopsia gastrica con gastrite cronica, EE a basso ingrandimento. Parti dalla superficie, in alto, dove le fossette
    sono rivestite da un epitelio violaceo. Scendi poi nella mucosa: la lamina propria tra le ghiandole è fitta di
    piccole cellule scure, in gran parte linfociti e plasmacellule. In basso a destra l'infiltrato si addensa in un
    follicolo linfoide, con un centro più chiaro circondato da un mantello scuro. Follicoli di questo tipo, in una
    mucosa gastrica infiammata, fanno pensare a un'infezione cronica da Helicobacter pylori.
  en: >-
    Gastric biopsy with chronic gastritis, H&E at low power. Start at the surface, at the top, where the pits are lined
    by purple epithelium. Then move down into the mucosa: the lamina propria between the glands is crowded with small
    dark cells, mostly lymphocytes and plasma cells. At the lower right the infiltrate condenses into a lymphoid
    follicle, with a paler center ringed by a dark mantle. Follicles like this in inflamed gastric mucosa point to
    chronic Helicobacter pylori infection.
alt:
  it: >-
    Micrografia a basso ingrandimento di mucosa gastrica in ematossilina-eosina: in alto la superficie con fossette
    rivestite da epitelio violaceo, sotto ghiandole separate da una lamina propria ricca di cellule infiammatorie
    scure e, in basso a destra, un follicolo linfoide rotondo con centro chiaro.
  en: >-
    Low-power H&E micrograph of gastric mucosa: at the top the surface with pits lined by purple epithelium, below
    glands separated by a lamina propria rich in dark inflammatory cells and, at the lower right, a round lymphoid
    follicle with a pale center.
lookFor:
  it: "Cerca il follicolo linfoide in basso a destra e l'infiltrato di piccole cellule scure nella lamina propria."
  en: "Look for the lymphoid follicle at the lower right and the infiltrate of small dark cells in the lamina propria."
