lookFor:
  it: "Scorri da sinistra a destra e confronta l'aspetto dei campi: l'alterazione cambia da un punto all'altro."
  en: "Scan from left to right and compare how the fields look: the damage changes from one spot to the next."
caption:
  it: >-
    Polmone con quadro UIP, EE a basso ingrandimento. Non cercare una singola cellula: guarda la variabilità tra i
    campi. A sinistra gli alveoli sono quasi normali, con pareti sottili e spazi aerei aperti. Al centro i setti sono
    ispessiti da fibrosi e infiammazione. Verso destra la parete si espande in tessuto cicatriziale compatto, con aree
    più rosa e dense e pochi spazi aerei residui. Questa alternanza di zone sane e zone cicatrizzate, nello stesso
    campo, è l'eterogeneità temporale della UIP.
  en: >-
    Lung with a UIP pattern, H&E at low power. Do not look for a single cell: look at how the fields differ. On the left
    the alveoli are almost normal, with thin walls and open air spaces. In the middle the septa are thickened by
    fibrosis and inflammation. Toward the right the wall expands into dense scar, with pinker, denser areas and few
    air spaces left. This mix of healthy and scarred zones in the same field is the temporal heterogeneity of UIP.
alt:
  it: "Sezione di polmone colorata con ematossilina-eosina a basso ingrandimento: a sinistra alveoli sottili e aperti, a destra tessuto fibroso rosa-violaceo denso con pochi spazi aerei."
  en: "Hematoxylin-eosin lung section at low power: thin open alveoli on the left, dense pink-purple fibrous tissue with few air spaces on the right."
