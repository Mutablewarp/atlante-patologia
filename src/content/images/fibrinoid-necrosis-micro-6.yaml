orientation:
  it: "Il grande vaso occupa il centro e la destra del campo; vasi più piccoli si trovano in alto a sinistra."
  en: "The large vessel fills the centre and right of the field; smaller vessels lie at the top left."
lookFor:
  it: "Confronta il lato sinistro della parete, ancora a strati, con il lato destro, diventato una banda rosa sfumata."
  en: "Compare the left side of the wall, still layered, with the right side, turned into a smudgy pink band."
caption:
  it: >-
    Vasculite eosinofila compatibile con granulomatosi eosinofila con poliangioite (EGPA, un tempo sindrome di
    Churg-Strauss), EE a forte ingrandimento; la fonte non indica l'organo. Parti dal grande vaso al centro e a destra
    del campo: il lume è pieno di globuli rossi rosso vivo. Poi segui la parete partendo da sinistra. A sinistra mostra
    ancora strati rosa con nuclei allungati, fusati; dall'alto fino in basso a destra ha perso questa struttura ed è
    diventata un'ampia banda di materiale rosa acceso e sfumato, con cellule sparse: è l'aspetto della necrosi
    fibrinoide. Ora guarda fuori dal vaso: il tessuto è affollato di cellule infiammatorie, molte delle quali sono
    eosinofili, riconoscibili dal citoplasma pieno di granuli rosso-arancio e dal nucleo bilobato. Come leggerla: i
    globuli rossi stanno nel lume, mentre il deposito fibrinoide sta nella parete; un trombo di fibrina, invece,
    riempirebbe il lume. Al vetrino le lesioni vascolari dell'EGPA possono somigliare molto a quelle della poliarterite
    nodosa, per cui conta il contesto clinico. Collegamento clinico: di solito la fase vasculitica arriva dopo un
    periodo di asma con eosinofilia nel sangue; i P-ANCA (anti-mieloperossidasi) si trovano solo in una parte dei
    pazienti, per cui un test negativo non esclude l'EGPA.
  en: >-
    Eosinophilic vasculitis consistent with eosinophilic granulomatosis with polyangiitis (EGPA, formerly Churg–Strauss
    syndrome), H&E at high power; the source does not name the organ. Start with the large vessel in the centre and
    right of the field: its lumen is packed with bright red blood cells. Then follow its wall from the left. On the left
    it still shows pink layers with elongated, spindle-shaped nuclei; from the top round to the bottom right it has lost
    that structure and become a broad band of smudgy, bright pink material with scattered cells, the look of fibrinoid
    necrosis. Now look outside the vessel: the tissue is crowded with inflammatory cells, many of them eosinophils,
    which you recognise by cytoplasm full of orange-red granules and a two-lobed nucleus. How to read it: the red cells
    sit in the lumen, while the fibrinoid deposit lies in the wall; a fibrin thrombus would instead fill the lumen. On a
    slide, the vessel lesions of EGPA can look much like those of polyarteritis nodosa, so the clinical setting matters.
    Clinical link: the vasculitic phase usually comes after a period of asthma with eosinophilia in the blood; P-ANCA
    (against myeloperoxidase) is found in only part of the patients, so a negative test does not rule out EGPA.
alt:
  it: >-
    Micrografia in EE a forte ingrandimento: al centro e a destra un grande vaso con il lume pieno di globuli rossi
    rosso vivo; la parte destra della parete è un'ampia banda di materiale rosa acceso e sfumato, mentre la parte
    sinistra conserva strati rosa con nuclei allungati. Il tessuto intorno è affollato di cellule infiammatorie, molte
    con citoplasma granulare rosso-arancio; in alto a sinistra anche un piccolo vaso contiene globuli rossi.
  en: >-
    High-power H&E micrograph: in the centre and right, a large vessel whose lumen is packed with bright red blood
    cells; the right part of its wall is a broad band of smudgy, bright pink material, while the left part still has
    pink layers with elongated nuclei. The surrounding tissue is crowded with inflammatory cells, many with orange-red
    granular cytoplasm; at the top left a small vessel also contains red cells.
