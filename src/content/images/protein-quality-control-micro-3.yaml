lookFor:
  it: "Trova il neurone pieno di pigmento bruno, poi cerca sotto il nucleo la sfera rosa, liscia, con un sottile bordo chiaro: è il corpo di Lewy."
  en: "Find the neuron full of brown pigment, then look below its nucleus for the smooth pink sphere with a thin pale rim: that is the Lewy body."
caption:
  it: >-
    Sostanza nera di una persona morta con malattia di Parkinson, EE, forte ingrandimento (la barra nera in basso a
    destra misura 20 µm; la punta di freccia fa parte dell'immagine originale). Prima orientati: il fondo rosa pallido è
    neuropilo, i piccoli nuclei scuri sparsi appartengono per lo più a cellule gliali e a sinistra un capillare contiene
    globuli rossi di un rosso vivo. Al centro c'è un grande neurone. Il suo citoplasma è pieno di granuli bruni
    grossolani di neuromelanina, un pigmento che hanno anche i neuroni sani della sostanza nera: il colore bruno,
    quindi, non è la lesione. Nella parte alta della cellula si vede il nucleo, chiaro, con un piccolo nucleolo. Ora
    segui la punta di freccia: sotto il nucleo c'è una pallina liscia rosa-violacea, separata dal pigmento da un sottile
    bordo chiaro. È un corpo di Lewy, un'inclusione fatta di filamenti di alfa-sinucleina, una proteina dei neuroni che
    si è ripiegata male ed è stata impacchettata invece di essere eliminata. Pigmento e inclusione potrebbero essere
    collegati: la sintesi della neuromelanina passa per l'ossidazione delle catecolamine, e si ritiene che lo stress
    ossidativo che ne deriva favorisca il mal ripiegamento dell'alfa-sinucleina. La parkina, una ligasi E3
    dell'ubiquitina, collega questa lesione al controllo di qualità delle proteine: le sue mutazioni causano alcune
    forme ereditarie della malattia. Nel Parkinson molti neuroni pigmentati della sostanza nera vanno perduti, e infatti
    a occhio nudo la sostanza nera perde il suo colore scuro; solo una minoranza dei neuroni superstiti contiene un
    corpo di Lewy come questo.
  en: >-
    Substantia nigra of a person who died with Parkinson disease, H&E, high power (the black bar at the lower right is
    20 µm; the arrowhead is part of the original image). Get your bearings first: the pale pink background is neuropil,
    the small dark nuclei scattered around belong mostly to glial cells, and on the left a capillary holds bright red
    blood cells. In the centre lies one large neuron. Its cytoplasm is crowded with coarse brown granules of
    neuromelanin, a pigment that healthy neurons of the substantia nigra also carry, so the brown colour is not the
    lesion. Near the top of the cell is its pale nucleus with a small nucleolus. Now follow the arrowhead: below the
    nucleus sits a smooth pink-violet ball, set off from the pigment by a thin clear rim. This is a Lewy body, an
    inclusion built from filaments of alpha-synuclein, a neuronal protein that misfolded and was packed away instead of
    being cleared. The pigment and the inclusion may be connected: making neuromelanin involves the oxidation of
    catecholamines, and the oxidative stress this generates is thought to favour alpha-synuclein misfolding. Parkin, an
    E3 ubiquitin ligase, ties this lesion to protein quality control: its mutations cause some inherited forms of the
    disease. In Parkinson disease many pigmented neurons of the substantia nigra are lost, which is why, to the naked
    eye, the substantia nigra loses its dark colour; only a minority of the neurons that survive contain a Lewy body
    like this one.
alt:
  it: >-
    Micrografia in ematossilina-eosina di tessuto cerebrale su fondo rosa pallido. Al centro un grande neurone è pieno
    di granuli bruni grossolani; nella parte alta si vede un nucleo chiaro e più in basso un corpo rotondo, liscio,
    rosa-violaceo, con un sottile bordo chiaro, indicato a destra da una punta di freccia nera. A sinistra globuli rossi
    di un rosso vivo in un capillare; in basso a destra una barra di scala nera.
  en: >-
    H&E micrograph of brain tissue on a pale pink background. In the centre, a large neuron is filled with coarse brown
    granules; near its top is a pale nucleus, and below it a smooth, round, pink-violet body with a thin clear rim,
    pointed at by a black arrowhead on its right. On the left, bright red blood cells lie in a capillary; a black scale
    bar is at the lower right.
