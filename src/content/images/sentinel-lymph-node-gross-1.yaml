caption:
  it: >-
    Campo operatorio ascellare: nel tessuto aperto al centro spicca un linfonodo tinto di blu dal colorante iniettato
    prima dell'intervento. Cerca il piccolo nodulo blu-verdastro in mezzo al grasso rosso-arancio: è il linfonodo
    sentinella, il primo che il colorante raggiunge lungo il drenaggio linfatico, e quello che il chirurgo asporta
    per l'esame istologico.
  en: >-
    Axillary surgical field: in the opened tissue at the center, one lymph node stands out, stained blue by dye injected
    before the operation. Look for the small blue-green nodule among the red-orange fat: it is the sentinel node, the
    first one the dye reaches along the lymphatic drainage, and the one the surgeon removes for histologic examination.
alt:
  it: >-
    Fotografia di un campo chirurgico ascellare con divaricatori e pinza: al centro, in un tessuto rosso e giallastro,
    un piccolo linfonodo colorato di blu-verde; la cute circostante è su telini chirurgici blu.
  en: >-
    Photograph of an axillary surgical field with retractors and forceps: at the center, in red and yellowish tissue,
    a small blue-green stained lymph node; the surrounding skin lies on blue surgical drapes.
lookFor:
  it: "Individua il linfonodo colorato di blu al centro del campo, circondato da grasso e tessuto rosso."
  en: "Find the blue-stained node at the center of the field, surrounded by fat and red tissue."
