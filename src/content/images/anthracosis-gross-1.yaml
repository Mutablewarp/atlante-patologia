lookFor:
  it: "Cerca le macchie nere e puntiformi sparse nel parenchima, e nota che le pareti dei bronchi restano chiare: il pigmento sta nel tessuto, non nelle vie aeree."
  en: "Find the small black flecks scattered through the parenchyma, and note that the bronchial walls stay pale: the pigment sits in the tissue, not in the airways."
caption:
  it: >-
    Superficie di taglio di polmone con antracosi. Il parenchima rosso-bruno è punteggiato da numerose macchie nere,
    piccole e irregolari, distribuite in modo diffuso. Sono accumuli di pigmento carbonioso; sezioni di bronchi e vasi
    attraversano il campo.
  en: >-
    Cut surface of a lung with anthracosis. The red-brown parenchyma is dotted with many small, irregular black flecks
    spread diffusely. They are deposits of carbon pigment; cut bronchi and vessels cross the field.
alt:
  it: "Superficie di taglio di polmone rosso-bruno con numerose piccole macchie nere sparse, attraversata da una grossa vena scura e da molte sezioni di bronchi dalle pareti chiare."
  en: "Cut surface of a red-brown lung with many small black flecks scattered across it, crossed by a large dark vein and many pale-walled bronchial cross-sections."
