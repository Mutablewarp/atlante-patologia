caption:
  it: >-
    Muscolo scheletrico asportato chirurgicamente da un paziente con gangrena gassosa della coscia da Clostridium
    perfringens, EE (100× nell'articolo di origine). A piccolo ingrandimento colpiscono i grandi spazi vuoti e
    tondeggianti sparsi nel muscolo: sono bolle di gas prodotte dai batteri, che allontanano le fibre l'una
    dall'altra. Guarda poi le fibre: sono rosa pallido, rigonfie o frammentate e hanno pochissimi nuclei residui
    (mionecrosi). Nota anche che cosa manca: l'infiltrato infiammatorio è quasi assente, perché le tossine dei
    clostridi (soprattutto la tossina alfa, una fosfolipasi C o lecitinasi) distruggono le membrane cellulari, anche
    quelle dei leucociti, e si diffondono più in fretta della risposta infiammatoria. Non confondere il gas con il
    grasso: sul margine destro una striscia di tessuto adiposo mostra cellule piccole, regolari e rotonde, ciascuna
    con una sottile membrana, mentre gli spazi gassosi sono più grandi, irregolari e privi di rivestimento. Sul piano
    clinico corrisponde al crepitio alla palpazione e al gas visibile alla radiografia; è un'emergenza chirurgica.
  en: >-
    Skeletal muscle removed at surgery from a patient with gas gangrene of the thigh caused by Clostridium
    perfringens, H&E (100× in the source article). At low power the striking feature is the large, empty, rounded
    spaces scattered through the muscle: these are gas bubbles made by the bacteria, which push the fibres apart. Then
    look at the fibres themselves: they are pale pink, swollen or fragmented, and very few nuclei are left
    (myonecrosis). Notice also what is missing: there is hardly any inflammatory infiltrate, because clostridial
    toxins (above all alpha-toxin, a phospholipase C or lecithinase) destroy cell membranes, including those of white
    cells, and spread faster than the inflammatory response. Do not mistake gas for fat: along the right edge a strip
    of adipose tissue shows small, regular, round cells, each with a thin membrane, whereas the gas spaces are larger,
    irregular and lined by nothing. Clinically this matches crepitus on palpation and gas on X-ray; it is a surgical
    emergency.
alt:
  it: >-
    Micrografia in ematossilina-eosina di muscolo scheletrico: fasci di fibre rosa con pochi nuclei separati da grandi
    spazi bianchi vuoti e irregolari; lungo il margine destro una sottile striscia di piccole cellule adipose rotonde.
  en: >-
    H&E micrograph of skeletal muscle: bundles of pink fibres with few nuclei separated by large, empty, irregular
    white spaces; along the right edge a narrow strip of small, round fat cells.
