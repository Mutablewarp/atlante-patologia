lookFor:
  it: >-
    Confronta in una sola immagine le ghiandole più grandi e scure in alto con le cripte piccole e regolari sotto.
  en: >-
    Compare, in a single image, the larger darker glands at the top with the small regular crypts below.
caption:
  it: >-
    Adenoma tubulare del colon con displasia di basso grado, EE a basso ingrandimento. Guarda prima la parte alta: le
    ghiandole sono più grandi, affollate e più scure, con epitelio stratificato. Poi scendi verso le cripte rotonde,
    piccole e regolari della mucosa normale. Il passaggio brusco tra le due zone è la lesione precursore del cancro del
    colon. Passa a un ingrandimento maggiore per vedere i nuclei allungati.
  en: >-
    Tubular adenoma of the colon with low-grade dysplasia, H&E at low power. Look first at the top: the glands are
    larger, crowded and darker, lined by a layered epithelium. Then move down to the small, round, regular crypts of
    the normal mucosa. The abrupt change between the two zones is the precursor lesion of colon cancer. Go to a higher
    power to see the elongated nuclei.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un frammento di mucosa del colon: in alto ghiandole ingrandite e più scure,
    in basso molte cripte tonde piccole e regolari in sezione trasversale.
  en: >-
    H&E micrograph of a fragment of colon mucosa: at the top enlarged, darker glands; below, many small round regular
    crypts cut in cross-section.
