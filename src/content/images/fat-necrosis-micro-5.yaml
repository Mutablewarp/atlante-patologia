lookFor:
  it: "Cerca cellule senza nucleo con un bordo viola spesso e sfumato, due delle quali contengono materiale lilla: le cellule fantasma."
  en: "Find cells with no nucleus and a thick, smudged purple rim, two of them holding lilac material: the ghost cells."
caption:
  it: >-
    La stessa biopsia di pannicolite pancreatica a forte ingrandimento (ematossilina-eosina, ingrandimento originale
    ×400), per vedere le "cellule fantasma" (ghost cells) che gli autori indicano. Cerca adipociti morti ma ancora
    riconoscibili dalla forma: lungo il loro bordo non c'è più alcun nucleo, e il bordo stesso è diventato una linea
    viola spessa e sfumata. Due di essi, in basso al centro e a destra, non sono vuoti ma racchiudono un materiale
    lilla pallido; nelle altre cellule il grasso si è sciolto durante l'allestimento del preparato, ed è per questo
    che i loro spazi appaiono vuoti. Il
    tessuto tra una cellula e l'altra ha la stessa tinta viola e contiene sparse cellule infiammatorie dai nuclei
    scuri e irregolari. La chiave è il colore: i sali di calcio trattengono con forza l'ematossilina, quindi nel
    grasso morto una tinta blu-viola fa pensare al calcio legato dagli acidi grassi che la lipasi ha liberato
    (saponificazione); la colorazione di von Kossa di questa biopsia mostra che il calcio è presente. È il
    corrispettivo microscopico delle chiazze bianco-gesso visibili a occhio nudo. In una biopsia cutanea le cellule
    fantasma sono l'indizio classico della pannicolite pancreatica. Confronta con la colorazione di von Kossa della
    stessa lesione, in cui il calcio diventa nero.
  en: >-
    The same biopsy of pancreatic panniculitis at high power (H&E, original magnification ×400), to see the "ghost
    cells" that the authors point out. Look for fat cells that are dead but still recognisable by their shape: there
    is no longer any nucleus along their border, and the border itself has become a thick, smudged purple line. Two
    of them, at the bottom centre and on the right, are not empty but enclose a pale lilac material; in the other cells
    the fat dissolved while the slide was being prepared, which is why their spaces look empty. The tissue between the cells has the same
    purple tint and holds scattered inflammatory cells with dark, irregular nuclei. The key is the colour: calcium
    salts hold haematoxylin strongly, so in dead fat a blue-purple tint points to calcium bound by the fatty acids
    that lipase has freed (saponification); the von Kossa stain of this biopsy shows that calcium is present. This
    is the microscopic counterpart of the chalky white patches seen with the naked eye. In
    a skin biopsy, ghost cells are the classic clue to pancreatic panniculitis. Compare with the von Kossa stain of
    the same lesion, in which the calcium turns black.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento, con la lettera C in alto a sinistra: tessuto a tinta
    viola, finemente granulare, con spazi bianchi allungati o rotondi delimitati da un bordo viola spesso; due spazi
    rotondi, in basso al centro e a destra, contengono una massa lilla pallida; in basso al centro alcuni piccoli
    nuclei scuri e irregolari.
  en: >-
    High-power haematoxylin and eosin micrograph with the letter C at the top left: purple-tinted, finely granular
    tissue with elongated or round white spaces bordered by a thick purple rim; two round spaces, at the bottom centre
    and on the right, contain a pale lilac mass; at the bottom centre, a few small, dark, irregular nuclei.
