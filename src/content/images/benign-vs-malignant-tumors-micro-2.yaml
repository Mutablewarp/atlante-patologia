caption:
  it: >-
    Sarcoma pleomorfo indifferenziato (tumore maligno), EE ad alto ingrandimento. Guarda i nuclei: variano molto per
    dimensione e forma (pleomorfismo), molti sono grandi, scuri e dalla forma irregolare (ipercromasia) e alcuni sono
    giganti o bizzarri. Le cellule non ricordano più il tessuto di origine e non formano un'architettura riconoscibile:
    è l'anaplasia. Tutto il contrario dell'uniformità del leiomioma.
  en: >-
    Pleomorphic undifferentiated sarcoma (a malignant tumor), H&E at high power. Look at the nuclei: they vary widely
    in size and shape (pleomorphism), many are large, dark and irregular (hyperchromasia) and some are giant or
    bizarre. The cells no longer resemble the tissue of origin and form no recognizable architecture: this is
    anaplasia. It is the opposite of the uniformity of the leiomyoma.
alt:
  it: >-
    Micrografia rosa-viola in ematossilina-eosina: cellule sparse in uno sfondo rosa, con nuclei scuri di dimensioni e
    forme molto diverse, alcuni molto grandi e irregolari, e un nucleo lineare molto scuro in alto a destra.
  en: >-
    Pink-purple H&E micrograph: scattered cells on a pink background, with dark nuclei of very different sizes and
    shapes, some very large and irregular, and one very dark, elongated nucleus at the upper right.
lookFor:
  it: "Confronta i nuclei tra loro: dimensione, forma e colore variano molto da una cellula all'altra."
  en: "Compare the nuclei with one another: size, shape and staining vary widely from cell to cell."
