lookFor:
  it: "Cerca, nella lamina propria rosa, le strutture rotonde e ghiandolari staccate dalla superficie."
  en: "Look in the pink lamina propria for the round and gland-like structures detached from the surface."
caption:
  it: >-
    Cistite cistica e ghiandolare, EE a bassissimo ingrandimento. Un piccolo frammento di mucosa vescicale: nella lamina
    propria rosa, vicino al margine sinistro, si vedono tre strutture rotonde. Una ha un lume rivestito da cellule
    chiare e allungate, le altre due sono nidi più scuri e pieni. Ai bordi superiori, le aree viola chiaro sono
    addensamenti cellulari.
  en: >-
    Cystitis cystica and glandularis, H&E at very low power. A small fragment of bladder mucosa: in the pink lamina
    propria, near the left edge, three round structures stand out. One has a lumen lined by pale, tall cells; the other
    two are darker, solid nests. Along the upper edges, the pale purple areas are cellular aggregates.
alt:
  it: >-
    Micrografia a bassissimo ingrandimento in ematossilina-eosina: un frammento di tessuto rosa-violaceo su sfondo
    bianco, con tre strutture rotonde nella parte sinistra, una con lume e due piene e più scure.
  en: >-
    Very-low-power H&E micrograph: a pink-purple tissue fragment on a white background, with three round structures on
    the left side, one with a lumen and two solid and darker.
