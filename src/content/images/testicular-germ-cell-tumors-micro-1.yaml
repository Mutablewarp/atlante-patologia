caption:
  it: >-
    Tumore germinale misto, EE a medio ingrandimento. Non cercare un solo aspetto: l'immagine mostra due componenti
    vicine. A destra il carcinoma embrionale, con cellule grandi e atipiche, nuclei vescicolosi con nucleoli evidenti,
    in fogli compatti e ghiandole. A sinistra il tumore del sacco vitellino, con cellule disposte in trabecole e
    cordoni attorno a spazi vuoti. In basso una zona di emorragia. La presenza di più componenti nello stesso campo è
    ciò che definisce il tumore germinale misto.
  en: >-
    Mixed germ cell tumor, H&E at medium power. Do not look for one single pattern: the image shows two neighboring
    components. On the right is embryonal carcinoma, with large atypical cells, vesicular nuclei with prominent
    nucleoli, in solid sheets and glands. On the left is yolk sac tumor, with cells in trabeculae and cords around
    empty spaces. At the bottom there is an area of hemorrhage. Having more than one component in the same field is
    what defines a mixed germ cell tumor.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a destra un'ampia area viola scuro di cellule compatte in fogli e ghiandole; a
    sinistra cellule disposte in cordoni attorno a spazi chiari; in basso una zona rosa intenso di globuli rossi.
  en: >-
    H&E micrograph: on the right a broad dark purple area of crowded cells in sheets and glands; on the left cells in
    cords around clear spaces; at the bottom an intense pink area of red blood cells.
lookFor:
  it: Confronta il lato destro, denso e compatto, con il lato sinistro, a cordoni attorno a spazi vuoti.
  en: Compare the dense, crowded right side with the left side, where cells form cords around empty spaces.
