lookFor:
  it: "Confronta le colonne: a sinistra le fibre sono compatte, a destra sono separate da bande azzurre di matrice interstiziale."
  en: "Compare the columns: on the left the fibers are packed together, on the right they are separated by blue bands of interstitial matrix."
caption:
  it: >-
    Miocardio sano (a sinistra) e cardiomiopatia dilatativa (a destra), colorazione con blu alcian; la barra misura 100
    µm. Nel cuore sano le fibre rosa sono fitte e il blu è appena visibile. Nella cardiomiopatia dilatativa larghe bande
    azzurre separano gruppi di fibre e allargano lo spazio interstiziale; le fibre hanno dimensioni diverse.
  en: >-
    Healthy myocardium (left) and dilated cardiomyopathy (right), Alcian blue stain; the bar is 100 µm. In the healthy
    heart the pink fibers are packed and the blue is barely visible. In dilated cardiomyopathy broad blue bands separate
    groups of fibers and widen the interstitial space; the fibers vary in size.
alt:
  it: >-
    Quattro micrografie in due colonne, "Healthy" a sinistra e "Dilated Cardiomyopathy" a destra: fibre cardiache rosa
    fitte a sinistra; a destra fibre rosa separate da ampie bande azzurre e da spazi chiari.
  en: >-
    Four micrographs in two columns, "Healthy" at left and "Dilated Cardiomyopathy" at right: tightly packed pink heart
    fibers at left; at right pink fibers separated by broad blue bands and pale spaces.
