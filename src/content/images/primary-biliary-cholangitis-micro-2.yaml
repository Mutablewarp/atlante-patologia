lookFor:
  it: "Cerca i dotti biliari tra le cellule infiammatorie dello spazio portale e osserva se i linfociti arrivano a contatto con l'epitelio duttale."
  en: "Look for the bile ducts among the inflammatory cells of the portal tract and see whether lymphocytes reach the ductal epithelium."
caption:
  it: >-
    Biopsia epatica, EE a medio ingrandimento. Lo spazio portale è occupato da un infiltrato di piccole cellule
    infiammatorie, soprattutto linfociti, mescolate ad altre cellule più chiare. Cerca i dotti biliari: sono
    strutture tubulari con un rivestimento epiteliale cubico, circondate e infiltrate dalle cellule infiammatorie.
    Questa è la lesione duttale della colangite biliare primitiva; gli epatociti ai margini restano conservati.
  en: >-
    Liver biopsy, H&E at medium power. The portal tract is occupied by an infiltrate of small inflammatory cells,
    mostly lymphocytes, mixed with other paler cells. Look for the bile ducts: tubular structures with a cuboidal
    epithelial lining, surrounded and infiltrated by the inflammatory cells. This is the duct lesion of primary
    biliary cholangitis; the hepatocytes at the edges stay preserved.
alt:
  it: >-
    Micrografia in ematossilina-eosina di biopsia epatica: al centro uno spazio portale pieno di piccole cellule
    infiammatorie viola, con strutture tubulari a rivestimento epiteliale tra di esse; ai margini epatociti rosa.
  en: >-
    H&E micrograph of a liver biopsy: in the center a portal tract full of small purple inflammatory cells, with
    tubular structures lined by epithelium among them; pink hepatocytes at the edges.
