lookFor:
  it: "Segui il bordo di una ghiandola: cerca le cellule con nuclei grandi, irregolari e di dimensioni diverse, poi il materiale necrotico nel lume."
  en: "Follow the edge of one gland: look for cells with large, irregular nuclei of unequal size, then for the necrotic debris in the lumen."
caption:
  it: >-
    Adenocarcinoma duttale del pancreas ad alto ingrandimento. Le ghiandole neoplastiche sono rivestite da cellule
    colonnari stratificate, con nuclei ingranditi e irregolari. Il lume della ghiandola in basso a destra contiene
    detriti e cellule infiammatorie. A sinistra si vede una banda di stroma fibroso rosa.
  en: >-
    Pancreatic ductal adenocarcinoma at high power. The neoplastic glands are lined by stratified columnar cells with
    enlarged, irregular nuclei. The lumen of the gland at lower right holds debris and inflammatory cells. A band of pink
    fibrous stroma lies at the left.
alt:
  it: >-
    Micrografia a forte ingrandimento di ghiandole tumorali con cellule colonnari a nuclei scuri e irregolari, un ampio
    lume con detriti in basso a destra e stroma rosa a sinistra.
  en: >-
    High-power micrograph of tumor glands made of columnar cells with dark, irregular nuclei, a wide lumen with debris at
    lower right and pink stroma at the left.
