lookFor:
  it: >-
    Confronta le zone rosa-biancastre e opache con la superficie liscia, giallo-arancio, del cuore: lo strato
    biancastro è l'essudato sulla superficie.
  en: >-
    Compare the dull, pink-white patches with the smooth yellow-orange surface of the heart: the whitish layer is the
    exudate lying on the surface.
caption:
  it: >-
    Superficie esterna del cuore con pericardite fibrinosa focale (esame macroscopico). Guarda prima il fondo: il
    tessuto adiposo epicardico è liscio, lucido e giallo-arancio. Poi osserva le placche irregolari, rosa-biancastre e
    opache, che lo ricoprono a chiazze, con bordi sfilacciati dove l'essudato si solleva: è il deposito fibrinoso sulla
    superficie epicardica. In alto compare un righello, utile per stimare la dimensione delle placche.
  en: >-
    Outer surface of the heart with focal fibrinous pericarditis (gross view). Look at the background first: the
    epicardial fat is smooth, glistening and yellow-orange. Then see the irregular, dull pink-white patches that
    cover it in places, with ragged edges where the exudate lifts: this is the fibrinous deposit on the epicardial
    surface. A ruler at the top helps you judge the size of the patches.
alt:
  it: >-
    Fotografia macroscopica di un cuore visto da vicino: superficie giallo-arancio con ampie placche irregolari
    rosa-biancastre e opache, a bordi sfilacciati; in alto un righello graduato.
  en: >-
    Close gross photograph of a heart: a yellow-orange surface with broad, irregular, dull pink-white patches that have
    ragged edges; a graduated ruler at the top.
