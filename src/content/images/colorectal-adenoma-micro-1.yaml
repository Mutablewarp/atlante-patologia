lookFor:
  it: "Confronta a sinistra le ghiandole tondeggianti con a destra le lunghe frange digitiformi."
  en: "Compare the rounded glands on the left with the long finger-like fronds on the right."
caption:
  it: >-
    Adenoma tubulo-villoso, EE a basso ingrandimento, pezzo operatorio. Orientati con lo stelo di connettivo rosa e
    con il tessuto adiposo in basso. A sinistra le ghiandole sono tondeggianti e fitte: è la componente tubulare. A
    destra l'epitelio forma frange lunghe e parallele, come dita, attorno a un asse di connettivo: è la componente
    villosa. In entrambe le parti l'epitelio è più violaceo della mucosa normale, perché i nuclei sono allungati e
    affollati.
  en: >-
    Tubulovillous adenoma, H&E at low power, surgical specimen. Orient yourself with the pink connective stalk and the
    fat tissue at the bottom. On the left the glands are rounded and crowded: this is the tubular component. On the
    right the epithelium forms long, parallel, finger-like fronds around a connective core: this is the villous
    component. In both parts the epithelium is more purple than normal mucosa, because the nuclei are elongated and
    crowded.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: a sinistra ghiandole violacee tondeggianti e ravvicinate,
    a destra lunghe frange parallele rivestite da epitelio violaceo, con al centro uno stelo di connettivo rosa e in
    basso tessuto adiposo.
  en: >-
    Low-power H&E micrograph: on the left, rounded, closely packed purple glands; on the right, long parallel fronds
    lined by purple epithelium, with a pink connective stalk in the center and fat tissue below.
