lookFor:
  it: "Cerca il confine tra due aree con architettura diversa: lamine solide di cellule atipiche a destra, trabecole e spazi reticolari a sinistra."
  en: "Look for the boundary between two areas of different architecture: solid sheets of atypical cells on the right, cords and reticular spaces on the left."
caption:
  it: >-
    Tumore germinale misto del testicolo, EE a medio ingrandimento. Guarda l'insieme: due aree con architettura
    diversa convivono nello stesso campo. A destra, lamine e ghiandole irregolari di cellule grandi con nuclei
    ipercromatici e sovrapposti, il quadro del carcinoma embrionale. A sinistra, trabecole sottili che delimitano
    spazi vuoti a rete, un pattern reticolare del tumore del sacco vitellino. In basso, una zona rossa di emorragia.
    Trovare più componenti nello stesso tumore è ciò che rende «misto» il tumore.
  en: >-
    Mixed germ cell tumor of the testis, H&E at medium power. Take in the whole field: two areas of different
    architecture sit side by side. On the right, sheets and irregular glands of large cells with overlapping
    hyperchromatic nuclei, the picture of embryonal carcinoma. On the left, thin cords bounding a network of empty
    spaces, a reticular pattern of yolk sac tumor. At the bottom, a red zone of hemorrhage. Finding more than one
    component in the same tumor is what makes it "mixed".
alt:
  it: >-
    Micrografia in ematossilina-eosina: a destra lamine violacee dense di cellule atipiche con spazi ghiandolari
    irregolari; a sinistra trabecole sottili intorno a spazi vuoti a rete; in basso una macchia rossa di globuli
    rossi.
  en: >-
    H&E micrograph: on the right, dense purple sheets of atypical cells with irregular glandular spaces; on the left,
    thin cords around a network of empty spaces; at the bottom, a red patch of red blood cells.
