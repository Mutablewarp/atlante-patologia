lookFor:
  it: Parti dalla superficie e scendi verso il basso, poi confronta le cellule tumorali con lo strato di cheratina chiara in alto.
  en: Start at the surface and move down, then compare the tumor cells with the pale keratin layer at the top.
caption:
  it: >-
    Carcinoma squamoso dell'esofago, EE a medio ingrandimento. In alto c'è uno strato chiaro di cheratina con nuclei
    residui; sotto, nidi e cordoni di cellule tumorali dai nuclei scuri e irregolari invadono il tessuto. Il tumore è
    cheratinizzante, moderatamente differenziato. Le caratteristiche sono quelle di un carcinoma squamoso di qualsiasi
    sede.
  en: >-
    Esophageal squamous cell carcinoma, H&E at medium power. At the top is a pale keratin layer with retained nuclei;
    below it, nests and cords of tumor cells with dark, irregular nuclei invade the tissue. The tumor is keratinizing
    and moderately differentiated. The features are those of a squamous cell carcinoma at any site.
alt:
  it: >-
    Micrografia in ematossilina-eosina: in alto una fascia rosa pallido di cheratina con piccoli nuclei; sotto, aggregati
    di cellule viola scuro con nuclei irregolari e una fessura vuota centrale.
  en: >-
    H&E micrograph: at the top a pale pink band of keratin with small nuclei; below it, clusters of dark purple cells
    with irregular nuclei and an empty cleft in the center.
