lookFor:
  it: "Confronta il colore dei cilindri nei tubuli: quelli magenta intenso sono PAS-positivi, quelli pallidi no."
  en: "Compare the color of the casts inside the tubules: deep magenta ones are PAS-positive, pale ones are not."
caption:
  it: >-
    Biopsia renale con nefropatia da cilindri, colorazione PAS a medio ingrandimento. I tubuli, con epitelio
    appiattito, corrono in diagonale in uno stroma pallido e rado. Molti lumi contengono materiale: alcuni cilindri
    sono rosa pallido, altri magenta intenso. La fonte indica che i cilindri ialini sono PAS-positivi e quelli
    mielomatosi PAS-negativi.
  en: >-
    Kidney biopsy with light-chain cast nephropathy, PAS stain at medium power. Tubules with flattened epithelium run
    diagonally through a pale, loose stroma. Many lumens hold material: some casts are pale pink, others deep magenta.
    The source states that hyaline casts are PAS-positive and myelomatous casts are PAS-negative.
alt:
  it: >-
    Micrografia PAS di un frustolo di biopsia renale: tubuli allungati con nuclei azzurrognoli in uno stroma rosa
    chiaro; alcuni lumi contengono cilindri rosa pallido, altri una massa magenta intenso.
  en: >-
    PAS micrograph of a kidney biopsy fragment: elongated tubules with bluish nuclei in a light pink stroma; some
    lumens contain pale pink casts, others a deep magenta mass.
