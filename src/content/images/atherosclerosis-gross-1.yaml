caption:
  it: "Aorta aperta longitudinalmente (preparato autoptico fresco): placche aterosclerotiche gialle e biancastre, con aree di emorragia e ulcerazione, che coprono gran parte dell'intima."
  en: "Aorta opened lengthwise (fresh autopsy specimen): yellow and whitish atherosclerotic plaques with areas of hemorrhage and ulceration covering much of the intima."
