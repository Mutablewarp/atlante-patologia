lookFor:
  it: "Cerca il nodulo rotondo al margine del rene, più scuro e disomogeneo del parenchima circostante, e osserva come si appoggia al seno renale."
  en: "Find the round nodule at the edge of the kidney, darker and more uneven than the surrounding parenchyma, and see how it sits against the renal sinus."
caption:
  it: >-
    Rene sezionato con un carcinoma a cellule renali (a cellule chiare), pezzo fissato conservato in un contenitore da
    museo. Il tumore è il nodulo rotondo a sinistra, ben delimitato, con superficie di taglio disomogenea e zone scure.
    A destra il parenchima residuo è bruno e il seno renale chiaro. Il colore è alterato dalla fissazione.
  en: >-
    Cut kidney with a renal cell carcinoma (clear cell type), a fixed specimen kept in a museum jar. The tumor is the
    round, well-defined nodule on the left, with an uneven cut surface and dark areas. On the right, the remaining
    parenchyma is brown and the renal sinus is pale. Fixation has altered the colors.
alt:
  it: >-
    Fotografia di un rene tagliato a metà in un contenitore trasparente: a sinistra un nodulo rotondo bruno scuro e
    disomogeneo, a destra il parenchima bruno e al centro il seno renale chiaro.
  en: >-
    Photograph of a kidney cut in half inside a clear box: on the left a round, dark brown, uneven nodule; on the right
    brown parenchyma, with the pale renal sinus in the center.
