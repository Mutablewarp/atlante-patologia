caption:
  it: >-
    Acantosi nigricans in sede ascellare. Guarda la cute: è scura, ispessita e con un aspetto vellutato, a placche che si
    estendono ai due lati di una zona più rosea al centro. È uno dei segni cutanei che possono accompagnare un tumore
    interno e fare da primo indizio di una sindrome paraneoplastica.
  en: >-
    Acanthosis nigricans in the axilla. Look at the skin: it is dark, thickened and velvety, in plaques that spread on
    both sides of a pinker area in the middle. It is one of the skin signs that can accompany an internal cancer and
    serve as a first clue to a paraneoplastic syndrome.
alt:
  it: >-
    Fotografia ravvicinata di un'ascella: la cute ha larghe placche brune, ruvide e vellutate, con peli radi, e al centro
    una striscia più rosea; alcuni piccoli fibromi penduli sono sparsi intorno.
  en: >-
    Close-up photograph of an armpit: the skin has broad brown, rough, velvety plaques with sparse hairs and a pinker
    strip in the middle; a few small skin tags are scattered around.
