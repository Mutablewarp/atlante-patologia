lookFor:
  it: "Trova un nucleo rotondo, poi spostati verso il bordo della cellula: lì si raccolgono i fini granuli bruno-dorati."
  en: "Find a round nucleus, then move to the edge of its cell: the fine golden-brown granules gather there."
caption:
  it: >-
    La stessa biopsia a forte ingrandimento, un dettaglio del campo a piccolo ingrandimento; le punte di freccia gialle
    sono degli autori. Ora la polvere si risolve in granuli. Ogni epatocita è una grande cellula poligonale con un
    nucleo rotondo e centrale; nel citoplasma stanno granuli bruno-dorati, fini e tutti della stessa misura, raccolti
    soprattutto verso i margini dove una cellula tocca la vicina, più che sparsi in modo uniforme. Stanno dentro gli
    epatociti, non nelle piccole cellule di Kupffer lungo i sinusoidi. Gli autori non hanno trovato altre lesioni nella
    biopsia. Ecco l'aspetto della lipofuscina in una cellula parenchimale: un pigmento fine, pallido e di calibro
    regolare, segno visibile che il danno ossidativo ha superato la capacità di smaltimento della cellula.
    L'emosiderina, invece, forma di solito globuli più grossolani e più scuri e nei normali depositi di ferro sta
    soprattutto nei macrofagi, come le cellule di Kupffer, anche se nell'emocromatosi se ne riempiono pure gli
    epatociti, come mostra l'immagine con il blu di Prussia di questa scheda. Quando in EE non si riesce a
    distinguerle decide la colorazione per il ferro, che trovi in questa stessa serie.
  en: >-
    The same biopsy at high power, a detail of the low-power field; the yellow arrowheads are the authors'. Now the
    dust resolves into granules. Each hepatocyte is a large polygonal cell with a round, central nucleus; its cytoplasm
    holds fine golden-brown granules of even size, gathered mostly towards the margins where one cell meets the next
    rather than spread evenly. They lie inside the hepatocytes, not in the small Kupffer cells along the sinusoids. The
    authors found no other lesion in the biopsy. This is lipofuscin in a parenchymal cell: a fine, pale, even-sized
    pigment, the visible sign that oxidative damage has outpaced the cell's clean-up. Haemosiderin, by contrast,
    usually forms coarser and darker globules and in ordinary iron stores sits mainly in macrophages such as Kupffer
    cells, although in haemochromatosis the hepatocytes fill with it too, as the Prussian blue image on this card
    shows. When H&E cannot tell the two apart, the iron stain decides: you will find it in this same set.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina a forte ingrandimento: epatociti rosa, grandi e poligonali, con nuclei
    rotondi viola; nel citoplasma fini granuli bruno-dorati, più fitti lungo i margini tra cellule vicine; cinque punte
    di freccia gialle indicano gruppi di granuli; in alto a sinistra la lettera b in un riquadro bianco, in basso a
    destra una barra di scala nera da 50 µm.
  en: >-
    High-power H&E micrograph of liver: large, polygonal pink hepatocytes with round purple nuclei; fine golden-brown
    granules in the cytoplasm, densest along the margins between neighbouring cells; five yellow arrowheads point to
    groups of granules; the letter b in a white box at the top left and a black 50 µm scale bar at the bottom right.
