caption:
  it: "Carcinoma colorettale con instabilità dei microsatelliti (MSI-H), immunocolorazione per MLH1: i nuclei delle cellule tumorali non si colorano, mentre linfociti e stroma restano positivi (controllo interno). Mostra come si dimostra la perdita di una proteina del mismatch repair; la sola perdita di MLH1 non distingue da sola il tumore di Lynch da quello sporadico."
  en: "Colorectal carcinoma with microsatellite instability (MSI-H), MLH1 immunostain: the tumor cell nuclei are unstained, while lymphocytes and stroma stay positive (internal control). It shows how loss of a mismatch repair protein is demonstrated; MLH1 loss alone does not separate a Lynch tumor from a sporadic one."
alt:
  it: "Immunoistochimica per MLH1 a ingrandimento medio: ghiandole e nidi tumorali con nuclei pallidi non colorati, tra cui sparsi nuclei bruni di cellule stromali e linfociti."
  en: "MLH1 immunohistochemistry at medium power: tumor glands and nests with pale unstained nuclei, with scattered brown nuclei of stromal cells and lymphocytes between them."
