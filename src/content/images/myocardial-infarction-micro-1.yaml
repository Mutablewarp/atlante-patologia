lookFor:
  it: "Cerca gli addensamenti di piccole cellule con nucleo scuro tra le fibre rosa e confrontali con le fibre muscolari vicine."
  en: "Look for clusters of small dark-nucleated cells between the pink fibers and compare them with the neighboring muscle fibers."
caption:
  it: >-
    Infarto miocardico, EE a medio ingrandimento. Parti dalle fibre rosa del miocardio, che occupano quasi tutto il
    campo. Poi cerca, al centro e in alto a sinistra, le strisce di cellule piccole dal nucleo viola scuro tra le
    fibre: sono i neutrofili, il segno che l'infarto ha almeno uno o due giorni. Accanto agli infiltrati, più
    al centro, c'è una zona rossa di globuli rossi stravasati.
  en: >-
    Myocardial infarct, H&E at medium power. Start with the pink myocardial fibers that fill most of the field. Then
    look at the center and upper left for streaks of small cells with dark purple nuclei between the fibers: these are
    neutrophils, the sign that the infarct is at least a day or two old. Beside the infiltrates, near the center, is a
    red area of extravasated red blood cells.
alt:
  it: >-
    Micrografia in ematossilina-eosina di miocardio: fibre muscolari rosa disposte in fasci ondulati, con strisce e
    addensamenti di piccole cellule dal nucleo viola scuro tra le fibre e una zona rossa di globuli rossi al centro.
  en: >-
    H&E micrograph of myocardium: pink muscle fibers in wavy bundles, with streaks and clusters of small cells with
    dark purple nuclei between the fibers and a red area of red blood cells at the center.
