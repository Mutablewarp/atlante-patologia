lookFor:
  it: "Segui le papille rosa verso l'alto nell'epitelio e confronta la loro altezza con lo spessore dell'epitelio."
  en: "Follow the pink papillae up into the epithelium and compare how tall they are with the thickness of the epithelium."
caption:
  it: >-
    Biopsia esofagea con esofagite da reflusso, EE a basso ingrandimento. Guarda prima l'epitelio pavimentoso
    stratificato: è spesso e la sua parte profonda, più viola, è ampia. Poi segui le papille del connettivo, i
    cerchi rosa chiaro con un piccolo vaso al centro: salgono molto in alto nello spessore dell'epitelio. Spessore
    del basale e papille allungate sono i due segni da cercare a questo ingrandimento.
  en: >-
    Esophageal biopsy with reflux esophagitis, H&E at low power. Look first at the stratified squamous epithelium: it
    is thick and its deep, more purple part is broad. Then follow the connective tissue papillae, the pale pink circles
    with a small vessel in the middle: they climb high into the thickness of the epithelium. A thick basal zone and
    elongated papillae are the two signs to look for at this power.
alt:
  it: >-
    Micrografia a basso ingrandimento, in ematossilina-eosina, di un frammento bioptico di epitelio pavimentoso
    stratificato esofageo: fascia violacea profonda e molte papille rosa chiaro tondeggianti che risalgono nell'epitelio,
    con strato superficiale rosa e alcune cellule infiammatorie ai bordi inferiori.
  en: >-
    Low-power H&E micrograph of a biopsy fragment of esophageal stratified squamous epithelium: a deep purple band and
    many rounded pale pink papillae reaching up into the epithelium, with a pink superficial layer and a few
    inflammatory cells along the lower edges.
