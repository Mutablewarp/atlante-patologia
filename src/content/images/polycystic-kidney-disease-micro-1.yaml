lookFor:
  it: "Cerca le grandi cavità cistiche con sottile parete e, accanto, il parenchima residuo con tubuli atrofici e infiammazione."
  en: "Find the large cystic spaces with thin walls and, next to them, the remaining parenchyma with atrophic tubules and inflammation."
caption:
  it: >-
    Malattia policistica renale, EE a basso ingrandimento. Parti dalle grandi cavità vuote a sinistra: sono cisti con
    una parete sottile, in parte rivestita da un sottile strato di cellule. Alcune cisti, in alto, contengono materiale
    rosa omogeneo. Poi guarda a destra: il parenchima tra le cisti è ridotto, con tubuli piccoli e dilatati e
    un infiltrato di cellule infiammatorie, cioè il tessuto renale residuo sotto pressione delle cisti.
  en: >-
    Polycystic kidney disease, H&E at low power. Start with the large empty cavities on the left: these are cysts with
    a thin wall, partly lined by a thin layer of cells. Some cysts at the top contain homogeneous pink material. Then
    look to the right: the parenchyma between the cysts is reduced, with small dilated tubules and an infiltrate of
    inflammatory cells, that is, the remaining kidney tissue under pressure from the cysts.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: a sinistra ampie cavità vuote delimitate da sottili pareti
    rosa; in alto a destra cavità con materiale rosa omogeneo; in basso a destra tessuto violaceo con piccoli tubuli e
    molte cellule infiammatorie.
  en: >-
    Low-power H&E micrograph: at the left, wide empty cavities bounded by thin pink walls; at the upper right, cavities
    filled with homogeneous pink material; at the lower right, purple tissue with small tubules and many inflammatory
    cells.
