orientation:
  it: "Superficie mucosa vista di fronte, colon aperto per il lungo"
  en: "Mucosal surface seen face-on, colon opened lengthwise"
lookFor:
  it: "Guarda prima la superficie: quante placche separate ci sono e di che colore è la mucosa tra una placca e l'altra."
  en: "Look at the surface first: how many separate plaques there are, and what color the mucosa is between them."
caption:
  it: >-
    Colon aperto, veduta della superficie mucosa. Guarda prima le placche: sono numerose, rilevate, giallo-verdastre,
    e in alcune zone si fondono tra loro. Tra una placca e l'altra la mucosa è rossa. Sono le pseudomembrane, un
    essudato fibrinoso e infiammatorio che si appoggia sulla mucosa. Il righello in basso dà la scala in centimetri.
  en: >-
    Opened colon, mucosal surface seen face-on. Look at the plaques first: they are numerous, raised and yellow-green,
    and in some areas they merge. Between plaques the mucosa is red. These are the pseudomembranes, a fibrin-rich
    inflammatory exudate lying on the mucosa. The ruler at the bottom gives the scale in centimeters.
alt:
  it: >-
    Fotografia di un segmento di colon aperto su fondo blu, con molte placche giallo-verdastre rilevate sulla mucosa
    rossa; un righello in centimetri è posto sotto il pezzo.
  en: >-
    Photograph of an opened colon segment on a blue background, with many raised yellow-green plaques on red mucosa; a
    centimeter ruler lies below the specimen.
