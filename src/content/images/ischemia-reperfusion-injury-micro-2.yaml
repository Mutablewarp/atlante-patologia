caption:
  it: >-
    Infarto miocardico riperfuso, EE: danno del microcircolo con emorragia interstiziale. A piccolo ingrandimento
    riconosci le fibre miocardiche allungate che attraversano il campo in orizzontale, in alto e in basso. Tra le
    fibre, al posto del normale interstizio sottile, c'è un'ampia fascia piena di globuli rossi liberi, piccoli e
    arancio-rosati: sono usciti dai vasi. Al centro, verso destra, un piccolo vaso tagliato di traverso contiene globuli
    rossi e leucociti; nuclei scuri di cellule infiammatorie sono sparsi in tutto il campo. Concetto chiave: la
    riperfusione riporta sangue in capillari già lesi dall'ischemia, che lo lasciano stravasare. Per questo l'infarto
    riperfuso è emorragico, e i neutrofili vi arrivano prima e lo invadono tutto, non solo ai margini.
  en: >-
    Reperfused myocardial infarct, H&E: microvascular damage with interstitial hemorrhage. At low power, recognize the
    long myocardial fibers crossing the field horizontally at the top and bottom. Between the fibers, where there
    should be only a thin interstitium, a broad band is packed with free, small, orange-pink red blood cells: they have
    leaked out of the vessels. At the center, toward the right, a small vessel cut in cross-section holds red cells and
    leukocytes; dark nuclei of inflammatory cells are scattered across the field. Key concept: reperfusion pushes
    blood back into capillaries already injured by ischemia, and they let it escape. That is why a reperfused infarct
    is hemorrhagic, and why neutrophils reach it sooner and spread through all of it, not only its edges.
alt:
  it: >-
    Micrografia di miocardio in ematossilina-eosina a medio ingrandimento: fibre muscolari rosa allungate in
    orizzontale; tra di esse molti piccoli globuli rossi liberi arancio-rosati e nuclei scuri sparsi; a destra del
    centro la sezione rotonda di un piccolo vaso con cellule nel lume.
  en: >-
    Medium-power H&E micrograph of myocardium: long pink muscle fibers run horizontally; between them lie many small,
    free orange-pink red blood cells and scattered dark nuclei; right of center, the round cross-section of a small
    vessel with cells in its lumen.
