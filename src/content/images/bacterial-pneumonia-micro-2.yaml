lookFor:
  it: "Parti dall'epitelio bronchiolare a sinistra e segui il lume: è pieno di neutrofili."
  en: "Start at the bronchiolar epithelium on the left and follow the lumen: it is full of neutrophils."
caption:
  it: >-
    Broncopolmonite precoce, colorazione ematossilina-eosina, ad alto ingrandimento. Parti dalla parete
    bronchiolare a sinistra, rivestita da epitelio colonnare. Il lume e lo spazio attorno sono riempiti da
    neutrofili. Così l'infezione si estende dal bronchiolo terminale al parenchima peribronchiolare.
  en: >-
    Early bronchopneumonia, hematoxylin-eosin stain, high power. Start at the bronchiolar wall on the left, lined by
    columnar epithelium. The lumen and the space around it are filled with neutrophils. This is how infection
    spreads from the terminal bronchiole into the peribronchiolar parenchyma.
alt:
  it: >-
    Micrografia di polmone in ematossilina-eosina: a sinistra un epitelio colonnare curvo; al centro e a destra
    moltissime cellule rotonde con nuclei violacei, i neutrofili, in uno spazio chiaro.
  en: >-
    H&E micrograph of lung: at the left a curved columnar epithelium; in the center and right many round cells with
    purple nuclei, neutrophils, in a pale space.
