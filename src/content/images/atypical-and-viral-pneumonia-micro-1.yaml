lookFor:
  it: >-
    Cerca gli alveoli riempiti da materiale pallido e schiumoso, poi guarda i setti tra di essi.
  en: >-
    Look for alveoli filled with pale, foamy material, then look at the septa between them.
caption:
  it: >-
    Polmonite da Pneumocystis, biopsia transbronchiale, EE a basso ingrandimento. Parti dagli spazi alveolari: molti
    contengono un materiale pallido, rosato e schiumoso, in cui gli organismi non si vedono con questa colorazione. I
    setti tra gli alveoli appaiono ispessiti e ricchi di cellule. Per dimostrare l'organismo serve una colorazione
    speciale, come l'argento metenamina.
  en: >-
    Pneumocystis pneumonia, transbronchial biopsy, H&E at low power. Start with the alveolar spaces: many hold a pale,
    pink, foamy material, and the organisms cannot be seen with this stain. The septa between the alveoli look thick
    and cellular. A special stain, such as methenamine silver, is needed to show the organism.
alt:
  it: >-
    Micrografia a basso ingrandimento di una biopsia polmonare in ematossilina-eosina: spazi alveolari con materiale
    rosato e schiumoso, separati da setti ispessiti con molte cellule.
  en: >-
    Low-power H&E micrograph of a lung biopsy: alveolar spaces with pink, foamy material, separated by thickened septa
    with many cells.
