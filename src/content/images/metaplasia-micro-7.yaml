orientation:
  it: "Lume vescicale in alto; urotelio all'estrema sinistra, placca squamosa al centro e a destra; parete profonda in basso."
  en: "Bladder lumen at the top; urothelium at the far left, squamous plaque in the centre and on the right; deeper wall at the bottom."
lookFor:
  it: "Segui la superficie da sinistra a destra: urotelio sottile, poi un passaggio brusco a una spessa placca squamosa rosa coperta di cheratina; sotto, edema e capillari congesti."
  en: "Follow the surface from left to right: thin urothelium, then an abrupt switch to a thick pink squamous plaque topped by keratin; below it, oedema and congested capillaries."
caption:
  it: >-
    Metaplasia squamosa cheratinizzante della vescica in una cistite cronica, EE a piccolo ingrandimento. È lo stesso
    preparato dell'immagine a medio ingrandimento di questa scheda, quindi puoi passare da una vista all'altra. A
    piccolo ingrandimento leggi la superficie da sinistra a destra. All'estrema sinistra il rivestimento è l'urotelio
    normale, uno strato sottile viola scuro. Poi cambia di colpo e diventa un'ampia placca di epitelio pavimentoso
    pluristratificato, molto più spessa e rosa, dalla cui superficie si staccano lamelle di cheratina; la vescica
    normalmente non produce cheratina. Guarda poi sotto la placca: la lamina propria è pallida ed edematosa,
    attraversata da numerosi piccoli capillari congesti diretti verso la superficie, e più in profondità ci sono gruppi
    di cellule infiammatorie croniche e vasi dilatati, segni del danno persistente che sostiene il cambiamento. Il
    messaggio chiave: la placca è un epitelio squamoso maturo e ordinato in una sede che dovrebbe essere rivestita da
    urotelio; è un cambiamento del tipo cellulare, non un tumore. I calcoli sono lo stimolo classico, ma qualunque
    infiammazione di lunga durata della vescica può provocarla. Passa al medio ingrandimento per studiare da vicino la
    giunzione e la cheratina.
  en: >-
    Keratinising squamous metaplasia of the urinary bladder in chronic cystitis, H&E at low power. It is the same
    specimen as the intermediate-power image of this card, so you can switch between the two views. At low power, read
    the surface from left to right. On the far left the lining is the normal urothelium, a thin, dark-purple layer.
    Then it changes abruptly into a broad plaque of stratified squamous epithelium, much thicker and pink, with sheets
    of keratin peeling off its surface; the bladder does not normally make keratin. Next look under the plaque: the
    lamina propria is pale and oedematous, crossed by many small congested capillaries that run towards the surface,
    and deeper down there are clusters of chronic inflammatory cells and dilated vessels, signs of the persistent
    injury that drives the change. Key message: the plaque is mature, orderly squamous epithelium in a place that
    should be lined by urothelium; it is a change of cell type, not a tumour. Stones are the classic trigger, but any
    long-standing inflammation of the bladder can produce it. Switch to intermediate power to study the junction and
    the keratin at close range.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento di parete vescicale: nella parte alta una spessa banda
    epiteliale rosa sormontata da sottili lamine rosa ondulate che si sollevano dalla superficie; all'estrema sinistra
    un rivestimento sottile viola; sotto la banda una zona pallida attraversata da numerosi piccoli vasi rossi e, più in
    profondità, un connettivo viola con gruppi di cellule scure e vasi aperti; sfondo bianco in alto.
  en: >-
    Low-power H&E micrograph of bladder wall: across the upper part, a thick pink epithelial band topped by thin, wavy
    pink sheets that lift off its surface; at the far left, a thin purple lining; beneath the band, a pale zone crossed
    by many small red vessels and, deeper, purple connective tissue with clusters of dark cells and open vessels; white
    background above.
