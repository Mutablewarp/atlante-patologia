lookFor:
  it: Cerca le aree blu-violacee scure sotto la pleura e nota che si appoggiano alla superficie del polmone.
  en: Find the dark blue-purple areas under the pleura and note that they rest on the lung surface.
caption:
  it: >-
    Polmone all'autopsia, visto dalla superficie pleurica. Guarda le aree scure, blu-violacee, con contorno netto
    contro il polmone rosa circostante. Si trovano sotto la pleura, dove l'infarto emorragico ha la sua base.
  en: >-
    Lung at autopsy, seen from the pleural surface. Look at the dark blue-purple areas with a sharp edge against the
    surrounding pink lung. They lie just under the pleura, where a hemorrhagic infarct has its base.
alt:
  it: >-
    Fotografia di un polmone all'autopsia: polmone rosa con diverse aree scure blu-violacee sotto la pleura, una a
    forma di cuneo allungato al centro e altre più piccole in basso e a destra.
  en: >-
    Photograph of a lung at autopsy: pink lung with several dark blue-purple areas under the pleura, an elongated
    wedge-shaped one in the center and smaller ones at the bottom and right.
