# Same Wellcome teaching set (SB Lucas, "Tuberculous lymphadenitis") as the Ziehl-Neelsen image caseous-necrosis-micro-5.
group: tuberculous-lymphadenitis-lucas
stain: H&E
magnification: medium power
caption:
  it: >-
    Linfadenite tubercolare con necrosi caseosa iniziale, EE, medio ingrandimento. Prima il quadro d'insieme: la normale
    architettura del linfonodo è sostituita da numerosi granulomi accostati, ciascuno un ammasso rotondeggiante di
    macrofagi epitelioidi chiari con nuclei ovali e vescicolosi; tra un granuloma e l'altro corrono fasce scure di piccoli
    linfociti (in alto al centro), che restano anche negli angoli. Poi guarda il centro dei granulomi. In alto al centro e
    a destra la parte centrale del granuloma è diventata un'area omogenea, finemente granulare, rosa acceso, con pochi o
    nessun nucleo integro: è la caseificazione che comincia, prima che le aree necrotiche si allarghino e confluiscano
    nei grandi centri amorfi del tubercolo maturo. A sinistra del centro c'è una cellula gigante multinucleata, una
    grande cellula rosa con molti nuclei ammassati, nata dalla fusione di macrofagi. In basso al centro, il centro di un
    altro granuloma contiene un gruppo di piccoli nuclei scuri e di frammenti nucleari. Perché conta: la necrosi parte
    dal centro del granuloma, dove i macrofagi attivati muoiono nella reazione di ipersensibilità ritardata (mediata dai
    linfociti T) contro i bacilli; estendendosi, può sostituire gran parte del linfonodo con materiale caseoso.
    Confronta con la sarcoidosi, in cui i granulomi sono di regola non necrotizzanti.
  en: >-
    Tuberculous lymphadenitis with early caseous necrosis, H&E, medium power. Get the overview first: the normal lymph
    node architecture is replaced by many granulomas packed side by side, each a rounded cluster of pale epithelioid
    macrophages with oval, vesicular nuclei; dark bands of small lymphocytes run between them (top centre) and survive
    in the corners. Then look at the centres of the granulomas. At the top centre and on the right, the middle of a
    granuloma has turned into a homogeneous, finely granular, bright pink zone with few or no intact nuclei: this is
    caseation beginning, before the necrotic areas grow and merge into the large structureless centres of a mature
    tubercle. Left of centre sits a multinucleated giant cell, a large pink cell with many crowded nuclei, formed by
    fusion of macrophages. At the bottom centre, the middle of another granuloma holds a cluster of small dark nuclei
    and nuclear fragments. Why it matters: necrosis starts in the centre of the granuloma, where activated macrophages
    die in the delayed-type (T-cell-mediated) hypersensitivity reaction against the bacilli; as it spreads, much of the
    node can be replaced by cheesy material. Compare with sarcoidosis, whose granulomas are typically non-necrotising.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un linfonodo occupato da granulomi chiari di cellule epitelioidi, separati da
    fasce scure di linfociti. Al centro dei granulomi, in alto al centro e a destra, ci sono chiazze rosa acceso povere di
    cellule; a sinistra del centro una grande cellula gigante multinucleata con un ammasso scuro di nuclei.
  en: >-
    H&E micrograph of a lymph node filled with pale granulomas of epithelioid cells, separated by dark bands of
    lymphocytes. Bright pink, cell-poor patches lie in the centres of granulomas at the top centre and on the right; left
    of centre a large multinucleated giant cell holds a dark cluster of nuclei.
