lookFor:
  it: Segui i contorni rosa delle pareti alveolari e guarda che cosa riempie gli spazi tra di esse.
  en: Follow the pink outlines of the alveolar walls and look at what fills the spaces between them.
caption:
  it: >-
    Infarto polmonare acuto, EE a basso ingrandimento. Guarda i contorni rosa delle pareti alveolari: la struttura del
    polmone è ancora riconoscibile, ma le pareti sono pallide e senza nuclei evidenti. Gli spazi tra le pareti
    contengono sangue e detriti. Il frammento è sfilacciato ai bordi.
  en: >-
    Acute pulmonary infarct, H&E at low power. Look at the pink outlines of the alveolar walls: the lung architecture
    is still recognizable, but the walls are pale and show no obvious nuclei. The spaces between the walls hold blood
    and debris. The fragment is ragged at its edges.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: frammento di tessuto rosa-viola sfilacciato, con sottili
    pareti rosa che delimitano spazi granulari pieni di sangue e detriti; un piccolo vaso in alto a destra.
  en: >-
    Low-power H&E micrograph: a ragged pink-purple tissue fragment with thin pink walls outlining granular spaces
    filled with blood and debris; a small vessel at the upper right.
