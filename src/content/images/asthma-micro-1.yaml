caption:
  it: >-
    Parete bronchiale in un caso di asma, EE a forte ingrandimento. A destra c'è il lume, rivestito da un epitelio ricco
    di cellule mucipare dal citoplasma chiaro (metaplasia mucipara). Sotto l'epitelio corre una fascia rosa
    omogenea e ispessita: è la membrana basale. Più in profondità il tessuto è affollato da cellule infiammatorie, tra
    cui molti eosinofili con granuli rosso-arancio, e da fasci di muscolatura liscia.
  en: >-
    Bronchial wall in a case of asthma, H&E at high power. The lumen is on the right, lined by epithelium rich in
    clear-cytoplasm mucus cells (goblet cell metaplasia). Beneath the epithelium runs a homogeneous, thickened pink
    band: the basement membrane. Deeper down the tissue is crowded with inflammatory cells, many of them eosinophils
    with red-orange granules, and with bundles of smooth muscle.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a destra un lume bronchiale bianco con epitelio a cellule mucipare chiare; sotto
    l'epitelio una fascia rosa ispessita; a sinistra molte piccole cellule infiammatorie scure e fasci rosa di
    muscolatura liscia.
  en: >-
    H&E micrograph: on the right a white bronchial lumen with epithelium of pale mucus cells; beneath the epithelium a
    thickened pink band; on the left many small dark inflammatory cells and pink bundles of smooth muscle.
