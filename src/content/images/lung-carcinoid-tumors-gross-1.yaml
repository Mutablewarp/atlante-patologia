lookFor:
  it: "Segui il lume del bronco principale verso l'alto fino alla massa chiara che lo occupa, poi guarda il polmone a valle."
  en: "Follow the lumen of the main bronchus upward to the pale mass that fills it, then look at the lung beyond."
caption:
  it: >-
    Carcinoide bronchiale, macroscopico. Una neoplasia polipoide chiara cresce nel lume di un bronco maggiore e lo
    ostruisce; il polmone a valle appare compatto per la polmonite ostruttiva.
  en: >-
    Bronchial carcinoid, gross. A pale polypoid neoplasm grows within the lumen of a major bronchus and obstructs it;
    the lung beyond looks consolidated from obstructive pneumonia.
alt:
  it: "Sezione verticale di polmone su fondo scuro: in alto una massa rosa chiara e liscia nel bronco, sotto il parenchima bruno-giallastro con piccoli bronchi tagliati in sezione."
  en: "Vertical cut section of lung on a dark background: a smooth pale pink mass in the bronchus at the top, and tan-brown parenchyma below with small bronchi cut across."
