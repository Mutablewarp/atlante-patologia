lookFor:
  it: "Cerca le piccole masse color ocra-arancio: sono accumuli di bile. Poi guarda le aree vicine, dove si raccolgono i linfociti."
  en: "Look for the small ocher-orange masses: they are bile plugs. Then check the nearby areas where lymphocytes gather."
caption:
  it: >-
    Colestasi epatica, biopsia, H&E a basso ingrandimento. Nel parenchima rosa si vedono piccole masse color
    ocra-arancio, che sono bile ritenuta. Gli epatociti sono in gran parte conservati. Vicino a uno spazio portale
    si nota un infiltrato di piccole cellule infiammatorie. Il quadro di bile ritenuta è quello che si cerca quando un
    farmaco causa un danno colestatico.
  en: >-
    Liver cholestasis, biopsy, H&E at low power. In the pink parenchyma there are small ocher-orange masses, which
    are retained bile. Most hepatocytes are preserved. Near a portal area there is an infiltrate of small
    inflammatory cells. Retained bile is the picture to look for when a drug causes cholestatic injury.
alt:
  it: >-
    Micrografia a basso ingrandimento di un frustolo bioptico di fegato in H&E, lungo e stretto: parenchima rosa con
    nuclei viola e diverse piccole masse color arancio-ocra sparse, con gruppi di cellule infiammatorie vicino ad
    alcune.
  en: >-
    Low-power micrograph of a long, narrow liver biopsy core in H&E: pink parenchyma with purple nuclei and several
    scattered small orange-ocher masses, with groups of inflammatory cells next to some of them.
