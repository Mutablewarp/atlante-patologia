lookFor:
  it: "Guarda il fegato nel suo insieme, poi la zona dell'ilo e della vena cava in basso al centro: il materiale scuro e irregolare dentro il vaso è il trombo."
  en: "Look at the liver as a whole, then at the hilum and the vena cava at the lower center: the dark, irregular material inside the vessel is the thrombus."
caption:
  it: >-
    Sindrome di Budd-Chiari, fegato fissato in formalina (campione museale). I due lobi hanno superficie liscia e
    colore brunastro uniforme. Al centro, i grossi vasi aperti mostrano un materiale scuro e granuloso, il trombo
    che occlude la vena cava inferiore e si estende alle vene epatiche, cioè l'ostacolo al deflusso del sangue dal
    fegato.
  en: >-
    Budd–Chiari syndrome, formalin-fixed liver (museum specimen). Both lobes have a smooth surface and a uniform
    brownish color. At the center, the opened large vessels contain dark, granular material, the thrombus that blocks
    the inferior vena cava and extends into the hepatic veins, that is, the obstacle to blood leaving the liver.
alt:
  it: >-
    Fotografia di un fegato fissato in liquido giallastro, con due lobi bruni a superficie liscia ai lati e, al
    centro, vasi aperti con materiale scuro e irregolare all'interno.
  en: >-
    Photograph of a fixed liver in yellowish fluid, with two smooth brown lobes at the sides and, at the center,
    opened vessels containing dark, irregular material.
