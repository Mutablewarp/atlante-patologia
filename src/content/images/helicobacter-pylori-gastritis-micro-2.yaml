caption:
  it: >-
    Follicolo linfoide della mucosa gastrica, EE ad alto ingrandimento. A sinistra il mantello: linfociti piccoli, con
    nuclei rotondi, scuri e fitti. Al centro il centro germinativo, più chiaro: cellule più grandi con nuclei vescicolosi
    e abbondante citoplasma pallido, tra cui qualche corpo apoptotico. Questa immagine mostra la risposta
    immunitaria della mucosa; i batteri non si vedono in EE a questo ingrandimento e richiedono una colorazione
    speciale.
  en: >-
    Lymphoid follicle of the gastric mucosa, H&E at high power. On the left is the mantle: small lymphocytes with
    dense, dark, round nuclei. In the center is the paler germinal center: larger cells with vesicular nuclei and
    abundant pale cytoplasm, with a few apoptotic bodies among them. This image shows the immune response of the
    mucosa; the bacteria are not visible on H&E at this magnification and need a special stain.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: a sinistra piccoli linfociti con nuclei scuri e fitti, al
    centro e a destra cellule più grandi con nuclei chiari e citoplasma pallido, con rari frammenti apoptotici.
  en: >-
    High-power H&E micrograph: on the left small lymphocytes with dense dark nuclei, in the center and on the right
    larger cells with pale nuclei and pale cytoplasm, with a few apoptotic fragments.
lookFor:
  it: "Confronta i nuclei piccoli e scuri del mantello con i nuclei più grandi e chiari del centro germinativo."
  en: "Compare the small dark nuclei of the mantle with the larger, paler nuclei of the germinal center."
