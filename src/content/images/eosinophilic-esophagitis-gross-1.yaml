lookFor:
  it: "Segui le pieghe che circondano il lume: sono anelli concentrici a tutta circonferenza."
  en: "Follow the folds that surround the lumen: they are concentric rings running all the way around."
caption:
  it: >-
    Immagine endoscopica dell'esofago in un paziente con esofagite eosinofila. Guarda il lume scuro al centro e le
    pieghe che lo circondano: sono anelli concentrici ravvicinati, che danno alla parete un aspetto a cerchi, come gli
    anelli di un tronco.
  en: >-
    Endoscopic view of the esophagus in a patient with eosinophilic esophagitis. Look at the dark lumen in the center
    and the folds around it: they are closely spaced concentric rings that give the wall a ringed look, like the rings
    of a tree trunk.
alt:
  it: >-
    Immagine endoscopica a colori di un esofago visto lungo l'asse: lume scuro ovale al centro, circondato da numerosi
    anelli concentrici sottili della mucosa di colore giallo-rosato.
  en: >-
    Color endoscopic image of an esophagus seen along its axis: an oval dark lumen in the center, surrounded by many
    thin concentric rings of yellow-pink mucosa.
