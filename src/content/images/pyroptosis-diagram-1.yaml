caption:
  it: >-
    Piroptosi: via canonica e via non canonica (schema; le etichette sono in inglese). La linea tratteggiata divide il
    disegno in una cellula a riposo (a sinistra) e una cellula in piroptosi (a destra): leggilo da sinistra a destra.
    Via canonica: prodotti microbici (PAMP) e segnali di pericolo liberati dalle cellule danneggiate (DAMP) vengono
    riconosciuti nel citosol da sensori della famiglia NLR, come NLRP3 o NLRC4, che reclutano l'adattatore ASC e la
    pro-caspasi-1 in un grande complesso, l'inflammasoma. Nell'inflammasoma la pro-caspasi-1 si attiva in caspasi-1,
    che ha due bersagli chiave: trasforma pro-IL-1β e pro-IL-18 nelle citochine attive e taglia la gasdermina D
    (GSDMD). Il frammento N-terminale della gasdermina D (N-GSDMD) si inserisce nella membrana plasmatica e si
    assembla in pori ad anello. Dai pori escono IL-1β e IL-18, mentre entrano ioni e acqua: la cellula si rigonfia e
    scoppia (lisi osmotica), riversa all'esterno il suo contenuto e amplifica l'infiammazione. Via non canonica (in
    alto): il lipopolisaccaride (LPS) dei batteri Gram-negativi arrivato nel citosol si lega direttamente alle
    caspasi-4 e -5 nell'uomo (caspasi-11 nel topo), senza bisogno dell'inflammasoma; anche queste caspasi tagliano la
    gasdermina D. In alto a destra la caspasi-11 apre il canale pannexina-1, che libera ATP e stimola il recettore
    purinergico P2X7; l'uscita di potassio dalla cellula può a sua volta accendere NLRP3. Differenza chiave con
    l'apoptosi: l'apoptosi usa la caspasi-3, la cellula si riduce di volume e la membrana resta integra, quindi non
    c'è infiammazione; la piroptosi usa la caspasi-1 (o le caspasi-4/5/11), la cellula si rigonfia e va incontro a
    lisi, ed è un processo infiammatorio. Collegamento da esame: nella gotta i cristalli di urato attivano
    l'inflammasoma NLRP3, e le mutazioni con guadagno di funzione di NLRP3 causano sindromi autoinfiammatorie con
    febbri ricorrenti che rispondono al blocco di IL-1.
  en: >-
    Pyroptosis: canonical and non-canonical pathways (schematic). The dashed line splits the drawing into a resting
    cell (left) and a pyroptotic cell (right): read it from left to right. Canonical pathway: microbial products
    (PAMPs) and danger signals released by damaged cells (DAMPs) are sensed in the cytosol by NLR-family sensors such
    as NLRP3 or NLRC4, which recruit the adaptor ASC and pro-caspase-1 into a large complex, the inflammasome. Inside
    the inflammasome pro-caspase-1 becomes active caspase-1, which has two key targets: it turns pro-IL-1β and
    pro-IL-18 into active cytokines, and it cuts gasdermin D (GSDMD). The N-terminal fragment of gasdermin D (N-GSDMD)
    inserts into the plasma membrane and assembles into ring-shaped pores. IL-1β and IL-18 leave through the pores
    while ions and water flow in: the cell swells and bursts (osmotic lysis), spills its contents and amplifies
    inflammation. Non-canonical pathway (top): lipopolysaccharide (LPS) from Gram-negative bacteria that reaches the
    cytosol binds caspase-4 and caspase-5 in humans (caspase-11 in mice) directly, with no inflammasome needed; these
    caspases also cut gasdermin D. At top right, caspase-11 opens the pannexin-1 channel, which releases ATP and
    stimulates the purinergic P2X7 receptor; potassium leaving the cell can in turn switch on NLRP3. Key contrast with
    apoptosis: apoptosis uses caspase-3, the cell shrinks and its membrane stays intact, so there is no inflammation;
    pyroptosis uses caspase-1 (or caspase-4/5/11), the cell swells and lyses, and the process is inflammatory. Exam
    link: in gout, urate crystals activate the NLRP3 inflammasome, and gain-of-function NLRP3 mutations cause
    autoinflammatory syndromes with recurrent fevers that respond to IL-1 blockade.
alt:
  it: >-
    Schema di due metà di cellula separate da una linea verticale tratteggiata. A sinistra batteri, virus e tossine
    mandano frecce verso i sensori dell'inflammasoma: un bastoncello del sensore, NLRC4 e l'adattatore ASC portano al
    taglio della pro-caspasi-1; in alto l'LPS attiva le procaspasi-4/5/11. A destra la caspasi-1 attiva e le
    caspasi-4/5/11 tagliano la GSDMD in frammenti N-GSDMD, che si uniscono in anelli blu inseriti nella membrana; IL-1β
    e IL-18 escono da un anello mentre l'acqua entra. In alto a destra la pannexina-1 libera ATP e potassio e un
    recettore P2X7 forma un poro.
  en: >-
    Schematic of two cell halves separated by a vertical dashed line. On the left, bacteria, viruses and toxins send
    arrows to the inflammasome sensors: a sensor rod, NLRC4 and the adaptor ASC lead to cleavage of pro-caspase-1; at
    the top, LPS activates procaspase-4/5/11. On the right, active caspase-1 and caspase-4/5/11 cut GSDMD into N-GSDMD
    fragments that join into blue rings set in the membrane; IL-1β and IL-18 leave through a ring while water enters.
    At top right, pannexin-1 releases ATP and potassium and a P2X7 receptor forms a pore.
