caption:
  it: >-
    Tumore germinale misto del testicolo, superficie di taglio con righello in centimetri. Guarda prima il contorno:
    la massa occupa quasi tutto il testicolo ed è avvolta da una parete chiara e sottile. Poi osserva l'interno, che è
    molto vario: zone biancastre e compatte, numerose cavità cistiche e ampie aree rosso-brune di emorragia. Questo
    aspetto variegato è tipico dei tumori che contengono più di un tipo di cellula germinale.
  en: >-
    Mixed germ cell tumor of the testis, cut surface with a centimeter ruler. Look first at the outline: the mass fills
    most of the testis and is wrapped in a thin pale wall. Then look at the inside, which is very varied: pale solid
    areas, many cystic cavities and broad red-brown areas of hemorrhage. This variegated look is typical of tumors that
    contain more than one germ cell type.
alt:
  it: >-
    Fotografia di un testicolo sezionato su fondo nero, con un righello graduato a sinistra: l'interno è occupato da
    tessuto biancastro, da molte cavità di varie dimensioni e da zone rosso scure emorragiche.
  en: >-
    Photograph of a bisected testis on a black background with a graduated ruler on the left: the inside is filled by
    pale tissue, many cavities of different sizes and dark red hemorrhagic areas.
lookFor:
  it: "Confronta le zone solide biancastre con le cavità e con l'emorragia: la massa non è uniforme."
  en: "Compare the pale solid areas with the cavities and the hemorrhage: the mass is not uniform."
