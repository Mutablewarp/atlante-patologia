lookFor:
  it: "Cerca i nidi di cellule chiare e, tra di essi, le sottili bande di stroma pieno di piccoli linfociti scuri."
  en: "Look for nests of clear cells and, between them, thin bands of stroma full of small dark lymphocytes."
caption:
  it: >-
    Seminoma classico, EE a medio ingrandimento. Guarda l'architettura: nidi e lamine di cellule tumorali grandi e
    chiare sono separati da sottili setti fibrosi. In questi setti si vede un fitto infiltrato di piccoli linfociti dal
    nucleo scuro e rotondo, un reperto tipico del seminoma.
  en: >-
    Classic seminoma, H&E at medium power. Look at the architecture: nests and sheets of large, clear tumor cells are
    separated by thin fibrous septa. These septa hold a dense infiltrate of small lymphocytes with dark, round nuclei,
    a typical finding in seminoma.
alt:
  it: >-
    Micrografia a medio ingrandimento in ematossilina-eosina: gruppi di cellule grandi dal citoplasma chiaro, separati
    da bande rosa-violacee di stroma con numerosi piccoli nuclei scuri rotondi.
  en: >-
    Medium-power H&E micrograph: groups of large cells with clear cytoplasm, separated by pink-purple bands of stroma
    containing many small, dark, round nuclei.
