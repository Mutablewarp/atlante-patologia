lookFor:
  it: >-
    Segui il bordo tra l'urotelio e lo stroma sottostante: le cellule atipiche restano tutte sopra di esso.
  en: >-
    Follow the border between the urothelium and the stroma beneath it: the atypical cells all stay above it.
caption:
  it: >-
    Carcinoma uroteliale in situ della vescica, EE a medio ingrandimento. Guarda prima la striscia viola in alto: è
    l'urotelio, e le cellule hanno nuclei grandi, scuri e di forma irregolare in tutto lo spessore. Segui poi il suo
    margine inferiore: le cellule restano sopra lo stroma rosa, ricco di piccoli vasi congesti, e non lo penetrano.
    Questo è il carcinoma in situ: atipia a tutto spessore con il confine verso lo stroma rispettato. Passa
    all'ingrandimento maggiore per vedere i nuclei.
  en: >-
    Urothelial carcinoma in situ of the bladder, H&E at medium power. Look first at the purple strip at the top: this
    is the urothelium, and its cells have large, dark, irregular nuclei throughout its thickness. Then follow its lower
    edge: the cells stay above the pink stroma, rich in small congested vessels, and do not enter it. This is carcinoma
    in situ: full-thickness atypia with the border to the stroma respected. Move to the higher power to see the nuclei.
alt:
  it: >-
    Micrografia in ematossilina-eosina: in alto una banda di urotelio con nuclei scuri e ingranditi in tutto lo spessore;
    sotto, stroma rosa con piccoli vasi pieni di sangue e poche cellule sparse, senza cellule tumorali al suo interno.
  en: >-
    H&E micrograph: at the top a band of urothelium with enlarged dark nuclei throughout its thickness; below it, pink
    stroma with small blood-filled vessels and scattered cells, with no tumor cells inside it.
