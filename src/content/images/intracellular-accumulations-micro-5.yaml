lookFor:
  it: "Per un attimo ignora il grasso e cerca l'unica cellula rigonfia e pallida nel terzo superiore, sulla linea mediana: il piccolo ammasso rosa-violaceo subito sotto il suo nucleo scuro è il corpo di Mallory-Denk."
  en: "Ignore the fat for a moment and find the one swollen, pale cell in the top third, on the midline: the small pink-purple clump just below its dark nucleus is the Mallory–Denk body."
caption:
  it: >-
    Biopsia epatica con steatoepatite (diagnosi della fonte), EE, medio ingrandimento (ingrandimento originale 200×).
    Comincia dallo sfondo, che è affollato: molti epatociti contengono grasso, come un unico grande vacuolo rotondo e
    vuoto oppure come tante goccioline, mentre quelli in basso a destra sono ancora compatti e rosa. Poi cerca l'unica
    cellula che conta, nel terzo superiore del campo, sulla linea mediana verticale: è rigonfia e pallida, con un
    citoplasma rarefatto, quasi vuoto (degenerazione balloniforme), e ha un nucleo scuro. Subito sotto il nucleo c'è un
    piccolo ammasso ricurvo rosa-violaceo, simile a una corda attorcigliata: quell'ammasso è un corpo di Mallory-Denk, un
    groviglio di filamenti intermedi di citocheratina, cioè di una parte dello scheletro interno dell'epatocita, raccolti
    in un aggregato. Con il selettore
    vedi la stessa cellula a 400×. Nota anche il piccolo gruppo di cellule infiammatorie nella metà inferiore del
    campo. Da ricordare all'esame: da questo campo non puoi ricavare la causa. L'epatite alcolica è il contesto
    classico dei corpi di Mallory-Denk, ma la loro presenza non prova l'alcol: si vedono anche nella steatoepatite non
    alcolica.
  en: >-
    Liver biopsy with steatohepatitis (the source's diagnosis), H&E, medium power (original magnification 200×). Start
    with the background, which is busy: many hepatocytes hold fat, either as one large, round, empty vacuole or as many
    small droplets, while those in the lower right are still compact and pink. Then find the one cell that matters, in
    the top third of the field on the vertical midline: it is swollen and pale, with thinned-out, almost empty cytoplasm
    (ballooning), and has a dark nucleus. Just below that nucleus lies a small, curved, pink-purple clump that looks like
    a twisted cord: that clump is a Mallory–Denk body, a tangle of cytokeratin intermediate filaments, part of the
    hepatocyte's internal skeleton, gathered into an aggregate. Use the switch to see the same cell at 400×. Note also the small cluster of
    inflammatory cells in the lower half of the field. For the exam: do not read the cause from this field. Alcoholic
    hepatitis is the classic setting for Mallory–Denk bodies, but finding them does not prove alcohol: non-alcoholic
    steatohepatitis can show them too.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina, inquadratura verticale: epatociti rosa, molti con vacuoli di grasso
    rotondi e vuoti di varie dimensioni, soprattutto nella metà superiore; nel terzo superiore, sulla linea mediana, un
    epatocita rigonfio e pallido con un nucleo scuro e, subito sotto, un piccolo ammasso rosa-violaceo; nella metà
    inferiore un gruppetto di piccoli nuclei scuri; in basso a destra epatociti compatti e rosa.
  en: >-
    H&E micrograph of liver, portrait frame: pink hepatocytes, many with round, empty fat vacuoles of various sizes,
    mostly in the upper half; in the top third, on the midline, a swollen, pale hepatocyte with a dark nucleus and a
    small pink-purple clump just below it; in the lower half a small cluster of dark nuclei; in the lower right, compact
    pink hepatocytes.
