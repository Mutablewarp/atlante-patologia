lookFor:
  it: "Cerca le figure mitotiche: ammassi di cromatina scura e frastagliata, senza membrana nucleare, e osserva come la forma di ciascuna sia diversa."
  en: "Look for the mitotic figures: ragged clumps of dark chromatin with no nuclear membrane, and note that no two have the same shape."
caption:
  it: >-
    Mucosa gastrica con displasia di alto grado, EE ad alto ingrandimento. Cerca prima le cellule epiteliali grandi,
    con nuclei ingranditi e variabili. Poi trova le tre figure mitotiche: ammassi scuri e irregolari di cromatina, senza
    membrana nucleare. Quella in alto al centro ha tre poli (mitosi atipica), mentre le altre due hanno la forma
    abituale. Contare le mitosi in una sezione dice quante cellule sono in divisione in quel momento, ma non dice con che
    velocità cresce il tumore. Sotto l'epitelio displastico si vedono anche cellule infiammatorie.
  en: >-
    Gastric mucosa with high-grade dysplasia, H&E at high power. First find the large epithelial cells with enlarged,
    variable nuclei. Then find the three mitotic figures: dark, ragged clumps of chromatin with no nuclear membrane. The
    one at top center has three poles (an atypical mitosis), while the other two have the usual shape. Counting mitoses
    in a section shows how many cells are dividing at that moment, but not how fast the tumor grows. Inflammatory cells
    are also seen beneath the dysplastic epithelium.
alt:
  it: >-
    Micrografia in ematossilina-eosina di epitelio con cellule grandi dal citoplasma rosa e nuclei viola di dimensioni
    diverse; al centro e in basso tre ammassi scuri di cromatina, uno a forma di triangolo in alto, altri due a barra;
    a sinistra e a destra piccole cellule infiammatorie con nuclei scuri.
  en: >-
    H&E micrograph of epithelium with large cells, pink cytoplasm and purple nuclei of varied size; in the center and
    lower part, three dark chromatin clumps, one triangular at the top and two bar-shaped; at the left and right,
    small inflammatory cells with dark nuclei.
