lookFor:
  it: "Cerca i bastoncelli bruno-dorati segmentati con estremità a clava, dentro i macrofagi e le cellule giganti; il pigmento nero fine intorno è antracotico."
  en: "Look for the segmented golden-brown rods with club-shaped ends, inside macrophages and giant cells; the fine black pigment around them is anthracotic."
caption:
  it: >-
    Corpi dell'asbesto (corpi ferruginosi) in una biopsia polmonare, EE ad alto ingrandimento. Al centro ci sono
    bastoncelli bruno-ruggine, segmentati, alcuni con le estremità rigonfie a clava. Sono fibre rivestite di ferro e
    proteine, circondate da macrofagi e cellule giganti rosa. In periferia si vedono granuli neri di pigmento
    antracotico, un reperto frequente ma distinto dai corpi.
  en: >-
    Asbestos (ferruginous) bodies in a lung biopsy, H&E at high power. In the center are rust-brown, segmented rods,
    some with swollen club-shaped ends. They are fibers coated with iron and protein, surrounded by pink macrophages
    and giant cells. At the periphery are black granules of anthracotic pigment, a common finding that is separate from
    the bodies.
alt:
  it: >-
    Micrografia in ematossilina-eosina: diversi bastoncelli bruno-dorati segmentati, alcuni con estremità a clava, al
    centro di cellule rosa con nuclei violacei; ammassi di granuli neri fini sparsi ai margini.
  en: >-
    H&E micrograph: several segmented golden-brown rods, some with club-shaped ends, at the center of pink cells with
    purple nuclei; clumps of fine black granules scattered at the edges.
