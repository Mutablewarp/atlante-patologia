lookFor:
  it: "Parti dallo spazio portale verde in alto a sinistra e vai verso la venula a destra: i vacuoli spariscono strada facendo."
  en: "Start at the green portal tract at the upper left and move towards the venule on the right: the vacuoles fade out on the way."
caption:
  it: >-
    Steatosi macrovescicolare periportale (zona 1), colorazione tricromica a medio ingrandimento. In alto a sinistra
    c'è uno spazio portale: fibre collagene verdi con molti nuclei scuri. A destra un ampio lume chiaro, orlato da un
    sottile bordo verde, è una venula centrolobulare (venula epatica terminale). Gli epatociti attorno allo spazio
    portale sono pieni di vacuoli rotondi e vuoti di ogni misura: i più grandi occupano quasi tutta la cellula, e
    accanto a loro ce ne sono di più piccoli. Attorno alla venula, invece, gli epatociti sono compatti, rossi e senza
    grasso. Ogni vacuolo è lo spazio lasciato dai trigliceridi sciolti durante l'allestimento, perciò la colorazione
    non lo tinge. Attenzione: qualche gocciolina piccola accanto alle grandi non basta a fare una steatosi
    microvescicolare, nella quale intere cellule sono piene di gocce minute attorno a un nucleo centrale (vedi
    l'immagine di steatosi microvescicolare di questa scheda). Nota infine che in questo campo, a parte linee
    sottilissime lungo i sinusoidi, il collagene verde resta nello spazio portale e nelle pareti dei vasi: mancano i
    setti pericellulari che avvolgono i singoli epatociti, la fibrosi «a rete di pollaio» tipica della steatoepatite.
  en: >-
    Periportal (zone 1) macrovesicular steatosis, trichrome stain at intermediate power. At the upper left is a portal
    tract: green collagen fibres with many dark nuclei. On the right, a wide clear lumen edged by a thin green rim is
    a central venule (terminal hepatic venule). The hepatocytes around the portal tract are packed with round, empty
    vacuoles of every size: the largest fill most of a cell, and smaller ones sit beside them. Around the venule, by
    contrast, the hepatocytes are compact, red and free of fat. Each vacuole is the space left by triglyceride
    dissolved during processing, which is why the stain does not colour it. Pitfall: a few small droplets next to big
    ones do not make this microvesicular steatosis, in which whole cells are packed with minute droplets around a
    central nucleus (see the microvesicular steatosis image on this card). Note also that in this field, apart from
    very thin lines along the sinusoids, the green collagen stays in the portal tract and the vessel walls: there are
    no pericellular strands wrapping single hepatocytes, the "chicken-wire" fibrosis of steatohepatitis.
alt:
  it: >-
    Micrografia di fegato in colorazione tricromica a medio ingrandimento: epatociti rossi; in alto a sinistra una
    banda obliqua di fibre verdi con molti nuclei scuri, circondata da epatociti pieni di vacuoli bianchi rotondi di
    varie dimensioni; a destra un grande lume bianco ovale con un sottile bordo verde, circondato da epatociti senza
    vacuoli.
  en: >-
    Medium-power trichrome micrograph of liver: red hepatocytes; at the upper left an oblique band of green fibres
    with many dark nuclei, surrounded by hepatocytes full of round white vacuoles of varying size; on the right a large
    oval white lumen with a thin green rim, surrounded by hepatocytes without vacuoles.
