lookFor:
  it: "Parti dal rene vitale in alto a sinistra e segui il passaggio verso l'area infartuata, dove i nuclei spariscono."
  en: "Start from the viable kidney at the upper left and follow the shift into the infarcted area, where the nuclei disappear."
caption:
  it: >-
    Bordo di un infarto renale, EE a basso ingrandimento (obiettivo 4x). In alto a sinistra il rene è vitale: il
    glomerulo e i tubuli hanno nuclei ben colorati. Spostati verso destra e in basso: tubuli e glomeruli conservano il
    profilo, ma sono rosa pallido e senza nuclei, quindi necrosi coagulativa. Lungo il margine si vedono molti globuli
    rossi nell'interstizio, cioè l'emorragia, e un lieve infiltrato infiammatorio.
  en: >-
    Edge of a renal infarct, H&E at low power (4x objective). At the upper left the kidney is viable: the glomerulus
    and tubules have well-stained nuclei. Move to the right and downward: tubules and glomeruli keep their outlines
    but are pale pink and without nuclei, which is coagulative necrosis. Along the border, many red cells lie in the
    interstitium, which is the hemorrhage, with a mild inflammatory infiltrate.
alt:
  it: >-
    Micrografia di rene in ematossilina-eosina a basso ingrandimento: a sinistra un glomerulo e tubuli con nuclei
    violacei; a destra e in basso tubuli e glomeruli pallidi, rosa, senza nuclei, immersi in numerosi globuli rossi.
  en: >-
    Low-power H&E micrograph of kidney: on the left a glomerulus and tubules with purple nuclei; on the right and
    lower part, pale pink tubules and glomeruli without nuclei, surrounded by many red blood cells.
