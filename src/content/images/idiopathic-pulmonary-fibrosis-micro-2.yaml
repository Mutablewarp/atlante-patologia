lookFor:
  it: "Cerca la zona centrale più pallida e lassa, con cellule fusate, circondata da collagene rosa più denso."
  en: "Find the paler, looser central zone of spindle cells, surrounded by denser pink collagen."
caption:
  it: >-
    Focolaio fibroblastico nella UIP, EE a medio ingrandimento. Individua al centro un'area pallida e lassa, di
    colore rosa-lilla chiaro, dove cellule fusate (fibroblasti e miofibroblasti) stanno in una matrice edematosa e
    immatura. Intorno il collagene è più rosa e compatto, e in alto si vede un aggregato di piccoli linfociti. Il
    focolaio fibroblastico, a ridosso di uno spazio aereo, segna il punto di cicatrizzazione in atto e va cercato
    nella UIP insieme alla fibrosi a chiazze e all'honeycombing.
  en: >-
    Fibroblastic focus in UIP, H&E at medium power. Find the pale, loose area in the center, light pink-lilac, where
    spindle cells (fibroblasts and myofibroblasts) sit in an edematous, immature matrix. Around it the collagen is
    pinker and more compact, and at the top there is a cluster of small lymphocytes. The fibroblastic focus, next to an
    air space, marks where scarring is under way and is sought in UIP together with patchy fibrosis and honeycombing.
alt:
  it: "Sezione di polmone colorata con ematossilina-eosina: al centro un'area pallida e lassa con cellule fusate, circondata da collagene rosa denso e da uno spazio aereo a sinistra."
  en: "Hematoxylin-eosin lung section: a pale, loose central area with spindle cells, surrounded by dense pink collagen and an air space on the left."
