lookFor:
  it: "Cerca bastoncini sottili rosso-fucsia nel citoplasma chiaro della cellula gigante, sul fondo blu."
  en: "Look for thin magenta rods in the pale cytoplasm of the giant cell, against the blue background."
caption:
  it: >-
    Linfadenite tubercolare, colorazione di Ziehl-Neelsen, forte ingrandimento: la colorazione speciale con cui si
    cercano i micobatteri. Prima orientati: tutto il tessuto è blu per la controcolorazione e in questo campo non c'è
    necrosi; al centro c'è una grande cellula gigante di Langhans, riconoscibile dai nuclei blu scuro ammassati lungo il
    bordo superiore e dall'ampio citoplasma chiaro. Poi cerca i bacilli: sono bastoncini sottili e corti, rosso-fucsia,
    perché la parete dei micobatteri, ricca di lipidi, trattiene il colorante rosso anche dopo il lavaggio con
    acido-alcol (sono alcol-acido resistenti). Qui se ne contano quattro: una coppia e un bacillo isolato nel citoplasma
    della cellula gigante e un quarto in un macrofago vicino, in basso a sinistra. Perché conta: la fonte indica questa
    densità, pochissimi bacilli, come quella abituale in una lesione compatta di una persona non immunodepressa; per
    trovarli bisogna scorrere molti campi, e un Ziehl-Neelsen negativo non basta a escludere la tubercolosi, per cui
    servono anche la coltura e i test molecolari. Se invece l'immunità cellulo-mediata è depressa, i granulomi sono mal
    formati e i bacilli si moltiplicano. Questa immagine appartiene alla stessa serie didattica sulla linfadenite
    tubercolare della micrografia in ematossilina-eosina con caseificazione iniziale: usa il selettore per confrontarle.
  en: >-
    Tuberculous lymphadenitis, Ziehl-Neelsen stain, high power: the special stain used to search for mycobacteria. Get
    your bearings first: all the tissue is blue from the counterstain and there is no necrosis in this field; in the
    centre lies a large Langhans giant cell, recognisable by the dark blue nuclei crowded along its upper edge and by its
    wide pale cytoplasm. Then look for the bacilli: they are thin, short, magenta rods, because the lipid-rich wall of
    mycobacteria keeps the red dye even after the acid-alcohol wash (they are acid-fast). Four can be counted here: a
    pair and a single bacillus in the cytoplasm of the giant cell, and a fourth in a nearby macrophage at the lower
    left. Why it matters: the source describes this density, very few bacilli, as the usual one in a solid lesion of a
    person who is not immunocompromised; finding them means scanning many fields, and a negative Ziehl-Neelsen stain is
    not enough to rule out tuberculosis, so culture and molecular tests are needed too. When cell-mediated immunity is
    depressed, by contrast, granulomas are poorly formed and the bacilli multiply. This image belongs to the same
    teaching set on tuberculous lymphadenitis as the H&E micrograph with early caseation: use the switch to compare them.
alt:
  it: >-
    Micrografia a forte ingrandimento su fondo azzurro chiaro: al centro una grande cellula con un arco di nuclei blu
    scuro lungo il bordo superiore e il citoplasma chiaro, nel quale si vedono due bastoncini rossi accostati e un terzo
    più a destra; un altro bastoncino rosso sta in basso a sinistra.
  en: >-
    High-power micrograph on a pale blue background: in the centre a large cell with an arc of dark blue nuclei along its
    upper edge and pale cytoplasm, in which two red rods lie side by side and a third sits further right; another red
    rod lies at the lower left.
