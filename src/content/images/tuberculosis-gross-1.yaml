lookFor:
  it: "Cerca la cavità a pareti irregolari nella parte alta di un polmone e le chiazze biancastre di tessuto necrotico intorno."
  en: "Look for the irregular-walled cavity in the upper part of one lung and the whitish patches of necrotic tissue around it."
caption:
  it: >-
    Polmoni e trachea in sezione frontale da un caso di tubercolosi cavitaria. Guarda in alto nel polmone a destra
    dell'immagine: due cavità vuote, di forma irregolare, circondate da tessuto compatto. Nei lobi superiori di entrambi
    i polmoni compaiono aree giallo-biancastre, aspetto di necrosi caseosa. Le cavità si formano quando il materiale
    necrotico si scarica in un bronco, e per questo sono tipiche della tubercolosi secondaria.
  en: >-
    Lungs and trachea cut in a frontal plane from a case of cavitary tuberculosis. Look at the upper part of the lung on
    the right of the image: two empty, irregular cavities surrounded by firm tissue. In the upper lobes of both lungs
    there are yellow-white areas that look like caseous necrosis. Cavities form when necrotic material drains into a
    bronchus, which is why they are typical of secondary tuberculosis.
alt:
  it: >-
    Sezione frontale di due polmoni su sfondo nero, con la trachea al centro. Nel polmone a destra dell'immagine ci sono
    cavità scure nella parte alta; chiazze giallo-biancastre sono visibili nei lobi superiori di entrambi i lati.
  en: >-
    Frontal cut of two lungs on a black background, with the trachea in the center. The lung on the right of the image
    has dark cavities in its upper part; yellow-white patches are visible in the upper lobes on both sides.
