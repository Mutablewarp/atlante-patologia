lookFor:
  it: "Trova il nucleo con il suo nucleolo scuro, poi guarda subito accanto: il gruppo di granuli scuri è il pigmento."
  en: "Find the nucleus with its dark nucleolus, then look right beside it: the clump of dark granules is the pigment."
caption:
  it: >-
    Un neurone del cervello a fortissimo ingrandimento (obiettivo a immersione 100×), in una sezione semifine di 2 µm
    inclusa in resina e colorata con blu di toluidina; la freccia e la barra di 10 µm sono dell'autore. Parti dalla
    grande cellula al centro: un nucleo rotondo e chiaro con un unico nucleolo scuro, circondato da un ampio citoplasma.
    Proprio accanto al nucleo, dove punta la freccia, c'è un gruppo di granuli scuri: è lipofuscina. In basso a sinistra
    un secondo neurone ha il suo gruppo di granuli. Con questo colorante i granuli appaiono blu-neri, mentre in EE lo
    stesso pigmento è bruno-dorato, come nell'immagine del miocardio di questa scheda: riconoscilo quindi dalla forma e
    dalla sede, un ammasso di granuli nel citoplasma di una cellula longeva, non dal colore. La lipofuscina si forma da
    lipidi di membrana e proteine danneggiati dall'ossidazione, materiale che la cellula non riesce né a digerire né a
    espellere. I neuroni non si dividono più, perciò il residuo si accumula con gli anni. Inoltre non è del tutto
    inerte: può rallentare i sistemi di smaltimento della cellula e favorire così nuovo danno ossidativo.
  en: >-
    A neuron of the brain at very high power (100× oil-immersion objective), in a 2 µm resin (plastic) section stained
    with toluidine blue; the arrow and the 10 µm bar are the author's. Start from the large cell in the centre: a
    round, pale nucleus with a single dark nucleolus, surrounded by a broad rim of cytoplasm. Right beside the nucleus,
    where the arrow points, sits a clump of dark granules: this is lipofuscin. At the lower left a second neuron carries
    its own clump. With this dye the granules look blue-black, whereas on H&E the same pigment is golden-brown, as in
    the heart muscle image on this card: so recognise it by its form and place, a cluster of granules in the cytoplasm
    of a long-lived cell, not by its colour. Lipofuscin forms from membrane lipids and proteins damaged by oxidation,
    material that the cell can neither digest nor expel. Neurons no longer divide, so the residue builds up over the
    years. It is not entirely inert either: it can slow the cell's own clean-up and so favour further oxidative damage.
alt:
  it: >-
    Micrografia in tonalità di blu: al centro una grande cellula nervosa con un nucleo rotondo e chiaro e un nucleolo
    scuro; appena sopra e a sinistra del nucleo un ammasso di granuli blu-neri, indicato da una freccia nera che sale da
    sinistra in basso; in basso a sinistra una seconda cellula con un ammasso di granuli più piccolo; il fondo è un fitto
    intreccio di anelli e tratti blu scuro; nell'angolo in basso a destra una barra di scala nera.
  en: >-
    Micrograph in shades of blue: in the centre a large nerve cell with a round, pale nucleus and a dark nucleolus;
    just above and to the left of the nucleus a clump of blue-black granules, marked by a black arrow rising from the
    lower left; at the lower left a second cell with a smaller clump of granules; the background is a dense mesh of
    dark blue rings and streaks; a black scale bar in the bottom right corner.
