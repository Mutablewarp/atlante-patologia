caption:
  it: >-
    Leiomioma dell'utero (tumore benigno del muscolo liscio), EE a basso ingrandimento. Guarda l'architettura: fasci
    ordinati di cellule fusate che corrono nella stessa direzione e si intrecciano in modo regolare, senza zone
    disorganizzate. Le cellule sono tutte simili tra loro e somigliano al muscolo liscio da cui derivano: il tumore è
    ben differenziato. Confrontalo con l'immagine ad alto ingrandimento di un tumore maligno pleomorfo.
  en: >-
    Leiomyoma of the uterus (a benign smooth muscle tumor), H&E at low power. Look at the architecture: orderly
    bundles of spindle cells run in the same direction and weave in a regular way, with no disorganized areas. The cells
    all look alike and resemble the smooth muscle they come from: the tumor is well differentiated. Compare it with the
    high power image of a pleomorphic malignant tumor.
alt:
  it: >-
    Micrografia rosa-magenta in ematossilina-eosina: cellule fusate allungate disposte in fasci paralleli e curvi, con
    piccoli spazi chiari tra i fasci; i nuclei sono piccoli e uniformi.
  en: >-
    Pink-magenta H&E micrograph: elongated spindle cells arranged in parallel, curving bundles, with small clear
    spaces between the bundles; the nuclei are small and uniform.
lookFor:
  it: "Segui la direzione dei fasci: sono regolari e le cellule hanno forma e dimensione simili."
  en: "Follow the direction of the bundles: they are regular and the cells have similar shape and size."
