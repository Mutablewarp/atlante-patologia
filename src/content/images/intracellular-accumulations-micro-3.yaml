caption:
  it: >-
    Fegato colorato con PAS dopo digestione con diastasi (PAS-D), a forte ingrandimento (400× secondo il nome del
    file). Prima di guardare, ricorda che cosa ha già fatto la colorazione per te: la diastasi digerisce il glicogeno,
    quindi tutto ciò che è rimasto magenta non può essere glicogeno. Orientati: gli epatociti, con nuclei rotondi blu,
    occupano i due terzi di sinistra; a destra c'è una banda di tessuto fibroso con cellule fusate e, in basso, un
    piccolo dotto biliare tagliato di traverso. Ora guarda dentro gli epatociti: la maggior parte contiene numerosi
    globuli rotondi magenta, di grandezza molto variabile, da puntini appena visibili a gocce ben distinte. Sono
    α1-antitripsina che non è mai uscita dalla cellula: l'epatocita l'ha prodotta, ma la proteina mutata si è
    ripiegata male ed è rimasta bloccata nel suo reticolo endoplasmatico. Da qui il doppio danno della malattia:
    l'accumulo lede il fegato, e la proteina che manca nel sangue non protegge più il polmone. Nell'immagine in EE di
    questa stessa scheda i globuli appaiono rosa e vitrei, un aspetto che anche altre inclusioni possono avere: è la
    resistenza alla diastasi a dimostrare che non sono glicogeno. Non confonderli con i nuclei, che sono blu, più
    grandi e uno solo per cellula.
  en: >-
    Liver stained with PAS after diastase digestion (PAS-D), high power (400× according to the file name). Before you
    look, remember what the stain has already done for you: diastase digests glycogen, so anything still magenta cannot
    be glycogen. Orient yourself: hepatocytes with round blue nuclei fill the left two thirds; on the right is a band of
    fibrous tissue with spindle-shaped cells and, near the bottom, a small bile duct cut across. Now look inside the
    hepatocytes: most of them hold many round magenta globules of very different sizes, from barely visible dots to
    distinct droplets. This is α1-antitrypsin that never left the cell: the hepatocyte made it, but the mutant
    protein folded wrongly and stayed stuck in its endoplasmic reticulum. Hence the double damage of the disease: the
    accumulation injures the liver, and the protein missing from the blood no longer protects the lung. In the H&E image
    on this same card the globules look pink and glassy, a look that other inclusions can share: it is their resistance
    to diastase that proves they are not glycogen. Do not mistake them for nuclei, which are blue, larger and only one
    per cell.
alt:
  it: >-
    Micrografia di fegato colorata con PAS-D a forte ingrandimento: epatociti azzurro-grigi con nuclei rotondi blu,
    per lo più con gruppi di piccoli globuli rotondi magenta; a destra una banda di tessuto fibroso rosa-violaceo con
    nuclei fusati scuri e, in basso, un piccolo anello di cellule attorno a un lume.
  en: >-
    PAS-D micrograph of liver at high power: blue-grey hepatocytes with round blue nuclei, most holding clusters of
    small round magenta globules; on the right, a pink-violet band of fibrous tissue with dark spindle-shaped nuclei and,
    near the bottom, a small ring of cells around a lumen.
