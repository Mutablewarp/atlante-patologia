lookFor:
  it: "Confronta in alto le cellule della fossetta, ordinate, con le cellule chiare e disperse della lamina propria sotto di esse."
  en: "Compare the orderly pit cells at the top with the pale scattered cells of the lamina propria beneath them."
caption:
  it: >-
    Lo stesso caso a più forte ingrandimento, EE. In alto l'epitelio di superficie forma fossette regolari, con nuclei
    allineati alla base. Nella lamina propria sottostante le ghiandole sono distanziate e tra loro si insinuano cellule
    isolate dal citoplasma chiaro e abbondante, che spinge il nucleo contro la membrana: sono le cellule a castone.
    Scendendo, queste cellule diventano più fitte e sostituiscono le ghiandole.
  en: >-
    The same case at higher power, H&E. At the top the surface epithelium forms regular pits, with nuclei lined up at the
    base. In the lamina propria below, the glands are spaced apart and isolated cells with abundant pale cytoplasm
    slip between them, pushing the nucleus against the cell membrane: these are signet ring cells. Further down, these
    cells become denser and replace the glands.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: in alto fossette rivestite da epitelio alto con nuclei
    basali; al centro ghiandole piccole e rotonde in un tessuto con cellule chiare isolate; in basso cellule fitte con
    citoplasma rosa e nuclei spostati ai lati.
  en: >-
    High-power H&E micrograph: at the top, pits lined by tall epithelium with basal nuclei; in the middle, small round
    glands in tissue with isolated pale cells; at the bottom, dense cells with pink cytoplasm and nuclei pushed to the
    side.
