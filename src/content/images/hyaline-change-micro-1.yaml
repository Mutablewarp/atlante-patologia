lookFor:
  it: "Cerca la banda rosa omogenea e lucida accanto al glomerulo: è la parete ispessita dell'arteriola."
  en: "Look for the smooth, glassy pink band beside the glomerulus: it is the thickened wall of the arteriole."
caption:
  it: >-
    Ialinosi arteriolare renale, H&E, ad alto ingrandimento. Al centro c'è un glomerulo; a sinistra, una banda rosa
    omogenea e lucida segue il decorso di un'arteriola. La parete è ispessita da materiale uniforme, senza struttura
    visibile, e il lume è ridotto. Confronta il suo rosa compatto con quello più sfumato del tessuto circostante.
  en: >-
    Renal arteriolar hyalinosis, H&E, at high power. A glomerulus sits in the center; on the left, a smooth, glassy pink
    band follows the course of an arteriole. Its wall is thickened by uniform material with no visible structure, and the
    lumen is narrowed. Compare its dense pink with the paler, softer pink of the surrounding tissue.
alt:
  it: >-
    Micrografia H&E a colori rosa e viola: un glomerulo rotondo con nuclei viola, e sulla sinistra una banda rosa intenso
    e omogenea, curva, che corrisponde alla parete di un'arteriola.
  en: >-
    Pink and purple H&E micrograph: a round glomerulus with purple nuclei, and on the left a curved band of intense,
    homogeneous pink that corresponds to the wall of an arteriole.
