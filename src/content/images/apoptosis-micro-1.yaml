caption:
  it: >-
    Epatite acuta su biopsia epatica, EE a medio ingrandimento; la freccia, già presente nella figura originale, indica
    un corpo acidofilo (corpo di Councilman). Guarda prima l'insieme: le trabecole epatiche hanno perso la loro
    disposizione ordinata (disordine lobulare), tra gli epatociti sono sparsi molti linfociti e qua e là compaiono
    piccoli accumuli di pigmento biliare bruno-dorato, segno di colestasi. Poi segui la freccia: un singolo epatocita
    spicca perché è più piccolo dei vicini, angolato, con citoplasma rosso intenso e vitreo e un minuscolo residuo
    nucleare scuro, separato dalla trabecola da un sottile alone chiaro. È un epatocita morto per apoptosi, che si è
    raggrinzito, condensato e staccato dalla trabecola; nell'epatite virale il segnale di morte viene soprattutto dai
    linfociti T citotossici che riconoscono gli antigeni virali. Da ricordare: l'apoptosi colpisce cellule singole e
    sparse, non aree confluenti; la cellula si rimpicciolisce invece di gonfiarsi; intorno non c'è reazione di
    neutrofili, perché i resti vengono rimossi in silenzio dai macrofagi (cellule di Kupffer). Attenzione a non
    confonderlo con l'epatocita balloniforme, che è il quadro opposto: grande, pallido e rigonfio.
  en: >-
    Acute hepatitis in a liver biopsy, H&E at medium power; the arrow, already present in the original figure, points
    to an acidophil body (Councilman body). Look at the whole field first: the liver cell plates have lost their
    orderly arrangement (lobular disarray), many lymphocytes are scattered between the hepatocytes and here and there
    small golden-brown plugs of bile pigment mark cholestasis. Then follow the arrow: one hepatocyte stands out
    because it is smaller than its neighbours, angular, with intensely pink, glassy cytoplasm and a tiny dark nuclear
    remnant, separated from the plate by a thin clear rim. This is a hepatocyte that has died by apoptosis, shrunk,
    condensed and dropped out of the plate; in viral hepatitis the death signal comes mainly from cytotoxic T cells
    that recognise viral antigens. Key points: apoptosis hits single, scattered cells, not confluent areas; the cell
    shrinks instead of swelling; and there is no neutrophil reaction around it, because the remnants are quietly
    removed by macrophages (Kupffer cells). Do not confuse it with a ballooned hepatocyte, which is the opposite
    picture: large, pale and swollen.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina: epatociti rosa disposti in modo disordinato, molti piccoli nuclei
    scuri di linfociti e alcuni granuli bruni; in basso a sinistra una freccia nera vuota punta verso il basso su una
    piccola cellula angolata, rosso intenso, con un minuscolo punto nucleare scuro e circondata da un alone chiaro.
  en: >-
    H&E micrograph of liver: pink hepatocytes in a disordered arrangement, many small dark lymphocyte nuclei and a few
    brown granules; at lower left a black outlined arrow points down to a small, angular, deep-pink cell with a tiny
    dark nuclear dot, surrounded by a clear halo.
