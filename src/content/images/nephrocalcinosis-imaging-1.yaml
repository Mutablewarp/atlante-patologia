caption:
  it: >-
    Ecografia di entrambi i reni in sezione sagittale (a sinistra il rene destro, a destra il sinistro). Cerca prima la
    corticale, più scura, e le piramidi midollari al centro del rene. Poi guarda le piramidi: sono punteggiate da
    piccoli echi molto chiari, cioè depositi di calcio, in entrambi i reni. Le colonne di Bertin, di tessuto corticale,
    restano scure tra le piramidi.
  en: >-
    Ultrasound of both kidneys in sagittal section (right kidney on the left, left kidney on the right). Look first for
    the darker cortex and the medullary pyramids in the middle of the kidney. Then look at the pyramids: they are
    dotted with small, very bright echoes, which are calcium deposits, in both kidneys. The columns of Bertin, made of
    cortical tissue, stay dark between the pyramids.
alt:
  it: >-
    Due immagini ecografiche in scala di grigi affiancate, rene destro e rene sinistro. In ciascuna, al centro del rene,
    gruppi di piccoli punti molto luminosi si trovano nelle piramidi midollari; il tessuto scuro tra le piramidi è la
    colonna di Bertin. Linee bianche con scritte in inglese indicano la nefrocalcinosi e la colonna di Bertin.
  en: >-
    Two grayscale ultrasound images side by side, right kidney and left kidney. In each, groups of small, very bright
    dots lie in the medullary pyramids at the center of the kidney; the dark tissue between pyramids is the column of
    Bertin. White lines with English text label the nephrocalcinosis and the column of Bertin.
