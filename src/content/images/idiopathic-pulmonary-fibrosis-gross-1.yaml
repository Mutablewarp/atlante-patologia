lookFor:
  it: "Parti dalla pleura in alto e guarda quanto sono vicine alla superficie le cavità tonde, poi nota il tessuto fibroso che le separa."
  en: "Start at the pleura at the top and see how close to the surface the round cavities lie, then note the fibrous tissue between them."
caption:
  it: >-
    Superficie di taglio di un polmone fibrotico. Guarda prima il margine pleurico in alto: subito sotto la pleura si
    vedono molte cavità tonde, di pochi millimetri, in file ravvicinate, separate da bande di tessuto fibroso
    grigio-rosato. È l'aspetto "a nido d'ape" (honeycombing) del polmone in stadio avanzato, tipico del quadro UIP. Più
    in basso il parenchima resta compatto e disseminato di piccole cavità, con settori più conservati accanto ad altri
    più cicatriziali.
  en: >-
    Cut surface of a fibrotic lung. Look first at the pleural edge at the top: just under the pleura there are many
    round cavities, a few millimeters across, packed in rows and separated by bands of gray-pink fibrous tissue. This is
    the honeycomb look of advanced lung fibrosis, typical of the UIP pattern. Deeper down the parenchyma is firm and
    dotted with small cavities, with better preserved areas next to more scarred ones.
alt:
  it: "Fotografia macroscopica della superficie di taglio di un polmone: parenchima rosa-grigiastro con molte piccole cavità tonde scure sotto la pleura, separate da tessuto fibroso."
  en: "Gross photograph of the cut surface of a lung: pink-gray parenchyma with many small dark round cavities beneath the pleura, separated by fibrous tissue."
