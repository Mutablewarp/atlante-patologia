lookFor:
  it: "Cerca lo spazio portale ingrandito da un fitto infiltrato di cellule infiammatorie, e confrontalo con il parenchima epatico conservato sopra e sotto."
  en: "Find the portal tract expanded by a dense inflammatory infiltrate, and compare it with the preserved liver parenchyma above and below."
caption:
  it: >-
    Biopsia epatica, EE a basso ingrandimento (l'immagine è verticale). Parti dal parenchima rosa con epatociti in
    trabecole, in alto e in basso. Al centro lo spazio portale è molto ingrandito e popolato da un infiltrato denso di
    cellule infiammatorie, con aree più chiare e pallide al suo interno. È il quadro di infiammazione portale della
    colangite biliare primitiva: poi, a maggior ingrandimento, si guardano i dotti biliari dentro questo infiltrato.
  en: >-
    Liver biopsy, H&E at low power (the image is vertical). Start from the pink parenchyma with cords of hepatocytes,
    at the top and bottom. In the middle the portal tract is much enlarged and filled by a dense inflammatory
    infiltrate, with paler, lighter areas inside it. This is the portal inflammation of primary biliary cholangitis;
    at higher power you then examine the bile ducts within this infiltrate.
alt:
  it: >-
    Micrografia verticale di biopsia epatica in ematossilina-eosina: parenchima rosa con epatociti in alto e in basso e,
    al centro, una larga zona viola-bluastra di piccole cellule infiammatorie che espande uno spazio portale.
  en: >-
    Vertical H&E micrograph of a liver biopsy: pink parenchyma with hepatocytes at the top and bottom and, in the
    middle, a broad purple-blue zone of small inflammatory cells expanding a portal tract.
