lookFor:
  it: "Guarda la superficie: invece di essere liscia è fatta di tante frange sottili e fitte."
  en: "Look at the surface: instead of being smooth, it is made of many thin, crowded fronds."
caption:
  it: >-
    Adenoma villoso del sigma, pezzo operatorio fissato e immerso in alcol, visto dall'alto. Guarda prima il profilo:
    una massa a lobi, che sporge nel lume. Poi avvicinati alla superficie: è coperta da frange sottili e fitte, come
    un cavolfiore o un corallo, e non è liscia. Questo aspetto "a villi" è il segno macroscopico della componente
    villosa.
  en: >-
    Villous adenoma of the sigmoid colon, resection specimen fixed and immersed in alcohol, seen from above. Look at
    the outline first: a lobulated mass that bulges into the lumen. Then move to the surface: it is covered by thin,
    crowded fronds, like a cauliflower or a coral, and is not smooth. This frond-like look is the gross sign of the
    villous component.
alt:
  it: >-
    Fotografia ravvicinata di una massa rosa-arancio a più lobi, la cui superficie è ricoperta da fitte frange sottili
    e ripiegate, con piccole aree rosse, su fondo beige chiaro.
  en: >-
    Close-up photograph of a pink-orange, multilobed mass whose surface is covered by dense, thin, folded fronds with
    small red areas, on a pale beige background.
