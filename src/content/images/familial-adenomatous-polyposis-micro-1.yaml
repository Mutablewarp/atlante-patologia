lookFor:
  it: "Cerca il punto in cui le ghiandole pallide e rotonde della mucosa normale cedono il posto a ghiandole violacee, allungate e affollate."
  en: "Find where the pale, round glands of normal mucosa give way to crowded, elongated, darker purple glands."
caption:
  it: >-
    Adenoma tubulare del colon, EE a basso ingrandimento. È l'aspetto microscopico di ogni polipo della poliposi
    adenomatosa familiare: nella FAP i polipi sono centinaia o migliaia, ma ciascuno ha questa struttura. Guarda prima
    in basso a destra: le cripte della mucosa normale sono rotonde, regolari e piuttosto chiare. In alto la mucosa
    cambia: le ghiandole sono più lunghe, più affollate e più violacee, rivestite da cellule con nuclei scuri e
    allungati. È la displasia di basso grado dell'epitelio adenomatoso. L'immagine è di un adenoma tubulare sporadico,
    mostrato come esempio della lesione elementare e non come caso di FAP.
  en: >-
    Tubular adenoma of the colon, H&E at low power. This is the microscopic look of each polyp in familial adenomatous
    polyposis: in FAP the polyps number in the hundreds to thousands, but each one has this structure. Look first at
    the lower right: the crypts of normal mucosa are round, regular and rather pale. At the top the mucosa changes: the
    glands are longer, more crowded and more purple, lined by cells with dark, elongated nuclei. This is low-grade
    dysplasia of the adenomatous epithelium. The image shows a sporadic tubular adenoma, used as an example of the
    basic lesion and not as a case of FAP.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un frammento di mucosa del colon su sfondo bianco: in alto ghiandole violacee
    allungate e affollate, sotto numerose cripte rotonde e più chiare di mucosa normale.
  en: >-
    H&E micrograph of a fragment of colon mucosa on a white background: at the top, elongated, crowded purple glands;
    below, numerous rounder, paler crypts of normal mucosa.
