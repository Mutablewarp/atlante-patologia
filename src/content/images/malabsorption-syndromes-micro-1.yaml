lookFor:
  it: "Cerca i granuli rosso-magenta che riempiono il citoplasma dei macrofagi, intorno a nuclei viola pallidi."
  en: "Look for the magenta-red granules that fill the cytoplasm of the macrophages around pale purple nuclei."
caption:
  it: >-
    Malattia di Whipple, colorazione PAS ad alto ingrandimento. Guarda il citoplasma delle cellule: è pieno di granuli
    rosso-magenta, il materiale PAS-positivo accumulato nei macrofagi, mentre i nuclei restano piccoli e viola pallido.
    Gli spazi chiari tra le cellule sono vuoti, non cellule. L'immagine è un po' sfocata: serve a riconoscere il
    pattern granulare, non i dettagli dei singoli granuli.
  en: >-
    Whipple disease, PAS stain at high power. Look at the cytoplasm of the cells: it is packed with magenta-red
    granules, the PAS-positive material stored in macrophages, while the nuclei stay small and pale purple. The clear
    round spaces between the cells are empty gaps, not cells. The image is slightly out of focus: use it to recognize
    the granular pattern, not the detail of single granules.
alt:
  it: >-
    Micrografia ad alto ingrandimento con colorazione PAS: cellule grandi con citoplasma ripieno di granuli rosso-magenta
    e nuclei piccoli viola pallido, separate da alcuni spazi chiari rotondi.
  en: >-
    High-power PAS micrograph: large cells with cytoplasm packed with magenta-red granules and small pale purple
    nuclei, separated by a few round clear spaces.
