lookFor:
  it: "Nell'EE a forte ingrandimento trova i nuclei picnotici (frecce nere) e quelli che sbiadiscono (frecce bianche), poi guarda la stessa zona nella pMLKL sotto: le cellule sono brune."
  en: "In the high-power H&E find the pyknotic nuclei (black arrows) and the fading ones (white arrows), then look at the same area in the pMLKL panel below: the cells are brown."
caption:
  it: >-
    Necroptosi in un tumore umano, e perché l'EE non basta a riconoscerla. Carcinoma squamocellulare del distretto
    testa-collo, pezzi chirurgici, sezioni seriali: sopra l'ematossilina-eosina (EE), sotto l'immunoistochimica per la
    MLKL fosforilata (pMLKL), la forma attiva della proteina che esegue la necroptosi (prodotto bruno, nuclei azzurri
    per la controcolorazione con ematossilina). In ogni coppia il pannello di sinistra è a piccolo ingrandimento (×100),
    quello di destra ingrandisce il riquadro (×400); i simboli sono degli autori. Coppia di sinistra, un «focolaio
    necrotico»: nell'EE le frecce nere indicano nuclei picnotici, piccoli, scuri e raggrinziti; le frecce bianche nuclei
    che si stanno dissolvendo (cariolisi); i triangoli bianchi cellule rigonfie che si sono staccate dalle vicine. Nella
    pMLKL lo stesso focolaio contiene cellule tumorali brune. Coppia di destra, «necrosi coagulativa»: l'asterisco segna
    detriti necrotici amorfi, e nella pMLKL le cellule brune si trovano lungo il loro margine. Come leggerla: le cellule
    brune avevano attivato la via RIPK1–RIPK3–MLKL, eppure all'EE mostrano solo il quadro classico della necrosi:
    rigonfiamento, picnosi, cariolisi. Nello studio la pMLKL era presente in una parte dei tumori e assente in tutte le
    40 sezioni di epitelio vicino al tumore che sono state esaminate. Da ricordare per l'esame: la necroptosi si
    riconosce dal marcatore, non dalla morfologia; e un segnale bruno vale solo se il controllo negativo resta azzurro,
    come è avvenuto in questo studio.
  en: >-
    Necroptosis in a human tumour, and why H&E is not enough to recognise it. Head and neck squamous cell carcinoma,
    surgical specimens, serial sections: haematoxylin and eosin (H&E) above, immunohistochemistry for phosphorylated
    MLKL (pMLKL) below; pMLKL is the active form of the protein that carries out necroptosis (brown product, nuclei blue
    from the haematoxylin counterstain). In each pair the left panel is low power (×100) and the right one enlarges the
    box (×400); the symbols are the authors'. Left pair, a "necrotic cluster": on H&E, black arrows mark pyknotic
    nuclei, small, dark and shrunken; white arrows mark nuclei that are dissolving (karyolysis); white triangles mark
    swollen cells that have come apart from their neighbours. In the pMLKL panel the same cluster holds brown tumour
    cells. Right pair, "coagulative necrosis": the asterisk marks amorphous necrotic debris, and in the pMLKL panel the
    brown cells lie along its edge. How to read it: the brown cells had switched on the RIPK1–RIPK3–MLKL route, yet on
    H&E they show only the classic picture of necrosis: swelling, pyknosis, karyolysis. In the study, pMLKL was present
    in some of the tumours and absent from all 40 sections of epithelium next to the tumour that were examined. Key
    point for the exam: necroptosis is recognised by its marker, not by its morphology; and a brown signal counts only
    if the negative control stays blue, as it did in this study.
alt:
  it: >-
    Otto micrografie in due righe, etichettate a destra «H&E» e «p-MLKL», raggruppate sotto i titoli «Necrotic cluster»
    e «Coagulative necrosis». Nella riga in alto, rosa e viola, i pannelli a forte ingrandimento mostrano cellule
    tumorali squamose con frecce nere, frecce bianche, triangoli bianchi e un asterisco su un'area rosa amorfa. Nella
    riga in basso, su fondo chiaro con nuclei azzurri, gruppi di cellule hanno citoplasma bruno chiaro o bruno scuro.
  en: >-
    Eight micrographs in two rows, labelled "H&E" and "p-MLKL" on the right and grouped under the headings "Necrotic
    cluster" and "Coagulative necrosis". In the pink-purple top row the high-power panels show squamous tumour cells
    with black arrows, white arrows, white triangles and an asterisk on an amorphous pink area. In the bottom row, on a
    pale background with blue nuclei, groups of cells have light-brown or dark-brown cytoplasm.
