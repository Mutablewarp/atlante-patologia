lookFor:
  it: "Scorri le fibre, poi cerca al loro interno buchi chiari bordati da granuli grigio-azzurri; non confonderli con gli spazi bianchi fuori dalle fibre."
  en: "Scan the fibres, then look inside them for clear holes edged by blue-grey granules; do not confuse them with the white gaps outside the fibres."
caption:
  it: >-
    Miosite a corpi inclusi, che dopo i 50 anni è la più comune malattia infiammatoria del muscolo, in una biopsia
    muscolare colorata con ematossilina-eosina a medio ingrandimento (×200 secondo l'autore). Mostra come
    appare, con una colorazione di routine, uno smaltimento lisosomiale e autofagico che non tiene il passo. Parti dal
    quadro d'insieme: fibre muscolari tagliate di traverso, di calibro molto diseguale, separate da setti connettivali
    ampi e ricchi di nuclei; le grandi aree bianche in alto stanno fuori dalle fibre e non fanno parte della lesione.
    Poi guarda dentro le fibre in basso a sinistra e nella grande fibra sotto il centro: buchi chiari e irregolari,
    bordati da una frangia di materiale granulare grigio-azzurro. Sono i vacuoli orlati (rimmed vacuoles).
    Corrispondono a lisosomi ingranditi che trattengono ciò che la cellula ha sequestrato ma non è riuscita a digerire:
    al microscopio elettronico, filamenti caratteristici e vortici di membrane riempiono i granuli lungo il loro bordo.
    Infine spostati sul margine destro: un gruppo di piccole cellule mononucleate scure occupa l'endomisio e preme
    contro una fibra; in questa malattia sono soprattutto linfociti T citotossici, ed è per questo che il quadro ricorda
    la polimiosite. Punti d'esame: il tessuto fissato in formalina non mostra questi vacuoli, che vanno quindi cercati su
    sezioni congelate (al criostato); le fibre accumulano anche proteine tipiche delle malattie
    neurodegenerative, come la β-amiloide, la tau fosforilata e TDP-43; la terapia immunosoppressiva non è efficace.
  en: >-
    Inclusion body myositis, which after the age of 50 is the commonest inflammatory disease of muscle, in a muscle
    biopsy stained with H&E at medium power (×200 according to the author). It shows, on a routine stain, what
    happens when lysosomal and autophagic clearance cannot keep up. First take in the field: muscle fibres cut
    across, of very unequal size, separated by broad connective tissue septa rich in nuclei; the large white areas at
    the top lie outside the fibres and are not part of the lesion. Then look inside the fibres at the lower left and in
    the large fibre below the centre: irregular clear holes edged by a fringe of grey-blue granular material. These
    are rimmed vacuoles. They correspond to enlarged lysosomes holding what the cell has walled off but failed to
    digest: under the electron microscope, characteristic filaments and whorls of membrane fill the granules along
    their rim. Finally move to the right edge: a cluster of small, dark mononuclear cells fills the endomysium and
    presses into a fibre; in this disease they are mostly cytotoxic T cells, which is why the picture resembles
    polymyositis. Exam points: formalin-fixed tissue does not show these vacuoles, so they are sought on frozen
    (cryostat) sections; the fibres also accumulate proteins typical of neurodegenerative diseases, such as β-amyloid,
    phosphorylated tau and TDP-43; immunosuppressive treatment does not work.
alt:
  it: >-
    Micrografia in ematossilina-eosina di muscolo scheletrico tagliato di traverso: numerose fibre rosa intenso,
    tondeggianti e di dimensioni diverse, separate da connettivo rosa pallido con nuclei viola scuro. Due fibre, in basso
    a sinistra e in basso al centro, contengono buchi bianchi irregolari bordati da materiale granulare grigio-azzurro.
    Sul margine destro un fitto gruppo di piccoli nuclei scuri e rotondi si trova fra le fibre e preme contro una di
    esse. Grandi aree bianche vuote occupano gli angoli in alto a sinistra e in alto a destra.
  en: >-
    H&E micrograph of skeletal muscle cut across: many deep pink, rounded fibres of different sizes separated by pale
    pink connective tissue with dark purple nuclei. Two fibres, at the lower left and lower centre, contain irregular
    white holes edged with grey-blue granular material. At the right edge a dense cluster of small, dark, round nuclei
    lies between fibres and presses into one of them. Large empty white areas fill the top left and top right corners.
