lookFor:
  it: "Scorri da sinistra a destra: granuli blu fitti negli epatociti vicino al connettivo rosa, che si diradano verso la metà destra piena di grasso."
  en: "Scan left to right: heavy blue granules in the hepatocytes near the pink connective tissue, thinning out towards the fatty right half."
caption:
  it: >-
    Agobiopsia epatica, colorazione di Perls (blu di Prussia) a piccolo ingrandimento (×10 secondo la fonte):
    emocromatosi genetica in un uomo omozigote per la mutazione C282Y del gene HFE, cioè il quadro parenchimale del
    sovraccarico di ferro. Percorri il frustolo da sinistra a destra. A sinistra, ai due lati di una banda rosa di
    tessuto connettivo (con ogni probabilità uno spazio portale), gli epatociti sono gremiti di granuli blu scuro che
    disegnano le trabecole epatiche: il ferro sta dentro le cellule epatiche, non solo nei macrofagi. Spostandoti verso
    destra il blu si attenua: è il gradiente acinare descritto dalla fonte, massimo nella zona 1, attorno allo spazio
    portale. La metà destra è occupata da grandi vacuoli rotondi vuoti, gocce di grasso di una steatosi macrovescicolare
    (un reperto distinto in questo paziente), quasi senza ferro. Perché la distribuzione conta: nell'emocromatosi
    ereditaria la carenza di epcidina lascia via libera all'assorbimento intestinale del ferro, e l'eccesso si deposita
    nelle cellule parenchimali (epatociti, epitelio dei dotti biliari), che alla lunga danneggia; le cellule di Kupffer
    si caricano solo tardi. Dopo trasfusioni ripetute l'ordine si inverte: prima si riempiono le cellule di Kupffer, poi
    gli epatociti. La barra nera in basso a destra è la scala originale di 500 µm.
  en: >-
    Liver needle biopsy, Perls' Prussian blue at low power (×10 in the source): genetic hemochromatosis in a man
    homozygous for the HFE C282Y mutation, the parenchymal pattern of iron overload. Scan the core from left to right.
    On the left, on both sides of a pink band of connective tissue (most likely a portal tract), the hepatocytes are
    crowded with dark blue granules that outline the liver-cell plates: the iron sits in the liver cells themselves, not
    just in macrophages. Moving right, the blue fades: this is the acinar gradient the source describes, heaviest in
    zone 1 around the portal tract. The right half is taken up by large, round, empty holes, the fat droplets of
    macrovesicular steatosis (a separate finding in this patient), with almost no iron. Why the pattern matters: in
    hereditary hemochromatosis a lack of hepcidin leaves the gut free to absorb iron, and the surplus is stored in
    parenchymal cells (hepatocytes, bile duct epithelium), which it eventually damages; Kupffer cells load up only late.
    After repeated transfusions the order is reversed: Kupffer cells fill first and hepatocytes only later. The black
    bar at lower right is the original 500 µm scale.
alt:
  it: >-
    Micrografia a piccolo ingrandimento di una lunga striscia di tessuto epatico su fondo chiaro, colorata per il ferro:
    la parte sinistra è punteggiata da numerosi granuli blu scuro in un tessuto azzurro-grigio, attorno a una banda rosa
    di connettivo; la parte destra è piena di grandi fori bianchi rotondi con poco blu; in basso a destra una barra di
    scala nera con la scritta 500 µm.
  en: >-
    Low-power micrograph of a long strip of liver tissue on a pale background, stained for iron: the left part is
    speckled with many dark blue granules in pale blue-gray tissue around a pink band of connective tissue; the right
    part is full of large round white holes with little blue; a black scale bar labelled 500 µm at the bottom right.
