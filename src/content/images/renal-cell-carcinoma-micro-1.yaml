lookFor:
  it: "Guarda la trama del tessuto: spazi vuoti chiari e fitti, a nido d'ape, con sottili setti rosa."
  en: "Look at the texture of the tissue: crowded pale empty-looking spaces like a honeycomb, with thin pink septa."
caption:
  it: >-
    Carcinoma a cellule chiare, grado 1, EE a basso ingrandimento (frustolo bioptico). Il tessuto è formato da cellule
    con citoplasma otticamente vuoto, separate da sottili setti rosa ricchi di piccoli vasi. Il grado si legge poi ad
    alto ingrandimento sui nucleoli.
  en: >-
    Clear cell carcinoma, grade 1, H&E at low power (biopsy core). The tissue is made of cells with optically empty
    cytoplasm, separated by thin pink septa rich in small vessels. The grade is then read at high power from the
    nucleoli.
alt:
  it: >-
    Micrografia a basso ingrandimento in EE: un frustolo allungato rosa-violaceo con aspetto finemente vacuolato su
    sfondo chiaro; in basso a sinistra una macchia blu di inchiostro.
  en: >-
    Low-power H&E micrograph: an elongated pink-purple tissue core with a finely vacuolated look on a pale background;
    a blue ink smear at the lower left.
