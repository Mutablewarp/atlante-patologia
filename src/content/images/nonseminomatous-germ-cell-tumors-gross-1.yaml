caption:
  it: >-
    Tumore germinale misto del testicolo, superficie di taglio. Guarda prima il profilo: il testicolo è molto
    aumentato di volume e la parete esterna è sottile. Poi la superficie di taglio: non è omogenea, ma divisa in
    cavità di varie dimensioni, con aree rosso scuro emorragiche e zone chiare, biancastre e molli. Questa
    eterogeneità macroscopica rispecchia la presenza di più componenti istologici nello stesso tumore.
  en: >-
    Mixed germ cell tumor of the testis, cut surface. Look at the outline first: the testis is greatly enlarged and
    the outer wall is thin. Then the cut surface: it is not uniform but split into cavities of different sizes, with
    dark red hemorrhagic areas and pale, whitish, soft zones. This gross variegation reflects the presence of several
    histologic components in one tumor.
alt:
  it: >-
    Fotografia su fondo nero di un testicolo sezionato, con il funicolo in alto a sinistra: all'interno molte
    cavità e logge irregolari, aree rosso scuro emorragiche e zone chiare biancastre di tessuto molle.
  en: >-
    Photograph on a black background of a bisected testis, spermatic cord at the upper left: inside are many
    irregular cavities and loculi, dark red hemorrhagic areas and pale whitish zones of soft tissue.
