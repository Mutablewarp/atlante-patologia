lookFor:
  it: "Trova i bastoncelli blu-viola sparsi sul fondo pallido, poi chiediti dove siano i neutrofili: quasi non ce ne sono."
  en: "Find the blue-purple rods scattered over the pale background, then ask where the neutrophils are: there are almost none."
caption:
  it: >-
    Colorazione di Gram del muscolo asportato nello stesso intervento dell'immagine in EE di questa serie (gangrena
    gassosa della gamba; 1000× nell'articolo di origine). Con questa colorazione i batteri che trattengono il
    colorante violetto, i gram-positivi, appaiono blu-viola. Percorri il campo: decine di bastoncelli corti e diritti,
    con le estremità tronche, sono sparsi, isolati o a coppie, in un tessuto pallido e morto. Secondo gli autori,
    l'esame microbiologico e quello istologico di questo tessuto hanno confermato che la causa era Clostridium
    perfringens. Poi cerca ciò che manca: intorno ai batteri non si raccoglie alcuna folla di neutrofili, benché
    infezione e necrosi siano estese. Questa assenza è un indizio tipico della gangrena gassosa: la tossina α del
    clostridio, una fosfolipasi, verosimilmente distrugge anche i leucociti. Nella gangrena umida, al contrario, i
    neutrofili invadono il tessuto morto e lo colliquano. Da ricordare all'esame: bastoncelli gram-positivi con
    pochissimi neutrofili nel tessuto di una ferita orientano subito verso la gangrena gassosa, un'emergenza
    chirurgica. Passa all'immagine in EE per vedere le bolle di gas e le fibre necrotiche dello stesso tessuto.
  en: >-
    Gram stain of the muscle removed at the same operation as the H&E image of this set (gas gangrene of the leg;
    1000× in the source article). With this stain, bacteria that keep the violet dye, the gram-positive ones, look
    blue-purple. Scan the field: dozens of short, straight rods with blunt ends lie scattered, singly or in pairs,
    through pale, dead tissue. According to the authors, microbiology and histology of this tissue confirmed
    Clostridium perfringens as the cause. Then look for what is missing: no crowd of neutrophils gathers around the
    bacteria, even though infection and necrosis are extensive. That absence is a typical clue to gas gangrene: the
    clostridial α toxin, a phospholipase, probably destroys white cells as well. In wet gangrene, by contrast,
    neutrophils pour into the dead tissue and liquefy it. For the exam: gram-positive rods with hardly any neutrophils
    in tissue from a wound point towards gas gangrene, a surgical emergency. Switch to the H&E image to see the gas
    bubbles and dead fibres of the same tissue.
alt:
  it: >-
    Micrografia con colorazione di Gram a forte ingrandimento: su un fondo rosa-grigio pallido a fibre ondulate sono
    sparsi molti piccoli bastoncelli blu-viola, diritti, isolati o a coppie; in basso alcuni corpi ovali rossi.
  en: >-
    High-power Gram-stained micrograph: over a pale pink-grey background of wavy fibres lie many small, straight,
    blue-purple rods, single or in pairs; a few red oval bodies are near the bottom.
