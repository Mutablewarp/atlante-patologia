lookFor:
  it: "Leggi la scala del righello contro lo spessore della parete ventricolare sezionata e confrontala con la cavità sottostante."
  en: "Read the ruler scale against the thickness of the cut ventricular wall and compare it with the cavity below."
caption:
  it: >-
    Cuore aperto all'autopsia con un righello centimetrato. Usa il righello per giudicare lo spessore della parete
    ventricolare tagliata, tenuta tra le dita, e confrontalo con la cavità, dove si vedono le trabecole e le corde
    tendinee. Una parete spessa rispetto alla cavità è il reperto atteso nell'ipertrofia.
  en: >-
    Heart opened at autopsy with a centimeter ruler. Use the ruler to judge the thickness of the cut ventricular wall
    held between the fingers, and compare it with the cavity, where trabeculae and chordae tendineae are visible. A
    wall that is thick relative to the cavity is the expected finding in hypertrophy.
alt:
  it: >-
    Fotografia di un cuore aperto, con mani guantate che tengono un righello contro la parete ventricolare sezionata;
    sotto si vedono la cavità con trabecole e corde tendinee e una valvola.
  en: >-
    Photograph of an opened heart, with gloved hands holding a ruler against the cut ventricular wall; below are
    the cavity with trabeculae and chordae tendineae and a valve.
