lookFor:
  it: "Parti dalla superficie in alto, poi cerca gli addensamenti viola scuro di linfociti nella lamina propria."
  en: "Start at the surface at the top, then look for the dark purple clusters of lymphocytes in the lamina propria."
caption:
  it: >-
    Cistite follicolare, EE a basso ingrandimento. Segui il bordo superiore: è la superficie della mucosa, con
    l'urotelio sottile. Sotto, la lamina propria è occupata da piccoli addensamenti rotondi, viola scuro, di
    linfociti: sono follicoli linfoidi. Il tessuto tra un follicolo e l'altro è più chiaro e contiene infiltrato
    infiammatorio diffuso e piccoli vasi.
  en: >-
    Follicular cystitis, H&E at low power. Follow the upper edge: this is the mucosal surface, with a thin urothelium.
    Below it, the lamina propria holds small, round, dark purple clusters of lymphocytes: these are lymphoid
    follicles. The tissue between the follicles is paler and contains a diffuse inflammatory infiltrate and small
    vessels.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: una mucosa vescicale con urotelio sottile lungo il bordo
    superiore e, sotto, diversi noduli rotondi viola scuro di linfociti in un tessuto rosa-violaceo, con un lume
    vuoto al centro.
  en: >-
    Low-power H&E micrograph: a bladder mucosa with a thin urothelium along the upper edge and, below it, several
    round dark purple lymphocyte nodules in pink-purple tissue, with an empty lumen at the center.
