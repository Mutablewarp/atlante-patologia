lookFor:
  it: "Guarda la forma dei nuclei, la cromatina e il citoplasma quasi assente, poi cerca le mitosi."
  en: "Look at the nuclear shape, the chromatin and the almost absent cytoplasm, then look for mitoses."
caption:
  it: >-
    Carcinoma a piccole cellule, EE ad alto ingrandimento (la sede ritratta è una metastasi alla parete toracica da
    primitivo polmonare). Guarda prima i nuclei: sono piccoli, ovali o allungati, violacei, con cromatina finemente
    granulare e citoplasma scarsissimo. Le cellule sono addossate e i nuclei si deformano a vicenda. Cerca poi le
    mitosi: se ne vedono diverse, scure e grumose.
  en: >-
    Small cell carcinoma, H&E at high power (the site shown is a chest-wall metastasis from a lung primary). Look at
    the nuclei first: they are small, oval or elongated and purple, with finely granular chromatin and very little
    cytoplasm. The cells are packed together and their nuclei mold against one another. Then look for mitoses: several
    dark, clumped figures are visible.
alt:
  it: >-
    Micrografia in ematossilina-eosina ad alto ingrandimento: fitto strato di cellule con nuclei violacei ovali o
    allungati, citoplasma rosa appena visibile, nuclei addossati e deformati, alcune figure mitotiche scure.
  en: >-
    High-power H&E micrograph: a dense sheet of cells with oval or elongated purple nuclei, barely visible pink
    cytoplasm, crowded and molded nuclei, and a few dark mitotic figures.
