caption:
  it: >-
    Steatosi macrovescicolare centrolobulare (zona 3) del fegato, EE a piccolo ingrandimento. Prima di cercare le
    cellule, guarda la distribuzione: i vacuoli bianchi, rotondi e a margini netti si raccolgono in chiazze attorno alle
    vene centrolobulari, mentre il parenchima tra una chiazza e l'altra, verso gli spazi portali (aree rosa più fibrose),
    resta compatto e rosa. Ogni vacuolo è lo spazio lasciato da una goccia di trigliceridi, sciolta dai solventi durante
    l'allestimento: per questo appare vuoto. A forte ingrandimento le gocce grandi occupano quasi tutta la cellula e spingono il nucleo alla
    periferia. Perché la zona 3? È la parte del lobulo più lontana dall'apporto di ossigeno e più ricca degli enzimi
    che metabolizzano alcol e farmaci, quindi la più vulnerabile all'alcol, all'ipossia e ai disturbi metabolici. Attenzione: i buchi tondi e vuoti
    indicano grasso; il rigonfiamento idropico dà invece un citoplasma pallido e sfilacciato senza vacuoli a stampo.
  en: >-
    Centrilobular (zone 3) macrovesicular steatosis of the liver, H&E at low power. Before looking at single cells, read
    the distribution: the round, white, sharp-edged vacuoles gather in patches around the central veins, while the
    parenchyma between patches, towards the portal tracts (the pinker, more fibrous areas), stays solid and pink. Each
    vacuole is the space left by a triglyceride droplet dissolved by solvents during processing, which is why it looks
    empty. At high
    power the large droplets fill most of the cell and push the nucleus to the edge. Why zone 3? It is the part of the
    lobule farthest from the oxygen supply and the richest in the enzymes that metabolise alcohol and drugs, so it is the
    most vulnerable to alcohol, hypoxia and metabolic stress. Pitfall: round, empty, punched-out holes mean fat; hydropic swelling instead gives
    pale, wispy cytoplasm without punched-out vacuoles.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina a piccolo ingrandimento: su fondo rosa compatto spiccano chiazze di
    numerosi vacuoli bianchi e rotondi di varie dimensioni, una grande al centro e altre ai bordi dell'immagine, separate
    da parenchima rosa senza vacuoli.
  en: >-
    Low-power H&E micrograph of liver: on a dense pink background stand out patches of many round white vacuoles of
    varying size, one large patch in the centre and others at the edges of the image, separated by pink parenchyma
    without vacuoles.
