caption:
  it: >-
    Metaplasia intestinale incompleta nell'esofago di Barrett, EE a forte ingrandimento. Qui si vedono da vicino i due
    tipi di cellule che convivono nella forma incompleta. Le cellule caliciformi sono rigonfie e a forma di calice:
    ciascuna contiene un unico grande vacuolo di muco ovale, a margini netti, con un tono grigio-azzurro e un aspetto
    finemente granulare. Lungo la superficie, invece, le cellule colonnari di tipo gastrico (foveolari) hanno una
    piccola coppa di mucina apicale chiara, appena rosata; i loro bordi cellulari netti danno un aspetto a nido
    d'ape. Nella metà inferiore si vedono i nuclei allungati delle cellule colonnari, allineati alla base. Tranello: una
    cellula foveolare molto distesa di muco può imitare una caliciforme (pseudo-caliciforme); cerca il tono azzurro e
    la forma a calice ben delimitata. Sono le cellule caliciformi a documentare la metaplasia intestinale.
  en: >-
    Incomplete intestinal metaplasia in Barrett esophagus, H&E at high power. Here you see up close the two cell types
    that coexist in the incomplete form. Goblet cells are swollen and goblet-shaped: each holds a single large, oval,
    sharply outlined mucin vacuole with a grey-blue tint and a finely granular look. Along the surface, by contrast,
    the gastric-type (foveolar) columnar cells carry a small cup of clear, faintly pink apical mucin; their crisp cell
    borders give a honeycomb pattern. In the lower half you see the elongated nuclei of the columnar cells, lined up
    at the base. Pitfall: a foveolar cell heavily distended by mucin can mimic a goblet cell (pseudo-goblet cell);
    look for the blue tint and the well-defined goblet shape. It is the goblet cells that document intestinal
    metaplasia.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina di un epitelio colonnare: una fila di grandi vacuoli
    ovali grigio-azzurri, piccole cellule chiare a nido d'ape lungo il margine superficiale a sinistra e in alto, e
    nella metà inferiore numerosi nuclei viola allungati.
  en: >-
    High-power H&E micrograph of a columnar epithelium: a row of large grey-blue oval vacuoles, small clear
    honeycomb-like cells along the surface edge at the left and top, and many elongated purple nuclei in the lower
    half.
