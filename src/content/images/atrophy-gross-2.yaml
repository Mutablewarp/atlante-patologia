orientation:
  it: "Veduta laterale di entrambi gli encefali, con il polo frontale a sinistra e il cervelletto in basso a destra."
  en: "Lateral view of both brains, with the frontal pole on the left and the cerebellum at the lower right."
lookFor:
  it: "Confronta prima le dimensioni complessive, poi i due encefali giro per giro: spessore dei giri e ampiezza dei solchi."
  en: "Compare overall size first, then the two brains gyrus by gyrus: width of the gyri and of the sulci."
caption:
  it: >-
    Due encefali fotografati di lato in bianco e nero: in alto quello di un donatore con malattia di Alzheimer,
    in basso un encefalo sano per il confronto. È l'atrofia vista dall'esterno; le sezioni coronali mostrano lo stesso
    processo dall'interno, con corteccia assottigliata e ventricoli dilatati. Confronta prima le dimensioni: l'encefalo
    con Alzheimer è nettamente più piccolo. Poi confronta la superficie. Nell'encefalo sano i giri sono pieni e
    accostati, per cui i solchi appaiono come linee sottili; nell'encefalo con Alzheimer i giri sono assottigliati e i
    solchi beanti su tutta la faccia laterale, in modo evidente nella parte anteriore e nel lobo temporale. Il
    cervelletto, in basso a destra, ha un aspetto simile nei due casi: la perdita di tessuto riguarda la corteccia
    cerebrale. È un'atrofia da perdita di cellule: i neuroni muoiono e non vengono sostituiti, quindi il danno non
    regredisce. Nel vivente lo spazio lasciato dal tessuto perso si riempie di liquor e i ventricoli si dilatano
    (idrocefalo ex vacuo). Attenzione: un certo assottigliamento dei giri accompagna anche l'invecchiamento normale,
    perciò va giudicato rispetto a un encefalo di pari età e insieme al quadro clinico; l'encefalo edematoso ha invece
    l'aspetto opposto, con giri appiattiti e solchi ristretti.
  en: >-
    Two brains photographed from the side in black and white: above, the brain of a donor with Alzheimer
    disease; below, a healthy brain for comparison. This is atrophy seen from the outside; coronal slices show the
    same process from the inside, with a thinned cortex and enlarged ventricles. Compare overall size first: the
    Alzheimer brain is clearly smaller. Then compare the surface. In the healthy brain the gyri are plump and pressed
    together, so the sulci appear as thin lines; in the Alzheimer brain the gyri are thinned and the sulci gape over
    the whole lateral surface, most clearly toward the front and in the temporal lobe. The cerebellum, at the lower
    right, looks much the same in both: the loss of tissue concerns the cerebral cortex. This is atrophy through loss
    of cells: neurons die and are not replaced, so the damage does not reverse. In life the space left by the lost
    tissue fills with cerebrospinal fluid and the ventricles enlarge (hydrocephalus ex vacuo). Pitfall: some thinning
    of the gyri also comes with normal ageing, so it must be judged against a brain of the same age and together with
    the clinical picture; an oedematous brain has the opposite look, with flattened gyri and narrowed sulci.
alt:
  it: >-
    Fotografia in bianco e nero di due encefali visti di lato su fondo nero, uno sopra l'altro: quello in alto è
    più piccolo, con giri sottili separati da solchi larghi e scuri; quello in basso è più grande, con giri pieni e
    serrati e solchi stretti; in entrambi si vede in basso a destra il cervelletto con le sue lamelle.
  en: >-
    Black-and-white photograph of two brains seen from the side on a black background, one above the other: the
    upper brain is smaller, with thin gyri separated by wide, dark sulci; the lower brain is larger, with plump,
    closely packed gyri and narrow sulci; in both, the finely ridged cerebellum is visible at the lower right.
