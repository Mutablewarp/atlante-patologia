lookFor:
  it: "Cerca il colore marrone nel citoplasma delle cellule tumorali e confrontalo con i nuclei blu e con lo stroma quasi privo di colore."
  en: "Look for the brown color in the cytoplasm of the tumor cells and compare it with the blue nuclei and the almost unstained stroma."
caption:
  it: >-
    Immunoistochimica per PSA in un linfonodo con metastasi di carcinoma prostatico, ad alto ingrandimento. Guarda
    prima i nidi di cellule tumorali: il citoplasma è marrone, il segno che le cellule producono PSA, mentre i nuclei,
    controcolorati in blu, restano senza reazione. Poi guarda lo stroma intorno ai nidi: è quasi incolore. Questo è
    un marcatore tissutale usato per riconoscere la linea cellulare di una metastasi; lo stesso antigene, misurato nel
    sangue, serve invece a seguire il tumore.
  en: >-
    Immunohistochemistry for PSA in a lymph node with metastatic prostate cancer, high power. Look first at the nests
    of tumor cells: the cytoplasm is brown, showing that the cells make PSA, while the nuclei, counterstained blue,
    carry no reaction. Then look at the stroma around the nests: it is almost colorless. This is a tissue marker used
    to recognize the lineage of a metastasis; the same antigen, measured in blood, is used instead to follow the
    tumor.
alt:
  it: >-
    Micrografia in immunoistochimica: gruppi di cellule con citoplasma marrone intenso e nuclei blu rotondi, separati
    da uno stroma pallido con sottili nuclei blu allungati.
  en: >-
    Immunohistochemistry micrograph: clusters of cells with intense brown cytoplasm and round blue nuclei, separated
    by pale stroma with thin elongated blue nuclei.
