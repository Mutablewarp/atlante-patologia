lookFor:
  it: "Cerca al centro la sfera rosa concentrica (perla cornea) e guarda il citoplasma abbondante e rosa delle cellule intorno."
  en: "Find the concentric pink sphere at the center (keratin pearl) and look at the abundant pink cytoplasm of the cells around it."
caption:
  it: >-
    Carcinoma squamoso del polmone, EE ad alto ingrandimento, stesso caso dell'immagine a basso ingrandimento. Le
    cellule tumorali sono ampie, con abbondante citoplasma rosa e nuclei grandi e irregolari. Al centro una perla
    cornea: un piccolo corpo rosa a strati, segno di cheratinizzazione. Intorno al tumore si vedono linfociti ed
    eosinofili.
  en: >-
    Lung squamous cell carcinoma, H&E at high power, same case as the low-power image. The tumor cells are large, with
    abundant pink cytoplasm and big, irregular nuclei. At the center is a keratin pearl: a small layered pink body that
    marks keratinization. Lymphocytes and eosinophils are seen around the tumor.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: grandi cellule con citoplasma rosa pallido e nuclei
    irregolari; al centro una sfera rosa intenso con un anello chiaro; ai margini piccole cellule infiammatorie
    scure.
  en: >-
    High-power H&E micrograph: large cells with pale pink cytoplasm and irregular nuclei; at the center a deep pink
    sphere with a clear ring; at the edges small dark inflammatory cells.
