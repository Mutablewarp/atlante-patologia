orientation:
  it: "Corticale vitale in alto a sinistra; l'infarto occupa il resto del campo, verso il basso a destra."
  en: "Living cortex at the upper left; the infarct fills the rest of the field towards the lower right."
lookFor:
  it: "Confronta il glomerulo in alto a sinistra con quelli pallidi in basso: stessa forma, ma solo quello vivo ha ancora i nuclei."
  en: "Compare the glomerulus at the top left with the pale ones at the bottom: same shape, but only the living one still has nuclei."
caption:
  it: >-
    Margine di un infarto renale, EE a piccolo ingrandimento (4X secondo la fonte). Parti dall'angolo in alto a
    sinistra, dove la corticale è ancora viva: un glomerulo affollato di nuclei violacei e, lungo il bordo sinistro,
    tubuli le cui cellule epiteliali conservano il nucleo. Poi scendi verso destra, dentro l'infarto. Le stesse
    strutture ci sono ancora, con la loro forma intatta, sia i tubuli sia i glomeruli, ma sono uniformemente rosa e
    non hanno quasi più nuclei. Questi profili «fantasma» sono la firma della necrosi coagulativa: le cellule sono
    morte, ma per un certo tempo l'architettura del tessuto resiste, perché le cellule morte non sono ancora state
    digerite. Tra i
    tubuli i globuli rossi riempiono l'interstizio, soprattutto intorno al glomerulo in basso a sinistra; la fonte
    segnala anche un modesto infiltrato infiammatorio lungo il margine. Questo sangue al margine è il versante
    microscopico della fascia emorragica scura che, a occhio nudo, incornicia un infarto recente. Nota che i glomeruli
    muoiono insieme ai tubuli: in un infarto tutte le strutture del territorio dell'arteria occlusa vanno incontro a
    necrosi coagulativa. Passa all'immagine a forte ingrandimento per vedere da vicino tubuli e glomeruli fantasma.
  en: >-
    Edge of a renal infarct, H&E at low power (labeled 4X by the source). Start at the upper left, where the cortex
    is still alive: a glomerulus crowded with purple nuclei and, along the left edge, tubules whose epithelial cells
    keep their nuclei. Then move down and to the right, into the infarct. The same structures are still there with
    their shapes intact, tubules and glomeruli alike, but they are evenly pink and have almost no nuclei left. These
    "ghost" outlines are the signature of coagulative necrosis: the cells are dead, yet for a while the tissue plan
    holds because the dead cells have not been digested yet. Between the tubules, red blood cells pack the
    interstitium, most
    densely around the glomerulus at the bottom left; the source also notes a mild inflammatory infiltrate along the
    border. This blood at the margin is the microscopic side of the dark hemorrhagic band that frames a recent infarct
    to the naked eye. Note that the glomeruli die together with the tubules: in an infarct, every structure in the
    territory of the blocked artery undergoes coagulative necrosis. Switch to the high-power image to see ghost
    tubules and glomeruli up close.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento di corticale renale: in alto a sinistra un glomerulo
    rotondo pieno di nuclei viola scuro e tubuli con nuclei visibili; nel resto del campo tubuli rosa e due glomeruli
    rotondi pallidi quasi senza nuclei, separati da numerosi globuli rossi.
  en: >-
    Low-power H&E micrograph of kidney cortex: at the upper left, a round glomerulus packed with dark purple nuclei and
    tubules with visible nuclei; over the rest of the field, pink tubules and two pale round glomeruli with almost no
    nuclei, separated by many red blood cells.
