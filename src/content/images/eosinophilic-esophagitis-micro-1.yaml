lookFor:
  it: "Cerca i cerchi rosso vivo nell'epitelio: sono le papille del connettivo, allungate e congeste."
  en: "Look for the bright red circles in the epithelium: they are the connective tissue papillae, elongated and congested."
caption:
  it: >-
    Biopsia esofagea con esofagite eosinofila, EE a basso ingrandimento. Guarda prima il frammento di epitelio
    pavimentoso stratificato, spesso e con zone più viola. Poi cerca i cerchi rosso vivo, le papille del connettivo con
    vasi congesti: salgono alte nello spessore dell'epitelio. Papille allungate e iperplasia delle cellule basali sono
    i segni da riconoscere a questo ingrandimento; gli eosinofili si contano a ingrandimento maggiore.
  en: >-
    Esophageal biopsy with eosinophilic esophagitis, H&E at low power. Look first at the fragment of stratified
    squamous epithelium, which is thick and has more purple areas. Then find the bright red circles, the connective
    tissue papillae with congested vessels: they climb high into the thickness of the epithelium. Elongated papillae
    and basal cell hyperplasia are the signs to recognize at this power; the eosinophils are counted at higher power.
alt:
  it: >-
    Micrografia a basso ingrandimento, in ematossilina-eosina, di frammenti bioptici di epitelio pavimentoso
    stratificato esofageo su sfondo bianco: tessuto viola-rosa con molti cerchi rosso vivo disposti in file nella
    parte sinistra e zone più scure e cellulari a destra.
  en: >-
    Low-power H&E micrograph of biopsy fragments of esophageal stratified squamous epithelium on a white background:
    purple-pink tissue with many bright red circles arranged in rows on the left, and darker, more cellular areas on
    the right.
