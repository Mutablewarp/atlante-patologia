lookFor:
  it: "Cerca le bande rosa e omogenee che rivestono la parete degli alveoli, in mezzo a capillari congesti e a cellule infiammatorie."
  en: "Look for the pink, homogeneous bands lining the alveolar walls, among congested capillaries and inflammatory cells."
caption:
  it: >-
    Polmone nella fase essudativa del danno alveolare diffuso, ad alto ingrandimento. Orientati con il bronchiolo
    obliquo a sinistra e con il grosso vaso pieno di globuli rossi accanto a lui. A destra gli spazi aerei sono
    ristretti: le pareti alveolari sono congeste, con globuli rossi e cellule infiammatorie. Lungo il contorno di molti
    alveoli corrono bande rosa chiaro, omogenee e vetrose: sono le membrane ialine, proteine plasmatiche precipitate
    contro la parete alveolare danneggiata. Gli alveoli non hanno più un rivestimento epiteliale regolare.
  en: >-
    Lung in the exudative phase of diffuse alveolar damage, high power. Orient yourself with the oblique bronchiole at
    the left and the large vessel full of red cells beside it. On the right the air spaces are narrowed: the alveolar
    walls are congested, with red cells and inflammatory cells. Along the outline of many alveoli run pale pink,
    homogeneous, glassy bands: these are the hyaline membranes, plasma proteins precipitated against the damaged
    alveolar wall. The alveoli no longer have a regular epithelial lining.
alt:
  it: >-
    Micrografia di polmone in ematossilina-eosina: a sinistra un bronchiolo con epitelio cilindrico e un vaso dilatato
    pieno di globuli rossi; a destra alveoli con pareti congeste e bande rosa omogenee lungo i loro margini.
  en: >-
    Micrograph of lung in hematoxylin and eosin: at the left a bronchiole with columnar epithelium and a dilated vessel
    full of red cells; at the right alveoli with congested walls and homogeneous pink bands along their margins.
