lookFor:
  it: "Confronta la distribuzione delle cellule brune nell'epidermide con quella dei cheratinociti rosa e vitrei dell'immagine in EE, poi verifica che il riquadro del controllo negativo non abbia colore bruno."
  en: "Compare where the brown cells lie in the epidermis with the glassy pink keratinocytes of the H&E view, then check that the negative-control inset has no brown."
caption:
  it: >-
    La stessa biopsia di sindrome di Stevens-Johnson in immunoistochimica per la caspasi-3 clivata, ×200; il riquadro in
    basso a destra è il controllo negativo e fa parte della figura pubblicata. La maggior parte dei nuclei è blu
    (colorazione di contrasto) e negativa. I depositi bruni e granulari segnano le cellule che contengono la forma
    clivata, cioè attiva, della caspasi-3, la principale caspasi effettrice: si trovano isolati o in piccoli gruppi
    dentro l'epidermide, nelle stesse zone dei cheratinociti rosa e vitrei dell'immagine in EE, mentre il derma
    sottostante è quasi del tutto negativo. Nel controllo negativo il tessuto resta blu, quindi il segnale bruno non è
    un artefatto di fondo. Perché questa colorazione conta: la procaspasi-3 è presente anche nelle cellule vive, ma
    l'anticorpo riconosce solo la forma tagliata che compare quando la cascata delle caspasi si è attivata, per cui una
    cellula positiva è una cellula ormai avviata all'apoptosi. Da ricordare per l'esame: l'EE fa sospettare l'apoptosi
    dalla morfologia, l'immunoistochimica per la caspasi-3 clivata (o il TUNEL) la dimostra sul piano biochimico nella
    sezione. Gli autori dell'articolo l'hanno usata proprio per sostenere che i cosiddetti cheratinociti «necrotici»
    della sindrome di Stevens-Johnson sono in realtà apoptotici.
  en: >-
    The same Stevens–Johnson biopsy stained by immunohistochemistry for cleaved caspase-3, ×200; the inset at lower
    right is the negative control and belongs to the published figure. Most nuclei are blue (counterstain) and
    negative. The brown granular deposits mark cells that contain the cleaved, active form of caspase-3, the main
    executioner caspase: they lie singly or in small clusters within the epidermis, in the same zones as the glassy pink
    keratinocytes of the H&E view, while the dermis below is almost entirely negative. In the negative control the
    tissue stays blue, so the brown signal is not background artefact. Why this stain matters: procaspase-3 is present
    in living cells too, but the antibody recognises only the cut form that appears once the caspase cascade has been
    switched on, so a positive cell is a cell already committed to apoptosis. Key point for the exam: H&E suggests
    apoptosis from morphology, while immunohistochemistry for cleaved caspase-3 (or TUNEL) demonstrates it
    biochemically in the section. The article's authors used it precisely to argue that the so-called "necrotic"
    keratinocytes of Stevens–Johnson syndrome are in fact apoptotic.
alt:
  it: >-
    Immunoistochimica di cute per la caspasi-3 clivata: epidermide e derma pallidi con nuclei blu, depositi bruni e
    granulari in singole cellule e piccoli gruppi sparsi nell'epidermide e, in basso a destra, un riquadro con un campo
    simile in cui compaiono solo nuclei blu.
  en: >-
    Immunohistochemistry of skin for cleaved caspase-3: pale epidermis and dermis with blue nuclei, brown granular
    deposits in scattered single cells and small clusters within the epidermis, and an inset at lower right showing a
    similar field with blue nuclei only.
