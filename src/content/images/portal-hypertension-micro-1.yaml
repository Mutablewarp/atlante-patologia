lookFor:
  it: "Parti dalla vena centrolobulare al centro (lume vuoto con un sottile bordo verde), poi segui le trabecole epatocitarie: gli spazi chiari tra di esse sono sinusoidi dilatati."
  en: "Start at the central vein in the middle (empty lumen with a thin green rim), then follow the liver cell plates: the pale spaces between them are dilated sinusoids."
caption:
  it: >-
    Congestione epatica da ostacolo al deflusso venoso (biopsia di fegato, tricromica). Al centro una vena
    centrolobulare dilatata; intorno a essa i sinusoidi sono larghi e le trabecole di epatociti sono separate da
    ampi spazi. Il collagene, in verde, forma sottili depositi attorno ai sinusoidi.
  en: >-
    Hepatic congestion from impaired venous outflow (liver biopsy, trichrome stain). At the center a dilated
    central vein; around it the sinusoids are wide and the plates of hepatocytes are separated by large spaces. Collagen, stained
    green, forms thin deposits around the sinusoids.
alt:
  it: >-
    Micrografia a medio ingrandimento di tessuto epatico colorato in rosa-rosso, con una vena centrolobulare dal
    lume vuoto al centro, bordata di verde, e numerosi spazi chiari tra le trabecole di cellule.
  en: >-
    Medium-power micrograph of pink-red stained liver tissue, with a central vein with an empty, green-rimmed lumen
    in the middle and many pale spaces between the cell plates.
