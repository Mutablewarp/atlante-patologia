lookFor:
  it: "Parti dallo strato superficiale e cerca i filamenti sottili color magenta (pseudoife) e i neutrofili tra le cellule squamose."
  en: "Start at the surface layer and look for thin magenta filaments (pseudohyphae) and neutrophils among the squamous cells."
caption:
  it: >-
    Esofagite da Candida, colorazione PAS ad alto ingrandimento. Parti dal bordo superficiale, dove il detrito
    squamoso si sfilaccia: tra le scaglie si vedono filamenti sottili color magenta, le pseudoife. Scendi poi nello
    spessore dell'epitelio: qui piccoli gruppi di neutrofili, con i nuclei multilobati, si infiltrano tra le cellule
    squamose. Il PAS colora in rosso-magenta la parete dei miceti, per questo è la colorazione di scelta per
    riconoscerli.
  en: >-
    Candida esophagitis, PAS stain at high power. Start at the surface edge, where the squamous debris frays: among
    the scales you see thin magenta filaments, the pseudohyphae. Then move down into the epithelium: small groups of
    neutrophils with multilobed nuclei infiltrate between the squamous cells. PAS stains the fungal wall red-magenta,
    which is why it is the stain of choice for spotting them.
alt:
  it: >-
    Micrografia PAS di mucosa esofagea: epitelio squamoso viola con un margine superficiale sfilacciato, alcuni
    filamenti magenta sottili sulla superficie e piccoli gruppi di neutrofili tra le cellule.
  en: >-
    PAS micrograph of esophageal mucosa: purple squamous epithelium with a frayed surface edge, a few thin magenta
    filaments at the surface and small groups of neutrophils between the cells.
