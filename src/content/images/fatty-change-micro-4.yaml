caption:
  it: >-
    Steatosi macrovescicolare periportale (zona 1) in un'agobiopsia epatica, colorazione tricromica a piccolo
    ingrandimento. In questa colorazione gli epatociti sono rossi e il collagene verde-azzurro; le gocce di grasso si
    sono sciolte durante l'allestimento in paraffina, quindi anche qui appaiono come buchi rotondi e vuoti. Trova
    prima i punti di repere: a sinistra uno spazio portale, un piccolo ammasso di nuclei scuri tra fibre collagene
    verdi; a destra una vena centrolobulare, un lume chiaro dalla parete sottile, quasi senza collagene attorno. Poi
    disegna la mappa del grasso: i vacuoli si affollano attorno allo spazio portale e si diradano verso la vena, i cui
    epatociti ne sono quasi privi. Il sangue entra nel lobulo dagli spazi portali e scorre nei sinusoidi fino alla
    vena centrolobulare: gli epatociti accanto allo spazio portale (zona 1) lo ricevono per primi, quelli attorno alla
    vena (zona 3) per ultimi. Qui il grasso sta dunque in zona 1, all'opposto del quadro centrolobulare (zona 3)
    mostrato in un'altra immagine di questa scheda. Davanti a una biopsia annota dove si trova il grasso, oltre al
    tipo di gocce e alla quantità. Passa alla veduta a medio ingrandimento per guardare le gocce dentro le cellule.
  en: >-
    Periportal (zone 1) macrovesicular steatosis in a liver needle biopsy, trichrome stain at low power. In this
    stain hepatocytes are red and collagen is green-blue; the fat droplets were dissolved while the paraffin section
    was being prepared, so here too they show up as round, empty holes. Find the landmarks first: on the left a portal
    tract, a small cluster of dark nuclei among green collagen fibres; on the right a central vein, a clear lumen with
    a thin wall and almost no collagen around it. Then map the fat: the vacuoles crowd around the portal tract and
    thin out towards the vein, whose hepatocytes are almost free of them. Blood enters the lobule at the portal tracts
    and drains through the sinusoids to the central vein, so the hepatocytes next to the portal tract (zone 1) receive
    it first and those around the vein (zone 3) last. So the fat here lies in zone 1, the opposite of the
    centrilobular (zone 3) pattern shown in another image on this card. When you read a biopsy, note where the fat
    lies as well as the droplet type and the amount. Switch to the intermediate-power view to look at the droplets
    inside the cells.
alt:
  it: >-
    Micrografia a piccolo ingrandimento di un frustolo di agobiopsia epatica in colorazione tricromica, disposto in
    orizzontale su fondo bianco: epatociti rossi; nella metà sinistra numerosi vacuoli bianchi rotondi di varie
    dimensioni attorno a un piccolo ammasso di nuclei scuri con fibre verdi; nella metà destra epatociti compatti quasi
    senza vacuoli attorno a un lume vascolare bianco.
  en: >-
    Low-power micrograph of a liver needle core in trichrome stain, lying horizontally on a white background: red
    hepatocytes; in the left half many round white vacuoles of varying size around a small cluster of dark nuclei with
    green fibres; in the right half compact hepatocytes with almost no vacuoles around a white vascular lumen.
