orientation:
  it: "Superficie in alto; mucosa di Barrett a sinistra, epitelio squamoso nativo a destra."
  en: "Surface at the top; Barrett mucosa on the left, native squamous epithelium on the right."
lookFor:
  it: "Cerca prima il blu: le cellule blu a forma di calice sono cellule caliciformi; poi verifica che stiano in una mucosa cilindrica accanto al rivestimento squamoso chiaro."
  en: "Find the blue first: blue cells with a goblet shape are goblet cells; then check that they sit in a columnar mucosa next to the pale squamous lining."
caption:
  it: >-
    Esofago di Barrett colorato con Alcian blu, a piccolo ingrandimento. Nel campo ci sono entrambi i rivestimenti
    dell'esofago distale, quindi per prima cosa distinguili. A destra c'è l'epitelio pavimentoso pluristratificato
    nativo: spesso e pallido, con citoplasma chiaro negli strati superiori. A sinistra il rivestimento squamoso è stato
    sostituito da una mucosa cilindrica che forma proiezioni digitiformi (villiformi) e cripte. Ora cerca il blu. Le
    cellule caliciformi accumulano mucina acida, che l'Alcian blu colora: spiccano come puntini blu scuro lungo i villi
    e come gruppi turchesi nelle cripte, mentre il resto del tessuto resta rosa e viola. Le cellule caliciformi indicano
    la metaplasia intestinale e sono il reperto che definisce l'epitelio specializzato dell'esofago di Barrett.
    Tranelli: anche alcune cellule cilindriche senza forma a calice prendono il colorante, e cellule foveolari distese
    possono perfino imitarne la forma, quindi conta solo le cellule blu con una vera forma a calice, un unico vacuolo di
    muco tondeggiante sopra un piccolo nucleo triangolare; inoltre la colorazione è un aiuto nei casi dubbi, non un
    passaggio di routine, perché in EE le cellule caliciformi si riconoscono quasi sempre (confronta le immagini in EE
    di questa scheda).
  en: >-
    Barrett esophagus stained with Alcian blue, at low power. The field holds both linings of the distal oesophagus,
    so first tell them apart. On the right is the native stratified squamous epithelium: thick and pale, with clear
    cytoplasm in its upper layers. On the left the squamous lining has been replaced by a columnar mucosa that forms
    finger-like (villiform) projections and crypts. Now look for blue. Goblet cells store acid mucin, which Alcian blue
    colours: they stand out as dark-blue dots along the villi and as turquoise clusters in the crypts, while the rest of
    the tissue stays pink and purple. Goblet cells mark intestinal metaplasia and are the finding that defines the
    specialized epithelium of Barrett esophagus. Pitfalls: some columnar cells without the goblet shape take up the dye
    too, and distended foveolar cells can even mimic that shape, so count only blue cells with a true goblet shape, one
    rounded mucin vacuole above a small triangular nucleus; and the stain is a help for doubtful cases, not a routine
    step, because on H&E goblet cells can nearly always be recognised (compare the H&E images of this card).
alt:
  it: >-
    Micrografia a piccolo ingrandimento di mucosa esofagea colorata con Alcian blu: a sinistra una mucosa rosa e viola
    con proiezioni digitiformi e cripte, punteggiata da piccole cellule blu scuro e turchesi; a destra e lungo il
    margine inferiore un epitelio stratificato spesso, rosa chiaro, fatto di cellule a citoplasma chiaro; sfondo bianco
    in alto.
  en: >-
    Low-power micrograph of oesophageal mucosa stained with Alcian blue: on the left, a pink-and-purple mucosa with
    finger-like projections and crypts, dotted with small dark-blue and turquoise cells; on the right and along the
    bottom, a thick, pale pink layered epithelium made of cells with clear cytoplasm; white background at the top.
