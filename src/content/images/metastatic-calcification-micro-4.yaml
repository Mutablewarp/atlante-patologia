lookFor:
  it: "Prima le bande granulose viola scuro (calcio), poi ciò che riempie gli alveoli (essudato)."
  en: "First the granular dark purple bands (calcium), then what fills the alveoli (exudate)."
caption:
  it: >-
    Lo stesso polmone a medio ingrandimento (EE a giudicare dai colori; la fonte non indica l'ingrandimento). Le linee
    viola scuro del piccolo ingrandimento ora appaiono come bande spesse di materiale granuloso, quasi cristallino:
    pareti alveolari così incrostate di sali di calcio da aver perso il loro profilo sottile. Alcuni depositi sono più
    lisci e pallidi e attraversati da sottili fessure, tipiche di un minerale fragile spaccato dalla lama del microtomo.
    Nell'alveolo al centro ci sono granulociti neutrofili con il nucleo lobato, emazie e filamenti rosa pallido di
    fibrina: è la polmonite acuta che la fonte segnala in quest'area. Il piccolo grumo nero in basso a destra è con ogni
    probabilità pigmento antracotico (polvere di carbone), frequente nel polmone dell'adulto: non è calcio, che in EE è
    viola, non nero. Per l'esame: in EE i depositi di calcio sono basofili; per dimostrare che un deposito viola è calcio
    si usa la von Kossa, che lo colora di nero (vedi l'immagine in von Kossa di questa scheda), oppure il rosso
    alizarina. La fonte classifica questo polmone come calcificazione metastatica, e l'incrostazione diffusa delle pareti
    alveolari e vascolari è coerente con questa forma; un singolo deposito, però, ha lo stesso aspetto nella
    calcificazione distrofica, quindi la distinzione si basa sul contesto (tessuto prima sano, alterazione sistemica di
    calcio o fosfato), non sul deposito in sé.
  en: >-
    The same lung at medium power (H&E judging by the colours; the source does not state the magnification). The dark
    purple lines of the low-power view now resolve into thick bands of granular, almost crystalline material: alveolar
    walls so heavily encrusted with calcium salts that their thin outline is lost. Some deposits look smoother and paler
    and are crossed by fine cracks, typical of brittle mineral split by the microtome blade. In the alveolus at the
    centre lie neutrophils with lobed nuclei, red cells and pale pink strands of fibrin: the acute pneumonitis that the
    source reports in this area. The small black clump at the lower right is most probably anthracotic (coal-dust)
    pigment, frequent in adult lungs: it is not calcium, which on H&E is purple, not black. Exam link: calcium deposits
    are basophilic on H&E; to prove that a purple deposit is calcium, use von Kossa, which turns it black (see the von
    Kossa image of this card), or alizarin red. The source classes this lung as metastatic calcification, and the
    diffuse encrustation of alveolar and vessel walls fits that form; a single deposit, however, looks the same in
    dystrophic calcification, so the distinction rests on the setting (previously healthy tissue, a systemic calcium or
    phosphate disorder), not on the deposit itself.
alt:
  it: >-
    Micrografia a medio ingrandimento in rosa e viola: bande spesse, granulose, viola-magenta scuro, alcune con fessure,
    circondano uno spazio centrale che contiene piccole cellule con il nucleo lobato, globuli rossi e filamenti rosa
    pallido; in basso a destra un piccolo grumo granuloso nero.
  en: >-
    Medium-power micrograph in pink and purple: thick, granular, dark purple-magenta bands, some with cracks, surround a
    central space that contains small cells with lobed nuclei, red blood cells and pale pink strands; a small black
    granular clump at the lower right.
