lookFor:
  it: "Trova il nucleo sul margine destro, poi segui la freccia fino al piccolo sacco tondo pieno di citoplasma non digerito."
  en: "Find the nucleus at the right edge, then follow the arrow to the small round sac of undigested cytoplasm."
caption:
  it: >-
    Autofagia in un rene umano: micrografia elettronica a trasmissione di una biopsia renale diagnostica (7000× come
    stampato sulla micrografia), tratta da uno studio che ha confrontato i podociti nella glomerulosclerosi focale
    segmentaria (GSFS), nella malattia a lesioni minime e in reni di controllo; la legenda non dice da quale gruppo
    provenga questo campo. Prima orientati: sul margine destro è sezionato un nucleo, e subito alla sua sinistra c'è il
    citoplasma di un podocita, la cellula epiteliale che riveste dall'esterno i capillari glomerulari. Poi segui la
    freccia: indica un piccolo sacco rotondo, delimitato da membrana e pieno di materiale citoplasmatico fine e non
    digerito, che gli autori hanno identificato come autofagosoma. Passa all'ingrandimento maggiore di questa serie per
    vederne un altro dentro un pedicello. Perché cercarli: i podociti sono cellule terminalmente differenziate e
    mantengono un'autofagia basale elevata per conservare l'omeostasi. In questo studio i podociti della GSFS avevano
    meno autofagosomi e meno cellule positive per LC3 di quelli della malattia a lesioni minime: segno di un adattamento
    peggiore proprio nella malattia che più spesso progredisce. Al microscopio ottico di routine questi sacchi non si
    riconoscono; per questo nei tessuti l'autofagia si dimostra con la microscopia elettronica o con le colorazioni
    immunoistochimiche per LC3 e p62.
  en: >-
    Autophagy in a human kidney: transmission electron micrograph from a diagnostic renal biopsy (7000× printed on the
    micrograph), from a study that compared podocytes in focal segmental glomerulosclerosis (FSGS), minimal change
    disease and control kidneys; the legend does not say which group this field comes from. First get your bearings: a
    nucleus is cut at the right edge, and just to its left lies the cytoplasm of a podocyte, the epithelial cell that
    covers the outside of the glomerular capillaries. Then follow the arrow: it points to a small round sac bounded by
    membrane and filled with fine, undigested cytoplasmic material, which the authors identified as an autophagosome.
    Switch to the higher magnification in this set to see another one inside a foot process. Why look for them:
    podocytes are terminally differentiated and keep a high basal rate of autophagy to maintain homeostasis. In this
    study, FSGS podocytes had fewer autophagosomes and fewer LC3-positive cells than those of minimal change disease, a
    sign of poorer adaptation in the very disease that more often progresses. On routine light microscopy these sacs
    cannot be recognised, which is why autophagy in tissue is shown by electron microscopy or by immunostaining for LC3
    and p62.
alt:
  it: >-
    Micrografia elettronica in bianco e nero. Ampie aree chiare a granulazione fine occupano l'angolo in alto a sinistra
    e quello in basso a destra. Al centro corre una fascia di citoplasma grigio più scuro, con spazi bianchi ramificati
    che contengono piccoli profili ovali scuri. Sul margine destro si vede parte di un nucleo a cromatina granulare.
    Una freccia nera a destra indica un piccolo sacco rotondo delimitato da membrana, con contenuto punteggiato. In
    basso una striscia di dati riporta Mag 7000 x, HV 50 kV e una barra di scala di 2 µm; il codice del campione è
    coperto.
  en: >-
    Black-and-white electron micrograph. Large pale, finely granular areas fill the upper left and lower right corners.
    A band of darker grey cytoplasm crosses the centre, with white branching spaces holding small dark oval profiles. At
    the right edge part of a nucleus with granular chromatin is visible. A black arrow on the right points to a small
    round membrane-bound sac with speckled contents. At the bottom a data strip reads Mag 7000 x, HV 50 kV, with a 2 µm
    scale bar; the specimen code is blanked out.
