lookFor:
  it: "Guarda le cellule grandi con citoplasma rosa abbondante, poi cerca al loro interno piccole inclusioni rotonde."
  en: "Look at the large cells with abundant pink cytoplasm, then search inside them for small round inclusions."
caption:
  it: >-
    Malacoplachia della vescica, EE ad alto ingrandimento. Il campo è affollato di cellule grandi con citoplasma rosa
    abbondante: sono macrofagi. Tra i macrofagi ci sono linfociti e alcuni granulociti, con nuclei più piccoli e
    scuri. Dentro il citoplasma di una parte dei macrofagi si cercano i corpi di Michaelis-Gutmann, piccole
    inclusioni rotonde che identificano la malacoplachia.
  en: >-
    Malakoplakia of the bladder, H&E at high power. The field is crowded with large cells that have abundant pink
    cytoplasm: these are macrophages. Between them lie lymphocytes and a few granulocytes, with smaller, darker nuclei.
    Inside the cytoplasm of some macrophages you search for Michaelis-Gutmann bodies, small round inclusions that
    identify malakoplakia.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: un campo denso di cellule con ampio citoplasma rosa e
    nuclei tondi o ovali, con piccoli elementi infiammatori scuri sparsi tra di esse.
  en: >-
    High-power H&E micrograph: a dense field of cells with broad pink cytoplasm and round to oval nuclei, with small
    dark inflammatory cells scattered among them.
