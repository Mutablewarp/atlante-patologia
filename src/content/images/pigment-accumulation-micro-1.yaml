caption:
  it: >-
    Fegato, EE a forte ingrandimento: due pigmenti bruni nello stesso campo, il confronto classico tra emosiderina e
    lipofuscina. In EE un pigmento bruno è solo "bruno": per capire quale sia guarda tre cose, cioè la cellula che lo
    contiene, la grandezza dei granuli e la loro tinta. In basso a sinistra una cellula di Kupffer (macrofago residente
    del fegato, con nucleo allungato e bluastro) contiene globuli grossolani, tondeggianti, bruno-dorati scuri: è
    emosiderina, la forma di deposito del ferro che i macrofagi accumulano quando demoliscono globuli rossi o quando
    l'organismo è sovraccarico di ferro. Al centro un grande epatocita con nucleo rotondo raccoglie accanto al nucleo
    un gruppo di granuli più fini e più chiari, bruno-giallastri: è lipofuscina, il pigmento "da usura" formato da
    lipidi e proteine ossidati che i lisosomi non riescono a digerire; aumenta con l'età e nelle cellule atrofiche e di
    per sé non danneggia la cellula. Regola pratica in EE: grossolano e scuro dentro un macrofago fa pensare
    all'emosiderina, fine e perinucleare in una cellula parenchimale alla lipofuscina. Per decidere davvero serve la
    colorazione di Perls (blu di Prussia) sullo stesso tessuto: diventa blu solo l'emosiderina.
  en: >-
    Liver, H&E at high power: two brown pigments in the same field, the classic comparison between hemosiderin and
    lipofuscin. On H&E a brown pigment is just "brown": to tell which one it is, look at three things, namely the cell
    that holds it, the size of the granules and their shade. At the lower left a Kupffer cell (a resident liver
    macrophage, with an elongated bluish nucleus) contains coarse, rounded, dark golden-brown globules: this is
    hemosiderin, the storage form of iron that macrophages build up when they break down red cells or when the body is
    overloaded with iron. In the centre a large hepatocyte with a round nucleus holds, next to the nucleus, a cluster of
    finer and paler yellow-brown granules: this is lipofuscin, the "wear-and-tear" pigment made of oxidised lipids and
    proteins that lysosomes cannot digest; it increases with age and in atrophic cells and does not harm the cell by
    itself. Rule of thumb on H&E: coarse and dark inside a macrophage suggests hemosiderin, fine and perinuclear in a
    parenchymal cell suggests lipofuscin. To decide for sure, use the Perls (Prussian blue) stain on the same tissue:
    only hemosiderin turns blue.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina a forte ingrandimento su fondo rosa: al centro un grande epatocita
    con nucleo rotondo viola circondato da fini granuli bruno-giallastri; in basso a sinistra una cellula con nucleo
    allungato bluastro e grossi globuli tondi bruno scuro raccolti in grappoli.
  en: >-
    High-power H&E micrograph of liver on a pink background: in the centre a large hepatocyte with a round purple
    nucleus surrounded by fine yellow-brown granules; at the lower left a cell with an elongated bluish nucleus and
    large, round, dark brown globules gathered in clusters.
