lookFor:
  it: "Cerca il punto in cui l'epitelio pavimentoso pallido in alto incontra le ghiandole con vacuoli chiari rotondi in basso."
  en: "Find where the pale squamous epithelium at the top meets the glands with round clear vacuoles below."
caption:
  it: >-
    Biopsia dell'esofago distale, EE a basso ingrandimento. In alto si vedono due lembi di epitelio pavimentoso
    stratificato, pallido e spesso. Sotto, nella mucosa, le ghiandole sono rivestite da epitelio colonnare con molti
    vacuoli chiari rotondi: sono le cellule caliciformi. Il connettivo tra le ghiandole contiene molte cellule
    infiammatorie. Il passaggio dall'epitelio pavimentoso a quello ghiandolare con cellule caliciformi è la metaplasia
    intestinale dell'esofago di Barrett.
  en: >-
    Biopsy of the distal esophagus, H&E at low power. At the top are two flaps of pale, thick stratified squamous
    epithelium. Below, in the mucosa, the glands are lined by columnar epithelium with many round clear vacuoles:
    these are goblet cells. The connective tissue between the glands holds many inflammatory cells. The change from
    squamous epithelium to glandular epithelium with goblet cells is the intestinal metaplasia of Barrett esophagus.
alt:
  it: >-
    Micrografia in ematossilina-eosina: in alto due lembi di epitelio pavimentoso pallido; in basso numerose ghiandole
    tondeggianti e allungate con piccoli vacuoli chiari nella parete, immerse in un connettivo violaceo ricco di
    cellule.
  en: >-
    H&E micrograph: two flaps of pale squamous epithelium at the top; below, many round and elongated glands with small
    clear vacuoles in their lining, set in a purple, cell-rich connective tissue.
