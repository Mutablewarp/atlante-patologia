orientation:
  it: "Sezione trasversale al criostato: le fibre sono tagliate di traverso; gli spazi bianchi sono endomisio e perimisio."
  en: "Transverse cryostat section: the fibres are cut across; the white spaces are endomysium and perimysium."
lookFor:
  it: "Confronta ogni piccola fibra scura con le vicine chiare: profilo angolato e diametro pari a una frazione del loro."
  en: "Compare each small dark fibre with its pale neighbours: angular outline and a fraction of their diameter."
caption:
  it: >-
    Stessa biopsia e stessa reazione per l'ATPasi miofibrillare a pH 9,4, a forte ingrandimento, dove si legge bene la
    forma delle fibre atrofiche. Le piccole fibre scure (tipo II) hanno perso il profilo arrotondato e sono diventate
    angolate, cioè appiattite, triangolari o a semiluna, e occupano gli stretti spazi fra le grandi fibre chiare
    (tipo I): è il profilo tipico della fibra denervata, che si riduce di volume man mano che perde le miofibrille. In
    un angolo del campo le fibre piccole si addensano in un gruppo, come all'ingrandimento minore. Guarda poi le grandi
    fibre chiare: alcune mostrano una zona centrale rotonda di intensità diversa dal resto, la fibra a bersaglio, segno
    che la denervazione o la reinnervazione sono ancora in corso; è un reperto passeggero, per cui la sua assenza non
    esclude una denervazione. Qualche grande fibra scura ricorda che non tutte le fibre di tipo II sono atrofiche.
    Attenzione: la forma angolata da sola non è specifica, perché anche l'atrofia selettiva delle fibre di tipo II
    (disuso, cortisonici) produce fibre piccole e angolate; a favore della denervazione depone il raggruppamento,
    insieme alle fibre a bersaglio quando presenti. E con questa colorazione scuro non vuol dire danneggiato: il colore
    indica il tipo di fibra, mentre l'atrofia si giudica dal calibro e dalla forma rispetto alle fibre vicine.
  en: >-
    Same biopsy and same myofibrillar ATPase reaction at pH 9.4, at high power, where the shape of the atrophic fibres
    is easy to read. The small dark (type II) fibres have lost their rounded outline and become angular, that is
    flattened, triangular or crescent-shaped, filling the narrow gaps between the large pale (type I) fibres: this is
    the typical outline of a denervated fibre, which shrinks as its myofibrils are lost. In one corner of the field
    the small fibres crowd into a cluster, as at lower power. Then look at the large pale fibres: some show a round
    central zone that stains differently from the rest, the target fibre, a sign that denervation or reinnervation is
    still under way; it is a passing change, so its absence does not rule denervation out. A few large dark fibres
    show that not every type II fibre is atrophic. Pitfall: an angular shape alone is not specific, because selective
    atrophy of type II fibres (disuse, corticosteroids) also produces small angular fibres; what points to
    denervation is the grouping, together with target fibres when they are present. And with this stain dark does not
    mean damaged: the colour reports the fibre type, while atrophy is judged by size and shape compared with the
    neighbouring fibres.
alt:
  it: >-
    Micrografia a forte ingrandimento in bianco, grigio e nero: grandi fibre grigio chiaro a granulosità fine separate
    da sottili spazi bianchi, con numerose piccole fibre nere triangolari, appiattite o a semiluna incuneate fra di
    esse; in alto a sinistra un gruppo di piccole fibre nere, in alto a destra una grande fibra chiara con una zona
    centrale rotonda, e alcune grandi fibre nere sparse nel campo.
  en: >-
    High-power black, grey and white micrograph: large, finely granular pale grey fibres separated by thin white
    spaces, with many small black fibres of triangular, flattened or crescent shape wedged between them; a cluster of
    small black fibres at the upper left, a large pale fibre with a round central zone at the upper right, and a few
    large black fibres scattered across the field.
