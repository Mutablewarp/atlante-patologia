lookFor:
  it: "Cerca la superficie: quasi nessun villo alto e sottile, mentre le cripte in sezione trasversale occupano quasi tutto il campo."
  en: "Look at the surface: there are almost no tall, slender villi, while crypts cut across fill most of the field."
caption:
  it: >-
    Biopsia della seconda porzione del duodeno, EE a medio ingrandimento, con atrofia dei villi. Parti dal bordo libero
    a destra: restano solo rilievi bassi e tozzi, non i villi alti e sottili della mucosa normale. Poi guarda sotto:
    le cripte, tagliate in sezione trasversale, occupano quasi tutto lo spessore della mucosa, e la lamina propria tra
    di esse è densa di cellule infiammatorie. Un quadro così dice atrofia dei villi, non la sua causa: celiachia, sprue
    tropicale e enteropatia autoimmune vanno distinte con clinica, sierologia e altri reperti.
  en: >-
    Biopsy of the second part of the duodenum, H&E at medium power, showing villous atrophy. Start at the free edge on
    the right: only low, stubby folds remain, not the tall, slender villi of normal mucosa. Then look below: the
    crypts, cut across, take up most of the thickness of the mucosa, and the lamina propria between them is dense with
    inflammatory cells. A picture like this shows villous atrophy, not its cause: celiac disease, tropical sprue and
    autoimmune enteropathy have to be told apart by clinical findings, serology and other features.
alt:
  it: >-
    Micrografia EE di mucosa duodenale: numerose cripte rotonde o ovali in sezione trasversale con cellule caliciformi
    chiare, immerse in una lamina propria densa di cellule; a destra un bordo di superficie con pochi rilievi bassi.
  en: >-
    H&E micrograph of duodenal mucosa: many round or oval crypts cut across with pale goblet cells, set in a densely
    cellular lamina propria; at the right, a surface edge with a few low folds.
