lookFor:
  it: "Trova la ghiandola al centro dell'epitelio squamoso: una cripta piena di muco sotto un rivestimento squamoso significa che le cellule squamose sono metaplastiche."
  en: "Find the gland in the middle of the squamous epithelium: a mucus-filled crypt under a squamous lining means the squamous cells are metaplastic."
caption:
  it: >-
    Metaplasia squamosa nella zona di trasformazione della cervice uterina, EE a forte ingrandimento. Orientati prima:
    la superficie è in alto, lo stroma in basso e in mezzo c'è un epitelio pavimentoso pluristratificato le cui cellule
    si appiattiscono verso la superficie. Ora guarda il centro. Una cripta di ghiandola endocervicale, con il lume pieno
    di muco chiaro e schiumoso e ancora rivestita in parte da un sottile orlo di cellule mucipare, è avvolta da ogni lato
    dalle cellule squamose. Una ghiandola sotto un rivestimento squamoso ti dice che questa mucosa un tempo era
    cilindrica: qui l'epitelio squamoso è metaplastico, nato dalle cellule di riserva che stavano sotto il rivestimento
    mucinoso. Osserva anche il citoplasma, denso e rosa dalla base alla superficie, senza l'aspetto chiaro, ricco di
    glicogeno, delle cellule squamose mature della cervice. Per questo l'epitelio metaplastico giovane appare pallido al
    test di Schiller: lo iodio colora di bruno solo le cellule ricche di glicogeno. Tranello: un carcinoma invasivo
    viene simulato quando le cellule squamose metaplastiche riempiono un'intera ghiandola e lasciano un'isola squamosa
    tondeggiante sotto la superficie; margini lisci, residue cellule mucipare e nuclei regolari e ordinati depongono per
    la metaplasia. Perché conta: la zona di trasformazione è la sede in cui insorge il carcinoma squamoso della cervice.
  en: >-
    Squamous metaplasia in the transformation zone of the cervix, H&E at high power. Get your bearings first: the
    surface is at the top, the stroma at the bottom, and in between lies a stratified squamous epithelium whose cells
    flatten towards the surface. Now look at the centre. A crypt of an endocervical gland, its lumen filled with pale,
    bubbly mucus and still lined in part by a thin rim of mucinous cells, is wrapped on every side by squamous cells. A
    gland beneath a squamous lining tells you that this mucosa used to be columnar: the squamous epithelium here is
    metaplastic, grown from the reserve cells that lay under the mucinous lining. Note also the cytoplasm, dense and
    pink from base to surface, without the clear, glycogen-filled look of mature cervical squamous cells. That is why
    young metaplastic epithelium looks pale in the Schiller test: iodine browns only glycogen-rich cells. Pitfall:
    invasive carcinoma is mimicked when metaplastic squamous cells fill a whole gland and leave a rounded squamous
    island below the surface; smooth outlines, residual mucinous cells and bland, orderly nuclei favour metaplasia. Why
    it matters: the transformation zone is where cervical squamous carcinoma arises.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento di mucosa cervicale: un epitelio stratificato rosa con
    nuclei viola ovali occupa quasi tutto il campo, sotto una banda superficiale rosa compatta; al centro una cavità
    contiene materiale chiaro e schiumoso, con sopra uno spazio vuoto rotondo; connettivo lasso rosa lungo il margine
    inferiore e sul bordo destro, con un vaso rosso in alto a destra.
  en: >-
    High-power H&E micrograph of cervical mucosa: a pink layered epithelium with oval purple nuclei fills most of the
    field under a compact pink surface band; in its centre a cavity holds pale, bubbly material, with a round empty
    space above it; loose pink connective tissue along the bottom and at the right edge, with a red blood vessel at the
    upper right.
