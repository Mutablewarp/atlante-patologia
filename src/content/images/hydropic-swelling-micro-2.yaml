caption:
  it: >-
    Un quadro che simula il rigonfiamento idropico, ma non lo è: biopsia epatica di una glicogenosi (malattia da
    accumulo di glicogeno, diagnosi della fonte), EE. Guarda prima l'insieme: quasi tutti gli epatociti sono ingranditi e hanno un citoplasma
    chiaro, finemente granulare, quasi vuoto, tanto che il campo sembra un mosaico di poligoni chiari dai contorni
    netti, e i sinusoidi fra le cellule si vedono appena. Poi passa alle singole cellule: i nuclei sono piccoli e
    rotondi e nessuno è schiacciato contro il margine della cellula. Fin qui la descrizione vale anche per un
    epatocita con rigonfiamento idropico: cellula ingrandita, citoplasma chiaro, nucleo nella sua sede. La differenza
    sta in ciò che riempie la cellula: qui è glicogeno, che in EE appare chiaro, e non acqua. Le glicogenosi sono
    difetti ereditari degli enzimi del metabolismo del glicogeno; anche un diabete mal controllato può far rigonfiare
    gli epatociti allo stesso modo, per accumulo di glicogeno. Non scambiarlo nemmeno per steatosi: il grasso viene
    sciolto durante l'allestimento in paraffina e lascia buchi vuoti, rotondi e a margini netti, mentre qui il
    citoplasma conserva una fine trama rosata. La sezione in EE non basta a decidere: passa alle immagini in PAS e in PAS-D di
    questa serie.
  en: >-
    A look-alike, not hydropic swelling: a liver biopsy from a glycogen storage disorder (the source's diagnosis),
    H&E. Scan the whole field first: nearly every hepatocyte is enlarged and has pale, finely granular, almost empty
    cytoplasm, so the field looks like a mosaic of clear polygons with sharp borders, and the sinusoids between the
    cells are hardly visible. Then move to single cells: the nuclei are small and round, and none is squashed against
    the cell edge. Up to this point the description also fits a hydropically swollen hepatocyte: an enlarged cell,
    pale cytoplasm, a nucleus in its normal place. The difference lies in what fills the cell: here it is glycogen,
    which looks pale on H&E, not water. Glycogen storage diseases are inherited defects of the enzymes that handle
    glycogen; poorly controlled diabetes can also swell hepatocytes with glycogen in the same way. Do not call it fat
    either: fat is dissolved out during paraffin processing and leaves round, sharp-edged empty holes, whereas here the
    cytoplasm keeps a fine pink texture. The H&E section cannot settle the question: move on to the PAS and PAS-D
    images of this set.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina: un campo di grandi epatociti poligonali con citoplasma rosa
    pallido, finemente granulare e quasi vuoto, contorni cellulari rosa netti e piccoli nuclei rotondi rosa scuro; in
    basso a sinistra tessuto più lasso con un piccolo vaso rotondo e spazi chiari più ampi.
  en: >-
    H&E micrograph of liver: a field of large polygonal hepatocytes with pale pink, finely granular, almost empty
    cytoplasm, sharp pink cell borders and small round dark-pink nuclei; at the lower left looser tissue with a small
    round vessel and larger clear spaces.
