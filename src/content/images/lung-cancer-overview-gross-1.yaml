orientation:
  it: "Trachea e bronco a sinistra, ilo al centro, lobo inferiore in basso."
  en: "Trachea and bronchus at the left, hilum at the center, lower lobe at the bottom."
lookFor:
  it: "Trova il tumore pallido al bronco e all'ilo, poi confrontalo con il polmone più scuro e compatto a valle."
  en: "Find the pale tumor at the bronchus and hilum, then compare it with the darker, firmer lung beyond it."
caption:
  it: >-
    Polmone con carcinoma polmonare a piccole cellule, sezione macroscopica con trachea e bronco a sinistra. Cerca
    prima la massa biancastra con zone scure nella zona dell'ilo, accanto alla parete bronchiale. Osserva poi il
    parenchima circostante: è più scuro e compatto del polmone normale, come accade a valle di un bronco ostruito
    (polmonite ostruttiva). Il carcinoma polmonare spesso si presenta così, come massa centrale all'ilo.
  en: >-
    Lung with small cell lung carcinoma, cut surface with the trachea and bronchus at the left. First find the pale
    whitish mass with dark areas at the hilum, next to the bronchial wall. Then look at the surrounding parenchyma: it
    is darker and firmer than normal lung, as happens downstream of an obstructed bronchus (obstructive pneumonia).
    Lung carcinoma often presents like this, as a central mass at the hilum.
alt:
  it: >-
    Preparato macroscopico di polmone su fondo blu: a sinistra trachea e bronco aperti, vicino all'ilo una massa
    biancastra con chiazze nere, attorno parenchima scuro e compatto con piccoli puntini neri.
  en: >-
    Gross lung specimen on a blue background: trachea and bronchus opened at the left, a whitish mass with black
    patches near the hilum, and dark, firm parenchyma with small black dots around it.
