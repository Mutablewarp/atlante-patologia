orientation:
  it: "L'arteria infiammata è al centro; il suo lume stretto è la fessura chiara nel mezzo del campo."
  en: "The inflamed artery is in the centre; its narrow lumen is the pale slit in the middle of the field."
lookFor:
  it: "In alto a destra del lume cerca il tratto di parete sfatto: rosa sfumato e pieno di detriti nucleari."
  en: "Above and to the right of the lumen, find the broken-down stretch of wall: smudgy pink and full of nuclear debris."
caption:
  it: >-
    Piccola arteria polmonare dello stesso gruppo didattico sull'ipertensione polmonare, EE a medio ingrandimento; la
    fonte descrive una vasculite con necrosi focale della parete e infiammazione. Prima trova il vaso: al centro c'è
    un'arteria con il lume stretto, a fessura, e una parete rosa di cellule muscolari fusate, circondata da tessuto
    polmonare. Poi guarda in alto a destra del lume: in questo tratto la parete perde i suoi strati e diventa un
    materiale rosa sfumato, cosparso di frammenti scuri di nuclei disgregati e di cellule infiammatorie, che affollano
    anche il tessuto a sinistra del vaso. Quella chiazza sfumata è il segmento necrotico: a questo ingrandimento lo
    riconosci dalla perdita di struttura, mentre l'immagine a forte ingrandimento del gruppo (un'arteriola, non un
    dettaglio di questo campo) mostra come appare il materiale fibrinoide. Come leggerla: il danno è focale e risparmia
    il resto della circonferenza, e la presenza di cellule infiammatorie fa di questo quadro un'arterite necrotizzante,
    non una semplice necrosi fibrinoide. Collegamento con l'esame: un segmento arterioso necrotico può andare incontro a
    trombosi, privando di sangue il tessuto a valle, oppure cedere e sfiancarsi in un piccolo aneurisma, come nella
    poliarterite nodosa.
  en: >-
    Small pulmonary artery from the same teaching set on pulmonary hypertension, H&E at medium power; the source
    describes vasculitis with focal necrosis of the wall and inflammation. First find the vessel: in the centre is an
    artery with a narrow, slit-like lumen and a pink wall of spindle-shaped muscle cells, with lung tissue around it.
    Then look above and to the right of the lumen: in this stretch the wall loses its layers and turns into smudgy pink
    material sprinkled with dark fragments of broken-up nuclei and with inflammatory cells, which also crowd the tissue
    to the left of the vessel. That smudgy patch is the necrotic segment; at this power you recognise it by its loss of
    structure, while the high-power image of the set (an arteriole, not a close-up of this field) shows what the
    fibrinoid material itself looks like. How to read it: the damage is focal, so the rest of the circumference is
    spared, and the inflammatory cells make this a necrotising arteritis rather than fibrinoid necrosis alone. Exam
    link: a necrotic segment of an artery can thrombose, cutting off the tissue downstream, or give way and bulge into a
    small aneurysm, as in polyarteritis nodosa.
alt:
  it: >-
    Micrografia in EE a medio ingrandimento di polmone: al centro un'arteria ovale con il lume stretto, a fessura, e una
    parete rosa di cellule fusate; in alto a destra del lume la parete è sfumata e mescolata a frammenti nucleari scuri,
    e numerose piccole cellule infiammatorie scure circondano il vaso, soprattutto a sinistra. In basso a sinistra,
    piccoli vasi pieni di globuli rossi.
  en: >-
    Medium-power H&E micrograph of lung: in the centre an oval artery with a narrow, slit-like lumen and a pink wall of
    spindle cells; above and to the right of the lumen the wall is smudgy and mixed with dark nuclear fragments, and
    many small dark inflammatory cells surround the vessel, especially on its left. At the lower left, small vessels are
    packed with red cells.
