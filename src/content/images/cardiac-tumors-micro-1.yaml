caption:
  it: >-
    Mixoma atriale, EE a basso ingrandimento. Lo sfondo è una matrice mixoide rosa pallido, quasi acellulare. Dentro la
    matrice si vedono cellule fusate o stellate isolate, in cordoncini o intorno a piccoli vasi, e qua e là granuli
    scuri di pigmento emosiderinico. Nell'angolo in basso a destra ci sono globuli rossi extravasati. Il tumore è
    ipocellulare: non cercare lamine di cellule.
  en: >-
    Atrial myxoma, H&E at low power. The background is a pale pink, myxoid matrix that looks almost acellular. Inside
    it you see single spindled or stellate cells, small cords of them and cells around small vessels, plus scattered
    dark granules of hemosiderin pigment. Extravasated red blood cells sit at the lower right. The tumor is
    hypocellular: do not look for sheets of cells.
alt:
  it: >-
    Micrografia in ematossilina-eosina: ampio campo rosa pallido e omogeneo con rare cellule allungate violacee,
    piccoli vasi sottili e puntini scuri sparsi; globuli rossi rossi in basso a destra.
  en: >-
    H&E micrograph: a wide, pale pink, homogeneous field with sparse elongated purple cells, thin small vessels and
    scattered dark dots; red blood cells at the lower right.
lookFor:
  it: "Cerca poche cellule isolate in un'abbondante matrice mixoide, spesso vicino ai vasi."
  en: "Look for few, scattered cells in abundant myxoid matrix, often near vessels."
