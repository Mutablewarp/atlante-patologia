lookFor:
  it: >-
    Cerca la placca più chiara della mucosa circostante e chiediti se potrebbe essere asportata strofinando: la leucoplachia no.
  en: >-
    Look for the patch that is paler than the surrounding mucosa, and ask whether it could be wiped off: leukoplakia cannot.
caption:
  it: >-
    Leucoplachia della mucosa buccale. Guarda la placca bianca, a margini irregolari e superficie lievemente rilevata,
    al centro dell'immagine: contrasta con la mucosa rosa intorno. È una lesione clinica, non una diagnosi
    istologica: solo la biopsia dice se sotto c'è displasia. La foto è leggermente sfocata.
  en: >-
    Leukoplakia of the buccal mucosa. Look at the white patch with irregular edges and a slightly raised surface in the
    center of the picture: it contrasts with the pink mucosa around it. This is a clinical lesion, not a histologic
    diagnosis: only a biopsy shows whether dysplasia lies beneath. The photo is slightly out of focus.
alt:
  it: >-
    Fotografia intraorale: sulla mucosa della guancia una placca biancastra a margini irregolari, circondata da mucosa
    rosa; in basso si vedono i denti.
  en: >-
    Intraoral photograph: on the cheek mucosa an irregular whitish patch surrounded by pink mucosa; teeth are visible
    at the bottom.
