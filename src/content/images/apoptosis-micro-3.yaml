caption:
  it: >-
    Fegato di topo da laboratorio, EE a forte ingrandimento; le frecce nere fanno parte dell'immagine originale. È una
    vista pulita della morfologia dell'apoptosi nella singola cellula. Prendi prima come riferimento un epatocita
    normale: cellula grande e poligonale, citoplasma violetto pallido, nucleo rotondo con cromatina granulare
    distribuita in modo uniforme. Poi segui le frecce. In alto a sinistra un epatocita morente si è frammentato in diversi piccoli corpi
    rotondi, delimitati da membrana, con citoplasma rosa acceso, alcuni con frammenti nucleari scuri (carioressi). Poco
    più a destra c'è un corpo apoptotico rotondo, liscio ed eosinofilo, senza nucleo. In basso una piccola cellula con
    un unico nucleo rotondo e molto denso (picnosi) giace in un alone chiaro, staccata dalle vicine. I segni da
    riconoscere sono riduzione di volume, ipereosinofilia, condensazione della cromatina, frammentazione in corpi
    apoptotici e assenza di infiammazione. Da ricordare: la membrana plasmatica resta integra, quindi il contenuto non
    si riversa all'esterno e intorno alle cellule che muoiono non c'è infiltrato infiammatorio. Confronta con la
    necrosi coagulativa, in cui muoiono interi gruppi di cellule, che si gonfiano e perdono il nucleo pur conservando
    il profilo.
  en: >-
    Laboratory mouse liver, H&E at high power; the black arrows are part of the original image. This is a clean view
    of the morphology of apoptosis in single cells. First take a normal hepatocyte as a reference: a large polygonal
    cell with pale violet cytoplasm and a round nucleus with evenly granular chromatin. Then follow the arrows. At upper left a dying hepatocyte has broken up into several small, round, membrane-bound bodies with
    bright pink cytoplasm, some holding dark nuclear fragments (karyorrhexis). Just to the right lies a round, smooth,
    eosinophilic apoptotic body without a nucleus. At the bottom a small cell with a single, very dense round nucleus
    (pyknosis) sits in a clear halo, detached from its neighbours. The signs to recognise are shrinkage,
    hypereosinophilia, chromatin condensation, fragmentation into apoptotic bodies and the lack of inflammation. Key
    point: the plasma membrane stays intact, so the contents do not leak out and no inflammatory infiltrate gathers
    around the dying cells. Compare with coagulative necrosis, where whole groups of cells die, swell and lose their
    nuclei while keeping their outline.
alt:
  it: >-
    Micrografia ad alto ingrandimento di fegato in ematossilina-eosina: grandi epatociti violetti con nuclei rotondi a
    cromatina granulare; cinque frecce nere puntano verso il centro su piccoli corpi rotondi rosa acceso, alcuni con frammenti
    scuri, e in basso su una piccola cellula con un nucleo nero e denso circondata da un alone chiaro.
  en: >-
    High-power H&E micrograph of liver: large violet hepatocytes with round, granular nuclei; five black arrows point
    towards the centre at small, round, bright pink bodies, some with dark fragments, and at the bottom at a small
    cell with a dense black nucleus surrounded by a clear halo.
