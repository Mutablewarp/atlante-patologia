lookFor:
  it: "Guarda i nuclei uno a uno (dimensioni, cromatina fine, modellamento reciproco) e cerca le figure mitotiche scure."
  en: "Look at the nuclei one by one (size, fine chromatin, molding to each other) and spot the dark mitotic figures."
caption:
  it: >-
    Carcinoma a piccole cellule, EE ad alto ingrandimento; il sito mostrato è una metastasi alla parete toracica da
    primitivo polmonare. Guarda i nuclei: sono piccoli, ravvicinati e si modellano l'uno sull'altro, con citoplasma
    scarso. Cerca poi le figure mitotiche, i grumi scuri di cromatina: sono numerose e indicano un tumore molto
    proliferante.
  en: >-
    Small cell carcinoma, H&E at high power; the site shown is a metastasis to the chest wall from a lung primary.
    Look at the nuclei: they are small, close together and mold to one another, with scant cytoplasm. Then look for
    mitotic figures, the dark clumps of chromatin: they are frequent and point to a fast-growing tumor.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: nuclei violacei allungati e ravvicinati, che si
    deformano a vicenda, con poco citoplasma rosa e alcune figure mitotiche scure.
  en: >-
    High-power H&E micrograph: elongated purple nuclei packed closely and deforming one another, with little pink
    cytoplasm and a few dark mitotic figures.
