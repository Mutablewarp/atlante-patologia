caption:
  it: >-
    Mixoma dell'atrio sinistro: cuore fissato, aperto, in un vasetto da museo (l'etichetta dice "Myxoma atrii sinistri").
    Guarda nella parte alta del cuore: una massa lobulata grigiastra, a superficie irregolare, occupa la cavità
    atriale. Le pareti e le camere del cuore intorno sono pallide per la fissazione. Il preparato è
    vecchio e la foto è scattata attraverso il vetro, quindi i colori non sono quelli del fresco.
  en: >-
    Left atrial myxoma: a fixed, opened heart in a museum jar (the label reads "Myxoma atrii sinistri"). Look at the
    upper part of the heart: a lobulated grayish mass with an irregular surface occupies the atrial cavity. The walls and chambers around it are pale from fixation. The specimen is old and the photo was taken through
    the glass, so the colors are not those of fresh tissue.
alt:
  it: >-
    Fotografia di un cuore fissato e aperto in un vasetto di vetro con un'etichetta bianca in alto; nella parte alta
    del cuore una massa grigiastra lobulata sporge nell'atrio, sopra le cavità ventricolari chiare con le trabecole.
  en: >-
    Photograph of a fixed, opened heart in a glass jar with a white label at the top; in the upper part of the heart a
    lobulated grayish mass projects into the atrium, above the pale ventricular chambers with their trabeculae.
lookFor:
  it: "Cerca la massa lobulata grigiastra nell'atrio e osserva come riempie la cavità."
  en: "Find the lobulated grayish mass in the atrium and note how it fills the cavity."
