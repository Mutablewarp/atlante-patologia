lookFor:
  it: "Osserva il rilievo della superficie: le placche sono ispessimenti bianco-rosati, nodulari e lobulati, su una pleura per il resto liscia."
  en: "Look at the surface relief: the plaques are pink-white, nodular, lobulated thickenings on otherwise smooth pleura."
caption:
  it: >-
    Placca pleurica fibrosa da asbesto, sulla pleura diaframmatica, fotografia macroscopica. La superficie è coperta da
    noduli rosa-biancastri confluenti, lucidi e a contorno lobulato, che le danno un aspetto verrucoso. Intorno la
    pleura è liscia e sottile: la lesione è circoscritta e non invade il tessuto vicino.
  en: >-
    Fibrous pleural plaque of asbestos exposure on the diaphragmatic pleura, gross photograph. The surface is covered by
    confluent, glistening, pink-white nodules with a lobulated outline, giving a warty look. The surrounding pleura is
    smooth and thin: the lesion is circumscribed and does not invade neighboring tissue.
alt:
  it: >-
    Fotografia di un tessuto rosa su fondo blu-verde: al centro un'ampia area di rilievi nodulari rosa chiaro, lucidi e
    raggruppati, circondata da membrana liscia rosata.
  en: >-
    Photograph of pink tissue on a blue-green background: in the center a broad area of glistening, clustered light-pink
    nodular elevations, surrounded by smooth pinkish membrane.
