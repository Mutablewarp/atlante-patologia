lookFor:
  it: "Cerca l'area azzurro pallido a sinistra, poi i fogli di cellule viola scuro a destra e al centro."
  en: "Look for the pale blue area on the left, then the sheets of dark purple cells in the center and on the right."
caption:
  it: >-
    Adenoma pleomorfo di ghiandola salivare, basso ingrandimento (10x). A sinistra una zona azzurro pallido, a
    reticolo lasso, con poche cellule isolate: è lo stroma mixoide. Al centro e a destra, fogli e cordoni compatti di
    cellule viola scuro: è la componente epiteliale. A destra si vedono anche spazi chiari con materiale rosa e cellule
    sparse.
  en: >-
    Pleomorphic adenoma of a salivary gland, low power (10x). On the left, a pale blue area with a loose meshwork and
    scattered single cells is the myxoid stroma. In the center and on the right, compact sheets and cords of dark
    purple cells are the epithelial component. Pale spaces with pink material and scattered cells are also seen on the
    right.
alt:
  it: >-
    Micrografia a basso ingrandimento: a sinistra una vasta zona azzurro pallido con rare cellule; al centro e a destra
    fogli di cellule viola scuro e alcuni spazi chiari con materiale rosa.
  en: >-
    Low-power micrograph: a broad pale blue area with few cells on the left; sheets of dark purple cells and some pale
    spaces with pink material in the center and on the right.
