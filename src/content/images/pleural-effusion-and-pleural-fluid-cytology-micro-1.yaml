lookFor:
  it: "Confronta le dimensioni dei nuclei: i linfociti, piccoli e scuri, fanno da metro per le cellule più grandi."
  en: "Compare nuclear sizes: the small, dark lymphocytes act as a ruler for the larger cells."
caption:
  it: >-
    Citologia di un liquido pleurico, colorazione di Papanicolaou, ad alto ingrandimento. Parti dalle cellule piccole
    con nucleo rotondo, scuro e poco citoplasma: sono linfociti e riempiono quasi tutto il campo. Cerca poi le cellule
    più grandi con nucleo chiaro e citoplasma ben visibile, sparse nel campo o riunite in un piccolo gruppo al centro:
    sono mesoteliociti e istiociti. Nel complesso la popolazione è mista e i nuclei hanno contorni regolari; la fonte
    segnala l'assenza di cellule atipiche.
  en: >-
    Pleural fluid cytology, Papanicolaou stain, high power. Start with the small cells that have a round, dark nucleus
    and little cytoplasm: these are lymphocytes and fill most of the field. Then look for the larger cells with a pale
    nucleus and clearly visible cytoplasm, scattered or gathered in a small cluster at the center: these are mesothelial
    cells and histiocytes. The population is mixed and the nuclear outlines are regular; the source reports no atypical
    cells.
alt:
  it: "Striscio citologico di liquido pleurico con molti piccoli linfociti dal nucleo scuro e rotondo, e cellule più grandi con nucleo chiaro, alcune riunite in un gruppo centrale."
  en: "Cytology preparation of pleural fluid with many small lymphocytes with dark round nuclei, and larger cells with pale nuclei, some gathered in a central cluster."
