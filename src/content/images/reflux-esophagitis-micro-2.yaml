lookFor:
  it: "Confronta i nuclei piccoli, scuri e ravvicinati delle cellule basali con le cellule più grandi e pallide sopra, poi cerca gli eosinofili tra di esse."
  en: "Compare the crowded, small, dark nuclei of the basal cells with the larger, paler cells above, then look for eosinophils among them."
caption:
  it: >-
    Esofagite da reflusso, EE ad alto ingrandimento, stessa lesione dell'immagine a basso ingrandimento. Nell'epitelio
    pavimentoso le cellule basali, con nuclei piccoli e ravvicinati, formano uno strato spesso (iperplasia delle
    cellule basali); in basso a destra si vede una papilla di connettivo sezionata trasversalmente. Cerca tra le cellule
    epiteliali i rari eosinofili, che nel reflusso sono pochi e sparsi.
  en: >-
    Reflux esophagitis, H&E at high power, same lesion as the low-power image. In the squamous epithelium the basal
    cells, with small, closely packed nuclei, form a thick layer (basal cell hyperplasia); at the lower right a
    connective tissue papilla is cut across. Look among the epithelial cells for the rare eosinophils, which in reflux
    are few and scattered.
alt:
  it: >-
    Micrografia ad alto ingrandimento, in ematossilina-eosina, di epitelio pavimentoso esofageo: cellule con nuclei
    viola ovali e citoplasma rosa pallido, più fitte e piccole nella parte profonda, e in basso a destra una struttura
    rotonda concentrica con un piccolo asse centrale.
  en: >-
    High-power H&E micrograph of esophageal squamous epithelium: cells with oval purple nuclei and pale pink
    cytoplasm, smaller and more crowded in the deep part, and at the lower right a round concentric structure with a
    small central core.
