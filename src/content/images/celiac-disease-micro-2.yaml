lookFor:
  it: "Guarda le cellule dell'epitelio di superficie: tra i nuclei allungati degli enterociti cerca nuclei piccoli, rotondi e scuri; poi osserva le cellule che riempiono la lamina propria."
  en: "Look at the surface epithelial cells: among the elongated enterocyte nuclei, look for small, round, dark nuclei; then look at the cells filling the lamina propria."
caption:
  it: >-
    Biopsia di intestino tenue, EE a forte ingrandimento. Osserva il rivestimento di superficie: gli enterociti hanno
    nuclei allungati e, tra di loro, si vedono nuclei piccoli, rotondi e scuri, compatibili con linfociti
    intraepiteliali. Sotto l'epitelio la lamina propria è affollata di cellule infiammatorie, che allontanano le
    strutture di sostegno. Insieme all'immagine a basso ingrandimento mostra il rapporto tra epitelio e lamina propria
    nella malattia celiaca; il conteggio dei linfociti si fa sul vetrino, non su una singola foto.
  en: >-
    Small-bowel biopsy, H&E at high power. Look at the surface lining: the enterocytes have elongated nuclei and, among
    them, small, round, dark nuclei are seen, consistent with intraepithelial lymphocytes. Beneath the epithelium the
    lamina propria is crowded with inflammatory cells that push the supporting structures apart. Together with the
    low-power image it shows the relation between epithelium and lamina propria in celiac disease; lymphocytes are
    counted on the slide, not on a single photo.
alt:
  it: >-
    Micrografia a forte ingrandimento di una biopsia del tenue in ematossilina-eosina: un bordo superficiale di
    epitelio rosa intenso con nuclei allungati e alcuni nuclei piccoli e scuri tra le cellule; sotto, una lamina propria
    fitta di cellule con nuclei rotondi e violacei.
  en: >-
    High-power H&E micrograph of a small-bowel biopsy: a surface edge of deep pink epithelium with elongated nuclei and
    some small, dark nuclei among the cells; below, a lamina propria packed with cells that have round, purple nuclei.
