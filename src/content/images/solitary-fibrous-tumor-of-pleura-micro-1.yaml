lookFor:
  it: "Cerca l'assenza di qualsiasi architettura: cellule fusate e collagene rosa corrono in direzioni casuali, con un vaso a parete sottile in basso a destra."
  en: "Scan the field for the lack of any architecture: spindle cells and pink collagen run in random directions, with a thin-walled vessel at the lower right."
caption:
  it: >-
    Tumore fibroso solitario della pleura, EE a medio ingrandimento. Guarda l'insieme: le cellule fusate hanno nuclei
    ovali e scuri e sono sparse tra fasci di collagene rosa, senza una disposizione ordinata. È il pattern «senza
    pattern». In basso a destra si vede un vaso a parete sottile.
  en: >-
    Solitary fibrous tumor of the pleura, H&E at medium power. Look at the whole field: the spindle cells have dark
    oval nuclei and lie scattered among pink collagen bundles with no orderly arrangement. This is the "patternless
    pattern". A thin-walled vessel is visible at the lower right.
alt:
  it: >-
    Micrografia in ematossilina-eosina: cellule fusate con nuclei ovali violacei disposte in modo irregolare tra fasci
    di collagene rosa, con qualche globulo rosso e un vaso a parete sottile in basso a destra.
  en: >-
    H&E micrograph: spindle cells with purple oval nuclei arranged irregularly among pink collagen bundles, with a few
    red blood cells and a thin-walled vessel at the lower right.
