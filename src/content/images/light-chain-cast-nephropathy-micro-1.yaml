lookFor:
  it: "Cerca il lume tubulare riempito da una massa rosa fratturata e guarda se è circondato da cellule voluminose."
  en: "Find the tubular lumen filled by a pink, fractured mass and check whether large cells surround it."
caption:
  it: >-
    Rene con nefropatia da cilindri, EE a forte ingrandimento. Al centro un tubulo ha il lume occupato da una massa
    rosa omogenea, spezzata in frammenti angolari: è un cilindro ialino fratturato. Ai suoi margini, in basso a
    destra, si vedono cellule grandi con più nuclei. Intorno il tessuto è affollato di cellule infiammatorie e i
    tubuli vicini sono radi e di calibro irregolare.
  en: >-
    Kidney with light-chain cast nephropathy, H&E at high power. At the center a tubule has its lumen filled by a
    homogeneous pink mass broken into angular fragments: a fractured hyaline cast. Along its lower right edge are
    large cells with several nuclei. The surrounding tissue is crowded with inflammatory cells, and the neighboring
    tubules are sparse and uneven in size.
alt:
  it: >-
    Micrografia in ematossilina-eosina: al centro un tubulo contiene una massa rosa divisa in blocchi angolari da
    sottili fessure, con cellule voluminose a ridosso del margine inferiore destro; intorno, tessuto con molti piccoli
    nuclei scuri e pochi lumi tubulari vuoti.
  en: >-
    H&E micrograph: at the center a tubule contains a pink mass split into angular blocks by thin clefts, with bulky
    cells against its lower right edge; around it, tissue with many small dark nuclei and a few empty tubular lumens.
