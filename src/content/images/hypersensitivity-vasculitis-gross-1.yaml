lookFor:
  it: Cerca prima le piccole macchie rosso-violacee puntiformi sulla gamba, poi le lesioni scure e ulcerate intorno alla caviglia.
  en: Look first for the many small red-purple dots on the leg, then for the dark, ulcerated lesions around the ankle.
caption:
  it: >-
    Gamba e caviglia, vista clinica. Sulla gamba si vedono numerose macchie rosso-violacee puntiformi, cioè porpora. Intorno
    alla caviglia ci sono due lesioni più grandi, scure e ulcerate, con un alone violaceo e una crosta nera. È la sede
    tipica della porpora da vasculite dei piccoli vasi, qui nella porpora di Schönlein-Henoch. La fotografia mostra la
    lesione cutanea; il quadro microscopico è nelle immagini seguenti.
  en: >-
    Leg and ankle, clinical view. The leg carries many small red-purple dots, which is purpura. Around the ankle are two
    larger dark, ulcerated lesions with a violet halo and a black crust. This is the typical site of purpura from
    small-vessel vasculitis, here in Henoch–Schönlein purpura. The photograph shows the skin lesion; the microscopic
    picture is in the images that follow.
alt:
  it: >-
    Fotografia di una gamba e di una caviglia appoggiate su un lenzuolo bianco: molte macchioline rosso-violacee sulla
    pelle e due lesioni scure ulcerate con alone violaceo vicino alla caviglia.
  en: >-
    Photograph of a leg and ankle resting on a white sheet: many small red-purple spots on the skin and two dark
    ulcerated lesions with a violet halo near the ankle.
