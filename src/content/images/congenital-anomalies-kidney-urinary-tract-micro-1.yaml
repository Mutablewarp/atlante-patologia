lookFor:
  it: Parti dal rene normale in alto, poi segui lo stroma fibroso verso il basso e cerca cisti, tubuli primitivi e l'isola di cartilagine.
  en: Start at the normal kidney at the top, then follow the fibrous stroma downward and look for cysts, primitive tubules and the island of cartilage.
caption:
  it: Displasia renale cistica in ematossilina-eosina, a basso ingrandimento. In alto il parenchima renale conserva glomeruli e tubuli. Sotto, lo stroma è disorganizzato, con cisti, tubuli primitivi e un'isola di cartilagine in basso a sinistra.
  en: Cystic renal dysplasia on H&E, low power. At the top the renal parenchyma keeps its glomeruli and tubules. Below, the stroma is disorganized, with cysts, primitive tubules and an island of cartilage at the lower left.
alt:
  it: Micrografia in rosa e viola. In alto tubuli renali ravvicinati; al centro stroma pallido con grandi spazi cistici vuoti e piccoli tubuli sparsi; in basso a sinistra un nodulo di cartilagine, sotto una zona di globuli rossi e tessuto adiposo.
  en: Pink and purple micrograph. At the top, closely packed renal tubules; in the middle, pale stroma with large empty cystic spaces and small scattered tubules; at the lower left, a nodule of cartilage, with red blood cells and fat below it.
