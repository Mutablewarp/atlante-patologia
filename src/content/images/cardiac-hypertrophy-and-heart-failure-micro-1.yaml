lookFor:
  it: "Cerca la vena centrolobulare al centro e gli spazi chiari e dilatati dei sinusoidi che la circondano, tra le travate di epatociti rosa."
  en: "Look for the central vein in the middle and the pale, widened sinusoidal spaces around it, between the pink cords of hepatocytes."
caption:
  it: >-
    Fegato da congestione cronica, biopsia, colorazione tricromica a medio ingrandimento. Parti dal vuoto bianco al
    centro, una venula epatica dilatata. Poi guarda attorno ad essa: i sinusoidi sono allargati e le travate di
    epatociti rosa sono separate da ampi spazi chiari. È la zona centrolobulare, la prima a risentire dello
    scompenso destro. Sottili tratti verdi indicano il collagene.
  en: >-
    Liver in chronic congestion, biopsy, trichrome stain at medium power. Start with the white void at the center, a
    dilated hepatic venule. Then look around it: the sinusoids are widened and the pink cords of hepatocytes are
    separated by wide pale spaces. This is the centrilobular zone, the first to feel right-sided failure. Thin green
    strands mark collagen.
alt:
  it: >-
    Micrografia con colorazione tricromica di fegato: travate di epatociti rosa con sinusoidi dilatati e chiari, e al
    centro un ampio lume vascolare vuoto bordato da sottili fibre verdi.
  en: >-
    Trichrome micrograph of liver: pink cords of hepatocytes with widened pale sinusoids, and at the center a large
    empty vascular lumen edged by thin green fibers.
