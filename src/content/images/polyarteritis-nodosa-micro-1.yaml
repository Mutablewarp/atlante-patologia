lookFor:
  it: "Parti dal pannello in alto a sinistra (basso ingrandimento), poi cerca nei pannelli inferiori le piccole arterie con parete ispessita e rosa e un infiltrato infiammatorio intorno."
  en: "Start with the top-left panel (low power), then look in the lower panels for small arteries with a thickened, pink wall and inflammatory cells around them."
caption:
  it: >-
    Biopsia cutanea in ematossilina-eosina, quattro pannelli a ingrandimento crescente, ciascuno con la sua barra di scala. In alto a sinistra l'epidermide è ulcerata e il derma è alterato; negli altri pannelli piccole arterie del derma e dell'ipoderma hanno la parete rosa e ispessita, con cellule infiammatorie intorno. Il caso è una forma cutanea di poliarterite nodosa: mostra la lesione di parete, non un'arteria viscerale.
  en: >-
    Skin biopsy, H&E, four panels at increasing power, each with its own scale bar. At the top left the epidermis is ulcerated and the dermis is altered; in the other panels small arteries of the dermis and subcutis have a pink, thickened wall with inflammatory cells around it. The case is a cutaneous form of polyarteritis nodosa: it shows the wall lesion, not a visceral artery.
alt:
  it: >-
    Composizione di quattro micrografie rosa e viola con cornice rossa. In alto a sinistra una veduta panoramica di pelle con epidermide irregolare e derma pallido; in alto a destra e in basso piccoli vasi con parete ispessita rosa e cellule infiammatorie violacee intorno, tra tessuto connettivo e cellule adipose vuote.
  en: >-
    Four pink and purple micrographs in red frames. Top left, a wide view of skin with an irregular epidermis and a pale dermis; top right and bottom, small vessels with a thickened pink wall and purple inflammatory cells around them, among connective tissue and empty-looking fat cells.
