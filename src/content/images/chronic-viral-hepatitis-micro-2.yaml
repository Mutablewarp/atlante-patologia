lookFor:
  it: "Guarda il citoplasma di una cellula grande: è pallido e granulare, non rosa uniforme, mentre il nucleo resta rotondo e ben visibile."
  en: "Look at the cytoplasm of one large cell: it is pale and granular rather than evenly pink, while the nucleus stays round and well seen."
caption:
  it: >-
    Epatociti a vetro smerigliato di epatite B cronica ad alto ingrandimento, colorazione H&E. Il citoplasma è pallido,
    finemente granulare e leggermente vuoto, i nuclei sono rotondi e conservati. Le cellule sono la stessa lesione
    della prima immagine, vista più da vicino.
  en: >-
    Ground-glass hepatocytes of chronic hepatitis B at high power, H&E stain. The cytoplasm is pale, finely granular and
    slightly empty-looking, and the nuclei are round and preserved. These are the same change as in the first image, seen
    closer up.
alt:
  it: >-
    Micrografia a forte ingrandimento di epatociti grandi con citoplasma pallido e granulare, nuclei rotondi viola scuro
    e sinusoidi stretti con globuli rossi.
  en: >-
    High-power micrograph of large hepatocytes with pale granular cytoplasm, round dark purple nuclei and narrow
    sinusoids holding red cells.
