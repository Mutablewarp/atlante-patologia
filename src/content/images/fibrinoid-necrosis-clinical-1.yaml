orientation:
  it: "Arto inferiore piegato al ginocchio: la coscia in alto, il ginocchio a destra, la gamba che scende verso il basso."
  en: "Lower limb bent at the knee: the thigh at the top, the knee at the right, the lower leg running down to the bottom."
lookFor:
  it: "Guarda come le macchie rosse si addensano sulla coscia e si diradano sulla gamba."
  en: "See how the red spots crowd on the thigh and thin out on the lower leg."
caption:
  it: >-
    Porpora di Henoch-Schönlein (vasculite da IgA) su una gamba piegata, secondo quanto indica chi ha scattato la foto:
    è il volto clinico della necrosi fibrinoide nella cute. Prima orientati: la coscia attraversa la parte alta
    dell'immagine, il ginocchio è a destra e la gamba scende verso il basso. Poi confronta i due segmenti. La coscia è
    coperta da innumerevoli piccole macchie rosso-violacee, in alcuni punti confluenti, mentre sulla gamba le macchie
    sono più piccole e sparse. Come leggerla: ogni macchia corrisponde a globuli rossi usciti da piccole venule del
    derma con la parete danneggiata; per questo la porpora non scompare alla pressione, a differenza dell'arrossamento
    dovuto a vasi dilatati; nelle vasculiti, inoltre, l'infiammazione e l'edema attorno alle venule danneggiate spesso
    sollevano un poco la macchia, che si apprezza al tatto. Al microscopio queste
    venule mostrano necrosi fibrinoide con neutrofili e polvere nucleare (vasculite leucocitoclastica), il quadro della
    micrografia abbinata. La porpora di Henoch-Schönlein è la vasculite più frequente nei bambini, ma non risparmia gli
    adulti, nei quali il fattore scatenante è spesso un farmaco; nei suoi depositi l'anticorpo prevalente è l'IgA. Se
    sono coinvolti i reni, il quadro glomerulare corrisponde a quello della nefropatia a IgA. Collegamento con l'esame:
    una porpora palpabile agli arti inferiori fa pensare a una vasculite dei piccoli vasi, e la biopsia cutanea ne
    mostra la necrosi fibrinoide.
  en: >-
    Henoch–Schönlein purpura (IgA vasculitis) on a bent leg, as labelled by the photographer: the clinical face of
    fibrinoid necrosis in the skin. Get your bearings first: the thigh runs across the top of the picture, the knee is
    at the right and the lower leg runs down towards the bottom. Then compare the two segments. The thigh is covered by
    countless small red-to-purple spots that run together in places, while on the lower leg the spots are smaller and
    scattered. How to read it: each spot marks red cells that have escaped from small dermal venules with damaged walls;
    that is why purpura stays red when you press on it, unlike the redness of dilated vessels; in vasculitis, the
    inflammation and edema around the damaged venules also often make the spot slightly raised, so it can be felt.
    Under the microscope these venules show fibrinoid necrosis with neutrophils and
    nuclear dust (leukocytoclastic vasculitis), the picture in the paired micrograph. Henoch–Schönlein purpura is the
    vasculitis children get most often, though adults are not spared, and in them a drug is often the trigger; the
    antibody that dominates in its deposits is IgA. When the kidneys are involved, the glomerular picture matches IgA
    nephropathy. Exam link: palpable purpura on the legs points to a small-vessel vasculitis, and a skin biopsy shows
    its fibrinoid necrosis.
alt:
  it: >-
    Fotografia a colori di una gamba piegata: la coscia, in alto, è fittamente coperta da piccole macchie
    rosso-violacee, in alcuni punti confluenti; il ginocchio è a destra e la gamba, che scende verso il basso, ha
    puntini rossi più piccoli e radi. In basso a sinistra un lenzuolo bianco, a destra apparecchiature mediche.
  en: >-
    Colour photograph of a bent leg: the thigh, across the top, is densely covered with small red-to-purple spots that
    merge in places; the knee is at the right and the lower leg, running down to the bottom, has fewer and smaller red
    dots. A white bed sheet is at the lower left and medical equipment at the right.
