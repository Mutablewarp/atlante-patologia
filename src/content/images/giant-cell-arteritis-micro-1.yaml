lookFor:
  it: Parti dal lume piccolo e irregolare, poi osserva la parete molto ispessita e il manicotto di cellule infiammatorie scure ai margini.
  en: Start at the small, irregular lumen, then look at the greatly thickened wall and the dark rim of inflammatory cells at its edge.
caption:
  it: >-
    Arteria in sezione trasversale, EE a basso ingrandimento. Orientati prima con il lume, piccolo e di forma
    irregolare al centro. Intorno vedi una parete molto ispessita, rosa-violacea, con un addensamento di cellule
    infiammatorie scure soprattutto a destra e in alto. Questo è il quadro dell'arterite a cellule giganti: l'infiammazione
    cronica restringe il lume. Le cellule giganti si cercano poi a maggior ingrandimento.
  en: >-
    Artery in cross section, H&E at low power. Orient yourself first with the lumen, small and irregular in the center.
    Around it is a greatly thickened pink-purple wall with a crowd of dark inflammatory cells, mostly at the right and
    top. This is the pattern of giant cell arteritis: chronic inflammation narrows the lumen. Look for the giant cells
    at higher power.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un'arteria in sezione trasversale: lume centrale piccolo e frastagliato,
    parete spessa rosa-violacea e un'area di piccole cellule scure, soprattutto a destra e in alto, ai margini della parete.
  en: >-
    H&E micrograph of an artery in cross section: a small, jagged central lumen, a thick pink-purple wall, and an area
    of small dark cells, mostly at the right and top, at the edge of the wall.
