stain: H&E
caption:
  it: >-
    Fegato nel deficit di α1-antitripsina, EE. A piccolo ingrandimento orientati sulla banda di tessuto connettivo che
    attraversa il campo in diagonale, dall'alto a sinistra verso il basso al centro, con dotti biliari e cellule
    infiammatorie. Poi cerca negli epatociti vicini a questa banda, soprattutto al centro e a destra: alcuni contengono
    globuli rotondi, omogenei, vitrei, di un rosa acceso più intenso del citoplasma, di dimensioni variabili e spesso
    raggruppati. Sono depositi della proteina mutata: l'α1-antitripsina anomala si ripiega male, polimerizza nel
    reticolo endoplasmatico e non viene secreta, quindi si accumula nell'epatocita che l'ha prodotta. Il risultato è
    duplice: danno epatico per l'accumulo e livelli bassi nel sangue, con perdita della protezione del polmone
    dall'elastasi (enfisema). Nella pratica i globuli si confermano con il PAS dopo diastasi, a cui resistono. Trappola:
    accanto ai globuli ci sono vacuoli bianchi e vuoti; quelli sono gocce di grasso sciolte durante l'allestimento, non
    proteina.
  en: >-
    Liver in alpha-1-antitrypsin deficiency, H&E. At low power, orient yourself on the band of connective tissue that
    crosses the field diagonally, from top left to bottom centre, with bile ducts and inflammatory cells. Then search
    the hepatocytes next to this band, especially in the centre and on the right: some contain round, homogeneous,
    glassy globules of a bright pink, more intense than the cytoplasm, of varying size and often clustered. These are
    deposits of the mutant protein: abnormal alpha-1-antitrypsin misfolds, polymerises in the endoplasmic reticulum and
    is not secreted, so it accumulates in the hepatocyte that made it. The result is twofold: liver damage from the
    accumulation, and low blood levels that leave the lung unprotected against elastase (emphysema). In practice the
    globules are confirmed with PAS after diastase, which they resist. Pitfall: next to the globules there are white,
    empty vacuoles; those are fat droplets dissolved during processing, not protein.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina: epatociti rosa attraversati in diagonale da una banda di tessuto
    connettivo con nuclei scuri; al centro e a destra alcuni epatociti contengono gruppi di globuli rotondi rosa acceso,
    accanto a vacuoli bianchi e vuoti.
  en: >-
    H&E micrograph of liver: pink hepatocytes crossed diagonally by a band of connective tissue with dark nuclei; in the
    centre and on the right some hepatocytes contain clusters of bright pink round globules, next to empty white
    vacuoles.
