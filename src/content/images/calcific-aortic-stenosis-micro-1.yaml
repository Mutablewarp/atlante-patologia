  it: "Cerca le masse violacee e granulari di calcio dentro il tessuto rosa del lembo."
  en: "Look for the purple, granular calcium masses inside the pink cusp tissue."
caption:
  it: >-
    Lembo di valvola aortica con stenosi calcifica, EE a basso ingrandimento. Parti dalla superficie, a sinistra e in
    alto, dove una sottile banda rosa e fibrosa riveste il lembo. Sotto, il tessuto è occupato da grandi noduli rosa
    pallido, amorfi, con poche cellule. Ai bordi dei noduli e negli spazi tra loro compaiono aree violacee e
    granulari: è il calcio, di colore basofilo. L'architettura normale del lembo non si riconosce più.
  en: >-
    Aortic valve cusp with calcific stenosis, H&E at low power. Start at the surface, upper left, where a thin pink
    fibrous band covers the cusp. Beneath it the tissue is filled with large, pale pink, amorphous nodules with few
    cells. Along the edges of the nodules and in the gaps between them are purple, granular areas: this is the
    calcium, which stains basophilic. The normal layered architecture of the cusp is no longer recognizable.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un lembo valvolare: noduli rosa pallido di grandi dimensioni, separati da
    fessure bianche, con depositi violacei granulari ai margini e una sottile banda rosa fibrosa lungo la superficie.
  en: >-
    H&E micrograph of a valve cusp: large pale pink nodules separated by white clefts, with granular purple deposits at
    their edges and a thin pink fibrous band along the surface.
