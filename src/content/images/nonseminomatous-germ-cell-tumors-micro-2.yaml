lookFor:
  it: "Segui i bordi delle cavità: sono rivestiti da cellule cubiche o cilindriche atipiche, sostenute da sottili assi di tessuto."
  en: "Follow the edges of the spaces: they are lined by atypical cuboidal to columnar cells supported by thin cores of tissue."
caption:
  it: >-
    Tumore del sacco vitellino del testicolo, EE a medio ingrandimento. Guarda prima l'architettura: spazi vuoti
    ramificati e papille che si intrecciano. Poi il rivestimento: file di cellule cubiche o cilindriche con nuclei
    scuri e atipici si appoggiano a sottili assi di tessuto, in alcuni dei quali si vede un piccolo vaso. È uno dei
    pattern del tumore del sacco vitellino; la conferma si ottiene con l'immunoistochimica (glipicano-3 positivo, come
    indicato dall'autore dell'immagine).
  en: >-
    Yolk sac tumor of the testis, H&E at medium power. Look at the architecture first: branching empty spaces and
    interlacing papillae. Then the lining: rows of cuboidal to columnar cells with dark, atypical nuclei rest on thin
    cores of tissue, some of which hold a small vessel. This is one of the patterns of yolk sac tumor; confirmation
    comes from immunohistochemistry (glypican-3 positive, as stated by the image's author).
alt:
  it: >-
    Micrografia in ematossilina-eosina: spazi bianchi ramificati e papille rivestite da file di cellule viola scuro
    con nuclei atipici, intorno ad assi rosa di tessuto; in basso un piccolo vaso rosso.
  en: >-
    H&E micrograph: branching white spaces and papillae lined by rows of dark purple cells with atypical nuclei, around
    pink cores of tissue; at the bottom, a small red vessel.
