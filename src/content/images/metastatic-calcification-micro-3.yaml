lookFor:
  it: "Segui le linee viola scuro: sono pareti alveolari e vascolari incrostate di calcio, non nuclei."
  en: "Follow the dark purple lines: they are alveolar and vessel walls encrusted with calcium, not nuclei."
caption:
  it: >-
    Calcificazione metastatica del polmone a piccolo ingrandimento (la fonte non indica né la colorazione né
    l'ingrandimento; i colori sono quelli dell'EE). Leggi il disegno d'insieme prima delle singole strutture: linee viola
    scuro attraversano tutto il campo e disegnano gli alveoli come le maglie di una rete, perché i sali di calcio hanno
    incrostato le pareti alveolari; qua e là, dove più pareti si incontrano, il deposito si ispessisce in nodi scuri. Ora
    cerca i profili rotondi a sinistra: sono piccoli vasi con la parete cerchiata dallo stesso materiale viola scuro, e un
    vaso più lungo, sezionato longitudinalmente, attraversa la parte in alto a destra con emazie nel lume. Gli spazi alveolari
    sono pieni di un materiale rosa pallido, finemente fibrillare, con cellule sparse: è la polmonite acuta che la fonte
    segnala in quest'area, non calcio. In EE il calcio è basofilo, quindi una rete viola come questa si può scambiare per
    nuclei affollati o per fibrosi; passa all'ingrandimento maggiore per vedere che si tratta di minerale granuloso, e
    ricorda che con la von Kossa diventerebbe nero. Perché proprio qui: la calcificazione metastatica predilige le pareti
    degli alveoli e dei vasi, come in questo campo, e in generale i tessuti un po' più alcalini di ciò che li circonda.
    La fonte non indica la malattia di base di questo paziente.
  en: >-
    Metastatic calcification of the lung at low power (the source names neither the stain nor the magnification; the
    colours are those of H&E). Read the overall pattern before any single structure: dark purple lines run through the
    whole field and outline the alveoli like the meshes of a net, because calcium salts have encrusted the alveolar
    walls; here and there, where several walls meet, the deposit thickens into dark knots. Now find the round profiles on
    the left: they are small vessels whose walls are ringed by the same dark purple material, and a longer vessel, cut
    lengthwise, crosses the upper right with red cells in its lumen. The alveolar spaces are filled with a pale pink,
    finely fibrillar material with scattered cells: this is the acute pneumonitis that the source reports in this area,
    not calcium. On H&E calcium is basophilic, so a purple network like this one can be mistaken for crowded nuclei or
    for fibrosis; switch to the higher power to see that it is granular mineral, and remember that von Kossa would turn
    it black. Why here: metastatic calcification favours the walls of alveoli and vessels, as in this field, and in
    general tissue that is slightly more alkaline than its surroundings. The source does not give this patient's
    underlying disease.
alt:
  it: >-
    Micrografia di polmone a piccolo ingrandimento in rosa e viola: una rete di linee viola scuro, sottili e spesse,
    delimita ampi spazi alveolari pieni di materiale rosa pallido finemente fibrillare; a sinistra vasi rotondi con la
    parete ad anello viola scuro e sangue nel lume; in alto a destra un lungo vaso con la parete viola scuro.
  en: >-
    Low-power micrograph of lung in pink and purple: a network of thin and thick dark purple lines outlines large
    alveolar spaces filled with pale pink, finely fibrillar material; on the left, round vessels with dark purple
    ring-shaped walls and blood in the lumen; at the upper right, a long vessel with a dark purple wall.
