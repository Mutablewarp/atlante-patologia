caption:
  it: >-
    Lipoma sottocutaneo di 6 cm, superficie di taglio. Guarda il profilo: la massa è rotonda, ben delimitata e il suo
    bordo è netto, perché è stata asportata intera dai tessuti circostanti. La superficie di taglio è omogenea, giallo
    chiaro e lucida, senza aree di necrosi o emorragia. Questo è l'aspetto tipico di una neoplasia benigna: circoscritta,
    uniforme e senza infiltrazione dei tessuti vicini.
  en: >-
    Subcutaneous lipoma, 6 cm, cut surface. Look at the outline: the mass is round and well delimited, with a sharp
    edge, because it was shelled out whole from the surrounding tissue. The cut surface is homogeneous, pale yellow
    and glistening, with no areas of necrosis or hemorrhage. This is the typical look of a benign tumor: circumscribed,
    uniform and not infiltrating the nearby tissue.
alt:
  it: >-
    Fotografia su sfondo nero di una massa ovale tagliata a metà: la superficie di taglio è giallo chiaro, liscia e
    lucida, con sottili vasi rossastri, e il margine è netto con un lembo di tessuto fibroso in alto a destra.
  en: >-
    Photograph on a black background of an oval mass cut in half: the cut surface is pale yellow, smooth and shiny,
    with fine reddish vessels, and the edge is sharp, with a strip of fibrous tissue at the upper right.
lookFor:
  it: "Controlla il margine: netto e circoscritto, senza proiezioni nel tessuto vicino; poi la superficie, uniforme e senza necrosi."
  en: "Check the edge: sharp and circumscribed, with no projections into nearby tissue; then the surface, uniform and without necrosis."
