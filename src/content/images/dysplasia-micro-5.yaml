lookFor:
  it: "Segui i nuclei rosso-bruni verso l'alto: a sinistra si fermano appena sopra la base, a destra arrivano alla superficie."
  en: "Follow the red-brown nuclei upward: on the left they stop just above the base, on the right they reach the surface."
caption:
  it: >-
    Lo stesso prelievo cervicale con CIN 2, colorato in immunoistochimica per Ki-67 (anticorpo MIB-1), a medio
    ingrandimento: i nuclei rosso-bruni sono positivi, quelli blu (controcolorazione con ematossilina) negativi. Ki-67 è
    una proteina nucleare presente in tutte le fasi attive del ciclo cellulare e assente nelle cellule quiescenti,
    quindi la colorazione mostra dove l'epitelio si sta dividendo. Parti da sinistra, nell'epitelio normale: i nuclei
    positivi formano una banda sottile appena sopra la base, e la metà superiore dell'epitelio è tutta blu, perché le
    cellule smettono di dividersi man mano che maturano. Poi passa alla metà destra: i nuclei positivi sono sparsi in
    tutto lo spessore, fino alla superficie. È la perdita di maturazione vista con un'immunocolorazione: il compartimento
    proliferativo, che normalmente resta negli strati bassi, si è esteso verso l'alto. Conta solo la colorazione dei
    nuclei; la lieve tinta bruna nel citoplasma di alcune cellule superficiali è fondo aspecifico. Attenzione: Ki-67
    misura la proliferazione, non la neoplasia; anche un epitelio infiammato o in rigenerazione può avere più nuclei
    positivi, quindi va letto insieme all'EE e a p16.
  en: >-
    The same CIN 2 cervical specimen immunostained for Ki-67 (MIB-1 antibody), medium power: red-brown nuclei are
    positive, blue nuclei (haematoxylin counterstain) are negative. Ki-67 is a nuclear protein present in every active
    phase of the cell cycle and absent in resting cells, so the stain maps where the epithelium is dividing. Start on the
    left, in the normal epithelium: the positive nuclei form a narrow band just above the base, and the upper half of the
    epithelium is all blue, because cells stop dividing as they mature. Then move to the right half: positive nuclei are
    scattered through the whole thickness, up to the surface. This is what loss of maturation looks like with an
    immunostain: the dividing compartment, normally confined to the lower layers, has spread upward. Only nuclear
    staining counts; the faint brown tint in the cytoplasm of some surface cells is background. Pitfall: Ki-67 measures
    proliferation, not neoplasia; inflamed or regenerating epithelium can also have more positive nuclei, so read it
    together with the H&E and p16.
alt:
  it: >-
    Micrografia immunoistochimica su fondo azzurro chiaro: una fascia di epitelio squamoso attraversa il centro, con lo
    stroma sotto e uno spazio vuoto sopra. A sinistra i nuclei rosso-bruni formano una banda sottile e ondulata nella
    parte bassa dell'epitelio; a destra molti nuclei rosso-bruni sono sparsi dalla base fino alla superficie.
  en: >-
    Immunostained micrograph on a pale blue background: a band of squamous epithelium crosses the middle, with stroma
    below and empty space above. On the left, red-brown nuclei form a narrow wavy band in the lower part of the
    epithelium; on the right, many red-brown nuclei are scattered from the base up to the surface.
