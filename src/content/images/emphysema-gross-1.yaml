lookFor:
  it: "Cerca le cavità nere sparse nel parenchima e nota che il tessuto tra l'una e l'altra appare conservato."
  en: "Look for the scattered black cavities in the parenchyma and note that the tissue between them looks preserved."
caption:
  it: >-
    Superficie di taglio di un polmone fissato con enfisema centrolobulare di un fumatore. Guarda le numerose cavità
    di dimensioni diverse, bordate da pigmento antracotico nero, sparse in modo irregolare nel parenchima rosso-bruno.
    Sono spazi aerei dilatati nella parte centrale dei lobuli, mentre il tessuto intorno resta in gran parte
    riconoscibile. Il righello in basso dà la scala in centimetri.
  en: >-
    Cut surface of a fixed lung with centrilobular emphysema from a smoker. Look at the many cavities of different
    sizes, rimmed by black anthracotic pigment, scattered unevenly through the red-brown parenchyma. They are enlarged
    airspaces in the central part of the lobules, while the tissue around them stays largely recognizable. The ruler at
    the bottom gives the scale in centimeters.
alt:
  it: >-
    Primo piano della superficie di taglio di un polmone: numerose cavità rotonde o irregolari, con bordo nero di
    pigmento, sparse nel parenchima rosso-bruno; in basso un righello graduato in centimetri.
  en: >-
    Close-up of the cut surface of a lung: many round or irregular cavities with a black pigmented rim, scattered
    through red-brown parenchyma; a ruler marked in centimeters runs along the bottom.
