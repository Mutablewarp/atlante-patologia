lookFor:
  it: "Segui un setto: nota quanto è sottile e dove si interrompe, lasciando un moncone libero nello spazio aereo."
  en: "Follow one septum: note how thin it is and where it breaks off, leaving a free stump in the airspace."
caption:
  it: >-
    Lo stesso polmone con enfisema, EE a medio ingrandimento (obiettivo 10x). Gli spazi aerei sono molto più ampi dei
    normali alveoli e le pareti che li separano sono sottili. Alcuni setti sono rotti e restano come frammenti isolati
    nel lume. In basso a sinistra si riconosce una piccola via aerea con epitelio a palizzata, accanto a un vaso
    pieno di sangue.
  en: >-
    The same emphysematous lung, H&E at medium power (10x objective). The airspaces are much larger than normal
    alveoli and the walls between them are thin. Some septa are broken and remain as isolated fragments in the lumen.
    At the lower left a small airway with a palisaded epithelium sits next to a blood-filled vessel.
alt:
  it: >-
    Micrografia a medio ingrandimento di polmone in ematossilina-eosina: grandi spazi aerei vuoti con setti sottili
    violacei, un frammento di setto isolato al centro e, in basso a sinistra, una piccola via aerea vicino a un vaso
    pieno di sangue.
  en: >-
    Medium-power H&E micrograph of lung: large empty airspaces with thin purple septa, an isolated septal fragment in
    the center and, at the lower left, a small airway beside a blood-filled vessel.
