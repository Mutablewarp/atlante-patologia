lookFor:
  it: "Segui le bande fibrose più scure che dividono il parenchima in noduli, poi cerca al loro interno i piccoli dotti e i vasi."
  en: "Follow the darker fibrous bands that divide the parenchyma into nodules, then look inside them for small ducts and vessels."
caption:
  it: >-
    Iperplasia nodulare focale, EE a basso ingrandimento. Guarda prima il quadro d'insieme: il parenchima epatico rosa è
    suddiviso in noduli da setti fibrosi più scuri, un aspetto che ricorda la cirrosi. Nei setti si vedono piccoli
    dotti e vasi con un infiltrato infiammatorio. Il passo successivo è confrontare questo setto con i noduli
    circostanti a ingrandimento maggiore.
  en: >-
    Focal nodular hyperplasia, H&E at low power. Look at the overall pattern first: the pink liver parenchyma is
    divided into nodules by darker fibrous septa, a look that resembles cirrhosis. Small ducts and vessels with an
    inflammatory infiltrate can be seen within the septa. The next step is to compare a septum with the surrounding
    nodules at higher power.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina a basso ingrandimento: campo rosa di epatociti attraversato da
    bande irregolari violacee di tessuto fibroso con piccoli dotti e cellule infiammatorie, che delimitano noduli.
  en: >-
    Low-power H&E micrograph of liver: a pink field of hepatocytes crossed by irregular purple bands of fibrous
    tissue with small ducts and inflammatory cells, outlining nodules.
