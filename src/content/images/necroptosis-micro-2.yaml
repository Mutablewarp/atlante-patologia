caption:
  it: >-
    Necroptosi colta a metà strada: fibroblasti murini L929 trattati con l'inibitore delle caspasi zVAD-fmk e poi con
    TNF, ripresi in vivo al microscopio a contrasto di fase a registrazione in corso (dettaglio dello stesso esperimento di
    necroptosis-micro-1). Nello stesso campo convivono tre aspetti, ed è utile
    leggerli come le tappe di una sequenza. Cerca prima le cellule ancora vive: allungate, fusate, aderenti al fondo,
    con un bordo luminoso. Poi le cellule tonde e molto brillanti: si sono staccate e arrotondate, ma la membrana è
    ancora integra e trattiene il citoplasma denso, per questo appaiono rifrangenti. Infine le più numerose, le cellule
    tonde, grigie, granulose e senza alone: sono morte, con la membrana plasmatica perforata da MLKL dopo
    l'attivazione di RIPK1 e RIPK3. La morte non è sincronizzata: ogni cellula passa da una tappa all'altra con i
    propri tempi, per questo il campo appare misto. Da ricordare: nella necroptosi la cellula si gonfia e la membrana
    cede, liberando nel microambiente il suo contenuto (DAMP), che richiama l'infiammazione; nell'apoptosi invece la
    cellula si rimpicciolisce, forma bolle sulla superficie e si frammenta in corpi apoptotici che vengono fagocitati
    senza infiammazione. Attenzione: è un esperimento su cellule in coltura, non un preparato istologico.
  en: >-
    Necroptosis caught halfway: mouse L929 fibroblasts treated with the caspase inhibitor zVAD-fmk and then with TNF,
    imaged live by phase-contrast microscopy partway through the recording (a detail from the same experiment as
    necroptosis-micro-1). Three appearances share the same field, and it helps to read them as
    steps in a sequence. First find the cells that are still alive: elongated, spindle-shaped, attached to the dish,
    with a bright edge. Then the round, very bright cells: they have detached and rounded up, but their membrane is
    still intact and holds in the dense cytoplasm, which is why they look refractile. Finally the most numerous ones,
    the round, grey, granular cells without a halo: they are dead, their plasma membrane perforated by MLKL after
    RIPK1 and RIPK3 were activated. Death is not synchronised: each cell moves through the steps on its own schedule,
    which is why the field looks mixed. Key point: in necroptosis the cell swells and the membrane gives way, releasing
    its contents (DAMPs) into the surroundings, which draws in inflammation; in apoptosis the cell shrinks, blebs and
    breaks up into apoptotic bodies that are phagocytosed without inflammation. Note that this is a cell-culture
    experiment, not a histological section.
alt:
  it: >-
    Micrografia in scala di grigi al contrasto di fase, con barra di scala da 50 µm in basso a destra: su fondo grigio
    scuro alcune cellule allungate e appuntite con bordi luminosi, alcune piccole cellule tonde molto brillanti e molte
    cellule tonde, grigie e granulose senza alone luminoso.
  en: >-
    Greyscale phase-contrast micrograph with a 50 µm scale bar at lower right: on a dark grey background, a few
    elongated, pointed cells with bright edges, a few small, very bright round cells and many round, grey, granular
    cells without a bright halo.
