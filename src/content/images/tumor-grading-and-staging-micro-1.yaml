lookFor:
  it: "Guarda l'architettura: ghiandole piccole, distinte e ben formate che si infiltrano nello stroma fibromuscolare."
  en: "Look at the architecture: small, separate, well-formed glands infiltrating the fibromuscular stroma."
caption:
  it: >-
    Adenocarcinoma della prostata, EE a basso ingrandimento, esempio di pattern 3 di Gleason. Cerca le ghiandole
    piccole e distinte, ancora ben formate, sparse nello stroma rosa. Questo è il pattern che il sistema di Gleason
    considera di grado più basso tra quelli mostrati in questa scheda; confrontalo con l'immagine successiva.
  en: >-
    Prostatic adenocarcinoma, H&E at low power, an example of Gleason pattern 3. Look for the small, separate glands
    that are still well formed, scattered in the pink stroma. This is the lowest-grade pattern shown on this card;
    compare it with the next image.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: tessuto prostatico rosa con numerose piccole ghiandole
    violacee, separate l'una dall'altra, disperse nello stroma; in alto un margine con frammenti staccati.
  en: >-
    Low-power H&E micrograph: pink prostatic tissue with many small purple glands, separate from one another, scattered
    through the stroma; a ragged edge with detached fragments at the top.
