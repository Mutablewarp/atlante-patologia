lookFor:
  it: "Cerca le ghiandole fuse o cribriformi (pattern 4) e le cellule isolate o in cordoni senza ghiandole (pattern 5)."
  en: "Look for fused or cribriform glands (pattern 4) and for single cells or cords with no gland formation (pattern 5)."
caption:
  it: >-
    Adenocarcinoma della prostata, EE a medio ingrandimento, pattern 4 e 5 di Gleason (curettage). Qui le ghiandole
    ben formate dell'immagine precedente non ci sono più: le cellule tumorali infiltrano lo stroma come elementi isolati
    o in cordoni, con nuclei scuri e irregolari. Più la formazione di ghiandole si perde, più alto è il grado.
  en: >-
    Prostatic adenocarcinoma, H&E at medium power, Gleason patterns 4 and 5 (curettings). The well-formed glands of
    the previous image are gone: tumor cells infiltrate the stroma as single cells or cords, with dark, irregular
    nuclei. The more gland formation is lost, the higher the grade.
alt:
  it: >-
    Micrografia a medio ingrandimento in ematossilina-eosina: stroma rosa fibrillare infiltrato da molte cellule con
    nuclei scuri, ovali o allungati, isolate o in piccoli gruppi, senza ghiandole riconoscibili.
  en: >-
    Medium-power H&E micrograph: pink fibrillar stroma infiltrated by many cells with dark, oval or elongated nuclei,
    single or in small groups, with no recognizable glands.
