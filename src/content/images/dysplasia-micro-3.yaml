caption:
  it: >-
    Displasia di alto grado in un adenoma tubulo-villoso del colon, EE ad alto ingrandimento: è la displasia di un
    epitelio ghiandolare, utile per confrontarla con quella squamosa. Tutto l'epitelio del campo è già displastico,
    quindi il confronto è tra due gradi. Parti dal margine in alto a sinistra: la displasia di basso grado ha nuclei
    allungati "a matita", ipercromatici e stratificati, ma ancora paralleli tra loro e perpendicolari alla membrana
    basale, cioè con la polarità conservata. Poi segui la striscia centrale di epitelio: qui i nuclei diventano rotondi,
    vescicolosi, più grandi e disposti in modo disordinato, e non mantengono più l'orientamento verso la base.
    Questa perdita di polarità con nuclei tondeggianti e atipici definisce la displasia di alto grado. Concetto chiave:
    in un adenoma il grado di displasia si giudica dalla forma e dall'orientamento dei nuclei, oltre che
    dall'architettura delle ghiandole (per esempio aspetti cribriformi); la displasia resta confinata sopra la
    membrana basale finché non c'è invasione.
  en: >-
    High-grade dysplasia in a tubulovillous adenoma of the colon, H&E at high power: this is dysplasia of a glandular
    epithelium, useful to compare with the squamous kind. All the epithelium in the field is already dysplastic, so the
    comparison is between two grades. Start at the upper left edge: low-grade dysplasia has elongated, "pencil-like",
    hyperchromatic, stratified nuclei that are still parallel to each other and perpendicular to the basement
    membrane, so polarity is preserved. Then follow the central strip of epithelium: here the nuclei become round,
    vesicular, larger and haphazardly arranged, and they no longer point towards the base. This loss of polarity with
    rounded, atypical nuclei defines high-grade dysplasia. Key point: in an adenoma the grade of dysplasia is judged
    from the shape and orientation of the nuclei as well as from gland architecture (for example cribriform
    patterns); the dysplasia stays above the basement membrane until invasion occurs.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina di epitelio ghiandolare viola che riveste spazi bianchi
    (lumi). In alto a sinistra i nuclei sono allungati, scuri e paralleli; nella striscia centrale i nuclei sono più
    grandi, rotondi, chiari e disordinati. In basso al centro c'è un sottile stroma rosa con piccoli nuclei.
  en: >-
    High-power H&E micrograph of purple glandular epithelium lining white spaces (lumens). At the upper left the nuclei
    are elongated, dark and parallel; in the central strip the nuclei are larger, round, pale and disordered. A thin
    pink stroma with small nuclei runs across the lower centre.
