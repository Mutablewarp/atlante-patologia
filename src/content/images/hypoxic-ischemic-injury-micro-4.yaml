caption:
  it: >-
    Sostanza grigia cerebrale dopo una rianimazione cardiopolmonare, EE a piccolo ingrandimento: l'autore la descrive
    come danno ipossico globale dei neuroni. Guarda prima l'insieme del campo. I neuroni sono cellule piramidali, con
    corpo triangolare e un lungo dendrite, e quasi tutti hanno lo stesso aspetto: raggrinziti, angolati, di un rosso
    più scuro dello sfondo, ciascuno circondato da un alone chiaro. Il neuropilo tra loro è pieno di piccoli vacuoli.
    L'ischemia globale nasce di solito da un arresto cardiaco o da uno shock grave: tutto l'encefalo resta insieme
    senza ossigeno e senza glucosio, e non ha riserve di ossigeno, mentre quelle di glicogeno sono minime. Il danno però è selettivo:
    alcuni neuroni muoiono per primi, per esempio le cellule piramidali del settore di Sommer (CA1) dell'ippocampo e le
    cellule di Purkinje del cervelletto. Secondo l'autore, in quest'area il danno non è arrivato a un
    infarto (completo): il tessuto nel suo insieme non è necrotico, ma i suoi elementi più vulnerabili, i neuroni,
    stanno morendo. Passa al forte ingrandimento per vedere da vicino i singoli neuroni rossi.
  en: >-
    Brain grey matter after cardiopulmonary resuscitation, H&E at low power: the author describes it as global
    hypoxic injury of neurons. Survey the whole field first. The neurons are pyramidal cells, with a triangular body
    and a long dendrite, and almost all of them look alike: shrunken, angular, darker red than the background, each
    sitting in a clear halo. The neuropil between them is full of small holes. Global ischemia usually follows cardiac
    arrest or severe shock: the whole brain goes without oxygen and glucose at once, and it keeps no oxygen in store
    and very little glycogen. Yet the damage is selective: some neurons die first, for example the pyramidal cells of
    the Sommer sector (CA1) of the hippocampus and the Purkinje cells of the cerebellum. The author notes that in this
    area the injury did not amount to a (complete) infarct: the tissue as a whole is not necrotic, but its most
    vulnerable cells, the neurons, are dying. Switch to high power to see single red neurons up close.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento di sostanza grigia cerebrale: numerosi neuroni piccoli,
    triangolari, magenta scuro, ciascuno con una sottile coda e un alone chiaro, sparsi in modo uniforme su uno sfondo
    rosa finemente vacuolato.
  en: >-
    Low-power H&E micrograph of brain grey matter: many small, triangular, dark magenta neurons, each with a thin
    tail and a clear halo, scattered evenly over a pink, finely vacuolated background.
