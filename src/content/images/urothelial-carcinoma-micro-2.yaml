lookFor:
  it: "Cerca i nidi e i cordoni di cellule scure che si insinuano tra i fasci rosa e allungati del muscolo."
  en: "Look for the nests and cords of dark cells that slip between the pink, elongated bundles of muscle."
caption:
  it: >-
    Carcinoma uroteliale invasivo, EE a medio ingrandimento. Nidi e cordoni di cellule tumorali con nuclei scuri e
    pleomorfi si infiltrano tra i fasci di muscolo liscio. Questo reperto è ciò che porta lo stadio a T2 o oltre.
  en: >-
    Invasive urothelial carcinoma, H&E at medium power. Nests and cords of tumor cells with dark, pleomorphic nuclei
    infiltrate between smooth muscle bundles. This finding is what moves the stage to T2 or beyond.
alt:
  it: >-
    Micrografia in ematossilina-eosina: fasci rosa di muscolo con sottili nuclei allungati, attraversati da file e
    gruppi di cellule viola scuro, più grandi e irregolari.
  en: >-
    H&E micrograph: pink muscle bundles with thin elongated nuclei, crossed by rows and clusters of larger, irregular,
    dark purple cells.
