lookFor:
  it: Segui la mucosa viola dal lume verso l'esterno e osserva dove si spinge nello strato muscolare rosa.
  en: Follow the purple mucosa from the lumen outward and see where it pushes into the pink muscle layer.
caption:
  it: >-
    Colon sinistro con diverticolosi, sezione trasversale a ingrandimento minimo (scansione dell'intero vetrino).
    Parti dal lume al centro, bordato dalla mucosa viola con le sue pieghe. Poi segui la mucosa verso destra: forma
    una lunga sacca che sporge verso il grasso pericolico attraverso la parete muscolare rosa. Il diverticolo è
    privo di una vera parete muscolare propria, per questo è uno pseudodiverticolo.
  en: >-
    Left colon with diverticulosis, transverse section at very low power (whole-slide scan). Start at the lumen in
    the center, lined by purple mucosa with its folds. Then follow the mucosa toward the right: it forms a long pouch
    that pushes through the pink muscular wall toward the pericolic fat. The pouch has no true muscular wall of its
    own, which is why a colonic diverticulum is a pseudodiverticulum.
alt:
  it: >-
    Scansione di un vetrino in ematossilina-eosina: al centro un lume colico con mucosa viola ripiegata; a sinistra e
    in basso muscolare rosa intensa; a destra una lunga sacca di mucosa che si spinge fuori dalla parete nel grasso
    chiaro.
  en: >-
    Scan of an H&E slide: a colonic lumen with folded purple mucosa in the center; deep pink muscular wall on the left
    and below; on the right a long pouch of mucosa extending out of the wall into pale fat.
