lookFor:
  it: "Confronta i nuclei tumorali grandi, irregolari e addensati a sinistra con i piccoli nuclei rotondi dei linfociti a destra."
  en: "Compare the large, irregular, crowded tumor nuclei on the left with the small round lymphocyte nuclei on the right."
caption:
  it: >-
    Lo stesso linfonodo a forte ingrandimento, EE. A sinistra una ghiandola tumorale: cellule colonnari con nuclei
    grandi, ipercromatici, di forma e dimensione irregolari, addensati e sovrapposti. A destra i linfociti: piccoli
    nuclei rotondi, scuri e uniformi. Il confronto tra le due popolazioni mostra bene che un epitelio ghiandolare, fuori
    posto in un linfonodo, è un focolaio metastatico.
  en: >-
    The same lymph node at high power, H&E. On the left is a tumor gland: columnar cells with large, hyperchromatic
    nuclei of irregular shape and size, crowded and overlapping. On the right are the lymphocytes: small, round, dark,
    uniform nuclei. Comparing the two populations shows why glandular epithelium, out of place in a lymph node, means a
    metastatic focus.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: a sinistra cellule epiteliali allungate con nuclei grandi e
    irregolari attorno a un lume; a destra fitta distesa di piccoli linfociti con nuclei rotondi scuri.
  en: >-
    High-power H&E micrograph: on the left, elongated epithelial cells with large irregular nuclei around a lumen; on
    the right, a dense field of small lymphocytes with dark round nuclei.
