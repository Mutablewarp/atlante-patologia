lookFor:
  it: Segui le bande rosa pallido e le zone ricche di cellule tra una banda e l'altra, tutte con lo stesso orientamento.
  en: Follow the pale pink bands and the cell-rich zones between them; they all run in the same direction.
caption:
  it: >-
    Trombo di un'embolia polmonare fatale, EE a basso ingrandimento. Guarda prima il bordo in alto a destra, dove il
    materiale si stacca dal lume vuoto. Poi segui la struttura a strati: bande rosa pallido, più omogenee, alternate
    a zone più granulari con cellule sparse. Sono le linee di Zahn, il segno di un trombo formatosi dentro un vaso in
    cui il sangue scorreva. A forte ingrandimento (immagine successiva) si distinguono le cellule.
  en: >-
    Thrombus from a fatal pulmonary embolism, H&E at low power. First look at the edge at the upper right, where the
    material pulls away from the empty lumen. Then follow the layered structure: paler, more homogeneous pink bands
    alternating with more granular zones holding scattered cells. These are the lines of Zahn, the sign of a thrombus
    that formed in flowing blood. At high power (next image) the cells can be told apart.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: massa rosa con bande più chiare e omogenee oblique
    alternate a zone granulari con piccoli nuclei viola sparsi; in alto a destra uno spazio vuoto bianco.
  en: >-
    Low-power H&E micrograph: a pink mass with oblique, paler, homogeneous bands alternating with granular zones
    holding scattered small purple nuclei; an empty white space at the upper right.
