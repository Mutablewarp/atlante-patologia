caption:
  it: >-
    Infarto miocardico riperfuso, sezione trasversale del cuore (asse corto). Orientati prima: al centro la cavità del
    ventricolo sinistro, nera; intorno i muscoli papillari e le trabecole; all'esterno lo spessore della parete; in alto
    a sinistra il grasso epicardico giallo. Reperto chiave: una fascia rosso-bruna scura abbraccia l'endocardio lungo
    tutta la circonferenza e chiazze scure macchiano i muscoli papillari, mentre la parte esterna della parete resta
    pallida. È un'emorragia subendocardica circonferenziale: gli strati interni, i più lontani dalle coronarie
    epicardiche e quindi i primi a morire, si riempiono di sangue quando il flusso ritorna. Confronta con l'infarto da
    occlusione persistente, che è pallido e nelle prime ore non si riconosce a occhio nudo.
  en: >-
    Reperfused myocardial infarct, transverse (short-axis) slice of the heart. Orient yourself first: the black left
    ventricular cavity in the middle; the papillary muscles and trabeculae around it; the thickness of the wall outside
    them; yellow epicardial fat at the upper left. Key finding: a dark red-brown band hugs the endocardium all the way
    around, and dark blotches stain the papillary muscles, while the outer part of the wall stays pale. This is
    circumferential subendocardial hemorrhage: the inner layers, farthest from the epicardial coronary arteries and so
    the first to die, fill with blood when flow returns. Compare an infarct from persistent occlusion, which is pale
    and cannot be seen with the naked eye in its first hours.
alt:
  it: >-
    Fotografia di una fetta trasversale di cuore: al centro la cavità ventricolare nera circondata da muscoli papillari
    e trabecole con chiazze scure; una fascia rosso-bruna scura riveste la parete interna tutto intorno alla cavità; la
    parete esterna è color nocciola chiaro; grasso giallo in alto a sinistra.
  en: >-
    Photograph of a transverse slice of heart: in the middle the black ventricular cavity, surrounded by papillary
    muscles and trabeculae with dark blotches; a dark red-brown band lines the inner wall all around the cavity; the
    outer wall is light tan; yellow fat at the upper left.
