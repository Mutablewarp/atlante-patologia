lookFor:
  it: "Parti dalla mucosa con ghiandole conservate a sinistra e segui il tessuto verso destra, fino alla superficie rosa dell'ulcera."
  en: "Start at the mucosa with preserved glands on the left and follow the tissue to the right, toward the pink surface of the ulcer."
caption:
  it: >-
    Margine di un'ulcera gastrica, EE a basso ingrandimento. A sinistra la mucosa conserva le ghiandole, con epitelio
    violaceo. Verso destra le ghiandole scompaiono e compare tessuto più cellulare e vascolare, con una superficie
    rosa e amorfa in alto a destra: è il fondo dell'ulcera, dove la mucosa è andata persa.
  en: >-
    Edge of a gastric ulcer, H&E at low power. At the left the mucosa keeps its glands, with purple epithelium. Toward
    the right the glands disappear and a more cellular, vascular tissue appears, with a pink amorphous surface at the
    upper right: this is the ulcer bed, where the mucosa has been lost.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a sinistra ghiandole gastriche con epitelio violaceo, a destra tessuto rosa
    più cellulare con una superficie rosa amorfa e, in alto, ampio spazio bianco.
  en: >-
    H&E micrograph: at the left, gastric glands with purple epithelium; at the right, pinker, more cellular tissue
    with an amorphous pink surface, and a large white empty area above.
