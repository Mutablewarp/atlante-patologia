caption:
  it: >-
    Lo spettro degli adattamenti cellulari. Di fronte a uno stress o a una richiesta funzionale diversa, la cellula può
    ridursi (atrofia, per minore uso, ossigeno, nutrienti o stimoli ormonali), ingrandirsi (ipertrofia, per maggior
    lavoro o ormoni, come nel muscolo dell'atleta), moltiplicarsi (iperplasia) o sostituire un tipo cellulare maturo con
    un altro (metaplasia, come l'epitelio squamoso nei bronchi del fumatore). Se il danno persiste può comparire la
    displasia, con crescita e maturazione disordinate: può regredire oppure progredire verso il cancro. Gli adattamenti
    di solito regrediscono quando lo stimolo cessa.
  en: >-
    The spectrum of cellular adaptations. Faced with stress or altered demand, a cell can shrink (atrophy, after reduced
    use, oxygen, nutrients or hormonal signals), enlarge (hypertrophy, after more workload or hormones, as in an
    athlete's muscle), multiply (hyperplasia) or swap one mature cell type for another (metaplasia, such as squamous
    lining in a smoker's bronchus). If injury persists, dysplasia may follow, with disordered growth and maturation: it
    can regress or progress to cancer. Adaptations usually reverse when the stimulus stops.
alt:
  it: >-
    Schema ad albero: dal riquadro "normale" in alto una linea scende a quattro riquadri, ciascuno con un piccolo disegno
    di cellule: atrofia (cellula più piccola), ipertrofia (cellula più grande), iperplasia (più cellule), metaplasia
    (cellule cilindriche che diventano piatte). Dalla metaplasia una freccia rosa porta al riquadro della displasia, con
    cellule irregolari e nuclei grandi e scuri.
  en: >-
    Tree diagram: from the "normal" box at the top a line runs down to four boxes, each with a small cell drawing:
    atrophy (smaller cell), hypertrophy (larger cell), hyperplasia (more cells), metaplasia (columnar cells turning
    flat). From metaplasia a pink arrow leads to the dysplasia box, with irregular cells and large dark nuclei.
