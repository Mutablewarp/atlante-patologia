lookFor:
  it: "Guarda la distribuzione dei foci neri nel parenchima e cerca la cavità chiara nel lobo superiore sinistro dell'immagine."
  en: "Look at how the black foci are spread through the parenchyma and find the pale cavity in the upper left lobe of the image."
caption:
  it: >-
    Sezione di polmoni fissati in un barattolo, da un minatore con silicosi e tubercolosi. Il parenchima è costellato di
    foci e noduli neri, più fitti nei campi superiori; ai lati dell'ilo i linfonodi appaiono neri. In alto a sinistra
    si vede una cavità irregolare, chiara.
  en: >-
    Cut section of fixed lungs in a jar, from a miner with silicosis and tuberculosis. The parenchyma is studded with black
    foci and nodules, denser in the upper fields; the nodes beside the hilum look black. At upper left there is an
    irregular, pale cavity.
alt:
  it: "Due polmoni sezionati in un contenitore di vetro con liquido giallo-verde; il tessuto è punteggiato di macchie nere e al centro, vicino all'ilo, si vedono masse nere; in alto a sinistra c'è una cavità chiara."
  en: "Two cut lungs in a glass jar of yellow-green fluid; the tissue is speckled with black spots, black masses lie near the hilum in the center, and a pale cavity sits at upper left."
