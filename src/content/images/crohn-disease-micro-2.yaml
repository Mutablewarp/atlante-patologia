caption:
  it: >-
    Biopsia duodenale, EE a medio ingrandimento. A sinistra villi e cripte con cellule mucipare chiare, quasi normali. A
    destra, sotto l'epitelio, un ammasso di istiociti epitelioidi rosa con cellule giganti multinucleate, circondato da
    linfociti: è un granuloma, qui senza necrosi evidente. La malattia di Crohn può interessare anche tratti alti
    dell'apparato digerente.
  en: >-
    Duodenal biopsy, H&E at medium power. On the left, villi and crypts with clear goblet cells, nearly normal. On the
    right, beneath the epithelium, a cluster of pink epithelioid histiocytes with multinucleated giant cells, rimmed by
    lymphocytes: a granuloma, here without obvious necrosis. Crohn disease can also involve the upper digestive tract.
alt:
  it: >-
    Micrografia di biopsia duodenale in ematossilina-eosina: a sinistra mucosa con cripte ben conservate, a destra un
    nodulo rosa di cellule epitelioidi e cellule giganti con un bordo di piccole cellule scure.
  en: >-
    H&E micrograph of a duodenal biopsy: on the left, mucosa with well-preserved crypts; on the right, a pink nodule of
    epithelioid cells and giant cells with a rim of small dark cells.
lookFor:
  it: "Cerca l'ammasso rosa di istiociti con cellule giganti a destra e confrontalo con le cripte regolari a sinistra."
  en: "Look for the pink cluster of histiocytes with giant cells on the right and compare it with the regular crypts on the left."
