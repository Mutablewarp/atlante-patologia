caption:
  it: >-
    Oncocitoma renale, EE a medio ingrandimento (biopsia renale). A sinistra il tumore forma nidi di cellule uniformi con
    citoplasma rosa e nuclei rotondi e regolari; a destra rene non neoplastico con glomeruli e tubuli.
  en: >-
    Renal oncocytoma, H&E at medium power (kidney biopsy). On the left the tumor forms nests of uniform cells with pink
    cytoplasm and round, regular nuclei; on the right, non-neoplastic kidney with glomeruli and tubules.
alt:
  it: >-
    Micrografia a medio ingrandimento in EE: a sinistra grandi nidi di cellule rosa-viola con molti nuclei rotondi
    scuri e simili tra loro; a destra tubuli e due glomeruli del rene normale.
  en: >-
    Medium-power H&E micrograph: on the left, large nests of pink-purple cells with many dark, similar round nuclei;
    on the right, tubules and two glomeruli of normal kidney.
