lookFor:
  it: "Guarda quanto citoplasma rosa circonda ogni nucleo e quanto sono distanziati i nuclei: più citoplasma vuol dire una cellula più grande."
  en: "See how much pink cytoplasm surrounds each nucleus and how far apart the nuclei lie: more cytoplasm means a bigger cell."
caption:
  it: >-
    Miometrio di un utero gravidico, ematossilina-eosina a medio ingrandimento (20X secondo la fonte): ipertrofia
    fisiologica della muscolatura liscia. Quasi tutto il campo è occupato da un fascio di cellule muscolari lisce
    tagliate per il lungo, che corre in diagonale dal basso a sinistra all'alto a destra. Guarda una cellula sola: è
    un fuso lungo e largo, con abbondante citoplasma rosa e un solo nucleo ovale, e i nuclei vicini sono ben
    distanziati perché ogni cellula è cresciuta; secondo la descrizione della fonte, nel miometrio non gravidico le
    cellule sono fusate ma più piccole. Qua e là un tessuto connettivo lasso e pallido separa le cellule e divide
    questo fascio da un altro, in basso a destra, le cui cellule sono tagliate trasversalmente. Qui lo stimolo non è
    una malattia ma la normale spinta ormonale della gravidanza: cellule sensibili agli ormoni sintetizzano più
    proteine e si ingrandiscono. È un'ipertrofia fisiologica, da confrontare con le ipertrofie cardiache patologiche
    delle altre immagini di questa scheda. In gravidanza il miometrio si arricchisce anche di cellule nuove:
    ipertrofia e iperplasia procedono insieme. Attenzione: in basso a destra le cellule sembrano piccoli profili rotondi o poligonali solo
    perché sono tagliate di traverso; confronta le dimensioni solo tra cellule tagliate nello stesso piano, e
    idealmente con un miometrio non gravidico allo stesso ingrandimento.
  en: >-
    Myometrium of a pregnant uterus, H&E at intermediate power (20X in the source): physiologic hypertrophy of smooth
    muscle. Most of the field is taken up by a bundle of smooth muscle cells cut lengthwise, running diagonally from the
    lower left to the upper right. Look at a single cell: it is a long, broad spindle with abundant pink cytoplasm and
    one oval nucleus, and neighbouring nuclei lie well apart because each cell has grown; according to the source's
    description, the cells of non-pregnant myometrium are spindles too, but smaller. Here and there pale, loose
    connective tissue separates the cells and divides this bundle from another one, at the lower right, whose cells
    are cut across. The stimulus here is not disease but the normal hormonal drive of pregnancy: hormone-responsive
    cells make more protein and grow. This is physiologic hypertrophy; compare it with the pathologic cardiac
    hypertrophy in the other images on this card. In pregnancy the myometrium also adds new cells, so hypertrophy and
    hyperplasia go together. Pitfall: at the lower right the cells look like small round or polygonal profiles only
    because they are cut across; compare size only between cells cut in the same plane, ideally against non-pregnant
    myometrium at the same magnification.
alt:
  it: >-
    Micrografia in ematossilina-eosina, in rosa e viola intensi. Una larga fascia di cellule rosa lunghe e voluminose,
    con nuclei viola ovali, attraversa il campo in diagonale dal basso a sinistra all'alto a destra, con spazi pallidi e
    schiumosi tra alcune cellule; in alto a sinistra e lungo il margine in basso a destra c'è tessuto lasso più chiaro,
    e nell'angolo in basso a destra le cellule appaiono come profili rosa rotondeggianti. Una sottile cornice nera
    circonda l'immagine.
  en: >-
    H&E micrograph in strong pink and purple. A broad band of long, plump pink cells with oval purple nuclei crosses the
    field diagonally from the lower left to the upper right, with pale, frothy spaces between some cells; at the top
    left and along the lower right edge lies paler loose tissue, and in the lower right corner the cells appear as
    rounded pink profiles. A thin black frame surrounds the picture.
