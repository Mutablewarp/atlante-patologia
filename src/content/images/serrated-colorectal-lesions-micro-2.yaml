lookFor:
  it: "Guarda prima tutto il polipo, poi confronta le cripte sui due lati con le cripte strette della mucosa normale."
  en: "Take in the whole polyp first, then compare the crypts on its two sides with the narrow crypts of normal mucosa."
caption:
  it: >-
    Lo stesso adenoma serrato sessile in visione d'insieme, EE a basso ingrandimento. Guarda prima tutto il polipo: un
    asse centrale chiaro, circondato da cripte larghe e ondulate che si dispongono tutt'intorno. Poi osserva le singole
    cripte sui due lati e nota quanto sono più ampie di quelle strette e dritte della mucosa normale.
  en: >-
    The same sessile serrated adenoma in an overview, H&E at low power. Take in the whole polyp first: a pale central
    core surrounded by wide, wavy crypts arranged all around it. Then look at the single crypts on the two sides and note
    how much wider they are than the narrow, straight crypts of normal mucosa.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento di un piccolo polipo del colon: un asse centrale pallido
    circondato da cripte larghe e ondulate, con lume chiaro, disposte a anello.
  en: >-
    Low-power H&E micrograph of a small colon polyp: a pale central core surrounded by wide, wavy crypts with pale
    lumens arranged in a ring.
