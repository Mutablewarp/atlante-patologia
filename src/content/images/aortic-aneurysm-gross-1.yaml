  it: "Veduta anteriore dell'aorta asportata insieme ai due reni"
  en: "Anterior view of the removed aorta together with both kidneys"
lookFor:
  it: "Parti dai reni e dalle arterie renali, poi segui l'aorta verso il basso: la dilatazione inizia sotto l'origine delle renali."
  en: "Start at the kidneys and the renal arteries, then follow the aorta downward: the dilation begins below the renal origins."
caption:
  it: >-
    Aneurisma infrarenale dell'aorta addominale su preparato autoptico, visto dal davanti con i due reni. Trova prima
    le arterie renali, poi osserva sotto di esse il tratto di aorta che si gonfia in un rigonfiamento allungato e
    ovoidale (forma fusiforme), con la parete esterna liscia. Sopra le renali l'aorta ha un calibro molto minore.
    Le scritte in inglese fanno parte dell'immagine originale.
  en: >-
    Infrarenal abdominal aortic aneurysm on an autopsy specimen, seen from the front with both kidneys. Find the renal
    arteries first, then look below them at the aortic segment that swells into an elongated, oval bulge (fusiform
    shape) with a smooth outer surface. Above the renal arteries the aorta has a much smaller caliber. The English
    labels are part of the original image.
alt:
  it: >-
    Fotografia di un preparato autoptico su fondo blu: due reni ai lati e al centro l'aorta, che sotto le arterie
    renali si dilata in un grande rigonfiamento allungato, poi si divide in basso nelle arterie iliache.
  en: >-
    Photograph of an autopsy specimen on a blue background: two kidneys at the sides and the aorta in the middle,
    which below the renal arteries widens into a large elongated bulge and then divides below into the iliac arteries.
