caption:
  it: >-
    Autopsia: polmoni aperti con le arterie polmonari principali incise. Cerca al centro il materiale chiaro e
    avvolto su se stesso che occupa il lume delle grandi arterie: è un trombo-embolo che a cavaliere della
    biforcazione ostruisce i due rami. Attorno, il parenchima polmonare appare di colore rosso scuro.
  en: >-
    Autopsy: opened lungs with the main pulmonary arteries cut open. Look in the center for the pale, coiled material
    that fills the lumen of the large arteries: a thromboembolus that sits astride the bifurcation and blocks both
    branches. Around it, the lung tissue is dark red.
alt:
  it: >-
    Fotografia macroscopica di polmoni con le arterie polmonari aperte: al centro una massa chiara, giallastra e
    contorta riempie il lume dei rami principali, con zone più scure e rossastre ai lati.
  en: >-
    Gross photograph of lungs with the pulmonary arteries opened: in the center a pale, yellowish, twisted mass fills
    the lumen of the main branches, with darker reddish areas on both sides.
