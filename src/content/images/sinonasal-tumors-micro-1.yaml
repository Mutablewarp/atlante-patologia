lookFor:
  it: Guarda prima il contorno frastagliato di superficie, poi i nidi rotondi di epitelio immersi nello stroma rosa.
  en: Look first at the frilly surface outline, then at the rounded nests of epithelium sitting in the pink stroma.
caption:
  it: >-
    Papilloma sinonasale, EE a basso ingrandimento. La superficie forma digitazioni e pieghe. Nello stroma rosa
    compaiono nidi rotondi di epitelio violaceo, alcuni con un piccolo lume al centro. Passa poi all'immagine ad alto
    ingrandimento per guardare l'epitelio da vicino.
  en: >-
    Sinonasal papilloma, H&E at low power. The surface forms fronds and folds. Within the pink stroma are rounded nests
    of purple epithelium, some with a small central lumen. Then switch to the high-power image to look at the
    epithelium up close.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: tessuto con superficie frastagliata e molti nidi rotondi
    di epitelio violaceo in uno stroma rosa; in basso a sinistra una zona di sangue rosso intenso.
  en: >-
    Low-power H&E micrograph: tissue with a frilly surface and many rounded nests of purple epithelium in a pink
    stroma; a patch of deep red blood at the lower left.
