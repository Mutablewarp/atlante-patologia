lookFor:
  it: "Guarda prima l'intera biopsia: in alto a sinistra le fossette sono lunghe e a dente di sega, sotto le ghiandole sono tagliate in sezione."
  en: "Look at the whole biopsy first: at the upper left the pits are long and serrated, with the glands cut in cross-section below them."
caption:
  it: >-
    Gastropatia reattiva, EE a basso ingrandimento. Una biopsia di mucosa gastrica: a sinistra le fossette foveolari
    sono allungate e tortuose, con profilo a dente di sega; al centro e a destra le ghiandole sono tagliate in sezione e
    il tessuto tra di esse è rosa e fibroso, con pochi elementi infiammatori. Il quadro generale è quello di una mucosa
    iperplastica con poca infiammazione. A forte ingrandimento (immagine seguente) si osservano le singole cellule.
  en: >-
    Reactive gastropathy, H&E at low power. A biopsy of gastric mucosa: on the left the foveolar pits are elongated and
    twisted, with a serrated outline; in the center and on the right the glands are cut across and the tissue between
    them is pink and fibrous, with few inflammatory cells. The overall picture is a hyperplastic mucosa with little
    inflammation. At high power (next image) the individual cells can be seen.
alt:
  it: >-
    Micrografia di una biopsia gastrica in ematossilina-eosina su sfondo bianco: a sinistra fossette lunghe e
    tortuose con bordo dentellato, al centro e a destra numerose sezioni rotonde di ghiandole separate da un tessuto
    rosa.
  en: >-
    H&E micrograph of a gastric biopsy on a white background: long, twisted pits with a serrated edge on the left, and
    many round gland cross-sections separated by pink tissue in the center and on the right.
