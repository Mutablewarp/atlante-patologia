lookFor:
  it: "Osserva la forma dei grappoli: sono gruppi compatti di cellule tenuti insieme da sottili tralci, su fondo chiaro."
  en: "Look at the shape of the clusters: compact groups of cells joined by thin strands on a clear background."
caption:
  it: >-
    Carcinoma epatocellulare, preparato colorato a basso ingrandimento. Il campione è fatto di grappoli compatti di
    cellule violacee, uniti da sottili tralci e senza uno stroma epatico organizzato intorno. Serve a riconoscere il
    disegno d'insieme prima di guardare le singole cellule.
  en: >-
    Hepatocellular carcinoma, stained preparation at low power. The sample consists of compact clusters of purplish
    cells joined by thin strands, with no organized liver stroma around them. Use it to recognize the overall pattern
    before looking at single cells.
alt:
  it: >-
    Micrografia a basso ingrandimento: grappoli di cellule viola e rosse collegati da sottili tralci azzurrini, su
    sfondo quasi bianco.
  en: >-
    Low-power micrograph: clusters of purple and red cells linked by thin bluish strands, on a nearly white
    background.
