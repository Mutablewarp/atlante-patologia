lookFor:
  it: Distingui i neutrofili, con nucleo scuro e lobato, dalle cellule più grandi con nucleo chiaro, e cerca il materiale rosa omogeneo al centro.
  en: Tell the neutrophils, with dark lobed nuclei, from the larger cells with pale nuclei, and look for the homogeneous pink material in the center.
caption:
  it: >-
    Biopsia polmonare in granulomatosi con poliangioite, EE ad alto ingrandimento. Molte cellule piccole con nucleo
    scuro e lobato, compatibili con neutrofili, si mescolano a cellule più grandi con nucleo chiaro, simili a
    istiociti. Al centro e ai lati compaiono fasce di materiale rosa omogeneo. Questo mix di infiammazione acuta e
    cellule istiocitarie è tipico della lesione. È lo stesso campo del precedente, visto più da vicino.
  en: >-
    Lung biopsy in granulomatosis with polyangiitis, H&E at high power. Many small cells with dark lobed nuclei,
    consistent with neutrophils, are mixed with larger cells with pale nuclei, like histiocytes. Bands of homogeneous
    pink material appear in the center and at the sides. This mix of acute inflammation and histiocyte-like cells is
    typical of the lesion. It is the same lesion as the previous image, seen closer.
alt:
  it: >-
    Micrografia in ematossilina-eosina ad alto ingrandimento: molti piccoli nuclei scuri e lobati, cellule più grandi con
    nucleo chiaro e fasce di materiale rosa omogeneo su sfondo rosa.
  en: >-
    High-power H&E micrograph: many small dark lobed nuclei, larger cells with pale nuclei, and bands of homogeneous
    pink material on a pink background.
