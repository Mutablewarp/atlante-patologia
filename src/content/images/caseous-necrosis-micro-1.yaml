caption:
  it: >-
    Granuloma caseoso nel polmone di un paziente con tubercolosi miliare, EE, obiettivo 10×. Parti dal piccolo
    ingrandimento: un unico grande nodulo rotondeggiante riempie quasi tutto il campo; negli angoli resta un po' del
    parenchima polmonare circostante, con globuli rossi. Poi leggi il nodulo dall'esterno verso l'interno. Il bordo più
    esterno (margine sinistro) è un manicotto di piccoli linfociti scuri. All'interno c'è una fascia di macrofagi
    epitelioidi, cellule chiare con nuclei ovali o allungati, insieme a diverse cellule giganti multinucleate, ben
    visibili lungo il margine in basso a sinistra e sul lato destro. Il reperto chiave è il centro: un'ampia area rosa
    pallido, amorfa o finemente granulare, in cui i profili delle cellule e l'architettura del tessuto sono scomparsi e
    restano solo frammenti nucleari scuri sparsi. Questa è la necrosi caseosa. Come riconoscerla: nella necrosi
    coagulativa le sagome delle cellule e del tessuto restano riconoscibili, qui no; nella necrosi colliquativa il centro
    sarebbe liquido e ricco di granulociti neutrofili, non una massa rosa compatta. Collegamento clinico: un granuloma
    necrotizzante come questo impone di cercare i micobatteri (colorazione di Ziehl-Neelsen, coltura, test molecolari);
    anche alcuni funghi, per esempio Histoplasma, possono dare lo stesso quadro.
  en: >-
    Caseating granuloma in the lung of a patient with miliary tuberculosis, H&E, 10× objective. Start at low power: one
    large, round nodule fills most of the field; in the corners a little of the surrounding lung remains, with red blood
    cells. Then read the nodule from the outside in. The outermost rim (left edge) is a cuff of small, dark lymphocytes.
    Inside it lies a band of epithelioid macrophages, pale cells with oval or elongated nuclei, together with several
    multinucleated giant cells that are easiest to see along the lower left border and on the right side. The key
    finding is the centre: a wide, pale pink, amorphous to finely granular zone in which cell outlines and tissue
    architecture have disappeared and only scattered dark fragments of nuclei remain. This is caseous necrosis. How to
    tell it apart: in coagulative necrosis the ghost outlines of cells and tissue are still recognisable, here they are
    not; in liquefactive necrosis the centre would be fluid and full of neutrophils, not a solid pink mass. Clinical
    link: a necrotising granuloma like this one calls for a search for mycobacteria (Ziehl-Neelsen stain, culture,
    molecular tests); some fungi, such as Histoplasma, can produce the same picture.
alt:
  it: >-
    Micrografia in ematossilina-eosina: un grande nodulo rotondo occupa il campo. Il suo ampio centro è rosa pallido e
    privo di struttura, con pochi puntini scuri sparsi; intorno ci sono cellule chiare epitelioidi, alcune cellule giganti
    multinucleate (in basso a sinistra e a destra) e, sul margine sinistro, una fascia scura di linfociti.
  en: >-
    H&E micrograph: a large round nodule fills the field. Its wide centre is pale pink and structureless with a few
    scattered dark dots; around it lie pale epithelioid cells, several multinucleated giant cells (lower left and right)
    and, along the left edge, a dark band of lymphocytes.
