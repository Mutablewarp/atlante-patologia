caption:
  it: >-
    Colon fissato in formalina e sospeso in un barattolo, vista d'insieme. Guarda prima la forma ad arco dell'intestino
    e poi la superficie: non è liscia ma coperta quasi senza interruzioni da un tappeto di piccoli polipi
    ravvicinati. È l'aspetto macroscopico della poliposi adenomatosa familiare: una mucosa che appare "tappezzata" di
    polipi, senza un tratto di mucosa normale ampio.
  en: >-
    Formalin-fixed colon suspended in a jar, overall view. Look first at the arch shape of the bowel, then at the
    surface: it is not smooth but covered almost without a break by a carpet of small, crowded polyps. This is the
    gross picture of familial adenomatous polyposis: a mucosa that looks "carpeted" with polyps, with no wide stretch
    of normal mucosa.
alt:
  it: >-
    Fotografia di un colon intero a forma di arco, immerso in liquido in un barattolo di vetro, con la superficie
    interna coperta da numerosi piccoli polipi color crema.
  en: >-
    Photograph of a whole colon shaped like an arch, immersed in fluid in a glass jar, with its inner surface covered
    by numerous small cream-colored polyps.
