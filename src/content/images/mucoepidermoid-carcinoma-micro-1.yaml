lookFor:
  it: "Cerca i nidi di cellule rosa e le cellule chiare con vacuoli, separati da bande di stroma fibroso."
  en: "Look for the nests of pink cells and the pale, vacuolated cells, separated by bands of fibrous stroma."
caption:
  it: >-
    Carcinoma mucoepidermoide delle ghiandole salivari, EE a medio ingrandimento. Nidi di cellule poligonali con
    citoplasma rosa, e tra queste cellule più chiare con vacuoli, sono separati da bande di stroma fibroso. Il tumore è
    solido, senza spazi cistici evidenti in questo campo.
  en: >-
    Mucoepidermoid carcinoma of the salivary gland, H&E at medium power. Nests of polygonal cells with pink cytoplasm,
    mixed with paler vacuolated cells, are separated by bands of fibrous stroma. The tumor is solid in this field, with
    no obvious cystic spaces.
alt:
  it: >-
    Micrografia in ematossilina-eosina: nidi di cellule poligonali rosa con cellule chiare vacuolate sparse, divisi da
    una banda diagonale di stroma fibroso rosa pallido.
  en: >-
    H&E micrograph: nests of pink polygonal cells with scattered pale vacuolated cells, divided by a diagonal band of
    pale pink fibrous stroma.
