lookFor:
  it: "Cerca le pareti vasali spesse e di un rosso intenso: il rosso Congo colora il deposito, mentre i nuclei restano azzurri."
  en: "Look for the thick, deep red vessel walls: Congo red stains the deposit, while the nuclei stay blue."
caption:
  it: >-
    Amiloidosi gastrica, rosso Congo a medio ingrandimento, in luce ordinaria. Parti dai vasi tagliati in sezione, al
    centro e in alto a destra: le pareti sono ispessite e di un rosso vivo, perché il deposito di amiloide ha preso il
    colorante. Il tessuto intorno è rosa pallido, con piccoli nuclei azzurri e alcuni adipociti vuoti. Questa immagine
    mostra dove sta il deposito; per riconoscerlo come amiloide serve la luce polarizzata, nella foto successiva.
  en: >-
    Gastric amyloidosis, Congo red at medium power, in ordinary light. Start with the vessels cut in cross section,
    at the center and upper right: their walls are thickened and bright red, because the amyloid deposit has taken up
    the dye. The surrounding tissue is pale pink, with small blue nuclei and a few empty fat cells. This view shows
    where the deposit sits; to recognize it as amyloid you need polarized light, shown in the next image.
alt:
  it: >-
    Micrografia con rosso Congo: tre vasi sanguigni con pareti spesse di colore rosso intenso, circondati da tessuto
    rosa chiaro con piccoli nuclei azzurri e alcuni spazi vuoti di cellule adipose.
  en: >-
    Congo red micrograph: three blood vessels with thick, intensely red walls, surrounded by pale pink tissue with
    small blue nuclei and a few empty fat-cell spaces.
