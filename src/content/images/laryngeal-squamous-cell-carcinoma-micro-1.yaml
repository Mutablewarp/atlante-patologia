lookFor:
  it: "Segui il contorno di ogni isola tumorale, poi guarda se è circondata da stroma fibroso e da infiltrato infiammatorio."
  en: "Trace the outline of each tumor island, then see whether it is surrounded by fibrous stroma and inflammatory cells."
caption:
  it: >-
    Carcinoma squamoso invasivo della laringe, moderatamente differenziato, a ingrandimento intermedio. Guarda prima le
    grandi isole e i cordoni di cellule tumorali pallide e violacee, che occupano il tessuto sottostante. Poi osserva lo
    stroma rosa tra le isole e le cellule infiammatorie scure, più fitte a destra. Infine guarda le singole cellule:
    nuclei grandi e irregolari.
  en: >-
    Invasive squamous cell carcinoma of the larynx, moderately differentiated, at intermediate magnification. Look first
    at the large islands and cords of pale purple tumor cells that fill the underlying tissue. Then note the pink stroma
    between the islands and the dark inflammatory cells, denser on the right. Finally look at single cells: large,
    irregular nuclei.
alt:
  it: >-
    Microfotografia H&E: isole di cellule epiteliali tumorali violacee separate da bande di stroma rosa con piccole
    cellule infiammatorie scure.
  en: >-
    H&E micrograph: islands of purple epithelial tumor cells separated by bands of pink stroma with small dark
    inflammatory cells.
