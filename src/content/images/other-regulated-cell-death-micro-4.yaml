caption:
  it: >-
    Entosi in un tumore umano, come appare su un vetrino di routine: carcinoma mammario invasivo ad alto grado,
    HER2-positivo, in ematossilina-eosina, osservato con l'obiettivo 10×. Guarda prima l'insieme: grandi cellule
    tumorali con nuclei tondi e scuri crescono in nidi e cordoni irregolari, separati da uno stroma pallido e lasso, e
    quasi tutte stanno l'una accanto all'altra. Dentro il cerchio giallo, tracciato dagli autori, una cellula rompe lo
    schema: è piccola e tonda, circondata da un alone chiaro e chiusa nel citoplasma di una vicina, il cui nucleo si
    piega attorno a lei. È una figura «cellula nella cellula», che gli autori classificano come entotica in base alla
    forma; passa all'ingrandimento forte della stessa struttura per controllarne i dettagli. Nell'entosi una cellula
    tumorale viva finisce intera dentro la vicina, che non è un fagocita professionale come il macrofago ma una comune
    cellula epiteliale: questa forma di cannibalismo cellulare si osserva soprattutto nei tumori. Si ritiene che a
    innescarla sia la perdita di ancoraggio alla matrice extracellulare, lo stesso stress che spinge altre cellule
    epiteliali verso l'anoikis; la cellula interna non viene ingoiata passivamente, ma si fa strada da sola. Una sezione
    fissata non può dire se la cellula interna fosse viva quando è entrata: sul vetrino, quindi, l'entosi resta una
    spiegazione proposta della figura, non una prova. In questo carcinoma gli autori hanno trovato le
    figure entotiche addensate nelle aree solide e poco differenziate, e nessuna dove il tumore formava ancora tubuli.
    Da ricordare: a piccolo ingrandimento cerca cellule tonde chiuse in un alone chiaro dentro una cellula più grande,
    poi confermale a ingrandimento forte.
  en: >-
    Entosis in a human tumour, as it looks on a routine slide: a high-grade, HER2-positive invasive breast carcinoma
    stained with H&E and seen with a 10× objective. First take in the field: large tumour cells with round, dark nuclei
    grow in irregular nests and cords separated by pale, loose stroma, and nearly all of them lie side by side. Inside
    the yellow circle, drawn by the authors, one cell breaks the pattern: it is small and round, ringed by a clear halo
    and enclosed in the cytoplasm of a neighbour whose nucleus bends around it. This is a cell-in-cell figure, which the
    authors count as entotic from its shape; switch to the high-power view of the same structure to check the details.
    In entosis a living tumour cell ends up whole inside its neighbour, an ordinary epithelial cell rather than a
    professional phagocyte such as a macrophage: this form of cell cannibalism is seen mainly in tumours. Its trigger is
    thought to be loss of anchorage to the extracellular matrix, the same stress that drives other epithelial cells into
    anoikis, and the inner cell is not swallowed passively but pushes its own way in. A fixed section cannot show
    whether the inner cell was alive when it went in, so on a slide entosis remains a proposed explanation for the
    figure, not a proven one. In this carcinoma the authors found entotic
    figures crowded in poorly differentiated, solid areas and none where the tumour still formed tubules. Key point: at
    low power, look for round cells inside a clear halo within a larger cell, then confirm them at high power.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento di un carcinoma mammario: numerose cellule con nuclei
    tondi e scuri disposte in nidi e cordoni irregolari, separati da stroma rosa pallido e lasso e da spazi bianchi. A
    sinistra del centro un cerchio giallo, presente nella figura pubblicata, racchiude una piccola cellula tonda con un
    alone chiaro, chiusa in una cellula vicina il cui nucleo le si curva attorno.
  en: >-
    H&E micrograph at low power of a breast carcinoma: many cells with dark round nuclei arranged in irregular nests and
    cords, separated by pale pink, loose stroma and white spaces. Left of centre a yellow circle, part of the published
    figure, surrounds a small round cell with a clear halo, enclosed in a neighbouring cell whose nucleus curves around
    it.
