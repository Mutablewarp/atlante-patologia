lookFor:
  it: "Confronta le ghiandole in alto, con cellule chiare e muco, con l'urotelio che riveste la superficie in basso a destra."
  en: "Compare the glands at the top, with pale mucus-filled cells, with the urothelium lining the surface at the lower right."
caption:
  it: >-
    Cistite ghiandolare di tipo intestinale, EE a medio ingrandimento. In alto, ghiandole rotonde e allungate sono
    rivestite da cellule alte e chiare, con muco nei lumi. In basso a destra, la superficie è rivestita da urotelio
    stratificato. La lamina propria tra le ghiandole contiene cellule infiammatorie.
  en: >-
    Cystitis glandularis, intestinal type, H&E at medium power. At the top, round and elongated glands are lined by
    tall, pale cells, with mucus in the lumens. At the lower right, the surface is covered by stratified urothelium. The
    lamina propria between the glands contains inflammatory cells.
alt:
  it: >-
    Micrografia a medio ingrandimento in ematossilina-eosina: ghiandole con cellule chiare piene di muco in alto,
    stroma rosa con cellule infiammatorie al centro e urotelio sulla superficie in basso a destra.
  en: >-
    Medium-power H&E micrograph: glands with pale mucus-filled cells at the top, pink stroma with inflammatory cells in
    the middle, and urothelium on the surface at the lower right.
