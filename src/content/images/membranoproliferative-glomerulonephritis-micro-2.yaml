lookFor:
  it: "Segui le pareti delle anse capillari nel gomitolo: sono spesse, e il gomitolo si divide in lobuli distinti?"
  en: "Follow the walls of the capillary loops inside the tuft: are they thick, and does the tuft split into distinct lobules?"
caption:
  it: >-
    Glomerulo in una biopsia renale, PAS a forte ingrandimento. Il gomitolo è diviso in lobuli separati da sottili
    spazi chiari e ha molte cellule. Le pareti dei capillari e la matrice mesangiale, in rosa intenso, sono ispessite
    e restringono i lumi. Il glomerulo è circondato da tessuto connettivo e da un infiltrato di cellule infiammatorie.
    Lobulazione e pareti ispessite sono i due reperti da cercare nella glomerulonefrite membranoproliferativa.
  en: >-
    Glomerulus in a kidney biopsy, PAS stain at high power. The tuft is split into lobules separated by thin clear
    spaces and is rich in cells. The capillary walls and the mesangial matrix, stained deep pink, are thickened and
    narrow the lumens. The glomerulus is ringed by connective tissue and an infiltrate of inflammatory cells.
    Lobulation and thickened walls are the two findings to look for in membranoproliferative glomerulonephritis.
alt:
  it: >-
    Micrografia PAS di un glomerulo suddiviso in lobuli rosa intenso con molti nuclei, circondato da tessuto
    connettivo pallido e da tubuli con lume chiaro; in basso a destra si vedono cellule infiammatorie.
  en: >-
    PAS micrograph of a glomerulus divided into deep pink lobules with many nuclei, ringed by pale connective tissue
    and tubules with clear lumens; inflammatory cells are visible at lower right.
