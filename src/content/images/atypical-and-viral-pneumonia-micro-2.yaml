lookFor:
  it: >-
    Cerca la cellula più grande, con un nucleo gonfio e un'inclusione scura circondata da un alone chiaro.
  en: >-
    Look for the largest cell, with a swollen nucleus and a dark inclusion surrounded by a clear halo.
caption:
  it: >-
    Infezione da citomegalovirus del polmone, EE ad alto ingrandimento. Al centro un pneumocita molto ingrandito ha un
    nucleo gonfio con una grande inclusione rosso-violacea circondata da un alone chiaro. Le cellule vicine sono molto
    più piccole e hanno nuclei di aspetto normale, quindi il confronto di dimensioni aiuta a riconoscere la cellula
    infetta.
  en: >-
    Cytomegalovirus infection of the lung, H&E at high power. In the center a greatly enlarged pneumocyte has a swollen
    nucleus with a large red-purple inclusion surrounded by a clear halo. The neighboring cells are much smaller and
    have normal-looking nuclei, so comparing sizes helps you spot the infected cell.
alt:
  it: >-
    Micrografia ad alto ingrandimento di polmone in ematossilina-eosina: una cellula ingrandita con un nucleo che
    contiene una grande inclusione scura e un alone chiaro, vicino a cellule più piccole e a globuli rossi sparsi.
  en: >-
    High-power H&E micrograph of lung: one enlarged cell with a nucleus holding a large dark inclusion and a clear halo,
    next to smaller cells and scattered red blood cells.
