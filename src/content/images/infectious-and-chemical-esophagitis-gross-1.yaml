group: candida-esophagitis-endoscopy
caption:
  it: >-
    Esofagite da Candida all'endoscopia. Guarda il lume scuro al centro e poi la parete intorno: la mucosa è coperta da
    placche e chiazze biancastre irregolari, in rilievo, con aree arrossate e un po' di sangue tra una placca e l'altra.
    È l'aspetto macroscopico tipico della candidosi, che il microscopio spiega con i lieviti e le pseudoife nel detrito
    squamoso.
  en: >-
    Candida esophagitis at endoscopy. Look at the dark lumen in the center, then at the wall around it: the mucosa is
    covered by irregular raised whitish plaques and patches, with reddened areas and a little blood between the
    plaques. This is the typical gross look of candidiasis, which the microscope explains with yeasts and
    pseudohyphae in squamous debris.
alt:
  it: >-
    Immagine endoscopica dell'esofago: lume scuro al centro, pareti coperte da placche biancastre irregolari con zone
    rosse e piccole tracce di sangue.
  en: >-
    Endoscopic view of the esophagus: a dark lumen in the center, with walls covered by irregular whitish plaques,
    red areas and small traces of blood.
