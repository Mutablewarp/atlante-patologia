caption:
  it: >-
    Anse intestinali esposte durante un intervento, per ischemia intestinale. Guarda il colore delle anse: alcune sono
    rosso-violacee e congeste, altre verdastre e opache, con la parete che ha perso la lucentezza normale. Il tratto
    colpito appare quindi disomogeneo, con segmenti a diverso grado di sofferenza. Le pinze e il drenaggio fanno parte
    del campo operatorio.
  en: >-
    Bowel loops exposed during an operation, in intestinal ischemia. Look at the color of the loops: some are
    purple-red and congested, others greenish and dull, with a wall that has lost its normal sheen. The affected
    stretch therefore looks uneven, with segments at different stages of injury. The clamps and the tube belong to the
    operating field.
alt:
  it: >-
    Fotografia intraoperatoria di anse di intestino tenue ammassate sull'addome: molte sono rosso scuro o violacee,
    altre verde-brunastre, con superficie umida e lucida; sullo sfondo si vedono pinze, un tubo e teli chirurgici.
  en: >-
    Intraoperative photograph of small-bowel loops piled on the abdomen: many are dark red or purplish, others
    greenish-brown, with a moist shiny surface; clamps, a tube and surgical drapes are visible in the background.
