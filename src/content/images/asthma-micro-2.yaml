lookFor:
  it: "Cerca i bastoncelli rosa, sottili e appuntiti, nel muco pallido e tra le cellule a citoplasma rosato."
  en: "Look for slender, pointed pink rods lying in the pale mucus and among the cells with pink cytoplasm."
caption:
  it: >-
    Essudato nel lume di un bronchio in un caso di asma, EE a forte ingrandimento. Il fondo rosa pallido e
    finemente vacuolato è muco. Al suo interno e a sinistra si vedono cellule con citoplasma rosa intenso e nuclei
    bilobati, compatibili con eosinofili. Tra le cellule e nel muco giacciono bastoncelli rosa, lunghi e appuntiti: sono
    i cristalli di Charcot-Leyden, derivati dagli eosinofili.
  en: >-
    Exudate in the lumen of a bronchus in a case of asthma, H&E at high power. The pale pink, finely vacuolated
    background is mucus. In it and at the left are cells with intense pink cytoplasm and bilobed nuclei, consistent with
    eosinophils. Between the cells and in the mucus lie long, pointed pink rods: these are Charcot-Leyden crystals,
    derived from eosinophils.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a sinistra un ammasso di cellule con citoplasma rosa e nuclei scuri, a destra
    muco rosa pallido con piccole vacuoli e alcuni bastoncelli rosa allungati e appuntiti.
  en: >-
    H&E micrograph: at the left a cluster of cells with pink cytoplasm and dark nuclei, at the right pale pink mucus
    with small vacuoles and several elongated, pointed pink rods.
