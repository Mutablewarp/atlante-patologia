lookFor:
  it: "Parti dal basso ingrandimento: due frustoli bioptici, da leggere solo per l'architettura, poi passa all'immagine successiva per il dotto."
  en: "Start at low power: two biopsy cores, read for architecture only, then go to the next image for the duct."
caption:
  it: >-
    Biopsia epatica in un paziente con colite ulcerosa e colangite sclerosante primitiva, EE a basso ingrandimento
    (barra 1 mm). Si vedono due frustoli sottili di parenchima epatico, con le frecce dell'autore su alcune aree da
    osservare. A questo ingrandimento non si riconosce il dotto: serve l'immagine ad ingrandimento maggiore.
  en: >-
    Liver biopsy in a patient with ulcerative colitis and primary sclerosing cholangitis, H&E at low power (1 mm bar).
    Two thin cores of liver parenchyma are visible, with the author's arrows on some areas to inspect. The duct cannot
    be recognized at this power: use the higher-power image.
alt:
  it: >-
    Micrografia a basso ingrandimento di due frustoli bioptici di fegato in ematossilina-eosina, di colore rosa-violaceo,
    con due frecce verdi sul frustolo di sinistra e una freccia nera su quello di destra; in basso una barra di scala
    di 1 mm.
  en: >-
    Low-power H&E micrograph of two pink-purple liver biopsy cores, with two green arrows on the left core and one black
    arrow on the right core; a 1 mm scale bar at the bottom.
