lookFor:
  it: "Guarda un nido alla volta: cerca i nuclei rotondi e uniformi, con cromatina a grani, e il citoplasma rosa tra loro."
  en: "Look at one nest at a time: find the round, uniform nuclei with granular chromatin and the pink cytoplasm around them."
caption:
  it: >-
    Tumore neuroendocrino dell'intestino tenue, alto ingrandimento, H&E. Le cellule formano nidi rotondi separati da
    sottili setti fibrosi. Le cellule hanno nuclei rotondi e uniformi, con cromatina a grani, e abbondante citoplasma
    rosa. In alcuni nidi le cellule si dispongono intorno a un piccolo centro chiaro.
  en: >-
    Small intestine neuroendocrine tumor, high power, H&E. The cells form round nests separated by thin fibrous septa.
    The cells have round, uniform nuclei with granular chromatin and abundant pink cytoplasm. In some nests the cells
    line up around a small pale center.
alt:
  it: >-
    Micrografia ad alto ingrandimento: nidi rotondi di cellule con nuclei uniformi e citoplasma rosa, separati da
    sottili setti rosa.
  en: >-
    High-power micrograph: round nests of cells with uniform nuclei and pink cytoplasm, separated by thin pink septa.
