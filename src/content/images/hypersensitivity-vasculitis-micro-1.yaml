lookFor:
  it: Parti dall'epidermide in alto, scendi nel derma superficiale e cerca gli addensamenti di piccole cellule scure intorno ai vasi.
  en: Start at the epidermis at the top, move down into the superficial dermis and look for clusters of small dark cells around the vessels.
caption:
  it: >-
    Cute, EE a basso ingrandimento. In alto c'è l'epidermide; sotto, il derma rosa con fasci di collagene. Gli addensamenti di piccole
    cellule scure intorno ai vasi, soprattutto nel derma superficiale e a sinistra, sono l'infiltrato infiammatorio attorno
    alle venule. È la panoramica della vasculite leucocitoclastica; i dettagli della parete vasale si vedono a maggior
    ingrandimento.
  en: >-
    Skin, H&E at low power. The epidermis is at the top, with the pink dermis and its collagen bundles below. Clusters of
    small dark cells around the vessels, mostly in the superficial dermis and to the left, are the inflammatory infiltrate
    around venules. This is the overview of leukocytoclastic vasculitis; the vessel wall detail is seen at higher power.
alt:
  it: >-
    Micrografia in ematossilina-eosina, formato verticale: epidermide viola in alto, derma rosa con fasci di collagene e
    gruppi di piccole cellule scure intorno ai vasi, tessuto adiposo in basso a sinistra.
  en: >-
    Vertical H&E micrograph: purple epidermis at the top, pink dermis with collagen bundles and groups of small dark
    cells around vessels, fat tissue at the lower left.
