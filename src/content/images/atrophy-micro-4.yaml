lookFor:
  it: "Scuro = tipo II, chiaro = tipo I. Trova le fibre scure piccole, poi osserva come quelle grandi e chiare si raggruppano."
  en: "Dark = type II, pale = type I. Find the small dark fibres, then notice how the large pale ones cluster together."
caption:
  it: >-
    La stessa biopsia con atrofia da denervazione, colorata per l'ATPasi miofibrillare a pH 9,4, una reazione
    enzimatica che si esegue su sezioni congelate non fissate, a medio ingrandimento. A questo pH le fibre di tipo I
    (lente) restano chiare e quelle di tipo II (rapide) diventano bruno-nere, per cui ogni fibra viene assegnata al suo
    tipo. Nel muscolo normale i due tipi sono mescolati a caso, a mosaico, e hanno calibro simile. Qui lo schema è
    alterato in due modi. Primo, le fibre scure sono per lo più piccole, schiacciate fra le grandi fibre chiare in file
    e piccoli gruppi: è l'atrofia a gruppi (group atrophy), il segno di fibre che hanno perso l'innervazione; la fonte
    precisa che in questa biopsia l'atrofia colpisce le fibre di tipo II. Secondo, le grandi fibre chiare stanno una
    accanto all'altra in ampie zone invece di alternarsi a quelle scure: è il raggruppamento per tipo di fibra (fiber
    type grouping), in cui tutte le fibre di un'area dipendono dallo stesso motoneurone superstite, i cui nuovi rami
    hanno raggiunto le fibre rimaste senza nervo e le hanno convertite al proprio tipo. Alcune fibre scure hanno invece
    un calibro normale o anche maggiore: il colore scuro indica il tipo di fibra, non l'atrofia. Attenzione: fibre di tipo II piccole e sparse, senza
    raggruppamento, sono il quadro dell'atrofia da disuso, della terapia cortisonica cronica, della cachessia o
    dell'invecchiamento, non della denervazione.
  en: >-
    The same denervation-atrophy biopsy stained for myofibrillar ATPase at pH 9.4, an enzyme reaction performed on
    unfixed frozen sections, intermediate power. At this pH type I (slow) fibres stay pale and type II (fast) fibres
    turn brown-black, so every fibre is sorted by type. In normal muscle the two types are mixed at random, like a
    mosaic, and have similar sizes. Here the pattern is altered in two ways. First, the dark fibres are mostly small,
    squeezed between the large pale fibres in rows and small clusters: this is group atrophy, the sign of fibres that
    have lost their nerve supply; the source states that in this biopsy the atrophy affects the type II fibres. Second,
    the large pale fibres lie next to one another in wide fields instead of alternating with dark ones: this is fibre
    type grouping, in which every fibre of a patch depends on the same surviving motor neuron, whose new branches
    reached the fibres that had lost their nerve and switched them to its own type. Some dark fibres, by contrast,
    have a normal or even larger size: the dark colour marks the fibre type, not atrophy. Pitfall: small type II fibres scattered without any grouping are the pattern of
    disuse, long-term corticosteroid therapy, cachexia or ageing, not of denervation.
alt:
  it: >-
    Micrografia in bianco, grigio e nero di muscolo tagliato di traverso: grandi fibre poligonali grigio chiaro
    accostate fra loro, con numerose piccole fibre nere disposte in file e gruppi negli spazi intermedi, alcune fibre
    nere più grandi e tonde, e setti bianchi di tessuto connettivo che attraversano il campo.
  en: >-
    Black, grey and white micrograph of muscle cut across: large pale grey polygonal fibres packed side by side, with
    many small black fibres in rows and clusters between them, a few larger round black fibres, and white
    connective-tissue septa crossing the field.
