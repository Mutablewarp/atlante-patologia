caption:
  it: >-
    Metaplasia squamosa cheratinizzante della vescica in una cistite cronica, EE a medio ingrandimento. Parti dalla
    superficie a sinistra: l'urotelio normale è sottile, fatto di pochi strati di cellule con nuclei scuri e
    affollati. Seguendo la superficie verso destra trovi un passaggio netto a un epitelio pavimentoso pluristratificato
    molto più spesso, rosa, con cellule poligonali a citoplasma ampio che si appiattiscono verso l'alto. Sopra si
    staccano lamelle di cheratina, ondulate e rosa scuro, come nella cute: la vescica non produce cheratina, quindi
    la loro presenza basta a dire che il tipo di epitelio è cambiato. Sotto, la lamina propria è pallida ed
    edematosa, con capillari congesti e cellule infiammatorie, segno dello stimolo cronico. Il messaggio chiave: il
    nuovo epitelio è un tessuto adulto normale nel posto sbagliato, senza atipie. Protegge dall'irritazione, ma su
    questo terreno può insorgere un carcinoma squamoso.
  en: >-
    Keratinising squamous metaplasia of the urinary bladder in chronic cystitis, H&E at intermediate power. Start at
    the surface on the left: the normal urothelium is thin, a few layers of cells with dark, crowded nuclei. Follow
    the surface to the right and you meet a sharp switch to a much thicker, pink, stratified squamous epithelium,
    with polygonal cells and ample cytoplasm that flatten towards the top. Above it, wavy dark-pink flakes of
    keratin peel away, as in skin: the bladder does not make keratin, so their presence alone tells you the type of
    epithelium has changed. Beneath, the lamina propria is pale and oedematous, with congested capillaries and
    inflammatory cells, a sign of the chronic stimulus. Key message: the new epithelium is normal adult tissue in the
    wrong place, without atypia. It resists irritation, but squamous cell carcinoma can arise on this ground.
alt:
  it: >-
    Micrografia in ematossilina-eosina di parete vescicale: a sinistra un epitelio sottile e viola scuro; da metà
    immagine verso destra un epitelio rosa molto più spesso, sormontato da sottili lamelle ondulate rosa scuro; sotto,
    un tessuto connettivo pallido con piccoli vasi rossi.
  en: >-
    H&E micrograph of bladder wall: on the left a thin, dark-purple epithelium; from the middle of the image to the
    right a much thicker pink epithelium topped by thin, wavy dark-pink flakes; below, pale connective tissue with
    small red vessels.
