lookFor:
  it: "Confronta la mucosa liscia con le masse a frange: ogni tumore è fatto da sottili propaggini papillari che sporgono nel lume."
  en: "Compare the smooth mucosa with the frond-like masses: each tumor is made of thin papillary projections that stick out into the lumen."
caption:
  it: >-
    Carcinoma uroteliale papillare della vescica, preparato macroscopico con la vescica aperta. Tre masse esofitiche
    pallide, formate da sottili frange simili a coralli, sporgono dalla mucosa; la restante parete è liscia. La
    barra in basso a sinistra misura 1 cm.
  en: >-
    Papillary urothelial carcinoma of the bladder, gross specimen with the bladder opened. Three pale exophytic
    masses made of thin, coral-like fronds project from the mucosa; the rest of the wall is smooth. The bar at lower
    left is 1 cm.
alt:
  it: >-
    Vescica aperta su fondo nero: tre masse color crema, a frange fitte e sottili, sporgono dalla superficie interna
    liscia e rosata; in basso a sinistra una barra di scala da 1 cm.
  en: >-
    Opened bladder on a black background: three cream-colored masses of dense, thin fronds project from the smooth
    pink inner surface; a 1 cm scale bar at lower left.
