caption:
  it: >-
    Biopsia renale: glomeruli con necrosi fibrinoide segmentale in una glomerulonefrite pauci-immune necrotizzante da
    ANCA anti-MPO, scatenata dall'idralazina. A sinistra ematossilina-eosina, a destra colorazione tricromica dello
    stesso tipo di lesione. Primo passo: in ciascun pannello trova il glomerulo, il gomitolo rotondo di anse capillari
    dentro lo spazio di Bowman, circondato dai tubuli. Poi segui la freccia gialla: in un segmento del gomitolo le anse
    sottili e le loro cellule non si riconoscono più e al loro posto c'è una massa vitrea, omogenea, intensamente
    eosinofila, dai contorni sfumati (a sinistra). Con la tricromica lo stesso segmento si colora di rosso vivo, il
    colore che la fibrina assume con questa colorazione, mentre il collagene della capsula di Bowman e dell'interstizio
    è blu e le anse risparmiate, sul lato destro del gomitolo, mantengono il lume aperto. Come leggerla: la necrosi
    fibrinoide non è un modo diverso di morire ma un aspetto morfologico. La parete capillare danneggiata lascia uscire
    le proteine del plasma, la fibrina precipita nella parete insieme ai detriti cellulari e il tutto assomiglia alla
    fibrina. Il segno da cercare è una chiazza rosa brillante e vitrea nella parete di un vaso o nel gomitolo, che diventa
    rossa con la tricromica. Collegamento clinico: dalle anse necrotiche il sangue e la fibrina passano nello spazio di
    Bowman e stimolano la formazione di semilune; il quadro clinico è quello di una glomerulonefrite rapidamente
    progressiva.
  en: >-
    Renal biopsy: glomeruli with segmental fibrinoid necrosis in pauci-immune necrotising glomerulonephritis due to
    anti-MPO ANCA, triggered by hydralazine. H&E on the left, trichrome stain of the same kind of lesion on the right.
    First step: in each panel find the glomerulus, the round tuft of capillary loops inside Bowman's space, surrounded by
    tubules. Then follow the yellow arrow: in one segment of the tuft the thin loops and their cells can no longer be
    made out, and in their place lies a glassy, homogeneous, intensely eosinophilic mass with blurred edges (left). On
    trichrome the same segment stains bright red, the colour fibrin takes with this stain, while the collagen of
    Bowman's capsule and the interstitium is blue and the spared loops on the right side of the tuft keep open lumens.
    How to read it: fibrinoid necrosis is not a separate way of dying but a morphological pattern. The damaged capillary
    wall lets plasma proteins out, fibrin precipitates in the wall together with cell debris, and the result looks like
    fibrin. The cue to look for is a bright pink, glassy smudge in a vessel wall or in the tuft that turns red on
    trichrome. Clinical link: blood and fibrin escape from the necrotic loops into Bowman's space and drive crescent
    formation; clinically this is rapidly progressive glomerulonephritis.
alt:
  it: >-
    Due micrografie affiancate di glomeruli renali. A sinistra, in ematossilina-eosina, una freccia
    gialla indica un segmento del gomitolo sostituito da materiale rosa intenso, omogeneo e senza cellule
    riconoscibili; il resto del gomitolo e i tubuli circostanti sono rosa più chiaro con nuclei viola. A destra, in
    tricromica, la freccia indica lo stesso tipo di area colorata in rosso vivo, circondata da collagene blu della
    capsula e dell'interstizio.
  en: >-
    Two side-by-side micrographs of renal glomeruli. On the left, in H&E, a yellow arrow points to a
    segment of the tuft replaced by intensely pink, homogeneous material without recognisable cells; the rest of the
    tuft and the surrounding tubules are lighter pink with purple nuclei. On the right, in trichrome, the arrow points to
    the same kind of area stained bright red, surrounded by blue collagen of the capsule and interstitium.
