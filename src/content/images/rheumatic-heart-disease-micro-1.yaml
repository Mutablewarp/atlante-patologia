    image.
caption:
  it: >-
    Miocardio in cardite reumatica, EE ad alto ingrandimento. Le fibre muscolari rosa corrono in senso longitudinale.
    Tra le fibre, nella parte centrale bassa, si vede un piccolo focus di cellule con nuclei scuri, immerso in un
    materiale pallido e fibrillare: è la sede di un nodulo di Aschoff, con cellule istiocitarie di Anitschkow.
  en: >-
    Myocardium in rheumatic carditis, H&E at high power. The pink muscle fibers run lengthwise. Between them, in the
    lower middle, sits a small focus of cells with dark nuclei in a pale, fibrillar material: this is the site of an
    Aschoff body, with histiocyte-like Anitschkow cells.
alt:
  it: >-
    Micrografia di miocardio in ematossilina-eosina: fasci paralleli di fibre muscolari rosa intenso con nuclei
    sparsi; al centro in basso un piccolo agglomerato allungato di cellule con nuclei scuri in uno stroma chiaro e
    vaporoso.
  en: >-
    H&E micrograph of myocardium: parallel bundles of bright pink muscle fibers with scattered nuclei; in the lower
    middle a small elongated cluster of cells with dark nuclei in a pale, wispy stroma.
