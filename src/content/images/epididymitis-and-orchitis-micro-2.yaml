lookFor:
  it: "Parti dall'area pallida e granulare in alto, poi cerca le cellule epitelioidi e le cellule giganti viola sul bordo."
  en: "Start with the pale granular area at the top, then find the epithelioid cells and the purple giant cells at the edge."
caption:
  it: >-
    Tubercolosi dell'epididimo, alto ingrandimento. Parti dall'alto: l'area rosa pallida e granulare è necrosi
    caseosa, senza contorni cellulari distinguibili. Sotto, le cellule epitelioidi formano una fascia di nuclei allungati
    che circonda la necrosi. Ai lati compaiono cellule giganti multinucleate, viola. È il granuloma caseoso, il
    reperto che distingue l'epididimite tubercolare dalle forme non caseose.
  en: >-
    Tuberculosis of the epididymis, high power. Start at the top: the pale pink granular area is caseous necrosis, with
    no distinguishable cell outlines. Below it, epithelioid cells form a band of elongated nuclei around the necrosis.
    At the sides, purple multinucleated giant cells appear. This is the caseating granuloma, the finding that sets
    tuberculous epididymitis apart from the noncaseating forms.
alt:
  it: >-
    Micrografia: in alto un'area rosa pallida e granulare; sotto, molte cellule con nuclei allungati scuri e due grandi
    cellule giganti viola ai lati.
  en: >-
    Micrograph: a pale pink granular area at the top; below it, many cells with dark elongated nuclei and two large
    purple giant cells at the sides.
