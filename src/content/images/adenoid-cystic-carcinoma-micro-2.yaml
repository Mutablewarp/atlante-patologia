lookFor:
  it: "Osserva i nuclei piccoli e scuri delle cellule tumorali attorno agli spazi e la pallida sostanza al loro interno."
  en: "Look at the small dark nuclei of the tumor cells around the spaces and the pale material inside them."
caption:
  it: >-
    Stessa lesione, EE ad alto ingrandimento. Le cellule tumorali hanno nuclei piccoli, scuri e poco citoplasma, e
    formano nidi attorno a spazi che contengono materiale pallido a bolle. A sinistra restano acini sierosi normali tra
    cellule adipose, utili per confrontare le dimensioni dei nuclei.
  en: >-
    Same lesion, H&E at high power. The tumor cells have small dark nuclei and scant cytoplasm, and form nests around
    spaces that contain pale, bubbly material. On the left, normal serous acini remain among fat cells, a useful
    comparison for nuclear size.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: nidi di cellule con piccoli nuclei scuri attorno a spazi
    ovali che contengono materiale pallido a bolle; a sinistra acini normali e cellule adipose vuote.
  en: >-
    High-power H&E micrograph: nests of cells with small dark nuclei around oval spaces that contain pale, bubbly
    material; on the left, normal acini and empty-looking fat cells.
