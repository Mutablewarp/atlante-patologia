lookFor:
  it: >-
    Guarda se le ghiandole sono distribuite in modo regolare e quanto è fitto l'infiltrato di cellule tra l'una e
    l'altra.
  en: >-
    Check whether the glands are evenly spaced and how dense the cell infiltrate is between them.
caption:
  it: >-
    Biopsia di colon in colite ulcerosa attiva, EE a basso ingrandimento. Parti dal quadro d'insieme: la mucosa è
    affollata da piccole cellule infiammatorie che separano le ghiandole e le allontanano tra loro. Le ghiandole hanno
    forma e calibro irregolari invece di allinearsi in file parallele. Un lume al centro in basso è pieno di cellule
    infiammatorie, un ascesso criptico. L'ingrandimento maggiore della stessa lesione è nella foto successiva.
  en: >-
    Colon biopsy in active ulcerative colitis, H&E at low power. Start with the overall picture: the mucosa is crowded
    with small inflammatory cells that separate the glands and push them apart. The glands vary in shape and caliber
    instead of lining up in parallel rows. One lumen at lower center is filled with inflammatory cells, a crypt
    abscess. The higher-power view of the same lesion is the next image.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina di un frammento bioptico di colon: ghiandole irregolari
    immerse in un fondo violaceo fitto di cellule infiammatorie, con un lume ghiandolare pieno di cellule.
  en: >-
    Low-power H&E micrograph of a colon biopsy fragment: irregular glands set in a dense purple background of
    inflammatory cells, with one gland lumen filled with cells.
