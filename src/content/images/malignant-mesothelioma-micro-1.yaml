lookFor:
  it: "Parti dal bordo superiore, dove la superficie pleurica è ispessita, poi segui il tumore verso il basso nel polmone."
  en: "Start at the top edge, where the pleural surface is thickened, then follow the tumor downward into the lung."
caption:
  it: >-
    Mesotelioma maligno epiteliale, EE a basso ingrandimento. Parti dal margine superiore, la superficie pleurica, che
    appare ispessita e rosa. Sotto di essa il tumore forma tubuli e papille che si insinuano nel parenchima polmonare
    sottostante. Più in basso gli alveoli sono conservati, con qualche deposito scuro di pigmento antracotico.
  en: >-
    Epithelioid malignant mesothelioma, H&E at low power. Start at the top edge, the pleural surface, which looks
    thickened and pink. Beneath it the tumor forms tubules and papillae that extend into the underlying lung tissue.
    Further down the alveoli are preserved, with a few dark flecks of anthracotic pigment.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: una fascia rosa ispessita lungo il margine superiore con
    strutture tubulari di cellule violacee, e sotto di essa tessuto polmonare con alveoli e piccoli granuli neri.
  en: >-
    Low-power H&E micrograph: a thickened pink band along the top edge with tubular structures of purple cells, and
    below it lung tissue with alveoli and a few small black granules.
