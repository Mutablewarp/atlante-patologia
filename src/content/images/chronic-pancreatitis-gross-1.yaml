lookFor:
  it: "Guarda la superficie di taglio della testa del pancreas: il tessuto biancastro e compatto, con cavità dilatate e materiale granuloso giallo-biancastro al posto del parenchima lobulare."
  en: "Look at the cut surface of the pancreatic head: the pale, firm tissue with dilated cavities and yellow-white granular material in place of lobulated parenchyma."
caption:
  it: >-
    Pezzo operatorio fissato di pancreatite cronica con calcoli, in sezione: la testa del pancreas, accanto al duodeno,
    è indurita e biancastra. Vi si vedono una cavità dilatata e piccoli depositi granulosi giallo-biancastri nei dotti.
  en: >-
    Fixed surgical specimen of chronic pancreatitis with stones, cut open: the pancreatic head, beside the duodenum, is
    hardened and pale. A dilated cavity and small yellow-white granular deposits in the ducts are visible.
alt:
  it: >-
    Fotografia di un pezzo operatorio in un contenitore trasparente con l'etichetta "650 PANCREAS": a sinistra una massa
    ovale brunastra con una cavità centrale e chiazze giallo-biancastre, a destra un tratto di intestino con pieghe.
  en: >-
    Photograph of a surgical specimen in a clear container labeled "650 PANCREAS": on the left an oval brownish mass
    with a central cavity and yellow-white patches, on the right a segment of bowel with folds.
