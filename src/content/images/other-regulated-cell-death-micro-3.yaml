caption:
  it: >-
    Entosi in diretta: due sequenze time-lapse di cellule tumorali umane in coltura, carcinoma mammario MCF7 (a, con il
    DNA colorato in blu) e carcinoma del colon HCT116 (b); il tempo è indicato in ore:minuti. In ogni fotogramma il
    tratteggio bianco delimita la cellula 1, quella che entra, e il tratteggio giallo la cellula 2, quella che la
    accoglie. Segui la riga a da sinistra a destra: la cellula 1 è appiattita e aderente come le vicine; entrando in
    mitosi si arrotonda e si stacca dal fondo (03:28); poi una delle cellule figlie si infila dentro la cellula 2
    (04:00) e alla fine (13:20) ci si ritrova una cellula intera, rotonda, chiusa in un vacuolo dentro il citoplasma
    della vicina, mentre l'altra figlia è rimasta fuori. Nella riga b succede lo stesso, ma la cellula 1 si divide
    mentre viene inglobata e alla fine entrambe le figlie sono dentro la cellula ospite. Questa immagine di «cellula
    nella cellula» è il segno dell'entosi: a differenza della fagocitosi di un corpo apoptotico, la cellula interna è
    viva quando entra ed è lei stessa a spingersi dentro, grazie alla contrazione del proprio citoscheletro di
    actomiosina (via RhoA–ROCK). Il fattore scatenante classico è la perdita di adesione alla matrice, la stessa
    situazione che in altre cellule porta all'anoikis; qui il distacco è dato dall'arrotondamento della mitosi. Il
    destino più frequente della cellula interna è la morte, digerita dai lisosomi della cellula ospite; meno spesso
    viene rilasciata o sopravvive. Da ricordare: strutture cellula-nella-cellula si vedono nei carcinomi umani, per
    esempio della mammella; non confonderle con l'emperipolesi, in cui un leucocita attraversa un'altra cellula senza
    essere ucciso.
  en: >-
    Entosis live: two time-lapse sequences of cultured human cancer cells, MCF7 breast carcinoma (a, with DNA stained
    blue) and HCT116 colon carcinoma (b); time is shown as hours:minutes. In every frame the white dashed line outlines
    cell 1, the one that goes in, and the yellow dashed line cell 2, the one that takes it in. Follow row a from left
    to right: cell 1 is flat and attached like its neighbours; as it enters mitosis it rounds up and lifts off the
    surface (03:28); then one daughter cell pushes into cell 2 (04:00) and at the end (13:20) a whole, round cell lies
    in a vacuole inside its neighbour's cytoplasm, while the other daughter has stayed outside. Row b shows the same,
    but cell 1 divides while it is being taken in and both daughters end up inside the host cell. This "cell-in-cell"
    picture is the hallmark of entosis: unlike phagocytosis of an apoptotic body, the inner cell is alive when it
    enters and drives itself in by contracting its own actomyosin cytoskeleton (RhoA–ROCK pathway). The classic
    trigger is loss of attachment to the matrix, the same situation that drives other cells into anoikis; here the
    detachment comes from mitotic rounding. The commonest fate of the inner cell is death, digested by the host cell's
    lysosomes; less often it is released or survives. Key point: cell-in-cell structures are seen in human carcinomas,
    for example of the breast; do not confuse them with emperipolesis, in which a leukocyte passes through another
    cell without being killed.
alt:
  it: >-
    Due righe di quattro fotogrammi in microscopia a contrasto interferenziale. Riga a (MCF7): cellule grigie con
    nuclei blu; una cellula contornata da un tratteggio bianco, numerata 1, si arrotonda e penetra in una cellula vicina
    contornata in giallo, numerata 2, finché nell'ultimo fotogramma (13:20) appare come una sfera chiusa dentro la
    cellula 2. Riga b (HCT116): senza colorazione blu, una cellula numerata 1 si arrotonda, si divide in due e
    nell'ultimo fotogramma (04:24) le due cellule figlie stanno dentro la grande cellula 2 tratteggiata in giallo.
  en: >-
    Two rows of four differential interference contrast frames. Row a (MCF7): grey cells with blue nuclei; a cell
    outlined by a white dashed line and numbered 1 rounds up and pushes into a neighbouring cell outlined in yellow and
    numbered 2, until in the last frame (13:20) it appears as a sphere enclosed inside cell 2. Row b (HCT116): without
    blue stain, a cell numbered 1 rounds up, splits in two and in the last frame (04:24) both daughter cells lie inside
    the large cell 2 outlined in yellow.
