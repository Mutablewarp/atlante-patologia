lookFor:
  it: "Cerca le cellule giganti con citoplasma blu-grigio striato come carta stropicciata e un nucleo piccolo, spostato di lato."
  en: "Find the giant cells with blue-grey cytoplasm streaked like crumpled paper and a small, off-centre nucleus."
caption:
  it: >-
    Striscio di aspirato midollare di un bambino con malattia di Gaucher, colorazione May-Grünwald Giemsa, forte
    ingrandimento (×100 nella fonte). In uno striscio non c'è un'architettura da leggere: si cercano le singole cellule
    che non dovrebbero esserci. Parti dallo sfondo: i numerosi dischetti rotondi grigio-rosati sono globuli rossi, le
    cellule più piccole con nucleo viola scuro sono comuni cellule del midollo. Ora trova i due giganti, uno in alto a
    sinistra e uno in basso al centro: ciascuno è largo parecchie volte un globulo rosso e ha un ampio citoplasma
    blu-grigio percorso da sottili striature ondulate, come carta velina stropicciata e poi lisciata; in quello in alto
    il piccolo nucleo sta in disparte, sul margine in alto a destra. Sono cellule di Gaucher: macrofagi con i lisosomi
    pieni di glucocerebroside (glucosilceramide), il lipide che non riescono a demolire perché è carente la
    β-glucocerebrosidasi, l'enzima lisosomiale che lo scinde. Gran parte di quel lipide viene dalle membrane dei globuli
    bianchi invecchiati che i macrofagi hanno inglobato. Queste cellule si raccolgono in organi come la milza e il
    midollo osseo, e la milza è ingrandita quasi in ogni paziente. Lo striscio orienta, ma la diagnosi si conferma
    misurando l'attività dell'enzima, che in questo paziente era bassa. Trappola d'esame: l'indizio è il citoplasma
    striato; il macrofago schiumoso pieno di piccole bolle tutte uguali è un'altra cellula da accumulo (malattia di
    Niemann-Pick).
  en: >-
    Bone marrow aspirate smear from a child with Gaucher disease, May-Grünwald Giemsa stain, high power (×100 in the
    source). A smear has no architecture to read: you search for single cells that should not be there. Start from the
    background: the many small, round, pink-grey discs are red blood cells, and the smaller cells with dark purple
    nuclei are ordinary marrow cells. Now find the two giants, one at upper left and one at lower centre: each is several
    times wider than a red cell and has a broad blue-grey cytoplasm streaked by fine wavy lines, like tissue paper that
    has been crumpled and smoothed out again; in the upper one the small nucleus sits apart, at the upper right edge.
    These are Gaucher cells: macrophages whose lysosomes are packed with glucocerebroside (glucosylceramide), the lipid
    they cannot break down because β-glucocerebrosidase, the lysosomal enzyme that splits it, is deficient. Most of
    that lipid comes from the membranes of worn-out white blood cells that the macrophages have engulfed. These cells
    collect in organs such as the spleen and the bone marrow, and the spleen is enlarged in almost every patient. The smear
    points the way, but the diagnosis is confirmed by measuring the enzyme's activity, which was low in this patient.
    Exam trap: the streaked cytoplasm is the clue; a foamy macrophage full of small, even bubbles is a different
    storage cell (Niemann–Pick disease).
alt:
  it: >-
    Striscio di midollo osseo in tonalità viola e azzurre: molti globuli rossi grigio-rosati e piccole cellule viola
    scuro; due cellule molto grandi, in alto a sinistra e in basso al centro, hanno un abbondante citoplasma blu-grigio
    dalla trama sottile, striata e grinzosa; quella in alto ha un piccolo nucleo viola sul margine in alto a destra.
  en: >-
    Bone marrow smear in purple and blue tones: many pink-grey red blood cells and small dark purple cells; two very
    large cells, at upper left and lower centre, have abundant blue-grey cytoplasm with a fine, streaked, wrinkled
    texture; the upper one has a small purple nucleus at its upper right edge.
