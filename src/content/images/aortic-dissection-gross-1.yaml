orientation:
  it: "Aorta aperta all'autopsia, vista ravvicinata dall'interno con la parete divaricata"
  en: "Aorta opened at autopsy, close-up view from the inside with the wall spread apart"
lookFor:
  it: "Segui la linea dall'asterisco fino alla zona giallastra e irregolare della parete aperta: è il punto da osservare."
  en: "Follow the line from the asterisk to the yellowish, irregular area of the opened wall: that is the spot to examine."
caption:
  it: >-
    Aorta di un caso di dissezione di tipo Stanford A, aperta all'autopsia. Osserva la parete spessa e divaricata e,
    indicata dall'asterisco, la zona giallastra e sfrangiata lungo il margine aperto. Le mani con i guanti gialli e
    la pinza servono a tenere aperto il preparato.
  en: >-
    Aorta from a case of Stanford type A dissection, opened at autopsy. Note the thick wall spread apart and, marked
    by the asterisk, the yellowish, ragged area along the opened edge. The hands in yellow gloves and the forceps hold
    the specimen open.
alt:
  it: >-
    Fotografia ravvicinata di un'aorta aperta: la parete rosea e spessa è divaricata, lungo il margine si vede una
    striscia giallastra irregolare indicata da una linea nera con un asterisco; ai lati mani con guanti gialli e una pinza.
  en: >-
    Close-up photograph of an opened aorta: the thick pink wall is spread apart, and along the edge a ragged yellowish
    strip is marked by a black line ending in an asterisk; at the sides are hands in yellow gloves and a forceps.
