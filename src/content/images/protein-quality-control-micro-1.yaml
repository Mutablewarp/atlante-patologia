caption:
  it: >-
    Inclusioni ubiquitinate nel cervello, immunoistochimica per l'ubiquitina (marrone) con controcolorazione
    all'ematossilina (blu); tre pannelli da un caso familiare di degenerazione lobare frontotemporale con inclusioni
    ubiquitina-positive (FTLD-U). Prima di cercare il marrone, ricorda il principio: l'ubiquitina è l'etichetta che la
    cellula attacca alle proteine da distruggere nel proteasoma. Se l'etichetta si accumula in ammassi visibili al
    microscopio, vuol dire che le proteine marcate non sono state smaltite e si sono aggregate. Pannello a (corteccia
    superficiale): su un fondo rosa chiaro con nuclei blu spiccano molti filamenti marroni spessi e tortuosi (neuriti
    distrofici) e alcune inclusioni compatte nel citoplasma dei neuroni, accanto al nucleo. Pannello b (giro dentato
    dell'ippocampo): tra i fitti nuclei rotondi dei granuli, alcune cellule hanno un piccolo granulo marrone o una
    falce nel citoplasma. Pannello c (corteccia): le frecce indicano inclusioni dentro il nucleo, allungate a lente;
    il riquadro ne mostra una a forte ingrandimento. Nella maggior parte dei casi di FTLD-U la proteina ubiquitinata
    è stata poi identificata nella TDP-43. Lo stesso principio vale per i corpi di Lewy (alfa-sinucleina) e per i
    corpi di Mallory-Denk (cheratine).
  en: >-
    Ubiquitinated inclusions in the brain, immunohistochemistry for ubiquitin (brown) with a haematoxylin counterstain
    (blue); three panels from a familial case of frontotemporal lobar degeneration with ubiquitin-positive inclusions
    (FTLD-U). Before you look for brown, recall the principle: ubiquitin is the tag the cell attaches to proteins
    meant for destruction in the proteasome. When the tag piles up in clumps you can see with a microscope, the tagged
    proteins were not cleared and have aggregated instead. Panel a (superficial cortex): on a pale pink background
    with blue nuclei, many thick, twisted brown threads stand out (dystrophic neurites), together with a few compact
    inclusions in the cytoplasm of neurons, next to the nucleus. Panel b (dentate gyrus of the hippocampus): among the
    crowded round nuclei of the granule cells, some cells carry a small brown dot or crescent in the cytoplasm. Panel c
    (cortex): the arrows point to inclusions inside the nucleus, elongated like a lens; the inset shows one at high
    power. In most FTLD-U cases the ubiquitinated protein was later identified as TDP-43. The same principle applies to
    Lewy bodies (alpha-synuclein) and Mallory-Denk bodies (keratins).
alt:
  it: >-
    Figura in tre pannelli sovrapposti, a, b e c, di tessuto cerebrale colorato in marrone per l'ubiquitina su fondo
    rosa chiaro con nuclei blu. In a molti filamenti marroni tortuosi e qualche ammasso marrone nel citoplasma dei
    neuroni; in b piccoli granuli marroni accanto ai nuclei rotondi di cellule fitte; in c due frecce nere indicano
    nuclei che contengono un corpo marrone allungato, ingrandito in un riquadro in basso a destra.
  en: >-
    Three stacked panels, a, b and c, of brain tissue stained brown for ubiquitin on a pale pink background with blue
    nuclei. Panel a shows many twisted brown threads and a few brown clumps in neuronal cytoplasm; panel b shows small
    brown dots beside the round nuclei of densely packed cells; in panel c two black arrows point to nuclei that
    contain an elongated brown body, enlarged in an inset at the lower right.
