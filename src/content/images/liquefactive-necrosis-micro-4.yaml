lookFor:
  it: "Cerca le cellule tonde con il citoplasma pieno di granuli brunastri e un piccolo nucleo scuro spinto da un lato: sono macrofagi."
  en: "Look for round cells whose cytoplasm is full of brownish granules, with a small dark nucleus pushed to one side: these are macrophages."
caption:
  it: >-
    Infarto cerebrale ischemico in organizzazione, EE a forte ingrandimento. In questo campo non resta cervello
    normale: né neuroni né neuropilo rosa e compatto, solo ammassi di detriti rosa pallido, finemente granulosi (il
    tessuto morto), separati da spazi vuoti. Tra i detriti ci sono molte cellule tonde e voluminose. Osservane una da
    vicino: il citoplasma è ampio e pieno di granuli fini, con una lieve sfumatura brunastra, e il piccolo nucleo scuro
    sta di lato, spinto in periferia. Sono macrofagi che hanno inglobato i resti del tessuto morto: grassi (nel
    cervello vengono soprattutto dalla mielina degradata) e il pigmento ferroso emosiderina, che deriva dai globuli
    rossi distrutti. Nel cervello si chiamano anche cellule granulo-adipose o cellule di Gitter. In alto a destra un
    piccolo vaso contiene ancora globuli rossi. I tempi: nell'infarto cerebrale arrivano prima i neutrofili, ma dal
    terzo-quarto giorno prevalgono i macrofagi, che portano via il tessuto morto con grande lentezza, per settimane o
    mesi, finché al posto dell'infarto resta una cisti. Con le colorazioni speciali i macrofagi risaltano
    all'immunoistochimica per CD68, e il ferro che contengono si colora di blu con il Perls (blu di Prussia). È la
    fase di sgombero della necrosi colliquativa: il tessuto non è solo morto, ma viene portato via.
  en: >-
    Organizing ischemic infarct of the brain, H&E at high power. No normal brain is left in this field: no neurons, no
    compact pink neuropil, only clumps of pale pink, finely granular debris (the dead tissue) separated by empty
    spaces. Among the debris lie many round, plump cells. Look at one closely: the cytoplasm is wide and packed with
    fine granules with a slight brownish tinge, and the small dark nucleus sits off-centre, pushed to the edge. These
    are macrophages that have swallowed the remains of the dead tissue: fat (in the brain it comes mostly from
    broken-down myelin) and the iron pigment hemosiderin, which comes from destroyed red cells. In the brain they are
    also called gitter cells. At the top right, a small vessel still holds red cells. The timing: in a brain infarct
    neutrophils come first, but from about the third or fourth day macrophages dominate, and they remove the dead
    tissue very slowly, for weeks or months, until a cyst is left where the infarct was. With special stains the
    macrophages stand out on immunohistochemistry for CD68, and the iron they hold turns blue with Perls (Prussian
    blue). This is the clearing phase of liquefactive necrosis: the tissue is not only dead, it is being carried
    away.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento: su uno sfondo chiaro, ammassi di materiale rosa pallido
    e granuloso e molte cellule tonde con citoplasma granuloso, lievemente brunastro, e un piccolo nucleo scuro su un
    lato; in alto a destra un piccolo vaso con globuli rossi di un rosso vivo.
  en: >-
    High-power H&E micrograph: on a pale background, clumps of pale pink granular material and many round cells with
    granular, slightly brownish cytoplasm and a small dark nucleus at one side; at the top right, a small vessel with
    bright red blood cells.
