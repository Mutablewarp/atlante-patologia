lookFor:
  it: "Cerca il nero: ogni fiamma nera nel corpo di un neurone è un groviglio neurofibrillare; il rosa-rosso della controcolorazione mostra solo nuclei e cellule."
  en: "Look for black: each black flame in a neuron's cell body is a neurofibrillary tangle; the pink-red counterstain only shows nuclei and cells."
caption:
  it: >-
    Ippocampo di una persona anziana con alterazioni di tipo Alzheimer (descrizione della fonte), impregnazione
    argentica secondo Gallyas, forte ingrandimento. Con questo metodo il fondo resta quasi incolore, la
    controcolorazione tinge di rosa-rosso nuclei e corpi cellulari e i filamenti anomali di tau diventano neri. Percorri
    il campo cercando il nero: diversi neuroni contengono nel corpo cellulare una massa nera densa, finemente
    fibrillare, spesso allungata come una fiamma che segue la forma della cellula fino al dendrite principale. Sono
    grovigli neurofibrillari. Il materiale nero è tau assemblata in filamenti elicoidali appaiati; ci è arrivata
    staccandosi dai microtubuli, che normalmente aiuta a stabilizzare, dopo essere stata fosforilata in modo anomalo. Un
    groviglio è quindi un aggregato intracellulare di una proteina mal ripiegata: lo stesso tipo di lesione di un corpo
    di Lewy, ma fatto di un'altra proteina. L'argento mostra che un aggregato c'è, non di quale proteina è fatto: anche
    le placche di β-amiloide sono argentofile. I grovigli compaiono presto: molto prima dell'età in cui di solito
    esordisce la malattia di Alzheimer, persone senza sintomi possono già averli nel giro paraippocampale e nella
    corteccia entorinale, accanto all'ippocampo, e quanto si sono estesi corrisponde alla gravità della demenza. Non
    sono specifici della malattia di Alzheimer. Con il selettore vedi la stessa serie didattica colorata per la tau con
    l'immunoistochimica.
  en: >-
    Hippocampus of an elderly person with Alzheimer-type changes (the source's description), Gallyas silver
    impregnation, high power. In this method the background stays almost colourless, the counterstain colours nuclei and
    cell bodies pink-red, and abnormal tau filaments turn black. Scan the field for black: several neurons carry a
    dense, finely fibrillar black mass in the cell body, often drawn out like a flame that follows the shape of the cell
    into its main dendrite. These are neurofibrillary tangles. The black material is tau assembled into paired helical
    filaments; it got there by coming off the microtubules it normally helps to stabilize, after being abnormally
    phosphorylated. A tangle is therefore an intracellular aggregate of a misfolded protein: the same kind of lesion as
    a Lewy body, but made of a different protein. Silver shows that an aggregate is there, not which protein it is made
    of: plaques of β-amyloid are silver-positive too. Tangles appear early: long before the age at which Alzheimer
    disease usually begins, people without symptoms may already have them in the parahippocampal gyrus and the
    entorhinal cortex, beside the hippocampus, and how far they have spread matches how severe the dementia is. They are
    not specific to Alzheimer disease. Use the switch to see the same teaching set stained for tau by
    immunohistochemistry.
alt:
  it: >-
    Micrografia di tessuto cerebrale con impregnazione argentica, su fondo quasi incolore con nuclei rosa-rossi. Diversi
    neuroni contengono masse nere dense, a forma di fiamma, che riempiono il corpo cellulare e si allungano in un
    prolungamento; in basso a sinistra un neurone mostra una massa nera accanto a un corpo cellulare rosa.
  en: >-
    Silver-stained micrograph of brain tissue on an almost colourless background with pink-red nuclei. Several neurons
    contain dense black, flame-shaped masses that fill the cell body and extend into a process; at the lower left a
    neuron shows a black mass beside a pink cell body.
