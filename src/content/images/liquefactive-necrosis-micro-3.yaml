orientation:
  it: "Pus a sinistra, parete dell'ascesso a destra; il confine corre dall'alto in basso poco oltre la metà del campo."
  en: "Pus on the left, abscess wall on the right; the border runs from top to bottom just past the middle of the field."
lookFor:
  it: "Confronta le due metà: a sinistra piccoli nuclei scuri sparsi in detriti rosa; a destra cellule allungate con un nucleo ovale."
  en: "Compare the two halves: on the left, small dark nuclei scattered in pink debris; on the right, elongated cells with an oval nucleus."
caption:
  it: >-
    Ascesso cerebrale, EE a medio ingrandimento (la barra misura 100 µm): lo stesso preparato visto più da vicino,
    sul confine tra il pus e la parete. La metà sinistra è pus. Della struttura del cervello non resta nulla, né neuroni
    né fibre: c'è solo uno strato di detriti rosa e granulosi, con piccoli spazi vuoti, fitto di cellule
    infiammatorie. Molti dei loro nuclei sono piccoli, scuri e irregolari, come quelli dei neutrofili, che in buona
    parte si stanno disfacendo: sono i loro enzimi ad aver digerito il tessuto. Ecco la necrosi colliquativa vista al
    microscopio. La metà destra è la parete dell'ascesso: fibroblasti allungati, con nucleo ovale, disposti in fasci
    in una matrice rosa chiaro, con ancora molti neutrofili tra l'uno e l'altro; al centro le cellule infiammatorie si
    addensano proprio dove la parete si affaccia sul pus. Confronta con la necrosi caseosa, in cui il tessuto morto
    resta come detrito amorfo dentro i granulomi, e con la necrosi coagulativa, in cui i profili delle cellule morte
    si riconoscono ancora: qui, invece, il tessuto è stato sciolto.
  en: >-
    Brain abscess, H&E at medium power (the bar is 100 µm): the same specimen seen closer, at the border between the
    pus and the wall. The left half is pus. Nothing of the brain's structure is left, neither neurons nor fibres: there
    is only a sheet of pink, granular debris with small gaps, crowded with inflammatory cells. Many of their nuclei are
    small, dark and irregular, like those of neutrophils, many of which are falling apart: it is their enzymes that
    have digested the tissue. This is liquefactive necrosis under the microscope. The right half is the wall of the
    abscess: elongated fibroblasts with oval nuclei lie in streams within a pale pink matrix, still with many
    neutrophils between them; in the middle the inflammatory cells gather most densely right where the wall faces the
    pus. Compare with caseous necrosis, where the dead tissue stays as structureless debris inside granulomas, and
    with coagulative necrosis, where the outlines of the dead cells can still be recognised: here, instead, the
    tissue has been dissolved.
alt:
  it: >-
    Micrografia in ematossilina-eosina a medio ingrandimento. La metà sinistra è uno strato rosa e granuloso con
    piccoli spazi bianchi e molti piccoli nuclei scuri; nella metà destra cellule viola allungate con nuclei ovali,
    disposte in fasci e mescolate a piccoli nuclei scuri; nell'angolo in basso a destra una barra di scala nera di
    100 µm.
  en: >-
    Medium-power H&E micrograph. The left half is a pink, granular sheet with small white gaps and many small dark
    nuclei; the right half shows elongated purple cells with oval nuclei, arranged in streams and mixed with small
    dark nuclei; at the lower right corner, a black 100 µm scale bar.
