orientation:
  it: "L'arteriola, tagliata di traverso, è al centro del campo."
  en: "The arteriole, cut across, sits in the centre of the field."
lookFor:
  it: "Segui l'anello rosa vitreo intorno al lume: è la parete, quasi senza nuclei."
  en: "Trace the glassy pink ring around the lumen: that is the wall, almost without nuclei."
caption:
  it: >-
    Arteriola polmonare di un paziente con ipertensione polmonare, EE a forte ingrandimento; la fonte la descrive come
    un'arteriola con necrosi fibrinoide. Parti dal centro: il lume contiene ancora globuli rossi e qualche cellula
    allungata. Poi guarda che cosa lo circonda. Dove un'arteriola normale ha soltanto una parete sottile, qui la parete
    è diventata un anello spesso di materiale vitreo, rosa acceso, in cui non sopravvive quasi nessun nucleo; solo sul
    lato destro l'anello è più sottile. Per confronto, i piccoli vasi del tessuto circostante, per esempio in basso a
    sinistra, hanno pareti sottili e lumi pieni di globuli rossi. Come leggerla: il rosa è dato dalle proteine del
    plasma, fibrina compresa, uscite dal sangue nella parete lesa e rimaste lì. Poiché questo deposito copre tutto, dal
    vetrino non si può dire se le cellule della parete siano morte: per questo la parola «necrosi» è precisa solo in
    parte. Perché qui: la scala di Heath-Edwards gradua il danno che la pressione elevata provoca nelle arterie
    polmonari, e la necrosi fibrinoide di arterie e arteriole ne è il grado più alto (6). È la via emodinamica alla
    lesione, la stessa che colpisce le arteriole nell'ipertensione maligna, e non richiede immunocomplessi. Passa
    all'immagine a medio ingrandimento dello stesso gruppo didattico: mostra un'altra arteria, infiammata, con un tratto
    necrotico.
  en: >-
    Arteriole in the lung of a patient with pulmonary hypertension, H&E at high power; the source describes it as an
    arteriole with fibrinoid necrosis. Start in the middle: the lumen still holds red blood cells and a few elongated
    cells. Now look at what surrounds it. Where a normal arteriole has only a thin wall, this wall has become a thick
    ring of glassy, bright pink material in which hardly any nuclei survive; only on the right is the ring thinner. For
    comparison, the small vessels in the tissue around it, for example at the lower left, have thin walls and lumens
    packed with red cells. How to read it: the pink comes from plasma proteins, fibrin among them, that have leaked out
    of the blood into the injured wall and stayed there. Because this deposit covers everything, the slide cannot tell
    you whether the cells of the wall are dead, which is why the word necrosis is only partly accurate. Why here: the
    Heath–Edwards scale grades the damage that high pressure does to the pulmonary arteries, and fibrinoid necrosis of
    arteries and arterioles is its top grade (6). This is the pressure route to the lesion, the one that also strikes
    arterioles in malignant hypertension, and it needs no immune complexes. Switch to the medium-power image from the
    same teaching set: it shows a different, inflamed artery with a necrotic segment.
alt:
  it: >-
    Micrografia in EE a forte ingrandimento: al centro un'arteriola rotonda, la cui parete è un anello spesso, liscio,
    rosa acceso, con pochissimi nuclei; all'interno il lume contiene globuli rossi e alcune cellule allungate. Intorno,
    tessuto lasso con nuclei scuri sparsi e piccoli vasi a parete sottile pieni di globuli rossi.
  en: >-
    High-power H&E micrograph: in the centre, a round arteriole whose wall is a thick, smooth, bright pink ring with
    very few nuclei; inside, the lumen holds red blood cells and a few elongated cells. Around it lies loose tissue with
    scattered dark nuclei and small thin-walled vessels full of red cells.
