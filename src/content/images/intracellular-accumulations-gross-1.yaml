caption:
  it: >-
    Colecisti aperta con colesterolosi, superficie mucosa vista dall'alto. Il colore verde scuro di fondo è dovuto
    all'imbibizione biliare e non è il reperto. Avvicinati alla mucosa: è cosparsa di innumerevoli puntini e sottili
    strie gialle, fitti come i semi di una fragola (per questo si parla di "colecisti a fragola", che su una mucosa non
    tinta di bile appare rossa punteggiata di giallo). Ogni puntino corrisponde all'apice di una plica mucosa la cui
    lamina propria è piena di macrofagi carichi di colesterolo: l'accumulo intracellulare, invisibile nella singola
    cellula, diventa visibile a occhio nudo quando migliaia di cellule lo condividono. Confronta con il margine della
    parete, giallo pallido e liscio, privo di screziature.
  en: >-
    Opened gallbladder with cholesterolosis, mucosal surface seen from above. The dark green background comes from bile
    staining and is not the finding. Look closely at the mucosa: it is sprinkled with countless yellow dots and thin
    yellow streaks, packed like the seeds on a strawberry (hence "strawberry gallbladder", which on mucosa not stained
    by bile looks red flecked with yellow). Each dot is the tip of a mucosal fold whose lamina propria is filled with
    cholesterol-laden macrophages: an intracellular accumulation, invisible in a single cell, becomes visible to the
    naked eye when thousands of cells share it. Compare with the edge of the wall, pale yellow and smooth, without
    flecks.
alt:
  it: >-
    Fotografia di una colecisti aperta su un piano bianco: due lembi di mucosa verde scuro, finemente punteggiata di
    giallo, circondati da un bordo di parete giallo pallido e liscio.
  en: >-
    Photograph of an opened gallbladder on a white board: two flaps of dark green mucosa finely speckled with yellow,
    surrounded by a smooth, pale yellow rim of wall.
