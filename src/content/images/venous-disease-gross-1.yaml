lookFor:
  it: Osserva la gamba a destra nell'immagine e segui i rilievi tortuosi sotto la pelle dal polpaccio alla caviglia.
  en: Look at the leg on the right of the image and follow the tortuous raised cords under the skin from the calf to the ankle.
caption:
  it: >-
    Varici della gamba in una persona in piedi. Nella gamba a destra dell'immagine le vene superficiali formano rilievi
    nodulari e tortuosi sotto la pelle, dal polpaccio alla caviglia. La gamba a sinistra, con il piede su un sasso, è
    liscia e serve da confronto. Si vedono solo le gambe: nessun volto.
  en: >-
    Varicose veins of the leg in a standing person. In the leg on the right of the image the superficial veins form
    tortuous, nodular raised cords under the skin from the calf to the ankle. The leg on the left, with the foot on a
    rock, is smooth and serves as a comparison. Only the legs are shown: no face.
alt:
  it: >-
    Fotografia di due gambe in piedi accanto a un corso d'acqua: la gamba a destra ha rilievi nodulari e tortuosi sotto
    la pelle, quella a sinistra ha superficie liscia.
  en: >-
    Photograph of two standing legs beside running water: the leg on the right has nodular, tortuous raised cords under
    the skin, the leg on the left has a smooth surface.
