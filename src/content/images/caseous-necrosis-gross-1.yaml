caption:
  it: >-
    Linfadenite tubercolare, quadro macroscopico: superficie di taglio di un gruppo di linfonodi mesenterici di un
    paziente HIV-positivo. Prima il quadro d'insieme: la sezione comprende diversi linfonodi ingranditi, addossati e in
    parte fusi in un'unica massa (pacchetto linfonodale); puoi ignorare il tessuto molle sfrangiato e brunastro ai
    margini della fetta. Poi guarda la superficie di taglio di ciascun linfonodo: del normale tessuto linfonodale non
    resta nulla. Al suo posto c'è un materiale uniforme e opaco, da color crema a giallo pallido, che appare molle e
    friabile, simile a un formaggio che si sbriciola; i linfonodi vicini sono separati solo da sottili capsule chiare e
    qua e là si vede qualche piccola chiazza rosata. Il grosso linfonodo a sinistra mostra quanto è molle questo materiale: si è staccato dalla
    capsula sottile, lasciando fessure scure a semiluna. Questa è la necrosi caseosa (dal latino caseus, formaggio).
    Come distinguerla a occhio nudo: l'infarto con necrosi coagulativa è compatto e lascia riconoscibile il disegno
    dell'organo;
    l'ascesso da necrosi colliquativa è una cavità piena di pus fluido; il materiale caseoso sta nel mezzo, né compatto
    né liquido. Collegamento clinico: linfonodi ingranditi, fusi e caseosi fanno pensare alla tubercolosi, ma infezioni
    fungine e tumori necrotici possono avere un aspetto simile; la diagnosi si conferma con l'istologia (granulomi), la
    colorazione di Ziehl-Neelsen per i bacilli alcol-acido resistenti, la coltura o i test molecolari.
  en: >-
    Tuberculous lymphadenitis, gross: cut surface of a group of mesenteric lymph nodes from an HIV-positive patient.
    Start with the overview: the slice contains several enlarged lymph nodes pressed together and partly fused into one
    mass (matted nodes); ignore the ragged, brownish soft tissue at the edges of the slice. Then look at the cut surface
    of each node: no normal nodal tissue is left. It has been replaced by uniform, opaque, cream to pale-yellow material
    that looks soft and friable, like crumbly cheese; neighbouring nodes are separated only by thin, pale capsules, and
    a few faint pink spots are scattered through them. The large node on the left shows how soft this material is: it
    has split away from the thin capsule, leaving dark, crescent-shaped clefts. This is caseous necrosis (from Latin
    caseus, cheese). How to tell it apart with the naked eye: an infarct with coagulative necrosis is firm and keeps the
    organ's architecture recognisable; an abscess with liquefactive necrosis is a cavity of fluid pus; caseous material lies in
    between, neither firm nor liquid. Clinical link: enlarged, matted nodes with caseation suggest tuberculosis, but
    fungal infections and necrotic tumours can look similar, so the diagnosis is confirmed by histology (granulomas), a
    Ziehl-Neelsen stain for acid-fast bacilli, culture or molecular tests.
alt:
  it: >-
    Fotografia su fondo azzurro della superficie di taglio di un pacchetto di linfonodi mesenterici fusi tra loro. Ogni
    linfonodo è occupato da materiale uniforme e opaco, color crema-giallo pallido; il grosso linfonodo a sinistra ha
    fessure scure a semiluna lungo il margine.
  en: >-
    Photograph on a blue background of the cut surface of a mass of matted mesenteric lymph nodes. Every node is filled
    with uniform, opaque, cream to pale-yellow material; the large node on the left has dark, crescent-shaped clefts
    along its edge.
