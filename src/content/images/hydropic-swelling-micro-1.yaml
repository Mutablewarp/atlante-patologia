caption:
  it: >-
    Epatocita con degenerazione balloniforme (ballooning) in una steatoepatite, EE a forte ingrandimento: un esempio
    vistoso di rigonfiamento cellulare. Per orientarti parti dal sinusoide con i globuli rossi a sinistra, poi passa al
    grande epatocita alla sua destra. Reperti chiave: la cellula è ingrandita e arrotondata, e il citoplasma è chiaro,
    rarefatto e sfilacciato, con aspetto a ragnatela, invece che rosa e uniforme. Il nucleo resta al centro, con
    cromatina fine e conservata: non ci sono picnosi, carioressi né cariolisi. Attenzione: i vacuoli rotondi, vuoti e a
    margini netti che si vedono accanto possono essere gocce lipidiche (steatosi), un'alterazione diversa; il
    rigonfiamento si giudica dal citoplasma pallido e sfilacciato e dalle dimensioni della cellula.
  en: >-
    Ballooning hepatocyte in steatohepatitis, H&E at high power: a striking example of cell swelling. Orient yourself on
    the sinusoid with red blood cells at the left, then move to the large hepatocyte on its right. Key findings: the cell
    is enlarged and rounded, and its cytoplasm is pale, rarefied and wispy, like a cobweb, instead of evenly pink. The
    nucleus stays central with fine, preserved chromatin: there is no pyknosis, karyorrhexis or karyolysis. Pitfall: the
    round, empty, sharp-edged holes nearby may be lipid droplets (steatosis), a different change; swelling is judged on
    the pale, wispy cytoplasm and on the size of the cell.
alt:
  it: >-
    Micrografia di fegato in ematossilina-eosina a forte ingrandimento: a sinistra un sinusoide verticale con globuli
    rossi; alla sua destra un grande epatocita arrotondato con citoplasma rosa-violaceo chiaro e sfilacciato, alcuni
    spazi rotondi vuoti e un nucleo violaceo al centro.
  en: >-
    High-power H&E micrograph of liver: at the left a vertical sinusoid with red blood cells; to its right a large,
    rounded hepatocyte with pale, wispy pink-violet cytoplasm, a few round empty spaces and a central violet nucleus.
