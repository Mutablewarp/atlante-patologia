caption:
  it: >-
    Veduta endoscopica delle corde vocali durante microlaringoscopia, con il tubo metallico dello strumento in basso.
    Guarda prima le due corde, chiare e sottili, che si incontrano in alto e lasciano tra loro uno spazio a V. Poi cerca
    sul margine libero della corda a sinistra nell'immagine un piccolo rilievo rosso, ben circoscritto e con piccoli
    vasi in superficie: è una lesione polipoide della corda vocale, di cui la fonte parla come di un polipo
    teleangectasico. La corda opposta ha un margine liscio.
  en: >-
    Endoscopic view of the vocal cords during microlaryngoscopy, with the metal tube of the instrument at the bottom.
    Look first at the two pale, slender cords that meet at the top and leave a V-shaped gap between them. Then find, on
    the free edge of the cord on the left of the picture, a small red, well-circumscribed bump with tiny vessels on its
    surface: this is a polypoid lesion of the vocal cord, described by the source as a telangiectatic polyp. The
    opposite cord has a smooth edge.
alt:
  it: >-
    Fotografia endoscopica della laringe: due corde vocali pallide a forma di V, un piccolo rilievo rosso sul margine
    della corda di sinistra nell'immagine e, in basso, il tubo metallico dello strumento.
  en: >-
    Endoscopic photograph of the larynx: two pale vocal cords forming a V, a small red bump on the edge of the cord on
    the left of the picture, and the metal tube of the instrument at the bottom.
