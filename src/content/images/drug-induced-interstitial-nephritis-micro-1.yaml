lookFor:
  it: "Segui i tubuli in sezione longitudinale e cerca i cilindri nel lume: i cilindri ialini sono PAS-positivi, quelli mielomatosi sono PAS-negativi."
  en: "Follow the tubules in longitudinal section and look for casts in the lumen: hyaline casts are PAS-positive, myeloma casts are PAS-negative."
caption:
  it: >-
    Biopsia renale, colorazione PAS, forte ingrandimento (nefropatia da cilindri di catene leggere). Guarda prima i
    tubuli, tagliati per lungo e rivestiti da cellule con nuclei blu. In alcuni lumi c'è materiale rosa omogeneo: sono
    cilindri. Tra i tubuli l'interstizio è slargato e contiene cellule infiammatorie sparse. È l'esempio di
    nefropatia tossica da catene leggere descritta nella scheda; la nefrite da ipersensibilità, invece, si riconosce
    per l'infiltrato interstiziale con eosinofili e per la tubulite.
  en: >-
    Kidney biopsy, PAS stain, high power (light-chain cast nephropathy). Look first at the tubules, cut lengthwise and
    lined by cells with blue nuclei. Some lumens hold homogeneous pink material: these are casts. Between the tubules
    the interstitium is widened and holds scattered inflammatory cells. This is the example of toxic light-chain
    nephropathy described in the card; hypersensitivity nephritis, by contrast, is recognized by an interstitial
    infiltrate with eosinophils and by tubulitis.
alt:
  it: >-
    Micrografia PAS di biopsia renale: tubuli allungati con nuclei blu e, in alcuni lumi, cilindri omogenei rosa, in un
    interstizio pallido con cellule infiammatorie sparse.
  en: >-
    PAS micrograph of a kidney biopsy: elongated tubules with blue nuclei and, in some lumens, homogeneous pink casts,
    set in a pale interstitium with scattered inflammatory cells.
