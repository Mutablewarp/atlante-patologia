caption:
  it: >-
    Esofago di Barrett, cioè metaplasia intestinale della mucosa dell'esofago distale, EE a medio ingrandimento.
    Leggi l'immagine da sinistra a destra. A sinistra c'è il rivestimento nativo dell'esofago: epitelio pavimentoso
    pluristratificato non cheratinizzato, spesso, rosa e compatto. Subito a destra il rivestimento cambia di colpo e
    diventa un epitelio colonnare a strato singolo che forma fossette e cripte, con una lamina propria ricca di cellule
    infiammatorie. Al centro una cripta è tappezzata da cellule caliciformi: grandi vacuoli di muco rotondi, chiari e
    appena grigio-azzurri, intercalati alle cellule colonnari. Sono il reperto che documenta la metaplasia
    intestinale. A destra l'epitelio colonnare di tipo gastrico (foveolare) ha una mucina apicale pallida ma nessuna
    cellula caliciforme. Tranello: subito a destra della giunzione squamo-colonnare le cellule colonnari hanno nuclei
    più grandi, scuri e affollati; in questo caso si tratta di alterazioni reattive, non di displasia. Il perché: il
    reflusso cronico di succo gastrico danneggia di continuo l'epitelio
    pavimentoso, che viene sostituito da un epitelio ghiandolare più resistente all'acido. È un adattamento
    protettivo, ma è anche il terreno su cui possono svilupparsi displasia e adenocarcinoma.
  en: >-
    Barrett esophagus, that is, intestinal metaplasia of the distal oesophageal mucosa, H&E at intermediate power.
    Read the image from left to right. On the left is the native lining of the oesophagus: thick, compact, pink,
    non-keratinising stratified squamous epithelium. Just to the right the lining changes abruptly into a
    single-layered columnar epithelium that forms pits and crypts, over a lamina propria full of inflammatory cells.
    In the centre one crypt is lined by goblet cells: large, round, clear mucin vacuoles with a faint grey-blue tint,
    set between the columnar cells. They are the finding that documents intestinal metaplasia. On the right, the
    gastric-type (foveolar) columnar epithelium has pale apical mucin but no goblet cells. Pitfall: just to the right
    of the squamous-columnar junction the columnar cells have larger, darker, crowded nuclei; in this case they are a
    reactive change, not dysplasia. Why it happens: chronic
    reflux of gastric juice keeps damaging the squamous epithelium, which is replaced by a glandular epithelium that
    resists acid better. The change is protective, but it is also the ground on which dysplasia and adenocarcinoma
    can develop.
alt:
  it: >-
    Micrografia in ematossilina-eosina di mucosa esofagea: a sinistra un epitelio pavimentoso spesso e rosa; al centro
    e a destra un epitelio colonnare viola che forma cripte allungate, una delle quali contiene molte cellule con
    grandi vacuoli rotondi e chiari; in alto, sfondo bianco.
  en: >-
    H&E micrograph of oesophageal mucosa: on the left a thick pink squamous epithelium; in the centre and on the right
    a purple columnar epithelium forming elongated crypts, one of which contains many cells with large round clear
    vacuoles; white background at the top.
