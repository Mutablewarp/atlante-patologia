caption:
  it: >-
    Psoriasi volgare, EE: un'iperplasia dell'epidermide. Parti dal pannello A, a medio ingrandimento. La parentesi
    con la sigla EH abbraccia l'epidermide, molto più spessa del normale perché contiene molti più strati di
    cheratinociti (acantosi). Le creste epidermiche sono allungate, sottili e quasi tutte di pari lunghezza; si
    spingono in profondità nel derma e si alternano a papille dermiche alte, con piccoli vasi all'apice. Le cellule
    maturano ancora in modo ordinato dalla base verso la superficie e hanno un aspetto uniforme: la crescita è
    iperplastica, non displastica. Poi guarda la superficie: lo strato corneo è una banda rosa compatta che
    conserva nuclei appiattiti (paracheratosi), perché le cellule risalgono troppo in fretta per completare la
    cheratinizzazione, e lo strato granuloso sotto di esso è assottigliato o assente. La freccia indica neutrofili
    raccolti nello strato corneo. Nel pannello B, a forte ingrandimento, i neutrofili attraversano gli strati
    superficiali dell'epidermide diretti verso lo strato corneo (frecce). Il messaggio didattico: qui lo stimolo non
    è un ormone ma un'infiammazione mediata dal sistema immunitario, che spinge i cheratinociti a dividersi; è
    quindi un'iperplasia patologica di un tessuto le cui cellule si dividono di continuo.
  en: >-
    Psoriasis vulgaris, H&E: a hyperplasia of the epidermis. Start with panel A, at medium power. The bracket
    marked EH spans the epidermis, which is much thicker than normal because it holds many more layers of
    keratinocytes (acanthosis). The rete ridges are long, slender and nearly all the same length; they reach deep
    into the dermis and alternate with tall dermal papillae that carry small vessels at their tips. The cells still
    mature in an orderly way from the base to the surface and look uniform, so the growth is hyperplastic, not
    dysplastic. Then look at the surface: the cornified layer is a compact pink band that keeps flattened nuclei
    (parakeratosis), because the cells move up too fast to finish keratinization, and the granular layer beneath it
    is thin or missing. The arrow points to neutrophils collected in the cornified layer. In panel B, at high power,
    neutrophils cross the upper layers of the epidermis on their way to the cornified layer (arrows). The teaching
    point: here the stimulus is not a hormone but immune-mediated inflammation that drives keratinocytes to divide,
    so this is a pathological hyperplasia of a tissue whose cells divide all the time.
alt:
  it: >-
    Micrografia di cute in due pannelli, colorata con ematossilina-eosina. A sinistra (A): epidermide viola molto
    spessa, con lunghe propaggini regolari che scendono nel derma rosa, una parentesi con la sigla EH lungo tutto il
    suo spessore, uno strato superficiale compatto rosa acceso e una freccia rivolta verso puntini scuri al suo
    interno. A destra (B): dettaglio degli strati superficiali dell'epidermide, con grandi cellule rosa, numerosi
    piccoli nuclei scuri e segmentati tra di esse, uno strato rosa in alto a sinistra e due frecce.
  en: >-
    Two-panel H&E micrograph of skin. Left (A): a very thick purple epidermis with long, regular projections reaching
    down into the pink dermis, a bracket labelled EH along its full height, a compact bright-pink surface layer and
    an arrow pointing at dark dots inside it. Right (B): close-up of the upper epidermis, with large pink cells, many
    small dark segmented nuclei between them, a pink layer at top left and two arrows.
