lookFor:
  it: "Fissa la sequenza nello schema A; in B distingui gli AP (citoplasma intatto) dagli AL (contenuto in digestione); in C punti e anelli luminosi sono LC3 sulle membrane autofagiche."
  en: "Fix the sequence in diagram A; in B tell AP (intact cytoplasm) from AL (contents being digested); in C the bright dots and rings are LC3 on autophagic membranes."
caption:
  it: >-
    Il ciclo di vita di un autofagosoma in una sola figura, tratta da una rassegna del 2006: uno schema (A) e due modi
    di vedere le strutture reali, la microscopia elettronica (B) e la fluorescenza (C). Parti da A e fissa la sequenza,
    perché all'esame viene chiesta: una doppia membrana a forma di coppa, il fagoforo o membrana di isolamento (IM), si
    incurva attorno a un po' di citoplasma e si chiude in un autofagosoma a doppia membrana (AP); poi un lisosoma si
    fonde con esso e, nell'autolisosoma (AL) che ne risulta, gli enzimi lisosomiali digeriscono il carico insieme alla
    membrana interna. Il punto interrogativo a sinistra richiama il tema della rassegna, cioè da dove provenga la
    membrana, una questione allora aperta. Il pannello B è una micrografia elettronica di una larva di moscerino della
    frutta tenuta a digiuno; il tessuto è il corpo grasso, che negli insetti svolge il lavoro del fegato. Confronta le
    strutture indicate: un AP contiene citoplasma uguale a quello circostante, perché nulla è stato ancora digerito; un
    AL è più scuro e disomogeneo, con materiale in vari stadi di demolizione. Il pannello C viene da topi a digiuno
    modificati per produrre LC3 fluorescente, una proteina che riveste le membrane autofagiche; nei loro epatociti ogni
    anello luminoso è un autofagosoma e ogni coppa aperta un fagoforo non ancora chiuso. Contare questi punti è un metodo
    di laboratorio diffuso per stimare quanti autofagosomi contiene una cellula; il digiuno, lo stimolo classico, li
    rende più numerosi, ma da solo un conteggio più alto può anche indicare un blocco delle tappe successive. Nessuna
    delle due micrografie viene da una lesione umana: all'ematossilina-eosina gli autofagosomi non si riconoscono.
  en: >-
    The life cycle of an autophagosome in one figure, from a 2006 review: a diagram (A) and two ways of seeing the real
    structures, electron microscopy (B) and fluorescence (C). Start with A and fix the sequence, because exams ask for
    it: a cup-shaped double membrane, the phagophore or isolation membrane (IM), curls around some cytoplasm and closes
    into a double-membrane autophagosome (AP); a lysosome then fuses with it, and in the resulting autolysosome (AL)
    lysosomal enzymes digest the cargo together with the inner membrane. The question mark on the left recalls the
    subject of the review, where the membrane comes from, which was then an open question. Panel B is an electron
    micrograph from a fruit fly larva kept without food; the tissue is the fat body, which in insects does the work of
    the liver. Compare the labelled structures: an AP holds cytoplasm that looks like its surroundings, because nothing
    has been digested yet; an AL is darker and patchy, with contents at different stages of breakdown. Panel C comes
    from starved mice engineered to make fluorescent LC3, a protein that coats autophagic membranes; in their
    hepatocytes each bright ring is an autophagosome and each open cup a phagophore that has not yet closed. Counting
    such dots is a common laboratory measure of how many autophagosomes a cell holds; starvation, the classic trigger,
    makes them more numerous, but on its own a higher count can also mean that later steps are blocked. Neither
    micrograph comes from a human lesion: on H&E, autophagosomes cannot be recognised.
alt:
  it: >-
    Figura in tre pannelli. A: schema in bianco e nero con frecce: un punto interrogativo, poi una doppia membrana
    aperta a forma di C indicata come membrana di isolamento, un doppio anello chiuso indicato come autofagosoma, un
    cerchio grigio indicato come lisosoma e, in basso, una forma combinata indicata come autolisosoma, con le scritte
    induction, formation and completion, docking/fusion e breakdown. B: micrografia elettronica grigia di citoplasma di
    insetto con due strutture marcate AP, piene di materiale granulare simile a quello circostante, e due strutture più
    scure, in parte suddivise in compartimenti, marcate AL; barra di scala 1,0 µm. C: immagine in fluorescenza grigia
    di cellule epatiche con punti luminosi sparsi e alcuni piccoli anelli luminosi; barra di scala 10 µm.
  en: >-
    Three-panel figure. A: black-and-white diagram with arrows: a question mark, then an open C-shaped double membrane
    labelled isolation membrane, a closed double ring labelled autophagosome, a grey circle labelled lysosome and, below,
    a combined shape labelled autolysosome, with the words induction, formation and completion, docking/fusion and
    breakdown. B: grey electron micrograph of insect cytoplasm with two structures labelled AP, filled with granular
    material like the surroundings, and two darker, partly chambered structures labelled AL; scale bar 1.0 µm. C: grey
    fluorescence image of liver cells with scattered bright dots and a few small bright rings; scale bar 10 µm.
