lookFor:
  it: "Fissa la sequenza nello schema A; in B distingui gli AP (citoplasma intatto) dagli AL (contenuto in digestione); in C punti e anelli luminosi sono LC3 sulle membrane autofagiche."
  en: "Fix the sequence in diagram A; in B tell AP (intact cytoplasm) from AL (contents being digested); in C the bright dots and rings are LC3 on autophagic membranes."
caption:
  it: >-
    Il ciclo di vita di un autofagosoma in una sola figura, tratta da una rassegna del 2006: uno schema (A) e due modi
    di vedere le strutture reali, la microscopia elettronica (B) e la fluorescenza (C). Parti da A e fissa la sequenza,
    perché all'esame viene chiesta: all'induzione una doppia membrana a forma di coppa, la membrana di isolamento o
    fagoforo (IM), avvolge una porzione di citoplasma; quando i suoi margini si saldano diventa un autofagosoma chiuso,
    a doppia membrana (AP); l'autofagosoma si fonde poi con un lisosoma e nasce un autolisosoma (AL), in cui la membrana
    interna e il carico vengono demoliti. Il punto interrogativo a sinistra richiama il tema della rassegna, cioè da
    dove provenga la membrana, una questione allora aperta. Il pannello B è una micrografia elettronica del corpo
    grasso, l'organo che negli insetti fa le veci del fegato, di una larva di moscerino della frutta tenuta a digiuno.
    Confronta le strutture indicate: un AP contiene citoplasma uguale a quello circostante, perché nulla è stato ancora
    digerito; un AL è più scuro e disomogeneo, con materiale in vari stadi di demolizione. Il pannello C mostra cellule
    epatiche di topi a digiuno che esprimono una forma fluorescente di LC3, una proteina che riveste le membrane
    autofagiche: le immagini a coppa sono fagofori, gli anelli sono autofagosomi. Contare questi punti fluorescenti è un
    metodo di laboratorio diffuso per dimostrare che l'autofagia si è attivata, qui con il digiuno, lo stimolo classico.
    Nessuna delle due micrografie viene da una lesione umana: all'ematossilina-eosina gli autofagosomi non si
    riconoscono.
  en: >-
    The life cycle of an autophagosome in one figure, from a 2006 review: a diagram (A) and two ways of seeing the real
    structures, electron microscopy (B) and fluorescence (C). Start with A and fix the sequence, because exams ask for
    it: on induction, a cup-shaped double membrane, the isolation membrane or phagophore (IM), wraps a portion of
    cytoplasm; when its rims seal it becomes a closed, double-membrane autophagosome (AP); the autophagosome then fuses
    with a lysosome, giving an autolysosome (AL) in which the inner membrane and the cargo are broken down. The question
    mark on the left recalls the subject of the review, where the membrane comes from, which was then an open
    question. Panel B is an electron micrograph of the fat body, the insect counterpart of the liver, of a fruit fly
    larva kept without food. Compare the labelled structures: an AP holds cytoplasm that looks like its surroundings,
    because nothing has been digested yet; an AL is darker and patchy, with contents at different stages of breakdown.
    Panel C shows liver cells of starved mice that make a fluorescent form of LC3, a protein that coats autophagic
    membranes: the cup shapes are phagophores and the rings are autophagosomes. Counting such fluorescent dots is a
    common laboratory way to show that autophagy has been switched on, here by starvation, the classic trigger. Neither
    micrograph comes from a human lesion: on H&E, autophagosomes cannot be recognised.
alt:
  it: >-
    Figura in tre pannelli. A: schema in bianco e nero con frecce: un punto interrogativo, poi una doppia membrana
    aperta a forma di C indicata come membrana di isolamento, un doppio anello chiuso indicato come autofagosoma, un
    cerchio grigio indicato come lisosoma e, in basso, una forma combinata indicata come autolisosoma, con le scritte
    induction, formation and completion, docking/fusion e breakdown. B: micrografia elettronica grigia di citoplasma di
    insetto con due strutture marcate AP, piene di materiale granulare simile a quello circostante, e due strutture più
    scure, in parte suddivise in compartimenti, marcate AL; barra di scala 1,0 µm. C: immagine in fluorescenza grigia
    di cellule epatiche con punti luminosi sparsi e alcuni piccoli anelli luminosi; barra di scala 10 µm.
  en: >-
    Three-panel figure. A: black-and-white diagram with arrows: a question mark, then an open C-shaped double membrane
    labelled isolation membrane, a closed double ring labelled autophagosome, a grey circle labelled lysosome and, below,
    a combined shape labelled autolysosome, with the words induction, formation and completion, docking/fusion and
    breakdown. B: grey electron micrograph of insect cytoplasm with two structures labelled AP, filled with granular
    material like the surroundings, and two darker, partly chambered structures labelled AL; scale bar 1.0 µm. C: grey
    fluorescence image of liver cells with scattered bright dots and a few small bright rings; scale bar 10 µm.
