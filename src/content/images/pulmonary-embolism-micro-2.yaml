lookFor:
  it: Confronta le bande rosa con le zone intermedie e guarda che cosa riempie quelle zone.
  en: Compare the pink bands with the zones between them, and look at what fills those zones.
caption:
  it: >-
    Stesso trombo, EE a forte ingrandimento. Le bande rosa più intense sono omogenee e quasi senza cellule. Nelle
    zone intermedie, su uno sfondo rosa finemente granulare, restano cellule sparse con nuclei viola, alcune con
    nucleo molto scuro e frammentato. Il confronto tra bande e zone cellulari spiega l'aspetto a strati visto a
    basso ingrandimento.
  en: >-
    Same thrombus, H&E at high power. The deeper pink bands are homogeneous and almost cell-free. In the zones
    between them, on a finely granular pink background, scattered cells with purple nuclei remain, some with a very
    dark, fragmented nucleus. Comparing bands with cellular zones explains the layered look seen at low power.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento: bande oblique rosa intenso e omogenee tra aree rosa
    chiaro granulari con numerose cellule sparse dal nucleo viola.
  en: >-
    High-power H&E micrograph: oblique, deep pink, homogeneous bands between pale pink granular areas with many
    scattered cells that have purple nuclei.
