lookFor:
  it: "Parti dalla ghiandola normale a sinistra, poi osserva come i nidi tumorali a destra siano pieni di spazi rotondi con materiale pallido."
  en: "Start at the normal gland on the left, then see how the tumor nests on the right are full of round spaces holding pale material."
caption:
  it: >-
    Carcinoma adenoido-cistico di ghiandola salivare (parotide), EE a basso ingrandimento. A sinistra c'è la ghiandola
    normale: acini sierosi scuri raggruppati tra cellule adipose. Al centro e a destra il tumore forma nidi e cordoni
    che circondano spazi rotondi, di dimensioni diverse, riempiti di materiale pallido grigio-azzurro. Questo è il
    disegno cribriforme, come un formaggio svizzero. Gli spazi sono pseudocisti, non veri lumi ghiandolari.
  en: >-
    Adenoid cystic carcinoma of a salivary gland (parotid), H&E at low power. On the left is normal gland: dark serous
    acini clustered among fat cells. In the center and on the right the tumor forms nests and cords around round spaces
    of different sizes, filled with pale gray-blue material. This is the cribriform pattern, like Swiss cheese. The
    spaces are pseudocysts, not true glandular lumens.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a sinistra acini ghiandolari scuri tra cellule adipose vuote; a destra nidi di
    cellule tumorali violacee attorno a numerosi spazi rotondi, ovali e irregolari, che contengono materiale pallido
    grigio-azzurro, entro uno stroma rosa.
  en: >-
    H&E micrograph: on the left, dark glandular acini among empty-looking fat cells; on the right, nests of purple tumor
    cells around many round, oval and irregular spaces that contain pale gray-blue material, in pink stroma.
