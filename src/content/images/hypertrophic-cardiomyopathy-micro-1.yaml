lookFor:
  it: "Segui la direzione delle fibre in più punti del campo: nel miocardio normale corrono in fasci paralleli, qui cambiano direzione e si intrecciano."
  en: "Follow the direction of the fibers at several points in the field: in normal myocardium they run in parallel bundles, here they change direction and interweave."
caption:
  it: >-
    Cardiomiopatia ipertrofica, EE a medio ingrandimento. Guarda l'insieme prima dei dettagli: le fibre rosa non
    corrono in fasci ordinati e paralleli, ma si incrociano e formano vortici in direzioni diverse. È il disarray dei
    miociti. Tra le fibre ci sono aree più chiare e pallide di tessuto interstiziale.
  en: >-
    Hypertrophic cardiomyopathy, H&E at medium power. Look at the whole field before the details: the pink fibers do
    not run in orderly parallel bundles but cross each other and swirl in different directions. This is myocyte
    disarray. Between the fibers are paler, lighter areas of interstitial tissue.
alt:
  it: >-
    Micrografia in ematossilina-eosina di miocardio: fibre muscolari rosa intrecciate in direzioni diverse, con
    piccoli nuclei viola sparsi e aree interstiziali più chiare tra i fasci.
  en: >-
    H&E micrograph of myocardium: pink muscle fibers interwoven in different directions, with scattered small purple
    nuclei and paler interstitial areas between the bundles.
