caption:
  it: >-
    Necrosi e apoptosi a confronto. La necrosi colpisce gruppi di cellule rigonfie la cui membrana si rompe: il contenuto
    fuoriesce e scatena infiammazione. L'apoptosi elimina singole cellule che si raggrinziscono, condensano e frammentano
    la cromatina e si dividono in corpi apoptotici circondati da membrana, rimossi dai fagociti senza infiammazione.
    L'apoptosi è guidata da cascate di caspasi e può essere fisiologica; la necrosi è un evento patologico.
  en: >-
    Necrosis and apoptosis compared. Necrosis strikes groups of swollen cells whose membrane ruptures: the contents leak
    and trigger inflammation. Apoptosis removes single cells that shrink, condense and fragment their chromatin and split
    into membrane-bound apoptotic bodies, which phagocytes clear without inflammation. Apoptosis is driven by caspase
    cascades and can be physiological; necrosis is a pathological event.
alt:
  it: >-
    Tabella a due colonne, necrosi in rosa e apoptosi in viola. In alto una cellula rigonfia con la membrana interrotta e
    goccioline che escono, accanto a una cellula raggrinzita con bolle che si divide in corpi apoptotici. Sotto, righe per
    estensione, volume cellulare, nucleo, membrana, infiammazione, meccanismo e contesto.
  en: >-
    Two-column table, necrosis in pink and apoptosis in violet. At the top, a swollen cell with a broken membrane and
    droplets escaping, next to a shrunken blebbing cell splitting into apoptotic bodies. Below, rows for extent, cell
    size, nucleus, membrane, inflammation, driver and setting.
