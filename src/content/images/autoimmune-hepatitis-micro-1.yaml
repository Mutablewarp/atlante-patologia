lookFor:
  it: "Scorri il frustolo a basso ingrandimento e cerca le zone più viola, dove le cellule infiammatorie si addensano ai margini del parenchima."
  en: "Scan the biopsy at low power and look for the more purple areas, where inflammatory cells crowd at the edges of the parenchyma."
caption:
  it: >-
    Epatite autoimmune, H&E a basso ingrandimento. Il frustolo bioptico è di parenchima epatico rosa con aree
    più scure e violette: sono gruppi di cellule infiammatorie, che si addensano in particolare lungo il margine
    inferiore. A questo ingrandimento si individuano le sedi da esaminare a maggior ingrandimento.
  en: >-
    Autoimmune hepatitis, H&E at low power. The biopsy strip is pink liver parenchyma with darker purple areas:
    these are clusters of inflammatory cells, most prominent along the lower edge. At this power you find the
    spots to examine at higher magnification.
alt:
  it: >-
    Micrografia a basso ingrandimento di un lungo frustolo di fegato colorato con H&E: tessuto rosa con piccoli
    addensamenti violetti di cellule infiammatorie, soprattutto lungo il bordo inferiore, su fondo bianco.
  en: >-
    Low-power micrograph of a long liver biopsy strip stained with H&E: pink tissue with small purple clusters
    of inflammatory cells, mostly along the lower edge, on a white background.
