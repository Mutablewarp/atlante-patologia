lookFor:
  it: "Confronta i neuroni rossi con quelli blu: il rosso segnala la tau, quindi si colorano solo le cellule con aggregati di tau e i sottili filamenti del neuropilo."
  en: "Compare the red neurons with the blue ones: red marks tau, so only cells holding tau aggregates, and fine threads in the neuropil, are coloured."
caption:
  it: >-
    La stessa serie didattica dell'impregnazione argentica (ippocampo di una persona anziana con alterazioni di tipo
    Alzheimer), immunoistochimica per la proteina tau, forte ingrandimento. Qui il segnale dell'anticorpo è rosso e la
    controcolorazione è blu. Comincia da un neurone rimasto blu: il grande neurone in basso a destra ha un citoplasma
    pulito, senza aggregati di tau. Poi confronta quelli rossi. Nel neurone in alto a destra il rosso riempie il corpo
    cellulare attorno al nucleo blu e prosegue in un lungo prolungamento; al centro il rosso si raccoglie a semiluna
    accanto al nucleo. Sono grovigli neurofibrillari riconosciuti dalla loro proteina, non soltanto dalla forma. Infine
    guarda il neuropilo: i piccoli punti e i brevi filamenti rossi tra le cellule sono tau dentro sottili prolungamenti
    dei neuroni (i cosiddetti neuropil threads); nella malattia di Alzheimer la tau anomala si raccoglie nei corpi
    cellulari come grovigli e nei prolungamenti come filamenti. Perché chiedere questa colorazione: l'argento annerisce
    diversi tipi di aggregati, e una colorazione per l'ubiquitina evidenzierebbe allo stesso modo grovigli e corpi di
    Lewy, perché entrambi portano quel marcatore; un anticorpo contro la proteina che si aggrega, qui la tau, dice
    invece quale inclusione stai guardando.
  en: >-
    The same teaching set as the silver stain (hippocampus of an elderly person with Alzheimer-type changes),
    immunohistochemistry for tau protein, high power. Here the antibody signal is red and the counterstain blue. Start
    with a neuron that stays blue: the large neuron at the lower right has clean cytoplasm and no tau aggregate. Then
    compare the red ones. In the neuron at the upper right, red fills the cell body around the blue nucleus and
    continues down a long process; in the centre, red gathers in a crescent beside the nucleus. These are
    neurofibrillary tangles recognised by their protein, not only by their shape. Finally look at the neuropil: the
    small red dots and short threads between the cells are tau inside fine processes of nerve cells, the so-called
    neuropil threads; in Alzheimer disease abnormal tau collects in cell bodies as tangles and in processes as threads.
    Why ask for this stain: silver blackens several kinds of aggregate, and a stain for ubiquitin would light up tangles
    and Lewy bodies alike, because both carry that tag; an antibody to the aggregating protein itself, tau here, tells
    you which inclusion you are looking at.
alt:
  it: >-
    Micrografia immunoistochimica di tessuto cerebrale su fondo blu. Tre neuroni sono colorati di rosso scuro: uno in
    alto a destra con un lungo prolungamento rosso diretto verso il basso, uno al centro con una semiluna rossa accanto
    a un nucleo blu e uno più sottile a sinistra. Un grande neurone in basso a destra è soltanto blu; piccoli punti e
    filamenti rossi sono sparsi tra le cellule.
  en: >-
    Immunostained micrograph of brain tissue on a blue background. Three neurons are coloured dark red: one at the upper
    right with a long red process running downwards, one in the centre with a red crescent beside a blue nucleus, and a
    narrower one at the left. A large neuron at the lower right is blue only; small red dots and threads are scattered
    between the cells.
