orientation:
  it: "Cavità dell'ascesso a sinistra; la parete attraversa il campo dall'alto in basso, al centro; verso destra si va all'esterno della parete."
  en: "Abscess cavity on the left; the wall crosses the field from top to bottom in the middle; towards the right you move outside the wall."
lookFor:
  it: "Vai da sinistra a destra: spazio vuoto, poi uno strato granuloso rosa-rossastro, poi un'ampia fascia viola di cellule allungate."
  en: "Go from left to right: empty space, then a granular pink-red layer, then a broad purple band of elongated cells."
caption:
  it: >-
    Ascesso cerebrale, EE a piccolo ingrandimento (la barra misura 500 µm); lo stesso preparato è mostrato anche a
    medio ingrandimento. Leggi il campo da sinistra a destra, cioè dall'interno dell'ascesso verso l'esterno. A sinistra lo
    spazio vuoto è la cavità dell'ascesso: il pus, che è liquido, in gran parte non resta sul vetrino. La cavità è
    rivestita da uno strato irregolare di pus, fatto di cellule infiammatorie fittamente stipate e di detriti
    granulosi rosa-rossastri con qualche globulo rosso: è ciò che resta del tessuto cerebrale sciolto dagli enzimi dei
    neutrofili. Segue la parete, un'ampia fascia di cellule allungate (fusate) disposte in fasci, con piccoli vasi
    sanguigni. Qui il tessuto di granulazione e i fibroblasti costruiscono la capsula di collagene che isola il pus;
    poiché il cervello non ha quasi fibroblasti propri, questi arrivano dalle pareti dei piccoli vasi. In alto a
    destra il tessuto torna più lasso e chiaro, verso il cervello che sta fuori dalla parete; in basso a destra due
    vasi sono pieni di globuli rossi. Perché conta: alla RM con mezzo di contrasto questa parete si accende come un
    anello liscio, di spessore uniforme, perché nel suo tessuto di granulazione manca la barriera ematoencefalica e
    il contrasto ne trapela. Poi passa all'ingrandimento medio per riconoscere le cellule.
  en: >-
    Brain abscess, H&E at low power (the bar is 500 µm); the same specimen is also shown at medium power. Read the
    field from left to right, that is from the inside of the abscess outwards. On the left, the empty space is the
    abscess cavity: pus is liquid, and most of it does not stay on the slide. The cavity is lined by a ragged layer of
    pus, made of tightly packed inflammatory cells and granular pink-red debris with a few red cells: this is what is
    left of the brain tissue dissolved by the enzymes of the neutrophils. Next comes the wall, a broad band of
    elongated (spindle) cells arranged in streams, with small blood vessels. Here granulation tissue and fibroblasts
    build the collagen capsule that walls off the pus; since the brain has almost no fibroblasts of its own, they
    come in from the walls of the small vessels. At the upper right the tissue turns looser and paler again, towards
    the brain outside the wall; at the lower right two vessels are packed with red cells. Why it matters: on
    contrast MRI this wall lights up as a smooth ring of even thickness, because its granulation tissue lacks a
    blood-brain barrier and the contrast seeps out of it. Then switch to the medium power to recognise the cells.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento, in toni viola chiari. A sinistra un ampio spazio vuoto
    grigio chiaro dal bordo irregolare; accanto una fascia di materiale granuloso rosa-rossastro con molti puntini
    scuri; al centro un'ampia fascia di cellule allungate disposte in fasci; in basso a destra due vasi pieni di sangue
    rosso-bruno e, nell'angolo, una barra di scala nera di 500 µm.
  en: >-
    Low-power H&E micrograph in pale purple tones. On the left, a large, empty, light-grey space with a ragged edge;
    next to it, a band of granular pink-red material with many dark dots; in the middle, a broad band of elongated
    cells arranged in streams; at the lower right, two vessels filled with red-brown blood and, in the corner, a black
    500 µm scale bar.
