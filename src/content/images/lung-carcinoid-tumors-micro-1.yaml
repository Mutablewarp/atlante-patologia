lookFor:
  it: "Osserva prima il margine netto della massa viola, poi i diversi schemi di crescita al suo interno; in basso a destra c'è la cartilagine bronchiale."
  en: "Look first at the sharp edge of the purple mass, then at the varied growth patterns inside it; bronchial cartilage lies at the lower right."
caption:
  it: >-
    Carcinoide tipico, basso ingrandimento, H&E. Il tumore riempie il lume di un bronco grande e mostra schemi di
    crescita diversi, con nidi e cordoni di cellule separati da sottile stroma; la cartilagine bronchiale è in basso a destra.
  en: >-
    Typical carcinoid, low power, H&E. The tumor fills the lumen of a large bronchus and shows varied growth patterns,
    with nests and cords of cells separated by thin stroma; bronchial cartilage is at the lower right.
alt:
  it: "Sezione H&E a basso ingrandimento: una massa viola scuro, ben delimitata, formata da nidi e cordoni di cellule in uno stroma rosa; in basso a destra un'area di cartilagine rosa pallido."
  en: "Low-power H&E section: a well-demarcated dark purple mass made of nests and cords of cells in pink stroma; a pale pink area of cartilage at the lower right."
