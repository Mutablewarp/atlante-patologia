lookFor:
  it: "Guarda la dimensione dello stomaco rispetto al righello: è molto dilatato a monte del piloro, dove l'ulcera cronica ha causato l'ostruzione."
  en: "Compare the size of the stomach with the ruler: it is very dilated upstream of the pylorus, where the chronic ulcer caused the obstruction."
caption:
  it: >-
    Stomaco asportato visto dalla sierosa, con righello in centimetri. Lo stomaco è molto disteso e il tratto distale
    verso il piloro, a sinistra, è più stretto: è il quadro di un'ostruzione pilorica da ulcera peptica cronica
    cicatrizzata. L'ulcera in sé non è visibile da questo lato, perché si trova sulla mucosa.
  en: >-
    Resected stomach seen from the serosal side, with a centimeter ruler. The stomach is greatly distended and the
    distal part toward the pylorus, on the left, is narrower: this is the picture of pyloric obstruction from a scarred
    chronic peptic ulcer. The ulcer itself cannot be seen from this side, because it lies on the mucosal surface.
alt:
  it: >-
    Fotografia di uno stomaco asportato, di colore arancione su un telo verde, con un righello in alto; lo stomaco è
    molto dilatato e a sinistra si vedono il piloro e l'inizio del duodeno.
  en: >-
    Photograph of a resected stomach, orange in color, on a green sheet with a ruler above it; the stomach is greatly
    dilated and the pylorus and the start of the duodenum are seen at the left.
