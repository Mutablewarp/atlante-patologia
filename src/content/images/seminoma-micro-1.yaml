lookFor:
  it: "Concentrati sulle cellule: citoplasma chiaro e nucleo centrale dal contorno squadrato, con cromatina grossolana."
  en: "Focus on single cells: clear cytoplasm and a central nucleus with a squared-off outline and coarse chromatin."
caption:
  it: >-
    Seminoma, EE ad alto ingrandimento. Guarda le singole cellule: sono grandi e uniformi, con citoplasma chiaro e
    ben delimitato e un nucleo centrale dal contorno angolare e dalla cromatina grossolana. Il tessuto intorno è
    pallido e con poco stroma; qualche linfocita piccolo e scuro è sparso tra le cellule tumorali.
  en: >-
    Seminoma, H&E at high power. Look at single cells: they are large and uniform, with clear, well-defined cytoplasm
    and a central nucleus with an angular outline and coarse chromatin. The surrounding tissue is pale with little
    stroma; a few small dark lymphocytes are scattered between the tumor cells.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: molte cellule grandi con citoplasma chiaro e nuclei
    scuri, centrali, dai contorni irregolari e angolari, separate da sottili filamenti rosa.
  en: >-
    High-power H&E micrograph: many large cells with clear cytoplasm and dark, central nuclei with irregular, angular
    outlines, separated by thin pink strands.
