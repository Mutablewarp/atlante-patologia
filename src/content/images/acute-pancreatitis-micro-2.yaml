lookFor:
  it: "Segui il bordo violaceo tra le aree rosa pallide a destra e il tessuto connettivo con vasi a sinistra."
  en: "Follow the purple edge between the pale pink areas on the right and the connective tissue with vessels on the left."
caption:
  it: >-
    Necrosi enzimatica del grasso in una pancreatite grave, un altro campo della stessa lesione, EE a basso
    ingrandimento. A destra e in basso grandi aree rosa pallide e senza nuclei sono il grasso necrotico. A sinistra il
    tessuto connettivo con piccoli vasi e cellule infiammatorie confina con le aree necrotiche lungo un bordo violaceo
    di infiammazione.
  en: >-
    Enzymatic fat necrosis in severe pancreatitis, another field of the same lesion, H&E at low power. Large pale
    pink areas without nuclei at the right and bottom are the necrotic fat. At the left, connective tissue with small
    vessels and inflammatory cells borders the necrotic areas along a purple rim of inflammation.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a destra e in basso ampie aree rosa pallide e granulari senza nuclei; a sinistra
    connettivo rosa con piccoli vasi e cellule infiammatorie; tra le due zone una sottile banda violacea.
  en: >-
    H&E micrograph: broad pale pink, granular areas without nuclei at the right and bottom; pink connective tissue with
    small vessels and inflammatory cells at the left; a thin purple band between the two zones.
