caption:
  it: >-
    Carcinoide bronchiale, alto ingrandimento, H&E, biopsia broncoscopica di una massa endobronchiale liscia. Cellule
    uniformi in cordoni e nidi, separate da setti vascolari sottili.
  en: >-
    Bronchial carcinoid, high power, H&E, bronchoscopic biopsy of a smooth endobronchial mass. Uniform cells in cords
