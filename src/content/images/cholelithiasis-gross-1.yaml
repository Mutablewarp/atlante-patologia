lookFor:
  it: Conta i calcoli e osserva che sono numerosi, piccoli, simili tra loro e di colore giallastro, con facce piatte dove si toccano.
  en: Note that the stones are numerous, small, alike and yellowish, with flat facets where they touch.
caption:
  it: >-
    Colecisti aperta con molti calcoli, vista dall'alto in una bacinella. Guarda prima la parete rossa della colecisti,
    che fa da contenitore, poi il mucchio di calcoli al suo interno. I calcoli sono numerosi, di dimensioni simili e di
    colore giallastro; l'autore li ritiene probabilmente di colesterolo. Alcuni hanno facce piatte, segno che si sono
    modellati a vicenda.
  en: >-
    Opened gallbladder packed with many stones, seen from above in a dish. Look first at the red gallbladder wall that
    holds them, then at the heap of stones inside. The stones are numerous, similar in size and yellowish; the author
    considers them probably cholesterol stones. Some have flat faces, a sign that they shaped one another.
alt:
  it: >-
    Una colecisti aperta, con la parete di colore rosso, adagiata in una bacinella reniforme bianca su un piano di legno;
    all'interno decine di piccoli calcoli giallo chiaro, ammassati.
  en: >-
    An opened gallbladder with a red wall lying in a white kidney-shaped dish on a wooden surface; inside are dozens of
    small pale-yellow stones packed together.
