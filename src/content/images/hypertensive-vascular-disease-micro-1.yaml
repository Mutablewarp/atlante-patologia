lookFor:
  it: "Cerca a sinistra del glomerulo la parete arteriolare: è rosa, omogenea e vitrea, senza nuclei né struttura."
  en: "Find the arteriolar wall to the left of the glomerulus: it is pink, homogeneous and glassy, without nuclei or structure."
caption:
  it: >-
    Corteccia renale in EE ad alto ingrandimento. Al centro un glomerulo con capillari pervi e spazio di Bowman
    chiaro; a sinistra, accanto ai tubuli, una arteriola con la parete sostituita da materiale rosa, omogeneo e
    vitreo (ialino) che ne restringe il lume. È il quadro dell'arteriolosclerosi ialina dell'ipertensione cronica.
  en: >-
    Renal cortex, H&E at high power. A glomerulus with open capillaries and a clear Bowman space lies in the center;
    on the left, beside the tubules, an arteriole has its wall replaced by pink, homogeneous, glassy (hyaline) material
    that narrows the lumen. This is the picture of hyaline arteriolosclerosis of chronic hypertension.
alt:
  it: >-
    Micrografia rosa-violacea di corteccia renale: glomerulo grande al centro, tubuli intorno e, a sinistra, una banda
    rosa omogenea e vitrea che corrisponde alla parete ispessita di un'arteriola.
  en: >-
    Pink-purple micrograph of renal cortex: a large glomerulus in the center, tubules around it and, on the left, a
    homogeneous glassy pink band that is the thickened wall of an arteriole.
