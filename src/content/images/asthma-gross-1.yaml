lookFor:
  it: "Guarda il volume e la superficie del polmone: è pallido, gonfio e senza segni di consolidamento."
  en: "Look at the volume and surface of the lung: it is pale, bulky and shows no sign of consolidation."
caption:
  it: >-
    Polmone di un paziente morto in stato di male asmatico, visto dalla superficie pleurica. Osserva il parenchima
    voluminoso e chiaro, che resta disteso: è l'iperinsufflazione dovuta all'aria intrappolata a valle delle vie aeree
    ostruite. Il pigmento nero in tracce lineari segue i setti tra i lobuli.
  en: >-
    Lung of a patient who died in status asthmaticus, seen from the pleural surface. Note the bulky, pale parenchyma
    that stays distended: this is hyperinflation from air trapped beyond the obstructed airways. The black pigment in
    thin lines follows the septa between lobules.
alt:
  it: >-
    Fotografia macroscopica di un polmone su fondo blu: organo allungato, di colore rosa chiaro, con superficie liscia e
    lucida, sottili linee nere tra i lobuli e una zona più scura e rossastra in basso a sinistra.
  en: >-
    Gross photograph of a lung on a blue background: an elongated, light pink organ with a smooth, shiny surface, thin
    black lines between lobules and a darker, reddish area at the lower left.
