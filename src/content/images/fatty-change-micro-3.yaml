lookFor:
  it: "Confronta quanta parte di ciascun frustolo è rossa: puntini sparsi in (a), rosso quasi continuo in (b)."
  en: "Compare how much of each core is red: scattered dots in (a), almost continuous red in (b)."
caption:
  it: >-
    Oil Red O su sezioni congelate di agobiopsie epatiche di due adolescenti con steatosi epatica non alcolica
    (NAFLD), a piccolo ingrandimento (×100 secondo la fonte); (a) e (b) vengono da due pazienti diversi. L'Oil Red O
    è un colorante liposolubile: passa nei lipidi neutri e li tinge di rosso, mentre i nuclei restano blu. Guarda
    prima (a): il rosso è scarso, una fine punteggiatura su tutto il frustolo con qualche goccia più grossa qua e là
    (freccia); il grasso è poco. Poi passa a (b): qui il rosso domina, con gocce grosse e rotonde, molte fuse in
    chiazze rosse, che occupano gran parte del frustolo (freccia); il grasso è massiccio. Perché proprio la sezione
    congelata? I solventi usati per allestire le sezioni in paraffina sciolgono il grasso, ed è per questo che in EE
    le stesse gocce appaiono come buchi vuoti. Un frammento della biopsia va quindi congelato e tagliato al criostato
    anziché incluso in paraffina, e la colorazione va prevista al momento del prelievo: su un blocchetto di paraffina
    non si può più fare. Attenzione: la banda sfocata lungo il lato destro di (a) è un artefatto della sezione, non
    una lesione.
  en: >-
    Oil red O on frozen sections of liver needle biopsies from two teenagers with nonalcoholic fatty liver disease,
    at low power (×100 in the source); (a) and (b) come from two different patients. Oil red O is a fat-soluble dye:
    it moves into neutral lipid and turns it red, while the nuclei stay blue. Look at (a) first: the red is sparse, a
    fine stippling over the whole core with a bigger drop here and there (arrow); there is little fat. Then move to
    (b): here red dominates, with big round drops, many fused into red patches, taking up most of the core (arrow);
    the fat load is massive. Why a frozen section? The solvents used to make paraffin sections dissolve the fat,
    which is why the same droplets are only empty holes on H&E. A piece of the biopsy must therefore be frozen and cut
    on a cryostat instead of being embedded in paraffin, and the stain has to be planned when the biopsy is taken:
    once the tissue is in a paraffin block it is too late. Pitfall: the hazy band along the right side of (a) is a
    section artefact, not a lesion.
alt:
  it: >-
    Due micrografie affiancate di frammenti di biopsia epatica colorati con Oil Red O su fondo azzurro chiaro: a
    sinistra (a) tessuto con nuclei blu e una fine punteggiatura rossa, con qualche goccia rossa più grossa e una
    freccia nera; a destra (b) tessuto gremito di grosse gocce rosse rotonde, molte fuse tra loro, con una freccia
    nera; in basso a destra di ogni pannello una barra di scala nera.
  en: >-
    Two side-by-side micrographs of liver biopsy fragments stained with oil red O on a pale blue background: on the
    left (a) tissue with blue nuclei and a fine red stippling, with occasional bigger red drops and a black arrow; on
    the right (b) tissue crowded with big round red drops, many fused together, with a black arrow; a black scale bar
    at the lower right of each panel.
