# License check (2026-11-07): same article and licence as dystrophic-calcification-gross-2 (Sumi et al., Thoracic
# Cancer 2020, PMC7605996, CC BY 4.0 in the Europe PMC full text; the Figure 3 legend credits no third party). Histology
# only; nothing identifies the patient. This panel (b, H&E) and panel (c, von Kossa, dystrophic-calcification-micro-4)
# show the same nodule at the same whole-mount power, so the two share one group and the viewer offers a stain switch.
# Facts in the caption checked against the article (Fig. 3 legend, case report) and rubin-8e ch. 22 p. 965 (calcium is
# deep blue with haematoxylin, black with von Kossa).
