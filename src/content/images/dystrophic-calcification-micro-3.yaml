lookFor:
  it: "Confronta il blu-viola del nodulo con il rosa dell'orlo e del polmone, poi passa alla von Kossa."
  en: "Compare the blue-purple of the nodule with the pink of the rim and the lung, then switch to von Kossa."
caption:
  it: >-
    Lo stesso nodulo del polmone in ematossilina-eosina, in visione panoramica del vetrino (piccolissimo
    ingrandimento). Parti dai bordi: intorno al nodulo il polmone conserva il suo disegno alveolare, chiaro e a merletto,
    e un orlo rosa, verosimilmente di tessuto fibroso, separa la lesione dal parenchima. Dentro, il nodulo è colorato
    di blu-viola, più scuro a chiazze irregolari, con una zona centrale più chiara e sfilacciata. Quel colore è
    l'indizio: i sali di calcio legano l'ematossilina e appaiono basofili, perciò un'area necrotica che diventa blu
    invece che rosa deve farti sospettare una calcificazione. Nota però che alcune zone, per esempio la parte in basso a
    sinistra del nodulo, tendono al rosa-magenta: in EE quanto calcio ci sia, e dove, resta difficile da giudicare. Secondo gli
    autori il tessuto era necrosi coagulativa senza cellule tumorali vitali. Ora passa alla sezione colorata con von
    Kossa dello stesso nodulo e guarda dove si trova davvero il calcio.
  en: >-
    The same lung nodule on haematoxylin and eosin, as a whole-mount (loupe) view of the slide. Start at the edges:
    around the nodule the lung keeps its pale, lacy alveolar pattern, and a pink rim, most likely fibrous tissue, sets
    the lesion apart from the parenchyma. Inside, the nodule is stained blue-purple, darker in irregular patches, with a
    paler, frayed zone in the centre. That colour is the clue: calcium salts bind haematoxylin and look basophilic, so
    a necrotic area that turns blue instead of pink should make you suspect calcification. Note, though, that some
    zones, such as the lower left part of the nodule, lean towards pink-magenta: on H&E, how much calcium there is, and where, stays
    hard to judge. According to the authors the tissue was coagulative necrosis with no viable tumour cells. Now switch
    to the von Kossa section of the same nodule and see where the calcium really is.
alt:
  it: >-
    Sezione panoramica in ematossilina-eosina: un grande nodulo lobulato blu-viola, con il centro più chiaro e
    sfilacciato e la parte in basso a sinistra più rosa, circondato da un orlo rosa e da tessuto polmonare rosa chiaro a
    merletto.
  en: >-
    Low-power whole-mount H&E section: a large, lobulated blue-purple nodule with a paler, frayed centre and a pinker
    lower left part, surrounded by a pink rim and by pale pink, lacy lung tissue.
