lookFor:
  it: Parti dagli alveoli a sinistra, con i globuli rossi negli spazi aerei, poi segui l'infiammazione densa verso destra fino al vaso in basso a destra.
  en: Start at the alveoli on the left, with red cells in the air spaces, then follow the dense inflammation to the right and down to the vessel at the lower right.
caption:
  it: >-
    Biopsia polmonare in granulomatosi con poliangioite (una vasculite associata agli ANCA), EE a medio ingrandimento.
    A sinistra gli alveoli contengono molti globuli rossi. Verso destra il parenchima è sostituito da un infiltrato
    infiammatorio denso e polimorfo, con aree di cellule più grandi, simili a istiociti. In basso a destra c'è un vaso
    con la parete circondata dall'infiammazione. Il quadro mostra che la malattia colpisce il polmone sia con
    emorragia sia con un'infiammazione aggressiva. A maggior ingrandimento si osservano i singoli tipi cellulari.
  en: >-
    Lung biopsy in granulomatosis with polyangiitis (an ANCA-associated vasculitis), H&E at medium power. At the left
    the alveoli contain many red cells. Toward the right the lung tissue is replaced by a dense, mixed inflammatory
    infiltrate, with areas of larger histiocyte-like cells. At the lower right a vessel has its wall surrounded by
    inflammation. The picture shows the lung hit by both hemorrhage and aggressive inflammation. Look at the single
    cell types at higher power.
alt:
  it: >-
    Micrografia in ematossilina-eosina di polmone: a sinistra alveoli con globuli rossi negli spazi aerei, al centro e a
    destra un denso infiltrato di cellule infiammatorie, in basso a destra un vaso con lume pieno di sangue.
  en: >-
    H&E micrograph of lung: at the left alveoli with red cells in the air spaces, in the center and right a dense
    infiltrate of inflammatory cells, at the lower right a vessel with a blood-filled lumen.
