lookFor:
  it: "Parti dal grasso normale in alto a sinistra, poi cerca l'area rosa pallida e senza nuclei in basso e il bordo violaceo di infiammazione che la circonda."
  en: "Start from the normal fat at the upper left, then find the pale pink area without nuclei at the bottom and the purple rim of inflammation around it."
caption:
  it: >-
    Necrosi enzimatica del grasso in una pancreatite grave, EE a basso ingrandimento. In alto a sinistra gli adipociti
    sono normali: cellule vuote con una sottile parete. In basso a destra il grasso è sostituito da un'area rosa pallida,
    amorfa e senza nuclei, dove i contorni degli adipociti sono ancora in parte riconoscibili. Tra le due zone corre una
    banda violacea di cellule infiammatorie.
  en: >-
    Enzymatic fat necrosis in severe pancreatitis, H&E at low power. At the upper left the adipocytes are normal: empty
    cells with a thin wall. At the lower right the fat is replaced by a pale pink, amorphous area without nuclei, where
    the outlines of the fat cells can still be partly made out. Between the two zones runs a purple band of
    inflammatory cells.
alt:
  it: >-
    Micrografia in ematossilina-eosina: in alto a sinistra tessuto adiposo normale con cellule vuote; in basso a destra
    una grande area rosa pallida e granulare senza nuclei, separata dal grasso da una banda violacea di cellule
    infiammatorie.
  en: >-
    H&E micrograph: normal fat with empty cells at the upper left; a large pale pink, granular area without nuclei at
    the lower right, separated from the fat by a purple band of inflammatory cells.
