caption:
  it: >-
    Biopsia peritoneale in un caso di pancreatite acuta in età adolescenziale: è la forma enzimatica della necrosi del tessuto
    adiposo (steatonecrosi), quella in cui lipasi e altri enzimi pancreatici fuoriusciti dal pancreas digeriscono il
    grasso circostante. Parti dall'insieme: il campo è diviso in tre fasce. In alto il grasso è morto: gli adipociti
    non hanno più nuclei e restano solo profili sfumati, pallidi e rosati, come "fantasmi" delle cellule (la
    struttura si intravede ma la cellula è perduta). Al centro corre una fascia di infiammazione acuta e cronica, con
    neutrofili, linfociti, plasmacellule e istiociti a citoplasma vacuolato che iniziano a rimuovere i lipidi
    liberati. In basso gli adipociti conservano contorni netti, con il lume vuoto e setti sottili. In questa biopsia
    non si vedono depositi di saponi di calcio: quando ci sono appaiono come materiale amorfo blu-violaceo
    (basofilo) ai margini delle isole necrotiche e corrispondono, a occhio nudo, alle macchie bianco-gesso della
    saponificazione. Il quadro clinico è istruttivo: alla TC questi micronoduli peritoneali avevano simulato una
    carcinosi.
  en: >-
    Peritoneal biopsy from an adolescent with acute pancreatitis: the enzymatic form of fat necrosis, in which lipase
    and other pancreatic enzymes that have escaped from the gland digest the surrounding fat. Start with the whole
    field, which falls into three bands. At the top the fat is dead: the adipocytes have lost their nuclei and only
    blurred, pale pink outlines remain, "ghosts" of the cells (the architecture is still faintly visible but the cells
    are gone). Across the middle runs a band of acute and chronic inflammation, with neutrophils, lymphocytes, plasma
    cells and histiocytes with vacuolated cytoplasm that start to clear the released lipid. At the bottom the
    adipocytes keep sharp outlines, with empty lumens and thin septa. No calcium soap deposits are seen in this
    biopsy: when present they appear as amorphous blue-purple (basophilic) material at the edges of the necrotic
    islands and match the chalky white spots of saponification seen with the naked eye. The clinical story is
    instructive: on CT these small peritoneal nodules had mimicked carcinomatosis.
alt:
  it: >-
    Micrografia in ematossilina-eosina: nella metà superiore materiale rosa pallido, amorfo e privo di nuclei con
    contorni cellulari sfumati; al centro una fascia diagonale ricca di piccoli nuclei scuri di cellule
    infiammatorie; in basso spazi chiari rotondeggianti separati da setti sottili.
  en: >-
    Haematoxylin and eosin micrograph: in the upper half pale pink, amorphous material without nuclei and with
    blurred cell outlines; across the middle a diagonal band crowded with small dark nuclei of inflammatory cells;
    at the bottom rounded clear spaces separated by thin septa.
