lookFor:
  it: "Parti dal lato destro, dove gli alveoli sono aperti, e attraversa il margine verso sinistra."
  en: "Start at the right side, where the alveoli are open, and cross the edge toward the left."
caption:
  it: >-
    Polmone collassato a basso ingrandimento. A destra gli alveoli sono aperti, con pareti sottili e spazi ariosi. A
    sinistra il tessuto è collassato: le pareti alveolari sono schiacciate l'una contro l'altra e gli spazi aerei
    restano solo come fessure sottili, per cui il parenchima appare denso e cellulare.
  en: >-
    Collapsed lung at low power. On the right the alveoli are open, with thin walls and airy spaces. On the left the
    tissue is collapsed: the alveolar walls are pressed against each other and the air spaces remain only as thin
    slits, so the parenchyma looks dense and cellular.
alt:
  it: >-
    Micrografia rosa-viola a basso ingrandimento: la metà sinistra è un tessuto denso con sottili fessure, la metà
    destra mostra ampi spazi aerei chiari delimitati da pareti alveolari sottili.
  en: >-
    Pink-purple low-power micrograph: the left half is dense tissue with thin slits, the right half shows wide, pale
    air spaces bounded by thin alveolar walls.
