orientation:
  it: "Superficie dell'epitelio in alto, stroma in basso; epitelio normale a sinistra, lesione a destra."
  en: "Epithelial surface at the top, stroma at the bottom; normal epithelium on the left, the lesion on the right."
lookFor:
  it: "Confronta le due metà: a sinistra le cellule maturano e si appiattiscono salendo; a destra nuclei scuri e affollati e coilociti arrivano negli strati alti."
  en: "Compare the two halves: on the left the cells mature and flatten as they rise; on the right crowded dark nuclei and koilocytes reach the upper layers."
caption:
  it: >-
    Epitelio cervicale con CIN 2 (displasia moderata, che rientra nelle lesioni squamose intraepiteliali di alto grado,
    HSIL), EE a medio ingrandimento. La stessa lesione compare nelle altre immagini della serie con l'immunoistochimica
    per Ki-67 e per p16, quindi puoi passare da una vista all'altra. Parti dal piccolo ingrandimento e confronta le due
    metà del campo. A sinistra l'epitelio è normale: sullo stroma poggia una fila sottile di piccole cellule basali e,
    salendo, le cellule acquistano citoplasma roseo, il nucleo si rimpicciolisce e vicino alla superficie si
    appiattiscono. A destra la metà inferiore è gremita di cellule piccole, scure e affollate, con poco citoplasma, e
    nuclei più grandi e più scuri si ritrovano fino alla superficie. Poi sali di ingrandimento sulla parte destra. Negli
    strati alti diverse cellule sono coilociti, il segno visibile dell'infezione da HPV: un alone chiaro e netto
    circonda un nucleo scuro e ingrandito. Un lieve rischiaramento attorno al nucleo può comparire anche nell'epitelio
    normale, quindi cerca anche le atipie del nucleo. Una mitosi si trova ben al di sopra dello strato basale, oltre la
    metà dello spessore, mentre nell'epitelio normale le cellule si dividono solo vicino alla base. Infine segui il
    limite inferiore dell'epitelio: è liscio e continuo, quindi la lesione è ancora intraepiteliale. Attenzione: la
    diagnosi di CIN 2 si è basata sulle immunocolorazioni e su altri campi dello stesso prelievo, dove le mitosi salivano
    fino a metà spessore o più in alto; l'autore dell'immagine osserva che questo campo, da solo, avrebbe fatto pensare
    a una CIN 1. Il grado si assegna sull'area peggiore dell'intera lesione, e p16 e Ki-67 aiutano quando il quadro in
    EE è dubbio.
  en: >-
    Cervical epithelium with CIN 2 (moderate dysplasia, one of the high-grade squamous intraepithelial lesions, HSIL), H&E
    at medium power. The same lesion appears in the other images of this set immunostained for Ki-67 and for p16, so
    you can switch between the three views. Start at low power and compare the two halves of the field. On the left the
    epithelium is normal: a thin row of small basal cells rests on the stroma and, as the cells rise, they gain pink
    cytoplasm, their nuclei shrink and near the surface they flatten. On the right the lower half is packed with small,
    dark, crowded cells with scant cytoplasm, and larger, darker nuclei persist up to the surface. Then move up in power
    on the right. In the upper layers several cells are koilocytes, the visible mark of HPV infection: a sharp clear
    halo surrounds a dark, enlarged nucleus. Slight clearing around the nucleus can also occur in normal epithelium, so
    look for the nuclear atypia too. A mitosis lies well above the basal layer, more than halfway up the epithelium,
    whereas in normal epithelium cells divide only near the base. Finally follow the lower border of the epithelium: it
    is smooth and continuous, so the lesion is still intraepithelial. Pitfall: the diagnosis of CIN 2 rested on the
    immunostains and on other fields of the same specimen, where mitoses rose to mid-height or higher; the author of the
    image notes that this field alone would have suggested CIN 1. The grade goes by the worst area of the whole lesion,
    and p16 and Ki-67 help when the H&E picture is borderline.
alt:
  it: >-
    Micrografia in ematossilina-eosina di una striscia di epitelio squamoso sopra uno stroma rosa, con la superficie in
    alto. A sinistra l'epitelio è rosa chiaro, con una sottile fila basale scura e cellule che si appiattiscono verso la
    superficie; a destra è più affollato, con molti nuclei scuri nella metà inferiore e cellule sparse con un alone
    chiaro nella metà superiore. In alto a sinistra, sopra la superficie, c'è un filamento di muco con alcune piccole
    cellule scure.
  en: >-
    H&E micrograph of a strip of squamous epithelium over pink stroma, surface at the top. On the left the epithelium is
    pale pink, with a thin dark basal row and cells that flatten towards the surface; on the right it is more crowded,
    with many dark nuclei in its lower half and scattered cells with clear halos in its upper half. A strand of mucus
    with a few small dark cells lies above the surface at the upper left.
