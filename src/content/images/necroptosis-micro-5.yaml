caption:
  it: >-
    Lo stesso esperimento sugli organoidi visto al microscopio elettronico a trasmissione, dopo 6 ore (riga in alto) e
    12 ore (riga in basso); le frecce colorate sono degli autori. CTR: un colangiocita sano, con nucleo ovale, cromatina
    finemente dispersa e profilo cellulare continuo. T/S, TNF-α più Smac-mimetico, cioè apoptosi: le cellule sono più
    piccole e più scure perché il citoplasma si è addensato (frecce verde scuro), la cromatina si condensa in zolle
    compatte (picnosi, freccia rosa), il nucleo si spezza in frammenti (frecce viola) e la superficie forma bolle
    (blebbing, freccia gialla); a 12 ore il campo è pieno di frammenti compatti e chiusi da membrana, alcuni con pezzi di
    nucleo: i corpi apoptotici. T/S/Z, lo stesso più l'inibitore delle caspasi zVAD-fmk, cioè necroptosi: a 6 ore il
    nucleo resta rotondo, senza zolle di cromatina (freccia bianca), mentre il citoplasma si riempie di vacuoli chiari
    (freccia verde chiaro) e di mitocondri densi e condensati (frecce rosse); a 12 ore il nucleo è pallido e sta
    svanendo (cariolisi, freccia blu scuro) e la membrana plasmatica ha ceduto (freccia azzurra), così il contenuto della
    cellula si riversa all'esterno. Da ricordare: l'apoptosi impacchetta la cellula in frammenti chiusi, pronti per i
    fagociti; la necroptosi finisce con una cellula scoppiata, ed è per questo che richiama infiammazione. In un tessuto,
    al microscopio ottico, questa cellula scoppiata sembrerebbe una qualsiasi cellula necrotica: per riconoscere la
    necroptosi servono marcatori come la MLKL fosforilata. Attenzione: organoidi in coltura, non una biopsia.
  en: >-
    The same organoid experiment seen under the transmission electron microscope, after 6 hours (top row) and 12 hours
    (bottom row); the coloured arrows are the authors'. CTR: a healthy cholangiocyte with an oval nucleus, finely
    dispersed chromatin and a continuous cell outline. T/S, TNF-α plus a Smac mimetic, that is apoptosis: the cells are
    smaller and darker because the cytoplasm has condensed (dark-green arrows), chromatin packs into dense clumps
    (pyknosis, pink arrow), the nucleus breaks into fragments (purple arrows) and the surface bulges into blebs (yellow
    arrow); by 12 hours the field is crowded with compact, membrane-bound fragments, some holding pieces of nucleus: the
    apoptotic bodies. T/S/Z, the same plus the caspase inhibitor zVAD-fmk, that is necroptosis: at 6 hours the nucleus
    stays round with no clumped chromatin (white arrow), while the cytoplasm fills with clear vacuoles (light-green
    arrow) and dense, condensed mitochondria (red arrows); at 12 hours the nucleus is pale and fading (karyolysis,
    dark-blue arrow) and the plasma membrane has given way (light-blue arrow), so the cell's contents spill outside.
    Key point: apoptosis packs the cell into closed fragments ready for phagocytes; necroptosis ends with a burst cell,
    which is why it calls in inflammation. In a tissue, under the light microscope, this burst cell would look like any
    other necrotic cell: telling necroptosis apart takes markers such as phosphorylated MLKL. Note that these are
    organoids in culture, not a biopsy.
alt:
  it: >-
    Sei micrografie elettroniche in scala di grigi in due righe (6 ore e 12 ore) e tre colonne (CTR, T/S, T/S/Z), con
    barre di scala da 2 µm. In CTR una cellula allungata con un grande nucleo ovale e uniforme. In T/S, a 6 ore, cellule
    piccole e scure con cromatina in zolle nere (frecce rosa, viola, gialla e verde scuro); a 12 ore molti frammenti
    rotondi e densi (frecce viola e verde scuro). In T/S/Z, a 6 ore, una cellula chiara con un grande nucleo rotondo e un
    citoplasma pieno di vacuoli bianchi e di puntini neri; a 12 ore una cellula con nucleo pallido e membrana
    interrotta, indicati da frecce blu scuro e azzurra.
  en: >-
    Six greyscale electron micrographs in two rows (6 hours and 12 hours) and three columns (CTR, T/S, T/S/Z), with 2 µm
    scale bars. In CTR an elongated cell with a large, even, oval nucleus. In T/S, at 6 hours, small dark cells with
    chromatin in black clumps (pink, purple, yellow and dark-green arrows); at 12 hours many dense round fragments
    (purple and dark-green arrows). In T/S/Z, at 6 hours, a pale cell with a large round nucleus and a cytoplasm full of
    white vacuoles and black dots; at 12 hours a cell with a pale nucleus and a broken membrane, marked by dark-blue and
    light-blue arrows.
