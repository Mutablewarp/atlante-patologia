lookFor:
  it: Segui gli strati dall'alto in basso e cerca dove il tessuto diventa un'area densa di cellule allungate.
  en: Follow the layers from top to bottom and find where the tissue turns into a dense area of elongated cells.
caption:
  it: >-
    Tumore stromale gastrointestinale, EE a basso ingrandimento. In alto c'è la mucosa con le sue ghiandole; sotto, una
    banda rosa intenso di muscolare. In basso occupa il campo un tumore denso e cellulato, fatto di cellule fusate
    disposte in fasci che si intrecciano. Il tumore sta nella parete, sotto la mucosa, e non nell'epitelio.
  en: >-
    Gastrointestinal stromal tumor, H&E at low power. At the top is the mucosa with its glands; below it, a deep pink
    band of muscle. The lower part of the field is filled by a dense, cellular tumor made of spindle cells in
    interlacing bundles. The tumor lies in the wall, beneath the mucosa, not in the epithelium.
alt:
  it: >-
    Micrografia in ematossilina-eosina: in alto mucosa con ghiandole violacee, al centro una banda rosa intenso di
    fibre muscolari, in basso un'ampia area violacea fitta di cellule fusate in fasci.
  en: >-
    H&E micrograph: purple mucosa with glands at the top, a deep pink band of muscle fibers in the middle, and a broad
    purple area packed with spindle cells in bundles in the lower part.
