lookFor:
  it: "Cerca la ghiandola con nuclei grandi e irregolari, circondata da linfociti, e confrontala con le cellule piccole e scure intorno."
  en: "Find the gland with large, irregular nuclei, surrounded by lymphocytes, and compare it with the small dark cells around it."
caption:
  it: >-
    Adenocarcinoma della colecisti in EE, a forte ingrandimento, in un pezzo di colecistectomia. Al centro a destra una
    ghiandola neoplastica ha un lume e un rivestimento di cellule con nuclei grandi, vescicolosi e di forma irregolare,
    molto più grandi dei piccoli linfociti scuri che la circondano. Il tumore si trova nel connettivo rosa della parete,
    tra fasci di collagene, e non nella mucosa.
  en: >-
    Gallbladder adenocarcinoma on H&E at high power, in a cholecystectomy specimen. At center right a neoplastic gland
    has a lumen and a lining of cells with large, vesicular, irregular nuclei, much bigger than the small dark
    lymphocytes around it. The tumor lies in the pink connective tissue of the wall, between collagen bundles, not in
    the mucosa.
alt:
  it: >-
    Micrografia in ematossilina-eosina: una ghiandola con lume chiaro, rivestita da cellule violacee con nuclei grandi,
    circondata da molti piccoli nuclei scuri rotondi e da connettivo rosa fibroso.
  en: >-
    H&E micrograph: a gland with a clear lumen, lined by purple cells with large nuclei, surrounded by many small dark
    round nuclei and pink fibrous connective tissue.
