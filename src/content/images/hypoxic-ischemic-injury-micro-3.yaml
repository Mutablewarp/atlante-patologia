lookFor:
  it: "Confronta i due neuroni: granuli bluastri e nucleo chiaro a sinistra, citoplasma rosso e liscio con nucleo scuro e sfumato a destra."
  en: "Compare the two neurons: bluish granules and a pale nucleus on the left, smooth red cytoplasm and a dark, blurred nucleus on the right."
caption:
  it: >-
    Talamo all'autopsia, EE a forte ingrandimento: due campi affiancati, con le scritte in inglese aggiunte
    dall'autore. A sinistra la sostanza grigia normale: un neurone con citoplasma finemente granuloso, blu-violaceo (la
    sostanza di Nissl) e un nucleo grande e chiaro, affiancato dai piccoli nuclei rotondi e scuri di due cellule
    gliali. A destra un infarto ischemico di circa 24 ore: il neurone ha perso le granulazioni, il citoplasma è
    diventato liscio e di un rosa intenso e uniforme, e il nucleo è ridotto a un'ombra scura e sfumata. È un «neurone
    rosso», il segno al microscopio ottico che la cellula è morta. Il colore ha una causa semplice: l'ematossilina
    tinge di blu l'RNA, e quando la cellula muore l'RNA viene degradato, così prevale il rosa dell'eosina, come in ogni
    cellula necrotica. Intorno sono già arrivati neutrofili dal nucleo lobato, la
    risposta infiammatoria acuta alla necrosi, e il neuropilo appare lasso ed edematoso. In un infarto cerebrale i
    neuroni rossi compaiono se il paziente sopravvive circa 6–24 ore, mentre i neutrofili affluiscono soprattutto tra
    il primo e il terzo giorno. Neurone granuloso con nucleo chiaro = vivo; neurone liscio e rosso con nucleo scuro =
    morto.
  en: >-
    Thalamus at autopsy, H&E at high power: two fields side by side, with English labels added by the author. On the
    left, normal grey matter: a neuron with finely granular, bluish-purple cytoplasm (the Nissl substance) and a large,
    pale nucleus, flanked by the small, round, dark nuclei of two glial cells. On the right, an ischemic infarct about
    24 hours old: the neuron has lost its granules, its cytoplasm has turned a smooth, uniform deep pink and its
    nucleus is reduced to a dark, blurred shadow. This is a "red neuron", the light-microscopy sign that the cell has
    died. The colour has a simple cause: hematoxylin dyes RNA blue, and once the cell dies its RNA is broken down, so
    the pink of eosin takes over, as in any necrotic cell. Around it,
    neutrophils with lobed nuclei have already arrived, the acute inflammatory response to necrosis, and the neuropil
    looks loose and edematous. In a brain infarct, red neurons appear when the patient survives about 6–24 hours,
    whereas neutrophils move in mostly between the first and the third day. Granular neuron with a pale nucleus =
    alive; smooth red neuron with a dark nucleus = dead.
alt:
  it: >-
    Due micrografie in ematossilina-eosina affiancate, con scritte nere in inglese. A sinistra, «Normal»: un neurone
    con citoplasma granuloso violaceo e nucleo ovale chiaro, tra due piccoli nuclei rotondi blu scuro. A destra,
    «Infarction»: un neurone tondeggiante con citoplasma liscio rosa intenso e nucleo scuro e sfumato; in alto a
    destra cellule con nucleo lobato scuro indicate come «Neutrophils».
  en: >-
    Two H&E micrographs side by side with black English labels. Left, labelled Normal: a neuron with granular purple
    cytoplasm and a pale oval nucleus, between two small, round, dark blue nuclei. Right, labelled Infarction: a
    rounded neuron with smooth, deep pink cytoplasm and a dark, blurred nucleus; at the upper right, cells with lobed
    dark nuclei labelled Neutrophils.
