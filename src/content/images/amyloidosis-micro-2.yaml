lookFor:
  it: "Cerca la birifrangenza: le pareti vasali brillano di giallo, verde e arancio su fondo scuro."
  en: "Look for birefringence: the vessel walls glow yellow, green and orange against a dark background."
caption:
  it: >-
    Amiloidosi gastrica, rosso Congo tra polarizzatori incrociati, a medio ingrandimento. Il fondo è scuro e il tessuto
    normale quasi non si vede. Le pareti dei vasi, invece, brillano di giallo, verde e arancio: è la birifrangenza
    dell'amiloide colorata con rosso Congo. In questa foto il verde mela classico si mescola a toni gialli e arancio,
    quindi conta la comparsa di luce colorata dove il resto del tessuto resta scuro.
  en: >-
    Gastric amyloidosis, Congo red between crossed polarizers, at medium power. The background is dark and normal
    tissue is barely visible. The vessel walls, however, glow yellow, green and orange: this is the birefringence of
    amyloid stained with Congo red. Here the classic apple green is mixed with yellow and orange tones, so what counts
    is colored light appearing where the rest of the tissue stays dark.
alt:
  it: >-
    Micrografia in luce polarizzata su fondo scuro blu-verde: anelli e fasce irregolari di luce gialla, verde e
    arancione nelle pareti di tre vasi, mentre il tessuto circostante resta scuro.
  en: >-
    Polarized-light micrograph on a dark blue-green background: irregular rings and bands of yellow, green and orange
    light in the walls of three vessels, while the surrounding tissue stays dark.
