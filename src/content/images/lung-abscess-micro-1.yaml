lookFor:
  it: "Parti dal lato sinistro, pieno di cellule sparse, e vai verso destra fino alla banda di tessuto rosa che lo delimita."
  en: "Start at the left side, full of scattered cells, and move right to the band of pink tissue that borders it."
caption:
  it: >-
    Ascesso polmonare a basso ingrandimento. A sinistra e al centro il tessuto è sostituito da un materiale
    necrotico liquefatto, pieno di granulociti neutrofili con nuclei scuri e piccoli spazi vuoti. A destra una sottile
    banda rosa di tessuto fibroso, con alcuni nuclei allungati, delimita la lesione come una capsula.
  en: >-
    Lung abscess at low power. On the left and in the middle the tissue is replaced by liquefied necrotic material
    packed with neutrophils, seen as dark nuclei, and small empty spaces. On the right a thin pink band of fibrous
    tissue with a few elongated nuclei bounds the lesion like a capsule.
alt:
  it: >-
    Micrografia a basso ingrandimento: una vasta area violacea con numerosi piccoli nuclei scuri sparsi e spazi
    chiari, e in alto a destra una banda rosa di tessuto fibroso lungo il margine.
  en: >-
    Low-power micrograph: a broad purple area with many small scattered dark nuclei and clear spaces, and at the
    upper right a pink band of fibrous tissue along the edge.
