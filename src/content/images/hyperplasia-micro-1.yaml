group: endometrial-hyperplasia-uthman
stain: H&E
magnification: low power
caption:
  it: >-
    Iperplasia endometriale senza atipie, EE a piccolo ingrandimento. Parti dal rapporto tra ghiandole e stroma: le
    ghiandole sono così numerose da toccarsi quasi l'una con l'altra, e tra loro resta solo un sottile setto di stroma
    cellulato. Poi guarda la forma: accanto a ghiandole tubulari ce ne sono di ramificate, dal profilo irregolare, e
    alcune dilatate con secreto rosa nel lume. Solo a questo punto passa all'epitelio: è cilindrico,
    pseudostratificato, con nuclei allungati e uniformi, cioè privo di atipie citologiche. È l'esempio classico di
    iperplasia patologica da stimolo ormonale: gli estrogeni non bilanciati dal progesterone (per esempio cicli
    ripetuti senza ovulazione, oppure obesità) fanno proliferare le ghiandole, e la proliferazione dipende ancora dallo
    stimolo. Il dato da cercare è l'atipia nucleare: è questa, più dell'affollamento delle ghiandole, a segnalare il
    rischio di carcinoma endometrioide.
  en: >-
    Endometrial hyperplasia without atypia, H&E at low power. Start with the gland-to-stroma ratio: the glands are so
    numerous that they almost touch, leaving only thin strips of cellular stroma between them. Then look at their
    shape: next to tubular glands there are branched, irregular ones, and some are dilated with pink secretion in the
    lumen. Only then move to the epithelium: it is columnar and pseudostratified, with elongated, uniform nuclei, so
    there is no cytological atypia. This is the classic pathological hyperplasia driven by a hormone: oestrogen not
    balanced by progesterone (for example repeated cycles without ovulation, or obesity) makes the glands proliferate,
    and the proliferation still depends on that stimulus. The finding to look for is nuclear atypia: it, more than
    gland crowding, signals the risk of endometrioid carcinoma.
alt:
  it: >-
    Micrografia di endometrio in ematossilina-eosina a piccolo ingrandimento: numerose ghiandole viola, tubulari e
    ramificate, fittamente stipate, separate da sottili setti di stroma; in alto a sinistra una ghiandola allungata e
    dilatata contiene materiale rosa.
  en: >-
    Low-power H&E micrograph of endometrium: many purple glands, tubular and branched, tightly packed and separated by
    thin strips of stroma; at top left an elongated, dilated gland contains pink material.
