lookFor:
  it: "Cerca i globuli rossi privi del pallore centrale, con bordi taglienti o a forma di triangolo e di elmo, tra le cellule rotonde normali."
  en: "Look for red cells without central pallor, with sharp edges or a triangle or helmet shape, among the normal round cells."
caption:
  it: >-
    Striscio di sangue periferico a forte ingrandimento, da un caso di sindrome emolitico-uremica. Cerca prima i globuli
    rossi normali, rotondi e con un chiarore centrale. Poi guarda i frammenti indicati dalle due frecce al centro: sono
    schistociti, piccoli e angolari, con una punta o un bordo netto. Altri frammenti simili compaiono a sinistra. Tra le
    cellule si vedono anche piccole piastrine azzurre. Gli schistociti segnalano il danno meccanico dei globuli rossi
    nei piccoli vasi.
  en: >-
    Peripheral blood smear at high power, from a case of hemolytic–uremic syndrome. Look first at the normal red cells,
    round with a central pale area. Then look at the fragments marked by the two arrows in the center: these are
    schistocytes, small and angular, with a point or a sharp edge. Other similar fragments appear on the left. A few
    small bluish platelets are also visible between the cells. Schistocytes point to mechanical damage of red cells in
    small vessels.
alt:
  it: >-
    Striscio di sangue con molti globuli rossi rotondi di colore rosato; al centro due frecce nere indicano frammenti
    angolari a forma di triangolo, e altri frammenti simili sono sparsi a sinistra; sono presenti due piccole
    piastrine.
  en: >-
    Blood smear with many round pink red cells; at the center two black arrows point to angular triangle-shaped
    fragments, and other similar fragments are scattered on the left; two small platelets are present.
