lookFor:
  it: "Segui la sottile linea rosa magenta della capsula di Bowman e guarda che cosa riempie lo spazio al suo interno."
  en: "Follow the thin magenta line of Bowman capsule and look at what fills the space inside it."
caption:
  it: >-
    Biopsia renale, PAS, alto ingrandimento: stesso campo del quadro a medio ingrandimento, più vicino. Segui la
    capsula di Bowman, la linea magenta sottile: dentro, lo spazio che dovrebbe essere vuoto è occupato da cellule e
    da materiale rosa, che schiacciano il ciuffo capillare verso il centro. Questa è la semiluna. A destra, i tubuli
    hanno lume ampio, con materiale rosa e granuli.
  en: >-
    Kidney biopsy, PAS, high power: the same biopsy as the medium-power view, closer. Follow Bowman capsule, the thin
    magenta line: inside it, the space that should be empty is occupied by cells and pink material that push the
    capillary tuft toward the center. This is the crescent. On the right, the tubules have wide lumens with pink
    material and granules.
alt:
  it: >-
    Micrografia PAS ad alto ingrandimento: tre glomeruli circondati da una capsula magenta sottile, con cellule e
    materiale rosa che occupano lo spazio intorno a un piccolo ciuffo capillare; tra i glomeruli, tubuli con lume
    ampio.
  en: >-
    High-power PAS micrograph: three glomeruli inside a thin magenta capsule, with cells and pink material filling
    the space around a small capillary tuft; between the glomeruli, wide-lumened tubules.
