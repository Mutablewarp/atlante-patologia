caption:
  it: >-
    Stomaco aperto dopo gastrectomia, antro. A sinistra una grande massa vegetante con il centro ulcerato, sporco di
    fibrina e sangue, e con un bordo rilevato e rosso; il margine duodenale è in basso a sinistra. Guarda poi la mucosa
    intorno, che a destra appare liscia e con pliche: la lesione è circoscritta ma è un tumore maligno ulcerato.
  en: >-
    Stomach opened after gastrectomy, antrum. At the left is a large fungating mass with an ulcerated center, covered
    with fibrin and blood, and a raised red rim; the duodenal margin is at the lower left. Then look at the surrounding
    mucosa, which at the right is smooth with folds: the lesion is circumscribed, yet it is an ulcerated malignant
    tumor.
alt:
  it: >-
    Fotografia di uno stomaco aperto e disteso su fondo nero: a sinistra una massa rilevata con un ampio cratere
    centrale irregolare, marrone e giallastro, circondato da un bordo rosso e spesso; il resto della mucosa, a destra, è
    color crema con pliche e piccole macchie rossastre.
  en: >-
    Photograph of an opened, flattened stomach on a black background: at the left a raised mass with a wide, irregular
    brown and yellowish central crater surrounded by a thick red rim; the rest of the mucosa, to the right, is cream
    colored with folds and small reddish spots.
