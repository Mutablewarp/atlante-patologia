lookFor:
  it: "Segui i fasci di cardiomiociti rosa scuro e guarda come sono separati da bande più chiare di tessuto fibroso."
  en: "Follow the dark pink bundles of cardiomyocytes and note how pale bands of fibrous tissue separate them."
caption:
  it: >-
    Miocardio di cardiopatia ischemica cronica. I fasci di cardiomiociti, di un rosa intenso, sono separati da
    ampie bande di tessuto fibroso più pallido. I fasci restano abbastanza ordinati, diversamente da una cicatrice
    compatta dopo un infarto.
  en: >-
    Myocardium in chronic ischemic heart disease. Bundles of deep pink cardiomyocytes are separated by broad bands
    of paler fibrous tissue. The bundles stay fairly well organized, unlike the compact scar left after an infarct.
alt:
  it: >-
    Tessuto muscolare cardiaco rosa a basso-medio ingrandimento, con isole di fibre muscolari tonde e ovali
    circondate da bande più chiare di tessuto connettivo.
  en: >-
    Pink heart muscle at low to medium power, with islands of round and oval muscle fibers surrounded by paler
    bands of connective tissue.
