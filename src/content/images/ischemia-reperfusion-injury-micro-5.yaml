orientation:
  it: "Fibre tagliate per il lungo, che salgono ripide dal basso a sinistra verso l'alto a destra."
  en: "Fibers cut along their length, rising steeply from the lower left to the upper right."
lookFor:
  it: "Confronta una fibra piena di ammassi viola scuro con le fibre a righe regolari al centro del campo."
  en: "Compare a fiber full of dark violet clumps with the evenly striped fibers in the middle of the field."
caption:
  it: >-
    Infarto miocardico acuto con necrosi a bande di contrazione, colorazione PTAH (ematossilina all'acido
    fosfotungstico); è un caso diverso da quello delle immagini in EE di questa scheda. La PTAH colora in blu-viola le
    miofibrille del muscolo cardiaco, per cui l'aggregazione dell'apparato contrattile risalta in viola scuro su un
    fondo pallido. Orientati prima: le fibre sono tagliate per il lungo e salgono ripide dal basso a sinistra verso
    l'alto a destra. La maggior parte ha perso la striatura regolare: le miofibrille sono collassate in ammassi viola
    scuro disposti di traverso nella fibra, separati da citoplasma più pallido e sbiadito. Questi ammassi sono le bande
    di contrazione, tratti di sarcomeri ipercontratti da un ingresso massivo di calcio. Ora confronta le fibre al
    centro del campo (segnate): qui le miofibrille corrono ancora in linee lunghe, regolari e parallele, senza
    ammassi. Visti fianco a fianco, i due aspetti rendono il danno facile da riconoscere. In EE le stesse bande
    appaiono come barre dense di colore rosa acceso. Come in EE, le bande dicono che il calcio ha invaso le cellule, di
    solito al momento della riperfusione, ma da sole non dimostrano che la riperfusione ci sia stata.
  en: >-
    Acute myocardial infarct with contraction band necrosis, PTAH stain (phosphotungstic acid–hematoxylin); this is a
    different case from the H&E images of this card. PTAH colors the myofibrils of heart muscle blue-violet, so any
    clumping of the contractile apparatus shows up dark violet against a pale background. Orient yourself first: the
    fibers are cut along their length and rise steeply from the lower left to the upper right. Most of them have lost
    their regular striation: their myofibrils have collapsed into dark violet clumps lying crosswise in the fiber, with
    paler, washed-out cytoplasm between them. These clumps are the contraction bands, stretches of sarcomeres
    hypercontracted by a massive entry of calcium. Now compare the fibers in the middle of the field (marked): there
    the myofibrils still run as long, even, parallel lines, with no clumps. Seen side by side, the two patterns make
    the damage easy to spot. On H&E the same bands appear as dense, bright pink bars. As on H&E, the bands tell you
    that calcium flooded the cells, usually at the moment of reperfusion, but on their own they do not prove that
    reperfusion took place.
alt:
  it: >-
    Micrografia in toni di viola: fibre tagliate per il lungo salgono ripide dal basso a sinistra verso l'alto a
    destra; la maggior parte è interrotta da ammassi viola scuro disposti di traverso, con chiazze pallide tra l'uno e
    l'altro; al centro del campo alcune fibre sono di un viola uniforme, con linee lunghe, sottili e parallele.
  en: >-
    Micrograph in shades of violet: fibers cut lengthwise rise steeply from the lower left to the upper right; most
    are broken up by dark violet clumps lying crosswise, with pale patches between them; in the middle of the field a
    few fibers are evenly violet, with long, fine parallel lines.
