lookFor:
  it: "Segui le frecce fino ai piccoli cheratinociti rosa e vitrei, poi confrontali con il riquadro a ×1000."
  en: "Follow the arrows to the small, glassy pink keratinocytes, then compare them with the inset at ×1000."
caption:
  it: >-
    Biopsia cutanea con punch di un paziente con sindrome di Stevens-Johnson da sulfametossazolo-trimetoprim, EE a ×200
    (riquadro a ×1000); le frecce gialle e il riquadro fanno parte della figura pubblicata. Procedi dall'alto verso il
    basso. Lo strato corneo conserva il normale aspetto a canestro intrecciato, lasso e reticolato: segno che il danno è
    recente. Sotto, l'epidermide è punteggiata da singoli cheratinociti che spiccano come piccole cellule rotonde,
    vitree, rosa acceso (frecce), a tutti i livelli a partire dallo strato basale; molti linfociti sono penetrati nella
    parte bassa dell'epidermide (esocitosi) e un modesto infiltrato linfocitario occupa il derma superficiale. Il
    riquadro mostra una di queste cellule a ×1000: un corpo liscio, rotondo, uniformemente eosinofilo, senza nucleo
    visibile, staccato dalle cellule vicine da una semiluna chiara. Sono cheratinociti morti per apoptosi, nell'ambito di
    una reazione immunitaria al farmaco in cui i linfociti attaccano l'epidermide. Attenzione ai nomi: queste cellule
    vengono spesso chiamate cheratinociti «necrotici» o «discheratosici», ma passa alla colorazione per la caspasi-3
    clivata della stessa biopsia per vedere che sono apoptotiche. Quando l'apoptosi si estende a tutta l'epidermide,
    questa si stacca dal derma: è lo scollamento bolloso che si vede al letto del paziente.
  en: >-
    Punch biopsy of skin from a patient with Stevens–Johnson syndrome caused by sulfamethoxazole–trimethoprim, H&E at
    ×200 (inset ×1000); the yellow arrows and the inset belong to the published figure. Work from top to bottom. The
    stratum corneum keeps its normal loose basket-weave pattern, a sign that the injury is recent. Below it, the
    epidermis is studded with single keratinocytes that stand out as small, round, glassy, bright pink cells (arrows),
    at every level from the basal layer upward; many lymphocytes have entered the lower epidermis (exocytosis), and a
    light lymphocytic infiltrate sits in the superficial dermis. The inset shows one of these cells at ×1000: a smooth,
    round, evenly eosinophilic body with no visible nucleus, pulled away from its neighbours by a clear crescent. These
    are keratinocytes that died by apoptosis, as part of an immune reaction to the drug in which lymphocytes attack the
    epidermis. Watch the names: these cells are often called "necrotic" or "dyskeratotic" keratinocytes, but switch to
    the cleaved caspase-3 stain of the same biopsy to see that they are apoptotic. When apoptosis spreads through the
    whole epidermis, the epidermis comes away from the dermis: this is the blistering and skin loss seen at the bedside.
alt:
  it: >-
    Micrografia di cute in ematossilina-eosina: in alto un sottile strato corneo rosa, un'epidermide con piccole cellule
    rotonde rosa acceso indicate da cinque frecce gialle, molti piccoli nuclei scuri di linfociti nella parte bassa
    dell'epidermide e nel derma superficiale e, in basso a destra, un riquadro con un corpo rotondo, rosa e omogeneo
    circondato da una semiluna bianca.
  en: >-
    H&E micrograph of skin: a thin pink stratum corneum on top, an epidermis with small, bright pink round cells marked
    by five yellow arrows, many small dark lymphocyte nuclei in the lower epidermis and superficial dermis, and an inset
    at lower right showing a round, homogeneous pink body surrounded by a white crescent.
