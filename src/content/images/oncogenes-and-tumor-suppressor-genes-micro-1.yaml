lookFor:
  it: "Confronta i nuclei bruni, fortemente colorati, con i nuclei blu, negativi, nello stesso campo."
  en: "Compare the strongly stained brown nuclei with the blue, negative nuclei in the same field."
caption:
  it: >-
    Astrocitoma anaplastico, immunocolorazione per p53 ad alto ingrandimento. Guarda i nuclei: molti sono bruni e
    scuri, perché la proteina p53 si accumula al loro interno; altri restano blu, cioè non marcati. Nota anche la
    variabilità di forma e dimensione dei nuclei. Un vaso con parete sottile attraversa il campo a destra. Qui p53 è il
    marcatore dell'alterazione di un gene oncosoppressore: la colorazione nucleare intensa e diffusa è lo schema che
    in genere si osserva con una proteina p53 mutata.
  en: >-
    Anaplastic astrocytoma, p53 immunostain at high power. Look at the nuclei: many are dark brown because p53
    protein has built up inside them, while others stay blue, meaning unlabeled. Note also the variation in nuclear
    size and shape. A thin-walled vessel crosses the field on the right. Here p53 is the readout of an altered tumor
    suppressor gene: strong, widespread nuclear staining is the pattern usually seen with a mutant p53 protein.
alt:
  it: >-
    Micrografia con immunocolorazione: su fondo chiaro bluastro con sottili fibrille, numerosi nuclei bruni scuri
    sparsi tra nuclei blu non marcati; a destra un piccolo vaso con parete sottile.
  en: >-
    Immunostained micrograph: on a pale bluish fibrillary background, many dark brown nuclei scattered among unlabeled
    blue nuclei; at the right, a small thin-walled vessel.
