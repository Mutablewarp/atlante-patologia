lookFor:
  it: "Segui la parete del ventricolo sinistro fino all'area pallida indicata dalla freccia e confrontala con il miocardio rosso-bruno circostante."
  en: "Follow the left ventricular wall to the pale area marked by the arrow and compare it with the surrounding red-brown myocardium."
caption:
  it: >-
    Sezione trasversale del cuore con un vecchio infarto. Parti dal ventricolo sinistro, a sinistra, con la parete
    spessa e rosso-bruna, poi cerca la freccia bianca in basso. Indica un'area pallida e biancastra della parete
    posteriore: è tessuto cicatriziale fibroso, che a occhio nudo si distingue dal miocardio vitale intorno. Il
    ventricolo destro è a destra.
  en: >-
    Cross-section of a heart with an old infarct. Start at the left ventricle, on the left, with its thick red-brown
    wall, then find the white arrow at the bottom. It marks a pale, whitish area of the posterior wall: fibrous scar
    tissue, which stands out to the naked eye from the viable myocardium around it. The right ventricle is on the right.
alt:
  it: >-
    Fetta trasversale di cuore su fondo bianco: parete ventricolare rosso-bruna con cavità vuote e muscoli papillari;
    in basso a sinistra una freccia bianca indica un'area pallida e biancastra della parete.
  en: >-
    Transverse slice of a heart on a white background: red-brown ventricular wall with empty cavities and papillary
    muscles; at the lower left a white arrow points to a pale, whitish area of the wall.
