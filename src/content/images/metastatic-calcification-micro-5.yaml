caption:
  it: >-
    Calcificazione metastatica del polmone evidenziata con la colorazione di von Kossa, a medio ingrandimento (×120
    secondo la fonte). La sezione viene dall'autopsia di una donna di 35 anni morta per insufficienza respiratoria poco
    dopo il parto; gli autori hanno ricondotto i depositi di calcio a un iperparatiroidismo primario dovuto a un
    carcinoma della paratiroide (è una paziente diversa da quella delle immagini in EE di questa scheda). Cerca ciò che è
    nero: sottili linee nere corrono lungo le pareti alveolari, tratti neri più spessi segnano i punti in cui il minerale
    si è accumulato di più, e linee nere bordano anche le pareti del vaso sezionato longitudinalmente in basso, con il
    lume pieno di emazie. Tutto il resto prende la colorazione di contrasto rosa-bruna, e gli spazi alveolari sono quasi
    vuoti. Come funziona: l'argento prende il posto del calcio nei suoi sali di fosfato e di carbonato e viene poi
    ridotto ad argento metallico nero, quindi il nero indica il minerale; la colorazione è più specifica
    dell'ematossilina, il cui blu colora anche i nuclei e altro materiale basofilo. Perché è metastatica: i depositi
    seguono pareti alveolari e vascolari che prima non erano danneggiate, in tutto il polmone, per l'eccesso sistemico di
    calcio prodotto dall'iperparatiroidismo primario; la calcificazione distrofica, al contrario, si forma su tessuto morto o danneggiato
    senza un'alterazione sistemica del calcio. Nella stessa paziente gli autori hanno trovato calcio anche nei reni e
    nella mucosa gastrica.
  en: >-
    Metastatic calcification of the lung shown with the von Kossa stain, medium power (×120 according to the source).
    The section comes from the autopsy of a 35-year-old woman who died of respiratory failure shortly after childbirth;
    the authors traced her calcium deposits to primary hyperparathyroidism caused by a parathyroid carcinoma (a
    different patient from the H&E images of this card). Look for what is black: fine black lines run along the alveolar
    walls, thicker black segments mark where more mineral has built up, and black lines also edge the walls of the
    vessel cut lengthwise at the bottom, whose lumen is full of red cells. Everything else takes the pink-brown
    counterstain, and the alveolar spaces are almost empty. How the stain works: silver takes the place of calcium in
    its phosphate and carbonate salts and is then reduced to black metallic silver, so black marks the mineral; the
    stain is more specific than haematoxylin, whose blue also colours nuclei and other basophilic material. Why this is
    metastatic: the deposits follow alveolar and vessel walls that were not damaged beforehand, throughout the lung,
    because of the systemic calcium excess that primary hyperparathyroidism produces; dystrophic calcification, by
    contrast, forms on dead or damaged tissue without a systemic calcium disorder. In the same patient the authors also
    found calcium in the kidneys and in the gastric mucosa.
alt:
  it: >-
    Sezione di polmone colorata con von Kossa a medio ingrandimento: sottili pareti alveolari rosa-brune attorno a spazi
    bianchi per lo più vuoti, molte bordate da linee nere sottili o più spesse; in basso un vaso allungato, pieno di
    cellule rosso-brune, è delimitato da linee nere.
  en: >-
    Lung section stained with von Kossa at medium power: thin pink-brown alveolar walls around mostly empty white
    spaces, many of them edged by fine or thicker black lines; at the bottom, an elongated vessel full of red-brown cells
    is outlined by black lines.
