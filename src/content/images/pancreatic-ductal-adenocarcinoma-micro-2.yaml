lookFor:
  it: "Guarda lo strato di cellule come un favo: i nuclei si sovrappongono e la distanza tra loro non è uniforme, a differenza dell'epitelio duttale normale."
  en: "Look at the sheet of cells as a honeycomb: the nuclei overlap and are not evenly spaced, unlike normal duct epithelium."
caption:
  it: >-
    Adenocarcinoma del pancreas, agoaspirato (citologia). Una lamina piatta di cellule a favo, ben differenziata. I nuclei
    si sovrappongono e non sono distanziati in modo regolare. Questo è l'indizio che distingue il tumore dall'epitelio
    duttale non neoplastico.
  en: >-
    Pancreatic adenocarcinoma, fine-needle aspirate (cytology). A flat, honeycombed sheet of well-differentiated cells.
    The nuclei overlap and are not evenly spaced. This is the clue that separates the tumor from non-neoplastic duct
    epithelium.
alt:
  it: >-
    Citologia: una lamina di cellule con nuclei rotondi viola scuri, sovrapposti in modo disordinato, su fondo chiaro con
    sfondo granulare.
  en: >-
    Cytology: a sheet of cells with round dark purple nuclei, crowded and overlapping unevenly, on a pale granular
    background.
