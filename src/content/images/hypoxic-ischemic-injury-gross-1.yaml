stain: nitro blue tetrazolium (NBT), middle slice only
caption:
  it: >-
    Cuore all'autopsia con infarto subendocardico circonferenziale, reso visibile con il nitroblu di tetrazolio (NBT).
    Guarda prima il cuore intero in alto e la fetta in basso: non sono trattati e servono da confronto, perché a occhio
    nudo l'infarto recente quasi non si vede. Passa poi alla fetta centrale, indicata dalla freccia, l'unica immersa
    nel colorante: il miocardio vitale si colora di viola scuro, perché i suoi enzimi deidrogenasi riducono l'NBT a un
    pigmento colorato; intorno alla cavità del ventricolo sinistro, invece, un anello pallido non si colora. Lì le
    cellule hanno subito un danno irreversibile e hanno perso gli enzimi e i cofattori. L'anello segue tutto il
    subendocardio, lo strato più lontano dalle coronarie epicardiche e quindi il più sensibile a un calo globale della
    perfusione. Pallido dopo l'NBT = miocardio morto.
  en: >-
    Heart at autopsy with a circumferential subendocardial infarct, made visible with nitro blue tetrazolium (NBT).
    Look first at the whole heart at the top and the slice at the bottom: they are untreated and serve as controls,
    because a recent infarct is hard to see with the naked eye. Then move to the middle slice, marked by the arrow, the
    only one soaked in the dye: viable myocardium stains dark purple because its dehydrogenase enzymes reduce NBT to a
    coloured pigment, whereas a pale ring around the left ventricular cavity stays unstained. There the cells have
    suffered irreversible injury and have lost those enzymes and cofactors. The ring follows the whole subendocardium,
    the layer farthest from the epicardial coronary arteries and therefore the most sensitive to a global drop in
    perfusion. Pale after NBT = dead myocardium.
alt:
  it: >-
    Su fondo nero, dall'alto in basso: un cuore intero rosa e giallastro, una fetta trasversale dei ventricoli colorata
    di viola scuro con un anello più chiaro intorno alla cavità del ventricolo sinistro, indicata da una freccia bianca,
    e una seconda fetta non colorata, rosa uniforme.
  en: >-
    On a black background, from top to bottom: a whole pink and yellowish heart, a transverse slice of the ventricles
    stained dark purple with a paler ring around the left ventricular cavity, marked by a white arrow, and a second,
    unstained slice of uniform pink.
