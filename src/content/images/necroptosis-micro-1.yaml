caption:
  it: >-
    Necroptosi in coltura cellulare: lo stesso campo di fibroblasti murini L929 fotografato in vivo, al microscopio a
    contrasto di fase, all'inizio della registrazione (a sinistra, 6 min 50 s) e alla fine (a destra, circa 8 ore
    dopo). Prima del TNF le cellule sono state trattate con zVAD-fmk, un inibitore di tutte le caspasi: con la via
    apoptotica bloccata, il segnale di morte del TNF viene deviato verso la necroptosi (RIPK1 e RIPK3 formano il
    necrosoma, che fosforila MLKL; MLKL apre pori nella membrana plasmatica). Confronta prima i due pannelli a basso
    ingrandimento: a sinistra un tappeto di cellule vive, aderenti e allungate (fusate o triangolari), con un alone
    chiaro attorno al bordo; a destra non resta una sola cellula distesa, sono tutte tonde. Poi osserva le singole
    cellule: quelle vive sono appiattite e brillanti; le poche cellule tonde e molto luminose a sinistra si sono
    arrotondate ma hanno ancora la membrana integra (per esempio cellule in mitosi). Le cellule morte a destra sono
    invece globose, grigie e granulose, hanno perso l'alone luminoso perché la membrana è stata perforata e il
    citoplasma si è equilibrato con il terreno di coltura, e spesso mostrano ancora il nucleo al centro. Da ricordare:
    è una morte con rigonfiamento e rottura della membrana, come la necrosi, non con raggrinzimento e frammentazione in
    corpi apoptotici. In un tessuto la necroptosi non ha un aspetto proprio all'ematossilina-eosina: si riconosce solo
    con marcatori (MLKL fosforilata) o bloccandola con inibitori di RIPK1 o RIPK3. Attenzione: questo è un
    esperimento su cellule in coltura, non un preparato istologico.
  en: >-
    Necroptosis in cell culture: the same field of mouse L929 fibroblasts imaged live by phase-contrast microscopy at
    the start of the recording (left, 6 min 50 s) and at the end (right, about 8 hours later). Before TNF, the cells
    were treated with zVAD-fmk, an inhibitor of all caspases: with the apoptotic route blocked, the TNF death signal is
    diverted into necroptosis (RIPK1 and RIPK3 form the necrosome, which phosphorylates MLKL; MLKL opens pores in the
    plasma membrane). First compare the two panels at low power: on the left a carpet of living, attached, elongated
    (spindle-shaped or triangular) cells with a bright halo around their edge; on the right not a single spread cell
    is left, all are round. Then look at single cells: living cells are flat and bright; the few very bright round
    cells on the left have rounded up but still have an intact membrane (for example cells in mitosis). The dead
    cells on the right are plump, grey and granular, have lost the bright halo because the membrane has been
    perforated and the cytoplasm has equilibrated with the culture medium, and often still show the nucleus in the
    centre. Key point: this is death with swelling and membrane rupture, like necrosis, not shrinkage and break-up into
    apoptotic bodies. In tissue, necroptosis has no specific look on H&E: it is recognised only with markers
    (phosphorylated MLKL) or by blocking it with RIPK1 or RIPK3 inhibitors. Note that this is a cell-culture
    experiment, not a histological section.
alt:
  it: >-
    Due pannelli affiancati in scala di grigi, ripresi al microscopio a contrasto di fase con barra di scala da 50 µm.
    A sinistra, con l'indicazione 06:50.228, molte cellule allungate e appuntite su fondo grigio scuro, con bordi
    luminosi, e alcune piccole cellule tonde molto brillanti. A destra, con l'indicazione 07:59:33.110, lo stesso
    campo contiene solo cellule tonde, grigie e granulose, senza alone luminoso, sparse sul fondo.
  en: >-
    Two side-by-side greyscale phase-contrast panels with a 50 µm scale bar. On the left, labelled 06:50.228, many
    elongated, pointed cells with bright edges on a dark grey background and a few small, very bright round cells. On
    the right, labelled 07:59:33.110, the same field contains only round, grey, granular cells without a bright halo,
    scattered over the background.
