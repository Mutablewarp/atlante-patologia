lookFor:
  it: "Parti dal lume ridotto a stella al centro e procedi verso l'esterno: prima l'intima ispessita, poi l'anello della media."
  en: "Start at the narrowed, star-shaped lumen in the center and work outward: first the thickened intima, then the ring of the media."
caption:
  it: >-
    Arteria polmonare di piccolo-medio calibro in EE a basso ingrandimento. Il lume è ridotto a una fessura stellata
    con pochi eritrociti. Intorno si vede una spessa intima fibro-cellulare, pallida, con cellule disposte a cerchi
    concentrici; più fuori un anello più scuro e compatto di muscolatura della media, anch'essa ispessita, e infine il
    tessuto polmonare circostante. È il quadro dell'arteriopatia ipertensiva polmonare: ispessimento di intima e media
    che restringe il lume.
  en: >-
    Small to medium pulmonary artery, H&E at low power. The lumen is reduced to a star-shaped slit holding a few red
    cells. Around it lies a thick, pale, fibrocellular intima with cells arranged in concentric circles; further out is
    a darker, compact ring of medial muscle, also thickened, and then the surrounding lung tissue. This is the picture
    of pulmonary hypertensive arteriopathy: thickening of intima and media that narrows the lumen.
alt:
  it: >-
    Micrografia rosa-violacea di un'arteria in sezione trasversa: lume piccolo e stellato al centro, spessa intima
    chiara a strati concentrici, anello esterno più scuro di media e parenchima polmonare ai bordi.
  en: >-
    Pink-purple micrograph of an artery in cross section: small star-shaped lumen at the center, thick pale intima in
    concentric layers, a darker outer ring of media and lung parenchyma at the edges.
