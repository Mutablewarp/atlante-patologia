lookFor:
  it: Cerca prima i fogli compatti di cellule violacee, poi lo stroma rosa con i linfociti sparsi che li separa o li affianca.
  en: Find the compact sheets of purple cells first, then the pink stroma with scattered lymphocytes beside or between them.
caption:
  it: >-
    Carcinoma nasofaringeo, EE a basso ingrandimento. Nella metà sinistra e in basso il tumore forma ampi fogli
    compatti di cellule, dal colore violaceo uniforme. In alto a destra lo stroma è rosa e contiene linfociti sparsi,
    che si addensano lungo il margine del tumore. Nessuna ghiandola o cheratinizzazione evidente a questo
    ingrandimento. Passa poi all'immagine ad alto ingrandimento per guardare le singole cellule.
  en: >-
    Nasopharyngeal carcinoma, H&E at low power. In the left half and lower part the tumor forms broad, compact sheets of
    cells with an even purple color. At the upper right the stroma is pink and holds scattered lymphocytes, which
    thicken along the edge of the tumor. No glands or keratinization are evident at this power. Then switch to the
    high-power image to look at single cells.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: ampi fogli di cellule violacee a sinistra e in basso, con
    un piccolo spazio vuoto sul bordo sinistro; in alto a destra stroma rosa con linfociti sparsi.
  en: >-
    Low-power H&E micrograph: broad sheets of purple cells at the left and bottom, with a small empty space at the left
    edge; at the upper right, pink stroma with scattered lymphocytes.
