lookFor:
  it: "Cerca i neutrofili, cellule piccole con nucleo scuro diviso in lobi, dentro il lume e tra le cellule ghiandolari."
  en: "Look for neutrophils, small cells with a dark multilobed nucleus, inside the lumen and among the gland cells."
caption:
  it: >-
    Prostata con infiammazione acuta, EE a forte ingrandimento. Riconosci prima l'epitelio ghiandolare, con nuclei
    violacei allineati lungo il bordo del lume. Poi guarda nel lume e a destra, nel materiale rosa e tra le bolle
    vuote: ci sono molti neutrofili, piccoli e con nucleo scuro lobato, insieme a qualche cellula più grande e
    schiumosa. Un'infiammazione acuta nella prostata è fatta soprattutto di neutrofili dentro i lumi ghiandolari.
  en: >-
    Prostate with acute inflammation, H&E at high power. First recognize the glandular epithelium, with purple nuclei
    lined up along the edge of the lumen. Then look inside the lumen and to the right, in the pink material and among
    the empty bubbles: there are many neutrophils, small with a dark lobed nucleus, together with a few larger, foamy
    cells. Acute inflammation in the prostate is made mostly of neutrophils inside the gland lumens.
alt:
  it: >-
    Micrografia di prostata in ematossilina-eosina: file di cellule ghiandolari con nuclei violacei attorno a spazi
    chiari; a destra e al centro, tanti piccoli neutrofili con nucleo scuro lobato nel materiale rosa e tra bolle vuote.
  en: >-
    H&E micrograph of prostate: rows of glandular cells with purple nuclei around pale spaces; to the right and in the
    center, many small neutrophils with dark lobed nuclei in pink material and among empty bubbles.
