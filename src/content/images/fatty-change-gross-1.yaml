caption:
  it: >-
    Fegato autoptico di un bambino morto per sindrome di Reye, causa classica di steatosi microvescicolare. Parti dalla
    grande superficie di taglio in alto: è color marrone-camoscio, uniforme e solo un po' più pallida del normale, senza
    l'aspetto giallo e untuoso della steatosi macrovescicolare marcata. Concetto chiave: quando il grasso si accumula in
    goccioline minute il quadro macroscopico può essere sfumato, quindi un fegato quasi normale a occhio nudo non
    esclude la steatosi; la diagnosi si conferma all'istologia (in laboratorio anche con colorazioni per i lipidi su
    sezioni al criostato). Per orientarti: il sacco verdastro in basso a sinistra è la colecisti. Attenzione: la zona
    rosso-violacea, liscia e lucida in basso a sinistra è la superficie esterna dell'organo, su un piano diverso dal
    taglio; non confrontarne il colore con la superficie di sezione.
  en: >-
    Autopsy liver from a child who died of Reye syndrome, a classic cause of microvesicular steatosis. Start with the
    large cut surface at the top: it is an even tan-brown and only slightly paler than normal, without the yellow, greasy
    look of heavy macrovesicular fatty change. Key point: when fat is stored as tiny droplets the gross change can be
    subtle, so a liver that looks almost normal to the naked eye does not rule out steatosis; histology settles it (in
    the lab, also fat stains on frozen sections). For orientation, the greenish sac at the lower left is the gallbladder.
    Pitfall: the smooth, glistening red-purple area at the lower left is the outer surface of the organ, in a different
    plane from the cut; do not compare its colour with the cut surface.
alt:
  it: >-
    Fotografia macroscopica di un fegato sezionato su fondo azzurro: un'ampia superficie di taglio liscia e uniforme,
    color marrone-camoscio, con piccoli vasi beanti e un tessuto connettivo biancastro ramificato al centro; in basso a
    sinistra una colecisti verdastra e, sotto il fegato, altri visceri addominali giallo-rosati.
  en: >-
    Gross photograph of a sliced liver on a light-blue background: a broad, smooth, uniformly tan-brown cut surface with
    small gaping vessels and a branching whitish strand of connective tissue in the centre; a greenish gallbladder at the
    lower left and other yellow-pink abdominal organs below the liver.
