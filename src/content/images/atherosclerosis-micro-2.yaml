caption:
  it: "Placca fibrocalcifica: a basso ingrandimento la parete ispessita è fibrosa e pallida; il riquadro a destra mostra a maggior ingrandimento depositi di calcio viola scuro tra le fibre. Arteria intracranica, H&E."
  en: "Fibrocalcific plaque: at low power the thickened wall is pale and fibrous; the inset on the right shows dark purple calcium deposits between the fibers at higher power. Intracranial artery, H&E."
alt:
  it: "Due pannelli in H&E: a sinistra una parete arteriosa ispessita, rosa pallido, con un riquadro; a destra l'ingrandimento con aggregati viola scuro in tessuto fibroso."
  en: "Two H&E panels: on the left a thickened, pale pink arterial wall with a boxed area; on the right the magnified area with dark purple clumps in fibrous tissue."
