stain: von Kossa
magnification: high power (original magnification ×400)
lookFor:
  it: "Guarda i granuli neri dentro il lobulo di grasso necrotico, a fondo verde pallido: sono depositi di calcio."
  en: "Look at the black granules inside the lobule of dead fat, on the pale green background: calcium deposits."
caption:
  it: >-
    La stessa biopsia di pannicolite pancreatica colorata con il metodo di von Kossa, ingrandimento originale ×400: è
    la colorazione speciale per il calcio, e qui mostra il calcio depositato nel grasso necrotico. I depositi di sali di calcio diventano
    neri o bruno scuri, mentre il resto del tessuto resta su un fondo verde pallido. Parti dal centro: dentro un
    lobulo di grasso morto c'è un ammasso di granuli neri, con qualche zolla più piccola più in basso e a destra. Gli
    autori li indicano come focolai di calcificazione iniziale nel grasso necrotico. Leggi soltanto i granuli dentro
    il lobulo; le strisce
    scure più grossolane lungo il margine sinistro stanno fuori da esso. Perché conta: con l'ematossilina-eosina lo
    stesso calcio appare solo come una tinta blu-viola (passa alle immagini in EE di questa biopsia), mentre la von
    Kossa è il modo più specifico per metterlo in evidenza. È la stessa chimica che produce le chiazze bianco-gesso
    della steatonecrosi intorno al pancreas e che, nella pancreatite acuta grave, può far scendere la calcemia.
  en: >-
    The same biopsy of pancreatic panniculitis stained by the von Kossa method, original magnification ×400: the
    special stain for calcium, which here shows calcium deposited in the dead fat. Deposits of calcium salts turn black or dark
    brown, while the rest of the tissue stays on a pale green background. Start in the centre: inside a lobule of
    dead fat lies a cluster of black granules, with a few smaller clumps lower down and to the right. The authors
    identify them as foci of early calcification in the necrotic fat. Read only the granules inside the lobule; the
    coarser dark streaks along the left edge
    lie outside it. Why this matters: on H&E the same calcium shows only as a blue-purple tint (switch to the H&E
    views of this biopsy), whereas von Kossa is the more specific way to show it. It is the same chemistry that makes
    the chalky white patches of fat necrosis around the pancreas and that, in severe acute pancreatitis, can lower
    the blood calcium.
alt:
  it: >-
    Micrografia in colorazione di von Kossa a forte ingrandimento, con la lettera D in alto a sinistra: a destra un
    ampio lobulo a fondo verde pallido con, al centro, un ammasso di granuli neri e bruno scuri e alcune zolle nere
    più piccole in basso a destra; a sinistra spazi chiari e strisce scure ondulate.
  en: >-
    High-power von Kossa micrograph with the letter D at the top left: on the right a large lobule on a pale green
    background with, in its centre, a cluster of black and dark brown granules and a few smaller black clumps lower
    right; on the left, clear spaces and dark wavy streaks.
