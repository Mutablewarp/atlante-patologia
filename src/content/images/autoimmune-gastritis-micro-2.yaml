lookFor:
  it: "Guarda il rivestimento delle ghiandole: cellule con nucleo rotondo e citoplasma pallido, e piccole cellule infiammatorie tra le ghiandole."
  en: "Look at the gland lining: cells with round nuclei and pale cytoplasm, and small inflammatory cells between the glands."
caption:
  it: >-
    Corpo gastrico, EE a forte ingrandimento. Le ghiandole sono rivestite da cellule con nucleo rotondo e citoplasma
    pallido e granulare, mentre nel connettivo tra le ghiandole si vedono piccole cellule infiammatorie con nucleo scuro.
    Sono i dettagli cellulari dello stesso quadro visto a basso ingrandimento.
  en: >-
    Gastric body, H&E at high power. The glands are lined by cells with round nuclei and pale, granular cytoplasm, and
    small dark-nucleated inflammatory cells lie in the connective tissue between them. These are the cellular details of
    the pattern seen at low power.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento: ghiandole tondeggianti con cellule dal nucleo rotondo e
    citoplasma pallido, separate da connettivo rosa con piccoli nuclei scuri.
  en: >-
    High-power H&E micrograph: rounded glands with cells that have round nuclei and pale cytoplasm, separated by pink
    connective tissue with small dark nuclei.
