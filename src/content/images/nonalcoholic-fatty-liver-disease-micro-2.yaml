caption:
  it: >-
    Steatoepatite in biopsia epatica (tricromica). Cerca epatociti rigonfi e chiari (degenerazione balonizzante),
    gocce di grasso, sottili fibre verdi di collagene tra le cellule e piccoli gruppi di cellule infiammatorie a
    sinistra, vicino allo spazio portale.
  en: >-
    Steatohepatitis in a liver biopsy (trichrome). Look for swollen, pale hepatocytes (ballooning degeneration), fat
    droplets, thin green collagen fibers between the cells, and small groups of inflammatory cells at the left, near
    the portal tract.
alt:
  it: >-
    Micrografia di fegato con colorazione tricromica: epatociti rosa-rossi, molti con citoplasma chiaro e rigonfio, alcuni
    vacuoli bianchi rotondi, sottili fibre verdi tra le cellule e a sinistra una banda verde con numerosi piccoli nuclei
    scuri.
  en: >-
    Trichrome micrograph of liver: pink-red hepatocytes, many with pale swollen cytoplasm, some round white vacuoles,
    thin green fibers between the cells, and at the left a green band with many small dark nuclei.
lookFor:
  it: "Cerca le cellule grandi e pallide con nucleo piccolo, poi segui le sottili strie verdi attorno agli epatociti."
  en: "Look for the large pale cells with a small nucleus, then follow the thin green strands around the hepatocytes."
