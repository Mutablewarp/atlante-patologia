lookFor:
  it: "Segui il bordo superficiale della mucosa: è quasi piatto, senza villi alti, mentre sotto le cripte sono lunghe e fitte in una lamina propria ricca di cellule."
  en: "Follow the surface edge of the mucosa: it is nearly flat, without tall villi, while below it the crypts are long and crowded in a cellular lamina propria."
caption:
  it: >-
    Biopsia di intestino tenue, EE a basso ingrandimento. Guarda prima il profilo superficiale della mucosa: è piatto
    o appena ondulato, non si vedono villi lunghi e sottili. Poi osserva sotto la superficie: le cripte sono allungate,
    ravvicinate e occupano tutto lo spessore della mucosa, separate da una lamina propria ricca di piccole cellule
    infiammatorie. È il quadro di atrofia dei villi con iperplasia delle cripte descritto nella scheda; l'immagine da
    sola non basta per la diagnosi, che richiede anche dati clinici e sierologici.
  en: >-
    Small-bowel biopsy, H&E at low power. Look first at the surface profile of the mucosa: it is flat or only slightly
    wavy, and no long, slender villi are seen. Then look below the surface: the crypts are elongated, crowded and fill
    the whole thickness of the mucosa, separated by a lamina propria packed with small inflammatory cells. This is the
    pattern of villous atrophy with crypt hyperplasia described in the card; the picture alone is not enough for the
    diagnosis, which also needs clinical and serologic data.
alt:
  it: >-
    Micrografia a basso ingrandimento di una biopsia del tenue in ematossilina-eosina: mucosa rosa con superficie quasi
    piatta e numerose cripte allungate, in sezione longitudinale e trasversale, immerse in una lamina propria
    cellulare; in basso un'area vuota e frammenti di tessuto.
  en: >-
    Low-power H&E micrograph of a small-bowel biopsy: pink mucosa with a nearly flat surface and many elongated crypts,
    cut lengthwise and across, set in a cellular lamina propria; an empty area and tissue fragments lie below.
