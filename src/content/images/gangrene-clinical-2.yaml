orientation:
  it: "Piede destro visto dal dorso, con le dita in alto nell'immagine: l'alluce è a sinistra."
  en: "Right foot seen from above, toes pointing up: the big toe is on the left."
lookFor:
  it: "Segui ogni dito dalla punta fino alla cute rosa dell'avampiede e trova il margine in cui il tessuto morto incontra quello vivo."
  en: "Follow each toe from its tip down to the pink skin of the forefoot and find the edge where dead tissue meets living tissue."
caption:
  it: >-
    Avampiede destro di una persona con diabete, visto dal dorso con le dita in alto nell'immagine, perciò l'alluce è
    a sinistra; la fonte descrive una gangrena dal primo al quarto dito. Parti dall'alluce e dalle dita vicine: sono
    nere, secche e raggrinzite, con cute rugosa e coriacea e unghie giallastre e opache. È la gangrena secca: tessuto
    morto per mancanza di sangue arterioso che, poiché vi crescono pochi batteri, si disidrata e si mummifica invece di
    colliquare. Cerca poi il dito gonfio e violaceo ma non ancora nero: il colore indica che anche questo dito è
    gravemente ischemico, verosimilmente in una fase più precoce dello stesso processo. Scendi quindi alla base delle
    dita, dove una fascia di cute giallastra, morta e desquamata confina con la cute rosa dell'avampiede. Quel bordo è
    la linea di demarcazione, il confine tra tessuto morto e tessuto vivo che fa apparire la gangrena secca così
    nettamente delimitata; il colore rosa indica che l'avampiede è ancora irrorato. Nel diabete la causa abituale è
    l'aterosclerosi delle arterie degli arti inferiori, che priva le dita di sangue; negli Stati Uniti il diabete
    provoca più amputazioni non traumatiche degli arti di qualsiasi altra causa. Se i batteri colonizzassero queste
    dita morte, diventerebbero gonfie, umide e maleodoranti: gangrena umida.
  en: >-
    Right forefoot of a person with diabetes, seen from above with the toes pointing up, so the big toe is on the
    left; the source describes gangrene of the first to fourth toes. Start with the big toe and its neighbours: they
    are black, dry and shrivelled, with wrinkled, leathery skin and dull yellowish nails. This is dry gangrene: tissue
    that has died for lack of arterial blood and, because few bacteria grow in it, dries out and mummifies instead of
    liquefying. Next, find the toe that is swollen and dusky purple but not yet black: its colour shows that it, too,
    is severely ischemic, probably at an earlier stage of the same process. Then move down to the base of the toes,
    where a band of yellowish, dead, peeling skin borders the pink skin of the forefoot. That edge is the line of
    demarcation, the boundary between dead and living tissue that makes dry gangrene look so sharply limited; the pink
    colour shows that the forefoot is still perfused. In diabetes the usual cause is atherosclerosis of the leg
    arteries, which starves the toes of blood; in the United States diabetes accounts for more non-traumatic limb
    amputations than any other cause. If bacteria colonized these dead toes, they would become swollen, moist and
    foul-smelling: wet gangrene.
alt:
  it: >-
    Fotografia a colori della parte anteriore di un piede destro su un asciugamano bianco, vista dall'alto: l'alluce e
    le dita vicine sono neri, rugosi e raggrinziti, con unghie giallastre; un dito più a destra è gonfio e violaceo;
    sotto di essi una fascia di cute giallastra e desquamata confina con la cute rosa dell'avampiede.
  en: >-
    Colour photograph of the front of a right foot on a white towel, seen from above: the big toe and the next toes
    are black, wrinkled and shrivelled, with yellowish nails; one toe further right is swollen and purple; below them a
    band of yellowish, peeling skin borders the pink skin of the forefoot.
