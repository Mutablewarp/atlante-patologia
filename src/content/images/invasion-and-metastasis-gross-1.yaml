lookFor:
  it: "Confronta i noduli chiari e rotondi con il fegato rosso-bruno intorno e usa la scala in centimetri per stimarne le dimensioni."
  en: "Compare the pale, rounded nodules with the red-brown liver around them, and use the centimeter scale to size them."
caption:
  it: >-
    Metastasi epatiche di adenocarcinoma del pancreas, sezione di fegato all'autopsia. Guarda prima il fondo: il
    parenchima epatico è rosso-bruno e uniforme. Poi cerca i noduli chiari, rotondi e ben delimitati, di molte
    dimensioni, sparsi in tutta la sezione; i più grandi misurano diversi centimetri, come mostra la scala in alto a
    destra. Più noduli di calibro diverso sono il segno macroscopico tipico di una diffusione per via ematica, qui
    attraverso la vena porta.
  en: >-
    Liver metastases from a pancreatic adenocarcinoma, cut surface at autopsy. Look first at the background: the liver
    parenchyma is uniform red-brown. Then find the pale, round, well-defined nodules of many sizes scattered across the
    whole section; the largest measure several centimeters, as the scale at the upper right shows. Several nodules of
    different size are the typical gross sign of blood-borne spread, here through the portal vein.
alt:
  it: >-
    Sezione di fegato rosso-bruno con numerosi noduli tondeggianti color crema, di dimensioni diverse, su sfondo
    azzurro; in alto a destra una scala graduata in centimetri.
  en: >-
    Cut section of a red-brown liver with many round cream-colored nodules of different sizes on a blue background; a
    centimeter scale sits at the upper right.
