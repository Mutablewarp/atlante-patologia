lookFor:
  it: "Guarda sotto il nucleo della cellula pallida al centro: i filamenti rosa-violacei avvolti come una corda sono il corpo di Mallory-Denk."
  en: "Look below the nucleus of the pale central cell: the pink-purple strands coiled like a rope are the Mallory–Denk body."
caption:
  it: >-
    La stessa cellula a forte ingrandimento (ingrandimento originale 400×), EE. La cellula al centro è molto più grande
    delle vicine e il suo citoplasma è quasi vuoto, attraversato solo da sottili filamenti chiari: è la degenerazione
    balloniforme, segno che l'epatocita è gravemente danneggiato. Sotto il suo nucleo scuro sta il corpo di
    Mallory-Denk: filamenti rosa-violacei avvolti su se stessi, come una corda sfilacciata, raccolti in una massa
    ricurva. In EE rientra nel materiale «ialino», rosa e vitreo: la parola descrive un aspetto, non una sostanza, e
    capisci di che cosa si tratta solo sapendo dove ti trovi. Qui, dentro un epatocita, è un aggregato di filamenti di
    citocheratina: una proteina della cellula stessa che si accumula al suo interno. Confrontalo con i grandi vacuoli
    rotondi e vuoti tutt'intorno: sono grasso sciolto durante l'allestimento del preparato, non proteina. Leggendo una
    biopsia cercheresti anche i neutrofili raccolti attorno a cellule come questa.
  en: >-
    The same cell at high power (original magnification 400×), H&E. The cell in the centre is far larger than its
    neighbours and its cytoplasm is almost empty, crossed only by thin pale wisps: this is ballooning, a sign that the
    hepatocyte is badly damaged. Below its dark nucleus lies the Mallory–Denk body: pink-purple strands coiled on
    themselves like a frayed rope, packed into a curved mass. On H&E it counts as "hyaline" material, pink and glassy:
    the word describes a look, not a substance, and you learn what it is only by knowing where you are. Here, inside a
    hepatocyte, it is an aggregate of cytokeratin filaments: one of the cell's own proteins accumulating inside it.
    Compare it with the large, round, empty vacuoles all around: they are fat dissolved while the slide was prepared,
    not protein. When reading a biopsy you would also look for neutrophils gathered around cells like this one.
alt:
  it: >-
    Micrografia ad alto ingrandimento di fegato in ematossilina-eosina: al centro un grande epatocita pallido, quasi
    vuoto, con un nucleo scuro e, sotto di esso, una massa ricurva di filamenti rosa-violacei avvolti; attorno, epatociti
    con vacuoli di grasso rotondi e vuoti di varie dimensioni.
  en: >-
    High-power H&E micrograph of liver: in the centre a large, pale, almost empty hepatocyte with a dark nucleus and,
    below it, a curved mass of coiled pink-purple strands; around it, hepatocytes with round, empty fat vacuoles of
    various sizes.
