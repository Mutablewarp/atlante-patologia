  en: "Right heart opened: the cut edge of the right ventricular free wall runs down the left side; the tricuspid chordae are in the centre."
lookFor:
  it: "Confronta lo spessore del muscolo sul margine di taglio con le trabecole accanto: un ventricolo destro normale ha una parete sottile."
  en: "Compare the thickness of muscle at the cut edge with the trabeculae beside it: a normal right ventricle has a thin wall."
caption:
  it: >-
    Ipertrofia del ventricolo destro nel cuore polmonare cronico: cuore aperto per mostrare il ventricolo destro; nella
    fotografia non c'è un righello. Prima orientati: il grasso epicardico giallo in alto a sinistra, con due lumi
    vascolari, segna la superficie esterna del cuore; lungo il lato sinistro scende il margine di taglio della parete
    libera del ventricolo destro; al centro sottili corde tendinee bianche vanno dai muscoli papillari ai lembi della
    valvola tricuspide. Reperto chiave: sul margine di taglio la parete libera è una fascia di muscolo larga e
    compatta, e dentro la cavità i muscoli papillari e le trabecole carnee sono grossolani e in rilievo. Il ventricolo
    destro normale spinge il sangue nel circolo polmonare, che ha una pressione bassa, e la sua parete è spessa
    0,3–0,5 cm; quando l'ipertensione polmonare, dovuta a una malattia cronica del polmone o dei vasi polmonari, gli
    impone un carico maggiore, i miociti si ingrandiscono e la parete può superare 1 cm. È lo stesso adattamento al
    sovraccarico di pressione che produce l'ipertrofia concentrica del ventricolo sinistro, mostrata in un'altra
    immagine di questa scheda, ma nell'altro ventricolo; nel cuore polmonare all'ispessimento si associa spesso la
    dilatazione delle cavità destre. Attenzione: senza righello, e con un taglio che può non essere perpendicolare
    alla parete, lo spessore non si legge da questa fotografia; al riscontro autoptico il cuore si pesa e lo spessore
    si misura su una fetta trasversale, ad angolo retto rispetto alla parete.
  en: >-
    Right ventricular hypertrophy in chronic cor pulmonale: heart opened to show the right ventricle; there is no ruler
    in the photograph. Orient yourself first: the yellow epicardial fat at the top left, with two vessel lumens, marks
    the outer surface of the heart; the cut edge of the right ventricular free wall runs down the left side; in the
    centre, thin white chordae tendineae run from the papillary muscles to the leaflets of the tricuspid valve. Key
    finding: at the cut edge the free wall is a broad, solid band of muscle, and inside the chamber the papillary
    muscles and trabeculae carneae are coarse and prominent. The normal right ventricle pumps into the low-pressure
    pulmonary circulation and its wall is 0.3–0.5 cm thick; when pulmonary hypertension, caused by chronic lung disease
    or by disease of the pulmonary vessels, raises its workload, the myocytes enlarge and the wall can exceed 1 cm. This
    is the same pressure-overload adaptation that produces the concentric left ventricular hypertrophy shown in another
    image on this card, but in the other ventricle; in cor pulmonale the thickening is often combined with dilation of
    the right-sided chambers. Pitfall: without a ruler, and with a cut that may not be perpendicular to the wall,
    thickness cannot be read from this photograph; at autopsy the heart is weighed and wall thickness is measured on a
    transverse slice, at a right angle to the wall.
alt:
  it: >-
    Fotografia di un cuore aperto su fondo nero. A sinistra una fascia spessa di muscolo rosa-bruno, a forma di cuneo e
    con superficie di taglio liscia, va dall'alto in basso; alla sua estremità superiore c'è grasso giallo con due
    piccoli orifizi rotondi. Al centro sottili cordoncini bianchi vanno da colonne muscolari a un tessuto valvolare
    pallido; più in basso la cavità è rivestita da rilievi muscolari, e a destra c'è un'altra parete tagliata, con grasso.
  en: >-
    Photograph of an opened heart on a black background. On the left a thick, wedge-shaped band of pink-brown muscle
    with a smooth cut surface runs from top to bottom; at its upper end lies yellow fat with two small round openings.
    In the centre thin white cords run from muscular columns to pale valve tissue; lower down, ridged muscle lines the
    chamber, and on the right lies another cut wall with fat.
