lookFor:
  it: "Parti dalle arterie in basso a sinistra, poi guarda i glomeruli e i tubuli: confronta la parete dei vasi con il resto del parenchima."
  en: "Start with the arteries at the lower left, then look at the glomeruli and tubules: compare the vessel walls with the rest of the parenchyma."
caption:
  it: >-
    Biopsia renale, PAS a medio ingrandimento, in un caso di microangiopatia trombotica. Guarda prima i vasi in basso a
    sinistra: le pareti arteriose sono ispessite da strati concentrici, a cipolla, e il lume è ridotto. Cerca poi i
    glomeruli, uno in alto e uno in basso a destra, e valuta se le anse capillari sono pervie. Al centro a destra
    diversi tubuli contengono cilindri rosa. Il quadro mostra il danno dei piccoli vasi; la diagnosi di microangiopatia
    trombotica si basa sull'insieme dei reperti e non su questa sola immagine.
  en: >-
    Kidney biopsy, PAS at medium power, in a case of thrombotic microangiopathy. Look first at the vessels at the lower
    left: the arterial walls are thickened by concentric, onion-skin layers and the lumen is narrowed. Then find the
    glomeruli, one at the top and one at the lower right, and judge whether the capillary loops are open. At the center
    right several tubules hold pink casts. The picture shows injury of small vessels; the diagnosis of thrombotic
    microangiopathy rests on the whole set of findings, not on this image alone.
alt:
  it: >-
    Micrografia PAS di un frustolo di biopsia renale: in basso a sinistra arterie con pareti ispessite a strati
    concentrici e lume ristretto; glomeruli in alto e in basso a destra; al centro a destra tubuli dilatati con
    cilindri rosa.
  en: >-
    PAS micrograph of a kidney biopsy core: at the lower left, arteries with walls thickened in concentric layers and a
    narrowed lumen; glomeruli at the top and the lower right; at the center right, dilated tubules with pink casts.
