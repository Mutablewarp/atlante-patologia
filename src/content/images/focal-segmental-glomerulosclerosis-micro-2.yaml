lookFor:
  it: "Segui il contorno del gomitolo: confronta le anse aperte con il segmento rosa compatto, in basso a destra, che sembra fondersi con la capsula."
  en: "Follow the outline of the tuft: compare the open loops with the dense pink segment at lower right, which seems to merge with the capsule."
caption:
  it: >-
    Glomerulosclerosi focale segmentaria, variante ilare, PAS a ingrandimento maggiore, stesso glomerulo della figura
    precedente. La maggior parte del gomitolo ha anse aperte con membrana basale sottile. Una porzione, in basso a
    destra, è sostituita da materiale rosa compatto e si continua con la parete della capsula di Bowman.
  en: >-
    Focal segmental glomerulosclerosis, hilar variant, PAS at higher power, same glomerulus as the previous figure.
    Most of the tuft has open loops with thin basement membranes. One portion, at lower right, is replaced by dense
    pink material that continues into the wall of Bowman capsule.
alt:
  it: >-
    Micrografia PAS a forte ingrandimento di un glomerulo rotondo circondato da tubuli: la maggior parte delle anse è
    aperta, mentre una porzione in basso a destra è occupata da materiale rosa compatto.
  en: >-
    High-power PAS micrograph of a round glomerulus surrounded by tubules: most loops are open, while one portion at
    lower right is filled with dense pink material.
