lookFor:
  it: "Confronta le ghiandole dilatate, con spazi chiari e bordi irregolari, con lo stroma rosa di fondo, e cerca gli addensamenti di ghiandole piccole al centro."
  en: "Compare the dilated glands, with pale lumens and irregular outlines, with the pink stroma around them, and find the clusters of small glands in the center."
caption:
  it: >-
    Iperplasia nodulare della prostata, EE a basso ingrandimento (curettage da resezione transuretrale). Ghiandole di
    dimensioni molto diverse, alcune dilatate con profili irregolari, sono immerse in uno stroma fibromuscolare
    abbondante. Il risultato è un tessuto in cui sia le ghiandole sia lo stroma sono aumentati.
  en: >-
    Nodular hyperplasia of the prostate, H&E at low power (curettings from a transurethral resection). Glands of very
    different sizes, some dilated with irregular outlines, lie in abundant fibromuscular stroma. Both glands and stroma
    are increased.
alt:
  it: >-
    Micrografia a basso ingrandimento in EE: ghiandole con lumi chiari, alcune grandi e dilatate, altre piccole e
    raggruppate al centro, in uno stroma rosa; materiale scuro a sinistra in basso e in basso a destra.
  en: >-
    Low-power H&E micrograph: glands with pale lumens, some large and dilated, others small and clustered at the center,
    in pink stroma; dark material at the lower left and lower right.
