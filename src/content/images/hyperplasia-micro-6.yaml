orientation:
  it: "In alto la capsula e il grasso perilinfonodale; il follicolo si trova nella corticale, subito sotto."
  en: "Capsule and perinodal fat at the top; the follicle lies in the cortex just beneath them."
lookFor:
  it: "Guarda solo il centro germinativo: blu (negativo) è compatibile con un'iperplasia reattiva; centri follicolari rossi farebbero pensare a un linfoma follicolare."
  en: "Judge the germinal centre only: blue (negative) fits reactive hyperplasia; red follicle centres would point to follicular lymphoma."
caption:
  it: >-
    Iperplasia follicolare reattiva di un linfonodo, immunoistochimica per Bcl-2 (cellule positive in rosso, nuclei
    controcolorati in blu), a medio ingrandimento. Orientati prima: in alto ci sono la capsula e il grasso perilinfonodale, e
    il follicolo si trova subito sotto. Al centro c'è il centro germinativo, un ovale di cellule più grandi e più
    chiare: è quasi tutto blu, cioè negativo per Bcl-2. Tutt'intorno, l'orlo compatto di piccoli linfociti (la zona
    mantellare) e molti piccoli linfociti tra un follicolo e l'altro sono rossi: queste cellule normali dimostrano che
    la reazione ha funzionato, quindi il centro germinativo vuoto è un vero negativo. È un'iperplasia compensatoria, di
    tipo immunitario: i linfociti B che incontrano un antigene proliferano nei centri germinativi, i follicoli si
    ingrandiscono e il linfonodo aumenta di volume, e il quadro regredisce quando lo stimolo scompare. Bcl-2 è una
    proteina che blocca l'apoptosi. La sua assenza nei centri germinativi reattivi aiuta a distinguere questa
    iperplasia dal linfoma follicolare, in cui la traslocazione t(14;18) sposta il gene BCL2 accanto al locus della
    catena pesante delle immunoglobuline e ne provoca così l'iperespressione: oltre il 90% dei casi esprime la proteina
    nei follicoli neoplastici. Attenzione: valuta i centri germinativi e non il linfonodo nel suo insieme, perché, come si vede qui, i piccoli
    linfociti attorno al follicolo sono comunque positivi.
  en: >-
    Reactive follicular hyperplasia in a lymph node, immunohistochemistry for Bcl-2 (positive cells red, nuclei
    counterstained blue), medium power. Orient yourself first: the capsule and the perinodal fat are at the top, and
    the follicle lies just beneath them. In the centre is the germinal centre, an oval of larger, paler cells: it is
    almost entirely blue, that is, Bcl-2 negative. Around it, the dense rim of small lymphocytes (the mantle zone) and
    many small lymphocytes between the follicles are red: these normal cells show that the stain has worked, so the
    empty germinal centre is a true negative. This is a compensatory, immune hyperplasia: B cells that meet an antigen
    proliferate in the germinal centres, the follicles enlarge and the node swells, and the change regresses once the
    stimulus is gone. Bcl-2 is a protein that blocks apoptosis. Its absence from reactive germinal centres helps
    separate this hyperplasia from follicular lymphoma, in which the t(14;18) translocation joins the BCL2 gene to the
    immunoglobulin heavy-chain locus, which drives its overexpression: more than 90% of cases express the protein in
    the neoplastic follicles. Pitfall: judge the germinal centres, not the node as a whole, because, as this image shows,
    the small lymphocytes around the follicle are positive anyway.
alt:
  it: >-
    Micrografia di linfonodo colorata in rosso e blu: cellule adipose bianche lungo il margine superiore; sotto, al
    centro, un'ampia area ovale di cellule azzurro chiaro, circondata da uno spesso anello di piccole cellule
    fittamente stipate colorate in rosso; altre cellule rosse e blu occupano il resto del campo.
  en: >-
    Red-and-blue micrograph of a lymph node: white fat cells along the top edge; below them, in the centre, a large
    oval area of pale blue cells, surrounded by a thick ring of densely packed small red-stained cells; more red and
    blue cells fill the rest of the field.
