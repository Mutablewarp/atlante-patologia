lookFor:
  it: "Cerca la massa chiara e fibrosa all'ilo e confrontala con il parenchima epatico scuro intorno."
  en: "Look for the pale, fibrous mass at the hilum and compare it with the dark liver parenchyma around it."
caption:
  it: >-
    Colangiocarcinoma perilare (tumore di Klatskin) su un fegato asportato con emiepatectomia destra. Guarda il centro
    dell'immagine: una massa dura, bianco-giallastra e fibrosa, a superficie di taglio compatta, occupa l'ilo. Il
    parenchima epatico intorno è bruno scuro, con una superficie irregolare. Il contrasto tra il tumore pallido e il
    fegato scuro mostra come questo carcinoma sia un tessuto fibroso e compatto.
  en: >-
    Perihilar cholangiocarcinoma (Klatskin tumor) on a liver removed by right hemihepatectomy. Look at the center of
    the image: a firm, white-yellow, fibrous mass with a compact cut surface occupies the hilum. The liver parenchyma
    around it is dark brown with an irregular surface. The contrast between the pale tumor and the dark liver shows
    that this carcinoma is a compact fibrous tissue.
alt:
  it: >-
    Fotografia di un pezzo operatorio di fegato: al centro una massa compatta bianco-rosata e lobulata all'ilo, tra
    parenchima bruno scuro dall'aspetto irregolare; sullo sfondo un telo chiaro.
  en: >-
    Photograph of a liver surgical specimen: at the center a compact, white-pink lobulated mass at the hilum, among
    dark brown parenchyma with an irregular surface; a pale cloth in the background.
