caption:
  it: >-
    La necroptosi è una morte «litica», e questa sequenza lo mostra. Organoidi di colangiociti intraepatici umani
    (l'epitelio dei dotti biliari, coltivato da fegato di donatore) sono stati ripresi da vivi a 0, 3, 6 e 12 ore, con
    ioduro di propidio nel terreno: è un colorante rosso del DNA che entra solo nelle cellule la cui membrana plasmatica
    è diventata permeabile. Leggi una riga per volta. CTR, nessun trattamento: l'organoide resta una grande sfera liscia,
    senza rosso. T/S, TNF-α più uno Smac-mimetico (toglie il freno delle proteine IAP alla segnalazione di morte):
    l'organoide si rimpicciolisce e perde cellule, ma a 12 ore il rosso è quasi assente; le cellule muoiono per
    apoptosi e mantengono integra la membrana. T/S/Z, lo stesso più zVAD-fmk, un inibitore di tutte le caspasi:
    anche qui l'organoide si riduce, ma i primi punti rossi compaiono già a 3 ore e a 6–12 ore il rosso lo riempie,
    segno che le membrane sono state forate. Perché il terzo farmaco cambia il tipo di morte: con le caspasi bloccate,
    la caspasi-8 non può più tagliare RIPK1; RIPK1 e RIPK3 formano allora il necrosoma, che attiva MLKL, e MLKL apre la
    membrana. Nello studio originale gli organoidi T/S/Z contenevano MLKL fosforilata, che scompariva aggiungendo la
    necrostatina-1, un inibitore di RIPK1. Da ricordare: bloccare le caspasi non salva la cellula, le fa solo cambiare
    uscita, verso una morte con membrana rotta e quindi infiammatoria. Attenzione: sono organoidi in coltura, non una
    sezione di tessuto.
  en: >-
    Necroptosis is a lytic death, and this time series shows it. Organoids of human intrahepatic cholangiocytes
    (bile-duct epithelium grown from donor liver) were imaged alive at 0, 3, 6 and 12 hours with propidium iodide in
    the medium: a red DNA dye that enters only cells whose plasma membrane has become leaky. Read one row at a time.
    CTR, untreated: the organoid stays a large, smooth sphere with no red. T/S, TNF-α plus a Smac mimetic (which lifts
    the brake that IAP proteins put on death signalling): the organoid shrinks and sheds cells, yet at 12 hours there
    is hardly any red; the cells die by apoptosis and keep their membranes closed. T/S/Z, the same plus
    zVAD-fmk, an inhibitor of all caspases: this organoid shrinks too, but the first red spots appear by 3 hours and by
    6–12 hours red fills it, a sign that the membranes have been breached. Why the third drug changes the kind of
    death: with caspases blocked, caspase-8 can no longer cut RIPK1, so RIPK1 and RIPK3 assemble the necrosome, which
    activates MLKL, and MLKL opens the membrane. In the source study the T/S/Z organoids contained phosphorylated MLKL,
    which disappeared with necrostatin-1, an inhibitor of RIPK1. Key point: blocking caspases does not save the cell, it
    only sends it out by another exit, towards a death with a ruptured membrane and therefore an inflammatory one. Note
    that these are organoids in culture, not a tissue section.
alt:
  it: >-
    Griglia di 12 immagini in campo chiaro su fondo grigio, in tre righe etichettate CTR, T/S e T/S/Z e quattro colonne
    etichettate 0, 3, 6 e 12. Nella riga CTR un grande organoide sferico e liscio resta uguale in tutte le colonne. Nella
    riga T/S l'organoide si rimpicciolisce col tempo e a 12 ore è piccolo e irregolare, con sporgenze sulla superficie
    e quasi senza rosso. Nella riga T/S/Z l'organoide si rimpicciolisce e da 3 ore contiene macchie rosse che a 12 ore
    occupano gran parte del suo interno.
  en: >-
    Grid of 12 bright-field images on a grey background, in three rows labelled CTR, T/S and T/S/Z and four columns
    labelled 0, 3, 6 and 12. In the CTR row a large, smooth, spherical organoid stays the same in every column. In the
    T/S row the organoid shrinks over time and at 12 hours is small and irregular, with knobs on its surface and almost
    no red. In the T/S/Z row the organoid shrinks and from 3 hours contains red patches that by 12 hours fill most of its
    interior.
