caption:
  it: >-
    Miosite a corpi inclusi, una malattia muscolare dell'uomo in cui lo smaltimento autofagico è inefficiente: figura
    composita da una biopsia muscolare. Concentrati su due pannelli. Pannello (a), ematossilina-eosina, ingrandimento
    medio: fibre muscolari tagliate trasversalmente, di calibro variabile; dentro alcune fibre cerca piccole fessure
    irregolari bordate da materiale granulare blu-violaceo. Sono i vacuoli orlati (rimmed vacuoles), che contengono
    detriti di origine autofagica. Pannello (e), immunoistochimica per p62 (sequestosoma 1), ingrandimento maggiore:
    una fibra è punteggiata di granuli marroni, mentre quelle accanto sono pulite. p62 è l'adattatore che aggancia il
    materiale marcato con ubiquitina al macchinario autofagico e viene degradato insieme a esso: se si accumula in
    aggregati, vuol dire che il flusso autofagico è bloccato. Gli altri pannelli mostrano altri aspetti della malattia,
    cioè amiloide al rosso Congo (b), tubulofilamenti al microscopio elettronico (c), aumento delle molecole MHC di
    classe I (d) e aggregati di TDP-43 (f), e qui non sono il punto principale.
  en: >-
    Inclusion body myositis, a human muscle disease in which autophagic clearance fails: a composite figure from a
    muscle biopsy. Focus on two panels. Panel (a), H&E, medium power: muscle fibres cut in cross-section, of varying
    size; inside some fibres look for small irregular clefts edged by bluish-purple granular material. These are
    rimmed vacuoles, which contain debris of autophagic origin. Panel (e), immunohistochemistry for p62
    (sequestosome 1), higher power: one fibre is dotted with brown granules while its neighbours are clean. p62 is
    the adaptor that hooks ubiquitin-tagged cargo onto the autophagy machinery and is degraded together with it, so
    when it builds up in aggregates the autophagic flux is blocked. The remaining panels show other features of the
    disease, namely amyloid with Congo red (b), tubulofilaments on electron microscopy (c), increased MHC class I
    expression (d) and TDP-43 aggregates (f), and are not the main point here.
alt:
  it: >-
    Figura in sei pannelli di sezioni di biopsia muscolare, contrassegnati da (a) a (f). (a) ematossilina-eosina:
    fibre muscolari rosa e tondeggianti in sezione trasversale, alcune con piccole fessure irregolari a bordo
    granulare bluastro. (b) fluorescenza verde con un deposito rosso fra le fibre. (c) micrografia elettronica grigia
    con fasci di filamenti. (d) e (f) colorazione immunoistochimica marrone che delinea le fibre. (e) una fibra chiara
    piena di puntini marrone scuro, circondata da fibre non colorate con nuclei blu.
  en: >-
    Six-panel figure of muscle biopsy sections labelled (a) to (f). (a) H&E: pink, rounded muscle fibres in
    cross-section, a few containing small irregular clefts with bluish granular edges. (b) green fluorescence with a
    red deposit between fibres. (c) grey electron micrograph with bundles of filaments. (d) and (f) brown
    immunostaining outlining the fibres. (e) a pale fibre filled with scattered dark brown dots, surrounded by
    unstained fibres with blue nuclei.
