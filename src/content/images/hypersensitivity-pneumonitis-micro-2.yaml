lookFor:
  it: "Segui i setti alveolari lievemente espansi da linfociti e cerca una cellula gigante multinucleata nell'interstizio, a destra: è l'indizio per la diagnosi."
  en: "Follow the alveolar septa mildly expanded by lymphocytes and look for a multinucleated giant cell in the interstitium at right: it is the clue to the diagnosis."
caption:
  it: >-
    Polmonite da ipersensibilità cronica, EE a ingrandimento maggiore. I setti alveolari sono espansi in modo lieve da
    linfociti, con qualche globulo rosso negli spazi aerei. A destra, a metà altezza, una cellula gigante multinucleata
    nell'interstizio è l'indizio più utile per distinguere questo quadro da altre polmoniti interstiziali.
  en: >-
    Chronic hypersensitivity pneumonitis, H&E at higher power. The alveolar septa are mildly expanded by lymphocytes,
    with a few red cells in the air spaces. At right, halfway down, a multinucleated giant cell in the interstitium is
    the most useful clue that separates this picture from other interstitial pneumonias.
alt:
  it: "Sezione di polmone colorata con ematossilina-eosina: setti alveolari sottili con piccoli linfociti viola, spazi aerei chiari e una grande cellula gigante rosa a destra."
  en: "Hematoxylin-eosin lung section: thin alveolar septa with small purple lymphocytes, pale air spaces and one large pink giant cell at right."
