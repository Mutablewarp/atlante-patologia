lookFor:
  it: "Cerca le sfere rosa intenso a strati concentrici e guarda le cellule che le circondano."
  en: "Find the deep pink spheres made of concentric layers and look at the cells around them."
caption:
  it: >-
    Perle cornee in un carcinoma squamoso della laringe, ad alto ingrandimento. Guarda prima le sfere rosa intenso a
    strati concentrici: è cheratina prodotta dalle cellule tumorali. Poi osserva le cellule attorno, con nuclei
    vescicolosi di dimensioni diverse, immerse in uno stroma rosa.
  en: >-
    Keratin pearls in a laryngeal squamous cell carcinoma, at high power. Look first at the deep pink spheres of
    concentric layers: this is keratin made by the tumor cells. Then look at the cells around them, with vesicular nuclei
    of different sizes, set in a pink stroma.
alt:
  it: >-
    Microfotografia H&E: tre grandi sfere rosa intenso a strati concentrici, circondate da cellule con nuclei violacei in
    uno stroma rosa.
  en: >-
    H&E micrograph: three large deep pink spheres of concentric layers, surrounded by cells with purple nuclei in a pink
    stroma.
