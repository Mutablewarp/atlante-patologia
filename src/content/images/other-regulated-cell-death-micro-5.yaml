lookFor:
  it: "Parti dalla cellula interna, tonda e con il suo nucleo, poi trova alla sua sinistra il nucleo dell'ospite schiacciato a mezzaluna."
  en: "Start from the round inner cell with its own nucleus, then find the host nucleus squeezed into a crescent on its left."
caption:
  it: >-
    La stessa figura «cellula nella cellula» a ingrandimento forte (obiettivo 40×; secondo la legenda la barra nera in
    basso misura 10 µm). Leggila dall'interno verso l'esterno. A destra del centro c'è la cellula interna: tonda e intera, con il suo
    nucleo e un orlo di citoplasma, quindi una cellula integra e non un frammento. Un sottile spazio chiaro la separa
    dalla cellula ospite: è il vacuolo in cui è racchiusa. Alla sua sinistra il nucleo della cellula ospite è stato
    schiacciato in una mezzaluna scura che abbraccia l'intrusa; insieme all'orlo chiaro, è questa mezzaluna a tradire la
    figura. Per confronto guarda il grande nucleo di una normale cellula di carcinoma vicina, sul margine sinistro. Da
    ricordare: la cellula interna appare integra e non mostra né il raggrinzimento, né la cromatina compatta, né la
    frammentazione di un corpo apoptotico fagocitato, come ci si aspetta da una cellula entrata viva, cioè per entosi.
    Nell'entosi la cellula interna di solito viene digerita quando i lisosomi si uniscono al vacuolo, eppure alcune
    sopravvivono e qualcuna riesce perfino a uscire. Trappola:
    anche la cellula ad anello con castone ha un nucleo a mezzaluna, ma lì a spingerlo di lato è un vacuolo di muco, non
    una cellula intera con un nucleo proprio.
  en: >-
    The same cell-in-cell figure at high power (40× objective; according to the legend, the black bar at the bottom is
    10 µm). Read it from the inside out. Right of centre lies the inner cell: round and whole, with its own nucleus and
    a rim of cytoplasm, so it is an intact cell, not a fragment. A thin clear space separates it from the host cell:
    this is the vacuole that encloses it. On its left, the host cell's own nucleus has been pressed into a dark crescent
    that hugs the intruder; together with the clear rim, this crescent is what gives the figure away. For comparison,
    look at the large nucleus of an ordinary neighbouring carcinoma cell at the left edge. Key points: the inner cell
    looks intact, with none of the shrinkage, dense chromatin or fragmentation of an apoptotic body taken up by a
    phagocyte, which fits a cell that went in alive, as in entosis. In entosis the inner cell is usually digested once
    lysosomes merge with the vacuole, yet some survive and a few even get out again. Pitfall: a signet-ring cell also has a crescent-shaped nucleus, but
    there it is pushed aside by a vacuole of mucin, not by a whole cell with a nucleus of its own.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento: al centro una cellula tonda con nucleo granulare si trova
    dentro un'altra cellula, separata da un sottile orlo chiaro; alla sua sinistra il nucleo scuro della cellula ospite
    è curvato a mezzaluna attorno a lei e un ampio spazio pallido circonda la coppia. Intorno ci sono altre cellule di
    carcinoma con grandi nuclei, una sul margine sinistro; in basso a sinistra una barra di scala nera.
  en: >-
    High-power H&E micrograph: in the centre a round cell with a granular nucleus sits inside another cell, separated
    from it by a thin clear rim; on its left the host cell's dark nucleus is curved into a crescent around it, and a
    wide pale space surrounds the pair. Other carcinoma cells with large nuclei lie around, one at the left edge; a
    black scale bar is at the bottom left.
