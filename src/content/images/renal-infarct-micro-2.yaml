lookFor:
  it: "Guarda dentro i glomeruli e i tubuli: il contorno c'è ancora, ma i nuclei no."
  en: "Look inside the glomeruli and tubules: the outline is still there, but the nuclei are not."
caption:
  it: >-
    Area infartuata del rene, EE ad alto ingrandimento (obiettivo 40x). Due glomeruli e i tubuli intorno conservano la
    sagoma e la membrana basale, ma le cellule sono pallide e quasi senza nuclei. È l'aspetto della necrosi
    coagulativa: l'architettura resta riconoscibile anche se le cellule sono morte.
  en: >-
    Infarcted area of kidney, H&E at high power (40x objective). Two glomeruli and the surrounding tubules keep their
    shape and basement membrane, but the cells are pale and almost without nuclei. This is the look of coagulative
    necrosis: the architecture stays recognizable even though the cells are dead.
alt:
  it: >-
    Micrografia di rene in ematossilina-eosina ad alto ingrandimento: due glomeruli e tubuli dal profilo conservato,
    con cellule pallide rosa-violacee e nuclei quasi assenti.
  en: >-
    High-power H&E micrograph of kidney: two glomeruli and tubules with preserved outlines, with pale pink-purple
    cells and nearly absent nuclei.
