lookFor:
  it: >-
    Confronta le dimensioni e la forma dei nuclei: variano molto da una cellula all'altra, e le cellule sono disordinate.
  en: >-
    Compare the size and shape of the nuclei: they vary a lot from cell to cell, and the cells are crowded and disordered.
caption:
  it: >-
    Lo stesso carcinoma uroteliale in situ, EE ad alto ingrandimento. Osserva i nuclei: sono grandi, ipercromatici e di
    dimensioni e forma molto diverse tra loro, e le cellule sono affollate e disordinate in tutto lo spessore
    dell'epitelio. Sotto, lo stroma rosa è libero da cellule atipiche: la membrana basale non è stata superata.
  en: >-
    The same urothelial carcinoma in situ, H&E at high power. Look at the nuclei: they are large, hyperchromatic and
    very different in size and shape, and the cells are crowded and disordered through the whole thickness of the
    epithelium. Below, the pink stroma is free of atypical cells: the basement membrane has not been crossed.
alt:
  it: >-
    Micrografia in ematossilina-eosina ad alto ingrandimento: in alto un epitelio con nuclei viola scuri, ingranditi e
    di forma irregolare, affollati; sotto uno stroma rosa pallido con vasi rossi e piccole cellule isolate.
  en: >-
    High-power H&E micrograph: at the top an epithelium with enlarged, irregular, dark purple nuclei, crowded together;
    below it pale pink stroma with red vessels and small scattered cells.
