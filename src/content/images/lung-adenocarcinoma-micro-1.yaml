lookFor:
  it: "Segui i setti alveolari: sono conservati e rivestiti da un solo strato di cellule atipiche, senza distruzione dell'architettura."
  en: "Follow the alveolar septa: they are preserved and lined by a single layer of atypical cells, without destruction of the architecture."
caption:
  it: >-
    Adenocarcinoma polmonare con crescita lepidica, EE a basso ingrandimento (lobectomia). Guarda prima l'architettura:
    gli spazi aerei sono ancora riconoscibili e i setti alveolari restano al loro posto. Poi osserva il rivestimento dei
    setti: uno strato di cellule tumorali violacee, più alte e più scure delle normali cellule alveolari, cresce lungo
    la parete senza distruggerla. Nei lumi si vedono globuli rossi e qualche macrofago.
  en: >-
    Lung adenocarcinoma with lepidic growth, H&E at low power (lobectomy). Look at the architecture first: the air
    spaces are still recognizable and the alveolar septa stay in place. Then look at the lining of the septa: a layer of
    purple tumor cells, taller and darker than normal alveolar cells, grows along the wall without destroying it. Red
    blood cells and a few macrophages sit in the lumens.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: rete di sottili setti alveolari rosa rivestiti da cellule
    violacee, con spazi aerei chiari tra i setti e qualche globulo rosso sparso nei lumi.
  en: >-
    Low-power H&E micrograph: a network of thin pink alveolar septa lined by purple cells, with clear air spaces between
    the septa and a few scattered red blood cells in the lumens.
