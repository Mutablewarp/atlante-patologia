lookFor:
  it: "Segui gli anelli concentrici dall'esterno verso il lume e confronta lo spessore della parete con il lume."
  en: "Follow the concentric rings from the outside toward the lumen and compare the wall thickness with the lumen."
caption:
  it: >-
    Arteria arcuata del rene in sezione trasversale, EE. Parti dal lume al centro, con alcuni globuli rossi, e risali
    verso l'esterno: la parete è molto ispessita e disposta in strati concentrici rosa con nuclei allungati, come le
    sfoglie di una cipolla. Intorno si vedono tubuli e glomeruli senza lesioni evidenti. Questo caso è una nefrosclerosi
    di grado moderato, non un'ipertensione maligna documentata: mostra l'aspetto concentrico a buccia di cipolla, ma qui
    non si riconosce necrosi fibrinoide.
  en: >-
    Arcuate artery of the kidney in cross section, H&E. Start at the lumen in the center, with a few red cells, and
    move outward: the wall is markedly thickened and built of concentric pink layers with elongated nuclei, like the
    layers of an onion. Tubules and glomeruli around it show no obvious lesion. This is moderate nephrosclerosis, not a
    documented case of malignant hypertension: it shows the concentric onion-skin look, but no fibrinoid necrosis is
    visible here.
alt:
  it: >-
    Micrografia in ematossilina-eosina di un'arteria renale in sezione trasversale, con parete spessa a strati
    concentrici rosa e un lume centrale con pochi globuli rossi; ai lati tubuli renali.
  en: >-
    H&E micrograph of a renal artery in cross section, with a thick wall of concentric pink layers and a central lumen
    holding a few red blood cells; kidney tubules lie at the sides.
