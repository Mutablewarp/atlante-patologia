lookFor:
  it: "Individua i fasci broncovascolari e guarda come il parenchima intorno a loro è compresso."
  en: "Find the bronchovascular bundles and look at how the parenchyma around them is squeezed."
caption:
  it: >-
    Collasso del tessuto polmonare accanto a un fascio broncovascolare, a basso ingrandimento. Intorno ai vasi dalle
    pareti spesse il parenchima è denso, con alveoli ridotti a fessure; ai margini dell'immagine, in alto a sinistra,
    gli alveoli aperti mostrano come dovrebbe apparire il polmone espanso.
  en: >-
    Collapse of lung tissue next to a bronchovascular bundle, at low power. Around the thick-walled vessels the
    parenchyma is dense, with alveoli reduced to slits; at the upper left edge the open alveoli show how expanded lung
    should look.
alt:
  it: >-
    Micrografia rosa a basso ingrandimento: una banda diagonale di tessuto denso con piccoli vasi dalle pareti spesse,
    delimitata da aree chiare di alveoli aperti in alto a sinistra e in basso.
  en: >-
    Pink low-power micrograph: a diagonal band of dense tissue with small thick-walled vessels, bordered by pale areas
    of open alveoli at the upper left and at the bottom.
