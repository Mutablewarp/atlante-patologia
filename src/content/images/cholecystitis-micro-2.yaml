lookFor:
  it: Leggi la parete dal lume verso l'esterno, strato per strato, e confronta lo spessore di mucosa e fasci muscolari.
  en: Read the wall from the lumen outward, layer by layer, and compare the thickness of the mucosa and the muscle bundles.
caption:
  it: >-
    Parete della colecisti, EE a basso ingrandimento (campo circolare nella parte alta dell'immagine; l'autore la indica come colecistite cronica). Dal lume,
    in basso, verso l'alto: pieghe mucose irregolari e ramificate, un'area di connettivo denso, poi fasci rosa intensi di
    muscolatura liscia e, in alto, uno strato esterno più chiaro e lasso. È una visione d'insieme degli strati della
    parete; i dettagli cellulari richiedono un ingrandimento maggiore.
  en: >-
    Gallbladder wall, H&E at low power (circular field in the upper part of the picture; the author labels it chronic cholecystitis). From the lumen,
    below, toward the top: irregular, branching mucosal folds, an area of dense connective tissue, then intensely pink
    bundles of smooth muscle and, at the top, a paler, looser outer layer. This is an overview of the wall layers;
    cellular detail needs higher power.
alt:
  it: >-
    Micrografia in ematossilina-eosina, campo rotondo al centro di uno sfondo scuro: in basso pieghe mucose irregolari
    intorno a un'area chiara, sopra connettivo e fasci rosa di muscolatura liscia, in alto uno strato pallido e lasso.
  en: >-
    H&E micrograph in a round field in the middle of a dark background: at the bottom irregular mucosal folds around a
    pale area, above them connective tissue and pink bundles of smooth muscle, at the top a pale, loose layer.
