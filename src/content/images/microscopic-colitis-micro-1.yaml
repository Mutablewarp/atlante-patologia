lookFor:
  it: >-
    Guarda se le ghiandole sono ordinate e ben formate: nella colite microscopica l'architettura è conservata, e
    l'anomalia sta nel tessuto tra le ghiandole e sotto l'epitelio di superficie.
  en: >-
    Check whether the glands are orderly and well formed: in microscopic colitis the architecture is preserved, and the
    abnormality lies in the tissue between the glands and under the surface epithelium.
caption:
  it: >-
    Biopsia di colon in colite collagenosica, EE a basso ingrandimento. Parti dal quadro d'insieme: le ghiandole sono
    allineate in file regolari e hanno forma e calibro uniformi, senza la distorsione tipica delle malattie
    infiammatorie croniche intestinali. La lamina propria è più ricca di cellule infiammatorie del normale. Sotto
    l'epitelio di superficie corre una banda rosa più spessa del normale. La stessa lesione con la colorazione
    tricromica è nella foto successiva.
  en: >-
    Colon biopsy in collagenous colitis, H&E at low power. Start with the overall picture: the glands line up in
    regular rows and have uniform shape and caliber, without the distortion typical of inflammatory bowel disease. The
    lamina propria holds more inflammatory cells than normal. Under the surface epithelium runs a pink band that is
    thicker than normal. The same lesion with a trichrome stain is the next image.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina di mucosa colica: ghiandole allineate e regolari, lamina
    propria con cellule infiammatorie e una banda rosa sotto l'epitelio di superficie.
  en: >-
    Low-power H&E micrograph of colonic mucosa: regular, evenly aligned glands, a lamina propria with inflammatory
    cells, and a pink band under the surface epithelium.
