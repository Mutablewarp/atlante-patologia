caption:
  it: >-
    Steatosi macrovescicolare centrolobulare in biopsia epatica (tricromica di Masson con Verhoeff). Cerca gli spazi
    chiari rotondi nel citoplasma degli epatociti, che in alcune cellule spingono il nucleo di lato, e le sottili
    strie verdi di collagene attorno a una vena centrolobulare.
  en: >-
    Centrilobular macrovesicular steatosis in a liver biopsy (Masson's trichrome with Verhoeff). Look for the clear
    round spaces in the hepatocyte cytoplasm, which in some cells push the nucleus aside, and the thin green strands
    of collagen around a central vein.
alt:
  it: >-
    Micrografia di fegato con colorazione tricromica: epatociti rosso-rosati con numerosi vacuoli rotondi bianchi di
    varie dimensioni, un ampio lume vuoto al centro e sottili fibre verdi che lo circondano e si dirigono verso destra.
  en: >-
    Trichrome micrograph of liver: red-pink hepatocytes with many round white vacuoles of varying size, a large empty
    lumen at the center, and thin green fibers around it that extend toward the right.
lookFor:
  it: "Distingui le vacuoli di grasso (spazi bianchi netti) dai sinusoidi, poi cerca il verde del collagene attorno alla vena."
  en: "Tell the fat vacuoles (sharp white spaces) from the sinusoids, then look for the green collagen around the vein."
