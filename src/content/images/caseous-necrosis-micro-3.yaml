lookFor:
  it: "Trova il confine obliquo fra la necrosi rosa senza struttura e il tessuto ricco di cellule con le cellule giganti."
  en: "Find the oblique border between the structureless pink necrosis and the cellular tissue with the giant cells."
caption:
  it: >-
    Granuloma di tipo tubercolare con necrosi caseosa in un linfonodo, piccolo ingrandimento (la fonte non indica la
    colorazione; dall'aspetto è un'ematossilina-eosina). Parti dal quadro d'insieme: un confine obliquo divide il campo
    in due. In alto a destra c'è un'ampia area di necrosi caseosa: rosa, omogenea, senza nessuna struttura
    riconoscibile, con una sfumatura violacea e granulare nella parte più lontana dal bordo, dove si accumulano i
    frammenti dei nuclei (polvere nucleare). In basso e a sinistra c'è il tessuto vivo del granuloma, fitto di istiociti
    epitelioidi chiari e di piccoli linfociti scuri, nel quale spiccano diverse cellule giganti multinucleate, rotonde o
    ovali, con il citoplasma rosa e i nuclei raccolti alla periferia. Lungo il confine il tessuto diventa via via più
    pallido e più povero di nuclei, con cellule allungate disposte parallelamente al bordo: è il fronte su cui la
    necrosi avanza. Il punto chiave: dentro l'area caseosa non si riconoscono né i contorni delle cellule morte né
    l'architettura del linfonodo, mentre in un infarto (necrosi coagulativa) le sagome delle cellule resterebbero
    visibili, e un ascesso (necrosi colliquativa) avrebbe un centro fluido, pieno di granulociti neutrofili. Usa il
    selettore per passare al forte ingrandimento della stessa lesione.
  en: >-
    Tuberculosis-type granuloma with caseous necrosis in a lymph node, low power (the source does not name the stain; it
    looks like H&E). Start with the overview: an oblique border divides the field in two. In the upper right lies a wide
    area of caseous necrosis: pink, homogeneous, with no recognisable structure, and with a granular purple tinge in the
    part farthest from the border, where fragments of nuclei pile up (nuclear dust). Below and to the left lies the
    living tissue of the granuloma, crowded with pale epithelioid histiocytes and small dark lymphocytes, among which
    several multinucleated giant cells stand out, round or oval, with pink cytoplasm and nuclei gathered at the
    periphery. Along the border the tissue becomes paler and poorer in nuclei, with elongated cells lined up parallel to
    the edge: this is the front along which the necrosis advances. The key point: inside the caseous area neither the
    outlines of the dead cells nor the architecture of the node can be recognised, whereas in an infarct (coagulative
    necrosis) the cell outlines would still be visible, and an abscess (liquefactive necrosis) would have a fluid centre
    packed with neutrophils. Use the switch to move to high power of the same lesion.
alt:
  it: >-
    Micrografia rosa e viola: in alto a destra un'ampia area rosa omogenea senza cellule riconoscibili, con una
    sfumatura violacea; in basso e a sinistra tessuto fitto di piccoli nuclei scuri con diverse grandi cellule rosa
    multinucleate, rotonde o ovali.
  en: >-
    Pink and purple micrograph: in the upper right a wide homogeneous pink area with no recognisable cells and a purple
    tinge; below and to the left, tissue crowded with small dark nuclei and several large, round or oval, pink
    multinucleated cells.
