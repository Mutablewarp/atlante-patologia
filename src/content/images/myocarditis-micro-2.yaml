lookFor:
  it: "Cerca le grandi cellule multinucleate dentro l'area tratteggiata, in mezzo a un infiltrato infiammatorio fitto."
  en: "Look for the large multinucleated cells inside the dashed area, within a dense inflammatory infiltrate."
caption:
  it: >-
    Miocardite a cellule giganti, EE a medio ingrandimento. Il tratteggio, aggiunto dagli autori della pubblicazione,
    circoscrive una zona con infiltrato infiammatorio fitto. Al suo interno cerca poche cellule molto grandi, viola
    scuro, con più nuclei: sono le cellule giganti. Le fibre muscolari rosa a sinistra sono in gran parte sostituite
    dall'infiltrato.
  en: >-
    Giant cell myocarditis, H&E at medium power. The dashed outline, added by the authors of the publication, encloses
    an area with a dense inflammatory infiltrate. Inside it, look for a few very large, dark purple cells with several
    nuclei: these are the giant cells. The pink muscle fibers on the left are largely replaced by the infiltrate.
alt:
  it: >-
    Micrografia di miocardio in ematossilina-eosina con un infiltrato di piccole cellule infiammatorie; in una zona
    ovale tratteggiata si vedono tre cellule giganti viola scuro, molto più grandi delle cellule vicine.
  en: >-
    H&E micrograph of myocardium with an infiltrate of small inflammatory cells; inside a dashed oval area are three
    dark purple giant cells, much larger than the cells around them.
