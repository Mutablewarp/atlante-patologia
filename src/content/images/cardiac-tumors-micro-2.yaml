caption:
  it: >-
    Fibroelastoma papillare della valvola aortica, EE a basso ingrandimento. Il tessuto forma papille ramificate e
    sottili, che si staccano da una base in basso a sinistra. Ogni papilla ha un asse rosa intenso, fatto di materiale
    denso privo di vasi, rivestito da un sottile strato di cellule endoteliali. Sullo sfondo bianco molte papille sono
    tagliate in sezione trasversale e sembrano isole rosa.
  en: >-
    Papillary fibroelastoma of the aortic valve, H&E at low power. The tissue forms thin, branching papillae that arise
    from a base at the lower left. Each papilla has a deep pink core of dense material with no vessels, covered by a
    thin layer of endothelial cells. Against the white background many papillae are cut across and look like pink
    islands.
alt:
  it: >-
    Micrografia in ematossilina-eosina su fondo bianco: papille rosa intenso, lunghe e ramificate, con un sottile
    rivestimento cellulare, riunite in basso a sinistra e in parte tagliate in sezione trasversale.
  en: >-
    H&E micrograph on a white background: long, branching, deep pink papillae with a thin cellular lining, joined at
    the lower left and partly cut in cross-section.
lookFor:
  it: "Segui una papilla dalla base verso l'apice: l'asse è denso e senza vasi, il rivestimento è un solo strato di cellule."
  en: "Follow one papilla from its base to its tip: the core is dense and avascular, the lining is a single cell layer."
