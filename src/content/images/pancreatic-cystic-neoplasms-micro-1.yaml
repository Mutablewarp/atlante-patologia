lookFor:
  it: "Parti dal pancreas normale a sinistra, poi cerca la cisti a destra: il suo rivestimento è mucinoso e, sotto di esso, lo stroma è più cellulato."
  en: "Start with the normal pancreas on the left, then find the cyst on the right: its lining is mucinous and the stroma beneath it is more cellular."
caption:
  it: >-
    Neoplasia cistica mucinosa del pancreas, EE a basso ingrandimento. A sinistra il parenchima pancreatico normale, con
    acini fitti e un'isola endocrina chiara. Al centro una banda di connettivo fibroso rosa separa il parenchima dalla
    lesione. A destra la cisti è rivestita da un epitelio mucinoso che forma pieghe papillari; sotto il rivestimento lo
    stroma è più cellulato, di tipo ovarico, ed è l'elemento che distingue questa neoplasia dall'IPMN.
  en: >-
    Mucinous cystic neoplasm of the pancreas, H&E at low power. On the left is normal pancreatic parenchyma, with
    crowded acini and a pale endocrine islet. In the middle a band of pink fibrous tissue separates the parenchyma from
    the lesion. On the right the cyst is lined by a mucinous epithelium that forms papillary folds; beneath the lining
    the stroma is more cellular and ovarian-type, the element that sets this neoplasm apart from the IPMN.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a sinistra parenchima pancreatico normale con acini fitti, separato da una banda
    di connettivo rosa da una grande cisti a destra, rivestita da epitelio mucinoso con pieghe e circondata da stroma
    cellulato.
  en: >-
    H&E micrograph: on the left normal pancreatic parenchyma with crowded acini, separated by a band of pink connective
    tissue from a large cyst on the right, lined by folded mucinous epithelium and surrounded by cellular stroma.
