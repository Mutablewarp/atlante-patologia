lookFor:
  it: "Parti dal lume piccolo e irregolare al centro dell'arteriola a sinistra e conta gli strati concentrici che lo circondano, come le squame di una cipolla."
  en: "Start at the small, irregular lumen at the center of the arteriole on the left and count the concentric layers around it, like the scales of an onion."
caption:
  it: >-
    Corteccia renale ad alto ingrandimento. A sinistra un'arteriola in sezione trasversa ha il lume ridotto a una
    piccola fessura irregolare, circondato da molti strati concentrici di parete ispessita, come le squame di una
    cipolla. A destra un glomerulo con capillari pervi e, intorno, tubuli. È l'arteriolosclerosi iperplastica
    dell'ipertensione maligna.
  en: >-
    Renal cortex at high power. On the left, an arteriole in cross section has its lumen reduced to a small irregular
    slit, surrounded by many concentric layers of thickened wall, like the scales of an onion. On the right lie a
    glomerulus with open capillaries and tubules around it. This is the hyperplastic arteriolosclerosis of malignant
    hypertension.
alt:
  it: >-
    Micrografia di corteccia renale colorata in rosa e viola: a sinistra un vaso con anelli concentrici attorno a un
    lume minuscolo, a destra un glomerulo rotondo, con tubuli sparsi tutt'intorno.
  en: >-
    Micrograph of renal cortex stained pink and purple: on the left a vessel with concentric rings around a tiny
    lumen, on the right a round glomerulus, with tubules scattered all around.
