lookFor:
  it: "Segui le papille: asse fibrovascolare al centro, rivestito da cellule che hanno perso l'ordine e hanno nuclei di dimensioni molto diverse."
  en: "Follow the papillae: a fibrovascular core in the middle, lined by cells that have lost their order and have nuclei of very different sizes."
caption:
  it: >-
    Carcinoma uroteliale papillare di alto grado, EE a medio ingrandimento. Le papille hanno un asse connettivale
    con vasi congesti e infiammazione, rivestito da un urotelio spesso. Le cellule sono disordinate e i nuclei
    variano molto per forma e dimensione.
  en: >-
    High-grade papillary urothelial carcinoma, H&E at medium power. The papillae have a connective tissue core with
    congested vessels and inflammation, lined by thick urothelium. The cells are disordered and the nuclei vary
    widely in shape and size.
alt:
  it: >-
    Micrografia in ematossilina-eosina: tratti spessi di epitelio viola con nuclei affollati e irregolari avvolgono assi
    rosa con piccoli vasi pieni di globuli rossi e cellule infiammatorie; spazi bianchi li separano.
  en: >-
    H&E micrograph: thick bands of purple epithelium with crowded, irregular nuclei wrap around pink cores containing
    small red-cell-filled vessels and inflammatory cells; white spaces separate them.
