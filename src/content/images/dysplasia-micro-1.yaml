caption:
  it: >-
    Cono LEEP della cervice uterina, EE a medio ingrandimento: nello stesso campo si legge tutta la sequenza, da
    sinistra a destra, epitelio squamoso normale, coilocitosi, lesione squamosa intraepiteliale di basso grado (LSIL)
    e di alto grado (HSIL). Prima regola: guarda come cambia la maturazione dal basso verso l'alto. A sinistra le
    cellule basali sono piccole e ordinate e, salendo, si appiattiscono con nuclei sempre più piccoli: la maturazione è
    conservata. Al centro gli strati superficiali contengono coilociti, cellule con un alone chiaro attorno a un nucleo
    ingrandito, scuro e dal contorno irregolare, segno dell'effetto citopatico da HPV; le atipie restano nella parte
    alta e la maturazione è ancora riconoscibile. A destra le cellule con nuclei grandi, affollati e ipercromatici
    occupano quasi tutto lo spessore e l'appiattimento in superficie quasi scompare: è la perdita di maturazione e di
    polarità tipica della displasia di alto grado. Infine controlla il margine inferiore dell'epitelio: è netto e
    continuo in tutto il campo, quindi la lesione resta intraepiteliale (non è un carcinoma invasivo). Concetto chiave:
    la displasia si gradua in base alla quota di spessore occupata da cellule atipiche immature, non dal singolo nucleo.
  en: >-
    Cervical LEEP cone, H&E at intermediate power: the whole sequence sits in one field, from left to right normal
    squamous epithelium, koilocytosis, low-grade squamous intraepithelial lesion (LSIL) and high-grade lesion (HSIL).
    First rule: watch how maturation changes from bottom to top. On the left the basal cells are small and orderly and,
    as they rise, they flatten and their nuclei shrink: maturation is preserved. In the middle the upper layers contain
    koilocytes, cells with a clear halo around an enlarged, dark nucleus with an irregular outline, the cytopathic
    effect of HPV; the atypia stays in the upper part and maturation is still recognisable. On the right, cells with
    large, crowded, hyperchromatic nuclei fill nearly the whole thickness and surface flattening almost disappears:
    this is the loss of maturation and polarity typical of high-grade dysplasia. Finally check the lower edge of the
    epithelium: it is sharp and continuous across the field, so the lesion is still intraepithelial (not invasive
    carcinoma). Key point: dysplasia is graded by how much of the thickness is taken up by immature atypical cells, not
    by a single nucleus.
alt:
  it: >-
    Micrografia orizzontale in ematossilina-eosina di una striscia di epitelio squamoso sopra uno stroma rosa. A sinistra
    l'epitelio ha cellule chiare che si appiattiscono verso la superficie; al centro molte cellule superficiali hanno un
    alone chiaro attorno al nucleo; a destra l'epitelio è fitto di nuclei viola scuri e ingranditi fino alla superficie.
    In alto a sinistra c'è un frammento staccato di epitelio.
  en: >-
    Wide H&E micrograph of a strip of squamous epithelium over pink stroma. On the left the epithelium has pale cells
    that flatten towards the surface; in the middle many surface cells have a clear halo around the nucleus; on the
    right the epithelium is packed with enlarged dark purple nuclei up to the surface. A detached fragment of epithelium
    lies at the top left.
