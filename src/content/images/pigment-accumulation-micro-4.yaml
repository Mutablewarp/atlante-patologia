lookFor:
  it: "Cerca il blu e chiediti dove si trova: nei macrofagi liberi negli spazi aerei, non nelle pareti alveolari."
  en: "Look for the blue and ask where it sits: in macrophages free in the air spaces, not in the alveolar walls."
caption:
  it: >-
    Lo stesso polmone con PVOD della vista in EE, colorato con la reazione di Perls (blu di Prussia) per il ferro, a
    medio ingrandimento. Il fondo resta chiaro e i nuclei sono rosa-rossi per la colorazione di contrasto, quindi
    l'occhio va subito al blu. Il blu riempie gli ammassi di macrofagi liberi negli spazi alveolari (il più grande in
    basso a sinistra, un altro al centro) e alcune cellule isolate sparse fra l'uno e l'altro; le pareti alveolari quasi
    non ne contengono. Ogni cellula blu è un siderofago: il ferro ferrico dell'emosiderina reagisce con il ferrocianuro di
    potassio del reattivo e forma un composto blu insolubile, il blu di Prussia. La tonalità va dall'azzurro pallido al
    blu notte secondo la quantità di ferro contenuta in ciascuna cellula. Regola di lettura: un pigmento bruno che
    diventa blu con il Perls è emosiderina; carbone, lipofuscina, melanina e pigmento biliare conservano il loro colore.
    Nel tessuto polmonare il Perls è la prova più semplice di un sanguinamento alveolare avvenuto in passato: i globuli
    rossi non ci sono più, ma il loro ferro resta dentro i macrofagi.
  en: >-
    The same PVOD lung as the H&E view, stained with Perls' Prussian blue reaction for iron, at medium power. The
    background stays pale and the nuclei pink-red from the counterstain, so the eye goes straight to the blue. The blue
    fills the clusters of macrophages lying free in the alveolar spaces (the biggest at lower left, another in the
    center), plus a few single cells scattered in between; the alveolar walls hold almost none. Each blue cell is a
    siderophage: the ferric iron of hemosiderin reacts with the potassium ferrocyanide of the stain and forms an
    insoluble blue compound, Prussian blue. The shade runs from pale turquoise to deep navy with the amount of iron in
    each cell. Reading rule: a brown pigment that turns blue with Perls is hemosiderin; carbon, lipofuscin, melanin and
    bile pigment keep their own color. In lung tissue a Perls stain is the simplest proof of bleeding into the alveoli
    in the past: the red cells are gone, but their iron is still inside the macrophages.
alt:
  it: >-
    Micrografia di polmone con colorazione per il ferro a medio ingrandimento, su fondo chiaro con pareti alveolari rosa
    tenue e piccoli nuclei rosa-rossi: diversi grandi ammassi di cellule tonde colorate dall'azzurro al blu notte, il più
    grande in basso a sinistra, un altro al centro, una fascia in basso a destra e gruppi più piccoli negli angoli in
    alto.
  en: >-
    Medium-power iron-stained micrograph of lung on a pale background with faint pink alveolar walls and small pink-red
    nuclei: several large clusters of round cells stained turquoise to deep navy blue, the biggest at the lower left,
    another in the center, a band at the lower right and smaller groups in the upper corners.
