lookFor:
  it: "Cerca i piccoli dotti con lume chiaro, le cellule epiteliali con nuclei tondi e le cellule allungate nello stroma azzurro pallido."
  en: "Look for the small ducts with a clear lumen, the epithelial cells with round nuclei, and the elongated cells in the pale blue stroma."
caption:
  it: >-
    Adenoma pleomorfo di ghiandola salivare, alto ingrandimento (40x). Le cellule epiteliali con nuclei rotondi formano
    piccoli dotti con lume chiaro, in cui restano frammenti di materiale scuro. Attorno, lo stroma azzurro pallido
    contiene cellule allungate e sparse.
  en: >-
    Pleomorphic adenoma of a salivary gland, high power (40x). Epithelial cells with round nuclei form small ducts with
    a clear lumen that holds a few dark fragments. Around them, the pale blue stroma contains scattered elongated
    cells.
alt:
  it: >-
    Micrografia ad alto ingrandimento: dotti con lume chiaro rivestiti da cellule con nuclei viola rotondi, circondati
    da stroma azzurro pallido con cellule allungate.
  en: >-
    High-power micrograph: ducts with a clear lumen lined by cells with round purple nuclei, surrounded by pale blue
    stroma with elongated cells.
