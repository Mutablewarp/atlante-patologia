lookFor:
  it: "Confronta lo strato rosa compatto ai bordi con la zona centrale chiara e lassa, povera di cellule; poi osserva i nuclei isolati nel pannello di destra."
  en: "Compare the dense pink layer at the edges with the pale, loose, sparsely cellular center; then look at the isolated nuclei in the right-hand panel."
caption:
  it: >-
    Valvola mitrale con degenerazione mixomatosa, EE. A sinistra, a basso ingrandimento, il lembo ha ai bordi
    bande rosa compatte, mentre al centro compare una zona chiara e lassa con pochi nuclei. A destra, a ingrandimento
    maggiore, pochi nuclei isolati stanno in una matrice pallida e filamentosa, con qualche fascio rosa ondulato.
  en: >-
    Mitral valve with myxomatous degeneration, H&E. On the left, at low power, the leaflet has dense pink bands at
    the edges, while the center shows a pale, loose zone with few nuclei. On the right, at higher power, a few
    isolated nuclei sit in a pale, stringy matrix with some wavy pink bundles.
alt:
  it: >-
    Due micrografie affiancate in ematossilina-eosina. A sinistra, tessuto rosa compatto ai lati e una zona centrale
    chiara con rari nuclei piccoli. A destra, pochi nuclei viola in uno sfondo pallido e filamentoso, con fasci rosa
    ondulati.
  en: >-
    Two H&E micrographs side by side. On the left, dense pink tissue at the sides and a pale central zone with
    scattered small nuclei. On the right, a few purple nuclei in a pale, stringy background with wavy pink bundles.
