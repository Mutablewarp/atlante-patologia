lookFor:
  it: "Cerca i nuclei dove dovrebbero esserci, nell'epitelio dei tubuli e nei flocculi glomerulari: profili ovunque, nuclei quasi da nessuna parte."
  en: "Look for nuclei where they should be, in the tubular epithelium and in the glomerular tufts: outlines everywhere, nuclei almost nowhere."
caption:
  it: >-
    All'interno di un infarto renale, EE a forte ingrandimento (40X secondo la fonte). Due glomeruli occupano il
    centro del campo. Si riconoscono ancora la capsula di Bowman e il contorno lobulato di ciascun flocculo capillare,
    ma le cellule del flocculo appaiono sbiadite e i loro nuclei sono pallidi o assenti. Tutt'intorno i tubuli
    conservano la loro forma, un anello di epitelio rosa attorno a un lume, ma le loro cellule hanno perso il nucleo:
    pensa a un tubulo vivo, in cui ogni cellula epiteliale ha il suo nucleo, e la differenza salta agli occhi. Ecco
    che cosa significa in pratica «profili conservati, nuclei persi»: i nuclei sono già scomparsi, punto d'arrivo
    delle alterazioni nucleari della necrosi, mentre i confini cellulari e l'architettura reggono ancora. In seguito
    i leucociti, entrando dal margine vitale, rimuoveranno questo tessuto morto, e un infarto renale guarito diventa
    una cicatrice infossata nella corticale.
  en: >-
    Inside a renal infarct, H&E at high power (labeled 40X by the source). Two glomeruli fill the center of the
    field. Bowman's capsule and the lobed outline of each capillary tuft can still be traced, but the cells of the
    tufts look smudged and their nuclei are faint or missing. All around, the tubules keep their shape, a ring of pink
    epithelium around a lumen, yet their cells have lost their nuclei: picture a living tubule, where every epithelial
    cell has its own nucleus, and the difference is obvious. This is what "outlines preserved, nuclei lost" means in
    practice: the nuclei have already gone, the end point of the nuclear changes of necrosis, while cell borders and
    architecture still stand. Later, leukocytes entering from the living edge will clear this dead tissue, and a
    healed renal infarct ends up as a sunken scar in the cortex.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento di corticale renale necrotica: al centro due grandi
    glomeruli rotondi con flocculi viola pallidi e sbiaditi, circondati da tubuli con pareti rosa integre ma quasi
    senza nuclei; in basso a destra alcune masse rotonde rosa intenso dentro alcuni tubuli.
  en: >-
    High-power H&E micrograph of necrotic kidney cortex: two large round glomeruli with pale, smudged purple tufts in
    the center, surrounded by tubules whose pink walls are intact but hold almost no nuclei; a few dense pink round
    masses lie inside some tubules at the lower right.
