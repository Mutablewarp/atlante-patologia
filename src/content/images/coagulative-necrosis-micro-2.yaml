caption:
  it: >-
    Necrosi coagulativa dentro un tumore: feocromocitoma del surrene con un'ampia necrosi centrale spontanea, seguito
    dall'occhio nudo al forte ingrandimento. Leggi i quattro riquadri in senso orario; le frecce indicano l'area
    necrotica o il suo margine. In alto a sinistra, la superficie di taglio del tumore capsulato, con la parte necrotica
    opaca, giallo-bruna. In alto a destra, la sezione intera del pezzo a piccolissimo ingrandimento. In basso a
    sinistra, medio ingrandimento: in alto un'area necrotica rosa intenso e omogenea, separata da un confine netto dal
    tessuto vitale, più cellulato, che sta sotto. In basso a destra, forte ingrandimento: a sinistra le cellule
    fantasma, cioè cellule tumorali con citoplasma rosso intenso e nucleo scomparso ma profilo ancora riconoscibile; a
    destra, al bordo della necrosi, cellule con nuclei conservati, tra cui macrofagi carichi di emosiderina (granuli
    bruni). Messaggio da portare a casa: profilo conservato + nucleo perso = necrosi coagulativa, in qualunque organo;
    nei tumori riflette di solito un apporto di sangue insufficiente.
  en: >-
    Coagulative necrosis inside a tumour: an adrenal phaeochromocytoma with a large area of spontaneous central
    necrosis, followed from the naked eye to high power. Read the four panels clockwise; the arrows mark the necrotic
    area or its border. Top left, the cut surface of the encapsulated tumour, with its dull, tan-yellow necrotic part.
    Top right, the whole specimen section at scanning power. Bottom left, medium power: at the top, a homogeneous,
    intensely pink necrotic area, separated by a sharp border from the more cellular viable tissue below. Bottom
    right, high power: on the left, ghost cells, tumour cells with deep-pink cytoplasm whose nuclei have vanished while
    their outlines remain; on the right, at the edge of the necrosis, cells with preserved nuclei, including
    hemosiderin-laden macrophages (brown granules). Take-home message: preserved outline + lost nucleus = coagulative
    necrosis, whatever the organ; in tumours it usually reflects an inadequate blood supply.
alt:
  it: >-
    Composizione di quattro immagini con frecce bianche: in alto a sinistra un tumore sezionato, rotondeggiante e
    giallo-bruno, circondato da tessuto rosso; in alto a destra una sezione istologica intera rosa pallido; in basso a
    sinistra una zona rosa intenso e uniforme sopra un tessuto più violaceo; in basso a destra cellule rosa senza nuclei
    a sinistra e cellule con nuclei viola e alcuni granuli bruni a destra.
  en: >-
    Four-panel composite with white arrows: top left, a sliced, rounded, tan-yellow tumour surrounded by red tissue;
    top right, a pale pink whole-mount histological section; bottom left, a uniform, intensely pink zone above more
    purple tissue; bottom right, pink cells without nuclei on the left and cells with purple nuclei and a few brown
    granules on the right.
