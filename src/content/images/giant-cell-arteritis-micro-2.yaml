lookFor:
  it: Cerca le cellule grandi con molti nuclei ammassati, tra cellule infiammatorie e piccoli vacuoli chiari.
  en: Look for the large cells with several clustered nuclei, among inflammatory cells and small clear vacuoles.
caption:
  it: >-
    Parete arteriosa, EE ad alto ingrandimento. Al centro e a destra, tra cellule infiammatorie e piccoli vacuoli
    chiari, si riconoscono cellule giganti multinucleate con i nuclei raggruppati nel citoplasma rosa pallido. Sono
    il reperto che dà il nome alla malattia.
  en: >-
    Arterial wall, H&E at high power. In the center and at the right, among inflammatory cells and small clear
    vacuoles, multinucleated giant cells show their nuclei clustered in pale pink cytoplasm. They are the finding that
    gives the disease its name.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: cellule infiammatorie e piccoli vacuoli chiari in uno
    sfondo rosa e, in alto a destra, grandi cellule con più nuclei ravvicinati.
  en: >-
    High-power H&E micrograph: inflammatory cells and small clear vacuoles on a pink background and, at the upper
    right, large cells with several nuclei close together.
