lookFor:
  it: "Parti dal polmone quasi normale a sinistra e segui il margine verso destra, dove compaiono le isole rosa di tumore."
  en: "Start at the near-normal lung on the left and follow the edge to the right, where the pink tumor islands appear."
caption:
  it: >-
    Carcinoma squamoso del polmone, EE a basso ingrandimento. A sinistra gli alveoli sono ancora aperti, con setti
    ispessiti e infiltrato infiammatorio. Verso destra il tumore forma grandi isole di cellule rosa con zone più chiare
    e rotonde al centro, che sono perle cornee: indicano la cheratinizzazione. Le isole sono circondate da tessuto
    ricco di linfociti.
  en: >-
    Lung squamous cell carcinoma, H&E at low power. At the left the alveoli are still open, with thickened septa and
    an inflammatory infiltrate. Toward the right the tumor forms large islands of pink cells with paler, rounded
    centers, which are keratin pearls and show keratinization. The islands are surrounded by lymphocyte-rich tissue.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: a sinistra alveoli aperti con setti sottili e cellule
    infiammatorie; a destra isole rosa di cellule tumorali con centri rotondi e chiari, circondate da piccoli linfociti
    violetti.
  en: >-
    Low-power H&E micrograph: at the left open alveoli with thin septa and inflammatory cells; at the right pink
    islands of tumor cells with round, pale centers, surrounded by small purple lymphocytes.
