lookFor:
  it: "Segui un fascio di fibre da sinistra a destra: invece di correre diritto si piega a zig-zag, ma i nuclei ci sono ancora."
  en: "Follow one bundle of fibres from left to right: instead of running straight it zig-zags, yet its nuclei are still there."
caption:
  it: >-
    Infarto miocardico non riperfuso, fase precoce, EE a medio ingrandimento (autopsia; pannello a della figura
    originale). Guarda la direzione delle fibre: invece di correre diritti e paralleli, i miocardiociti sono piegati in
    onde regolari, come un nastro ripiegato, e appaiono sottili e allungati. I nuclei sono ancora presenti: le
    alterazioni nucleari della necrosi non sono ancora comparse. Perché ondulate? Perché sono state stirate: le fibre
    ischemiche non si contraggono più e a ogni sistole il muscolo vivo che le circonda le tira. Le fibre ondulate sono
    un reperto del primo giorno: il citoplasma diventa intensamente eosinofilo entro circa 24 ore, mentre per la
    scomparsa dei nuclei servono giorni. Attenzione: i primi segni di un infarto non sono specifici, e all'autopsia
    quadri simili possono seguire una rianimazione o semplicemente l'autolisi, quindi vanno letti insieme alla storia
    clinica e agli altri reperti. Fibre sottili e ondulate con i nuclei ancora presenti = danno ischemico molto precoce
    del miocardio.
  en: >-
    Myocardial infarct without reperfusion, early stage, H&E at medium power (autopsy; panel a of the source figure).
    Look at the direction of the fibres: instead of running straight and parallel, the myocytes are bent into regular
    waves, like a folded ribbon, and look thin and elongated. Their nuclei are still present: the nuclear changes of
    necrosis have not appeared yet. Why wavy? Because they have been stretched: ischemic fibres no longer contract,
    and at each systole the living muscle around them pulls on them. Wavy fibres are a finding of the first day: the
    cytoplasm turns deeply eosinophilic within about 24 hours, whereas the loss of the nuclei is a matter of days.
    Watch out: the earliest signs of an infarct are not specific, and at autopsy similar pictures can follow
    resuscitation or simple autolysis, so they are read together with the clinical history and the other findings.
    Thin, wavy fibres with nuclei still present = very early ischemic injury of the myocardium.
alt:
  it: >-
    Micrografia di miocardio in ematossilina-eosina: fasci di fibre muscolari rosa con piccoli nuclei scuri allungati,
    piegati in onde parallele a zig-zag in tutto il campo e separati da sottili fessure bianche; in alto a destra un
    piccolo vaso; in basso a sinistra la lettera "a".
  en: >-
    H&E micrograph of heart muscle: bundles of pink muscle fibres with small, dark, elongated nuclei, bent into
    parallel zig-zag waves across the whole field and separated by thin white clefts; a small vessel at the upper
    right; the letter "a" at the lower left.
