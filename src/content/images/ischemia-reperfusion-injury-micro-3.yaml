caption:
  it: >-
    Infarto miocardico con necrosi a bande di contrazione, EE a medio ingrandimento (200x secondo la fonte). Guarda
    prima il campo nel suo insieme: le fibre muscolari, tagliate per il lungo, scendono ripide dall'alto a sinistra
    verso il basso a destra, e tra di esse si sono aperti spazi chiari e sfrangiati (edema interstiziale), più ampi
    lungo il margine sinistro. Poi guarda dentro le fibre. Al posto della striatura trasversale fine e regolare del
    miocardio normale, molte appaiono raggrumate: barre di un rosa più denso si alternano a tratti più pallidi e
    granulosi. Sono le bande di contrazione, brevi tratti di sarcomeri compattati da una contrazione estrema
    (ipercontrazione). La causa è un'ondata di calcio che entra in un miocita ancora capace di contrarsi: le
    miofibrille si bloccano in contrazione massima, i sarcomeri si ammassano in bande e la fibra si spezza. La
    riperfusione fornisce proprio quest'ondata, perché il sangue che ritorna trova un sarcolemma già danneggiato. Nota
    anche quante poche fibre conservano il nucleo (la fonte descrive la perdita dei nuclei, cioè la cariolisi), i fini
    granuli bruno-dorati di lipofuscina dentro molte fibre e, al centro, la stria di tessuto lasso e pallido con cellule
    sparse; la fonte descrive un infiltrato di monociti e linfociti. Qualche banda può comparire al margine di
    qualsiasi infarto; quando le bande occupano ampie aree di un infarto fanno pensare a una riperfusione, ma la fonte
    di questa immagine non dice se l'arteria sia stata riaperta. Passa all'immagine a 400x della stessa serie per
    vedere le bande da vicino. Trappola: le bande di contrazione compaiono anche con livelli molto alti di
    catecolamine, perché segnalano un ingresso massivo di calcio, non la riperfusione in sé.
  en: >-
    Myocardial infarct with contraction band necrosis, H&E at medium power (200x according to the source). Start with
    the whole field: the muscle fibers, cut along their length, run steeply from the upper left to the lower right, and
    pale, lacy spaces have opened between them (interstitial edema), widest along the left edge. Then look inside the
    fibers. Instead of the fine, regular cross-striation of normal myocardium, many look clumped: denser pink bars
    alternate with paler, granular stretches. These are the contraction bands, short stretches of sarcomeres squeezed
    together by extreme contraction (hypercontraction). The cause is a flood of calcium into a myocyte that can still
    contract: its myofibrils lock into maximal contraction, the sarcomeres pile up into bands and the fiber breaks up.
    Reperfusion supplies exactly that flood, because the returning blood meets a sarcolemma that is already damaged.
    Note also how few fibers keep a nucleus (the source describes loss of nuclei, that is karyolysis), the fine
    golden-brown granules of lipofuscin inside many fibers and, in the center, the loose, pale strand of tissue with
    scattered cells; the source describes an infiltrate of monocytes and lymphocytes. A few bands can turn up at the
    rim of any infarct; when they fill large areas of an infarct they suggest reperfusion, but the source of this image
    does not say whether the artery was reopened. Switch to the 400x image of the same series to see the bands up
    close. Pitfall: contraction bands also appear with very high catecholamine levels, because they signal a massive
    entry of calcium, not reperfusion as such.
alt:
  it: >-
    Micrografia in ematossilina-eosina a medio ingrandimento di muscolo cardiaco: fibre rosa tagliate per il lungo
    scendono ripide dall'alto a sinistra verso il basso a destra; molte appaiono raggrumate, con barre di un rosa più
    denso alternate a tratti più chiari e granulosi, e contengono fini granuli bruni; pochi nuclei; spazi chiari e
    sfrangiati separano le fibre, più ampi al margine sinistro; al centro corre una stria di tessuto lasso e pallido
    con nuclei viola sparsi.
  en: >-
    Medium-power H&E micrograph of heart muscle: pink fibers cut lengthwise run steeply from the upper left to the lower
    right; many look clumped, with denser pink bars alternating with paler granular stretches, and contain fine brown
    granules; few nuclei; pale, lacy spaces separate the fibers, widest at the left edge; a loose, pale strand with
    scattered purple nuclei runs through the center.
