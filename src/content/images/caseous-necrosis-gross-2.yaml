lookFor:
  it: "Prima il colore e la consistenza di ciò che riempie il nodulo, poi l'orlo grigio sottile che lo separa dal polmone."
  en: "First the colour and texture of what fills the nodule, then the thin grey rim that separates it from the lung."
caption:
  it: >-
    Focolaio primario di Ghon, quadro macroscopico: primo piano della superficie di taglio del polmone. Parti dal quadro
    d'insieme: la metà superiore della foto è parenchima polmonare rosso-violaceo scuro; nella metà inferiore, subito
    sotto la pleura, c'è un nodulo rotondeggiante a margini netti. Poi guarda che cosa lo riempie: un materiale
    giallo-crema, opaco, che si sbriciola in grumi come un formaggio friabile e che al centro si è spaccato, lasciando
    una fessura scura. Tutt'intorno corre un orlo sottile, grigio e traslucido, la parete fibrosa che separa il
    materiale necrotico dal polmone ancora vivo. Questa è la necrosi caseosa vista a occhio nudo, ed è da questo aspetto
    che prende il nome: «caseoso» descrive la macroscopia, mentre al microscopio la stessa area appare come un detrito
    eosinofilo, amorfo e granulare, al centro di un granuloma. Qui è cominciata la tubercolosi primaria: il suo primo
    focolaio polmonare si forma sotto la pleura, di solito nella parte bassa di un lobo superiore o nella parte alta di
    un lobo inferiore; i bacilli trasportati ai linfonodi ilari vi provocano lesioni simili, e focolaio più linfonodi
    formano il complesso di Ghon. Attenzione: un nodulo sottopleurico con il centro caseoso può essere anche un
    granuloma da funghi (per esempio nell'istoplasmosi), quindi l'aspetto macroscopico da solo non basta. Collegamento
    clinico: di solito il focolaio guarisce con fibrosi e calcificazione, ma può custodire per anni pochi bacilli
    vitali, da cui può ripartire la malattia come tubercolosi secondaria.
  en: >-
    Primary (Ghon) focus, gross: close-up of the cut surface of the lung. Start with the overview: the upper half of the
    photo is dark red-purple lung tissue; in the lower half, just beneath the pleura, sits a rounded, sharply bounded
    nodule. Then look at what fills it: opaque, cream-yellow material that breaks into crumbly lumps like friable cheese
    and has split in the middle, leaving a dark crack. All around runs a thin, grey, translucent rim, the fibrous wall
    that separates the necrotic material from the living lung. This is caseous necrosis seen with the naked eye, and it
    is this look that gives the lesion its name: "caseous" describes the gross appearance, while under the microscope
    the same area is amorphous, granular eosinophilic debris in the centre of a granuloma. This is where primary
    tuberculosis started: its first lung focus forms under the pleura, usually in the lower part of an upper lobe or the
    upper part of a lower lobe; bacilli carried to the hilar lymph nodes cause similar lesions there, and focus plus
    nodes make up the Ghon complex. Pitfall: a subpleural nodule with a caseous centre can also be a fungal granuloma
    (for example in histoplasmosis), so the gross appearance alone is not enough. Clinical link: the focus usually heals
    with fibrosis and calcification, but it can harbour a few viable bacilli for years, from which the disease can
    restart as secondary tuberculosis.
alt:
  it: >-
    Fotografia ravvicinata della superficie di taglio di un polmone rosso-violaceo scuro. In basso al centro un nodulo
    rotondo, circondato da un orlo grigio traslucido, è pieno di materiale giallo-crema friabile attraversato da una
    fessura scura.
  en: >-
    Close-up photograph of the cut surface of a dark red-purple lung. At the lower centre a round nodule, surrounded by a
    translucent grey rim, is filled with crumbly cream-yellow material crossed by a dark crack.
