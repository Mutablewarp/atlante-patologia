  en: "Find the blue-green ink first: it marks where the surgeon cut. Then check whether the tissue just above it is alive."
caption:
  it: >-
    Tessuti molli al margine di resezione di un dito del piede amputato per gangrena ischemica, EE (la fonte non
    indica l'ingrandimento; medio ingrandimento). Prima orientati: l'inchiostro blu-verde lungo il bordo inferiore
    segna il margine chirurgico, cioè il piano in cui il chirurgo ha tagliato, e gli spazi vuoti e rotondi in alto a
    destra sono adipociti. Poi osserva il tessuto sopra l'inchiostro. Al centro del campo piccoli nuclei scuri, molti
    lobati o spezzettati, sono sparsi tra il collagene rosa: sono neutrofili, in parte in disfacimento, insieme a
    detriti nucleari. In basso a destra, subito sopra l'inchiostro, il tessuto è pallido, dall'aspetto sfumato e quasi
    privo di nuclei: è morto. La diagnosi della fonte riassume il quadro: necrosi ischemica con neutrofili, presente
    al margine. I neutrofili viaggiano nel sangue, perciò si raccolgono dove il tessuto morto confina con quello
    ancora irrorato; se anche i batteri colonizzano il tessuto necrotico, gli enzimi dei neutrofili lo digeriscono e
    la gangrena secca diventa umida. Trovare necrosi sul margine inchiostrato dice inoltre al chirurgo che il taglio
    non è passato interamente in tessuto vivo. Le emazie sotto l'inchiostro si trovano al di fuori del tessuto.
  en: >-
    Soft tissue at the cut edge of a toe amputated for ischemic gangrene, H&E (the source gives no magnification;
    medium power). Orient yourself first: the blue-green ink along the bottom edge marks the surgical margin, the
    plane where the surgeon cut, and the round empty spaces at the top right are fat cells. Then look at the tissue
    above the ink. In the middle of the field, small dark nuclei, many of them lobed or broken up, are scattered
    through pink collagen: these are neutrophils, some of them falling apart, mixed with nuclear debris. At the lower
    right, just above the ink, the tissue is pale, smudgy and almost without nuclei: it is dead. The source's
    diagnosis sums it up: ischemic necrosis with neutrophils, present at the margin. Neutrophils travel in the blood,
    so they collect where dead tissue borders tissue that is still perfused; if bacteria colonize the dead tissue as
    well, the neutrophils' enzymes digest it and dry gangrene turns into wet gangrene. Finding necrosis at the inked
    margin also tells the surgeon that the cut did not pass entirely through living tissue. The red cells below the
    ink lie outside the tissue.
alt:
  it: >-
    Micrografia in ematossilina-eosina di tessuti molli: collagene rosa con piccoli nuclei scuri sparsi al centro,
    adipociti rotondi e vuoti in alto a destra, tessuto pallido con pochi nuclei in basso a destra, una linea di
    inchiostro blu-verde lungo il bordo inferiore e globuli rossi sparsi al di sotto.
  en: >-
    H&E micrograph of soft tissue: pink collagen with small dark nuclei scattered in the middle, round empty fat cells
    at the top right, pale tissue with few nuclei at the lower right, a blue-green ink line along the lower edge and
    loose red blood cells below it.
