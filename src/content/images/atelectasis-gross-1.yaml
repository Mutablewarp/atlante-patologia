lookFor:
  it: "Confronta le dimensioni e la consistenza del polmone con quelle di un polmone aerato normale."
  en: "Compare the size and the texture of this lung with a normal, air-filled lung."
caption:
  it: >-
    Polmone con collasso di tutti i lobi, visto dall'esterno su fondo blu. Il parenchima appare raggrinzito e
    compatto, con la pleura increspata e le pieghe che si sovrappongono, invece del volume pieno e soffice di un polmone
    espanso. Il tessuto collassato è l'aspetto macroscopico tipico dell'atelettasia.
  en: >-
    Lung with collapse of all lobes, seen from the outside on a blue background. The parenchyma looks shrunken and
    compact, with wrinkled pleura and overlapping folds, instead of the full, spongy volume of an expanded lung. The
    collapsed tissue is the typical gross look of atelectasis.
alt:
  it: >-
    Fotografia di un intero polmone su fondo blu: il tessuto è ridotto di volume, grigio-violaceo e rosso-bruno, con
    superficie increspata e lobi ripiegati l'uno sull'altro; in un punto del margine centrale si vede una chiazza
    giallastra.
  en: >-
    Photograph of a whole lung on a blue background: the tissue is reduced in volume, gray-purple and reddish-brown,
    with a wrinkled surface and lobes folded against each other; one yellowish patch shows near the center.
