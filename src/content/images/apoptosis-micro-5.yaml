orientation:
  it: "Le cripte corrono in diagonale, dall'alto a destra verso il basso a sinistra; tra di esse c'è la lamina propria."
  en: "The crypts run diagonally from upper right to lower left, with lamina propria between them."
lookFor:
  it: "Trova un grappolo di granuli nucleari scuri in un piccolo vacuolo, poi un singolo nucleo rotondo e compatto in un alone chiaro: sono entrambi corpi apoptotici."
  en: "Find a cluster of dark nuclear beads in a small vacuole, then a single dense round nucleus in a clear halo: both are apoptotic bodies."
caption:
  it: >-
    La stessa biopsia rettale a forte ingrandimento, EE. Usa come riferimento le cellule integre della cripta: cellule
    colonnari con nucleo ovale e vacuoli chiari e rotondi delle cellule caliciformi. Poi cerca le cellule che non
    tornano. Alcune si sono ridotte a un piccolo corpo rotondo con un solo nucleo molto scuro e compatto, immerso in un
    alone chiaro (picnosi); altre si sono frammentate in un grappolo di granuli nucleari scuri dentro un piccolo vacuolo
    (carioressi), l'aspetto che in patologia intestinale si descrive come exploding crypt cell («cellula esplosa» della
    cripta). Questi corpi apoptotici stanno soprattutto nella metà inferiore delle cripte e ciascuno resta racchiuso
    nell'epitelio finché una cellula vicina o un macrofago non lo ingloba. Nota che cosa manca intorno: niente
    neutrofili, niente pus, nessuna area estesa di cellule morte. Da ricordare: in una biopsia intestinale cerca i corpi
    apoptotici alla base delle cripte; nella malattia del trapianto contro l'ospite sono il reperto chiave, ma anche
    l'infezione da HIV, come qui, e alcuni farmaci possono dare la stessa lesione. Non confonderli con i linfociti
    intraepiteliali: anche questi sono piccoli e scuri e possono stare in un alone chiaro, ma sono cellule intere, con
    un nucleo rotondo in cui si riconosce ancora la trama della cromatina, non una pallina nera come l'inchiostro né un
    grappolo di frammenti.
  en: >-
    The same rectal biopsy at high power, H&E. Use the intact crypt cells as your reference: columnar cells with oval
    nuclei and the round, clear vacuoles of goblet cells. Then look for the cells that do not fit. Some have shrunk to a
    small round body with a single, very dark, dense nucleus sitting in a clear halo (pyknosis); others have broken up
    into a cluster of dark nuclear beads inside a small vacuole (karyorrhexis), the picture that gut pathologists call
    an exploding crypt cell. These apoptotic bodies lie mostly in the lower half of the crypts, and each one stays
    enclosed in the epithelium until a neighbouring cell or a macrophage engulfs it. Notice what is missing around
    them: no neutrophils, no pus, no broad area of dead cells. Key point: in a bowel biopsy, look for apoptotic bodies
    at the base of the crypts; in graft-versus-host disease they are the key finding, but HIV infection, as here, and
    some drugs can produce the same lesion. Do not mistake intraepithelial lymphocytes for them: these are small and
    dark too, and may also sit in a clear halo, but each is a whole cell whose round nucleus still shows chromatin
    texture, not an ink-black ball or a cluster of fragments.
alt:
  it: >-
    Micrografia in ematossilina-eosina ad alto ingrandimento di cripte rettali disposte in diagonale: epitelio colonnare
    con vacuoli chiari e rotondi delle cellule caliciformi, alcune cellule ridotte a piccoli nuclei rotondi e scuri in un
    alone chiaro e grappoli di frammenti nucleari scuri dentro piccoli vacuoli; tra le cripte una lamina propria chiara
    con nuclei allungati.
  en: >-
    High-power H&E micrograph of rectal crypts running diagonally: columnar epithelium with round, clear goblet-cell
    vacuoles, several cells reduced to small, dark, round nuclei in clear halos, and clusters of dark nuclear fragments
    inside small vacuoles; pale lamina propria with elongated nuclei between the crypts.
