lookFor:
  it: "Confronta i nuclei rotondi e uniformi delle cellule rosa con il citoplasma chiaro e schiumoso delle cellule mucipare."
  en: "Compare the round, uniform nuclei of the pink cells with the pale, foamy cytoplasm of the mucus-secreting cells."
caption:
  it: >-
    Carcinoma mucoepidermoide delle ghiandole salivari, EE ad alto ingrandimento (stesso caso dell'immagine a medio
    ingrandimento). Cellule con nuclei rotondi e citoplasma rosa formano i nidi; tra loro compaiono cellule con
    citoplasma chiaro, vacuolato o schiumoso. Il margine del nido è sottolineato da stroma fibroso.
  en: >-
    Mucoepidermoid carcinoma of the salivary gland, H&E at high power (same case as the medium-power image). Cells with
    round nuclei and pink cytoplasm form the nests; among them are cells with pale, vacuolated or foamy cytoplasm. The
    edge of the nest is outlined by fibrous stroma.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: cellule con nuclei rotondi viola e citoplasma rosa,
    alternate a cellule con citoplasma chiaro e vacuolato; a sinistra una banda di stroma fibroso.
  en: >-
    High-power H&E micrograph: cells with round purple nuclei and pink cytoplasm, mixed with cells with pale vacuolated
    cytoplasm; a band of fibrous stroma at the left.
