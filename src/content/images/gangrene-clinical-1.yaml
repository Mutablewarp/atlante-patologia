caption:
  it: >-
    Mano destra di un paziente con peste (infezione da Yersinia pestis), fotografia del CDC. Parti dalla
    distribuzione: il danno riguarda solo l'estremità di quattro dita, mentre il pollice e il resto della mano hanno
    un aspetto normale. Poi osserva le dita una per una: attorno all'unghia la cute è nera, secca e raggrinzita,
    con lembi di epidermide biancastra che si sfalda ai bordi, e finisce di colpo dove comincia la cute rosea ancora
    vitale. È la gangrena secca: una necrosi coagulativa ischemica di una parte distale del corpo, in cui il tessuto
    morto perde acqua e si mummifica invece di colliquare, perché vi crescono pochi batteri. Nella peste i piccoli
    vasi delle dita vengono occlusi dai microtrombi della coagulazione intravascolare disseminata, e per questo
    muoiono per prime le parti più periferiche (sedi acrali): la stessa distribuzione della gangrena delle dita del
    piede nell'aterosclerosi. Se i batteri colonizzassero il tessuto morto, la zona diventerebbe gonfia, umida e
    maleodorante: gangrena umida.
  en: >-
    Right hand of a patient with plague (Yersinia pestis infection), CDC photograph. Start with the distribution: the
    damage is limited to the ends of four fingers, while the thumb and the rest of the hand look normal. Then look at
    one fingertip at a time: the skin around the nail is black, dry and shrivelled, with flakes of whitish, peeling
    epidermis at its edges, and it stops abruptly where pink, living skin begins. This is dry gangrene: ischemic
    coagulative necrosis of a distal body part, in which the dead tissue loses water and mummifies instead of
    liquefying, because few bacteria grow in it. In plague the small vessels of the fingers are blocked by the
    microthrombi of disseminated intravascular coagulation, so the most peripheral (acral) parts die first: the same
    distribution as gangrene of the toes in atherosclerosis. If bacteria colonised the dead tissue it would become
    swollen, moist and foul-smelling: wet gangrene.
alt:
  it: >-
    Fotografia a colori di una mano destra appoggiata su un telo grigio, con le dita rivolte a sinistra: le estremità
    di indice, medio, anulare e mignolo sono nere e raggrinzite, con bordi biancastri che si sfaldano; il pollice e il
    resto della mano hanno cute rosea normale.
  en: >-
    Colour photograph of a right hand lying on a grey cloth, fingers pointing left: the ends of the index, middle, ring
    and little fingers are black and shrivelled with whitish, peeling edges; the thumb and the rest of the hand have
    normal pink skin.
