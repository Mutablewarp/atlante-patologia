lookFor:
  it: "Cerca i tubuli e l'interstizio tra i due glomeruli: il tessuto è invaso da piccole cellule scure, i neutrofili, che non dovrebbero esserci."
  en: "Look at the tubules and the interstitium around the two glomeruli: the tissue is crowded with small dark cells, the neutrophils, that do not belong there."
caption:
  it: >-
    Pielonefrite acuta, biopsia renale, EE a medio ingrandimento. Parti dai due glomeruli a sinistra del centro, che
    fanno da punto di riferimento, e guarda lo spazio intorno a loro. Tra i tubuli rosa l'interstizio non è un tessuto
    sottile e quasi vuoto: è pieno di piccole cellule con nucleo scuro, in gran parte neutrofili, che si insinuano tra i
    tubuli e ne riempiono diversi lumi. In alto al centro compare una zona più rossa, con globuli rossi stravasati. È il
    quadro dell'infiammazione acuta purulenta del parenchima: i neutrofili invadono tubuli e interstizio, e questo li
    distingue da una nefrite interstiziale in cui prevalgono linfociti.
  en: >-
    Acute pyelonephritis, kidney biopsy, H&E at medium power. Start from the two glomeruli left of center, which serve
    as landmarks, and look at the space around them. Between the pink tubules the interstitium is not a thin, almost
    empty tissue: it is packed with small dark-nucleated cells, mostly neutrophils, which squeeze between the tubules
    and fill several lumens. A redder area with extravasated red cells appears at the top center. This is the picture
    of acute purulent inflammation of the parenchyma: neutrophils invade tubules and interstitium, which sets it apart
    from an interstitial nephritis dominated by lymphocytes.
alt:
  it: >-
    Micrografia a medio ingrandimento in ematossilina-eosina di una carota bioptica renale su sfondo bianco: due
    glomeruli a sinistra, tubuli rosa e un interstizio denso di piccole cellule a nucleo scuro; in alto al centro una
    zona rossa con globuli rossi.
  en: >-
    Medium-power H&E micrograph of a kidney biopsy core on a white background: two glomeruli at the left, pink tubules
    and an interstitium dense with small dark-nucleated cells; at the top center a red area of red blood cells.
