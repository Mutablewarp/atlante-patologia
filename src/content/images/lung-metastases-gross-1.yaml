orientation:
  it: "Preparato in teca, ilo al centro, apice in alto; a sinistra il frammento di parete toracica."
  en: "Specimen in a display jar, hilum at the center, apex at the top; a piece of chest wall at the left."
lookFor:
  it: "Conta i noduli rotondi e ben circoscritti sparsi in tutto il polmone, poi confrontali con il parenchima scuro tra un nodulo e l'altro."
  en: "Count the round, well-circumscribed nodules scattered through the whole lung, then compare them with the darker parenchyma between them."
caption:
  it: >-
    Polmone in sezione con metastasi nodulari multiple di un osteosarcoma dell'omero, preparato d'archivio con le
    etichette originali in francese. Cerca prima i noduli rotondi, pallidi e ben delimitati, di diverse dimensioni,
    sparsi in entrambe le zone del polmone. Osserva poi che il parenchima tra i noduli è scuro e conserva la sua
    struttura. Più noduli distribuiti ovunque, e non una massa singola, sono il quadro tipico delle metastasi
    polmonari.
  en: >-
    Cut section of a lung with multiple nodular metastases from an osteosarcoma of the humerus, an archive specimen
    with its original French labels. First find the round, pale, well-delimited nodules of different sizes scattered
    through the upper and lower parts of the lung. Then note that the parenchyma between the nodules is dark and keeps
    its structure. Several nodules spread throughout, rather than one single mass, are the typical pattern of lung
    metastases.
alt:
  it: >-
    Sezione di polmone fissato in una teca su fondo giallo chiaro, con numerosi noduli rotondi biancastri di varie
    dimensioni su parenchima bruno scuro; a sinistra un frammento di parete toracica rossastro; etichette bianche in
    francese in alto e in basso.
  en: >-
    Cut section of a fixed lung in a display jar on a pale yellow background, with many round whitish nodules of
    various sizes on dark brown parenchyma; a reddish piece of chest wall at the left; white labels in French at the
    top and bottom.
