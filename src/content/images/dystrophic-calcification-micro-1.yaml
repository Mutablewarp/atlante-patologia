caption:
  it: >-
    Valvola cardiaca con calcificazione distrofica, EE a medio ingrandimento. Parti dallo sfondo: la valvola è fatta di
    tessuto fibroso denso, rosa e povero di cellule, con pochi nuclei fusati (in alto a sinistra). Al centro spiccano
    depositi irregolari e lobulati di colore lilla-viola: i sali di calcio sono basofili e si colorano con l'ematossilina.
    Avvicinandoti, i depositi appaiono amorfi o granulari (più scuri e granulosi in alto a destra) e al loro interno non
    si riconoscono cellule vive. Nota le crepe nette che li attraversano e li circondano: il tessuto calcificato è duro e
    fragile e si spezza al taglio del microtomo; in alcune fessure si vedono globuli rossi. Come leggerla: il calcio si è
    depositato in un tessuto connettivo già danneggiato e degenerato, non perché la calcemia fosse alta; è questo che
    distingue la forma distrofica da quella metastatica. Collegamento clinico: nella valvola aortica lo stesso processo
    irrigidisce le cuspidi e restringe l'orifizio (stenosi aortica calcifica).
  en: >-
    Heart valve with dystrophic calcification, H&E at intermediate power. Start with the background: the valve is made
    of dense, pink, cell-poor fibrous tissue with a few spindle-shaped nuclei (top left). In the middle stand irregular,
    lobulated deposits stained lilac to purple: calcium salts are basophilic and take up haematoxylin. Closer up, the
    deposits look amorphous or granular (darkest and most granular at the upper right) and contain no recognisable living
    cells. Note the sharp cracks running through and around them: calcified tissue is hard and brittle and shatters when
    the section is cut; a few red blood cells lie inside some of the clefts. How to read it: the calcium has settled in
    connective tissue that was already damaged and degenerated, not because blood calcium was high; this is what sets
    the dystrophic form apart from the metastatic one. Clinical link: in the aortic valve the same process stiffens the
    cusps and narrows the orifice (calcific aortic stenosis).
alt:
  it: >-
    Micrografia in ematossilina-eosina: tessuto fibroso rosa con pochi nuclei allungati circonda al centro grandi
    depositi lobulati di colore lilla e viola, attraversati da fessure bianche nette che contengono qualche globulo rosso;
    in alto a destra i depositi sono più scuri e granulosi.
  en: >-
    H&E micrograph: pink fibrous tissue with a few elongated nuclei surrounds, in the centre, large lobulated lilac and
    purple deposits crossed by sharp white clefts that hold a few red blood cells; at the upper right the deposits are
    darker and granular.
