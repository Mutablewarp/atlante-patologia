lookFor:
  it: >-
    Confronta il rivestimento delle ghiandole con la lamina propria: guarda le cellule infiammatorie sparse e lo
    stroma pallido e lasso vicino alla superficie.
  en: >-
    Compare the gland lining with the lamina propria: look at the scattered inflammatory cells and the pale, loose
    stroma near the surface.
caption:
  it: >-
    Stesso caso, EE a ingrandimento maggiore. Osserva le ghiandole con epitelio colonnare e lumi di forma irregolare;
    tra una ghiandola e l'altra la lamina propria contiene molte cellule infiammatorie, mentre in alto il connettivo è
    pallido e lasso. È il livello di dettaglio per valutare epitelio e stroma dopo la vista d'insieme.
  en: >-
    Same case, H&E at higher power. Note glands lined by columnar epithelium with irregular lumens; between the glands
    the lamina propria holds many inflammatory cells, while the connective tissue at the top is pale and loose. This is
    the level for judging epithelium and stroma after the overview.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: ghiandole con epitelio colonnare viola e lumi bianchi
    irregolari, immerse in una lamina propria con molte piccole cellule; in alto una fascia rosa di connettivo pallido.
  en: >-
    High-power H&E micrograph: glands with purple columnar epithelium and irregular white lumens, set in a lamina
    propria with many small cells; a band of pale pink connective tissue runs across the top.
