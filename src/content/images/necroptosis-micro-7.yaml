lookFor:
  it: "Guarda prima i due focolai all'EE e chiediti quale sia necroptotico; poi scendi alla pMLKL: solo quello di sinistra diventa bruno."
  en: "First look at the two foci on H&E and ask which one is necroptotic; then drop to the pMLKL row: only the left one turns brown."
caption:
  it: >-
    Non ogni focolaio necrotico è necroptosi. Lo stesso studio sul carcinoma squamocellulare del distretto testa-collo:
    due focolai che gli autori hanno classificato come necrotici, ognuno in EE (sopra) e in una sezione seriale colorata
    per la MLKL fosforilata (pMLKL, sotto), a piccolo ingrandimento (×100) con il riquadro ingrandito a destra (×400). A
    sinistra, «Positive (+)»: all'EE una distesa di cellule tumorali dal citoplasma rosa e abbondante; nella pMLKL molte
    di queste cellule sono brune, isolate o a piccoli gruppi, e a piccolo ingrandimento le macchie brune sono sparse a
    chiazze nel tumore. A destra, «Negative (-)»: all'EE un nido di cellule tumorali cheratinizzate circondato da molte
    cellule infiammatorie; nella pMLKL si vedono solo nuclei azzurri. Guardando soltanto l'EE, nulla dice quale dei due
    focolai sia nato dalla necroptosi. Contando i focolai su sezioni seriali di 40 tumori, gli autori hanno trovato la
    pMLKL in 545 focolai necrotici su 974, poco più della metà; negli altri questo marcatore della via non c'era. Da
    ricordare: vedere necrosi in un vetrino non dice nulla sul suo meccanismo; la pMLKL, letta insieme ai controlli,
    mostra quale parte era programmata.
  en: >-
    Not every necrotic focus is necroptosis. The same study of head and neck squamous cell carcinoma: two foci that the
    authors classed as necrotic, each shown on H&E (top) and on a serial section stained for phosphorylated MLKL (pMLKL,
    bottom), at low power (×100) with the box enlarged on the right (×400). Left, "Positive (+)": on H&E a sheet of
    tumour cells with abundant pink cytoplasm; in the pMLKL section many of these cells are brown, singly or in small
    groups, and at low power the brown spots are scattered in patches across the tumour. Right, "Negative (-)": on H&E
    a nest of keratinising tumour cells surrounded by many inflammatory cells; the pMLKL section shows only blue nuclei.
    Looking at H&E alone, nothing tells you which of the two foci came from necroptosis. Counting foci on serial sections
    from 40 tumours, the authors found pMLKL in 545 of 974 necrotic foci, a little over half; in the rest this marker of
    the pathway was absent. Key point: seeing necrosis on a slide says nothing about its mechanism; pMLKL, read together
    with its controls, shows which part of it was programmed.
alt:
  it: >-
    Otto micrografie in due gruppi intitolati «Positive (+)» e «Negative (-)», con due righe etichettate a sinistra
    «H&E» e «p-MLKL». Nella riga in alto, rosa e viola, a sinistra una distesa di cellule tumorali dal citoplasma rosa e
    a destra un nido rosa circondato da molti piccoli nuclei scuri. Nella riga in basso, nel gruppo di sinistra,
    numerose cellule brune su fondo chiaro; nel gruppo di destra solo nuclei azzurri, senza bruno.
  en: >-
    Eight micrographs in two groups headed "Positive (+)" and "Negative (-)", with two rows labelled "H&E" and "p-MLKL"
    on the left. In the pink-purple top row, on the left a sheet of tumour cells with pink cytoplasm and on the right a
    pink nest surrounded by many small dark nuclei. In the bottom row, the left group shows many brown cells on a pale
    background; the right group shows only blue nuclei, with no brown.
