# Tissue sections from surgical specimens (ethics approval and informed consent stated); nothing can identify a patient.
# Facts in the caption come from the article: panel d shows a p-MLKL-positive and a p-MLKL-negative necrosis cluster
# with their H&E sections; on serial H&E and p-MLKL sections of 40 tumours, 545 of 974 necrotic foci (necrotic
# clusters plus coagulative necrosis) were p-MLKL-positive (the text gives 55.95%; Table 1 prints 55.59%; both round to
# "a little over half"); ×100 and ×400 original magnifications.
