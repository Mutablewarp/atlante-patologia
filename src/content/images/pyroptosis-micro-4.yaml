# per arc, slit and ring (Fig. 5 D-F); every shape can form transmembrane pores, PI(4,5)P2 favours and cholesterol
# hinders insertion, same behaviour after cleavage by caspase-1, -4 or -5 (abstract); open forms ending as stable
