lookFor:
  it: "Il colore indica l'altezza: gli anelli gialli sporgono dalla membrana marrone; negli ingrandimenti conta le subunità lungo il bordo."
  en: "Colour codes height: the yellow rings stand out from the brown membrane; in the close-ups, count the subunits along the rim."
caption:
  it: >-
    I pori della piroptosi resi visibili: microscopia a forza atomica (AFM) della gasdermina D umana su una membrana
    lipidica artificiale, un esperimento in provetta, senza cellule. Qui un doppio strato lipidico piatto fa le veci
    della membrana plasmatica: dopo un'ora a 37 °C con gasdermina D e caspasi-1, la caspasi aveva tagliato la gasdermina
    D e il suo frammento N-terminale era entrato nella membrana, assemblandosi. Il microscopio tasta la superficie con
    una punta sottilissima e il colore codifica l'altezza, dal marrone scuro (basso) al giallo brillante (alto) su un
    intervallo di 10 nm: le strutture gialle che sporgono dalla membrana marrone sono oligomeri di gasdermina D. A
    sinistra (A, barra di scala 20 nm) una folla di oligomeri: soprattutto anelli chiusi, con alcuni archi aperti e
    alcune «fessure», anelli stretti e allungati. A destra, due ingrandimenti (B e C, barre di scala 10 nm): il bordo è
    una catena di subunità distanti circa 2,3 nm l'una dall'altra (frecce), e in C il centro dell'anello ha un nucleo
    più scuro, cioè più basso, della membrana all'esterno. Secondo i conteggi degli autori un anello chiuso contiene in
    media circa 30 subunità, mentre le forme più piccole ne hanno meno (circa 16 un arco aperto, circa 21 una fessura);
    già queste forme più piccole potevano perforare la membrana, e seguite nel tempo finivano per confluire in anelli,
    la forma più stabile. Su questa membrana gli anelli misuravano in media circa 23 nm di diametro, con forti
    differenze tra l'uno e l'altro (da 13,5 a 33,5 nm). I fosfoinositidi favorivano l'inserimento della gasdermina D
    nella membrana e il colesterolo lo ostacolava; la gasdermina D tagliata dalla caspasi-4 o dalla caspasi-5 si
    comportava come quella tagliata dalla caspasi-1. Perché conta: questi anelli sono un modello in provetta dei pori di
    gasdermina D descritti nella scheda, attraverso i quali l'IL-1β esce dalla cellula mentre acqua e ioni entrano,
    finché la membrana plasmatica si rompe.
  en: >-
    The pores of pyroptosis made visible: atomic force microscopy (AFM) of human gasdermin D on an artificial lipid
    membrane, a test-tube experiment with no cells. Here a flat lipid bilayer stands in for the plasma membrane: after
    an hour at 37 °C with gasdermin D and caspase-1, the caspase had cut gasdermin D, and its N-terminal fragment had
    entered the membrane and assembled there. The microscope feels the surface with a very fine tip, and colour codes
    height, from dark brown (low) to bright yellow (high) over a 10 nm range: the yellow structures standing out from
    the brown membrane are gasdermin D oligomers. On the left (A, scale bar 20 nm), a crowd of oligomers: mostly closed
    rings, with some open arcs and some "slits", narrow, elongated loops. On the right, two close-ups (B and C, scale
    bars 10 nm): the rim is a chain of subunits about 2.3 nm apart (arrows), and in C the centre of the ring has a
    darker core, that is, lower than the membrane outside. By the authors' counts a closed ring holds about 30 subunits
    on average, while the smaller forms hold fewer (about 16 in an open arc, about 21 in a slit); even these smaller
    forms could already pierce the membrane, and followed over time they ended up merging into rings, the most stable
    shape. On this membrane the rings measured about 23 nm across on average, with large differences from one to another
    (13.5 to 33.5 nm). Phosphoinositides favoured the entry of gasdermin D into the membrane and cholesterol hindered
    it; gasdermin D cut by caspase-4 or caspase-5 behaved like gasdermin D cut by caspase-1. Why it matters: these rings
    are a test-tube model of the gasdermin D pores described in the card, through which IL-1β leaves the cell while
    water and ions flow in, until the plasma membrane breaks.
alt:
  it: >-
    Figura di microscopia a forza atomica in marrone e giallo, con un grande pannello quadrato a sinistra e due
    ingrandimenti più piccoli, uno sopra l'altro, a destra. Il pannello grande mostra una ventina di anelli gialli
    brillanti a forma di ciambella e di archi aperti, alcuni con punti luminosi all'interno, che risaltano su un fondo
    marrone scuro e liscio, con una barra di scala bianca in basso a destra. Ogni ingrandimento mostra un singolo
    anello, con il bordo fatto di piccole protuberanze ripetute e due piccole frecce bianche tratteggiate sul bordo;
    l'anello in basso ha il centro scuro.
  en: >-
    Atomic force microscopy figure in brown and yellow, with one large square panel on the left and two smaller
    close-ups stacked on the right. The large panel shows about twenty bright yellow doughnut-shaped rings and open
    arcs, some with bright spots inside, standing out from a smooth dark brown background, with a white scale bar at
    bottom right. Each close-up shows a single ring whose rim is made of small repeated bumps, with two small white
    dashed arrows on the rim; the lower ring has a dark centre.
