lookFor:
  it: "Cerca nel citoplasma di un epatocita rigonfio un ammasso eosinofilo scuro, a corda ritorta, accanto al nucleo."
  en: "Look in the cytoplasm of a swollen hepatocyte for a dark eosinophilic, twisted rope-like clump beside the nucleus."
caption:
  it: >-
    Biopsia epatica, EE ad alto ingrandimento, steatoepatite. Al centro un epatocita rigonfio e vacuolizzato contiene un
    ammasso eosinofilo scuro e irregolare nel citoplasma: è un corpo di Mallory-Denk. Intorno si vedono altri epatociti
    pallidi e vacuolizzati. Il reperto è tipico dell'epatite alcolica, ma non è specifico.
  en: >-
    Liver biopsy, H&E at high power, steatohepatitis. At the center a swollen, vacuolated hepatocyte holds a dark,
    irregular eosinophilic clump in its cytoplasm: a Mallory-Denk body. Other pale, vacuolated hepatocytes surround it.
    The finding is typical of alcoholic hepatitis, but it is not specific.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: al centro un epatocita chiaro e rigonfio con un ammasso
    rosso-viola scuro nel citoplasma, circondato da epatociti pallidi con piccoli vacuoli e da alcuni nuclei scuri.
  en: >-
    High-power H&E micrograph: at the center a pale, swollen hepatocyte with a dark red-purple clump in its cytoplasm,
    surrounded by pale hepatocytes with small vacuoles and a few dark nuclei.
