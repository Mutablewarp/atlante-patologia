lookFor:
  it: "Distingui i nuclei integri, piccoli e netti, dalla nuvola blu sfumata a sinistra del centro: quella è la cromatina espulsa."
  en: "Tell the small, sharp, intact nuclei from the hazy blue cloud left of centre: that cloud is the expelled chromatin."
caption:
  it: >-
    Le NET come appaiono al microscopio a fluorescenza: neutrofili isolati dal sangue venoso di un paziente (affetto da
    malattia di Alzheimer, secondo gli autori), mantenuti in coltura e colorati con Hoechst 33342, un colorante blu che
    si lega al DNA; gli autori indicano un ingrandimento ×40. Parti dalle piccole macchie blu, brillanti e ben
    delimitate: ognuna è il nucleo di un neutrofilo integro, con il DNA ancora impacchettato al suo interno. Poi
    spostati a sinistra del centro: c'è una grande nuvola blu, sfumata e senza un bordo netto. È cromatina uscita da un
    neutrofilo e distesa sul vetrino, cioè una trappola extracellulare del neutrofilo (NET). Da essa partono sottili
    filamenti blu e lungo quello in basso si sono messi in fila alcuni neutrofili integri. Da ricordare: la NET è una
    rete fatta soprattutto di DNA, carica di istoni e di proteine antimicrobiche dei granuli, che cattura e uccide i
    microbi; per liberarla il neutrofilo ha bisogno dell'autofagia e delle specie reattive dell'ossigeno prodotte dalla
    NADPH ossidasi, e nella forma classica il neutrofilo muore. Trappola: un colorante del DNA colora qualsiasi DNA,
    perciò per dimostrare una NET i laboratori evidenziano anche proteine del neutrofilo, come l'elastasi o la
    mieloperossidasi, sugli stessi filamenti. Confronta con la micrografia elettronica a scansione di questa scheda, che
    mostra le fibre vere e proprie.
  en: >-
    NETs as they look in a fluorescence microscope: neutrophils isolated from the venous blood of a patient (with
    Alzheimer's disease, according to the authors), kept in culture and stained with Hoechst 33342, a blue dye that
    binds DNA; the authors give the magnification as ×40. Start with the small, bright, sharply outlined blue spots:
    each is the nucleus of an intact neutrophil, its DNA still packed inside. Then move left of centre: there is a large,
    hazy blue cloud with no sharp border. This is chromatin that has left a neutrophil and spread over the slide, a
    neutrophil extracellular trap (NET). Faint blue threads run out of it, and a few intact neutrophils have lined up
    along the lower one. Key points: a NET is a web made mainly of DNA, loaded with histones and antimicrobial proteins
    from the granules, that catches and kills microbes; to release it the neutrophil needs autophagy and reactive oxygen
    species from NADPH oxidase, and in the classic form the neutrophil dies. Pitfall: a DNA dye stains any DNA, so
    laboratories prove a NET by also showing neutrophil proteins, such as elastase or myeloperoxidase, on the same
    strands. Compare with the scanning electron micrograph on this card, which shows the fibres themselves.
alt:
  it: >-
    Micrografia a fluorescenza su fondo nero: molte piccole macchie tonde blu brillanti sparse nel campo; a sinistra del
    centro una grande nuvola blu pallido, sfumata e senza bordo netto, da cui un sottile filamento blu tenue sale verso
    l'alto a sinistra e un altro scende fino al margine inferiore, con quattro macchie blu allineate lungo di esso.
  en: >-
    Fluorescence micrograph on a black background: many small, bright blue round spots scattered over the field; left
    of centre a large, blurred, pale blue cloud with no clear edge, from which a faint thin blue thread runs up to the
    left and another runs down to the bottom edge, with four blue spots lined up along it.
