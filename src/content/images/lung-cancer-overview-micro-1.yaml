lookFor:
  it: "Osserva i nidi tumorali scuri nello stroma rosa, poi chiediti se si vedono ghiandole o cheratina: qui no."
  en: "See how the dark tumor nests sit in the pink stroma, then ask whether any gland or keratin is visible: here none is."
caption:
  it: >-
    Carcinoma polmonare non a piccole cellule, non altrimenti specificato, EE a medio ingrandimento. Guarda prima i
    nidi di cellule dai nuclei scuri e affollati, circondati da stroma rosa. Cerca poi segni di differenziazione:
    ghiandole o cheratina. Qui non sono evidenti, perciò il tumore non si lascia assegnare a un istotipo sulla sola
    morfologia, e servono colorazioni di immunoistochimica per classificarlo.
  en: >-
    Non-small cell lung carcinoma, not otherwise specified, H&E at medium power. First look at the nests of cells with
    dark, crowded nuclei, surrounded by pink stroma. Then look for signs of differentiation: glands or keratin. Here
    none is obvious, so the tumor cannot be assigned a type on morphology alone, and immunohistochemistry is needed to
    classify it.
alt:
  it: >-
    Micrografia in ematossilina-eosina di frammenti bioptici: nidi di cellule con nuclei violacei affollati in
    mezzo a stroma rosa fibroso, con piccoli spazi vuoti ai margini.
  en: >-
    H&E micrograph of biopsy fragments: nests of cells with crowded purple nuclei within pink fibrous stroma, with
    small empty spaces at the edges.
