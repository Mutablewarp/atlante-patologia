orientation:
  it: Superficie esterna (sierosa) del colon, con scala in centimetri
  en: Outer (serosal) surface of the colon, with a centimeter scale
lookFor:
  it: Cerca le sacche rotondeggianti ai due lati della benderella longitudinale e usa la scala per stimarne le dimensioni.
  en: Look for the rounded pouches on either side of the longitudinal muscle band and use the scale to judge their size.
caption:
  it: >-
    Sigma con diverticoli, veduta dalla sierosa, con scala in centimetri. Guarda prima la parete: le sacche
    rotondeggianti e lucide, gialle di grasso, sporgono verso l'esterno e sono i diverticoli. Nota la loro posizione ai
    due lati della benderella longitudinale. È la veduta esterna: l'imbocco dei diverticoli si vede solo aprendo il
    lume.
  en: >-
    Sigmoid colon with diverticula, seen from the serosal side, with a centimeter scale. Look at the wall first: the
    rounded, glossy, fat-yellow pouches bulge outward and are the diverticula. Note their position on either side of
    the longitudinal muscle band. This is the outer view: the openings of the diverticula are seen only when the lumen
    is opened.
alt:
  it: >-
    Fotografia macroscopica di un tratto di colon con molte sacche rotondeggianti, lucide e giallastre, che sporgono
    dalla superficie esterna accanto a una benderella; in basso a destra una scala graduata in centimetri su sfondo
    azzurro.
  en: >-
    Gross photograph of a stretch of colon with many rounded, glossy, yellowish pouches bulging from the outer surface
    beside a muscle band; at the lower right a ruler in centimeters, on a blue background.
