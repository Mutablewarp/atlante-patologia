stain: focused ion beam–scanning electron microscopy (FIB-SEM)
magnification: ultrastructural (scale bars 3 µm; insets 1 µm, 0.5 µm in c-iii)
caption:
  it: >-
    La piroptosi al microscopio elettronico: tre cellule macrofagiche umane (linea THP-1) di una coltura infettata da
    Mycobacterium tuberculosis, studiate con FIB-SEM, una microscopia elettronica a scansione su sezioni seriali.
    Confronta prima i tre pannelli grandi, poi i riquadri sotto ciascuno, che ingrandiscono gli organuli (i), la
    superficie cellulare (ii) e l'involucro nucleare (iii). a, cellula non infettata e vitale: citoplasma denso, pieno
    di mitocondri (asterischi gialli) e di reticolo endoplasmatico (punta di freccia azzurra), membrana plasmatica
    continua con sottili estroflessioni digitiformi (ii) e involucro nucleare integro a doppia membrana (punte di
    freccia nere, iii). b, macrofago infettato e morto per piroptosi: il citoplasma appare svuotato, con organuli e
    frammenti di membrana dispersi come detriti; le punte di freccia rosse (ii) segnano le interruzioni della membrana
    plasmatica da cui il contenuto cellulare è fuoriuscito, e anche l'involucro nucleare è frammentato (iii). Il
    nucleo però resta un'unica massa tondeggiante, non si spezzetta: è una morte litica e infiammatoria, l'opposto
    dell'apoptosi, in cui la cellula si riduce di volume e si divide in corpi apoptotici chiusi da membrana. c, cellula
    infettata in cui l'inflammasoma si era già assemblato (si era formato lo «speck» di ASC), ma le caspasi erano
    bloccate da inibitori (Z-VAD-FMK e VX-765, inibitore della caspasi-1): la cellula è viva, con membrane e organuli
    integri, compreso l'apparato di Golgi (punta di freccia arancione). Messaggio chiave: il sensore dell'inflammasoma
    da solo non uccide; la cellula muore quando la caspasi-1 attiva taglia la gasdermina D, i cui frammenti aprono
    pori nella membrana plasmatica.
  en: >-
    Pyroptosis under the electron microscope: three human macrophage-like cells (THP-1 line) from a culture infected
    with Mycobacterium tuberculosis, imaged by FIB-SEM, a scanning electron microscopy technique applied to serial
    sections. Compare the three large panels first, then the insets under each one, which enlarge the organelles (i),
    the cell surface (ii) and the nuclear envelope (iii). a, an uninfected living cell: dense cytoplasm packed with
    mitochondria (yellow stars) and endoplasmic reticulum (blue arrowhead), a continuous plasma membrane with thin
    finger-like projections (ii) and an intact, double-membrane nuclear envelope (black arrowheads, iii). b, an
    infected macrophage that has died by pyroptosis: the cytoplasm looks emptied, with organelles and membrane
    fragments scattered as debris; red arrowheads (ii) mark breaks in the plasma membrane through which the cell
    contents have leaked out, and the nuclear envelope is fragmented too (iii). The nucleus, however, is still a single
    rounded mass rather than a cluster of fragments: this is lytic, inflammatory death, the opposite of apoptosis, in
    which the cell shrinks and splits into membrane-bound apoptotic bodies. c, an infected cell in which the
    inflammasome had already assembled (an ASC speck had formed) but caspases were blocked with inhibitors (Z-VAD-FMK
    and the caspase-1 inhibitor VX-765): the cell is alive, with intact membranes and organelles, including the Golgi
    apparatus (orange arrowhead). Take-home message: the inflammasome sensor alone does not kill; the cell dies when
    active caspase-1 cleaves gasdermin D, whose fragments open pores in the plasma membrane.
alt:
  it: >-
    Figura di microscopia elettronica in scala di grigi con tre pannelli grandi intitolati a «Uninfected, living cell»,
    b «Mtb-infected, dead pyroptotic cell» e c «Mtb+ZVAD+VX765, speck formed but living cell», ciascuno con tre piccoli
    riquadri numerati i–iii sotto. In a un grande nucleo è circondato da citoplasma denso pieno di mitocondri ovali; in
    b una cellula pallida e quasi vuota contiene detriti sparsi e a destra un nucleo rotondo, e nel riquadro ii punte
    di freccia rosse indicano una membrana interrotta; in c una cellula densa e integra mostra molte pieghe di
    membrana.
  en: >-
    Greyscale electron microscopy figure with three large panels titled a "Uninfected, living cell", b "Mtb-infected,
    dead pyroptotic cell" and c "Mtb+ZVAD+VX765, speck formed but living cell", each with three small insets numbered
    i–iii below. In a, a large nucleus is surrounded by dense cytoplasm full of oval mitochondria; in b, a pale, nearly
    empty cell holds scattered debris and a round nucleus on the right, and in inset ii red arrowheads point to a
    broken membrane; in c, a dense, intact cell shows many membrane folds.
