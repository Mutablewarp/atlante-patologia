lookFor:
  it: "Confronta il lobo inferiore compatto, rosso e granuloso, con il parenchima superiore più scuro e meno uniforme."
  en: "Compare the solid, red, granular lower lobe with the darker, patchier upper parenchyma."
caption:
  it: >-
    Polmone con polmonite lobare, superficie di taglio. Guarda prima il lobo inferiore: è consolidato, rosso e di
    aspetto granuloso, senza la spugnosità del polmone aerato. Nota poi che i bronchi aperti al centro restano
    pervi. Infine osserva la porzione superiore, più scura e con aree chiare e rosse alternate: il consolidamento qui
    è focale.
  en: >-
    Lung with lobar pneumonia, cut surface. Look first at the lower lobe: it is consolidated, red and granular, with
    none of the sponginess of aerated lung. Then note that the open bronchi in the center stay patent. Finally look
    at the upper portion, darker, with alternating pale and red areas: consolidation here is focal.
alt:
  it: >-
    Sezione di polmone su fondo blu: il lobo inferiore è rosso-arancio e compatto, con bronchi aperti al centro; la
    parte superiore è più scura, bruno-rossastra, con chiazze chiare.
  en: >-
    Slice of lung on a blue background: the lower lobe is red-orange and solid, with open bronchi at the center; the
    upper part is darker, reddish-brown, with pale patches.
