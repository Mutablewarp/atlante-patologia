caption:
  it: >-
    Frammenti di valvola cardiaca asportata, in una cassetta per l'inclusione, con un righello in centimetri. La freccia
    indica il frammento con la vegetazione: un'area granulare rosso-bruna, in mezzo a lembi valvolari pallidi.
  en: >-
    Fragments of a removed heart valve in a processing cassette, with a centimeter ruler. The arrow marks the fragment
    with the vegetation: a granular red-brown area among pale valve leaflets.
alt:
  it: >-
    Fotografia dall'alto di una cassetta bianca con alcuni frammenti di tessuto rosa pallido. La freccia bianca indica un
    frammento centrale con una zona granulare rosso-bruna. In basso a destra c'è un righello in centimetri.
  en: >-
    Top-down photo of a white cassette holding several pale pink tissue fragments. A white arrow points to a central
    fragment with a granular red-brown area. A centimeter ruler lies at the lower right.
lookFor:
  it: "Segui la freccia e cerca la zona granulare rosso-bruna; confrontala per colore e superficie con i lembi pallidi vicini."
  en: "Follow the arrow and find the granular red-brown area; compare its color and surface with the pale fragments nearby."
