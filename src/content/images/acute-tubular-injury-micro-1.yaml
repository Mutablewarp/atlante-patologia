lookFor:
  it: "Parti dal glomerulo, che è l'unica struttura integra e fa da riferimento, poi guarda i tubuli intorno: epitelio sottile e pallido, lumi dilatati con cellule e detriti staccati."
  en: "Start with the glomerulus, the one intact structure and your reference point, then look at the tubules around it: thin, pale epithelium and dilated lumens holding shed cells and debris."
caption:
  it: >-
    Corticale renale con danno tubulare acuto, a medio ingrandimento. Orientati con il glomerulo al centro, che appare
    conservato. Intorno, i tubuli hanno lumi ampi e pallidi, con un epitelio sottile e pochi nuclei; in alcuni lumi
    si vedono cellule staccate e detriti. Quello che conta è il contrasto: il glomerulo è risparmiato, il danno è
    nei tubuli.
  en: >-
    Renal cortex with acute tubular injury, medium power. Orient yourself with the glomerulus at the center, which looks
    preserved. Around it, the tubules have wide, pale lumens with a thin epithelium and few nuclei; some lumens hold
    shed cells and debris. The point is the contrast: the glomerulus is spared and the damage sits in the tubules.
alt:
  it: >-
    Micrografia di corticale renale colorata in rosa e viola: al centro un glomerulo di aspetto normale, circondato da
    tubuli con lumi dilatati e chiari, rivestiti da cellule appiattite con nuclei radi; in alcuni lumi, piccoli
    gruppi di cellule e detriti.
  en: >-
    Micrograph of renal cortex stained pink and purple: at the center a normal-looking glomerulus, surrounded by tubules
    with dilated, pale lumens lined by flattened cells with sparse nuclei; some lumens contain small clusters of cells
    and debris.
