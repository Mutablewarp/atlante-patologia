lookFor:
  it: "Guarda il glomerulo al centro: invece di anse sottili e aperte, vedi masse rotondeggianti pallide che ne riempiono il lobulo."
  en: "Look at the glomerulus in the center: instead of thin, open loops, you see pale rounded masses that fill its lobules."
caption:
  it: >-
    Nefropatia diabetica, glomerulo in sezione colorata di rosa, a medio ingrandimento. Individua il glomerulo al centro
    dell'immagine, circondato da tubuli. Il suo gomitolo è occupato da aree pallide e rotondeggianti, i noduli della
    glomerulosclerosi nodulare, e le anse capillari residue sono ridotte a spazi stretti tra di essi.
  en: >-
    Diabetic nephropathy, glomerulus in a pink-stained section, at medium power. Find the glomerulus in the center of the
    field, surrounded by tubules. Its tuft is taken up by pale, rounded areas, the nodules of nodular glomerulosclerosis,
    and the remaining capillary loops are reduced to narrow spaces between them.
alt:
  it: >-
    Micrografia a medio ingrandimento di un glomerulo renale al centro, in tonalità rosa: il gomitolo contiene diverse
    aree pallide e rotondeggianti separate da spazi chiari; intorno si vedono tubuli con nuclei scuri e uno spazio di
    Bowman.
  en: >-
    Medium-power micrograph of a kidney glomerulus in the center, in pink tones: the tuft holds several pale rounded
    areas separated by clear spaces; around it are tubules with dark nuclei and a Bowman space.
