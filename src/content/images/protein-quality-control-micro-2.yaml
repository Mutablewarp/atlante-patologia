caption:
  it: >-
    Corpi di Lewy e neuriti di Lewy nella neocorteccia, immunoistochimica per l'alfa-sinucleina (marrone) con
    controcolorazione di Nissl (blu), obiettivo 40×. L'alfa-sinucleina è una proteina neuronale che può ripiegarsi
    male e aggregarsi; quando chaperoni, proteasoma e autofagia non riescono a smaltirla, si raccoglie in inclusioni
    stabili, che contengono anche ubiquitina. Come leggere l'immagine: prima guarda il fondo, un neuropilo azzurro
    pallido con nuclei blu di neuroni (grandi, chiari) e di cellule gliali (piccoli, scuri). Poi cerca il marrone:
    alcuni neuroni hanno nel citoplasma un ammasso rotondo, denso e omogeneo, che spesso sposta il nucleo di lato.
    Sono corpi di Lewy corticali. I sottili fili marroni sparsi nel neuropilo sono neuriti di Lewy, lo stesso
    aggregato dentro assoni e dendriti. Con la sola ematossilina-eosina i corpi di Lewy della corteccia sono difficili
    da riconoscere; l'immunoistochimica li rende evidenti. Si trovano nella malattia di Parkinson e nella demenza a
    corpi di Lewy.
  en: >-
    Lewy bodies and Lewy neurites in the neocortex, immunohistochemistry for alpha-synuclein (brown) with a Nissl
    counterstain (blue), 40× objective. Alpha-synuclein is a neuronal protein that can misfold and aggregate; when
    chaperones, the proteasome and autophagy fail to clear it, it collects in stable inclusions that also contain
    ubiquitin. How to read the image: first look at the background, a pale blue neuropil with blue nuclei of neurons
    (large, pale) and glial cells (small, dark). Then look for brown: some neurons hold a round, dense, uniform clump in
    the cytoplasm that often pushes the nucleus to one side. These are cortical Lewy bodies. The thin brown threads
    scattered through the neuropil are Lewy neurites, the same aggregate inside axons and dendrites. On haematoxylin
    and eosin alone, cortical Lewy bodies are hard to recognise; immunohistochemistry makes them obvious. They occur
    in Parkinson disease and in dementia with Lewy bodies.
alt:
  it: >-
    Micrografia di corteccia cerebrale su fondo azzurro pallido con nuclei blu. Diversi neuroni contengono un
    ammasso rotondo marrone scuro nel citoplasma, accanto al nucleo; sottili filamenti marroni sono sparsi tra le
    cellule.
  en: >-
    Micrograph of cerebral cortex on a pale blue background with blue nuclei. Several neurons contain a round,
    dark brown clump in the cytoplasm next to the nucleus; thin brown threads are scattered between the cells.
