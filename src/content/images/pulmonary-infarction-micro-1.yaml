lookFor:
  it: Parti dal polmone aerato a sinistra e segui il passaggio, a destra, all'area piena di sangue.
  en: Start at the aerated lung on the left and follow the transition to the blood-filled area on the right.
caption:
  it: >-
    Infarto polmonare, EE a basso ingrandimento, da autopsia. A sinistra gli alveoli sono aperti e le pareti sottili:
    è polmone conservato. Spostati verso destra: gli spazi alveolari si riempiono di sangue e il tessuto diventa
    uniformemente rosso. È l'emorragia dell'infarto rosso, con il margine verso il polmone vitale.
  en: >-
    Pulmonary infarct, H&E at low power, autopsy specimen. On the left the alveoli are open and the walls thin: this
    is preserved lung. Move to the right: the alveolar spaces fill with blood and the tissue becomes uniformly red.
    This is the hemorrhage of a red infarct, with its edge against viable lung.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: a sinistra alveoli aperti con pareti sottili, a destra
    ampie aree rosso intenso di sangue e tessuto con infiltrato cellulare; in alto il bordo pleurico.
  en: >-
    Low-power H&E micrograph: open alveoli with thin walls on the left, large deep-red areas of blood and cellular
    tissue on the right; the pleural edge runs along the top.
