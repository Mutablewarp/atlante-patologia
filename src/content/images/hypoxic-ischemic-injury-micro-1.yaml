caption:
  it: >-
    Infarto miocardico non riperfuso, EE a medio ingrandimento: il quadro tipico del danno ischemico irreversibile,
    cioè la necrosi coagulativa. Parti dalla metà inferiore, dove i miocardiociti sono ancora vitali: fibre rosa
    pallido, ognuna con il suo nucleo allungato e un po' di pigmento bruno (verosimilmente lipofuscina) ai poli del nucleo. Sali poi
    verso la metà superiore: le fibre sono più rosse (ipereosinofilia), frammentate, e quasi tutte prive di nucleo, ma
    conservano ancora il loro profilo. Al confine tra le due zone c'è una banda di piccoli nuclei scuri, cellule
    infiammatorie e interstiziali richiamate dal tessuto morto. Regola pratica: rosso più intenso + nuclei scomparsi
    con il disegno del tessuto ancora riconoscibile = necrosi coagulativa da ischemia.
  en: >-
    Non-reperfused myocardial infarct, H&E at medium power: the typical picture of irreversible ischemic injury,
    coagulative necrosis. Start in the lower half, where the cardiomyocytes are still viable: pale pink fibres, each
    with its elongated nucleus and a little brown pigment (probably lipofuscin) at the nuclear poles. Then move up to the upper
    half: the fibres are redder (hypereosinophilia), fragmented and mostly without nuclei, yet they keep their outline.
    At the border between the two zones lies a band of small dark nuclei, inflammatory and interstitial cells drawn in
    by the dead tissue. Rule of thumb: deeper red + nuclei gone while the tissue pattern is still recognisable =
    ischemic coagulative necrosis.
alt:
  it: >-
    Micrografia di miocardio in ematossilina-eosina: nella parte alta fibre muscolari rosso intenso, frammentate e
    senza nuclei; al centro una fascia di piccoli nuclei violacei e, a destra, alcuni vacuoli adiposi bianchi; nella
    parte bassa fibre rosa più chiare con nuclei allungati e granuli bruni. In basso a sinistra la lettera "c".
  en: >-
    H&E micrograph of myocardium: in the upper part, intensely red, fragmented muscle fibres without nuclei; across the
    middle a band of small violet nuclei and, at the right, a few white fat vacuoles; in the lower part, paler pink
    fibres with elongated nuclei and brown granules. The letter "c" sits at the bottom left.
