caption:
  it: "Nefrite lupica diffusa proliferativa (classe IV), PAS. Tre glomeruli con ipercellularità diffusa, anse capillari ispessite e depositi eosinofili intensamente PAS-positivi nei lumi, circondati da tubuli prossimali."
  en: "Diffuse proliferative lupus nephritis (class IV), PAS. Three glomeruli with diffuse hypercellularity, thickened capillary loops and intensely PAS-positive eosinophilic deposits in the lumens, surrounded by proximal tubules."
alt:
  it: "Micrografia PAS di una biopsia renale con tre glomeruli ingranditi e ipercellulari, con ammassi rosa intenso nei capillari, circondati da tubuli con citoplasma chiaro."
  en: "PAS micrograph of a kidney biopsy with three enlarged, hypercellular glomeruli containing bright pink masses in the capillaries, surrounded by tubules with pale cytoplasm."
lookFor:
  it: "Guarda prima quanti glomeruli sono coinvolti e se lo sono in modo diffuso, poi cerca i depositi rosa intenso nei lumi capillari."
  en: "First count how many glomeruli are involved and whether the change is diffuse, then look for the bright pink deposits in the capillary lumens."
