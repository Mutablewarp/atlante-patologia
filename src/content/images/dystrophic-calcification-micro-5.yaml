caption:
  it: >-
    Corpo psammomatoso in un carcinoma papillare della tiroide, a forte ingrandimento (×400 secondo la fonte, che non
    indica la colorazione; i colori sono compatibili con un'EE dalla dominante violacea). A destra del centro c'è un
    grande corpo rotondo, viola scuro, dal contorno netto. Guardane l'interno: è fatto di tante sottili lamelle
    concentriche, come gli anelli di un tronco tagliato di traverso, disposte attorno a un piccolo centro. È proprio
    questa stratificazione concentrica a definire il corpo psammomatoso (dal greco psámmos, sabbia): un granello
    microscopico di sali di calcio deposti uno strato dopo l'altro. Intorno c'è stroma fibroso chiaro, e in questo campo
    non si riconoscono con chiarezza cellule tumorali; nell'angolo in alto a destra un altro deposito scuro, irregolare
    e frammentato è probabilmente anch'esso calcifico. Perché distrofica? Il calcio si deposita su tessuto tumorale
    degenerato (nel carcinoma papillare, le papille) e la calcemia non c'entra. Dove aspettarseli: tipici del
    carcinoma papillare della tiroide, frequenti nel carcinoma sieroso di basso grado dell'ovaio e comuni nel
    meningioma. Attenzione: il corpo psammomatoso è un indizio forte, non una diagnosi; il carcinoma papillare si
    riconosce dalle caratteristiche proprie del tumore, le papille e soprattutto l'aspetto dei nuclei.
  en: >-
    Psammoma body in a papillary thyroid carcinoma, high power (×400 according to the source, which does not name the
    stain; the colours fit H&E with a violet cast). Right of centre sits a large, round, deep-purple body with a sharp
    outline. Look inside it: it is built of many thin concentric layers, like the rings of a tree trunk cut across,
    wrapped around a small core. That concentric lamination is what defines a psammoma body (from the Greek psámmos,
    sand): a microscopic grain of calcium salts laid down one layer after another. Around it lies pale fibrous stroma,
    and no tumour cells can be clearly made out in this field; in the top right corner another dark, irregular, broken
    deposit is probably calcified as well. Why dystrophic? The calcium settles on tumour tissue that has degenerated (in
    papillary thyroid carcinoma, the papillae), and blood calcium plays no part. Where to expect them: classically in
    papillary thyroid carcinoma, often in low-grade serous carcinoma of the ovary and commonly in meningioma. Pitfall: a
    psammoma body is a strong clue, not a diagnosis; papillary carcinoma is recognised by the tumour's own features,
    its papillae and above all the look of its nuclei.
alt:
  it: >-
    Micrografia a forte ingrandimento in toni violacei: a destra del centro un grande corpo rotondo viola scuro, formato
    da sottili anelli concentrici, in mezzo a tessuto fibroso chiaro con fessure bianche; nell'angolo in alto a destra
    un deposito scuro, irregolare e frammentato.
  en: >-
    High-power micrograph in shades of violet: right of centre a large, round, dark purple body made of fine concentric
    rings lies in pale fibrous tissue with white clefts; a dark, irregular, broken deposit fills the top right corner.
