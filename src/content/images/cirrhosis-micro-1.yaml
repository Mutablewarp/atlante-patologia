lookFor:
  it: "Parti dalla grande forma rosa di un nodulo e segui il bordo blu che lo circonda: il blu è collagene, il rosa sono gli epatociti."
  en: "Start from the large pink shape of a nodule and follow the blue border around it: blue is collagen, pink is hepatocytes."
caption:
  it: >-
    Cirrosi, colorazione tricromica a basso ingrandimento. Il campione è diviso in grandi noduli rosa di epatociti,
    ciascuno circondato da bande di fibrosi colorate in blu. Le bande si uniscono tra loro e il disegno normale del
    lobulo non si riconosce più: è l'architettura nodulare che definisce la cirrosi. Alcuni epatociti hanno vacuoli
    chiari nel citoplasma.
  en: >-
    Cirrhosis, trichrome stain at low power. The sample is divided into large pink nodules of hepatocytes, each
    surrounded by bands of fibrosis stained blue. The bands join one another and the normal lobular pattern can no
    longer be recognized: this nodular architecture is what defines cirrhosis. Some hepatocytes have clear vacuoles
    in the cytoplasm.
alt:
  it: >-
    Micrografia a basso ingrandimento di un frustolo di fegato con tricromica: ampi noduli di cellule rosa separati
    da sottili bande blu di tessuto fibroso, con alcuni piccoli spazi chiari rotondi nel parenchima.
  en: >-
    Low-power micrograph of a liver sample with trichrome stain: broad nodules of pink cells separated by thin blue
    bands of fibrous tissue, with a few small round clear spaces in the parenchyma.
