lookFor:
  it: "Parti dal centro rosa pallido del nodulo e cerca le strie nere di pigmento; poi osserva l'anello scuro di linfociti attorno."
  en: "Start at the pale pink center of the nodule and find the black pigment streaks; then look at the dark rim of lymphocytes around it."
caption:
  it: >-
    Polmone con silicosi, basso ingrandimento. Un nodulo rotondo ha un centro rosa pallido di collagene denso, disposto
    in strati a vortice, con strie di pigmento nero antracotico. Attorno corre un anello di linfociti; il parenchima
    alveolare vicino è conservato.
  en: >-
    Lung with silicosis, low power. A round nodule has a pale pink center of dense collagen laid down in whorls, with
    streaks of black anthracotic pigment. A rim of lymphocytes runs around it; the nearby alveolar parenchyma is preserved.
alt:
  it: "Sezione di polmone a basso ingrandimento: un nodulo rotondo rosa pallido con strie nere nel centro, circondato da un anello viola scuro di cellule; ai lati alveoli sottili e vasi con globuli rossi."
  en: "Low-power lung section: a round pale pink nodule with black streaks in its center, surrounded by a dark purple ring of cells; thin alveolar walls and vessels with red cells lie at the sides."
