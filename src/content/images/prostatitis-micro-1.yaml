lookFor:
  it: "Cerca il gruppo scuro di cellule rotonde piccole tra le ghiandole, poi confrontalo con la ghiandola a sinistra, quasi priva di infiltrato."
  en: "Find the dark cluster of small round cells between the glands, then compare it with the gland on the left, which has almost no infiltrate."
caption:
  it: >-
    Prostata con infiammazione cronica, EE a medio ingrandimento. Parti dalle ghiandole, con l'epitelio violaceo
    attorno a lumi chiari, immerse in uno stroma rosa. Tra le ghiandole centrali, e attorno a esse, si addensa un
    infiltrato di cellule piccole e rotonde con nucleo scuro: sono cellule infiammatorie croniche. La ghiandola a
    sinistra ne ha poche ed è utile come confronto. Il quadro è quello di una prostatite cronica; solo la biopsia
    permette di distinguerlo da un carcinoma quando il PSA è alto.
  en: >-
    Prostate with chronic inflammation, H&E at medium power. Start with the glands, whose purple epithelium surrounds
    pale lumens, set in pink stroma. Between the central glands, and around them, a crowd of small round cells with dark
    nuclei has gathered: these are chronic inflammatory cells. The gland on the left has few of them and is a useful
    comparison. This is the picture of chronic prostatitis; only a biopsy separates it from carcinoma when PSA is high.
alt:
  it: >-
    Micrografia di prostata in ematossilina-eosina: ghiandole con epitelio violaceo e lumi chiari in uno stroma rosa;
    al centro, tra le ghiandole, un denso ammasso di piccole cellule rotonde con nucleo scuro.
  en: >-
    H&E micrograph of prostate: glands with purple epithelium and pale lumens in pink stroma; in the center, between
    the glands, a dense cluster of small round cells with dark nuclei.
