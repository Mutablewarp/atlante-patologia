lookFor:
  it: "Segui il bordo delle fossette in alto e poi confrontale con le ghiandole rotonde in basso; cerca i capillari pieni di globuli rossi e l'infiammazione scarsa."
  en: "Follow the edge of the pits at the top, then compare them with the round glands below; note the red-cell-filled capillaries and the scant inflammation."
caption:
  it: >-
    Gastropatia reattiva, EE ad alto ingrandimento. In alto le fossette foveolari sono lunghe, irregolari e rivestite da
    cellule mucipare alte con nuclei piccoli; in basso le ghiandole sono tagliate in sezione, con lume dilatato e
    tortuoso. Nella lamina propria tra le strutture ghiandolari si vedono capillari pieni di globuli rossi e pochi
    linfociti: l'infiammazione è scarsa rispetto al danno strutturale dell'epitelio.
  en: >-
    Reactive gastropathy, H&E at high power. At the top the foveolar pits are long and irregular, lined by tall
    mucin-containing cells with small nuclei; below, the glands are cut across, with dilated, twisted lumens. In the
    lamina propria between the glandular structures there are capillaries full of red cells and a few lymphocytes: the
    inflammation is scant compared with the structural change of the epithelium.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: in alto fossette lunghe e ondulate rivestite da cellule
    alte con nuclei piccoli e scuri, in basso sezioni rotonde di ghiandole dal lume ampio; tra di esse un tessuto rosa
    con capillari rossi.
  en: >-
    High-power H&E micrograph: long, wavy pits lined by tall cells with small dark nuclei at the top, and round gland
    cross-sections with wide lumens below; between them pink tissue with red capillaries.
