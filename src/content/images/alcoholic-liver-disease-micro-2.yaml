lookFor:
  it: "Conta i grandi spazi chiari rotondi nel citoplasma e guarda dove si trovano rispetto alla vena centrolobulare; cerca poi le sottili bande verdi di fibrosi."
  en: "Note the large round clear spaces in the cytoplasm and where they sit relative to the central vein; then look for thin green bands of fibrosis."
caption:
  it: >-
    Steatosi macrovescicolare, tricromica di Masson con Verhoeff a medio ingrandimento. Molti epatociti contengono un
    grande spazio chiaro rotondo, il punto dove il grasso è stato sciolto durante l'allestimento; il nucleo è spinto
    verso il bordo. Sottili bande verdi indicano una lieve fibrosi. L'immagine è tratta da un caso non alcolico, ma
    la steatosi alcolica ha lo stesso aspetto: da qui si capisce perché l'istologia da sola non separa le due cause.
  en: >-
    Macrovesicular steatosis, Masson's trichrome with Verhoeff at medium power. Many hepatocytes hold one large round
    clear space, where the fat was dissolved during processing; the nucleus is pushed to the edge. Thin green bands
    mark mild fibrosis. The image comes from a non-alcoholic case, but alcoholic steatosis looks the same: this is why
    histology alone does not separate the two causes.
alt:
  it: >-
    Micrografia di fegato in tricromica: epatociti rossi con numerosi spazi bianchi rotondi di varie dimensioni, una
    grande vena chiara al centro e sottili bande verdi di tessuto fibroso intorno.
  en: >-
    Trichrome micrograph of liver: red hepatocytes with many round white spaces of varying size, a large pale vessel at
    the center and thin green bands of fibrous tissue around it.
