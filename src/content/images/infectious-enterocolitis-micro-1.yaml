lookFor:
  it: "Guarda prima la forma dei villi e la lamina propria, poi cerca sulla superficie i microrganismi, visibili solo a maggiore ingrandimento."
  en: "Look first at villus shape and the lamina propria, then search the surface for the organisms, which show only at higher power."
caption:
  it: >-
    Biopsia duodenale con giardiasi, EE a medio ingrandimento. Orientati con i villi: sono lunghi e rivestiti da
    enterociti con cellule caliciformi chiare. Nella lamina propria c'è un infiltrato di cellule infiammatorie
    mononucleate, mentre la struttura dei villi è in gran parte conservata. Il passo successivo è cercare Giardia sulla
    superficie dell'epitelio, nel muco, a ingrandimento maggiore (immagine seguente).
  en: >-
    Duodenal biopsy with giardiasis, H&E at medium power. Orient yourself with the villi: they are long and lined by
    enterocytes with pale goblet cells. The lamina propria holds an infiltrate of mononuclear inflammatory cells, while
    the villous architecture is largely preserved. The next step is to look for Giardia on the epithelial surface, in
    the mucus, at higher power (next image).
alt:
  it: >-
    Micrografia di mucosa duodenale in ematossilina-eosina: villi lunghi e sottili rivestiti da epitelio rosa con
    nuclei allineati alla base e cellule caliciformi chiare, con piccole cellule infiammatorie nella lamina propria.
  en: >-
    H&E micrograph of duodenal mucosa: long, slender villi lined by pink epithelium with basally aligned nuclei and
    pale goblet cells, with small inflammatory cells in the lamina propria.
