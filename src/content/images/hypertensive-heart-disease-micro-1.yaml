lookFor:
  it: "Confronta i due pannelli alla stessa scala (barra = 50 µm): nel pannello b cerca le fibre più larghe, i nuclei ingranditi e il sottile aumento di tessuto interstiziale."
  en: "Compare the two panels at the same scale (bar = 50 µm): in panel b look for the wider fibers, the enlarged nuclei and the slight increase in interstitial tissue."
caption:
  it: >-
    Miocardio ventricolare, due pannelli alla stessa scala (barra 50 µm). A sinistra (a) miocardio normale di un
    giovane, con fibre sottili e ordinate. A destra (b) miocardio ipertrofico di un uomo di 46 anni con scompenso:
    miociti più larghi con nuclei ingranditi, disposti in modo regolare, e fibrosi interstiziale lieve. Il caso
    illustra l'ipertrofia miocardica in generale; la fonte non lo attribuisce all'ipertensione.
  en: >-
    Ventricular myocardium, two panels at the same scale (bar 50 µm). Left (a), normal myocardium from a young person,
    with slender, orderly fibers. Right (b), hypertrophic myocardium from a 46-year-old man with heart failure: wider
    myocytes with enlarged nuclei, regularly arrayed, and slight interstitial fibrosis. The case shows myocardial
    hypertrophy in general; the source does not attribute it to hypertension.
alt:
  it: >-
    Due micrografie affiancate di miocardio, colorate in rosa e viola. A sinistra fibre muscolari sottili e parallele; a
    destra fibre più larghe con spazi interstiziali chiari. In basso a destra di ogni pannello c'è una barra di scala
    nera.
  en: >-
    Two side-by-side micrographs of myocardium stained pink and purple. On the left, slender parallel muscle fibers; on
    the right, wider fibers with pale interstitial spaces. A black scale bar sits at the lower right of each panel.
