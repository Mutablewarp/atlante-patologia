lookFor:
  it: "Segui il bordo nero delle anse capillari nel glomerulo a sinistra: cerca dove la linea di membrana basale è spessa e frastagliata."
  en: "Follow the black edge of the capillary loops in the left glomerulus: look for where the basement membrane line is thick and ragged."
caption:
  it: >-
    Glomerulonefrite membranosa, biopsia renale, impregnazione argentica di Jones ad alto ingrandimento. Due glomeruli
    occupano il campo; osserva quello a sinistra. L'argento disegna in nero la membrana basale delle anse capillari, e
    il rilievo da cercare è un ispessimento con profilo irregolare e piccole proiezioni verso l'esterno: le spicole. I
    tubuli intorno restano rosa. È lo stesso caso della figura precedente.
  en: >-
    Membranous nephropathy, kidney biopsy, Jones silver stain at high power. Two glomeruli fill the field; study the
    one on the left. The silver draws the basement membrane of the capillary loops in black, and the finding to look
    for is a thickening with an irregular outline and small projections toward the outside: the spikes. The tubules
    around stay pink. This is the same case as the previous figure.
alt:
  it: >-
    Micrografia ad alto ingrandimento con impregnazione argentica: due glomeruli, uno a sinistra e uno in alto al
    centro, con anse capillari a contorno nero, circondati da tubuli rosa e da interstizio scuro.
  en: >-
    High-power silver-stained micrograph: two glomeruli, one at the left and one at the top center, with black
    outlined capillary loops, surrounded by pink tubules and dark interstitium.
