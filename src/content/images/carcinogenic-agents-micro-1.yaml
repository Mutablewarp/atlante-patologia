lookFor:
  it: "Cerca i bastoncini marrone-rossastri segmentati (corpi dell'asbesto) nel tessuto fibrotico, accanto ai granuli neri di pigmento."
  en: "Look for the segmented red-brown rods (asbestos bodies) in the fibrotic tissue, next to black pigment granules."
caption:
  it: >-
    Polmone con esposizione ad asbesto, EE ad alto ingrandimento. Parti dagli spazi aerei bianchi e dai setti alveolari
    ispessiti, rosa, con pochi nuclei. Nel setto a sinistra del centro cerca i bastoncini marrone-rossastri a
    segmenti: sono i corpi dell'asbesto, fibre rivestite di materiale ricco di ferro, circondati da cellule giganti.
    Intorno si vedono granuli neri di pigmento e fibrosi interstiziale. Questo è il segno morfologico che collega
    l'asbesto al polmone, uno dei cancerogeni fisici della scheda.
  en: >-
    Lung with asbestos exposure, H&E at high power. Start from the white air spaces and the thickened pink alveolar
    septa with few nuclei. In the septum left of center, look for the segmented red-brown rods: these are asbestos
    bodies, fibers coated with iron-rich material, surrounded by giant cells. Black pigment granules and interstitial
    fibrosis lie around them. This is the morphologic sign that links asbestos to the lung, one of the physical
    carcinogens on this card.
alt:
  it: >-
    Micrografia di polmone in ematossilina-eosina: setti alveolari rosa ispessiti con fibrosi, granuli neri sparsi e,
    a sinistra del centro, diversi bastoncini marrone-rossastri a segmenti dentro un gruppo di cellule giganti.
  en: >-
    H&E micrograph of lung: thickened pink alveolar septa with fibrosis, scattered black granules and, left of
    center, several segmented red-brown rods inside a cluster of giant cells.
