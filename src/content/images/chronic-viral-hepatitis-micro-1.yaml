lookFor:
  it: "Scorri le travate epatocitarie e cerca gli epatociti con citoplasma pallido, finemente granulare, simile a vetro smerigliato, tra quelli con citoplasma rosa normale."
  en: "Scan the liver cell plates and look for hepatocytes with pale, finely granular cytoplasm like frosted glass among those with normal pink cytoplasm."
caption:
  it: >-
    Biopsia epatica di epatite B cronica a medio ingrandimento, colorazione H&E. Molti epatociti hanno un citoplasma
    pallido e finemente granulare, a vetro smerigliato, con il nucleo conservato. Al centro in alto un piccolo spazio
    vascolare ha ai lati pochi linfociti. L'immagine mostra il quadro a basso ingrandimento di quello che si osserva
    meglio nella seconda immagine.
  en: >-
    Liver biopsy from chronic hepatitis B at medium power, H&E stain. Many hepatocytes have pale, finely granular,
    ground-glass cytoplasm with a preserved nucleus. At upper center a small vascular space has a few lymphocytes beside
    it. The second image shows the same change at higher power.
alt:
  it: >-
    Micrografia a medio ingrandimento di fegato in H&E: travate di epatociti con citoplasma pallido e granulare, sinusoidi
    sottili con globuli rossi e un piccolo spazio vascolare con pochi linfociti in alto al centro.
  en: >-
    Medium-power H&E micrograph of liver: plates of hepatocytes with pale granular cytoplasm, thin sinusoids with red
    cells, and a small vascular space with a few lymphocytes at upper center.
