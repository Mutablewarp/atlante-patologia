lookFor:
  it: "Parti dall'alto: prima la mucosa con ghiandole regolari, poi, sotto, i nidi di tumore nel tessuto di sostegno."
  en: "Start at the top: first the mucosa with regular glands, then, below it, the tumor nests in the supporting tissue."
caption:
  it: >-
    Tumore neuroendocrino dell'intestino tenue, medio ingrandimento, H&E. In alto la mucosa con ghiandole regolari. Sotto
    di essa il tumore è fatto di nidi e di una massa più compatta di cellule uniformi, separati da stroma fibroso.
  en: >-
    Small intestine neuroendocrine tumor, medium power, H&E. At the top is mucosa with regular glands. Below it the
    tumor is made of nests and a more solid mass of uniform cells, separated by fibrous stroma.
alt:
  it: >-
    Micrografia a medio ingrandimento: in alto ghiandole mucose regolari; sotto, nidi e una massa compatta di cellule
    uniformi in stroma rosa.
  en: >-
    Medium-power micrograph: regular mucosal glands at the top; below, nests and a solid mass of uniform cells in pink
    stroma.
