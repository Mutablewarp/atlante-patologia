lookFor:
  it: Parti dal rosso intenso a sinistra e muoviti verso destra, fino alla fascia rosa pallido e compatta.
  en: Start at the deep red area on the left and move to the right, toward the compact pale pink band.
caption:
  it: >-
    Trombo di una vena profonda in organizzazione, EE a basso ingrandimento. A sinistra e in alto restano zone rosso
    intenso, fatte di sangue coagulato. Al centro il tessuto è rosa e contiene cellule viola sparse, più numerose a
    destra. Più a destra una fascia rosa pallido e compatta corrisponde a tessuto fibroso. A medio ingrandimento
    (immagine successiva) si riconoscono le cellule e i piccoli vasi.
  en: >-
    Organizing deep vein thrombus, H&E at low power. On the left and at the top, deep red areas are clotted blood. In
    the middle the tissue is pink with scattered purple cells, more numerous toward the right. Farther right, a compact
    pale pink band is fibrous tissue. At medium power (next image) the cells and small vessels can be told apart.
alt:
  it: >-
    Micrografia in ematossilina-eosina a basso ingrandimento: zone rosso intenso a sinistra e in alto, area rosa con
    piccoli nuclei viola sparsi al centro, fascia rosa pallido compatta a destra; una sottile fessura scura in basso a
    sinistra.
  en: >-
    Low-power H&E micrograph: deep red areas at the left and top, a pink area with scattered small purple nuclei in the
    middle, a compact pale pink band at the right; a thin dark crack at the lower left.
