caption:
  it: >-
    Necroptosi in un tessuto umano: biopsie di fegato trapiantato prese al termine della preparazione al banco, dopo la
    conservazione a freddo (T0, coppia di sinistra), e circa un'ora dopo la riperfusione (T1, coppia di destra), in
    innesti che hanno poi sviluppato una disfunzione precoce. In ogni coppia a sinistra c'è l'ematossilina-eosina (EE),
    a destra l'immunoistochimica per MLKL fosforilata (pMLKL), la forma attivata della proteina che esegue la
    necroptosi: dove la reazione è positiva il prodotto è marrone, mentre i nuclei restano azzurri per la
    controcolorazione. La riga in alto è a basso ingrandimento, quella in basso ingrandisce le aree riquadrate. Parti
    dal basso ingrandimento di T1: la pMLKL disegna una banda marrone che coincide con lo spazio portale (vasi, dotto
    biliare e connettivo), mentre il parenchima epatico intorno resta grigio-azzurro. Poi passa al forte ingrandimento:
    la positività sta nel connettivo portale, nelle cellule fusate attorno ai vasi e al dotto biliare; in questo campo
    l'epitelio del dotto è quasi tutto negativo. Confronta infine con T0: uno spazio portale simile mostra solo
    un'ombra marrone tenue. Ora guarda le due EE: non c'è nessun segno che permetta di riconoscere la necroptosi. Da
    ricordare: la necroptosi non ha un aspetto proprio all'EE; si dimostra con marcatori della via attivata (pMLKL, a
    valle di RIPK1 e RIPK3) o bloccandola con inibitori. Ischemia e riperfusione sono uno dei suoi inneschi; in questo
    studio una pMLKL più alta dopo la riperfusione si associava alla disfunzione precoce del fegato trapiantato.
    Attenzione: una cellula pMLKL-positiva ha attivato la via, ma il marcatore da solo non prova che ogni cellula
    colorata morirà, e la lettura va sempre confrontata con i controlli negativi.
  en: >-
    Necroptosis in human tissue: liver graft biopsies taken at the end of the backbench procedure, after cold storage
    (T0, left pair), and about one hour after reperfusion (T1, right pair), from grafts that later developed early
    allograft dysfunction. In each pair, H&E is on the left and immunohistochemistry for phosphorylated MLKL (pMLKL),
    the activated form of the protein that executes necroptosis, is on the right: where the reaction is positive the
    product is brown, while nuclei stay blue from the counterstain. The top row is low power; the bottom row enlarges
    the boxed areas. Start with T1 at low power: pMLKL draws a brown band that matches the portal tract (vessels, bile
    duct and connective tissue), while the surrounding liver parenchyma stays grey-blue. Then move to high power: the
    staining lies in the portal connective tissue, in the spindle cells around the vessels and the bile duct; in this
    field the duct epithelium is almost entirely negative. Finally compare T0: a similar portal tract shows only a
    faint brown tinge. Now look at the two H&E panels: nothing in them lets you recognise necroptosis. Key point:
    necroptosis has no specific look on H&E; it is shown with markers of the activated pathway (pMLKL, downstream of
    RIPK1 and RIPK3) or by blocking it with inhibitors. Ischaemia and reperfusion are one of its triggers; in this
    study, higher pMLKL after reperfusion was associated with early dysfunction of the transplanted liver. Note that a
    pMLKL-positive cell has switched the pathway on, but the marker alone does not prove that every stained cell will
    die, and the reading must always be checked against negative controls.
alt:
  it: >-
    Due coppie di micrografie di fegato, intitolate T0 a sinistra e T1 a destra; in ogni coppia un pannello rosa-viola
    in ematossilina-eosina e uno in immunoistochimica per pMLKL, a basso ingrandimento in alto e a forte ingrandimento
    in basso. Nei pannelli in alto uno spazio portale con grandi vasi attraversa il parenchima epatico; nei pannelli in
    basso si vede un dotto biliare circondato da connettivo. Nell'immunoistochimica di T1 il connettivo portale è
    marrone scuro e il parenchima grigio-azzurro; in quella di T0 c'è solo un marrone tenue.
  en: >-
    Two pairs of liver micrographs, headed T0 on the left and T1 on the right; each pair has a pink-purple H&E panel
    and a pMLKL immunohistochemistry panel, at low power on top and high power below. In the top panels a portal tract
    with large vessels crosses the liver parenchyma; in the bottom panels a bile duct is surrounded by connective
    tissue. In the T1 immunohistochemistry the portal connective tissue is dark brown and the parenchyma grey-blue; in
    the T0 immunohistochemistry there is only a faint brown tinge.
