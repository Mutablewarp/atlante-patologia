orientation:
  it: "Superficie dell'epitelio in alto, stroma in basso; epitelio normale a sinistra, lesione a destra."
  en: "Epithelial surface at the top, stroma at the bottom; normal epithelium on the left, the lesion on the right."
lookFor:
  it: "Cerca una colorazione scura e continua dalla base alla superficie (a blocco) e il suo confine netto con l'epitelio normale, blu."
  en: "Look for dark, continuous staining from base to surface (the block pattern) and its sharp border with the blue normal epithelium."
caption:
  it: >-
    Lo stesso prelievo cervicale con CIN 2, colorato in immunoistochimica per p16 (p16INK4a), a medio ingrandimento. Già
    a piccolo ingrandimento il quadro è netto: la parte destra dell'epitelio è colorata in rosso-bruno scuro, in modo
    uniforme, dalla base alla superficie, nei nuclei e nel citoplasma, mentre l'epitelio normale a sinistra resta blu;
    il confine tra le due zone è brusco e attraversa l'epitelio in obliquo. Questa colorazione intensa e continua, estesa
    a tutta la lesione, si chiama positività «a blocco». Perché p16 si accumula: nell'infezione da HPV ad alto rischio la
    proteina virale E7 inattiva RB e la cellula reagisce accumulando p16, un inibitore delle CDK che non riesce più a
    fermare il ciclo; per questo p16 segnala le cellule trasformate da HPV ad alto rischio. Concetto chiave: conta solo
    la positività a blocco; una reazione tenue o a macchie, frequente anche nel tessuto cervicale benigno, non ha valore
    diagnostico. Letta così, p16 aiuta a distinguere una vera HSIL (CIN 2–3) dalle lesioni che la imitano,
    come la metaplasia squamosa immatura o l'atrofia, e rende il grading più concorde tra patologi. Le poche cellule
    rosse sparse nello stroma in basso a sinistra non fanno parte della lesione.
  en: >-
    The same CIN 2 cervical specimen immunostained for p16 (p16INK4a), medium power. At low power the picture is already
    clear: the right part of the epithelium is stained a solid dark red-brown from the base to the surface, in both
    nuclei and cytoplasm, while the normal epithelium on the left stays blue; the border between the two is abrupt and
    runs obliquely through the epithelium. This strong staining, continuous across the whole lesion, is called block
    positivity. Why p16 builds up: in infection by high-risk HPV the viral E7 protein inactivates RB, and the cell
    responds by accumulating p16, a CDK inhibitor that can no longer halt the cycle; p16 therefore marks cells
    transformed by high-risk HPV. Key point: only block positivity counts; a faint or spotty reaction, frequent even in
    benign cervical tissue, carries no diagnostic weight. Read this way, p16 helps to separate true HSIL (CIN 2–3) from
    its mimics, such as immature squamous metaplasia or atrophy, and makes grading more consistent between
    pathologists. The few scattered red cells in the stroma at the lower left are not part of the lesion.
alt:
  it: >-
    Micrografia immunoistochimica: la metà destra di una fascia di epitelio squamoso è di un rosso-bruno scuro e
    uniforme dall'alto in basso, mentre la metà sinistra e lo stroma sottostante sono azzurro chiaro. Il confine tra
    l'epitelio rosso-bruno e quello azzurro è netto e corre in diagonale. Nello stroma in basso a sinistra ci sono alcuni
    piccoli punti rossi sparsi.
  en: >-
    Immunostained micrograph: the right half of a band of squamous epithelium is a solid dark red-brown from top to
    bottom, while the left half and the stroma below are pale blue. The border between the red-brown and the blue
    epithelium is sharp and runs diagonally. A few small red dots are scattered in the stroma at the lower left.
