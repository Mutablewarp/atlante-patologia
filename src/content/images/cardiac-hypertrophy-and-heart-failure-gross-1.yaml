lookFor:
  it: "Guarda lo spessore della parete ventricolare tenuta contro il righello e confrontalo con la cavità sottostante, con i muscoli papillari e le trabecole."
  en: "Look at the thickness of the ventricular wall held against the ruler and compare it with the cavity below, with the papillary muscles and trabeculae."
caption:
  it: >-
    Cuore con ipertrofia miocardica, fotografia macroscopica dopo apertura del ventricolo. Parti dal righello
    centimetrato: la parete tenuta tra le dita è spessa, molto più di quanto ci si aspetterebbe in un ventricolo
    normale. Poi guarda la cavità sotto di essa, con trabecole e corde tendinee. L'immagine è usata per mostrare la
    parete ispessita; la fonte la attribuisce a una cardiomiopatia ipertrofica come probabile causa di scompenso.
  en: >-
    Heart with myocardial hypertrophy, gross photograph after the ventricle was opened. Start with the centimeter
    ruler: the wall held between the fingers is thick, much more than expected in a normal ventricle. Then look at the
    cavity below it, with trabeculae and chordae tendineae. The image is used to show the thickened wall; the source
    describes hypertrophic cardiomyopathy as the likely cause of heart failure.
alt:
  it: >-
    Fotografia di un cuore aperto: due mani con guanti chiari tengono un righello bianco e nero contro la parete
    spessa del ventricolo, sopra la cavità con trabecole e corde tendinee.
  en: >-
    Photograph of an opened heart: two gloved hands hold a black-and-white ruler against the thick ventricular wall,
    above the cavity with trabeculae and chordae tendineae.
