caption:
  it: >-
    Pezzo fissato di pene con carcinoma, in un contenitore da museo. Guarda prima la cute rugosa nella parte
    centrale, poi la massa irregolare e rosso-brunastra, a superficie granulosa, in basso a destra: è la lesione
    tumorale, che sostituisce il normale rivestimento liscio. La foto è scattata attraverso la parete del contenitore
    e mostra la lesione solo dall'esterno.
  en: >-
    Fixed penile specimen with carcinoma, photographed in a museum jar. Look first at the wrinkled skin in the middle,
    then at the irregular reddish-brown mass with a granular surface at the lower right: this is the tumor, which
    replaces the normal smooth covering. The photo was taken through the jar wall and shows the lesion from the
    outside only.
alt:
  it: >-
    Fotografia di un pezzo anatomico fissato, sospeso in un contenitore trasparente con il numero 83 sull'etichetta;
    nella parte bassa del pezzo, a destra, una massa irregolare e granulosa di colore bruno-rosato.
  en: >-
    Photograph of a fixed anatomical specimen suspended in a clear jar with the number 83 on the label; in the lower
    part of the specimen, on the right, an irregular, granular pinkish-brown mass.
lookFor:
  it: "Distingui la cute rugosa dalla massa granulosa e irregolare in basso a destra."
  en: "Tell the wrinkled skin apart from the irregular, granular mass at the lower right."
