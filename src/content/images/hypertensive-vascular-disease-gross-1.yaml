lookFor:
  it: "Guarda la superficie del rene nel riquadro ingrandito a destra: è finemente granulare, non liscia."
  en: "Look at the kidney surface in the enlarged panel on the right: it is finely granular, not smooth."
caption:
  it: >-
    Rene intero visto dalla superficie esterna, con a sinistra un riquadro nero che indica l'area mostrata ingrandita
    a destra. L'ingrandimento mostra una superficie finemente granulare, con piccoli rilievi e solchi al posto della
    superficie liscia normale. È l'aspetto del rene nella nefrosclerosi da ipertensione cronica.
  en: >-
    Whole kidney seen from its outer surface, with a black box on the left marking the area enlarged in the right
    panel. The enlargement shows a finely granular surface, with small bumps and grooves instead of the normal smooth
    surface. This is the look of the kidney in nephrosclerosis from chronic hypertension.
alt:
  it: >-
    Fotografia di un rene rosso-bruno con un po' di grasso ilare giallastro e un righello a sinistra; un riquadro nero
    segna un'area, mostrata a destra in ingrandimento con superficie dall'aspetto granuloso.
  en: >-
    Photograph of a red-brown kidney with a little yellowish hilar fat and a ruler on the left; a black box marks an
    area, shown enlarged on the right with a grainy-looking surface.
