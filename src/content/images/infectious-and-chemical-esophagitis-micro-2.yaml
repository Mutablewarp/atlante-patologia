lookFor:
  it: "Cerca, al margine dell'ulcera, cellule squamose grandi con più nuclei che si addossano l'uno all'altro e con cromatina ai bordi."
  en: "At the ulcer edge, look for large squamous cells with several nuclei that press against each other and have chromatin pushed to the rim."
caption:
  it: >-
    Esofagite erpetica (HSV), EE. A sinistra l'epitelio squamoso è ancora conservato; a destra c'è il margine
    dell'ulcera, con detrito necrotico, infiammazione e cellule ingrandite. Guarda queste cellule: hanno più nuclei
    che si modellano l'uno sull'altro e la cromatina spinta contro la membrana nucleare, i segni citopatici di HSV.
    Sono sul bordo dell'ulcera, non sul fondo, a differenza del citomegalovirus.
  en: >-
    Herpes esophagitis (HSV), H&E. On the left the squamous epithelium is still intact; on the right is the ulcer
    edge, with necrotic debris, inflammation and enlarged cells. Look at these cells: they have several nuclei molded
    against one another and chromatin pushed to the nuclear membrane, the cytopathic signs of HSV. They sit at the
    ulcer edge, not at its base, unlike cytomegalovirus.
alt:
  it: >-
    Micrografia EE: a sinistra epitelio squamoso rosa con nuclei regolari, a destra tessuto necrotico rosa-viola con
    cellule infiammatorie e cellule ingrandite plurinucleate.
  en: >-
    H&E micrograph: on the left pink squamous epithelium with regular nuclei, on the right pink-purple necrotic
    tissue with inflammatory cells and enlarged multinucleated cells.
