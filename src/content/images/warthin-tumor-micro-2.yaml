lookFor:
  it: "Segui il bordo di una papilla: conta le due file di cellule rosa, una basale cubica e una luminale colonnare."
  en: "Follow the edge of one papilla: count the two rows of pink cells, a cuboidal basal row and a columnar luminal row."
caption:
  it: >-
    Tumore di Warthin, EE ad alto ingrandimento. Guarda una papilla: il rivestimento è fatto da due file di cellule
    epiteliali eosinofile, con basali cubiche e luminali colonnari, i nuclei allineati lungo il bordo. Il centro della
    papilla contiene stroma chiaro con rari linfociti; gruppi di piccole cellule scure di tipo linfoide compaiono tra
    le papille.
  en: >-
    Warthin tumor, H&E at high power. Look at one papilla: the lining is made of two rows of eosinophilic epithelial
    cells, cuboidal basal cells and columnar luminal cells, with nuclei lined up along the edge. The papilla core holds
    pale stroma with a few lymphocytes; clusters of small dark lymphoid-type cells appear between the papillae.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: papille rosa rivestite da una doppia fila di cellule con
    nuclei viola allineati, su sfondo bianco; piccoli gruppi di cellule scure tra le papille.
  en: >-
    High-power H&E micrograph: pink papillae lined by a double row of cells with aligned purple nuclei against a white
    background; small clusters of dark cells between the papillae.
