caption:
  it: >-
    Condiloma acuminato, EE a medio ingrandimento (il sito anatomico del pezzo non è indicato dalla fonte). Le
    escrescenze papillari hanno un asse di connettivo e sono rivestite da epitelio squamoso ispessito, con molti strati
    di cellule dal citoplasma chiaro e rigonfio. Il confronto con il carcinoma invasivo sta qui: l'epitelio resta
    sopra la sua base e non forma isole nel connettivo sottostante.
  en: >-
    Condyloma acuminatum, H&E at medium power (the source does not give the anatomic site). The papillary outgrowths
    have a connective tissue core and are lined by thickened squamous epithelium with many layers of cells that have
    clear, swollen cytoplasm. The comparison with invasive carcinoma lies here: the epithelium stays above its base
    and forms no islands in the tissue below.
alt:
  it: >-
    Micrografia in ematossilina-eosina: diverse proiezioni papillari rosa pallido rivestite da epitelio squamoso
    ispessito, con piccoli vasi al centro di ciascuna; a sinistra un tratto di connettivo lasso con epitelio sottile.
  en: >-
    H&E micrograph: several pale pink papillary projections lined by thickened squamous epithelium, each with small
    vessels at its center; at the left a stretch of loose connective tissue with thin epithelium.
lookFor:
  it: "Conta le papille e guarda l'asse vascolare di ciascuna; poi controlla che la base resti regolare."
  en: "Count the papillae and look at the vascular core of each; then check that the base stays regular."
