lookFor:
  it: "Cerca i globuli magenta dentro gli epatociti e distinguili dai nuclei blu: dopo la diastasi, niente di magenta può essere glicogeno."
  en: "Look for the magenta globules inside the hepatocytes and tell them from the blue nuclei: after diastase, nothing magenta can be glycogen."
caption:
  it: >-
    Biopsia epatica, deficit di α1-antitripsina (diagnosi della fonte), PAS dopo digestione con diastasi (PAS-D), medio
    ingrandimento. Ricorda che cosa ha già fatto la colorazione: la diastasi ha digerito il glicogeno prima della
    reazione PAS, quindi ciò che resta magenta non può essere glicogeno. Orientati sulla banda di tessuto fibroso che
    attraversa in diagonale la parte in basso a sinistra, con cellule fusate e piccoli nuclei rotondi scuri; il resto
    del campo è parenchima epatico. Poi guarda dentro gli epatociti: molti sono pieni di globuli rotondi magenta, da
    puntini fini a gocce ben distinte, altri ne contengono pochi. Non confonderli con i nuclei, che sono blu e uno per
    cellula. I globuli sono la traccia visibile del controllo di qualità del reticolo endoplasmatico: ognuno è
    α1-antitripsina, una proteina destinata alla secrezione, trattenuta in cisterne dilatate del reticolo perché la
    molecola mutata non raggiunge mai la forma corretta; per questo non passa mai al Golgi e al sangue. Così una sola
    malattia colpisce due organi. Nel fegato il punto d'arrivo può essere la cirrosi, dopo un danno cronico di epatociti
    che non riescono a esportare il proprio prodotto; nel polmone può comparire l'enfisema, perché arriva troppo poca
    antiproteasi per tenere a freno l'elastasi dei neutrofili. In EE gli stessi globuli sono solo debolmente eosinofili
    e sfuggono facilmente: per questo la colorazione da chiedere è la PAS-D. Confronta la fibrosi cistica: lì la CFTR
    mal ripiegata viene degradata invece che accumulata, e la malattia nasce dal canale che manca.
  en: >-
    Liver biopsy, α1-antitrypsin deficiency (the source's diagnosis), PAS after diastase digestion (PAS-D), medium
    power. Remember what the stain has already done: diastase digested the glycogen before the PAS reaction, so whatever
    is still magenta cannot be glycogen. Orient yourself on the band of fibrous tissue that crosses the lower left
    diagonally, with spindle-shaped cells and small dark round nuclei; the rest of the field is liver parenchyma. Then
    look into the hepatocytes: many are packed with round magenta globules, from fine dots to distinct droplets, while
    others hold only a few. Do not mistake them for nuclei, which are blue and one per cell. The globules are the
    visible trace of quality control in the endoplasmic reticulum: each one is α1-antitrypsin, a protein meant for
    secretion, held in dilated ER cisternae because the mutant molecule never reaches its correct shape, so it is never
    passed on to the Golgi and the blood. One disease thus hurts two organs. Cirrhosis can be the end point in the
    liver, after chronic injury to hepatocytes that cannot export their own product; emphysema can follow in the lung,
    where too little antiprotease arrives to hold neutrophil elastase in check. On H&E the same globules are only
    faintly eosinophilic and easy to miss, which is why PAS-D is the stain to ask for. Compare cystic fibrosis, where
    the misfolded CFTR is degraded rather than stored, so the disease comes from the missing channel.
alt:
  it: >-
    Micrografia di fegato colorata con PAS-D a medio ingrandimento: grandi epatociti con nuclei blu, molti pieni di
    globuli rotondi magenta di dimensioni diverse; una banda rosa-violacea di tessuto fibroso, con nuclei scuri fusati e
    rotondi, attraversa in diagonale la parte in basso a sinistra del campo.
  en: >-
    PAS-D micrograph of liver at medium power: large hepatocytes with blue nuclei, many packed with round magenta
    globules of different sizes; a pale pink-violet band of fibrous tissue with dark spindle-shaped and round nuclei
    crosses the lower left of the field diagonally.
