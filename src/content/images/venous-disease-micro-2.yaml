lookFor:
  it: Confronta la zona rossa a sinistra con il tessuto rosa a destra, dove compaiono cellule allungate e piccoli vasi.
  en: Compare the red area on the left with the pink tissue on the right, where elongated cells and small vessels appear.
caption:
  it: >-
    Stessa lesione a medio ingrandimento. In basso a sinistra il sangue coagulato è rosso arancio e privo di struttura.
    Verso destra il tessuto è rosa e contiene cellule fusate viola e piccoli vasi con globuli rossi, segno che il
    trombo viene sostituito da tessuto di riparazione. All'estrema destra il tessuto diventa più fibroso e pallido.
  en: >-
    The same lesion at medium power. At the lower left the clotted blood is orange-red and without structure. Toward
    the right the tissue is pink and holds purple spindle cells and small vessels containing red blood cells, a sign
    that the thrombus is being replaced by repair tissue. At the far right the tissue becomes more fibrous and paler.
alt:
  it: >-
    Micrografia in ematossilina-eosina a medio ingrandimento: area rosso arancio a sinistra, tessuto rosa con cellule
    fusate viola e piccoli vasi al centro e a destra, fascia fibrosa rosa pallido sul bordo destro.
  en: >-
    Medium-power H&E micrograph: an orange-red area at the left, pink tissue with purple spindle cells and small
    vessels in the middle and right, a pale pink fibrous band along the right edge.
