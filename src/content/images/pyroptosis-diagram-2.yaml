orientation:
  it: "Il citosol è sopra la membrana plasmatica (fila di sfere gialle), l'esterno della cellula sotto."
  en: "The cytosol is above the plasma membrane (the row of yellow beads), the outside of the cell below."
lookFor:
  it: "Parti dagli stimoli in alto e segui le frecce fino alla membrana: tutte le strade convergono sul taglio della gasdermina D."
  en: "Start from the triggers at the top and follow the arrows down to the membrane: every route converges on the cleavage of gasdermin D."
caption:
  it: >-
    La gasdermina D al centro della piroptosi (schema; le etichette sono in inglese). Il disegno ha due metà che si
    incontrano al centro. A sinistra la via canonica: lo schema abbina una tossina batterica, la nigericina, al sensore
    NLRP3 e la flagellina di Salmonella Typhimurium al sensore NLRC4; ciascun sensore, con l'adattatore ASC e la
    pro-caspasi-1, forma un inflammasoma, nel quale la pro-caspasi-1 diventa caspasi-1 attiva. A destra la via non
    canonica: il lipopolisaccaride (LPS) dei batteri Gram-negativi arrivato nel citosol attiva direttamente le caspasi-4
    e -5 dell'uomo (caspasi-11 nel topo), senza inflammasoma. Al centro le due strade convergono: entrambi i tipi di
    caspasi tagliano la gasdermina D (GSDMD), che fino a quel momento era tenuta inattiva dal proprio dominio
    C-terminale (in giallo, unito da un'ansa al dominio N-terminale, in rosa). Il frammento N-terminale liberato
    (GSDMD-N) si lega ai fosfoinositidi (PI) della membrana plasmatica, si aggrega con altre copie e apre pori; la
    misura di 10–14 nm sotto il poro è il diametro interno che Ding e collaboratori (2016) hanno misurato per la maggior
    parte dei pori di gasdermina, mentre l'anello che forma il poro è più largo e di dimensioni variabili. La caspasi-1
    trasforma inoltre la pro-IL-1β in IL-1β (e la pro-IL-18 in IL-18, non disegnata), e la citochina matura esce dalla
    cellula attraverso i pori. A destra e in basso, un dato sperimentale: la GSDMD-N si lega anche alla cardiolipina
    (CL), un lipide delle membrane batteriche, e in laboratorio ha danneggiato i batteri. Lo schema si ferma al poro:
    subito dopo entra acqua e la membrana plasmatica si rompe, come mostrano le micrografie di questa scheda.
  en: >-
    Gasdermin D at the centre of pyroptosis (schematic). The drawing has two halves that meet in the middle. Left, the
    canonical pathway: the drawing pairs a bacterial toxin, nigericin, with the sensor NLRP3, and the flagellin of
    Salmonella Typhimurium with the sensor NLRC4; each sensor, together with the adaptor ASC and pro-caspase-1, forms an
    inflammasome, in which pro-caspase-1 becomes active caspase-1. Right, the non-canonical pathway: lipopolysaccharide
    (LPS) of Gram-negative bacteria that reaches the cytosol directly activates caspase-4 and caspase-5 in humans
    (caspase-11 in mice), with no inflammasome. In the middle the two routes converge: both kinds of caspase cut
    gasdermin D (GSDMD), which until then was held inactive by its own C-terminal domain (yellow, joined by a loop to
    the pink N-terminal domain). The freed N-terminal fragment (GSDMD-N) binds phosphoinositides (PI) of the plasma
    membrane, gathers with other copies and opens pores; the 10–14 nm under the pore is the inner diameter that Ding and
    colleagues (2016) measured for most gasdermin pores, while the ring that forms the pore is wider and varies in size.
    Caspase-1 also turns pro-IL-1β into IL-1β (and pro-IL-18 into IL-18, not drawn), and the mature cytokine leaves the
    cell through the pores. At the right and at the bottom, an experimental finding: GSDMD-N also binds cardiolipin
    (CL), a lipid of bacterial membranes, and in laboratory tests it damaged bacteria. The drawing stops at the pore:
    next, water flows in and the plasma membrane ruptures, as the micrographs of this card show.
alt:
  it: >-
    Schema su fondo bianco con due titoli, via canonica dell'inflammasoma a sinistra e via non canonica a destra, sopra
    una membrana plasmatica orizzontale disegnata come una fila di sfere gialle con code nere. A sinistra rombi
    arancioni (tossine batteriche) e punti rosa liberati da un bastoncello grigio di Salmonella puntano su due pile di
    recettori, NLRP3 (viola) e NLRC4 (rossa), ciascuna con ASC in giallo e pro-caspasi-1 in azzurro, raccolte da una
    parentesi come inflammasoma; le frecce portano alla caspasi-1 attiva. A destra batteri grigi Gram-negativi liberano
    punti gialli di LPS che, insieme alla pro-caspasi-4, -5, -11 verde, portano alla caspasi-4, -5, -11 attiva. Una
    linea orizzontale che parte da entrambe le caspasi punta sulla GSDMD autoinibita (un ovale giallo e uno rosa uniti
    da un'ansa), che diventa un singolo ovale rosa, GSDMD-N; le frecce proseguono verso il legame ai PI e poi verso
    l'oligomerizzazione e la formazione del poro, disegnato come barili rosa che attraversano la membrana, uno dei quali
    porta la misura 10-14 nm. La pro-IL-1β diventa IL-1β, che attraversa un poro come punti azzurri (rilascio di
    citochine). Ovali rosa attaccati a batteri grigi illustrano il legame alla cardiolipina e l'uccisione di batteri
    dentro e fuori dalla cellula.
  en: >-
    Schematic on a white background with two titles, canonical inflammasome pathway at left and non-canonical pathway at
    right, above a horizontal plasma membrane drawn as a row of yellow beads with black tails. At left, orange diamonds
    (bacterial toxins) and pink dots shed by a grey Salmonella rod point to two receptor stacks, NLRP3 (purple) and
    NLRC4 (red), each with yellow ASC and blue pro-caspase-1, bracketed as the inflammasome; arrows lead to active
    caspase-1. At right, grey Gram-negative bacteria release yellow LPS dots that, together with green pro-caspase-4,
    -5, -11, lead to active caspase-4, -5, -11. A horizontal line from both caspases points to the auto-inhibited GSDMD
    (a yellow and a pink oval joined by a loop), which becomes a single pink oval, GSDMD-N; arrows continue to PI
    binding and then to oligomerisation and pore formation, drawn as pink barrels crossing the membrane, one of them
    labelled 10-14 nm. Pro-IL-1β becomes IL-1β, which passes through a pore as cyan dots (cytokine release). Pink ovals
    stuck on grey bacteria illustrate cardiolipin binding and the killing of bacteria inside and outside the cell.
