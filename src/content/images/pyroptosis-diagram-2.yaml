# hence ownerApproved: true. Content checked: inflammasome make-up, caspase-1 maturing IL-1β and IL-18, caspase-4/5/11
# sensing cytosolic LPS directly, gasdermin D cut in its linker, the C-terminal domain restraining the N-terminal one,
# phosphoinositide binding and pore assembly, IL-1β leaving through the pores, water entering: card text (rubin-8e
# ch. 1 pp. 56-57; shi-2015; ding-2016; evavold-2018). The 10-14 nm label and cardiolipin binding with damage to
# bacteria: ding-2016 abstract (PubMed 27281216: most pores 10-14 nm inner diameter; gasdermin-N binds
# phosphoinositides and cardiolipin and is toxic to artificially transformed bacteria); a direct bactericidal effect of
