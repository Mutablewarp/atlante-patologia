caption:
  it: "Biopsia renale, colorazione PAS, a medio ingrandimento. Diversi glomeruli sono ipercellulari: i gomitoli sono pieni di nuclei e le anse capillari sono poco aperte, mentre i tubuli circostanti hanno un aspetto più chiaro."
  en: "Kidney biopsy, PAS stain, medium magnification. Several glomeruli are hypercellular: the tufts are packed with nuclei and the capillary loops are poorly open, while the surrounding tubules look paler."
