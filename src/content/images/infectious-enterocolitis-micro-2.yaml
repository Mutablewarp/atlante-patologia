lookFor:
  it: "Cerca nel muco sulla superficie dei villi, in basso a destra, piccoli corpi grigio-azzurri pallidi: sono i trofozoiti di Giardia."
  en: "Search the mucus on the villus surface, lower right, for small pale gray-blue bodies: these are Giardia trophozoites."
caption:
  it: >-
    Biopsia duodenale con giardiasi, EE ad alto ingrandimento. L'epitelio dei villi è rosa, con nuclei ordinati e
    cellule caliciformi chiare. Giardia non invade la mucosa: i trofozoiti stanno sulla superficie, nel muco, e si
    vedono come piccoli corpi grigio-azzurri pallidi, qui in basso a destra. Se trovi Giardia in una biopsia, cerca le
    plasmacellule nella lamina propria: la loro assenza fa pensare a un'immunodeficienza.
  en: >-
    Duodenal biopsy with giardiasis, H&E at high power. The villous epithelium is pink, with orderly nuclei and pale
    goblet cells. Giardia does not invade the mucosa: the trophozoites sit on the surface, in the mucus, and appear as
    small pale gray-blue bodies, here at the lower right. If you find Giardia on a biopsy, look for plasma cells in the
    lamina propria: their absence suggests an immunodeficiency.
alt:
  it: >-
    Micrografia ad alto ingrandimento di villi duodenali in ematossilina-eosina: epitelio rosa con nuclei allineati e
    cellule caliciformi chiare; in basso a destra, nel muco, aggregati di piccoli corpi grigio-azzurri.
  en: >-
    High-power H&E micrograph of duodenal villi: pink epithelium with aligned nuclei and pale goblet cells; at the
    lower right, in the mucus, clusters of small gray-blue bodies.
