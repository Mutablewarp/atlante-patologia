lookFor:
  it: Cerca la parete vasale rosa e confusa al centro e, intorno, i nuclei scuri frammentati dei neutrofili.
  en: Look for the pink, indistinct vessel wall in the center and, around it, the dark fragmented nuclei of neutrophils.
caption:
  it: >-
    Derma, EE ad alto ingrandimento. Al centro la parete di una venula appare rosa e sfumata, con i contorni cancellati.
    Intorno si affolla un infiltrato di cellule infiammatorie, in gran parte con nuclei scuri e frammentati: sono i
    neutrofili e i loro detriti nucleari. Questo è l'aspetto leucocitoclastico, con la parete vasale danneggiata dalla
    necrosi fibrinoide.
  en: >-
    Dermis, H&E at high power. At the center the wall of a venule looks pink and smudged, with its outline lost. Around it
    crowds an infiltrate of inflammatory cells, mostly with dark, fragmented nuclei: neutrophils and their nuclear debris.
    This is the leukocytoclastic look, with the vessel wall damaged by fibrinoid necrosis.
alt:
  it: >-
    Micrografia in ematossilina-eosina ad alto ingrandimento: al centro una parete vasale rosa e indistinta, circondata da
    molte piccole cellule con nuclei viola scuro frammentati su fondo rosa.
  en: >-
    High-power H&E micrograph: a pink, indistinct vessel wall in the center, surrounded by many small cells with
    fragmented dark purple nuclei on a pink background.
