lookFor:
  it: "Parti dal centro pallido e povero di nuclei, poi cerca l'anello di cellule rosa e le cellule giganti ai margini."
  en: "Start at the pale center with few nuclei, then look for the ring of pink cells and the giant cells at the edge."
caption:
  it: >-
    Granuloma necrotizzante in un polmone con tubercolosi miliare, colorazione H&E a basso ingrandimento. Guarda prima
    il centro rosa pallido, quasi privo di nuclei integri, con pochi detriti nucleari sparsi: è la necrosi. Intorno c'è
    un anello di cellule epitelioidi e alcune cellule giganti multinucleate, in basso a sinistra e a destra, poi una
    corona di linfociti scuri. Il granuloma è ben delimitato dal polmone circostante.
  en: >-
    Necrotizing granuloma in a lung with miliary tuberculosis, H&E at low power. Look first at the pale pink center,
    almost without intact nuclei, with a few scattered nuclear fragments: this is the necrosis. Around it lies a ring of
    epithelioid cells and some multinucleated giant cells, at lower left and on the right, then a cuff of dark
    lymphocytes. The granuloma is well demarcated from the surrounding lung.
alt:
  it: >-
    Immagine microscopica rosa e viola: un'area rotonda centrale rosa pallido con rari puntini viola, circondata da un
    anello di cellule più dense e da un margine di piccoli nuclei scuri.
  en: >-
    Pink and purple microscope image: a round central pale pink area with sparse purple dots, surrounded by a denser
    ring of cells and an outer edge of small dark nuclei.
