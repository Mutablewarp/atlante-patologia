lookFor:
  it: "Cerca i glomeruli rotondi e conta quelli circondati da una massa rosa e cellulare nello spazio di Bowman."
  en: "Find the round glomeruli and count those ringed by a pink, cellular mass in Bowman space."
caption:
  it: >-
    Biopsia renale, PAS, medio ingrandimento (striscia di tessuto, ruotata in verticale). Parti dai glomeruli, i
    corpuscoli rotondi tra i tubuli. Molti hanno una massa rosa e cellulare che riempie lo spazio di Bowman e
    comprime il ciuffo capillare al centro: sono le semilune. I tubuli intorno hanno lume ampio e contengono cilindri
    rosa.
  en: >-
    Kidney biopsy, PAS, medium power (tissue strip, turned upright). Start with the glomeruli, the round corpuscles
    among the tubules. Many have a pink, cellular mass filling Bowman space and squeezing the capillary tuft at the
    center: these are the crescents. The surrounding tubules have wide lumens and hold pink casts.
alt:
  it: >-
    Micrografia PAS di una biopsia renale in una striscia verticale: sei glomeruli rotondi tra tubuli con lume
    ampio, ciascuno circondato da un anello rosa-violaceo di cellule e matrice che comprime il piccolo ciuffo
    capillare centrale.
  en: >-
    PAS micrograph of a kidney biopsy in a vertical strip: six round glomeruli among wide-lumened tubules, each
    surrounded by a pink-purple ring of cells and matrix that squeezes the small central capillary tuft.
