lookFor:
  it: "Osserva prima le cellule con il citoplasma vuoto e i bordi netti, poi i nuclei: cerca i nucleoli visibili."
  en: "First see the cells with empty cytoplasm and sharp borders, then the nuclei: look for visible nucleoli."
caption:
  it: >-
    Carcinoma a cellule chiare, grado 2, EE ad alto ingrandimento. Le cellule hanno citoplasma chiaro con membrane
    cellulari ben nette e nuclei con nucleoli distinguibili già a questo ingrandimento, il criterio per il grado
    nucleare.
  en: >-
    Clear cell carcinoma, grade 2, H&E at high power. The cells have clear cytoplasm with sharp cell membranes and
    nuclei with nucleoli that can already be seen at this magnification, the criterion for nuclear grade.
alt:
  it: >-
    Micrografia ad alto ingrandimento in EE: cellule poligonali con ampio citoplasma vuoto delimitato da sottili
    membrane e nuclei violacei irregolari, con rari globuli rossi e un setto fibroso diagonale.
  en: >-
    High-power H&E micrograph: polygonal cells with wide empty cytoplasm outlined by thin membranes and irregular
    purple nuclei, with a few red blood cells and a diagonal fibrous septum.
