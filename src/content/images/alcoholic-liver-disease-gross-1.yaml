lookFor:
  it: "Guarda la superficie di taglio: il colore giallo-bruno e la fine nodularità al posto del parenchima liscio e uniforme di un fegato normale."
  en: "Look at the cut surface: the yellow-brown color and the fine nodularity in place of the smooth, uniform parenchyma of a normal liver."
caption:
  it: >-
    Superficie di taglio di un fegato cirrotico di origine alcolica. Il parenchima è giallo-brunastro e finemente
    nodulare, con aree più chiare dove si estende il tessuto cicatriziale. Confronta con il fegato normale, dove la
    superficie è liscia e uniforme.
  en: >-
    Cut surface of a cirrhotic liver from alcohol use. The parenchyma is yellow-brown and finely nodular, with paler
    areas where scar tissue spreads. Compare with a normal liver, where the surface is smooth and uniform.
alt:
  it: >-
    Fotografia di una sezione di fegato: superficie di taglio giallo-brunastra, con piccoli noduli ravvicinati, alcuni
    lumi vascolari e, in basso a destra, un grosso vaso con la parete rosa.
  en: >-
    Photograph of a liver slice: a yellow-brown cut surface with many small closely set nodules, several vessel
    lumens and, at the lower right, a large vessel with a pink wall.
