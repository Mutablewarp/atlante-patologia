caption:
  it: >-
    Dal danno reversibile a quello irreversibile. Nella fase reversibile il calo di ATP lascia entrare sodio e acqua: la
    cellula, il reticolo endoplasmatico e i mitocondri si rigonfiano e la membrana forma bolle, ma se lo stress cessa la
    cellula torna normale. Oltre il "punto di non ritorno", il cui momento esatto non è noto, la membrana si rompe, il
    calcio invade la cellula, i mitocondri cedono e il contenuto fuoriuscito richiama infiammazione; il nucleo va incontro
    a picnosi, seguita da carioressi (frammentazione) o da cariolisi (perdita della colorabilità).
  en: >-
    From reversible to irreversible injury. In the reversible phase, falling ATP lets sodium and water in: the cell, the
    endoplasmic reticulum and the mitochondria swell and the membrane blebs, yet the cell recovers fully if the stress
    stops. Past the "point of no return", whose exact timing is not known, the membrane ruptures, calcium floods in,
    mitochondria fail and the leaked contents draw inflammation; the nucleus shows pyknosis, followed by karyorrhexis (fragmentation) or karyolysis (fading).
alt:
  it: >-
    Schema a flusso verticale: cellula normale, poi riquadro viola del danno reversibile con una freccia di ritorno verso
    la cellula normale, una linea tratteggiata "punto di non ritorno" e un riquadro rosa del danno irreversibile che
    termina con tre nuclei: al centro quello picnotico, da cui partono due frecce verso un nucleo frammentato (a sinistra) e uno sbiadito (a destra).
  en: >-
    Vertical flow diagram: normal cell, then a violet reversible-injury box with a return arrow to the normal cell, a
    dashed "point of no return" line, and a pink irreversible-injury box ending in three nuclei: a shrunken dark
    nucleus in the centre, with arrows to a fragmented nucleus (left) and a faded one (right).
