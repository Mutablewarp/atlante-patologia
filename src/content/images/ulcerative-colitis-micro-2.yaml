lookFor:
  it: >-
    Cerca le cellule infiammatorie dentro e tra le ghiandole e guarda quante cellule mucipare chiare restano
    nell'epitelio.
  en: >-
    Look for inflammatory cells inside and between the glands, and note how few pale mucin-filled cells are left in the
    epithelium.
caption:
  it: >-
    Stessa lesione, EE a forte ingrandimento. Le ghiandole hanno un epitelio affollato, con nuclei violacei e poco muco
    chiaro nel citoplasma. Tra le ghiandole la lamina propria è piena di piccole cellule infiammatorie, con alcuni
    granulociti dal nucleo segmentato che entrano nell'epitelio delle ghiandole. Questo è il quadro della criptite e
    dell'ascesso criptico.
  en: >-
    Same lesion, H&E at high power. The gland epithelium is crowded, with purple nuclei and little pale mucin in the
    cytoplasm. Between the glands the lamina propria is packed with small inflammatory cells, and some segmented
    granulocytes enter the gland epithelium. This is the picture of cryptitis and crypt abscess.
alt:
  it: >-
    Micrografia a forte ingrandimento in ematossilina-eosina: sezioni di ghiandole con epitelio violaceo e lume chiaro,
    circondate da un fitto infiltrato di piccole cellule infiammatorie e da piccoli vasi pieni di globuli rossi.
  en: >-
    High-power H&E micrograph: cross-sections of glands with purple epithelium and a clear lumen, surrounded by a dense
    infiltrate of small inflammatory cells and small vessels filled with red cells.
