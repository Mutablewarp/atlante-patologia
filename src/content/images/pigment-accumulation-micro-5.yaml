lookFor:
  it: "Segui le sottili pareti alveolari e cerca granuli nero intenso nei tratti più spessi: neri, non bruni."
  en: "Follow the thin alveolar walls and look for jet-black granules in their thicker parts: black, not brown."
caption:
  it: >-
    Polmone, EE a medio ingrandimento: pigmento antracotico (carbone), il corrispettivo microscopico del polmone nero
    della fotografia macroscopica di questa scheda. Qui la quantità è modesta: la fonte precisa che non basta per una
    diagnosi di pneumoconiosi dei minatori di carbone. Prima riconosci l'architettura: sottili pareti alveolari rosa
    delimitano spazi aerei vuoti, con qualche globulo rosso libero che fa da riferimento per le dimensioni. Poi segui il
    nero: granuli grossolani nero intenso si raccolgono in zolle dove le pareti alveolari sono più spesse, a sinistra e a
    destra del campo, e in quantità minore lungo una parete al centro. Nero, qui, significa carbone, e il carbone resta
    per tutta la vita: nessuna cellula riesce a digerirlo. Quella che vedi è la sua prima tappa, le pareti alveolari,
    dove si sono fermati i macrofagi che lo hanno inglobato; da lì drena lungo i linfatici fino ai linfonodi ilari, che
    all'esame macroscopico appaiono neri. Da solo il carbone non fa danni, né ai macrofagi né al polmone; la fibrosi
    compare solo se viene inalato insieme alla silice (antracosilicosi). Come distinguerlo dall'emosiderina: il carbone
    è nero e non bruno-dorato, e resta nero anche con la colorazione per il ferro.
  en: >-
    Lung, H&E at medium power: anthracotic (carbon) pigment, the microscopic counterpart of the black lung in the gross
    photograph of this card. The amount here is modest: the source notes that it is not enough for a diagnosis of coal
    workers' pneumoconiosis. First find the architecture: thin pink alveolar walls outline empty air spaces, with a few
    loose red cells as a size reference. Then follow the black: coarse, jet-black granules gather in clumps where the
    alveolar walls are thicker, at the left and the right of the field, and in smaller amounts along a wall in the
    middle. Black here means carbon, and carbon stays for life: no cell can digest it. What you see is its first stop,
    the alveolar walls, where the macrophages that swallowed it have settled; from there it drains along the lymphatics
    to the hilar lymph nodes, which look black on gross examination. Carbon alone does no harm, neither to the
    macrophages nor to the lung; scarring follows only when silica is breathed in with it (anthracosilicosis). How to
    tell it from hemosiderin: carbon is black rather than golden-brown, and it stays black on an iron stain.
alt:
  it: >-
    Micrografia di polmone in ematossilina-eosina a medio ingrandimento: sottili pareti alveolari rosa e ondulate, con
    nuclei viola, delimitano ampi spazi aerei bianchi e vuoti in cui stanno alcuni globuli rossi tondi; zolle di pigmento
    nero granulare si trovano nei tratti più spessi delle pareti, a sinistra, a destra e al centro del campo.
  en: >-
    Medium-power H&E micrograph of lung: thin, wavy pink alveolar walls with purple nuclei outline large empty white air
    spaces holding a few round red blood cells; clumps of black granular pigment sit in the thicker parts of the walls at
    the left, the right and the center of the field.
