lookFor:
  it: "Confronta l'epitelio pavimentoso a sinistra con quello colonnare a destra e in basso, dove compaiono grandi vacuoli chiari."
  en: "Compare the squamous epithelium on the left with the columnar epithelium at the right and bottom, where large clear vacuoles appear."
caption:
  it: >-
    Stessa lesione, EE a forte ingrandimento. A sinistra l'epitelio pavimentoso ha cellule poligonali con nuclei
    rotondi. A destra e in alto l'epitelio colonnare ha cellule allungate con nuclei ovali disposti in fila. In basso
    a destra le cellule caliciformi sono grandi vacuoli rotondi e chiari che spingono il nucleo ai margini. La presenza
    di cellule caliciformi in epitelio colonnare è il reperto che definisce l'esofago di Barrett.
  en: >-
    Same lesion, H&E at high power. On the left the squamous epithelium has polygonal cells with round nuclei. At the
    right and top the columnar epithelium has tall cells with oval nuclei lined up in a row. At the lower right the
    goblet cells are large, round, clear vacuoles that push the nucleus to the edge. Goblet cells inside columnar
    epithelium are the finding that defines Barrett esophagus.
alt:
  it: >-
    Micrografia in ematossilina-eosina a forte ingrandimento: a sinistra epitelio pavimentoso con cellule poligonali;
    a destra epitelio colonnare con nuclei allungati e, in basso a destra, grandi vacuoli rotondi e chiari.
  en: >-
    High-power H&E micrograph: squamous epithelium with polygonal cells on the left; columnar epithelium with
    elongated nuclei on the right and, at the lower right, large round clear vacuoles.
