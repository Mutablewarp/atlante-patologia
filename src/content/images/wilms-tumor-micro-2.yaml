caption:
  it: >-
    Tumore di Wilms, EE a forte ingrandimento (exeresi chirurgica). Le cellule piccole e rotonde del blastema, a
    nuclei scuri, circondano tubuli ben formati; fra i nidi corre uno stroma lasso con cellule fusate.
  en: >-
    Wilms tumor, H&E at high power (surgical excision). Small round blastemal cells with dark nuclei surround
    well-formed tubules; a loose stroma with spindle cells runs between the nests.
alt:
  it: >-
    Micrografia a forte ingrandimento in EE: cellule piccole e rotonde con nuclei scuri, alcuni tubuli con lume
    centrale e bande di stroma rosa e lasso.
  en: >-
    High-power H&E micrograph: small round cells with dark nuclei, several tubules with a central lumen, and bands of
    loose pink stroma.
