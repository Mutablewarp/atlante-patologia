lookFor:
  it: "Confronta la spessa membrana a strati in alto con le cripte sottostanti, che appaiono vuote e allungate."
  en: "Compare the thick layered membrane on top with the crypts below it, which look empty and stretched."
caption:
  it: >-
    Colon, EE a basso ingrandimento, tratto in cui le pseudomembrane sono confluenti. Sopra la mucosa si vede una
    spessa coltre stratificata e ondulata di essudato che copre tutta la superficie. Sotto, le cripte appaiono
    allungate e vuote, e la sottomucosa è rosa e edematosa. Confrontala con la veduta precedente, dove la
    pseudomembrana formava un singolo "vulcano".
  en: >-
    Colon, H&E at low power, a stretch where the pseudomembranes are confluent. Over the mucosa lies a thick, layered,
    wavy blanket of exudate that covers the whole surface. Below it the crypts look elongated and empty, and the
    submucosa is pink and edematous. Compare it with the previous view, where the pseudomembrane formed a single
    "volcano".
alt:
  it: >-
    Micrografia circolare a basso ingrandimento in ematossilina-eosina: una spessa coltre viola-rosata di essudato a
    strati copre la superficie; sotto, cripte allungate e chiare su uno sfondo rosa.
  en: >-
    Circular low-power H&E micrograph: a thick purple-pink layered blanket of exudate covers the surface; below it,
    elongated pale crypts on a pink background.
