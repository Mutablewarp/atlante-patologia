lookFor:
  it: "Cerca le cellule tonde libere negli spazi aerei, poi valuta i loro granuli: grossolani, dal giallo-oro al bruno scuro, dentro macrofagi."
  en: "Find the round cells lying free in the air spaces, then judge their granules: coarse, golden to dark brown, inside macrophages."
caption:
  it: >-
    Polmone, EE a forte ingrandimento: spazi alveolari zeppi di macrofagi carichi di emosiderina (siderofagi). Il caso
    di origine è una malattia veno-occlusiva polmonare (PVOD) con estese emorragie negli alveoli. Parti dalla
    disposizione d'insieme: a sinistra due grandi ammassi di cellule tondeggianti riempiono gli spazi aerei; a destra
    c'è una parete alveolare ispessita da collagene e cellule fusate. Poi scegli una cellula: un grande macrofago con il
    citoplasma stipato di granuli grossolani, dal giallo-oro al bruno scuro, attorno al nucleo. Quel pigmento è
    emosiderina, il ferro che i macrofagi hanno trattenuto dopo aver fagocitato i globuli rossi usciti negli alveoli.
    Nella PVOD le piccole vene polmonari sono ostruite e la pressione sale nei capillari alveolari a monte: è lo stesso
    meccanismo post-capillare dell'insufficienza ventricolare sinistra, nella quale queste cellule prendono il nome di
    «cellule da vizio cardiaco». Con il tempo si arriva all'indurimento bruno, un polmone che all'esame macroscopico
    appare rigido e color ruggine per la fibrosi e il ferro accumulato. Trappole: il carbone è nero intenso, non
    bruno-dorato; la lipofuscina forma granuli più fini e più chiari. In EE questi pigmenti sembrano tutti solo bruni o
    scuri: passa alla vista con il Perls dello stesso caso per dimostrare che qui si tratta di ferro.
  en: >-
    Lung, H&E at high power: alveolar spaces stuffed with hemosiderin-laden macrophages (siderophages). The source case
    is pulmonary veno-occlusive disease (PVOD), with extensive bleeding into the alveoli. Start with the layout: on the
    left, two large clusters of round cells fill the air spaces; on the right lies an alveolar wall thickened by collagen
    and spindle cells. Then pick one cell: a big macrophage whose cytoplasm is crammed with coarse granules, golden to
    dark brown, around its nucleus. That pigment is hemosiderin, the iron these macrophages kept after swallowing red
    cells that had leaked into the alveoli. In PVOD the small pulmonary veins are blocked, so pressure rises in the
    alveolar capillaries upstream: the same post-capillary mechanism as in left ventricular failure, where these cells
    are called heart failure cells. In time this leads to brown induration, a lung that looks stiff and rust-colored on
    gross examination because of scarring and stored iron. Pitfalls: carbon is jet black, not golden-brown; lipofuscin
    forms finer, paler granules. On H&E all of these only look brown or dark: switch to the Perls view of the same case
    to prove that this pigment is iron.
alt:
  it: >-
    Micrografia di polmone in ematossilina-eosina a forte ingrandimento: a sinistra due grandi ammassi tondeggianti di
    cellule voluminose, piene di granuli grossolani da bruno-dorati a bruno scuri, riempiono spazi aerei chiari; a destra
    spesse bande rosa di tessuto fibroso con nuclei viola allungati; in alto a sinistra alcuni globuli rossi rosso vivo.
  en: >-
    High-power H&E micrograph of lung: on the left, two large rounded clusters of big cells packed with coarse
    golden-brown to dark brown granules fill pale air spaces; on the right, thick pink bands of fibrous tissue with
    elongated purple nuclei; a few bright red blood cells at the top left.
