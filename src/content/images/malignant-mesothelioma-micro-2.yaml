lookFor:
  it: "Osserva la forma dei gruppi di cellule, poi i nuclei: le cellule sono uniformi e si dispongono in tubuli o cordoni?"
  en: "Look at the shape of the cell groups and then at the nuclei: are the cells uniform, and do they line up in tubes or cords?"
caption:
  it: >-
    Mesotelioma maligno epiteliale, EE ad alto ingrandimento. In alto la superficie pleurica è ispessita e fibrosa.
    Sotto di essa le cellule tumorali, di aspetto epitelioide, formano tubuli e cordoni nel connettivo rosa. I nuclei
    sono rotondi e abbastanza uniformi, con nucleolo evidente.
  en: >-
    Epithelioid malignant mesothelioma, H&E at high power. At the top the pleural surface is thickened and fibrous.
    Beneath it the epithelioid-looking tumor cells form tubules and cords in pink connective tissue. The nuclei are
    round and fairly uniform, with a visible nucleolus.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: file di cellule con nuclei violacei rotondi che formano
    tubuli e cordoni in un connettivo rosa, sotto una banda fibrosa in alto.
  en: >-
    High-power H&E micrograph: rows of cells with round purple nuclei forming tubules and cords in pink connective
    tissue, beneath a fibrous band at the top.
