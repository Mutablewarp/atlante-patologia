caption:
  it: >-
    Calcificazione metastatica in una massa sottocutanea di un paziente in dialisi cronica (la stessa lesione della
    foto macroscopica), EE a piccolo ingrandimento. Il campo ha solo due componenti, e il primo passo è separarle: le
    isole e i cordoni irregolari viola scuro, granulosi, che serpeggiano nel campo sono i depositi di sali di calcio;
    il fondo rosa chiaro e fibrillare tra di essi è stroma fibroso reattivo. In questa foto i colori virano al magenta,
    ma il calcio in EE è tipicamente basofilo (blu-viola) e amorfo, spesso frammentato o "strappato" dal microtomo:
    da qui le fessure bianche dentro i depositi. Nota l'assenza di un tessuto necrotico preesistente: il calcio si è
    depositato in un tessuto molle di per sé sano, per l'eccesso sistemico di calcio e fosfato, ed è questo che
    distingue la calcificazione metastatica da quella distrofica. Alla luce polarizzata questi sali di fosfato di
    calcio non sono birifrangenti; per confermarli si usa la colorazione di von Kossa (nero) o il rosso alizarina.
  en: >-
    Metastatic calcification in a subcutaneous mass from a patient on chronic dialysis (the same lesion as the gross
    photograph), H&E at low power. The field has only two components, and the first step is to tell them apart: the
    dark purple, granular islands and cords that meander across the field are the deposits of calcium salts; the pale
    pink, fibrillary background between them is reactive fibrous stroma. The colours in this photograph are shifted
    towards magenta, but on H&E calcium is typically basophilic (blue-purple) and amorphous, and often fragmented or
    torn by the microtome, which explains the white cracks inside the deposits. Note that there is no pre-existing
    necrotic tissue: the calcium has been laid down in soft tissue that was healthy in itself, because of a systemic
    excess of calcium and phosphate, and this is what separates metastatic from dystrophic calcification. Under
    polarised light these calcium phosphate salts are not birefringent; to confirm them, use the von Kossa stain
    (black) or alizarin red.
alt:
  it: >-
    Micrografia in ematossilina-eosina a piccolo ingrandimento: numerose isole e cordoni irregolari viola-magenta
    scuro, granulosi e con piccole fessure bianche, disposti a festoni e ad anello su un fondo rosa chiaro di tessuto
    fibroso.
  en: >-
    Low-power H&E micrograph: many irregular dark purple-magenta islands and cords, granular and with small white
    cracks, arranged in scallops and in a ring on a pale pink background of fibrous tissue.
