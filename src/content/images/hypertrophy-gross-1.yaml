caption:
  it: >-
    Ipertrofia concentrica del ventricolo sinistro: cuore sezionato in fette trasversali (asse corto) dall'apice verso
    la base; il righello a destra dà la scala. Orientati prima: in ogni fetta il ventricolo sinistro è l'anello spesso e
    rotondo a destra, il ventricolo destro è la camera trabecolata a sinistra, tutto intorno c'è il grasso epicardico
    giallo. Reperto chiave: la parete del ventricolo sinistro e il setto sono ispessiti in modo uniforme e la cavità è
    ridotta a una piccola fessura, perché la parete è cresciuta verso l'interno. È il quadro del sovraccarico di
    pressione (ipertensione, stenosi aortica): i sarcomeri nuovi si aggiungono in parallelo, quindi ogni miocita diventa
    più spesso, non più numeroso. Confronta con il sovraccarico di volume (ipertrofia eccentrica), in cui la cavità è
    dilatata e la parete può avere uno spessore normale anche se il peso del cuore è aumentato. Attenzione: un cuore
    fermatosi contratto può sembrare spesso; l'ipertrofia si giudica dal peso del cuore e dallo spessore misurato a un
    livello standard, non a colpo d'occhio.
  en: >-
    Concentric left ventricular hypertrophy: heart cut into transverse (short-axis) slices from the apex towards the
    base; the ruler on the right gives the scale. Orient yourself first: in each slice the left ventricle is the thick,
    round ring on the right, the right ventricle is the trabeculated chamber on the left, and yellow epicardial fat
    surrounds both. Key finding: the left ventricular wall and the septum are evenly thickened and the cavity is reduced
    to a small slit, because the wall has grown inwards. This is the pattern of pressure overload (hypertension, aortic
    stenosis): new sarcomeres are added in parallel, so each myocyte becomes thicker, not more numerous. Compare volume
    overload (eccentric hypertrophy), where the cavity is dilated and the wall may be of normal thickness even though
    the heart is heavier. Pitfall: a heart that stopped contracted can look thick; hypertrophy is judged by heart weight
    and by wall thickness measured at a standard level, not by eye.
alt:
  it: >-
    Fotografia di un cuore tagliato in più fette trasversali sovrapposte, su fondo bianco con un righello a destra. In
    ogni fetta un anello di muscolo bruno-rossastro molto spesso, a destra, circonda una cavità piccola a fessura; a
    sinistra una camera più ampia con trabecole; grasso giallo-arancio attorno.
  en: >-
    Photograph of a heart cut into several overlapping transverse slices, on a white background with a ruler on the
    right. In each slice a very thick ring of red-brown muscle, on the right, surrounds a small slit-like cavity; on the
    left a wider chamber with trabeculae; yellow-orange fat around them.
