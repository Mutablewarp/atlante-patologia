lookFor:
  it: "Cerca le isole viola scuro di cellule piccole e fitte, e fra di esse i piccoli tubuli e le aree rosa più lasse."
  en: "Look for the dark purple islands of small crowded cells, and among them the small tubules and the paler pink loose areas."
caption:
  it: >-
    Tumore di Wilms, EE a basso ingrandimento (exeresi chirurgica). Il tumore è fatto da ampie isole di cellule piccole
    e blu-viola (blastema), con tubuli e rosette (componente epiteliale) e aree più lasse di cellule fusate (stroma).
  en: >-
    Wilms tumor, H&E at low power (surgical excision). The tumor is made of broad islands of small blue-purple cells
    (blastema), with tubules and rosettes (epithelial component) and looser areas of spindle cells (stroma).
alt:
  it: >-
    Micrografia a basso ingrandimento in EE: molte isole viola scuro di cellule fitte, separate da sottili tratti rosa;
    nel campo si vedono piccoli tubuli con lume chiaro.
  en: >-
    Low-power H&E micrograph: many dark purple islands of crowded cells separated by thin pink bands; small tubules
    with pale lumens are scattered in the field.
