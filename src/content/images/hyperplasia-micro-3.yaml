lookFor:
  it: "Trova prima il nodulo tondeggiante, poi verifica che contenga sia ghiandole sia stroma, non soltanto ghiandole."
  en: "Find the rounded nodule first, then check that it holds both glands and stroma, not glands alone."
caption:
  it: >-
    Iperplasia prostatica benigna (iperplasia nodulare) su frammenti di resezione transuretrale (TURP), EE a piccolo
    ingrandimento. Parti dall'architettura d'insieme: le ghiandole non sono distribuite in modo uniforme. Al centro un
    nodulo tondeggiante contiene molte piccole ghiandole immerse in uno stroma cellulato, e fasci di stroma
    fibromuscolare rosa (cellule muscolari lisce e fibroblasti) lo avvolgono. Sono cresciuti entrambi i
    compartimenti, ghiandole e stroma, ed è la loro crescita mista a costruire il nodulo. Passa poi alle ghiandole
    circostanti: hanno dimensioni molto variabili, molte sono dilatate e il loro rivestimento si ripiega nel lume in
    introflessioni papillari di cellule alte a citoplasma chiaro. In alcuni lumi ci sono corpi tondeggianti rosa, i
    corpi amilacei. Al margine sinistro e in basso a destra, frammenti scuri e spigolosi hanno l'aspetto di concrezioni
    calcificate, i piccoli calcoli che i noduli voluminosi possono contenere. A questo ingrandimento non si può
    giudicare il rivestimento formato da due tipi di cellule: le cellule basali appiattite, a contatto con lo stroma,
    e, verso il lume, le cellule secernenti cilindriche. Va cercato a ingrandimento maggiore e, su un'agobiopsia,
    confermato con i marcatori delle cellule basali, come nell'immagine con il cocktail PIN-4 di questa scheda. Il
    punto chiave: l'IPB ingrandisce la ghiandola aggiungendo sia ghiandole sia stroma sotto lo stimolo del
    diidrotestosterone e inizia nella zona di transizione attorno all'uretra, mentre il carcinoma prostatico nasce di
    solito nella zona periferica.
  en: >-
    Benign prostatic hyperplasia (nodular hyperplasia) in chips from a transurethral resection (TURP), H&E at low
    power. Start with the overall pattern: the glands are not spread evenly. In the centre a rounded nodule holds many
    small glands set in a cellular stroma, and streams of pink fibromuscular stroma (smooth muscle cells and
    fibroblasts) wrap around it. Both compartments have grown, glands and stroma alike, and their mixed growth is what
    builds the nodule. Then move to the glands around it: their size varies widely, many are dilated, and their lining
    folds into the lumen as papillary infoldings of tall cells with pale cytoplasm. Some lumens contain round pink
    bodies, the corpora amylacea. At the left edge and at lower right, dark, angular fragments look like calcified
    concretions, the small stones that large nodules can contain. One feature cannot be judged at this power: the
    lining made of two cell types, flat basal cells against the stroma and, towards the lumen, columnar secretory
    cells. Look for it at higher power, and on a needle biopsy confirm it with basal cell markers, as in the PIN-4
    image on this card. Key point: BPH enlarges the gland by adding both glands and stroma under the drive of
    dihydrotestosterone, and it starts in the transition zone around the urethra, whereas prostatic carcinoma usually
    arises in the peripheral zone.
alt:
  it: >-
    Micrografia di prostata in ematossilina-eosina a piccolo ingrandimento: uno stroma rosa disposto a fasci riempie il
    campo; al centro un'area tondeggiante contiene molte piccole ghiandole viola; intorno, ghiandole più grandi con
    lume bianco e profilo ondulato, alcune con piccoli corpi rosa tondeggianti all'interno, e gruppi di frammenti
    angolati bruno-neri al margine sinistro e in basso a destra.
  en: >-
    Low-power H&E micrograph of prostate: pink stroma arranged in streams fills the field; in the centre a rounded area
    holds many small purple glands; around it, larger glands with white lumens and wavy outlines, a few with small
    round pink bodies inside, and clusters of angular brown-black fragments at the left edge and at lower right.
