lookFor:
  it: "Guarda dentro i lumi dei tubuli: sono pieni di un essudato granulare scuro. Poi cerca la parete sottile e rosa che li circonda."
  en: "Look inside the tubule lumens: they are packed with dark granular exudate. Then find the thin pink wall that surrounds them."
caption:
  it: >-
    Epididimite acuta, EE a medio ingrandimento. Parti dai tubuli epididimari, grandi e rotondi, rivestiti da un epitelio
    colonnare sottile. I lumi sono pieni di essudato fibrino-purulento: un ammasso granulare e scuro di neutrofili e
    detriti. Tra i tubuli, lo stroma rosa contiene piccoli vasi congesti. L'infiammazione acuta riempie il lume dei
    tubuli, più che l'interstizio.
  en: >-
    Acute epididymitis, H&E at medium power. Start with the epididymal tubules, large and round, lined by a thin
    columnar epithelium. The lumens are packed with fibrinopurulent exudate: a dark granular mass of neutrophils and
    debris. Between the tubules, pink stroma holds small congested vessels. The acute inflammation fills the tubule
    lumens rather than the interstitium.
alt:
  it: >-
    Micrografia in ematossilina-eosina: grandi tubuli rotondi, con parete sottile e rosa, pieni di materiale granulare
    viola scuro; tra i tubuli, stroma rosa con rari vasi rossi.
  en: >-
    H&E micrograph: large round tubules with a thin pink wall, filled with dark purple granular material; between the
    tubules, pink stroma with a few red vessels.
