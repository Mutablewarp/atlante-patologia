caption:
  it: >-
    Infarto lacunare del talamo, EE a piccolo ingrandimento. Parti dai bordi dell'immagine: il neuropilo sano è rosa,
    compatto e uniforme. Al centro spicca un'area chiara a contorni irregolari in cui il tessuto è rarefatto e
    spugnoso, ridotto a sottili filamenti e piccoli spazi vuoti, attraversato da qualche vaso sottile a parete spessa,
    tagliato di traverso. Qui il tessuto nervoso morto non è rimasto come impalcatura, come accadrebbe nella necrosi
    coagulativa del cuore o del rene: è stato sciolto e poi rimosso dai macrofagi, che a forte ingrandimento si
    cercano come cellule dal citoplasma chiaro e schiumoso. È il quadro tipico della necrosi colliquativa nel sistema
    nervoso centrale, che con il tempo lascia una piccola cavità rivestita da glia. Le lacune sono piccoli infarti, in
    genere sotto i 15 mm, nel territorio delle arterie perforanti profonde danneggiate dall'ipertensione. Da
    ricordare: nel cervello l'infarto va verso la colliquazione anche senza infezione e senza pus.
  en: >-
    Lacunar infarct of the thalamus, H&E at low power. Start at the edges of the image: healthy neuropil is pink,
    solid and even. In the centre stands out a pale, irregular area where the tissue is rarefied and spongy, reduced
    to thin strands and small empty spaces, crossed by a few small thick-walled vessels cut in cross-section. Here the
    dead nervous tissue has not stayed behind as a scaffold, as it would in coagulative necrosis of the heart or
    kidney: it has been dissolved and then removed by macrophages, which at high power you look for as cells with
    pale, foamy cytoplasm. This is the typical picture of liquefactive necrosis in the central nervous system, which
    over time leaves a small glia-lined cavity. Lacunes are small infarcts, usually under 15 mm, in the territory of
    deep penetrating arteries damaged by hypertension. Key point: in the brain an infarct turns liquefactive even
    without infection and without pus.
alt:
  it: >-
    Micrografia di cervello in ematossilina-eosina a piccolo ingrandimento: su un fondo rosa compatto si apre al
    centro un'ampia area pallida, di forma irregolare, dall'aspetto spugnoso e sfilacciato, con alcuni piccoli vasi
    rotondi a parete spessa.
  en: >-
    Low-power H&E micrograph of brain: on a solid pink background a large, pale, irregular area opens up in the
    centre, with a spongy, frayed texture and a few small round thick-walled vessels.
