caption:
  it: >-
    Angiomiolipoma renale, EE a medio ingrandimento. Il tessuto è dominato da adipociti maturi di calibro molto
    variabile, separati da una componente rosa con nuclei sparsi.
  en: >-
    Renal angiomyolipoma, H&E at medium power. The tissue is dominated by mature fat cells of widely varying size,
    separated by a pink component with scattered nuclei.
alt:
  it: >-
    Micrografia a medio ingrandimento in EE: numerosi spazi rotondi e ovali, vuoti e di dimensioni diverse, in un
    fondo rosa con nuclei scuri sparsi e rari globuli rossi.
  en: >-
    Medium-power H&E micrograph: many round and oval empty spaces of different sizes in a pink background with scattered
    dark nuclei and a few red blood cells.
