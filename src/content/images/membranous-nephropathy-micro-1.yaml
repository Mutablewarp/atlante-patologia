lookFor:
  it: "Guarda i glomeruli: le anse hanno un contorno nero marcato, perché l'argento colora la membrana basale."
  en: "Look at the glomeruli: the capillary loops have a strong black outline, because the silver stains the basement membrane."
caption:
  it: >-
    Glomerulonefrite membranosa, biopsia renale, impregnazione argentica di Jones a medio ingrandimento. Parti dalla
    carota bioptica e trova i glomeruli, quattro in questa immagine. L'argento rende neri i contorni delle anse
    capillari, mentre i tubuli restano rosa. Qui si apprezza l'aspetto d'insieme della membrana basale; per cercare le
    spicole passa all'ingrandimento maggiore della figura seguente.
  en: >-
    Membranous nephropathy, kidney biopsy, Jones silver stain at medium power. Start from the biopsy core and find the
    glomeruli, four in this view. The silver turns the outlines of the capillary loops black, while the tubules stay
    pink. Here you see the basement membrane as a whole; to look for the spikes, move on to the higher power of the
    next figure.
alt:
  it: >-
    Micrografia a medio ingrandimento con impregnazione argentica di una carota bioptica renale su sfondo bianco:
    quattro glomeruli con anse a contorno nero, tubuli rosa e un interstizio scuro tra di essi.
  en: >-
    Medium-power silver-stained micrograph of a kidney biopsy core on a white background: four glomeruli with black
    outlined loops, pink tubules and a dark interstitium between them.
