lookFor:
  it: "Parti dall'anello esterno e riconosci la parete dell'arteria, poi vedi quanto spazio occupa l'intima ispessita rispetto al lume rimasto."
  en: "Start at the outer ring, which is the artery wall, then judge how much room the thickened intima takes compared with the lumen that is left."
caption:
  it: >-
    Sezione trasversale di un'arteria coronaria a basso ingrandimento. L'avventizia, in verde, circonda la
    media, più scura. All'interno l'intima è molto ispessita e ha un aspetto stratificato e il lume bianco,
    irregolare, è ridotto a una fessura. È la lesione aterosclerotica che limita il flusso verso il miocardio.
  en: >-
    Low-power cross-section of a coronary artery. The green adventitia surrounds the darker media. Inside, the
    intima is greatly thickened and layered, and the white, irregular lumen is reduced to a narrow slit. This is
    the atherosclerotic lesion that limits flow to the myocardium.
alt:
  it: >-
    Sezione tonda di un'arteria colorata in verde e viola, con una parete molto spessa e un piccolo lume bianco
    di forma irregolare spostato verso destra.
  en: >-
    Round section of an artery stained green and purple, with a very thick wall and a small, irregular white lumen
    pushed toward the right.
