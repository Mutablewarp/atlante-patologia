caption:
  it: >-
    Ileo terminale, cieco e colon ascendente aperti per il lungo, fissati in formalina. Guarda prima la mucosa: al posto
    delle normali pieghe c'è un rilievo di noduli rotondeggianti separati da solchi, il tipico aspetto a ciottolato.
    Nota poi che la parete è ispessita e che il tratto alterato si alterna a zone più lisce.
  en: >-
    Terminal ileum, cecum and ascending colon opened lengthwise after formalin fixation. Look at the mucosa first: in
    place of the normal folds there is a pattern of rounded nodules separated by grooves, the typical cobblestone
    appearance. Then note the thickened wall and the altered stretch that alternates with smoother areas.
alt:
  it: >-
    Fotografia di un pezzo anatomico di intestino aperto in un recipiente trasparente: la mucosa è giallo-arancio e
    coperta da noduli rotondeggianti ravvicinati; in alto e in basso compaiono le etichette del preparato.
  en: >-
    Photograph of an opened bowel specimen in a clear container: the mucosa is yellow-orange and covered by closely
    set rounded nodules; the specimen labels appear at the top and bottom.
lookFor:
  it: "Cerca i noduli rotondeggianti separati da solchi (ciottolato) e confrontali con la mucosa più liscia del tratto vicino."
  en: "Look for the rounded nodules separated by grooves (cobblestoning) and compare them with the smoother mucosa of the neighboring stretch."
