lookFor:
  it: "Confronta la grandezza degli spazi aerei con lo spessore dei setti: gli spazi sono ampi e i setti sottili e frammentati."
  en: "Compare the size of the airspaces with the thickness of the septa: the spaces are wide and the septa thin and broken."
caption:
  it: >-
    Polmone con enfisema, EE a basso ingrandimento (obiettivo 4x). Guarda prima la forma d'insieme: invece dei piccoli
    alveoli regolari si vedono ampi spazi aerei vuoti, divisi da setti sottili e in parte interrotti. Lungo il setto
    connettivale più spesso, che attraversa il campo, scorrono vasi pieni di sangue. Questo è l'ingrandimento giusto
    per riconoscere la distruzione delle pareti alveolari prima di guardare i dettagli.
  en: >-
    Emphysematous lung, H&E at low power (4x objective). Start with the overall pattern: instead of small regular
    alveoli you see wide empty airspaces divided by thin, partly broken septa. Blood-filled vessels run along the
    thicker connective tissue septum that crosses the field. This is the right power to recognize the destruction of
    alveolar walls before looking at details.
alt:
  it: >-
    Micrografia a basso ingrandimento di polmone in ematossilina-eosina: ampi spazi aerei vuoti separati da setti
    sottili violacei, alcuni interrotti; vasi sanguigni rossi lungo un setto più spesso.
  en: >-
    Low-power H&E micrograph of lung: wide empty airspaces separated by thin purple septa, some of them interrupted;
    red blood-filled vessels along a thicker septum.
