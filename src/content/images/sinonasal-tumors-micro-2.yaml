lookFor:
  it: Segui lo spessore dell'epitelio dalla superficie fino allo stroma rosa e osserva la forma regolare dei nuclei.
  en: Follow the thickness of the epithelium from the surface down to the pink stroma and note the regular shape of the nuclei.
caption:
  it: >-
    Papilloma sinonasale, EE ad alto ingrandimento. Un asse di stroma rosa è rivestito da un epitelio spesso, a più
    strati, con nuclei ovali omogenei. Le cellule più superficiali hanno un orlo rosa sfrangiato. Non si vedono
    cheratinizzazione né atipie marcate in questo campo.
  en: >-
    Sinonasal papilloma, H&E at high power. A core of pink stroma is covered by thick, multilayered epithelium with
    uniform oval nuclei. The most superficial cells have a pink fringed border. No keratinization or marked atypia is
    seen in this field.
alt:
  it: >-
    Micrografia ad alto ingrandimento in ematossilina-eosina: asse di stroma rosa con vasi, rivestito su entrambi i lati
    da epitelio spesso con nuclei ovali violacei; lo sfondo in alto e a sinistra è bianco.
  en: >-
    High-power H&E micrograph: a pink stromal core with vessels, covered on both sides by thick epithelium with purple
    oval nuclei; the background at the top and left is white.
