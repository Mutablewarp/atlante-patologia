caption:
  it: >-
    Linfonodo pelvico con metastasi di adenocarcinoma endometriale, tre pannelli. A sinistra, in EE a basso
    ingrandimento, le piccole metastasi sono quasi invisibili tra i linfociti. Al centro, l'immunoistochimica per le
    citocheratine AE1/AE3 colora di bruno gli aggregati e le cellule isolate di origine epiteliale, che prima si
    perdevano. A destra, a forte ingrandimento in EE, le cellule tumorali hanno nuclei grandi con nucleoli evidenti,
    diversi dai piccoli nuclei scuri dei linfociti.
  en: >-
    Pelvic lymph node with endometrial adenocarcinoma metastasis, three panels. On the left, in H&E at low power, the
    small metastases are almost invisible among the lymphocytes. In the middle, immunohistochemistry for cytokeratin
    AE1/AE3 stains the clusters and single cells of epithelial origin brown, cells that were easy to miss. On the
    right, at high power in H&E, the tumor cells have large nuclei with prominent nucleoli, unlike the small dark
    nuclei of the lymphocytes.
alt:
  it: >-
    Tre micrografie affiancate: a sinistra tessuto linfoide violaceo in EE; al centro lo stesso tipo di tessuto
    azzurrino con piccoli gruppi e cellule sparse colorati di bruno; a destra un ingrandimento forte con grandi cellule
    dal citoplasma rosa e nuclei vescicolosi tra piccoli linfociti scuri.
  en: >-
    Three side-by-side micrographs: on the left, purple lymphoid tissue in H&E; in the middle, pale blue tissue with
    small brown-stained clusters and scattered cells; on the right, a high-power view of large cells with pink
    cytoplasm and vesicular nuclei among small dark lymphocytes.
lookFor:
  it: "Confronta il pannello EE con quello bruno: le cellule colorate sono quelle che nel pannello di sinistra non si vedono."
  en: "Compare the H&E panel with the brown one: the stained cells are the ones you cannot see in the left panel."
