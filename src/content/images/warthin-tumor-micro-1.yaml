lookFor:
  it: "Cerca il viola scuro del tessuto linfoide accanto agli spazi cistici e alle papille rosa, poi la capsula fibrosa rosa chiaro."
  en: "Look for the dark purple lymphoid tissue beside the cystic spaces and the pink papillae, then the pale pink fibrous capsule."
caption:
  it: >-
    Tumore di Warthin della parotide, EE a basso ingrandimento. A sinistra, papille rosa che sporgono in spazi cistici
    vuoti. Al centro e in alto, il tessuto linfoide appare come zone viola scuro, con alcuni centri germinativi più
    chiari, accanto a piccoli spazi cistici. Una banda diagonale rosa chiaro è la capsula fibrosa. In basso a destra
    c'è un frammento di parotide normale, con acini viola scuro.
  en: >-
    Warthin tumor of the parotid, H&E at low power. On the left, pink papillae project into empty cystic spaces. In the
    center and upper part, lymphoid tissue forms dark purple areas, with a few paler germinal centers, next to small
    cystic spaces. A pale pink diagonal band is the fibrous capsule. At the lower right is a fragment of normal
    parotid gland with dark purple acini.
alt:
  it: >-
    Micrografia a basso ingrandimento in ematossilina-eosina: a sinistra papille rosa in spazi vuoti; al centro bande
    viola scuro di tessuto linfoide e una capsula rosa chiaro in diagonale; in basso a destra un piccolo frammento viola
    di ghiandola normale.
  en: >-
    Low-power H&E micrograph: pink papillae in empty spaces at the left; dark purple bands of lymphoid tissue and a
    pale pink diagonal capsule in the center; a small purple fragment of normal gland at the lower right.
