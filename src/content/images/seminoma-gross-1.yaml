caption:
  it: >-
    Testicolo sezionato con seminoma. Guarda prima il contorno: la massa occupa quasi tutto l'organo e la tunica
    albuginea, qui in alto a destra, è ancora riconoscibile. Poi osserva la superficie di taglio: è omogenea, di colore
    crema-biancastro, un po' carnosa, e divisa in grandi lobuli da sottili setti più chiari. La riga millimetrata in
    basso dà la scala.
  en: >-
    Sectioned testis with a seminoma. Look at the outline first: the mass fills most of the organ and the tunica
    albuginea, here at the upper right, is still recognizable. Then look at the cut surface: it is homogeneous,
    cream-white, somewhat fleshy, and divided into large lobules by thin, paler septa. The millimeter ruler along the
    bottom gives the scale.
alt:
  it: >-
    Fotografia di un testicolo tagliato a metà su fondo nero: la superficie di taglio è quasi interamente occupata da
    un tessuto cremoso-biancastro, lobulato, circondato da una sottile capsula; in basso una riga millimetrata.
  en: >-
    Photograph of a testis cut in half on a black background: the cut surface is almost entirely taken up by lobulated,
    cream-white tissue surrounded by a thin capsule; a millimeter ruler runs along the bottom edge.
