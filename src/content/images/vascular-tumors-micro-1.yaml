lookFor:
  it: "Cerca i piccoli vasi ben formati rivestiti da cellule endoteliali piatte e le zone con globuli rossi."
  en: "Look for small, well-formed vessels lined by flat endothelial cells and the areas filled with red blood cells."
caption:
  it: >-
    Emangioma capillare, EE a medio ingrandimento. Guarda prima il tessuto a sinistra: è fatto da tanti piccoli canali
    vascolari ravvicinati, con pareti sottili e nuclei endoteliali regolari. Poi osserva a destra e in basso: alcuni
    spazi più grandi sono pieni di globuli rossi, che appaiono di un rosso intenso. Al margine destro c'è tessuto
    connettivo rosa e fibroso.
  en: >-
    Capillary hemangioma, H&E at medium power. Look first at the tissue on the left: it is made of many small,
    closely packed vascular channels with thin walls and regular endothelial nuclei. Then look to the right and
    bottom: some larger spaces are filled with red blood cells, which appear bright red. At the right edge there is
    pink, fibrous connective tissue.
alt:
  it: >-
    Micrografia in ematossilina-eosina: a sinistra e al centro un tessuto rosa-violaceo con numerosi piccoli canali
    vascolari; a destra e in basso ampi spazi pieni di globuli rossi rossi; sul margine destro una banda di connettivo
    rosa.
  en: >-
    H&E micrograph: on the left and center a pink-purple tissue with many small vascular channels; on the right and
    at the bottom, wide spaces filled with bright red blood cells; along the right edge a band of pink connective
    tissue.
