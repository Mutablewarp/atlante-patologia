orientation:
  it: "In entrambe le foto il ventricolo destro è a sinistra e la parete posteriore del ventricolo sinistro è in alto."
  en: "In both photographs the right ventricle is on the left and the posterior wall of the left ventricle is at the top."
lookFor:
  it: "Nella fetta fresca percorri la parete del ventricolo sinistro: dove il rosso-bruno diventa nocciola chiaro, lasci il muscolo vivo ed entri nell'infarto."
  en: "In the fresh slice, follow the left-ventricular wall round: where red-brown turns pale tan, you leave living muscle and enter the infarct."
caption:
  it: >-
    Fetta trasversale dei ventricoli con un infarto miocardico di circa una settimana nella parete posteriore del
    ventricolo sinistro e una rottura focale; lo stesso infarto fotografato a fresco (a sinistra) e dopo fissazione in
    formalina (a destra). In entrambe le foto il ventricolo destro, a parete sottile, è a sinistra e la parete
    posteriore del ventricolo sinistro è in alto. Parti dalla fetta fresca e percorri tutta la parete del ventricolo
    sinistro: il muscolo vivo ha un colore rosso-bruno uniforme, mentre il segmento infartuato è pallido,
    giallo-nocciola e chiazzato. Quel pallore è la necrosi coagulativa vista a occhio nudo, lo stesso tipo di necrosi
    che le micrografie di questa scheda mostrano cellula per cellula. Accanto, una chiazza di sangue rosso scuro segna
    la lacerazione. Dopo la fissazione tutto il muscolo diventa grigio-bruno, ma l'infarto pallido e il sangue scuro
    della lacerazione restano ben distinguibili. Perché una rottura a circa una settimana? La parete morta è stata
    rammollita dalla reazione infiammatoria ma non è ancora rinforzata dalla cicatrice: in questa finestra,
    all'incirca dal 2° al 7° giorno, la rottura della parete libera è più frequente, e di solito uccide perché il
    sangue riempie il sacco pericardico e comprime il cuore (tamponamento cardiaco). Ricorda anche la trappola
    opposta: nelle prime 12 ore un infarto non si vede affatto a occhio nudo.
  en: >-
    A transverse slice through the ventricles with a myocardial infarct about one week old in the posterior wall of
    the left ventricle and a focal rupture; the same infarct photographed fresh (left) and after formalin fixation
    (right). In both photographs the thin-walled right ventricle is on the left and the posterior wall of the left
    ventricle is at the top. Start with the fresh slice and follow the left-ventricular wall around: living muscle is
    an even red-brown, while the infarcted segment is pale, tan-yellow and mottled. That pallor is coagulative
    necrosis seen with the naked eye, the same kind of necrosis that the micrographs of this card show cell by cell.
    Beside it, a dark-red patch of blood marks the tear. After fixation all the muscle turns gray-brown, yet the pale
    infarct and the dark blood of the tear still stand out. Why a tear at about one week? The dead wall has been
    softened by the inflammatory reaction but is not yet reinforced by scar: in this window, roughly days 2 to 7,
    free-wall rupture is most frequent, and it usually kills because blood fills the pericardial sac and compresses
    the heart (cardiac tamponade). Keep the opposite trap in mind too: in the first 12 hours an infarct cannot be seen
    with the naked eye at all.
alt:
  it: >-
    Due fotografie affiancate di una fetta trasversale di cuore. A sinistra, a fresco: muscolo rosso-bruno con
    un'area nocciola chiaro nella parete superiore del ventricolo sinistro e, accanto, una chiazza di sangue rosso
    scuro. A destra, dopo la fissazione: muscolo grigio-bruno con un'area giallastra chiara e strie rosso-violacee
    scure nella stessa parete superiore. Righelli in centimetri corrono lungo il bordo inferiore della foto di
    sinistra e lungo quello superiore della foto di destra.
  en: >-
    Two photographs side by side of a transverse slice of the heart. Left, fresh: red-brown muscle with a pale tan
    area in the upper wall of the left ventricle and, next to it, a dark-red patch of blood. Right, after fixation:
    gray-brown muscle with a pale yellowish area and dark purple-red streaks in the same upper wall. Centimeter rulers
    run along the bottom of the left photograph and the top of the right one.
