lookFor:
  it: "Cerca il nodulo centrale di cellule tumorali disposte in strutture simili a ghiandole, e confrontalo con il tessuto epatico rosa più chiaro che lo circonda."
  en: "Find the central nodule of tumor cells arranged in gland-like structures, and compare it with the paler pink liver tissue around it."
caption:
  it: >-
    Fegato, EE a basso ingrandimento, fotografato attraverso l'oculare (l'immagine è verticale e il campo è circolare).
    Parti dal tessuto rosa chiaro che occupa quasi tutto il campo. Al centro c'è un nodulo più scuro di cellule tumorali
    che formano strutture ghiandolari con spazi chiari al centro: è il deposito metastatico, un tessuto diverso da
    quello epatico intorno. Poi si passa all'ingrandimento maggiore per guardare le cellule.
  en: >-
    Liver, H&E at low power, photographed through the eyepiece (the image is vertical and the field is circular). Start
    from the pale pink tissue that fills most of the field. In the center a darker nodule of tumor cells forms
    gland-like structures with clear spaces in the middle: this is the metastatic deposit, a tissue different from the
    liver around it. Then move to higher power to look at the cells.
alt:
  it: >-
    Campo circolare di un vetrino in ematossilina-eosina su sfondo scuro: tessuto rosa chiaro e, al centro, un nodulo
    più scuro e compatto di cellule con spazi vuoti simili a ghiandole.
  en: >-
    Circular field of an H&E slide on a dark background: pale pink tissue and, in the center, a darker, compact nodule
    of cells with gland-like empty spaces.
