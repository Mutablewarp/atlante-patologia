caption:
  it: "Amiloidosi cardiaca (autopsia), rosso Congo, forte ingrandimento: l'amiloide è il materiale extracellulare rosa-arancio e slavato tra i miociti, che hanno nuclei blu e granuli giallo-bruni di lipofuscina."
  en: "Cardiac amyloidosis (autopsy), Congo red, high power: amyloid is the washed-out pink-orange extracellular material between myocytes, which have blue nuclei and yellow-brown lipofuscin granules."
alt:
  it: "Micrografia di miocardio con rosso Congo: fibre muscolari pallide con nuclei blu e granuli giallo-bruni, e a destra ampie aree rosa-arancio di amiloide nell'interstizio."
  en: "Micrograph of myocardium with Congo red: pale muscle fibers with blue nuclei and yellow-brown granules, and on the right broad pink-orange areas of amyloid in the interstitium."
