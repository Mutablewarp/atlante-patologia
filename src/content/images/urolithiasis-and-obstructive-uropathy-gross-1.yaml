lookFor:
  it: >-
    Guarda prima lo spessore del parenchima, poi il calibro delle cavità e infine cerca i calcoli nelle cavità.
  en: >-
    Look first at the thickness of the parenchyma, then at the size of the cavities, and last look for stones inside
    the cavities.
caption:
  it: >-
    Rene in formalina, sezione di taglio. Parti dall'aspetto d'insieme: il rene è trasformato in una serie di ampie
    cavità a pareti sottili, separate da setti, e il parenchima è ridotto a un guscio sottile. Le cavità sono la pelvi e
    i calici dilatati: è l'idronefrosi. Cerca poi i calcoli, piccoli frammenti giallo-brunastri all'interno di alcune
    cavità, in alto e a sinistra: sono la causa ostruttiva che spiega la dilatazione a monte. Il numero scritto sul
    barattolo è l'inventario del pezzo.
  en: >-
    Formalin-fixed kidney, cut surface. Start with the overall look: the kidney has become a series of wide,
    thin-walled cavities divided by septa, and the parenchyma is reduced to a thin shell. The cavities are the dilated
    pelvis and calyces: this is hydronephrosis. Then look for the stones, small yellow-brown fragments inside some of
    the cavities, at the upper edge and on the left: they are the obstructing cause that explains the dilation upstream.
    The number written on the jar is the specimen inventory number.
alt:
  it: >-
    Fotografia di un rene sezionato in un barattolo di vetro: al posto del parenchima si vedono molte ampie cavità dalle
    pareti sottili e chiare, divise da setti; in alcune cavità ci sono piccoli calcoli giallo-bruni. Sul vetro è scritto
    il numero 1083.
  en: >-
    Photograph of a cut kidney in a glass jar: in place of the parenchyma there are many wide cavities with thin, pale
    walls, divided by septa; a few cavities hold small yellow-brown stones. The number 1083 is written on the glass.
