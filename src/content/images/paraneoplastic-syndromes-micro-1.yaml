lookFor:
  it: "Cerca gruppi di cellule piccole, scure e fitte, con pochissimo citoplasma, su uno sfondo chiaro."
  en: "Look for crowded clusters of small, dark cells with very little cytoplasm on a pale background."
caption:
  it: >-
    Agoaspirato di un carcinoma polmonare a piccole cellule, in una sede pleurica, a basso ingrandimento. Guarda i
    gruppi di cellule piccole e scure, addossate le une alle altre, con pochissimo citoplasma e nuclei che sembrano
    quasi nudi. È il tumore polmonare che più spesso produce ACTH ectopico: il quadro endocrino a distanza (sindrome di
    Cushing) nasce da queste cellule, senza che il tumore debba aver invaso un organo endocrino.
  en: >-
    Fine-needle aspirate of small cell lung carcinoma from a pleural site, low power. Look at the clusters of small,
    dark cells packed against one another, with very little cytoplasm and nuclei that look almost bare. It is the lung
    tumor that most often makes ectopic ACTH: the remote endocrine picture (Cushing syndrome) arises from these cells,
    without the tumor having to invade an endocrine organ.
alt:
  it: >-
    Striscio citologico in blu-violetto: molti ammassi di piccole cellule scure, fitte e sovrapposte, con pochi elementi
    isolati e sottili filamenti chiari sullo sfondo.
  en: >-
    Blue-violet cytology smear: many clumps of small, dark, crowded and overlapping cells, with a few single cells and
    thin pale strands in the background.
