lookFor:
  it: "Cerca nel citoplasma degli epatociti i globuli rosso-violacei di dimensioni diverse, ancora colorati dopo la digestione con diastasi."
  en: "Look in the hepatocyte cytoplasm for red-purple globules of different sizes that stay stained after diastase digestion."
caption:
  it: >-
    Biopsia epatica con deficit di α1-antitripsina, PAS dopo diastasi, a forte ingrandimento. Guarda il citoplasma di
    molti epatociti: è pieno di globuli rosso-violacei rotondi, di dimensioni diverse. La digestione con diastasi ha
    tolto il glicogeno, quindi ciò che resta colorato è proteina accumulata. In basso a sinistra il connettivo di uno
    spazio portale contiene piccole cellule infiammatorie.
  en: >-
    Liver biopsy with α1-antitrypsin deficiency, PAS after diastase, high power. Look at the cytoplasm of many
    hepatocytes: it is packed with round red-purple globules of different sizes. Diastase digestion has removed the
    glycogen, so what stays stained is accumulated protein. At the lower left, the connective tissue of a portal tract
    holds small inflammatory cells.
alt:
  it: >-
    Micrografia di fegato con colorazione PAS dopo diastasi: epatociti grandi con nuclei bluastri e citoplasma pieno di
    granuli e globuli rosso-violacei; in basso a sinistra una fascia di connettivo con piccole cellule scure.
  en: >-
    PAS-diastase micrograph of liver: large hepatocytes with bluish nuclei and cytoplasm full of red-purple granules
    and globules; at the lower left a band of connective tissue with small dark cells.
