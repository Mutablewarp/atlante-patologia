lookFor:
  it: "Segui i sottili setti alveolari e osserva che gli spazi tra di essi sono pieni di cellule, non d'aria."
  en: "Follow the thin alveolar septa and note that the spaces between them are filled with cells, not air."
caption:
  it: >-
    Polmonite lobare, EE a medio ingrandimento. Segui prima i setti alveolari, sottili e congesti, con capillari
    pieni di sangue. Osserva poi che gli alveoli non contengono aria: sono occupati da una moltitudine di neutrofili
    con poco essudato fibrinoso. È l'essudato alveolare che consolida il lobo.
  en: >-
    Lobar pneumonia, H&E at medium power. Follow the alveolar septa first, thin and congested, with blood-filled
    capillaries. Then note that the alveoli contain no air: they are packed with neutrophils and a little fibrinous
    exudate. This alveolar exudate is what consolidates the lobe.
alt:
  it: >-
    Micrografia in ematossilina-eosina di polmone: sottili setti rosa con capillari rossi delimitano alveoli
    riempiti da fitte cellule con nuclei violacei.
  en: >-
    H&E micrograph of lung: thin pink septa with red capillaries outline alveoli filled with dense cells that have
    purple nuclei.
