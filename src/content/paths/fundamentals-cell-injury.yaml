id: fundamentals-cell-injury
kind: vertical
title:
  it: "Fondamenti: danno, adattamento e morte cellulare"
  en: "Fundamentals: cell injury, adaptation and death"
description:
  it: "Tutto il modulo di patologia cellulare in ordine didattico: meccanismi del danno e alterazioni reversibili, controllo di qualità delle proteine e accumuli, adattamenti, tipi di necrosi e morte cellulare regolata, calcificazioni patologiche."
  en: "The whole cell pathology module in teaching order: mechanisms of injury and reversible change, protein quality control and accumulations, adaptations, types of necrosis and regulated cell death, and pathologic calcification."
