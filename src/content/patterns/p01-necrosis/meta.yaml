id: p01-necrosis
names:
  it: "Tipi di necrosi"
  en: "Types of necrosis"
summary:
  it: "Confronto fra necrosi coagulativa, colliquativa, caseosa, adiposa (steatonecrosi), fibrinoide e gangrena: organi e contesti tipici, meccanismo, aspetto macroscopico e microscopico, evoluzione."
  en: "Side-by-side comparison of coagulative, liquefactive, caseous, fat and fibrinoid necrosis and gangrene: typical organs and settings, mechanism, gross and microscopic appearance, outcome."
process: necrosis
matrix:
  columns:
    - it: "Tipo di necrosi"
      en: "Type of necrosis"
    - it: "Organi e contesti tipici"
      en: "Typical organs and settings"
    - it: "Meccanismo"
      en: "Mechanism"
    - it: "Aspetto macroscopico"
      en: "Gross appearance"
    - it: "Aspetto microscopico"
      en: "Microscopic appearance"
    - it: "Evoluzione tipica"
      en: "Typical outcome"
  rows:
    - entity: coagulative-necrosis
      cells:
        - it: "Infarti di cuore, rene e milza<!--c:p01-necrosis-c012-->; necrosi corticale renale nello shock; necrosi papillare da analgesici<!--c:p01-necrosis-c014-->; gangrena secca degli arti<!--c:p01-necrosis-c003-->"
          en: "Infarcts of heart, kidney and spleen<!--c:p01-necrosis-c012-->; renal cortical necrosis in shock; papillary necrosis from analgesics<!--c:p01-necrosis-c014-->; dry gangrene of a limb<!--c:p01-necrosis-c003-->"
        - it: "Ischemia da occlusione di un'arteria terminale (e altri danni)<!--c:p01-necrosis-c011--><!--c:p01-necrosis-c015-->; per un certo tempo le cellule morte non vengono digerite<!--c:p01-necrosis-c005-->"
          en: "Ischemia from end-artery occlusion (and other injuries)<!--c:p01-necrosis-c011--><!--c:p01-necrosis-c015-->; for a while the dead cells are not digested<!--c:p01-necrosis-c005-->"
        - it: "Area giallastra ben delimitata, con un orlo rosso scuro<!--c:p01-necrosis-c059-->; cuneiforme sotto la capsula nella milza<!--c:p01-necrosis-c012-->"
          en: "Yellowish, well-demarcated zone with a dark-red rim<!--c:p01-necrosis-c059-->; wedge-shaped under the capsule in the spleen<!--c:p01-necrosis-c012-->"
        - it: "Cellule fantasma: profili e architettura conservati, citoplasma intensamente eosinofilo<!--c:p01-necrosis-c005--><!--c:p01-necrosis-c038-->, picnosi, carioressi, cariolisi<!--c:p01-necrosis-c040-->"
          en: "Ghost cells: outlines and architecture preserved, deeply eosinophilic cytoplasm<!--c:p01-necrosis-c005--><!--c:p01-necrosis-c038-->, pyknosis, karyorrhexis, karyolysis<!--c:p01-necrosis-c040-->"
        - it: "Neutrofili e poi macrofagi dal margine vitale, tessuto di granulazione, cicatrice<!--c:p01-necrosis-c042-->; possibile calcificazione distrofica<!--c:p01-necrosis-c049-->"
          en: "Neutrophils then macrophages from the living edge, granulation tissue, scar<!--c:p01-necrosis-c042-->; may undergo dystrophic calcification<!--c:p01-necrosis-c049-->"
    - entity: liquefactive-necrosis
      cells:
        - it: "Ascessi batterici in qualunque organo solido<!--c:p01-necrosis-c016-->; infarto e ascesso cerebrale<!--c:p01-necrosis-c018--><!--c:p01-necrosis-c017-->; globi pallidi nell'intossicazione da monossido di carbonio<!--c:p01-necrosis-c019-->"
          en: "Bacterial abscesses in any solid organ<!--c:p01-necrosis-c016-->; brain infarct and brain abscess<!--c:p01-necrosis-c018--><!--c:p01-necrosis-c017-->; globus pallidus in carbon monoxide poisoning<!--c:p01-necrosis-c019-->"
        - it: "La digestione supera la riparazione: idrolasi dei neutrofili<!--c:p01-necrosis-c006--> o, dopo un infarto cerebrale, forse enzimi propri del tessuto nervoso<!--c:p01-necrosis-c007-->"
          en: "Digestion outpaces repair: neutrophil hydrolases<!--c:p01-necrosis-c006--> or, after a brain infarct, perhaps the nervous tissue's own enzymes<!--c:p01-necrosis-c007-->"
        - it: "Cavità con pus o liquido<!--c:p01-necrosis-c016-->; nel cervello cisti dopo l'infarto<!--c:p01-necrosis-c018-->"
          en: "Cavity filled with pus or fluid<!--c:p01-necrosis-c016-->; a cyst in the brain after infarction<!--c:p01-necrosis-c018-->"
        - it: "Cavità con neutrofili e detriti informi, senza profili cellulari<!--c:p01-necrosis-c038-->; poi parete di granulazione e fibrosi (gliosi nel cervello)<!--c:p01-necrosis-c043--><!--c:p01-necrosis-c017-->"
          en: "A cavity of neutrophils and shapeless debris, with no cell outlines<!--c:p01-necrosis-c038-->; later a wall of granulation tissue and fibrosis (gliosis in the brain)<!--c:p01-necrosis-c043--><!--c:p01-necrosis-c017-->"
        - it: "Ascesso circoscritto da capsula fibrosa; nel cervello può restare una cisti permanente<!--c:p01-necrosis-c043-->; l'ascesso cerebrale non trattato può causare erniazione<!--c:p01-necrosis-c044-->"
          en: "Abscess walled off by a fibrous capsule; a permanent cyst may remain in the brain<!--c:p01-necrosis-c043-->; an untreated brain abscess can cause herniation<!--c:p01-necrosis-c044-->"
    - entity: caseous-necrosis
      cells:
        - it: "Tubercolosi: focolaio e complesso di Ghon, caverne apicali, tubercolomi<!--c:p01-necrosis-c023-->; più raramente altre condizioni<!--c:p01-necrosis-c021-->"
          en: "Tuberculosis: Ghon focus and complex, apical cavities, tuberculomas<!--c:p01-necrosis-c023-->; less often other conditions<!--c:p01-necrosis-c021-->"
        - it: "Ipersensibilità mediata da linfociti T contro i micobatteri<!--c:p01-necrosis-c060-->; implicati i lipidi cerosi della parete batterica<!--c:p01-necrosis-c009-->"
          en: "T-cell–mediated hypersensitivity to mycobacteria<!--c:p01-necrosis-c060-->; the waxy lipids of the bacterial wall are implicated<!--c:p01-necrosis-c009-->"
        - it: "Materiale grigio-biancastro, molle e friabile, che ricorda il formaggio<!--c:p01-necrosis-c061-->"
          en: "Soft, crumbly, whitish-grey material that looks like cheese<!--c:p01-necrosis-c061-->"
        - it: "Detriti rosa, granulosi e senza struttura, privi di profili cellulari<!--c:p01-necrosis-c038-->, al centro di un granuloma (macrofagi epitelioidi, cellule giganti di Langhans, linfociti)<!--c:p01-necrosis-c022-->"
          en: "Structureless, granular pink debris with no cell outlines<!--c:p01-necrosis-c038-->, in the centre of a granuloma (epithelioid macrophages, Langhans giant cells, lymphocytes)<!--c:p01-necrosis-c022-->"
        - it: "Persiste a lungo<!--c:p01-necrosis-c009-->; guarisce con fibrosi e calcificazione oppure si estende, escava caverne e si diffonde<!--c:p01-necrosis-c045-->"
          en: "Persists<!--c:p01-necrosis-c009-->; heals by scarring and calcification, or enlarges, cavitates and spreads<!--c:p01-necrosis-c045-->"
    - entity: fat-necrosis
      cells:
        - it: "Grasso peripancreatico e mesenterico nella pancreatite acuta<!--c:p01-necrosis-c026-->; mammella dopo un trauma<!--c:p01-necrosis-c027-->; attorno a protesi in silicone rotte<!--c:p01-necrosis-c028-->"
          en: "Peripancreatic and mesenteric fat in acute pancreatitis<!--c:p01-necrosis-c026-->; breast after trauma<!--c:p01-necrosis-c027-->; around a ruptured silicone implant<!--c:p01-necrosis-c028-->"
        - it: "Le lipasi liberate scindono i trigliceridi; gli acidi grassi legano il calcio e formano saponi (saponificazione)<!--c:p01-necrosis-c008-->"
          en: "Released lipases split triglycerides; fatty acids bind calcium and form soaps (saponification)<!--c:p01-necrosis-c008-->"
        - it: "Focolai gessosi, bianco-giallastri, nel tessuto adiposo<!--c:p01-necrosis-c026-->"
          en: "Chalky yellow-white foci in the fat<!--c:p01-necrosis-c026-->"
        - it: "Profili fantasma di adipociti orlati da saponi di calcio bluastri e informi<!--c:p01-necrosis-c039-->; infiammazione<!--c:p01-necrosis-c001-->, macrofagi schiumosi, cellule giganti<!--c:p01-necrosis-c041-->"
          en: "Ghost outlines of fat cells edged by bluish, shapeless calcium soaps<!--c:p01-necrosis-c039-->; inflammation<!--c:p01-necrosis-c001-->, foamy macrophages, giant cells<!--c:p01-necrosis-c041-->"
        - it: "Fibrosi e calcificazione distrofica; nodulo mammario che simula un carcinoma<!--c:p01-necrosis-c027-->; ipocalcemia nella pancreatite acuta<!--c:p01-necrosis-c046-->"
          en: "Fibrosis and dystrophic calcification; breast lump mimicking carcinoma<!--c:p01-necrosis-c027-->; low blood calcium in acute pancreatitis<!--c:p01-necrosis-c046-->"
    - entity: fibrinoid-necrosis
      cells:
        - it: "Pareti vasali: vasculiti da immunocomplessi e altre (poliarterite nodosa, granulomatosi eosinofila con poliangioite, vasculite cutanea)<!--c:p01-necrosis-c030-->, arteriole nell'ipertensione maligna<!--c:p01-necrosis-c031-->, rigetto anticorpo-mediato<!--c:p01-necrosis-c032-->"
          en: "Vessel walls: immune-complex and other vasculitides (polyarteritis nodosa, eosinophilic granulomatosis with polyangiitis, cutaneous vasculitis)<!--c:p01-necrosis-c030-->, arterioles in malignant hypertension<!--c:p01-necrosis-c031-->, antibody-mediated rejection<!--c:p01-necrosis-c032-->"
        - it: "Le proteine plasmatiche, fra cui la fibrina, penetrano in una parete vasale danneggiata<!--c:p01-necrosis-c010-->"
          en: "Plasma proteins, fibrin among them, leak into an injured vessel wall<!--c:p01-necrosis-c010-->"
        - it: "Si riconosce dagli effetti: porpora palpabile nella vasculite cutanea<!--c:p01-necrosis-c062-->; rene screziato di rosso e di giallo al taglio, con qualche piccolo infarto, nell'ipertensione maligna<!--c:p01-necrosis-c063-->"
          en: "Seen through its effects: palpable purpura in skin vasculitis<!--c:p01-necrosis-c062-->; a blotchy red-and-yellow cut kidney with a few small infarcts in malignant hypertension<!--c:p01-necrosis-c063-->"
        - it: "Tratto di parete trasformato in una banda rosa acceso, uniforme e dai margini netti<!--c:p01-necrosis-c039-->, spesso con infiammazione e trombosi<!--c:p01-necrosis-c030--><!--c:p01-necrosis-c047-->"
          en: "Segment of wall turned into a bright pink, uniform band with crisp edges<!--c:p01-necrosis-c039-->, often with inflammation and thrombosis<!--c:p01-necrosis-c030--><!--c:p01-necrosis-c047-->"
        - it: "Trombosi, rottura della parete con emorragia, aneurismi; piccoli infarti a valle<!--c:p01-necrosis-c047-->"
          en: "Thrombosis, wall rupture with hemorrhage, aneurysms; small infarcts downstream<!--c:p01-necrosis-c047-->"
    - entity: gangrene
      cells:
        - it: "Dita, piede e gamba (aterosclerosi, diabete)<!--c:p01-necrosis-c033-->; estremità distali nella sepsi meningococcica (porpora fulminante) o nella vasculite grave; intestino<!--c:p01-necrosis-c037-->; ferite contaminate (gangrena gassosa)<!--c:p01-necrosis-c036-->"
          en: "Toes, foot and leg (atherosclerosis, diabetes)<!--c:p01-necrosis-c033-->; distal limbs in meningococcal sepsis (purpura fulminans) or severe vasculitis; bowel<!--c:p01-necrosis-c037-->; contaminated wounds (gas gangrene)<!--c:p01-necrosis-c036-->"
        - it: "Necrosi ischemica di una grande massa di tessuto (secca)<!--c:p01-necrosis-c003-->, con sovrapposizione batterica (umida)<!--c:p01-necrosis-c035--> o da tossina clostridica (gassosa)<!--c:p01-necrosis-c036-->"
          en: "Ischemic necrosis of a large tissue mass (dry)<!--c:p01-necrosis-c003-->, with superimposed infection (wet)<!--c:p01-necrosis-c035--> or from clostridial toxin (gas)<!--c:p01-necrosis-c036-->"
        - it: "Secca: tessuto secco, raggrinzito, scuro fino al nero (mummificato), con una netta linea di demarcazione<!--c:p01-necrosis-c056-->; si classifica come grande infarto pallido (anemico)<!--c:p01-necrosis-c003-->. Gassosa: cute tesa e scura sopra tessuti edematosi con gas<!--c:p01-necrosis-c057-->"
          en: "Dry: dry, shrunken, dark to black (mummified) tissue with a sharp line of demarcation<!--c:p01-necrosis-c056-->; classed as a large pale (anemic) infarct<!--c:p01-necrosis-c003-->. Gas: tense, darkened skin over swollen, gas-filled tissue<!--c:p01-necrosis-c057-->"
        - it: "Soprattutto necrosi coagulativa<!--c:p01-necrosis-c003-->; colliquazione con neutrofili se infetta<!--c:p01-necrosis-c035-->; nella forma gassosa necrosi estesa con pochi neutrofili e bacilli Gram-positivi<!--c:p01-necrosis-c058-->"
          en: "Mostly coagulative necrosis<!--c:p01-necrosis-c003-->; liquefaction with neutrophils if infected<!--c:p01-necrosis-c035-->; in gas gangrene extensive necrosis with few neutrophils and Gram-positive rods<!--c:p01-necrosis-c058-->"
        - it: "Sbrigliamento chirurgico o amputazione; la gangrena gassosa può dare emolisi, shock e insufficienza renale<!--c:p01-necrosis-c048-->"
          en: "Debridement or amputation; gas gangrene can cause hemolysis, shock and renal failure<!--c:p01-necrosis-c048-->"
