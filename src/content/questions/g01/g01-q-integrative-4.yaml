id: g01-q-integrative-4
module: g01
entities: [necroptosis, apoptosis, pyroptosis, other-regulated-cell-death]
kind: mcq
difficulty: 3
tags: [integrative, necroptosis, apoptosis, pyroptosis]
stem:
  it: "Un virus codifica una proteina che inibisce la caspasi-8 e le caspasi effettrici. In coltura, le cellule epiteliali infettate ed esposte a TNF-α muoiono comunque: si rigonfiano, la membrana plasmatica si rompe e il nucleo diventa picnotico. Nei tessuti di animali infettati i focolai di cellule morte sono circondati da un infiltrato infiammatorio. Le cellule prive di RIP3 sopravvivono nelle stesse condizioni. Quale via di morte spiega meglio questi risultati?"
  en: "A virus encodes a protein that inhibits caspase-8 and the executioner caspases. In culture, infected epithelial cells exposed to TNF-α still die: they swell, their plasma membrane ruptures and their nucleus becomes pyknotic. In tissues of infected animals the foci of dead cells are surrounded by an inflammatory infiltrate. Cells lacking RIP3 survive under the same conditions. Which death pathway best explains these results?"
options:
  - id: a
    text:
      it: "Apoptosi estrinseca: TNFR1 forma il complesso di segnalazione e attiva la caspasi-8, che a sua volta attiva la caspasi-3."
      en: "Extrinsic apoptosis: TNFR1 forms the signaling complex and activates caspase-8, which in turn activates caspase-3."
    correct: false
    why:
      it: "Errata. Questa via è bloccata dall'inibitore virale delle caspasi. Inoltre l'apoptosi mantiene integra la membrana, frammenta la cellula in corpi apoptotici e non provoca infiammazione."
      en: "Incorrect. This route is blocked by the viral caspase inhibitor. Apoptosis also keeps the membrane intact, breaks the cell into apoptotic bodies and provokes no inflammation."
  - id: b
    text:
      it: "Necroptosi: TNFR1 recluta TRADD, RIP1 e RIP3 formano il necrosoma, che attiva MLKL; MLKL si inserisce nelle membrane e ne compromette l'integrità."
      en: "Necroptosis: TNFR1 recruits TRADD, RIP1 and RIP3 form the necrosome, which activates MLKL; MLKL inserts into membranes and breaks their integrity."
    correct: true
    why:
      it: "Corretta. Di norma la caspasi-8 taglia RIP1 e impedisce la formazione del necrosoma; se le caspasi sono inibite, come da molti virus, la cellula infettata può ancora uccidersi per una via indipendente dalle caspasi. La morfologia è quella della necrosi (rigonfiamento, rottura della membrana, picnosi) e i DAMP rilasciati richiamano infiammazione. La dipendenza da RIP3 la distingue dalla necrosi accidentale."
      en: "Correct. Normally caspase-8 cleaves RIP1 and prevents the necrosome from forming; when caspases are inhibited, as many viruses do, the infected cell can still kill itself by a caspase-independent route. The morphology is that of necrosis (swelling, membrane rupture, pyknosis), and the released DAMPs draw inflammation. Its dependence on RIP3 sets it apart from accidental necrosis."
  - id: c
    text:
      it: "Piroptosi: un recettore NOD-like citosolico assembla l'inflammasoma, la caspasi-1 taglia la gasdermina D e la cellula scoppia."
      en: "Pyroptosis: a cytosolic NOD-like receptor assembles the inflammasome, caspase-1 cleaves gasdermin D and the cell bursts."
    correct: false
    why:
      it: "Errata. Anche la piroptosi è litica e infiammatoria, ma dipende dalla caspasi-1 prodotta dall'inflammasoma, non da RIP3. Qui la morte è innescata da un recettore della superfamiglia del TNF e viene abolita dalla perdita di RIP3."
      en: "Incorrect. Pyroptosis is also lytic and inflammatory, but it depends on caspase-1 generated by the inflammasome, not on RIP3. Here death is started by a TNF-superfamily receptor and is abolished by loss of RIP3."
  - id: d
    text:
      it: "Necrosi accidentale da deplezione di ATP, non regolata da alcun programma genetico."
      en: "Accidental necrosis from ATP depletion, not governed by any genetic program."
    correct: false
    why:
      it: "Errata. Necroptosi e necrosi classica hanno lo stesso aspetto al microscopio, ma differiscono nel meccanismo. Il fatto che l'eliminazione di un solo gene (RIP3) salvi le cellule dimostra una morte segnalata e regolata, non un danno accidentale."
      en: "Incorrect. Necroptosis and classical necrosis look the same under the microscope but differ in mechanism. The fact that removing a single gene (RIP3) rescues the cells proves a signaled, regulated death, not accidental injury."
  - id: e
    text:
      it: "Apoptosi intrinseca: Bax e Bak permeabilizzano la membrana mitocondriale esterna e il citocromo c attiva la caspasi-9 nell'apoptosoma."
      en: "Intrinsic apoptosis: Bax and Bak permeabilize the outer mitochondrial membrane and cytochrome c activates caspase-9 in the apoptosome."
    correct: false
    why:
      it: "Errata. Anche questa via converge sulle caspasi effettrici, inibite dal virus, e produce cellule raggrinzite con membrana integra senza infiammazione. Non spiega rigonfiamento, rottura della membrana e dipendenza da RIP3."
      en: "Incorrect. This route also converges on the executioner caspases, which the virus inhibits, and produces shrunken cells with an intact membrane and no inflammation. It does not explain swelling, membrane rupture and dependence on RIP3."
