difficulty: 2
tags: [integrative, atrophy, pigment-accumulation, autophagy]
stem:
  it: "Una donna di 84 anni muore dopo molti mesi di grave calo ponderale dovuto a un carcinoma gastrico avanzato. All'autopsia il cuore è piccolo e il miocardio ha un colore bruno scuro. Al microscopio i miociti sono più sottili del normale e contengono fini granuli citoplasmatici giallo-bruni; la colorazione di Perls (blu di Prussia) è negativa. Quale affermazione spiega meglio sia le dimensioni dei miociti sia il pigmento?"
  en: "An 84-year-old woman dies after many months of severe weight loss caused by advanced gastric carcinoma. At autopsy the heart is small and the myocardium is dark brown. Microscopically the myocytes are thinner than normal and contain fine golden-brown cytoplasmic granules; the Perls (Prussian blue) stain is negative. Which statement best explains both the size of the myocytes and the pigment?"
options:
  - id: a
    text:
      it: "La degradazione proteica supera la sintesi, attraverso il sistema ubiquitina-proteasoma e un'autofagia aumentata; il pigmento è lipofuscina, un residuo di lipidi perossidati e proteine ossidate che i lisosomi non riescono a digerire."
      en: "Protein breakdown exceeds synthesis, through the ubiquitin-proteasome system and increased autophagy; the pigment is lipofuscin, a residue of peroxidized lipids and oxidized proteins that lysosomes cannot digest."
    correct: true
    why:
      it: "Corretta. Nell'atrofia più proteine vengono ubiquitinate e degradate dal proteasoma e l'autofagia aumenta, per cui i miociti, cellule postmitotiche, si rimpiccioliscono. La lipofuscina si accumula con l'età nelle cellule postmitotiche, non viene smaltita dall'autofagia e risalta di più quando l'organo è atrofico, come negli stati di grave deperimento."
      en: "Correct. In atrophy more proteins are ubiquitinated and degraded by the proteasome and autophagy increases, so the postmitotic myocytes shrink. Lipofuscin builds up with age in postmitotic cells, is not cleared by autophagy and stands out more when the organ is atrophic, as in severe wasting."
  - id: b
    text:
      it: "Il pigmento è emosiderina da sovraccarico di ferro: le specie reattive dell'ossigeno generate dal ferro hanno danneggiato e ridotto le dimensioni dei miociti."
      en: "The pigment is hemosiderin from iron overload: reactive oxygen species generated by iron have damaged the myocytes and made them smaller."
    correct: false
    why:
      it: "Errata. L'emosiderina è anch'essa giallo-bruna, ma la colorazione di Perls ne colora il ferro in blu; un Perls negativo la esclude."
      en: "Incorrect. Hemosiderin is also yellow-brown, but the Perls stain colors its iron blue; a negative Perls stain excludes it."
  - id: c
    text:
      it: "Il cuore è piccolo perché i miociti sono stati eliminati per apoptosi; il pigmento è melanina liberata dalle cellule morte."
      en: "The heart is small because myocytes have been eliminated by apoptosis; the pigment is melanin released by the dead cells."
    correct: false
    why:
      it: "Errata. I miociti sono più piccoli, non meno numerosi: una perdita di cellule renderebbe l'organo piccolo con cellule di dimensioni normali. La melanina è prodotta dai melanociti, non dai miociti."
      en: "Incorrect. The myocytes are smaller, not fewer: cell loss would make the organ small with normal-sized cells. Melanin is made by melanocytes, not by myocytes."
  - id: d
    text:
      it: "Per risparmiare energia l'autofagia si spegne, e gli organelli non rimossi si accumulano come pigmento bruno."
      en: "To save energy autophagy shuts down, and the organelles that are not removed accumulate as brown pigment."
    correct: false
    why:
      it: "Errata. Nell'atrofia l'autofagia aumenta, ed è una delle vie con cui la cellula riduce il proprio contenuto. La lipofuscina si accumula perché il materiale ossidato e legato in modo crociato resiste alla digestione lisosomiale, non perché l'autofagia si sia fermata."
      en: "Incorrect. In atrophy autophagy increases and is one of the routes by which the cell reduces its own content. Lipofuscin accumulates because oxidized, cross-linked material resists lysosomal digestion, not because autophagy has stopped."
  - id: e
    text:
      it: "I miociti si sono rimpiccioliti per un rigonfiamento idropico seguito da perdita di acqua; il pigmento è bilirubina."
      en: "The myocytes have shrunk through hydropic swelling followed by water loss; the pigment is bilirubin."
    correct: false
    why:
      it: "Errata. Il rigonfiamento idropico è un aumento acuto e reversibile di volume e non porta a un rimpicciolimento cronico. La bilirubina si accumula nel fegato e nei tessuti in caso di ittero, non come granuli citoplasmatici nei miociti di un cuore atrofico."
      en: "Incorrect. Hydropic swelling is an acute, reversible increase in volume and does not lead to chronic shrinkage. Bilirubin accumulates in the liver and in tissues in jaundice, not as cytoplasmic granules in the myocytes of an atrophic heart."
