<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" viewBox="0 0 400 624" width="400" height="624" role="img" aria-labelledby="nva-title nva-desc">
  <title id="nva-title">Necrosi e apoptosi a confronto</title>
  <desc id="nva-desc">Confronto affiancato. Necrosi: gruppi di cellule, cellule rigonfie, picnosi, poi carioressi o cariolisi, membrana rotta con fuoriuscita del contenuto, infiammazione, causata dalla perdita di ATP e del controllo degli ioni, patologica. Apoptosi: singole cellule sparse, cellule raggrinzite, la cromatina si condensa e poi si frammenta, membrana integra con bolle e corpi apoptotici, nessuna infiammazione perché i fagociti eliminano i corpi, guidata da cascate regolate di caspasi, fisiologica o patologica.</desc>
  <defs>
    <marker id="nva-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#575061"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1c1923; }
    .h1 { font-size: 18px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13.5px; }
    .lab { font-size: 12px; fill: #575061; font-weight: 700; letter-spacing: 0.04em; }
    .hema { fill: #2a2070; }
    .eos { fill: #8a1f47; }
    .rule { stroke: #ddd3c1; stroke-width: 1.2; }
  </style>
  <rect x="1" y="1" width="398" height="622" rx="12" fill="#fffcf6" stroke="#ddd3c1" stroke-width="2"/>
  <text class="h1" x="200" y="32" text-anchor="middle">Necrosi e apoptosi</text>

  <rect x="14" y="46" width="182" height="32" rx="8" fill="#f8e2ea" stroke="#ad2c5b" stroke-width="1.5"/>
  <text class="h2 eos" x="105" y="67" text-anchor="middle">Necrosi</text>
  <rect x="204" y="46" width="182" height="32" rx="8" fill="#e5e0f6" stroke="#3a2e8c" stroke-width="1.5"/>
  <text class="h2 hema" x="295" y="67" text-anchor="middle">Apoptosi</text>

  <!-- Necrosis icon: swollen cell, broken membrane, leaking contents -->
  <circle cx="105" cy="136" r="38" fill="#f8e2ea" stroke="#ad2c5b" stroke-width="2.2" stroke-dasharray="200 39"/>
  <ellipse cx="86" cy="122" rx="9" ry="5" fill="#fbecc6" stroke="#857a6d" stroke-width="1"/>
  <ellipse cx="118" cy="154" rx="9" ry="5" fill="#fbecc6" stroke="#857a6d" stroke-width="1"/>
  <circle cx="102" cy="140" r="7" fill="#1c1923"/>
  <circle cx="150" cy="110" r="3" fill="#ad2c5b"/>
  <circle cx="160" cy="98" r="2.5" fill="#ad2c5b"/>
  <circle cx="146" cy="94" r="2.5" fill="#ad2c5b"/>
  <circle cx="166" cy="114" r="2" fill="#ad2c5b"/>

  <!-- Apoptosis icon: shrunken cell with blebs, then apoptotic bodies -->
  <ellipse cx="256" cy="134" rx="22" ry="19" fill="#e5e0f6" stroke="#3a2e8c" stroke-width="2"/>
  <circle cx="275" cy="120" r="5" fill="#e5e0f6" stroke="#3a2e8c" stroke-width="1.6"/>
  <circle cx="240" cy="150" r="4" fill="#e5e0f6" stroke="#3a2e8c" stroke-width="1.6"/>
  <circle cx="250" cy="130" r="3.2" fill="#1c1923"/>
  <circle cx="261" cy="137" r="3.6" fill="#1c1923"/>
  <circle cx="252" cy="142" r="2.6" fill="#1c1923"/>
  <line x1="284" y1="134" x2="306" y2="134" stroke="#575061" stroke-width="1.5" marker-end="url(#nva-arrow)"/>
  <circle cx="326" cy="118" r="10" fill="#e5e0f6" stroke="#3a2e8c" stroke-width="1.6"/>
  <circle cx="326" cy="118" r="3" fill="#1c1923"/>
  <circle cx="352" cy="138" r="9" fill="#e5e0f6" stroke="#3a2e8c" stroke-width="1.6"/>
  <circle cx="324" cy="152" r="8" fill="#e5e0f6" stroke="#3a2e8c" stroke-width="1.6"/>
  <circle cx="324" cy="152" r="2.6" fill="#1c1923"/>
  <text class="lab" x="337" y="180" text-anchor="middle" font-weight="400">corpi apoptotici</text>

  <!-- Rows -->
  <line class="rule" x1="14" y1="196" x2="386" y2="196"/>
  <text class="lab" x="200" y="214" text-anchor="middle">ESTENSIONE</text>
  <text class="b" x="105" y="234" text-anchor="middle">gruppi / aree di cellule</text>
  <text class="b" x="295" y="234" text-anchor="middle">singole cellule sparse</text>

  <line class="rule" x1="14" y1="244" x2="386" y2="244"/>
  <text class="lab" x="200" y="262" text-anchor="middle">CELLULA</text>
  <text class="b" x="105" y="282" text-anchor="middle">rigonfia</text>
  <text class="b" x="295" y="282" text-anchor="middle">raggrinzita</text>

  <line class="rule" x1="14" y1="292" x2="386" y2="292"/>
  <text class="lab" x="200" y="310" text-anchor="middle">NUCLEO</text>
  <text class="b" x="105" y="330" text-anchor="middle">picnosi, carioressi,</text>
  <text class="b" x="105" y="347" text-anchor="middle">cariolisi</text>
  <text class="b" x="295" y="330" text-anchor="middle">cromatina condensata,</text>
  <text class="b" x="295" y="347" text-anchor="middle">poi frammentata</text>

  <line class="rule" x1="14" y1="356" x2="386" y2="356"/>
  <text class="lab" x="200" y="374" text-anchor="middle">MEMBRANA PLASMATICA</text>
  <text class="b" x="105" y="394" text-anchor="middle">si rompe;</text>
  <text class="b" x="105" y="411" text-anchor="middle">il contenuto esce</text>
  <text class="b" x="295" y="394" text-anchor="middle">integra; bolle, poi</text>
  <text class="b" x="295" y="411" text-anchor="middle">corpi apoptotici</text>

  <line class="rule" x1="14" y1="420" x2="386" y2="420"/>
  <text class="lab" x="200" y="438" text-anchor="middle">INFIAMMAZIONE</text>
  <text class="b eos" x="105" y="458" text-anchor="middle" font-weight="700">sì</text>
  <text class="b hema" x="295" y="458" text-anchor="middle" font-weight="700">no</text>
  <text class="b" x="295" y="475" text-anchor="middle">corpi fagocitati</text>

  <line class="rule" x1="14" y1="484" x2="386" y2="484"/>
  <text class="lab" x="200" y="502" text-anchor="middle">MECCANISMO</text>
  <text class="b" x="105" y="522" text-anchor="middle">perdita di ATP e</text>
  <text class="b" x="105" y="539" text-anchor="middle">del controllo ionico</text>
  <text class="b" x="295" y="522" text-anchor="middle">cascate regolate</text>
  <text class="b" x="295" y="539" text-anchor="middle">di caspasi</text>

  <line class="rule" x1="14" y1="548" x2="386" y2="548"/>
  <text class="lab" x="200" y="566" text-anchor="middle">CONTESTO</text>
  <text class="b" x="105" y="586" text-anchor="middle">patologico</text>
  <text class="b" x="295" y="586" text-anchor="middle">fisiologico</text>
  <text class="b" x="295" y="603" text-anchor="middle">o patologico</text>
</svg>
