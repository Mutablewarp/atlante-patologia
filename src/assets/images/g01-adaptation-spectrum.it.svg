<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" viewBox="0 0 400 596" width="400" height="596" role="img" aria-labelledby="ada-title ada-desc">
  <title id="ada-title">Lo spettro degli adattamenti cellulari</title>
  <desc id="ada-desc">Una cellula normale sottoposta a uno stress o a richieste diverse può adattarsi in quattro modi. Atrofia: cellule più piccole, per minore uso, ossigeno, nutrienti od ormoni. Ipertrofia: cellule più grandi, per un maggior carico di lavoro od ormoni, come nel muscolo degli atleti. Iperplasia: più cellule per divisione, sotto la spinta di ormoni, di una maggiore richiesta o di un danno cronico. Metaplasia: un tipo cellulare maturo sostituito da un altro, come l’epitelio cilindrico dei bronchi che diventa squamoso nei fumatori. Se il danno persiste, l’epitelio metaplastico o un altro epitelio può diventare displastico: crescita e maturazione sono disordinate; la displasia può regredire o progredire verso il cancro. Gli adattamenti di solito regrediscono quando lo stimolo cessa.</desc>
  <defs>
    <marker id="ada-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#575061"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1c1923; }
    .h1 { font-size: 18px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 12.5px; fill: #575061; }
    .eos { fill: #8a1f47; }
    .box { fill: #fffcf6; stroke: #857a6d; stroke-width: 1.5; }
    .cell { fill: #f8e2ea; stroke: #ad2c5b; stroke-width: 1.4; }
    .nuc { fill: #3a2e8c; }
  </style>
  <rect x="1" y="1" width="398" height="594" rx="12" fill="#fffcf6" stroke="#ddd3c1" stroke-width="2"/>
  <text class="h1" x="200" y="30" text-anchor="middle">Adattamenti cellulari</text>

  <!-- Normal -->
  <rect x="120" y="46" width="160" height="56" rx="10" fill="#ede5d6" stroke="#857a6d" stroke-width="1.5"/>
  <rect class="cell" x="132" y="66" width="16" height="16" rx="2"/><circle class="nuc" cx="140" cy="74" r="3"/>
  <rect class="cell" x="150" y="66" width="16" height="16" rx="2"/><circle class="nuc" cx="158" cy="74" r="3"/>
  <rect class="cell" x="168" y="66" width="16" height="16" rx="2"/><circle class="nuc" cx="176" cy="74" r="3"/>
  <text class="h2" x="196" y="80">Normale</text>
  <text class="m" x="290" y="68">stress o</text>
  <text class="m" x="290" y="84">nuove richieste</text>

  <!-- Spine with branches -->
  <path d="M200 102 V112 H24 V392" fill="none" stroke="#575061" stroke-width="2"/>
  <line x1="24" y1="158" x2="38" y2="158" stroke="#575061" stroke-width="2" marker-end="url(#ada-arrow)"/>
  <line x1="24" y1="236" x2="38" y2="236" stroke="#575061" stroke-width="2" marker-end="url(#ada-arrow)"/>
  <line x1="24" y1="314" x2="38" y2="314" stroke="#575061" stroke-width="2" marker-end="url(#ada-arrow)"/>
  <line x1="24" y1="392" x2="38" y2="392" stroke="#575061" stroke-width="2" marker-end="url(#ada-arrow)"/>

  <!-- Atrophy -->
  <rect class="box" x="40" y="124" width="348" height="68" rx="10"/>
  <rect x="62" y="143" width="32" height="30" rx="3" fill="none" stroke="#857a6d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect class="cell" x="70" y="150" width="16" height="16" rx="2"/><circle class="nuc" cx="78" cy="158" r="3"/>
  <text class="h2" x="122" y="148">Atrofia</text>
  <text class="b" x="122" y="168">↓ volume cellulare</text>
  <text class="m" x="122" y="185">↓ uso, O₂, nutrienti od ormoni</text>

  <!-- Hypertrophy -->
  <rect class="box" x="40" y="202" width="348" height="68" rx="10"/>
  <rect class="cell" x="56" y="214" width="50" height="44" rx="4"/><circle class="nuc" cx="81" cy="236" r="6"/>
  <text class="h2" x="122" y="226">Ipertrofia</text>
  <text class="b" x="122" y="246">↑ volume cellulare</text>
  <text class="m" x="122" y="263">↑ carico di lavoro od ormoni (atleti)</text>

  <!-- Hyperplasia -->
  <rect class="box" x="40" y="280" width="348" height="68" rx="10"/>
  <rect class="cell" x="60" y="295" width="19" height="18" rx="2"/><circle class="nuc" cx="69.5" cy="304" r="3"/>
  <rect class="cell" x="81" y="295" width="19" height="18" rx="2"/><circle class="nuc" cx="90.5" cy="304" r="3"/>
  <rect class="cell" x="60" y="315" width="19" height="18" rx="2"/><circle class="nuc" cx="69.5" cy="324" r="3"/>
  <rect class="cell" x="81" y="315" width="19" height="18" rx="2"/><circle class="nuc" cx="90.5" cy="324" r="3"/>
  <text class="h2" x="122" y="304">Iperplasia</text>
  <text class="b" x="122" y="324">↑ numero di cellule (per divisione)</text>
  <text class="m" x="122" y="341">ormoni, ↑ richiesta, danno cronico</text>

  <!-- Metaplasia -->
  <rect class="box" x="40" y="358" width="348" height="68" rx="10"/>
  <rect class="cell" x="50" y="376" width="7" height="30" rx="1.5"/><circle class="nuc" cx="53.5" cy="400" r="2.2"/>
  <rect class="cell" x="58" y="376" width="7" height="30" rx="1.5"/><circle class="nuc" cx="61.5" cy="400" r="2.2"/>
  <rect class="cell" x="66" y="376" width="7" height="30" rx="1.5"/><circle class="nuc" cx="69.5" cy="400" r="2.2"/>
  <path d="M76 391 H84" stroke="#575061" stroke-width="1.4" marker-end="url(#ada-arrow)"/>
  <rect class="cell" x="88" y="379" width="24" height="7" rx="2"/><circle class="nuc" cx="100" cy="382.5" r="1.8"/>
  <rect class="cell" x="88" y="388" width="24" height="8" rx="2"/><circle class="nuc" cx="100" cy="392" r="2"/>
  <rect class="cell" x="88" y="398" width="24" height="9" rx="2"/><circle class="nuc" cx="100" cy="402.5" r="2.2"/>
  <text class="h2" x="122" y="382">Metaplasia</text>
  <text class="b" x="122" y="402">un tipo cellulare maturo → un altro</text>
  <text class="m" x="122" y="419">es. bronco del fumatore → squamoso</text>

  <!-- To dysplasia -->
  <line x1="214" y1="426" x2="214" y2="462" stroke="#ad2c5b" stroke-width="2" marker-end="url(#ada-arrow)"/>
  <text class="m eos" x="224" y="449">danno persistente</text>

  <!-- Dysplasia -->
  <rect x="40" y="464" width="348" height="74" rx="10" fill="#f8e2ea" stroke="#ad2c5b" stroke-width="1.5"/>
  <rect x="52" y="480" width="22" height="20" rx="3" fill="#fffcf6" stroke="#ad2c5b" stroke-width="1.4"/><circle cx="63" cy="490" r="6.5" fill="#1c1923"/>
  <rect x="76" y="477" width="17" height="26" rx="3" fill="#fffcf6" stroke="#ad2c5b" stroke-width="1.4"/><circle cx="84.5" cy="489" r="5" fill="#1c1923"/>
  <rect x="58" y="503" width="28" height="20" rx="3" fill="#fffcf6" stroke="#ad2c5b" stroke-width="1.4"/><circle cx="72" cy="513" r="7" fill="#1c1923"/>
  <rect x="88" y="506" width="18" height="18" rx="3" fill="#fffcf6" stroke="#ad2c5b" stroke-width="1.4"/><circle cx="97" cy="515" r="4" fill="#1c1923"/>
  <text class="h2 eos" x="122" y="488">Displasia</text>
  <text class="b" x="122" y="508">crescita e maturazione disordinate</text>
  <text class="m" x="122" y="526">può regredire o evolvere in cancro</text>

  <text class="m" x="200" y="570" text-anchor="middle">Gli adattamenti di solito regrediscono se lo stimolo cessa.</text>
</svg>
