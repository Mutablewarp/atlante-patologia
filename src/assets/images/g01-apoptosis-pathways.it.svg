<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" viewBox="0 0 400 650" width="400" height="650" role="img" aria-labelledby="apo-title apo-desc">
  <title id="apo-title">Vie estrinseca e intrinseca dell’apoptosi</title>
  <desc id="apo-desc">Due colonne che convergono. Via estrinseca: un ligando di morte (FasL, TNF, TRAIL) lega il suo recettore di morte (Fas, recettore del TNF); proteine adattatrici con domini di morte formano il DISC, che attiva la caspasi-8, iniziatrice. Via intrinseca: uno stress cellulare (danno al DNA tramite p53, specie reattive dell’ossigeno, calcio) aumenta le proteine BH3-only, che neutralizzano Bcl-2 e liberano Bax e Bak, i quali aprono pori nella membrana mitocondriale esterna; ne escono citocromo c e SMAC; il citocromo c con Apaf-1 forma l’apoptosoma, che attiva la caspasi-9. La caspasi-8 può anche tagliare Bid in tBid, che coinvolge la via mitocondriale. Entrambe le iniziatrici attivano le caspasi esecutrici 3, 6 e 7, che tagliano gli enzimi di riparazione del DNA, le lamine nucleari e le proteine del citoscheletro, e si formano corpi apoptotici che i fagociti rimuovono senza infiammazione. Freni: Bcl-2, Bcl-xL e Mcl-1 tengono inattivi Bax e Bak; le IAP inibiscono le caspasi e SMAC rimuove questo blocco.</desc>
  <defs>
    <marker id="apo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1c1923"/>
    </marker>
    <marker id="apo-arrow-eos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ad2c5b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1c1923; }
    .h1 { font-size: 18px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .bt { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 12.5px; fill: #575061; }
    .hema { fill: #2a2070; }
    .eos { fill: #8a1f47; }
    .cau { fill: #5a3c00; }
    .box { fill: #fffcf6; stroke: #3a2e8c; stroke-width: 1.5; }
    .ini { fill: #e5e0f6; stroke: #3a2e8c; stroke-width: 2; }
    .arr { stroke: #1c1923; stroke-width: 2; }
  </style>
  <rect x="1" y="1" width="398" height="648" rx="12" fill="#fffcf6" stroke="#ddd3c1" stroke-width="2"/>
  <text class="h1" x="200" y="30" text-anchor="middle">Apoptosi: due vie</text>

  <text class="h2 hema" x="97" y="58" text-anchor="middle">Estrinseca</text>
  <text class="m" x="97" y="75" text-anchor="middle">recettori di morte</text>
  <text class="h2 hema" x="303" y="58" text-anchor="middle">Intrinseca</text>
  <text class="m" x="303" y="75" text-anchor="middle">mitocondriale</text>

  <!-- Extrinsic column -->
  <rect class="box" x="12" y="88" width="170" height="44" rx="8"/>
  <text class="bt" x="97" y="106" text-anchor="middle">Ligando di morte</text>
  <text class="b" x="97" y="124" text-anchor="middle">FasL, TNF, TRAIL</text>
  <line class="arr" x1="97" y1="132" x2="97" y2="148" marker-end="url(#apo-arrow)"/>
  <rect class="box" x="12" y="150" width="170" height="44" rx="8"/>
  <text class="bt" x="97" y="168" text-anchor="middle">Recettore di morte</text>
  <text class="b" x="97" y="186" text-anchor="middle">Fas, recettore del TNF</text>
  <line class="arr" x1="97" y1="194" x2="97" y2="210" marker-end="url(#apo-arrow)"/>
  <rect class="box" x="12" y="212" width="170" height="44" rx="8"/>
  <text class="bt" x="97" y="230" text-anchor="middle">DISC</text>
  <text class="b" x="97" y="248" text-anchor="middle">adattatori, domini di morte</text>
  <line class="arr" x1="97" y1="256" x2="97" y2="272" marker-end="url(#apo-arrow)"/>
  <rect class="ini" x="12" y="274" width="170" height="44" rx="8"/>
  <text class="bt hema" x="97" y="292" text-anchor="middle">Caspasi-8</text>
  <text class="b" x="97" y="310" text-anchor="middle">iniziatrice</text>

  <!-- Intrinsic column -->
  <rect class="box" x="218" y="88" width="170" height="44" rx="8"/>
  <text class="bt" x="303" y="106" text-anchor="middle">Stress cellulare</text>
  <text class="b" x="303" y="124" text-anchor="middle">danno al DNA (p53), ROS</text>
  <line class="arr" x1="303" y1="132" x2="303" y2="148" marker-end="url(#apo-arrow)"/>
  <rect class="box" x="218" y="150" width="170" height="44" rx="8"/>
  <text class="bt" x="303" y="168" text-anchor="middle">↑ proteine BH3-only</text>
  <text class="b" x="303" y="186" text-anchor="middle">neutralizzano Bcl-2</text>
  <line class="arr" x1="303" y1="194" x2="303" y2="210" marker-end="url(#apo-arrow)"/>
  <rect class="box" x="218" y="212" width="170" height="44" rx="8"/>
  <text class="bt" x="303" y="230" text-anchor="middle">pori Bax / Bak</text>
  <text class="b" x="303" y="248" text-anchor="middle">escono cit. c e SMAC</text>
  <line class="arr" x1="303" y1="256" x2="303" y2="272" marker-end="url(#apo-arrow)"/>
  <rect class="ini" x="218" y="274" width="170" height="44" rx="8"/>
  <text class="bt hema" x="303" y="292" text-anchor="middle">Apoptosoma</text>
  <text class="b" x="303" y="310" text-anchor="middle">cit. c + Apaf-1 → casp-9</text>

  <!-- Crosstalk: caspase-8 cleaves Bid to tBid -->
  <path d="M182 290 L200 290 L200 234 L216 234" fill="none" stroke="#ad2c5b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#apo-arrow-eos)"/>
  <rect x="186" y="252" width="28" height="18" rx="3" fill="#fffcf6"/>
  <text class="m eos" x="200" y="265" text-anchor="middle" font-weight="700">tBid</text>

  <!-- Convergence -->
  <line class="arr" x1="97" y1="318" x2="150" y2="350" marker-end="url(#apo-arrow)"/>
  <line class="arr" x1="303" y1="318" x2="250" y2="350" marker-end="url(#apo-arrow)"/>
  <rect x="60" y="352" width="280" height="50" rx="10" fill="#f8e2ea" stroke="#ad2c5b" stroke-width="2"/>
  <text class="bt eos" x="200" y="373" text-anchor="middle">Caspasi esecutrici</text>
  <text class="b" x="200" y="392" text-anchor="middle">caspasi-3, -6, -7</text>
  <line class="arr" x1="200" y1="402" x2="200" y2="424" marker-end="url(#apo-arrow)"/>

  <rect x="40" y="426" width="320" height="94" rx="10" fill="#ede5d6" stroke="#857a6d" stroke-width="1.5"/>
  <text class="h2" x="200" y="447" text-anchor="middle">Apoptosi</text>
  <text class="b" x="56" y="469">• DNA tagliato, cromatina condensata</text>
  <text class="b" x="56" y="489">• lamine e citoscheletro tagliati</text>
  <text class="b" x="56" y="509">• corpi apoptotici → fagociti</text>

  <!-- Brakes -->
  <rect x="12" y="536" width="376" height="100" rx="10" fill="#fbecc6" stroke="#857a6d" stroke-width="1.5"/>
  <text class="bt cau" x="26" y="558">Freni</text>
  <text class="b cau" x="26" y="580">• Bcl-2, Bcl-xL, Mcl-1 tengono inattivi Bax/Bak</text>
  <text class="b cau" x="26" y="601">• le IAP bloccano le caspasi; SMAC le sblocca</text>
  <text class="m cau" x="26" y="622">freccia tratteggiata = dialogo tra le due vie</text>
</svg>
