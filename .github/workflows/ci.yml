name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runner pinned: ubuntu-latest moves to 26.04 on 2026-10-19.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Containment guard (reference/, .work/, private/, large documents)
        run: npm run guard
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Dependency licenses (allowlist + documented exceptions)
        run: npm run licenses
      - name: Build (Astro + Pagefind)
        run: npm run build
      - name: Contrast check (WCAG 2.2 AA tokens)
        run: npm run contrast
      - name: Fixture must not be published
        run: test ! -e dist/it/e/fixture-demo && test ! -e dist/en/e/fixture-demo
      - name: Dist validators (navigation graph, links, anchors, size budget, external assets)
        run: npm run test:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-dist
          path: |
            reports/
            docs/licenses/dependencies.json
          retention-days: 14
          if-no-files-found: ignore

  # Full viewport matrix on Chromium; Firefox and WebKit run the @smoke
  # subset at 375 and 1280 px (see playwright.config.ts). Engines run in parallel.
  e2e:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Playwright (${{ matrix.engine }})
        run: npx playwright test
        env:
          E2E_ENGINES: ${{ matrix.engine }}
      # Study tools and the service worker need a draft-fixture build (own configs).
      - name: Study e2e (fixture build)
        if: matrix.engine == 'chromium'
        run: npm run test:e2e:study
      - name: Offline e2e (fixture build, ${{ matrix.engine }})
        if: matrix.engine != 'firefox'
        run: npm run test:e2e:offline -- --project ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lighthouse mobile ≥ 90 (/it/, /en/atlas/, /it/about/)
        run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-lighthouse
          path: reports/lighthouse.json
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e, lighthouse]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs `npm run build` (package.json), so the Pagefind index is included,
      # then uploads dist/ with actions/upload-pages-artifact.
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
