name: WHO watch

# Weekly check of public WHO/IARC metadata against data/who-watch/baseline.json.
# It only opens issues for human review: it never commits and never edits content.
# Runbook: docs/WHO_WATCH.md (triage, baseline refresh, re-enabling after 60 idle days).
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC; an odd minute avoids the top-of-hour queue
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: who-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    # Reading has its own 5-minute budget (scripts/who-watch.mjs READ_BUDGET_MS); the rest is GitHub calls.
    timeout-minutes: 20
    # The script needs no dependencies, so nothing is installed or run in this job before the token is used.
    # Its tests run in CI (`npm test` includes tests/who-watch.test.ts). Actions pinned by commit SHA.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check sources, open issues
        run: node scripts/who-watch.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
