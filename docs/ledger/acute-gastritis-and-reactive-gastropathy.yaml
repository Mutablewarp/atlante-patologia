entity: acute-gastritis-and-reactive-gastropathy
claims:
- claimId: acute-gastritis-and-reactive-gastropathy-c001
  section: definition
  statement: "A brief overpowering of the mucosal defenses by damaging agents causes a short episode of injury to the stomach lining, called acute gastritis."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c002
  section: definition
  statement: "Irritants, most often NSAIDs, make the gastric mucosa overgrow in reactive gastropathy."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c003
  section: definition
  statement: "Reactive gastropathy is found in as many as 40% of people who use NSAIDs chronically."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c004
  section: etiology
  statement: "Tight junctions, mucus and blood flow protect the gastric lining."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c005
  section: etiology
  statement: "Ischemia caused by cocaine, low blood pressure or low blood volume can injure the gastric mucosa."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c006
  section: etiology
  statement: "NSAIDs block production of prostaglandins, which support the mucus layer."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c007
  section: etiology
  statement: "Alcohol, acids and alkalis injure the gastric mucosa on direct contact."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c008
  section: etiology
  statement: "Heavy alcohol use, radiation and bile reflux also cause reactive gastropathy, besides NSAIDs."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c009
  section: pathogenesis
  statement: "Gastric ulcers may develop in acute gastritis, which reflects a relatively brief imbalance between mucosal defenses and injury."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c010
  section: pathogenesis
  statement: "Foveolar cells proliferate in reactive gastropathy in response to the injurious agents."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c011
  section: gross
  statement: "Acute gastritis may produce gastric ulcers that are multiple and typically shallow."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c012
  section: gross
  statement: "These ulcers are found in the gastric body, whose mucosa produces acid."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c013
  section: gross
  statement: "Most acute gastritis is hemorrhagic."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c014
  section: gross
  statement: "The body of the pictured stomach has shallow erosions or ulcers, one of them bleeding."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c015
  section: micro
  statement: "Erosive acute gastritis can show prominent fibrosis and inflammation."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c016
  section: micro
  statement: "Irregular, corkscrew-shaped pits are what foveolar hyperplasia leaves behind."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c017
  section: micro
  statement: "Smooth muscle of the lamina propria may proliferate in reactive gastropathy."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c018
  section: micro
  statement: "Inflammation is rare in reactive gastropathy and is seen mainly around an ulcer or erosion."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c019
  section: clinical
  statement: "Acute gastritis and its ulcers can be life-threatening."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c020
  section: clinical
  statement: "Patients at risk may be given preventive treatment."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c021
  section: diagnosis
  statement: "Endoscopy is more accurate for esophagitis and colitis than for gastritis."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c022
  section: prognosis
  statement: "The best management of reactive gastropathy is to remove the cause."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c023
  section: differential
  statement: "Acute gastritis is usually hemorrhagic; the erosive type shows prominent fibrosis and inflammation."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c024
  section: differential
  statement: "Reactive gastropathy combines foveolar hyperplasia with infrequent inflammation."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c025
  section: differential
  statement: "In chronic gastritis, inflammatory cells are more numerous in the lamina propria."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c026
  section: differential
  statement: "Lymphocytic gastritis has many lymphocytes within the surface epithelium and the glands."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c027
  section: differential
  statement: "Gastric granulomas call for a work-up for sarcoidosis, Crohn disease, and fungal or mycobacterial infection."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c028
  section: differential
  statement: "Acid secretion and H. pylori both contribute to peptic ulcer disease, a focal loss of mucosa."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c029
  section: high-yield
  statement: "NSAIDs are the most common cause of reactive gastropathy."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c030
  section: high-yield
  statement: "Alcohol, radiation and bile reflux are further causes of reactive gastropathy."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c031
  section: high-yield
  statement: "Foveolar hyperplasia produces corkscrew gastric pits."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c032
  section: high-yield
  statement: "Inflammation in reactive gastropathy is minimal except around an erosion or ulcer."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c033
  section: high-yield
  statement: "Acute gastritis ulcers are shallow and multiple, and the gastritis is usually hemorrhagic."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c034
  section: high-yield
  statement: "Reactive gastropathy is treated by removing its cause."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c035
  section: traps
  statement: "Reactive gastropathy is a hyperplastic response, and inflammation is infrequent except with an ulcer or erosion."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c036
  section: traps
  statement: "Excess alcohol, radiation and bile reflux can also cause reactive gastropathy, not only NSAIDs."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c037
  section: traps
  statement: "Acute gastritis can be life-threatening."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: acute-gastritis-and-reactive-gastropathy-c038
  section: mnemonics
  statement: "Causes of reactive gastropathy: bile reflux, radiation, alcohol, NSAIDs (original mnemonic BRAN)."
  sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
