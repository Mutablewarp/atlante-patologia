entity: tumor-grading-and-staging
claims:
  - { claimId: tumor-grading-and-staging-c001, section: definition, statement: "Grade expresses how much tumor cells and tissue architecture resemble the tissue of origin, as judged histologically and cytologically.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c002, section: definition, statement: "Stage describes where and how far a tumor has detectably spread in the patient.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c003, section: definition, statement: "Cancer survival data are grouped by stage at diagnosis, and stage often decides the extent of surgery and the additional treatment given.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c004, section: pathogenesis, statement: "The closer a tumor resembles its origin, the less aggressive it tends to be, and poor resemblance goes with greater malignancy; this axiom is not necessarily universal.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c005, section: pathogenesis, statement: "Low grade corresponds to well-differentiated neoplasms and high grade to poorly differentiated ones.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c006, section: pathogenesis, statement: "A tumor with many mitoses or with atypical mitoses shows evidence of rapid growth.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c007, section: pathogenesis, statement: "Because cytologic and histologic grading depends on subjective judgment, it is at best semiquantitative.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c008, section: gross, statement: "Ulcerated bladder masses that invade the wall tend to be high grade; small papillary mucosal growths, low grade.", sourceRef: { source: rubin-8e, pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c009, section: micro, statement: "Grade is assigned from how anaplastic the cells look and how many of them are dividing.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c010, section: micro, statement: "The more the cells vary in size and shape, the more anaplastic the tumor is.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c011, section: micro, statement: "A poorly differentiated adenocarcinoma has few glands and looks unlike normal tissue; a well-differentiated one is rich in glands.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c012, section: micro, statement: "Grading schemes usually have three or four grades, with malignancy increasing as the grade rises.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c013, section: micro, statement: "In lung squamous carcinoma, a grade 1 tumor still forms keratin pearls, while grade 3 cells can barely be recognized as squamous.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c014, section: micro, statement: "The Nottingham grade (modified Bloom and Richardson) is the sum of three scores for nuclear variation, mitotic rate and gland formation, giving grade 1, 2 or 3.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c015, section: micro, statement: "Papillary urothelial tumors of the bladder fall into three grades: low-grade carcinoma, high-grade carcinoma and the milder PUNLMP category.", sourceRef: { source: rubin-8e, pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c016, section: micro, statement: "In high-grade papillary urothelial carcinoma the epithelium is disorganized and the nuclei show significant hyperchromasia and pleomorphism.", sourceRef: { source: rubin-8e, pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c017, section: micro, statement: "The reference illustrates the Gleason grading system for prostate cancer with grades 3, 4 and 5.", sourceRef: { source: rubin-8e, pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c018, section: ancillary, statement: "Cytologic and histologic grading examines tumor architecture and cell cytology.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c019, section: ancillary, statement: "Knowing whether axillary nodes hold breast cancer requires a pathologist to examine the nodes the surgeon removed.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c020, section: ancillary, statement: "An injected dye and radioactive isotope trace lymphatic drainage to the sentinel node, where metastasis is most likely.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c021, section: ancillary, statement: "When the sentinel node is negative, the surgeon can safely omit axillary dissection.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c022, section: ancillary, statement: "Epithelial tumor cells in a lymph node can be missed without staining, and cytokeratin immunostaining makes them visible.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c023, section: ancillary, statement: "A metastatic tumor that shows PSA on immunohistochemistry is likely to have the prostate as its primary site.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c024, section: ancillary, statement: "Estrogen and progesterone receptor status of a breast cancer is read out by immunohistochemistry.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c025, section: clinical, statement: "Non-muscle-invasive bladder tumors (Ta, Tis, T1) are usually followed closely after endoscopic removal and bladder instillations.", sourceRef: { source: rubin-8e, pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c026, section: clinical, statement: "Muscle-invasive (T2) bladder tumors call for radical cystectomy, as do some advanced ones.", sourceRef: { source: rubin-8e, pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c027, section: clinical, statement: "Localized prostate tumors (T1, T2) can be treated with radiation, prostatectomy or ablation.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c028, section: clinical, statement: "In T3 prostate cancer, radiation with androgen deprivation is preferred, since half of patients already have pelvic node metastases that surgery cannot cure.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c029, section: clinical, statement: "Sentinel node biopsy reduces the risk of lymphedema and nerve damage associated with axillary dissection.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c030, section: diagnosis, statement: "In TNM, M records distant metastasis, N the extent of regional node spread, and T the size and local extent of the primary tumor.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c031, section: diagnosis, statement: "A T3N2M0 breast cancer shows no detected metastasis (M0), moderate axillary node involvement (N2) and a large primary tumor (T3).", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c032, section: diagnosis, statement: "The criteria for each TNM category differ from one tumor type to another and may be quite complex.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c033, section: diagnosis, statement: "Hematologic malignancies have staging systems of their own.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c034, section: diagnosis, statement: "A stage from I to IV, sometimes with substages, is a compact label for the T, N and M findings.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c035, section: diagnosis, statement: "A lung cancer is stage I only if the tumor is small and there is no lymph node involvement or metastasis.", sourceRef: { source: rubin-8e, pages: "752" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c036, section: diagnosis, statement: "In lung cancer, the extent of regional node involvement is what mainly distinguishes stage II from stage III.", sourceRef: { source: rubin-8e, pages: "752" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c037, section: diagnosis, statement: "Any lung tumor with distant metastasis is stage IV.", sourceRef: { source: rubin-8e, pages: "752" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c038, section: diagnosis, statement: "In colorectal cancer a tumor invading the submucosa is T1, and one entering but not passing through the muscularis propria is T2.", sourceRef: { source: rubin-8e, pages: "828" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c039, section: diagnosis, statement: "In colorectal cancer, invasion of pericolorectal soft tissue is T3, and penetration of the serosa (T4a) or involvement of adjacent organs (T4b) is T4.", sourceRef: { source: rubin-8e, pages: "828" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c040, section: diagnosis, statement: "How deep a bladder cancer invades the bladder wall determines its T stage.", sourceRef: { source: rubin-8e, pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c041, section: diagnosis, statement: "Breast tumor size is measured on the invasive component only.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1095" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c042, section: diagnosis, statement: "A breast tumor is T4 regardless of size if it ulcerates through the skin or invades the chest wall; dermal invasion alone does not qualify.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1095" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c043, section: diagnosis, statement: "Urothelial carcinoma in situ is staged Tis; it is flat and confined to the mucosa, with an intact basement membrane and no invasion.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987, 989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c044, section: diagnosis, statement: "The breast staging in the reference is the AJCC TNM system, 8th edition, 2017.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1095" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c045, section: diagnosis, statement: "Besides anatomic TNM, the updated breast system also takes tumor biology into account, such as grade and receptor status.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1095" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c046, section: diagnosis, statement: "Triple-negative breast cancer has survival roughly equal to that of a receptor-positive tumor staged one level higher.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1095" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c047, section: diagnosis, statement: "A stage II breast tumor that is T2 and node-negative drops to stage I when its Oncotype DX recurrence score is low, meaning biologically low risk.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1095" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c048, section: prognosis, statement: "Stage beats grade for forecasting course and guiding therapy because it reflects what the tumor really does in that patient.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c049, section: prognosis, statement: "A low cytologic grade does not always mean indolent behavior; some such tumors are very aggressive.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c050, section: prognosis, statement: "Of all factors that predict outcome in lung carcinoma, stage carries the most weight.", sourceRef: { source: rubin-8e, pages: "752" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c051, section: prognosis, statement: "Whether axillary lymph nodes contain metastasis is a key prognostic indicator in breast cancer.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c052, section: prognosis, statement: "Patients with grade 2 or 3 breast cancer have significantly worse survival than those with grade 1.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c053, section: prognosis, statement: "Prognosis in invasive urothelial carcinoma is determined by how deep the tumor invades into or beyond the bladder wall.", sourceRef: { source: rubin-8e, pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c054, section: prognosis, statement: "By stage, five-year survival in prostate cancer is 90% for T1 and T2, 40% for T3 and 10% for T4.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c055, section: differential, statement: "Grade reflects cytologic and histologic abnormality, from well to poorly differentiated.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c056, section: differential, statement: "Staging looks at nodal disease, distant sites, and the tumor's size and local reach.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c057, section: differential, statement: "In situ urothelial carcinoma is high grade yet only Tis.", sourceRef: { source: rubin-8e, pages: "990" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c058, section: high-yield, statement: "Grade is based on differentiation and stage on the extent of spread.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c059, section: high-yield, statement: "TNM stands for primary tumor, regional nodes and distant metastasis.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c060, section: high-yield, statement: "Stage tells more than grade about how a tumor will behave.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c061, section: high-yield, statement: "The Nottingham system gives breast cancer grade 1, 2 or 3.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c062, section: high-yield, statement: "If the sentinel node is negative, axillary dissection can be avoided.", sourceRef: { source: rubin-8e, chapter: "25", pages: "1097" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c063, section: high-yield, statement: "Tis denotes carcinoma in situ, with no invasion.", sourceRef: { source: rubin-8e, pages: "989, 990" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c064, section: traps, statement: "Grade and stage are distinct: flat high-grade carcinoma in situ is staged Tis.", sourceRef: { source: rubin-8e, pages: "990" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c065, section: traps, statement: "Grade does not always match behavior, so some low-grade tumors are very aggressive.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c066, section: traps, statement: "T, N and M categories are defined differently for each tumor type.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tumor-grading-and-staging-c067, section: mnemonics, statement: "Mnemonic restating that grade is the microscopic appearance and stage is the spread.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
