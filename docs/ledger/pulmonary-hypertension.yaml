entity: pulmonary-hypertension
claims:
  - { claimId: pulmonary-hypertension-c001, section: definition, statement: "In this edition, a mean resting pressure above 25 mm Hg in the pulmonary arteries defines pulmonary hypertension.", sourceRef: { source: rubin-8e, chapter: "18", pages: "748" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c002, section: definition, statement: "Pulmonary pressure rises when the lungs receive more blood flow or their vessels offer more resistance.", sourceRef: { source: rubin-8e, chapter: "18", pages: "748" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c003, section: definition, statement: "When high pulmonary arterial pressure makes the right ventricle thicken and widen, the condition is cor pulmonale.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c004, section: definition, statement: "Women in their 20s and 30s form the typical group, yet any age may be affected.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c005, section: etiology, statement: "Pulmonary hypertension is sorted by whether its cause acts before or after the capillary bed.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c006, section: etiology, statement: "Before the capillaries, left-to-right shunts raise flow, whereas emboli, hypoxia, lung fibrosis and primary pulmonary vascular disease raise resistance.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c007, section: etiology, statement: "Postcapillary causes are left-sided heart disorders such as mitral stenosis, and veno-occlusive disease of the lung.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c008, section: etiology, statement: "Drugs or toxins such as fen-phen and collagen vascular disease can underlie pulmonary arterial hypertension; other cases are idiopathic or hereditary.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c009, section: etiology, statement: "Inherited forms of pulmonary arterial hypertension carry mutations in BMPR2, ALK1 or ENG.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c010, section: etiology, statement: "Poor ventilation, lung disease or high altitude can produce alveolar hypoxia and thereby pulmonary hypertension.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c011, section: etiology, statement: "Small emboli arriving repeatedly from peripheral veins, in some patients the deep leg veins, slowly raise pulmonary pressure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c012, section: etiology, statement: "Most chronic cor pulmonale comes from pulmonary fibrosis or from obstructed breathing in COPD or obstructive sleep apnea.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c013, section: etiology, statement: "Abrupt-onset massive pulmonary embolism is the usual cause of acute cor pulmonale.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c014, section: pathogenesis, statement: "After birth pulmonary arteries dilate and thin, whereas fetal pulmonary arteries have thick walls and high pressure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "748" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c016, section: pathogenesis, statement: "Most shunts that push extra blood into the lungs are congenital heart malformations.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c017, section: pathogenesis, statement: "In mitral valve disease venous pressure rises first and arterial pressure secondarily, so the lungs combine hypertensive vessel changes with chronic passive congestion.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c018, section: pathogenesis, statement: "Ventilation and perfusion are normally kept matched because vessels narrow in lung regions with low alveolar oxygen.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c019, section: pathogenesis, statement: "Low oxygen, excess carbon dioxide and acidosis can each narrow pulmonary vessels directly.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c020, section: pathogenesis, statement: "Polycythemia induced by hypoxia raises blood viscosity, which is an indirect route by which hypoxia raises pulmonary vascular resistance.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c021, section: pathogenesis, statement: "In chronic lung disease the usable pulmonary vascular bed shrinks, both because vessels are destroyed and because arterioles constrict.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c023, section: pathogenesis, statement: "Many people with familial pulmonary arterial hypertension have BMPR2 mutations; the disease is dominantly inherited with incomplete penetrance.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c024, section: pathogenesis, statement: "Faulty BMPR2 signaling damages the endothelium, so thromboxane rises while nitric oxide and prostacyclin fall short.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c025, section: pathogenesis, statement: "Small pulmonary arteries thicken through smooth muscle growth once vasoconstrictors outweigh vasodilators.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c026, section: pathogenesis, statement: "Because BMPR2, ALK1 and ENG all act in the TGF-beta pathway, their defects point to disturbed signaling there.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c027, section: gross, statement: "Normal right ventricular wall thickness is 0.3 to 0.5 cm, and in chronic cor pulmonale hypertrophy may take it above 1.0 cm.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c028, section: gross, statement: "Chronic cor pulmonale frequently enlarges the right ventricle and right atrium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c029, section: gross, statement: "Severe right ventricular hypertrophy may straighten the interventricular septum or curve it to the right, whereas it normally curves to the left.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c030, section: gross, statement: "In acute cor pulmonale the autopsy heart is normal except for a markedly dilated right ventricle, sometimes with the right atrium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c032, section: gross, statement: "Lungs in pulmonary veno-occlusive disease show brown induration.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c033, section: micro, statement: "The Heath and Edwards grade of the pulmonary artery wall changes relates to whether repairing the heart defect can undo the raised pressure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "748-749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c034, section: micro, statement: "Reversal is generally possible at grades 1 to 3 and generally not possible at grade 4 and above.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c035, section: micro, statement: "In grade 1 the media of muscular pulmonary arteries thickens and arterioles acquire smooth muscle.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c036, section: micro, statement: "In grade 2 the intima begins to proliferate while the media thickens further.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c037, section: micro, statement: "In grade 3 the intima of muscular arteries and arterioles becomes fibrotic, and the lumen may be blocked.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c038, section: micro, statement: "In grade 4, plexiform lesions (tangles of tiny channels) worsen the blockage and the arteries are dilated and thin.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c039, section: micro, statement: "In grade 5 thin dilated vessels may rupture, causing lung hemorrhage and hemosiderosis, and angiomatoid lesions join the plexiform ones.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c040, section: micro, statement: "Grade 6 is marked by fibrinoid necrosis in both arteries and arterioles.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c041, section: micro, statement: "The pulmonary artery in pulmonary hypertension keeps the fetal pattern of elastic lamellae, which are normally lost after birth.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c042, section: micro, statement: "In veno-occlusive disease, intimal fibrosis that is loose and poorly cellular partly or totally blocks small veins and venules.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c043, section: micro, statement: "The pulmonary arteries may contain fresh thrombi and marked hypertensive damage, while the alveolar walls are moderately fibrotic with patchy hemosiderosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c044, section: micro, statement: "Fibrous strands called webs, left when an embolus organizes, may cross small pulmonary arteries.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c045, section: ancillary, statement: "The Heath and Edwards scale describes the vessel structural changes in grades 1 to 6.", sourceRef: { source: rubin-8e, chapter: "18", pages: "748-749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c046, section: ancillary, statement: "Genomic analysis found rare recessive variants in CAV1, KCNK3 and EIF2AK4, and variants in other TGF-beta superfamily members.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c047, section: clinical, statement: "In pulmonary arterial hypertension breathlessness creeps in while examination and chest imaging show little at first and more as time passes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c048, section: clinical, statement: "Patients ultimately die of cor pulmonale; the severe stage usually shows plexiform lesions.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c050, section: clinical, statement: "Veno-occlusive disease has a more fulminant course than primary pulmonary hypertension, though both present with progressive dyspnea.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c051, section: clinical, statement: "Some patients with recurrent emboli have a venous clot, usually in the deep leg veins, or a history predisposing to venous thrombosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c052, section: diagnosis, statement: "Chest films in veno-occlusive disease show patchy infiltrates of hemorrhage and hemosiderosis that multiply over time.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c053, section: prognosis, statement: "Among the variables followed in chronic lung disease, pulmonary pressure is often the best predictor of survival.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c054, section: prognosis, statement: "Five-year survival is under 10% when pulmonary artery pressure is over 45 mm Hg.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c055, section: prognosis, statement: "Older medical treatment mostly failed, while PDE-5, endothelin and prostacyclin-targeted drugs now reach about 30% five-year survival in pulmonary arterial hypertension.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c056, section: prognosis, statement: "Transplantation is often indicated: lung alone, or heart and lung when the heart has an irreversible defect.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c057, section: prognosis, statement: "No therapy treats veno-occlusive disease effectively, so a lung transplant is the option to weigh.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c058, section: prognosis, statement: "A filter in the inferior vena cava lowers the chance that new clots reach the lungs when recurrent emboli are recognized in life.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c059, section: differential, statement: "Sudden massive embolization causes acute cor pulmonale, while repeated small emboli gradually cause pulmonary hypertension.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664, 750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c060, section: differential, statement: "Left-sided cardiac disease such as mitral stenosis causes postcapillary pulmonary hypertension via raised venous pressure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749-750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c061, section: differential, statement: "Chronic airflow obstruction such as chronic bronchitis produces alveolar hypoxia and vasoconstriction, a precapillary mechanism.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749-750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c062, section: high-yield, statement: "Precapillary forms (such as shunts and emboli) differ from postcapillary forms (such as veno-occlusive disease and mitral stenosis) by where flow or resistance rises.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c063, section: high-yield, statement: "Cor pulmonale is the right ventricular thickening and widening that high pulmonary pressure causes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c064, section: high-yield, statement: "Intimal fibrosis defines grade 3 and plexiform lesions grade 4; grades 4 and above are generally irreversible.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c065, section: high-yield, statement: "Many hereditary cases have BMPR2 mutations, implicating altered TGF-beta signaling.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664, 750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c066, section: high-yield, statement: "Alveolar hypoxia constricts small pulmonary arteries.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c067, section: high-yield, statement: "Pulmonary arterial hypertension is most common in young women, and patients die of cor pulmonale.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c068, section: traps, statement: "The textbook describes primary pulmonary hypertension as uncommon and precapillary.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c069, section: traps, statement: "Cor pulmonale is right ventricular thickening and widening caused by pulmonary hypertension.", sourceRef: { source: rubin-8e, chapter: "17", pages: "664" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c070, section: traps, statement: "Grades 1 to 3 can usually be reversed; grade 4 onward usually cannot.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c071, section: traps, statement: "Mitral stenosis is listed under postcapillary pulmonary hypertension.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-hypertension-c072, section: mnemonics, statement: "The six Heath and Edwards grades run from medial hypertrophy through intimal proliferation, intimal fibrosis, plexiform lesions and angiomatoid lesions to fibrinoid necrosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "749" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
