entity: helicobacter-pylori-gastritis
claims:
- { claimId: helicobacter-pylori-gastritis-c001, section: definition, statement: "H. pylori is a short bacillus that lives on top of the foveolar epithelium and causes chronic gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c002, section: definition, statement: "Worldwide, no other agent causes more gastritis or gastric cancer than H. pylori.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c003, section: definition, statement: "Warren and Marshall's 1984 findings finally accounted for chronic gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c004, section: definition, statement: "The infection is commonest among people of low socioeconomic status and in developing countries.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c005, section: definition, statement: "Chronic gastritis is very common everywhere and goes with extra inflammatory cells in the lamina propria.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c006, section: etiology, statement: "A group of non-pylori Helicobacters, often labeled H. heilmannii, infects humans and mimics H. pylori gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c007, section: etiology, statement: "Cats, dogs and pigs are common hosts, with the organisms living in their stomachs.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c008, section: etiology, statement: "Compared with H. pylori, H. heilmannii is bigger and winds into several tight coils.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c009, section: etiology, statement: "The regimens that treat H. pylori are also effective against H. heilmannii, which likewise produces urease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c010, section: etiology, statement: "In the absence of infection, diet, for instance smoked and salted foods, may contribute to atrophic gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c011, section: pathogenesis, statement: "Because the bacteria sit in mucus over the foveolar cells, the earliest inflammation is in the superficial lamina propria.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c012, section: pathogenesis, statement: "Foveolar cells make a neutral mucin that shelters H. pylori and is PAS positive and Alcian blue negative.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c013, section: pathogenesis, statement: "Ammonia neutralizes the surrounding acid, which lets the bacteria survive; they make it from urea with the enzyme urease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c014, section: pathogenesis, statement: "The toxins vacA and cagA injure the epithelium, provoke inflammation, or both; the bacteria never invade.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c015, section: pathogenesis, statement: "In most cases Helicobacter gastritis affects the antrum.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c016, section: pathogenesis, statement: "The gastritis can spread beyond the antrum to the proximal stomach if the infection lasts long or if PPIs are taken chronically.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c017, section: pathogenesis, statement: "When gland loss (atrophy) and intestinal metaplasia occur in patches of the antrum, body or fundus, the picture is called multifocal atrophic gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c018, section: pathogenesis, statement: "Gastric cancer is believed to develop stepwise: inflammation, intestinal metaplasia, dysplasia, adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c019, section: gross, statement: "Gastritis is harder to assess at endoscopy than esophagitis and colitis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c020, section: gross, statement: "Sampling should be tied to landmarks, since the stomach's cardia, body and antrum differ in build and role.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c021, section: micro, statement: "The superficial lamina propria holds an infiltrate that is largely lymphocytes and plasma cells.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779-780" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c022, section: micro, statement: "Lymphoid aggregates, which are often present, are highly suggestive of Helicobacter.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779-780" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c023, section: micro, statement: "Pit abscesses are neutrophil collections in the foveolae, and neutrophils are often present in this gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c024, section: micro, statement: "Such neutrophils show that an existing chronic gastritis is flaring up; acute gastritis is a separate disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c025, section: micro, statement: "Lying in the mucus above the pit-lining cells are the bacteria, small bent rods.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c026, section: micro, statement: "Multifocal atrophic gastritis shows loss of glands together with intestinal metaplasia.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c027, section: ancillary, statement: "The specimen is an endoscopic biopsy, and landmarks record which gastric region was sampled, since regions differ.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c028, section: ancillary, statement: "Plain H&E is often enough for an experienced observer to find the bacteria.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c029, section: ancillary, statement: "When a special stain is needed, most often it is silver impregnation (Warthin-Starry).", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c030, section: ancillary, statement: "Immunostaining is also effective for the organisms.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c031, section: clinical, statement: "Patients with chronic gastritis can be symptom-free or have only nonspecific dyspepsia.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c032, section: clinical, statement: "Long-standing Helicobacter gastritis most often leads to peptic ulcer disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c033, section: clinical, statement: "Among patients with antral-predominant gastritis, 5% to 10% develop a duodenal ulcer.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c034, section: diagnosis, statement: "On a gastric biopsy a silver stain makes the bacteria stand out on the surface of the pit-lining cells, and the upper lamina propria contains lymphocytes and plasma cells.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779-780" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c035, section: prognosis, statement: "Chronic Helicobacter infection is responsible for 70% of distal gastric cancers, which is the most serious risk.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c036, section: prognosis, statement: "Gastric cancer is also frequent in countries where H. pylori gastritis is widespread.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c037, section: prognosis, statement: "The infection raises the risk of gastric lymphoma of mucosa-associated lymphoid tissue.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c038, section: prognosis, statement: "Eradicating the infection by itself keeps about 75% of gastric MALT lymphoma patients in durable remission.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c039, section: prognosis, statement: "Triple therapy combines clarithromycin with a PPI and with one of two antibiotics, amoxicillin or metronidazole.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c040, section: differential, statement: "Autoimmune gastritis stays in the body and fundus, because only these regions hold parietal cells.", sourceRef: { source: rubin-8e, chapter: "19", pages: "780" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c041, section: differential, statement: "Autoimmune gastritis is caused by anti-parietal cell and anti-intrinsic factor antibodies.", sourceRef: { source: rubin-8e, chapter: "19", pages: "780" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c042, section: differential, statement: "Acute gastritis results from short-lived mucosal injury such as ischemia, NSAIDs or alcohol and is usually hemorrhagic.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c043, section: differential, statement: "Acute gastritis ulcers sit in the acid-secreting gastric body, many in number and not deep.", sourceRef: { source: rubin-8e, chapter: "19", pages: "778" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c044, section: differential, statement: "Environmental multifocal atrophic gastritis shows patchy gland loss and intestinal metaplasia, and infection is one cause among several.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c045, section: differential, statement: "Helicobacter organisms are detected with silver impregnation or immunostaining.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c046, section: high-yield, statement: "Antral disease is the usual pattern; chronic PPI use or long infection lets it extend to the proximal stomach.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c047, section: high-yield, statement: "Ammonia, the product of urease, neutralizes gastric acid around the bacteria.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c048, section: high-yield, statement: "The cytotoxins vacA and cagA cause the damage, since Helicobacter does not invade.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c049, section: high-yield, statement: "When lymphoid aggregates are present, Helicobacter is strongly suspected.", sourceRef: { source: rubin-8e, chapter: "19", pages: "780" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c050, section: high-yield, statement: "Warthin-Starry, a silver impregnation, is the stain most often chosen for the organisms.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c051, section: high-yield, statement: "Cancer is thought to follow inflammation, intestinal metaplasia, dysplasia and adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c052, section: high-yield, statement: "Chronic Helicobacter infection is linked to peptic ulcer disease, gastric adenocarcinoma and gastric MALT lymphoma.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c053, section: traps, statement: "Neutrophils here show that a chronic gastritis is flaring up; acute gastritis is a separate disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c054, section: traps, statement: "Tissue damage comes from cytotoxins, not from invasion of the mucosa.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c055, section: traps, statement: "Diet and other factors may play a part when no infection is present, though Helicobacter accounts for most cases of multifocal atrophic gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c056, section: traps, statement: "Autoimmune gastritis arises from antibodies against parietal cells and intrinsic factor and affects only the body and fundus.", sourceRef: { source: rubin-8e, chapter: "19", pages: "780" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c057, section: traps, statement: "Non-pylori Helicobacter species, collectively H. heilmannii, cause a gastritis similar to that of H. pylori.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: helicobacter-pylori-gastritis-c058, section: mnemonics, statement: "Bacteria protect themselves from gastric acid with ammonia, which their urease generates from urea.", sourceRef: { source: rubin-8e, chapter: "19", pages: "779" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
