entity: hyaline-change
claims:
- claimId: hyaline-change-c001
  section: definition
  statement: "Under the light microscope, arterioles with hyaline arteriolosclerosis have a glassy-looking wall"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "614" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c002
  section: definition
  statement: "The term hyaline is used for deposits in arterioles, glomeruli, pancreatic islets and pituitary corticotroph tumor cells"
  sourceRef: { source: rubin-8e, chapter: "13, 16, 22, 27", pages: "546, 614, 934, 1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c003
  section: etiology
  statement: "Hyaline arteriolosclerosis is a vascular change of chronic hypertension"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "613-614" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c004
  section: etiology
  statement: "Hyaline arteriolosclerosis may also occur in diabetes"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "614" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c005
  section: etiology
  statement: "When blood cortisol is high enough to switch off ACTH release, the corticotroph cells show Crooke hyalinization"
  sourceRef: { source: rubin-8e, chapter: "27", pages: "1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c006
  section: pathogenesis
  statement: "What thickens the wall of a hyaline arteriole is a mixture of built-up plasma proteins and basement membrane material"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "614" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c007
  section: pathogenesis
  statement: "In the diabetic kidney, plasma proteins leak into the walls of the afferent and efferent arterioles, which also become sclerotic; together this is hyaline arteriolosclerosis"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "934" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c008
  section: pathogenesis
  statement: "Light microscopy can pick up Crooke hyalinization because the keratin filament bundles sitting around the nucleus are so numerous"
  sourceRef: { source: rubin-8e, chapter: "27", pages: "1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c009
  section: pathogenesis
  statement: "Amylin, released by beta cells along with insulin, is the polypeptide that makes up islet amyloid in type 2 diabetes"
  sourceRef: { source: rubin-8e, chapter: "13", pages: "546" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c010
  section: gross
  statement: "A kidney with hypertensive nephrosclerosis is smaller than normal and its surface looks fine-grained"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "950" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c011
  section: micro
  statement: "In hypertensive nephrosclerosis the arteriole wall is thickened by hyaline all the way around, and its smooth muscle cells may be absent or pushed toward the outer edge"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "950" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c012
  section: micro
  statement: "A capsular drop is a round lump of leaked protein lying between Bowman capsule and its parietal epithelial cells, a feature of diabetic glomerulosclerosis"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "934" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c013
  section: micro
  statement: "Hyaline caps are protein deposits lying under the endothelium of glomerular capillary loops"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "934" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c014
  section: micro
  statement: "Amyloid laid down in an islet of a patient with type 2 diabetes is described as hyalinization"
  sourceRef: { source: rubin-8e, chapter: "13", pages: "546" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c015
  section: micro
  statement: "Crooke hyaline change can be seen by light microscopy in corticotroph adenomas"
  sourceRef: { source: rubin-8e, chapter: "27", pages: "1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c016
  section: ancillary
  statement: "On PAS stain the arterioles of hypertensive nephrosclerosis show hyaline sclerosis"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "950" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c017
  section: ancillary
  statement: "Lipid debris lies inside the dense clumps that electron microscopy shows for the hyaline protein deposits of diabetic glomeruli"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "934" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c018
  section: ancillary
  statement: "Plasma proteins such as IgG and albumin get trapped in diabetic glomeruli, and immunofluorescence shows this as a diffuse linear signal"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "934" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c019
  section: ancillary
  statement: "Staining for ACTH and keratin is usually found at the cell edge in Crooke adenomas"
  sourceRef: { source: rubin-8e, chapter: "27", pages: "1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c020
  section: clinical
  statement: "Chronic hypertension mainly changes small arteries and arterioles, and the kidney is a particularly affected site"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "615" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c021
  section: clinical
  statement: "In most people, hypertensive nephrosclerosis leaves renal function intact"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "950" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c022
  section: prognosis
  statement: "End-stage renal disease can be the outcome in a minority of hypertensive patients, whose kidney failure keeps worsening"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "950" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c023
  section: prognosis
  statement: "Papillary necrosis and pyelonephritis are more likely in diabetic kidneys because narrowed vessels reduce the blood reaching the medulla"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "934" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c024
  section: differential
  statement: "The hyalinized material in a diabetic islet is amyloid composed of amylin"
  sourceRef: { source: rubin-8e, chapter: "13", pages: "546" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c025
  section: differential
  statement: "In small muscular arteries of chronic hypertension the internal elastic lamina is doubled and the intima thickens with fibrous and muscular tissue and extra elastin"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "615" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c026
  section: differential
  statement: "Small-artery arteriosclerosis cannot be used to diagnose hypertension, since aging produces comparable changes"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "615" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c027
  section: high-yield
  statement: "Hyaline arteriolosclerosis occurs in hypertension and may be present in diabetes"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "614" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c028
  section: high-yield
  statement: "Capsular drops and hyaline caps are lesions of diabetic glomerulosclerosis"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "934" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c029
  section: high-yield
  statement: "Crooke hyalinization is a change of the cells of corticotroph adenomas due to keratin filaments"
  sourceRef: { source: rubin-8e, chapter: "27", pages: "1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c030
  section: high-yield
  statement: "Islet amyloid composed of amylin is the hyalinized material in type 2 diabetes"
  sourceRef: { source: rubin-8e, chapter: "13", pages: "546" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c031
  section: traps
  statement: "Hyaline arteriolosclerosis is not specific for hypertension; it may be present in diabetes"
  sourceRef: { source: rubin-8e, chapter: "16", pages: "614" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c032
  section: traps
  statement: "Crooke hyalinization reflects perinuclear keratin filaments in the tumor cells, although the page also mentions hyaline deposition between cells in Crooke adenomas"
  sourceRef: { source: rubin-8e, chapter: "27", pages: "1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c033
  section: traps
  statement: "In a diabetic islet the hyalinized material is amyloid"
  sourceRef: { source: rubin-8e, chapter: "13", pages: "546" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c034
  section: mnemonics
  statement: "Hyaline material is described in arterioles, glomeruli, islets and pituitary cells"
  sourceRef: { source: rubin-8e, chapter: "13, 16, 22, 27", pages: "546, 614, 934, 1204" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
- claimId: hyaline-change-c035
  section: micro
  statement: "Mallory-Denk bodies are hyaline cytoplasmic inclusions of hepatocytes, made mainly of keratin aggregates"
  sourceRef: { source: kurtovic-2025-mallory-bodies, chapter: "abstract" }
  status: not-found-in-reference
  secondSource: { source: kurtovic-2025-mallory-bodies, locator: "abstract" }
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-13
