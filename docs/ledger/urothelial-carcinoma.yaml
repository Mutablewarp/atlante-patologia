entity: urothelial-carcinoma
claims:
  - { claimId: urothelial-carcinoma-c001, section: definition, statement: "Urothelial carcinoma is the malignant tumor of the epithelium that lines the urinary tract.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c002, section: definition, statement: "The older name for these tumors is transitional cell carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c003, section: definition, statement: "Among tumors of the urinary tract the bladder is the commonest site.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c004, section: definition, statement: "Roughly 90% of bladder cancers are of urothelial type.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c005, section: definition, statement: "Bladder cancer is usually found in older people, with a median age of 65.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c006, section: definition, statement: "The male to female ratio for bladder cancer is about three to one.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c007, section: definition, statement: "A patient may have several tumors at once, at any urothelial site between the renal pelvis and the posterior urethra.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c009, section: etiology, statement: "Cigarette smoking, through its polycyclic hydrocarbons, is now the main bladder cancer risk factor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "984" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c010, section: etiology, statement: "Cigarette smokers have a risk four times that of non-smokers.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c011, section: etiology, statement: "Workplace exposure to azo dyes is a major risk factor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c012, section: etiology, statement: "In 1895 bladder cancer was described as an occupational disease of German aniline dye workers, one of the first such cancers known.", sourceRef: { source: rubin-8e, chapter: "23", pages: "984" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c014, section: etiology, statement: "Schistosoma haematobium infection raises bladder cancer risk where the parasite is endemic.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c015, section: etiology, statement: "Most schistosomiasis-related bladder cancers are squamous cell carcinomas.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c016, section: etiology, statement: "Cyclophosphamide and analgesic drugs are listed as risk factors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c017, section: etiology, statement: "Pelvic radiotherapy given for cervical, prostate or rectal cancer is a risk factor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c018, section: etiology, statement: "In nearly all bladder cancers no inherited cause or genetic predisposition has been identified.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c019, section: pathogenesis, statement: "The liver glucuronidates aromatic amines, and the conjugates then travel to the bladder in the urine.", sourceRef: { source: rubin-8e, chapter: "23", pages: "984" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c020, section: pathogenesis, statement: "Arylnitrenium ions bind guanine and mutate DNA; they are freed in the bladder when beta-glucuronidase in acidic urine cleaves the glucuronide conjugate.", sourceRef: { source: rubin-8e, chapter: "23", pages: "984" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c021, section: pathogenesis, statement: "Bladder tumors differ molecularly by architecture (flat or papillary) and by behavior (low-grade nonmuscle-invasive or high-grade muscle-invasive), which underlies their classification.", sourceRef: { source: rubin-8e, chapter: "23", pages: "985" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c022, section: pathogenesis, statement: "Flat carcinoma in situ and low-grade papillary tumors share a recurrent deletion within 9p, the arm that carries the tumor suppressor p16.", sourceRef: { source: rubin-8e, chapter: "23", pages: "985" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c023, section: pathogenesis, statement: "Mutations in the MAPK and PI3K pathways, which regulate cell growth and proliferation, are also linked to low-grade papillary urothelial carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "985" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c024, section: pathogenesis, statement: "Flat carcinoma in situ and invasive tumors add other cell-cycle suppressor mutations, notably deletion of 17p, where TP53 lies.", sourceRef: { source: rubin-8e, chapter: "23", pages: "985" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c026, section: pathogenesis, statement: "The same exposures cause tumors of the renal pelvis, ureter and bladder, which is read as a field effect: the whole urothelium is one continuous target.", sourceRef: { source: rubin-8e, chapter: "23", pages: "979" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c027, section: pathogenesis, statement: "Close to half of patients treated for a renal pelvis or ureter tumor later develop urothelial tumors of the bladder.", sourceRef: { source: rubin-8e, chapter: "23", pages: "979" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c028, section: pathogenesis, statement: "Bladder tumors are far more frequent than tumors of the renal pelvis and ureter, and the large majority of the upper tract tumors are urothelial carcinomas.", sourceRef: { source: rubin-8e, chapter: "23", pages: "979" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c029, section: gross, statement: "Papillary tumors of the bladder favor the lateral and posterior walls.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c030, section: gross, statement: "A low-grade tumor can be a tiny, fragile tuft of papillae that stays on the mucosal surface.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c031, section: gross, statement: "High-grade tumors infiltrate the bladder wall and often ulcerate, forming large solid masses.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c032, section: gross, statement: "Carcinoma in situ appears as flat patches of mucosa resembling red velvet, often several, close to a papillary tumor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c034, section: micro, statement: "PUNLMP is a papilloma with higher cellularity that still lacks the architectural and cytologic atypia of low-grade carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c035, section: micro, statement: "In low-grade papillary carcinoma the papillae are long and delicate, atypia is slight and nuclear pleomorphism is little.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c036, section: micro, statement: "High-grade papillary carcinoma shows mitotic figures in all layers of a disorganized epithelium, with markedly dark, pleomorphic nuclei.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c037, section: micro, statement: "Carcinoma in situ is a flat intraepithelial lesion whose basement membrane is intact with no stromal invasion, and whose cells show atypia and lost polarity through the full thickness of the epithelium.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c038, section: micro, statement: "Invasive urothelial carcinoma can originate in either a papillary tumor or flat carcinoma in situ, and often the first lesion is unknown.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c039, section: micro, statement: "The reference gives carcinoma in situ, rather than a papillary tumor, as the usual precursor of invasive transitional cell carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c040, section: micro, statement: "One in three bladder carcinomas in situ is followed by invasive carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c041, section: micro, statement: "The WHO table lists variants of infiltrating urothelial carcinoma including nested, micropapillary, plasmacytoid and sarcomatoid types, grouped under divergent differentiation.", sourceRef: { source: rubin-8e, chapter: "23", pages: "986" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c042, section: micro, statement: "Compared with the third edition, the fourth-edition noninvasive list adds urothelial proliferation of uncertain malignant potential and urothelial dysplasia/atypia.", sourceRef: { source: rubin-8e, chapter: "23", pages: "986" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c043, section: ancillary, statement: "Cystoscopy with biopsy is used to detect recurrent or progressive disease.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c044, section: ancillary, statement: "Urine cytology and urinalysis for tumor markers are less invasive alternatives to cystoscopy for detecting recurrence.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c045, section: ancillary, statement: "Fluorescence in situ hybridization on cells shed in urine currently screens for 9p21 loss and for aneuploidy of chromosomes 3, 7 and 17 as diagnostic markers.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c046, section: ancillary, statement: "Papillary tumors are graded as PUNLMP and as low-grade or high-grade papillary urothelial carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c047, section: clinical, statement: "Abrupt-onset hematuria is the typical first sign of bladder urothelial carcinoma, and dysuria is less frequent.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c048, section: clinical, statement: "On cystoscopy one or several tumors are seen.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c049, section: clinical, statement: "At diagnosis 85% of bladder tumors are still confined to the bladder, while the other 15% already show regional or distant metastases.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c050, section: clinical, statement: "In renal pelvis and ureter tumors hematuria is reported in 80% of patients.", sourceRef: { source: rubin-8e, chapter: "23", pages: "979" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c051, section: clinical, statement: "In renal pelvis and ureter tumors flank pain is reported in 25% of patients.", sourceRef: { source: rubin-8e, chapter: "23", pages: "979" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c052, section: clinical, statement: "Bone is the least frequent metastatic site, with lung, liver, and regional and periaortic nodes progressively more common.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c053, section: diagnosis, statement: "In the TNM staging system for bladder cancer, the depth of tumor invasion sets the T stage.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c054, section: diagnosis, statement: "T stage Ta means noninvasive papillary carcinoma, Tis means carcinoma in situ, and T1 means invasion of the lamina propria.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988-989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c055, section: diagnosis, statement: "T2 is invasion of the muscularis propria, divided into the inner half (T2a) and the outer half (T2b).", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c056, section: diagnosis, statement: "T3 is invasion of the tissue around the bladder, microscopic in T3a and macroscopic in T3b.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c057, section: diagnosis, statement: "T4 means the tumor has left the bladder: T4a into nearby organs (prostate, seminal vesicles, uterus, vagina, rectum) and T4b into the pelvic or abdominal wall.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c058, section: diagnosis, statement: "N1 is one positive lymph node, N2 is several regional nodes, and N3 is metastasis to the common iliac nodes.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c059, section: diagnosis, statement: "M1a is distant lymph node spread beyond the common iliac nodes, and M1b is distant spread outside the nodes.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c060, section: diagnosis, statement: "Ta, Tis and T1 tumors are the nonmuscle-invasive group, and T2 is the first stage with muscle invasion.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988-989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c062, section: prognosis, statement: "Bulky, multiple, advanced or high-grade tumors, invasion of vessels or lymphatics, and dysplasia or carcinoma in situ at other bladder sites all make extension and recurrence likelier.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c063, section: prognosis, statement: "About half of low-grade papillary carcinomas recur, and 5% to 10% progress.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c064, section: prognosis, statement: "Ten-year survival is above 95% when a low-grade tumor is noninvasive or invades only superficially, however many recurrences occur.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987-988" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c065, section: prognosis, statement: "Once the tumor reaches the muscularis propria, the 5-year survival rate falls sharply.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c066, section: prognosis, statement: "Overall mortality is 25% to 30% when the tumor invades bladder muscle.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c067, section: prognosis, statement: "Nonmuscle-invasive tumors are monitored closely and usually managed conservatively with transurethral resection and fulguration plus intravesical BCG or chemotherapy.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c068, section: prognosis, statement: "Muscle invasion (T2) is the main indication for radical cystectomy, and advanced stage is a rarer one.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c069, section: prognosis, statement: "Distant metastases, extension to nearby organs and uremia from urinary outflow obstruction are the commonest causes of death in bladder cancer.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c070, section: prognosis, statement: "Because concurrent and later urothelial carcinomas are common, ureter or renal pelvis carcinoma is treated with radical nephroureterectomy that removes the whole ureter.", sourceRef: { source: rubin-8e, chapter: "23", pages: "979-980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c072, section: differential, statement: "Benign proliferative and metaplastic urothelial lesions (Brunn nests, cystitis cystica and glandularis, squamous and nephrogenic metaplasia) are not cancer, and nothing indicates that they themselves become malignant.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c073, section: differential, statement: "Urothelial papilloma is a rare benign tumor whose fronds are hard to tell apart from normal urothelium.", sourceRef: { source: rubin-8e, chapter: "23", pages: "986" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c074, section: differential, statement: "Squamous cell bladder carcinoma is often already invasive at first presentation and arises in squamous metaplasia, usually from schistosomiasis.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c075, section: differential, statement: "Most bladder adenocarcinomas are already deeply invasive when first seen, and they arise from urachal remnants or from glandular or intestinal metaplasia of the lining.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c076, section: differential, statement: "Bladder neuroendocrine carcinoma is highly malignant and resembles small cell lung carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c077, section: differential, statement: "Bladder sarcomas are rare, bulky and aggressive, and the most common adult type is leiomyosarcoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "989" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c078, section: high-yield, statement: "Urothelial tumors favor the bladder, where roughly 90% of tumors are urothelial, but can start anywhere between the renal pelvis and the posterior urethra.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c079, section: high-yield, statement: "Main risk factors are pelvic radiation, cyclophosphamide, Schistosoma haematobium, azo and aromatic amine dyes, and smoking.", sourceRef: { source: rubin-8e, chapter: "23", pages: "983-984" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c080, section: high-yield, statement: "Low-grade papillary tumors show 9p loss and MAPK and PI3K mutations, whereas flat carcinoma in situ and invasive tumors add TP53 loss on 17p.", sourceRef: { source: rubin-8e, chapter: "23", pages: "985" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c081, section: high-yield, statement: "The whole urothelium is treated as one target field because upper tract and bladder tumors share causes.", sourceRef: { source: rubin-8e, chapter: "23", pages: "979" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c082, section: high-yield, statement: "Carcinoma in situ is flat and full-thickness with an intact basement membrane, and most invasive carcinomas arise from it.", sourceRef: { source: rubin-8e, chapter: "23", pages: "987" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c083, section: high-yield, statement: "T1 invades lamina propria, T2 invades muscularis propria, and muscle invasion is where radical cystectomy begins.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988-989" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: urothelial-carcinoma-c085, section: high-yield, statement: "Recurrence is followed with cystoscopy, urine cytology and FISH on urine cells.", sourceRef: { source: rubin-8e, chapter: "23", pages: "988" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
