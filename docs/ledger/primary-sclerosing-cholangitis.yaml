entity: primary-sclerosing-cholangitis
claims:
- {claimId: primary-sclerosing-cholangitis-c001, section: definition, statement: "Bile ducts within and outside the liver are slowly closed off by inflammation and scarring of unknown origin, which hampers bile flow", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c002, section: definition, statement: "Men make up about 70% of PSC patients", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c003, section: definition, statement: "The mean age of PSC patients is 40 years", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c004, section: definition, statement: "Roughly 14 of every 100,000 people have PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c005, section: definition, statement: "Cholangitis recurs and obstructive jaundice persists as the bile duct blockage worsens", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c006, section: definition, statement: "PSC eventually leads to secondary biliary cirrhosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c007, section: etiology, statement: "The cause of PSC is unknown", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c008, section: etiology, statement: "Ulcerative colitis coexists in two thirds of PSC patients", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c009, section: etiology, statement: "Crohn disease of the colon is a less common partner of PSC, described in a few cases", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c010, section: etiology, statement: "Riedel struma (a fibrosing variant of chronic thyroiditis), lymphoma and retroperitoneal fibrosis are reported associations of PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c011, section: etiology, statement: "A quarter of PSC cases occur with no other disease present", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c012, section: etiology, statement: "HLA B8 and some other HLA haplotypes are sometimes associated with PSC, which can also occur in families", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c013, section: pathogenesis, statement: "Both inherited and immune mechanisms are thought to play a part in causing PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c014, section: pathogenesis, statement: "Serum gamma globulins are often raised in PSC (hypergammaglobulinemia)", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c015, section: pathogenesis, statement: "Perinuclear ANCA (P-ANCA) are frequently found in PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c016, section: pathogenesis, statement: "T cells are more numerous than normal in the portal tracts in PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c017, section: pathogenesis, statement: "Bacteria crossing a more permeable colon wall may play a role in PSC, but this is unproven", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c018, section: gross, statement: "The same inflammation and fibrosis can block the large bile ducts both inside and outside the liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c019, section: gross, statement: "The same inflammatory process affects the gallbladder wall in PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c020, section: micro, statement: "Like PBC, PSC liver disease is staged in four steps", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c021, section: micro, statement: "In the first, portal stage, the portal tracts show concentric onion-skin fibrosis together with inflammation around the ducts", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c022, section: micro, statement: "In stage 2 (periportal) many bile ducts disappear through obliteration", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c023, section: micro, statement: "In the periportal stage, fibrous septa reach from the portal tracts into the parenchyma", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c024, section: micro, statement: "Stage 3 (septal) is bridging fibrosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c025, section: micro, statement: "Stage 4 is cirrhosis, which is of the secondary biliary type", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c026, section: micro, statement: "A scar is left in the place of a bile duct destroyed in PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c027, section: ancillary, statement: "On contrast radiography the intrahepatic biliary tree looks beaded", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c028, section: ancillary, statement: "Onion-skin fibrosis can ring a bile duct even when the portal tract is only mildly inflamed", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c029, section: ancillary, statement: "On a trichrome stain, the scar that replaces a destroyed bile duct in PSC is visible", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c030, section: clinical, statement: "Patients may present with advanced liver disease or with only abnormal cholestatic liver tests and no symptoms", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c031, section: clinical, statement: "Abscesses can follow infection", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c032, section: diagnosis, statement: "Some patients present with asymptomatic elevation of cholestatic liver tests", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c033, section: diagnosis, statement: "The beaded look of the intrahepatic ducts on contrast radiography reflects the tendency of the disease to be segmental", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c034, section: diagnosis, statement: "Typical clinical features with a normal-looking cholangiogram define small duct PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c035, section: prognosis, statement: "Symptomatic PSC patients survive a median of 8 to 9 years", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c036, section: prognosis, statement: "Asymptomatic PSC patients have a better prognosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c037, section: prognosis, statement: "Up to 20% of PSC patients develop cholangiocarcinoma", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c038, section: prognosis, statement: "Liver transplantation may be curative in PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c039, section: prognosis, statement: "After liver transplantation the disease often returns in the new liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c040, section: differential, statement: "In PBC, 90% to 95% of patients are women", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c041, section: differential, statement: "In PBC the florid duct lesion is a portal-tract bile duct damaged by surrounding inflammation", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c042, section: differential, statement: "PBC is confirmed when two of three criteria are met, and an AMA titer of 1:40 or higher is one of those three criteria (not required, since AMA-negative PBC exists)", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c043, section: differential, statement: "Up to 20% of PSC patients develop cholangiocarcinoma", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c044, section: high-yield, statement: "Ulcerative colitis coexists in two thirds of PSC patients", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c045, section: high-yield, statement: "Early PSC shows concentric onion-skin fibrosis around the bile ducts in the portal tracts", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c046, section: high-yield, statement: "The beaded look of the ducts on contrast radiography reflects the tendency of the disease to be segmental", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c047, section: high-yield, statement: "Up to 20% of PSC patients develop cholangiocarcinoma", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c048, section: high-yield, statement: "PSC usually occurs in men (70%), whereas PBC occurs mostly in women", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c049, section: traps, statement: "PSC usually occurs in men while 90% to 95% of PBC patients are women", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c050, section: traps, statement: "A patient can have the typical picture of PSC yet a cholangiogram that looks normal, which is called small duct PSC", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c051, section: traps, statement: "A quarter of PSC cases occur with no other disease present", sourceRef: {source: rubin-8e, chapter: "20", pages: "871"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c052, section: traps, statement: "After liver transplantation the disease often returns in the new liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: primary-sclerosing-cholangitis-c053, section: mnemonics, statement: "BEADS mnemonic summarizes beaded ducts, extra- and intrahepatic duct involvement, ulcerative colitis association, onion-skin duct fibrosis and secondary biliary cirrhosis, each stated on the cited pages", sourceRef: {source: rubin-8e, chapter: "20", pages: "871-872"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
