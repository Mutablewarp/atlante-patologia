entity: venous-disease
claims:
- {claimId: venous-disease-c001, section: definition, statement: "The saphenous territory is the typical location of varicose veins, which are superficial leg veins that have become dilated and twisting.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c002, section: definition, statement: "DVT means thrombus formation in deep veins, and the legs are the commonest site.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c003, section: definition, statement: "Leg varicosities are frequent in the population, but only a fraction of those affected have symptoms.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c004, section: definition, statement: "Thrombophlebitis is a vein inflamed first and clotted second, a sequence often started by a local bacterial infection.", sourceRef: {source: rubin-8e, chapter: "16", pages: "629"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c005, section: definition, statement: "When a vein clots without any infection or inflammation to initiate it, the condition is called phlebothrombosis.", sourceRef: {source: rubin-8e, chapter: "16", pages: "629"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c006, section: definition, statement: "Only a minority of venous clots are accompanied by inflammation or infection.", sourceRef: {source: rubin-8e, chapter: "16", pages: "629"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c007, section: etiology, statement: "Women are affected more, especially after pregnancy, and heredity, increasing age, obesity and prolonged standing add risk.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c008, section: etiology, statement: "Anything that impedes venous return from the leg, such as heart failure, pelvic tumors or thrombosis of the main thigh or pelvic veins, can cause varices.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c009, section: etiology, statement: "Three drivers of venous thrombosis, which it shares with arterial and cardiac thrombosis, are a prothrombotic blood state, slowed flow and vessel wall injury.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c010, section: etiology, statement: "Blood pools in leg veins during prolonged immobility, as in illness, surgery or travel, and in heart failure.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c011, section: etiology, statement: "Vein wall damage comes with infections, delivery, operations and trauma.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c012, section: etiology, statement: "A prothrombotic state is produced by inherited clotting disorders, malignancy, late pregnancy and exogenous hormones with estrogen effect.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c013, section: etiology, statement: "Among gene variants tied to venous thrombosis, factor V Leiden is seen most.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c014, section: etiology, statement: "Uncommon but strong DVT risk factors are lack of antithrombin, protein S or protein C.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c015, section: etiology, statement: "Hemorrhoids are varices of the anal canal and rectum.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c016, section: etiology, statement: "Venous obstruction by rectal tumors, pregnancy and constipation each promote hemorrhoids.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c017, section: etiology, statement: "Liver cirrhosis is the chief cause of the portal hypertension that leads to varices of the esophagus.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c018, section: pathogenesis, statement: "Valve incompetence and venous dilation reinforce each other, and which of them begins the process is unknown.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c019, section: pathogenesis, statement: "The varicose change progresses along the vein because each failed valve adds load to the segment below it.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c020, section: pathogenesis, statement: "Raised portal pressure swells the connecting channels between portal and systemic veins at the lower end of the esophagus.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c021, section: gross, statement: "Esophageal varices empty after death, so only blue-tinged streaks remain on the mucosa.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c022, section: gross, statement: "A deep vein thrombus usually starts in the calf veins, frequently in the pockets above venous valves.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c023, section: gross, statement: "Deep leg veins hold nearly all venous thrombosis, and when it lies elsewhere the pelvic veins are usually involved.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c024, section: micro, statement: "The wall of a varicose vein is irregular, thin and stretched in some segments and thick in others.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c025, section: micro, statement: "Thickened areas reflect hypertrophied smooth muscle, scar tissue beneath the intima and old thrombi absorbed by the wall.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c026, section: micro, statement: "The valve cusps of a varicose vein curl over and become shorter and thicker.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c027, section: micro, statement: "Venous thrombi can dissolve or organize, and in large organized ones new channels partly restore drainage.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c028, section: ancillary, statement: "The prothrombin G20210A mutation is a common genetic variant that adds only a mild risk of venous thrombosis.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c029, section: clinical, statement: "Varicose leg veins usually matter for appearance only.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c030, section: clinical, statement: "The aching that patients mainly report improves when the legs are raised and worsens on standing.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c031, section: clinical, statement: "Skin drained by severely varicose veins can develop stasis dermatitis.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c032, section: clinical, statement: "Small clots in the calf veins normally cause no symptoms.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c033, section: clinical, statement: "Some patients show Homan sign: calf tenderness when the foot is forced upward.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c034, section: clinical, statement: "Thrombus blocking the femoral or iliac vein congests the leg and turns it blue and swollen.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c035, section: clinical, statement: "Phlegmasia cerulea dolens can follow almost complete obstruction of a limb's veins.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331-332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c036, section: clinical, statement: "Hemorrhoids are prone to bleeding.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c037, section: clinical, statement: "Thrombosis of a hemorrhoid causes severe pain.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c038, section: diagnosis, statement: "Looking at the leg is enough to recognize varicose veins.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c039, section: diagnosis, statement: "Surgery is indicated when the overlying skin ulcerates, or when bleeding occurs on its own or thrombosis spreads widely.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c040, section: diagnosis, statement: "Systemic anticoagulation is the treatment of symptomatic DVT, and some selected patients also get clot-dissolving drugs.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c041, section: diagnosis, statement: "A caval filter can be placed to stop repeated emboli reaching the lungs.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c042, section: prognosis, statement: "Most pulmonary emboli originate in the deep veins of the legs.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c043, section: prognosis, statement: "The iliofemoral veins are where most lethal emboli are formed.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c044, section: prognosis, statement: "Catheters in veins or the pulmonary artery, right heart chambers and the pelvic venous plexus are further embolic sources.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c045, section: prognosis, statement: "In the typical scenario a thrombus formed during bed rest is detached when the patient first rises after surgery, and the patient collapses and dies.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c046, section: prognosis, statement: "Thrombosis always damages venous valves, and long-lasting deep venous insufficiency nearly always follows.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c047, section: prognosis, statement: "Extensive deep venous insufficiency leaves leg skin darkened, puffy and firm, and ulcers above the inner ankle are slow to heal.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c048, section: prognosis, statement: "Clots in the superior mesenteric vein or hepatic veins can be lethal, causing bowel infarction or liver destruction.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c049, section: prognosis, statement: "Bleeding from esophageal varices may be fatal in patients with cirrhosis.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c050, section: differential, statement: "Pieces of large venous thrombi can break off and travel to the lungs as pulmonary emboli.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c051, section: differential, statement: "Portal hypertension is the cause of esophageal varices.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c052, section: differential, statement: "Bleeding from hemorrhoids can be mistaken for bleeding from rectal cancer.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c053, section: high-yield, statement: "Hypercoagulability, stasis and wall injury are the drivers of DVT.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c054, section: high-yield, statement: "Venous thrombosis is almost all in deep leg veins, and pulmonary embolism makes it a hazard to life.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c055, section: high-yield, statement: "Factor V Leiden is the gene variant most often linked to venous thrombosis.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c056, section: high-yield, statement: "Esophageal varices stem from portal hypertension and their hemorrhage may kill.", sourceRef: {source: rubin-8e, chapter: "16", pages: "628"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c057, section: high-yield, statement: "Long-term venous insufficiency almost always follows DVT.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c058, section: traps, statement: "Most venous clots form without any infection or inflammation.", sourceRef: {source: rubin-8e, chapter: "16", pages: "629"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c059, section: traps, statement: "Small calf clots usually give no symptoms.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c060, section: traps, statement: "Leg signs of DVT are present in only some patients who have pulmonary emboli.", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: venous-disease-c061, section: mnemonics, statement: "The mnemonic restates the triad of slowed flow, wall injury and prothrombotic blood behind DVT.", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
