entity: polyarteritis-nodosa
claims:
- {claimId: polyarteritis-nodosa-c001, section: definition, statement: "The disease targets muscular arteries of medium size or smaller, with acute necrotizing inflammation", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c002, section: definition, statement: "Larger arteries are involved occasionally", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c003, section: definition, statement: "Women develop the disease less often than men", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c004, section: etiology, statement: "Wide use of animal-derived antisera and sulfonamides began in the 1940s, when incidence rose strikingly, and the two seemed linked", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c005, section: etiology, statement: "The incidence now seems to be decreasing", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c006, section: etiology, statement: "In people infected with hepatitis B virus, hepatitis C virus or HIV, lesions like those of polyarteritis nodosa may develop", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c007, section: gross, statement: "Thrombosis of diseased arterial segments often leads to infarcts in the organs supplied", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c008, section: gross, statement: "Injury to larger arteries can produce small aneurysms, mostly on branches to the brain, heart and kidney", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c009, section: micro, statement: "In small to medium-sized muscular arteries, the lesion is a patchy focus of fibrinoid necrosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c010, section: micro, statement: "A lesion can circle the whole vessel wall or only a segment of it", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c011, section: micro, statement: "The area is filled by structureless eosinophilic material made of the dead media together with the adjacent tissue", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c012, section: micro, statement: "Acute inflammation surrounds the necrosis, usually involves the whole adventitia (periarteritis) and reaches the deeper wall layers", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c013, section: micro, statement: "The infiltrate varies in composition, with macrophages, plasma cells, lymphocytes and neutrophils, and eosinophils may be prominent", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c014, section: micro, statement: "Many lesions begin to repair over time, especially likely with corticosteroid treatment", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c015, section: micro, statement: "Once necrotic tissue and exudate are resorbed, the healed vessel has a fibrotic media and gaps in the elastic laminae", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c016, section: ancillary, statement: "Microscopically the lesion is fibrinoid necrosis of the arterial wall with surrounding acute inflammation", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c017, section: ancillary, statement: "The necrotic material is positive on fibrin stains", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c018, section: ancillary, statement: "Healed segments show medial fibrosis and gaps in the elastic laminae", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c019, section: clinical, statement: "The clinical picture varies with which organs the lesions reach", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c020, section: clinical, statement: "Kidneys and heart are common targets, as are skin, mesentery and skeletal muscle", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c021, section: clinical, statement: "Lesions can occur almost anywhere, for example in the bowel, brain or liver", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c022, section: clinical, statement: "Patients often have fever and weight loss", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c023, section: prognosis, statement: "Untreated polyarteritis nodosa was usually fatal", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c024, section: prognosis, statement: "Remission or cure is usual with treatment that suppresses inflammation and immunity, such as corticosteroids and cyclophosphamide", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c025, section: prognosis, statement: "Fatal hemorrhage can follow if an aneurysm ruptures in a critical site", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c026, section: differential, statement: "In microscopic polyangiitis (systemic hypersensitivity angiitis) only the smallest arteries and arterioles are involved, not larger vessels", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c027, section: differential, statement: "The feared complication of microscopic polyangiitis is renal failure from rapidly progressive glomerulonephritis", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c028, section: differential, statement: "Microscopic polyangiitis shows a strong association with P-ANCA", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c029, section: differential, statement: "In cutaneous vasculitis, venules of the superficial skin show acute inflammation and fibrinoid necrosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c030, section: differential, statement: "Cutaneous vasculitis is generally self-limited, and its typical sign is palpable purpura, largely on the legs", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c031, section: differential, statement: "In giant cell arteritis the temporal artery is the most frequent site, with granulomatous inflammation and giant cells", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c032, section: differential, statement: "Giant cell arteritis is a disease of older people and is rare in the young", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c033, section: high-yield, statement: "Muscular arteries of medium size or smaller are the targets, and larger ones are involved only occasionally", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c034, section: high-yield, statement: "The characteristic lesion is patchy fibrinoid necrosis with periarteritis", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c035, section: high-yield, statement: "Thrombosis causes organ infarcts and small aneurysms may rupture", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c036, section: high-yield, statement: "Polyarteritis nodosa-like lesions may complicate hepatitis B, hepatitis C and HIV infection", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c037, section: high-yield, statement: "Kidneys, heart, skeletal muscle, skin and mesentery are most often involved; fever and weight loss are common", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c038, section: high-yield, statement: "Without treatment the disease was usually fatal; corticosteroids with cyclophosphamide usually induce remission", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c039, section: traps, statement: "Larger arteries are sometimes involved as well, besides the medium-sized and smaller muscular arteries", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c040, section: traps, statement: "Only the smallest arteries and arterioles are affected in microscopic polyangiitis, which is strongly tied to P-ANCA", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c041, section: traps, statement: "The wall can be involved all round or in only part of its circumference", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c042, section: traps, statement: "Hepatitis C and HIV, like hepatitis B, can bring polyarteritis nodosa-like lesions", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c043, section: traps, statement: "Untreated disease was usually fatal, while corticosteroids and cyclophosphamide usually induce remission or cure", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: polyarteritis-nodosa-c044, section: mnemonics, statement: "Key features: patchy fibrinoid necrosis, medium-sized arteries, necrotizing inflammation", sourceRef: {source: rubin-8e, chapter: "16", pages: "619"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
