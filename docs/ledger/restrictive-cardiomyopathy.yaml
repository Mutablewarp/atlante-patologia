entity: restrictive-cardiomyopathy
claims:
  - { claimId: restrictive-cardiomyopathy-c001, section: definition, statement: "RCM covers diseases that stiffen the ventricles and impair filling, while wall thickness and contraction stay essentially normal.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c002, section: definition, statement: "Of all the cardiomyopathies, RCM is the rarest.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c003, section: definition, statement: "Between 2% and 5% of cardiomyopathies in children are restrictive.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c004, section: definition, statement: "Death and disability from RCM come mainly from heart failure, and the death rate is high.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c005, section: definition, statement: "The section heading and text frame RCM as impaired diastolic function: relaxation and filling fail while ejection is kept.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c006, section: etiology, statement: "In primary (idiopathic) RCM, gene mutations or other defects change the mechanical behavior of myocytes and so disturb diastole.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c007, section: etiology, statement: "MYH7 (myosin heavy chain) and TNNI3 (troponin I) are sarcomeric genes shared by RCM, HCM and DCM, and the ones mutated most often in RCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c008, section: etiology, statement: "In the secondary forms, impaired filling is due to something other than the contractile proteins.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c009, section: etiology, statement: "Secondary RCM can be caused by amyloid or metastatic carcinoma deposited between the myocytes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c010, section: etiology, statement: "Secondary RCM can arise from endomyocardial disease, where scarring of the endocardium stiffens and thickens it.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c011, section: etiology, statement: "Myocytes that fill with iron in hemochromatosis produce restrictive physiology.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c012, section: etiology, statement: "Desmin-related cardiomyopathy can produce restrictive physiology; its myocytes contain clumps of misfolded desmin.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c013, section: etiology, statement: "Diastolic function is also impaired in cardiac sarcoidosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c014, section: etiology, statement: "In Pompe disease, glycogen storage disease type II, the heart disease is of restrictive type.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c015, section: etiology, statement: "Immunoglobulin light chains (AL, primary) and transthyretin (ATTR) are the two proteins that make up nearly all cardiac amyloid.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c016, section: etiology, statement: "The transthyretin in cardiac ATTR is either the normal (wild-type) protein or a variant coded by the TTR gene.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c017, section: pathogenesis, statement: "Diastole, but presumably not systole, is altered by the sarcomeric gene variants that many primary RCM patients carry.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685-686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c018, section: pathogenesis, statement: "In secondary RCM the genetic machinery of contraction is not the issue; other components of the myocardium are.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c019, section: pathogenesis, statement: "A noncompliant ventricle fills poorly and relies on preload, while the atria enlarge and blood congests in the veins.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c020, section: pathogenesis, statement: "AL amyloidosis is acquired, not inherited: a clone of plasma cells makes the light chains.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c021, section: pathogenesis, statement: "Free light chains are directly toxic to myocytes: lysosomal damage leads to reactive oxygen species and cell death.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c022, section: pathogenesis, statement: "Misfolded desmin aggregates in ventricular myocytes are thought to alter the myocardium's mechanical behavior and hinder relaxation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c023, section: pathogenesis, statement: "Endomyocardial disease evolves through necrotic, thrombotic and fibrotic stages.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c024, section: pathogenesis, statement: "Early on, eosinophils flood the inner layers of the myocardium, with vessel injury and myocyte necrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c025, section: pathogenesis, statement: "About a year into the illness the damaged endocardium collects thrombi, and these may embolize.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c026, section: pathogenesis, statement: "Diastolic dysfunction in the chronic stage arises because a markedly thickened, fibrotic endocardium makes the ventricle less compliant.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c027, section: pathogenesis, statement: "Damage from toxic components of eosinophil granules may be behind both the tropical fibrosis and Löffler endocarditis, which are probably a single process.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c028, section: gross, statement: "Thick, firm walls without ventricular dilation mark the enlarged heart of amyloidosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c029, section: gross, statement: "In endomyocardial disease, pale thickened endocardium runs between the left ventricular apex and the posterior mitral leaflet.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c030, section: gross, statement: "The inner third to half of the wall thickness is occupied by fibrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c031, section: gross, statement: "Thrombi attached to the wall, at different stages of organization, can be found.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c032, section: gross, statement: "Dilated chambers with thick ventricular walls are the gross picture of cardiac hemochromatosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c033, section: gross, statement: "In LVNC, mainly at the apex, thick trabeculae and deep recesses invade the wall that should be compact.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c034, section: gross, statement: "LVNC can stand alone, often regarded as a cardiomyopathy, and it is also seen in several congenital heart diseases.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c035, section: micro, statement: "Primary RCM myocardium looks nearly normal and does not explain the stiff diastole.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c036, section: micro, statement: "The heaviest amyloid deposits lie in the interstitium and around vessels.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c037, section: micro, statement: "Amyloid often lodges in the walls of small coronary arteries within the myocardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c038, section: micro, statement: "Misfolded desmin filaments clump into aggregates inside ventricular myocytes in desmin-related disease.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c039, section: micro, statement: "Only few elastic fibers are present in the scarred endocardium of endomyocardial disease.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c040, section: micro, statement: "Iron is deposited within cardiac myocytes in hemochromatosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c041, section: micro, statement: "Large glycogen stores vacuolate the myocytes of Pompe disease.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c042, section: ancillary, statement: "In primary RCM a ventricular biopsy may show nothing or, at most, mild interstitial fibrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c043, section: ancillary, statement: "Congo red colors amyloid deposits between the myocytes red.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c044, section: ancillary, statement: "Amyloid fibrils appear green and birefringent when the section is viewed in polarized light.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c045, section: ancillary, statement: "Mass spectrometry on heart biopsy tells AL from ATTR, which look similar on histology.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c046, section: clinical, statement: "AL or ATTR cardiac amyloidosis usually presents between ages 60 and 80.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c047, section: clinical, statement: "Cardiac amyloidosis first looks like RCM because diastolic function worsens; systolic function fails only later.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c048, section: clinical, statement: "ATTR may underlie some cases of heart failure with preserved ejection fraction.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c049, section: clinical, statement: "At autopsy, elderly people often show wild-type ATTR in heart and vessels, which usually caused no symptoms during life.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c050, section: clinical, statement: "This senile form is able to cause restrictive physiology.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c051, section: clinical, statement: "Amyloid that widely infiltrates the conduction system can lead to heart block and arrhythmias.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c052, section: clinical, statement: "Endomyocardial fibrosis is common in equatorial Africa, with only occasional cases elsewhere in the tropics and subtropics.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c053, section: clinical, statement: "The restrictive physiology of endomyocardial fibrosis ends in heart failure and arrhythmias.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c054, section: clinical, statement: "Very high eosinophil counts characterize Löffler endocarditis, a disease of temperate climates.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c055, section: clinical, statement: "Most Löffler endocarditis patients are men, and a rash often accompanies the disease.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c056, section: clinical, statement: "Desmin is present in other muscle types too, so desmin mutations can also weaken skeletal muscle and disturb breathing and digestion, besides affecting the heart.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c057, section: clinical, statement: "Cardiac failure usually kills infants with Pompe disease, whose hearts are many times the normal size.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c058, section: clinical, statement: "Iron in the heart can weaken both contraction and filling, so it behaves partly like DCM and partly like RCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c059, section: clinical, statement: "LVNC can cause pump failure and rhythm disturbances up to complete heart block.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687-688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c060, section: diagnosis, statement: "In symptomatic amyloid heart disease the ejection fraction on echo is near normal in early stages, while the left ventricle is concentrically thickened.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c061, section: diagnosis, statement: "Stiff ventricular walls lead to common atrial enlargement in cardiac amyloid.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c062, section: diagnosis, statement: "Low QRS voltage on the ECG is a typical finding in cardiac amyloid.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c063, section: diagnosis, statement: "LVNC can be picked up by echo in people who have no symptoms.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c064, section: prognosis, statement: "Outcomes are worse when a patient shows features of both RCM and HCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c065, section: prognosis, statement: "Recent advances have markedly improved the outlook of cardiac amyloid, which is still poor once symptoms appear.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c066, section: prognosis, statement: "AL treatment targets the plasma cell disorder that produces the light chains.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c067, section: prognosis, statement: "Newer ATTR options are drugs that stabilize transthyretin and gene silencing that lowers its production by the liver.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c068, section: prognosis, statement: "Heart failure and death are the usual course of Löffler endocarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c069, section: prognosis, statement: "Survival in Löffler endocarditis may be better with corticosteroids.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c070, section: prognosis, statement: "In the chronic stage, scarred mitral and tricuspid valves can leak, which also enlarges the atria.", sourceRef: { source: rubin-8e, chapter: "17", pages: "687" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c071, section: differential, statement: "Constrictive pericarditis has hemodynamics like secondary RCM, so the two are easily confused.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c072, section: differential, statement: "Hypertrophy with myofiber disarray is the structural change of HCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c073, section: differential, statement: "Ventricular dilatation marks DCM, while wall thickness is normal in RCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c074, section: differential, statement: "Fibrofatty tissue takes the place of myocardium in arrhythmogenic cardiomyopathy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c075, section: differential, statement: "Vacuolated myocytes suggest a storage disease that mimics a primary cardiomyopathy, and the vacuole content (for example glycogen with PRKAG2) identifies which.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c076, section: high-yield, statement: "RCM is a diastolic problem: the ventricle is stiff, while contraction and wall thickness are essentially normal.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c077, section: high-yield, statement: "In the primary form sarcomeric genes (MYH7, TNNI3) are commonly implicated and structural change is minimal.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c078, section: high-yield, statement: "Amyloid, endomyocardial disease, iron, desmin aggregates, sarcoidosis and Pompe disease are secondary causes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686-688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c079, section: high-yield, statement: "Congo red with green birefringence identifies amyloid, and mass spectrometry distinguishes AL from ATTR.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c080, section: high-yield, statement: "Cardiac amyloid is typified by low QRS voltage on ECG together with concentric ventricular thickening on echo.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c081, section: traps, statement: "In primary RCM the myocardium is nearly unchanged although diastole is abnormal, so a biopsy can be normal.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c082, section: traps, statement: "RCM keeps systolic function normal or near normal; the abnormality lies in diastolic filling.", sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c083, section: traps, statement: "Constrictive pericarditis has hemodynamics like secondary RCM, and clinicians may struggle to tell them apart.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: restrictive-cardiomyopathy-c084, section: traps, statement: "Vacuolated cardiac myocytes indicate a storage disease and not a true primary cardiomyopathy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "688" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
