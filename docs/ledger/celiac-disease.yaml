entity: celiac-disease
claims:
- {claimId: celiac-disease-c001, section: definition, statement: "Gluten from wheat, rye and barley provokes an immune reaction in people with a susceptible genotype, and absorption suffers", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c002, section: definition, statement: "Among the gluten proteins, gliadin appears to be the main one responsible", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c003, section: definition, statement: "A notable share of people with type 1 diabetes also have celiac disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c004, section: etiology, statement: "Family studies first showed a genetic basis for the disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c005, section: etiology, statement: "Nearly all patients carry the class II HLA alleles DQ2 or DQ8", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c006, section: etiology, statement: "Lacking both DQ2 and DQ8 makes the diagnosis very unlikely, and carrying them does not by itself cause disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c007, section: etiology, statement: "Environmental factors other than gluten may contribute", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c008, section: pathogenesis, statement: "Antigen-presenting cells carrying DQ2 or DQ8 show altered gliadin pieces to T cells, which activates the T cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c009, section: pathogenesis, statement: "Activated T cells in the mucosa injure it through the cytokines they release", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c010, section: pathogenesis, statement: "Complement activation from deposited antigen-antibody complexes may be a further cause of injury", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c011, section: pathogenesis, statement: "The circulating antibodies detected by serologic tests are secreted by B cells with help from activated T cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c012, section: micro, statement: "Villous change varies in degree, and the mucosa is more inflamed, with extra IELs", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c013, section: micro, statement: "The most severe cases pair crypt hyperplasia with villi that are totally or almost totally atrophic", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c014, section: micro, statement: "Injury to the surface epithelium leaves its cells without a brush border", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c015, section: micro, statement: "Crypts deepen and villi shrink because epithelial cells die early and crypt mitoses rise to replace them", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c016, section: micro, statement: "At one extreme the only change is extra IELs concentrated at the villus tips; at the other the mucosa is flat, with intermediate grades between", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c017, section: micro, statement: "The distal ileum is seldom affected, while changes are strongest in the proximal small bowel", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c018, section: micro, statement: "Patients with celiac disease essentially always have an increased number of intraepithelial lymphocytes", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c019, section: micro, statement: "A raised intraepithelial lymphocyte count also occurs with NSAID use and H. pylori gastritis, so it does not point to celiac disease alone", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c020, section: ancillary, statement: "On histology the pathologist looks for more intraepithelial lymphocytes, shortened villi and hyperplastic deeper crypts", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c021, section: ancillary, statement: "Tissue transglutaminase antibody is now the serologic test of choice", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c022, section: ancillary, statement: "Antiendomysial antibody is the other important serologic test", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c023, section: ancillary, statement: "Antigliadin antibody lags well behind tTG and antiendomysial antibody in both sensitivity and specificity", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c024, section: clinical, statement: "Typical complaints are diarrhea and abdominal discomfort", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c025, section: clinical, statement: "Steatorrhea belongs to more advanced disease, in which fat absorption has become more difficult", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c026, section: clinical, statement: "Bacterial action on the lipid gives the stool an offensive odor, and its high fat content makes it tend to float", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c027, section: clinical, statement: "Severe malnutrition in late disease appears as edema from low albumin plus weight and muscle loss", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c028, section: clinical, statement: "Advanced disease can leave a patient short compared with siblings and can cause osteoporosis", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c029, section: clinical, statement: "With better diagnosis and treatment, the classic findings are seen less and less often", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c030, section: clinical, statement: "Iron-deficiency anemia resistant to oral iron may be the only sign, or the patient may have no symptoms", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c031, section: diagnosis, statement: "No single kind of evidence is enough: clinical, serologic and histologic findings must be combined", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c032, section: diagnosis, statement: "Diet change is known to produce a placebo effect, so improvement on a new diet does not prove the diagnosis", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c033, section: prognosis, statement: "A gluten-free diet usually treats the disease effectively", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c034, section: prognosis, statement: "Because gluten is ubiquitous in food, keeping to the diet can be difficult", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c035, section: prognosis, statement: "Long-standing disease carries a higher risk of small-bowel adenocarcinoma and of enteropathy-associated T-cell lymphoma, a primary intestinal T-cell lymphoma", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c036, section: prognosis, statement: "The exact magnitude of the lymphoma and adenocarcinoma risk is unclear", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c037, section: differential, statement: "Tropical sprue is a chronic malabsorption disorder restricted to particular geographic regions", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c038, section: differential, statement: "Tropical sprue often affects the entire small bowel down to the ileum", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c039, section: differential, statement: "In tropical sprue the IELs are found mainly in the crypts rather than at the villus tips", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c040, section: differential, statement: "Antibiotics alleviate tropical sprue", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c041, section: differential, statement: "Autoimmune enteropathy has circulating antibodies against intestinal epithelial cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c042, section: differential, statement: "Autoimmune enteropathy usually loses goblet and Paneth cells, and its IELs are less prominent than in celiac disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c043, section: differential, statement: "Autoimmune enteropathy often involves stomach and colon as well as the small intestine", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c044, section: differential, statement: "Autoimmune enteropathy requires immunosuppressant medication, and restricting gluten does not help", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c045, section: differential, statement: "Whipple disease is caused by Tropheryma whippelii; bacteria-laden macrophages with foamy cytoplasm enlarge the villi", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c046, section: differential, statement: "The foamy macrophages of Whipple disease are strongly PAS positive; specific PCR is replacing this method of diagnosis", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c047, section: differential, statement: "Most cases of small-bowel bacterial overgrowth follow poor gut motility, which lets colon-type anaerobes multiply", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c048, section: differential, statement: "Overgrowth is diagnosed with a breath test measuring hydrogen and methane", sourceRef: {source: rubin-8e, chapter: "19", pages: "801"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c049, section: high-yield, statement: "Nearly all patients carry DQ2 or DQ8; with neither allele the disease is very unlikely", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c050, section: high-yield, statement: "Gliadin, a protein of gluten, appears to be the main trigger", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c051, section: high-yield, statement: "Histology shows more IELs, crypt hyperplasia and, in marked cases, villous atrophy, mainly in the proximal small bowel", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c052, section: high-yield, statement: "Anti-tTG antibody is the serologic test of choice", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c053, section: high-yield, statement: "In some patients the sole sign is iron-deficiency anemia that oral iron fails to correct", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c054, section: high-yield, statement: "Late complications of the disease are EATL and adenocarcinoma of the small bowel", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c055, section: traps, statement: "NSAIDs and H. pylori gastritis also raise IELs, though nearly every celiac patient has an increase, so IELs are not diagnostic alone", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c056, section: traps, statement: "Having DQ2 or DQ8 does not guarantee celiac disease, while having neither makes it very unlikely", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c057, section: traps, statement: "Diet change is known to cause a placebo effect, so improvement on a gluten-free diet is not proof", sourceRef: {source: rubin-8e, chapter: "19", pages: "800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c058, section: traps, statement: "Antigliadin antibody lags behind tTG and antiendomysial antibody in sensitivity and specificity", sourceRef: {source: rubin-8e, chapter: "19", pages: "799"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: celiac-disease-c059, section: mnemonics, statement: "Flat villi, intraepithelial lymphocytes, anti-tTG antibody and T-cell lymphoma risk are key features of celiac disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "799-800"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
