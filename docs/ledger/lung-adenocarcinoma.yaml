entity: lung-adenocarcinoma
claims:
- {claimId: lung-adenocarcinoma-c001, section: definition, statement: "In most countries adenocarcinoma is now the top lung cancer subtype, ahead of squamous cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c002, section: definition, statement: "Of invasive lung malignancies in the United States, 36% are adenocarcinomas.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c003, section: definition, statement: "Adenocarcinoma is more common in women than in men.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c004, section: definition, statement: "The usual site of the tumor is the lung periphery.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c005, section: definition, statement: "Five distinct entities had been grouped under the name bronchioloalveolar carcinoma, so the term was dropped from the revised classification.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c006, section: definition, statement: "Pathologists no longer use mixed subtype adenocarcinoma as a diagnosis.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c007, section: etiology, statement: "Among nonsmokers, no lung cancer type is more common than adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c008, section: etiology, statement: "Scars beside the tumor are a desmoplastic reaction to it; the tumor does not arise from earlier tuberculosis or infarct scars, as was once believed.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c009, section: pathogenesis, statement: "Atypical adenomatous hyperplasia is a lesion that probably gives rise to adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c010, section: pathogenesis, statement: "In AAH atypical epithelial cells proliferate along the alveolar septa, forming a well-demarcated lesion usually under 5 mm.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c011, section: pathogenesis, statement: "Invasive adenocarcinoma is thought to follow AAH and AIS in steps, a route parallel to the colonic adenoma-carcinoma sequence.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c012, section: pathogenesis, statement: "More advanced lesions carry more accumulated mutations, which supports the sequence.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c013, section: pathogenesis, statement: "Whether every AAH focus progresses, and whether every adenocarcinoma follows this route, remains unsettled.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c014, section: gross, statement: "The pleura over a peripheral tumor may pucker, because of the pleural fibrosis and subpleural scars that often accompany it.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c015, section: gross, statement: "Some invasive adenocarcinomas grow large enough to replace a whole lobe, but most are irregular masses of 2 to 5 cm.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c016, section: gross, statement: "The cut surface of a nonmucinous tumor is grayish white.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c017, section: gross, statement: "Depending on how much mucin it makes, a mucinous tumor looks shiny or jelly-like on the cut surface.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c018, section: gross, statement: "A tumor in the central lung may invade bronchial cartilage, growing mostly within the bronchial lumen.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c019, section: gross, statement: "AIS and MIA are 3 cm or smaller; their tan, vague outline can blend into adjacent lung.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c020, section: micro, statement: "AIS is lepidic growth: the tumor cells spread only over alveolar walls that were already there, without invasion.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c021, section: micro, statement: "MIA is a lepidic tumor with invasive foci of 5 mm or less, no necrosis and no pleural or lymphovascular invasion.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c022, section: micro, statement: "Most AIS and MIA lack mucin, and their cells are club cells, type II pneumocytes or both.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c023, section: micro, statement: "Cuboidal tumor cells line the alveolar walls when the tumor is nonmucinous.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c024, section: micro, statement: "In the rare mucinous AIS and MIA, the columnar cells carry mucin in the apical cytoplasm.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c025, section: micro, statement: "With a mucinous tumor, a metastasis from elsewhere must be ruled out.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754, 756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c026, section: micro, statement: "Only about 5% of adenocarcinomas are AIS or MIA; most are invasive.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c027, section: micro, statement: "A typical invasive tumor is a mix of several growth patterns, not a uniform lesion.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c028, section: micro, statement: "Classification depends on which pattern predominates: lepidic, acinar, papillary, micropapillary or solid.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c029, section: micro, statement: "No category of invasive adenocarcinoma is commoner than the acinar-predominant one.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c030, section: micro, statement: "In a lepidic-predominant tumor the invasive carcinoma is mainly made of lepidic growth.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c031, section: micro, statement: "Acinar growth makes glands of regular shape, formed by cuboidal or columnar cells.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c032, section: micro, statement: "In papillary adenocarcinoma, one layer of tumor cells covers fibrovascular cores.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c033, section: micro, statement: "Without a fibrovascular core, the small tufts of micropapillary tumor cells can look suspended in spaces.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c034, section: micro, statement: "A solid-pattern adenocarcinoma is poorly differentiated; it makes mucin, expresses TTF-1, or both.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c035, section: micro, statement: "In invasive mucinous adenocarcinoma the apical cytoplasm of tall columnar cells holds mucin.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c036, section: ancillary, statement: "In a fully removed adenocarcinoma, the dominant growth pattern is what predicts prognosis.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c037, section: ancillary, statement: "Invasive tumors are classified by the growth pattern that predominates on histologic examination.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c038, section: ancillary, statement: "TTF-1 is a pneumocyte immunohistochemical marker that supports adenocarcinoma in a solid tumor.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c039, section: ancillary, statement: "Mucicarmine or PAS with diastase digestion can detect mucin in a solid tumor.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c040, section: clinical, statement: "Adenocarcinoma is more common in women and is the most common type in nonsmokers.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c041, section: diagnosis, statement: "On imaging, either AIS or MIA can present as several nodules, or as one peripheral nodule that looks like ground glass.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c042, section: diagnosis, statement: "A small solid component may be seen in MIA, whereas AIS is pure ground glass.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c043, section: diagnosis, statement: "Solid adenocarcinoma is separated from large cell carcinoma by TTF-1 positivity, mucin on special stains, or both.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c044, section: prognosis, statement: "The predominant histologic subtype predicts outcome once the tumor has been completely resected.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c045, section: prognosis, statement: "Survival at 5 years is 100% once AIS has been resected.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c046, section: prognosis, statement: "MIA has the same favorable prognosis as AIS.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c047, section: prognosis, statement: "Stage I lepidic-predominant adenocarcinoma has 5-year disease-free survival above 90%.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c048, section: prognosis, statement: "In stage I disease, acinar and papillary patterns fall in the middle, with 5-year disease-free survival of 80% to 90%.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c049, section: prognosis, statement: "In stage I disease, 5-year disease-free survival is lowest, at 60% to 80%, for solid and micropapillary patterns.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c050, section: differential, statement: "AAH is a small, well-demarcated precursor lesion, usually under 5 mm.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c051, section: differential, statement: "AIS shows purely lepidic growth without invasion.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c052, section: differential, statement: "MIA is lepidic growth with an invasive focus of 5 mm or less and no necrosis.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c053, section: differential, statement: "Large cell carcinoma is diagnosed only after exclusion: it lacks TTF-1, p40, mucin and any squamous or glandular differentiation, and is poorly differentiated.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c054, section: differential, statement: "A mucinous tumor requires exclusion of metastasis from another site.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754, 756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c055, section: high-yield, statement: "AAH is the putative precursor of lung adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c056, section: high-yield, statement: "AIS is purely lepidic and non-invasive.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c057, section: high-yield, statement: "MIA has invasion of 5 mm or less and the same favorable prognosis as AIS.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c058, section: high-yield, statement: "Invasive tumors are named by predominant pattern: lepidic, acinar, papillary, micropapillary, solid.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c059, section: high-yield, statement: "Acinar is the most common predominant pattern.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c060, section: high-yield, statement: "In stage I, lepidic-predominant has the best outcome and solid and micropapillary the worst.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c061, section: high-yield, statement: "TTF-1 and mucin stains separate solid adenocarcinoma from large cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c062, section: traps, statement: "Five distinct entities were hidden under the name bronchioloalveolar carcinoma, so it was dropped.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c063, section: traps, statement: "Scars beside the tumor are a desmoplastic response to it, not its cause.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c064, section: traps, statement: "In nonsmokers adenocarcinoma is the leading type.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c065, section: traps, statement: "A small invasive focus in a lepidic tumor (MIA) does not worsen prognosis relative to AIS.", sourceRef: {source: rubin-8e, chapter: "18", pages: "754"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c066, section: traps, statement: "A poorly differentiated solid tumor with TTF-1 or mucin is solid adenocarcinoma, not large cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-adenocarcinoma-c067, section: mnemonics, statement: "Mnemonic LAPSM orders the patterns from best to worst stage I outcome: lepidic, acinar, papillary, then solid and micropapillary.", sourceRef: {source: rubin-8e, chapter: "18", pages: "756"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
