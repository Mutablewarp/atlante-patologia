entity: portal-hypertension
claims:
- {claimId: portal-hypertension-c001, section: definition, statement: "Portal vein pressure goes up when an obstacle to flow sits anywhere along the portal route", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c004, section: definition, statement: "Collateral routes to the systemic veins open under high portal pressure, the spleen swells, and kidneys and lungs may be harmed", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c005, section: etiology, statement: "The raised resistance to portal flow can be located before, within or after the sinusoids", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c006, section: etiology, statement: "Cirrhosis is the commonest setting of portal vein thrombosis, a presinusoidal cause; tumors and infections also cause it", sourceRef: {source: rubin-8e, chapter: "20", pages: "853"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c008, section: etiology, statement: "Cirrhosis, a sinusoidal cause, accounts for more cases of portal hypertension in Western countries than any other disease", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c009, section: etiology, statement: "Budd-Chiari syndrome, thrombotic occlusion of the hepatic veins, gives postsinusoidal portal hypertension", sourceRef: {source: rubin-8e, chapter: "20", pages: "851-852"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c013, section: pathogenesis, statement: "Contraction of stellate cells and vascular smooth muscle raises resistance to portal inflow before fibrosis has formed", sourceRef: {source: rubin-8e, chapter: "20", pages: "852"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c014, section: pathogenesis, statement: "Later, regenerative nodules squeeze the hepatic veins and scarring of the portal tracts chokes small portal venules, blocking flow through the cirrhotic liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "852"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c016, section: pathogenesis, statement: "Portal resistance is already rising when dilated mesenteric arteries add to the blood entering the portal vein", sourceRef: {source: rubin-8e, chapter: "20", pages: "852"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c017, section: pathogenesis, statement: "Low effective arterial blood volume drives advanced portal hypertension, producing the hepatorenal and hepatopulmonary syndromes and ascites", sourceRef: {source: rubin-8e, chapter: "20", pages: "852"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c018, section: pathogenesis, statement: "Rising renin-angiotensin, sympathetic and antidiuretic hormone activity, which defends arterial pressure when effective volume is low, makes the kidney retain sodium and water", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c019, section: pathogenesis, statement: "Fluid is driven into the peritoneal cavity as ascites where high sinusoidal pressure combines with low albumin synthesis, which lowers oncotic pressure", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c021, section: gross, statement: "In acute hepatic vein thrombosis the liver is enlarged and tight, and the cut surface is blotchy and bleeds", sourceRef: {source: rubin-8e, chapter: "20", pages: "853"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c023, section: gross, statement: "A firm, enlarged portal hypertensive spleen is deep red throughout its cut surface", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c024, section: gross, statement: "Esophageal varices are widened submucosal collateral veins of the lower esophagus that bulge inward", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c027, section: micro, statement: "In acute Budd-Chiari syndrome, centrilobular hepatocytes die and the nearby sinusoids balloon with trapped red cells", sourceRef: {source: rubin-8e, chapter: "20", pages: "854"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c028, section: micro, statement: "In long-standing venous congestion, connective tissue septa link adjacent central zones into nodules around a single portal tract, called reverse lobulation", sourceRef: {source: rubin-8e, chapter: "20", pages: "854"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c032, section: clinical, statement: "Varices bleed, at times massively, into the upper gastrointestinal tract, and they are the complication of portal hypertension that matters most", sourceRef: {source: rubin-8e, chapter: "20", pages: "854"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c033, section: clinical, statement: "As the spleen enlarges progressively, hypersplenism with pancytopenia often develops", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c034, section: clinical, statement: "In ascites the abdomen distends because fluid, often many liters, accumulates in the peritoneal cavity", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c035, section: clinical, statement: "Ascitic fluid in spontaneous bacterial peritonitis is infected by gut bacteria that translocate, most commonly Escherichia coli and Klebsiella", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c037, section: clinical, statement: "Hepatorenal syndrome arises mostly in cirrhosis; underperfused kidneys make little urine while creatinine and nitrogenous waste accumulate", sourceRef: {source: rubin-8e, chapter: "20", pages: "856"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c039, section: clinical, statement: "Chest radiographs are typically normal in hepatopulmonary syndrome despite progressive dyspnea caused by intrapulmonary shunts", sourceRef: {source: rubin-8e, chapter: "20", pages: "856"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c041, section: diagnosis, statement: "A balloon catheter advanced from the jugular vein into a hepatic vein yields the free and wedged pressures, and the HVPG is wedged minus free hepatic vein pressure", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c042, section: diagnosis, statement: "In postsinusoidal block the HVPG is usually normal, while sinusoidal block usually raises it", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c044, section: diagnosis, statement: "In ascites caused by cirrhotic portal hypertension the serum-ascites albumin gradient is above 1.1", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c045, section: diagnosis, statement: "Spontaneous bacterial peritonitis is diagnosed when ascitic fluid contains over 250 neutrophils/μL", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c046, section: diagnosis, statement: "Hepatorenal syndrome requires creatinine above 1.5 mg/dL that persists after diuretics are stopped and volume is restored", sourceRef: {source: rubin-8e, chapter: "20", pages: "856"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c047, section: prognosis, statement: "Deaths in the acute phase of esophageal variceal bleeding can reach 40 percent", sourceRef: {source: rubin-8e, chapter: "20", pages: "855"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c054, section: prognosis, statement: "The kidney dysfunction of hepatorenal syndrome is reversible, and kidney function is restored once the liver is transplanted", sourceRef: {source: rubin-8e, chapter: "20", pages: "856"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c056, section: prognosis, statement: "Only transplanting the liver effectively treats hepatopulmonary syndrome, since it abolishes the shunting in the lungs", sourceRef: {source: rubin-8e, chapter: "20", pages: "856"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c058, section: differential, statement: "Cirrhosis obstructs the sinusoids and is the usual Western cause of portal hypertension", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c059, section: differential, statement: "Portal vein thrombosis causes presinusoidal portal hypertension", sourceRef: {source: rubin-8e, chapter: "20", pages: "853"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c060, section: differential, statement: "Congestive heart failure back-pressure can mimic Budd-Chiari syndrome and causes postsinusoidal portal hypertension", sourceRef: {source: rubin-8e, chapter: "20", pages: "851, 853"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c062, section: high-yield, statement: "Resistance to portal flow can be presinusoidal, sinusoidal or postsinusoidal", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c064, section: high-yield, statement: "Budd-Chiari syndrome is hepatic vein thrombosis and typically gives ascites, with common splenomegaly", sourceRef: {source: rubin-8e, chapter: "20", pages: "853-854"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c065, section: high-yield, statement: "Esophageal varices rank first among the complications of portal hypertension", sourceRef: {source: rubin-8e, chapter: "20", pages: "854"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c066, section: high-yield, statement: "Splanchnic vasodilation lowers effective arterial volume, which leads to ascites and the hepatorenal and hepatopulmonary syndromes", sourceRef: {source: rubin-8e, chapter: "20", pages: "852"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c067, section: traps, statement: "The HVPG is usually normal in postsinusoidal portal hypertension because the sinusoids are normal", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c068, section: traps, statement: "Kidneys from patients who died of hepatorenal syndrome still work when grafted into people with chronic renal failure", sourceRef: {source: rubin-8e, chapter: "20", pages: "856"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: portal-hypertension-c070, section: mnemonics, statement: "Three sites of resistance: portal vein thrombosis (pre), sinusoidal scarring in cirrhosis (sinusoidal), hepatic vein or cardiac back-pressure (post)", sourceRef: {source: rubin-8e, chapter: "20", pages: "851"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
