entity: tuberculosis
claims:
  - { claimId: tuberculosis-c001, section: definition, statement: "Any organ may be infected, but the lungs are the chief site; the disease is chronic and communicable.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c002, section: definition, statement: "Granulomas whose centers are necrotic are the characteristic lesion.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c003, section: definition, statement: "Only some infected people develop symptoms, so infection and active disease have to be distinguished.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c004, section: definition, statement: "Disease at first exposure is primary tuberculosis; disease developing long after primary infection is secondary tuberculosis.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c005, section: definition, statement: "Developed countries now have less tuberculosis, but it occurs throughout the world.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c006, section: definition, statement: "Immigrants from endemic areas and people with HIV are at high risk of tuberculosis.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c007, section: definition, statement: "Reactivation of infections acquired when the disease was commoner may explain why older people are the most affected group in the United States.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c008, section: etiology, statement: "M. tuberculosis bovis is a less frequent cause; most disease is due to the human-adapted Koch bacillus (M. tuberculosis hominis).", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c009, section: etiology, statement: "The organism is a thin, beaded rod that grows only where oxygen is present.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c010, section: etiology, statement: "Acid fastness means retaining carbolfuchsin dye despite an acid-alcohol wash, and it is due to the lipids of the waxy cell wall.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c011, section: etiology, statement: "Humans are the only host of M. tuberculosis, and there is no reservoir in the environment.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c012, section: etiology, statement: "Droplet nuclei, the dried remains of respiratory droplets, drift in the air and carry the bacilli from person to person.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c014, section: etiology, statement: "Nonpasteurized milk from infected cattle transmits the bovine type.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c016, section: etiology, statement: "Lowered immunity, for example in AIDS, old age or cancer treatment, favors reactivation of dormant bacilli.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c017, section: pathogenesis, statement: "Alveolar macrophages phagocytose the bacilli that are inhaled and deposited in the alveoli.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c018, section: pathogenesis, statement: "The bacillus survives and multiplies in the macrophage because its wall lipids stop phagosome-lysosome fusion.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c019, section: pathogenesis, statement: "Hilar and mediastinal lymph nodes can receive bacilli carried out of the lung by infected macrophages.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c020, section: pathogenesis, statement: "IFN-gamma from antigen-primed T cells makes macrophages effective killers of the bacilli.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c022, section: pathogenesis, statement: "Containment works when the host is immunocompetent and the bacillary load is low: granulomas wall the bacilli off in fibrous tissue and activated macrophages destroy them.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c023, section: pathogenesis, statement: "Significant cheese-like (caseous) necrosis is the outcome of the hypersensitivity reaction when bacilli are numerous.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c024, section: pathogenesis, statement: "Caseous necrosis points toward tuberculosis but is not specific, because other agents can also cause it.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c025, section: pathogenesis, statement: "Infection can progress, giving progressive primary tuberculosis, when granulomas are poorly formed or absent, as in young children and immunocompromised people.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c026, section: pathogenesis, statement: "In secondary disease, cavities appear where the T-cell response to antigens the host already knows destroys tissue.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c027, section: gross, statement: "The Ghon focus, the first lung lesion of primary tuberculosis, is a small patch of consolidation under the pleura whose drainage reaches the hilar lymph nodes.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c028, section: gross, statement: "When mediastinal or hilar lymph nodes are involved together with a peripheral Ghon focus, the combination is called a Ghon complex.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c029, section: gross, statement: "The healed subpleural Ghon nodule ends as a scarred, calcified nodule; earlier it is a sharply outlined lump with a necrotic center.", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c030, section: gross, statement: "Cavities of progressive primary tuberculosis result from central liquefaction of the enlarging initial lesion.", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c031, section: gross, statement: "When the necrotizing process erodes a bronchus, the disease disseminates further within the lung.", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c032, section: gross, statement: "In middle lobe syndrome the right middle lobe collapses (atelectasis) because enlarged nodes compress its bronchus.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c033, section: gross, statement: "In secondary disease, small caseous foci lie in a poorly outlined scarred area, usually at the apex and back of the upper lobes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c034, section: gross, statement: "A cavity results when a necrotic focus erodes into a bronchus and drains, whereas other foci often heal and calcify.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c035, section: gross, statement: "The cavity wall has three layers: collagen on the outside, granulation tissue in the middle, and a gray membrane lining the lumen.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c036, section: gross, statement: "Caseous material fills the cavity lumen.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c037, section: gross, statement: "After healing, a cavity wall eventually turns fibrotic and calcified.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c038, section: gross, statement: "Bacilli spreading to several organs form tiny yellow nodules like millet seeds, which is miliary tuberculosis.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c039, section: gross, statement: "Miliary lesions favor the lungs, liver and spleen, and the meninges may be involved as disease progresses.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c040, section: micro, statement: "The tuberculous granuloma is necrotizing; its center is caseous debris of soft, cheese-like consistency.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c041, section: micro, statement: "The necrotic core is surrounded by Langhans giant cells and epithelioid macrophages.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c044, section: micro, statement: "Loose clumps of macrophages lacking Langhans giant cells may replace a true granuloma in an immunocompromised host.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c045, section: ancillary, statement: "Beaded acid-fast rods are seen in a smear of a lung lesion.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c046, section: ancillary, statement: "The microscopic lesion in the lung is a caseating granuloma, with fibrosis to a variable extent.", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c047, section: ancillary, statement: "The Ziehl-Neelsen stain demonstrates acid-fast mycobacteria in tissue sections (shown in the reference for mycobacterial pneumonia).", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c048, section: ancillary, statement: "Gram staining does not show the bacilli as gram-positive, since wall lipids block the dye, even though the wall is gram-positive in structure.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c049, section: ancillary, statement: "Because M. tuberculosis grows slowly, visible growth in culture commonly appears only after 3 to 6 weeks.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c050, section: clinical, statement: "Primary tuberculosis is generally without symptoms because most people contain the infection.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c051, section: clinical, statement: "Vague complaints such as fever and night sweats usually mark the quiet onset of progressive primary disease.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c052, section: clinical, statement: "Progressive primary disease can instead begin suddenly, with high fever and pleurisy.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c053, section: clinical, statement: "Secondary tuberculosis usually causes cough, low-grade fever and weight loss.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c054, section: clinical, statement: "Hemoptysis, sometimes fatal, follows when a cavity wall erodes nearby small pulmonary arteries.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c056, section: diagnosis, statement: "Secondary tuberculosis is suggested by cavities in one or both lung apices on a chest film.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c058, section: diagnosis, statement: "Caseation on biopsy points toward tuberculosis, though it is not conclusive because other agents can cause it.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c059, section: prognosis, statement: "Most healthy adults contain the infection, and their Ghon complexes end as small calcified scars.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c060, section: prognosis, statement: "Secondary tuberculosis arises when immunity falters and the few bacilli that survived for years begin multiplying again.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c062, section: prognosis, statement: "Tuberculous empyema and pneumothorax follow a bronchopleural fistula, a breach between a cavity under the pleura and the pleural space.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c063, section: prognosis, statement: "Swallowing infectious material may lead to intestinal tuberculosis, and coughing it up causes tuberculous laryngitis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c064, section: prognosis, statement: "Aspergillus superinfecting a persistent open cavity forms a fungal mass called an aspergilloma.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c065, section: prognosis, statement: "Blood-borne spread of bacilli, most often during secondary disease, produces miliary tuberculosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c066, section: prognosis, statement: "In the past, secondary amyloidosis often complicated long-standing cavitary tuberculosis.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c067, section: prognosis, statement: "Untreated secondary tuberculosis ends in death, after a wasting illness.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c068, section: prognosis, statement: "Patients receive prolonged courses of ethambutol, rifampin, pyrazinamide and isoniazid.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c069, section: prognosis, statement: "Incomplete adherence to the full drug regimen is the usual reason drug-resistant strains have appeared.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c070, section: differential, statement: "Tuberculosis is characterized by caseous necrosis, but other agents can also cause it.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c071, section: differential, statement: "Tuberculoid leprosy granulomas lack necrosis and only vaguely resemble tuberculous granulomas; bacilli are rare.", sourceRef: { source: rubin-8e, chapter: "9", pages: "454" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c072, section: differential, statement: "MAI disease runs a much slower course than tuberculosis, though it is similar clinically and pathologically.", sourceRef: { source: rubin-8e, chapter: "9", pages: "454" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c073, section: differential, statement: "Actinomycosis shows linked small lung abscesses, pus-filled centrally, with yellow sulfur granules.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c074, section: high-yield, statement: "A peripheral Ghon focus plus involved hilar or mediastinal nodes forms the Ghon complex of primary tuberculosis.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c075, section: high-yield, statement: "The typical lesion is a caseating granuloma whose center is ringed by Langhans giant cells and epithelioid macrophages.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c076, section: high-yield, statement: "Secondary (cavitary) tuberculosis typically arises at the apex and in the posterior segments of the upper lobes.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c077, section: high-yield, statement: "Miliary tuberculosis is dissemination producing many small millet-like lesions in several organs.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c078, section: high-yield, statement: "Mycobacteria stain poorly with the routine Gram stain despite their gram-positive wall structure, because of their lipid content.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c079, section: high-yield, statement: "Progressive primary tuberculosis favors young children and people with weakened immunity.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c080, section: traps, statement: "Many infected people feel well; active tuberculosis means the infection is damaging tissue and causing symptoms.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c081, section: traps, statement: "Other agents can also cause caseation, which therefore only prompts suspicion of tuberculosis.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c082, section: traps, statement: "Most secondary disease comes from bacilli left by the first infection waking up; a fresh exposure can also cause it.", sourceRef: { source: rubin-8e, chapter: "9", pages: "450" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c083, section: traps, statement: "Wall lipids block aniline dyes such as those of the Gram stain, which is why acid-fast methods are used.", sourceRef: { source: rubin-8e, chapter: "9", pages: "449" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c084, section: mnemonics, statement: "Secondary tuberculosis features cough, an apical upper-lobe site, vessel erosion with hemoptysis, cavities, and sweats with weight loss.", sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: tuberculosis-c085, section: gross, statement: "Bacilli spread by the blood can also settle in distant sites, for example the kidneys and the bones.", sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
