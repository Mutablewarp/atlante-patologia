entity: arrhythmia-substrates-and-sudden-cardiac-death
claims:
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c001, section: definition, statement: "An arrhythmia substrate is a fixed structural myocardial change, such as a scar or hypertrophy with fibrosis, that creates the anatomic basis for arrhythmia", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c002, section: definition, statement: "In most sudden deaths a diseased heart abruptly develops a lethal ventricular tachycardia or fibrillation", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c003, section: definition, statement: "Sudden death takes more than 300,000 lives per year in the United States", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c004, section: etiology, statement: "Hypertrophic cardiomyopathy leads among athletes under 35, and together with unexplained left ventricular hypertrophy and congenital coronary anomalies it accounts for over 75% of their sudden deaths", sourceRef: {source: rubin-8e, chapter: "17", pages: "688-689"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c005, section: etiology, statement: "Across Italy and other Mediterranean countries, arrhythmogenic cardiomyopathy is one of the main causes of sudden death in young people", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c006, section: etiology, statement: "In developed nations, most sudden deaths after midlife are due to coronary artery disease", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c007, section: etiology, statement: "Roughly 15% to 20% of sudden cardiac death victims under 35 have a coronary artery arising from an abnormal site", sourceRef: {source: rubin-8e, chapter: "17", pages: "651"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c008, section: etiology, statement: "Mitral valve prolapse is listed among the causes of sudden death in athletes over 35 (Fig. 17-48)", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c009, section: etiology, statement: "Ventricular arrhythmia is the main route to sudden death in patients with severe congenital aortic stenosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "651"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c010, section: etiology, statement: "Ebstein malformation leads to arrhythmias and sudden death", sourceRef: {source: rubin-8e, chapter: "17", pages: "651"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c011, section: pathogenesis, statement: "Ventricular muscle is the end of the normal route: SA node, atria, AV node, His bundle, bundle branches and Purkinje fibers", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c012, section: pathogenesis, statement: "The AV node is the slowest part of the conduction pathway, so the ventricles can fill before they are activated", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c013, section: pathogenesis, statement: "A pacemaker lower in the conduction system fires more slowly, so when the SA node fails (sick sinus syndrome) a backup site, even ventricular muscle, sets a slower rate", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c014, section: pathogenesis, statement: "In the normal adult heart the only electrical link between atria and ventricles is the His bundle", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c015, section: pathogenesis, statement: "Development can leave an accessory pathway (bypass tract), an abnormal strand of cardiac myocytes bridging atria and ventricles", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c016, section: pathogenesis, statement: "Supraventricular tachycardia can arise from circuits involving a bypass tract, which in Wolff-Parkinson-White syndrome also makes the ventricles fire early (pre-excitation)", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c017, section: pathogenesis, statement: "Antibodies made by a mother with a disease like lupus can pass through the placenta and interrupt the fetal conduction pathway", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c018, section: pathogenesis, statement: "Heart surgery, catheterization, infarction, and inflammatory or infiltrative disease can each damage the conduction system and cause an acquired defect", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c019, section: pathogenesis, statement: "Lethal arrhythmias usually start in remodeled working ventricular myocardium and run by triggered activity (ectopic beats), reentry (abnormal conduction), or both", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c020, section: pathogenesis, statement: "Classified by extent, substrates are diffuse (myocyte hypertrophy, interstitial fibrosis) or localized (healed infarcts, ventricular aneurysms)", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c021, section: pathogenesis, statement: "In most cases a substrate may be needed for arrhythmogenesis but is not enough on its own", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c022, section: pathogenesis, statement: "Arrhythmia is most likely when a brief trigger such as an electrolyte change, ischemia or neurohormonal activation lands on remodeled myocardium", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c023, section: pathogenesis, statement: "Sudden death most often occurs when acute ischemia strikes heart muscle that already contains a healed infarct", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c024, section: pathogenesis, statement: "A channelopathy, an inherited fault in an ion channel or in the proteins that traffic and recycle it, can sit in a structurally normal heart and cause sudden death", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c025, section: pathogenesis, statement: "Sudden cardiac death in structurally normal hearts is rare", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c026, section: pathogenesis, statement: "In long QT syndrome, slowed repolarization, usually from loss-of-function mutations in K+ channel genes, makes afterdepolarizations more likely", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c027, section: pathogenesis, statement: "Gain-of-function mutations in SCN5A or CACNA1C can also cause long QT syndrome", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c028, section: pathogenesis, statement: "Brugada syndrome is an autosomal dominant disease", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c029, section: pathogenesis, statement: "Loss-of-function SCN5A mutations are found in approximately 25% of Brugada cases", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c030, section: pathogenesis, statement: "In catecholaminergic polymorphic ventricular tachycardia, mutations such as RyR2 or calsequestrin let Ca2+ leak from the SR, and the resulting arrhythmias are triggered by afterdepolarizations", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c031, section: gross, statement: "The typical gross finding in sudden death victims is myocardial change that acts as an anatomic substrate of arrhythmia", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c032, section: gross, statement: "In Ebstein malformation, low-lying tricuspid leaflets adherent to the wall leave an atrialized upper right ventricle and a functional lower part", sourceRef: {source: rubin-8e, chapter: "17", pages: "651"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c033, section: gross, statement: "Brugada syndrome hearts are often structurally normal", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c034, section: micro, statement: "Diffuse arrhythmia substrates comprise myocyte hypertrophy and interstitial fibrosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c035, section: micro, statement: "Fibrosis in differing amounts occurs in some Brugada syndrome hearts", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c036, section: micro, statement: "In congenital heart block the AV node is either cut off from atrial myocardium or walled off from ventricular conduction tissue by fibrosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "651"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c037, section: micro, statement: "Vacuoles in myocytes suggest a storage disease rather than a primary cardiomyopathy", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c038, section: ancillary, statement: "A surface ECG occasionally points to a culprit structure: new bundle branch block from a lesion of the ventricular conduction system, or an accessory AV connection in WPW", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c039, section: ancillary, statement: "Congenital long QT syndrome is divided into more than 15 types according to the mutated gene", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c040, section: ancillary, statement: "Vacuolated myocytes on histology favor a storage disease over a true primary cardiomyopathy", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c041, section: clinical, statement: "Many sudden death victims are apparently healthy and die outside hospital", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c042, section: clinical, statement: "Long QT syndrome means fainting, ventricular arrhythmia or sudden death in a person whose ECG shows a long QT interval and abnormal T waves", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c043, section: clinical, statement: "Right bundle branch block plus ST-segment elevation in the right precordial leads is characteristic of Brugada syndrome", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c044, section: clinical, statement: "In catecholaminergic polymorphic ventricular tachycardia, exertion or emotional stress releases catecholamines that trigger arrhythmias and sudden death", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c045, section: clinical, statement: "Despite an abnormally slow heart rate, isolated congenital heart block rarely causes functional difficulty", sourceRef: {source: rubin-8e, chapter: "17", pages: "651"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c046, section: clinical, statement: "Later in life, congenital heart block may be followed by Stokes-Adams fainting, cardiac hypertrophy, rhythm disorders or heart failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "651"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c047, section: diagnosis, statement: "At autopsy many sudden death victims turn out to have coronary artery disease that stayed clinically quiet during life", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c048, section: diagnosis, statement: "Sudden cardiac death can occur in structurally normal hearts, in some cases through channelopathies", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c049, section: prognosis, statement: "Failing hearts acquire QT prolongation through electrophysiologic remodeling rather than a gene mutation, and this likely raises arrhythmia and sudden death risk", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c050, section: prognosis, statement: "Prolonged QT is an off-target effect of many commonly prescribed drugs", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c051, section: prognosis, statement: "Drug-induced QT lengthening is most dangerous when an inherited trait or an acquired condition already delays repolarization", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c052, section: differential, statement: "Hypertrophic cardiomyopathy is the largest single cause of sudden death in athletes under 35 (Fig. 17-48)", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c053, section: differential, statement: "Brugada syndrome and arrhythmogenic cardiomyopathy can overlap phenotypically", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c054, section: differential, statement: "A healed infarct is a common anatomic substrate, and acute ischemia a frequent transient trigger, for sudden death", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c055, section: differential, statement: "Storage diseases can mimic cardiomyopathies but show vacuolated myocytes", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c056, section: high-yield, statement: "A substrate is in most cases not sufficient alone; arrhythmia is most likely when an acute trigger such as ischemia is superimposed", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c057, section: high-yield, statement: "Acute ischemia in an area with a healed infarct is the most frequent combination", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c058, section: high-yield, statement: "Lethal arrhythmias arise through triggered activity (ectopic beats) or reentry (abnormal conduction)", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c059, section: high-yield, statement: "Hypertrophic cardiomyopathy, idiopathic LVH and coronary anomalies lead in the young; coronary artery disease leads in older adults", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c060, section: high-yield, statement: "Accessory bypass tracts cause ventricular pre-excitation in Wolff-Parkinson-White syndrome", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c061, section: high-yield, statement: "Channelopathies (long QT, Brugada, CPVT) cause sudden death syndromes, often in structurally normal hearts", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c062, section: traps, statement: "In most cases a substrate alone cannot start an arrhythmia; a transient trigger such as acute ischemia must be added", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c063, section: traps, statement: "Channelopathies can cause sudden death in hearts without a structural lesion", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c064, section: traps, statement: "The AV node conducts slowly by design, which is normal and gives the ventricles time to fill", sourceRef: {source: rubin-8e, chapter: "17", pages: "635"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c065, section: traps, statement: "Common causes of sudden cardiac death differ between the young (hypertrophic cardiomyopathy, idiopathic LVH, coronary anomalies) and older adults (coronary artery disease)", sourceRef: {source: rubin-8e, chapter: "17", pages: "688"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: arrhythmia-substrates-and-sudden-cardiac-death-c066, section: mnemonics, statement: "A fixed substrate plus a transient trigger such as ischemia produces lethal arrhythmia", sourceRef: {source: rubin-8e, chapter: "17", pages: "689"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
