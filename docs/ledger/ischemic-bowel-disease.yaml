entity: ischemic-bowel-disease
claims:
- {claimId: ischemic-bowel-disease-c001, section: definition, statement: "A drop in blood flow to the gut, whatever the reason, can injure the bowel wall.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c002, section: definition, statement: "The injury can be confined to the mucosa or span the whole wall, and most ischemic bowel disease is acute.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c003, section: definition, statement: "Chronic disease is rarer; its recurring episodes usually rest on atherosclerosis that badly narrows at least two major arteries.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c004, section: etiology, statement: "Segmental acute ischemia is the result of a sudden thrombotic or embolic block in a big mesenteric artery.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c005, section: etiology, statement: "Vasculitis is an uncommon cause of arterial occlusion and tends to involve small arteries.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c006, section: etiology, statement: "Bowel caught in a hernia sac, twisted on itself or telescoped into a neighboring segment can lose both arterial and venous flow.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c007, section: etiology, statement: "Cocaine and certain medicines can block or narrow the smallest vessels, and a tendency to clot also raises the risk.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802-803"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c008, section: etiology, statement: "Bacterial toxins damaging the vessel lining link infection with E. coli O157:H7 or Shigella to occlusive ischemia.", sourceRef: {source: rubin-8e, chapter: "19", pages: "803"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c010, section: etiology, statement: "Nonocclusive ischemia follows a fall in cardiac output in shock, whether septic, from bleeding or after a heart attack.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c011, section: etiology, statement: "Inflammation near the vein, sluggish flow or hypercoagulability can lead to clotting of a mesenteric vein.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c012, section: etiology, statement: "Only about one venous thrombosis in twenty involves the inferior mesenteric vein, the superior one being affected in nearly all the others.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c013, section: etiology, statement: "The usual background of chronic ischemia is atherosclerosis in the mesenteric arteries.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c014, section: etiology, statement: "The chronic form is more likely in women and in people over 65.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c015, section: pathogenesis, statement: "A sudden block of a large artery gives collateral routes no time to supply the tissue, so it dies.", sourceRef: {source: rubin-8e, chapter: "19", pages: "802"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c016, section: pathogenesis, statement: "Whether one segment or nearly the whole small bowel infarcts depends on how large the blocked artery is.", sourceRef: {source: rubin-8e, chapter: "19", pages: "803"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c017, section: pathogenesis, statement: "When blood is redirected in shock, vital organs, the brain first, are favored.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c018, section: pathogenesis, statement: "Alpha-adrenergic drugs often given in shock divert yet more blood away from the gut.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c019, section: pathogenesis, statement: "Ischemia gets worse because arterioles collapse when perfusion pressure plunges.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c020, section: pathogenesis, statement: "The watershed zones, junctions of two arterial territories, are where nonocclusive ischemia hits the colon hardest.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c021, section: pathogenesis, statement: "At the splenic flexure the areas fed by the superior and the inferior mesenteric arteries border each other.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c022, section: pathogenesis, statement: "Blood reaches the rectosigmoid from both the inferior mesenteric and the internal iliac arteries.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c023, section: pathogenesis, statement: "Having two arterial sources, splanchnic and systemic, is why the rectum typically escapes.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c024, section: pathogenesis, statement: "Ischemia arises because venous obstruction lets blood and fluid pool in the segment, cutting arterial inflow.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c025, section: pathogenesis, statement: "Infarction is generally avoided after superior mesenteric vein thrombosis because collateral veins drain the territory.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c026, section: pathogenesis, statement: "Food raises the gut's blood requirement, and the diseased arteries of chronic ischemia cannot deliver the extra flow.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c027, section: gross, statement: "Infarcted bowel shows purple color all over, together with swelling from edema.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c028, section: gross, statement: "A clear line usually separates infarcted from healthy bowel, but venous occlusion can make that line fuzzy.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c029, section: gross, statement: "Venous occlusion gives the heaviest bleeding, and the infarcted mucosa and submucosa bleed conspicuously.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c030, section: gross, statement: "Large patches of lining are shed, and the wall is left thin and stretched.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c031, section: gross, statement: "Pneumatosis, gas inside the intestinal wall and the veins of the mesentery, may occur.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c032, section: gross, statement: "A coat of inflammatory exudate covers the outer surface, which looks dull.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c033, section: gross, statement: "Endoscopy can show a mucosa with several ulcers, with hemorrhagic nodules, or covered by a pseudomembrane.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c034, section: gross, statement: "After long-standing poor blood supply the small bowel can develop one or several ring-like strictures.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804-805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c035, section: gross, statement: "The thinned mucosa over a stricture frequently carries a few small ulcers.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c036, section: micro, statement: "The surface epithelium is dead by coagulative necrosis and shows ghost cells.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c037, section: micro, statement: "Around the necrotic epithelium the mucosa has edema and bleeding, with ulcers and crypt abscesses.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c038, section: micro, statement: "In an ischemic colitis biopsy most crypts are dead and visible only as pale outlines, with a few bases surviving.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c039, section: micro, statement: "Necrosis goes deeper as injury gets worse, and can end up involving the entire wall thickness.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c040, section: micro, statement: "A chronic stricture has scarring and thickening of the submucosa, and its granulation tissue can reach into the muscle.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c042, section: ancillary, statement: "Ischemic colitis is examined on endoscopic mucosal biopsy, while infarcted bowel reaches the pathologist as a resection or at autopsy.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804-805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c043, section: ancillary, statement: "Microscopy of ischemic colitis shows dead surface epithelium and crypts reduced to ghost outlines.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c044, section: clinical, statement: "Sudden abdominal pain is among the symptoms of acute ischemia.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c045, section: clinical, statement: "Depending on the bleeding site, stool can be maroon, contain bright red blood, or be bloody diarrhea.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c046, section: clinical, statement: "The term intestinal angina names the repeated episodes of abdominal pain that chronic ischemia causes.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c047, section: clinical, statement: "A few hours of pain typically follow its onset, which comes within thirty minutes of a meal.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c048, section: clinical, statement: "Abdominal angina can be a warning sign before true infarction.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c049, section: diagnosis, statement: "Infectious colitis or inflammatory bowel disease can pass clinically for ischemic colitis.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c050, section: prognosis, statement: "Perforation of untreated ischemic bowel is common, and shock may follow it.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c051, section: prognosis, statement: "Multiple organ dysfunction is where the worsening systemic illness ends as infarction spreads.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c052, section: prognosis, statement: "Absence of bleeding in acute ischemia may go with a poorer outcome.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c053, section: prognosis, statement: "Proximal superior mesenteric artery occlusion infarcts almost the whole small bowel, and the resection this requires is not survivable.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c054, section: prognosis, statement: "The underlying cause and the amount of bowel involved set both the outcome and the management.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c055, section: prognosis, statement: "Colonic ischemia is managed by resting the bowel and stabilizing the circulation, to restore blood flow.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c057, section: prognosis, statement: "Severe disease carries a death rate above half of patients.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c059, section: prognosis, statement: "Instead of healing fully, some patients end up with a stricture.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c061, section: prognosis, statement: "Stasis and bacterial overgrowth with an ischemic small-bowel stricture occasionally cause malabsorption, besides obstruction.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804-805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c063, section: differential, statement: "Clinically, infectious colitis can look like ischemic colitis.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c064, section: differential, statement: "Clinically, inflammatory bowel disease can look like ischemic colitis.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c065, section: differential, statement: "Angiodysplasia is a colonic arteriovenous malformation, bleeding into the lower gut mainly in older people, with a predilection for the cecum and ascending colon.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c066, section: differential, statement: "Thin walls, enlargement and twisting mark the submucosal veins and capillaries.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c067, section: differential, statement: "It is a hard diagnosis, and selective mesenteric angiography or colonoscopy is frequently needed.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c068, section: differential, statement: "The small bowel and colon can be injured by radiotherapy for pelvic or abdominal tumors.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c069, section: differential, statement: "Radiation colitis that matters clinically is seen mostly in the rectum.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c070, section: differential, statement: "Later, the mucosa turns chronically ischemic as injured submucosal vessels clot.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c071, section: differential, statement: "Strange-looking fibroblasts are often present in the submucosal scar after radiation.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c072, section: high-yield, statement: "Nonocclusive ischemia can be reversible because it is a flow problem, typically low output in shock.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c073, section: high-yield, statement: "The splenic flexure and the rectosigmoid are the colonic watershed zones.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c074, section: high-yield, statement: "Because of its two sources of blood, the rectum is generally not affected.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c075, section: high-yield, statement: "Dead crypts that persist as ghost outlines in coagulative necrosis are the hallmark of ischemic colitis on histology.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c076, section: high-yield, statement: "Pain starting about half an hour after eating defines intestinal angina, seen in chronic ischemia secondary to atherosclerosis.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c077, section: high-yield, statement: "Over half of patients with severe disease die.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c078, section: high-yield, statement: "Angiodysplasia is an arteriovenous malformation of the colon that leads to bleeding.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c080, section: traps, statement: "In nonocclusive colonic ischemia the rectum usually escapes, thanks to its two arterial sources.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c081, section: traps, statement: "Collateral channels commonly keep the territory of a thrombosed superior mesenteric vein from infarcting.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c082, section: traps, statement: "Acute ischemia without any bleeding is associated with a poorer outlook.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c083, section: traps, statement: "Angiodysplasia is a localized vascular malformation, and its fragile widened vessels are what bleed.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c084, section: traps, statement: "Symptoms alone may fail to separate ischemic colitis from infectious colitis or inflammatory bowel disease.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c085, section: traps, statement: "The late phase of radiation injury comes after the mucosa has recovered and involves vessel clotting with persistent mucosal ischemia.", sourceRef: {source: rubin-8e, chapter: "19", pages: "805"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ischemic-bowel-disease-c086, section: mnemonics, statement: "Splenic flexure and rectosigmoid are the colonic watershed zones, and the rectum proper is spared.", sourceRef: {source: rubin-8e, chapter: "19", pages: "804"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
