entity: pleural-effusion-and-pleural-fluid-cytology
claims:
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c001, section: definition, statement: "A pleural effusion is an excess of fluid in the pleural cavity.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c002, section: definition, statement: "Inflammation of the pleura is often accompanied by pleural effusions.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c003, section: definition, statement: "Pneumothorax is air, rather than fluid, in the pleural cavity.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c004, section: etiology, statement: "Raised capillary hydrostatic pressure in heart failure and other states of body-wide or lung edema can cause hydrothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c005, section: etiology, statement: "Severe starvation, cirrhosis and nephrotic syndrome are settings of low serum oncotic pressure, in which hydrothorax occurs.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c006, section: etiology, statement: "Asbestos exposure, and collagen vascular diseases such as lupus and rheumatoid arthritis, can also lead to hydrothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c007, section: etiology, statement: "Pneumococcal pneumonia is the classic source of pyothorax, and a bacterial pneumonia reaching the pleura is its usual route.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c008, section: etiology, statement: "Occasionally pyogenic bacteria reach the pleura from outside, carried in by a penetrating wound.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c009, section: etiology, statement: "Procedures on the pleura rarely lead to pyothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c010, section: etiology, statement: "Chest trauma or a burst vessel, for example a dissecting aortic aneurysm, causes blood to collect in the pleural space (hemothorax).", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c011, section: etiology, statement: "Pulmonary infarction, pleural cancer and tuberculosis can all tinge an effusion with blood.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c012, section: etiology, statement: "A mediastinal tumor such as lymphoma is a rare cause of chylothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c013, section: etiology, statement: "Tropical nematode infestations are another cause of chylothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c014, section: etiology, statement: "Pulmonary LAM (lymphangioleiomyomatosis) is another setting for chylothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c015, section: etiology, statement: "Viral or bacterial infection, local or spreading from the lung, collagen vascular disease and a peripheral lung infarct can each cause pleuritis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c016, section: etiology, statement: "Traumatic pneumothorax can follow a stabbing or a fractured rib that perforates the pleura.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c017, section: etiology, statement: "Most traumatic pneumothoraces result from medical procedures such as draining pleural fluid, lung biopsy or positive-pressure ventilation.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c018, section: etiology, statement: "Young adults are the typical patients with spontaneous pneumothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c019, section: pathogenesis, statement: "The visceral pleura absorbs the fluid that the parietal pleura secretes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c020, section: pathogenesis, statement: "A small amount of pleural fluid normally lets the lung slide smoothly against the chest wall.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c021, section: pathogenesis, statement: "Hydrothorax is the same process that is called edema in other tissues, occurring in the pleural space.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c022, section: pathogenesis, statement: "Chylothorax is due to lymphatic obstruction.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c023, section: gross, statement: "An effusion can be as small as a few milliliters or can be a massive accumulation.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c024, section: gross, statement: "Massive effusions push the midline structures, mediastinum and trachea, across to the other hemithorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c025, section: gross, statement: "Hydrothorax fluid resembles water.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c026, section: gross, statement: "Pyothorax is a turbid effusion.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c027, section: gross, statement: "In empyema the pleural pus is thick, and loculation and fibrosis are common.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c028, section: gross, statement: "The fluid of chylothorax (chyle) is lipid-rich and milky in appearance.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c029, section: gross, statement: "Hemothorax is blood in the pleural cavity.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c030, section: micro, statement: "Polymorphonuclear leukocytes fill the fluid of pyothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c031, section: clinical, statement: "Pleuritic chest pain is sharp and comes on when the patient breathes in.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c032, section: clinical, statement: "A young adult can develop sudden chest pain and breathlessness during hard exercise, as an example of spontaneous pneumothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c033, section: clinical, statement: "In tension pneumothorax the air collection on one side is large enough that the opposite lung is compressed and the mediastinum shifts away from it.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c034, section: clinical, statement: "In a bronchopleural fistula an airway opens freely into the pleural space.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c035, section: clinical, statement: "Most bronchopleural fistulas are iatrogenic: a biopsy or an operation breaks the bronchial wall.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c036, section: clinical, statement: "Destructive lung infection can also cause a bronchopleural fistula, and then it is the infection that counts most.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c037, section: diagnosis, statement: "A tiny effusion may be seen only on imaging, where the costophrenic angle looks blunted.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c038, section: diagnosis, statement: "Chest imaging of a spontaneous pneumothorax shows the lung collapsed on the painful side, surrounded by pleural air.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c039, section: prognosis, statement: "Chylothorax carries a bad prognosis because the lymphatic block points to disease of the posterior mediastinal nodes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c040, section: prognosis, statement: "Tension pneumothorax can threaten life, and relief by immediate drainage is required.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c041, section: prognosis, statement: "Some spontaneous pneumothoraces need air drained, but most resolve without intervention.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c042, section: prognosis, statement: "A bronchopleural fistula is a grave problem.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c043, section: differential, statement: "Hydrothorax resembles water and is caused by raised hydrostatic pressure or low oncotic pressure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c044, section: differential, statement: "Pyothorax fluid is cloudy and neutrophil-rich; empyema has thick pus, often walled off into pockets.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c045, section: differential, statement: "Hemothorax is frank blood from trauma or vessel rupture, whereas effusions in tuberculosis, pleural cancer or infarction can be merely blood-stained.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c046, section: differential, statement: "Lymphatic obstruction leads to lipid-rich, milky fluid in the pleural cavity.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c047, section: high-yield, statement: "Hydrothorax is the watery effusion produced by edema of the pleural space.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c048, section: high-yield, statement: "Pyothorax is a neutrophil-rich effusion from pleural infection, classically after pneumococcal pneumonia.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c049, section: high-yield, statement: "Empyema is pyothorax with thick pus, and the pleura often scars and divides into pockets.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c050, section: high-yield, statement: "A ruptured vessel, for instance in a dissecting aortic aneurysm, or trauma leads to hemothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c051, section: high-yield, statement: "Chylothorax signals lymphatic obstruction, for instance by a mediastinal lymphoma.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c052, section: high-yield, statement: "Pleuritis typically causes sharp chest pain on inspiration.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c053, section: high-yield, statement: "Tension pneumothorax shifts the mediastinum and requires immediate drainage.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c054, section: high-yield, statement: "Rupture of subpleural emphysematous blebs is the usual cause of spontaneous pneumothorax.", sourceRef: { source: rubin-8e, chapter: "18", pages: "763" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c055, section: traps, statement: "Hydrothorax can arise from raised hydrostatic or low oncotic pressure in heart failure, nephrotic syndrome or cirrhosis, without primary pleural disease.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c056, section: traps, statement: "Empyema is pyothorax with thick pus, and the pleura often scars and divides into pockets.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c057, section: traps, statement: "Infarction, pleural cancer and tuberculosis can give a blood-tinged effusion, but hemothorax means frank blood from trauma or a ruptured vessel.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pleural-effusion-and-pleural-fluid-cytology-c058, section: mnemonics, statement: "Hydrothorax is watery, pyothorax is pus, hemothorax is blood and chylothorax is milky chyle.", sourceRef: { source: rubin-8e, chapter: "18", pages: "764" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
