entity: alcoholic-liver-disease
claims:
  - { claimId: alcoholic-liver-disease-c001, section: definition, statement: "Ethanol injures the liver through a direct toxic effect and through indirect effects.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c002, section: definition, statement: "The disease consists of three lesions: steatosis, acute alcoholic hepatitis and cirrhosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c003, section: definition, statement: "Any combination of the three lesions can be present in one liver and they may be unrelated to each other, although they usually appear in sequence.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c004, section: definition, statement: "Cirrhosis spares most heavy drinkers; the chance depends on lifetime intake, meaning years of drinking times daily amount.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c005, section: definition, statement: "Cirrhosis affects roughly 15% of alcoholics.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867, 869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c007, section: etiology, statement: "The lowest daily intake linked to chronic liver disease is roughly 20 g of alcohol in women and 40 g in men.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c008, section: etiology, statement: "Reaching cirrhosis generally takes more than 10 years of drinking at that intake.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c009, section: etiology, statement: "The reason is unknown, but women's livers are harmed by alcohol more easily than men's.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c011, section: etiology, statement: "Hepatitis C infection raises the chance of liver disease in people who abuse alcohol.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c012, section: etiology, statement: "Compared with control groups, alcoholics more often have serologic evidence of HBV.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c014, section: pathogenesis, statement: "Cytosolic alcohol dehydrogenase is the main enzyme that converts most ingested ethanol, in the liver, into acetaldehyde and acetate.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c016, section: pathogenesis, statement: "Dietary fat supplies most of the lipid that accumulates in the liver of chronic drinkers.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c017, section: pathogenesis, statement: "Free fatty acids reach the liver in greater amounts because ethanol drives lipolysis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c018, section: pathogenesis, statement: "Inside hepatocytes, ethanol also boosts the synthesis of fatty acids and triglycerides.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c019, section: pathogenesis, statement: "Fat stays in the cell because ethanol slows mitochondrial oxidation of fatty acids and impairs lipoprotein release.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c020, section: pathogenesis, statement: "Steatosis reverses fully and fast once drinking stops, which shows that it is driven by alcohol intake.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c022, section: pathogenesis, statement: "Because chronic drinking induces cytochrome P450 enzymes, drugs whose metabolites are the toxic part, such as acetaminophen, become more dangerous.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c023, section: pathogenesis, statement: "What triggers alcoholic hepatitis is not understood.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c024, section: pathogenesis, statement: "A drinker with years of mild fatty liver and unchanged habits can suddenly develop hepatitis, which hints at an unidentified cofactor.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c025, section: pathogenesis, statement: "The fat itself has not been shown to make alcoholic hepatitis more likely.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c026, section: pathogenesis, statement: "Long-term alcohol activates stellate cells; the collagen they deposit in the sinusoids probably contributes to cirrhosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868, 870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c028, section: gross, statement: "A fatty liver from heavy drinking is yellow and larger than normal.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c030, section: gross, statement: "A cirrhotic liver is divided into nodules of hepatocytes encircled by bands of fibrous tissue.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c031, section: micro, statement: "In severe steatosis most hepatocytes are filled with merged fat droplets, whereas mild steatosis shows small droplets in only a few cells.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c032, section: micro, statement: "Taken to the extreme, the nucleus is flattened against the cell edge and the rest of the cell looks clear, like an adipocyte.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c033, section: micro, statement: "Hepatocyte necrosis in alcoholic hepatitis is mainly centrilobular.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c034, section: micro, statement: "Hydropic swelling varies between hepatocytes, so the tissue looks patchy.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c035, section: micro, statement: "Mallory-Denk hyalins are eosinophilic cytoplasmic clumps or threads, commonly beside the nucleus.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c036, section: micro, statement: "Satellitosis is the name for neutrophils clustering around ballooned hepatocytes, especially ones containing Mallory-Denk hyalins.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c037, section: micro, statement: "Beyond the rings around damaged cells, inflammatory cells, mostly neutrophils, are also scattered more diffusely within the lobule.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868-869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c038, section: micro, statement: "The overall lobular architecture is usually still intact in alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c039, section: micro, statement: "Collagen builds up most around the central veins in alcoholic hepatitis, and some is present in every case.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c040, section: micro, statement: "Collagen encircling single hepatocytes is called pericellular fibrosis and is a hallmark of alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868, 870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c041, section: micro, statement: "In severe alcoholic hepatitis the central venule and adjacent sinusoids are scarred shut, producing central hyaline sclerosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c042, section: micro, statement: "Portal tracts vary: some are enlarged by mononuclear cells and ductular reaction, others look nearly normal.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c044, section: micro, statement: "After hepatocytes die and scar, regeneration leaves nodules separated by fibrous septa, which is cirrhosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c045, section: micro, statement: "Steatosis and alcoholic hepatitis are frequently found in the same liver as cirrhosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c046, section: ancillary, statement: "On H&E the pathologist looks for fat pushing nuclei aside, swollen cells, Mallory-Denk hyalins and neutrophils around them.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868-869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c047, section: ancillary, statement: "Trichrome stain colors collagen blue and outlines pericellular fibrosis around the central venule; the source's example is NASH, whose lesion mimics the alcoholic one.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c048, section: ancillary, statement: "Electron microscopy shows that Mallory-Denk hyalins are clumps of cytokeratin intermediate filaments.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868-869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c050, section: clinical, statement: "Uncomplicated alcoholic fatty liver can look dramatic yet cause few symptoms.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c051, section: clinical, statement: "Fever and jaundice are features of alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c053, section: clinical, statement: "An elevated white cell count is common in alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c054, section: clinical, statement: "Alcoholic hepatitis often strikes suddenly, with no change in the patient's drinking.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c055, section: clinical, statement: "Portal hypertension without cirrhosis is a frequent companion of central hyaline sclerosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c057, section: diagnosis, statement: "Compared with viral hepatitis, the transaminase rise in alcoholic hepatitis is smaller, though still moderate.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868-869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c058, section: diagnosis, statement: "The AST value generally stays below 400.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c059, section: diagnosis, statement: "AST is typically about twice ALT in alcoholic hepatitis, a 2:1 ratio.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c060, section: diagnosis, statement: "Serum alkaline phosphatase tends to be raised in alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c061, section: diagnosis, statement: "In severe alcoholic hepatitis a prolonged prothrombin time often goes with a poor prognosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c062, section: prognosis, statement: "Alcoholic fatty liver does not progress to worse disease by itself and can be fully reversed.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c063, section: prognosis, statement: "Abstinence is the best therapy for alcoholic fatty liver.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c064, section: prognosis, statement: "The more severe the injury to liver cells, the worse the outcome of alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c065, section: prognosis, statement: "Some patients rapidly develop fatal liver failure.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c066, section: prognosis, statement: "About one patient in ten dies during the acute phase of alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c067, section: prognosis, statement: "Abstinence after the acute episode is followed by recovery in most patients.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c068, section: prognosis, statement: "Up to 70% of patients who do not give up alcohol end up with cirrhosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c069, section: prognosis, statement: "No therapy is specific for the acute phase of alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c070, section: prognosis, statement: "Corticosteroids are often given when neither infection nor renal failure is present, because they reduce short-term mortality.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c072, section: prognosis, statement: "Abstinence markedly improves prognosis in established alcoholic cirrhosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c073, section: prognosis, statement: "Alcoholic liver disease is frequently the reason for a transplant, and many patients still reach end-stage disease.", sourceRef: { source: rubin-8e, chapter: "20", pages: "870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c074, section: differential, statement: "NAFLD and alcoholic liver disease share centrilobular fibrosis, Mallory-Denk hyalins and steatosis on histology.", sourceRef: { source: rubin-8e, chapter: "20", pages: "870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c075, section: differential, statement: "Insulin resistance is probably the leading risk factor for NAFLD and NASH.", sourceRef: { source: rubin-8e, chapter: "20", pages: "870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c076, section: differential, statement: "Viral hepatitis raises aminotransferases further than alcoholic hepatitis does.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868-869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c077, section: differential, statement: "Wilson disease can also show Mallory-Denk hyalins, so these inclusions do not point only to alcohol.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c078, section: differential, statement: "Many cryptogenic cirrhoses are probably NAFLD whose fat has vanished as cirrhosis developed.", sourceRef: { source: rubin-8e, chapter: "20", pages: "870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c079, section: high-yield, statement: "Steatosis, acute alcoholic hepatitis and cirrhosis make up the disease and usually appear in that order.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c080, section: high-yield, statement: "Alcoholic steatosis goes away completely once the patient stops drinking.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c081, section: high-yield, statement: "Alcoholic hepatitis shows Mallory-Denk hyalins, neutrophils and pericellular fibrosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c082, section: high-yield, statement: "Alcoholic hepatitis is mainly centrilobular, and severe cases show central hyaline sclerosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868-869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c083, section: high-yield, statement: "In alcoholic hepatitis AST is about twice ALT and generally stays below 400.", sourceRef: { source: rubin-8e, chapter: "20", pages: "869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c084, section: high-yield, statement: "Cirrhosis occurs in roughly 15% of alcoholics.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867, 869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c085, section: high-yield, statement: "Stopping alcohol reverses fatty liver and improves outcome in cirrhosis too.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868, 870" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c086, section: traps, statement: "Fatty liver has many causes, including NAFLD; alcohol is the classic one.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c087, section: traps, statement: "Mallory-Denk hyalins also occur in NASH and Wilson disease, so they suggest alcohol without proving it.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c088, section: traps, statement: "Cirrhosis affects only some heavy drinkers, and the chance tracks the cumulative lifetime alcohol dose.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c089, section: traps, statement: "No evidence shows that the accumulated fat contributes to alcoholic hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c090, section: traps, statement: "Fatty liver alone does not advance to worse disease.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c091, section: mnemonics, statement: "Alcoholic hepatitis combines Mallory-Denk hyalins, neutrophils around damaged hepatocytes and an AST:ALT ratio of about 2:1.", sourceRef: { source: rubin-8e, chapter: "20", pages: "868-869" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: alcoholic-liver-disease-c092, section: mnemonics, statement: "The three lesions usually follow the order fatty liver, alcoholic hepatitis, cirrhosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "867" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
