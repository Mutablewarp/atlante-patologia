entity: cystitis
claims:
- {claimId: cystitis-c001, section: definition, statement: "The bladder can be inflamed for a short time or for long, which is what cystitis means", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c002, section: definition, statement: "Among infections of the urinary tract, cystitis is the one seen most often", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c003, section: definition, statement: "Hospital inpatients, above all those fitted with a long-term bladder catheter, often develop cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c004, section: etiology, statement: "An infection located lower in the urinary tract usually comes first, and cystitis follows it", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c005, section: etiology, statement: "Diabetes, weak immunity, stones, blocked outflow, earlier instrumentation, radiation and chemotherapy all raise the chance of bladder infection", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c006, section: etiology, statement: "Because the female urethra is short, women run a higher cystitis risk, which grows during pregnancy", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c007, section: etiology, statement: "In men an enlarged prostate blocks bladder outflow and so favors cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c008, section: etiology, statement: "The leading cause of cystitis is a coliform, mostly E. coli, and Proteus, Pseudomonas and Enterobacter are also named", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c009, section: etiology, statement: "Nearly all bladder tuberculosis comes after tuberculosis of the kidney, and it has become unusual in Western countries", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c010, section: etiology, statement: "Patients with suppressed immunity can develop a fungal cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c011, section: etiology, statement: "The blood fluke Schistosoma haematobium, endemic across North Africa and the Middle East, often causes cystitis there", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c012, section: etiology, statement: "Radiation cystitis is seen most often after pelvic irradiation of bladder, rectal or uterine cancer", sourceRef: {source: rubin-8e, chapter: "23", pages: "980-981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c013, section: etiology, statement: "Hemorrhagic cystitis is the usual picture after cyclophosphamide, the drug most often linked to cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c014, section: etiology, statement: "E. coli urinary infection often coexists with malakoplakia, though it is doubtful as a direct cause", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c015, section: pathogenesis, statement: "Cystitis is particularly frequent when a catheter stays in for a long time, and scope examination of the bladder can bring in microbes", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c016, section: pathogenesis, statement: "Chronic cystitis, with lymphocytes, plasma cells and scarring of the lamina propria, is associated with an acute cystitis that fails to clear", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c017, section: pathogenesis, statement: "The cause of chronic interstitial cystitis is unknown", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c018, section: pathogenesis, statement: "Nobody knows the cause of malakoplakia, which is a rare inflammatory condition", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c019, section: pathogenesis, statement: "Undigested bacteria in macrophage lysosomes suggest malakoplakia may be an acquired digestion defect", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
- {claimId: cystitis-c020, section: pathogenesis, statement: "Michaelis-Gutmann bodies come into being when calcium salts accumulate in swollen macrophage lysosomes", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c021, section: gross, statement: "In catheter-induced acute cystitis the bladder mucosa is congested and shows foci of hemorrhage", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c022, section: gross, statement: "Pinpoint bleeding spots on the mucosa, giving the name hemorrhagic cystitis, are frequent in acute bacterial infection", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c023, section: gross, statement: "Widespread hemorrhagic cystitis often arises from clotting disorders and from disseminated intravascular coagulation", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c024, section: gross, statement: "Ulcers with local mucosal bleeding can result from long irritation by catheters or from injury during cystoscopy", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c025, section: gross, statement: "In suppurative cystitis pus may lie within the bladder wall, in the lumen or over the mucosa", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c026, section: gross, statement: "In pseudomembranous cystitis the mucosa is ulcerated and bleeding, beneath a loose film of fibrin and necrotic material", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c027, section: gross, statement: "Pseudomembranous cystitis typically complicates an infection in patients treated with cytotoxic drugs such as cyclophosphamide", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c028, section: gross, statement: "Schistosomiasis typically causes calcific cystitis: calcified eggs leave gritty, sand-like crusts on the bladder wall", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c029, section: gross, statement: "A late outcome is a stiff, fully calcified bladder, formed as the encrustations fuse", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c030, section: gross, statement: "Petechiae and bleeding cracks typically appear in the mucosa of interstitial cystitis when cystoscopy distends the bladder", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c031, section: gross, statement: "The Hunner ulcer of interstitial cystitis is a bleeding defect on the posterior bladder wall, within swollen mucosa", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c032, section: gross, statement: "In malakoplakia the bladder lining bears yellow, soft plaques", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
- {claimId: cystitis-c033, section: micro, statement: "Neutrophils in varying numbers infiltrate a stroma that is swollen with edema and bleeding in acute cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c034, section: micro, statement: "In chronic cystitis the lamina propria is scarred and infiltrated mainly by lymphocytes and plasma cells", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c035, section: micro, statement: "Follicular cystitis is the name for lymphoid follicles in an inflamed bladder lining", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c036, section: micro, statement: "Eosinophilic cystitis is the name for a dense eosinophil infiltrate in an inflamed bladder lining", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c037, section: micro, statement: "Tuberculosis typically gives granulomatous cystitis, and so can BCG instilled into the bladder against cancer", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c038, section: micro, statement: "In schistosomiasis the same bladder can show granulomas and eosinophil infiltrates around the eggs of S. haematobium", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c039, section: micro, statement: "Emphysematous cystitis shows small gas bubbles in the lamina propria and is caused by gas-producing bacilli, mostly in people with diabetes", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c040, section: micro, statement: "In the lining and muscle layer of interstitial cystitis mast cells are increased, and scarring goes with the chronic inflammation", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c041, section: micro, statement: "Marked acute inflammation fills a Hunner ulcer", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c042, section: micro, statement: "The inflammatory infiltrate of malakoplakia consists mainly of large macrophages with abundant eosinophilic cytoplasm", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c043, section: micro, statement: "Some of the macrophages of malakoplakia contain Michaelis-Gutmann bodies, which are blue-staining and layered", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c044, section: micro, statement: "Epithelial cells in an inflamed bladder often look atypical, usually only transiently, and this should not be mistaken for malignancy", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c045, section: micro, statement: "Urothelial hyperplasia and metaplasia that is not neoplastic is mostly tied to long-standing inflammation, for instance from infection", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c046, section: micro, statement: "The cysts of cystitis cystica are dilated Brunn nests that normal urothelium still lines", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c047, section: micro, statement: "When transitional epithelium turns into mucus-secreting epithelium, the change is called cystitis glandularis", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c048, section: ancillary, statement: "PAS stains the granules inside the macrophages of malakoplakia", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c049, section: ancillary, statement: "On electron microscopy the granules of malakoplakia are lysosomes stuffed with pieces of bacteria", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c050, section: clinical, statement: "In acute or chronic cystitis nearly every patient voids often and painfully and has low abdominal or pelvic ache", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c051, section: clinical, statement: "Interstitial cystitis brings painful voiding and blood in the urine, with pain above the pubis and an urge to void often", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c052, section: clinical, statement: "Interstitial cystitis strikes women of middle age, and the bladder inflammation is painful and lasting", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c053, section: clinical, statement: "Malakoplakia is much commoner in women and can arise at any age", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c054, section: clinical, statement: "Many patients with malakoplakia have a cancer, long-standing infection or impaired immunity behind them", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c055, section: clinical, statement: "Bladder malakoplakia looks clinically like any other chronic cystitis, with the same symptoms", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c056, section: diagnosis, statement: "Urine typically holds inflammatory cells in cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c057, section: diagnosis, statement: "A urine culture can name the organism behind cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c058, section: diagnosis, statement: "Interstitial cystitis nearly always gives a sterile urine culture", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c059, section: diagnosis, statement: "Cell atypia caused by cytotoxic drugs in the bladder tends to be short-lived", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c060, section: prognosis, statement: "Antibiotic treatment works well in most cases of acute cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c061, section: prognosis, statement: "Cystitis that recurs or becomes chronic can be difficult to treat", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c062, section: prognosis, statement: "Interstitial cystitis usually lingers and does not respond to treatment", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c063, section: prognosis, statement: "No effective treatment exists for malakoplakia", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c064, section: prognosis, statement: "A late result of radiation cystitis can be widespread scarring that may involve the whole wall and disable the bladder", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c065, section: prognosis, statement: "Where S. haematobium is endemic, infection with it raises the risk of bladder cancer", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c066, section: prognosis, statement: "Bladder cancer is frequent where schistosomiasis is endemic, as in parts of Africa such as Egypt and Sudan", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
- {claimId: cystitis-c067, section: prognosis, statement: "Squamous cell carcinoma is the usual type of bladder cancer linked to schistosomiasis", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c068, section: prognosis, statement: "Urothelial carcinoma is more likely in patients who have benign proliferative or metaplastic changes of the urothelium", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c069, section: prognosis, statement: "Nothing shows that these proliferative or metaplastic lesions are themselves precancerous", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c070, section: differential, statement: "Interstitial cystitis gives almost uniformly negative urine cultures, and chronic cases can have a Hunner ulcer", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c071, section: differential, statement: "Malakoplakia combines soft yellow plaques with macrophages containing Michaelis-Gutmann bodies", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c072, section: differential, statement: "Tuberculosis is the typical cause of granulomatous cystitis, and the bladder is nearly always infected after the kidney", sourceRef: {source: rubin-8e, chapter: "23", pages: "980-981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c073, section: differential, statement: "Schistosomal cystitis has eggs with granulomas and eosinophils, plus sand-like calcification", sourceRef: {source: rubin-8e, chapter: "23", pages: "981-982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c074, section: differential, statement: "Cystitis cystica and glandularis are non-neoplastic urothelial changes that must not be taken for cancer", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c075, section: high-yield, statement: "Coliform bacteria, above all E. coli, are the most common cause of cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "980"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c076, section: high-yield, statement: "Hemorrhagic cystitis is the typical result of cyclophosphamide", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c077, section: high-yield, statement: "Interstitial cystitis nearly always has negative urine cultures", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c078, section: high-yield, statement: "A Hunner ulcer can develop in chronic interstitial cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c079, section: high-yield, statement: "Michaelis-Gutmann bodies are found in some macrophages of malakoplakia", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c080, section: high-yield, statement: "Most bladder cancers linked to schistosomiasis are squamous cell carcinomas", sourceRef: {source: rubin-8e, chapter: "23", pages: "983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c081, section: traps, statement: "Nobody knows what causes interstitial cystitis, and its urine culture is nearly always sterile", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c082, section: traps, statement: "Pinpoint mucosal bleeding is frequently present in acute bacterial cystitis", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c083, section: traps, statement: "Atypia in an inflamed bladder tends to be short-lived and is no sign of cancer", sourceRef: {source: rubin-8e, chapter: "23", pages: "981"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c084, section: traps, statement: "Malakoplakia is a rare inflammatory disease with no known cause", sourceRef: {source: rubin-8e, chapter: "23", pages: "982"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: cystitis-c085, section: mnemonics, statement: "Schistosomal cystitis combines cancer risk of squamous type, calcified eggs, endemic occurrence in North Africa and the Middle East, and eosinophils", sourceRef: {source: rubin-8e, chapter: "23", pages: "980-983"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
