entity: benign-prostatic-hyperplasia
claims:
  - {claimId: benign-prostatic-hyperplasia-c001, section: definition, statement: "In BPH the prostate enlarges without cancer, because glandular and stromal tissue both grow", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c002, section: definition, statement: "Patients experience BPH as obstructed outflow of urine", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c003, section: definition, statement: "Asia has the lowest frequency of BPH, while Western Europe and the US have the highest", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c004, section: definition, statement: "In the US, prevalence is higher in Black men than in white men", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c005, section: definition, statement: "Men in their sixties are the age group most often symptomatic from BPH", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c006, section: definition, statement: "Autopsy series detect BPH much more often than symptoms would predict", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c007, section: definition, statement: "Past the age of 80, three out of four men have some prostatic hyperplasia", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c008, section: definition, statement: "A man below 40 years old rarely has BPH", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c009, section: etiology, statement: "Without testosterone the prostate does not develop and loses its secretory activity", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c010, section: etiology, statement: "The enzyme 5α-reductase produces DHT, the androgen's active form", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c011, section: etiology, statement: "Boys before puberty and castrated men are not affected by BPH", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c012, section: etiology, statement: "When the testes are removed before puberty, BPH of later life does not develop", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c013, section: pathogenesis, statement: "Growth of glandular and stromal cells follows binding of DHT to the nuclear receptors in those cells", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c014, section: pathogenesis, statement: "The event that initiates BPH has not been identified", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c015, section: pathogenesis, statement: "Men with BPH treated with the 5α-reductase blockers finasteride or dutasteride can have a smaller prostate", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c016, section: pathogenesis, statement: "Administered testosterone does not cause hyperplasia", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c017, section: pathogenesis, statement: "Aging lowers blood testosterone regardless of BPH status", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c018, section: pathogenesis, statement: "Blood testosterone relative to DHT can be low in BPH, while serum DHT is unchanged", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c019, section: gross, statement: "Nodules first form in the transitional zone, under the lining of the proximal urethra", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c020, section: gross, statement: "The urethra lies centrally and normal prostate around it, and both are squeezed as nodules grow", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c021, section: gross, statement: "In advanced BPH only a thin strip of normal prostate remains just under the capsule", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c022, section: gross, statement: "Each of the many nodules is wrapped by a fibrous pseudocapsule and the urethra is reduced to a narrow slit", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007-1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c023, section: gross, statement: "A surgical capsule is what the fibrotic, compressed peripheral gland is called", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c024, section: gross, statement: "Part of a larger nodule may show hemorrhage or infarction", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c025, section: gross, statement: "The gland may contain small calculi", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c026, section: micro, statement: "Gland epithelium plus the stroma's muscle cells and fibroblasts all multiply, in changing ratios", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c027, section: micro, statement: "Acini of unequal size lie disordered in the stroma in the usual fibromyoadenomatous pattern", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c028, section: micro, statement: "Papillary hyperplasia is frequent, and the acinar lining is a basal layer topped by tall columnar cells", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c029, section: micro, statement: "Corpora amylacea are pink-staining concretions built in layers, lying inside acini, often beside chronic inflammatory cells", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c030, section: micro, statement: "The expanding nodules compress the glands of the uninvolved peripheral prostate, which are often atrophic", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c031, section: micro, statement: "BPH commonly comes with nonspecific prostatitis: chronic inflammatory cells pack the glands and their surroundings, often with acute cells and focal gland loss", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c032, section: micro, statement: "About one fifth of BPH prostates have focal infarcts of different ages", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c033, section: micro, statement: "Ducts next to an infarct typically develop squamous metaplasia in their lining", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c034, section: ancillary, statement: "Microscopy shows fibromyoadenomatous nodules with acini lined by two epithelial layers, corpora amylacea and inflammation", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c035, section: clinical, statement: "Obstruction of the bladder outlet, from compression of the prostatic urethra, underlies the symptoms", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c036, section: clinical, statement: "Patients typically report urinating more often and a stream with less force", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007-1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c037, section: diagnosis, statement: "On rectal examination the prostate feels bigger than normal, and its firm surface is studded with nodules", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c038, section: prognosis, statement: "Residual urine rises, and the bladder wall muscle hypertrophies while the bladder dilates", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c039, section: prognosis, statement: "Acute and chronic pyelonephritis are among the complications of BPH", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c040, section: prognosis, statement: "Prolonged severe obstruction raises pressure upstream, causing hydroureter and hydronephrosis, and can end in renal failure and death", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c041, section: prognosis, statement: "Treatment options are surgery and drugs that block 5α-reductase", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c042, section: prognosis, statement: "In some patients added alpha-1 blockers loosen prostatic and bladder-neck muscle, improving urine flow", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c043, section: prognosis, statement: "Cryotherapy, radiofrequency ablation and transurethral resection are the interventional treatments", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c044, section: differential, statement: "Urethral compression is a late sign of prostate carcinoma, which usually starts in the peripheral glands", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c045, section: differential, statement: "Prostatitis associated with BPH is nonspecific, with chronic inflammatory cells infiltrating in and around glands", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c046, section: high-yield, statement: "BPH means nodular growth of glands and stroma with obstructive symptoms", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c047, section: high-yield, statement: "Nodule formation starts in the transitional zone beside the proximal urethra", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c048, section: high-yield, statement: "DHT from 5α-reductase stimulates growth, and finasteride or dutasteride lower prostate volume", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c049, section: high-yield, statement: "Pre-pubertal boys and castrated men do not develop BPH", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c050, section: high-yield, statement: "Nodules are fibromyoadenomatous and the epithelium is bilayered", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c051, section: high-yield, statement: "Long, serious obstruction can end in hydronephrosis and kidney failure", sourceRef: {source: rubin-8e, chapter: "23", pages: "1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c052, section: high-yield, statement: "The hyperplasia sits mostly around the urethra while carcinoma commonly originates in the outer glands", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c053, section: traps, statement: "Carcinoma typically starts in the peripheral glands, whereas hyperplasia occupies the periurethral gland", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c054, section: traps, statement: "Nodules begin around the urethra and, as they grow, press on it and deform it", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c055, section: traps, statement: "Testosterone in blood decreases with age and serum DHT is not different in BPH", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c056, section: traps, statement: "Supplying testosterone from outside does not lead to hyperplasia", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c057, section: traps, statement: "Many more men have BPH at autopsy than ever show urinary symptoms", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
  - {claimId: benign-prostatic-hyperplasia-c058, section: mnemonics, statement: "Fibromyoadenomatous nodules narrow the urethral lumen, blocking outflow and weakening the stream", sourceRef: {source: rubin-8e, chapter: "23", pages: "1007-1008"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
