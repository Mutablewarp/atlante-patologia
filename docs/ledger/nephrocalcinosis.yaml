entity: nephrocalcinosis
claims:
  - {claimId: nephrocalcinosis-c001, section: definition, statement: "Nephrocalcinosis means calcium deposited in the renal parenchyma", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c002, section: definition, statement: "Urate nephropathy is kidney damage from urate crystals in the interstitium and tubules", sourceRef: {source: rubin-8e, chapter: "22", pages: "963"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c003, section: definition, statement: "Primary gout is the classic chronic cause of urate nephropathy, though any state of raised blood uric acid can produce it", sourceRef: {source: rubin-8e, chapter: "22", pages: "963"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c004, section: definition, statement: "Calcium stones, nephrocalcinosis or both can follow hypercalciuria", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c005, section: definition, statement: "Sarcoidosis, vitamin D excess, bone-destroying tumors and primary hyperparathyroidism are hypercalcemic states that lead to nephrocalcinosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c006, section: definition, statement: "Metastatic calcification is the type driven by hypercalcemia, and in the kidney it produces nephrocalcinosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c007, section: definition, statement: "Dystrophic calcification is calcium laid down in renal tissue that was already injured, for instance after an infarct", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c009, section: micro, statement: "Calcification of tubular basement membranes is most conspicuous in the proximal convoluted tubules", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c010, section: micro, statement: "Calcium precipitates are also present in the interstitial tissue", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c011, section: micro, statement: "Wedge-shaped scars separated by better-preserved kidney tissue can develop when hypercalcemia is severe, for example in primary hyperparathyroidism", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c013, section: micro, statement: "In acute phosphate nephropathy the interstitium is scarred and chronically inflamed, and calcium phosphate lies in the damaged collecting ducts and distal tubules", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c014, section: micro, statement: "Yellow streaks in the papillae point to acute urate nephropathy, where uric acid has crystallized inside the collecting ducts", sourceRef: {source: rubin-8e, chapter: "22", pages: "963-964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c015, section: micro, statement: "Frozen sections show birefringent crystals; after processing the tubular deposits look amorphous", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c017, section: micro, statement: "In chronic urate nephropathy the interstitium slowly fills with urate and the cortex scars and shrinks", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c018, section: micro, statement: "Giant cells and a granulomatous pattern may occur in the inflammatory ring around the urate crystals of a gouty tophus", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c019, section: diagnosis, statement: "The gouty tophus is diagnostic", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c021, section: diagnosis, statement: "Kidney injury appearing weeks after a phosphate preparation taken before colonoscopy points to acute phosphate nephropathy", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c022, section: diagnosis, statement: "Acute urate nephropathy presents as acute kidney injury", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c024, section: differential, statement: "Calcium deposits in the kidney after hypercalcemia are metastatic calcification", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c025, section: differential, statement: "Calcium in already damaged kidney tissue, such as an infarct, is dystrophic", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c026, section: differential, statement: "In light-chain cast nephropathy, casts with a glassy look fill the distal tubules and collecting ducts", sourceRef: {source: rubin-8e, chapter: "22", pages: "963"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c027, section: differential, statement: "Immunostaining shows light chains and Tamm-Horsfall protein in light-chain cast nephropathy", sourceRef: {source: rubin-8e, chapter: "22", pages: "963"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c028, section: high-yield, statement: "Sarcoidosis, vitamin D excess, hyperparathyroidism and osteolytic tumors raise calcium and cause nephrocalcinosis of the metastatic type", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c031, section: high-yield, statement: "In processed sections urate deposits look amorphous, while frozen sections show birefringent crystals", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c032, section: high-yield, statement: "The gouty tophus is diagnostic", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c033, section: high-yield, statement: "Tumor lysis syndrome injures the kidney because urate crystals, forming in the acidic collecting ducts, clog them", sourceRef: {source: rubin-8e, chapter: "22", pages: "963"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c034, section: traps, statement: "Hypercalcemia has no recognized link to the small incidental calcium deposits found in some kidneys at autopsy", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c035, section: traps, statement: "Calcium-containing stones are nephrolithiasis, distinct from nephrocalcinosis, which is calcium deposited in the renal parenchyma", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
  - {claimId: nephrocalcinosis-c036, section: traps, statement: "Fewer than half of patients with chronic gout have significant renal dysfunction, though most show microscopic kidney lesions", sourceRef: {source: rubin-8e, chapter: "22", pages: "964"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
