entity: rheumatic-heart-disease
claims:
  - { claimId: rheumatic-heart-disease-c001, section: definition, statement: "In children, a streptococcal infection can be followed by rheumatic fever, an inflammation reaching heart, joints and central nervous system.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c002, section: definition, statement: "The cardiac part of the disease is acute carditis followed by residual valve deformity.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665-667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c003, section: definition, statement: "Onset after age 30 is rare; the usual patients are children aged 5 to 15.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c004, section: definition, statement: "In the United States the disease has declined greatly and seldom kills.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c005, section: definition, statement: "Young people still die of the cardiac effects in parts of Africa and Asia, among other regions.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c006, section: etiology, statement: "The infection is nearly always pharyngitis, caused by S. pyogenes, group A beta-hemolytic streptococcus.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c007, section: etiology, statement: "It is not known why only a few infected people get rheumatic fever.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c008, section: etiology, statement: "An abnormal immune reaction is needed, in a host with susceptibility genes infected by a rheumatogenic strain.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c009, section: etiology, statement: "Attack rate can reach 3% in certain streptococcal pharyngitis epidemics.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c010, section: pathogenesis, statement: "Autoimmunity with molecular mimicry is the probable mechanism.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c011, section: pathogenesis, statement: "Cardiac sarcolemma and valve glycopeptides are also recognized by antibodies and T cells directed at streptococcal antigens.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c012, section: pathogenesis, statement: "Myosin and other heart proteins have regions structurally like a coiled alpha-helical region of streptococcal M protein.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c013, section: pathogenesis, statement: "Myocardial epitopes and M protein are both recognized by antibodies from acute rheumatic fever patients.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c014, section: pathogenesis, statement: "Antibodies against collagen can arise because the PARF region of some M proteins binds type IV collagen.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665-666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c015, section: pathogenesis, statement: "Abnormal cytokine production may follow when streptococcal antigens resemble HLA class II molecules.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c016, section: gross, statement: "The heart tends to be dilated in severe disease at the earliest phase.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c017, section: gross, statement: "In the acute stage the leaflets are inflamed and edematous.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c018, section: gross, statement: "Left-sided valves close at much higher pressure than right-sided ones, so they sustain the worst injury.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c019, section: gross, statement: "Verrucae are tiny fibrin nodules deposited where endothelium has been lost along leaflet closure lines, giving verrucous endocarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c020, section: gross, statement: "Bread-and-butter pericarditis of the acute phase is a fibrin exudate on visceral and parietal pericardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c021, section: gross, statement: "Healing scars the leaflets, stiffening them and making them thicker and smaller.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c022, section: gross, statement: "Healed verrucae turn into fibrous bridges joining adjacent leaflets, chiefly at the commissures (commissural fusion).", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c023, section: gross, statement: "Chronic rheumatic disease strikes the mitral valve most often and worst.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c024, section: gross, statement: "In chronic mitral valvulitis commissures and chordae often fuse, and the leaflets become thick and calcified.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c025, section: gross, statement: "Viewed from the ventricular side, the severely affected mitral orifice is a fixed narrow slit, the fish mouth.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667-668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c026, section: gross, statement: "The rough MacCallum plaque of atrial endocardium results from the mitral regurgitant jet striking the posterior left atrium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c027, section: gross, statement: "The aortic valve is second most affected; in older patients the cusps often calcify on top of fibrous thickening and commissural fusion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c028, section: gross, statement: "Mitral and aortic lesions almost always coexist with tricuspid deformity caused by recurrent attacks.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667-668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c029, section: gross, statement: "The pulmonic valve is seldom involved.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c030, section: micro, statement: "In the earliest phase, before granulomas form, the myocardial infiltrate is nonspecific and mostly lymphocytes and macrophages.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c031, section: micro, statement: "Fibrinoid degeneration of collagen marks this early phase.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c032, section: micro, statement: "Some weeks after symptoms start, rheumatic myocarditis develops its granulomatous hallmark, the Aschoff body.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c033, section: micro, statement: "Early on, inflammatory cells surround a perivascular patch of swollen eosinophilic collagen.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c034, section: micro, statement: "Later it is a granuloma: giant cells lie among the inflammatory cells of the outer rim, around a fibrinoid center.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c035, section: micro, statement: "Eventually a nodular scar takes the place of the Aschoff body.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c036, section: micro, statement: "Anitschkow cells are macrophages whose nuclei, because of a central chromatin band, look like a caterpillar lengthwise and an owl eye in cross-section.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666-667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c037, section: micro, statement: "A multinucleated Anitschkow cell is an Aschoff giant cell.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c038, section: ancillary, statement: "Surgically excised rheumatic mitral valves of chronic disease can be examined grossly (Fig. 17-31).", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c039, section: ancillary, statement: "The myocardial interstitium can show Aschoff bodies with Anitschkow cells and Aschoff giant cells (the stain is not stated).", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c040, section: ancillary, statement: "Rising antistreptolysin O or anti-DNase B titers document a recent group A streptococcal infection.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c041, section: clinical, statement: "Symptoms appear two to three weeks after an S. pyogenes infection.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c042, section: clinical, statement: "By the time symptoms begin, throat swabs usually grow no organisms.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c043, section: clinical, statement: "Carditis, a major criterion, shows as congestive heart failure, pericarditis, cardiomegaly or murmurs.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c044, section: clinical, statement: "Polyarthritis and chorea are major criteria.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c045, section: clinical, statement: "Erythema marginatum and subcutaneous nodules are major criteria.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c046, section: clinical, statement: "Minor criteria are prior rheumatic fever, arthralgia, fever, inflammatory laboratory changes and ECG changes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c047, section: diagnosis, statement: "No test is specific for rheumatic fever.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c048, section: diagnosis, statement: "The Jones criteria require either two major criteria or one major plus two minor.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c049, section: diagnosis, statement: "Proof of a recent streptococcal infection makes the diagnosis more likely.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c050, section: prognosis, statement: "Acute rheumatic carditis has a low death rate.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c051, section: prognosis, statement: "Heart failure from myocarditis is the main cause of death.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c052, section: prognosis, statement: "Most acute manifestations resolve in under 3 months.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c053, section: prognosis, statement: "Myocardial and pericardial involvement generally heals leaving no lasting damage.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c054, section: prognosis, statement: "Months or years after even one acute attack, the valves may be badly scarred.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c055, section: prognosis, statement: "Valve injury progressively increases with repeated acute episodes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c056, section: prognosis, statement: "Relapses are linked to group A streptococcal types that are new to the patient.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c057, section: prognosis, statement: "Soon after an attack as many as 65% of patients may have a recurrence, against only 5% after 10 years.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c058, section: prognosis, statement: "Early antibiotics for streptococcal pharyngitis prevent a first attack and prevent recurrences less often.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c059, section: prognosis, statement: "Acute symptoms are managed with corticosteroids and salicylates because no specific treatment exists.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c060, section: prognosis, statement: "Right ventricular hypertrophy is the late result of mitral stenosis, which first causes left atrial hypertrophy and dilation and then pulmonary congestion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c061, section: prognosis, statement: "Scarred rheumatic valves are easily colonized, so bacteremia, as during dental work, can cause bacterial endocarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c062, section: prognosis, statement: "Thrombi on the wall of an atrium or ventricle occur in 40% of patients with rheumatic valve disease.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c063, section: prognosis, statement: "Thromboemboli from them can infarct various organs.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c064, section: prognosis, statement: "Rarely a large stalked thrombus from the left atrial appendage obstructs the mitral orifice, acting as a ball valve.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c065, section: prognosis, statement: "Mitral and aortic rheumatic disease can both lead to heart failure.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c066, section: prognosis, statement: "The fibrinous pericarditis of acute attacks is often followed by adhesive pericarditis, which seldom constricts.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c067, section: differential, statement: "Lupus (Libman-Sacks) vegetations of at most 4 mm usually involve the mitral valve, sitting on the atrial face of the leaflet near the annulus.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c068, section: differential, statement: "Rheumatic verrucae are found along the closure lines of the leaflets.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c069, section: differential, statement: "Bacterial endocarditis is a complication that develops on scarred rheumatic valves, not part of the rheumatic process.", sourceRef: { source: rubin-8e, chapter: "17", pages: "668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c070, section: differential, statement: "Rheumatic myocarditis is nonspecific at first and becomes granulomatous with Aschoff bodies later.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c071, section: high-yield, statement: "Symptoms follow group A streptococcal infection by 2 to 3 weeks and the likely mechanism is molecular mimicry.", sourceRef: { source: rubin-8e, chapter: "17", pages: "665, 667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c072, section: high-yield, statement: "In the acute phase all three heart layers are inflamed (pancarditis): endocardium, myocardium and pericardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c073, section: high-yield, statement: "Aschoff bodies containing Anitschkow cells are the typical myocardial lesion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c074, section: high-yield, statement: "The chronic lesion is mitral stenosis with a fish-mouth orifice, aortic disease coming second.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c075, section: high-yield, statement: "The Jones criteria are used because no specific test exists.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c076, section: traps, statement: "Rheumatic fever starts 2 to 3 weeks after the streptococcal infection, when throat cultures are usually negative.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c077, section: traps, statement: "Myocardial and pericardial involvement usually resolves, while valve damage is long-lasting.", sourceRef: { source: rubin-8e, chapter: "17", pages: "667" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c078, section: traps, statement: "Aschoff bodies come several weeks after symptoms start; the earliest phase is a nonspecific myocarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c079, section: mnemonics, statement: "The valves are affected in order of frequency: mitral, aortic, tricuspid, then pulmonic.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666-668" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rheumatic-heart-disease-c080, section: mnemonics, statement: "Acute rheumatic carditis involves pericardium, endocardium and myocardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "666" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
