entity: acute-pancreatitis
claims:
  - { claimId: acute-pancreatitis-c001, section: definition, statement: "Abnormal release of pancreatic digestive enzymes drives the disease, and inflammation is only part of the picture.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c002, section: definition, statement: "Leaked activated enzymes autodigest pancreatic and extrapancreatic tissue.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c003, section: definition, statement: "The mild form mostly spares acinar cells and usually causes no systemic effects; it shows stromal edema and acute inflammation.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c004, section: definition, statement: "Massive necrosis with hemorrhage characterizes the severe form, which is sometimes fatal and can bring systemic manifestations.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c005, section: definition, statement: "Recurring attacks can progress to chronic pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c006, section: etiology, statement: "Gallstones can block the pancreatic duct and trigger an attack.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c007, section: etiology, statement: "Gallstones are found in about 45% of people with acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c008, section: etiology, statement: "A stone wedged at the ampulla is found in only a few cases, so why stones lead to pancreatitis is unexplained.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c009, section: etiology, statement: "Roughly one-third of acute pancreatitis cases are seen in people with chronic alcohol abuse.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c010, section: etiology, statement: "Only a minority of chronic alcoholics develop acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c011, section: etiology, statement: "Heavy drinking can make the sphincter of Oddi swell or contract.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c012, section: etiology, statement: "Pancreatic juice flow also rises indirectly, because alcohol first boosts small-bowel secretion.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c013, section: etiology, statement: "Cytomegalovirus, coxsackievirus and mumps infections may lead to pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c014, section: etiology, statement: "Some therapeutic drugs, for example diuretics and azathioprine, have been reported to cause acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c015, section: etiology, statement: "Surgical manipulation, ERCP and blunt abdominal trauma can cause acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c016, section: etiology, statement: "The pancreas may be injured by acute ischemia caused by thrombosis, vasculitis or shock.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c017, section: etiology, statement: "Hyperlipidemia can lead to acute pancreatitis, probably through leaked lipase splitting triglycerides into cell-damaging fatty acids.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c018, section: etiology, statement: "Acute pancreatitis is linked to high blood calcium from any cause.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c019, section: etiology, statement: "Idiopathic cases, with no identified cause, rank third in frequency.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c020, section: etiology, statement: "Ampullary or pancreatic neoplasms can obstruct the ducts and anatomic anomalies such as pancreas divisum cause duct insufficiency, both leading to acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c021, section: pathogenesis, statement: "Active enzymes leaking from the cells digest the gland and nearby tissue, after acinar cell injury or duct obstruction.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c022, section: pathogenesis, statement: "Enzyme inhibitors, inactive precursor synthesis and enzyme compartmentalization in intracellular membrane systems normally shield acinar cells from their own enzymes.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c023, section: pathogenesis, statement: "The protection offered by the various trypsin inhibitors is clearly incomplete.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c024, section: pathogenesis, statement: "Trypsin does not kill cells directly; it is the central trigger that activates other proenzymes, such as prophospholipase A2 and proelastase.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c025, section: pathogenesis, statement: "Early proenzyme activation is suspected to start with enzyme backflow through the duct wall when a narrowed or blocked duct builds up pressure.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c026, section: pathogenesis, statement: "Fat-cell triglycerides split by lipase release fatty acids, which bind calcium and magnesium to form soaps.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c027, section: pathogenesis, statement: "Extra peripancreatic fat may explain why obesity raises risk, mainly of severe disease: leaked lipase finds more fat to necrose.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c028, section: gross, statement: "In the hemorrhagic form the gland is initially swollen and blood-filled.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c029, section: gross, statement: "Friable, hemorrhagic foci develop quickly, starting as pale gray spots within the first day.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c030, section: gross, statement: "In severe cases a huge retroperitoneal hematoma replaces most of the gland as the foci enlarge and multiply; little pancreatic tissue stays recognizable.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c031, section: gross, statement: "Outside the pancreas, the fat and nearby mesentery show yellow-white foci of necrosis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c032, section: gross, statement: "Calcium and magnesium soaps progressively stiffen the dead fat, which is soft early and chalky later.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c033, section: gross, statement: "Soap formation may depress blood calcium, in some cases enough to cause neuromuscular irritability.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c034, section: micro, statement: "Some acute inflammation often accompanies the most prominent findings, acinar cell necrosis and fat necrosis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c035, section: micro, statement: "Pancreatic necrosis tends to occur in scattered patches and seldom affects the whole gland.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c036, section: micro, statement: "Healing of an acute episode can leave uneven fibrosis, sometimes with calcification, which is chronic pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c037, section: ancillary, statement: "Routine microscopy of acute pancreatitis looks for acinar cell necrosis, fat necrosis and acute inflammation.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c038, section: ancillary, statement: "Elevated serum amylase and lipase are the diagnostic test; the reference pages describe no special stain, immunohistochemistry or molecular test.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c039, section: clinical, statement: "Nausea and vomiting come with severe pain in the epigastrium, which radiates to the upper back.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c040, section: clinical, statement: "Circulatory collapse and shock can develop within hours.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c041, section: clinical, statement: "Prolonged severe shock can lead to ARDS and acute renal failure within the first week.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c042, section: diagnosis, statement: "Raised serum amylase and lipase, documented within 24 to 72 hours, make the diagnosis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c043, section: diagnosis, statement: "Enzymes spill from damaged acinar cells into the blood and retroperitoneum in the first phase of the illness.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c044, section: prognosis, statement: "Some survivors develop a pseudocyst, a pocket with a connective-tissue wall that holds enzyme-rich fluid and debris.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c045, section: prognosis, statement: "The duodenum and other adjacent structures may be squeezed, sometimes blocked, by a growing pseudocyst.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c046, section: prognosis, statement: "An infected pseudocyst can form an abscess.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c047, section: prognosis, statement: "A pseudocyst rarely ruptures; when it does, the spill causes peritonitis from chemical irritation, infection, or both.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c048, section: prognosis, statement: "Gut-derived gram-negative bacteria can infect the dead pancreatic tissue, an occasional event that sharply raises mortality.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c049, section: prognosis, statement: "Severe disease can overwhelm the kidneys, lungs and clotting, and cause shock.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c050, section: prognosis, statement: "Chronic pancreatitis can develop after repeated acute attacks, through gradual scarring of the gland.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c051, section: differential, statement: "Pain may recur, or digestive and hormonal failure may be the only sign, as scar gradually replaces the gland.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c052, section: differential, statement: "Fat necrosis in acute pancreatitis results from activated lipase and is accompanied by acinar cell necrosis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c053, section: differential, statement: "Gallstones can cause acute pancreatitis, but pancreatitis from a stone blocking the duct seems not to become chronic.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c054, section: high-yield, statement: "Acute pancreatitis is autodigestion by leaked activated enzymes.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c055, section: high-yield, statement: "Trypsin activation is central and activates prophospholipase A2 and proelastase.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c056, section: high-yield, statement: "Gallstones and chronic alcohol abuse are the leading causes, followed by idiopathic cases in third place.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c057, section: high-yield, statement: "The severe form is hemorrhagic, and fat necrosis with calcium and magnesium soaps is a typical accompanying finding.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c058, section: high-yield, statement: "Elevated serum amylase and lipase are diagnostic.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c059, section: high-yield, statement: "A pseudocyst may enlarge, become infected as an abscess, or rupture.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c060, section: traps, statement: "Acute pancreatitis is driven by released pancreatic enzymes, and inflammation is only part of the picture.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c061, section: traps, statement: "Only a small minority of patients with acute pancreatitis have a stone lodged in the ampulla.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c062, section: traps, statement: "Trypsin acts on cells indirectly, by switching on other proenzymes.", sourceRef: { source: rubin-8e, chapter: "21", pages: "902" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c063, section: traps, statement: "Soap formation in fat necrosis may depress blood calcium.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c064, section: traps, statement: "Only a minority of chronic alcoholics develop acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-pancreatitis-c065, section: mnemonics, statement: "Gallstones, alcohol, hyperlipidemia, and abdominal trauma or ERCP are causes of acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "903" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
