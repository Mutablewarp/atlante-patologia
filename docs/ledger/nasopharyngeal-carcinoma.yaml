entity: nasopharyngeal-carcinoma
claims:
- {claimId: nasopharyngeal-carcinoma-c001, section: definition, statement: "Nasopharyngeal carcinoma has two main forms, keratinizing and nonkeratinizing.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c002, section: definition, statement: "The nonkeratinizing type may be differentiated or undifferentiated.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c003, section: definition, statement: "No other cancer arising in the nasopharynx comes close to nasopharyngeal carcinoma in frequency.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c004, section: definition, statement: "The undifferentiated nonkeratinizing form is seen most often in southeast Asia and some African regions.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c005, section: etiology, statement: "Nonkeratinizing nasopharyngeal carcinomas are associated with EBV infection.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c006, section: etiology, statement: "Roughly 85% of nasopharyngeal carcinoma patients have EBV antibodies.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c007, section: etiology, statement: "In 75% to 100% of nonkeratinizing, undifferentiated tumors the viral genome is detected.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c008, section: etiology, statement: "EBV detection is more variable in keratinizing nasopharyngeal carcinomas.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c009, section: etiology, statement: "No environmental cause of nasopharyngeal carcinoma has been pinned down.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c010, section: etiology, statement: "Chinese patients carry the HLA A2/sin type more often, so a hereditary predisposition is suspected.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c011, section: pathogenesis, statement: "Deletions are frequent in these tumors, and those on 3p, 9p and 14q are the ones singled out.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c012, section: gross, statement: "Nasopharyngeal carcinoma occurs in the fossa of Rosenmuller and on the lateral wall of the nasopharynx.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c013, section: micro, statement: "Distinct cell borders and a stratified look characterize the differentiated nonkeratinizing pattern.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c014, section: micro, statement: "Undifferentiated tumors grow as clusters of cells that blend together as a syncytium and have poorly defined borders.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c015, section: micro, statement: "In undifferentiated tumors the nucleus is large and oval and the eosinophilic cytoplasm is scant.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c016, section: micro, statement: "Undifferentiated tumors may carry a prominent lymphoid infiltrate.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316-1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c017, section: micro, statement: "The old term lymphoepithelioma, obsolete and misleading, was coined because of the lymphoid infiltrate.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c018, section: ancillary, statement: "On H&E, the differentiated pattern shows sharp, layered cells, while undifferentiated cells fuse together and have big oval nuclei.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c019, section: ancillary, statement: "Both subtypes of nonkeratinizing carcinoma express cytokeratin.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c020, section: ancillary, statement: "The tumor cells do not express hematologic or lymphoid markers.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c021, section: ancillary, statement: "In most cases ISH demonstrates EBV DNA in the tumor.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c022, section: clinical, statement: "The tumor's hidden site means it causes no symptoms for a long period.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c023, section: clinical, statement: "A palpable metastatic cervical node is how the disease first shows in about half of patients.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c024, section: clinical, statement: "Many patients with a neck node metastasis feel nothing wrong in the nasopharynx itself.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c025, section: clinical, statement: "Invasion of the orbit, cranium or parapharyngeal space gives neurologic and hearing symptoms.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c026, section: clinical, statement: "Tumor growth into the skull base involves the cranial nerves.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c027, section: clinical, statement: "Middle ear symptoms are produced by tumors at the fossa of Rosenmuller or the lateral nasopharyngeal wall.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c028, section: clinical, statement: "Eustachian tube obstruction is common.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c029, section: clinical, statement: "Because the local lymphatic network is abundant, cervical nodes are often involved early.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c030, section: diagnosis, statement: "Antibodies to EBV are present in most patients with nasopharyngeal carcinoma.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c031, section: diagnosis, statement: "EBV DNA can usually be detected in tumor tissue with in situ hybridization.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c032, section: diagnosis, statement: "The tumor expresses cytokeratin but not hematologic or lymphoid markers.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c033, section: prognosis, statement: "Undifferentiated nasopharyngeal carcinoma is radiosensitive.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c034, section: prognosis, statement: "When the tumor stays within the nasopharynx, most patients are alive at 5 years or longer.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c035, section: prognosis, statement: "Spread to the neck nodes or beyond, or cranial nerve involvement, worsens survival.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c036, section: differential, statement: "Angiofibroma is rich in vessels and invades nearby tissue, although its histology is benign.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1315"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c037, section: differential, statement: "Angiofibroma is seen mainly in teenage boys, though not only in them.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1315"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c038, section: differential, statement: "Angiofibroma biopsy is contraindicated because its poorly constricting vessels bleed heavily after injury.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1315"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c039, section: differential, statement: "In angiofibroma, nuclear beta-catenin staining is abnormally present in the stromal fibroblasts.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1315"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c040, section: differential, statement: "HPV-associated head and neck carcinoma is basaloid and nonkeratinizing, mostly from the palatine and lingual tonsils.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c041, section: differential, statement: "HPV-related tumors are often found first as neck node metastases, since the primary can be tiny and missed.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c042, section: differential, statement: "Patients with HPV-associated head and neck carcinoma are usually younger and do better overall.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c043, section: differential, statement: "In tonsillar HPV-related carcinoma the p16 stain is positive, and so is ISH for high-risk HPV RNA.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c044, section: differential, statement: "Lymphoma arises in the Waldeyer ring more often than at any other head and neck site.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c045, section: differential, statement: "Over half of Waldeyer ring lymphomas are large cell, and most are diffuse B-cell tumors.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c046, section: differential, statement: "Nasopharyngeal carcinoma expresses cytokeratin but not hematologic or lymphoid markers, unlike a lymphoma.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c047, section: high-yield, statement: "Nasopharyngeal carcinoma has keratinizing and nonkeratinizing types, and the nonkeratinizing ones are associated with EBV.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c048, section: high-yield, statement: "The undifferentiated form clusters in southeast Asia and some African regions.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c049, section: high-yield, statement: "EBV DNA in the tumor is usually shown by in situ hybridization.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c050, section: high-yield, statement: "Tumor cells express cytokeratin and no hematologic or lymphoid markers.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c051, section: high-yield, statement: "A cervical lymph node metastasis is the first sign in about half of patients.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c052, section: high-yield, statement: "Poor survival is predicted by nodal or distant metastasis or by cranial nerve involvement.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c053, section: high-yield, statement: "Undifferentiated nasopharyngeal carcinoma is radiosensitive.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c054, section: high-yield, statement: "Biopsy of angiofibroma is contraindicated because of the risk of brisk bleeding.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1315"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c055, section: traps, statement: "The tumor cells express cytokeratin and not lymphoid markers, so lymphoepithelioma is a carcinoma, not a lymphoma.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c056, section: traps, statement: "A cervical lymph node metastasis is the first sign in about half of patients, even without nasopharyngeal complaints.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c057, section: traps, statement: "In nonkeratinizing undifferentiated tumors the viral genome is found in 75% to 100% of cases, while keratinizing ones vary.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1316"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c058, section: traps, statement: "Biopsy of a nasopharyngeal angiofibroma is dangerous because of brisk bleeding.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1315"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c059, section: mnemonics, statement: "A palpable neck node is the first presentation in about half of patients.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c060, section: mnemonics, statement: "EBV DNA in the tumor is usually identified by in situ hybridization.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: nasopharyngeal-carcinoma-c061, section: mnemonics, statement: "The tumor expresses cytokeratin on immunohistochemistry.", sourceRef: {source: rubin-8e, chapter: "29", pages: "1317"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
