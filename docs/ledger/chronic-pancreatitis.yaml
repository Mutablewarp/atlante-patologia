entity: chronic-pancreatitis
claims:
  - { claimId: chronic-pancreatitis-c001, section: definition, statement: "Pancreatic tissue is steadily destroyed and fibrosis fills the space it leaves.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c002, section: definition, statement: "Some patients have pain that recurs or never stops, while in others the only sign is failing exocrine or endocrine function.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c003, section: definition, statement: "Treatment, clinical course and mechanism all remain poorly understood despite long study.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c004, section: etiology, statement: "Among adults, close to 80% of cases follow years of alcohol abuse, the single biggest cause.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c005, section: etiology, statement: "The chronic disease shares most of its causes with acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c006, section: etiology, statement: "Pancreas divisum or CFTR variants may predispose some drinkers, which would explain why few heavy drinkers fall ill.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c007, section: etiology, statement: "The cause can occasionally be a pancreatic duct that is blocked or deficient.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c008, section: etiology, statement: "Sudden duct blockage by a gallstone produces acute pancreatitis that apparently does not go on to become chronic.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c009, section: etiology, statement: "Fibrosis and atrophy of the gland accompany long-term acinar cell injury, with hemochromatosis as an example.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c010, section: etiology, statement: "Acute and chronic pancreatitis occur more often in patients with chronic kidney failure.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c011, section: etiology, statement: "Most patients with the groove form are alcoholics, and the disease lies between pancreatic head, bile duct and duodenum.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c012, section: etiology, statement: "Jaundice (from bile duct compression) and duodenal blockage are frequent results of the position of this form.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905-906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c013, section: etiology, statement: "Severe abdominal pain that keeps recurring from childhood is common in hereditary pancreatitis, a rare dominant disease.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c014, section: etiology, statement: "Trypsinogen often activates itself, and point mutations leave the gland with more trypsin.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c015, section: etiology, statement: "PRSS1, the gene for cationic trypsinogen, carries one of three point mutations in most patients, and SPINK1 mutations are also associated.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c016, section: etiology, statement: "Cystic fibrosis can end in chronic pancreatitis: sticky pancreatic secretions plug the ducts and dilate them.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c017, section: etiology, statement: "Many idiopathic cases may be cystic fibrosis or hereditary pancreatitis without other features, since 10% to 30% carry CFTR variants.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c018, section: pathogenesis, statement: "The favored but debated theory holds that small ducts become clogged with protein plugs because alcohol drives enzyme secretion without more fluid.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c019, section: pathogenesis, statement: "Initial plugging may give rise to nothing more than a mild acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c020, section: pathogenesis, statement: "A vicious cycle follows: new, more severe attacks become likelier as the gland scars and the plugs grow into calcium carbonate stones.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c021, section: pathogenesis, statement: "About half the patients never had acute pancreatitis, although repeated acute bouts with scarring could be one route.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c022, section: pathogenesis, statement: "Patients with autoimmune pancreatitis often also have inflammatory bowel disease, retroperitoneal fibrosis or another sclerosing autoimmune condition.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c023, section: pathogenesis, statement: "Type 1 is marked by more than 50 IgG4-bearing plasma cells per high-power field in the tissue together with raised serum IgG4.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c024, section: pathogenesis, statement: "Autoantibodies such as ANA and rheumatoid factor, with raised gamma globulins, point to an immune mechanism.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c025, section: pathogenesis, statement: "Inflammatory bowel disease is more closely tied to type 2, which has no IgG4-bearing plasma cells.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c026, section: pathogenesis, statement: "Steroid treatment may help in either type.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c027, section: gross, statement: "Chronic alcoholism underlies over 90% of the most frequent variant, calcifying pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c028, section: gross, statement: "Involvement can be of the entire gland, a part of it, or scattered areas.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c029, section: gross, statement: "Sectioning shows that normal lobules are gone, and the tissue is firm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c030, section: gross, statement: "Strictures or stones obstruct drainage, so the main duct and its branches commonly widen upstream.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c031, section: gross, statement: "Pseudocysts and abscesses frequently develop.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c032, section: gross, statement: "In late cystic fibrosis no parenchyma is left, because adipose tissue has replaced all of it.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c033, section: micro, statement: "Acini vanish from irregular scarred areas over wide regions of the gland, and the endocrine part goes later.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c034, section: micro, statement: "Islets are eventually lost; before that they are trapped in dense scar and can seem merged and larger.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c035, section: micro, statement: "Scar tissue holds myofibroblasts and a variable infiltrate of macrophages, lymphocytes and plasma cells.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c036, section: micro, statement: "Calcified protein deposits inside ducts of any size are seen more often in alcohol-related disease.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c037, section: micro, statement: "Squamous change can occur in the duct lining, which may also be thinned or thickened.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c038, section: micro, statement: "In autoimmune pancreatitis the ducts are ringed by many lymphocytes and plasma cells, and the tissue around them is scarred.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c039, section: micro, statement: "Type 2 also has acute inflammatory cells within the epithelium.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c040, section: micro, statement: "Both autoimmune types show venulitis that obliterates small veins.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c041, section: ancillary, statement: "On H&E sections, expect widened ducts with calcified protein plugs inside fibrosis with acinar dropout.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c042, section: ancillary, statement: "In type 1 autoimmune pancreatitis the tissue shows more than 50 IgG4-positive plasma cells per high-power field (the source describes this finding, not a formal definition).", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c043, section: ancillary, statement: "Blood IgG4 is high in type 1.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c044, section: ancillary, statement: "Gene variants matter for cause: PRSS1 and SPINK1 in the inherited disease, CFTR in part of the idiopathic group.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c045, section: clinical, statement: "In about half of patients, repeated acute episodes came first.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c046, section: clinical, statement: "A third of patients never have an acute attack; their pain creeps in gradually and is either steady or comes and goes.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c047, section: clinical, statement: "A few patients first come to attention with diabetes or malabsorption because the disease is initially painless in them.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c048, section: clinical, statement: "Unremitting upper abdominal pain that spreads to the back can incapacitate patients, and many lose a lot of weight.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c049, section: clinical, statement: "In the autoimmune form, one patient may have only abdominal discomfort and another painless jaundice.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c050, section: diagnosis, statement: "The disease is usually recognized late, when it is already far advanced.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c051, section: diagnosis, statement: "Diabetes, malabsorption or both have usually developed by the time calcification is visible on X-ray.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c052, section: diagnosis, statement: "In autoimmune pancreatitis, imaging may reveal uneven, beaded pancreatic and bile ducts or a mass resembling a tumor.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c053, section: diagnosis, statement: "Raised serum IgG4 or autoantibodies favor an autoimmune type of pancreatitis (the ledger row listed gamma globulins, which the sentence does not state).", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c054, section: prognosis, statement: "Local complications include pseudocysts, duct stones and ascites.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c055, section: prognosis, statement: "Loss of gland function leads to diabetes and fat malabsorption, with steatorrhea and vitamin K deficiency (the figure shows vitamin K under fat malabsorption).", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c056, section: prognosis, statement: "Pancreatic ductal adenocarcinoma later develops in roughly 40% of patients with the hereditary form.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c057, section: prognosis, statement: "About half of patients die within 20-25 years, with an annual death rate of 3-4%.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c058, section: prognosis, statement: "Besides the roughly 20% of deaths from complications of acute attacks, the rest stem from other causes, mainly alcohol-related.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c059, section: differential, statement: "Acute pancreatitis causes sudden severe epigastric pain, with bleeding and necrosis of fat and acini.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c060, section: differential, statement: "A rise of serum amylase and lipase during the first 24-72 hours establishes acute pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c061, section: differential, statement: "Groove pancreatitis and autoimmune pancreatitis can be mistaken for pancreatic ductal adenocarcinoma (a mass-like lesion is stated for the autoimmune form only).", sourceRef: { source: rubin-8e, chapter: "21", pages: "905-906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c062, section: differential, statement: "IgG4-positive tissue plasma cells and high serum IgG4 identify type 1 autoimmune pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c063, section: high-yield, statement: "Alcohol underlies close to 80% of adult chronic pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c064, section: high-yield, statement: "Typical picture: scarring with acinar loss, widened ducts, calcified protein plugs.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c065, section: high-yield, statement: "The inherited disease is dominant and mostly caused by PRSS1 mutations.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c066, section: high-yield, statement: "Type 1 autoimmune disease: high IgG4, possible steroid response.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c067, section: high-yield, statement: "Type 2 has no IgG4 plasma cells and is associated with inflammatory bowel disease.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c068, section: high-yield, statement: "Pseudocyst, diabetes and steatorrhea are among the complications.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c069, section: traps, statement: "Around half of patients have never had an acute attack.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c070, section: traps, statement: "The acute attack caused by a sudden stone obstruction does not seem to be followed by chronic disease.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c071, section: traps, statement: "Some idiopathic cases carry CFTR variants, and many may be cystic fibrosis or hereditary pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c072, section: traps, statement: "Groove and autoimmune pancreatitis can resemble a tumor, so patients are often operated on out of suspicion of cancer or a cystic lesion.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905-906" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c073, section: traps, statement: "Most heavy drinkers never end up with symptomatic chronic pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "905" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: chronic-pancreatitis-c074, section: mnemonics, statement: "Pseudocyst, ascites, diabetes and steatorrhea are four complications of chronic pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
