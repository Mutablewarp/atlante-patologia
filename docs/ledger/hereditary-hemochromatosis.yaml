entity: hereditary-hemochromatosis
claims:
  - { claimId: hereditary-hemochromatosis-c001, section: definition, statement: "HH is an inherited disorder with excessive intestinal iron absorption that leads to iron accumulation in the body.", sourceRef: { source: rubin-8e, chapter: "20", pages: "872, 874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c002, section: definition, statement: "HH is systemic, and parenchymal cells of the liver, heart and pancreas are the ones most harmed by the toxic iron.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c003, section: definition, statement: "HH is the most frequent inherited metabolic disease among white people.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c004, section: definition, statement: "Onset of HH is most often between ages 40 and 60.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c005, section: definition, statement: "Iron loss through menstruation probably explains why men are affected far more often than women.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c006, section: definition, statement: "Because the gut absorbs only a small amount of iron per day at most, hemochromatosis takes years to develop.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c007, section: etiology, statement: "In most HH cases the mutated gene is HFE, on the short arm of chromosome 6.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c008, section: etiology, statement: "Ninety percent of HH patients carry the C282Y change in both copies of HFE.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c009, section: etiology, statement: "H63D is a less common HFE mutation.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c010, section: etiology, statement: "Mutation of the hepcidin gene HAMP is very rare; TfR2 and HJV (hemojuvelin) mutations cause other rare forms, all acting on hepcidin expression.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c011, section: etiology, statement: "Mutations in ferroportin are listed among causes of hereditary hemochromatosis with increased iron absorption.", sourceRef: { source: rubin-8e, chapter: "20", pages: "875" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c012, section: etiology, statement: "Genetic and epigenetic modifiers are the likely reason that some C282Y homozygotes never develop HH or iron overload.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c013, section: etiology, statement: "Secondary iron overload is iron excess in people who carry no HH mutation.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c014, section: etiology, statement: "Causes of secondary iron overload include hematologic disorders with ineffective erythropoiesis, huge dietary iron intake, parenteral iron and multiple transfusions.", sourceRef: { source: rubin-8e, chapter: "20", pages: "872, 876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c015, section: etiology, statement: "Porphyria cutanea tarda and chronic liver disease such as alcoholic liver disease are listed as causes of increased iron absorption.", sourceRef: { source: rubin-8e, chapter: "20", pages: "875" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c016, section: etiology, statement: "Alcohol probably aggravates iron storage and cell damage, and many secondary-overload patients are long-term heavy drinkers.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c017, section: pathogenesis, statement: "Because iron cannot be excreted, the amount absorbed through the gut is the main control of body iron.", sourceRef: { source: rubin-8e, chapter: "20", pages: "872" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c018, section: pathogenesis, statement: "Ferroportin exports iron from enterocytes, hepatocytes and macrophages; hepcidin made in the liver binds it, halting export and triggering its degradation.", sourceRef: { source: rubin-8e, chapter: "20", pages: "872, 873" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c019, section: pathogenesis, statement: "Normal hepcidin production needs HFE, TfR2 and hemojuvelin.", sourceRef: { source: rubin-8e, chapter: "20", pages: "872" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c020, section: pathogenesis, statement: "Because hepcidin is reduced in HH, the situation resembles iron insufficiency even though iron is abundant.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874, 875" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c021, section: pathogenesis, statement: "With insufficient hepcidin to restrain ferroportin, more iron passes through enterocytes and more is exported by macrophages and hepatocytes.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c022, section: pathogenesis, statement: "More iron arrives than the transferrin system can handle, so circulating free iron becomes very high.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c023, section: pathogenesis, statement: "Hepatocyte storage and export capacity are exceeded as free iron floods in by a poorly understood pathway, so the cells accumulate iron.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874, 875" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c024, section: pathogenesis, statement: "Iron-loaded cells in HH probably tolerate oxidative injury poorly, because iron fuels reactive oxygen species damage.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c025, section: pathogenesis, statement: "On a low-iron diet hemochromatosis is unlikely, because iron absorption partly depends on intake.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c026, section: pathogenesis, statement: "Iron absorption rises in sickle cell anemia and thalassemia major even with saturated transferrin, adding to iron from hemolysis and transfusions.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c027, section: gross, statement: "Late in HH the liver has micronodular cirrhosis and is enlarged and red-brown.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c028, section: gross, statement: "In HH the pancreas is rust colored and fibrotic.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c029, section: micro, statement: "Iron granules, mostly ferric iron in lysosomes, fill hepatocytes and the lining of the bile ducts.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c030, section: micro, statement: "Kupffer cells phagocytose necrotic hepatocytes and so become conspicuously iron-laden late in HH.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c031, section: micro, statement: "Bile ductules and macrophages in the fibrous bands stand out for their iron.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c032, section: micro, statement: "Micronodular cirrhosis in HH eventually becomes macronodular.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874, 876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c033, section: micro, statement: "Acini and islets of Langerhans both lose cells in the iron-laden pancreas.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c034, section: micro, statement: "Ventricular muscle holds more iron pigment than atrial muscle, and myocyte death often leaves fibrosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c035, section: micro, statement: "In most HH patients iron nonspecifically drives basal melanocytes to increase melanin production.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c036, section: micro, statement: "Only some HH patients have marked iron deposits in the skin itself.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c037, section: micro, statement: "In secondary siderosis hepatocytes get iron only after Kupffer cells have been loaded uniformly.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c038, section: micro, statement: "In cirrhosis from secondary overload, iron is often confined to the edges of nodules, and hepatic iron deposition is generally lower than in HH (the page says deposition, not total iron).", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c039, section: ancillary, statement: "Perls staining turns the iron of HH blue, and it lines the bile canaliculi of hepatocytes.", sourceRef: { source: rubin-8e, chapter: "20", pages: "875" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c040, section: ancillary, statement: "HFE-associated hemochromatosis includes C282Y homozygotes, H63D homozygotes and C282Y/H63D compound heterozygotes.", sourceRef: { source: rubin-8e, chapter: "20", pages: "875" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c041, section: clinical, statement: "Advanced HH shows as a failing heart, bronzed skin, diabetes and a cirrhotic liver.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c042, section: clinical, statement: "Symptoms of HH typically begin in midlife, and liver damage advances slowly.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c043, section: clinical, statement: "Iron deposited in the pancreas commonly causes diabetes in HH, and pigmented skin together with glucose intolerance is called bronze diabetes.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c044, section: clinical, statement: "Death in HH is often due to heart failure, which usually shows the features of dilated cardiomyopathy.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c045, section: clinical, statement: "Restrictive pathophysiology may also occur in the HH heart.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c046, section: clinical, statement: "Atrial fibrillation is commonly seen in HH.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c047, section: clinical, statement: "Reduced pituitary gonadotropin output leaves men impotent with little body hair, and leaves women without periods and with low libido.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c048, section: clinical, statement: "Arthropathy affects many HH patients and is worst in the fingers and hands.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c049, section: clinical, statement: "In HH, arthritis can also cripple large joints, for example the knee.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c050, section: diagnosis, statement: "In HH serum iron is far above normal and transferrin is fully saturated.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c051, section: diagnosis, statement: "Normally transferrin is about one-third saturated.", sourceRef: { source: rubin-8e, chapter: "20", pages: "872" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c052, section: diagnosis, statement: "Blood ferritin is greatly increased in HH, in line with the amount of stored iron.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c053, section: diagnosis, statement: "High ferritin also occurs during acute inflammatory reactions, not only with large iron stores.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c054, section: prognosis, statement: "Cirrhosis in HH may lead to hepatocellular carcinoma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c055, section: prognosis, statement: "Untreated HH patients can die of gastrointestinal hemorrhage or hepatic coma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c056, section: prognosis, statement: "The most effective way to remove iron in HH is repeated phlebotomy.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c057, section: prognosis, statement: "After iron depletion, homozygotes without cirrhosis or diabetes have the same life expectancy as the general population.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c058, section: differential, statement: "In secondary iron overload iron begins in Kupffer cells and is generally less than in HH; HH mutations are absent, and the cause is transfusion, iron intake or ineffective erythropoiesis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c059, section: differential, statement: "Alcohol abuse is common in secondary iron overload and chronic liver disease increases iron absorption.", sourceRef: { source: rubin-8e, chapter: "20", pages: "875, 876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c060, section: differential, statement: "Wilson disease loads liver and brain with copper, not iron, and is inherited as an autosomal recessive trait.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c061, section: differential, statement: "High hepcidin restricts ferroportin, so anemia of chronic inflammation has low blood iron with iron retained in stores.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c062, section: high-yield, statement: "C282Y homozygosity of HFE accounts for most HH.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c063, section: high-yield, statement: "Low hepcidin leaves ferroportin unchecked and iron absorption excessive.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c064, section: high-yield, statement: "Perls stain shows iron as blue in hepatocytes in hemochromatosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "875" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c065, section: high-yield, statement: "Advanced HH shows as a failing heart, bronzed skin, diabetes and a cirrhotic liver.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c066, section: high-yield, statement: "Bronze diabetes is the name for glucose intolerance together with pigmented skin in HH.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c067, section: high-yield, statement: "Repeated phlebotomy is the most effective HH treatment.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c068, section: high-yield, statement: "Cirrhosis in HH may lead to hepatocellular carcinoma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c069, section: high-yield, statement: "Secondary overload begins in Kupffer cells and has no HH mutations.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c070, section: traps, statement: "Some C282Y homozygotes never develop HH or iron overload.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c071, section: traps, statement: "HH results from reduced hepcidin and increased absorption, whereas dietary intake matters in secondary overload.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874, 876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c072, section: traps, statement: "Most HH patients have increased melanin in the skin, and marked iron deposits are found in about half of patients.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c073, section: traps, statement: "High ferritin also occurs in acute inflammatory reactions.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c074, section: traps, statement: "Cirrhosis is rare after many transfusions because the iron stays mostly in mononuclear phagocytes, so transfusions alone seldom cause iron overload.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c075, section: traps, statement: "So-called Bantu siderosis is secondary iron overload from iron-rich home-brewed alcoholic beverages.", sourceRef: { source: rubin-8e, chapter: "20", pages: "876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c076, section: mnemonics, statement: "HH affects liver, pancreas, heart, skin and joints.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874, 876" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: hereditary-hemochromatosis-c077, section: mnemonics, statement: "Reduced hepcidin leads to increased iron absorption in HH.", sourceRef: { source: rubin-8e, chapter: "20", pages: "874" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
