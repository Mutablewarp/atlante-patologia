entity: pancreatic-ductal-adenocarcinoma
claims:
  - { claimId: pancreatic-ductal-adenocarcinoma-c001, section: definition, statement: "The tumor is a cancer of the pancreatic ducts that builds glands, and the glands hold cells making mucin.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907, 909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c002, section: definition, statement: "The shorthand pancreatic cancer refers to this tumor because it accounts for roughly 85% of adult pancreatic neoplasms.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c003, section: definition, statement: "Among US cancer deaths, pancreatic cancer ranks fourth for both sexes.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c004, section: definition, statement: "Fewer than 8% of patients are alive 5 years after diagnosis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c005, section: definition, statement: "The disease is mostly one of later life, with the highest incidence beyond age 60.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c006, section: definition, statement: "Elderly men and women are affected almost equally, whereas among younger patients men are ahead by up to three to one.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c007, section: etiology, statement: "Smokers carry two to three times the risk of nonsmokers.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c008, section: etiology, statement: "Smoking accounts for roughly one case in four.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c009, section: etiology, statement: "Having had diabetes for five years or longer is associated with twice the risk.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c010, section: etiology, statement: "For some patients the cancer is the earlier event and the diabetes is its result.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c011, section: etiology, statement: "The inherited form and the tropical calcifying form of pancreatitis have the firmer association with cancer.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c012, section: etiology, statement: "Common chronic pancreatitis, such as the alcohol-related type, probably underlies few cancers.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c013, section: etiology, statement: "A tumor that invades and blocks ducts can itself produce obstructive chronic pancreatitis downstream, so cause and effect are hard to separate.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c014, section: etiology, statement: "Nitrates, fat and meat in the diet may raise risk, although cooking method could confound this.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c015, section: etiology, statement: "A diet rich in fruit and vegetables appears to lower the risk.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c016, section: etiology, statement: "Neither coffee drinking nor alcohol intake has been convincingly tied to the cancer.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c017, section: etiology, statement: "Certain occupations carry higher incidence, among them work with dry-cleaning agents or coal gas.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c018, section: etiology, statement: "Inherited disorders such as Peutz-Jeghers syndrome (STK11) and hereditary breast-ovarian cancer (BRCA2) increase the chance of this cancer.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c019, section: etiology, statement: "For most patients, no known inherited mutation accounts for the disease.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c020, section: pathogenesis, statement: "PanIN, the duct lesion supporting the stepwise genetic model, is abnormal mucin-rich epithelium that has displaced the normal duct lining.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c021, section: pathogenesis, statement: "PanIN comes in two grades, the higher grade showing more disordered architecture and cells.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c022, section: pathogenesis, statement: "Telomere shortening and a mutation that switches on the KRAS oncogene are early events, seen in low-grade PanIN.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c023, section: pathogenesis, statement: "Up to 95% of these cancers carry a KRAS mutation.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c024, section: pathogenesis, statement: "Mutation or deletion removes the tumor suppressors p16/CDKN2A, p53 and SMAD4 at later stages of the sequence.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c025, section: pathogenesis, statement: "Loss of p16/CDKN2A occurs in about 95% of tumors.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c026, section: pathogenesis, statement: "p53 is knocked out in somewhere between half and three quarters of tumors.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c027, section: pathogenesis, statement: "SMAD4, a gene in the TGF-beta signaling pathway, is lost in about 55% of tumors.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c028, section: pathogenesis, statement: "Among growth factor signals reported as overactive are EGF and the EGF receptor.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c029, section: pathogenesis, statement: "In as many as 7% of tumors, a mutation disables BRCA2.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c030, section: pathogenesis, statement: "A subset of ductal carcinomas develops on a background of mucinous cystic or intraductal papillary mucinous neoplasms.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909-910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c031, section: gross, statement: "About 60% to 70% of cases arise in the head, 10% to 15% in the tail and roughly 10% in the body.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c032, section: gross, statement: "The tumor has indistinct borders and is a gray, hard mass that can be hard to tell apart from fibrosis due to chronic pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c033, section: gross, statement: "Pressure from a head tumor on the bile duct or the ampulla can obstruct bile flow.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c034, section: gross, statement: "Head tumors can grow into the wall of the duodenum.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c035, section: gross, statement: "Obstruction of the main pancreatic duct leads to shrinkage of the gland upstream, the body and tail.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c036, section: gross, statement: "A tumor of the tail can spread locally into the spleen or stomach.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c037, section: gross, statement: "Body and tail tumors are larger and more widely spread than head tumors at diagnosis, because head tumors cause symptoms earlier.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c038, section: gross, statement: "The liver and the regional lymph nodes are frequent sites of metastasis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c039, section: gross, statement: "Once the cancer has reached faraway organs such as peritoneum or lung, surgery is out of reach for most patients.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c040, section: micro, statement: "Tubular glands lined by mucin-secreting cells are the pattern in the over 75% of cases graded well to moderately differentiated.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c041, section: micro, statement: "Some cancerous glands look so bland that they are confused with benign ducts, even though nuclei may be very atypical.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c042, section: micro, statement: "Abundant desmoplastic stroma usually surrounds the glands.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c043, section: micro, statement: "Tumor cells often lie beyond the margin seen by the naked eye, because growth is diffusely infiltrative with no defined edge.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c044, section: micro, statement: "Tumor invasion of nerves is typical and accounts for pain that starts early and persists.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c045, section: micro, statement: "The remaining 25% of cases are poorly differentiated and show single cells or sheets of cells.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c046, section: micro, statement: "Colloid and adenosquamous carcinomas are recognized variants.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c047, section: ancillary, statement: "In the illustrated tumor section, malignant glands invade adipose tissue and lie in fibrous stroma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c048, section: ancillary, statement: "With immunostaining, acinar cell carcinoma cells can be shown to synthesize pancreatic enzymes.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c049, section: ancillary, statement: "Some acinar carcinomas have BRAF fusions or APC/beta-catenin pathway changes, and the mutations usual in ductal cancer are absent.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c050, section: clinical, statement: "Epigastric pain spreading to the back, weight loss and poor appetite are the usual presenting complaints.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c051, section: clinical, statement: "Painless jaundice is uncommon with body or tail tumors (under 10%) but affects about half of patients with head tumors.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c052, section: clinical, statement: "Tumor blocking the common bile duct can swell the gallbladder painlessly together with jaundice, known as Courvoisier sign.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c053, section: clinical, statement: "Migratory thrombophlebitis (Trousseau syndrome) is seen mostly with body and tail tumors and affects about 10% of patients overall.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c054, section: clinical, statement: "Other cancers can cause Trousseau syndrome too, but it can be the presenting sign of a pancreatic cancer.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c055, section: clinical, statement: "A search for hidden cancer is needed when a healthy person has thrombophlebitis with no known cause.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c056, section: clinical, statement: "The clotting tendency is not fully explained; suggested mechanisms include procoagulant vesicles released from tumor cells and a tumor-made protease that turns on factor X.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c057, section: diagnosis, statement: "Blood CA19-9, a Lewis antigen, is not specific for this tumor although it is usually elevated.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c058, section: diagnosis, statement: "A carcinoma in the head typically widens the common bile duct and the pancreatic duct together.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c059, section: diagnosis, statement: "The cancer gives no symptoms until it is far along, so early detection is rare.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c060, section: prognosis, statement: "Surgical cure is seldom possible because most patients already have metastases or involvement of large nearby vessels when diagnosed.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c061, section: prognosis, statement: "By 6 months after diagnosis, half of the patients have died.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c062, section: prognosis, statement: "Death comes after a steady decline with wasting and pain that cannot be controlled.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c063, section: prognosis, statement: "The liver and peritoneum are among the metastatic sites.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909-910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c064, section: differential, statement: "On gross inspection the tumor may not be separable from the surrounding fibrosing pancreatitis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c065, section: differential, statement: "The cancer often provokes obstructive chronic pancreatitis in the gland downstream of the blocked duct.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c066, section: differential, statement: "Only 1% to 2% of pancreatic carcinomas are acinar cell carcinomas.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c067, section: differential, statement: "Unlike ductal cancer, acinar carcinomas have no desmoplastic stroma and form large masses with a clear boundary.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c068, section: differential, statement: "Massive lipase secretion into the blood by some acinar carcinomas causes a paraneoplastic picture of eosinophilia, joint pain and subcutaneous fat necrosis.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c069, section: differential, statement: "Pancreatoblastoma is a close relative of acinar carcinoma and is mostly found during the first ten years of life.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c070, section: differential, statement: "Pancreatoblastoma can arise in children with Beckwith-Wiedemann syndrome.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c071, section: differential, statement: "Some well-differentiated cancerous glands are bland enough to be confused with normal ducts.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c072, section: high-yield, statement: "KRAS activation is an early event in low-grade PanIN; CDKN2A, TP53 and SMAD4 are lost later.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c073, section: high-yield, statement: "Head tumors, the most frequent location at 60% to 70%, are smaller at diagnosis than body and tail tumors.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c074, section: high-yield, statement: "A desmoplastic stroma is typical, and spread along nerves explains the early pain.", sourceRef: { source: rubin-8e, chapter: "21", pages: "909" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c075, section: high-yield, statement: "Trousseau syndrome can be the first manifestation of pancreatic cancer.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c076, section: high-yield, statement: "Acinar carcinoma has no desmoplastic stroma and can cause a lipase-related paraneoplastic syndrome.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c077, section: high-yield, statement: "Pancreatoblastoma is a childhood tumor, usually in the first decade.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c078, section: high-yield, statement: "Under 8% of patients survive five years.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c079, section: traps, statement: "CA19-9 is usually elevated in this cancer but lacks specificity.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c080, section: traps, statement: "Trousseau syndrome often announces pancreatic cancer but also occurs with other malignancies.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c081, section: traps, statement: "Painless jaundice is frequent with head tumors and infrequent with body or tail tumors.", sourceRef: { source: rubin-8e, chapter: "21", pages: "910" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c082, section: traps, statement: "Alcohol and coffee have not been convincingly shown to be linked to the cancer.", sourceRef: { source: rubin-8e, chapter: "21", pages: "908" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-ductal-adenocarcinoma-c083, section: traps, statement: "Smoking multiplies the risk by two to three.", sourceRef: { source: rubin-8e, chapter: "21", pages: "907" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
