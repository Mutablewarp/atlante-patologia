entity: reflux-esophagitis
claims:
- {claimId: reflux-esophagitis-c001, section: definition, statement: "Backflow of gastric contents injures the esophageal lining in reflux esophagitis, a disease called GERD", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c002, section: definition, statement: "No other type of esophagitis is nearly as frequent", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c003, section: definition, statement: "GERD affects patients of every age", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c004, section: definition, statement: "GERD may or may not have erosions, and in some patients Barrett metaplasia complicates it", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c005, section: etiology, statement: "Reflux into the esophagus is held back mainly by the lower esophageal sphincter", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c006, section: etiology, statement: "A few reflux episodes after eating are normal", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c007, section: etiology, statement: "Episodes that are both frequent and long-lasting produce esophagitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c008, section: etiology, statement: "Smoking and fatty food lower sphincter pressure, which makes reflux more likely", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c009, section: etiology, statement: "Pregnancy and a nasogastric tube can also lead to reflux", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c010, section: etiology, statement: "In sliding hiatal hernia a widened hiatus lets the upper stomach slip into the chest", sourceRef: {source: rubin-8e, chapter: "19", pages: "769"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c011, section: etiology, statement: "An incompetent sphincter with no anatomic lesion can by itself cause reflux esophagitis, which often accompanies sliding hiatal hernia", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c012, section: etiology, statement: "Whether hernia or reflux comes first is unclear", sourceRef: {source: rubin-8e, chapter: "19", pages: "769"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c013, section: etiology, statement: "The sliding type makes up 85% of hiatal hernias and usually causes no symptoms", sourceRef: {source: rubin-8e, chapter: "19", pages: "769"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c014, section: etiology, statement: "Reflux can lessen in paraesophageal hernia because the herniated gastric fundus squeezes the esophagus", sourceRef: {source: rubin-8e, chapter: "19", pages: "769-770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c015, section: etiology, statement: "In systemic sclerosis the lower esophageal sphincter and esophageal muscle function poorly, and patients have heartburn from acid reflux (a causal link between the two is not stated)", sourceRef: {source: rubin-8e, chapter: "19", pages: "769"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c016, section: pathogenesis, statement: "Acid alone damages the esophageal mucosa; acid together with pepsin damages it more", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c017, section: pathogenesis, statement: "Bile from the duodenum is often present in refluxed fluid and worsens mucosal damage", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c018, section: pathogenesis, statement: "Alcohol and hot drinks cause direct mucosal injury", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c019, section: pathogenesis, statement: "Submucosal glands secrete alkaline fluid that partly protects the mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c020, section: pathogenesis, statement: "Continued injury makes the epithelium hyperplastic", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c021, section: pathogenesis, statement: "A persistent ulcer reaching deeper than the lamina propria can leave a stricture, a lumen narrowed by scar", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c022, section: pathogenesis, statement: "Barrett esophagus results from chronic GERD and consists of goblet-cell columnar epithelium replacing the squamous lining", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c023, section: gross, statement: "Hyperemia is the earliest macroscopic change of reflux", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c024, section: gross, statement: "Shallow erosions and ulcers in reflux often run as vertical streaks", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c025, section: gross, statement: "On endoscopy Barrett mucosa in the lower esophagus is salmon-pink", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c026, section: micro, statement: "Hydropic change, a swelling of squamous cells, marks mild injury", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c027, section: micro, statement: "Persistent injury leads to basal hyperplasia, a thickened basal layer", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c028, section: micro, statement: "Elongated papillae of the lamina propria extend toward the surface", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c029, section: micro, statement: "Dilated capillaries are frequently seen within the papillae", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c030, section: micro, statement: "Eosinophils, neutrophils and lymphocytes infiltrate the epithelium", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c031, section: micro, statement: "Mucosal ulceration develops in severe cases", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c032, section: ancillary, statement: "On a biopsy, intraepithelial inflammation is sought together with basal hyperplasia and long papillae (figure caption describes a biopsy)", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c033, section: ancillary, statement: "Barrett epithelium is a mixture of intestinal-type and gastric-type cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c034, section: clinical, statement: "Patients usually present with heartburn and dysphagia", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c035, section: clinical, statement: "Reclining favors acid reflux, so sliding hiatal hernia symptoms are classically worse when lying down", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c036, section: clinical, statement: "Erosive GERD may cause bleeding (hematemesis) and stricture", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c037, section: clinical, statement: "Symptoms usually improve when gastric acid is suppressed, above all with PPIs", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c038, section: diagnosis, statement: "Eosinophilic esophagitis should be diagnosed only after GERD is excluded, by pH monitoring or a PPI trial of several weeks", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c039, section: diagnosis, statement: "Many Barrett patients report no reflux symptoms, but endoscopy with biopsy establishes the diagnosis, usually after GERD complaints", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c040, section: prognosis, statement: "Untreated dysplasia in Barrett epithelium can progress to adenocarcinoma, and only a minority of Barrett patients develop dysplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c041, section: prognosis, statement: "A longer Barrett segment and a worse dysplasia grade both go with a higher chance of adenocarcinoma", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c042, section: prognosis, statement: "A Barrett patient has an estimated 0.1% to 0.3% chance per year of developing adenocarcinoma", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c043, section: prognosis, statement: "Surveillance endoscopy in Barrett patients aims to find dysplasia early", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c044, section: differential, statement: "In Barrett esophagus intestine-like epithelium with goblet cells takes over from the squamous epithelium", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c045, section: differential, statement: "Endoscopic biopsy establishes Barrett esophagus", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c046, section: differential, statement: "Patients with eosinophilic esophagitis often fail antireflux therapy; the disease is allergy-linked with dysphagia, endoscopic rings and furrows, and layered eosinophils on biopsy", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c047, section: differential, statement: "For eosinophilic esophagitis, biopsies are taken from several esophageal levels once GERD has been ruled out", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c048, section: high-yield, statement: "The central mechanism is an incompetent lower esophageal sphincter, and a sliding hiatal hernia is often also present", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c049, section: high-yield, statement: "Histology shows eosinophils among the intraepithelial inflammatory cells, elongated papillae and basal hyperplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c050, section: high-yield, statement: "Shallow erosions and ulcers often run as vertical streaks, and a lasting deep ulcer can leave a stricture", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c051, section: high-yield, statement: "PPIs usually ease heartburn and dysphagia", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c052, section: high-yield, statement: "Chronic GERD leads to Barrett esophagus with goblet cells, which may progress to adenocarcinoma", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c053, section: traps, statement: "Eosinophil counts can be raised in GERD, mostly in the distal esophagus, and they subside with antireflux treatment", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c054, section: traps, statement: "Sliding hiatal hernia is common and usually asymptomatic", sourceRef: {source: rubin-8e, chapter: "19", pages: "769"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c055, section: traps, statement: "A paraesophageal hernia can compress the esophagus and decrease reflux", sourceRef: {source: rubin-8e, chapter: "19", pages: "769-770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c056, section: traps, statement: "GERD can be nonerosive as well as erosive", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: reflux-esophagitis-c057, section: mnemonics, statement: "Reflux histology: elongated papillae, intraepithelial eosinophils, basal hyperplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "770"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
