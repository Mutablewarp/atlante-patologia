entity: lung-cancer-overview
claims:
- {claimId: lung-cancer-overview-c001, section: definition, statement: "Lung cancer is the most frequent cause of cancer death in the world.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c002, section: definition, statement: "The main forms of lung cancer are squamous cell, adeno, large cell and small cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c003, section: definition, statement: "In roughly one lung cancer in four the tumor cannot be traced to a bronchus, so the term bronchogenic carcinoma is discouraged.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c004, section: definition, statement: "As more women smoke, the former excess of lung cancer in men is shrinking.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c005, section: etiology, statement: "In the United States, the proportion of lung cancers found in cigarette smokers is 85 to 90 percent.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c006, section: etiology, statement: "Cigarette smokers are at risk of all the main types, small cell carcinoma included.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c007, section: etiology, statement: "When a never-smoker has lung cancer, it is most often an adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c008, section: pathogenesis, statement: "Smoking injury to the bronchial lining is repaired by basal cells through squamous metaplasia, which can progress to dysplasia, carcinoma in situ and invasive carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c009, section: pathogenesis, statement: "No one mutation is responsible for lung cancer.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c010, section: pathogenesis, statement: "Adenocarcinomas with an activating EGFR tyrosine kinase domain mutation respond to EGFR tyrosine kinase inhibitors.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c011, section: pathogenesis, statement: "Women, Asians and nonsmokers carry EGFR mutations more often.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c012, section: pathogenesis, statement: "In adenocarcinoma, KRAS mutation is associated with a smoking history and a worse prognosis.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c013, section: pathogenesis, statement: "Adenocarcinomas with an EML4-ALK fusion respond to crizotinib, and the fusion is found mostly in nonsmokers.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c014, section: pathogenesis, statement: "A ROS1 fusion leaves the kinase domain intact, so crizotinib can target these tumors.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c015, section: pathogenesis, statement: "Small cell carcinoma has TP53 and RB mutations much more often than non-small cell tumors.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c016, section: pathogenesis, statement: "Loss of part of the short arm of chromosome 3 is frequent in every type of lung cancer.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c017, section: gross, statement: "Most squamous cell carcinomas are central, starting in major or segmental bronchi.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c018, section: gross, statement: "The tumor ulcerates, breaks through the bronchial wall into adjacent lung, and is firm and grayish white.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c019, section: gross, statement: "Central cavitation is common in squamous cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c020, section: micro, statement: "Grade is taken from the least differentiated area, while histologic type is named from the most differentiated area.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c021, section: micro, statement: "A tumor containing any small cell component counts as small cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c022, section: micro, statement: "A tumor made mostly of poorly differentiated large cells is named squamous cell carcinoma or adenocarcinoma once squamous or glandular foci are found.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c023, section: micro, statement: "Squamous cell carcinoma has keratinizing, nonkeratinizing and basaloid subtypes.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c024, section: micro, statement: "Keratin pearls mark well-differentiated squamous cell carcinoma, and some of these tumors also show intercellular bridges.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c025, section: ancillary, statement: "Early-stage lung cancers are mostly resected, so the pathologist can examine the entire tumor.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c026, section: ancillary, statement: "Advanced, unresectable lung cancer is typed on small biopsies and cytology rather than on a resection.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c027, section: ancillary, statement: "Cells that form glands in a Papanicolaou-stained needle aspirate suggest adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c028, section: ancillary, statement: "Aspirated squamous carcinoma cells show dark nuclei with sharp corners and thick eosinophilic cytoplasm.", sourceRef: {source: rubin-8e, chapter: "18", pages: "760"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c029, section: ancillary, statement: "Nuclear TTF-1 positivity suggests a lung primary with glandular differentiation.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c030, section: ancillary, statement: "The squamous marker p40 helps diagnose squamous cell carcinoma without keratinization or with basaloid cells, when staining is diffuse.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c031, section: ancillary, statement: "Adenocarcinoma and unsubtyped non-small cell carcinoma must at least be checked for EGFR mutation and ALK or ROS fusion before treatment.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c032, section: ancillary, statement: "No targeted drug is established for squamous cell carcinoma, so molecular screening is not a routine step.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c033, section: clinical, statement: "Local effects of lung cancer include chest pain, dyspnea, hemoptysis, cough, obstructive pneumonia and pleural effusion.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c034, section: clinical, statement: "Shoulder pain running down the arm can come from an apical (usually squamous) Pancoast tumor that may involve nerves C8, T1 and T2.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c035, section: clinical, statement: "Paralysis of the cervical sympathetic nerves by a Pancoast tumor produces Horner syndrome: ptosis, miosis, anhidrosis and enophthalmos.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c036, section: clinical, statement: "Tumor growing in the mediastinum can block the superior vena cava.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c037, section: clinical, statement: "Lung cancer spreads most often to hilar and mediastinal nodes; the adrenal gland, liver, bone and brain are frequent distant sites.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c038, section: clinical, statement: "Clubbing, acanthosis nigricans, dermatomyositis or polymyositis and the Eaton-Lambert myasthenic syndrome are paraneoplastic associations of lung cancer.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c039, section: clinical, statement: "Small cell carcinoma can cause SIADH or Cushing syndrome.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c040, section: clinical, statement: "Squamous cell carcinoma can cause hypercalcemia by secreting a parathyroid hormone-like substance.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c041, section: clinical, statement: "Circulating anti-Hu antibodies accompany the paraneoplastic encephalomyelitis and sensory neuropathy that small cell carcinoma can cause.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c042, section: diagnosis, statement: "The lumped label non-small cell carcinoma is discouraged because newer chemotherapy and targeted drugs make the exact subtype matter.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c043, section: diagnosis, statement: "Of all predictors of prognosis, tumor stage is the most important single one.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c044, section: diagnosis, statement: "In TNM, M is distant metastasis or malignant pleural fluid, N is spread to regional or distant nodes, and T is tumor size with local or regional extent.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c045, section: diagnosis, statement: "Any tumor with distant metastasis is stage IV; stages II and III are set mostly by regional node involvement; stage I is a small tumor without nodes or metastasis.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c046, section: prognosis, statement: "At 5 years no more than 5 percent of small cell carcinoma patients survive, a dismal prognosis.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c047, section: prognosis, statement: "Advanced adenocarcinoma may respond to the antifolate drug pemetrexed, while squamous cell carcinoma does not.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c048, section: prognosis, statement: "Progression-free survival is longer when tumors with EGFR mutation or ALK rearrangement get targeted therapy.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c049, section: differential, statement: "A hamartoma is a true benign tumor built from tissue normally found in the lung.", sourceRef: {source: rubin-8e, chapter: "18", pages: "750-751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c050, section: differential, statement: "Roughly one in ten coin lesions picked up by chance on a chest x-ray is a hamartoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c051, section: differential, statement: "Hamartomas often show a popcorn pattern of calcification on x-ray.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c052, section: differential, statement: "Histologically, respiratory epithelium lines clefts between nodules of cartilage, fat and connective tissue.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c053, section: differential, statement: "Lung carcinoids are unrelated to smoking and presumably derive from bronchial neuroendocrine cells.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c054, section: differential, statement: "Atypical carcinoid differs from typical carcinoid by necrosis or a higher mitotic count.", sourceRef: {source: rubin-8e, chapter: "18", pages: "760"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c055, section: differential, statement: "A tumor that stains for TTF-1 but not for p40 favors adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c056, section: differential, statement: "A tumor that stains for p40 but not for TTF-1 favors squamous cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "760"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c057, section: differential, statement: "In the past only small cell carcinoma had chemotherapy that worked, while non-small cell tumors did not respond.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c058, section: high-yield, statement: "The major lung cancer types are small cell, large cell, adeno and squamous cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c059, section: high-yield, statement: "TNM stage is the best single predictor of prognosis.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c060, section: high-yield, statement: "TTF-1 indicates adenocarcinoma and lung origin, p40 indicates squamous differentiation.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759-760"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c061, section: high-yield, statement: "Adenocarcinoma requires EGFR, ALK and ROS testing, squamous cell carcinoma does not routinely.", sourceRef: {source: rubin-8e, chapter: "18", pages: "759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c062, section: high-yield, statement: "SIADH, Cushing syndrome and anti-Hu syndromes go with small cell carcinoma, hypercalcemia with squamous cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c063, section: high-yield, statement: "Hamartoma is a benign coin lesion with popcorn calcification.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c064, section: traps, statement: "In roughly one lung cancer in four the tumor cannot be traced to a bronchus, so bronchogenic carcinoma is a poor term.", sourceRef: {source: rubin-8e, chapter: "18", pages: "753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c065, section: traps, statement: "Smokers can develop any major type, while lung cancer in never-smokers is mostly adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "751"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c066, section: traps, statement: "Subtype and molecular tests guide treatment: pemetrexed can work in advanced adenocarcinoma but not in squamous cell carcinoma.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752-753, 759"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c067, section: traps, statement: "Despite a name that suggests a malformation, a hamartoma is a genuine benign neoplasm.", sourceRef: {source: rubin-8e, chapter: "18", pages: "750"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: lung-cancer-overview-c068, section: mnemonics, statement: "Squamous cell carcinoma is central, cavitating, keratinizing and associated with hypercalcemia.", sourceRef: {source: rubin-8e, chapter: "18", pages: "752-753"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
