entity: penile-diseases
claims:
- {claimId: penile-diseases-c001, section: definition, statement: "Penile disease includes developmental anomalies, inflammatory lesions, Peyronie fibrosis and squamous tumors", sourceRef: {source: rubin-8e, chapter: "23", pages: "989, 992-994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c002, section: definition, statement: "In hypospadias the urethral meatus lies too far back, on the ventral surface of the penis rather than at the tip", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c003, section: definition, statement: "Epispadias is the dorsal counterpart, with the urethra opening on the top of the penis", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c004, section: definition, statement: "In phimosis a narrow preputial opening prevents retraction of the foreskin over the glans", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c005, section: definition, statement: "Most penile cancers occur in uncircumcised men and arise from squamous-lined surfaces and skin of the penis", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c006, section: etiology, statement: "In hypospadias the folds that form the urethra do not fully close", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c007, section: etiology, statement: "Uncircumcised men typically acquire phimosis after foreskin trauma or recurrent infections", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c008, section: etiology, statement: "Fungal balanitis is a possibility in diabetes or immune suppression, but bacteria account for most cases", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c009, section: etiology, statement: "HSV-2 is the usual cause of genital herpes, with HSV-1 responsible for a smaller share", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c010, section: etiology, statement: "Primary syphilis is caused by the spirochete Treponema pallidum", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c011, section: etiology, statement: "Chancroid is caused by Haemophilus ducreyi", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c012, section: etiology, statement: "Lymphogranuloma venereum is caused by Chlamydia trachomatis", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c013, section: etiology, statement: "HPV 6 is the usual cause of condyloma acuminatum, and HPV 11 causes fewer cases", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c014, section: etiology, statement: "Smegma is suspected to play a part in penile cancer, though no one cause is proven", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c015, section: etiology, statement: "Some penile cancers are probably linked to HPV types 16 and 18", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c016, section: etiology, statement: "Smokers have a raised risk of penile cancer", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c017, section: pathogenesis, statement: "In Peyronie disease the septum of the corpus cavernosum loses patches of muscle to collagen", sourceRef: {source: rubin-8e, chapter: "23", pages: "993"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c018, section: pathogenesis, statement: "In paraphimosis the glans loses its venous drainage when a tight foreskin has been pulled back by force and constricts it", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c021, section: pathogenesis, statement: "Few Bowen disease or erythroplasia of Queyrat lesions are thought to turn into invasive carcinoma", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c022, section: pathogenesis, statement: "About half of invasive penile carcinomas contain HPV DNA", sourceRef: {source: rubin-8e, chapter: "23", pages: "994-995"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c023, section: gross, statement: "In hypospadias the opening typically lies at the corona or on the undersurface of the glans", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c024, section: gross, statement: "In balanitis xerotica obliterans the involved glans looks white and feels indurated", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c025, section: gross, statement: "Large cauliflower-like condylomas can be mistaken for verrucous carcinoma, while smaller lesions are flat-topped shaft warts", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c026, section: gross, statement: "Peyronie disease leaves the overlying skin normal while a poorly delimited firm zone is palpable in the shaft", sourceRef: {source: rubin-8e, chapter: "23", pages: "993"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c027, section: gross, statement: "Bowen disease is a single plaque on the penile shaft with sharp edges, red or gray-white", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c028, section: gross, statement: "Erythroplasia of Queyrat produces single or multiple red plaques on glans and foreskin that gleam and feel soft", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c030, section: gross, statement: "Invasive squamous carcinoma usually involves glans or prepuce and may present as an ulcer or an exophytic papillary tumor", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c031, section: gross, statement: "Verrucous carcinoma is an exophytic squamous carcinoma that grossly resembles condyloma acuminatum", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c032, section: micro, statement: "Condyloma shows hyperkeratosis, parakeratosis, acanthosis and papillomatosis", sourceRef: {source: rubin-8e, chapter: "23", pages: "993"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c035, section: micro, statement: "In carcinoma in situ the dermis is not invaded, while atypical keratinocytes occupy all layers of the epidermis", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c037, section: micro, statement: "Invasive penile squamous carcinomas usually show good differentiation and keratin production in scattered areas", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c038, section: ancillary, statement: "By definition, carcinoma in situ has not grown into the dermis", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c040, section: ancillary, statement: "HPV 16 is the type usually detected in bowenoid papulosis, with HPV 18 an occasional finding", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c041, section: clinical, statement: "In Peyronie disease erections are painful and the penis bends", sourceRef: {source: rubin-8e, chapter: "23", pages: "993"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c042, section: clinical, statement: "Genital herpes lesions progress from grouped vesicles through ulcers to crusts", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c043, section: clinical, statement: "In primary syphilis palpable inguinal nodes may accompany the chancre, a single soft ulcer", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c044, section: clinical, statement: "Chancroid ulcers are shallow and are often accompanied by painful, pus-forming inguinal lymph nodes", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c046, section: clinical, statement: "When first seen, most penile squamous carcinomas have not spread beyond the penis", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c047, section: diagnosis, statement: "Enlarged regional nodes in penile cancer are often only reactive to tumor-associated inflammation rather than metastatic", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c049, section: prognosis, statement: "Circumcision cures phimosis", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c050, section: prognosis, statement: "Clinical stage is the main predictor of survival in penile cancer, with histologic grade mattering less", sourceRef: {source: rubin-8e, chapter: "23", pages: "995"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c051, section: prognosis, statement: "Patients with superficially invasive penile cancer have a high 5-year survival", sourceRef: {source: rubin-8e, chapter: "23", pages: "995"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c052, section: prognosis, statement: "Inguinal lymph node metastases markedly reduce 5-year survival", sourceRef: {source: rubin-8e, chapter: "23", pages: "995"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c053, section: prognosis, statement: "Treatment of penile cancer usually involves removing the penis by amputation", sourceRef: {source: rubin-8e, chapter: "23", pages: "995"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c054, section: prognosis, statement: "Verrucous carcinoma rarely metastasizes", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c055, section: prognosis, statement: "Invasive cancer essentially does not arise from bowenoid papulosis, because the lesions nearly always resolve spontaneously", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c056, section: prognosis, statement: "Peyronie disease is usually mild and leaves sexual function intact", sourceRef: {source: rubin-8e, chapter: "23", pages: "993"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c057, section: differential, statement: "Condyloma acuminatum is a wart-like lesion without invasion", sourceRef: {source: rubin-8e, chapter: "23", pages: "992, 994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c058, section: differential, statement: "Verrucous carcinoma invades locally although its cells are cytologically benign and it looks like condyloma", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c059, section: differential, statement: "Bowen disease is a solitary plaque on the shaft with atypical keratinocytes in all epidermal layers", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c060, section: differential, statement: "Bowenoid papulosis shows multiple papules and affects young, sexually active men", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c061, section: differential, statement: "Primary syphilis gives a solitary soft ulcer, unlike the grouped vesicles of herpes", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c062, section: differential, statement: "Genital herpes gives grouped vesicles that ulcerate", sourceRef: {source: rubin-8e, chapter: "23", pages: "992"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c063, section: high-yield, statement: "Hypospadias opens ventrally and epispadias dorsally", sourceRef: {source: rubin-8e, chapter: "23", pages: "989"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c065, section: high-yield, statement: "Bowen disease and erythroplasia of Queyrat are the gross forms of penile carcinoma in situ", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c066, section: traps, statement: "Condyloma is benign and bowenoid papulosis is HPV-induced but regresses, so HPV on the penis does not mean cancer", sourceRef: {source: rubin-8e, chapter: "23", pages: "992, 994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c067, section: traps, statement: "Many enlarged regional nodes in penile cancer show only reactive change", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c068, section: traps, statement: "Verrucous carcinoma resembles condyloma but invades locally", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c069, section: traps, statement: "Peyronie disease is a fibrosis of the penis of unknown cause, not an infection", sourceRef: {source: rubin-8e, chapter: "23", pages: "993"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: penile-diseases-c070, section: mnemonics, statement: "Penile cancer risk factors: HPV, absence of circumcision, smegma and smoking", sourceRef: {source: rubin-8e, chapter: "23", pages: "994"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
