entity: bronchiectasis
claims:
- {claimId: bronchiectasis-c001, section: definition, statement: "Bronchi remain permanently widened because the muscle and elastic tissue of their wall is destroyed", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c002, section: definition, statement: "After a bacterial or viral airway infection bronchi can widen temporarily and then recover, but recovery may take months", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c003, section: definition, statement: "Vaccines and antibiotics have made bronchiectasis less common", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c004, section: definition, statement: "Adenovirus or RSV is typically the infection that precedes most cases today", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c005, section: definition, statement: "In low-resource regions, childhood respiratory infections remain a cause of bronchiectasis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c006, section: etiology, statement: "Bronchiectasis is classed as obstructive or nonobstructive", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c007, section: etiology, statement: "A mechanical block in a central bronchus produces the obstructive form, which is localized to the lung downstream of the block", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c008, section: etiology, statement: "Such a block can come from enlarged lymph nodes, a tumor, an asthmatic mucus plug or an aspirated foreign object", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c009, section: etiology, statement: "The nonobstructive form may be localized or generalized and usually appears after respiratory infection or with defective airway defenses", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c010, section: etiology, statement: "Most generalized disease stems from an acquired condition that lets microbes into the airways or from an inborn defect of host defense", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c011, section: etiology, statement: "Acquired predisposing conditions are neurologic disease impairing cough and swallowing, lower esophageal sphincter incompetence, nasogastric intubation and chronic bronchitis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c012, section: etiology, statement: "Inherited conditions linked to generalized bronchiectasis are cystic fibrosis, ciliary dyskinesia, and antibody deficiency (hypogammaglobulinemia or IgG subclass deficiency)", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c013, section: etiology, statement: "Kartagener syndrome is a ciliary dyskinesia with dextrocardia, bronchiectasis and sinusitis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c014, section: etiology, statement: "Kartagener syndrome is caused by abnormal dynein arms, the parts of the cilium that power and control its beat", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c015, section: etiology, statement: "Cilia fail everywhere in the body in these syndromes, so sterility affects men and women alike", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c016, section: etiology, statement: "Defective cilia let infections of both upper and lower airways keep returning, leading to bronchiectasis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c017, section: etiology, statement: "Low IgA or IgG in hypogammaglobulinemia leaves the lungs open to repeated viral and bacterial infection", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c018, section: etiology, statement: "Inherited or acquired neutrophil defects make respiratory infection, and so bronchiectasis, more likely", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c019, section: pathogenesis, statement: "The whole wall of bronchi and bronchioles can be lost to severe inflammation", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c020, section: pathogenesis, statement: "Damaged bronchi dilate when the lung parenchyma downstream of them collapses", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c021, section: pathogenesis, statement: "Wall damage feeds itself: pooled mucus becomes infected and the infection destroys more of the bronchial wall", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c022, section: pathogenesis, statement: "In inflamed central airways the surface epithelium is altered and mucus is overproduced", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c023, section: gross, statement: "Generalized disease usually involves both lungs, chiefly the lower lobes and the left side more than the right", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c024, section: gross, statement: "A site of earlier obstruction or infection can be where localized bronchiectasis develops", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c025, section: gross, statement: "The walls of dilated bronchi are thick and look white or yellow", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c026, section: gross, statement: "The lumens often contain thick mucus mixed with pus", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c027, section: gross, statement: "The dilation is labeled cylindrical, varicose or saccular according to which generation of bronchial branches is affected", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c028, section: gross, statement: "How much lung is involved and how badly outweighs the name of the dilation pattern", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c029, section: gross, statement: "In a surgically removed lobe, the lung tissue around the widened thick-walled bronchi is collapsed and scarred", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c030, section: micro, statement: "Goblet cells increase in number and the surface epithelium shows squamous metaplasia", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c031, section: micro, statement: "Bronchial walls often contain lymphoid follicles", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c032, section: micro, statement: "Many small airways in the outer lung are scarred and closed", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c033, section: micro, statement: "The inflamed wall and its fibrous tissue are supplied by bronchial arteries that have enlarged", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c034, section: ancillary, statement: "Surgical resection may be needed for localized bronchiectasis, after which the removed lobe is available for examination", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c035, section: ancillary, statement: "In sections of the lobe the wall changes described under microscopic morphology (squamous metaplasia, goblet cells, lymphoid follicles, scarred small airways) are what to look for; the cited pages do not mention H&E", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c036, section: clinical, statement: "Patients cough chronically and bring up large volumes of sputum containing pus", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c037, section: clinical, statement: "Bronchial inflammation erodes adjacent bronchial arteries, which is why hemoptysis is common", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c038, section: clinical, statement: "The degree of dyspnea and wheezing depends on how widespread the disease is", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c039, section: clinical, statement: "Pneumonia is common in bronchiectasis", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c040, section: diagnosis, statement: "The chest radiograph shows widened bronchi with thickened walls", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c041, section: diagnosis, statement: "The definitive diagnosis comes from a CT scan of the lung", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c042, section: diagnosis, statement: "Localized bronchiectasis complicated by severe hemoptysis or pneumonia may need surgical resection", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c043, section: prognosis, statement: "Long-standing disease can end in chronic hypoxia and pulmonary hypertension", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c044, section: prognosis, statement: "In generalized disease resection mainly relieves symptoms and seldom cures", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c045, section: differential, statement: "Cystic fibrosis is an inherited condition associated with generalized bronchiectasis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c046, section: differential, statement: "In right middle lobe syndrome hilar lymph nodes usually compress the bronchus from outside, the lobe collapses, and bronchiectasis is found in the affected lung", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c047, section: differential, statement: "Chronic bronchitis is an acquired disorder that predisposes to bronchiectasis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c048, section: high-yield, statement: "Bronchi dilate irreversibly once their wall loses its muscle and elastic tissue", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c049, section: high-yield, statement: "Bronchiectasis is obstructive (localized, distal to a block) or nonobstructive (after infection or defective defenses)", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c050, section: high-yield, statement: "Inherited associations include cystic fibrosis, ciliary dyskinesia and hypogammaglobulinemia", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c051, section: high-yield, statement: "Kartagener syndrome is the triad of dextrocardia, bronchiectasis and sinusitis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c052, section: high-yield, statement: "Dilation patterns are cylindrical, varicose and saccular, and severity and extent matter more than the pattern", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c053, section: high-yield, statement: "CT scan gives the definitive diagnosis", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c054, section: high-yield, statement: "Complications include hemoptysis, pneumonia, chronic hypoxia and pulmonary hypertension", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c055, section: traps, statement: "Acute bronchial dilation after infection can be reversible, though recovery may take months", sourceRef: {source: rubin-8e, chapter: "18", pages: "703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c056, section: traps, statement: "The pattern designation is less important than severity and extent", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c057, section: traps, statement: "Generalized disease is usually bilateral while obstructive bronchiectasis is localized", sourceRef: {source: rubin-8e, chapter: "18", pages: "702-703"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c058, section: traps, statement: "Kartagener syndrome is one of the ciliary dyskinesia syndromes, defined by dextrocardia, bronchiectasis and sinusitis", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: bronchiectasis-c059, section: mnemonics, statement: "Main causes of bronchiectasis are obstruction, infection, cystic fibrosis and ciliary dyskinesia (Kartagener)", sourceRef: {source: rubin-8e, chapter: "18", pages: "702"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
