entity: barrett-esophagus
claims:
- {claimId: barrett-esophagus-c001, section: definition, statement: "In Barrett esophagus, intestinal metaplasia occurs: columnar epithelium with goblet cells occupies the place of the squamous esophageal lining.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c002, section: definition, statement: "Barrett esophagus results from chronic GERD.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c003, section: definition, statement: "Barrett epithelium begins in the lower third of the esophagus and can extend further up.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c004, section: definition, statement: "Case numbers are climbing, mainly among white men, and no explanation is known.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c005, section: definition, statement: "Barrett esophagus is found in roughly 5% to 15% of adults with GERD.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c006, section: etiology, statement: "Prevalence rises with age, and the diagnosis is usually made after age 50.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c007, section: etiology, statement: "Men are affected about three times as often as women.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c008, section: etiology, statement: "Smoking doubles the risk relative to nonsmokers.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c009, section: etiology, statement: "Being obese or of white race also raises the risk.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c010, section: pathogenesis, statement: "Only a minority of patients show dysplasia in the Barrett epithelium.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c011, section: pathogenesis, statement: "Adenocarcinoma may follow when dysplasia is left untreated.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c012, section: pathogenesis, statement: "Dysplastic Barrett epithelium is the origin of most esophageal adenocarcinomas.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c013, section: gross, statement: "At endoscopy Barrett mucosa has a typical salmon-pink color.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c014, section: gross, statement: "The whole lower esophagus may be lined by Barrett epithelium, or only part of the circumference in short segments.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c015, section: gross, statement: "Esophageal adenocarcinomas may protrude into the lumen as masses, or be flat or ulcerated.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c016, section: gross, statement: "A tan strip of Barrett mucosa can lie between the squamous lining higher up and the tumor.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c017, section: gross, statement: "The stomach begins where the gastric folds begin; columnar metaplasia ascending the esophagus does not change them.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c018, section: micro, statement: "The defining specialized epithelium mixes gastric foveolar cells with intestinal-type cells carrying mature goblet cells, and replaces the squamous cells.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c019, section: micro, statement: "Dysplasia in Barrett epithelium is classed as low-grade or high-grade, and management differs by grade.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c020, section: micro, statement: "Well-differentiated esophageal adenocarcinomas form well-developed glands.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c021, section: micro, statement: "Poorly differentiated esophageal adenocarcinomas form almost no glands.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c022, section: micro, statement: "Signet ring cells occur in some of the poorly differentiated adenocarcinomas.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c023, section: ancillary, statement: "Barrett esophagus is diagnosed by endoscopy with biopsy of the esophagus.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c024, section: ancillary, statement: "On histology, goblet cells and gastric foveolar cells are found where squamous epithelium should be.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c025, section: clinical, statement: "The diagnosis usually follows complaints of GERD.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c026, section: clinical, statement: "Many patients with Barrett esophagus do not report reflux symptoms.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c027, section: clinical, statement: "Patients with symptomatic esophageal adenocarcinoma are typically obese white men with a history of GERD.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c028, section: clinical, statement: "Dysphagia is usually the first symptom of esophageal cancer, and most tumors are already unresectable when it appears.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c029, section: diagnosis, statement: "Barrett esophagus is diagnosed by endoscopy with biopsy.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c030, section: diagnosis, statement: "Patients whose biopsies show no dysplasia have endoscopy repeated every 3 to 5 years.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c031, section: diagnosis, statement: "Follow-up aims to find dysplasia early so that cancer can be prevented.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c032, section: diagnosis, statement: "Endoscopy with ultrasound is the usual way to stage esophageal adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c033, section: prognosis, statement: "A longer Barrett segment and a higher dysplasia grade both go with a higher chance of adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c034, section: prognosis, statement: "Adenocarcinoma develops in Barrett esophagus at an estimated 0.1% to 0.3% per year.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c035, section: prognosis, statement: "For low-grade dysplasia, the 2016 ACG guidelines favor ablating the Barrett segment with radiofrequency, with optional endoscopic removal of nodular areas.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: barrett-esophagus-c036, section: prognosis, statement: "For low-grade dysplasia, yearly surveillance biopsies without treatment are an acceptable though less preferred option.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c037, section: prognosis, statement: "In high-grade dysplasia the guideline advice is to ablate the Barrett segment and resect visible nodular lesions.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c038, section: prognosis, statement: "Endoscopic mucosal resection is a treatment option for T1 esophageal cancers, the early invasive ones.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c039, section: prognosis, statement: "In the United States over 30 years, esophageal adenocarcinoma has become seven times as frequent.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c040, section: differential, statement: "In reflux esophagitis the lining stays squamous and inflamed, with a thickened basal layer and papillae.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c041, section: differential, statement: "In eosinophilic esophagitis endoscopy shows concentric rings and furrows, and the epithelium holds 15 or more eosinophils per high-power field.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c042, section: differential, statement: "Adenocarcinoma has glands or signet ring cells and is often surrounded by nonneoplastic Barrett mucosa.", sourceRef: {source: rubin-8e, chapter: "19", pages: "776"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c043, section: high-yield, statement: "Barrett esophagus is intestinal metaplasia with goblet cells replacing squamous lining.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c044, section: high-yield, statement: "Barrett esophagus results from chronic GERD.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c045, section: high-yield, statement: "Barrett mucosa is salmon-pink at endoscopy.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c046, section: high-yield, statement: "Diagnosis requires endoscopy with biopsy.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c047, section: high-yield, statement: "Adenocarcinoma risk correlates with segment length and dysplasia degree.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c048, section: high-yield, statement: "Annual adenocarcinoma risk is 0.1% to 0.3%.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c049, section: high-yield, statement: "Surveillance without dysplasia is at 3- to 5-year intervals.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c050, section: high-yield, statement: "High-grade dysplasia is treated with ablation plus endomucosal resection of nodular lesions.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c051, section: traps, statement: "Reflux esophagitis is inflammation of a squamous lining with basal hyperplasia and papillae, whereas Barrett esophagus is columnar replacement.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c052, section: traps, statement: "Many Barrett patients report no reflux symptoms.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c053, section: traps, statement: "Dysplasia develops in only a minority of Barrett patients.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c054, section: traps, statement: "Annual adenocarcinoma risk is low at 0.1% to 0.3%.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c055, section: traps, statement: "The diagnosis needs a biopsy that shows the specialized epithelium; endoscopic color alone is not enough.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: barrett-esophagus-c056, section: mnemonics, statement: "Mnemonic GOBLET summarizes goblet cells, GERD origin, biopsy diagnosis, length and dysplasia driving risk, lower-third location and adenocarcinoma risk.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
