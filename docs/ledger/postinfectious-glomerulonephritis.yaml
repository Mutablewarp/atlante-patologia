entity: postinfectious-glomerulonephritis
claims:
- claimId: postinfectious-glomerulonephritis-c001
  section: definition
  statement: "After an infection, immune complexes carrying much complement lodge in the glomeruli and produce a nephritic picture"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c002
  section: definition
  statement: "It remains one of the commonest kidney diseases of children"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c003
  section: definition
  statement: "Where nephritogenic infections are more frequent the disease stays common, while in most developed countries it is declining"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938-939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c004
  section: etiology
  statement: "Most cases follow infection by certain group A streptococci or by staphylococci; the streptococcal type is called post-streptococcal glomerulonephritis"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c005
  section: etiology
  statement: "Hepatitis B and malaria are examples of viral and parasitic infections that rarely trigger the disease"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c006
  section: etiology
  statement: "Skin infection as pyoderma is an especially common starting point in hot humid environments; the other primary site is the pharynx"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c007
  section: etiology
  statement: "Staphylococci now account for more cases than before"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c008
  section: pathogenesis
  statement: "In the post-streptococcal form the kidney disease appears only 9 to 14 days after the infection begins"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c009
  section: pathogenesis
  statement: "Complement activation and inflammation may be set off by immune complexes of pathogen antigen and antibody forming inside the glomeruli"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c010
  section: pathogenesis
  statement: "Bacteria might release substances that switch on complement directly, which would explain deposits holding complement but no immunoglobulin"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c011
  section: pathogenesis
  statement: "Under the inflammatory mediators, mesangial and endothelial cells proliferate while neutrophils and monocytes are attracted and activated"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c012
  section: pathogenesis
  statement: "Marked glomerular hypercellularity of this kind is what defines acute diffuse proliferative glomerulonephritis"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c013
  section: pathogenesis
  statement: "Low serum complement occurs in over 90% of patients, reflecting how extensive complement activation is"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c014
  section: micro
  statement: "In the acute phase the glomeruli are swollen and rich in cells throughout"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c015
  section: micro
  statement: "Infiltrating neutrophils and monocytes contribute, together with proliferating mesangial and endothelial cells, to the hypercellularity"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c016
  section: micro
  statement: "Crescents are uncommon"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c017
  section: micro
  statement: "The interstitium also shows some edema and a light scatter of mononuclear cells"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c018
  section: ancillary
  statement: "On a Masson trichrome section of an acute post-streptococcal case, glomeruli contain many neutrophils"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c019
  section: ancillary
  statement: "On electron microscopy the characteristic hump is a dense, dome-shaped deposit beneath the epithelial cells"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c020
  section: ancillary
  statement: "Mesangial and subendothelial deposits are always present together with the humps"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c021
  section: ancillary
  statement: "The mesangial and subendothelial deposits are harder to detect, yet probably contribute more to injury than the humps because they lie next to the blood's inflammatory systems"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c022
  section: ancillary
  statement: "At the sites of the humps, immunofluorescence shows granular C3 in capillary walls, with or without immunoglobulin"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c023
  section: ancillary
  statement: "In a rare variant, mostly after infection with methicillin-resistant staphylococcus, IgA stands out in the deposits"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c024
  section: clinical
  statement: "Onset is abrupt as a nephritic syndrome: facial puffiness and hypertension, with oliguria and hematuria"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c025
  section: clinical
  statement: "One to 2 weeks after the nephritogenic infection starts, the acute illness begins"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c026
  section: diagnosis
  statement: "Serum C3 is low during the acute syndrome and normalizes within 1 to 2 weeks"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c027
  section: diagnosis
  statement: "Serologic evidence of rising antibody titers to streptococcal antigens may establish the diagnosis, since organisms may be absent when nephritis develops"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c028
  section: prognosis
  statement: "Within a few weeks the acute phase is over in more than 90% of patients"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c029
  section: prognosis
  statement: "Neutrophils and endothelial hypercellularity are the first to disappear"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c030
  section: prognosis
  statement: "The mesangial hypercellularity and matrix expansion clear last, in most patients within several months"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c031
  section: prognosis
  statement: "Hematuria and especially proteinuria may last several months, although overt nephritis resolves within weeks"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c032
  section: prognosis
  statement: "Years after the acute episode, a few patients still have abnormal urinary sediment"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c033
  section: prognosis
  statement: "Progressive renal failure is rare and occurs particularly in adults"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c034
  section: differential
  statement: "Membranoproliferative glomerulonephritis arises from several different causes, and its glomeruli show thickened capillary walls as well as hypercellularity"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c035
  section: differential
  statement: "Membranous nephropathy deposits cover the capillary walls more extensively than the humps do"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c036
  section: high-yield
  statement: "The classic form follows a streptococcal infection after a 9 to 14 day delay"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c037
  section: high-yield
  statement: "In the acute phase the glomeruli are swollen and have too many cells"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c038
  section: high-yield
  statement: "Electron microscopy shows subepithelial humps"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c039
  section: high-yield
  statement: "Immunofluorescence shows granular C3 in capillary walls and serum C3 is lowered in the acute syndrome"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938-939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c040
  section: high-yield
  statement: "The nephritic syndrome of this disease shows as scanty, bloody urine with facial swelling and high blood pressure"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c041
  section: high-yield
  statement: "Most patients recover completely, and rare patients, particularly adults, progress to renal failure"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938-939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c042
  section: traps
  statement: "Rising antibody titers to streptococcal antigens can support the diagnosis because organisms may be absent by the time nephritis develops"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c043
  section: traps
  statement: "Staphylococcal infection also causes the disease and its share of cases is increasing"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938-939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c044
  section: traps
  statement: "Membranous nephropathy deposits are more widespread, whereas the humps are more limited in distribution"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c045
  section: traps
  statement: "Most patients resolve fully, but proteinuria may persist for months and rare patients progress to renal failure"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938-939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: postinfectious-glomerulonephritis-c046
  section: mnemonics
  statement: "The mnemonic HUMPS recalls hypercellular glomeruli, subepithelial location, low complement, pharyngeal or skin infection and resolution within weeks"
  sourceRef: { source: rubin-8e, chapter: "22", pages: "938-939" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
