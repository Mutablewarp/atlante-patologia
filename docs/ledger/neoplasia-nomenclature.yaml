entity: neoplasia-nomenclature
claims:
- {claimId: neoplasia-nomenclature-c001, section: definition, statement: "A neoplasm is a self-driven growth that ignores the usual brakes on cell number", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c002, section: definition, statement: "The word tumor is in common use for neoplasms because most of them form a space-occupying mass", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c003, section: definition, statement: "Spread to distant sites makes a tumor malignant, also called cancer, while a tumor that stays localized is benign", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c004, section: definition, statement: "The primary descriptor of a tumor is its cell of origin", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c005, section: definition, statement: "Tumor names ending in -oma no longer reliably indicate biologic behavior, although the ending was historically used for benign tumors", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c006, section: definition, statement: "Despite the -oma suffix, melanoma and seminoma are highly malignant", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c007, section: definition, statement: "The term carcinoma is used for a cancer made of epithelial cells", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c008, section: definition, statement: "Sarcoma refers to a malignancy of mesenchymal origin", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c009, section: definition, statement: "Leukemia is the usual term for a malignant proliferation arising in the blood-forming organs", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c010, section: definition, statement: "Malignancies of lymphoid cells are called lymphomas", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c011, section: definition, statement: "Hodgkin disease and Ewing sarcoma bear a person's name because the tissue they arise from was long doubtful", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c012, section: definition, statement: "A hamartoma is not a true neoplasm but a haphazard mix of structures arising in development", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c013, section: definition, statement: "Neoplasms become more frequent as people grow older", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c014, section: pathogenesis, statement: "Neoplastic cells keep dividing, and how far they mature is distorted to varying extents", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c015, section: pathogenesis, statement: "Mature neurons and cardiac myocytes cannot form tumors, since only cells that normally can multiply give rise to neoplasms", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c016, section: micro, statement: "Well-differentiated tumors look much like their tissue of origin, and benign tumors usually belong in this group", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c017, section: micro, statement: "The origin of some tumors is uncertain because their cells appear very primitive", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c018, section: micro, statement: "The more abnormal the cells look (atypia, or anaplasia), the more aggressive the tumor generally is", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c019, section: micro, statement: "Atypical mitotic figures and pleomorphism (variation in cell and nuclear size and shape) are cytologic signs of anaplasia", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c020, section: micro, statement: "Chondrosarcoma cells are misshapen, while a chondroma is almost indistinguishable from normal cartilage", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c021, section: micro, statement: "Malignant tumors often contain an abnormally large number of mitotic figures", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c022, section: micro, statement: "A few mitoses already establish malignancy in some tumors, leiomyosarcoma for one", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c023, section: micro, statement: "Sheets of cells are one example of the disorganized growth that malignant neoplasms often show", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c024, section: micro, statement: "Tumor cells inside blood or lymph vessels suggest malignancy", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c025, section: micro, statement: "Local invasion is important when diagnosing malignancy in follicular thyroid cancer", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c026, section: ancillary, statement: "On routine sections, invasiveness, growth pattern, mitotic activity, atypia and differentiation help separate benign from malignant tumors", sourceRef: {source: rubin-8e, chapter: "5", pages: "170-171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c027, section: ancillary, statement: "Tumor cell lineage can be determined with immunohistochemistry or flow cytometry", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c028, section: ancillary, statement: "Cytokeratin immunostaining can identify a poorly differentiated metastatic tumor as a carcinoma (figure example)", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c029, section: ancillary, statement: "S-100 positivity points to melanocytic origin, even when the metastasis has no pigment (figure example)", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c030, section: ancillary, statement: "Molecular studies including sequencing help determine tumor origin", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c031, section: ancillary, statement: "EM can still help separate look-alike tumors through specialized structures, though marker studies have largely taken over its role", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c032, section: ancillary, statement: "Gene products made by a neoplasm serve as tumor markers, found in body fluids or on or inside tumor cells", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c033, section: ancillary, statement: "Therapies are often chosen on the basis of the identified cell lineage", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c034, section: clinical, statement: "Location can make even a benign tumor lethal", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c035, section: clinical, statement: "A benign meningioma may kill by compressing an important brain structure", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c036, section: clinical, statement: "Sudden death may result when a benign myxoma of the left atrium obstructs the mitral orifice", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c037, section: clinical, statement: "Slow growth can make some malignant tumors, e.g. of thyroid and prostate, harmless to life", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c038, section: diagnosis, statement: "A benign or malignant label is a forecast of how the tumor will act later", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c039, section: diagnosis, statement: "No scientific principle sets the benign/malignant criteria; they rest on experience of how each tumor appearance has behaved clinically", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c040, section: diagnosis, statement: "Telling benign from malignant is usually easy, although certain cases need further work-up", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c041, section: diagnosis, statement: "In a few tumors, even an expert cannot decide from the slide, and only the clinical course settles the diagnosis", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c042, section: diagnosis, statement: "A tumor that produces metastases is identified as malignant", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c043, section: diagnosis, statement: "A metastasis found before any known primary can be traced to its tissue of origin with tissue-linked markers", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c044, section: diagnosis, statement: "After the primary neoplasm is treated, blood levels of tumor antigens such as PSA and CA 125 can be used to monitor whether disease progresses or spreads", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c045, section: diagnosis, statement: "Such blood markers have worked less well for screening populations", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c046, section: diagnosis, statement: "Estrogen and progesterone receptors in breast cancer guide therapeutic decisions", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c047, section: prognosis, statement: "A tumor's behavior can differ from what its microscopic appearance suggests", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c048, section: prognosis, statement: "Skin basal cell carcinoma looks malignant yet rarely spreads and is not lethal, though it burrows locally", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c049, section: prognosis, statement: "Many endocrine tumors, including pancreatic islet tumors, cannot be classed as benign or malignant from the slide; only the presence or absence of metastasis decides", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c050, section: prognosis, statement: "Above all, a benign tumor is one that stays put: no invasion of nearby tissue, no metastasis", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c051, section: differential, statement: "Benign tumors neither invade nor metastasize and tend to be better differentiated", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c052, section: differential, statement: "Malignant tumors grow into neighboring tissue and spread to distant sites", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c053, section: differential, statement: "A hamartoma is not a true neoplasm but a haphazard mix of structures arising in development", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c054, section: differential, statement: "Nodular fasciitis is reactive, but its fibroblasts can look atypical enough to be mistaken for fibrosarcoma", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c055, section: differential, statement: "Some well-differentiated endocrine carcinomas can show a microscopic picture matching that of a benign adenoma", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c056, section: high-yield, statement: "The primary descriptor of a tumor is its cell of origin", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c057, section: high-yield, statement: "The -oma suffix does not guarantee benignity; melanoma and seminoma are malignant", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c058, section: high-yield, statement: "Carcinoma is a malignant epithelial tumor and sarcoma a malignant mesenchymal tumor", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c059, section: high-yield, statement: "Benign tumors do not invade adjacent tissue or metastasize", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c060, section: high-yield, statement: "Hamartomas are not true neoplasms", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c061, section: high-yield, statement: "Tumor markers, studied by immunologic techniques, help identify the origin of poorly differentiated tumors", sourceRef: {source: rubin-8e, chapter: "5", pages: "172"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c062, section: traps, statement: "Despite the -oma suffix, melanoma and seminoma are malignant", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c063, section: traps, statement: "A hamartoma is not a true neoplasm but a haphazard mix of structures arising in development", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c064, section: traps, statement: "A meningioma that compresses an important brain structure can kill, even though it is benign", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c065, section: traps, statement: "Basal cell carcinomas of the skin rarely metastasize", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c066, section: traps, statement: "Nodular fasciitis is a reactive lesion, and misdiagnosing it as fibrosarcoma can lead to unnecessary surgery", sourceRef: {source: rubin-8e, chapter: "5", pages: "171"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c067, section: mnemonics, statement: "Carcinoma is a malignancy of epithelial cells and sarcoma of mesenchymal cells (original mnemonic)", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: neoplasia-nomenclature-c068, section: mnemonics, statement: "Benign tumors remain localized while malignant tumors invade and metastasize (original mnemonic)", sourceRef: {source: rubin-8e, chapter: "5", pages: "170"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
