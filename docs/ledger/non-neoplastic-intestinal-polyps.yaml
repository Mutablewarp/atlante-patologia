entity: non-neoplastic-intestinal-polyps
claims:
- {claimId: non-neoplastic-intestinal-polyps-c001, section: definition, statement: "Any lesion that juts into the bowel lumen is a polyp, whether flat-based (sessile) or on a stalk", sourceRef: {source: rubin-8e, chapter: "19", pages: "819"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c002, section: definition, statement: "Polyps matter because certain types may turn malignant, while on their own they rarely cause symptoms", sourceRef: {source: rubin-8e, chapter: "19", pages: "819"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c003, section: definition, statement: "An inflammatory polyp is a small raised area where inflamed epithelium is healing", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c004, section: definition, statement: "A hamartomatous polyp consists of the organ's usual epithelium and stroma growing out of proportion and out of order", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c005, section: etiology, statement: "Colitis of any cause can lead to inflammatory polyps; ulcerative colitis and Crohn disease are the usual settings", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c006, section: etiology, statement: "Some inflammatory polyps arise in a colon with no demonstrable disease, and a previous healed infectious colitis may be the link", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c007, section: etiology, statement: "A lymphoid polyp is a single focus of lymphoid tissue lying in the submucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "819"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c008, section: etiology, statement: "Children and people with common variable immunodeficiency account for most cases of nodular lymphoid hyperplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c009, section: etiology, statement: "Some hamartomatous polyps appear sporadically, others as part of an inherited syndrome", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c010, section: etiology, statement: "Peutz-Jeghers syndrome is autosomal dominant", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c011, section: etiology, statement: "The tumor suppressor gene LKB1 carries loss-of-function mutations in most Peutz-Jeghers patients", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c012, section: etiology, statement: "Juvenile polyps are sporadic or part of a polyposis syndrome", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c013, section: etiology, statement: "SMAD4 or BMPR1A mutations are found in some families with juvenile polyposis", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c014, section: etiology, statement: "30% to 40% of juvenile polyposis patients have no identified mutation", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c015, section: etiology, statement: "Cowden and Bannayan-Ruvalcaba-Riley syndromes are both linked to germline PTEN mutations and inherited in an autosomal dominant pattern", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c016, section: etiology, statement: "Cronkhite-Canada syndrome is not an inherited disorder", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c017, section: pathogenesis, statement: "An inflammatory polyp is a raised patch of regenerating inflamed epithelium that often contains granulation tissue", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c018, section: pathogenesis, statement: "AMPK and related kinases regulate growth and energy metabolism, and LKB1 normally activates them", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c019, section: pathogenesis, statement: "Cell proliferation is controlled by the TGF-beta pathway, in which SMAD4 and BMPR1A take part", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c020, section: gross, statement: "A lymphoid polyp can be as small as a pinpoint or as large as 5 cm", sourceRef: {source: rubin-8e, chapter: "19", pages: "819"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c021, section: gross, statement: "When many lymphoid polyps are present, the mucosal surface may look cobblestoned", sourceRef: {source: rubin-8e, chapter: "19", pages: "819-820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c022, section: gross, statement: "Lymphoid polyps are covered by intact mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c023, section: gross, statement: "The small intestine is the commonest site of Peutz-Jeghers polyps, although they can occur anywhere in the gastrointestinal tract", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c024, section: gross, statement: "Peutz-Jeghers polyps have a bosselated surface", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c025, section: gross, statement: "Juvenile polyps are mostly rectal and usually solitary (rarely multiple), but can occur anywhere in the small or large bowel", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c026, section: gross, statement: "Typical juvenile polyps have a stalk and a smooth round surface, and most are 2 cm or smaller", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c027, section: micro, statement: "The follicles of a lymphoid polyp are prominent and have germinal centers", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c028, section: micro, statement: "In an inflammatory polyp granulation tissue often lies between the glands, whose distortion and inflammation vary", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c029, section: micro, statement: "By definition inflammatory polyps show no dysplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c030, section: micro, statement: "Peutz-Jeghers polyp epithelium resembles normal small intestine but is often arranged unusually", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c031, section: micro, statement: "Beneath the epithelium, thick bundles of smooth muscle branch like a tree", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c032, section: micro, statement: "In juvenile polyps cystically dilated glands lie in a fibrovascular lamina propria", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c033, section: micro, statement: "The dilated glands of juvenile polyps are filled with mucus and inflammatory cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c034, section: micro, statement: "Granulation tissue is often found beneath an eroded surface in juvenile polyps", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c035, section: micro, statement: "Dysplasia is rare in juvenile polyps", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c036, section: micro, statement: "In appearance, GI polyps of PTEN syndromes frequently cannot be told from juvenile polyps", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c037, section: micro, statement: "Some PTEN-syndrome polyps contain a prominent component of neurons and ganglion cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c038, section: micro, statement: "Cronkhite-Canada polyps are indistinguishable from juvenile polyps", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c039, section: ancillary, statement: "On H&E, Peutz–Jeghers is suggested by branching smooth muscle under unremarkable epithelium", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c040, section: ancillary, statement: "A fibrovascular lamina propria containing cystic mucus-filled glands suggests a juvenile polyp", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c041, section: ancillary, statement: "LKB1 is located on chromosome 19p13.3", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c042, section: clinical, statement: "Lymphoid polyps are benign and seldom cause symptoms", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c043, section: clinical, statement: "Sporadic juvenile polyps typically show up as rectal bleeding or prolapse", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c044, section: clinical, statement: "Children under 10 years are affected by juvenile polyps most often", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c045, section: clinical, statement: "Up to 30% of juvenile polyps arise in adults", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c046, section: clinical, statement: "Peutz–Jeghers syndrome shows pigmentation of the lips, oral mucosa, extremities and genitals", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c047, section: clinical, statement: "PTEN syndromes cause hamartomas in the bowel, thyroid, breast and skin", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c048, section: clinical, statement: "Cronkhite–Canada syndrome may cause anemia, electrolyte problems and protein loss through the gut", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c049, section: clinical, statement: "Cronkhite–Canada syndrome darkens the skin, deforms the nails and causes loss of scalp and body hair", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c050, section: diagnosis, statement: "At least five juvenile polyps in the colon and rectum allow the diagnosis of juvenile polyposis syndrome", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c051, section: diagnosis, statement: "Juvenile polyps outside the colon also allow the diagnosis of juvenile polyposis syndrome", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c052, section: diagnosis, statement: "Juvenile polyps in any number, in a person whose family has juvenile polyposis, also allow the diagnosis", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c053, section: diagnosis, statement: "Cowden syndrome is recognized from the clinical picture and from manifestations outside the intestine", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c054, section: diagnosis, statement: "Imaging of nodular lymphoid hyperplasia can lead to a mistaken diagnosis of FAP", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c055, section: prognosis, statement: "Inflammatory polyps have no malignant potential", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c056, section: prognosis, statement: "A link between nodular lymphoid hyperplasia and malignant lymphoma is uncommon", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c057, section: prognosis, statement: "Peutz–Jeghers syndrome carries added cancer risk mostly outside the gut, in the pancreas and reproductive organs", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c058, section: prognosis, statement: "Sporadic juvenile polyps do not make malignancy more likely", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c059, section: prognosis, statement: "Carcinoma of the gastrointestinal tract and of the pancreas is more likely in juvenile polyposis syndrome", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c060, section: prognosis, statement: "Cowden syndrome raises risk of breast, thyroid, gynecologic and bladder cancers and of meningioma", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c061, section: prognosis, statement: "The risk of gastrointestinal cancer does not seem to be raised in Cowden syndrome", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c062, section: prognosis, statement: "Cronkhite-Canada patients may face more gastric and colorectal cancer, but this is not entirely clear", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c063, section: differential, statement: "Hyperplastic polyps are small sessile serrated lesions without dysplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c064, section: differential, statement: "Sessile serrated adenomas typically arise in the right colon and are an important carcinoma precursor", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c065, section: differential, statement: "Radiologic appearance of nodular lymphoid hyperplasia can mimic FAP", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c066, section: differential, statement: "Cronkhite-Canada polyps resemble juvenile polyps but the syndrome is not inherited", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c067, section: differential, statement: "Cowden polyps resemble juvenile polyps and come with hamartomas of skin, breast and thyroid", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c068, section: high-yield, statement: "Inflammatory polyps show no dysplasia and have no malignant potential", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c069, section: high-yield, statement: "Lymphoid polyps are benign submucosal lymphoid accumulations with follicles and germinal centers", sourceRef: {source: rubin-8e, chapter: "19", pages: "819-820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c070, section: high-yield, statement: "Peutz-Jeghers polyps have bland epithelium over arborizing smooth muscle", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c071, section: high-yield, statement: "Peutz-Jeghers syndrome is autosomal dominant, with LKB1 mutations and mucocutaneous pigmentation", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c072, section: high-yield, statement: "Juvenile polyps are mostly rectal, with cystic mucus-filled glands, and present with bleeding", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c073, section: high-yield, statement: "Juvenile polyposis (SMAD4, BMPR1A) raises gastrointestinal and pancreatic cancer risk", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c074, section: high-yield, statement: "Juvenile polyposis requires five or more colorectal polyps, or polyps outside the colon, or a family history", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c075, section: high-yield, statement: "Cowden syndrome (PTEN) does not appear to raise gastrointestinal cancer risk", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c076, section: high-yield, statement: "Cronkhite-Canada syndrome is not inherited and features alopecia and nail dystrophy", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c077, section: traps, statement: "Inflammatory polyps have no malignant potential by definition", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c078, section: traps, statement: "Sporadic juvenile polyps carry no increased malignancy risk", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c079, section: traps, statement: "Increased cancer risk belongs to the juvenile polyposis syndrome, not to sporadic polyps", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c080, section: traps, statement: "Peutz-Jeghers cancer risk lies largely outside the gastrointestinal tract", sourceRef: {source: rubin-8e, chapter: "19", pages: "820"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c081, section: traps, statement: "Cronkhite-Canada syndrome is not inherited", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: non-neoplastic-intestinal-polyps-c082, section: traps, statement: "Cowden syndrome does not appear to raise gastrointestinal cancer risk", sourceRef: {source: rubin-8e, chapter: "19", pages: "821"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
