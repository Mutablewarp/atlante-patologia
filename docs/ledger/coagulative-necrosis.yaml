  - claimId: coagulative-necrosis-c075
    section: ancillary
    statement: "Once ischemia has lasted 30-60 minutes, myocyte injury is irreversible; electron microscopy then shows focal breaks in the sarcolemma, chromatin clumped at the nuclear rim, and markedly swollen mitochondria containing amorphous densities."
