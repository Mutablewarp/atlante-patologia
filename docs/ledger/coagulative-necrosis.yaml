  - claimId: coagulative-necrosis-c073
    section: ancillary
    statement: "On H&E, infarcted myocardium is eosinophilic after about 12-18 hours; the neutrophils, then macrophages and granulation tissue that arrive at the border afterwards indicate the age of the infarct."
