  - claimId: coagulative-necrosis-c074
    section: ancillary
    statement: "Only electron microscopy shows the first changes of myocardial ischemia; for about 20-30 minutes after flow stops completely the myocyte can still recover, and its changes are subtle: depleted glycogen and slight swelling of sarcoplasm and mitochondria."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
