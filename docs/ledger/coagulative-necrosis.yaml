  - claimId: coagulative-necrosis-c074
    section: ancillary
    statement: "The earliest morphologic signs of ischemic injury need electron microscopy; the reversible stage lasts about 20-30 minutes of total ischemia and shows sarcoplasmic edema, mild mitochondrial swelling and glycogen loss."
