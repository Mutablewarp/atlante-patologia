  - claimId: coagulative-necrosis-c071
    section: ancillary
    statement: "A transmural infarct maps onto the occluded artery: left anterior descending to the anterior wall, apex and anterior septum; proximal right coronary to the posterior basal left ventricle and posterior septum (inferior infarct); circumflex to the lateral wall. Textbook figures show infarcts on transverse slices of the ventricles."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "656-657" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: coagulative-necrosis-c073
    section: ancillary
    statement: "On H&E, infarcted myocardium is eosinophilic after about 12-18 hours; the neutrophils, then macrophages and granulation tissue that arrive at the border afterwards indicate the age of the infarct."
