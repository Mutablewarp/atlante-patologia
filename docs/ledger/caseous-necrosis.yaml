entity: caseous-necrosis
claims:
  - claimId: caseous-necrosis-c001
    section: definition
    statement: "Unlike coagulative necrosis, caseous necrosis erases cell outlines; unlike liquefactive necrosis, it does not dissolve the dead cells, which linger as amorphous granular eosinophilic debris."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c002
    section: definition
    statement: "Caseous necrosis is typical of tuberculosis and occurs less often in other conditions."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c003
    section: definition
    statement: "Caseous necrosis lies at the center of tuberculous granulomas (tubercles)."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c004
    section: definition
    statement: "Caseation should make tuberculosis the first consideration, although some tuberculous lesions do not caseate and other agents can cause caseation."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c005
    section: etiology
    statement: "M. tuberculosis causes caseating lesions in the lung, regional lymph nodes and other seeded organs."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "450-451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c006
    section: etiology
    statement: "Histoplasma capsulatum causes necrotizing granulomas with caseous material in lung, hilar and mediastinal nodes, spleen and liver."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "462" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c007
    section: etiology
    statement: "Coccidioides immitis causes necrotizing granulomas that may heal as a fibrocaseous nodule."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c008
    section: etiology
    statement: "A high bacillary load favors extensive caseous necrosis, whereas a manageable load in a competent host is killed and contained by fibrosis."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c009
    section: pathogenesis
    statement: "Alveolar macrophages ingest M. tuberculosis but cannot kill it because cell wall lipids block phagosome-lysosome fusion."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "450-451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c010
    section: pathogenesis
    statement: "Antigen display by infected macrophages drives T-cell proliferation and IFN-gamma secretion, which activates macrophages and raises their lytic enzyme content."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c011
    section: pathogenesis
    statement: "The hypersensitivity and cell-mediated responses take roughly three to six weeks to develop."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c012
    section: pathogenesis
    statement: "Released lytic enzymes damage host tissue; with many bacilli the hypersensitivity reaction produces marked caseous necrosis."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c013
    section: pathogenesis
    statement: "Toxic waxy glycolipids of the mycobacterial wall are usually held responsible for the unusual character of caseous necrosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c014
    section: pathogenesis
    statement: "Granuloma formation may be orchestrated by mycobacteria to aid their survival against host immunity."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c015
    section: pathogenesis
    statement: "Agents that kill the macrophages that ingest them produce necrotizing granulomas with debris and dead cells and organisms in the center; non-lethal stimuli as in sarcoidosis produce nonnecrotizing granulomas."
    sourceRef: { source: rubin-8e, chapter: "2", pages: "92" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c016
    section: gross
    statement: "On cut section caseous material is soft, friable and gray-white and looks like cheese, which explains the name."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c017
    section: gross
    statement: "Primary tuberculosis leaves a sharply demarcated subpleural nodule with a necrotic core (Ghon focus), 1-2 cm when healed, that eventually scars and calcifies."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c018
    section: gross
    statement: "Tuberculous cavities favor the upper-lobe apices and contain caseous material with acid-fast bacilli; they range from under 1 cm to almost a whole lung, most being 3-10 cm."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c019
    section: gross
    statement: "Miliary tuberculosis produces many small yellow-white nodules resembling millet seeds in multiple organs."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "450-451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c020
    section: gross
    statement: "Intestinal tuberculosis shows enlarged mesenteric nodes with caseous necrosis; brain tuberculomas are masses with central caseous necrosis."
    sourceRef: { source: rubin-8e, chapter: "19, 32", pages: "807, 1468" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c021
    section: micro
    statement: "Microscopically the caseous center is amorphous granular eosinophilic material without cell outlines."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c022
    section: micro
    statement: "Around the necrotic core of a tuberculous granuloma lie epithelioid macrophages and Langhans giant cells, then lymphocytes, with fibrosis at the outer edge."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c023
    section: micro
    statement: "Langhans giant cells have nuclei arranged peripherally in a horseshoe; foreign body giant cells have dispersed nuclei."
    sourceRef: { source: rubin-8e, chapter: "2", pages: "92" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c024
    section: micro
    statement: "CD4+ T lymphocytes form a collar around the central macrophages, giant cells and necrotic debris."
    sourceRef: { source: rubin-8e, chapter: "2", pages: "92" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c025
    section: micro
    statement: "With impaired immunity the granuloma can fail to organize, forming loose macrophage collections without Langhans giant cells."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c026
    section: micro
    statement: "Healing lesions undergo fibrosis and calcification."
    sourceRef: { source: rubin-8e, chapter: "9, 18", pages: "451, 707" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c027
    section: ancillary
    statement: "Acid-fast stains such as Ziehl-Neelsen demonstrate mycobacteria, which appear as slender beaded rods."
    sourceRef: { source: rubin-8e, chapter: "9, 18", pages: "450, 709" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c028
    section: ancillary
    statement: "In histoplasmosis, silver impregnation outlines degenerating yeast remnants inside caseous foci."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "461" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c029
    section: ancillary
    statement: "GMS (a silver stain) and PAS stains help visualize Coccidioides immitis."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c030
    section: clinical
    statement: "Over 90% of normal adults contain primary tuberculous infection, which is usually asymptomatic."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c031
    section: clinical
    statement: "Active tuberculosis causes fever, weight loss, fatigue and night sweats; cough and hemoptysis appear with established lung disease."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451-452" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c032
    section: clinical
    statement: "Tuberculomas rank among the commonest intracranial masses in countries with endemic tuberculosis."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1468" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c033
    section: clinical
    statement: "In Pott disease caseating granulomas begin in vertebral marrow and vertebral collapse leads to kyphosis."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1352" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c034
    section: clinical
    statement: "Tuberculous epididymitis enlarges the epididymis and beads the vas deferens through confluent caseating granulomas."
    sourceRef: { source: rubin-8e, chapter: "23", pages: "998" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c035
    section: diagnosis
    statement: "Finding caseous necrosis should raise suspicion of tuberculosis."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c036
    section: diagnosis
    statement: "Organisms are sought with acid-fast stains for mycobacteria and with GMS (silver) and PAS stains for fungi."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "450, 461-463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c037
    section: diagnosis
    statement: "Unilateral or bilateral apical cavities on chest radiographs suggest secondary tuberculosis."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c038
    section: diagnosis
    statement: "Calcification of healed primary tuberculous lesions is visible radiographically."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c039
    section: prognosis
    statement: "Healed tuberculous lesions in lungs and nodes scar and calcify, often with no functional consequence."
    sourceRef: { source: rubin-8e, chapter: "1, 9", pages: "29, 451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c040
    section: prognosis
    statement: "Small numbers of bacilli remain viable in healed foci for years and can reactivate if immunity fails."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c041
    section: prognosis
    statement: "Erosion of a caseous focus into a bronchus drains it, creating a cavity and spreading infection through the airways."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "708" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c042
    section: prognosis
    statement: "Complications include rupture into the pleural space with empyema or pneumothorax, hemoptysis from eroded arteries, and aspergilloma in an open cavity."
    sourceRef: { source: rubin-8e, chapter: "9, 18", pages: "452, 708" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c043
    section: prognosis
    statement: "Rupture of a brain tuberculoma into the CSF causes tuberculous meningitis."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1468" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c044
    section: prognosis
    statement: "Chronic cavitary tuberculosis was formerly a common cause of secondary amyloidosis."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "452" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c045
    section: prognosis
    statement: "Caseous material of histoplasmosis granulomas calcifies, while old coccidioidomycosis granulomas rarely calcify."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "462-463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c046
    section: differential
    statement: "In coagulative necrosis the cell outline is maintained, the cytoplasm is more eosinophilic and nuclei are lost, as in infarcts."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38-39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c047
    section: differential
    statement: "In liquefactive necrosis neutrophil hydrolases dissolve dead tissue into an abscess cavity; brain infarcts also liquefy."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c048
    section: differential
    statement: "Fat necrosis appears as chalky white areas, with basophilic calcium soaps at the edges of necrotic adipocytes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39-40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c049
    section: differential
    statement: "Fibrinoid necrosis typically affects injured vessel walls, which stain intensely with eosin owing to accumulated plasma proteins."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c050
    section: differential
    statement: "Nonnecrotizing granulomas, as in sarcoidosis, have viable epithelioid macrophages and giant cells in the center; significant necrosis is uncommon."
    sourceRef: { source: rubin-8e, chapter: "2, 18", pages: "92, 738" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c051
    section: differential
    statement: "The beryllium lymphocyte proliferation test helps separate berylliosis from sarcoidosis."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c052
    section: differential
    statement: "Fungal necrotizing granulomas can caseate and resemble tuberculosis, and contain yeasts (Histoplasma) or spherules (Coccidioides)."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "462-463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c053
    section: high-yield
    statement: "Caseous necrosis is cheese-like necrosis at the center of a granuloma."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c054
    section: high-yield
    statement: "Caseous dead cells lose their outlines but are not digested by neutrophils, persisting as amorphous granular eosinophilic debris."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c055
    section: high-yield
    statement: "The classic cause is tuberculosis; histoplasmosis and coccidioidomycosis can also produce caseous granulomas."
    sourceRef: { source: rubin-8e, chapter: "1, 9", pages: "40, 462-463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c056
    section: high-yield
    statement: "T-cell hypersensitivity activates macrophages via IFN-gamma and released lytic enzymes damage tissue."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c057
    section: high-yield
    statement: "The granuloma rim contains epithelioid macrophages, Langhans giant cells with horseshoe nuclei, lymphocytes and fibrosis."
    sourceRef: { source: rubin-8e, chapter: "2, 9", pages: "92, 451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c058
    section: high-yield
    statement: "Caseous foci either heal with calcification or erode into a bronchus and cavitate."
    sourceRef: { source: rubin-8e, chapter: "9, 18", pages: "451, 708" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c059
    section: traps
    statement: "Caseation is not specific for tuberculosis; fungi also cause it."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451, 462-463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c060
    section: traps
    statement: "In immunocompromised hosts tuberculous granulomas may be poorly formed."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c061
    section: traps
    statement: "In tuberculous endometritis monthly shedding prevents granulomas from maturing and caseating, so poorly formed granulomas without necrosis are typical."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1020" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c062
    section: traps
    statement: "Caseous necrosis is a different pattern from neutrophil-driven liquefactive necrosis, but caseous material can soften or liquefy centrally and leaves a cavity once it is discharged into a bronchus."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "707-708" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c063
    section: traps
    statement: "Asteroid and Schaumann bodies occur in most granulomatous diseases and therefore do not specifically indicate sarcoidosis."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "738" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c064
    section: traps
    statement: "Much of the tissue necrosis in tuberculosis comes from the host hypersensitivity response and released macrophage enzymes."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "451" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c065
    section: mnemonics
    statement: "Caseous debris is not digested by neutrophils as in liquefactive necrosis; it may soften and persists until it calcifies or drains into a bronchus."
    sourceRef: { source: rubin-8e, chapter: "1, 18", pages: "40, 708" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: caseous-necrosis-c066
    section: mnemonics
    statement: "M. tuberculosis, Histoplasma and Coccidioides are the usual causes of caseating granulomas."
    sourceRef: { source: rubin-8e, chapter: "1, 9", pages: "40, 462-463" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
