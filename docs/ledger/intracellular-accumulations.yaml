entity: intracellular-accumulations
claims:
  - claimId: intracellular-accumulations-c001
    section: definition
    statement: "Intracellular storage is the retention of material inside cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c002
    section: definition
    statement: "Stored substances may be normal or abnormal, endogenous or exogenous, and harmful or harmless."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c003
    section: definition
    statement: "The stored material in the textbook overview comprises lipids (fat, cholesterol), glycogen, abnormal proteins, and pigments or particulates."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4-7" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c004
    section: definition
    statement: "Intracellular storage is listed among the major adaptive responses of cells to persistent stress, together with atrophy, hypertrophy, hyperplasia, metaplasia and dysplasia."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "7" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c005
    section: definition
    statement: "Glycogen storage diseases have a combined incidence of about 1 in 20,000 to 25,000 births."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c006
    section: etiology
    statement: "Increased fatty acid delivery in diabetes or alcohol-altered metabolism, glycogen excess in uncontrolled diabetes, cholesterol in familial hypercholesterolemia and iron overload are causes of storage of normal constituents."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5, 7" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c007
    section: etiology
    statement: "Inherited enzyme defects block glycogen degradation or lysosomal catabolism of complex lipids and mucopolysaccharides."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c008
    section: etiology
    statement: "Abnormal tertiary protein structure may result from a mutation or from an acquired folding defect."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "36" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c009
    section: etiology
    statement: "Non-metabolized materials include insoluble pigments such as lipofuscin and foreign particulates such as inhaled silica or carbon."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4-5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c010
    section: pathogenesis
    statement: "Most triglyceride made in the liver, which hepatocytes build from the free fatty acids that adipocytes release, leaves as lipoproteins."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c011
    section: pathogenesis
    statement: "Increased free fatty acid delivery to the liver leads to triglyceride accumulation in hepatocytes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c012
    section: pathogenesis
    statement: "Blood glucose levels regulate glycogen storage; hyperglycemia can increase glycogen stores."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c013
    section: pathogenesis
    statement: "Glycogen is converted stepwise to glucose by several enzymes, and mutational inactivation of any one causes a glycogen storage disease."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c014
    section: pathogenesis
    statement: "Lysosomal acid hydrolases degrade lipids, glycoproteins and mucopolysaccharides; deficiency of one leaves its substrate undigested within distended lysosomes."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c015
    section: pathogenesis
    statement: "Brain and heart cells are the most likely to fail or die when swollen lysosomes crowd out their other work."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c016
    section: pathogenesis
    statement: "Each lysosomal storage disease group is named for the substrate class it retains, e.g. gangliosidoses, mucopolysaccharidoses."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c017
    section: pathogenesis
    statement: "Cerebrosides accumulate in Gaucher disease, gangliosides in Tay-Sachs disease and mucopolysaccharide products in Hurler and Hunter syndromes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c018
    section: pathogenesis
    statement: "Symptoms of glycogenoses reflect either glycogen accumulation itself (Pompe) or lack of glucose from glycogen breakdown (von Gierke)."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c019
    section: pathogenesis
    statement: "Protein misfolding occurs continually; chaperones and proteasomes refold or eliminate defective proteins."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "7, 37" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c020
    section: pathogenesis
    statement: "If protein quality control fails or is overloaded, misfolded proteins accumulate as amorphous aggregates or fibrils."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "37" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c021
    section: pathogenesis
    statement: "Misfolded proteins injure cells through loss of function or harmful gain of function."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "37" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c022
    section: pathogenesis
    statement: "Protein aggregates too large for proteasomes are directed to autophagosomes via ubiquitin and the p62 adaptor."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "16" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c023
    section: pathogenesis
    statement: "Protein aggregates can deplete cellular ubiquitin, generate reactive oxygen species and inhibit proteasomes, leading to cell death."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "37-38" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c024
    section: pathogenesis
    statement: "The PiZ alpha-1-antitrypsin mutant folds abnormally and is retained in the hepatocyte endoplasmic reticulum rather than exported."
    sourceRef: { source: rubin-8e, chapter: "20", pages: "878" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c025
    section: pathogenesis
    statement: "Retained alpha-1-antitrypsin injures hepatocytes and causes cirrhosis; failure to secrete it allows proteolysis of lung connective tissue (emphysema)."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c026
    section: pathogenesis
    statement: "Lipofuscin accumulates when autophagy fails to dispose of lipid-peroxidation products and oxidatively cross-linked proteins."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c027
    section: pathogenesis
    statement: "Alveolar macrophages phagocytose inhaled carbon and carry it to hilar lymph nodes, where it remains indefinitely."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "7" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c028
    section: gross
    statement: "Von Gierke disease presents with marked hepatomegaly."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c029
    section: gross
    statement: "Splenomegaly is practically universal in Gaucher disease."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "280" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c030
    section: gross
    statement: "Clusters of cholesterol-storing macrophages can be grossly visible in subcutaneous tissue as xanthomas."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c031
    section: gross
    statement: "Anthracotic lungs may look striking grossly but the condition is innocuous."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "7" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c032
    section: micro
    statement: "Triglyceride accumulation in hepatocytes appears as cytoplasmic lipid globules."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5-6" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c033
    section: micro
    statement: "In atherosclerosis cholesterol first accumulates in intimal macrophages, later also in smooth muscle cells; macrophages store cholesterol in xanthomas."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c034
    section: micro
    statement: "Poorly controlled diabetes can distend liver cells and renal proximal tubular epithelium with glycogen."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c035
    section: micro
    statement: "Gaucher cells: large macrophages whose fibrillar cytoplasm looks like creased paper, nucleus off-centre."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "280" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c036
    section: micro
    statement: "Sphingomyelin and cholesterol fill the many small, equal-sized vacuoles that make Niemann-Pick macrophages look foamy."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "279" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c037
    section: micro
    statement: "In alpha-1-antitrypsin deficiency hepatocytes contain faintly eosinophilic PAS-positive cytoplasmic droplets within dilated ER cisternae."
    sourceRef: { source: rubin-8e, chapter: "20", pages: "878" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c038
    section: micro
    statement: "Mallory bodies, composed of intermediate filaments, are hepatocellular inclusions in alcoholic liver injury."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "37" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c039
    section: micro
    statement: "Parkinson disease: alpha-synuclein Lewy bodies in substantia nigra neurons; Alzheimer disease: tau neurofibrillary tangles in cortical neurons."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "36-37" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c040
    section: micro
    statement: "Lipofuscin is a golden-brown pigment accumulating mainly in postmitotic or rarely dividing cells such as neurons, cardiac myocytes and hepatocytes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5-6" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c041
    section: micro
    statement: "Hyaline is a descriptive term for homogeneous eosinophilic material on routine stains."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "30" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c042
    section: ancillary
    statement: "PAS after diastase removal of glycogen highlights alpha-1-antitrypsin aggregates in the liver."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "36" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c043
    section: ancillary
    statement: "Gaucher cell cytoplasm stains intensely with PAS."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "280" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c044
    section: ancillary
    statement: "Prussian blue stain highlights iron storage in the liver in hereditary hemochromatosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "6" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c045
    section: ancillary
    statement: "On frozen sections, fat can be shown with a red lipid stain such as Sudan red."
    sourceRef: { source: rubin-8e, chapter: "7", pages: "336" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c046
    section: clinical
    statement: "Stored materials range from innocuous to injurious, and storage diseases range from asymptomatic to fatal."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4-5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c047
    section: clinical
    statement: "Von Gierke disease presents in infancy or early childhood with marked hepatomegaly and hypoglycemia."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c048
    section: clinical
    statement: "Infantile Pompe disease features muscle weakness with death from heart failure in the first year."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c049
    section: clinical
    statement: "Lysosomal storage diseases vary from asymptomatic organomegaly to rapidly fatal brain disease."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c050
    section: clinical
    statement: "Sphingolipidoses such as Tay-Sachs disease show a macular cherry-red spot."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "279" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c051
    section: clinical
    statement: "Alpha-1-antitrypsin deficiency ranges from neonatal cholestatic hepatitis to cirrhosis in childhood or adulthood, and also causes emphysema."
    sourceRef: { source: rubin-8e, chapter: "20", pages: "878" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c052
    section: clinical
    statement: "Hereditary hemochromatosis damages mainly liver, pancreas, heart and testes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "7" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c053
    section: clinical
    statement: "Familial hypercholesterolemia causes xanthomas; cholesterol storage is linked to atherosclerosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c054
    section: diagnosis
    statement: "Stored material is identified by morphology plus special stains, namely PAS with and without diastase, and Prussian blue for iron."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "6, 36" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c055
    section: diagnosis
    statement: "Von Gierke disease is due to glucose-6-phosphatase deficiency; Pompe disease to lysosomal acid alpha-glucosidase deficiency."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c056
    section: diagnosis
    statement: "Pompe disease does not cause hypoglycemia because the defect is lysosomal and cytosolic glycogen metabolism remains intact."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c057
    section: prognosis
    statement: "Simple triglyceride storage is reversible, and the lipid droplets per se have not been shown to impair cell function."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c058
    section: prognosis
    statement: "Iron in hemosiderosis by definition does not injure cells; in hereditary hemochromatosis oxidative stress causes organ damage and increases liver cancer risk."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "7" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c059
    section: prognosis
    statement: "Lysosomal storage diseases are all progressive."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c060
    section: prognosis
    statement: "Cirrhosis in alpha-1-antitrypsin deficiency carries a high incidence of hepatocellular carcinoma."
    sourceRef: { source: rubin-8e, chapter: "20", pages: "878" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c061
    section: prognosis
    statement: "Lipofuscin may increase oxidant stress by impairing proteasomal and lysosomal degradation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5-6" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c062
    section: prognosis
    statement: "Intimal macrophages loaded with cholesterol make up the fatty streak, where atherosclerosis starts; later plaques also have cholesterol outside cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c063
    section: prognosis
    statement: "Misfolded proteins may form insoluble aggregates deposited extracellularly, evolving to amyloid fibrils."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c064
    section: differential
    statement: "Fatty change is reversible accumulation of triglycerides in hepatocytes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c065
    section: differential
    statement: "In hydropic swelling the ER cisternae are dilated by excess fluid."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c066
    section: differential
    statement: "Liver glycogenoses such as von Gierke disease fill hepatocytes with glycogen and cause low blood sugar."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c067
    section: differential
    statement: "Lysosomal storage diseases such as Gaucher and Niemann-Pick disease show macrophages distended by stored lipid, with organomegaly."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "279-280" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: intracellular-accumulations-c068
    section: differential
    statement: "Alpha-1-antitrypsin deficiency shows PAS-positive hepatocyte globules and affects liver and lung."
    sourceRef: { source: rubin-8e, chapter: "20", pages: "878" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c069
    section: differential
    statement: "Pigment accumulations include lipofuscin, melanin, carbon and hemosiderin."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5-7" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c070
    section: differential
    statement: "Aggregated misfolded proteins may be deposited extracellularly."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c071
    section: high-yield
    statement: "Storage arises from overload of normal substances, missing enzymes, abnormal proteins, or indigestible materials."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4-5, 36-37" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c072
    section: high-yield
    statement: "Fat storage is reversible."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "5" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: intracellular-accumulations-c073
    section: high-yield
    statement: "Von Gierke (glucose-6-phosphatase) causes hepatomegaly and hypoglycemia; Pompe (acid alpha-glucosidase) causes myopathy and heart failure without hypoglycemia."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "274" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
