entity: gallbladder-carcinoma
claims:
  - { claimId: gallbladder-carcinoma-c001, section: definition, statement: "The leading malignancy of the gallbladder is adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c002, section: definition, statement: "Of the gallbladders removed at cholecystectomy, roughly 2% contain an unsuspected adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c003, section: definition, statement: "Gallbladder adenocarcinoma is more frequent in groups with a high rate of gallstones, such as Native Americans, and in women.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c004, section: definition, statement: "Nearly all cancers of the extrahepatic bile ducts are adenocarcinomas.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c005, section: definition, statement: "Men and women are affected comparably by extrahepatic bile duct cancer, which is less common than gallbladder cancer.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c006, section: etiology, statement: "Gallstones and chronic cholecystitis are usually present together with gallbladder carcinoma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c007, section: etiology, statement: "Gallbladder cancer develops with special frequency in a calcified (porcelain) gallbladder.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c008, section: etiology, statement: "Many patients with extrahepatic bile duct cancer also have gallstones.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c009, section: etiology, statement: "Inflammatory diseases of the colon are associated with extrahepatic bile duct cancer.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c010, section: etiology, statement: "Choledochal cysts and Caroli disease are settings where bile duct cancer can arise.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c011, section: etiology, statement: "In Asia, infestation of the bile ducts by the fluke C. sinensis is associated with bile duct carcinoma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c012, section: pathogenesis, statement: "Gallbladder cancer spreads by lymph vessels and by direct growth into nearby tissues, among them the liver and peritoneum.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c013, section: gross, statement: "The fundus is the most frequent site of gallbladder carcinoma, although any part of the gallbladder can be involved.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c014, section: gross, statement: "Most of these tumors induce desmoplasia, so the organ wall ends up thick and leathery.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c015, section: gross, statement: "Some gallbladder carcinomas also grow as a mass bulging into the lumen.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c016, section: gross, statement: "Bile duct cancer can arise anywhere along the duct; the hilar form lies at the confluence of the right and left hepatic ducts.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c017, section: gross, statement: "Some duct carcinomas form an intraluminal mass, while others spread diffusely through the wall.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c018, section: micro, statement: "Most often gallbladder carcinoma is a well-differentiated adenocarcinoma that infiltrates the wall.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c019, section: micro, statement: "Rarer variants of gallbladder carcinoma, such as adenosquamous and anaplastic types, have been described.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c020, section: clinical, statement: "Gallstone disease and gallbladder carcinoma give a similar set of symptoms.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898-899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c021, section: clinical, statement: "Cancers of the bile duct and of the ampulla present clinically as obstructive jaundice.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c022, section: clinical, statement: "In extrahepatic bile duct cancer, symptoms appear at an early stage.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c023, section: diagnosis, statement: "For practical purposes, cure is limited to cancers found by chance when the gallbladder is removed.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c024, section: prognosis, statement: "Almost every gallbladder tumor that has become symptomatic can no longer be cured.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898-899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c025, section: prognosis, statement: "Five-year survival of symptomatic gallbladder carcinoma is less than 3%.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c026, section: prognosis, statement: "The prognosis of extrahepatic bile duct carcinoma is poor.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c027, section: prognosis, statement: "Gallbladder carcinoma has a somewhat worse outcome than bile duct carcinoma.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c028, section: differential, statement: "In chronic cholecystitis the Rokitansky-Aschoff sinuses can penetrate to the muscle layer, within a fibrous, thick wall.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c029, section: differential, statement: "Extrahepatic bile duct carcinoma is a duct tumor that presents with obstructive jaundice.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c030, section: differential, statement: "Papilloma is the benign gallbladder tumor seen most often.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c031, section: differential, statement: "A benign tumor in a bile duct can cause jaundice by obstructing the flow of bile.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c032, section: high-yield, statement: "Gallbladder carcinoma is typically a well-differentiated adenocarcinoma that infiltrates the wall.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c033, section: high-yield, statement: "Gallstones and chronic cholecystitis accompany the cancer, which arises especially often in a porcelain gallbladder.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c034, section: high-yield, statement: "The fundus is the favored site, and the wall turns thick and leathery.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c035, section: high-yield, statement: "Gallbladder carcinoma symptoms resemble gallstone disease, and symptomatic tumors have a 5-year survival below 3%.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898-899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c036, section: high-yield, statement: "Cure is realistic almost only for a tumor found incidentally in the gallbladder after removal.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c037, section: high-yield, statement: "Bile duct and ampulla of Vater cancers announce themselves with obstructive jaundice.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c038, section: traps, statement: "Gallbladder carcinoma gives the picture of gallstone disease, and almost all such tumors are already incurable once symptoms appear.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898-899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c039, section: traps, statement: "Gallbladder cancer develops especially often in a calcified (porcelain) gallbladder.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c040, section: traps, statement: "Bile duct carcinoma gives symptoms earlier than gallbladder carcinoma, which makes its poor prognosis somewhat better.", sourceRef: { source: rubin-8e, chapter: "20", pages: "899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: gallbladder-carcinoma-c041, section: mnemonics, statement: "Gallbladder carcinoma: gallstones, porcelain gallbladder, leathery wall, adenocarcinoma, late symptomatic and incurable presentation.", sourceRef: { source: rubin-8e, chapter: "20", pages: "898-899" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
