entity: prostatic-adenocarcinoma
claims:
- { claimId: prostatic-adenocarcinoma-c001, section: definition, statement: "Of the cancers that arise in the prostate, the one that starts in the acini is the commonest, and it is called prostatic adenocarcinoma here.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1008" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c002, section: definition, statement: "The disease is mostly one of elderly men.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1008" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c003, section: definition, statement: "Many prostate cancers are latent and can stay clinically silent for the patient's whole life.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c004, section: definition, statement: "Since many tumors are latent, it is still controversial whether blood PSA testing is worth using for screening.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c005, section: etiology, statement: "The likelihood of prostate cancer increases with advancing age.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1008-1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c006, section: etiology, statement: "Japan, Greece and Mexico have the lowest prostate cancer death rates, and the Scandinavian countries and the United States the highest.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c007, section: etiology, statement: "No population in the world has a higher prostate cancer death rate than African American men.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c008, section: etiology, statement: "A man with a first-degree relative who has prostate cancer carries a markedly higher risk.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c009, section: etiology, statement: "The mechanism by which diet might act has not been defined; red meat and animal fat are the dietary factors suspected of raising risk.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c010, section: etiology, statement: "BRCA1 and BRCA2 mutations have been implicated in the risk of prostate cancer in men.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c011, section: pathogenesis, statement: "Male hormones are implicated because the cancer responds to castration and normal prostate growth depends on androgens.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c012, section: pathogenesis, statement: "Circulating androgen levels are typically not raised in patients with prostate cancer.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c013, section: pathogenesis, statement: "Some tumors carry acquired (somatic) mutations that put the ETV1 gene under androgen control through the TMPRSS2 promoter.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c014, section: pathogenesis, statement: "Other tumors show hypermethylation of the glutathione S-transferase gene, which encodes an antioxidant enzyme.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c016, section: pathogenesis, statement: "Prostatic intraepithelial neoplasia is now regarded as a precursor of prostatic adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c017, section: pathogenesis, statement: "In PIN the basal cells are reduced in number, while the luminal cells lining the prostatic ducts are cytologically atypical.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c018, section: pathogenesis, statement: "High-grade PIN is marked by markedly crowded nuclei that are enlarged and show nucleoli.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c019, section: pathogenesis, statement: "High-grade PIN and invasive cancer have a mainly peripheral distribution in the prostate.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c020, section: pathogenesis, statement: "Invasive carcinoma is frequently found on re-biopsy of patients whose first biopsy showed high-grade PIN.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c021, section: gross, statement: "Prostatic adenocarcinomas are commonly multicentric.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c022, section: gross, statement: "In over 70% of cases the tumor sits in the peripheral zones.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c023, section: gross, statement: "On section a cancerous prostate can show blurred, uneven yellowish-white patches.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c024, section: gross, statement: "In most cases nothing distinctive is visible macroscopically, which makes the tumor hard to detect on gross examination.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c025, section: micro, statement: "The usual tumor is acinar: its small to medium glands invade the stroma and have indistinct margins.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c026, section: micro, statement: "Malignant prostatic glands have no basal cells, which normal prostatic glands contain.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c027, section: micro, statement: "Malignant prostatic glands no longer grow in a lobular pattern.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c028, section: micro, statement: "In a well-differentiated tumor each gland has a single cell layer, and the glands are alike and of small to medium size.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009-1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c029, section: micro, statement: "Poorly differentiated tumors show solid cords of invading cells with few or no glands.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c030, section: micro, statement: "Papillary and cribriform patterns appear as differentiation is lost.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c031, section: micro, statement: "The nuclear feature seen most frequently is a conspicuous nucleolus, one or two per nucleus.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c032, section: micro, statement: "Tumor cells whose cytoplasm is highly vacuolated can resemble the clear cells of renal cell carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c033, section: micro, statement: "Gleason grading is based on how tumor glands form and infiltrate, sorted into five histologic patterns.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c034, section: micro, statement: "Gleason patterns 1 and 2 are seldom used because the tumors behind them are nearly indistinguishable from benign glands.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c035, section: micro, statement: "Pattern 3, the most often diagnosed, is made of small, separate, invasive malignant glands.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c036, section: micro, statement: "Pattern 4 consists of disordered gland architecture, namely fused, cribriform or glomeruloid glands.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c037, section: micro, statement: "Pattern 5, the highest grade, is assigned for glandless growth in sheets, cords or single cells, and also when comedo necrosis is present.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c038, section: micro, statement: "The Gleason score adds together the predominant pattern and the next most prominent pattern.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c039, section: micro, statement: "Grade groups 1 to 5 were devised to reflect the risk that goes with the Gleason score.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c040, section: micro, statement: "A Gleason score of 6 or less is grade group 1, the lowest risk.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c041, section: micro, statement: "Grade group 2 corresponds to a Gleason score that adds 3 and 4 to reach 7.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c042, section: micro, statement: "Grade group 3 corresponds to a Gleason score that adds 4 and 3 to reach 7.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c043, section: micro, statement: "Gleason score 8 is grade group 4.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c044, section: micro, statement: "Gleason score 9 or 10 is grade group 5.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c045, section: ancillary, statement: "A raised serum PSA typically leads to further evaluation by needle biopsy.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c046, section: ancillary, statement: "On routine histology the stroma is infiltrated by small glands with poorly defined borders.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c047, section: ancillary, statement: "Malignant glands have no basal cells, so they are negative for high-molecular-weight cytokeratin and p63, which are positive in benign glands.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c048, section: ancillary, statement: "AMACR is not expressed by benign glands but is expressed by high-grade PIN and prostatic adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c049, section: ancillary, statement: "Basal-cell markers and AMACR are particularly useful for diagnosing cancer in challenging biopsies.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c050, section: ancillary, statement: "A positive PSA immunostain in a metastatic tumor is useful in showing that the primary site is the prostate.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c051, section: clinical, statement: "Most prostate cancers cause no symptoms, and PSA screening is the commonest way they are detected.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c052, section: clinical, statement: "A minority of patients come to attention with bladder outlet obstruction or symptoms of metastases.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c053, section: clinical, statement: "The prostate produces PSA, a glycoprotein and serine protease whose role is to liquefy semen.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c054, section: clinical, statement: "Neoplasia, hypertrophy and inflammation of the prostate all raise serum PSA.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c055, section: clinical, statement: "Preoperative PSA levels correlate with cancer volume.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c056, section: clinical, statement: "Present screening programs pair a digital rectal examination with a serum PSA measurement.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c057, section: clinical, statement: "Treatment brings side effects such as incontinence and impotence, and wider screening means more treatment, so screening guidelines are in flux.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011-1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c058, section: diagnosis, statement: "Recurrent disease after therapy is signaled by a serum PSA that keeps rising.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c059, section: diagnosis, statement: "In osteoblastic bone metastases the osteoblasts that are building new bone secrete alkaline phosphatase, so the serum level rises.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c060, section: diagnosis, statement: "Prostate cancer is clinically staged with the TNM system.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c061, section: diagnosis, statement: "T1 is a tumor that is not clinically detectable.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c062, section: diagnosis, statement: "T2 is a tumor confined to the prostate.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c063, section: diagnosis, statement: "T3 is a tumor extending through the capsule, and T3b is extension into the seminal vesicles.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c064, section: diagnosis, statement: "T4 is a tumor invading adjacent structures other than the seminal vesicles.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c065, section: diagnosis, statement: "N1 means regional lymph node metastases are present.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c066, section: diagnosis, statement: "M1 means distant metastases are present.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c067, section: diagnosis, statement: "Of patients initially staged T2, 60% turn out on microscopy to have capsular penetration or seminal vesicle invasion and so belong to stage T3.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c068, section: prognosis, statement: "The tumor originates just under the capsule, which is why capsular invasion is frequent.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c069, section: prognosis, statement: "Perineural invasion within the prostate and adjacent tissues is commonly seen.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c070, section: prognosis, statement: "The seminal vesicles are involved by direct extension in almost every case.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c072, section: prognosis, statement: "Metastases first show up in the obturator lymph nodes, then in the iliac and periaortic nodes.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c073, section: prognosis, statement: "Lymph nodes are the most frequent metastatic site, then bone, then lung, then liver.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c074, section: prognosis, statement: "Osteoblastic bone metastases occur particularly in the pelvic bones, ribs and vertebral column.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011-1012" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c076, section: prognosis, statement: "The commonest cause of death is widespread dissemination (carcinomatosis) complicated by pneumonia or sepsis.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c077, section: prognosis, statement: "Prognosis worsens as the stage, the grade group and the Gleason score go up.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c078, section: prognosis, statement: "Five-year survival by stage is 10% for T4, 40% for T3 and 90% for T1 and T2.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c081, section: differential, statement: "In nodular hyperplasia the acini have two cell layers, because flattened basal cells lie between the acinar cells and the stroma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1008" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c082, section: differential, statement: "Benign glands stain for basal-cell markers and are negative for AMACR, while cancer glands lack basal markers and are AMACR positive.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1011" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c083, section: differential, statement: "In PIN the ducts show depleted basal cells and atypical luminal cells.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c084, section: differential, statement: "A finding of high-grade PIN on needle biopsy is a warning, since a repeat biopsy often shows invasive carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c085, section: differential, statement: "When prostate cancer cytoplasm is heavily vacuolated, the cells imitate the clear cells of renal cell carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c086, section: differential, statement: "PSA immunohistochemistry in a tumor helps establish the prostate as the primary site.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1013" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c087, section: high-yield, statement: "Prostatic adenocarcinomas are mostly located in the peripheral zones.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c088, section: high-yield, statement: "High-grade PIN is a precursor lesion with atypical luminal cells and a reduced basal cell layer.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c089, section: high-yield, statement: "Invasive prostatic adenocarcinoma consists of small to medium glands that lack basal cells.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1009" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c090, section: high-yield, statement: "Prostatic adenocarcinoma expresses AMACR.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
- { claimId: prostatic-adenocarcinoma-c091, section: high-yield, statement: "The Gleason score is the sum of the two most prominent patterns.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1010" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
