entity: hypoxic-ischemic-injury
claims:
  - claimId: hypoxic-ischemic-injury-c001
    section: definition
    statement: "Ischemia means reduced or absent blood flow, leaving cells short of the oxygen they need."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4, 42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c002
    section: definition
    statement: "When blood flow stops, wastes such as CO2 are not cleared and cells are deprived of glucose and other fuels besides oxygen."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c003
    section: definition
    statement: "Short ischemia causes damage that cells can recover from; long ischemia causes irreversible injury and death, forming a single spectrum."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4, 42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c004
    section: definition
    statement: "Ischemic necrosis is the most clinically relevant necrosis because it causes both myocardial infarction and stroke, the leading causes of death in Western countries."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c005
    section: etiology
    statement: "Ischemia most often results from blocked arterial inflow, such as coronary occlusion."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42-43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c071
    section: etiology
    statement: "Venous as well as arterial occlusion can cause infarction, producing a red (hemorrhagic) infarct."
    sourceRef: { source: rubin-8e, chapter: "7", pages: "337" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c072
    section: etiology
    statement: "Without a fixed occlusion, myocardial ischemia can come from a long-lasting shortfall of flow against oxygen demand, for example when blood pressure drops or a coronary artery goes into spasm."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c074
    section: etiology
    statement: "Oxygen delivery can fall without any reduction in flow: anemia lowers myocardial oxygen delivery, and in CO poisoning carbon monoxide displaces oxygen from hemoglobin."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c006
    section: etiology
    statement: "Cardiac myocytes and neurons have high energy use and small energy stores, so loss of oxygen and fuel is especially harmful to them."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c007
    section: etiology
    statement: "Longer ischemia leads to irreversible injury, whereas short periods may be survived."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "4, 44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c008
    section: pathogenesis
    statement: "Extracellular Na+ and Ca2+ greatly exceed intracellular levels, while K+ is higher inside the cell."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c009
    section: pathogenesis
    statement: "Ion gradients last only while ATP is abundant and the plasma membrane stays whole."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c075
    section: pathogenesis
    statement: "Loss of ATP is the first blow that ischemia deals to the cell."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c010
    section: pathogenesis
    statement: "Steps of ischemic myocyte death may be simultaneous or sequential."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c011
    section: pathogenesis
    statement: "Reduced oxygen blocks ATP production and mitochondrial oxidation of pyruvate."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c012
    section: pathogenesis
    statement: "Pyruvate is converted to lactate by anaerobic glycolysis, and lactate accumulation acidifies the cytosol."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c013
    section: pathogenesis
    statement: "Ischemia causes loss of glycogen stores."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c014
    section: pathogenesis
    statement: "ATP shortage impairs the Na+/K+ exchanger and Na+ accumulates."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c015
    section: pathogenesis
    statement: "Acidosis activates the normally quiescent Na+/H+ exchanger, exporting H+ in exchange for Na+ and raising intracellular sodium."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c016
    section: pathogenesis
    statement: "Retained Na+ obliges water to enter to keep isosmotic conditions, so the cell swells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c017
    section: pathogenesis
    statement: "Increased intracellular Na+ activates the Na+/Ca2+ exchanger, and the ATP-dependent calcium pump cannot clear the extra Ca2+."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c018
    section: pathogenesis
    statement: "Cytosolic Ca2+ is about 10^-7 M versus millimolar (10^-3 M) extracellular levels, creating a large gradient."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c019
    section: pathogenesis
    statement: "Raised Ca2+ activates PLA2, degrading membrane phospholipids and releasing free fatty acids and lysophospholipids."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c020
    section: pathogenesis
    statement: "Lysophospholipids solubilize membranes like detergents and impair ion channels and pumps."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c021
    section: pathogenesis
    statement: "Calcium-activated proteases disrupt cytoskeleton-membrane attachments, producing membrane blebs."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c022
    section: pathogenesis
    statement: "During ischemia mitochondria generate more ROS because detoxification is damaged and the ETC is impaired."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c023
    section: pathogenesis
    statement: "Cardiolipin is rich in unsaturated fatty acids, occurs only in mitochondria and is easily peroxidized by ROS, which impairs the electron transport chain and lowers ATP output."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c024
    section: pathogenesis
    statement: "Further ATP loss and possible apoptosis follow when ischemia holds the MPTP open and cytochrome c is lost from the electron transport chain."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c025
    section: pathogenesis
    statement: "A cell dies when it can no longer keep its metabolism going."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c026
    section: pathogenesis
    statement: "The exact moment when injury stops being reversible cannot be identified."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3, 43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c027
    section: pathogenesis
    statement: "With prolonged ischemia, membrane injury pushes the cell past the point of no return so that reflow cannot save it."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c028
    section: pathogenesis
    statement: "When the plasma membrane gives way, calcium floods into the cell down its steep gradient, and this flood is a decisive step in ischemic cell death."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c029
    section: gross
    statement: "Interruption of blood flow may result in infarction."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c030
    section: gross
    statement: "Myocardial infarcts from persistent occlusion are pale and grossly apparent only after about 12 hours; reperfused infarcts are hemorrhagic."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c031
    section: micro
    statement: "In hydropic swelling the cell enlarges, cytoplasm is pale and the nucleus stays normally situated."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c032
    section: micro
    statement: "Reversible injury shows distended ER cisternae and polysomes detached from rough ER."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3-4" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c033
    section: micro
    statement: "Mitochondrial swelling with a paler matrix is a typical ischemic change and reverses if the cell recovers."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3-4" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c034
    section: micro
    statement: "Plasma membrane blebs can detach without impairing viability."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c035
    section: micro
    statement: "Reversible nuclear injury shows segregation of fibrillar and granular nucleolar components."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c036
    section: micro
    statement: "Necrotic cytoplasm is more eosinophilic due to rapid degradation of hematoxylin-binding cytoplasmic RNA."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38-39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c037
    section: micro
    statement: "Nuclear changes of necrosis are pyknosis, karyorrhexis and karyolysis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c038
    section: micro
    statement: "Dead cells show swollen and calcified mitochondria and plasma membrane discontinuities."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c039
    section: micro
    statement: "The cell outline is maintained shortly after death, before enzymatic lysis disintegrates the cell."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38-39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c040
    section: micro
    statement: "Massive calcium entry, most marked on reperfusion, makes sarcomeres hypercontract and produces contraction band necrosis, seen as dense eosinophilic cross-bands in the myocytes."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659-660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c076
    section: micro
    statement: "Red neurons, with eosinophilic cytoplasm and a pyknotic nucleus, mark a cerebral infarct in a patient who survived about 6-24 hours; if survival lasted only minutes to a few hours, the tissue still looks normal."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c077
    section: ancillary
    statement: "An early myocardial infarct is not visible grossly; at autopsy, TTC staining of heart slices detects the loss of dehydrogenase activity in infarcted muscle and aids gross diagnosis, but it misses some acute infarcts that histology confirms."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
    status: beyond-reference
    secondSource: { source: adegboyega-1997, locator: "abstract (TTC versus histology in 638 consecutive adult autopsy hearts)" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c078
    section: ancillary
    statement: "Viable myocardium stains red with TTC and the staining fades as the postmortem interval lengthens; in one forensic autopsy series the method was useful within about 1.5 days of death, and the infarct was very hard to detect when death followed the onset by under about 9 hours."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
    status: beyond-reference
    secondSource: { source: kakimoto-2013, locator: "abstract" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c079
    section: ancillary
    statement: "Wavy fibers are an early H&E sign: the living muscle around an infarct keeps contracting and pulls on ischemic myocytes that can no longer contract, until they are stretched into a wavy course."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c080
    section: ancillary
    statement: "Infarcted myocardium is eosinophilic on H&E from about 12-18 hours, but complete loss of the myocyte nuclei takes several days."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657-658" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c081
    section: ancillary
    statement: "Only electron microscopy shows the earliest ischemic changes, described mainly in animal models; for about 20-30 minutes of complete ischemia the injury stays reversible, with mild mitochondrial swelling and sarcoplasmic edema."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c082
    section: ancillary
    statement: "Lethal myocyte injury, reached after about 30-60 minutes, is marked by amorphous matrix densities in greatly swollen mitochondria."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657-658" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c083
    section: ancillary
    statement: "A trichrome stain colors collagen blue-green, which makes the scar of a healed infarct stand out."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c041
    section: clinical
    statement: "Repetitive angina can occur without infarction; ischemia can result in myocardial infarction."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42, 44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c042
    section: clinical
    statement: "Cerebral artery occlusion causes coagulative necrosis followed by rapid liquefaction that can leave a persistent cavity or cyst."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c043
    section: clinical
    statement: "Nearby viable cells can be injured both by the inflammation that necrosis elicits and by enzymes and mediators released from the dead cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38, 42" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c044
    section: diagnosis
    statement: "A rise in serum cardiac troponin (I or T) or MB-CK, released from dead myocytes, indicates myocardial necrosis."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c045
    section: diagnosis
    statement: "Cardiac troponin (I or T) is the biomarker most often measured, and a rise points very specifically to heart muscle."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c073
    section: diagnosis
    statement: "A rise and/or fall of troponin timed with a compatible clinical event is required before myocardial infarction can be diagnosed."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c046
    section: prognosis
    statement: "The degree of cell injury depends on the duration of ischemia."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c047
    section: prognosis
    statement: "Myocardium whose flow comes back within 30 minutes can repair the damage and work normally again."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c048
    section: prognosis
    statement: "After short ischemia, reperfusion completely restores structure and function."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c049
    section: prognosis
    statement: "After intermediate ischemia, cells die when flow returns; this reperfusion death may make up as much as half of a heart's final infarct."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43-44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c050
    section: prognosis
    statement: "Lethal injury can develop during ischemia itself, requiring a longer ischemic period, independent of reperfusion."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c084
    section: prognosis
    statement: "Atrophy, not necrosis, is the usual outcome of the chronic ischemia that a stenosis causes; in the heart it comes with interstitial fibrosis."
    sourceRef: { source: rubin-8e, chapter: "7", pages: "337" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c051
    section: prognosis
    statement: "Repeated transient sublethal ischemia (e.g. repetitive angina) induces ischemic preconditioning, limiting necrosis after later prolonged ischemia."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c052
    section: prognosis
    statement: "Better survival of a later ischemic episode is one effect of HIF-1alpha in preconditioning: the genes it induces help keep ATP and limit calcium build-up."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: hypoxic-ischemic-injury-c053
    section: differential
    statement: "Hydropic swelling is reversible injury with a normally situated nucleus."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "3" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c054
    section: differential
    statement: "Coagulative necrosis shows eosinophilic cytoplasm and pyknosis, karyorrhexis or karyolysis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38-39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c055
    section: differential
    statement: "Apoptosis affects single cells among viable cells, with nuclear condensation inside an intact membrane and no inflammatory reaction."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "41" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: hypoxic-ischemic-injury-c056
    section: differential
    statement: "Reperfusion adds injury through extra ROS from returning oxygen and exacerbated Ca2+ overload."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43-44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
