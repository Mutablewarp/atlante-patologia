entity: necroptosis
claims:
  - claimId: necroptosis-c001
    section: definition
    statement: "Necroptosis is one form of regulated necrosis: a signaled, self-inflicted cell death whose appearance matches necrosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c002
    section: definition
    statement: "Necroptosis looks like necrosis yet relies partly on signaling pathways that apoptosis also uses."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c003
    section: definition
    statement: "Necroptosis proceeds through caspase-independent pathways."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c004
    section: definition
    statement: "Apoptosis, autophagy and necroptosis are presented as the major programmed cell death pathways, with the killing role of autophagy left open."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "46, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c005
    section: definition
    statement: "Necroptosis also works physiologically: in adults, for instance deep in the intestinal crypts, and during development, chiefly at the bone growth plate."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c006
    section: etiology
    statement: "The commonest start of necroptosis is a ligand such as TNF-alpha or Fas ligand binding a TNF-superfamily receptor like TNFR1."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c007
    section: etiology
    statement: "Toll-like receptors and interferon receptors are further triggers of necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c008
    section: etiology
    statement: "Even when the virus produces caspase inhibitors, as viruses commonly do, an infected cell can still commit suicide without caspases."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c009
    section: etiology
    statement: "Necroptosis acts as a backup death route when the apoptotic program cannot run, which is relevant to tumor cells that have disabled apoptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c010
    section: etiology
    statement: "Tumor-cell migration across the endothelium is eased when platelet TGF-beta pushes endothelial cells into necroptosis."
    sourceRef: { source: rubin-8e, chapter: "5", pages: "199" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c011
    section: pathogenesis
    statement: "Engagement of TNFR1 recruits the adaptor TRADD."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c012
    section: pathogenesis
    statement: "The necrosome is a filament-like complex made of RIP1 and RIP3, which TRADD recruits."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c013
    section: pathogenesis
    statement: "Phosphorylated RIP3 is the branch point of several routes that lead to necroptotic death."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "55" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c014
    section: pathogenesis
    statement: "Activated by the necrosome, MLKL breaches the plasma membrane and organelle membranes after inserting into them."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c015
    section: pathogenesis
    statement: "Partly via CaMKII, RIP3 raises the cytosolic calcium level, and the extra calcium turns on calcium-dependent enzymes such as calpains that degrade cell components."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-55" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c016
    section: pathogenesis
    statement: "Under the action of these enzymes lysosomal membranes become leaky, and the hydrolases that escape to the cytosol break down macromolecules."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-55" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c017
    section: pathogenesis
    statement: "Mitochondria injured by calpain release iron and generate less ATP."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c018
    section: pathogenesis
    statement: "Free iron drives Fenton and Haber-Weiss chemistry, and the resulting reactive oxygen species damage cellular macromolecules, including DNA."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-55" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c019
    section: pathogenesis
    statement: "DNA breakdown in the nucleus, and with it pyknosis, is started by AIF, which leaves damaged mitochondria and moves into the nucleus."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-55" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c020
    section: pathogenesis
    statement: "The final picture is an energy failure with necrotic features, and the dying cells set free DAMPs, which trigger inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-55" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c021
    section: pathogenesis
    statement: "By cutting RIP1, caspase-8, an initiator caspase of extrinsic apoptosis, blocks assembly of the necrosome."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "47, 54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c022
    section: pathogenesis
    statement: "Several finely tuned controls decide whether a cell enters apoptosis or necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c023
    section: pathogenesis
    statement: "Survival is another possible outcome of TNF receptor signaling, because NF-kappaB, which TNF-alpha can activate through the receptor, drives expression of antiapoptotic proteins."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "47, 52-53" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c024
    section: micro
    statement: "Under the light microscope necroptosis cannot be told from necrosis: the nucleus is pyknotic, the cell swollen and the plasma membrane breaking up."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c025
    section: micro
    statement: "Inflammation develops after this necrotic-type death."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c026
    section: micro
    statement: "Apoptosis differs: there is no inflammation, the nucleus fragments and the cell surface blebs."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c050
    section: ancillary
    statement: "On routine H&E necroptotic cells look the same as necrotic cells, so H&E can show a necrotic type of death but cannot establish that it was necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c051
    section: ancillary
    statement: "The NCCD 2018 recommendations define regulated cell death subroutines by molecular mechanism rather than morphology; necroptosis is the subroutine that depends on RIP3 (RIPK3) and MLKL."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "46, 54" }
    status: beyond-reference
    secondSource: { source: galluzzi-2018, locator: "Introduction (aims of the NCCD) and section Necroptosis" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c052
    section: ancillary
    statement: "MLKL is activated when RIP3 phosphorylates it, and the phosphorylated form labels cells committed to necroptosis; in humans it has been demonstrated in drug-induced liver injury, where liver biopsies stained with a monoclonal antibody specific for phosphorylated MLKL are positive."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: beyond-reference
    secondSource: { source: wang-2014, locator: "abstract" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c053
    section: ancillary
    statement: "Compared with knockout controls, some popular antibodies against RIP1 (RIPK1), RIP3 (RIPK3), MLKL or their phosphorylated forms proved unsuitable for immunofluorescence."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: beyond-reference
    secondSource: { source: samson-2021, locator: "abstract" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c054
    section: ancillary
    statement: "In experiments, the RIP1 (RIPK1) inhibitor necrostatin-1 blocks necroptosis started through TNFR1, and genetic loss of MLKL or its inhibition by necrosulfonamide also prevents necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: beyond-reference
    secondSource: { source: galluzzi-2018, locator: "section Necroptosis" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c027
    section: clinical
    statement: "When infected cells kill themselves without caspases, viruses cannot spread freely, which makes this an effective host defense."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c028
    section: clinical
    statement: "Crohn disease and pancreatitis are inflammatory disorders in which necroptosis takes place."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c029
    section: clinical
    statement: "Necroptosis takes place in post-infarction inflammation of the heart."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c030
    section: clinical
    statement: "Tumor cells that have lost apoptosis can still be eliminated through caspase-independent necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c031
    section: prognosis
    statement: "Besides killing the cell, necroptosis causes inflammation, set off by DAMPs from the dead cells; as with necrosis generally, the inflammation can injure surviving neighbors."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42, 54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c032
    section: differential
    statement: "Apoptosis depends on caspases and causes no inflammation; the blebbing cell splits into apoptotic bodies."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "46-47, 54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c033
    section: differential
    statement: "Classical necrosis is unprogrammed death from external injury, typically ischemia/reperfusion, with the same morphology as necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c034
    section: differential
    statement: "Pyroptosis is inflammatory cell death driven by caspase-1 produced by the inflammasome after intracellular NOD-like receptors bind pathogen molecules."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c035
    section: differential
    statement: "Autophagy is mainly a survival response to stress based on lysosomal self-digestion; an independent killing role is not established."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c036
    section: high-yield
    statement: "Necroptosis is programmed necrosis: signaled death with necrotic morphology followed by inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c037
    section: high-yield
    statement: "Necroptosis is triggered by TNFR1 and other death receptors and by Toll-like receptors; in viral infection, viral caspase inhibitors unmask it."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c038
    section: high-yield
    statement: "In TNFR1 signaling, TRADD recruits RIP1 and RIP3 to form the necrosome, which activates MLKL to damage membranes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c039
    section: high-yield
    statement: "Downstream effects are calcium/CaMKII-driven calpain activation, lysosome rupture, iron-driven ROS, AIF-mediated DNA degradation and bioenergetic crisis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-55" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c040
    section: high-yield
    statement: "Caspase-8 cleaves RIP1 and blocks necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c041
    section: high-yield
    statement: "Necroptosis is implicated in Crohn disease, pancreatitis, post-infarction inflammation, viral infection and cancer."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c042
    section: high-yield
    statement: "Physiologic necroptosis occurs at the bone growth plate and in deep intestinal crypts."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c055
    section: high-yield
    statement: "H&E shows only a necrotic type of death; necroptosis itself is revealed by pathway markers such as phosphorylated MLKL."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: beyond-reference
    secondSource: { source: wang-2014, locator: "abstract" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c043
    section: traps
    statement: "Necroptosis is programmed but caspase-independent and inflammatory, unlike apoptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c044
    section: traps
    statement: "Necroptosis and accidental necrosis look the same morphologically; they differ in mechanism."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c045
    section: traps
    statement: "Pyroptosis, a relative of necroptosis, depends instead on caspase-1 in the inflammasome."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 56" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: necroptosis-c046
    section: traps
    statement: "Necroptosis also occurs physiologically at the growth plate and in intestinal crypts."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c047
    section: traps
    statement: "Caspase-8 inhibits necroptosis, so cells with blocked caspases (e.g., from viral inhibitors) can still die by necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 47, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c048
    section: mnemonics
    statement: "Original mnemonic: RIP1 and RIP3 build the necrosome and MLKL damages the membrane."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: necroptosis-c049
    section: mnemonics
    statement: "Original mnemonic: caspase-8 cleaves RIP1 favoring apoptosis; when caspases are inhibited, necroptosis proceeds."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
