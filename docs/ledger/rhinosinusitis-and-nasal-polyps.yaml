entity: rhinosinusitis-and-nasal-polyps
claims:
  - { claimId: rhinosinusitis-and-nasal-polyps-c001, section: definition, statement: "Rhinitis means inflammation of the mucous membranes lining the nasal cavity and sinuses.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1308" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c002, section: definition, statement: "Most sinusitis, an inflammation of the sinus mucosa, comes from bacterial infection of the paranasal sinuses.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c003, section: definition, statement: "Inflammatory polyps of the nose and sinuses are nonneoplastic swellings.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c004, section: etiology, statement: "Of the causes of acute rhinitis, viral infection is the most frequent, with the common cold as the typical example.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1308-1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c005, section: etiology, statement: "A person who becomes sensitized to one of the allergens in the environment can develop allergic rhinitis, which is seasonal or perennial.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c006, section: etiology, statement: "People with repeated attacks of acute rhinitis can go on to chronic rhinitis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c007, section: etiology, statement: "A sinus whose drainage or ventilation is obstructed becomes prone to infection.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c008, section: etiology, statement: "Acute sinusitis is defined as lasting under three weeks.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c009, section: etiology, statement: "Acute sinusitis mostly begins with infection extending from the nasal mucosa.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c010, section: etiology, statement: "Haemophilus influenzae and Branhamella catarrhalis are the commonest organisms in acute sinusitis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c011, section: etiology, statement: "An infection at the roots of the first or second molar can spread into the maxillary sinus through a thin bony plate.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c012, section: etiology, statement: "Recurrent acute sinusitis, or an infection that does not resolve completely, can lead to chronic sinusitis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c013, section: etiology, statement: "Anaerobic bacteria are almost always found in the purulent exudate of chronic sinusitis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c014, section: etiology, statement: "Allergy and cystic fibrosis are among the many causes of inflammatory polyps.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c015, section: etiology, statement: "Fungal disease of the nose and sinuses mostly strikes opportunistically, when immunity is low.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c016, section: etiology, statement: "The patients usually hit by invasive fungal sinusitis are the immunocompromised.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c017, section: etiology, statement: "Diabetic and immunosuppressed patients carry the highest risk from mucormycosis, which can threaten life.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c018, section: pathogenesis, statement: "In viral rhinitis, degenerating epithelial cells are shed after the virus has replicated in them.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c019, section: pathogenesis, statement: "Neutrophils and mononuclear cells infiltrate the mucosa, which becomes edematous and engorged.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c020, section: pathogenesis, statement: "Rhinorrhea, the thin watery nasal discharge, results from vessels that leak more and from heavy mucus production.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c021, section: pathogenesis, statement: "Bacteria of the upper airway can superinfect a few days into viral rhinitis, making the discharge mucopurulent.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c022, section: pathogenesis, statement: "Epithelial regrowth is fast after inflammation ends.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c023, section: pathogenesis, statement: "Mast cells in the nasal mucosa have specific receptors that hold IgE, which plasma cells of that mucosa produce.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c024, section: pathogenesis, statement: "Mast cells empty their mediator granules when their bound IgE meets an inhaled allergen such as pollen.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c025, section: pathogenesis, statement: "Histamine acts at once, whereas slower-acting mediators such as the newly synthesized leukotrienes sustain the inflammatory reaction.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c026, section: pathogenesis, statement: "The H1 receptor, through which histamine acts, mediates many of the symptoms.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c027, section: pathogenesis, statement: "Mucus and pus stagnate when a sinus opening is blocked.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c028, section: pathogenesis, statement: "In allergic fungal sinusitis the immune system overreacts to fungal antigens.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c029, section: pathogenesis, statement: "Packed hyphae in a poorly draining sinus form a fungus ball (aspergilloma), in hosts with normal immunity.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c030, section: pathogenesis, statement: "In rhinocerebral aspergillosis the meninges and brain are reached after the fungus has penetrated the venous sinuses.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c031, section: gross, statement: "The lateral nasal wall and the ethmoid recess are where inflammatory polyps mostly originate.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c032, section: gross, statement: "Polyps may be unilateral or bilateral, and single or multiple.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c033, section: gross, statement: "Mucous secretions that accumulate in a sinus make a mucocele; if it becomes infected it is a pyocele.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c034, section: gross, statement: "Purulent exudate within a sinus is called empyema.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c035, section: gross, statement: "Mucoceles grow slowly, usually in the anterior frontal and ethmoid cells, and the expanding mass erodes bone.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c036, section: gross, statement: "Saddle nose is the end stage of granulomatosis with polyangiitis, after septal perforation, mucosal ulceration and slow destruction of the nose and sinuses.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c037, section: micro, statement: "Mucosal edema in allergic rhinitis is most marked over the inferior turbinates.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c038, section: micro, statement: "Eosinophils can be numerous in nasal secretions or in the mucosa of the allergic nose.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c039, section: micro, statement: "Chronic rhinitis leaves the nasal lining thick and persistently congested.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c040, section: micro, statement: "In chronic rhinitis lymphocytes and plasma cells infiltrate the mucosa and its mucous glands enlarge.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c041, section: micro, statement: "A polyp is covered by respiratory epithelium, and its loose mucoid stroma holds mucous glands.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c042, section: micro, statement: "Eosinophils and other chronic inflammatory cells infiltrate the polyp stroma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c043, section: micro, statement: "Vasculitis and ischemic-type necrosis are found in nasal tissue in granulomatosis with polyangiitis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c044, section: micro, statement: "The nasal lesions of granulomatosis with polyangiitis have a mixed chronic infiltrate that includes microabscesses and a few multinucleated giant cells.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c045, section: micro, statement: "These nasal lesions contain no well-formed granulomas.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c046, section: ancillary, statement: "On routine microscopy a polyp has respiratory epithelium over a loose stroma that holds mucous glands and eosinophils.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c047, section: ancillary, statement: "On microscopy, Aspergillus in the nose may show fruiting bodies.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c048, section: clinical, statement: "Because the mucosa swells in viral rhinitis, the patient feels a stuffy nose.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c049, section: clinical, statement: "In allergic rhinitis, lasting swelling of the mucosa during the late phase shows up as a blocked nose.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c050, section: clinical, statement: "Headache, rhinorrhea and nasal blockage can accompany inflammatory polyps.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c051, section: clinical, statement: "Atopic children and young adults are the usual patients with allergic fungal sinusitis, although it occurs at all ages.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c052, section: clinical, statement: "Allergic fungal sinusitis favors the maxillary and ethmoid sinuses, but any sinus may be affected.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c053, section: clinical, statement: "The dense hyphal mass of a fungus ball causes nasal obstruction.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c054, section: clinical, statement: "A fungus ball may erode bone and cause eye symptoms.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c055, section: clinical, statement: "Beyond nasal and sinus symptoms, granulomatosis with polyangiitis may make patients feel generally ill, with fever and weight loss.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c056, section: diagnosis, statement: "Active granulomatosis with polyangiitis goes with raised serum levels of ANCA and proteinase 3.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c057, section: prognosis, statement: "Complications of sinusitis involve the sinus wall bone, the orbit, the venous system and the cranial cavity.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c058, section: prognosis, statement: "A big frontal or anterior ethmoid mucocele can press on the orbit and occasionally erode bone to reach the central nervous system.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c059, section: prognosis, statement: "Orbital cellulitis or abscess can follow when suppurative osteomyelitis of a sinus wall spreads along Volkmann canals to the orbital periosteum.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c060, section: prognosis, statement: "Septic thrombophlebitis from a sinus infection that reaches the cavernous sinus is potentially life-threatening.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c061, section: prognosis, statement: "Intracranial spread of sinusitis can produce abscesses and purulent leptomeningitis, without extensive bone destruction.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c062, section: prognosis, statement: "Few patients survive rhinocerebral aspergillosis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c063, section: prognosis, statement: "Mucormycosis can invade brain, orbit, bone and skin, although it typically involves the nasopharynx.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c064, section: differential, statement: "Nasal lesions of granulomatosis with polyangiitis lack well-formed granulomas but show giant cells, vasculitis and necrosis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c065, section: differential, statement: "Allergic fungal sinusitis is commonest in atopic young patients, a fungus ball occurs in immunologically normal patients, and invasive fungal sinusitis usually affects immunocompromised patients.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c066, section: differential, statement: "In tertiary syphilis gummas can erode the nasal framework so that the bridge collapses into a saddle nose, and the septum may perforate.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c067, section: differential, statement: "The nose is often the first site of leprosy, with perforations, ulcers or nodules in the skin around the nostrils and the front of the nasal lining.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c068, section: high-yield, statement: "Viral rhinitis has a neutrophil and mononuclear infiltrate with watery rhinorrhea, and the discharge becomes mucopurulent after secondary infection.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c069, section: high-yield, statement: "Allergic rhinitis involves IgE bound to mast cells, histamine release, abundant eosinophils and late-phase edema.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1309" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c070, section: high-yield, statement: "An inflammatory polyp is respiratory epithelium over a loose stroma that contains eosinophils, and it is not neoplastic.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c071, section: high-yield, statement: "A blocked ostium predisposes to sinusitis; Haemophilus influenzae is a leading organism in acute disease, and anaerobes are almost always present in chronic disease.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c072, section: high-yield, statement: "Sinusitis complications include intracranial abscess, cavernous sinus thrombophlebitis, osteomyelitis and mucocele.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c073, section: high-yield, statement: "Allergic fungal sinusitis affects atopic hosts, a fungus ball occurs in normal hosts, and invasive fungal sinusitis occurs in immunocompromised hosts.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1311" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c074, section: high-yield, statement: "Granulomatosis with polyangiitis causes saddle nose with necrosis and vasculitis, and raised ANCA and PR3 mark active disease.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c075, section: traps, statement: "An inflammatory nasal polyp is a nonneoplastic swelling, not a tumor.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1310" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: rhinosinusitis-and-nasal-polyps-c076, section: traps, statement: "Nasal biopsies in granulomatosis with polyangiitis lack well-formed granulomas but show giant cells, vasculitis and necrosis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
