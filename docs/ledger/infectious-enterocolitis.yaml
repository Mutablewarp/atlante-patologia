entity: infectious-enterocolitis
claims:
  - { claimId: infectious-enterocolitis-c001, section: definition, statement: "Microbes cause infectious enterocolitis, a diarrheal disease of the small bowel and colon.", sourceRef: { source: rubin-8e, chapter: "19", pages: "805" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c002, section: definition, statement: "Diarrhea-causing bacteria invade the gut wall, attach to it, or release toxins.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c003, section: definition, statement: "Infants are most at risk of infectious diarrhea, and deaths cluster where sanitation is poor.", sourceRef: { source: rubin-8e, chapter: "19", pages: "805" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c004, section: etiology, statement: "The model toxin-producing diarrheal bacteria are V. cholerae and toxigenic strains of E. coli.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c006, section: etiology, statement: "Shigella, Salmonella, Yersinia, Campylobacter and certain E. coli strains are the best-known invasive organisms.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c007, section: etiology, statement: "Of the viral causes of gastroenteritis in the United States, rotavirus and norovirus lead.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c008, section: etiology, statement: "Most intestinal tuberculosis starts when patients swallow infectious sputum or eat food carrying M. tuberculosis or M. bovis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c009, section: etiology, statement: "Giardia lamblia is transmitted by unprotected drinking water or by contact with an infected person.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c010, section: etiology, statement: "In AIDS and other immunosuppressed patients nearly every class of microbe can infect the gut.", sourceRef: { source: rubin-8e, chapter: "19", pages: "809" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c014, section: pathogenesis, statement: "Toxigenic bacteria sit on the gut lining and release their toxin from there.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c015, section: pathogenesis, statement: "Little or no mucosal damage results from toxigenic diarrhea.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c016, section: pathogenesis, statement: "The gut keeps secreting salts and water because toxins upset its ion transporters.", sourceRef: { source: rubin-8e, chapter: "19", pages: "805" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c017, section: pathogenesis, statement: "Poor absorption and fast transit matter less than secretion in infectious diarrhea.", sourceRef: { source: rubin-8e, chapter: "19", pages: "805" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c018, section: pathogenesis, statement: "Toxigenic bacteria work mostly in the upper gut, whereas invasive ones settle mainly in the distal ileum and colon.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c020, section: pathogenesis, statement: "Injured mucosa may fail to take fluid back up from the gut.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c022, section: pathogenesis, statement: "Rotavirus injures the cells lining the gut surface, so absorption falls.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c023, section: pathogenesis, statement: "In norovirus infection absorption fails, with focal mucosal injury in the proximal small bowel.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c024, section: pathogenesis, statement: "The tubercle bacillus survives gastric acid because its cell wall protects it.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c025, section: pathogenesis, statement: "Lymphoid tissue is abundant in the ileocecal region, where the tubercle bacillus usually lodges.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c027, section: pathogenesis, statement: "A falling CD4 count raises the risk of gastrointestinal opportunistic infection.", sourceRef: { source: rubin-8e, chapter: "19", pages: "809" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c029, section: gross, statement: "Shigellosis hits the rectum and sigmoid hardest; the mucosa looks granular and bleeds, and many superficial ulcers wind across it.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c030, section: gross, statement: "Typhoid ulcers are scattered, mostly in the terminal ileum, where infected Peyer patches undergo necrosis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c032, section: gross, statement: "In Yersinia infection the mucosa overlying Peyer patches ulcerates acutely, and the patches are hyperplastic.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c033, section: gross, statement: "Tuberculous bowel ulcers differ in size and run crosswise to the long axis of the bowel.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c034, section: gross, statement: "A napkin-ring stricture, a localized ring-shaped narrowing, may follow scarring as tuberculous ulcers heal.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c035, section: gross, statement: "In intestinal tuberculosis, caseation and enlargement are the usual findings in mesenteric nodes.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c036, section: micro, statement: "Vibrio cholerae and toxigenic E. coli fall in the minimal inflammatory change pattern of bacterial gut infection.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c037, section: micro, statement: "Salmonella, Shigella and Campylobacter jejuni typically cause a brief self-limited colitis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c038, section: micro, statement: "Yersinia and mycobacteria are listed under the granulomatous pattern.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c039, section: micro, statement: "Shigella ulcers form where mucosal lymphoid follicles disintegrate, after neutrophil crypt abscesses appear.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c040, section: micro, statement: "Shigella colitis lacks the crypt branching and the heavy lymphocyte-plasma cell infiltrate of ulcerative colitis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c041, section: micro, statement: "Campylobacter jejuni colitis resembles Shigella colitis under the microscope.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c042, section: micro, statement: "In early typhoid lesions big macrophages full of bacilli stain blue, with debris and red cells nearby.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c043, section: micro, statement: "Regional lymph nodes in typhoid show lymphoid hyperplasia and necrosis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c047, section: micro, statement: "Yersinia granulomas in the ileum and appendix can mimic Crohn disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c048, section: micro, statement: "Few bacilli lie in the necrotizing granulomas of intestinal TB, which favor lymphoid tissue like Peyer patches yet can occur in any layer.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c050, section: micro, statement: "Giardia is usually abundant and sits on the epithelium without entering it.", sourceRef: { source: rubin-8e, chapter: "19", pages: "808" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c052, section: ancillary, statement: "Giardia trophozoites can be found in stool or in duodenal fluid.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807, 808" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c054, section: ancillary, statement: "Different bacterial infections of the gut produce different histologic reaction patterns.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c055, section: ancillary, statement: "PCR identifies Yersinia well, while culture can be tricky.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c056, section: clinical, statement: "In toxigenic diarrhea the small bowel secretes fluid and the stools become watery.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c057, section: clinical, statement: "Cholera can be fatal through the dehydration that its diarrhea causes.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c058, section: clinical, statement: "Yersinia infection causes loose stools with cramping and fever.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c059, section: clinical, statement: "Yersinia can mimic appendicitis through mesenteric lymph node inflammation with right lower abdominal pain.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c061, section: clinical, statement: "Campylobacter usually spreads through contaminated or undercooked food, or from infected domestic animals.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c063, section: clinical, statement: "Diarrhea in infants is often due to rotavirus.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c064, section: clinical, statement: "Norovirus infection brings vomiting and diarrhea that typically clear up fast.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c065, section: clinical, statement: "Many intestinal TB patients have a palpable mass in the right lower abdomen, and almost all have chronic pain.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c066, section: clinical, statement: "Fever and a run-down, undernourished state are common in intestinal TB.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c067, section: clinical, statement: "Giardiasis may impair absorption and cause heavy watery diarrhea with nausea and vomiting.", sourceRef: { source: rubin-8e, chapter: "19", pages: "808" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c068, section: clinical, statement: "Persistent diarrhea affects most AIDS patients.", sourceRef: { source: rubin-8e, chapter: "19", pages: "809" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c069, section: diagnosis, statement: "Patients with common variable immunodeficiency, who have low immunoglobulins and few plasma cells in the gut wall, often get giardiasis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "808" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c070, section: diagnosis, statement: "To exclude common variable immunodeficiency, plasma cells should be checked whenever a biopsy shows Giardia.", sourceRef: { source: rubin-8e, chapter: "19", pages: "808" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c071, section: diagnosis, statement: "Crohn disease or ischemia can produce a stricture that mimics a tuberculous one.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c072, section: prognosis, statement: "Late in typhoid and during recovery the ileum may bleed or perforate, the complications clinicians fear most.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c075, section: prognosis, statement: "Nontyphoidal Salmonella can reach the skeleton and the meninges through the blood from the gut.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c079, section: prognosis, statement: "Intestinal TB may obstruct or perforate the bowel, or form fistulas or abscesses.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c080, section: differential, statement: "Crypt branching and a dense lamina propria infiltrate point to ulcerative colitis, not Shigella colitis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c081, section: differential, statement: "Yersinia granulomas in ileum and appendix resemble Crohn disease, and tuberculous strictures are hard to tell from Crohn strictures.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c082, section: differential, statement: "PCR is an effective way to identify Yersinia.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c083, section: differential, statement: "C. difficile does not invade and damages the colon through its toxins.", sourceRef: { source: rubin-8e, chapter: "19", pages: "808" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c084, section: differential, statement: "C. difficile is usually diagnosed by finding its toxin in stool, for example by ELISA or a molecular test.", sourceRef: { source: rubin-8e, chapter: "19", pages: "809" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c085, section: differential, statement: "At the bedside, ischemic colitis can pass for other colitides, infectious ones included.", sourceRef: { source: rubin-8e, chapter: "19", pages: "805" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c086, section: high-yield, statement: "Toxigenic diarrhea is watery, with the bacteria staying on the surface and little mucosal damage.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c087, section: high-yield, statement: "Invasive bacteria damage the mucosa directly and favor the distal ileum and colon.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c088, section: high-yield, statement: "Typhoid ulcers arise from Peyer patch necrosis, mainly in the terminal ileum.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c089, section: high-yield, statement: "Yersinia can resemble appendicitis clinically and Crohn disease in its granulomas.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c090, section: high-yield, statement: "Branched crypts, a sign of chronic colitis, are not seen in Shigella colitis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c091, section: high-yield, statement: "Diarrhea in infants is often due to rotavirus.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c092, section: high-yield, statement: "Norovirus infects the proximal small bowel.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c093, section: high-yield, statement: "Intestinal tuberculosis usually involves the ileocecal region and healing can leave a napkin-ring stricture.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c094, section: high-yield, statement: "Giardia adheres to the epithelium without invading, and finding it should prompt a search for plasma cells.", sourceRef: { source: rubin-8e, chapter: "19", pages: "808" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c095, section: high-yield, statement: "A lower CD4 count carries a higher risk of opportunistic gut infection.", sourceRef: { source: rubin-8e, chapter: "19", pages: "809" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c096, section: traps, statement: "Toxigenic bacteria stay on the mucosal surface and secrete toxin rather than invading.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c097, section: traps, statement: "Giardia adheres to the epithelium without invading, and the mucosa beneath is often completely normal.", sourceRef: { source: rubin-8e, chapter: "19", pages: "808" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c098, section: traps, statement: "Appendicitis has been wrongly diagnosed in children who in fact had Yersinia infection, leading to needless operations.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c099, section: traps, statement: "A tuberculous stricture can pass for one caused by Crohn disease or other diseases.", sourceRef: { source: rubin-8e, chapter: "19", pages: "807" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-enterocolitis-c100, section: mnemonics, statement: "Toxigenic bacteria act from the upper intestinal surface, whereas invasive ones injure the distal ileum and colon.", sourceRef: { source: rubin-8e, chapter: "19", pages: "806" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
