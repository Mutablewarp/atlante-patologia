entity: precancerous-lesions
claims:
- {claimId: precancerous-lesions-c001, section: definition, statement: "Cancer often develops in metaplastic areas that result from persistent injury.", sourceRef: {source: rubin-8e, chapter: "1", pages: "28"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c002, section: definition, statement: "Dysplasia is a microscopic pattern that precedes the development of cancer, so it is a precursor lesion.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c003, section: definition, statement: "Dysplastic cells have only partial autonomy, so treatment can still return the tissue to normal.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c004, section: definition, statement: "In bladder, prostate, cervix and other organs, intraepithelial neoplasia progresses through a dysplastic stage.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c005, section: etiology, statement: "Persistent injury can lead to metaplasia or to dysplasia.", sourceRef: {source: rubin-8e, chapter: "1", pages: "28-29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c006, section: etiology, statement: "Squamous metaplasia of the bronchial lining in smokers can itself become dysplastic.", sourceRef: {source: rubin-8e, chapter: "1", pages: "28-29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c007, section: etiology, statement: "HPV infection of the cervix, chronic inflammation of the colon in ulcerative colitis and sunlight on skin keratinocytes (actinic keratosis) are settings in which dysplasia occurs.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c008, section: etiology, statement: "Barrett esophagus is a consequence of long-standing gastroesophageal reflux disease.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c009, section: etiology, statement: "White race, obesity and smoking are risk factors for Barrett esophagus.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c010, section: etiology, statement: "A family history of adenomas or carcinoma, obesity, smoking and a Western diet increase the chance of colon adenomas.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c011, section: etiology, statement: "Familial adenomatous polyposis is caused by a germline loss-of-function mutation of the APC gene (30% to 50% of cases are new mutations, so not every patient inherits it).", sourceRef: {source: rubin-8e, chapter: "19", pages: "825"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c012, section: pathogenesis, statement: "Because DNA replication is imperfect, a mutation can arise at any cell division.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c013, section: pathogenesis, statement: "A mutant clone expands when its mutation lets it grow or survive better than neighboring cells.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c014, section: pathogenesis, statement: "Faster division gives the mutant lineage more chances to acquire further mutations.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c015, section: pathogenesis, statement: "The more mutations a cell lineage gathers, the less it obeys normal growth controls.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c016, section: pathogenesis, statement: "In adenomas, crypt cells that should mature and stop dividing keep proliferating and escape apoptosis.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c017, section: pathogenesis, statement: "Dysplasia of the pancreatic ducts is called PanIN, which is sorted into two grades.", sourceRef: {source: rubin-8e, chapter: "21", pages: "908"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c018, section: pathogenesis, statement: "Mutational activation of KRAS is among the early events in low-grade PanIN.", sourceRef: {source: rubin-8e, chapter: "21", pages: "908"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c019, section: pathogenesis, statement: "Further along the PanIN sequence, tumor suppressors such as p53 are lost through mutation or deletion.", sourceRef: {source: rubin-8e, chapter: "21", pages: "908"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c020, section: gross, statement: "At endoscopy Barrett epithelium has a typical salmon-pink color.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c021, section: gross, statement: "Colon adenomas can be stalked or sessile, and range in size from tiny nodules to large lesions.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c022, section: gross, statement: "A villous adenoma usually has a shaggy, cauliflower-like surface and is typically a large sessile lesion.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c023, section: gross, statement: "In familial adenomatous polyposis the colorectal mucosa is covered by a dense layer of adenomas, sometimes along its whole length.", sourceRef: {source: rubin-8e, chapter: "19", pages: "825"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c024, section: micro, statement: "Dysplastic epithelial cells are uneven in size and shape.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c025, section: micro, statement: "Dysplastic nuclei are larger than normal, dark-staining and irregular.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c026, section: micro, statement: "Dividing cells are found well above the basal layer in dysplastic epithelium.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c027, section: micro, statement: "In dysplasia, cells no longer mature in an orderly sequence from base to surface.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c028, section: micro, statement: "Low-grade dysplasia shows dark, cigar-shaped nuclei, and every adenoma has at least this grade.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c029, section: micro, statement: "High-grade dysplasia shows complex cribriform glands, and its nuclei vary in shape and have large nucleoli.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c030, section: micro, statement: "In the cervix, advanced dysplasia is hard to tell apart from cancer in situ because they are very similar.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c031, section: micro, statement: "An intact basement membrane confines carcinoma in situ even though its cells may reach every layer of the epithelium.", sourceRef: {source: rubin-8e, chapter: "5", pages: "173"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c032, section: micro, statement: "Invasion in a polyp is diagnosed when tumor glands lie deeper than the muscularis mucosae.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823-824"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c033, section: ancillary, statement: "Barrett esophagus is diagnosed by endoscopy with biopsy.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c034, section: ancillary, statement: "Dysplasia is recognized by variation in cell and nuclear size and shape, disordered maturation and mitoses away from the basal layer.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c035, section: ancillary, statement: "Barrett epithelium has an intestinal look with goblet cells, in place of the esophagus's native squamous lining.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c036, section: ancillary, statement: "Whether polyp dysplasia stays in the mucosa decides if complete removal alone cures it.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c037, section: clinical, statement: "Barrett esophagus is usually diagnosed after reflux complaints, though many patients have none.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c038, section: clinical, statement: "Prevalence of Barrett esophagus increases with age.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c039, section: clinical, statement: "Only a minority of Barrett patients go on to develop dysplasia.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c040, section: clinical, statement: "Colorectal carcinoma is inevitable in patients with familial adenomatous polyposis.", sourceRef: {source: rubin-8e, chapter: "19", pages: "825"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c041, section: diagnosis, statement: "Regular monitoring of Barrett patients aims to detect dysplasia before adenocarcinoma develops.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c042, section: diagnosis, statement: "If no dysplasia is found, surveillance endoscopy is done at intervals of 3 to 5 years.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c043, section: diagnosis, statement: "Barrett patients with a longer segment or worse dysplasia are more likely to develop adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c044, section: diagnosis, statement: "About 0.1% to 0.3% of patients with Barrett esophagus are estimated to develop adenocarcinoma each year, a low risk.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c045, section: diagnosis, statement: "Under the 2016 American College of Gastroenterology guidelines, high-grade dysplasia in Barrett esophagus is treated by ablating the segment and endoscopically removing visible nodular areas.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c046, section: diagnosis, statement: "First-degree relatives of a patient with serrated polyposis should start screening colonoscopy earlier, since their colorectal cancer risk is raised.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c047, section: prognosis, statement: "Dysplasia usually clears when its cause is removed, for example when a person stops smoking.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c048, section: prognosis, statement: "Severe dysplasia warrants preventive treatment, either removing the abnormal tissue or dealing with its cause, including any noxious agent.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c049, section: prognosis, statement: "High-grade dysplasia in an adenoma can progress to invasive adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c050, section: prognosis, statement: "Larger, villous or highly dysplastic adenomas more often contain invasive carcinoma.", sourceRef: {source: rubin-8e, chapter: "19", pages: "824"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c051, section: prognosis, statement: "A lesion whose dysplasia does not extend beyond the mucosa is cured by complete polypectomy.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c052, section: prognosis, statement: "Carcinomas in situ have not invaded, so they are invariably curable.", sourceRef: {source: rubin-8e, chapter: "5", pages: "173"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c053, section: prognosis, statement: "Total colectomy performed before cancer has begun cures a patient with familial adenomatous polyposis.", sourceRef: {source: rubin-8e, chapter: "19", pages: "825"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c054, section: differential, statement: "Metaplasia swaps one differentiated cell type for another, most often as a protective adaptation to long-lasting injury.", sourceRef: {source: rubin-8e, chapter: "1", pages: "27"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c055, section: differential, statement: "Once its trigger is taken away, metaplasia typically goes back to the original tissue.", sourceRef: {source: rubin-8e, chapter: "1", pages: "28"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c056, section: differential, statement: "In dysplasia, maturation is disordered, nuclei are atypical and dark, and dividing cells are found well above the basal layer.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c057, section: differential, statement: "Carcinoma in situ has an intact basement membrane, with malignant cells at all epithelial levels.", sourceRef: {source: rubin-8e, chapter: "5", pages: "173"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c058, section: differential, statement: "Hyperplasia is an increase in the number of cells of a tissue.", sourceRef: {source: rubin-8e, chapter: "1", pages: "25"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c059, section: high-yield, statement: "Lung and bladder cancers, for example, often develop in areas of metaplasia.", sourceRef: {source: rubin-8e, chapter: "1", pages: "28"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c060, section: high-yield, statement: "Dysplasia is a precursor lesion and usually goes away when its trigger is removed.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c061, section: high-yield, statement: "Adenomas have at least low-grade dysplasia, and high-grade dysplasia is the stage that can progress to invasive adenocarcinoma.", sourceRef: {source: rubin-8e, chapter: "19", pages: "823"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c062, section: high-yield, statement: "Carcinoma in situ has not crossed the basement membrane, and for that reason it is invariably curable.", sourceRef: {source: rubin-8e, chapter: "5", pages: "173"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c063, section: high-yield, statement: "Barrett patients have surveillance endoscopy to detect early dysplastic mucosa.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c064, section: high-yield, statement: "Familial adenomatous polyposis, from germline APC mutation, invariably leads to colorectal cancer.", sourceRef: {source: rubin-8e, chapter: "19", pages: "825"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c065, section: traps, statement: "Metaplasia replaces one mature cell type with another and usually reverses; dysplasia is disordered growth and maturation.", sourceRef: {source: rubin-8e, chapter: "1", pages: "28-29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c066, section: traps, statement: "Dysplastic cells are only partly autonomous, so with treatment the tissue can go back to normal.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c067, section: traps, statement: "Dysplasia usually goes away once its cause is removed.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c068, section: traps, statement: "Barrett esophagus is intestinal metaplasia, and dysplasia develops in only a minority of patients.", sourceRef: {source: rubin-8e, chapter: "19", pages: "771"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: precancerous-lesions-c069, section: mnemonics, statement: "Dysplasia may arise in areas of metaplasia, and severe dysplasia looks very much like in situ cancer.", sourceRef: {source: rubin-8e, chapter: "1", pages: "29"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
