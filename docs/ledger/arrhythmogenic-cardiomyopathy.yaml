entity: arrhythmogenic-cardiomyopathy
claims:
  - claimId: arrhythmogenic-cardiomyopathy-c001
    section: definition
    statement: "Ventricular tachyarrhythmias often start early in this primary disease of heart muscle."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "684" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c002
    section: definition
    statement: "The disease is one of the desmosome, the cell-to-cell adhesion organelle of cardiac myocytes."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "684-685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c003
    section: definition
    statement: "Roughly 1 in 5,000 individuals is affected."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "684" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c004
    section: definition
    statement: "Most cases occur around the Mediterranean, where it is a frequent cause of sudden death under age 35."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "684-685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c005
    section: etiology
    statement: "The disease is familial and is usually inherited as an autosomal dominant trait."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c006
    section: etiology
    statement: "Incomplete penetrance and a variable picture mean the disease is probably undercounted."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c007
    section: etiology
    statement: "Affected genes include those of the desmosomal adhesion molecules desmoglein-2 and desmocollin-2."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c008
    section: etiology
    statement: "Genes for the intracellular linker proteins plakoglobin, desmoplakin and plakophilin-2 can be mutated as well."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c009
    section: etiology
    statement: "In the classical right ventricular form, the gene most often mutated is PKP2."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c010
    section: etiology
    statement: "Biventricular or left-sided forms are often associated with mutations in DSP."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c011
    section: pathogenesis
    statement: "In heart cells, linker proteins join the adhesion molecules at the membrane to the desmin filaments inside."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c012
    section: pathogenesis
    statement: "The heart and skin carry the heaviest mechanical load, and these are the organs richest in desmosomes."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c013
    section: pathogenesis
    statement: "Whether skin, heart or both are diseased generally depends on where the mutant isoform is expressed."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c014
    section: pathogenesis
    statement: "How the mutations cause disease is not settled; altered Wnt signaling and abnormal heart responses to exercise load are suspected."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c015
    section: gross
    statement: "Classically, fat takes over the outer layer of the right ventricular wall, and muscle survives mainly in the inner trabeculae."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c016
    section: gross
    statement: "In most cases the left ventricular free wall is involved too, mainly its posterolateral part."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c017
    section: micro
    statement: "Fat and fibrous tissue take the place of epicardial myocytes after these cells degenerate."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c018
    section: micro
    statement: "The amount of change varies, and in sudden death it may be subtle."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c019
    section: ancillary
    statement: "A trichrome stain colors cardiac myocytes brick-red and fibrous tissue blue (the pages do not say the myocytes are 'surviving')."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c020
    section: ancillary
    statement: "Among people who meet the clinical diagnostic criteria, more than half carry an identifiable mutation in a desmosomal gene."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c021
    section: clinical
    statement: "Serious rhythm problems or sudden death may appear while the heart still contracts well and has barely remodeled."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c022
    section: clinical
    statement: "Forms involving both ventricles or mainly the left may be wrongly labeled dilated cardiomyopathy; the disease was first described in the right ventricle (ARVC)."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c023
    section: diagnosis
    statement: "The clinical criteria are fairly specific but not very sensitive, so diagnosis is hard (the pages say relatively specific, not good)."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c024
    section: prognosis
    statement: "Around 1% of patients die each year."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c025
    section: prognosis
    statement: "Sudden death accounts for more than 80% of the deaths."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c026
    section: prognosis
    statement: "Even though a few dilated cardiomyopathy patients are very prone to arrhythmias, sudden death is far more typical of arrhythmogenic cardiomyopathy."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c027
    section: differential
    statement: "Arrhythmogenic and dilated cardiomyopathy share genetic causes, and their clinical and pathologic pictures overlap considerably."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c028
    section: differential
    statement: "In hypertrophic cardiomyopathy myofiber disarray with hypertrophy is the structural change, whereas in the arrhythmogenic form it is fibrofatty infiltration."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c029
    section: differential
    statement: "In primary restrictive cardiomyopathy filling is stiff, but the muscle itself looks almost normal."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c030
    section: differential
    statement: "Tissue from a primary restrictive heart may look unremarkable, or the only change may be mild scarring between the muscle cells."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c031
    section: high-yield
    statement: "Arrhythmogenic cardiomyopathy is a disease of the desmosome."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "684" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c032
    section: high-yield
    statement: "The key lesion is fibrofatty replacement of epicardial myocytes, mainly in the right ventricle."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c033
    section: high-yield
    statement: "The main risk is sudden death, which can come while structural remodeling is still minor."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c034
    section: high-yield
    statement: "Dilated cardiomyopathy can be the wrong label for the biventricular and left-dominant forms."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c035
    section: traps
    statement: "Most patients also have some damage to the left ventricular wall, so the disease is not limited to the right ventricle."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c036
    section: traps
    statement: "The amount of fibrofatty change varies and may be subtle."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c037
    section: traps
    statement: "Serious rhythm problems can come first, ahead of significant remodeling."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c038
    section: traps
    statement: "The two diseases can look alike in patients and in tissue, and share causative genes."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: arrhythmogenic-cardiomyopathy-c039
    section: mnemonics
    statement: "The classical right-sided disease is tied mostly to PKP2, whereas DSP variants tend to go with disease of both ventricles or the left."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "685" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
