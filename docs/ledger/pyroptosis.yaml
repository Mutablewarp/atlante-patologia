entity: pyroptosis
claims:
  - claimId: pyroptosis-c001
    section: definition
    statement: "Pyroptosis is a programmed cell death in which the plasma membrane ruptures and inflammation follows, unlike apoptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c002
    section: definition
    statement: "Pyroptosis depends on caspase-1, a pro-inflammatory protease generated by the inflammasome."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c003
    section: definition
    statement: "Pyroptosis serves innate defense: cells infected by intracellular pathogens die and release signals that recruit more immune cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c004
    section: definition
    statement: "Pyroptosis is classed among the regulated forms of cell death and is related to necroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c005
    section: etiology
    statement: "Bacteria, flagellated organisms and DNA or RNA viruses are triggers of pyroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c006
    section: etiology
    statement: "Macrophages infected with Salmonella undergo pyroptosis after recognizing bacterial flagellin."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c007
    section: etiology
    statement: "Human caspase-4 and caspase-5, and mouse caspase-11, recognize cytosolic bacterial LPS directly and trigger pyroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: not-found-in-reference
    secondSource: { source: shi-2015, locator: "abstract" }
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c008
    section: etiology
    statement: "Crystals and other inanimate particles can trigger pyroptosis; monosodium urate crystals act via NLRs to assemble the inflammasome (chapter 4, p. 134)."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c009
    section: etiology
    statement: "Pyroptosis is thought to have a role in obesity, metabolic syndrome and type 2 diabetes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-58" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c010
    section: pathogenesis
    statement: "Some cytosolic NLRs, NLRP3 being the best characterized, assemble into large multiprotein inflammasomes that cleave pro-inflammatory cytokines into their active form."
    sourceRef: { source: rubin-8e, chapter: "2, 11", pages: "87 (ch. 2), 507 (ch. 11)" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c011
    section: pathogenesis
    statement: "Inflammasome assembly is triggered when PAMPs or other danger signals such as crystals activate an NLR inside the cell."
    sourceRef: { source: rubin-8e, chapter: "1, 4", pages: "56-57 (ch. 1), 134 (ch. 4)" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c012
    section: pathogenesis
    statement: "The NLRP3 inflammasome, the best studied, comprises an NLR, ASC and caspase-1 in macrophages and other innate immune cells."
    sourceRef: { source: rubin-8e, chapter: "11", pages: "507" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c013
    section: pathogenesis
    statement: "Inflammasomes contain procaspase-1, which is converted to active caspase-1 when the linked receptor is activated."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c014
    section: pathogenesis
    statement: "Caspase-1 is a cysteine protease, like the apoptotic caspases, but its activation normally leads to pyroptosis rather than apoptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c015
    section: pathogenesis
    statement: "Around fourteen caspases are known; roughly half take part in apoptosis, while others such as caspase-1 mediate pyroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "47" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c016
    section: pathogenesis
    statement: "Inflammasome activation yields active IL-1 (IL-1beta) and IL-18; NLR complexes proteolytically activate pro-inflammatory cytokines (chapter 2, p. 87)."
    sourceRef: { source: rubin-8e, chapter: "11", pages: "507" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c017
    section: pathogenesis
    statement: "Caspase-1, -4, -5 and -11 cleave gasdermin D in the linker between its N-terminal and C-terminal domains."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: beyond-reference
    secondSource: { source: shi-2015, locator: "abstract" }
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c018
    section: pathogenesis
    statement: "Cleavage relieves autoinhibition by the C-terminal domain, and the freed N-terminal domain is sufficient to cause pyroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: beyond-reference
    secondSource: { source: shi-2015, locator: "abstract" }
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c019
    section: pathogenesis
    statement: "The gasdermin D N-terminal domain binds membrane lipids such as phosphoinositides, translocates to the plasma membrane and forms large pores."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: beyond-reference
    secondSource: { source: ding-2016, locator: "abstract" }
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c021
    section: pathogenesis
    statement: "Influx of water and solutes through the pores makes the cell swell and then die by bursting."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c022
    section: pathogenesis
    statement: "Caspase-1 cleaves glycolytic enzymes, depleting cell energy, and also cytoskeletal proteins, chaperones and caspase-7."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c023
    section: pathogenesis
    statement: "Gasdermin D-deficient cells release much less IL-1beta although caspase-1 still processes it; gasdermin D pores act as the conduit for IL-1beta release."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: beyond-reference
    secondSource: { source: shi-2015, locator: "abstract" }
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c024
    section: pathogenesis
    statement: "Membrane rupture releases DAMPs into the extracellular space, which recruit further immune cells to clear infection."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c025
    section: micro
    statement: "The pyroptotic cell swells and its membrane ruptures, whereas apoptotic cells show membrane blebbing without rupture."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54, 56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c026
    section: micro
    statement: "Pyroptosis is accompanied by nuclear pyknosis and DNA fragmentation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c027
    section: micro
    statement: "By activating pro-inflammatory cytokines, the dead pyroptotic cell elicits inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c028
    section: clinical
    statement: "Pyroptosis protects the host against intracellular pathogens."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c029
    section: clinical
    statement: "In people with HIV, pyroptosis accounts for much of the loss of CD4+ T cells and adds to inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c030
    section: clinical
    statement: "Several periodic fever syndromes arise from inherited defects in inflammasome control, and NLRP3 mutations are associated with hereditary periodic fever syndromes."
    sourceRef: { source: rubin-8e, chapter: "4, 11", pages: "134 (ch. 4), 507 (ch. 11)" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c031
    section: clinical
    statement: "NOMID is an inherited autoinflammatory disease in which mutation leaves cryopyrin, an inflammasome component, permanently active; the resulting IL-1 excess inflames skin and joints."
    sourceRef: { source: rubin-8e, chapter: "11", pages: "507" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c032
    section: prognosis
    statement: "Inappropriate or dysregulated inflammasome activity causes inflammatory disease, while pyroptosis is protective in infection (chapter 1, p. 56)."
    sourceRef: { source: rubin-8e, chapter: "11", pages: "507" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c033
    section: prognosis
    statement: "Inflammatory caspases that sense cytosolic LPS are crucial both for immunity and for endotoxic shock."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: not-found-in-reference
    secondSource: { source: shi-2015, locator: "abstract" }
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c034
    section: differential
    statement: "Apoptosis uses executioner caspases-3, -6 and -7, shows membrane blebbing and nuclear fragmentation without membrane rupture or inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 47, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c035
    section: differential
    statement: "In necroptosis, death-receptor signaling forms a RIP1-RIP3 necrosome and MLKL damages membranes independently of caspases."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-55" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c036
    section: differential
    statement: "Necrotic cells swell, their membranes break up and their nuclei turn pyknotic, after which inflammation sets in."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c037
    section: differential
    statement: "In NETosis, neutrophils depend on NADPH oxidase and autophagy to release chromatin traps that catch and kill microbes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c038
    section: high-yield
    statement: "Pyroptosis is a lytic, inflammatory programmed cell death mainly directed at intracellular pathogens."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c039
    section: high-yield
    statement: "The inflammasome consists of an NLR sensor such as NLRP3, the adaptor ASC and caspase-1 (procaspase-1, chapter 1, p. 57)."
    sourceRef: { source: rubin-8e, chapter: "11", pages: "507" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c040
    section: high-yield
    statement: "Caspase-1 activates IL-1beta and IL-18 and normally leads to pyroptosis rather than apoptosis."
    sourceRef: { source: rubin-8e, chapter: "1, 11", pages: "56 (ch. 1), 507 (ch. 11)" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c041
    section: high-yield
    statement: "Inflammatory caspases cleave gasdermin D, and its N-terminal fragment forms plasma membrane pores; the reference states that active caspase-1 leads to plasma membrane pores, the gasdermin D step comes from shi-2015 and ding-2016."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: beyond-reference
    secondSource: { source: shi-2015, locator: "abstract" }
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c042
    section: high-yield
    statement: "Caspase-4/5 in humans and caspase-11 in mice directly sense cytosolic LPS."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: not-found-in-reference
    secondSource: { source: shi-2015, locator: "abstract" }
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c043
    section: high-yield
    statement: "Swelling, rupture and DAMP release recruit more immune cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c044
    section: high-yield
    statement: "Pyroptosis is linked to HIV-related CD4+ T-cell loss, metabolic syndrome and type 2 diabetes; inflammasome defects cause periodic fever syndromes (chapter 11, p. 507)."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c045
    section: traps
    statement: "Caspase-1 activation normally leads to pyroptosis, not apoptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c046
    section: traps
    statement: "Unlike apoptosis, pyroptosis ruptures the plasma membrane and releases DAMPs."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c047
    section: traps
    statement: "Gasdermin D pores allow IL-1beta secretion from hyperactivated macrophages that remain alive."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: beyond-reference
    secondSource: { source: evavold-2018, locator: "abstract" }
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c048
    section: traps
    statement: "Besides infection, mineral crystals and metabolic conditions are associated with pyroptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c049
    section: traps
    statement: "Necroptosis proceeds via RIP3 and MLKL without caspases, whereas pyroptosis relies on caspase-1."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: pyroptosis-c050
    section: mnemonics
    statement: "Sequence: NLR sensing, inflammasome assembly, caspase-1 cleavage of substrates and cytokine activation, membrane pores, cell bursting."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
