entity: aortic-aneurysm
claims:
- { claimId: aortic-aneurysm-c001, section: definition, statement: "A segment of artery bulges in an aneurysm because the media is weak, either from birth or acquired", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c002, section: definition, statement: "The sac of an aneurysm is the original arterial wall in stretched form", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c003, section: definition, statement: "Aneurysms become more frequent with advancing age", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c004, section: definition, statement: "Up to 10% of unselected autopsies show an aneurysm of the aorta or another artery", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c005, section: definition, statement: "Cause, shape and site are the three bases on which aneurysms are classified", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c006, section: definition, statement: "A fusiform aneurysm is a lengthwise dilation that gives the vessel an oval outline", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c007, section: definition, statement: "A weak spot in the media lets the wall bulge out as a pouch in a saccular aneurysm", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c008, section: definition, statement: "A dissecting aneurysm is a hematoma, not a true dilation; blood in the media pushes the wall layers apart", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c009, section: definition, statement: "An arteriovenous aneurysm joins an artery and a vein directly", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c010, section: definition, statement: "A dilation is called an AAA when the vessel diameter has increased by 50% or more", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c011, section: definition, statement: "AAAs typically appear after age 50 and are the most frequent aneurysms", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c012, section: definition, statement: "Over age 80, AAA prevalence is 6%", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c013, section: definition, statement: "Women are affected far less often than men", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c014, section: definition, statement: "High blood pressure is present in roughly half of AAA patients", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c015, section: definition, statement: "Aneurysms occur less often in the popliteal and iliac arteries and the thoracic aorta", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c016, section: etiology, statement: "Severe atherosclerosis is always the background of an AAA", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c017, section: etiology, statement: "AAA is probably multifactorial; faulty matrix remodeling and repair and inflammation are two contributors", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c018, section: etiology, statement: "A genetic role is suspected but poorly understood because AAA recurs within families", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c019, section: etiology, statement: "Syphilis lost its place as the top cause of aortic aneurysm as the infection became uncommon", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c020, section: etiology, statement: "Bacterial endocarditis is the usual source of a mycotic aneurysm that forms during septicemia", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c021, section: etiology, statement: "A tuberculous or bacterial abscess next to an artery can also give rise to a mycotic aneurysm", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c022, section: etiology, statement: "Cerebral berry aneurysms arise from an arterial wall that is defective from birth", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c023, section: pathogenesis, statement: "Circumferential wall stress rises as the aneurysm widens, and this mechanical load is one factor governing growth", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c024, section: pathogenesis, statement: "Collagen types I and III in media and adventitia are degraded by MMPs and cathepsins K, L and S, which favors growth", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c025, section: pathogenesis, statement: "AAA formation is associated with the inflammatory cytokines IL-8, MCP-1, TNF-alpha and IL-1beta", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c026, section: pathogenesis, statement: "Chemokines and growth factors present in the AAA wall steer remodeling", sourceRef: { source: rubin-8e, chapter: "16", pages: "624-625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c027, section: pathogenesis, statement: "The syphilitic lesion is periarteritis and obliterative endarteritis of the vasa vasorum in the ascending aorta", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c028, section: pathogenesis, statement: "Scars left by dead patches of media, after closure of the inflamed vasa vasorum, fragment the elastic lamellae", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c029, section: pathogenesis, statement: "Pressure on the weakened ascending aorta or arch produces a fusiform aneurysm that may rupture", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c030, section: gross, statement: "Most AAAs lie in the infrarenal aorta, just above the bifurcation", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c031, section: gross, statement: "Saccular AAAs occur, but the fusiform shape is the usual one", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c032, section: gross, statement: "The iliac arteries can be involved by extension and sometimes carry separate aneurysms of their own", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c033, section: gross, statement: "The celiac axis and superior mesenteric artery may be blocked at their origins when the aneurysm extends above the renal arteries", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c034, section: gross, statement: "Atherosclerosis seldom involves the ascending aorta, so an aneurysm there is most often syphilitic", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c035, section: gross, statement: "The lining of most AAAs shows complicated atherosclerosis", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c036, section: gross, statement: "Fragments can embolize to peripheral arteries from the variably organized mural thrombus present in most AAAs", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c037, section: gross, statement: "The syphilitic aortic intima looks like tree bark because of scars in the media beneath it", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c038, section: gross, statement: "A berry aneurysm is a saccular bulge at a branching point of the circle of Willis, named for a berry on a twig", sourceRef: { source: rubin-8e, chapter: "16", pages: "625-626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c040, section: micro, statement: "In atherosclerotic AAA, fibrous tissue takes over where the wall was destroyed", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c041, section: micro, statement: "Only scattered islands of media remain, and atheroma penetrates the wall to different depths", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c042, section: micro, statement: "Patchy inflammation and thickening affect the adventitia in atherosclerotic AAA", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c043, section: micro, statement: "In syphilitic aortitis the diseased vasa vasorum reach from the adventitia through the outer two thirds of the wall", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c044, section: ancillary, statement: "Under the microscope an atherosclerotic AAA has a fibrotic wall with scattered remnants of media (the pages do not state the specimen type)", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c045, section: ancillary, statement: "Syphilitic aorta shows macrophages, plasma cells and lymphocytes cuffing the vasa vasorum", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c046, section: clinical, statement: "A large share of AAAs cause no symptoms", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c047, section: clinical, statement: "Expansion of the aneurysm often causes abdominal pain in AAA", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c048, section: clinical, statement: "Sudden ischemic symptoms can follow an embolus from the mural thrombus that blocks a peripheral artery", sourceRef: { source: rubin-8e, chapter: "16", pages: "625-626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c049, section: clinical, statement: "Most symptomatic aneurysms exceed 5-6 cm, but an aneurysm of any size can cause symptoms", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c050, section: clinical, statement: "Rupture of an AAA into the retroperitoneum or chest is an emergency with shock, pain and a pulsating abdominal mass", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c051, section: clinical, statement: "A mycotic aneurysm is prone to rupture and hemorrhage", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c053, section: diagnosis, statement: "Many AAAs are incidental findings, felt as an abdominal mass or seen on imaging requested for other reasons", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c054, section: prognosis, statement: "No AAA complication is more feared than rupture", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c055, section: prognosis, statement: "Even with urgent surgery, about half of patients with a ruptured AAA die", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c056, section: prognosis, statement: "Large aneurysms are often treated even when asymptomatic, by replacing or bypassing them with a prosthetic graft", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c057, section: prognosis, statement: "Size determines how likely an AAA is to rupture", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c058, section: prognosis, statement: "Rupture is rare (2%) below 4 cm", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c059, section: prognosis, statement: "Within 5 years of discovery, 25% to 40% of AAAs wider than 5 cm rupture", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c060, section: prognosis, statement: "Rarely, growth of the thrombus alone is enough to obstruct blood flow in the aorta", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c061, section: prognosis, statement: "A ruptured berry aneurysm causes subarachnoid hemorrhage", sourceRef: { source: rubin-8e, chapter: "16", pages: "625-626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c062, section: differential, statement: "Atherosclerotic AAA sits in the abdominal aorta, is mostly fusiform and holds a mural thrombus", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c063, section: differential, statement: "Atherosclerotic AAA histology: complicated atherosclerosis and a wall replaced by fibrous tissue", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c064, section: differential, statement: "Syphilitic aneurysm involves the ascending aorta and arch, is fusiform and has a tree-bark intima", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c065, section: differential, statement: "Syphilitic aneurysm histology: periarteritis and obliterative endarteritis in the vasa vasorum", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c066, section: differential, statement: "Mycotic aneurysm develops in septicemia and is rupture-prone", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c067, section: differential, statement: "For mycotic aneurysm, look for bacterial endocarditis or a neighboring abscess as the source", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c068, section: differential, statement: "Berry aneurysm is saccular and lies at circle of Willis branch points", sourceRef: { source: rubin-8e, chapter: "16", pages: "625-626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c069, section: differential, statement: "A berry aneurysm that ruptures presents as subarachnoid hemorrhage", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c070, section: differential, statement: "In dissection, blood splits the media into a false lumen; sudden tearing chest pain can be mistaken for myocardial infarction", sourceRef: { source: rubin-8e, chapter: "16", pages: "626-627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c071, section: differential, statement: "In dissection, aldehyde fuchsin stain shows metachromatic pools of cystic medial necrosis", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c072, section: high-yield, statement: "AAA goes with severe atherosclerosis, is mostly fusiform and lies under the renal arteries", sourceRef: { source: rubin-8e, chapter: "16", pages: "624-625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c073, section: high-yield, statement: "Syphilitic aneurysm: ascending aorta, endarteritis of the vasa vasorum, tree-bark intima", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c074, section: high-yield, statement: "Mycotic aneurysm is an infected wall, from septicemia or endocarditis, and tends to rupture", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c075, section: high-yield, statement: "Berry aneurysm: saccular, at branch points of the circle of Willis, causes subarachnoid hemorrhage", sourceRef: { source: rubin-8e, chapter: "16", pages: "625-626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c076, section: high-yield, statement: "Rupture risk climbs with size: rare under 4 cm, 25% to 40% within 5 years over 5 cm", sourceRef: { source: rubin-8e, chapter: "16", pages: "626" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c078, section: high-yield, statement: "A dissecting aneurysm is a hematoma inside the media", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c079, section: traps, statement: "A dissecting aneurysm is a hematoma splitting the layers of the media, not a plain dilation", sourceRef: { source: rubin-8e, chapter: "16", pages: "624" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c080, section: traps, statement: "Syphilis was formerly the leading cause of aortic aneurysm; syphilitic aneurysms fell as syphilis became rarer", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c082, section: traps, statement: "Mycotic means infectious here, usually from bacterial endocarditis", sourceRef: { source: rubin-8e, chapter: "16", pages: "627" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c083, section: traps, statement: "Many AAAs are silent and discovered by chance", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c084, section: mnemonics, statement: "Syphilitic aneurysm is the common type in the ascending aorta, atherosclerotic aneurysm in the abdominal aorta", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: aortic-aneurysm-c085, section: mnemonics, statement: "Berry aneurysms sit at branch points of the circle of Willis", sourceRef: { source: rubin-8e, chapter: "16", pages: "625" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
