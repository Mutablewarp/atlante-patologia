entity: focal-segmental-glomerulosclerosis
claims:
- {claimId: focal-segmental-glomerulosclerosis-c001, section: definition, statement: "FSGS names a pattern of glomerular injury, not one disease, so patients differ in outcome, cause and response to treatment", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c002, section: definition, statement: "Focal means that only some of the glomeruli are affected", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c003, section: definition, statement: "Segmental means that the lesion initially involves only part of an affected glomerular tuft", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c004, section: definition, statement: "Sclerosis is the added collagenous matrix that often accumulates in consolidated segments", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c005, section: definition, statement: "FSGS has a primary (idiopathic) form and secondary forms", sourceRef: {source: rubin-8e, chapter: "22", pages: "929-930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c006, section: definition, statement: "FSGS accounts for a tenth of childhood primary nephrotic syndrome and about a third of the adult cases", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c007, section: definition, statement: "FSGS is the most frequent primary cause of nephrotic syndrome in Black patients, who are affected more than white patients", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c008, section: definition, statement: "The incidence of FSGS has risen over the last decades and the reason is unknown", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c009, section: etiology, statement: "Primary FSGS is idiopathic", sourceRef: {source: rubin-8e, chapter: "22", pages: "929-930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c010, section: etiology, statement: "Secondary FSGS categories are hereditary or genetic, obesity, reduced renal mass, cyanotic heart disease, sickle cell nephropathy, infection and drugs", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c011, section: etiology, statement: "Some FSGS arises from genetic defects in podocyte proteins, including collagen type 4, TRPC6, alpha-actinin-4, nephrin and podocin", sourceRef: {source: rubin-8e, chapter: "22", pages: "929-930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c012, section: etiology, statement: "Acquired loss of renal mass is exemplified by reflux nephropathy, and congenital loss by unilateral agenesis with hypoplasia of the other kidney", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c013, section: etiology, statement: "Obesity alone, without any loss of kidney tissue, can lead to FSGS", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c014, section: etiology, statement: "Low blood oxygen in sickle cell disease or cyanotic congenital heart disease produces a comparable pattern of glomerular injury", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c015, section: etiology, statement: "The collapsing variant of FSGS is the one associated with HIV infection, especially in Black patients", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c016, section: etiology, statement: "Some cancer patients treated with pamidronate for osteolytic bone disease develop collapsing FSGS", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c017, section: etiology, statement: "The collapsing pattern also occurs with intravenous drug abuse", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c018, section: etiology, statement: "APOL1 variants are linked to FSGS in Black patients; their protection against African sleeping sickness probably explains why they are common", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c019, section: pathogenesis, statement: "Whatever the trigger, injury converges on a shared final pathway, and the podocyte is probably the damaged cell in all types", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c020, section: pathogenesis, statement: "With fewer nephrons the remaining ones are overworked: glomeruli enlarge and capillary pressure and filtration increase", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c021, section: pathogenesis, statement: "Because podocytes have limited proliferative capacity, glomerular enlargement overstresses them", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c022, section: pathogenesis, statement: "A circulating permeability factor is found in some patients, pointing to a cause outside the kidney", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c023, section: pathogenesis, statement: "FSGS most often recurs after transplantation in patients with the permeability factor, which supports a systemic cause", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c024, section: pathogenesis, statement: "HIV nephropathy may be caused by HIV itself in kidney tissue or by a different virus in the kidney of an immunodeficient patient", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c025, section: pathogenesis, statement: "Direct viral infection of podocytes may also produce collapsing FSGS", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c026, section: micro, statement: "In only some glomeruli, part of the tuft is filled by extra matrix, cells or both", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c027, section: micro, statement: "Hyalinosis is the glassy appearance a lesion acquires when plasma proteins and lipid insudate into it", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c028, section: micro, statement: "The tuft adheres to the Bowman capsule next to sclerotic lesions", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c029, section: micro, statement: "Uninvolved glomeruli are usually normal, occasionally with a few extra mesangial cells", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c030, section: micro, statement: "In the perihilar variant, seen mainly with obesity or reduced renal mass, the scars lie at the hilum of the tuft and in deep juxtamedullary glomeruli", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c031, section: micro, statement: "In the collapsing variant the sclerotic segments have collapsed capillaries and the adjacent podocytes are hypertrophied and hyperplastic", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c032, section: micro, statement: "In the tip lesion sclerosis is confined to the tuft segments near the tubular pole, where the proximal tubule begins", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c033, section: micro, statement: "In the cellular variant the consolidated sites contain prominent lipid-laden cells", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c034, section: micro, statement: "HIV-associated nephropathy commonly shows tubular atrophy and cystically dilated tubules with proteinaceous casts, plus interstitial fibrosis and mononuclear infiltrates", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c035, section: ancillary, statement: "Biopsy tissue is examined by light microscopy, immunofluorescence microscopy and electron microscopy", sourceRef: {source: rubin-8e, chapter: "22", pages: "930-931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c036, section: ancillary, statement: "On PAS, a scar near the hilum of the tuft is fused to Bowman capsule", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c037, section: ancillary, statement: "On silver stain the collapsing pattern shows hypertrophic podocytes, collapsing capillaries and accumulating matrix", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c038, section: ancillary, statement: "Because lesions are focal, a small biopsy sample without sclerotic glomeruli can pass for minimal-change disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c039, section: ancillary, statement: "On immunofluorescence, IgM and C3 are trapped in an irregular pattern within the scarred, hyalinized segments", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c040, section: ancillary, statement: "Scars contain IgG, C4 and C1q less often than IgM and C3, and unscarred segments barely stain, mostly for mesangial IgM and C3", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c041, section: ancillary, statement: "Podocytes are sometimes detached or lost from the basement membrane, and foot-process effacement is diffuse", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c042, section: ancillary, statement: "Sclerotic segments are rich in matrix, with collapsed capillaries and thick, wrinkled basement membranes", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c043, section: ancillary, statement: "Hyalinosis on light microscopy corresponds to electron-dense deposits in sclerotic segments that are trapped plasma proteins", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c044, section: ancillary, statement: "Immune complexes are absent in FSGS", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c045, section: ancillary, statement: "In HIV-associated nephropathy, electron microscopy shows numerous tubuloreticular inclusions in endothelial cells", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c046, section: clinical, statement: "Nephrotic syndrome typically develops from proteinuria that began without symptoms", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c047, section: clinical, statement: "Microscopic hematuria is frequent and many patients are hypertensive", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c048, section: clinical, statement: "Patients whose FSGS stems from obesity or reduced renal mass benefit from ACE inhibitors or ARBs and usually have an indolent course with lower proteinuria", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c049, section: clinical, statement: "The tip lesion variant resembles minimal-change disease and often starts with severe nephrotic syndrome", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c050, section: clinical, statement: "Kidney failure and heavy nephrotic-range protein loss are typical of collapsing FSGS, whether HIV-related or idiopathic", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c051, section: diagnosis, statement: "The clinical picture is hypertension and microscopic hematuria together with proteinuria progressing to nephrotic syndrome", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c052, section: diagnosis, statement: "A patient diagnosed with minimal-change disease who does not respond at all to steroids may have FSGS that the first biopsy missed", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c053, section: diagnosis, statement: "Azotemia in known minimal-change disease may come from drug-induced interstitial nephritis, from FSGS missed by the first biopsy, or from progression to FSGS", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c054, section: prognosis, statement: "Typically proteinuria persists and kidney function declines gradually", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c055, section: prognosis, statement: "Many patients progress to end-stage renal disease after 5 to 20 years", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c056, section: prognosis, statement: "Corticosteroid therapy benefits some FSGS patients but not all", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c057, section: prognosis, statement: "Steroids are more likely to work in the tip lesion than in other FSGS variants", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c058, section: prognosis, statement: "Half of patients with the collapsing variant reach end-stage disease within 2 years, and this variant has the worst prognosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c059, section: prognosis, statement: "FSGS recurs in half of transplanted kidneys, even though transplantation is the preferred treatment of end-stage renal disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c060, section: differential, statement: "Foot-process effacement is the main change in minimal-change disease and the rest of the glomerulus appears intact", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c061, section: differential, statement: "In most children with minimal-change disease, proteinuria remits completely on corticosteroids", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c062, section: differential, statement: "HIV-associated collapsing FSGS features tubuloreticular inclusions, collapsed capillaries and swollen podocytes containing protein droplets", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c063, section: differential, statement: "Secondary FSGS from obesity or reduced renal mass is usually the perihilar variant", sourceRef: {source: rubin-8e, chapter: "22", pages: "930-931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c064, section: high-yield, statement: "FSGS is a pattern of injury with many causes rather than a single disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c065, section: high-yield, statement: "Focal means some glomeruli and segmental means part of the tuft", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c066, section: high-yield, statement: "Secondary FSGS includes genetic podocyte defects, reduced renal mass, obesity, HIV and pamidronate", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c067, section: high-yield, statement: "The collapsing variant, typical of HIV-associated nephropathy, has the worst prognosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c068, section: high-yield, statement: "The tip lesion responds to steroids better than other forms", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c069, section: high-yield, statement: "FSGS recurs frequently in grafts, particularly in patients with a serum permeability factor", sourceRef: {source: rubin-8e, chapter: "22", pages: "930-931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c070, section: high-yield, statement: "A small biopsy of nonsclerotic glomeruli can be mistaken for minimal-change disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c071, section: traps, statement: "FSGS is a pattern of injury with many causes and outcomes, not one disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "929"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c072, section: traps, statement: "Because FSGS is focal and uninvolved glomeruli look normal, a biopsy without sclerotic glomeruli can be mistaken for minimal-change disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "930"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c073, section: traps, statement: "Only some FSGS patients improve with steroids, and the tip lesion responds better than the other forms", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c074, section: traps, statement: "FSGS recurs in a large share of transplanted kidneys", sourceRef: {source: rubin-8e, chapter: "22", pages: "931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: focal-segmental-glomerulosclerosis-c075, section: mnemonics, statement: "Memory aid for the focal pattern, segmental scars, graft recurrence and variable steroid response of FSGS", sourceRef: {source: rubin-8e, chapter: "22", pages: "929-931"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
