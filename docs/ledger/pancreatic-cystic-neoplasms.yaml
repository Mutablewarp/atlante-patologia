entity: pancreatic-cystic-neoplasms
claims:
  - { claimId: pancreatic-cystic-neoplasms-c001, section: definition, statement: "The main pancreatic cystic neoplasms are serous cystic neoplasm, mucinous cystic neoplasm, intraductal papillary mucinous neoplasm and solid pseudopapillary neoplasm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c002, section: definition, statement: "Serous cystic neoplasms are almost always benign.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c003, section: definition, statement: "An invasive carcinoma is sometimes found together with an IPMN.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c004, section: definition, statement: "An invasive carcinoma can at times accompany a mucinous cystic neoplasm too.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c005, section: definition, statement: "Solid pseudopapillary neoplasm is a very low-grade malignancy.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c006, section: definition, statement: "Serous cystic neoplasms are three times commoner in women than in men, and they typically arise in adults, in the body or tail of the pancreas.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c007, section: definition, statement: "Diagnosis of an IPMN usually comes late in adult life.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c008, section: definition, statement: "The body and tail of the pancreas are the preferred sites of mucinous cystic neoplasm, and almost all patients are middle-aged women.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c009, section: definition, statement: "Almost every patient with solid pseudopapillary neoplasm is a teenage girl or a young woman.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c010, section: etiology, statement: "Patients with von Hippel-Lindau syndrome have an increased risk of serous cystic neoplasm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c011, section: pathogenesis, statement: "Loss of the VHL gene in von Hippel-Lindau syndrome leaves growth factors undegraded.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c012, section: pathogenesis, statement: "The syndrome can give rise to many tumors, including cystic lesions of the pancreas and kidney.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c013, section: pathogenesis, statement: "Many IPMNs have a molecular profile like PanIN and ductal adenocarcinoma (the page says similar, not identical).", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c014, section: pathogenesis, statement: "Some IPMNs differ in appearance from PanIN, probably because they develop along alternative molecular pathways.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c015, section: pathogenesis, statement: "Mucinous cystic neoplasms share genetic alterations with PanIN and with invasive pancreatic ductal adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c016, section: pathogenesis, statement: "CTNNB1, the gene coding for beta-catenin, is mutated in most solid pseudopapillary neoplasms.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c017, section: gross, statement: "The diameter of serous cystadenomas ranges from 1 to 25 cm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c018, section: gross, statement: "Tiny calcifications sometimes sit inside the star-shaped central scar that serous cystadenomas often show.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c019, section: gross, statement: "The pancreatic ducts of an IPMN are filled with mucus and dilated beyond 5 mm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c020, section: gross, statement: "The pancreatic head is the usual site of an IPMN.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c021, section: gross, statement: "Duct involvement in IPMN may be unifocal, multifocal or diffuse.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c022, section: gross, statement: "Some IPMNs are localized to the small peripheral branch ducts, while others involve the main duct.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c023, section: gross, statement: "A mucinous cystic neoplasm is a unilocular or multilocular cystic tumor.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c024, section: gross, statement: "Mucinous cystic neoplasms may reach 10 cm in diameter.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c025, section: gross, statement: "Mucinous cystic neoplasms have no connection with the pancreatic ducts.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c026, section: gross, statement: "Solid pseudopapillary neoplasms are solid and circumscribed.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c027, section: gross, statement: "SPNs often contain big cystic areas where the tissue has broken down, holding blood and dead debris.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c028, section: micro, statement: "Clear glycogen-filled cells form one layer around each serous cyst, and tough fibrous tissue surrounds the cysts.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c029, section: micro, statement: "In an IPMN the tumor cells in the duct make mucin and form many papillae that protrude inward.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c030, section: micro, statement: "Dysplasia in IPMN may be low-grade or high-grade, categorized as in PanIN.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c031, section: micro, statement: "A mucinous cystic neoplasm has mucin-secreting epithelium over cellular, ovarian-type stroma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c032, section: micro, statement: "The epithelium of a mucinous cystic neoplasm may show more or less atypia, as in IPMN.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c033, section: micro, statement: "Uniform SPN cells form pseudopapillae and also lie in loose sheets.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c034, section: micro, statement: "The pseudopapillae of solid pseudopapillary neoplasm have vascular cores.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c035, section: ancillary, statement: "On routine H&E the lining and stroma separate the types: glycogen-rich clear cells in serous, mucinous epithelium over ovarian-type stroma in MCN, mucinous papillae in a dilated duct in IPMN, monomorphic cells with pseudopapillae in SPN.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c036, section: ancillary, statement: "In most solid pseudopapillary neoplasms the beta-catenin protein is abnormally located in the nucleus.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c037, section: clinical, statement: "Many patients with serous cystic neoplasm have no symptoms; when present they are vague and due to local mass effect.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c038, section: clinical, statement: "IPMN is discovered either incidentally or in patients with chronic pancreatitis (the page gives no frequency).", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c039, section: clinical, statement: "Solid pseudopapillary neoplasm can be mistaken clinically for other malignant pancreatic neoplasms.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c040, section: diagnosis, statement: "A sunburst pattern on imaging comes from the stellate central scar of serous cystadenoma, which sometimes contains microcalcifications.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c041, section: diagnosis, statement: "On imaging, an IPMN localized to branch ducts may be mistaken for a cystic lesion.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c042, section: diagnosis, statement: "An IPMN that is big or looks unusual on scans is often removed, because it may hide an invasive cancer.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c043, section: diagnosis, statement: "Symptoms or clinical concern for malignancy are the occasional reasons for excising a serous tumor.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c044, section: prognosis, statement: "Up to a third of IPMNs harbor a focus of invasive adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c045, section: prognosis, statement: "Patients with noninvasive MCN do very well after complete resection.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c046, section: prognosis, statement: "Complete surgical resection cures nearly all solid pseudopapillary neoplasms, which are slow growing.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c047, section: prognosis, statement: "Roughly one SPN in ten metastasizes, most often to the liver.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c048, section: prognosis, statement: "Many years of survival are usual even for patients with metastatic solid pseudopapillary neoplasm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c049, section: differential, statement: "Serous cystic neoplasm has cysts lined by glycogen-rich cuboidal cells and a stellate central scar, and is almost always benign.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c050, section: differential, statement: "The central scar of serous cystic neoplasm produces a sunburst pattern on imaging.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c051, section: differential, statement: "Mucinous cystic neoplasm has mucin-secreting lining on ovarian-type stroma, no duct communication, and occurs in middle-aged women.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c052, section: differential, statement: "The ovarian-type stroma under the epithelium identifies a mucinous cystic neoplasm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c053, section: differential, statement: "IPMN is a dilated duct filled with mucus and papillary proliferations, involving the main or branch ducts.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c054, section: differential, statement: "The duct lining of an IPMN shows varying degrees of atypia, and a focus of invasive carcinoma may be present (the page does not describe how it is examined).", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c055, section: differential, statement: "Seen in young women: a solid, sharply bounded mass with cystic change and pseudopapillae.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c056, section: differential, statement: "Most solid pseudopapillary neoplasms have a CTNNB1 mutation and abnormal nuclear localization of beta-catenin (the page says most, not all).", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c057, section: differential, statement: "IPMN and MCN share molecular changes with pancreatic ductal adenocarcinoma and may be associated with invasive carcinoma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c058, section: differential, statement: "A focus of invasive adenocarcinoma can be found in an IPMN (the page does not mention a cyst wall).", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c059, section: high-yield, statement: "Serous cystic neoplasms are almost always benign.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c060, section: high-yield, statement: "The sunburst pattern on imaging comes from the central scar of serous cystadenoma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c061, section: high-yield, statement: "Von Hippel-Lindau syndrome raises the risk of serous cystic neoplasm.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c062, section: high-yield, statement: "Mucinous cystic neoplasm is a cystic tumor lined by mucin-secreting epithelium with ovarian-type stroma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c063, section: high-yield, statement: "Mucinous cystic neoplasm occurs almost exclusively in middle-aged women, in the body and tail.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c064, section: high-yield, statement: "IPMN may involve the main pancreatic ducts or the peripheral branch ducts.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c065, section: high-yield, statement: "Up to a third of IPMNs contain invasive adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c066, section: high-yield, statement: "Solid pseudopapillary neoplasm is a very low-grade malignancy found in young women.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c067, section: high-yield, statement: "Most solid pseudopapillary neoplasms have CTNNB1 mutations and abnormal nuclear beta-catenin.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c068, section: traps, statement: "Serous cystic neoplasms are almost always benign, so not every pancreatic cystic neoplasm is precancerous.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c069, section: traps, statement: "An invasive carcinoma can occur together with an IPMN or an MCN.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c070, section: traps, statement: "Mucinous cystic neoplasm has no link with the pancreatic ducts.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c071, section: traps, statement: "In IPMN the ducts are widened and their lining is tumor epithelium that produces mucin.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c072, section: traps, statement: "IPMN confined to branch ducts looks like an ordinary cyst on imaging, so it is not always main-duct disease.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c073, section: traps, statement: "Solid pseudopapillary neoplasm is a very low-grade malignancy, not a benign tumor.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c074, section: traps, statement: "Roughly one SPN in ten metastasizes, most often to the liver.", sourceRef: { source: rubin-8e, chapter: "21", pages: "912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: pancreatic-cystic-neoplasms-c075, section: mnemonics, statement: "Serous neoplasms are almost always benign, IPMN and MCN may be associated with invasive carcinoma, and solid pseudopapillary neoplasm is a slow low-grade malignancy of young women.", sourceRef: { source: rubin-8e, chapter: "21", pages: "911-912" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
