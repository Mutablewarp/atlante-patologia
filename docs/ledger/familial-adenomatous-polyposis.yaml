entity: familial-adenomatous-polyposis
claims:
- claimId: familial-adenomatous-polyposis-c001
  section: definition
  statement: "FAP is inherited as an autosomal dominant trait, and the colorectal lining is studded with hundreds to thousands of adenomas"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c002
  section: definition
  statement: "Fewer than 1% of colorectal cancers are due to FAP"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c003
  section: etiology
  statement: "APC lies at 5q21-22 on the long arm of chromosome 5, and a germline mutation that disables it causes FAP"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c004
  section: etiology
  statement: "New mutations account for 30% to 50% of cases"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c005
  section: etiology
  statement: "About a quarter of familial cases have no APC mutation"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c006
  section: etiology
  statement: "Mutations in both MYH copies cause a rare recessive polyposis that can resemble FAP clinically"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c007
  section: pathogenesis
  statement: "APC normally acts as a tumor suppressor gene"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c008
  section: pathogenesis
  statement: "Through Wnt/beta-catenin signaling, APC helps set how fast colonic mucosal cells proliferate"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c009
  section: gross
  statement: "The rectosigmoid is the most densely covered region, and the carpet of hundreds to thousands of adenomas sometimes extends through the whole colorectal mucosa"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c010
  section: gross
  statement: "Several of the many polyps in the pictured FAP colon are more than 1 cm across"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c011
  section: gross
  statement: "In some patients adenomas also occur outside the colon, in the small intestine and stomach"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c012
  section: micro
  statement: "Tubular adenomas predominate, and a minority are tubulovillous or villous"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c013
  section: micro
  statement: "Many adenomas are visible only microscopically, a few confined to a single crypt"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c014
  section: ancillary
  statement: "The key molecular finding is a germline APC mutation, carried by most familial cases but missing in about a quarter"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c015
  section: ancillary
  statement: "MYH is a DNA repair gene, and some patients without an APC mutation have both copies mutated"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c016
  section: clinical
  statement: "By age 10 patients usually already have a few polyps"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c017
  section: clinical
  statement: "Patients typically become symptomatic by age 36"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c018
  section: clinical
  statement: "Gardner syndrome includes osteomas, for example in the skull and jaw"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c019
  section: clinical
  statement: "Gardner syndrome includes desmoid tumors and epidermoid cysts"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c020
  section: clinical
  statement: "Gardner syndrome includes congenital hypertrophy of the retinal pigment epithelium"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c021
  section: clinical
  statement: "Attenuated FAP has fewer than 100 colonic adenomas"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c022
  section: clinical
  statement: "Compared with classic FAP, the colorectal cancers of attenuated FAP arise about 15 years later on average"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c023
  section: clinical
  statement: "In attenuated FAP the risk that invasive cancer has developed by age 80 is 70%"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c024
  section: clinical
  statement: "APC mutations do not predict the Gardner phenotype"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c025
  section: clinical
  statement: "Turcot syndrome is a rare combination of FAP with malignant CNS tumors"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c026
  section: clinical
  statement: "Germline APC mutations underlie many Turcot cases, particularly those with medulloblastoma"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c027
  section: prognosis
  statement: "Every FAP patient will develop colorectal carcinoma"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c028
  section: prognosis
  statement: "Carcinoma arises in FAP at a mean age of 40 years"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c029
  section: prognosis
  statement: "The curative treatment is a total colectomy, provided it is done before cancer onset"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c030
  section: prognosis
  statement: "Colonic adenomas and small intestinal or gastric adenomas are equally capable of turning malignant"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c031
  section: differential
  statement: "Attenuated FAP has fewer than 100 colonic adenomas"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c032
  section: differential
  statement: "MYH-associated polyposis is recessively inherited, with both MYH alleles mutated, and its clinical picture overlaps FAP"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c033
  section: differential
  statement: "Most colorectal adenocarcinomas develop from a preexisting adenoma"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c034
  section: high-yield
  statement: "APC at 5q21-22 is a tumor suppressor gene acting in the Wnt/beta-catenin pathway"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c035
  section: high-yield
  statement: "The colon is covered by mostly tubular adenomas, hundreds to thousands, thickest in the rectosigmoid"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c036
  section: high-yield
  statement: "Cancer is inevitable in FAP without surgery, and a total colectomy done early, before cancer starts, is curative"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c037
  section: high-yield
  statement: "Attenuated FAP has fewer than 100 adenomas and cancer about 15 years later than classic FAP"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c038
  section: high-yield
  statement: "Gardner syndrome has extracolonic osteomas, desmoid tumors and epidermoid cysts"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c039
  section: high-yield
  statement: "Turcot syndrome pairs FAP with malignant tumors of the central nervous system"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c040
  section: high-yield
  statement: "MYH-associated polyposis is an autosomal recessive syndrome overlapping FAP"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c041
  section: traps
  statement: "FAP accounts for fewer than 1% of colorectal cancers"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c042
  section: traps
  statement: "Between 30% and 50% of FAP cases are new mutations"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c043
  section: traps
  statement: "APC mutations do not predict the Gardner phenotype"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c044
  section: traps
  statement: "Biallelic MYH mutations cause a distinct polyposis in patients with no APC mutation"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c045
  section: traps
  statement: "Adenomas can also occur in the small intestine and stomach in FAP"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
- claimId: familial-adenomatous-polyposis-c046
  section: mnemonics
  statement: "Mnemonic restating adenomas by the hundreds, prophylactic colectomy as the cure, and cancer at a mean age of 40 if untreated"
  sourceRef: { source: rubin-8e, chapter: "19", pages: "825" }
  status: verified
  verifiedBy: agent
  verifier: "independent-verifier-agent"
  date: 2026-11-15
