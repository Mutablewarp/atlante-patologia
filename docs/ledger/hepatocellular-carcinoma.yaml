entity: hepatocellular-carcinoma
claims:
- {claimId: hepatocellular-carcinoma-c001, section: definition, statement: "HCC is a cancer derived from hepatocytes", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c002, section: definition, statement: "It is the most common primary malignancy of the liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c003, section: definition, statement: "It is one of the leading causes of cancer-related death", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c004, section: definition, statement: "Sub-Saharan Africa and Southeast Asia have much more HCC than the industrialized Western countries, where the tumor is uncommon", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c005, section: definition, statement: "Patients with chronic hepatitis C account for most of the recent increase in Western incidence", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c006, section: etiology, statement: "HBV-endemic countries account for the bulk of HCC cases", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c007, section: etiology, statement: "A substantial share of infants who acquire chronic hepatitis B from an infected mother at or near birth eventually develop HCC", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c008, section: etiology, statement: "Hepatitis C is the infection associated with most HCC in Japan, North America and Europe", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c009, section: etiology, statement: "A person infected with both HBV and HCV has a higher liver cancer risk than a person infected with only one of them", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c010, section: etiology, statement: "Most HBV- or HCV-associated HCC develops in patients who have cirrhosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c011, section: etiology, statement: "Many HBV-associated HCCs occur in patients without cirrhosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c012, section: etiology, statement: "Other etiologies drive the cancer, and cirrhosis may add to their effect without being enough by itself", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c013, section: etiology, statement: "The way alcoholic cirrhosis adds a small HCC risk is unknown", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c014, section: etiology, statement: "Alcohol's own contribution is hard to isolate because HBV or HCV infection is frequent among alcoholics", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c015, section: etiology, statement: "Alpha-1-antitrypsin deficiency and hemochromatosis each notably raise HCC risk", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c016, section: etiology, statement: "Primary biliary cholangitis with cirrhosis, Wilson disease and autoimmune hepatitis are associated with a lower HCC risk", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c017, section: etiology, statement: "Fungi produce aflatoxin B1, which contaminates food mainly in the tropics of developing countries", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c018, section: etiology, statement: "Aflatoxin B1 causes HCC in a number of animal species", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c019, section: etiology, statement: "Exposure to both aflatoxin and HBV gives a much higher HCC risk than either alone because the two are synergistic", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c020, section: pathogenesis, statement: "Expression of viral genes together with insertion of HBV DNA into the host genome is probably the central carcinogenic mechanism", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c021, section: pathogenesis, statement: "The HBV X gene encodes HBxAg, which turns on certain oncogenes and switches off tumor suppressor proteins", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c022, section: pathogenesis, statement: "Interactions of viral proteins with cell constituents are likely in HCV, but how it causes cancer is poorly understood", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c023, section: pathogenesis, statement: "HCCs from aflatoxin-endemic areas often carry TP53 mutations", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c024, section: pathogenesis, statement: "Aflatoxin B1 induces a G-to-T change at codon 249 experimentally, and this is also the usual TP53 lesion in these tumors", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c025, section: gross, statement: "HCC appears as single or multiple tan, soft masses that show bleeding in places", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c026, section: gross, statement: "In some cases bile production by the tumor appears as a green color", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c027, section: gross, statement: "HCC tends to grow into portal and hepatic veins", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c028, section: gross, statement: "Tumor in a hepatic vein can continue into the vena cava and as far as the right atrium", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c029, section: gross, statement: "The lungs and portal lymph nodes are the preferred sites of metastasis", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c030, section: micro, statement: "HCC ranges from tumors resembling normal liver almost completely to anaplastic ones", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c031, section: micro, statement: "The trabecular pattern reproduces the plate-like architecture of normal liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c032, section: micro, statement: "Sinusoids with an endothelial lining run between the plates", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c033, section: micro, statement: "In the pseudoglandular pattern, tumor cells form rings around a central space that can hold bile", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c034, section: micro, statement: "The pseudoglandular spaces are not true glands", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c035, section: micro, statement: "Neither the trabecular nor the pseudoglandular pattern has particular prognostic significance", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c036, section: micro, statement: "The uncommon fibrolamellar variant mostly affects adolescents and young adults, and the surrounding liver is non-cirrhotic", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c037, section: micro, statement: "Pale fibrinogen-rich bodies sit in the cytoplasm of big eosinophilic cells that grow in clusters", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c038, section: micro, statement: "The fibrolamellar tumor cells lie within thick collagen fibers", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c039, section: ancillary, statement: "On routine H&E the architecture to check is hepatocyte plates with sinusoids or lumina containing bile", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c040, section: ancillary, statement: "Pale bodies in the cytoplasm contain fibrinogen in the fibrolamellar variant", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c041, section: ancillary, statement: "DNA from HCC in aflatoxin-endemic areas often shows a TP53 codon 249 G-to-T mutation", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c042, section: clinical, statement: "Typically HCC shows up as a mass that is painful and keeps growing", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c043, section: clinical, statement: "HCC can secrete hormones ectopically, causing paraneoplastic effects such as polycythemia, hypoglycemia or hypercalcemia", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c044, section: diagnosis, statement: "Serum alpha-fetoprotein is often elevated in HCC", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c045, section: diagnosis, statement: "AFP also rises in some extrahepatic disorders and in both benign and malignant liver diseases, so it is not specific", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c046, section: diagnosis, statement: "Tumors are detected early when high-risk patients are kept under surveillance", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c047, section: prognosis, statement: "HCC at an advanced stage carries a dismal prognosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c048, section: prognosis, statement: "Patients die of cirrhotic complications, cancer wasting, or tumor rupture with hemorrhage into the abdomen", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c049, section: prognosis, statement: "Segmental resection gives acceptable tumor-free survival when the tumor is small and limited to one hepatic lobe", sourceRef: {source: rubin-8e, chapter: "20", pages: "891"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c050, section: prognosis, statement: "Local ablation can delay the tumor's progression", sourceRef: {source: rubin-8e, chapter: "20", pages: "891"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c051, section: prognosis, statement: "Transplantation keeps cirrhotic patients with a low tumor burden free of tumor longer than other treatments", sourceRef: {source: rubin-8e, chapter: "20", pages: "891"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c052, section: prognosis, statement: "Fibrolamellar tumors have an outcome about like other HCCs arising in a non-cirrhotic liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c053, section: differential, statement: "Intrahepatic cholangiocarcinoma often has marked fibrosis, and its small cuboidal cells are arranged in ducts or glands", sourceRef: {source: rubin-8e, chapter: "20", pages: "891"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c054, section: differential, statement: "Pseudoglandular HCC only looks glandular, so it is not a cholangiocarcinoma and should not be mistaken for one", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c055, section: differential, statement: "A tumor combining the morphologies of HCC and intrahepatic cholangiocarcinoma is classified as a combined hepatocellular-cholangiocarcinoma", sourceRef: {source: rubin-8e, chapter: "20", pages: "891"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c056, section: differential, statement: "Fibrolamellar carcinoma arises without cirrhosis; big eosinophilic cells with pale bodies sit in thick collagen", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c057, section: high-yield, statement: "Chronic HBV and HCV infection are the main viral causes of HCC", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c058, section: high-yield, statement: "Most virus-associated HCC occurs in cirrhosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c059, section: high-yield, statement: "Aflatoxin B1 and HBV infection are synergistic in causing HCC", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c060, section: high-yield, statement: "Aflatoxin B1 produces the G-to-T change at TP53 codon 249 in experiments, the usual TP53 lesion in HCC from endemic areas", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c061, section: high-yield, statement: "Neither trabecular nor pseudoglandular pattern has prognostic significance", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c062, section: high-yield, statement: "Fibrolamellar HCC arises in non-cirrhotic livers of adolescents and young adults", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c063, section: high-yield, statement: "AFP is often elevated in HCC but is also raised in other conditions", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c064, section: high-yield, statement: "HCC grows into portal and hepatic veins and favors metastasis to the lungs and portal lymph nodes", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c065, section: high-yield, statement: "Transplantation keeps cirrhotic patients with little tumor free of tumor longest", sourceRef: {source: rubin-8e, chapter: "20", pages: "891"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c066, section: traps, statement: "Many HBV-associated HCCs occur without cirrhosis; cirrhosis magnifies risk from other causes rather than being required", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c067, section: traps, statement: "Pseudoglandular spaces in HCC are not true glands", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c068, section: traps, statement: "AFP is also elevated in other benign and malignant liver diseases", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c069, section: traps, statement: "A trabecular or pseudoglandular pattern carries no particular prognostic information", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c070, section: traps, statement: "Fibrolamellar HCC typically affects adolescents and young adults, and the liver is non-cirrhotic", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: hepatocellular-carcinoma-c071, section: mnemonics, statement: "Aflatoxin, cirrhosis, HBV/HCV and hemochromatosis are established HCC risk factors", sourceRef: {source: rubin-8e, chapter: "20", pages: "890"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
