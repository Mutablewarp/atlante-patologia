entity: pericardial-disease
claims:
  - { claimId: pericardial-disease-c001, section: definition, statement: "Pericardial disease includes fluid collecting in the pericardial sac and inflammation of the pericardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691-692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c002, section: definition, statement: "A pericardial effusion is extra fluid in the sac, either a transudate or an exudate.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c003, section: definition, statement: "In cardiac tamponade pericardial fluid builds up so quickly that filling of the heart is restricted.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c004, section: definition, statement: "Pericarditis is inflammation of the pericardium, whether it affects the layer on the heart or the one lining the sac.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c005, section: definition, statement: "In constrictive pericarditis scar tissue stiffens the pericardium, so the heart is compressed and fills poorly.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c006, section: etiology, statement: "Heart failure and nephrotic syndrome raise extracellular fluid volume, and a serous pericardial effusion often accompanies that rise.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c007, section: etiology, statement: "A chylous effusion is rich in chylomicrons and follows tumor or infection that blocks lymphatics so that the thoracic duct opens into the sac.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c008, section: etiology, statement: "Chest injury, including injury during resuscitation, may lead to a blood-tinged serosanguineous pericardial effusion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c009, section: etiology, statement: "Hemopericardium, blood entering the sac directly, is most often caused by a ruptured ventricular free wall in an infarct.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c010, section: etiology, statement: "Hemopericardium also follows penetrating cardiac wounds and rupture of an aortic dissection.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c011, section: etiology, statement: "Undiagnosed viral infection is the usual explanation for most acute pericarditis, which is therefore labeled idiopathic.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691-692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c012, section: etiology, statement: "Myocardial infarction and rheumatic fever can both be complicated by pericarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c013, section: etiology, statement: "Antibiotics have made bacterial pericarditis unusual.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c014, section: etiology, statement: "Widespread dialysis has made uremic fibrinous pericarditis rare in the United States.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c015, section: etiology, statement: "Malignant pericardial effusions arise most often from breast or lung cancer metastases.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c016, section: etiology, statement: "Cardiac surgery and earlier mediastinal radiation are known causes of constrictive pericarditis, but in developed countries most cases have no identified cause.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c017, section: etiology, statement: "A purulent or tuberculous infection precedes some cases of constrictive pericarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c018, section: etiology, statement: "Outside industrialized countries tuberculosis is still the main cause of constrictive pericarditis, whereas within them it is a minor one.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c019, section: pathogenesis, statement: "Slowly accumulating fluid, even in large volume, is accommodated with little effect on circulation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c020, section: pathogenesis, statement: "As little as 150 to 200 mL of fluid or blood collecting fast raises sac pressure and hinders filling, mainly of the right heart.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c021, section: pathogenesis, statement: "Cardiac output and blood pressure drop because venous return is limited once the pressure around the heart exceeds central venous pressure.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c022, section: pathogenesis, statement: "After an acute pericardial injury healing can overshoot, and constrictive pericarditis is that scar rather than ongoing inflammation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c023, section: pathogenesis, statement: "Healing can be gentle: in adhesive pericarditis only a few fibrous strands tie the two layers together.", sourceRef: { source: rubin-8e, chapter: "17", pages: "693" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c024, section: gross, statement: "Most acute cases are fibrinous: a layer of fibrin leaves the pericardium dull and rough instead of shiny.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c025, section: gross, statement: "Purulent pericarditis produces an exudate that looks like pus.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c026, section: gross, statement: "Hemorrhagic pericarditis is the bloody form, seen with coagulation disorders and aggressive infections or tumors.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c027, section: gross, statement: "Fresh blood distends the pericardial cavity in hemopericardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c028, section: gross, statement: "In constrictive pericarditis no pericardial space remains; hard scar tissue binds both layers into a shell around the heart.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c029, section: gross, statement: "A sufficiently thick pericardial scar can narrow the openings of the venae cavae.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c030, section: gross, statement: "Calcium may be deposited in the fibrous scar of constrictive pericarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c031, section: micro, statement: "In fibrinous pericarditis the pericardial infiltrate is mostly mononuclear cells.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c032, section: micro, statement: "Neutrophils fill the exudate of purulent pericarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c033, section: micro, statement: "The fluid of a serous pericardial effusion holds little protein and few cells.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c034, section: micro, statement: "A constrictive pericardium is dense fibrous tissue rather than an active inflammatory infiltrate.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c035, section: ancillary, statement: "Surfaces and fluid, seen grossly and microscopically, decide whether acute pericarditis is fibrinous, purulent or hemorrhagic.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c036, section: ancillary, statement: "Fluid in fibrinous pericarditis is usually rich in protein, while serous effusion fluid has little.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691-692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c037, section: clinical, statement: "Severe chest pain behind the sternum, of sudden onset, typically opens acute pericarditis; neck, shoulder or back may hurt too.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c038, section: clinical, statement: "Pericarditis pain, unlike angina or infarct pain, does not travel down the left arm.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c039, section: clinical, statement: "The pericardial friction rub comes from inflamed pericardial surfaces that have turned rough.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c040, section: clinical, statement: "The ECG in acute pericarditis shows repolarization abnormalities of the myocardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c041, section: clinical, statement: "Tamponade may cause hardly any symptoms or may end in sudden circulatory collapse and death.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c042, section: clinical, statement: "Nearly all patients with tamponade show pulsus paradoxus, an exaggerated fall of systolic pressure during inspiration.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c043, section: clinical, statement: "Constrictive pericarditis leaves a small, quiet heart: the unyielding sac does not let it fill during diastole.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c044, section: clinical, statement: "Constrictive pericarditis brings high venous pressure, with ascites and peripheral edema.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c045, section: diagnosis, statement: "Sudden severe chest pain, a friction rub and repolarization changes on the ECG characterize acute pericarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c046, section: diagnosis, statement: "Pericarditis pain that spares the left arm distinguishes it from angina or infarction pain.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c047, section: diagnosis, statement: "Constrictive pericarditis resembles right heart failure.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c048, section: diagnosis, statement: "Needle pericardiocentesis relieves tamponade by removing pericardial fluid.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c049, section: prognosis, statement: "Unless the fluid is drained, by needle or by surgery, acute tamponade is nearly always fatal.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c050, section: prognosis, statement: "Viral or idiopathic pericarditis resolves spontaneously; constriction seldom follows.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c051, section: prognosis, statement: "Constrictive pericarditis is best treated by surgical removal of the whole pericardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c052, section: prognosis, statement: "Adhesive pericarditis is commonly found incidentally at autopsy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "693" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c053, section: differential, statement: "Infarct pain travels down the left arm; pericarditis pain does not.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c054, section: differential, statement: "Constrictive pericarditis resembles right heart failure but the heart is small and quiet within a rigid pericardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c055, section: differential, statement: "Pericarditis and myocarditis have largely overlapping causes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c056, section: differential, statement: "Rupture of a dissecting aortic aneurysm can cause hemopericardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c057, section: high-yield, statement: "Cardiac tamponade is fluid building up so fast around the heart that filling is restricted.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c058, section: high-yield, statement: "Pulsus paradoxus occurs in almost all patients with tamponade.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c059, section: high-yield, statement: "Fibrinous pericarditis is the most common acute form and its rough surfaces cause a friction rub.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c060, section: high-yield, statement: "Most acute pericarditis is idiopathic and attributed to viral infection.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c061, section: high-yield, statement: "Constrictive pericarditis is a fibrotic result of healing, not an active inflammation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c062, section: high-yield, statement: "The most common cause of hemopericardium is ventricular free wall rupture at an infarct.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c063, section: traps, statement: "Slow build-up is tolerated even when large; a small, fast build-up can squeeze the heart and impede filling.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c064, section: traps, statement: "Constrictive pericarditis is the fibrous outcome of healing after acute pericardial injury, not active inflammation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c065, section: traps, statement: "The pain of pericarditis is not felt down the left arm.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c066, section: traps, statement: "Most acute pericarditis is idiopathic and attributed to viral infection, and bacterial pericarditis is unusual.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c067, section: traps, statement: "Hemopericardium is most often due to a ruptured ventricular free wall after infarction; trauma is a less frequent cause.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pericardial-disease-c068, section: mnemonics, statement: "Acute pericarditis can be fibrinous (most common, with a rub), purulent (neutrophils) or hemorrhagic.", sourceRef: { source: rubin-8e, chapter: "17", pages: "692" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
