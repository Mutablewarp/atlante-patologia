entity: bacterial-pneumonia
claims:
- { claimId: bacterial-pneumonia-c001, section: definition, statement: "Bacterial inflammation of the lung parenchyma leaves the lung solid, or consolidated", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c002, section: definition, statement: "In lobar pneumonia one entire lobe becomes consolidated", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c003, section: definition, statement: "Bronchopneumonia is patchy, with the solid areas hugging the airways in one lobe or several", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c004, section: definition, statement: "The two terms lobar pneumonia and bronchopneumonia are of little clinical importance now", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c005, section: definition, statement: "Grouping bacterial pneumonias by organism is preferred because the organism often determines the picture and the treatment", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c006, section: definition, statement: "Pneumonia in defective immunity is opportunistic, pneumonia developing in hospital is nosocomial, and pneumonia arising outside hospital in people without a primary immune disorder is community-acquired", sourceRef: { source: rubin-8e, chapter: "18", pages: "703-704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c007, section: etiology, statement: "Aspiration of secretions is the usual route; the bacteria already live in the patient's oropharynx and nasopharynx", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c008, section: etiology, statement: "Besides aspiration, bacteria can arrive by blood from an infectious focus elsewhere or by inhalation from the environment, and rarely by extension from an adjacent site", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c009, section: etiology, statement: "Smoking, alcoholism and chronic illnesses such as poorly controlled diabetes depress host defenses and predispose to pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c010, section: etiology, statement: "Lobar pneumonia was traditionally caused by S. pneumoniae", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c011, section: etiology, statement: "Klebsiella pneumoniae is the sole other bacterium that commonly produces a lobar pattern", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c012, section: etiology, statement: "Klebsiella pneumonia is favored by diabetes and chronic lung disease and occurs mostly in middle-aged men, often alcoholic", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c013, section: etiology, statement: "S. aureus often infects the lung on top of influenza or another viral airway infection", sourceRef: { source: rubin-8e, chapter: "18", pages: "705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c014, section: etiology, statement: "Group A S. pyogenes pneumonia is occasionally met in debilitated patients and typically follows a viral respiratory infection", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c015, section: etiology, statement: "Legionella lives in water, and outbreaks were traced to contaminated cooling towers and similar sources", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c016, section: etiology, statement: "AIDS and immunosuppressive drugs have made gram-negative pneumonia, chiefly E. coli and P. aeruginosa, more common", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c017, section: etiology, statement: "Even without immunosuppression, abdominal or urogenital surgery can let blood-borne E. coli seed the lung", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c018, section: etiology, statement: "Pseudomonas pneumonia is seen most often in patients with cystic fibrosis or burns and in immunocompromised patients", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c019, section: etiology, statement: "Mouth anaerobes such as Bacteroides are aspirated when swallowing fails, for example in anesthesia or seizures", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c020, section: pathogenesis, statement: "A viral upper respiratory infection increases bronchial secretions, in which pneumococci from the nasopharynx multiply readily", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c021, section: pathogenesis, statement: "Inflammation begins once watery secretions wash the pneumococci into the alveoli", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c022, section: pathogenesis, statement: "Alcohol intoxication or anesthesia can impair the epiglottic reflexes so that pneumococci are aspirated", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c023, section: pathogenesis, statement: "Because the capsule resists phagocytosis, alveolar macrophages ingest pneumococci only after opsonization", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c024, section: pathogenesis, statement: "In the first stage, fluid loaded with protein and organisms floods the alveoli", sourceRef: { source: rubin-8e, chapter: "18", pages: "704-705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c025, section: pathogenesis, statement: "In red hepatization neutrophils and blood flood the alveoli and the congested lung becomes firm like liver", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c026, section: pathogenesis, statement: "Gray hepatization: congestion has diminished yet the lung remains firm, while lysed neutrophils are cleared by macrophages", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c027, section: pathogenesis, statement: "Resolution is the slow recovery of normal lung once the alveolar exudate has been cleared", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c028, section: pathogenesis, statement: "In bronchopneumonia the terminal and respiratory bronchioles are inflamed and neutrophils fill the alveoli beside them", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c029, section: pathogenesis, statement: "Bronchopneumonia usually arises in the dependent, posterior parts of the lung and typically affects terminally ill patients", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c030, section: pathogenesis, statement: "With antibiotic therapy, lobar pneumonia tends to involve more than one lobe, each incompletely", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c031, section: gross, statement: "In lobar pneumonia, shown at red hepatization, an entire lobe is solid while the neighboring lobe is normally aerated", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c032, section: gross, statement: "In bronchopneumonia each separate patch of consolidation sits around a bronchus or bronchiole", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c033, section: gross, statement: "Thick bacterial capsules make Klebsiella-infected lung look mucoid on the cut surface", sourceRef: { source: rubin-8e, chapter: "18", pages: "705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c034, section: gross, statement: "The enlarged infected lobe pushes its fissure out toward the healthy lung", sourceRef: { source: rubin-8e, chapter: "18", pages: "705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c035, section: gross, statement: "Klebsiella lung infection is prone to necrosis and abscesses", sourceRef: { source: rubin-8e, chapter: "18", pages: "705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c036, section: gross, statement: "Staphylococcal pneumonia leaves the lung with many small abscesses", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c037, section: gross, statement: "A pneumatocele is a thin-walled cyst formed when an abscess drains into an airway and inhaled air inflates it", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c038, section: gross, statement: "Lungs in fatal streptococcal pneumonia are waterlogged with bloody edema rather than dry and hepatized", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c039, section: micro, statement: "In pneumococcal pneumonia the alveolar exudate consists of neutrophils and occasional macrophages", sourceRef: { source: rubin-8e, chapter: "18", pages: "705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c040, section: micro, statement: "In Legionella pneumonia the alveolar exudate holds fibrin, with neutrophils dominating in some cases and macrophages in others", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c041, section: micro, statement: "Pseudomonas packs vessel walls, causing a vasculitis that can infarct the lung", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c042, section: ancillary, statement: "Microscopically, the alveolar contents indicate the stage of pneumococcal pneumonia: edema with organisms, then neutrophils with hemorrhage, then macrophages clearing debris", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c043, section: ancillary, statement: "Legionella is hard to demonstrate without silver or immunofluorescent stains, despite being gram-negative", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c044, section: clinical, statement: "An abrupt onset with fever and chills marks pneumococcal pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c045, section: clinical, statement: "Pleural involvement commonly causes chest pain in pneumococcal pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c046, section: clinical, statement: "Altered blood in the alveolar spaces gives the sputum its characteristic rusty appearance", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c047, section: clinical, statement: "Symptoms improve fast on current therapy, but the radiograph lags several days behind", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c048, section: clinical, statement: "Klebsiella pneumonia may be more dangerous than the pneumococcal form even though its onset is less dramatic", sourceRef: { source: rubin-8e, chapter: "18", pages: "705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c049, section: clinical, statement: "Streptococcal pneumonia begins abruptly with hemoptysis, breathlessness and fever, often with cyanosis", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c050, section: clinical, statement: "Legionella pneumonia often begins abruptly, and abdominal pain, surprisingly, accompanies the fever and myalgia", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c051, section: diagnosis, statement: "Chest radiographs of pneumococcal pneumonia show opaque lobes or segments because exudate fills the alveoli", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c052, section: diagnosis, statement: "Legionella films are inconsistent, but a focal alveolar pattern, sometimes in both lungs, is typical", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c053, section: prognosis, statement: "Pneumococcal pneumonia spreads easily to the pleura, so pleuritis, often painful, is frequent", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c054, section: prognosis, statement: "Fluid in the pleural space is frequent, yet it normally clears up", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c055, section: prognosis, statement: "Empyema is an infected pleural effusion that has turned purulent, and it can heal with widespread fibrosis", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c056, section: prognosis, statement: "Pneumococcal pneumonia can seed the blood early on, and endocarditis or meningitis may follow", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c057, section: prognosis, statement: "Pneumococcal bacteremia frequently kills patients who have lost their spleen", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c058, section: prognosis, statement: "Rarely, the exudate is replaced by granulation tissue that plugs the alveoli, called organizing pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c059, section: prognosis, statement: "Carnification, also rare, is a shrunken firm lobe resulting from increasing alveolar fibrosis", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c060, section: prognosis, statement: "Pneumococcal pneumonia only uncommonly leads to a lung abscess", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c061, section: prognosis, statement: "Bronchopleural fistula is a serious complication of Klebsiella pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c062, section: prognosis, statement: "Rupture of a staphylococcal pneumatocele into the pleura can cause tension pneumothorax", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c063, section: prognosis, statement: "Lung abscesses are a frequent consequence of the necrotizing pneumonias caused by anaerobes", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c064, section: prognosis, statement: "Lung gangrene results from infarction after thrombosis of a pulmonary artery branch", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c065, section: prognosis, statement: "Lung gangrene is an emergency treated by resecting the diseased lung", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c066, section: differential, statement: "Compared with lobar pneumonia, atypical pneumonia starts slowly, with little or no rise in white cells, and runs a long course", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c067, section: differential, statement: "Mycoplasma typically produces bronchiolitis in which the bronchiolar walls are heavily infiltrated by lymphocytes and plasma cells and the lumen holds neutrophilic exudate", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c068, section: differential, statement: "Blood serology for Mycoplasma antibodies or cold agglutinins is the usual way to diagnose Mycoplasma infection", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c069, section: differential, statement: "Primary tuberculosis begins with a peripheral granuloma in the lung tissue, called the Ghon lesion", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c070, section: differential, statement: "Tuberculosis microscopy shows a granuloma with central caseous necrosis", sourceRef: { source: rubin-8e, chapter: "18", pages: "707" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c071, section: high-yield, statement: "Bronchopneumonia shows scattered foci around airways, whereas lobar pneumonia consolidates a whole lobe", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c072, section: high-yield, statement: "S. pneumoniae is the traditional cause of lobar pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c073, section: high-yield, statement: "Pneumococcal lobar pneumonia passes through edema/congestion, red hepatization, gray hepatization and resolution", sourceRef: { source: rubin-8e, chapter: "18", pages: "704-705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c074, section: high-yield, statement: "Klebsiella gives a mucoid cut surface, bulging fissure and tendency to abscess, mostly in alcoholic men", sourceRef: { source: rubin-8e, chapter: "18", pages: "704-705" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c075, section: high-yield, statement: "S. aureus pneumonia forms abscesses and pneumatoceles and follows influenza or complicates cystic fibrosis", sourceRef: { source: rubin-8e, chapter: "18", pages: "705-706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c076, section: high-yield, statement: "Aspirated oral anaerobes cause necrotizing pneumonia that leads to abscess and gangrene", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c077, section: high-yield, statement: "Pneumococcal pneumonia may be complicated by pleuritis, empyema, bacteremia and organizing pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c078, section: traps, statement: "Community-acquired describes pneumonia acquired outside hospital; the term is sometimes loosely applied to lobar pneumonia", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c079, section: traps, statement: "In gray hepatization the lung is still firm; it returns to normal only after the exudate is removed", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c080, section: traps, statement: "Klebsiella is the only other common cause of lobar pneumonia besides pneumococcus", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c081, section: traps, statement: "Hepatization is absent in streptococcal pneumonia; the lungs are heavy with bloody edema instead", sourceRef: { source: rubin-8e, chapter: "18", pages: "706" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c082, section: traps, statement: "Aspiration from the throat is the usual way pneumonia bacteria enter the lungs", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c083, section: traps, statement: "Bronchopneumonia mainly affects terminally ill patients, and deaths from it remain common", sourceRef: { source: rubin-8e, chapter: "18", pages: "703" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: bacterial-pneumonia-c084, section: mnemonics, statement: "Lobar pneumonia stages in order are edema/congestion, red hepatization, gray hepatization, resolution", sourceRef: { source: rubin-8e, chapter: "18", pages: "704" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
