entity: amyloidosis
claims:
  - { claimId: amyloidosis-c001, section: definition, statement: "Because proteins misfold, an insoluble fibrous material accumulates in the spaces between cells throughout tissues and organs; this is amyloidosis.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c003, section: definition, statement: "Diagnosis requires naming the misfolded protein, since amyloid of different protein types cannot be told apart on H&E or Congo red.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c004, section: definition, statement: "Light chains make up the fibrils of AL, and in general the protein forming the fibrils now defines each amyloid type.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c005, section: definition, statement: "Amyloid that stays at the site where its precursor is synthesized is localized; amyloid deposited in organs distant from the producing cells is systemic.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c006, section: definition, statement: "AA is the only amyloidosis type that occurs in children.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c007, section: definition, statement: "Long-term dialysis is the setting in which Aβ2M amyloidosis occurs.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c008, section: etiology, statement: "AL usually stems from a plasma cell dyscrasia, isolated or together with multiple myeloma, and its fibrils are monoclonal immunoglobulin light chains.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c009, section: etiology, statement: "AA fibrils derive from serum amyloid A, an acute-phase protein made in the liver.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c010, section: etiology, statement: "Rheumatic disorders and persistent infections such as tuberculosis are the commonest settings of AA amyloidosis, and fibrils usually form only after several years of inflammatory disease.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c011, section: etiology, statement: "ATTR is caused by transthyretin; inherited amyloidogenic variants are transmitted as autosomal dominant traits.", sourceRef: { source: rubin-8e, chapter: "15", pages: "584" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c012, section: etiology, statement: "When unmutated transthyretin aggregates in older people, the resulting systemic amyloidosis falls chiefly on the heart.", sourceRef: { source: rubin-8e, chapter: "15", pages: "584" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c013, section: etiology, statement: "Aβ2M amyloid is formed from β2-microglobulin in patients on long-term hemodialysis.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583, 585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c014, section: etiology, statement: "Localized amyloidoses include calcitonin in medullary thyroid carcinoma, islet amyloid polypeptide in the diabetic pancreas and amyloid β protein in Alzheimer disease.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c016, section: pathogenesis, statement: "The exact route of fibril formation is unknown and may differ between types; a proposed shared path runs from a partly unfolded precursor through oligomers to larger polymers.", sourceRef: { source: rubin-8e, chapter: "15", pages: "584" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c023, section: gross, statement: "Thickened walls enlarge the amyloid heart without dilating its cavities, and the walls are firm and rubbery.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c025, section: micro, statement: "Under the light microscope amyloid is amorphous eosinophilic material.", sourceRef: { source: rubin-8e, chapter: "22", pages: "935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c028, section: ancillary, statement: "Amyloid fibrils must be demonstrated in a tissue biopsy to diagnose the disease, and an abdominal fat aspirate is the least invasive way to get tissue.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c030, section: ancillary, statement: "Under polarized light, amyloid stained with Congo red shows apple-green birefringence.", sourceRef: { source: rubin-8e, chapter: "22", pages: "935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c031, section: ancillary, statement: "Immunohistochemical tests are needed to differentiate the amyloid types.", sourceRef: { source: rubin-8e, chapter: "22", pages: "935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c033, section: ancillary, statement: "AL and ATTR cardiac amyloid look alike histologically in heart biopsies, and mass spectrometry can distinguish them.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c034, section: ancillary, statement: "Sequencing of the TTR gene finds the exact mutation after isoelectric focusing, which can usually detect variant TTR, is abnormal.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c035, section: clinical, statement: "Nearly every tissue except the brain can be involved in AL amyloidosis, but the kidneys and heart are the usual targets.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c036, section: clinical, statement: "In AL, kidney function declines progressively, and nephrotic syndrome is the usual presentation of renal involvement.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c037, section: clinical, statement: "Restrictive cardiomyopathy from amyloid in the heart stiffens the ventricles, and heart failure progresses rapidly.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c039, section: clinical, statement: "An enlarged tongue is a hallmark of AL amyloidosis even though only a minority of patients have it.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c040, section: clinical, statement: "Cardiomyopathy is rare in AA amyloidosis, whose main presentation is proteinuria or renal insufficiency.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c041, section: clinical, statement: "Familial ATTR can hardly be separated from AL by clinical features alone.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c044, section: clinical, statement: "Carpal tunnel syndrome is usually the earliest symptom of Aβ2M amyloidosis, which presents as bone and joint disease.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c045, section: diagnosis, statement: "In the large majority of AL patients a clonal immunoglobulin, or light chains circulating free, is detectable by blood or urine tests.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c046, section: diagnosis, statement: "Because MGUS is common in older people, a monoclonal protein in the blood is not by itself diagnostic of amyloidosis.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585, 586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c048, section: diagnosis, statement: "An inherited form of amyloidosis must be excluded in a patient with neither a clonal plasma cell disorder nor AA disease.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c050, section: prognosis, statement: "With myocardial involvement and impaired cardiac function or arrhythmias, untreated AL median survival is about 6 months, against about 1 to 2 years from diagnosis for AL overall.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c051, section: prognosis, statement: "Treatment of AL has mostly aimed at the plasma cells that produce the amyloidogenic light chain.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c052, section: prognosis, statement: "Liver transplantation is the major treatment for ATTR, and thyroxine mimetics can stabilize TTR tetramers.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587, 588" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c054, section: differential, statement: "Amyloid is PAS negative and picked out by Congo red, which separates it from diabetic glomerulosclerosis, whose nodules it can mimic.", sourceRef: { source: rubin-8e, chapter: "22", pages: "936" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c055, section: differential, statement: "In monoclonal immunoglobulin deposition disease the nodular material does not stain with Congo red, unlike amyloidosis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "936" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c056, section: differential, statement: "Distinguishing amyloid from hypertensive cardiomyopathy is difficult without an endomyocardial biopsy.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c058, section: high-yield, statement: "Amyloid shows apple-green birefringence with Congo red under polarized light, but all types look alike on this stain.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582, 935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c059, section: high-yield, statement: "The amyloid type must be established precisely because it guides diagnosis and therapy; immunohistochemistry and mass spectrometry are the tools used.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585, 935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c060, section: high-yield, statement: "AL is light chains, AA serum amyloid A, ATTR transthyretin, Aβ2M β2-microglobulin in dialysis.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c063, section: traps, statement: "H&E and Congo red cannot distinguish the amyloid types, so only identifying the protein does.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c064, section: traps, statement: "With amyloid confirmed on biopsy, a monoclonal protein makes AL strongly suspected, but alone it is not diagnostic because many older people have MGUS.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585, 586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c066, section: mnemonics, statement: "Four of the systemic types are AL (light chains), AA (serum amyloid A), ATTR (transthyretin) and Aβ2M (β2-microglobulin in dialysis).", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
