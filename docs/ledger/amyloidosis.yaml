entity: amyloidosis
claims:
  - { claimId: amyloidosis-c001, section: definition, statement: "Amyloidosis is a family of misfolding diseases in which an insoluble fibrous protein builds up in the spaces between cells of tissues and organs.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c003, section: definition, statement: "Amyloid of different protein types cannot be told apart on H&E or Congo red, so diagnosis requires identifying the misfolded protein.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c004, section: definition, statement: "Amyloid types are now defined by the protein forming the fibrils; light chains define AL.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c005, section: definition, statement: "Localized amyloid forms where the precursor is synthesized; systemic amyloid deposits in organs distant from the producing cells.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c006, section: definition, statement: "AA is the only amyloidosis type that occurs in children.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c007, section: definition, statement: "Aβ2M amyloidosis arises in people kept on dialysis for many years.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c008, section: etiology, statement: "AL fibrils are monoclonal immunoglobulin light chains, usually arising from a plasma cell dyscrasia, isolated or together with multiple myeloma.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c009, section: etiology, statement: "AA fibrils derive from serum amyloid A, an acute-phase protein made in the liver.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c010, section: etiology, statement: "AA amyloidosis arises after prolonged inflammatory disease; rheumatic disorders and persistent infections such as tuberculosis are the commonest settings.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c011, section: etiology, statement: "ATTR is caused by transthyretin; inherited amyloidogenic variants are transmitted as autosomal dominant traits.", sourceRef: { source: rubin-8e, chapter: "15", pages: "584" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c012, section: etiology, statement: "Unmutated transthyretin can aggregate in older people and cause a systemic amyloidosis that chiefly involves the heart.", sourceRef: { source: rubin-8e, chapter: "15", pages: "584" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c013, section: etiology, statement: "Aβ2M amyloid is formed from β2-microglobulin in patients on long-term hemodialysis.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583, 585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c014, section: etiology, statement: "Localized amyloidoses include amyloid β protein in Alzheimer disease, islet amyloid polypeptide in the diabetic pancreas and calcitonin in medullary thyroid carcinoma.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c016, section: pathogenesis, statement: "Studies suggest a shared route to fibrils: a precursor protein loses part of its fold, assembles into small oligomers, then into larger polymer assemblies.", sourceRef: { source: rubin-8e, chapter: "15", pages: "584" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c023, section: gross, statement: "In cardiac amyloidosis the heart is enlarged and its walls are bulky and stiff with a rubbery consistency, while the cavities are not dilated.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c025, section: micro, statement: "Under the light microscope amyloid is amorphous eosinophilic material.", sourceRef: { source: rubin-8e, chapter: "22", pages: "935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c028, section: ancillary, statement: "Diagnosis requires a biopsy in which amyloid fibrils are seen; aspirating abdominal fat is the gentlest way to obtain tissue.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c030, section: ancillary, statement: "Congo red stained amyloid shows apple-green birefringence under polarized light.", sourceRef: { source: rubin-8e, chapter: "22", pages: "935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c031, section: ancillary, statement: "Immunohistochemical tests are needed to differentiate the amyloid types.", sourceRef: { source: rubin-8e, chapter: "22", pages: "935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c033, section: ancillary, statement: "Mass spectrometry can separate AL from ATTR amyloid in heart biopsies, where the two look alike histologically.", sourceRef: { source: rubin-8e, chapter: "17", pages: "686" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c034, section: ancillary, statement: "When isoelectric focusing shows an abnormal TTR, the TTR gene is sequenced to find the exact mutation.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c035, section: clinical, statement: "In AL amyloidosis the kidneys and heart are the usual targets; nearly every other tissue can be involved, except the brain.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c036, section: clinical, statement: "In AL, kidney involvement most often shows up as nephrotic syndrome, and kidney function declines over time.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c037, section: clinical, statement: "When amyloid infiltrates the heart, the ventricles stiffen (restrictive cardiomyopathy) and heart failure worsens quickly.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c039, section: clinical, statement: "An enlarged tongue is a characteristic sign of AL amyloidosis, although only some patients have it.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c040, section: clinical, statement: "AA amyloidosis presents mainly with proteinuria or renal insufficiency, and cardiomyopathy is rare.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c041, section: clinical, statement: "Familial ATTR can hardly be separated from AL by clinical features alone.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c044, section: clinical, statement: "Aβ2M amyloidosis presents with bone and joint disease, and carpal tunnel syndrome is usually the earliest symptom.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c045, section: diagnosis, statement: "Blood or urine tests detect a clonal immunoglobulin, or light chains circulating free, in the large majority of AL patients.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c046, section: diagnosis, statement: "Finding a monoclonal protein in the blood does not by itself establish amyloidosis, since many older people have MGUS.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585, 586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c048, section: diagnosis, statement: "When neither a clonal plasma cell disorder nor AA disease is found, an inherited form of amyloidosis must be ruled out.", sourceRef: { source: rubin-8e, chapter: "15", pages: "586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c050, section: prognosis, statement: "Without treatment AL median survival is about 1 to 2 years from diagnosis, and about 6 months with myocardial involvement and impaired cardiac function or arrhythmias.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c051, section: prognosis, statement: "AL treatment has largely targeted the plasma cells that produce the amyloidogenic light chain.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c052, section: prognosis, statement: "ATTR is treated mainly by liver transplantation, and thyroxine mimetics stabilize TTR tetramers.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587, 588" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c054, section: differential, statement: "Amyloid deposits can form nodules that mimic diabetic glomerulosclerosis; amyloid is PAS negative and picked out by Congo red.", sourceRef: { source: rubin-8e, chapter: "22", pages: "936" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c055, section: differential, statement: "In monoclonal immunoglobulin deposition disease the nodular material does not stain with Congo red, unlike amyloidosis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "936" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c056, section: differential, statement: "Distinguishing amyloid from hypertensive cardiomyopathy is difficult without an endomyocardial biopsy.", sourceRef: { source: rubin-8e, chapter: "15", pages: "587" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c058, section: high-yield, statement: "Amyloid shows apple-green birefringence with Congo red under polarized light, but all types look alike on this stain.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582, 935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c059, section: high-yield, statement: "The amyloid type must be established precisely because it guides diagnosis and therapy; immunohistochemistry and mass spectrometry are the tools used.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585, 935" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c060, section: high-yield, statement: "AL is light chains, AA serum amyloid A, ATTR transthyretin, Aβ2M β2-microglobulin in dialysis.", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c063, section: traps, statement: "Different amyloid types are indistinguishable by H&E and Congo red, so the protein must be identified.", sourceRef: { source: rubin-8e, chapter: "15", pages: "582" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c064, section: traps, statement: "Many older people have MGUS, so a monoclonal protein alone is not diagnostic; with amyloid confirmed on biopsy, it makes AL strongly suspected.", sourceRef: { source: rubin-8e, chapter: "15", pages: "585, 586" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: amyloidosis-c066, section: mnemonics, statement: "Four of the systemic types are AL (light chains), AA (serum amyloid A), ATTR (transthyretin) and Aβ2M (β2-microglobulin in dialysis).", sourceRef: { source: rubin-8e, chapter: "15", pages: "583" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
