entity: thrombosis
claims:
- {claimId: thrombosis-c001, section: definition, statement: "A thrombus is a clot that develops inside a vessel lumen and consists of fibrin, platelets and blood cells caught in the meshwork", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c002, section: definition, statement: "A thrombus adheres to the vascular endothelium", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c003, section: definition, statement: "Coagulation can be activated without a thrombus: a plain clot can appear in a test tube or in a dead body", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c004, section: definition, statement: "A hematoma comes from hemorrhage with clotting outside the vascular system", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c005, section: etiology, statement: "Endothelial injury, stasis and a hypercoagulable state are the three factors favoring thrombosis", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c006, section: etiology, statement: "Arterial thrombosis mostly affects the arteries commonly hit by atherosclerosis: coronary, cerebral, mesenteric, renal and leg arteries", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c008, section: etiology, statement: "Thrombi are common in aortic aneurysms, where disturbed flow and vascular disease promote thrombosis", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c009, section: etiology, statement: "Vascular stasis (heart failure, bed rest, postoperative immobilization, travel) favors DVT", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c010, section: etiology, statement: "Injury and inflammation (trauma, surgery, childbirth, infection) favor DVT", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c011, section: etiology, statement: "Hypercoagulability in DVT includes exogenous hormones, late pregnancy, cancer and inherited thrombophilic disorders", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c012, section: etiology, statement: "Left ventricular mural thrombi sit over infarcted myocardium after myocardial infarction", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c013, section: etiology, statement: "Atrial fibrillation stalls atrial flow and favors thrombus, most often in the left atrial appendage", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c014, section: etiology, statement: "Primary myocardial diseases are associated with left ventricular mural thrombi", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c016, section: pathogenesis, statement: "Endothelial injury is the event that triggers most thrombosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c017, section: pathogenesis, statement: "Injury increases platelet adhesiveness, then platelets interact to form an aggregate", sourceRef: {source: rubin-8e, chapter: "16", pages: "597"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c019, section: pathogenesis, statement: "Activated platelets release ADP and thromboxane A2, which recruit more platelets", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c020, section: pathogenesis, statement: "Fibrin holds together the enlarging platelet aggregate", sourceRef: {source: rubin-8e, chapter: "16", pages: "597"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c021, section: pathogenesis, statement: "The end of coagulation is thrombin-catalyzed conversion of soluble fibrinogen to insoluble fibrin", sourceRef: {source: rubin-8e, chapter: "16", pages: "596"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c023, section: pathogenesis, statement: "Endothelial PGI2 and nitric oxide inhibit platelet aggregation", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c025, section: pathogenesis, statement: "Thrombin binding thrombomodulin activates protein C, which destroys factors V and VIII", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c027, section: pathogenesis, statement: "If flow is good, stripping endothelium leads only to platelets lining the surface, not to a thrombus", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c028, section: pathogenesis, statement: "Turbulence at an aneurysm or bifurcation, and slow flow in narrowed arteries, favor arterial thrombosis", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c029, section: pathogenesis, statement: "Increased coagulability occurs in polycythemia vera, promyelocytic leukemia and some cancers", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c030, section: pathogenesis, statement: "Among gene variants tied to venous thrombosis, factor V Leiden is the commonest", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c032, section: pathogenesis, statement: "Prothrombin G20210A is a common but mild risk factor", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c033, section: pathogenesis, statement: "Lack of protein C, protein S or antithrombin is uncommon but carries a high risk of DVT", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c034, section: pathogenesis, statement: "The reference states that genetic factors account for 60% of DVT risk", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c035, section: gross, statement: "A new arterial thrombus stuck to the vessel wall is deep red in color and soft, crumbling easily", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c036, section: gross, statement: "Lines of Zahn are thin repeating yellowish layers made of platelets and fibrin", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c037, section: gross, statement: "Lines of Zahn are linked to a thrombus formed during life", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c038, section: gross, statement: "Organization makes a thrombus firm and grayish white", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c039, section: gross, statement: "Postmortem clots are gelatinous and develop in stagnant blood", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c040, section: gross, statement: "The red cell-rich part of a postmortem clot is reddish and gelatinous, called currant jelly", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c041, section: gross, statement: "The upper part of a postmortem clot, called chicken fat, is plasma coagulated without red cells, pale yellow and firmer than the red layer", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c042, section: micro, statement: "A thrombus has a tight platelet-fibrin structure and contains leukocytes and red cells (leukocytes and red cells: ch. 16 p. 596)", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c043, section: micro, statement: "The organized structure of a thrombus differs from a postmortem or test-tube clot", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c044, section: micro, statement: "Smooth muscle cells, endothelium and fibroblasts migrate into cross-linked fibrin and produce extracellular matrix", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c046, section: micro, statement: "Canalization is the formation of new endothelium-lined lumina in an organized thrombus", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c047, section: ancillary, statement: "At autopsy and in forensic work it is often important to decide whether a clot formed before or after death", sourceRef: {source: rubin-8e, chapter: "7", pages: "329-330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c048, section: clinical, statement: "Most arterial thrombi block the vessel lumen and often lead to infarction of the tissue the artery supplies", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c049, section: clinical, statement: "Thrombosis at a coronary plaque gives myocardial infarction and at a cerebral plaque gives cerebral infarction", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c050, section: clinical, statement: "Mesenteric thrombosis gives intestinal infarction, renal gives kidney infarcts, leg arteries give ischemic leg and gangrene", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c051, section: clinical, statement: "Small calf vein thrombi are ordinarily asymptomatic and larger iliofemoral ones may cause no symptoms", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c052, section: clinical, statement: "Forced dorsiflexion of the foot provokes calf tenderness in some patients (Homan sign)", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c053, section: clinical, statement: "Blocking the femoral or iliac vein produces a congested, swollen, bluish leg", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c054, section: clinical, statement: "Superior mesenteric, cerebral and hepatic vein thrombosis cause hemorrhagic bowel infarction, limited cerebral flow and Budd-Chiari syndrome", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c055, section: clinical, statement: "Acute pulmonary embolism can be asymptomatic or small, cause dyspnea, cause infarction, or trigger collapse and sudden death", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c056, section: clinical, statement: "Most pulmonary emboli arise from deep veins of the legs", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c059, section: diagnosis, statement: "Distinguishing an antemortem clot from a postmortem one often matters in autopsy and forensic work", sourceRef: {source: rubin-8e, chapter: "7", pages: "329-330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c060, section: prognosis, statement: "Thrombi can be lysed because plasmin digests fibrin", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c061, section: prognosis, statement: "Propagation is continued growth of the thrombus because further clot builds up on it", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c062, section: prognosis, statement: "Venous thrombi often enlarge proximally, toward the heart, into the larger iliofemoral veins", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c063, section: prognosis, statement: "Organization is invasion of connective tissue, making the thrombus firm and grayish white", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c064, section: prognosis, statement: "In canalization an organized thrombus becomes threaded with new endothelium-covered channels", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c065, section: prognosis, statement: "Even after canalization a thrombus typically lets only a little blood pass", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c066, section: prognosis, statement: "Embolization is dislodgement of part or all of a thrombus to a distant vessel", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c067, section: prognosis, statement: "Embolism of broken-off pieces to vessels far from the heart is the main danger of a cardiac thrombus", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c068, section: prognosis, statement: "Large or propagated venous thrombi are a significant hazard to life because they can embolize to the lungs", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c070, section: prognosis, statement: "The valves of a vein that has clotted and organized are left damaged, and lasting deep venous insufficiency nearly always follows", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c072, section: prognosis, statement: "In industrialized nations no other cause kills more people than thrombosis of atherosclerotic arteries", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c073, section: differential, statement: "A thrombus adheres to endothelium and shows lines of Zahn", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c074, section: differential, statement: "A postmortem clot is gelatinous, forms in stagnant blood and separates into currant jelly and chicken fat parts", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c075, section: differential, statement: "A hematoma is blood that clotted after hemorrhage outside the vascular system", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c076, section: differential, statement: "A thromboembolus is a clot or clot fragment that arises in one place and is carried by the blood to a faraway site", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c077, section: high-yield, statement: "The triad is endothelial injury, stasis and hypercoagulability", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c078, section: high-yield, statement: "Lines of Zahn are alternating bands of platelets and fibrin in a thrombus formed during life", sourceRef: {source: rubin-8e, chapter: "7", pages: "329-330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c079, section: high-yield, statement: "A postmortem clot is gelatinous with currant jelly and chicken fat parts", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c080, section: high-yield, statement: "Arterial thrombi mostly occur on atherosclerosis and most venous thrombi form in deep leg veins", sourceRef: {source: rubin-8e, chapter: "7", pages: "329, 331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c081, section: high-yield, statement: "Factor V Leiden ranks first among gene variants tied to venous thrombosis", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c083, section: high-yield, statement: "Thrombus fates are lysis, propagation, organization, canalization and embolization", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c085, section: traps, statement: "A clot can form in vitro or after death while a thrombus adheres to endothelium", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c087, section: traps, statement: "Lines of Zahn go with a thrombus formed in life while postmortem clots are more gelatinous", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c090, section: mnemonics, statement: "The three factors are stasis, hypercoagulability and endothelial injury", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
