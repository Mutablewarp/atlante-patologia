entity: thrombosis
claims:
- {claimId: thrombosis-c001, section: definition, statement: "A thrombus is coagulated blood set inside a vessel lumen, where a fibrin meshwork holds platelets and blood cells", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c002, section: definition, statement: "A thrombus adheres to the vascular endothelium", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c003, section: definition, statement: "A test-tube or postmortem clot reflects activated coagulation alone, so clotting by itself does not make a thrombus", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c004, section: definition, statement: "Blood that clots outside the vascular system after hemorrhage forms a hematoma", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c005, section: etiology, statement: "Endothelial injury, stasis and a hypercoagulable state are the three factors favoring thrombosis", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c006, section: etiology, statement: "Arterial thrombosis favors the arteries that atherosclerosis usually affects: leg, renal, mesenteric, cerebral and coronary arteries", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c008, section: etiology, statement: "In aortic aneurysms disturbed flow and a diseased wall together promote thrombosis, so thrombi are common there", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c009, section: etiology, statement: "Travel, bed rest, postoperative immobilization and heart failure cause venous stasis that favors DVT", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c010, section: etiology, statement: "Infection, childbirth, surgery and trauma favor DVT", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c011, section: etiology, statement: "DVT is favored by hypercoagulability from inherited thrombophilic disorders, cancer, late pregnancy or exogenous hormones", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c012, section: etiology, statement: "After myocardial infarction a mural thrombus can settle over the infarcted area of the left ventricle", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c013, section: etiology, statement: "In atrial fibrillation atrial flow stalls and thrombus most often forms in the left atrial appendage", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c014, section: etiology, statement: "Left ventricular mural thrombi are associated with primary myocardial disease", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c016, section: pathogenesis, statement: "Most thrombosis starts with endothelial injury", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c017, section: pathogenesis, statement: "Injury makes platelets more adhesive, and they then interact with one another to form an aggregate", sourceRef: {source: rubin-8e, chapter: "16", pages: "597"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c019, section: pathogenesis, statement: "Additional platelets are recruited because activated platelets release ADP and thromboxane A2", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c020, section: pathogenesis, statement: "A fibrin network stabilizes the platelet aggregate as it enlarges", sourceRef: {source: rubin-8e, chapter: "16", pages: "597"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c021, section: pathogenesis, statement: "In the last step of coagulation the protease thrombin converts soluble fibrinogen into insoluble fibrin", sourceRef: {source: rubin-8e, chapter: "16", pages: "596"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c023, section: pathogenesis, statement: "Endothelial cells inhibit platelet aggregation through PGI2 and nitric oxide", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c025, section: pathogenesis, statement: "Activated protein C destroys factors V and VIII, and thrombin activates it by binding thrombomodulin on endothelial surfaces", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c027, section: pathogenesis, statement: "With good flow, a stripped endothelium is covered only by a pavement of platelets and no thrombus forms", sourceRef: {source: rubin-8e, chapter: "16", pages: "598"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c028, section: pathogenesis, statement: "Arterial thrombosis is favored by slowed flow in narrowed arteries and by turbulence at bifurcations or in aneurysms", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c029, section: pathogenesis, statement: "Some cancers, polycythemia vera and promyelocytic leukemia make blood more coagulable", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c030, section: pathogenesis, statement: "Venous thrombosis is most often associated, among gene variants, with factor V Leiden", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c032, section: pathogenesis, statement: "The prothrombin G20210A mutation is common, and as a risk factor it is mild", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c033, section: pathogenesis, statement: "Lack of antithrombin, protein S or protein C is rare but carries a strong risk of DVT", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c034, section: pathogenesis, statement: "The reference states that heredity explains 60% of the risk of DVT", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c035, section: gross, statement: "A fresh arterial thrombus on the vessel wall is dark red and breaks up easily", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c036, section: gross, statement: "Thin layers in which yellowish platelets and fibrin take turns are called the lines of Zahn", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c037, section: gross, statement: "A thrombus formed during life shows lines of Zahn", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c038, section: gross, statement: "An organized thrombus is firm and grayish white", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c039, section: gross, statement: "Postmortem clots are gelatinous and develop in stagnant blood", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c040, section: gross, statement: "Gravity separates stagnant blood, and the red cell-rich layer of a postmortem clot is reddish and gelatinous, called currant jelly", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c041, section: gross, statement: "The layer above the currant jelly is coagulated plasma without red cells, firmer and yellow-white, called chicken fat", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c042, section: micro, statement: "Platelets and fibrin in a thrombus interact tightly", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: thrombosis-c043, section: micro, statement: "A postmortem or test-tube clot differs in appearance from the organized structure of a thrombus", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c044, section: micro, statement: "Arterial smooth muscle cells, venous fibroblasts and endothelium migrate into cross-linked fibrin and produce extracellular matrix", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c046, section: micro, statement: "Canalization means that an organized thrombus acquires new lumina with an endothelial lining", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c047, section: ancillary, statement: "Pathologists at autopsy and in forensic work often need to know whether a clot arose before or after death", sourceRef: {source: rubin-8e, chapter: "7", pages: "329-330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c048, section: clinical, statement: "Infarction of the tissue supplied by the artery is a frequent result, since most arterial thrombi occlude the vessel", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c049, section: clinical, statement: "Myocardial infarction follows thrombosis at a coronary plaque and cerebral infarction (stroke) follows it at a cerebral plaque", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c050, section: clinical, statement: "Thrombosis of a leg artery gives ischemic leg and gangrene, of a renal artery kidney infarcts, and of a mesenteric artery intestinal infarction", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c051, section: clinical, statement: "Large iliofemoral thrombi may cause no symptoms, and small calf vein thrombi are ordinarily asymptomatic", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c052, section: clinical, statement: "In some patients calf tenderness, often seen with forced dorsiflexion of the foot, is called the Homan sign", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c053, section: clinical, statement: "Occlusion of the femoral or iliac vein by thrombus produces a bluish, swollen leg with severe congestion", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c054, section: clinical, statement: "Hepatic vein thrombosis gives Budd-Chiari syndrome, cerebral vein thrombosis can limit cerebral flow, and superior mesenteric vein thrombosis can cause hemorrhagic bowel infarction", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c055, section: clinical, statement: "Acute pulmonary embolism can be asymptomatic or small, cause dyspnea, cause infarction, or trigger collapse and sudden death", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c056, section: clinical, statement: "The deep veins of the legs are the source of most pulmonary emboli", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c059, section: diagnosis, statement: "Autopsy and forensic examinations often depend on separating a clot formed in life from one formed after death", sourceRef: {source: rubin-8e, chapter: "7", pages: "329-330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c060, section: prognosis, statement: "Thrombi can be lysed because plasmin digests fibrin", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c061, section: prognosis, statement: "Propagation is continued growth of the thrombus because further clot builds up on it", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c062, section: prognosis, statement: "Venous thrombi often enlarge toward the heart and so reach the larger iliofemoral veins", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c063, section: prognosis, statement: "As connective tissue invades during organization, the thrombus becomes firm and grayish white", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c064, section: prognosis, statement: "In canalization an organized thrombus becomes threaded with new endothelium-covered channels", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c065, section: prognosis, statement: "Even after canalization a thrombus typically lets only a little blood pass", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c066, section: prognosis, statement: "In embolization part or all of a thrombus breaks away and ends up in a vessel far from its origin", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c067, section: prognosis, statement: "Fragments of a cardiac thrombus detach and lodge in distant vessels, which is the major complication of thrombi in the heart", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c068, section: prognosis, statement: "A large or propagated venous thrombus is a significant hazard to life because it can be carried to the lungs", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c070, section: prognosis, statement: "Chronic deep venous insufficiency is virtually inevitable after thrombosis and organization of a vein, because venous valve function is always impaired", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c072, section: prognosis, statement: "In industrialized nations no other cause kills more people than thrombosis of atherosclerotic arteries", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c073, section: differential, statement: "A thrombus adheres to endothelium and shows lines of Zahn", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c074, section: differential, statement: "A postmortem clot is gelatinous, forms in stagnant blood and separates into currant jelly and chicken fat parts", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c075, section: differential, statement: "A hematoma is blood that clotted after hemorrhage outside the vascular system", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c076, section: differential, statement: "A thromboembolus is clotted material, whole or in part, that formed at one site and is carried by the blood to lodge at a distant one", sourceRef: {source: rubin-8e, chapter: "7", pages: "332"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c077, section: high-yield, statement: "The triad is endothelial injury, stasis and hypercoagulability", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c078, section: high-yield, statement: "Lines of Zahn are alternating bands of platelets and fibrin in a thrombus formed during life", sourceRef: {source: rubin-8e, chapter: "7", pages: "329-330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c079, section: high-yield, statement: "A postmortem clot is gelatinous with currant jelly and chicken fat parts", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c080, section: high-yield, statement: "Arterial thrombi mostly occur on atherosclerosis and most venous thrombi form in deep leg veins", sourceRef: {source: rubin-8e, chapter: "7", pages: "329, 331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c081, section: high-yield, statement: "Factor V Leiden ranks first among gene variants tied to venous thrombosis", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c083, section: high-yield, statement: "Thrombus fates are lysis, propagation, organization, canalization and embolization", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c085, section: traps, statement: "A clot can form in vitro or after death while a thrombus adheres to endothelium", sourceRef: {source: rubin-8e, chapter: "7", pages: "329"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c087, section: traps, statement: "Lines of Zahn go with a thrombus formed in life while postmortem clots are more gelatinous", sourceRef: {source: rubin-8e, chapter: "7", pages: "330"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c090, section: mnemonics, statement: "The three factors are stasis, hypercoagulability and endothelial injury", sourceRef: {source: rubin-8e, chapter: "7", pages: "331"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: thrombosis-c091, section: micro, statement: "Red cells and leukocytes are trapped in a thrombus", sourceRef: {source: rubin-8e, chapter: "16", pages: "596"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
