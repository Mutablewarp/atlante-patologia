entity: renal-cell-carcinoma
claims:
- {claimId: renal-cell-carcinoma-c001, section: definition, statement: "RCC is a malignant tumor that grows from the lining cells of the renal tubules and collecting ducts.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c002, section: definition, statement: "Roughly 80% to 90% of all primary kidney cancers are RCCs.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c003, section: definition, statement: "The RCC types differ in cell of origin and in expected outcome.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c004, section: definition, statement: "Incidence of RCC reaches its peak in the sixth decade of life.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c005, section: definition, statement: "The male-to-female ratio of RCC is about 2 to 1.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c006, section: definition, statement: "Clear cell type accounts for 70% to 80% of RCCs.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c007, section: definition, statement: "Papillary type accounts for 10% to 15% of RCCs.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c008, section: definition, statement: "Chromophobe type accounts for about 5% of RCCs.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c009, section: definition, statement: "Collecting duct type accounts for about 1% of RCCs.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c010, section: etiology, statement: "Inherited cases make up about 5% of RCCs, and the large majority are sporadic.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c011, section: etiology, statement: "One RCC in three is linked to tobacco use, whether smoked or chewed.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c012, section: etiology, statement: "RCC, especially the papillary type, can follow cystic kidney disease, inherited or acquired.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c013, section: etiology, statement: "Analgesic nephropathy is another condition associated with RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c014, section: etiology, statement: "Having a relative with RCC multiplies a person's risk by four to five.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c015, section: etiology, statement: "Compared with sporadic RCC, hereditary RCC presents in younger patients and often involves several foci in both kidneys.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c016, section: etiology, statement: "In autosomal dominant VHL syndrome, clear cell RCC occurs with pheochromocytoma, cerebellar and retinal vascular tumors, and organ cysts.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c017, section: etiology, statement: "In hereditary papillary RCC, inherited in an autosomal dominant way, the kidneys develop multiple papillary tumors on both sides.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c018, section: etiology, statement: "People with Birt-Hogg-Dube syndrome are at risk of chromophobe RCC that is multifocal and affects both kidneys.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c019, section: pathogenesis, statement: "The VHL tumor suppressor gene is located at 3p25.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c020, section: pathogenesis, statement: "Loss of one VHL allele is found in 98% of sporadic clear cell RCCs, which is virtually all of them.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c021, section: pathogenesis, statement: "Abnormal VHL function makes hypoxia-inducible factor-alpha accumulate.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c022, section: pathogenesis, statement: "Excess HIF-alpha turns up genes whose products drive kinase pathways.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c023, section: pathogenesis, statement: "Drugs against kinases and mTOR act on these pathways and help treat RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c024, section: pathogenesis, statement: "In hereditary papillary RCC the implicated gene is MET (7q31), not VHL.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c025, section: pathogenesis, statement: "Many hereditary papillary RCCs lose the Y chromosome and carry extra copies of chromosomes 7, 16 and 17.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c026, section: pathogenesis, statement: "The cell of origin of chromophobe RCC is the intercalated cell of the collecting duct.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c027, section: pathogenesis, statement: "Collecting duct RCC starts in the ducts of Bellini, in the medulla.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c028, section: pathogenesis, statement: "Folliculin (FLCN), the product of the BHD gene, appears to be a tumor suppressor, and germline inactivating mutations of the gene occur in BHD syndrome.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c029, section: gross, statement: "Clear cell RCC has a yellow-orange cut surface and is solid, in part cystic.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c030, section: gross, statement: "Clear cell RCC often shows focal bleeding and necrosis.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c031, section: gross, statement: "Lipid-filled tumor cells give clear cell RCC its yellow areas.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971-972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c032, section: micro, statement: "Clear cell RCC arises from proximal tubular epithelial cells.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c033, section: micro, statement: "Lipid and glycogen wash out during tissue processing, leaving the cytoplasm clear under the light microscope.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c034, section: micro, statement: "Clear cell RCC cells lie in round or elongated nests set apart by fine vessels.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971-972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c035, section: micro, statement: "Clear cell RCC shows little cellular or nuclear pleomorphism.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c036, section: micro, statement: "Fibrovascular stalks carry the tumor cells of papillary RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c037, section: micro, statement: "Papillary RCC arises from proximal tubular epithelial cells.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c038, section: micro, statement: "Papillary type 1 is made of small basophilic cells; papillary type 2 of large acidophilic cells.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c039, section: micro, statement: "Type 2 papillary RCC has the worse prognosis and is more aggressive than type 1.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c040, section: micro, statement: "Chromophobe RCC cells have distinct borders, and its pale and pink granular mix looks like plant cells.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c041, section: micro, statement: "Mucopolysaccharide-filled vesicles shove organelles aside, so the cell center looks pale.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c042, section: micro, statement: "Hobnail-shaped cuboidal cells sit in one layer around the tubules and papillae of collecting duct RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c043, section: micro, statement: "Almost all renal medullary carcinomas, a variant of collecting duct carcinoma, occur in people with sickle cell trait or disease.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972-973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c044, section: micro, statement: "A worse prognosis goes with sarcomatoid change, which may occur in any RCC type.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c045, section: micro, statement: "WHO/ISUP nuclear grading predicts outcome best in clear cell and papillary RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c046, section: micro, statement: "In grade 1 the nucleoli are basophilic at 400x and either absent or inconspicuous.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c047, section: micro, statement: "Grade 2 nucleoli are eosinophilic and prominent at 400x but only just visible at 100x.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c048, section: micro, statement: "In grade 3 the nucleoli are conspicuous and eosinophilic already at 100x.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972-973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c049, section: micro, statement: "Grade 4 is defined by sarcomatoid or rhabdoid differentiation, or extreme nuclear pleomorphism, or multinucleated giant cells.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c050, section: ancillary, statement: "Light microscopy shows the cell type, growth pattern and nucleoli used to assign type and grade; the pages do not name H&E.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971-973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c051, section: ancillary, statement: "Chromophobe RCC is positive for Hale colloidal iron, which marks the mucopolysaccharide in its cytoplasmic vesicles.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c052, section: ancillary, statement: "The short arm of chromosome 3 may be deleted or show LOH in tumor tissue from sporadic RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c053, section: clinical, statement: "The most frequent presenting sign of RCC is hematuria.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c054, section: clinical, statement: "Abdominal imaging done for an unrelated reason often finds RCC incidentally.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c055, section: clinical, statement: "Fewer than 10% of patients have the full classic triad of hematuria, flank pain and a palpable abdominal mass.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c056, section: clinical, statement: "RCC is called a great mimic and can cause fever and paraneoplastic syndromes through ectopic hormone production.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c057, section: clinical, statement: "Symptoms of hyperparathyroidism can come from a PTH-like substance secreted by RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c058, section: clinical, statement: "Erythrocytosis results when RCC produces erythropoietin.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c059, section: clinical, statement: "Hypertension results when RCC secretes renin.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c060, section: clinical, statement: "Many patients first seek care because of a metastasis, for example a seizure from a brain deposit or a cough from a lung deposit.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c061, section: diagnosis, statement: "Abdominal imaging often detects RCC incidentally.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c062, section: prognosis, statement: "Nuclear grade, histologic type, tumor size and extent of spread determine the outcome.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c063, section: prognosis, statement: "No other prognostic factor outweighs tumor stage.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c064, section: prognosis, statement: "Five-year survival is 90% for RCC confined within the renal capsule.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c065, section: prognosis, statement: "When distant metastases are present, 5-year survival is 30%.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c066, section: prognosis, statement: "Clear cell RCC has a poorer prognosis than the papillary and chromophobe types.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c067, section: prognosis, statement: "Collecting duct tumors have a worse prognosis than clear cell RCC.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c068, section: prognosis, statement: "Survival beyond 1 year is rare when sarcomatoid features are prominent.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c069, section: prognosis, statement: "Metastases from RCC go most often to the lungs and bones.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c070, section: differential, statement: "Wilms tumor accounts for most renal neoplasms in children.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c071, section: differential, statement: "Urothelial carcinoma of the renal pelvis or calyces has the same microscopic look as bladder urothelial carcinoma.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c072, section: high-yield, statement: "Clear cell is the most common RCC type.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c073, section: high-yield, statement: "Clear cell RCC develops largely because VHL function is lost and HIF-alpha builds up.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c074, section: high-yield, statement: "Hematuria is the most frequent presenting sign.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c075, section: high-yield, statement: "RCC can secrete renin, erythropoietin or a PTH-like substance.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c076, section: high-yield, statement: "Tumor stage is the most important prognostic factor.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c077, section: high-yield, statement: "Sarcomatoid change and collecting duct type carry a worse prognosis.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972-973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c078, section: high-yield, statement: "Nucleolar visibility sets WHO/ISUP grades 1 to 3, while grade 4 rests on extreme pleomorphism or sarcomatoid or rhabdoid change.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972-973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c079, section: high-yield, statement: "Chromophobe RCC vesicles stain with Hale colloidal iron.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c080, section: traps, statement: "Tissue processing washes out lipid and glycogen, so the cytoplasm looks clear.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c081, section: traps, statement: "All three signs of the classic triad are present in under 10% of patients.", sourceRef: {source: rubin-8e, chapter: "22", pages: "973"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c082, section: traps, statement: "About 5% of RCCs are inherited and hereditary tumors appear in younger patients.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c083, section: traps, statement: "Clear cell and papillary RCC arise from proximal tubular cells, chromophobe from intercalated cells and collecting duct RCC from the ducts of Bellini.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971-972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c084, section: traps, statement: "Type 2 papillary RCC is more aggressive than type 1.", sourceRef: {source: rubin-8e, chapter: "22", pages: "972"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
- {claimId: renal-cell-carcinoma-c085, section: mnemonics, statement: "The four RCC types in falling frequency are clear cell, papillary, chromophobe and collecting duct.", sourceRef: {source: rubin-8e, chapter: "22", pages: "971"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16}
