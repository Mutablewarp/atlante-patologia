entity: paraneoplastic-syndromes
claims:
- {claimId: paraneoplastic-syndromes-c001, section: definition, statement: "When a cancer harms the body at a distance and the cause is neither invasion nor metastasis, the picture is a paraneoplastic syndrome", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c002, section: definition, statement: "Symptoms of the syndrome can dominate the course of the illness, although death from the syndrome itself is rare", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c003, section: definition, statement: "Some malignant tumors make peptide hormones without the usual control over their secretion", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c004, section: definition, statement: "Ectopic ACTH secretion by a tumor leads to Cushing syndrome", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c005, section: definition, statement: "Among tumors that make ectopic ACTH, lung cancers lead, and small cell carcinoma is the prime example", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c006, section: definition, statement: "When a tumor makes ADH, the body retains too much sodium and water, and water intoxication can follow", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c007, section: definition, statement: "Small cell lung carcinoma is the usual culprit behind this ADH syndrome", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c008, section: definition, statement: "Among paraneoplastic causes of hypercalcemia, the leading one is an epithelial tumor releasing a parathormone-like peptide", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c010, section: definition, statement: "In acanthosis nigricans the skin of the axilla, neck and other flexures becomes thickened and darker", sourceRef: {source: rubin-8e, chapter: "28", pages: "1299"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c011, section: definition, statement: "More than 90% of acanthosis nigricans cases are associated with gastrointestinal carcinoma and more than half with stomach cancer; other cases have non-cancer causes", sourceRef: {source: rubin-8e, chapter: "28", pages: "1299"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c013, section: definition, statement: "Cancer patients waste far more than their reduced food intake would account for", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c015, section: micro, statement: "The tissue picture of Sweet syndrome is an infiltrate of neutrophils", sourceRef: {source: rubin-8e, chapter: "28", pages: "1299"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c017, section: micro, statement: "Some Sweet syndrome cases accompany a malignancy, most notably one of the hematopoietic system", sourceRef: {source: rubin-8e, chapter: "28", pages: "1299"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c018, section: diagnosis, statement: "A malignant tumor may reveal itself first through a paraneoplastic syndrome", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c019, section: diagnosis, statement: "Because a paraneoplastic syndrome can look like advanced metastatic disease, it may push clinicians toward the wrong treatment", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c021, section: diagnosis, statement: "Levels of tumor products show whether treatment is working and how the tumor is behaving", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c022, section: differential, statement: "Most often, hypercalcemia in a cancer patient comes from tumor that has invaded bone", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c023, section: differential, statement: "In about one-tenth of hypercalcemic cancer patients there are no bone metastases", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c024, section: differential, statement: "Cancer often comes with a raised metabolic rate, while in starvation it falls", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c025, section: differential, statement: "Fever caused by cancer follows the tumor's course, clearing with treatment and returning with relapse, with no active infection behind it", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c026, section: high-yield, statement: "Paraneoplastic syndromes arise at a distance from the tumor, not from invasion or metastasis", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c027, section: high-yield, statement: "Small cell lung carcinoma is the leading source of both ectopic ACTH and tumor ADH", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c028, section: high-yield, statement: "A parathormone-like peptide from squamous lung or breast carcinoma is the usual paraneoplastic cause of hypercalcemia", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c029, section: high-yield, statement: "When acanthosis nigricans is linked to cancer, the cancer is mostly gastrointestinal, and more than half of cases accompany stomach cancer", sourceRef: {source: rubin-8e, chapter: "28", pages: "1299"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c030, section: high-yield, statement: "Cancer cachexia is often accompanied by a raised metabolic rate, unlike starvation", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c031, section: traps, statement: "Mistaking a paraneoplastic syndrome for metastatic disease can lead to inappropriate therapy", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c032, section: traps, statement: "Hypercalcemia in cancer sometimes occurs without bone metastases", sourceRef: {source: rubin-8e, chapter: "27", pages: "1241"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
- {claimId: paraneoplastic-syndromes-c033, section: traps, statement: "Cancer patients lose far more tissue than a smaller appetite and lower food intake could explain", sourceRef: {source: rubin-8e, chapter: "5", pages: "244"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13}
