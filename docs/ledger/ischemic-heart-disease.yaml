entity: ischemic-heart-disease
claims:
  - { claimId: ischemic-heart-disease-c001, section: definition, statement: "The heart muscle gets less oxygen than it needs, usually because coronary atherosclerosis has narrowed the coronary arteries.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c002, section: definition, statement: "Patients present with sudden death, myocardial infarction, angina pectoris or chronic heart failure.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c004, section: definition, statement: "An acute coronary syndrome is any abrupt fall in flow through an epicardial coronary artery, and it underlies acute events such as infarction and sudden death.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c005, section: etiology, statement: "Ischemia follows any imbalance between supply and demand, because, unlike skeletal muscle, the heart depends on oxidative phosphorylation and cannot switch to anaerobic glycolysis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "653" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c006, section: etiology, statement: "Coronary atherosclerosis is the commonest cause of reduced flow, and thrombosis on it usually precipitates infarction.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652, 654" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c007, section: etiology, statement: "Coronary vasospasm is another cause of decreased coronary flow.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c008, section: etiology, statement: "Infarction from an embolus is rare; the embolus usually comes from valve vegetations or a clot in an atrium or ventricle.", sourceRef: { source: rubin-8e, chapter: "17", pages: "654" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c010, section: etiology, statement: "An anomalous coronary origin can cause sudden death in a young person, and an intramural course of the left anterior descending artery can also cause sudden death.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c011, section: etiology, statement: "Anemia and carbon monoxide poisoning reduce the oxygen delivered to tissues.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c012, section: etiology, statement: "Fever, hyperthyroidism, hypertension and valve disease increase cardiac work and therefore oxygen demand.", sourceRef: { source: rubin-8e, chapter: "17", pages: "654-655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c013, section: etiology, statement: "Raised blood cholesterol, diabetes, smoking and hypertension are the four major risk factors for coronary artery disease.", sourceRef: { source: rubin-8e, chapter: "17", pages: "653" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c017, section: pathogenesis, statement: "Resting flow stays normal despite a stenosis in a large epicardial artery because the small intramural vessels dilate.", sourceRef: { source: rubin-8e, chapter: "17", pages: "654" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c018, section: pathogenesis, statement: "Exertion raises oxygen need, and once the small vessels have dilated as far as they can, supply falls short and ischemia with angina follows.", sourceRef: { source: rubin-8e, chapter: "17", pages: "654" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c019, section: pathogenesis, statement: "Infarction usually begins when a vulnerable plaque tears or wears away and a thrombus forms on it.", sourceRef: { source: rubin-8e, chapter: "17", pages: "654" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c021, section: pathogenesis, statement: "Collaterals grown in severe coronary atherosclerosis can spare myocardium after a sudden occlusion of a main epicardial artery, preventing the infarct or making it smaller.", sourceRef: { source: rubin-8e, chapter: "17", pages: "654" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c023, section: pathogenesis, statement: "Contraction bands arise when calcium enters freely through a sarcolemma damaged by reactive oxygen species produced on reperfusion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659-660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c024, section: gross, statement: "An acute infarct is not visible grossly in the first hours and shows pallor on cut surface by about a day.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c025, section: gross, statement: "By days 3 to 5, a hyperemic zone surrounds the yellow necrotic center and the infarct looks mottled.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c027, section: gross, statement: "Healing leaves a light gray scar that shrinks and hardens.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c028, section: gross, statement: "An inferior infarct of the posterior left ventricle and posterior septum is caused by proximal right coronary occlusion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c029, section: gross, statement: "Anteroseptal, anterior and apical left ventricular infarcts follow left anterior descending occlusion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c031, section: gross, statement: "Type 1 infarcts, usually thrombotic, are transmural and form a single compact block of necrosis in the territory of one artery.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655-656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c032, section: gross, statement: "Global hypoperfusion (type 2) produces subendocardial infarcts that are patchy and can wrap around the ventricle.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655-656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c033, section: gross, statement: "After reperfusion, blood leaks from injured microvessels, so the infarct becomes hemorrhagic.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c034, section: micro, statement: "Electron microscopy is the only way to see the first cellular changes of ischemic injury.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c035, section: micro, statement: "Within 24 hours the necrotic myocytes show changes of coagulative necrosis and are deeply eosinophilic.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c036, section: micro, statement: "Neutrophil numbers peak at two to three days, at the infarct border.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c037, section: micro, statement: "From day five to seven, macrophages clear necrotic muscle, mainly at the infarct edge, and new collagen starts to form.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657, 659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c039, section: micro, statement: "Reperfused infarcts typically show contraction band necrosis: eosinophilic stripes of hypercontracted sarcomeres cut across the dead myocytes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c040, section: ancillary, statement: "On H&E, acute inflammatory cells surround dead fibers, which stain pink and have lost nuclei and cross-striations.", sourceRef: { source: rubin-8e, chapter: "17", pages: "658-659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c043, section: ancillary, statement: "Among biomarkers of myocardial necrosis, cardiac troponin I or T is the one assayed most widely.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c044, section: clinical, statement: "Stable angina is recurrent chest pain set off by exertion or emotional stress and eased by resting or by nitroglycerin under the tongue.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c045, section: clinical, statement: "Prinzmetal or variant angina is the form that arises at rest, and coronary spasm is its cause.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c046, section: clinical, statement: "In unstable angina the pain follows exertion less reliably than in stable angina, and the plaque often carries a nonocclusive thrombus.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c047, section: clinical, statement: "Stable angina is not an acute coronary syndrome.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c048, section: clinical, statement: "Infarction typically starts suddenly with severe retrosternal pain, and patients are often sweaty, nauseated and short of breath.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c050, section: clinical, statement: "Ischemic cardiomyopathy is left ventricular failure with global loss of contractility and no obvious discrete infarct, seen in some patients with severe coronary atherosclerosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c052, section: diagnosis, statement: "The ECG shows ST elevation in STEMI and ST depression in non-STEMI.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c053, section: diagnosis, statement: "A diagnosis of infarction requires a troponin (or similar biomarker) that rises or falls over the same period as the symptoms.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c054, section: diagnosis, statement: "In unstable angina the cardiac-specific proteins remain normal, since there is no myocardial necrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652, 660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c055, section: diagnosis, statement: "Transmural infarcts tend to be STEMI and subendocardial infarcts tend to be non-STEMI, a fairly good but imperfect correspondence.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c056, section: prognosis, statement: "Almost all infarct patients develop rhythm disturbances, which remain a leading cause of death in ischemic heart disease.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c057, section: prognosis, statement: "Early left ventricular failure after infarction suggests much muscle has been lost, carries a poor outlook, and can be followed by cardiogenic shock.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c058, section: prognosis, statement: "Free-wall rupture occurs only in transmural infarcts, mostly on days 2 to 7 while the dead wall is soft, and usually causes tamponade.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660-661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c059, section: prognosis, statement: "Rupture of a papillary muscle causes mitral regurgitation, and septal perforation creates a left-to-right shunt.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c060, section: prognosis, statement: "Electrical current can reenter at the edge of a left ventricular aneurysm, which puts the patient at risk of ventricular tachycardia.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c064, section: prognosis, statement: "Permanent salvage of ischemic myocytes depends on restoring arterial blood flow early; no other intervention achieves it.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c065, section: prognosis, statement: "A patient with an acute coronary syndrome may die suddenly with no earlier symptoms, when ventricular tachycardia turns into ventricular fibrillation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c066, section: prognosis, statement: "The fatal rhythm is probably triggered by ischemia alone, since many people saved by defibrillation show no infarct on markers or ECG.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c068, section: prognosis, statement: "Hibernating myocardium is muscle whose myocytes have lost myofibrils after repeated episodes of ischemia.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662-663" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c069, section: prognosis, statement: "Revascularization brings back contraction in hibernating myocardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "663" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c071, section: differential, statement: "An acute myocardial infarct is myocardial necrosis forming a discrete focus, due to an acute coronary syndrome.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c072, section: differential, statement: "In hypertensive heart disease the concentric left ventricular hypertrophy is explained by hypertension alone.", sourceRef: { source: rubin-8e, chapter: "17", pages: "663" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c073, section: differential, statement: "Severe coronary disease can impair contractility globally as in dilated cardiomyopathy, which is called ischemic cardiomyopathy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c074, section: differential, statement: "Patchy necrosis from viral or toxic injury falls outside the definition of infarct.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c075, section: high-yield, statement: "Ischemic heart disease is an imbalance between oxygen supply and demand, usually from coronary atherosclerosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652-653" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c076, section: high-yield, statement: "Troponin stays normal in unstable angina but rises in infarction.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652, 660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c077, section: high-yield, statement: "Thrombosis on a ruptured or eroded plaque usually precipitates infarction.", sourceRef: { source: rubin-8e, chapter: "17", pages: "654" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c078, section: high-yield, statement: "Pallor is the first gross sign of infarct, seen by about 24 hours.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c079, section: high-yield, statement: "Neutrophils reach peak numbers at two to three days.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c080, section: high-yield, statement: "Reperfused infarcts are hemorrhagic and show contraction band necrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c081, section: high-yield, statement: "Sudden cardiac death from ventricular fibrillation can occur without infarction.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c082, section: high-yield, statement: "Hibernating myocardium regains function after revascularization.", sourceRef: { source: rubin-8e, chapter: "17", pages: "663" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c083, section: traps, statement: "Stable angina is not an acute coronary syndrome; myocardial damage appears only if its duration and severity are enough to produce necrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c085, section: traps, statement: "Ischemia alone, without infarction, is often enough to trigger a lethal arrhythmia.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c086, section: traps, statement: "Prinzmetal angina is caused by coronary spasm, which usually develops near an atherosclerotic plaque.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: ischemic-heart-disease-c087, section: mnemonics, statement: "Stable angina is stress-related, unstable angina is unpredictable, and variant angina is vasospasm at rest.", sourceRef: { source: rubin-8e, chapter: "17", pages: "652" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
