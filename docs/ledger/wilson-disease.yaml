entity: wilson-disease
claims:
- {claimId: wilson-disease-c001, section: definition, statement: "Copper builds up in liver and brain because of an inherited recessive defect of copper handling", sourceRef: {source: rubin-8e, chapter: "20", pages: "876"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c002, section: definition, statement: "Wilson disease is also called hepatolenticular degeneration", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c003, section: definition, statement: "Carrier frequency is roughly 1 in 150 to 180", sourceRef: {source: rubin-8e, chapter: "20", pages: "876"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c004, section: definition, statement: "Clinical disease affects about 1 in 30,000 children", sourceRef: {source: rubin-8e, chapter: "20", pages: "876"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c005, section: etiology, statement: "The causative gene is ATP7B on chromosome 13", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c006, section: etiology, statement: "Hepatocytes use the ATP-dependent transporter encoded by ATP7B (copper-transporting ATPase2) to carry copper around inside the cell before excretion", sourceRef: {source: rubin-8e, chapter: "20", pages: "877, 1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c007, section: etiology, statement: "Roughly 200 distinct ATP7B mutations have been described", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c008, section: etiology, statement: "One variant, H1069Q, causes most cases in Europe and North America but few in India and Asia", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c009, section: etiology, statement: "Two different mutant alleles are usually present, so most patients are compound heterozygotes", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c010, section: pathogenesis, statement: "The liver clears surplus copper into bile because the diet usually supplies more than the body needs", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c011, section: pathogenesis, statement: "In healthy hepatocytes ceruloplasmin takes up copper and carries it into the circulation", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c012, section: pathogenesis, statement: "With faulty ATP7B less copper reaches bile and ceruloplasmin", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c013, section: pathogenesis, statement: "Hepatic copper overload is thought to explain the markedly low blood ceruloplasmin", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c014, section: pathogenesis, statement: "Hepatocytes damaged by copper die and spill copper into the blood, which lodges in organs outside the liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c015, section: pathogenesis, statement: "The brain accumulates copper because biliary excretion of the metal is defective", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c016, section: pathogenesis, statement: "How excess copper injures cells is unclear", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c017, section: pathogenesis, statement: "Like iron, copper can drive the Fenton reaction that turns hydrogen peroxide into hydroxyl radicals", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c018, section: pathogenesis, statement: "Because liver transplantation cures the disease, the liver is the key organ", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c019, section: gross, statement: "The cirrhotic liver changes from micronodular to macronodular over time", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c020, section: gross, statement: "A faint golden tint colors the lenticular nuclei", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c021, section: gross, statement: "In one case in four the putamen or deep neocortex contains tiny cysts or slit-like spaces", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c022, section: gross, statement: "The Kayser-Fleischer ring is a golden-brown band at the corneal limbus, visible on slit-lamp examination, where copper is deposited", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c023, section: micro, statement: "Chronic hepatitis of the liver worsens from mild to severe", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c024, section: micro, statement: "Fatty change can occur together with marked hepatocyte damage", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c025, section: micro, statement: "Mallory-Denk hyalin is often found inside hepatocytes", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c026, section: micro, statement: "Cholestasis is common", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c027, section: micro, statement: "A cirrhotic Wilson liver can show hydropic change of hepatocytes", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c028, section: micro, statement: "Typical brain findings are gliosis and mild loss of neurons", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c029, section: micro, statement: "Alzheimer type II astrocytes are seen in Wilson disease", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c030, section: micro, statement: "The corneal brown ring comes from copper laid down in Descemet membrane", sourceRef: {source: rubin-8e, chapter: "20", pages: "877-878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c031, section: ancillary, statement: "On H&E the liver shows Mallory-Denk hyalin, steatosis and hepatocyte injury against a background of chronic hepatitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c032, section: ancillary, statement: "Liver copper can be assayed chemically on unfixed tissue or on paraffin blocks not yet cut", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c033, section: ancillary, statement: "In Wilson disease liver copper exceeds 250 micrograms per gram of dry weight", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c034, section: clinical, statement: "In half of patients some symptoms appear by adolescence", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c035, section: clinical, statement: "Most patients without symptoms by adolescence first become ill as young adults, though onset can be later", sourceRef: {source: rubin-8e, chapter: "20", pages: "877, 1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c036, section: clinical, statement: "Chronic liver disease is the first sign in about half of patients", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c037, section: clinical, statement: "Neurologic complaints are the reason for first presentation in about a third", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c038, section: clinical, statement: "In about a tenth psychiatric illness comes first", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c039, section: clinical, statement: "Wilson chronic liver disease can mimic other chronic hepatitis, after vague early symptoms", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c040, section: clinical, statement: "Late-stage cirrhosis causes portal hypertension, liver failure and jaundice", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c041, section: clinical, statement: "Wilson disease may present as acute liver failure", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c042, section: clinical, statement: "Wilson disease raises liver cancer risk, but hemochromatosis raises it more", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c043, section: clinical, statement: "Slight clumsiness and tremor are the first neurologic signs", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c044, section: clinical, statement: "In untreated patients crippling dystonia and spasticity come after speech and swallowing difficulty", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c045, section: clinical, statement: "The movement disorder usually begins in the second decade and tends toward choreoathetosis", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c046, section: clinical, statement: "Kayser-Fleischer rings are brown-gold corneal bands in both eyes that veil the iris", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c047, section: clinical, statement: "Whenever neurologic disease is present the eyes are invariably affected", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c048, section: clinical, statement: "In some patients copper forms green discs on the anterior lens capsule, called sunflower cataracts", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c049, section: clinical, statement: "Spontaneous fractures are frequent, along with bone softening, bone thinning and joint disease", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c050, section: clinical, statement: "Glomerular and tubular damage lowers filtration and lets phosphate, amino acids and protein escape into the urine", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c051, section: clinical, statement: "The cause of the kidney findings is copper laid down in the tubules", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c052, section: clinical, statement: "In 15% of patients a surge of free copper from the liver probably causes brief hemolytic episodes", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c053, section: diagnosis, statement: "Serum ceruloplasmin levels are very low in Wilson disease", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c054, section: diagnosis, statement: "The Kayser-Fleischer ring is seen on slit-lamp examination", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c055, section: diagnosis, statement: "Anyone with a hyperkinetic movement disorder plus liver or psychiatric signs should be tested for Wilson disease, most of all with onset in early adult life", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c056, section: prognosis, statement: "Even children can develop cirrhosis, which may arrive quickly", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c057, section: prognosis, statement: "Therapy has two goals: stopping new copper accumulation in tissues and clearing copper already deposited", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c058, section: prognosis, statement: "Urinary copper loss rises with the chelators trientine and d-penicillamine", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c059, section: prognosis, statement: "Both liver disease and CNS dysfunction often reverse with treatment", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c060, section: prognosis, statement: "Dietary zinc blocks intestinal copper absorption and is given to presymptomatic patients", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c061, section: prognosis, statement: "Liver transplantation is curative", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c062, section: prognosis, statement: "Liver and brain damage can become permanent if the disease is left untreated", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c063, section: prognosis, statement: "Presymptomatic patients never build the copper load needed for brain or eye deposits or cirrhosis", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c064, section: differential, statement: "Hemochromatosis involves iron; bronze diabetes names pigmented skin plus glucose intolerance", sourceRef: {source: rubin-8e, chapter: "20", pages: "876"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c065, section: differential, statement: "The liver cancer risk in Wilson disease is not as great as in hemochromatosis", sourceRef: {source: rubin-8e, chapter: "20", pages: "876-877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c066, section: differential, statement: "In alpha-1-antitrypsin deficiency PAS-positive droplets of misfolded mutant protein lie in the hepatocyte cytoplasm", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c067, section: differential, statement: "Some infants with alpha-1-antitrypsin deficiency (ZZ genotype) have neonatal cholestatic jaundice", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c068, section: differential, statement: "The alpha-1-antitrypsin globules are shown by PAS with diastase digestion", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c069, section: differential, statement: "Other forms of chronic hepatitis can look just like Wilson liver disease", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c070, section: differential, statement: "Wilson disease has very low serum ceruloplasmin and high liver copper", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c071, section: high-yield, statement: "ATP7B mutation impairs biliary copper excretion and ceruloplasmin incorporation, with copper accumulating in liver and brain", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c072, section: high-yield, statement: "The liver shows Mallory-Denk hyalin, steatosis and chronic hepatitis, with cirrhosis turning from micronodular to macronodular", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c073, section: high-yield, statement: "The brain shows neuron loss and gliosis, cysts or clefts in the putamen, and golden lenticular nuclei", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c074, section: high-yield, statement: "The Kayser-Fleischer ring is copper deposited in Descemet membrane", sourceRef: {source: rubin-8e, chapter: "20", pages: "877-878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c075, section: high-yield, statement: "Ceruloplasmin is very low and liver copper exceeds 250 micrograms per gram of dry weight", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c076, section: high-yield, statement: "Chelators (trientine, d-penicillamine) or zinc are used, and liver transplantation is curative", sourceRef: {source: rubin-8e, chapter: "20", pages: "878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c077, section: traps, statement: "Wilson disease affects brain, eye, kidney, bone and blood as well as the liver", sourceRef: {source: rubin-8e, chapter: "20", pages: "876-878"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c078, section: traps, statement: "Serum ceruloplasmin is very low although tissue copper is high", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c079, section: traps, statement: "ATP7B encodes a copper transporter, and low ceruloplasmin is a consequence of impaired copper handling", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c080, section: traps, statement: "Chelators treat Wilson disease, zinc is given to presymptomatic patients, and liver transplantation is curative", sourceRef: {source: rubin-8e, chapter: "20", pages: "878, 1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c081, section: traps, statement: "Alzheimer type II astrocytes are seen in Wilson disease and hepatic encephalopathy, where they signal a metabolic disturbance, and are not specific to Alzheimer disease", sourceRef: {source: rubin-8e, chapter: "32", pages: "1487"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: wilson-disease-c082, section: mnemonics, statement: "Four Cs mnemonic: copper, low ceruloplasmin, corneal ring, cirrhosis, all features stated for Wilson disease", sourceRef: {source: rubin-8e, chapter: "20", pages: "877"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
