entity: diabetic-nephropathy
claims:
- {claimId: diabetic-nephropathy-c001, section: definition, statement: "Diabetic glomerulosclerosis is the glomerular part of the diabetic small-vessel disease and causes proteinuria and progressive renal failure", sourceRef: {source: rubin-8e, chapter: "22", pages: "933, 935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c002, section: definition, statement: "It occurs in both type 1 and type 2 diabetes mellitus", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c003, section: definition, statement: "Roughly one quarter of diabetic patients end up with this glomerular disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c004, section: definition, statement: "Diabetic glomerulosclerosis accounts for about 40% of end-stage renal disease and is its leading cause in the United States", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c005, section: etiology, statement: "Black patients and Native Americans with type 2 diabetes have a higher risk of diabetic glomerulosclerosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c006, section: etiology, statement: "The glomerular lesion is the kidney portion of body-wide diabetic damage to small vessels", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c007, section: pathogenesis, statement: "In diabetes small vessels make more basement membrane material because of the altered metabolism", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c008, section: pathogenesis, statement: "Oxidative stress and non-enzymatic sugar attachment to blood and matrix proteins, notably in the GBM and mesangium, may injure podocytes and add matrix", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c009, section: pathogenesis, statement: "Podocyte numbers decline in the earliest lesions", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c010, section: gross, statement: "Papillary necrosis becomes more likely when vessels narrow and the medulla is perfused less", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c011, section: gross, statement: "Pyelonephritis is favored by the same narrowing of vessels and lowered medullary blood flow", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c012, section: micro, statement: "In the early phase the mesangial matrix expands, the GBM thickens and the glomerulus grows", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c013, section: micro, statement: "A mild rise in mesangial cell number can accompany the extra matrix", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c014, section: micro, statement: "In established disease the GBM is thick throughout the glomerulus and the mesangial matrix is widely expanded", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c015, section: micro, statement: "Sclerotic Kimmelstiel-Wilson nodules accompany the diffuse changes", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c016, section: micro, statement: "Leaked plasma proteins can form rounded capsular drops between the parietal epithelium and Bowman capsule", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c017, section: micro, statement: "Along the capillary loops, insudated proteins can also collect under the endothelium as hyaline caps", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c018, section: micro, statement: "Tubular basement membranes are thickened", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c019, section: micro, statement: "Hyaline arteriolosclerosis results from sclerosis and plasma protein insudation in both the afferent and the efferent arteriole", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c020, section: micro, statement: "Widespread arteriosclerosis of the renal vessels is usually present", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c021, section: ancillary, statement: "In symptomatic disease light microscopy shows an expanded mesangial matrix above all, with a thick GBM", sourceRef: {source: rubin-8e, chapter: "22", pages: "933-934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c022, section: ancillary, statement: "The lamina densa can thicken 5 to 10 times on electron microscopy", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c023, section: ancillary, statement: "On electron microscopy the nodules hold the largest increase of mesangial matrix", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c024, section: ancillary, statement: "On electron microscopy lipid fragments lie inside the dense hyaline protein masses", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c025, section: ancillary, statement: "On immunofluorescence the GBM gives a continuous linear signal from trapped plasma proteins such as IgG and albumin", sourceRef: {source: rubin-8e, chapter: "22", pages: "934-935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c026, section: ancillary, statement: "Nonenzymatic glycosylation may explain why proteins stick nonspecifically to the thickened GBM, which produces the linear signal", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c027, section: clinical, statement: "Clear-cut proteinuria develops 10-15 years after diabetes begins", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c028, section: clinical, statement: "The proteinuria frequently grows heavy and produces nephrotic syndrome", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c029, section: clinical, statement: "The disease eventually advances to kidney failure", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c030, section: diagnosis, statement: "Microalbuminuria, a little extra urinary protein, is the first sign to appear", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c031, section: prognosis, statement: "Tight glucose control slows established disease and lowers the chance that it develops", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c032, section: prognosis, statement: "Limiting dietary protein and treating hypertension also slow the disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c033, section: differential, statement: "Diabetic glomerulosclerosis combines GBM thickening, diffuse mesangial expansion and nodules, with linear trapping of plasma proteins", sourceRef: {source: rubin-8e, chapter: "22", pages: "934-935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c034, section: differential, statement: "In membranous nephropathy capillary loops are rimmed by granular IgG, and from stage II basement membrane spikes appear between the subepithelial immune complex deposits", sourceRef: {source: rubin-8e, chapter: "22", pages: "933-934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c035, section: differential, statement: "Renal amyloid deposits begin in the mesangium, can later occlude capillaries and entire glomeruli, and look amorphous and eosinophilic", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c036, section: high-yield, statement: "Diabetic glomerulosclerosis is part of a small-vessel disease", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c037, section: high-yield, statement: "The first changes are a thicker GBM and a larger mesangial matrix", sourceRef: {source: rubin-8e, chapter: "22", pages: "933"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c038, section: high-yield, statement: "Established disease adds Kimmelstiel-Wilson nodules", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c039, section: high-yield, statement: "Afferent and efferent arterioles show hyaline arteriolosclerosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c040, section: high-yield, statement: "Poor blood supply to the medulla raises the risk of papillary necrosis and pyelonephritis", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c041, section: high-yield, statement: "Microalbuminuria is the earliest sign and overt proteinuria follows 10 to 15 years after onset", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c042, section: traps, statement: "Nodules appear in established disease, after mesangial expansion, GBM thickening and glomerular enlargement", sourceRef: {source: rubin-8e, chapter: "22", pages: "933-934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c043, section: traps, statement: "IgG along the diabetic GBM reflects nonspecific adsorption to the thickened membrane", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c044, section: traps, statement: "Microalbuminuria comes first and overt proteinuria 10 to 15 years after onset", sourceRef: {source: rubin-8e, chapter: "22", pages: "935"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c045, section: traps, statement: "Narrowed vessels cut the medullary blood supply, which makes papillary necrosis more likely", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diabetic-nephropathy-c046, section: mnemonics, statement: "The mnemonic summarizes GBM thickening, arteriolar hyalinosis and nodules", sourceRef: {source: rubin-8e, chapter: "22", pages: "934"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
