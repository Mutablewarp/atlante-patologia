entity: emphysema
claims:
- { claimId: emphysema-c001, section: definition, statement: "Fibrosis is absent in emphysema, a chronic disease that destroys the walls of airspaces beyond the terminal bronchioles and so enlarges them", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c002, section: definition, statement: "How advanced emphysema is counts for more than its anatomic type", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c003, section: definition, statement: "Several anatomic patterns can be present in one lung, and classification gets harder as severity increases", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c004, section: definition, statement: "Most patients with emphysema first present at age 60 or older", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c005, section: etiology, statement: "Cigarette smoking is the main cause of emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c006, section: etiology, statement: "Emphysema of moderate or severe degree is uncommon in people who do not smoke", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c007, section: etiology, statement: "Inherited alpha-1 antitrypsin deficiency accounts for roughly 1% of COPD patients", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c008, section: etiology, statement: "Alpha-1 antitrypsin deficiency is much more frequent among young patients with severe emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c009, section: etiology, statement: "Inherited PiZ alpha-1 antitrypsin deficiency underlies most emphysema diagnosed in patients younger than 40", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c010, section: etiology, statement: "Emphysema appears at roughly 45 to 50 years of age in PiZZ homozygotes who never smoke", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c011, section: etiology, statement: "In PiZZ homozygotes, smoking brings the onset of emphysema forward by 5 to 10 years", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c012, section: etiology, statement: "Most PiZZ homozygotes who do not smoke stay free of emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c013, section: pathogenesis, statement: "In normal lung, elastin synthesis and elastin breakdown are in balance", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c014, section: pathogenesis, statement: "Emphysema arises from more elastin breakdown or less protection against it", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c015, section: pathogenesis, statement: "Lavage fluid from smokers' lungs contains extra neutrophils, rich in elastase and other proteases", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c016, section: pathogenesis, statement: "Alpha-1 antitrypsin loses activity in smokers because smoke oxidizes its methionine residues", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c017, section: pathogenesis, statement: "Poor elastic recoil, caused by unchecked elastase wearing away the elastin of distal airways, adds to airflow obstruction", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c018, section: pathogenesis, statement: "Other cellular proteases may help injure airspace walls; the protease theory still needs confirmation", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c019, section: pathogenesis, statement: "Elastase is one of the serine proteases inhibited by circulating alpha-1 antitrypsin", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c020, section: pathogenesis, statement: "Liver-made alpha-1 antitrypsin supplies 90% of the proteinase-blocking activity of blood", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c021, section: pathogenesis, statement: "In the lung alpha-1 antitrypsin restrains neutrophil elastase, which would otherwise digest elastin and other alveolar wall components", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c022, section: pathogenesis, statement: "Two codominant SERPINA1 (Pi) alleles together set how much alpha-1 antitrypsin a person makes and of which kind", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c023, section: pathogenesis, statement: "PiMM, built from the commonest allele PiM, is the commonest genotype", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c024, section: pathogenesis, statement: "Hepatocytes break down some misfolded mutant alpha-1 antitrypsin molecules in proteasomes", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c025, section: pathogenesis, statement: "Mutant alpha-1 antitrypsin forms that polymerize build up inside hepatocytes", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c026, section: pathogenesis, statement: "Because the liver secretes the PiZ protein poorly, PiZ is the most serious allele", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c027, section: pathogenesis, statement: "PiZZ homozygotes have only 15% to 20% of the normal plasma level of alpha-1 antitrypsin", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c028, section: pathogenesis, statement: "PiZZ homozygotes are at risk for liver cirrhosis and emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c029, section: pathogenesis, statement: "Smoking is thought to cause emphysema by upsetting the protease-antiprotease balance, a view supported by the emphysema of alpha-1 antitrypsin deficiency", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c030, section: gross, statement: "Emphysema types are defined by the position of the lesions within the pulmonary acinus", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c031, section: gross, statement: "In centrilobular emphysema the damage stays at the respiratory bronchiole, the proximal part of the acinus", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c032, section: gross, statement: "Centrilobular is the most frequent form of emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c033, section: gross, statement: "Centrilobular emphysema is usually symptomatic and usually occurs together with smoking", sourceRef: { source: rubin-8e, chapter: "18", pages: "723, 725" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c034, section: gross, statement: "Enlarged spaces in early centrilobular emphysema are separated by normal alveolar ducts and alveoli", sourceRef: { source: rubin-8e, chapter: "18", pages: "725" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c035, section: gross, statement: "With progression the distal structures can also be destroyed, giving large irregular airspaces", sourceRef: { source: rubin-8e, chapter: "18", pages: "725" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c036, section: gross, statement: "The worst centrilobular damage lies in the upper lobes and extends into the superior segments of the lower lobes", sourceRef: { source: rubin-8e, chapter: "18", pages: "725" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c037, section: gross, statement: "In panacinar emphysema septa are lost from the center of each acinus outward, and the whole acinus is affected uniformly", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c038, section: gross, statement: "Late panacinar emphysema leaves only a fine scaffold of supporting tissue, called cotton-candy lung", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
- { claimId: emphysema-c039, section: gross, statement: "Alpha-1 antitrypsin deficiency is the typical setting for panacinar emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c040, section: gross, statement: "When a smoker has both centrilobular and panacinar disease, the panacinar one tends to lie lower in the lung", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
- { claimId: emphysema-c041, section: gross, statement: "Localized (distal acinar, paraseptal) emphysema damages a single site or at most a few sites, with normal lung around them", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c042, section: gross, statement: "Localized emphysema can arise anywhere but usually lies beneath the pleura, at the top of an upper lobe", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c043, section: gross, statement: "Bullae are large destroyed areas into which a localized emphysema focus can grow", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c044, section: gross, statement: "Bullae vary from as small as 2 cm to filling an entire hemithorax", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c045, section: micro, statement: "In centrilobular emphysema the bronchioles leading into the emphysematous spaces are narrowed and inflamed", sourceRef: { source: rubin-8e, chapter: "18", pages: "725" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c046, section: micro, statement: "Lung in alpha-1 antitrypsin deficiency looks hollowed out, with sparse alveolar walls and wide, uneven airspaces", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c047, section: micro, statement: "In localized emphysema, lost alveolar tissue leaves enlarged subpleural airspaces", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c048, section: ancillary, statement: "Whole-mount lung slices show where the enlarged airspaces lie in the lobes", sourceRef: { source: rubin-8e, chapter: "18", pages: "725, 726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c049, section: ancillary, statement: "Comparing diseased lung with normal lung histologically shows how many alveolar walls are lost", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c050, section: ancillary, statement: "The PiZ allele of SERPINA1 lies behind most emphysema diagnosed in patients younger than 40", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c051, section: clinical, statement: "Dyspnea on effort lasts for years, and the slight cough brings up no sputum", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c052, section: clinical, statement: "Breathing draws on accessory muscles, and emphysema patients have lost weight", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c053, section: clinical, statement: "Weight loss probably comes from the effort of breathing rather than from eating too little", sourceRef: { source: rubin-8e, chapter: "18", pages: "726, 727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c054, section: clinical, statement: "Patients breathe rapidly and expiration takes longer than normal", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c055, section: clinical, statement: "Fast breathing and high minute ventilation let pink puffers keep arterial hemoglobin saturation near normal", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14 }
- { claimId: emphysema-c056, section: clinical, statement: "Cor pulmonale is less likely in emphysema than in chronic bronchitis, and recurrent infections are no more common", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c057, section: clinical, statement: "Chronic bronchitis and emphysema often coexist, so telling which causes a patient's symptoms is hard", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c058, section: clinical, statement: "Cyanosis plus edema from cor pulmonale earned chronic bronchitis patients the label blue bloater", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c059, section: diagnosis, statement: "On radiographs the diaphragms are depressed and the lungs are enlarged, which is overinflation", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c060, section: diagnosis, statement: "A barrel chest results from an increased anteroposterior chest diameter", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c061, section: diagnosis, statement: "Bronchovascular markings fade out before the peripheral lung fields on radiographs", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c062, section: prognosis, statement: "Dyspnea progresses steadily and respiratory function declines inexorably in emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c063, section: prognosis, statement: "Lung transplantation is a treatment option for advanced emphysema", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c064, section: prognosis, statement: "Rupture of a focus of localized emphysema may cause spontaneous pneumothorax, especially in younger people", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c065, section: prognosis, statement: "Localized emphysema by itself has no clinical significance", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c066, section: differential, statement: "Chronic bronchitis patients typically report years of cough with sputum", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c067, section: differential, statement: "In chronic bronchitis mucus glands are enlarged and the Reid index exceeds 0.5 (normal 0.4 or less)", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c068, section: differential, statement: "Asthma gives paroxysmal cough, dyspnea and wheezing, with symptom-free periods possible between attacks", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c069, section: differential, statement: "Alpha-1 antitrypsin deficiency typically produces panacinar emphysema and is more common in young people with severe disease", sourceRef: { source: rubin-8e, chapter: "18", pages: "723, 726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c070, section: high-yield, statement: "Centrilobular emphysema goes with smoking and is worst in the upper lobes", sourceRef: { source: rubin-8e, chapter: "18", pages: "723, 725" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c071, section: high-yield, statement: "Panacinar emphysema is typically associated with alpha-1 antitrypsin deficiency", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c072, section: high-yield, statement: "Paraseptal emphysema is subpleural, usually apical, and its rupture can cause pneumothorax", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c073, section: high-yield, statement: "Emphysema reflects an imbalance between elastase activity and its inhibitor alpha-1 antitrypsin", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c074, section: high-yield, statement: "PiZZ plasma alpha-1 antitrypsin is 15% to 20% of normal", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c075, section: high-yield, statement: "The pink puffer maintains near-normal arterial hemoglobin saturation", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c076, section: high-yield, statement: "Radiographs show overinflated lungs and a barrel chest", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c077, section: high-yield, statement: "Bullae range in size from 2 cm to a whole hemithorax", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c078, section: traps, statement: "Emphysema destroys airspace walls without producing fibrosis", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c079, section: traps, statement: "Severity of emphysema matters more than its anatomic type", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c080, section: traps, statement: "Emphysema is absent in most PiZZ homozygotes who do not smoke", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c081, section: traps, statement: "Emphysema patients keep near-normal arterial oxygen saturation", sourceRef: { source: rubin-8e, chapter: "18", pages: "727" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c082, section: traps, statement: "The blue bloater, with cyanosis and edema, is the chronic bronchitis picture", sourceRef: { source: rubin-8e, chapter: "18", pages: "723" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
- { claimId: emphysema-c083, section: traps, statement: "Coal miners' focal dust emphysema resembles centrilobular disease but lacks bronchiolar inflammation, with smaller, more even spaces", sourceRef: { source: rubin-8e, chapter: "18", pages: "726" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
