entity: gastric-polyps
claims:
- {claimId: gastric-polyps-c001, section: definition, statement: "At endoscopy or autopsy, a gastric polyp is any bump visibly rising from the stomach mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c002, section: definition, statement: "Most gastric polyps are not true neoplasms, which sets the stomach apart from the colon", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c003, section: definition, statement: "The reference describes three main polyp types: fundic gland, hyperplastic and adenoma", sourceRef: {source: rubin-8e, chapter: "19", pages: "787-788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c004, section: definition, statement: "Today the fundic gland type is the commonest gastric polyp, a result of growing PPI use", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c005, section: etiology, statement: "The original description of fundic gland polyps came from patients with familial adenomatous polyposis", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c006, section: etiology, statement: "In PPI users the fundic gland polyps are usually isolated or few, in contrast to FAP where they are very numerous", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c007, section: etiology, statement: "Chronic gastritis or reactive gastropathy is the background of hyperplastic polyps", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c008, section: etiology, statement: "Intestinal metaplasia in the surrounding mucosa is the usual setting of intestinal-type gastric adenomas", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c009, section: pathogenesis, statement: "The pathway disturbed in fundic gland polyps is Wnt/beta-catenin, whether the polyp is sporadic or syndromic (FAP)", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c010, section: pathogenesis, statement: "A hyperplastic polyp is a patch of mucosa that overgrows after injury", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c011, section: pathogenesis, statement: "Excess TGF-alpha, an EGFR activator, makes the foveolar cells proliferate massively in Menetrier disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c012, section: gross, statement: "Fundic gland polyps are confined to the gastric body and fundus", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c013, section: gross, statement: "Patients with FAP have a very large number of fundic gland polyps in the proximal stomach", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c014, section: gross, statement: "Hyperplastic polyps can be single or multiple", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c015, section: gross, statement: "Outside FAP, a gastric adenoma is typically a solitary lesion", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c016, section: gross, statement: "The antrum escapes in Menetrier disease, while the folds of the body and fundus are markedly thickened", sourceRef: {source: rubin-8e, chapter: "19", pages: "786"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c017, section: micro, statement: "The cystic glands of a fundic gland polyp still hold acid-secreting, enzyme-producing and mucus-producing cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c018, section: micro, statement: "In hyperplastic polyps the lamina propria is inflamed and the foveolar epithelium is overgrown, sometimes forming small cysts", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c019, section: micro, statement: "Surface erosion in hyperplastic polyps can come with reactive atypia", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c020, section: micro, statement: "Whether foveolar or intestinal in type, a gastric adenoma is dysplastic by definition", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c021, section: micro, statement: "Nuclei in intestinal-type gastric adenoma are pencil-shaped and hyperchromatic, resembling intestinal adenoma nuclei", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c022, section: micro, statement: "Foveolar-type adenomas occur in FAP, though intestinal metaplasia plays no part", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c023, section: ancillary, statement: "Fundic gland polyps show changes in the Wnt/beta-catenin pathway", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c024, section: clinical, statement: "Besides FAP, several syndromes give multiple gastric polyps: Cowden, Cronkhite-Canada, Peutz-Jeghers and familial juvenile polyposis", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c025, section: clinical, statement: "Peripheral edema marks severe Menetrier disease, and abdominal pain is the usual complaint in a disease that begins insidiously", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c026, section: clinical, statement: "Infection-related Menetrier disease can be treated with antibacterial or antiviral drugs; other options are octreotide, cetuximab and gastrectomy", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c027, section: diagnosis, statement: "Syndromic gastric polyps have no distinctive look; the usual mistaken identity is a large hyperplastic polyp", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c028, section: diagnosis, statement: "A syndromic polyp is classified by finding the underlying syndrome rather than by its own appearance", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c029, section: diagnosis, statement: "In Menetrier disease the blood albumin is low because the mucosa loses protein", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c030, section: prognosis, statement: "PPI-associated fundic gland polyps seem harmless", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c031, section: prognosis, statement: "Focal dysplasia is a rare finding in the fundic gland polyps of FAP", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c032, section: prognosis, statement: "Gastric adenoma can be linked to carcinoma, though less firmly than colonic adenoma", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c033, section: prognosis, statement: "Gastric carcinoma is more likely to develop in Menetrier disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c034, section: differential, statement: "Fundic gland polyps have cystic glands with parietal and chief cells", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c035, section: differential, statement: "Hyperplastic polyps show foveolar hyperplasia with inflamed lamina propria", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c036, section: differential, statement: "Dysplasia is present in adenomas by definition", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c037, section: differential, statement: "Menetrier disease thickens the folds through massive foveolar hyperplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c038, section: differential, statement: "In Zollinger-Ellison syndrome a gastrin-producing tumor makes parietal cells multiply, giving thick bumpy rugal folds", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c039, section: differential, statement: "Polyps of polyposis syndromes are plain and easily mistaken for an oversized hyperplastic polyp", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c040, section: high-yield, statement: "Most gastric polyps are not true neoplasms", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c041, section: high-yield, statement: "Fundic gland polyps are the most common gastric polyp, in step with PPI use", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c042, section: high-yield, statement: "Hyperplastic polyps arise from chronic gastritis or mucosal injury", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c043, section: high-yield, statement: "Adenomas are dysplastic and the intestinal type usually arises on intestinal metaplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c044, section: high-yield, statement: "Syndromes with multiple gastric polyps are Cowden, Cronkhite-Canada, Peutz-Jeghers, juvenile polyposis and FAP", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c045, section: high-yield, statement: "Menetrier disease leads to hypoalbuminemia through mucosal protein loss", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c046, section: traps, statement: "Unlike colonic polyps, most gastric polyps are not neoplasms", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c047, section: traps, statement: "Gastric hyperplastic polyps are a reactive response, and the colonic polyps that share their name are unrelated", sourceRef: {source: rubin-8e, chapter: "19", pages: "787-788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c048, section: traps, statement: "Menetrier disease involves foveolar cells and Zollinger-Ellison syndrome parietal cells as the proliferating component", sourceRef: {source: rubin-8e, chapter: "19", pages: "787"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c049, section: traps, statement: "The gastric adenoma-carcinoma relationship is not as close as in the colon", sourceRef: {source: rubin-8e, chapter: "19", pages: "788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: gastric-polyps-c050, section: mnemonics, statement: "Fundic polyps go with PPIs, hyperplastic polyps with mucosal injury, adenomas with dysplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "787-788"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
