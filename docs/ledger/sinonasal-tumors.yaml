entity: sinonasal-tumors
claims:
  - { claimId: sinonasal-tumors-c001, section: definition, statement: "Sinonasal tumors range from benign papillomas to aggressive cancers and lymphomas of the nasal cavity and sinuses", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312-1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c002, section: definition, statement: "Squamous papilloma is the most frequent of the benign nasal cavity tumors", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c004, section: definition, statement: "Schneiderian papillomas arise from the sinonasal mucosa", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c005, section: definition, statement: "Fungiform, oncocytic and inverted papillomas are the three types of Schneiderian papilloma", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c006, section: definition, statement: "Schneiderian papillomas are under 5% of sinonasal tract tumors", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c007, section: definition, statement: "SCC, keratinizing or not, makes up most sinonasal malignancies", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c008, section: definition, statement: "About a third of sinonasal cancers originate in the nasal cavity, and over half in the maxillary sinus", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c009, section: etiology, statement: "Aromatic hydrocarbons, chromium and nickel are industrial chemicals that can cause nose and sinus cancer", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c010, section: etiology, statement: "Workers in leather and textile trades, with cutting oils, or in furniture woodworking have a higher risk, and the responsible chemical is unknown", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c011, section: etiology, statement: "Men and people over age 50 are affected far more often, which reflects the occupational risk", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c012, section: etiology, statement: "The significance of HPV 6 and 11, detected in inverted papilloma, is uncertain", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c013, section: etiology, statement: "EBV infection is associated with nasal-type NK/T-cell lymphoma", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c014, section: pathogenesis, statement: "Olfactory neuroblastoma is of neural crest origin", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c015, section: pathogenesis, statement: "Pressure from an inverted papilloma can erode bone although the tumor is benign", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c016, section: pathogenesis, statement: "Tissue next to NK/T lymphoma undergoes ischemic-type necrosis because tumor cells invade small to medium vessels and often occlude them", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c018, section: gross, statement: "Inverted papilloma may spread to the sinuses from its usual site on the lateral nasal wall", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c019, section: gross, statement: "The olfactory mucosa from which olfactory neuroblastoma arises covers the superior turbinate, the cribriform plate and the upper third of the septum", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c021, section: gross, statement: "In NK/T lymphoma ulceration of the nasal mucosa is a late event, after swelling and stiffening", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c023, section: micro, statement: "Inverted papilloma is named because the surface epithelium grows down into the underlying tissue", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312-1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c026, section: micro, statement: "Olfactory neuroblastoma cells have inconspicuous cytoplasm and round nuclei, forming a small round cell tumor", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313-1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c027, section: micro, statement: "Olfactory neuroblastoma can show two kinds of rosettes: Flexner-Wintersteiner true rosettes and Homer Wright pseudorosettes", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c028, section: micro, statement: "The lymphoid infiltrate of NK/T lymphoma surrounds vessels, is polymorphic and causes necrosis", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c029, section: ancillary, statement: "On H&E, olfactory neuroblastoma cells lie in an eosinophilic neurofibrillary background and may form rosettes", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313-1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c030, section: ancillary, statement: "Olfactory neuroblastoma lacks cytokeratin and EMA but expresses synaptophysin and NSE", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c033, section: ancillary, statement: "Since 2017 the WHO has graded olfactory neuroblastoma in four tiers", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c034, section: clinical, statement: "Facial deformity can result when a maxillary sinus tumor grows into adjacent tissue", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c036, section: clinical, statement: "In nickel workers, SCC usually starts in the middle turbinate", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c037, section: clinical, statement: "The latency between nickel exposure and SCC is from 2 to over 30 years", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c038, section: clinical, statement: "Adenocarcinoma, mainly in the maxillary and ethmoid sinuses, is the usual result of most other occupational exposures", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c042, section: clinical, statement: "NK/T lymphoma often starts quietly and looks like a common nasal or sinus inflammation", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c045, section: diagnosis, statement: "Olfactory neuroblastoma starts at the cribriform plate and is bright on contrast-enhanced T1 MRI, filling the nasal cavity", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c047, section: prognosis, statement: "Squamous and glandular sinonasal carcinomas usually spread by local invasion of nearby structures rather than by metastasis", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c048, section: prognosis, statement: "Patients with squamous or glandular sinonasal carcinoma usually live only a few years", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c049, section: prognosis, statement: "Inverted papilloma may recur unless resection extends beyond the grossly visible lesion", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c050, section: prognosis, statement: "Inverted papilloma becomes SCC in 5% of cases", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c051, section: prognosis, statement: "Olfactory neuroblastoma often spreads along lymphatics to lymph nodes near and far from the tumor", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c053, section: prognosis, statement: "Prognosis of olfactory neuroblastoma usually corresponds to grade", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c054, section: prognosis, statement: "With complete excision, craniofacial resection plus chemotherapy or radiation gives 85% 5-year survival in olfactory neuroblastoma", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c056, section: prognosis, statement: "NK/T lymphoma usually kills through hemorrhage from eroded large vessels or through infection, aspiration pneumonia included", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c058, section: differential, statement: "Olfactory neuroblastoma is a small round cell tumor with rosettes arising from the upper nasal mucosa", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313-1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c059, section: differential, statement: "Olfactory neuroblastoma expresses synaptophysin and not cytokeratin", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c060, section: differential, statement: "Sinonasal SCC is mostly keratinizing or nonkeratinizing and often maxillary", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c061, section: differential, statement: "NK/T lymphoma has an angiocentric necrotizing infiltrate and EBV association", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c064, section: differential, statement: "Granulomatosis with polyangiitis lacks well-formed granulomas and instead shows vasculitis with giant cells and microabscesses", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c066, section: high-yield, statement: "Inverted papilloma gives rise to SCC in 5% of cases", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c067, section: high-yield, statement: "SCC of nickel workers arises mostly in the middle turbinate", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c068, section: high-yield, statement: "Adenocarcinoma of the maxillary and ethmoid sinuses is the usual result of most other occupational exposures", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c069, section: high-yield, statement: "Olfactory neuroblastoma is neural crest, synaptophysin positive and cytokeratin negative", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313-1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c070, section: high-yield, statement: "Olfactory neuroblastoma forms Homer Wright and Flexner-Wintersteiner rosettes", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c071, section: high-yield, statement: "NK/T lymphoma is angiocentric and EBV-associated with ischemic necrosis", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c074, section: traps, statement: "Inverted papilloma gives rise to SCC in 5% of cases", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c076, section: traps, statement: "Olfactory neuroblastoma often spreads to lymph nodes along lymphatic channels", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c077, section: traps, statement: "The condition once called lethal midline granuloma is in fact a malignant lymphoma", sourceRef: { source: rubin-8e, chapter: "29", pages: "1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c078, section: traps, statement: "Olfactory neuroblastoma is neural crest and lacks cytokeratin", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313-1314" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c079, section: mnemonics, statement: "Nickel workers get SCC while most other exposures lead to adenocarcinoma", sourceRef: { source: rubin-8e, chapter: "29", pages: "1313" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: sinonasal-tumors-c080, section: differential, statement: "Granulomatosis with polyangiitis is worked up with serum ANCA and proteinase 3 testing", sourceRef: { source: rubin-8e, chapter: "29", pages: "1312" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
