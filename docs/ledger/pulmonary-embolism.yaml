entity: pulmonary-embolism
claims:
  - { claimId: pulmonary-embolism-c001, section: definition, statement: "Pulmonary embolism is obstruction of a pulmonary artery by material that travelled through the veins, most often a thromboembolus.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c002, section: definition, statement: "A thromboembolus is clot material that travels in the blood and lodges in a vessel away from its site of formation.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c003, section: definition, statement: "More than half of autopsies reveal pulmonary thromboemboli.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c004, section: definition, statement: "A pulmonary embolus can be lethal.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c005, section: etiology, statement: "The deep leg veins give rise to about 90% of pulmonary emboli.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c006, section: etiology, statement: "The iliofemoral veins are the most common origin of lethal emboli.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c007, section: etiology, statement: "In about half of patients whose emboli arise in the leg veins, no signs of deep vein thrombosis are present.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c008, section: etiology, statement: "Some thromboemboli originate in the pelvic venous plexus or the right side of the heart.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c010, section: etiology, statement: "Older age and obesity are among the factors that make pulmonary embolism after surgery more likely.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c011, section: etiology, statement: "A thrombus that stasis formed during prolonged bed rest can shed a fragment at the first rising.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c012, section: etiology, statement: "Rarely, a fatal pulmonary embolism follows a venous clot formed while sitting immobile on a flight.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c015, section: pathogenesis, statement: "How pulmonary embolism presents depends on acute versus chronic onset, embolus size and patient health.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c016, section: pathogenesis, statement: "Both lungs lose flow when a large saddle embolus sits astride the split of the main pulmonary artery.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c017, section: pathogenesis, statement: "A massive pulmonary embolism that abruptly obstructs right ventricular outflow makes the right ventricle fail acutely.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333-334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c018, section: pathogenesis, statement: "When the right ventricle stops working, left ventricular output falls markedly and the resulting low output produces abrupt hypotension.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c019, section: pathogenesis, statement: "Shock and immediate death are common when over half of the pulmonary arteries are abruptly blocked.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c020, section: pathogenesis, statement: "A group of smaller emboli sitting in secondary branches can also cause death.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c021, section: pathogenesis, statement: "Small emboli are seldom lethal, and they usually come to rest in peripheral pulmonary arteries.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c022, section: pathogenesis, statement: "The lung normally avoids ischemia since blood reaches it through both the pulmonary and the bronchial circulation.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c023, section: pathogenesis, statement: "Because of the two arterial supplies, 75% of small emboli leave the lung uninfarcted.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c024, section: pathogenesis, statement: "About 15% to 20% of pulmonary emboli cause lung infarcts.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c025, section: pathogenesis, statement: "Lung infarction usually occurs when one of the two arterial supplies is already impaired, for example in chronic lung disease or congestive heart failure.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c026, section: pathogenesis, statement: "Small emboli give off vasoactive substances, and these produce reflex constriction of vessels and bronchi.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c027, section: pathogenesis, statement: "Pulmonary hypertension can result from silent small emboli that keep arriving from peripheral veins and slowly shrink the usable vascular bed.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c028, section: pathogenesis, statement: "Chronic thromboembolic pulmonary hypertension is pulmonary hypertension with right-sided heart failure that follows accumulation of mostly silent emboli in small lung arteries.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c029, section: pathogenesis, statement: "Paradoxical embolism, in which a venous embolus passes an incompletely closed foramen ovale and blocks a systemic artery, mostly occurs with a right-to-left shunt.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c030, section: gross, statement: "A saddle embolus sits at the branching point of the main pulmonary artery and is exposed when the vessel is opened.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c031, section: gross, statement: "A lung infarct usually has its base on the pleura, which gives it a pyramidal shape.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c032, section: gross, statement: "Lung infarcts are usually hemorrhagic, since the bronchial artery continues to deliver blood to the necrotic zone.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c033, section: gross, statement: "In chronic thromboembolic pulmonary hypertension, a platelet-rich plaque in the arteries of both lungs can be removed intact at surgery.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c034, section: micro, statement: "An older pulmonary infarct has a pale center, after the blood it contained has been resorbed.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c035, section: micro, statement: "Healing of the infarct ends in a fibrous scar, as the granulation tissue at its rim becomes organized.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c036, section: micro, statement: "In partial infarction the tissue regenerates without a scar because collateral flow keeps it viable and its supporting framework survives the hemorrhage and necrosis.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c037, section: micro, statement: "After organization a thromboembolus can persist as fibrous cords on the inner wall of a pulmonary artery.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c038, section: micro, statement: "A web is a fibrous strand across a small pulmonary artery lumen, left by an organized embolus.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c039, section: ancillary, statement: "The neointimal plaque of chronic thromboembolic pulmonary hypertension is the specimen, removed whole from the pulmonary arteries at surgery.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c041, section: clinical, statement: "Acute pulmonary embolism may be small and asymptomatic.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c042, section: clinical, statement: "Some patients have only brief shortness of breath and rapid breathing.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c043, section: clinical, statement: "An infarct caused by embolism is accompanied by hemoptysis and pleuritic chest pain.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c044, section: clinical, statement: "Fluid collects in the pleural space frequently in pulmonary infarction, and it is often bloody.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c045, section: clinical, statement: "Acute pulmonary embolism can also end in sudden death through cardiovascular collapse.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c046, section: clinical, statement: "A few patients with small emboli and no infarction develop hypotension with chest pain and respiratory symptoms.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c047, section: clinical, statement: "Calf vein thrombi that are small usually cause no symptoms.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c048, section: clinical, statement: "The Homan sign refers to calf pain linked with forcing the foot upward at the ankle.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c050, section: diagnosis, statement: "In chronic pulmonary embolism, a segmental pulmonary artery can show a dark, partly obstructing thrombus on contrast-enhanced CT.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c051, section: diagnosis, statement: "Partial infarction heals without a scar although clinical and radiologic findings suggest true infarction.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c052, section: prognosis, statement: "Full resolution of a small embolus needs clot lysis and enough lung reserve, vascular and bronchial collateral, for the embolic load.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c053, section: prognosis, statement: "About half of pulmonary thromboemboli are gone or organized by 8 weeks on imaging, and the vessels narrow only slightly.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c054, section: prognosis, statement: "A hospitalized patient who looks on track to recover can collapse and die suddenly from a massive pulmonary embolism.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c055, section: prognosis, statement: "Anticoagulation is the main treatment of DVT with symptoms; clot-lysing drugs suit only some patients.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c057, section: differential, statement: "A thrombus remains at its site of formation, whereas an embolus is material that has traveled from elsewhere.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c058, section: differential, statement: "The deep veins of the legs are where most pulmonary emboli originate.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c059, section: differential, statement: "Only a minority of pulmonary emboli, 15% to 20%, cause lung infarcts.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c060, section: differential, statement: "A pulmonary infarct is a pyramid-shaped lesion whose base lies on the pleura.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c061, section: differential, statement: "Alveolar hypoxia from any cause, and left ventricular failure via higher pulmonary venous pressure, can raise pulmonary artery pressure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c062, section: differential, statement: "Plexiform lesions mark severe pulmonary arterial hypertension, whereas recurrent emboli leave organized thromboemboli and fibrous webs.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c063, section: differential, statement: "In paradoxical embolism a venous clot crosses a patent foramen ovale and obstructs a systemic artery.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c064, section: differential, statement: "Paradoxical embolism is usually associated with a right-to-left shunt.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c065, section: high-yield, statement: "About 90% of pulmonary emboli arise from deep leg veins.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c066, section: high-yield, statement: "A saddle embolus stops blood flow to both lungs.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c067, section: high-yield, statement: "Massive pulmonary embolism makes the right ventricle fail suddenly and sharply lowers left ventricular output.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333-334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c068, section: high-yield, statement: "Lung infarcts are pyramidal and hemorrhagic, and most small emboli spare the lung because of its two arterial supplies.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c069, section: high-yield, statement: "Recurrent, usually asymptomatic small emboli can lead to chronic thromboembolic pulmonary hypertension.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c070, section: high-yield, statement: "Paradoxical emboli cross an incompletely closed foramen ovale and enter systemic arteries.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c071, section: traps, statement: "Because the lung has two arterial supplies, most small emboli leave it uninfarcted.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c072, section: traps, statement: "Pulmonary infarcts are hemorrhagic because bronchial artery flow still reaches the necrotic area.", sourceRef: { source: rubin-8e, chapter: "7", pages: "334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c073, section: traps, statement: "In about half of patients whose emboli arise in the leg veins, no signs of deep vein thrombosis are present.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c074, section: traps, statement: "Silent small emboli that keep coming can lead over time to pulmonary hypertension.", sourceRef: { source: rubin-8e, chapter: "18", pages: "750" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c075, section: traps, statement: "Several smaller emboli sitting in secondary branches can kill as well.", sourceRef: { source: rubin-8e, chapter: "7", pages: "333" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: pulmonary-embolism-c076, section: mnemonics, statement: "Most pulmonary emboli come from deep leg veins, the outcome depends on embolus size, large ones can saddle the main artery and small ones are spared infarction by the dual supply.", sourceRef: { source: rubin-8e, chapter: "7", pages: "332-334" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
