entity: ulcerative-colitis
claims:
- {claimId: ulcerative-colitis-c001, section: definition, statement: "Ulcerative colitis is a chronic inflammatory disease of the rectum and colon in which the inflammation is largely restricted to the mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "814-815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c002, section: definition, statement: "In untreated disease the lesion is continuous, climbing from the rectum without skipped segments", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c003, section: definition, statement: "Pancolitis is whole-colon disease, ulcerative proctitis is rectum-only disease, and left-sided colitis (proctosigmoiditis) extends up to the splenic flexure", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c004, section: definition, statement: "Incidence is higher in developed countries and is climbing as populations take on a Western way of life", sourceRef: {source: rubin-8e, chapter: "19", pages: "814"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c005, section: definition, statement: "Age at onset is bimodal, peaking at 15-30 years and at 50-70 years", sourceRef: {source: rubin-8e, chapter: "19", pages: "814"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c006, section: etiology, statement: "Rising incidence where Western habits spread suggests that environmental factors may contribute", sourceRef: {source: rubin-8e, chapter: "19", pages: "814"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c007, section: etiology, statement: "People who have quit smoking are at higher risk, while smoking itself seems protective", sourceRef: {source: rubin-8e, chapter: "19", pages: "814"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c008, section: etiology, statement: "Relatives with inflammatory bowel disease raise a person's risk, but the association is weaker than in Crohn disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "814"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c009, section: etiology, statement: "An attack can be provoked or aggravated by C. difficile or CMV infection", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c010, section: pathogenesis, statement: "Crypt abscesses result from neutrophils entering the crypts together with pus-forming death of the lining epithelium", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c011, section: pathogenesis, statement: "Merged crypt abscesses undermine the mucosa, producing ulcers with surviving mucosal islands nearby", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c012, section: pathogenesis, statement: "The disease may reach its characteristic morphologic changes (extent and mucosal-only involvement) quickly or over years; the source sentence is not tied to crypt abscesses", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c013, section: gross, statement: "Early in the disease the mucosa is denuded, red and granular, bleeds easily and is often covered by a yellowish exudate", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c014, section: gross, statement: "Shallow ulcers can grow as small erosions run together, leaving patches of intact mucosa among them", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c015, section: gross, statement: "The deep layers are not usually involved, so the strictures and fistulas of Crohn disease do not occur", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c016, section: gross, statement: "In long-standing disease the mucosa is smooth or granular without folds, and the large bowel may shorten, mostly on the left", sourceRef: {source: rubin-8e, chapter: "19", pages: "815-816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c017, section: gross, statement: "Rectal sparing is possible in ulcerative colitis, but it should bring Crohn disease to mind", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c018, section: gross, statement: "Only mild backwash ileitis occasionally spreads into the ileum; the ileocecal valve is the usual limit, even with cecal involvement", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c019, section: micro, statement: "In early disease the mucosa is swollen and congested with pinpoint hemorrhages", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c020, section: micro, statement: "Lymphocytes and plasma cells are prominent among the mixed inflammatory cells diffusely filling the lamina propria", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c021, section: micro, statement: "Neutrophils often surround and infiltrate damaged crypts, a finding called cryptitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c022, section: micro, statement: "A crypt abscess is a dilated crypt filled with neutrophils", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c023, section: micro, statement: "The residual mucosal islands beside ulcers, produced by coalescing crypt abscesses, are called inflammatory pseudopolyps", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c024, section: micro, statement: "Late in disease the mucosa thins with Paneth cell metaplasia, and crypts shorten and become twisted or branched", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c025, section: micro, statement: "Distorted crypts often persist once active disease has subsided, marking earlier chronic mucosal damage", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c026, section: micro, statement: "Inflammation is confined to the mucosa, sparing submucosa and muscularis propria, and reaches deeper only in rare fulminant cases", sourceRef: {source: rubin-8e, chapter: "19", pages: "815-816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c027, section: micro, statement: "Table 19-4 lists crypt abscesses as typical in both Crohn disease and ulcerative colitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c028, section: ancillary, statement: "Resected colon and biopsies are the specimens, and early microscopic changes match the endoscopic appearance", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c029, section: ancillary, statement: "The histologic features to look for are cryptitis, crypt abscesses, crypt distortion and mucosal inflammatory infiltrate", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c030, section: ancillary, statement: "Dysplastic cells do not mature normally and have atypical nuclei that take up a large share of the cell (high nuclear-to-cytoplasmic ratio)", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c031, section: ancillary, statement: "Dysplasia is classified as low or high grade according to cytologic and architectural change", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c032, section: ancillary, statement: "Biopsies are called indefinite for dysplasia when heavy inflammation prevents a firm diagnosis", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c033, section: ancillary, statement: "Using chromoendoscopy or confocal laser endomicroscopy may increase the number of dysplastic lesions found on biopsy", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c034, section: clinical, statement: "The usual course is relapsing, with attacks alternating with partial or complete remissions", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c035, section: clinical, statement: "Half of patients have mild disease of the rectum and lower sigmoid, with rectal bleeding as the main symptom and tenesmus in some", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c036, section: clinical, statement: "About 40% of patients have moderate disease, often left-sided, with episodes of bloody loose stools, abdominal pain and low fever, and chronic blood loss often causes anemia", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c037, section: clinical, statement: "About 10% of patients have severe disease, usually pancolitis, losing blood, fluid and electrolytes through frequent bloody stools, often with fever", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c038, section: clinical, statement: "In toxic megacolon the colon dilates massively and carries a high risk of perforation", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c039, section: clinical, statement: "Fulminant colitis is an emergency needing immediate intensive treatment, and colectomy is sometimes required without delay", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c042, section: diagnosis, statement: "Distinguishing ulcerative colitis from Crohn colitis depends on anatomic localization and histopathology", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c043, section: diagnosis, statement: "Medical and surgical treatment differ between the two diseases, and ulcerative colitis carries a higher cancer risk", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c045, section: diagnosis, statement: "C. difficile and CMV infection should be looked for and treated if identified", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c046, section: diagnosis, statement: "Indeterminate colitis is the label for the roughly 10% of cases in which the two diseases cannot be told apart, mostly fulminant ones", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c047, section: prognosis, statement: "Local complications include hemorrhage, perforation and toxic megacolon, as well as inflammatory pseudopolyps and colonic carcinoma", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c049, section: prognosis, statement: "Patients with long-standing ulcerative colitis are more likely than the general population to develop colorectal cancer", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c050, section: prognosis, statement: "Greater extent and longer duration of disease both increase the risk, which is elevated beyond 10 years of disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c051, section: prognosis, statement: "Inflammation restricted to the rectum leaves the cancer risk close to the general level", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c052, section: prognosis, statement: "Dysplasia and colorectal cancer are more likely in ulcerative colitis patients who also develop primary sclerosing cholangitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c053, section: prognosis, statement: "Dysplasia precedes carcinoma and may be flat or appear as a polypoid lesion", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c054, section: prognosis, statement: "A biopsy with high-grade dysplasia is a strong reason for colectomy because of the high risk of eventual colorectal cancer", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c055, section: prognosis, statement: "To detect dysplasia, regular colonoscopy with biopsies is advised for most patients once the disease is established", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c056, section: prognosis, statement: "Anti-inflammatory therapy and endoscopic monitoring with biopsies can reduce the risk of dysplasia and cancer", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c057, section: differential, statement: "Crohn colitis shows granulomas in some specimens, along with full-thickness inflammation and patchy lesions that often avoid the rectum", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c058, section: differential, statement: "Ulcerative colitis and Crohn colitis are separated by anatomic distribution and histopathology", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c059, section: differential, statement: "Bacterial and amebic infections must be excluded, and when inflammation is rectum-only, rarer organisms such as viruses or fungi should be considered", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c060, section: differential, statement: "Infection that can set off or worsen an attack should be excluded and treated when found", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c061, section: differential, statement: "Solitary rectal ulcer syndrome and radiation injury, in addition to ischemic and antibiotic-associated colitis, can mimic ulcerative colitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c062, section: differential, statement: "In microscopic colitis chronic watery diarrhea is the main symptom while the colon looks grossly normal", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c063, section: differential, statement: "Only microscopic evaluation reveals the abnormality in microscopic colitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c064, section: high-yield, statement: "Disease begins in the rectum and extends continuously without skip lesions, limited to the mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c065, section: high-yield, statement: "Crypt abscesses and crypt distortion are key microscopic features", sourceRef: {source: rubin-8e, chapter: "19", pages: "816"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c066, section: high-yield, statement: "Strictures, fistulas and granulomas are absent in ulcerative colitis and typical of Crohn disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "815, 818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c067, section: high-yield, statement: "Inflammatory pseudopolyps are the regenerating, inflamed mucosa left standing between denuded stretches of the colon wall", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c068, section: high-yield, statement: "Toxic megacolon is a massively dilated colon with a major risk of perforation", sourceRef: {source: rubin-8e, chapter: "19", pages: "817"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c069, section: high-yield, statement: "Cancer risk grows with extent and duration and surveillance colonoscopy with biopsies looks for dysplasia", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c070, section: high-yield, statement: "High-grade dysplasia on biopsy points strongly toward colectomy", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c071, section: traps, statement: "Rectal sparing is not typical and should raise the possibility of Crohn disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c072, section: traps, statement: "Crypt abscesses are typical of both ulcerative colitis and Crohn disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c073, section: traps, statement: "Inflammation is confined to colon and rectum and stops at the ileocecal valve, apart from minor backwash ileitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c074, section: traps, statement: "Disease limited to the rectum carries a cancer risk similar to the general population", sourceRef: {source: rubin-8e, chapter: "19", pages: "818"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: ulcerative-colitis-c075, section: mnemonics, statement: "Ulcerative colitis starts in the rectum, spreads continuously and involves the mucosa only", sourceRef: {source: rubin-8e, chapter: "19", pages: "815"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
