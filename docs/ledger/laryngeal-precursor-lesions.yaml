entity: laryngeal-precursor-lesions
claims:
  - claimId: laryngeal-precursor-lesions-c001
    section: definition
    statement: "Inflammation or trauma can produce a stromal reaction of the vocal cord, the nodule or polyp (singer's nodule), which is not neoplastic."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c002
    section: definition
    statement: "A squamous papilloma is a papillary growth of mature squamous epithelium."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c003
    section: definition
    statement: "Vocal cord nodules and polyps occur in all age groups."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c004
    section: definition
    statement: "Adults, mostly men, are the patients who develop a single laryngeal squamous papilloma."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c005
    section: definition
    statement: "Children and adolescents may have multiple laryngeal papillomas (juvenile laryngeal papillomatosis)."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c006
    section: etiology
    statement: "Overuse of the voice, irritants, laryngitis and an underactive thyroid are linked to vocal cord nodules and polyps."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c007
    section: etiology
    statement: "Laryngeal papillomas are mainly caused by HPV types 6 and 11."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c008
    section: pathogenesis
    statement: "HPV often involves wide areas of mucosa, so removing the visible growths does not reliably cure papillomatosis."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c009
    section: pathogenesis
    statement: "Papillomatosis can spread downward from the larynx to the trachea and bronchi."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c010
    section: gross
    statement: "In the pictured example, the polyp is one glossy mass sitting on a true vocal cord."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c011
    section: gross
    statement: "Laryngeal papillomas are papillary growths that may be solitary or multiple."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c012
    section: micro
    statement: "The stroma of early nodules and polyps is edematous and fibromyxoid."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c013
    section: micro
    statement: "With time the stroma of nodules and polyps becomes hyalinized and densely fibrotic."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c014
    section: micro
    statement: "Each papilloma frond has a fibrovascular core covered by mature squamous epithelium."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c015
    section: clinical
    statement: "Nodules and polyps make the voice hoarse or liable to break."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c016
    section: clinical
    statement: "Laryngeal papillomatosis can cause life-threatening respiratory obstruction."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c017
    section: prognosis
    statement: "Papillomatosis can relapse repeatedly for years."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c018
    section: prognosis
    statement: "A solitary laryngeal squamous papilloma in an adult is usually cured surgically."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c019
    section: prognosis
    statement: "Malignant change of papillomatosis into squamous cell carcinoma is rare and mostly affects smokers and irradiated patients."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c020
    section: differential
    statement: "The typical patient with laryngeal cancer is a man who smokes, and the tumor is almost always squamous cell carcinoma."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c021
    section: high-yield
    statement: "Vocal cord nodules and polyps are non-neoplastic stromal lesions."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c022
    section: high-yield
    statement: "HPV 6 and 11 are the main cause of laryngeal papillomas."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c023
    section: high-yield
    statement: "Juvenile laryngeal papillomatosis is multiple, recurs and can obstruct the airway."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c024
    section: high-yield
    statement: "A solitary laryngeal papilloma in an adult is usually cured by surgery."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c025
    section: traps
    statement: "A vocal cord polyp is a stromal reaction to inflammation or trauma, not a neoplasm."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c026
    section: traps
    statement: "Because the infection often covers a wide area, papillomatosis keeps coming back for years after removal."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: laryngeal-precursor-lesions-c027
    section: mnemonics
    statement: "The mnemonic VASIT recalls five triggers of nodules and polyps: overused voice, alcohol, smoking, infection and low thyroid function."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1319" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
