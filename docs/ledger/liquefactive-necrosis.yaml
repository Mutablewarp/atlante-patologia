entity: liquefactive-necrosis
claims:
  - claimId: liquefactive-necrosis-c001
    section: definition
    statement: "Liquefactive necrosis arises when necrotic cells are dissolved much faster than repair proceeds, so the dead area becomes fluid."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c002
    section: definition
    statement: "Its two textbook settings are focal bacterial infection producing an abscess through neutrophil enzymes and ischemic necrosis of the brain."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c003
    section: definition
    statement: "Pus is a purulent, neutrophil-rich exudate with substantial liquefied tissue; the inflammation producing it is termed suppurative."
    sourceRef: { source: rubin-8e, chapter: "2", pages: "68" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c004
    section: etiology
    statement: "Bacteria usually provide the stimulus that crowds neutrophils into a small focus, where tissue dies and dissolves quickly."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c005
    section: etiology
    statement: "Abscesses from microscopic size to several centimetres are the typical lesion of S. aureus, a pyogenic coccus, in normally sterile sites."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "409" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c006
    section: etiology
    statement: "Brain tissue supplied by an occluded cerebral artery dies and soon liquefies."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c007
    section: etiology
    statement: "A brain abscess starts with bacteria or fungi settling in brain tissue; they often come from a cardiac or pulmonary infection through the blood, but may also arrive from an infected neurosurgical wound or spread in from a neighbouring frontal-sinus or mastoid infection."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c008
    section: etiology
    statement: "Liquefactive necrosis of both globi pallidi is an almost pathognomonic lesion of severe carbon monoxide poisoning."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1490" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c009
    section: etiology
    statement: "Ingested strong alkalis produce transmural liquefactive necrosis of esophagus and stomach and saponify membrane lipids."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c010
    section: pathogenesis
    statement: "Liquefaction occurs when dissolution of necrotic cells runs far ahead of repair."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c011
    section: pathogenesis
    statement: "Acute inflammation provoked by necrosis makes the enzymatic digestion of dead cells most intense; the enzymes come partly from the dead cells and partly from outside them."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c012
    section: pathogenesis
    statement: "Hydrolases contained in neutrophils are strong enough to digest dead cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c013
    section: pathogenesis
    statement: "An abscess cavity opens within a solid organ because crowded neutrophils dissolve the tissue faster than it can be repaired."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c014
    section: pathogenesis
    statement: "Abscess is one outcome of acute inflammation: when fibrosis walls in the inflamed area, substances released by neutrophils destroy the enclosed tissue."
    sourceRef: { source: rubin-8e, chapter: "2", pages: "88" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c015
    section: pathogenesis
    statement: "Abscess contents stay confined because a fibrous capsule eventually grows around them."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c016
    section: pathogenesis
    statement: "Acute inflammation does not explain why dead brain tissue, initially coagulative, soon dissolves."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c017
    section: pathogenesis
    statement: "Hydrolases unique to nervous tissue, or the brain's abundant lysosomal enzymes, are proposed causes of brain liquefaction, which remains unexplained."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c018
    section: pathogenesis
    statement: "Strong alkalis liquefy tissue and, as liquids, usually injure severely (granular forms less often); strong acids penetrate less because the immediate coagulative necrosis they cause forms a protective eschar."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c019
    section: gross
    statement: "An abscess is a cavity in solid tissue produced by liquefactive necrosis and filled with purulent material."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c020
    section: gross
    statement: "Softening and discoloration of a bland thrombotic brain infarct become grossly evident only after the first several hours."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c021
    section: gross
    statement: "A brain infarct swells and liquefies between days 3 and 5."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c022
    section: gross
    statement: "Over weeks to months a brain infarct becomes a cystic space, sometimes with compensatory ventricular enlargement."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c023
    section: gross
    statement: "A cavity or cyst left by liquefaction of a large CNS area remains for life."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c024
    section: gross
    statement: "A brain abscess starts as cerebritis, an edematous inflammatory reaction, from which an expanding mass of liquefied tissue develops within days."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c025
    section: micro
    statement: "Neutrophils fill an abscess cavity together with structureless eosinophilic debris."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c026
    section: micro
    statement: "A mature brain abscess has a purulent core enclosed, from inside out, by granulation tissue, a fibroblast-collagen layer and an outer rim of reactive gliosis with edema."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465-1466" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c027
    section: micro
    statement: "The fibroblasts that wall off a forming brain abscess come from the cerebral microvasculature, as the brain otherwise has very few."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c028
    section: micro
    statement: "At 6 to 24 hours a brain infarct contains shrunken eosinophilic red neurons with pyknotic nuclei."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c029
    section: micro
    statement: "At 24-72 hours the infarct is edematous and softened, with prominent vessels and infiltrating neutrophils."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c030
    section: micro
    statement: "By 3-4 days the infarct is pulpy, and the neutrophils have given way to macrophages, which begin phagocytosing the dead tissue."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c031
    section: micro
    statement: "Over weeks to months dense gliosis encloses the necrotic area; it is formed by reactive astrocytes that join the macrophages from the second week."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c032
    section: micro
    statement: "The end stage is a fluid-filled cavity walled by gliosis, with scattered foamy and hemosiderin-containing macrophages and a few thin glial strands and vessels crossing it."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c033
    section: ancillary
    statement: "Cultures of brain abscess pus may fail because the causative bacteria often grow only without oxygen or at low oxygen levels."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c034
    section: clinical
    statement: "A furuncle is a painful follicle-centred nodule whose pain is relieved by rupture or incision, by which time its centre has died and become fluctuant."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "409-410" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c035
    section: clinical
    statement: "Herniation and rupture into a ventricle are two ways a growing brain abscess can kill."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465-1466" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c036
    section: clinical
    statement: "A swollen, edematous brain infarct can cause lethal mass effect."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c037
    section: diagnosis
    statement: "Smooth ring enhancement of a brain abscess reflects contrast leaking from its granulation tissue, which has no blood-brain barrier."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c038
    section: diagnosis
    statement: "A pyogenic abscess is strongly suggested when contrast-enhanced T1 MRI shows a hypointense centre inside a smooth enhancing rim that is equally thick all the way round."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c039
    section: diagnosis
    statement: "Necrotic centres of metastases or of malignant tumours arising in the brain usually remain dark on DWI, unlike the bright abscess core, where neutrophils sequester water and restrict its diffusion."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c040
    section: diagnosis
    statement: "Cerebral infarcts also show strongly restricted diffusion on DWI."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c041
    section: prognosis
    statement: "Without drainage or antibiotics, a brain abscess may rupture into the ventricles or give rise to daughter abscesses, seeded by organisms that the build-up of pressure inside it pushes into neighbouring brain tissue."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c042
    section: prognosis
    statement: "Repeated bloodstream seeding explains why 15-20% of patients have more than one brain abscess."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c043
    section: prognosis
    statement: "A septic infarct, such as one caused by an infected embolus from bacterial endocarditis, can evolve into a true abscess."
    sourceRef: { source: rubin-8e, chapter: "7", pages: "338" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c044
    section: prognosis
    statement: "About 1 mL of brain infarct is removed by macrophages each month."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c045
    section: prognosis
    statement: "Esophageal squamous cell carcinoma becomes much more likely, for life, after surviving caustic ingestion."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c046
    section: differential
    statement: "In coagulative necrosis cell outlines are preserved early, cytoplasm is eosinophilic and nuclei are lost; outside the brain it is not followed by liquefaction."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38-39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c047
    section: differential
    statement: "Caseous necrosis leaves granular, cheese-like debris inside granulomas, typically in tuberculosis: the cells lose their outlines but are not lysed."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c048
    section: differential
    statement: "Seen mainly after pancreatitis or trauma, fat necrosis is limited to adipose tissue, where fatty acids combine with calcium into chalky white soaps."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39-40" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c049
    section: differential
    statement: "On DWI the necrotic centre of a metastasis or a malignant brain tumour tends to look dark, because it lacks the strong diffusion restriction of an abscess core."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c050
    section: high-yield
    statement: "Liquefaction occurs when enzymatic dissolution of dead cells outpaces repair."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c051
    section: high-yield
    statement: "The two classic settings are abscesses from bacterial infection and brain infarcts."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c052
    section: high-yield
    statement: "In abscesses neutrophil hydrolases digest tissue, producing pus in a cavity later enclosed by a fibrous capsule."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c053
    section: high-yield
    statement: "Brain liquefaction does not depend on acute inflammation: the necrosis is coagulative first and then dissolves, possibly through lysosomal enzymes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c054
    section: high-yield
    statement: "Brain infarct sequence: red neurons at 6-24 h, neutrophils at 24-72 h, macrophages at 3-4 days, astrocytes from week two, glia-lined cyst over weeks to months."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c055
    section: high-yield
    statement: "Brain abscess wall consists of granulation tissue, collagen capsule and outer gliosis, with smooth ring enhancement and a DWI-bright core."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465-1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c056
    section: high-yield
    statement: "Carbon monoxide poisoning causes liquefactive necrosis of both globi pallidi."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1490" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c057
    section: high-yield
    statement: "Alkalis produce liquefactive necrosis, acids coagulative necrosis."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c058
    section: traps
    statement: "Brain liquefaction after infarction is not explained by acute inflammation, so it does not by itself indicate infection."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c059
    section: traps
    statement: "Brain infarcts are coagulative at first and liquefy afterward."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c060
    section: traps
    statement: "Caseous debris persists rather than being lysed, unlike liquefactive necrosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c061
    section: traps
    statement: "Ring enhancement is not specific; restricted diffusion of the core helps distinguish an abscess from necrotic tumor."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c062
    section: traps
    statement: "Cerebral abscesses rarely complicate meningitis; they usually arise by hematogenous or contiguous spread."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c063
    section: mnemonics
    statement: "Original mnemonic restating that the classic settings are bacterial abscesses and brain infarcts."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c064
    section: mnemonics
    statement: "Original mnemonic restating that alkalis cause liquefactive and acids coagulative necrosis."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c065
    section: etiology
    statement: "Aspiration is the leading cause of lung abscess; over 90% of cases are due to aspirated anaerobic bacteria of the oropharynx, usually as a polymicrobial infection."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "713-714" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c066
    section: etiology
    statement: "Alcoholism is the commonest background of lung abscess; depressed consciousness favours aspiration, but an abscess forms only if impaired coughing or airway clearance also leaves the aspirate in place."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "713-714" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c067
    section: gross
    statement: "A bland brain infarct becomes hemorrhagic, and is then easily seen grossly and on imaging, when blood flow returns to the softened tissue, as may happen with embolic occlusion."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c068
    section: gross
    statement: "The right main bronchus is more directly aligned with the trachea, which is why lung abscesses predominate on the right."
    sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: liquefactive-necrosis-c069
    section: ancillary
    statement: "No change is visible in a brain infarct when death follows its onset by minutes to several hours, so a normal-looking brain does not exclude it; at 6-24 hours the gray-white boundary becomes blurred."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
