entity: liquefactive-necrosis
claims:
  - claimId: liquefactive-necrosis-c001
    section: definition
    statement: "Liquefactive necrosis arises when necrotic cells are dissolved much faster than repair proceeds, so the dead area becomes fluid."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c002
    section: definition
    statement: "Its two textbook settings are focal bacterial infection producing an abscess through neutrophil enzymes and ischemic necrosis of the brain."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c003
    section: definition
    statement: "Pus is a purulent, neutrophil-rich exudate with substantial liquefied tissue; the inflammation producing it is termed suppurative."
    sourceRef: { source: rubin-8e, chapter: "2", pages: "68" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c004
    section: etiology
    statement: "A tightly localized collection of neutrophils, usually responding to bacteria, quickly kills and dissolves tissue."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c005
    section: etiology
    statement: "S. aureus entering a normally sterile site typically leads to pus formation, with abscesses that vary from microscopic foci to collections several cm across."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "409" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c006
    section: etiology
    statement: "Occlusion of a cerebral artery causes necrosis that is soon followed by dissolution of the dead tissue."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c007
    section: etiology
    statement: "Brain abscesses begin with bacterial or fungal seeding of the neuropil, mostly by blood from cardiac or pulmonary infection, or by direct extension from frontal or mastoid sinus disease or infected neurosurgical wounds."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c008
    section: etiology
    statement: "Severe carbon monoxide poisoning causes nearly pathognomonic bilateral liquefactive necrosis of the globus pallidus."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1490" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c009
    section: etiology
    statement: "Ingested strong alkalis produce transmural liquefactive necrosis of esophagus and stomach and saponify membrane lipids."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c010
    section: pathogenesis
    statement: "Liquefaction occurs when dissolution of necrotic cells runs far ahead of repair."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c011
    section: pathogenesis
    statement: "Lytic enzymes from inside and outside the cell eventually break down necrotic cells, especially when acute inflammation has been elicited."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c012
    section: pathogenesis
    statement: "Neutrophils contain potent hydrolases able to digest dead cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c013
    section: pathogenesis
    statement: "A dense focus of neutrophils kills cells quickly and dissolves them, leaving a cavity in solid tissue."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c014
    section: pathogenesis
    statement: "If fibrosis encloses a focus of acute inflammation, neutrophil products destroy the trapped tissue, forming an abscess."
    sourceRef: { source: rubin-8e, chapter: "2", pages: "88" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c015
    section: pathogenesis
    statement: "Over time a fibrous wall encloses the abscess and retains its contents."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c016
    section: pathogenesis
    statement: "Brain necrosis after arterial occlusion is coagulative at first and then rapidly dissolves by a mechanism not attributable to acute inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c017
    section: pathogenesis
    statement: "The reason for brain liquefaction is unclear; abundant lysosomal enzymes or CNS-specific hydrolases are suspected."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c018
    section: pathogenesis
    statement: "Lye-type alkalis in liquid form usually produce severe injury by liquefying tissue, granular forms less often; strong acids coagulate tissue at once and the eschar restricts how deep the damage goes."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c019
    section: gross
    statement: "An abscess is a cavity in solid tissue produced by liquefactive necrosis and filled with purulent material."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c020
    section: gross
    statement: "A bland thrombotic brain infarct is hard to see grossly in the first hours; softening and color change then become evident."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c021
    section: gross
    statement: "A brain infarct swells and liquefies between days 3 and 5."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c022
    section: gross
    statement: "Over weeks to months a brain infarct becomes a cystic space, sometimes with compensatory ventricular enlargement."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c023
    section: gross
    statement: "Extensive CNS liquefaction may leave a permanent cavity or cyst."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c024
    section: gross
    statement: "In a brain abscess, an initial edematous inflammatory phase (cerebritis) softens the tissue, and within days liquefaction forms an expanding mass."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c025
    section: micro
    statement: "An abscess cavity contains amorphous eosinophilic material filled with neutrophils."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c026
    section: micro
    statement: "A mature brain abscess has a purulent core enclosed, from inside out, by granulation tissue, a fibroblast-collagen layer, and a zone of reactive astrocytes, activated microglia and edema."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465-1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c027
    section: micro
    statement: "Fibroblasts, rare in the brain, invade from the cerebral microvasculature to encapsulate a forming abscess."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c028
    section: micro
    statement: "At 6 to 24 hours a brain infarct contains shrunken eosinophilic red neurons with pyknotic nuclei."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c029
    section: micro
    statement: "Between 24 and 72 hours neutrophils enter the infarct, vessels become prominent and the tissue becomes soft and swollen."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c030
    section: micro
    statement: "At 3-4 days macrophages supplant neutrophils and begin removing debris; the infarct is mushy."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c031
    section: micro
    statement: "In week two reactive astrocytes appear alongside macrophages and over weeks to months build a dense glial network around the necrotic area."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c032
    section: micro
    statement: "The old brain infarct ends as a glia-lined cyst crossed by thin glial septa and small vessels, containing residual macrophages loaded with lipid or hemosiderin."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c033
    section: ancillary
    statement: "Pathogens of brain abscess are frequently anaerobes or microaerophiles, so cultures may be negative."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c034
    section: clinical
    statement: "A furuncle starts as a painful red nodule at a hair follicle, develops a yellow apex and a necrotic fluctuant core, and is relieved by rupture or incision."
    sourceRef: { source: rubin-8e, chapter: "9", pages: "409-410" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c035
    section: clinical
    statement: "An expanding brain abscess can kill through herniation or by bursting into a ventricle."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465-1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c036
    section: clinical
    statement: "A swollen, edematous brain infarct can cause lethal mass effect."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c037
    section: diagnosis
    statement: "The granulation tissue layer of a brain abscess lacks a blood-brain barrier and leaks contrast, giving smooth ring enhancement."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c038
    section: diagnosis
    statement: "On contrast T1 MRI a smooth enhancing rim of even (usually small) thickness around a hypointense core strongly suggests a pyogenic abscess."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c039
    section: diagnosis
    statement: "On DWI the abscess core is bright, reflecting restricted water diffusion attributed to neutrophils holding water, while necrotic centres of metastatic or malignant primary brain tumors usually show little or no such restriction."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c040
    section: diagnosis
    statement: "Cerebral infarcts also show strongly restricted diffusion on DWI."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c041
    section: prognosis
    statement: "An untreated, undrained brain abscess can extrude microbes to form daughter abscesses or rupture into the ventricles."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c042
    section: prognosis
    statement: "Repeated bloodstream seeding explains why 15-20% of patients have more than one brain abscess."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c043
    section: prognosis
    statement: "A septic infarct, such as one caused by an infected embolus from bacterial endocarditis, can evolve into a true abscess."
    sourceRef: { source: rubin-8e, chapter: "7", pages: "338" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c044
    section: prognosis
    statement: "Brain infarct debris is removed by macrophages slowly, roughly 1 mL each month."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c045
    section: prognosis
    statement: "People who survive swallowing caustics have a markedly raised lifelong risk of esophageal squamous cell carcinoma."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c046
    section: differential
    statement: "In coagulative necrosis cell outlines are preserved early, cytoplasm is eosinophilic and nuclei are lost; outside the brain it is not followed by liquefaction."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38-39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c047
    section: differential
    statement: "In caseous necrosis dead cells lose outlines but are not lysed, persisting as granular cheesy debris in granulomas, characteristically in tuberculosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c048
    section: differential
    statement: "Fat necrosis affects adipose tissue, mainly from pancreatitis or trauma, with fatty acids precipitating as chalky white calcium soaps."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39-40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c049
    section: differential
    statement: "Necrotic centres of metastatic and malignant brain tumors generally lack the marked diffusion restriction of abscess cores, so they tend to look dark on DWI."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c050
    section: high-yield
    statement: "Liquefaction occurs when enzymatic dissolution of dead cells outpaces repair."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c051
    section: high-yield
    statement: "The two classic settings are abscesses from bacterial infection and brain infarcts."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c052
    section: high-yield
    statement: "In abscesses neutrophil hydrolases digest tissue, producing pus in a cavity later enclosed by a fibrous capsule."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c053
    section: high-yield
    statement: "Brain necrosis is coagulative first and then liquefies without depending on acute inflammation, possibly through lysosomal enzymes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c054
    section: high-yield
    statement: "Brain infarct sequence: red neurons at 6-24 h, neutrophils at 24-72 h, macrophages at 3-4 days, astrocytes from week two, glia-lined cyst over weeks to months."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1456" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c055
    section: high-yield
    statement: "Brain abscess wall consists of granulation tissue, collagen capsule and outer gliosis, with smooth ring enhancement and a DWI-bright core."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465-1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c056
    section: high-yield
    statement: "Carbon monoxide poisoning produces bilateral liquefactive necrosis of the globus pallidus."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1490" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c057
    section: high-yield
    statement: "Alkalis produce liquefactive necrosis, acids coagulative necrosis."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c058
    section: traps
    statement: "Brain liquefaction after infarction is not explained by acute inflammation, so it does not by itself indicate infection."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c059
    section: traps
    statement: "Brain infarcts are coagulative at first and liquefy afterward."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c060
    section: traps
    statement: "Caseous debris persists rather than being lysed, unlike liquefactive necrosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c061
    section: traps
    statement: "Ring enhancement is not specific; restricted diffusion of the core helps distinguish an abscess from necrotic tumor."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1466" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c062
    section: traps
    statement: "Cerebral abscesses rarely complicate meningitis; they usually arise by hematogenous or contiguous spread."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1465" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c063
    section: mnemonics
    statement: "Original mnemonic restating that the classic settings are bacterial abscesses and brain infarcts."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: liquefactive-necrosis-c064
    section: mnemonics
    statement: "Original mnemonic restating that alkalis cause liquefactive and acids coagulative necrosis."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
