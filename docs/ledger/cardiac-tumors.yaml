entity: cardiac-tumors
claims:
  - { claimId: cardiac-tumors-c001, section: definition, statement: "Primary heart tumors are uncommon and the majority are benign.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c002, section: definition, statement: "Cardiac metastases outnumber primary cardiac tumors by roughly a hundredfold.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c003, section: definition, statement: "Myxoma is the commonest primary tumor of the heart.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c004, section: definition, statement: "Myxomas represent about half to four-fifths of primary cardiac tumors.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c005, section: definition, statement: "Rhabdomyoma is the commonest primary cardiac tumor in childhood.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c006, section: definition, statement: "Rare primary cardiac tumors include sarcomas, benign vascular, nerve-sheath and fibrous lesions, lipomas and lipomatous hypertrophy of the interatrial septum.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c007, section: etiology, statement: "Most cardiac myxomas occur sporadically.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c008, section: etiology, statement: "About 5% to 10% of myxomas are part of Carney complex, an autosomal dominant syndrome.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c009, section: etiology, statement: "Carney complex adds skin pigmentation, hormone overproduction and myxomas outside the heart.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c010, section: etiology, statement: "PRKAR1A is a tumor suppressor gene for a regulatory part of protein kinase A; inactivating germline mutations of it are linked to Carney complex.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c011, section: etiology, statement: "Mutations in TSC1 or TSC2 underlie the familial form of tuberous sclerosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c012, section: etiology, statement: "Between a third and a half of rhabdomyomas occur together with tuberous sclerosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c013, section: etiology, statement: "The cancers seen most often with cardiac spread are the commonest ones: lung, breast and gastrointestinal.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c014, section: etiology, statement: "Most patients with these carcinomas never develop cardiac metastases.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c015, section: etiology, statement: "The heart can also be involved by lymphoma and leukemia.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c016, section: etiology, statement: "Melanoma spreads to the heart more readily than any other cancer.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c017, section: pathogenesis, statement: "The origin is not settled, but myxoma probably arises from multipotent mesenchymal stem cells of the endocardium, notably at the fossa ovalis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c018, section: pathogenesis, statement: "Whether rhabdomyoma is a true neoplasm is unsettled; it may be a hamartoma.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c019, section: pathogenesis, statement: "Papillary fibroelastoma is a hamartoma, not a true neoplasm.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c020, section: pathogenesis, statement: "TSC1 and TSC2 make hamartin and tuberin, tumor suppressors that steer cardiac myocyte growth and maturation before and after birth.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c021, section: gross, statement: "About 75% of myxomas arise in the left atrium; the rest arise in other chambers or on a valve.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c022, section: gross, statement: "A myxoma hangs from a short stalk, measures 5 to 6 cm and looks shiny and jelly-like.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c023, section: gross, statement: "The myxoma mass may move enough to block the mitral valve opening.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c024, section: gross, statement: "Cardiac rhabdomyomas range in size from 1 mm to several centimeters and are pale myocardial nodules.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c025, section: gross, statement: "Rhabdomyoma nodules fill both ventricles and are nearly always multiple; in one-third of cases they also reach the atria.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c026, section: gross, statement: "In half of rhabdomyomas, a bulge into a chamber ends up blocking a lumen or valve opening.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c027, section: gross, statement: "Papillary fibroelastoma is a valve growth of up to 3 to 4 cm whose fronds look like a sea anemone.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c028, section: gross, statement: "A melanoma metastasis in the myocardium is heavily pigmented (Fig. 17-50).", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c029, section: micro, statement: "Myxoma consists of polygonal stellate cells, alone or in small clusters, in a loose stroma full of proteoglycans.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c030, section: micro, statement: "Rhabdomyoma cells have a small nucleus in the middle and wide, pale cytoplasm full of glycogen.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c031, section: micro, statement: "In the rhabdomyoma spider cell, thin sarcomere-containing cytoplasmic threads run from the center to the cell edge.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c032, section: micro, statement: "Looser connective tissue wraps the center of each fibroelastoma frond, which is a dense axis of collagen and elastic fibers.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c033, section: micro, statement: "Fibroelastoma fronds are covered by endothelium continuous with the valvular endothelium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c034, section: ancillary, statement: "Under the microscope the tumors are recognized by stellate cells in myxoid stroma (myxoma), glycogen-rich spider cells (rhabdomyoma) and collagen-elastic cores under endothelium (fibroelastoma). The source does not name the stain.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c035, section: ancillary, statement: "Myxoma cells produce alpha-smooth muscle actin and carry markers of two lineages, primitive cardiac myocytes and endothelial precursors.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c036, section: clinical, statement: "Mitral valve dysfunction is clinically evident in more than half of patients whose myxoma sits in the left atrium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c037, section: clinical, statement: "A myxoma may break into fragments that embolize, although it does not spread like an ordinary cancer.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c038, section: clinical, statement: "Papillary fibroelastomas usually cause no clinical problem.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c039, section: clinical, statement: "Fragments of a papillary fibroelastoma may break off and lodge in distant organs.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690-691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c040, section: clinical, statement: "Myocardial ischemia can follow when a papillary fibroelastoma blocks the opening of a coronary artery.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c041, section: clinical, statement: "Myocardial metastases can mimic restrictive cardiomyopathy clinically, most of all when fibrosis is extensive.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c042, section: clinical, statement: "Metastatic damage to the atrioventricular conduction system can show on the ECG as AV block or bundle branch block.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c043, section: prognosis, statement: "Surgical removal of a myxoma is usually curative.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c044, section: prognosis, statement: "Tumor emboli that reach the brain cause fatal stroke in some patients with a left-heart myxoma.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c045, section: prognosis, statement: "Successful excision has been achieved in a few cardiac rhabdomyomas.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c046, section: differential, statement: "Myxoma is a short-stalked polyp, mostly left atrial, with stellate cells in myxoid stroma.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c047, section: differential, statement: "Rhabdomyoma is a pale, almost always multiple myocardial nodule of childhood, with spider cells.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c048, section: differential, statement: "Papillary fibroelastoma has valve fronds with a collagen and elastic core covered by endothelium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c049, section: differential, statement: "Melanoma metastatic to the myocardium forms heavily pigmented tumor deposits.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c050, section: differential, statement: "Myocardial metastases with extensive fibrosis can mimic restrictive cardiomyopathy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c051, section: high-yield, statement: "Primary cardiac tumors are rare and mostly benign.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c052, section: high-yield, statement: "Myxoma is the commonest primary cardiac tumor and arises mostly in the left atrium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c053, section: high-yield, statement: "Carney complex, with PRKAR1A mutation, accounts for a minority of myxomas.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c054, section: high-yield, statement: "Rhabdomyoma is the commonest cardiac tumor of childhood.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c055, section: high-yield, statement: "Rhabdomyoma is associated with tuberous sclerosis (TSC1/TSC2).", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c056, section: high-yield, statement: "The spider cell characterizes cardiac rhabdomyoma.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c057, section: high-yield, statement: "Papillary fibroelastoma is a valve hamartoma that can embolize or occlude a coronary orifice.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690-691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c058, section: high-yield, statement: "Melanoma spreads to the heart more readily than any other cancer.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c059, section: high-yield, statement: "Emboli from left-heart myxoma can cause fatal stroke.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c060, section: traps, statement: "Metastases to the heart are far more common than primary cardiac tumors.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c061, section: traps, statement: "Myxoma does not spread like an ordinary cancer, but detached fragments can embolize.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c062, section: traps, statement: "Papillary fibroelastoma is a hamartoma, and rhabdomyoma may be one as well.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c063, section: traps, statement: "Only one-third to one-half of rhabdomyomas are associated with tuberous sclerosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c064, section: traps, statement: "Myxoma, the commonest primary cardiac tumor, is benign.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c065, section: traps, statement: "Melanoma seeds the heart most readily, even though patients with lung, breast or gut carcinoma are the ones most often found with cardiac metastases.", sourceRef: { source: rubin-8e, chapter: "17", pages: "691" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c066, section: mnemonics, statement: "Myxoma arises mostly in the left atrium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c067, section: mnemonics, statement: "Rhabdomyoma is the commonest primary cardiac tumor of childhood.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: cardiac-tumors-c068, section: mnemonics, statement: "Papillary fibroelastoma grows on heart valves.", sourceRef: { source: rubin-8e, chapter: "17", pages: "690" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
