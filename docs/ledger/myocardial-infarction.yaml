entity: myocardial-infarction
claims:
  - { claimId: myocardial-infarction-c001, section: definition, statement: "Myocardial infarction is necrosis of heart muscle caused by ischemia; in type 1 infarcts the usual cause is coronary thrombosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c002, section: definition, statement: "Acute infarcts on the ECG are either STEMI, with ST elevation, or non-STEMI.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c003, section: definition, statement: "A coronary thrombus forming spontaneously usually triggers type 1 infarcts, which are often STEMI.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c004, section: definition, statement: "A prolonged, marked supply-demand mismatch causes type 2 infarcts, which are mostly non-STEMI.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c005, section: etiology, statement: "Anemia is survivable with normal coronaries, but severe atherosclerosis can turn it into infarction.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c006, section: etiology, statement: "Fever, hyperthyroidism, hypertension, aortic stenosis and hypertrophic cardiomyopathy increase cardiac workload and oxygen demand.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c007, section: etiology, statement: "Vasculitis, aortic dissection and anomalous coronary origin can each obstruct coronary arteries.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c008, section: etiology, statement: "Greater wall thickness and workload make the left ventricle the usual site of infarction, much more often than the right ventricle.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c009, section: pathogenesis, statement: "Necrosis begins in the subendocardium and takes several hours to reach the epicardial side, so infarction is not instantaneous.", sourceRef: { source: rubin-8e, chapter: "17", pages: "656-657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c010, section: pathogenesis, statement: "Duration of coronary occlusion decides whether necrosis stays focal and subendocardial or becomes transmural.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c011, section: pathogenesis, statement: "Arterial collateral supply is the main factor deciding how far necrosis spreads through the wall.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c012, section: pathogenesis, statement: "Total ischemia lasting beyond 20 to 30 minutes makes myocyte injury irreversible, and cells then die in succession.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c013, section: pathogenesis, statement: "When the sarcolemma breaks down, troponins leak from the myocyte.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c014, section: pathogenesis, statement: "Reperfusion produces reactive oxygen species that injure the sarcolemma and let calcium flood into myocytes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659-660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c015, section: gross, statement: "Type 2 infarcts are typically patchy and confined to the inner wall, whereas type 1 infarcts form a single full-thickness lesion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c016, section: gross, statement: "Subendocardial infarcts lie in the deepest third to half of the left ventricular wall and may form a ring.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c017, section: gross, statement: "Transmural infarcts cross the entire ventricular wall, so each typically fits the supply area of one major coronary artery.", sourceRef: { source: rubin-8e, chapter: "17", pages: "656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c018, section: gross, statement: "Proximal right coronary artery occlusion causes the \"inferior\" infarct, which involves the posterior left ventricle and part of the septum.", sourceRef: { source: rubin-8e, chapter: "17", pages: "656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c019, section: gross, statement: "Blockage of the left anterior descending artery produces infarcts of the anterior wall, anterior septum and apex.", sourceRef: { source: rubin-8e, chapter: "17", pages: "656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c020, section: gross, statement: "The left circumflex artery is the least common culprit, and its obstruction infarcts the lateral wall.", sourceRef: { source: rubin-8e, chapter: "17", pages: "656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c021, section: gross, statement: "Acute infarcts cannot be seen grossly in the first 12 hours.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c022, section: gross, statement: "Pallor of the cut surface identifies the infarct by 24 hours.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c023, section: gross, statement: "At 3 to 5 days a ring of hyperemia surrounds the dead, yellowish center, so the infarct looks mottled.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c024, section: gross, statement: "By 2 to 3 weeks the infarct is soft and jelly-like, and lies sunken.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c025, section: gross, statement: "A healed infarct is a shrunken gray scar.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c026, section: gross, statement: "Reperfused infarcts are typically hemorrhagic.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c027, section: micro, statement: "Electron microscopy alone shows the irreversible lesion, appearing at 30 to 60 minutes: swollen mitochondria with amorphous matrix densities.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c028, section: micro, statement: "Coagulative necrosis is evident by 24 hours, with wavy fibers that take up eosin intensely.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c029, section: micro, statement: "Neutrophil concentration is highest at 2 to 3 days, at the infarct border, where blood still flows.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c030, section: micro, statement: "Days 5 to 7 show new collagen and myofibroblasts, while macrophages at the edge clear dead muscle.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c031, section: micro, statement: "Scar formation spreads from the infarct margin to its center, beginning about day 5.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c032, section: micro, statement: "By 4 weeks the scar is mostly dense fibrous tissue, growing more compact and less cellular over time.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c033, section: micro, statement: "After reperfusion, repair runs faster and neutrophils invade the entire infarct, edge included.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c034, section: micro, statement: "In reperfused infarcts, sarcomeres hypercontract and form eosinophilic crosswise bands called contraction band necrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c035, section: ancillary, statement: "Dating an infarct on routine H&E relies on which cells are present: neutrophils, macrophages and new collagen.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657-659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c036, section: ancillary, statement: "On trichrome stain, the collagen of a healed infarct appears blue-green and ends abruptly at viable myocardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c037, section: ancillary, statement: "Only an electron microscope can reveal the earliest ultrastructural signs of ischemia.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c038, section: ancillary, statement: "Serum cardiac troponin or MB-CK rises when myocardium has undergone necrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c039, section: clinical, statement: "Typical features are abrupt crushing chest pain, sweating and nausea; the pain can pass for indigestion.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c040, section: clinical, statement: "Patients with a denervated transplanted heart, and diabetics with impaired autonomic function, often have infarcts without symptoms.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c041, section: diagnosis, statement: "STEMI shows ST elevation on the ECG, usually followed by Q waves, whereas non-STEMI shows ST depression.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655, 660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c042, section: diagnosis, statement: "Troponin I or T, specific for heart muscle, is the biomarker measured most often.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c043, section: diagnosis, statement: "For the diagnosis to stand, biomarker levels must rise or fall in step with the clinical course.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c044, section: diagnosis, statement: "A biomarker increase is invariable in STEMI, whereas demand-related unstable angina shows no rise.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c045, section: prognosis, statement: "Mortality within the first 30 days is now below 5%, compared with about 30% in the 1950s.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c046, section: prognosis, statement: "Almost every infarct patient has an arrhythmia at some point.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c047, section: prognosis, statement: "If the left ventricle fails early after an infarct, a large part of the muscle has usually been lost.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c048, section: prognosis, statement: "Cardiogenic shock tends to follow early loss of at least 40% of the left ventricle, with up to 90% mortality.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c049, section: prognosis, statement: "The necrotic wall is weakest on days 2 to 7, and free wall rupture is most likely then.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c050, section: prognosis, statement: "After left ventricular free wall rupture, blood fills the pericardium and death most often results from tamponade.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c051, section: prognosis, statement: "Only transmural infarcts can rupture the free wall.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c052, section: prognosis, statement: "Septal perforation creates a left-to-right shunt, and its size sets the prognosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c053, section: prognosis, statement: "In a true aneurysm the weakened ventricular wall stays continuous and bulges outward.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c054, section: prognosis, statement: "A false aneurysm is a contained rupture; its wall is pericardium and scar, with no ventricular muscle.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c055, section: prognosis, statement: "Pieces of mural thrombus can embolize and cause stroke; autopsy finds such a thrombus over the infarct in a third to half of fatal cases.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c056, section: prognosis, statement: "Between 10% and 20% of patients with a transmural infarct develop pericarditis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c057, section: prognosis, statement: "An autoimmune mechanism is probably behind Dressler syndrome, a pericarditis that appears 2 to 10 weeks after infarction.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c058, section: prognosis, statement: "Ischemic myocytes are salvaged by restoring blood flow through bypass grafting, percutaneous coronary intervention with stenting, or thrombolysis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c059, section: prognosis, statement: "Little ischemic myocardium can still be salvaged after 12 hours.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c060, section: differential, statement: "Demand-related unstable angina has ischemic symptoms but no biomarker rise, so no necrosis is shown.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c061, section: differential, statement: "Stunned myocardium is reversibly injured and contractility stays depressed for hours after reperfusion without necrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c062, section: differential, statement: "Ischemic cardiomyopathy is left ventricular failure with no obvious infarct.", sourceRef: { source: rubin-8e, chapter: "17", pages: "662" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c063, section: high-yield, statement: "Transmural infarcts follow coronary thrombosis and are often STEMI.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655-656" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c064, section: high-yield, statement: "Subendocardial infarcts are patchy and usually non-STEMI.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c065, section: high-yield, statement: "Troponin I or T is the standard serum biomarker.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c066, section: high-yield, statement: "Neutrophils peak at 2 to 3 days.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c067, section: high-yield, statement: "Contraction bands and hemorrhage characterize reperfused infarcts.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c068, section: high-yield, statement: "Free wall rupture peaks between days 2 and 7.", sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c069, section: traps, statement: "Gross inspection of the heart shows no sign of an acute infarct in the first 12 hours.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c070, section: traps, statement: "Type 2 infarcts result from supply-demand imbalance, and thrombosis is less common in subendocardial infarcts.", sourceRef: { source: rubin-8e, chapter: "17", pages: "655" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c071, section: traps, statement: "Reperfusion makes an infarct hemorrhagic rather than pale.", sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c072, section: traps, statement: "Free wall rupture usually occurs in transmural infarcts of modest size.", sourceRef: { source: rubin-8e, chapter: "17", pages: "661" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: myocardial-infarction-c073, section: mnemonics, statement: "Infarct cells appear in the order eosinophilic myocytes at 1 day, neutrophils, macrophages, then scar.", sourceRef: { source: rubin-8e, chapter: "17", pages: "657-659" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
