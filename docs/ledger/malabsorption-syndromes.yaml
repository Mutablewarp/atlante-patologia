entity: malabsorption-syndromes
claims:
  - { claimId: malabsorption-syndromes-c001, section: definition, statement: "Many different diseases share one problem: the gut takes up too little of the nutrients the body needs.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c002, section: definition, statement: "Absorption that matters clinically happens mainly in the proximal small intestine.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c003, section: definition, statement: "Nutrients are first prepared in the lumen (luminal phase) and then moved through mucosal cells (intestinal phase).", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c004, section: definition, statement: "Impaired absorption can result from a fault in just one component of either phase.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c005, section: etiology, statement: "Pancreatic failure, or a blocked outflow of pancreatic juice, impairs fat digestion, which depends on pancreatic enzymes and bile acids.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c006, section: etiology, statement: "Epithelial cells take up only monosaccharides, so a lack of brush-border disaccharidases leaves dietary sugars unabsorbed.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c007, section: etiology, statement: "Short gut, or a gastrocolic fistula that lets food skip the small bowel, leaves less absorbing surface.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c008, section: etiology, statement: "Small bowel diseases such as celiac disease injure the mucosa and cut absorption.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c009, section: etiology, statement: "In abetalipoproteinemia an inherited lack of apoproteins stops the cell from building fat-carrying particles.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c010, section: etiology, statement: "In Whipple disease, nutrients probably fail to move on through the blood capillaries and lymphatics.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c011, section: etiology, statement: "Lactose must be split into glucose and galactose before it can be absorbed, and brush-border lactase does this.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c012, section: etiology, statement: "Acquired lactase deficiency is common.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c013, section: etiology, statement: "If it is not recognized, congenital lactase deficiency can be lethal, though it is rare.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c014, section: etiology, statement: "Gluten from wheat, rye and barley triggers celiac disease, but only in genetically susceptible individuals.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c015, section: etiology, statement: "Nearly all patients with celiac disease carry HLA class II DQ2 or DQ8 alleles.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c016, section: etiology, statement: "A patient lacking HLA-DQ2 and DQ8 almost certainly does not have celiac disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c017, section: etiology, statement: "Tropical sprue is found in South and Southeast Asia, Central America and the Caribbean.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c018, section: etiology, statement: "The causative agent of tropical sprue is uncertain, yet antibiotics relieve it, which supports a bacterial etiology.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c019, section: etiology, statement: "Whipple disease is caused by the actinobacterium Tropheryma whippelii.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c020, section: etiology, statement: "Slowed gut motility, as in diabetes or scleroderma, can lead to small bowel bacterial overgrowth.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c021, section: etiology, statement: "A Billroth II operation or small bowel diverticula can cause stasis; when an anatomic defect is the reason, the condition is called blind loop syndrome.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c022, section: pathogenesis, statement: "T cells are activated when HLA-DQ2 or DQ8 molecules present them with gliadin that has been changed.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c023, section: pathogenesis, statement: "Cytokines released by the activated mucosal T cells injure the mucosa.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c024, section: pathogenesis, statement: "In Whipple disease macrophages cannot degrade the bacteria, so the organisms build up inside them.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c025, section: pathogenesis, statement: "Transport is impaired and malabsorption results, probably because accumulated macrophages squeeze the villous lymphatics.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c026, section: pathogenesis, statement: "Apoptotic epithelial cells in autoimmune enteropathy point to an immune attack.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c027, section: pathogenesis, statement: "Bacteria that consume micronutrients or deconjugate bile salts are thought to be the main driver of malabsorption in bacterial overgrowth.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c028, section: micro, statement: "Celiac biopsies combine unevenly distorted villi with more inflammation, intraepithelial lymphocytes included.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c029, section: micro, statement: "Severe disease flattens the mucosa: the villi vanish while hyperplastic crypts remain.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c030, section: micro, statement: "Villi shrink and crypts deepen because lost surface epithelium is replaced by faster division of crypt cells.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c031, section: micro, statement: "A raised intraepithelial lymphocyte count is nearly universal in celiac disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c032, section: micro, statement: "NSAID exposure and H. pylori gastritis can also raise intraepithelial lymphocyte numbers, so an increase seen alone is not specific for celiac disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c033, section: micro, statement: "Tropical sprue often affects the full length of the small intestine, down to the ileum.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c034, section: micro, statement: "Tropical sprue mucosa is flat less often than celiac mucosa, and its lymphocytes cluster in crypts rather than at villus tips.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c035, section: micro, statement: "In autoimmune enteropathy intraepithelial lymphocytes are less prominent than in celiac disease, even though villous atrophy may be severe.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c036, section: micro, statement: "In Whipple disease macrophages with foamy cytoplasm crowd the villi, which become swollen and bulbous.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c037, section: micro, statement: "The foamy macrophages of Whipple disease stain strongly with PAS because the bacteria they contain hold polysaccharide.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c038, section: micro, statement: "In bacterial overgrowth the mucosa can look normal, and any inflammation is spotty with no telltale pattern.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c039, section: ancillary, statement: "Small-bowel histology in celiac disease is judged by villous architecture, crypt depth and intraepithelial lymphocyte density.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c040, section: ancillary, statement: "PCR detection of the bacterium is increasingly used to confirm Whipple disease, where PAS staining used to be the standard.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c041, section: ancillary, statement: "Tissue transglutaminase antibody is the serologic test of choice for celiac disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c042, section: ancillary, statement: "Circulating anti-enterocyte antibodies are found in autoimmune enteropathy.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c043, section: clinical, statement: "Specific malabsorption involves a single nutrient, such as lactose when lactase is lacking, or B12 when autoimmune gastric damage leaves no intrinsic factor.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c044, section: clinical, statement: "When many nutrients are poorly absorbed, malnutrition follows: adults lose weight and children fail to thrive.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c045, section: clinical, statement: "Anemia can result from lack of vitamin B12, folic acid or iron.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c046, section: clinical, statement: "Osteomalacia in adults, rickets in children and tetany can all follow poor absorption of calcium and vitamin D.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c047, section: clinical, statement: "Steatorrhea, meaning fat in the stools, is the result of fat malabsorption.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c048, section: clinical, statement: "In acquired lactase deficiency dairy products bring on diarrhea, flatulence and distention, with onset usually in adolescence.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c049, section: clinical, statement: "Typical complaints in celiac disease are diarrhea and discomfort in the abdomen.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c050, section: clinical, statement: "Advanced celiac disease can bring fat in the stool, edema from low albumin, brittle bones and stunted growth.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c051, section: clinical, statement: "Anemia from iron deficiency that does not improve with oral iron can be the only clue to celiac disease, which may otherwise cause no symptoms.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c052, section: clinical, statement: "Megaloblastic change can follow the severe folate and vitamin B12 deficiency that tropical sprue may cause.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c053, section: clinical, statement: "Autoimmune enteropathy starts with heavy diarrhea and can also reach organs beyond the small bowel, such as the stomach, colon, pancreas and lung.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c054, section: clinical, statement: "Neuropsychiatric symptoms can be the first sign of Whipple disease, because the CNS is involved.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c055, section: clinical, statement: "Small bowel bacterial overgrowth causes bloating and diarrhea.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c056, section: diagnosis, statement: "Quantitative fecal fat is the benchmark test; other malabsorption tests are compared with it.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c057, section: diagnosis, statement: "Blood and urine xylose after a defined load assess the intestinal phase, because xylose is absorbed without any luminal-phase step.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798-799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c058, section: diagnosis, statement: "Blind loop syndrome can be diagnosed with the 14C-cholylglycine breath test, which tests how well the ileum absorbs bile salts.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c059, section: diagnosis, statement: "Breath testing for hydrogen and methane is how bacterial overgrowth is diagnosed.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c060, section: diagnosis, statement: "Diagnosing celiac disease takes symptoms, antibody tests and biopsy findings together; no single one is enough.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c061, section: prognosis, statement: "The gluten-free diet is hard to keep because gluten is ubiquitous, even though excluding gluten is usually effective in celiac disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c062, section: prognosis, statement: "Small bowel adenocarcinoma and enteropathy-associated T-cell lymphoma are both more likely in long-standing celiac disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c063, section: prognosis, statement: "Autoimmune enteropathy is treated with immunosuppressive drugs; a gluten-free diet does not help.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c064, section: prognosis, statement: "Antibiotic therapy produces a dramatic response in Whipple disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c065, section: prognosis, statement: "Antibiotic therapy usually improves symptoms of bacterial overgrowth.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c066, section: differential, statement: "Celiac disease shows villous atrophy with crypt hyperplasia and increased intraepithelial lymphocytes, mainly in the proximal small intestine.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c067, section: differential, statement: "Tropical sprue is geographically restricted, extends to the ileum and has intraepithelial lymphocytes more prominent in crypts.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c068, section: differential, statement: "Autoimmune enteropathy shows loss of goblet and Paneth cells, anti-enterocyte antibodies and no response to gluten restriction.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c069, section: differential, statement: "Whipple disease shows bulbous villi filled with foamy macrophages and involves multiple organs.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c070, section: differential, statement: "Bacterial overgrowth has a normal or patchily inflamed mucosa in the setting of stasis or dysmotility.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c071, section: high-yield, statement: "Absorption can fail in either of two phases: the luminal phase or the intestinal phase.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c072, section: high-yield, statement: "Quantitative fecal fat is the most reliable test, and fat malabsorption causes steatorrhea.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c073, section: high-yield, statement: "Whipple disease features PAS-positive foamy macrophages, Tropheryma whippelii and response to antibiotics.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c074, section: high-yield, statement: "Celiac disease features tTG antibody, HLA-DQ2 or DQ8 and villous atrophy with increased intraepithelial lymphocytes.", sourceRef: { source: rubin-8e, chapter: "19", pages: "799-800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c075, section: high-yield, statement: "Autoimmune enteropathy features anti-enterocyte antibodies and responds to immunosuppression, not gluten restriction.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c076, section: high-yield, statement: "Bacterial overgrowth is diagnosed by breath test, arises with blind loop stasis and improves with antibiotics.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c077, section: high-yield, statement: "Tropical sprue is geographic, can involve the ileum and causes folate and vitamin B12 deficiency.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c078, section: traps, statement: "Positive serology alone does not diagnose celiac disease; clinical and histologic evidence must back it.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c079, section: traps, statement: "NSAIDs and H. pylori gastritis can also raise intraepithelial lymphocytes, so an increase alone does not prove celiac disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "800" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c080, section: traps, statement: "Autoimmune enteropathy needs immunosuppressant medication, not gluten restriction.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c081, section: traps, statement: "Autoimmune gastritis can cause vitamin B12 malabsorption by removing intrinsic factor.", sourceRef: { source: rubin-8e, chapter: "19", pages: "798" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: malabsorption-syndromes-c082, section: traps, statement: "Sprue is the Dutch word for diarrhea, and celiac disease has sometimes been called nontropical sprue.", sourceRef: { source: rubin-8e, chapter: "19", pages: "801" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
