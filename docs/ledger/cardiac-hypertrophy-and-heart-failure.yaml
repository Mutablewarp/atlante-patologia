entity: cardiac-hypertrophy-and-heart-failure
claims:
- {claimId: cardiac-hypertrophy-and-heart-failure-c001, section: definition, statement: "Hypertrophy is adaptive: enlarged myocytes limit the rise in wall stress and contract harder", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c002, section: definition, statement: "Signs and symptoms of heart failure appear because the heart sustains output only by filling at higher pressure and volume", sourceRef: {source: rubin-8e, chapter: "17", pages: "636-637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c003, section: definition, statement: "Many patients live with compensated heart failure for years", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c004, section: definition, statement: "Ejection fraction is the proportion of end-diastolic blood a ventricle ejects, about 60% in a normal ventricle", sourceRef: {source: rubin-8e, chapter: "17", pages: "636"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c005, section: etiology, statement: "Structural damage, or a cardiac workload raised for a long period, may lead to heart failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c006, section: etiology, statement: "Coronary artery disease outranks every other cause of heart failure in frequency", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c007, section: etiology, statement: "Hypertension and valvular disease are important causes of heart failure besides coronary artery disease", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c009, section: etiology, statement: "Valve insufficiency and myocardial injury impose volume overload, valve stenosis and hypertension pressure overload, and pathologic hypertrophy compensates for either", sourceRef: {source: rubin-8e, chapter: "17", pages: "638"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c011, section: etiology, statement: "The left side fails more often because the usual injuries, ischemic heart disease and hypertension, mainly burden the left ventricle", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c012, section: etiology, statement: "Right-sided failure may arise alone from lung disease or pulmonary hypertension, but it usually follows left-sided failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c013, section: pathogenesis, statement: "By the Frank-Starling law a healthy ventricle that fills more ejects a larger stroke volume, within limits", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c016, section: pathogenesis, statement: "A failing heart needs an abnormally raised atrial filling pressure to deliver its stroke volume", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c017, section: pathogenesis, statement: "Myocytes under stretch or overload release angiotensin II and endothelin-1, which bind receptors and drive hypertrophy", sourceRef: {source: rubin-8e, chapter: "17", pages: "638"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c019, section: pathogenesis, statement: "Overstimulated β-adrenergic receptors lose sensitivity while myocytes enlarge, and β-adrenergic events are implicated in the passage to failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "638-639"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c024, section: pathogenesis, statement: "Interstitial fibrosis accompanies pathologic hypertrophy and nearly every form of heart failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "640"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c028, section: pathogenesis, statement: "Apoptosis, more frequent in myocytes of pathologic hypertrophy, may contribute to the shift from a compensated heart to failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "640"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c030, section: pathogenesis, statement: "Low output reduces kidney flow, and the resulting renin-angiotensin-aldosterone response makes the body retain sodium and fluid", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c032, section: pathogenesis, statement: "The edema of heart failure arises when raised capillary pressure combines with lowered plasma oncotic pressure", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c033, section: gross, statement: "Nearly every chronic heart failure comes with ventricular hypertrophy; beyond the lesions of the underlying disease, failing hearts look nonspecific", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c034, section: gross, statement: "In concentric hypertrophy the wall gets thicker while the chamber stays about the same size", sourceRef: {source: rubin-8e, chapter: "17", pages: "638"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c035, section: gross, statement: "Clinical heart failure is often associated with eccentric hypertrophy, which has a dilated chamber and longer myocytes", sourceRef: {source: rubin-8e, chapter: "17", pages: "638"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c037, section: gross, statement: "Right ventricular hypertrophy usually develops once left ventricular failure overloads the right side, whereas earlier only the left ventricle may be enlarged", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c038, section: gross, statement: "Most cases of severe systolic failure show clearly dilated ventricles", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c039, section: gross, statement: "In nutmeg liver the cut surface is mottled, with congested central veins dark red and the surrounding tissue yellow", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c040, section: micro, statement: "Large hyperchromatic nuclei and more binucleate myocytes in hypertrophy result from renewed DNA synthesis and nuclear division", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c041, section: micro, statement: "Chronically injured myocytes that replace sarcomeres with cytosol and glycogen look vacuolated, a change called myocytolysis", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c044, section: micro, statement: "Heart failure cells are alveolar macrophages carrying hemosiderin from red cells that leaked out of congested lung capillaries", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c047, section: ancillary, statement: "An autopsy of congestive failure shows an enlarged heart with dilated chambers", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c048, section: ancillary, statement: "Microscopy of failing myocardium shows enlarged hyperchromatic nuclei, binucleated myocytes and vacuolated myocytes", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c050, section: ancillary, statement: "Clinicians can use the blood BNP level as a biomarker of how severe heart failure is", sourceRef: {source: rubin-8e, chapter: "17", pages: "640"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c051, section: clinical, statement: "Left-sided failure presents with dyspnea on exertion, orthopnea and paroxysmal nocturnal dyspnea", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c052, section: clinical, statement: "Lying down reduces blood volume in the legs and raises it in the lungs, producing orthopnea and nocturnal dyspnea, while exertional dyspnea reflects pulmonary congestion", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c053, section: clinical, statement: "In pulmonary edema, fluid-filled alveoli expand with a crackling sound heard as rales", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c054, section: clinical, statement: "Right-sided failure congests the liver, making it large and tender, and the spleen; neck veins are distended, legs show pitting edema and ascites may occur", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c055, section: clinical, statement: "Sodium and water retention is typical of left-sided failure, driven by poor kidney perfusion and activation of the renin-angiotensin-aldosterone axis", sourceRef: {source: rubin-8e, chapter: "17", pages: "642"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c056, section: clinical, statement: "Confusion and memory loss can result from inadequate blood supply to the brain", sourceRef: {source: rubin-8e, chapter: "17", pages: "642"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c058, section: clinical, statement: "Organs receive too little blood (forward failure) while congestion upstream (backward failure) explains most of the symptoms", sourceRef: {source: rubin-8e, chapter: "17", pages: "641-642"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c059, section: clinical, statement: "HFpEF, heart failure with normal ejection fraction, makes up almost half of cases and occurs mainly in older hypertensive patients, more often women", sourceRef: {source: rubin-8e, chapter: "17", pages: "642"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c061, section: diagnosis, statement: "HFpEF is heart failure with an ejection fraction of 50% or more", sourceRef: {source: rubin-8e, chapter: "17", pages: "642"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c064, section: prognosis, statement: "A severe initial insult to the heart can lead to acute cardiogenic shock that threatens life", sourceRef: {source: rubin-8e, chapter: "17", pages: "636"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c065, section: prognosis, statement: "If injury continues, remodeling becomes eccentric, with a dilated chamber and longer myocytes, a pattern often linked to clinical failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "638"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c067, section: prognosis, statement: "Right ventricular failure eventually follows chronic left ventricular failure, through pulmonary hypertension", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c068, section: prognosis, statement: "Of congestive failure patients who need hospital admission, half die within a year", sourceRef: {source: rubin-8e, chapter: "7", pages: "341"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c069, section: prognosis, statement: "Beta-blockers lower mortality in advanced heart failure and few treatments do it better", sourceRef: {source: rubin-8e, chapter: "17", pages: "638-639"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c071, section: differential, statement: "Heart mass alone does not separate physiologic from pathologic hypertrophy: the athlete's heart is efficient, the diseased heart is not", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c072, section: differential, statement: "Compensated hypertensive heart disease may start with involvement of the left ventricle alone", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c073, section: differential, statement: "In cirrhosis, ascites and edema arise from portal hypertension combined with decreased hepatic albumin synthesis", sourceRef: {source: rubin-8e, chapter: "7", pages: "343"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c074, section: differential, statement: "A high protein content in the fluid distinguishes lymphatic edema from other forms of edema", sourceRef: {source: rubin-8e, chapter: "7", pages: "341"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c075, section: high-yield, statement: "Concentric hypertrophy gives a thicker wall without proportionate chamber enlargement; eccentric hypertrophy gives a dilated chamber and longer myocytes", sourceRef: {source: rubin-8e, chapter: "17", pages: "638"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c076, section: high-yield, statement: "Maintaining stroke volume in heart failure takes an abnormally high atrial pressure", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c077, section: high-yield, statement: "Left-sided failure causes pulmonary congestion, orthopnea and paroxysmal nocturnal dyspnea", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c078, section: high-yield, statement: "Right-sided failure causes hepatomegaly, ascites, leg edema and distended neck veins", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c079, section: high-yield, statement: "Nutmeg liver and heart failure cells are signs of chronic hepatic and pulmonary congestion", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c080, section: high-yield, statement: "The commonest cause of heart failure is coronary artery disease", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c081, section: high-yield, statement: "Blood BNP is a biomarker of heart failure severity", sourceRef: {source: rubin-8e, chapter: "17", pages: "640"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c082, section: traps, statement: "Physiologic hypertrophy of athletes is efficient and proportional, unlike pathologic hypertrophy", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c083, section: traps, statement: "Failing hearts usually keep their absolute output up, paid for by a higher filling pressure", sourceRef: {source: rubin-8e, chapter: "17", pages: "637"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c084, section: traps, statement: "HFpEF is heart failure with a normal ejection fraction", sourceRef: {source: rubin-8e, chapter: "17", pages: "642"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c085, section: traps, statement: "Right-sided failure most commonly complicates left-sided failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c086, section: traps, statement: "Heart failure cells are hemosiderin-laden alveolar macrophages", sourceRef: {source: rubin-8e, chapter: "17", pages: "641"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: cardiac-hypertrophy-and-heart-failure-c087, section: mnemonics, statement: "Left-sided failure congests the lungs while right-sided failure causes systemic edema, per the textbook account of the two forms", sourceRef: {source: rubin-8e, chapter: "7", pages: "342"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
