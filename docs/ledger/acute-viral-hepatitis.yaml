entity: acute-viral-hepatitis
claims:
  - { claimId: acute-viral-hepatitis-c001, section: definition, statement: "A hepatotropic virus enters hepatocytes, and the consequence is death of liver cells together with inflammation.", sourceRef: { source: rubin-8e, chapter: "20", pages: "856" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c002, section: definition, statement: "In wealthy countries, the five viruses named A to E are behind almost all viral hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "856-857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c003, section: definition, statement: "Loss of hepatocytes is the defining feature of acute viral hepatitis, and the histologic picture is alike for all the viruses.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c004, section: definition, statement: "Among causes of acute hepatitis, HAV ranks first.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c005, section: etiology, statement: "The hepatitis A virus belongs to the picornaviruses, a family of small enteroviruses with an RNA genome.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c006, section: etiology, statement: "Water or food contaminated with feces, and shellfish from polluted water that are insufficiently cooked, can carry hepatitis A, which is why transmission is fecal-oral.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c007, section: etiology, statement: "The hepatitis B virus has a DNA genome and is classed with the hepadnaviruses.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c008, section: etiology, statement: "HBV is infectious only in blood, saliva and semen, so close contact is now its usual route of spread.", sourceRef: { source: rubin-8e, chapter: "20", pages: "858" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c009, section: etiology, statement: "The hepatitis C virus is an RNA flavivirus surrounded by an envelope.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c010, section: etiology, statement: "Hepatitis C is passed on through infected blood, and injecting drugs with unsafe practices is one of the main risks.", sourceRef: { source: rubin-8e, chapter: "20", pages: "862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c011, section: etiology, statement: "Only people with HBV can have hepatitis D, because the incomplete virus cannot be assembled in the liver without HBsAg; it is acquired either at the same time as HBV or on top of it.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c012, section: etiology, statement: "Hepatitis E spreads through contaminated water, through insufficiently cooked pork or game from infected animals, and through blood or from mother to child.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c013, section: pathogenesis, statement: "In hepatitis A, B and C the damage to cells comes from the host immune reaction to infected hepatocytes, since the viruses do not themselves damage cells.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857, 859, 862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c014, section: pathogenesis, statement: "CD8+ cytotoxic T cells account for most of the tissue destruction in hepatitis B: they recognize viral antigens displayed on infected hepatocytes and kill those cells.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c016, section: pathogenesis, statement: "Killing of virus-infected hepatocytes by cytotoxic T cells is the probable explanation for liver damage in hepatitis C.", sourceRef: { source: rubin-8e, chapter: "20", pages: "862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c017, section: gross, statement: "A liver with massive necrosis weighs about one third of normal, as little as 500 g.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c020, section: micro, statement: "Acidophilic bodies are apoptotic hepatocytes that are shrunken and intensely pink, at times with a pyknotic nucleus.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c021, section: micro, statement: "Hepatocytes vary in size and staining, and many show hydropic swelling (ballooning).", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c022, section: micro, statement: "Regenerating hepatocytes have enlarged nuclei and cytoplasm that takes up hematoxylin (basophilic).", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c023, section: micro, statement: "Lobular disarray is the loss of the orderly arrangement of liver cell plates that results from these changes.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c024, section: micro, statement: "Lymphocytes, the main cells of the infiltrate, encircle single dead hepatocytes and also spread diffusely through the lobules.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c025, section: micro, statement: "Central phlebitis is the name for lymphocytes that infiltrate beneath the central vein wall, in contact with the liver cell plates.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c026, section: micro, statement: "Kupffer cells swell and store lipofuscin and debris.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c027, section: micro, statement: "Dilated bile canaliculi, some containing bile plugs, characterize cholestatic hepatitis, the severe form of the bile stasis that is common in acute viral hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c030, section: micro, statement: "In confluent necrosis a whole zone of the lobule dies together, whereas ordinary acute viral hepatitis kills cells at scattered sites.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c031, section: micro, statement: "Necrotic bands in bridging necrosis connect a portal tract to a neighboring portal tract or to a central vein, and also connect one central vein to another.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c032, section: micro, statement: "Bands of connective tissue form because the collagen scaffold collapses after neighboring cell plates die.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c033, section: micro, statement: "Submassive necrosis destroys one lobule or a group of adjoining lobules entirely and is more severe than bridging necrosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c034, section: micro, statement: "Because almost every hepatocyte is dead in massive necrosis, only the collagen scaffolds of the lobules are left.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c035, section: micro, statement: "In massive necrosis there is little inflammation despite the destruction, and the sinusoids contain macrophages and cell debris.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c037, section: ancillary, statement: "A liver biopsy is key to predicting whether hepatitis C will worsen.", sourceRef: { source: rubin-8e, chapter: "20", pages: "862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c038, section: ancillary, statement: "Routine histology of acute viral hepatitis shows acidophilic bodies, swollen hepatocytes, irregular plates and lymphocytes in the lobule.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863-864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c039, section: ancillary, statement: "A reticulin stain displays the connective tissue bands formed by bridging necrosis most clearly.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c040, section: clinical, statement: "Hepatitis A begins with anorexia, malaise and fever, and yellow discoloration of the skin can then follow.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c041, section: clinical, statement: "Hepatitis A infections mostly pass without jaundice.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c042, section: clinical, statement: "A hepatitis A infection cannot turn chronic, and nobody remains a long-term carrier.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c043, section: clinical, statement: "Immunity after a hepatitis A infection lasts for life.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c044, section: clinical, statement: "Most adults recover from acute hepatitis B, which has a far longer incubation than hepatitis A and is slightly more severe.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c045, section: clinical, statement: "Many hepatitis B infections occur without jaundice, and nearly all infections in children do.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c046, section: clinical, statement: "In the majority of people the acute phase of hepatitis C causes only mild symptoms or none.", sourceRef: { source: rubin-8e, chapter: "20", pages: "862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c047, section: clinical, statement: "Hepatitis C usually persists, and most infected patients end up with chronic liver disease.", sourceRef: { source: rubin-8e, chapter: "20", pages: "862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c048, section: clinical, statement: "A few patients with HDV acquired together with HBV get a severe fulminant illness, but the course is generally like acute hepatitis B.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c049, section: clinical, statement: "HDV acquired by an HBV carrier usually aggravates the chronic hepatitis already present.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c050, section: clinical, statement: "Fever, joint pains and an enlarged liver are common in hepatitis E, a limited icteric illness that resembles hepatitis A.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c051, section: clinical, statement: "Pregnancy puts women at high risk from hepatitis E.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c053, section: diagnosis, statement: "In hepatitis A any jaundice appears only after the aminotransferases, raised by the liver injury, begin to fall.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c054, section: diagnosis, statement: "Finding IgM anti-HAV in serum identifies HAV as the cause of an acute hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c055, section: diagnosis, statement: "In acute hepatitis B, no serum marker appears earlier than the surface antigen.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c056, section: diagnosis, statement: "Anti-HBs appears as HBsAg fades; it means the patient has recovered and is immune for life.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c057, section: diagnosis, statement: "Anti-HBc does not protect: it neither removes the virus nor prevents a new infection, and only marks a past HBV infection.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c058, section: diagnosis, statement: "A patient with HBeAg in the serum is at peak infectivity, with the virus multiplying actively.", sourceRef: { source: rubin-8e, chapter: "20", pages: "860" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c059, section: diagnosis, statement: "Blood tests in hepatitis C detect viral RNA earlier than anti-HCV antibodies.", sourceRef: { source: rubin-8e, chapter: "20", pages: "862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c060, section: prognosis, statement: "Hepatitis A nearly always ends in complete recovery with no lasting effects.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c061, section: prognosis, statement: "Fulminant disease is seldom seen in hepatitis A, and is seen a bit more often, though still rarely, in hepatitis B.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857, 861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c062, section: prognosis, statement: "Fulminant acute hepatitis B often proves fatal, because so many liver cells die that the liver fails.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c063, section: prognosis, statement: "Most deaths in fulminant hepatitis B are due to brain swelling, sepsis or failure of heart and lung function.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c064, section: prognosis, statement: "Fulminant hepatitis is the name used when submassive necrosis leads to liver failure within a short time.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c065, section: prognosis, statement: "Acute yellow atrophy, the name for massive hepatic necrosis, is uncommon and almost always ends in the patient's death.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c068, section: prognosis, statement: "Long-standing HBV or HCV infection puts patients at risk of cirrhosis and of liver cancer (hepatocellular carcinoma).", sourceRef: { source: rubin-8e, chapter: "20", pages: "861-862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c069, section: differential, statement: "Chronic hepatitis means that liver necrosis and inflammation go on past the six-month mark.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c070, section: differential, statement: "In hepatitis C a liver biopsy helps foresee whether the disease will worsen.", sourceRef: { source: rubin-8e, chapter: "20", pages: "862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c071, section: differential, statement: "Autoimmune hepatitis can produce confluent necrosis as well, so the lesion is not exclusive to viral hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c072, section: differential, statement: "Confluent necrosis can be produced by liver-toxic substances, including nonprescription remedies and supplements.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c073, section: high-yield, statement: "Acute viral hepatitis is recognized by acidophilic bodies, swollen hepatocytes, disarrayed plates and lymphocytes.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863-864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c074, section: high-yield, statement: "Hepatitis A and E are intestinal infections and resolve on their own.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857, 863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c075, section: high-yield, statement: "Hepatitis B and C spread through blood and may persist as chronic infections.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859, 861, 862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c076, section: high-yield, statement: "In hepatitis B, cytotoxic T cells rather than the virus directly are mostly responsible for destroying hepatocytes.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c077, section: high-yield, statement: "Massive necrosis is the worst grade of confluent necrosis, submassive the middle grade and bridging the mildest.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c078, section: high-yield, statement: "Fulminant hepatitis is liver failure that comes quickly after severe necrosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c079, section: high-yield, statement: "In acute hepatitis, serum IgM against HAV establishes hepatitis A as the diagnosis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c080, section: high-yield, statement: "The hepatitis B surface antigen shows up in serum before any other marker of acute hepatitis B.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c081, section: high-yield, statement: "HDV requires HBsAg to assemble, which restricts it to people who also carry HBV.", sourceRef: { source: rubin-8e, chapter: "20", pages: "861" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c082, section: traps, statement: "Hepatitis A has no chronic phase and no chronic carriers.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c083, section: traps, statement: "Viruses A, B and C do not directly harm hepatocytes; the immune response does.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857, 859, 862" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c084, section: traps, statement: "Acidophilic bodies are also found in numerous other liver diseases, even though they are typical of viral hepatitis.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863-864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c085, section: traps, statement: "A positive anti-HBc only shows that HBV infection happened earlier; it does not safeguard against catching the virus again.", sourceRef: { source: rubin-8e, chapter: "20", pages: "859" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c086, section: traps, statement: "Confluent necrosis can result from autoimmune hepatitis or from liver-toxic drugs and chemicals, not only from viruses.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c087, section: traps, statement: "Pregnant women are at high risk from hepatitis E.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c088, section: mnemonics, statement: "Hepatitis A and E viruses are intestinal pathogens, and hepatitis B and C viruses are passed on in blood.", sourceRef: { source: rubin-8e, chapter: "20", pages: "857, 858, 862, 863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c089, section: mnemonics, statement: "Necrosis is bridging when mild, submassive when worse and massive when it reaches nearly every cell of the lobule.", sourceRef: { source: rubin-8e, chapter: "20", pages: "864" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: acute-viral-hepatitis-c090, section: etiology, statement: "Hepatitis E is caused by an RNA virus of the enteric type.", sourceRef: { source: rubin-8e, chapter: "20", pages: "863" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
