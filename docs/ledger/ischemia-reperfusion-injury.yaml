entity: ischemia-reperfusion-injury
claims:
  - claimId: ischemia-reperfusion-injury-c001
    section: definition
    statement: "Ischemia-reperfusion injury is extra tissue damage that occurs when blood flow is restored after ischemia."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c002
    section: definition
    statement: "Reperfusion rescues injured but still viable cells; it also kills some of them, which treatment aimed at reperfusion injury could in principle have spared."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c003
    section: definition
    statement: "Up to about half of the final myocardial infarct size may be attributable to reperfusion injury."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c004
    section: etiology
    statement: "Reperfusion injury arises when flow returns to tissue injured by a period of ischemia."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c005
    section: etiology
    statement: "Coronary reperfusion can occur spontaneously through lysis of the occluding thrombus."
    sourceRef: { source: rubin-8e, chapter: "7", pages: "337" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c006
    section: etiology
    statement: "In acute myocardial infarction, flow can be restored therapeutically by thrombolysis or by a coronary intervention that reopens the occluded artery."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659-660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c007
    section: etiology
    statement: "Organ transplantation is a setting of reperfusion injury: the graft is ischemic before implantation and is reperfused in the recipient."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c008
    section: etiology
    statement: "Prolonged cardiopulmonary bypass with irreversibly injured myocardium, followed by reperfusion, gives extensive contraction band necrosis."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c009
    section: etiology
    statement: "The duration of ischemia determines whether reperfusion fully restores the cell, kills it, or comes too late to matter."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c010
    section: pathogenesis
    statement: "In ischemia, ATP loss impairs the Na+/K+ pump, anaerobic glycolysis lowers pH, and the Na+/H+ and Na+/Ca2+ exchangers lead to sodium then calcium accumulation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c011
    section: pathogenesis
    statement: "Ischemia increases ROS generation and leaves antioxidant systems impaired."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42-44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c012
    section: pathogenesis
    statement: "During ischemia ATP is catabolized to purines including xanthine, and xanthine oxidase activity increases, especially in endothelium."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c013
    section: pathogenesis
    statement: "Free radicals generated during ischemia react with the oxygen brought back by reperfusion, producing further ROS."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43-44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c014
    section: pathogenesis
    statement: "Xanthine oxidase needs oxygen to oxidize xanthine to uric acid, releasing superoxide as a by-product, so reoxygenation turns it into a burst source of ROS."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c015
    section: pathogenesis
    statement: "Mitochondrial oxidant stress rises at reperfusion because electron transport resumes abruptly while antioxidant defenses are depleted."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c016
    section: pathogenesis
    statement: "Oxidative attack on cardiolipin, an unsaturated-fatty-acid-rich phospholipid found only in mitochondria, damages the electron transport chain."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c017
    section: pathogenesis
    statement: "Reperfusion normalizes intracellular pH abruptly and sets the Na+/Ca2+ exchanger running in reverse, which aggravates the calcium load already present from ischemia."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c018
    section: pathogenesis
    statement: "Raised cytosolic calcium activates phospholipase A2 and proteases that damage membranes and disrupt cytoskeleton-membrane attachments."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42-43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c019
    section: pathogenesis
    statement: "Increased cytosolic calcium together with mitochondrial ROS causes opening of the mitochondrial permeability transition pore."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43-44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c020
    section: pathogenesis
    statement: "MPTP opening admits water and ions to the matrix, dissipates membrane potential, swells mitochondria and impairs ATP production."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "49" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c021
    section: pathogenesis
    statement: "Cytochrome c that escapes from damaged mitochondria can set off apoptosis, and without it the electron transport chain makes even less ATP."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43, 49" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c022
    section: pathogenesis
    statement: "Neutrophils add ROS and hydrolytic enzymes at reperfusion and bind ICAM-1 more readily because reperfused endothelium exposes its stored P-selectin."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c023
    section: pathogenesis
    statement: "TNF-alpha, IL-1 and IL-6 make neutrophils and platelets stick to the endothelium and constrict vessels."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c024
    section: pathogenesis
    statement: "Complement activation during reperfusion deposits membrane attack complexes and recruits neutrophils."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c025
    section: pathogenesis
    statement: "The factors that platelets release after adhering to injured microvessels have a double effect, some cytoprotective and some damaging."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c026
    section: pathogenesis
    statement: "NO limits leukocyte adherence to endothelium and keeps microvessels dilated, which makes it protective under normal conditions."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c027
    section: pathogenesis
    statement: "Peroxynitrite, formed when NO reacts with superoxide, causes DNA strand breaks and lipid peroxidation; its formation rises at reperfusion, when superoxide is abundant and SOD, the enzyme that normally removes it, is inactivated."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c028
    section: pathogenesis
    statement: "Autophagy, with adaptive and maladaptive effects, is activated in part by aggregates of ubiquitinated proteins that accumulate because ischemia and reperfusion impair the ubiquitin-proteasome system."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c029
    section: gross
    statement: "Blood re-entering through injured microvessels usually makes a reperfused myocardial infarct hemorrhagic (red)."
    sourceRef: { source: rubin-8e, chapter: "7, 17", pages: "337, 659" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c030
    section: gross
    statement: "Bleeding makes a reperfused infarct visible at once, whereas a pale infarct from persistent occlusion needs about 12 hours before it can be seen grossly."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c031
    section: micro
    statement: "Contraction band necrosis is typical of acute infarcts that have been reperfused: in myocytes with a torn sarcolemma, excessive contraction squeezes the sarcomeres into eosinophilic bands that run across the fiber."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c032
    section: micro
    statement: "Contraction bands result from massive Ca2+ entry through ROS-damaged sarcolemma into myocytes still able to contract."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659-660" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c033
    section: micro
    statement: "Precipitates of calcium phosphate may appear in the matrix of the swollen mitochondria found between contraction bands."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c034
    section: micro
    statement: "Neutrophils reach the center as well as the margin of a reperfused infarct and arrive and clear sooner; reperfusion speeds the sequence up, and scar forms earlier where flow persists."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c035
    section: clinical
    statement: "The classic setting of reperfusion injury is acute myocardial infarction with flow restored spontaneously or by treatment."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c036
    section: clinical
    statement: "Organ transplantation and prolonged cardiopulmonary bypass are other settings of reperfusion injury."
    sourceRef: { source: rubin-8e, chapter: "1, 17", pages: "43, 660" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c037
    section: clinical
    statement: "A patient with recurrent angina but no infarct may have preconditioned myocardium, which loses less tissue to necrosis when a longer ischemic episode follows."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c038
    section: prognosis
    statement: "How long ischemia lasted decides the outcome: after brief ischemia reperfusion fully restores the cell; after intermediate ischemia the cells die only once flow returns, so the infarct could be made smaller by protecting them from reperfusion injury; after the longest ischemia the cells are already dead and reperfusion is irrelevant."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c039
    section: prognosis
    statement: "The RISK pathway (Akt, ERK, GSK3beta) and the SAFE pathway (TNF-alpha, STAT3) are key routes of ischemic preconditioning, in which more than 100 signaling molecules have been implicated experimentally."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44-45" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c040
    section: prognosis
    statement: "HIF-1alpha, the transcriptional regulator of the hypoxic response, improves survival of a later ischemic episode, partly through genes that curb ROS production."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c041
    section: differential
    statement: "Ischemic injury involves ATP loss, acidosis and sodium and calcium accumulation during the ischemic period itself."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42-43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c042
    section: differential
    statement: "An infarct from persistent occlusion is pale and needs about 12 hours to be seen grossly; contraction bands, if present, are confined to small foci at its margins."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659-660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c043
    section: differential
    statement: "Oxidative injury from activated oxygen species also arises from inflammation, chemical toxicity and ionizing radiation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "31" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c044
    section: differential
    statement: "Catecholamine excess also causes contraction bands, whether released endogenously, as by a pheochromocytoma, or given as high-dose pressor therapy for shock."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c045
    section: high-yield
    statement: "Reperfusion salvages reversibly injured cells but can kill cells itself, up to half of infarct size in the heart."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c046
    section: high-yield
    statement: "ROS during reperfusion come from xanthine oxidase, neutrophils and mitochondria."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c047
    section: high-yield
    statement: "As pH normalizes at reperfusion, the Na+/Ca2+ exchanger runs backward and the calcium overload grows."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c048
    section: high-yield
    statement: "Calcium and ROS open the MPTP, collapsing membrane potential, lowering ATP and releasing cytochrome c."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43-44, 49" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c049
    section: high-yield
    statement: "Inflammatory mechanisms include P-selectin/ICAM-1 neutrophil adhesion, cytokines, complement and platelets."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c050
    section: high-yield
    statement: "NO reacts with superoxide to form peroxynitrite."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c051
    section: high-yield
    statement: "Reperfused infarcts are hemorrhagic with contraction band necrosis."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c052
    section: high-yield
    statement: "Ischemic preconditioning protects against a subsequent longer ischemic episode."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c053
    section: traps
    statement: "Restoring flow remains the way to rescue reversibly injured cells, even though it also causes reperfusion injury."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "43" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c054
    section: traps
    statement: "ROS generation begins in ischemia and is greatly magnified on reperfusion."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "42" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c055
    section: traps
    statement: "Any massive calcium entry into myocytes, as with catecholamine excess, can produce contraction bands, so they are not limited to reperfusion."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659-660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c056
    section: traps
    statement: "NO is protective normally but contributes to injury through peroxynitrite during reperfusion."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c057
    section: traps
    statement: "Rapid pH normalization after acidosis is listed among reperfusion injury mechanisms."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c058
    section: mnemonics
    statement: "Summary of reperfusion mechanisms: ROS, Na+/Ca2+ exchanger reversal with calcium overload, inflammation, NO/peroxynitrite, cytochrome c release via MPTP."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "44-45" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: ischemia-reperfusion-injury-c059
    section: ancillary
    statement: "The usual sequence for dating myocardial infarcts describes infarcts whose coronary artery stays occluded; reperfusion speeds up acute inflammation and, where flow persists, scar formation, which must be considered when a reperfused infarct is dated."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c060
    section: ancillary
    statement: "Reperfusion gives the most extensive contraction bands; at the margin of an infarct from persistent occlusion, intermittent flow and calcium entry may produce only small foci of them."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "660" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c061
    section: ancillary
    statement: "Stunned myocardium corresponds to the subtle ultrastructural changes of reversibly injured myocytes; only electron microscopy shows them, and they are the first visible trace of ischemic damage."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c062
    section: ancillary
    statement: "In dog myocardium irreversibly injured by ischemia, tissue calcium rose markedly when the tissue was reperfused but did not change significantly with permanent occlusion; electron microscopy and other methods placed a large part of the excess inside mitochondria, in dense bodies that seemed to consist of calcium phosphate."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "659" }
    status: beyond-reference
    secondSource: { source: shen-1972, locator: "abstract (dog circumflex occlusion: 60 min permanent versus 40 min followed by 20 min reperfusion; calcium localized by electron microscopy and microincineration)" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c063
    section: prognosis
    statement: "After brief ischemia relieved in time, ROS formed at reperfusion can depress myocardial contraction for hours without myocyte death; this reversible state is stunned myocardium."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: ischemia-reperfusion-injury-c064
    section: high-yield
    statement: "Stunned myocardium is a reversible, hours-long weakness of contraction after brief ischemia, caused by reperfusion ROS without myocyte death."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "657" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
