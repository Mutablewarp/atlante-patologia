entity: multistep-carcinogenesis
claims:
  - {claimId: multistep-carcinogenesis-c001, section: definition, statement: "A cancer usually traces back to one founder cell that accumulates changes in its genome and in gene expression.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c002, section: definition, statement: "Local invasion and spread through blood and lymphatic vessels come late, after the progeny of the founding cell have escaped growth control while mutations accumulate with each division.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c003, section: definition, statement: "Tight control of division is the rule for normal cells, even in fast-renewing tissues such as myelocytes and intestinal mucosa.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c004, section: etiology, statement: "DNA is damaged continually, by outside agents and by byproducts of the cell's own chemistry, such as free radicals.", sourceRef: {source: rubin-8e, chapter: "5", pages: "179"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c005, section: etiology, statement: "DNA polymerases are not perfectly faithful copiers.", sourceRef: {source: rubin-8e, chapter: "5", pages: "179"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c006, section: etiology, statement: "Repair systems cooperate with cell-cycle checkpoints and with apoptosis so that mutations are not passed on to daughter cells.", sourceRef: {source: rubin-8e, chapter: "5", pages: "179"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c007, section: etiology, statement: "Mismatch repair mainly corrects errors of DNA replication.", sourceRef: {source: rubin-8e, chapter: "5", pages: "179-180"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c008, section: etiology, statement: "Nucleotide excision repair handles UV lesions and bulky adducts, which distort the DNA helix.", sourceRef: {source: rubin-8e, chapter: "5", pages: "180"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c009, section: etiology, statement: "Single-strand breaks and chemical injury to individual bases are mostly repaired by base excision repair.", sourceRef: {source: rubin-8e, chapter: "5", pages: "180-181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c010, section: etiology, statement: "Cells repair double-strand breaks by two routes, nonhomologous end joining and homologous recombination.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c011, section: etiology, statement: "The genome-scanning detection pathway of nucleotide excision repair is deficient in xeroderma pigmentosum.", sourceRef: {source: rubin-8e, chapter: "5", pages: "180"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c012, section: etiology, statement: "In inherited cancer susceptibility syndromes the mutated or inactivated gene may be one that works in homologous recombination, such as BRCA1, BRCA2 or PALB2.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c013, section: etiology, statement: "Mismatch repair defects can be inherited or acquired.", sourceRef: {source: rubin-8e, chapter: "5", pages: "180"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c014, section: pathogenesis, statement: "Activating mutations in proto-oncogenes drive the cell forward through its cycle.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c015, section: pathogenesis, statement: "Inactivating mutations in tumor suppressors remove inhibitory influences on the cycle.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c016, section: pathogenesis, statement: "E2F drives entry into S phase, and pRb blocks it until cyclin D-CDK4/6 phosphorylates pRb and liberates E2F.", sourceRef: {source: rubin-8e, chapter: "5", pages: "178"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c017, section: pathogenesis, statement: "In human cancers the genes of CDK inhibitors are often the ones mutated.", sourceRef: {source: rubin-8e, chapter: "5", pages: "177"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c018, section: pathogenesis, statement: "After DNA damage p53 first holds the cell cycle so repair can happen; when repair is impossible it switches to inducing apoptosis.", sourceRef: {source: rubin-8e, chapter: "5", pages: "179"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c019, section: pathogenesis, statement: "Mutated Ras is not switched off and stays GTP-bound and constitutively active.", sourceRef: {source: rubin-8e, chapter: "5", pages: "185"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c020, section: pathogenesis, statement: "A receptor with a constitutively activating mutation no longer needs its ligand, and this is an important way receptors drive oncogenesis.", sourceRef: {source: rubin-8e, chapter: "5", pages: "184"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c021, section: pathogenesis, statement: "Of the many mutations found in human tumors, only a subset is essential for tumor development.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c022, section: pathogenesis, statement: "Tumors adapt quickly because, in most human cancers, mutations arise far more often than in normal cells.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c023, section: pathogenesis, statement: "Tumor cells also regulate genes abnormally through epigenetic changes, which leave the underlying DNA sequence untouched.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c024, section: pathogenesis, statement: "Cancer cells can escape TGFbeta suppression when the promoters of key pathway genes are methylated.", sourceRef: {source: rubin-8e, chapter: "5", pages: "186"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c025, section: pathogenesis, statement: "The same gene may promote cancer in one context and restrain it in another, since no two tumors evolve alike.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c026, section: pathogenesis, statement: "Tumor cells rewire the behavior of the non-tumor cells around them.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c027, section: pathogenesis, statement: "Inflammatory cells enter most growing solid tumors, and the factors they release help the tumor arise and advance.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c028, section: pathogenesis, statement: "Eight hallmark activities distinguish solid cancers from normal tissue.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c029, section: micro, statement: "Counts of mitotic figures in a section can mislead about overall growth because mitosis may last longer in cancer cells.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c030, section: micro, statement: "Tumor cell death also affects tumor size and is not captured by mitotic activity.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c031, section: micro, statement: "Tumor cells die by apoptosis, and also from ischemia caused by a poor blood supply.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c032, section: ancillary, statement: "Microsatellite instability signals defective mismatch repair.", sourceRef: {source: rubin-8e, chapter: "5", pages: "180"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c033, section: ancillary, statement: "In some tumors, the response to DNA-damaging drugs such as cisplatin can be partly forecast from ERCC1 activity.", sourceRef: {source: rubin-8e, chapter: "5", pages: "180"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c034, section: ancillary, statement: "Patients whose tumors carry hormone receptors are less likely to relapse after surgery if they are given antiestrogen drugs.", sourceRef: {source: rubin-8e, chapter: "5", pages: "186"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c035, section: ancillary, statement: "MUC1, a membrane-bound mucin, is overproduced in most breast cancers.", sourceRef: {source: rubin-8e, chapter: "5", pages: "186"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c036, section: clinical, statement: "Internal tumors are usually found after many doublings of the founding cell, so they are advanced by then.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c037, section: clinical, statement: "Growth rate depends strongly on tumor type and on the individual tumor.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c038, section: clinical, statement: "Hematologic and mesenchymal malignancies generally grow faster than solid epithelial tumors.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c040, section: diagnosis, statement: "Doubling time is how long a tumor takes to reach twice its volume.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c041, section: diagnosis, statement: "Doubling time comes mostly from serial radiographs and less often from repeated blood levels of tumor markers.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c042, section: diagnosis, statement: "Following an untreated tumor for months, by imaging or blood tests, is the best way to measure its doubling time, but often this is not possible.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c043, section: prognosis, statement: "Prognosis tends to track tumor doubling time.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c044, section: prognosis, statement: "Death from solid tumors usually results from wide metastasis, not from bulk.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c045, section: prognosis, statement: "Tumor cells that repair DNA effectively may resist genotoxic therapies, making DNA repair a facet of treatment resistance.", sourceRef: {source: rubin-8e, chapter: "5", pages: "179"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c046, section: prognosis, statement: "Most prostate tumors eventually become androgen insensitive even though removing androgen stimulation inhibits their growth.", sourceRef: {source: rubin-8e, chapter: "5", pages: "186"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c047, section: differential, statement: "Driver mutations are relatively few, and they propel tumor development.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c048, section: differential, statement: "Passengers appear to be bystanders; whether they do anything for the tumor is mostly unknown.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c049, section: differential, statement: "A polymorphism is a DNA sequence variation with no known link to disease.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c050, section: differential, statement: "A mutation is a similar genetic change that plays a part in disease.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c051, section: differential, statement: "Nonhomologous end joining reattaches broken ends, and the resulting sequence may differ from the original.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c052, section: differential, statement: "Homologous recombination restores the original sequence by copying the sister chromatid or homologous chromosome.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c053, section: high-yield, statement: "In most tumors one cell becomes malignant and gives rise to the tumor.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c054, section: high-yield, statement: "Relatively few driver mutations push tumor development forward, while passengers appear to be bystanders.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c055, section: high-yield, statement: "Activated proto-oncogenes and inactivated tumor suppressors let cancer cells escape regulated cycling.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c056, section: high-yield, statement: "p53 first holds the cell cycle so repair can happen; when repair is impossible it induces apoptosis.", sourceRef: {source: rubin-8e, chapter: "5", pages: "179"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c057, section: high-yield, statement: "pRb binds and blocks E2F; cyclin D-CDK4/6 phosphorylation of pRb liberates E2F.", sourceRef: {source: rubin-8e, chapter: "5", pages: "178"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c058, section: high-yield, statement: "Genomic instability lets tumors evolve quickly; their gene regulation is also altered epigenetically.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c059, section: high-yield, statement: "Prognosis tends to follow tumor doubling time.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c060, section: high-yield, statement: "Solid tumors kill mainly by widespread metastasis.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c061, section: traps, statement: "A cancer builds up step by step: each division of the descendants of the founding cell can add mutations.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c062, section: traps, statement: "Many mutations in a tumor are passengers whose role is mostly unknown.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c063, section: traps, statement: "A mitotic count leaves out tumor cell death, and because mitosis can be prolonged it can misrepresent overall growth.", sourceRef: {source: rubin-8e, chapter: "5", pages: "176"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c064, section: traps, statement: "Cancer cells can corrupt TGFbeta signaling and turn it to their advantage, helping tumors grow, invade and metastasize.", sourceRef: {source: rubin-8e, chapter: "5", pages: "186"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c065, section: traps, statement: "Spread to distant sites, more than bulk, is how solid tumors usually cause death.", sourceRef: {source: rubin-8e, chapter: "5", pages: "182"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c066, section: traps, statement: "Depending on the cell type, the same mutant protein may drive proliferation or cell death.", sourceRef: {source: rubin-8e, chapter: "5", pages: "186"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: multistep-carcinogenesis-c067, section: mnemonics, statement: "Driver mutations push tumor development, while passengers seem to be only along for the ride.", sourceRef: {source: rubin-8e, chapter: "5", pages: "181"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
