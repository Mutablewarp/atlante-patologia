entity: anthracosis
claims:
  - { claimId: anthracosis-c001, section: definition, statement: "Anthracosis is innocuous carbon accumulation in the lung, with carbon-laden alveolar macrophages.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732-733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c002, section: definition, statement: "Coal workers' pneumoconiosis results from inhaling coal dust.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c003, section: definition, statement: "CWP has simple and complicated forms, and the complicated form is also called progressive massive fibrosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c004, section: etiology, statement: "Silica is a variable component of coal dust, which also contains amorphous carbon and other mineral matter from the ground.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c005, section: etiology, statement: "Pure amorphous carbon does not produce fibrosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c006, section: etiology, statement: "Anthracosilicosis can result when inhaled coal particles arrive together with silica, a strongly fibrogenic mineral.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c007, section: etiology, statement: "Soft bituminous coal has considerably less quartz than hard anthracite.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c008, section: etiology, statement: "Quartz exposure and risk are higher for underground miners than for surface workers or coal loaders.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c009, section: pathogenesis, statement: "Macrophages that ingest amorphous carbon survive, and the only consequence is harmless anthracosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c010, section: pathogenesis, statement: "Nodules are better named anthracosilicosis because they form when coal dust is mixed with silica or a similar scarring dust.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c011, section: pathogenesis, statement: "The complicated form arises in lungs that already have simple CWP.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c012, section: gross, statement: "In simple CWP the lung is dotted with many black spots, each 1 to 4 mm.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c013, section: gross, statement: "Coal-dust macules are not palpable, whereas coal-dust nodules are palpable.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c014, section: gross, statement: "Several Caplan lesions are usually present in both lungs, mostly toward the periphery, and each measures 1 to 10 cm.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c015, section: micro, statement: "A macule is a crowd of carbon-filled macrophages around a distal respiratory bronchiole.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c016, section: micro, statement: "Macule macrophages also crowd nearby alveoli and the tissue around the bronchioles.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c017, section: micro, statement: "Loss of smooth muscle in the respiratory bronchioles probably explains focal dust emphysema, a mild dilation of these airways.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c018, section: micro, statement: "A nodule is dust-filled macrophages in fibrotic stroma, round or irregular, with or without a bronchiole beside it.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c019, section: micro, statement: "Inhaled dust deposits are present in Caplan nodules, which otherwise look like rheumatoid nodules under the microscope.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c020, section: micro, statement: "In an ordinary rheumatoid nodule, chronic inflammatory cells and macrophages lined up in a palisade form a border around a big central area of necrosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c021, section: micro, statement: "A Caplan nodule differs from a plain rheumatoid nodule and could be a hybrid with a silicotic nodule.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c022, section: ancillary, statement: "Microscopically the macule is recognized by its carbon-laden macrophages around respiratory bronchioles.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c023, section: clinical, statement: "At worst, simple CWP reduces lung function only slightly, even though it was once considered severely disabling.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c024, section: clinical, statement: "Smoking is usually the explanation when a coal miner has severe airflow obstruction.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c025, section: clinical, statement: "The first Caplan syndrome patients were coal miners with rheumatoid arthritis who had rheumatoid nodules in the lungs.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c026, section: clinical, statement: "Rheumatoid lung nodules found together with other dust diseases, for example silicosis or asbestosis, are now also called Caplan syndrome.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c027, section: diagnosis, statement: "Small rounded opacities on a chest X-ray correspond to both macules and nodules.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c028, section: diagnosis, statement: "A lesion measuring 2.0 cm or greater defines complicated CWP.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c029, section: prognosis, statement: "Complicated CWP can seriously impair breathing.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c030, section: differential, statement: "Silicotic nodules are mostly whorled collagen and contain birefringent needle-like silicates seen in polarized light.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c031, section: differential, statement: "Heavy exposure to inhaled asbestos fibers is required to produce asbestosis, a diffuse fibrosis of the interstitium.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c032, section: differential, statement: "Unlike Caplan nodules, true rheumatoid nodules are not described as containing dust deposits; they show palisading macrophages around large central necrosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c033, section: high-yield, statement: "Anthracosis is innocuous carbon deposition in alveolar macrophages.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732-733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c034, section: high-yield, statement: "The macules and nodules of simple CWP appear as black foci of 1 to 4 mm.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c035, section: high-yield, statement: "A fibrotic-stroma nodule in a coal worker signals silica admixture, so anthracosilicosis is the apt name.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c036, section: high-yield, statement: "A lesion of 2.0 cm or more in a lung with simple CWP is complicated CWP, also called progressive massive fibrosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c037, section: high-yield, statement: "Caplan syndrome is large (1 to 10 cm) pulmonary rheumatoid nodules associated with a pneumoconiosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c038, section: high-yield, statement: "Smoking is usually the cause of severe airflow obstruction in a coal miner.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c039, section: traps, statement: "Amorphous carbon is not fibrogenic, whereas silica is highly fibrogenic.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c040, section: traps, statement: "Even in its worst form, simple CWP lowers lung function only a little.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c041, section: traps, statement: "Silicosis, asbestosis and other pneumoconioses are now included in Caplan syndrome, though the first cases were coal miners with rheumatoid arthritis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c042, section: traps, statement: "Caplan nodules differ from rheumatoid nodules and may be a blend with silicotic nodules.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c043, section: traps, statement: "Nodules appear when silica or a similar scarring dust is mixed into coal dust.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c044, section: mnemonics, statement: "Alveolar macrophages survive exposure to carbon.", sourceRef: { source: rubin-8e, chapter: "18", pages: "732" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c045, section: mnemonics, statement: "In coal workers, nodules form once a scarring dust such as silica is present in the mix.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c046, section: mnemonics, statement: "Complicated CWP is defined by a lesion of 2.0 cm or greater.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: anthracosis-c047, section: mnemonics, statement: "Caplan syndrome combines pulmonary rheumatoid nodules, a pneumoconiosis and rheumatoid arthritis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
