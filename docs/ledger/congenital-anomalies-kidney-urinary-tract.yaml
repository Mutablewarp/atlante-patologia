entity: congenital-anomalies-kidney-urinary-tract
claims:
- { claimId: congenital-anomalies-kidney-urinary-tract-c001, section: definition, statement: "These are developmental malformations affecting the kidneys, the ureters and the bladder.", sourceRef: { source: rubin-8e, chapter: "22", pages: "919" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c002, section: definition, statement: "Two to three percent of the population carry a developmental anomaly of the renal pelvis or ureter.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c003, section: definition, statement: "Obstruction or urinary infection arises only occasionally; most of these anomalies cause no clinical problem.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c004, section: definition, statement: "In renal agenesis no kidney tissue is present.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c005, section: definition, statement: "A hypoplastic kidney is small, has normal histology and contains too few nephrons.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c006, section: definition, statement: "In renal ectopia a structurally normal kidney lies in the wrong place.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c007, section: definition, statement: "The two kidneys are fused into a single midline mass.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c008, section: definition, statement: "In dysplasia, immature tubules lie within primitive mesenchyme.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c009, section: etiology, statement: "Several genetic or acquired factors can disturb differentiation of the metanephros, and dysplasia is the result.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c010, section: etiology, statement: "In some familial dysplasias the ureteric bud and the metanephric blastema do not induce each other properly.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c011, section: etiology, statement: "Multicystic dysplasia is inherited less often than aplastic or diffuse cystic dysplasia; Meckel-Gruber syndrome, with other organs malformed, is the example.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c012, section: etiology, statement: "If the ureteric bud sprouts from a misplaced embryonic point, the ureter is ectopic.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c013, section: etiology, statement: "Duplicated ureters arise when the embryo forms more than one ureteric bud.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c014, section: etiology, statement: "Vesicoureteral reflux frequently runs in families.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c015, section: pathogenesis, statement: "Failure of the fetal ascent leaves the ectopic kidney low, most often in the pelvis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c016, section: pathogenesis, statement: "Obstruction of urine flow before birth is thought to cause dysplasia, because dysplastic kidneys often come with obstructive anomalies such as ureteropelvic junction obstruction or posterior urethral valves.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c017, section: pathogenesis, statement: "Ureteropelvic junction obstruction is probably related to muscle or fibrous tissue being laid down abnormally at the junction; the reference says 'related to', not 'caused by'.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c018, section: pathogenesis, statement: "When the fetus makes too little urine, amniotic fluid volume falls, a state called oligohydramnios.", sourceRef: { source: rubin-8e, chapter: "22", pages: "919-920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c019, section: pathogenesis, statement: "With no fluid cushion, uterine pressure bends the legs and flattens the face.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c020, section: pathogenesis, statement: "Lung growth is held back by two things: the uterus squeezes the chest, and the fluid no longer supplies the signals that drive lung maturation.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c021, section: pathogenesis, statement: "Normally muscle replaces the anterior cloacal membrane; in exstrophy this replacement fails.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c022, section: pathogenesis, statement: "The bladder wall and the abdominal wall are defective together because the fragile persisting membrane tears.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c023, section: pathogenesis, statement: "Bladder muscle closes a ureter that tunnels slantwise through the wall for a good distance, so urine cannot flow back.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c024, section: pathogenesis, statement: "Urine is forced up during voiding through a ureter that enters at a right angle and has a short tunnel in the wall.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c025, section: gross, statement: "In bilateral agenesis the kidney remnants may hold nothing but mesenchymal tissue.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c026, section: gross, statement: "Hypoplastic kidneys have fewer lobes and usually under half of normal weight.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c027, section: gross, statement: "The fusion in horseshoe kidney is usually at the lower poles.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c028, section: gross, statement: "Multicystic dysplasia gives a lump of differently sized cysts instead of a kidney-shaped organ.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c029, section: gross, statement: "The kidney of diffuse cystic dysplasia keeps its outline, and its cysts are fairly even in size.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c030, section: gross, statement: "Gross inspection can miss an aplastic dysplastic kidney because it is tiny and deformed.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c031, section: gross, statement: "Typical duplication gives a second full drainage line: two pelves, two ureters and two bladder openings.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c032, section: gross, statement: "The exstrophic bladder lies open to the outside, so its posterior wall is exposed and the organ looks like a cup.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c033, section: micro, statement: "Under the microscope a hypoplastic kidney looks normal.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c034, section: micro, statement: "In oligomeganephronia the small number of glomeruli are each enlarged.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c035, section: micro, statement: "The ducts and tubules of dysplasia are immature, and their cells are cuboidal or columnar.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c036, section: micro, statement: "Cartilage or smooth muscle can be embedded in the immature mesenchyme around these structures.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c037, section: micro, statement: "Some tubules are cystic, and rudimentary glomeruli may be present.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c038, section: micro, statement: "The exposed bladder lining of exstrophy, injured and infected, turns into squamous or glandular epithelium.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c039, section: ancillary, statement: "For a unilateral multicystic kidney removal alone suffices, so the specimen is a nephrectomy.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c040, section: ancillary, statement: "In a dysplastic kidney, cartilage may lie in mesenchyme that surrounds immature tubules.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c042, section: clinical, statement: "Potter sequence accompanies bilateral renal agenesis, and most affected infants are stillborn.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c043, section: clinical, statement: "The remaining kidney enlarges enough to keep renal function normal, so a single absent kidney is harmless when no other anomaly is present.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c044, section: clinical, statement: "Multicystic dysplasia is usually revealed by a flank mass found early in life.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c045, section: clinical, statement: "When a newborn has an abdominal mass, the commonest cause is one-sided multicystic dysplasia.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c046, section: clinical, statement: "In horseshoe kidney, ureters passing over the fused bridge are pinched, which raises the likelihood of obstruction and pyelonephritis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c047, section: clinical, statement: "Among infants and children with hydronephrosis, ureteropelvic junction obstruction is the leading cause.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c048, section: clinical, statement: "A missing ureter is always accompanied by a missing kidney on that side.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c049, section: clinical, statement: "About one birth in fifty thousand is affected by exstrophy of the bladder.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c050, section: clinical, statement: "Some affected boys also have epispadias.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c051, section: clinical, statement: "Young girls are affected by reflux more often than boys.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c052, section: clinical, statement: "Three cases of reflux in four give no symptoms.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c053, section: diagnosis, statement: "Before a small kidney is called hypoplastic, shrinkage from atrophy or scarring has to be excluded.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c055, section: prognosis, statement: "In Potter sequence the underdeveloped lungs are the part that most threatens life.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c056, section: prognosis, statement: "Respiratory failure rather than renal failure may be fatal, because even newborns can be dialyzed.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c057, section: prognosis, statement: "An infant lacking both kidneys and both ureters cannot live after birth.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c058, section: prognosis, statement: "Overwork of the remaining nephrons can lead to progressive secondary FSGS when one kidney is absent and its partner is hypoplastic.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c059, section: prognosis, statement: "FSGS is also a risk in oligomeganephronia.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c061, section: prognosis, statement: "Reflux can cause pyelonephritis.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c062, section: prognosis, statement: "Bladder cancer risk stays raised for decades in the metaplastic lining, even once exstrophy is repaired.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c063, section: differential, statement: "Autosomal dominant polycystic kidney disease is an inherited disease with enlarged, multicystic kidneys, whereas multicystic dysplasia is usually one-sided.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c064, section: differential, statement: "Secondary FSGS follows a congenital shortage of nephrons, as in agenesis with a hypoplastic partner kidney or oligomeganephronia.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c065, section: high-yield, statement: "Potter sequence is oligohydramnios from low fetal urine, with small lungs and a deformed face and legs.", sourceRef: { source: rubin-8e, chapter: "22", pages: "919-920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c066, section: high-yield, statement: "The small lungs are the lethal part of Potter sequence.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c067, section: high-yield, statement: "Babies with bilateral agenesis are mostly stillborn.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c068, section: high-yield, statement: "A single missing kidney is tolerated because the other kidney hypertrophies.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c069, section: high-yield, statement: "Horseshoe kidney is joined at the lower poles and prone to obstruction and pyelonephritis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c070, section: high-yield, statement: "In dysplasia, cartilage may sit in the mesenchyme around immature tubules.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c071, section: high-yield, statement: "One-sided multicystic dysplasia is the commonest newborn abdominal mass and is treated by nephrectomy.", sourceRef: { source: rubin-8e, chapter: "22", pages: "921" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c072, section: high-yield, statement: "Ureteral duplication is the commonest urinary tract malformation and is mostly clinically silent.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c073, section: high-yield, statement: "Reflux arises from a short intravesical ureter and affects girls more.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c074, section: high-yield, statement: "Exstrophy lacks the anterior bladder wall and keeps a raised bladder cancer risk after repair.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c075, section: traps, statement: "A single absent kidney with no other anomaly does not cause renal failure because the other kidney hypertrophies.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c076, section: traps, statement: "In Potter sequence, death may be due to lung hypoplasia rather than renal failure.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c077, section: traps, statement: "Atrophy and scarring can also produce a small kidney.", sourceRef: { source: rubin-8e, chapter: "22", pages: "920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c078, section: traps, statement: "Repair does not remove the cancer risk of an exstrophic bladder; its metaplastic lining stays vulnerable.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c079, section: traps, statement: "Most reflux gives no symptoms.", sourceRef: { source: rubin-8e, chapter: "23", pages: "980" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c080, section: traps, statement: "Most ureteral duplications are clinically unimportant.", sourceRef: { source: rubin-8e, chapter: "23", pages: "978" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: congenital-anomalies-kidney-urinary-tract-c081, section: mnemonics, statement: "Low fetal urine means little amniotic fluid, and the lungs then stay hypoplastic.", sourceRef: { source: rubin-8e, chapter: "22", pages: "919-920" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
