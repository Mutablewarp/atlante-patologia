entity: testicular-germ-cell-tumors
claims:
  - { claimId: testicular-germ-cell-tumors-c001, section: definition, statement: "Most testicular tumors start from germ cells, and cells of the sex cord and stroma give rise to the next group.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999, 1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c002, section: definition, statement: "Invasive testicular germ cell tumors divide into seminoma and nonseminomatous tumors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c003, section: definition, statement: "The nonseminomatous group is made of teratoma, choriocarcinoma, yolk sac tumor and embryonal carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c004, section: definition, statement: "Seminoma is the most common single type of testicular germ cell tumor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c005, section: definition, statement: "Most testicular tumors are diagnosed in men aged 25 to 45 years.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c006, section: definition, statement: "Testicular tumors are grouped by the cell they come from.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c007, section: definition, statement: "Adult seminomas and nonseminomatous tumors follow GCNIS, whereas spermatocytic tumor, prepubertal teratoma and infantile yolk sac tumor have no GCNIS.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999, 1000" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c008, section: etiology, statement: "The cause is unknown; internal and external influences may raise susceptibility.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c009, section: etiology, statement: "Incidence depends on geography and ancestry: rates are high in Scandinavia, and Americans of European origin are affected more often than Americans of African origin.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c010, section: etiology, statement: "Migration does not change the incidence pattern of testicular cancer, in contrast to prostatic adenocarcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c012, section: etiology, statement: "Faulty gonad development, for example gonadal dysgenesis or cryptorchidism, is a risk factor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c014, section: etiology, statement: "In cryptorchidism one or both testes are congenitally outside the scrotum.", sourceRef: { source: rubin-8e, chapter: "23", pages: "995" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c015, section: etiology, statement: "Cryptorchidism is associated with a many-fold increased risk of testicular cancer.", sourceRef: { source: rubin-8e, chapter: "23", pages: "996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c016, section: etiology, statement: "The lower the cryptorchid testis lies, the smaller the risk: intra-abdominal testes carry the most, inguinal testes are intermediate and high scrotal testes carry the least.", sourceRef: { source: rubin-8e, chapter: "23", pages: "996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c017, section: etiology, statement: "The normally descended testis on the opposite side also carries an increased risk.", sourceRef: { source: rubin-8e, chapter: "23", pages: "996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c018, section: etiology, statement: "Orchiopexy, the surgical move of the testis down into the scrotum, leaves the cancer risk unchanged.", sourceRef: { source: rubin-8e, chapter: "23", pages: "995, 996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c019, section: pathogenesis, statement: "Proposed first step: gonocytes (primordial germ cells) fail to ripen under internal or environmental influence.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c020, section: pathogenesis, statement: "GCNIS consists of immature tumor germ cells kept inside the seminiferous tubules.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c021, section: pathogenesis, statement: "Most germ cell tumors arising after puberty gain 12p, the short arm of chromosome 12, wholly or in part.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c022, section: pathogenesis, statement: "A common form of the 12p change is isochromosome 12p, i(12p), which adds 12p while losing 12q.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c023, section: pathogenesis, statement: "GCNIS, like invasive germ cell tumors, is associated with i(12p).", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c024, section: pathogenesis, statement: "Intratubular seminoma or intratubular embryonal carcinoma may appear as intermediate lesions between GCNIS and established invasive disease.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c025, section: pathogenesis, statement: "Seminoma and embryonal carcinoma hold pluripotent stem cells that may form somatic or extraembryonic tissue.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c026, section: pathogenesis, statement: "The outcome of that differentiation can be a choriocarcinoma, yolk sac tumor, teratoma or mixed germ cell tumor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c027, section: pathogenesis, statement: "Spermatocytic tumor, prepubertal teratoma and infantile yolk sac tumor are thought to arise directly from an altered germ cell, without a GCNIS stage.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c028, section: pathogenesis, statement: "Yolk sac tumors, teratomas and midline germ cell tumors outside the gonad may come from primordial germ cells that strayed during fetal testis development.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c029, section: gross, statement: "On section seminoma is an even tan color, firm, and clearly separated from the surrounding testis.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c030, section: gross, statement: "Larger seminomas may show necrosis or hemorrhage, but these are infrequent.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c031, section: gross, statement: "Some nonseminomatous tumors are solid and others partly cystic, and their size and shape vary.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c032, section: gross, statement: "In solid areas of nonseminomatous tumors, red marks hemorrhage, yellow marks necrosis and white marks viable tumor.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c033, section: micro, statement: "GCNIS involves only some tubules, which lack sperm and have a thickened basement membrane.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c034, section: micro, statement: "GCNIS cells are much larger than normal germ cells and have prominent nucleoli.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c036, section: micro, statement: "Seminoma cells all look alike: polygonal, with a vesicular nucleus placed centrally.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c037, section: micro, statement: "Seminoma resembles ovarian dysgerminoma microscopically.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c038, section: micro, statement: "Embryonal carcinoma shows crowded, overlapping nuclei, large and dark, with hardly any cytoplasm separating them.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c039, section: micro, statement: "Embryonal carcinoma may form solid sheets, cords, glands or papillae.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c040, section: micro, statement: "Teratoma draws on all three germ layers, and adult-type and fetal-type tissue often sit side by side.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c041, section: micro, statement: "Epidermoid and dermoid cysts are teratoma variants in which only ectodermal tissue is present.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c043, section: micro, statement: "Sarcoma, adenocarcinoma or squamous cell carcinoma can arise when a somatic tissue in a teratoma transforms, which makes the teratoma malignant.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c044, section: micro, statement: "Choriocarcinoma is a single-type tumor in which only malignant cytotrophoblast and syncytiotrophoblast are left.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c045, section: micro, statement: "Yolk sac tumor is diagnosed by finding glomeruloid Schiller-Duval bodies together with more than one microscopic pattern.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c046, section: micro, statement: "A mixed germ cell tumor combines more than one component, for example a seminoma part and a nonseminomatous part.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1000" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c047, section: ancillary, statement: "GCNIS can be found on testicular biopsies done for infertility.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c048, section: ancillary, statement: "On routine histology GCNIS appears as sperm-free tubules containing large atypical cells with clear cytoplasm.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c049, section: ancillary, statement: "In GCNIS cells OCT3/4 is nuclear, while PLAP and CD117 are on the cell surface.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c050, section: ancillary, statement: "Nuclear OCT3/4 staining is a dependable way to identify GCNIS cells.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c051, section: ancillary, statement: "PLAP and OCT3/4 are positive in both seminoma and embryonal carcinoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c052, section: ancillary, statement: "Embryonal carcinoma is positive for cytokeratins and CD30 and negative for c-KIT (CD117).", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c053, section: ancillary, statement: "Isochromosome 12p is the cytogenetic marker of testicular germ cell tumors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c054, section: clinical, statement: "A testicular mass is the usual presentation of nonseminomatous germ cell tumors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c055, section: clinical, statement: "Nonseminomatous tumors spread more readily and farther than seminomas, and they also grow faster.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c057, section: clinical, statement: "The periaortic abdominal lymph nodes are the first site of metastasis of testicular tumors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c058, section: clinical, statement: "Bilateral cryptorchidism always results in azoospermia and infertility.", sourceRef: { source: rubin-8e, chapter: "23", pages: "996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c059, section: clinical, statement: "Yolk sac tumors make up most testicular neoplasms of the first years of life.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c060, section: clinical, statement: "In older prepubertal boys, testicular tumors are most often benign teratomas.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c061, section: clinical, statement: "Before puberty, seminoma arises only in dysgenetic gonads.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c062, section: diagnosis, statement: "Prophylactic orchiectomy is indicated when a testicular biopsy shows GCNIS.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c063, section: diagnosis, statement: "Almost all invasive germ cell tumors have widespread GCNIS in the adjacent testis.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c065, section: prognosis, statement: "The invasive tumor arises from GCNIS at an unpredictable pace.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c066, section: prognosis, statement: "By 5 years, half of men with GCNIS have developed invasive cancer.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c067, section: prognosis, statement: "Before invasion starts, GCNIS may persist unchanged for years in infertile men with past cryptorchidism.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c068, section: prognosis, statement: "Most testicular tumors can be cured with surgery and chemotherapy together.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c069, section: differential, statement: "Seminoma has plentiful clear or pale pink cytoplasm in polygonal cells that look alike.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c070, section: differential, statement: "Seminoma is positive for PLAP and OCT3/4 on immunostaining.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c071, section: differential, statement: "Nonseminomatous tumors show many different microscopic patterns, and their cut surface is a mix of colors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c072, section: differential, statement: "Embryonal carcinoma is CD30 and cytokeratin positive and CD117 negative, unlike seminoma.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c073, section: differential, statement: "Sex cord stromal tumors of the testis are Leydig cell and Sertoli cell tumors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1000, 1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c074, section: high-yield, statement: "GCNIS is the precursor of adult seminoma and nonseminomatous germ cell tumors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1000, 1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c075, section: high-yield, statement: "Spermatocytic tumor, prepubertal teratoma and infantile yolk sac tumor arise without GCNIS.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c076, section: high-yield, statement: "Isochromosome 12p is the cytogenetic hallmark of testicular germ cell tumors.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c077, section: high-yield, statement: "Cryptorchidism raises testicular cancer risk and orchiopexy does not reduce it.", sourceRef: { source: rubin-8e, chapter: "23", pages: "996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c078, section: high-yield, statement: "Seminoma is the most common testicular germ cell tumor; its polygonal cells look alike and have plentiful pale or clear cytoplasm.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1001" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c079, section: high-yield, statement: "Nonseminomatous tumors spread farther and more readily than seminoma and also grow faster.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c080, section: high-yield, statement: "Mixed germ cell tumors combine more than one germ cell tumor component.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1000" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c083, section: traps, statement: "GCNIS is absent from spermatocytic tumor, prepubertal teratoma and infantile yolk sac tumor, which arise with no in situ phase.", sourceRef: { source: rubin-8e, chapter: "23", pages: "999" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c084, section: traps, statement: "Moving the testis into the scrotum by orchiopexy leaves the cancer risk unchanged.", sourceRef: { source: rubin-8e, chapter: "23", pages: "995, 996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c085, section: traps, statement: "In cryptorchidism, the normally descended testis on the opposite side also carries an increased risk.", sourceRef: { source: rubin-8e, chapter: "23", pages: "996" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c086, section: traps, statement: "A mixed germ cell tumor combines more than one tumor type, for example a seminoma part and a nonseminomatous part.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1000" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c087, section: traps, statement: "Seminoma and embryonal carcinoma both react with PLAP and OCT3/4, but only embryonal carcinoma expresses CD30 and cytokeratins and lacks CD117.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
  - { claimId: testicular-germ-cell-tumors-c088, section: traps, statement: "A somatic element of a teratoma can transform into a cancer, which makes the teratoma malignant.", sourceRef: { source: rubin-8e, chapter: "23", pages: "1003" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-16 }
