entity: other-regulated-cell-death
claims:
  - claimId: other-regulated-cell-death-c001
    section: definition
    statement: "Besides necrosis, cells have several suicide programs; beyond apoptosis, necroptosis, pyroptosis and autophagy there are further specialized forms of programmed cell death."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38, 54-56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c002
    section: definition
    statement: "Anoikis, granzyme/perforin killing, NETosis and entosis are among the specialized forms of programmed cell death."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c003
    section: definition
    statement: "Programmed cell death pathways interconnect, so distinctions between them are not always clear-cut."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "38" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c004
    section: etiology
    statement: "A cell that loses its own ECM or lands on an unsuitable one undergoes anoikis if it relies on anchorage; epithelial cells are the chief examples."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c005
    section: etiology
    statement: "CTLs and NK cells attack a cell they recognize as foreign."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c006
    section: etiology
    statement: "NETosis occurs mainly in neutrophils after pathogen recognition, and also in eosinophils and mast cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c007
    section: etiology
    statement: "In entosis, non-professional phagocytes engulf neighboring living cells; it occurs most often in tumors."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c008
    section: etiology
    statement: "Detachment from the ECM can set off entosis, in which the still-living detached cell pushes its way into another cell."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c009
    section: pathogenesis
    statement: "As long as integrins are attached to their native ECM, the survival signals they emit restrain apoptosis along both its intrinsic and extrinsic routes (Fig. 1-52)."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c010
    section: pathogenesis
    statement: "The cell dies by apoptosis because integrins that lack appropriate binding stop sending survival signals, which raises activity along both classical apoptotic pathways."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54, 56" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c011
    section: pathogenesis
    statement: "Proliferation in the intestinal crypts displaces epithelial cells off the villus tip; having lost integrin survival signaling, they die by anoikis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c012
    section: pathogenesis
    statement: "Anoikis protects against metastasis by killing cells that have strayed from their matrix before they can seed secondary growths where they do not belong; anchorage to the matrix is what tells a cell it is in the right place."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c013
    section: pathogenesis
    statement: "CTLs and NK cells release two main effectors, perforin and granzymes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c014
    section: pathogenesis
    statement: "Perforin opens a pore in the plasma membrane of the target cell, and the lymphocyte's proteins, granzymes included, get in through it."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c015
    section: pathogenesis
    statement: "Granzyme B is the most studied member of the granzyme serine-protease family."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c016
    section: pathogenesis
    statement: "Granzyme B cleaves Bid, a BH3-only protein, to tBid, which increases mitochondrial cytochrome c release and triggers the intrinsic pathway."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c017
    section: pathogenesis
    statement: "Granzyme B also activates caspases by converting their inactive precursors, procaspase-3 above all."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c018
    section: pathogenesis
    statement: "Granzymes can also disrupt the CAD-ICAD complex, freeing the DNase CAD, which then degrades genomic DNA without caspases."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c019
    section: pathogenesis
    statement: "NETosis requires autophagy and NADPH oxidase activity; ROS drive chromatin decondensation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c020
    section: pathogenesis
    statement: "A NET is chromatin extruded by the cell and loaded with antimicrobial histones and other antimicrobial products; it follows breakdown of the nuclear envelope and of most granule membranes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c021
    section: pathogenesis
    statement: "NETs are lethal to bacteria, fungi and protozoa."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c022
    section: pathogenesis
    statement: "NETs can be made from nuclear DNA or from mitochondrial DNA, so a neutrophil need not die to produce one."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c023
    section: pathogenesis
    statement: "Cells dying by NETosis do not expose phosphatidylserine as apoptotic cells do, so macrophages do not clear them early and inflammation can result."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c024
    section: pathogenesis
    statement: "The engulfing cell in entosis can take up a cell of its own lineage or of a different one."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c025
    section: pathogenesis
    statement: "Lysosomal fusion with the entotic vacuole normally ends in death of the engulfed cell, yet that outcome is not certain."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c026
    section: pathogenesis
    statement: "An engulfed cell can survive, can leave its host undamaged, or can have its nuclear contents absorbed by the host cell."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c027
    section: pathogenesis
    statement: "The control mechanisms of entosis are still mostly unknown."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c028
    section: micro
    statement: "Anoikis is a variety of apoptosis and granzyme killing proceeds via apoptosis with nuclear fragmentation, so both show apoptotic morphology."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54, 56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c029
    section: micro
    statement: "NETs are meshes of fibers lying outside the cell, built largely from DNA and discharged by neutrophils."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 58" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c030
    section: micro
    statement: "In entosis a cell lies within a vacuole of another cell; incorporation of its nuclear material can make the host multinucleate, polyploid or aneuploid."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c031
    section: clinical
    statement: "Tumor cells can escape anoikis, and metastasizing cells do so particularly well."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c032
    section: clinical
    statement: "NETosis can promote tumor progression and dissemination."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c033
    section: clinical
    statement: "Entosis is seen mainly in tumors, where a cell can grow inside the cell it has entered and consume its nutrients."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c034
    section: clinical
    statement: "NETs are a first-line defense: they pin microbes in place and help neutrophils arriving later to kill them, with less collateral damage to host cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-12
  - claimId: other-regulated-cell-death-c035
    section: clinical
    statement: "In an experimental setting, hepatocytes take up and kill autoreactive T cells by entosis, which dampens autoimmune liver injury."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c036
    section: differential
    statement: "Apoptosis shows phosphatidylserine eat-me signals and proceeds without inflammation; anoikis and granzyme killing lead to apoptosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54, 58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c037
    section: differential
    statement: "Necroptosis is a caspase-independent programmed death with necrotic morphology, mediated by the RIP1/RIP3 necrosome and MLKL."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c038
    section: differential
    statement: "Pyroptosis depends on inflammasome-generated caspase-1, which forms plasma membrane pores; the cell, often but not always infected (triggers include mineral crystals), swells and bursts, causing inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c039
    section: differential
    statement: "NETosis requires autophagy; whether autophagy kills cells independently is unclear."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54, 58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c040
    section: high-yield
    statement: "Anoikis is apoptosis of anchorage-dependent cells that lose integrin binding to their native ECM, and it inhibits metastasis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54, 56" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c041
    section: high-yield
    statement: "Perforin forms a membrane channel; granzyme B cleaves Bid to tBid and activates procaspase-3."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c042
    section: high-yield
    statement: "Granzymes can also kill caspase-independently by freeing CAD from ICAD."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c043
    section: high-yield
    statement: "NETosis requires autophagy and NADPH oxidase; NETs contain DNA and histones and kill bacteria, fungi and protozoa."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c044
    section: high-yield
    statement: "NETotic cells lack phosphatidylserine exposure and can stimulate inflammation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c045
    section: high-yield
    statement: "Entosis is engulfment of a living cell by a non-professional phagocyte, mostly in tumors, and can produce multinucleate or aneuploid cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c046
    section: traps
    statement: "Anoikis uses the classical intrinsic and extrinsic apoptotic pathways."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c047
    section: traps
    statement: "The CAD route of granzyme killing degrades DNA independently of caspases."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "56-57" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c048
    section: traps
    statement: "NETs can be built from mitochondrial DNA, so NET formation does not always kill the neutrophil."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c049
    section: traps
    statement: "In entosis the engulfed cell is alive and may survive or escape."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c050
    section: traps
    statement: "Lacking eat-me signals, NETotic cells can stimulate inflammation, unlike apoptotic cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c051
    section: mnemonics
    statement: "Summary mnemonic of the four forms: anoikis (loss of matrix home), granzyme entry through perforin pores, NETosis (DNA nets), entosis (engulfment of a living cell)."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54-58" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: other-regulated-cell-death-c052
    section: pathogenesis
    statement: "Caspase-8 can be activated directly by integrins that lack a bound ligand."
    sourceRef: { source: rubin-8e, chapter: "5", pages: "190" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c053
    section: pathogenesis
    statement: "Apart from perforin and granzymes, a CTL can induce apoptosis of a target cell when its Fas ligand binds Fas on that cell."
    sourceRef: { source: rubin-8e, chapter: "4", pages: "149-150" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c054
    section: ancillary
    statement: "Anoikis and granzyme killing proceed through apoptosis, so the dying cells appear as ordinary apoptotic cells; the context, such as detachment from the matrix or attack by cytotoxic lymphocytes, points to the form."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "54, 56-57" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c055
    section: ancillary
    statement: "Granule proteins such as granzyme B and TIA-1 define a cytotoxic phenotype, which some mature T-cell lymphomas, including anaplastic large cell lymphoma, express."
    sourceRef: { source: rubin-8e, chapter: "26", pages: "1180, 1182" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c056
    section: ancillary
    statement: "A DNA stain alone cannot prove NETs in tissue: immunofluorescence has to place a granule protein such as neutrophil elastase on the same extracellular strands as a nuclear component (DNA or a histone), and dark smudgy threads among neutrophils on H&E only raise the suspicion."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: beyond-reference
    secondSource: { source: brinkmann-2016, locator: "abstract; Results and Discussion (full text, PMC5118445)" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c057
    section: ancillary
    statement: "NETs are better preserved in paraffin-embedded tissue than in cryosections, where NET-like artifacts can arise from neutrophils damaged by ice crystals."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: beyond-reference
    secondSource: { source: brinkmann-2016, locator: "abstract; Introduction (full text, PMC5118445)" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c058
    section: ancillary
    statement: "Cell-in-cell figures are frequent in human cancers under the microscope, and entosis has been proposed as one way they arise."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: beyond-reference
    secondSource: { source: overholtzer-2007, locator: "abstract (PubMed 18045538)" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c059
    section: clinical
    statement: "Persistent survival signaling from unbound integrins lets some cancer cells escape anoikis; TrkB activation is another anoikis-escape route used by tumor cells in the bloodstream."
    sourceRef: { source: rubin-8e, chapter: "5", pages: "190, 198" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c060
    section: clinical
    statement: "In some circumstances NETosis contributes to thrombus formation."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "596" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c061
    section: clinical
    statement: "Host tissue injury in sepsis can come from neutrophil antimicrobial mechanisms, NETs included."
    sourceRef: { source: rubin-8e, chapter: "12", pages: "524" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c062
    section: clinical
    statement: "Large numbers of NETs have been found in human acute appendicitis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "45, 58" }
    status: beyond-reference
    secondSource: { source: brinkmann-2004, locator: "abstract (PubMed 15001782)" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c063
    section: clinical
    statement: "Cytotoxic T-cell killing helps clear virus-infected cells and contributes to the rejection of transplanted tissue."
    sourceRef: { source: rubin-8e, chapter: "4", pages: "148-149, 151" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c064
    section: high-yield
    statement: "Fas ligand–Fas binding is a second killing route of CTLs besides perforin and granzymes."
    sourceRef: { source: rubin-8e, chapter: "4", pages: "149-150" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: other-regulated-cell-death-c065
    section: traps
    statement: "Dark DNA strands on H&E only hint at NETs; they are proven when immunofluorescence shows a granular NET component on the same strands as a nuclear one."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "58" }
    status: beyond-reference
    secondSource: { source: brinkmann-2016, locator: "abstract; Discussion (full text, PMC5118445)" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
