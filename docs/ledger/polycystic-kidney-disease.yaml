entity: polycystic-kidney-disease
claims:
- {claimId: polycystic-kidney-disease-c001, section: definition, statement: "Among inherited kidney diseases that produce many cysts, ADPKD is the one seen most often", sourceRef: {source: rubin-8e, chapter: "22", pages: "921-922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c002, section: definition, statement: "In the US, between 1 in 400 and 1 in 1,000 people have ADPKD", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c003, section: definition, statement: "ARPKD is much less frequent than ADPKD and is a disease of infants", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c004, section: definition, statement: "Further cystic kidney entities are nephronophthisis, medullary cystic disease, medullary sponge kidney, glomerulocystic disease, simple cysts and dialysis-related acquired cysts", sourceRef: {source: rubin-8e, chapter: "22", pages: "923-924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c005, section: etiology, statement: "PKD2 mutation accounts for roughly 15% of ADPKD, and PKD1 mutation for the remaining 85%", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c006, section: etiology, statement: "The gene mutated in ARPKD is PKHD1", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c007, section: etiology, statement: "Nephronophthisis is inherited recessively; the mutated genes are the NPHP family", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c008, section: etiology, statement: "Medullary cystic kidney disease is inherited dominantly; type 1 involves MUC1 and type 2 involves UMOD", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c009, section: etiology, statement: "Inherited glomerulocystic disease results from mutation of HNF-1 beta (TCF2)", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c010, section: pathogenesis, statement: "Primary cilia of tubular cells carry polycystin-1 and polycystin-2, the proteins encoded by PKD1 and PKD2", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c011, section: pathogenesis, statement: "Through the polycystins the cell detects urine flow and regulates its internal calcium", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c012, section: pathogenesis, statement: "Defective polycystins make tubular cells proliferate too much, and since the cilia are the site of the fault the disease is a ciliopathy", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c013, section: pathogenesis, statement: "Each cyst is thought to start from a few tubule cells that multiply abnormally", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c014, section: pathogenesis, statement: "A defective basement membrane under the abnormal lining cells lets the tubule widen", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c015, section: pathogenesis, statement: "Early cyst fluid is glomerular filtrate; later most cysts are cut off from the tubule and the lining cells secrete the fluid", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c016, section: pathogenesis, statement: "Only under 2% of nephrons form cysts, so squeezing of normal tissue by cysts is probably not the full cause of functional loss", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c017, section: pathogenesis, statement: "In ARPKD the PKHD1 product fibrocystin is present in cilia of pancreatic exocrine ducts, liver bile ducts and kidney collecting ducts", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c018, section: pathogenesis, statement: "Mutated PKHD1 therefore also gives malformed bile ducts with liver fibrosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c019, section: gross, statement: "In ADPKD kidney weight can reach 4,500 g and both kidneys are markedly enlarged", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c020, section: gross, statement: "ADPKD cysts contain yellowish straw-colored fluid and the largest are 5 cm", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c021, section: gross, statement: "With the years, the kidney tissue still present between the cysts wastes away and fibroses", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c022, section: gross, statement: "ARPKD never spares one kidney: it is always bilateral", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c024, section: gross, statement: "Where cortex meets medulla, nephronophthisis kidneys often but not always contain cysts of up to 1 cm", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c025, section: gross, statement: "In medullary sponge kidney the papillae contain many small cysts, each smaller than 5 mm", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c026, section: gross, statement: "Three quarters of medullary sponge kidney patients have both kidneys involved", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c027, section: gross, statement: "Simple cysts, one or several, mostly lie in the superficial cortex and so push out the capsule", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c028, section: gross, statement: "Cystic kidneys on both sides are found in more than three quarters of patients dialyzed for 5 years", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c029, section: micro, statement: "Cuboidal to columnar cells line ADPKD cysts", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c031, section: micro, statement: "In ARPKD, collecting ducts of cortex and medulla widen into elongated cysts that radiate toward the capsule at right angles", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c032, section: micro, statement: "Tubular atrophy and interstitial fibrosis are frequent in ARPKD, above all in later-onset cases", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c033, section: micro, statement: "The usual liver lesion in ARPKD is congenital hepatic fibrosis: bile ducts multiply and fibrous tissue enlarges the portal tracts", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c034, section: micro, statement: "In early nephronophthisis the basement membranes of the tubules thicken and split into layers", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c035, section: micro, statement: "Late nephronophthisis looks nonspecific, with inflammatory cells among scarred glomeruli and interstitium", sourceRef: {source: rubin-8e, chapter: "22", pages: "923-924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c036, section: micro, statement: "Medullary sponge kidney cysts are lined by cuboidal or columnar cells and develop from papillary collecting ducts", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c038, section: micro, statement: "Acquired-cyst lining can become hyperplastic or neoplastic during the first 10 years of dialysis", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c039, section: ancillary, statement: "The site of the cysts separates ARPKD (radial collecting-duct cysts), nephronophthisis (corticomedullary cysts) and medullary sponge kidney (papillary cysts); the pages do not say that H&E or the lining makes the distinction", sourceRef: {source: rubin-8e, chapter: "22", pages: "923-924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c040, section: ancillary, statement: "The responsible genes are PKD1 or PKD2 (ADPKD), PKHD1 (ARPKD), NPHP genes (nephronophthisis) and MUC1 or UMOD (medullary cystic disease)", sourceRef: {source: rubin-8e, chapter: "22", pages: "922-923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c041, section: clinical, statement: "The former name adult polycystic kidney disease reflects that most ADPKD patients have no clinical signs before the fourth decade", sourceRef: {source: rubin-8e, chapter: "22", pages: "922-923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c042, section: clinical, statement: "Symptoms in childhood occur in a small minority of ADPKD patients, and at birth only rarely", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c043, section: clinical, statement: "ADPKD may cause an abdominal mass, pain in the side or belly, or a dragging weight in the lumbar region", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c044, section: clinical, statement: "High blood pressure is both an early and a common manifestation of ADPKD", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c045, section: clinical, statement: "In time ADPKD kidney function declines steadily, with blood and a small amount of protein in the urine", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c046, section: clinical, statement: "Liver cysts, whose lining looks like bile duct epithelium, occur in one ADPKD patient in three", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c048, section: clinical, statement: "A cerebral aneurysm is present in one ADPKD patient in five", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c049, section: clinical, statement: "Diverticula of the colon are a frequent association of ADPKD", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c050, section: clinical, statement: "In ARPKD, very large kidneys and oligohydramnios with Potter sequence both impair lung development, leaving pulmonary hypoplasia", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c051, section: clinical, statement: "One ARPKD infant in four does not survive the neonatal period", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c052, section: clinical, statement: "ARPKD survivors have liver fibrosis with portal hypertension, and renal insufficiency whose start and pace differ between patients", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c053, section: clinical, statement: "Nephronophthisis first shows as a tubular defect with excess urine, thirst and bed-wetting, and later ends in kidney failure", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c054, section: clinical, statement: "Juvenile nephronophthisis, the commonest of three forms, causes 5% to 10% of pediatric ESRD", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c055, section: clinical, statement: "Polyuria is the usual first sign of medullary cystic disease, where kidney failure begins after age 40", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c056, section: clinical, statement: "Symptomatic medullary sponge kidney is found at 30 to 60 years through gravel in the urine, hematuria, dysuria or flank pain", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c057, section: clinical, statement: "Only very large simple cysts cause symptoms; most are chance findings", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c058, section: clinical, statement: "One person in two over the age of 50 has a simple renal cyst", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c059, section: diagnosis, statement: "ARPKD kidneys have a smooth outside, whereas cysts deform the outline of ADPKD kidneys", sourceRef: {source: rubin-8e, chapter: "22", pages: "922-923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c060, section: prognosis, statement: "Half of ADPKD patients end up with ESRD", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c061, section: prognosis, statement: "Among all ESRD patients needing dialysis or a transplant, about 5% have ADPKD as the cause", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c062, section: prognosis, statement: "Intracranial hemorrhage accounts for the death of 15% of ADPKD patients", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c063, section: prognosis, statement: "Juvenile nephronophthisis normally reaches ESRD within a decade of the first symptoms", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c064, section: prognosis, statement: "The cysts of medullary sponge kidney can favor pyelonephritis, although the disease itself is no threat to health", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c065, section: prognosis, statement: "Renal cell carcinoma arises in about 5% of acquired cystic disease patients", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c066, section: differential, statement: "ADPKD: adult-onset disease with very large kidneys, cysts from every nephron segment and cysts in other organs", sourceRef: {source: rubin-8e, chapter: "22", pages: "922-923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c067, section: differential, statement: "ARPKD: infant disease with smooth bilateral kidneys, radial collecting-duct cysts and liver fibrosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c068, section: differential, statement: "Nephronophthisis and medullary cystic disease: small cysts at the corticomedullary junction with tubule and interstitial atrophy", sourceRef: {source: rubin-8e, chapter: "22", pages: "923-924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c069, section: differential, statement: "Medullary sponge kidney: tiny cysts in the papillae, with stone formation and flank pain", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c070, section: differential, statement: "Simple cyst: cortical, single or several, with flat epithelium", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c071, section: differential, statement: "Acquired cystic disease: cysts on both sides after years of dialysis, with a risk of carcinoma", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c072, section: differential, statement: "Multicystic renal dysplasia: mostly one-sided, a shapeless cluster of cysts, usually found as a flank mass soon after birth", sourceRef: {source: rubin-8e, chapter: "22", pages: "921"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c073, section: high-yield, statement: "ADPKD: dominant inheritance, PKD1 in most cases, huge cystic kidneys, onset around the fourth decade", sourceRef: {source: rubin-8e, chapter: "22", pages: "922-923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c074, section: high-yield, statement: "ARPKD: recessive inheritance, PKHD1, large smooth kidneys with radial cysts and liver fibrosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c075, section: high-yield, statement: "ADPKD extrarenal lesions: liver cysts in one third, cerebral aneurysms in one fifth, and colonic diverticula", sourceRef: {source: rubin-8e, chapter: "22", pages: "922"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c076, section: high-yield, statement: "Nephronophthisis is recessive with onset from infancy to adolescence; medullary cystic disease is dominant with onset in adolescence and kidney failure in adulthood", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c077, section: high-yield, statement: "Medullary sponge kidney: papillary cysts that can hold stones and favor pyelonephritis", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c078, section: high-yield, statement: "Acquired cysts arise after prolonged dialysis and are linked with renal cell carcinoma", sourceRef: {source: rubin-8e, chapter: "22", pages: "924"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c079, section: traps, statement: "ADPKD generally stays silent until the fourth decade, yet some patients have symptoms as children", sourceRef: {source: rubin-8e, chapter: "22", pages: "922-923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c080, section: traps, statement: "ARPKD usually involves the liver as well, with congenital hepatic fibrosis", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c081, section: traps, statement: "Nephronophthisis and medullary cystic disease resemble each other pathologically but have different genes and inheritance", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: polycystic-kidney-disease-c082, section: mnemonics, statement: "ARPKD kidneys are smooth outside, with radially arranged cysts, and the liver is fibrotic", sourceRef: {source: rubin-8e, chapter: "22", pages: "923"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
