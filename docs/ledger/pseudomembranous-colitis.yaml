entity: pseudomembranous-colitis
claims:
- {claimId: pseudomembranous-colitis-c001, section: definition, statement: "Pseudomembranous colitis is colitis in which exudate forms plaques on the colonic lining", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c002, section: definition, statement: "C. difficile causes most cases", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c003, section: definition, statement: "A course of antibiotics typically precedes the disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c004, section: etiology, statement: "C. difficile infection is chiefly a complication of antibiotic therapy", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c005, section: etiology, statement: "Almost every antibiotic class has been linked to the disease, and certain ones carry more risk than others", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c006, section: etiology, statement: "Time in hospital is a second major risk factor", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c007, section: etiology, statement: "About 1% to 5% of adults carry C. difficile", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c008, section: etiology, statement: "Carrier status develops in about 30% of hospitalized patients", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c009, section: etiology, statement: "Among elderly hospitalized patients, up to nearly 70% may be carriers", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c010, section: etiology, statement: "Inflammatory bowel disease and immunosuppression are further risk factors", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c011, section: etiology, statement: "Transmission is fecal-oral, and the ingested organism may be a spore or a vegetative cell", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c012, section: pathogenesis, statement: "Antibiotic exposure removes the normal gut flora and with it the colon's protection", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c013, section: pathogenesis, statement: "C. difficile withstands antibiotics better than the normal flora, so it takes over and makes toxins A and B", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c014, section: pathogenesis, statement: "Toxin A mobilizes inflammatory mediators", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c015, section: pathogenesis, statement: "Toxin B damages cells directly", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c016, section: pathogenesis, statement: "Tissue damage comes from the toxins, since the bacterium does not invade", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c017, section: pathogenesis, statement: "The lesion is believed to start as necrosis of the surface epithelium", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c018, section: gross, statement: "Whole-colon involvement is frequent, and small-intestine involvement is occasional", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c019, section: gross, statement: "The hallmark is yellow raised plaques, no larger than 2 cm, adherent to the mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c020, section: gross, statement: "There are no ulcers; the mucosa between plaques is only congested and edematous", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c021, section: gross, statement: "Large pseudomembranes form where plaques merge in severe disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c022, section: micro, statement: "Neutrophils and fibrin are components of the pseudomembrane (source does not rank them as dominant)", sourceRef: {source: rubin-8e, chapter: "19", pages: "808, 809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c023, section: micro, statement: "The pseudomembrane also contains debris of necrotic epithelial cells and mucin", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c024, section: micro, statement: "Crypts swell with mucin and neutrophils and lose their normal organization", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c025, section: micro, statement: "In mild disease only scattered injury of the surface epithelium may be seen, without a true pseudomembrane", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c026, section: ancillary, statement: "A stool specimen is examined for C. difficile toxins", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c027, section: ancillary, statement: "Microscopy of colon tissue shows the pseudomembrane and crypts expanded by mucin and neutrophils (the source names no stain)", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c028, section: clinical, statement: "Watery diarrhea of modest severity is almost the rule when C. difficile infection follows antibiotics", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c029, section: clinical, statement: "Colitis is not the usual outcome of the infection", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c030, section: clinical, statement: "In pseudomembranous colitis severe diarrhea comes with fever, abdominal cramps and a raised white cell count", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c031, section: clinical, statement: "Blood may be present in the diarrhea", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c032, section: diagnosis, statement: "Most diagnoses come from finding toxins in stool with molecular tests, ELISA or cytotoxin assay", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c033, section: prognosis, statement: "Fulminant colitis develops in some patients", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c034, section: prognosis, statement: "Death, toxic megacolon and colonic perforation are possible consequences of fulminant colitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c035, section: prognosis, statement: "Fluid and electrolyte support accompanies metronidazole or vancomycin", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c036, section: prognosis, statement: "Prompt withdrawal of the offending antibiotic is part of treatment", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c037, section: prognosis, statement: "Fulminant colitis may require colectomy", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c038, section: prognosis, statement: "One in five patients has a recurrence of the infection", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c039, section: prognosis, statement: "When infection keeps recurring, a fecal transplant puts healthy flora back in the gut", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c040, section: prognosis, statement: "Lowering incidence depends heavily on preventing hospital transmission of C. difficile", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c041, section: differential, statement: "Ischemic colitis can also produce pseudomembranes", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c042, section: differential, statement: "Stool toxin assays identify C. difficile infection", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c043, section: differential, statement: "Other enteric infections, notably verotoxin-producing E. coli, can also produce pseudomembranes", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c044, section: high-yield, statement: "Antibiotics and hospitalization are the main risk factors", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c045, section: high-yield, statement: "Toxin A calls in inflammatory mediators", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c046, section: high-yield, statement: "Toxin B harms cells directly", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c047, section: high-yield, statement: "The gross hallmark is yellowish plaques standing above the mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c048, section: high-yield, statement: "Diagnosis is by toxins in stool", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c049, section: high-yield, statement: "Treatment is withdrawal of the inciting antibiotic and metronidazole or vancomycin", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c050, section: high-yield, statement: "Complications include colonic perforation and toxic megacolon", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c051, section: high-yield, statement: "Recurrence is common and multiple recurrences are treated with fecal transplant", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c052, section: traps, statement: "Toxins A and B mediate the damage, and the organism is not invasive", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c053, section: traps, statement: "The infection usually stops at watery diarrhea without progressing to colitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c054, section: traps, statement: "Enteric infections, notably verotoxin-producing E. coli, can produce pseudomembranes, and so can ischemic colitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c055, section: traps, statement: "Nearly all antibiotics are implicated, with higher risk for some", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c056, section: mnemonics, statement: "Original mnemonic ABCD for antibiotics, bacterial toxins, colon plaques, diarrhea; restates the card (Italian acronym DATA did not match its item order A-T-A-D; rewritten as ABCD)", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: pseudomembranous-colitis-c057, section: mnemonics, statement: "Original mnemonic for toxin A (inflammation) and toxin B (cell damage); restates the card", sourceRef: {source: rubin-8e, chapter: "19", pages: "808"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
