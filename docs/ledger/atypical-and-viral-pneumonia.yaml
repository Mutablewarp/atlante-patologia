entity: atypical-and-viral-pneumonia
claims:
- {claimId: atypical-and-viral-pneumonia-c001, section: definition, statement: "Atypical pneumonia has a slow onset and a long course, and the white cell count is normal or barely raised, in contrast to lobar pneumonia", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c002, section: definition, statement: "Viral and Mycoplasma pneumonias are interstitial, with mononuclear inflammation in the alveolar walls", sourceRef: {source: rubin-8e, chapter: "18", pages: "707, 712-713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c003, section: definition, statement: "Pneumocystis and invasive Aspergillus cause pneumonia mainly in people with weakened immunity", sourceRef: {source: rubin-8e, chapter: "18", pages: "710, 712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c004, section: etiology, statement: "Viruses are the usual cause of interstitial pneumonia, but Mycoplasma, Chlamydia and Rickettsia can produce the same pattern", sourceRef: {source: rubin-8e, chapter: "18", pages: "713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c005, section: etiology, statement: "Influenza, coronaviruses, adenovirus, herpes simplex, varicella-zoster, measles and CMV are among the viruses that infect the lung", sourceRef: {source: rubin-8e, chapter: "18", pages: "712-713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c006, section: etiology, statement: "Slow growth and the absence of a rigid cell wall characterize Mycoplasma pneumoniae", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c007, section: etiology, statement: "Pneumocystis jiroveci pneumonia mostly strikes transplant and chemotherapy patients on immunosuppressive drugs and people with HIV/AIDS", sourceRef: {source: rubin-8e, chapter: "18", pages: "711-712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c008, section: etiology, statement: "Nearly every case of invasive aspergillosis arises in a host whose immunity is weakened by cytotoxic therapy or AIDS", sourceRef: {source: rubin-8e, chapter: "18", pages: "710"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c009, section: pathogenesis, statement: "Type I pneumocytes are the most fragile alveolar cells and degenerate when infected", sourceRef: {source: rubin-8e, chapter: "18", pages: "713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c010, section: pathogenesis, statement: "Type II cells multiply to resurface the alveoli, while edema and hyaline membranes made of protein and debris form where type I cells have degenerated", sourceRef: {source: rubin-8e, chapter: "18", pages: "713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c011, section: pathogenesis, statement: "Complete recovery is the usual outcome of interstitial pneumonia; interstitial fibrosis is an occasional sequel", sourceRef: {source: rubin-8e, chapter: "18", pages: "713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c012, section: pathogenesis, statement: "Lung infarction in invasive aspergillosis follows fungal invasion of vessels, chiefly arteries, which become blocked by thrombus", sourceRef: {source: rubin-8e, chapter: "18", pages: "710"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c013, section: gross, statement: "Cavities occasionally appear within the patchy multifocal consolidation of invasive aspergillosis", sourceRef: {source: rubin-8e, chapter: "18", pages: "710"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c014, section: gross, statement: "An aspergilloma is a mass of Aspergillus growing inside a cavity left by tuberculosis or bronchiectasis", sourceRef: {source: rubin-8e, chapter: "18", pages: "711"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c015, section: micro, statement: "Viral infection elicits mononuclear infiltrates in the interstitium", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c016, section: micro, statement: "Viral and non-viral diffuse alveolar damage cannot be told apart, since both show hyaline membranes and necrosis of type I cells", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c017, section: micro, statement: "A slowly smoldering viral lung injury can instead leave chronic interstitial inflammation and type II pneumocyte hyperplasia", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c018, section: micro, statement: "In the bronchioles Mycoplasma provokes a lymphoplasmacytic infiltrate in the wall and a neutrophilic exudate in the lumen", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c019, section: micro, statement: "The enlarged CMV-infected alveolar cell shows several faint cytoplasmic inclusions and one dark haloed nuclear inclusion", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c020, section: micro, statement: "Bronchiolitis and interstitial pneumonitis are the typical lung findings in influenza", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c021, section: micro, statement: "In Pneumocystis pneumonia the interstitium has plasma cell and lymphocyte infiltrates and the alveoli hold a foamy exudate", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c022, section: micro, statement: "Diffuse alveolar damage is the main lesion of SARS and MERS coronavirus pneumonia", sourceRef: {source: rubin-8e, chapter: "18", pages: "713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c023, section: ancillary, statement: "On a silver stain Pneumocystis cysts look spherical or collapsed into crescents", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c024, section: ancillary, statement: "Pneumocystis is identified in airway samples such as sputum or lavage, or in biopsied lung tissue", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c025, section: ancillary, statement: "On Gomori methenamine silver, Aspergillus hyphae are seen within the lumen and in the wall of branches of the pulmonary artery", sourceRef: {source: rubin-8e, chapter: "18", pages: "711"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c026, section: ancillary, statement: "Adenovirus, herpes simplex, varicella and CMV infection produce nuclear viral inclusions", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c027, section: clinical, statement: "Atypical pneumonia shows scattered patches on chest X-ray, in the air spaces or the interstitium, and the symptoms range from mild to severe", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c028, section: clinical, statement: "Symptoms of Pneumocystis pneumonia may be minimal, or respiratory failure may progress rapidly", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c029, section: clinical, statement: "AIDS patients who develop thin-walled lung cysts are predisposed to pneumothorax", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c030, section: clinical, statement: "Hemoptysis is the most frequent symptom when a fungus ball becomes clinically evident, but most are silent", sourceRef: {source: rubin-8e, chapter: "18", pages: "711"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c031, section: diagnosis, statement: "Because Mycoplasma is hard to culture, diagnosis usually rests on serology, meaning Mycoplasma antibodies or cold agglutinins", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c032, section: prognosis, statement: "Death from Mycoplasma infection is rare, and erythromycin is effective", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c033, section: prognosis, statement: "Fatal H1N1 influenza is uncommon and mostly affects patients with other illnesses, while typical cases are mild and self-limited", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c034, section: prognosis, statement: "Pneumocystis pneumonia is treated with trimethoprim-sulfamethoxazole or pentamidine", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c035, section: prognosis, statement: "Invasive aspergillosis runs a very rapid, fulminant course in the lung", sourceRef: {source: rubin-8e, chapter: "18", pages: "710"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c036, section: differential, statement: "Bacterial pneumonia usually spares the interstitium, with neutrophils collecting in the air spaces", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c037, section: differential, statement: "Pneumocystis pneumonia sometimes also produces diffuse alveolar damage", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c038, section: differential, statement: "Tuberculosis forms a granuloma with central caseous necrosis", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c039, section: high-yield, statement: "Interstitial pneumonia means mononuclear cells in the alveolar walls, usually from viruses and also Mycoplasma", sourceRef: {source: rubin-8e, chapter: "18", pages: "713"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c040, section: high-yield, statement: "In Mycoplasma pneumonia the bronchioles are inflamed and their lumens are filled with neutrophils", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c041, section: high-yield, statement: "Cold agglutinins and Mycoplasma antibodies support the diagnosis", sourceRef: {source: rubin-8e, chapter: "18", pages: "707"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c042, section: high-yield, statement: "Pneumocystis gives a foamy alveolar exudate and crescent cysts on silver stain", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c043, section: high-yield, statement: "CMV gives enlarged cells with a nuclear inclusion and halo", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c044, section: high-yield, statement: "Invasive aspergillosis occurs in immunocompromised people with vessel invasion", sourceRef: {source: rubin-8e, chapter: "18", pages: "710"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c045, section: traps, statement: "Pneumocystis was long thought to be a protozoan but belongs with the fungi", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c046, section: traps, statement: "Influenza does not show the usual virus-induced cell changes under the microscope", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c047, section: traps, statement: "With most influenza strains a secondary bacterial infection fairly often follows", sourceRef: {source: rubin-8e, chapter: "18", pages: "712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atypical-and-viral-pneumonia-c048, section: mnemonics, statement: "Pneumocystis and invasive Aspergillus are the pneumonias to consider in immunosuppression", sourceRef: {source: rubin-8e, chapter: "18", pages: "710-712"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
