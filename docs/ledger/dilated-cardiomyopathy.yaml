entity: dilated-cardiomyopathy
claims:
  - { claimId: dilated-cardiomyopathy-c001, section: definition, statement: "DCM is a primary myocardial disease with dilation and poor contraction of both ventricles, leading to heart failure.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c002, section: definition, statement: "No other cardiomyopathy is more frequent than DCM, and DCM is among the main indications for heart transplantation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c003, section: definition, statement: "Primary DCM mostly stems from inherited myocyte defects; secondary DCM follows a known injury to myocytes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c004, section: etiology, statement: "DCM causes are partly inherited and partly acquired, so it is regarded as a mixed cardiomyopathy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c005, section: etiology, statement: "Single-gene inheritance accounts for at least a third of DCM cases.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c006, section: etiology, statement: "Familial DCM is usually dominant, but mitochondrial, X-linked and recessive inheritance are described too.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c007, section: etiology, statement: "DCM mutations occur in genes for sarcomeric and cytoskeletal proteins, for example lamin A/C and desmin.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c008, section: etiology, statement: "Mainly truncating mutations of titin account for a large share of genetic DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c009, section: etiology, statement: "DES, the desmin gene, can underlie RCM, ACM or DCM depending on the variant.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c010, section: etiology, statement: "Many toxic or metabolic insults to myocytes end in secondary DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c011, section: etiology, statement: "Of the causes of DCM that can be identified, alcohol is the most common in the United States and Europe.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c012, section: etiology, statement: "DCM can follow treatment with anthracycline drugs, doxorubicin for one, and the heart damage rises with the total dose received.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c013, section: etiology, statement: "DCM is more frequent in people with diabetes mellitus or who smoke cigarettes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c014, section: etiology, statement: "Some patients with viral myocarditis go on, over time, to develop DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c015, section: etiology, statement: "PPCM is a DCM variant that starts late in pregnancy or soon after birth.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c016, section: etiology, statement: "Women with preeclampsia or hypertension are strongly predisposed to peripartum cardiomyopathy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c017, section: etiology, statement: "In the minority of PPCM women with a DCM gene defect, DMD or TTN is usually involved.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c018, section: pathogenesis, statement: "In most patients DCM probably results from genes and environment acting together, including changes in gene regulation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c019, section: pathogenesis, statement: "Penetrance is incomplete, so a first-degree relative can carry the family's variant and stay healthy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c020, section: pathogenesis, statement: "Mutations that abolish function in cytoskeletal and anchoring proteins may lead to defective force transmission.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c021, section: pathogenesis, statement: "Within one gene, loss-of-function changes weaken contraction and give DCM, whereas gain-of-function changes usually give HCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "683" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c022, section: pathogenesis, statement: "Immune activity can continue after viral myocarditis if viral nucleic acid lingers in the heart.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678, 681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c023, section: pathogenesis, statement: "T cells that turn against the heart's own proteins can sustain inflammation after the virus is gone, and DCM may follow.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c024, section: pathogenesis, statement: "In cardiac myocytes alcohol harms mitochondria, and reactive oxygen species are generated in larger amounts.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681, 682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c025, section: pathogenesis, statement: "Years of heavy drinking increase apoptosis of human cardiac myocytes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c026, section: pathogenesis, statement: "Anthracyclines disturb topoisomerase II as an unintended effect, breaking DNA strands and hurting mitochondria.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c027, section: pathogenesis, statement: "In PPCM, excess sFlt1 binds blood VEGF; a heart that cannot offset this with its own VEGF may develop DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682, 683" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c028, section: gross, statement: "Both ventricles are conspicuously hypertrophied and the heart is invariably enlarged.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c029, section: gross, statement: "Every chamber is usually dilated, the atria less than the ventricles.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c030, section: gross, statement: "In end-stage DCM a thin-looking left ventricular wall can hide hypertrophy because the chamber is stretched out.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c031, section: gross, statement: "Small scars just under the endocardium may be seen in a pale, limp myocardium.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c032, section: gross, statement: "Adherent mural thrombi are common at the left ventricular apex, where the generally thickened endocardium is most thickened.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c033, section: micro, statement: "Histology does not point to a specific cause and looks alike across etiologies.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c034, section: micro, statement: "Both atrophic and hypertrophic myocardial fibers are present.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c035, section: micro, statement: "Loss of myofibrils (myocytolysis) hollows out myocytes, mostly under the endocardium, and leaves them vacuolated.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c036, section: micro, statement: "Fibrosis is greatest in the subendocardial layer, extending between fibers and around vessels.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c037, section: micro, statement: "Chronic inflammatory cells are not conspicuous, though scattered ones may be present.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c038, section: ancillary, statement: "Light microscopy is nonspecific for the cause; it shows subendocardial fibrosis, vacuolated myocytes and atrophic and hypertrophic fibers.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c039, section: ancillary, statement: "On electron microscopy, mitochondria look more abundant and sarcomeres scarcer.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c040, section: ancillary, statement: "Abnormally folded intermediate filaments may clump inside myocytes when the desmin gene is mutated.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c041, section: ancillary, statement: "Mutations in many genes, including TTN, LMNA, DES, SCN5A and PLN, have been linked to DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678, 679, 680" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c042, section: clinical, statement: "The clinical course is comparable whether DCM is primary or secondary.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c043, section: clinical, statement: "Early on, the left ventricle dilates without symptoms while the ventricular wall thickens as compensation.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c044, section: clinical, statement: "Patients tolerate effort less and less over time, and overt heart failure follows.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c045, section: clinical, statement: "In heart failure, altered Ca2+ handling and K+ currents favor triggered arrhythmias and a longer QT interval.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c046, section: clinical, statement: "Patients with strongly arrhythmogenic DCM often carry variants in desmosome or calcium-handling genes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c047, section: diagnosis, statement: "Clinically DCM means heart failure with impaired contractility and dilation of both ventricles.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c048, section: diagnosis, statement: "Alcoholic cardiomyopathy resembles ordinary DCM, so diagnosis rests on documented heavy drinking and exclusion of other causes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c049, section: diagnosis, statement: "Cardiac biomarker assays and sensitive imaging help catch heart damage from cancer therapy early.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c050, section: diagnosis, statement: "Relatives with incomplete penetrance can look well while disease is starting, so it is easy to overlook.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c051, section: prognosis, statement: "Death or transplantation affects nearly half of patients within 5 years of the first symptoms.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c052, section: prognosis, statement: "About one death in four in DCM is sudden and ascribed to ventricular arrhythmia.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c053, section: prognosis, statement: "Mechanical ventricular support or transplantation is eventually needed by many DCM patients, despite therapeutic progress.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c054, section: prognosis, statement: "In about half of women with PPCM left ventricular dysfunction persists, while in the other half normal function recovers spontaneously.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c055, section: prognosis, statement: "After PPCM, a later pregnancy risks relapse and maternal death, especially when ventricular function stays reduced.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c056, section: differential, statement: "In HCM the thick left ventricular wall narrows the chamber, which may shrink to a slit.", sourceRef: { source: rubin-8e, chapter: "17", pages: "683" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c057, section: differential, statement: "Under the microscope HCM stands out for disarray of the myofibers.", sourceRef: { source: rubin-8e, chapter: "17", pages: "683" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c058, section: differential, statement: "Some arrhythmogenic DCM cases carry variants in desmosomal or Ca2+-regulating genes, which also occur in ACM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c059, section: differential, statement: "In most patients with viral myocarditis the virus is cleared and inflammation ebbs, but in some the process leads to DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678, 681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c060, section: differential, statement: "Takotsubo cardiomyopathy often follows intense stress, briefly weakening the left ventricle so that its apex balloons.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c061, section: high-yield, statement: "DCM is the most common cardiomyopathy and presents as heart failure with dilated ventricles of impaired contractility.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c062, section: high-yield, statement: "Titin truncations account for a large share of genetic DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "678" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c063, section: high-yield, statement: "Alcohol is the leading identifiable cause of DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c064, section: high-yield, statement: "Doxorubicin cardiotoxicity is cumulative and dose dependent.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c065, section: high-yield, statement: "PPCM is a special DCM variant arising late in pregnancy or postpartum.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c066, section: high-yield, statement: "All chambers are usually dilated and the severe dilation can mask the hypertrophy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c067, section: high-yield, statement: "Microscopy is nonspecific, with myocytolysis and subendocardial fibrosis.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c068, section: high-yield, statement: "The course leads to heart failure, and some deaths are sudden from ventricular arrhythmias.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c069, section: high-yield, statement: "Loss-of-function variants in a gene cause DCM while gain-of-function variants in the same gene tend to cause HCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "683" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c070, section: traps, statement: "The heart is heavier than normal and severe dilation masks the hypertrophy, so a thin-looking wall does not exclude hypertrophy.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c071, section: traps, statement: "DCM can arise from viral, alcohol- or drug-related, autoimmune and inherited causes.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677, 681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c072, section: traps, statement: "Cocaine abuse rarely produces genuine DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c073, section: traps, statement: "Pathology is generally nonspecific, though special features such as desmin aggregates can give etiologic insight.", sourceRef: { source: rubin-8e, chapter: "17", pages: "681" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: dilated-cardiomyopathy-c074, section: mnemonics, statement: "Genetic causes, alcohol and toxins, pregnancy and viral myocarditis are routes to DCM.", sourceRef: { source: rubin-8e, chapter: "17", pages: "677, 678, 681, 682" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
