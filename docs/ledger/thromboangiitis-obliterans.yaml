entity: thromboangiitis-obliterans
claims:
  - claimId: thromboangiitis-obliterans-c001
    section: definition
    statement: "Small and medium-sized arteries toward the ends of the arms and legs are blocked by a mix of inflammation and thrombus."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c002
    section: definition
    statement: "Women are now diagnosed with the disease, unlike the old picture of a young or middle-aged heavy-smoking man."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c003
    section: definition
    statement: "The disease is seen more often in Asia and around the Mediterranean, Middle East included."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c004
    section: micro
    statement: "Medium and small arteries first become acutely inflamed, and thrombus formation follows."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c005
    section: micro
    statement: "The neutrophils also reach the veins and nerves next to the affected artery."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c006
    section: micro
    statement: "The lumen ends up obliterated by thrombus, which forms once the endothelium is involved."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c007
    section: micro
    statement: "Wall microabscesses have a neutrophil core rimmed by Langhans giant cells and fibroblasts."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c008
    section: micro
    statement: "The presence of these abscesses tells the lesion apart from a thrombus complicating atherosclerosis."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c009
    section: micro
    statement: "In late lesions, organization of the thrombi is complete, while recanalization is only partial."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c010
    section: diagnosis
    statement: "Intermittent claudication, muscle cramping on exertion relieved by rest, usually begins between 25 and 40 years."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c011
    section: diagnosis
    statement: "A digit may first show a painful ulcer, after which its tip can be destroyed."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c012
    section: diagnosis
    statement: "Gangrene of an extremity, which can lead to amputation, may complicate even early lesions."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c013
    section: diagnosis
    statement: "Hands and feet on both sides may be lost gradually if smoking continues."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c014
    section: differential
    statement: "Thrombosis on an atherosclerotic background is distinguished from Buerger disease by the neutrophilic microabscesses with giant cells in the vessel wall."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c015
    section: high-yield
    statement: "Inflammation occludes medium and small arteries in the distal limbs in Buerger disease."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c016
    section: high-yield
    statement: "The classic patient is a young or middle-aged heavy smoker."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c017
    section: high-yield
    statement: "Histology shows thrombosing inflammation of arteries with neutrophilic microabscesses and Langhans giant cells."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c018
    section: high-yield
    statement: "Resuming smoking can bring an exacerbation, while stopping can bring remission."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c019
    section: traps
    statement: "Women are affected too, even though almost all earlier cases were in men."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c020
    section: traps
    statement: "Smoking clearly matters, since remission can follow quitting, but the mechanism by which tobacco smoke acts remains obscure."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
  - claimId: thromboangiitis-obliterans-c021
    section: traps
    statement: "A neutrophil-centered microabscess with giant cells in the wall is what sets the thrombus of Buerger disease apart from an atherosclerotic one."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "623" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-14
