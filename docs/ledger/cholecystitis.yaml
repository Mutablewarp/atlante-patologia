entity: cholecystitis
claims:
- {claimId: cholecystitis-c001, section: definition, statement: "Blockage of the gallbladder outlet, the usual setting, leads to diffuse inflammation of the whole organ, which is acute cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c002, section: definition, statement: "Among gallbladder diseases, chronic cholecystitis, a persistent inflammation, is the most frequent", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c003, section: definition, statement: "Gallstones are present in 90% of acute cholecystitis cases", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c004, section: definition, statement: "Acute cholecystitis without stones is termed acalculous and accounts for the remaining cases", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c005, section: etiology, statement: "Acalculous cases occur with polyarteritis nodosa, Salmonella typhosa infection of the gallbladder, sepsis or severe trauma", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c006, section: etiology, statement: "Bile outflow obstruction generally comes first and bacterial infection follows it, rather than infection starting the disease", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c007, section: etiology, statement: "Gallstones accompany chronic cholecystitis in almost all cases", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c008, section: etiology, statement: "Repeated attacks of acute cholecystitis can lead to chronic cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c009, section: pathogenesis, statement: "The gallbladder epithelium may release phospholipase when a stone obstructs the cystic duct", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c010, section: pathogenesis, statement: "Phospholipase generates lysolecithin, a toxin acting on cell membranes, from lecithin", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c011, section: pathogenesis, statement: "With the mucus barrier gone, concentrated bile salts damage the exposed epithelial cells through a detergent effect", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c012, section: pathogenesis, statement: "Excess cholesterol in bile can injure the epithelium", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c013, section: pathogenesis, statement: "After repeated acute attacks, lasting irritation and chemical damage to the epithelium probably cause chronic cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c014, section: pathogenesis, statement: "Cholesterolosis arises when bile holds more cholesterol than it can keep dissolved", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c015, section: gross, statement: "In acute cholecystitis a congested external surface is covered by fibrinous exudate", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c016, section: gross, statement: "In acute cholecystitis the mucosa is vivid red or purple and the wall is thickened by edema", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c017, section: gross, statement: "In acute cholecystitis stones are usually in the lumen and one often blocks the cystic duct", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c018, section: gross, statement: "Rarely, a fully blocked cystic duct traps bacteria and the gallbladder fills with turbid pus (empyema)", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15}
- {claimId: cholecystitis-c019, section: gross, statement: "In chronic cholecystitis the wall is thick and firm, and its outer surface has fibrous adhesions left by past acute attacks", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c020, section: gross, statement: "In chronic cholecystitis about half of cases have coliform organisms in the bile, which frequently also contains gravel or sludge", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c021, section: gross, statement: "Long-standing inflammation can calcify the gallbladder wall, giving a porcelain gallbladder", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c022, section: gross, statement: "In cholesterolosis yellow specks dot the lining, the strawberry gallbladder", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c023, section: micro, statement: "In acute cholecystitis the wall shows acute and chronic inflammation and striking edema and hemorrhage", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c024, section: micro, statement: "Pus formation in the wall commonly follows invasion by bacteria", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c025, section: micro, statement: "In severe cases the lining is necrotic over a wide area rather than only focally ulcerated, which is gangrenous cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c026, section: micro, statement: "In chronic cholecystitis, Rokitansky-Aschoff sinuses extend into a wall that is scarred and inflamed throughout", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c027, section: micro, statement: "The chronic mucosa can be intact but tends to be atrophic with focal ulcers", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c028, section: micro, statement: "In cholesterolosis, cholesterol-filled macrophages swell the mucosal folds and their small nuclei lie at the cell edge", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c029, section: ancillary, statement: "Cholecystectomy is the treatment for progressing acute and for chronic cholecystitis, so the gallbladder is examined as a removed specimen", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c030, section: ancillary, statement: "A resected acutely inflamed gallbladder shows mucosal ulceration with acute and chronic inflammation, and wall edema and hemorrhage", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c031, section: ancillary, statement: "A chronically inflamed gallbladder has a fibrotic, inflamed wall penetrated by Rokitansky-Aschoff sinuses", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c032, section: clinical, statement: "Most patients with acute cholecystitis first present with pain in the right upper abdomen", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c033, section: clinical, statement: "Biliary colic has occurred earlier in most patients with acute cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c034, section: clinical, statement: "In about 20% of patients, a stone in the common bile duct or edema of it causes mild jaundice", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c035, section: clinical, statement: "An acute attack usually settles within a week", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c036, section: clinical, statement: "Rigors, leukocytosis, fever and unremitting pain signal progression and the need for cholecystectomy", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c037, section: clinical, statement: "Although the mucosa heals and the wall becomes fibrotic as inflammation resolves, gallbladder function stays impaired", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c038, section: clinical, statement: "Episodic pain in the right hypochondrium is typical of chronic cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c039, section: clinical, statement: "Many chronic cholecystitis patients have nonspecific abdominal symptoms whose relation to the gallbladder is unclear", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c040, section: clinical, statement: "Cholesterolosis is ordinarily asymptomatic", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c041, section: diagnosis, statement: "Ultrasound shows stones in a thick, contracted gallbladder and is the best way to diagnose chronic cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c042, section: diagnosis, statement: "Cholecystectomy is the final treatment of chronic cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c043, section: prognosis, statement: "Bacterial infection of the gallbladder can lead to perforation, a serious complication", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c044, section: prognosis, statement: "Bile escaping into the peritoneum can result in bile peritonitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c045, section: prognosis, statement: "After perforation, inflammatory adhesions more often limit spread by forming a pericholecystic abscess", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c046, section: prognosis, statement: "A cholecystenteric fistula may arise when gallbladder contents erode into a viscus", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c047, section: differential, statement: "Acute calculous cholecystitis often has a stone blocking the cystic duct and a congested outer surface with fibrinous exudate", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c048, section: differential, statement: "Acalculous cholecystitis occurs without stones, in the setting of polyarteritis nodosa, Salmonella typhosa infection, sepsis or trauma", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c049, section: differential, statement: "Chronic cholecystitis has a thick firm wall penetrated by Rokitansky-Aschoff sinuses", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c050, section: differential, statement: "Ultrasound of chronic cholecystitis shows stones in a contracted gallbladder", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c051, section: differential, statement: "Cholesterolosis shows yellow mucosal flecks and foamy macrophages and does not ordinarily cause symptoms", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c052, section: high-yield, statement: "Gallstones account for 90% of acute cholecystitis and the rest is acalculous", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c053, section: high-yield, statement: "Cystic duct obstruction by a stone may lead to phospholipase release and lysolecithin-mediated epithelial injury", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c054, section: high-yield, statement: "Empyema and gangrenous necrosis occur in severe acute cholecystitis, and perforation is a complication of bacterial infection", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c055, section: high-yield, statement: "Chronic cholecystitis has a thick fibrotic wall with Rokitansky-Aschoff sinuses and may lead to porcelain gallbladder", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c056, section: high-yield, statement: "Cholesterolosis is strawberry gallbladder with foamy macrophages and is ordinarily asymptomatic", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c057, section: high-yield, statement: "Chronic cholecystitis is best diagnosed by ultrasound and ends with cholecystectomy", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c058, section: traps, statement: "Some acute cases have no stones (acalculous) and are linked to polyarteritis nodosa, Salmonella typhosa, sepsis and trauma; the page gives no 10% figure", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c059, section: traps, statement: "Biliary obstruction usually comes first and bacterial infection arrives afterwards", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c060, section: traps, statement: "Cholesterolosis is a submucosal buildup of macrophages filled with cholesterol and usually produces no symptoms", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c061, section: traps, statement: "Porcelain gallbladder is calcification of the wall after long-standing inflammation", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c062, section: traps, statement: "Whether nonspecific abdominal symptoms in chronic cholecystitis patients are caused by the gallbladder is uncertain", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: cholecystitis-c063, section: mnemonics, statement: "Empyema, gangrene and perforation are the severe outcomes of acute cholecystitis", sourceRef: {source: rubin-8e, chapter: "20", pages: "897"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
