entity: lung-abscess
claims:
  - { claimId: lung-abscess-c001, section: definition, statement: "In a lung abscess, pus collects locally and destroys the surrounding lung, including airways and vessels.", sourceRef: { source: rubin-8e, chapter: "18", pages: "713" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c002, section: definition, statement: "Aspiration is the most common cause of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "713" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c003, section: etiology, statement: "More than 90% of aspiration-related lung abscesses trace back to anaerobic bacteria of the oropharynx.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c004, section: etiology, statement: "Aspiration abscesses are mixed infections in which fusiform bacteria and Bacteroides species are often present.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c005, section: etiology, statement: "Staphylococcus aureus and Klebsiella pneumoniae, among other organisms, may also be isolated from aspiration abscesses.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c006, section: etiology, statement: "Aspiration, and so lung abscess, is often favored when consciousness is depressed.", sourceRef: { source: rubin-8e, chapter: "18", pages: "713" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c007, section: etiology, statement: "Alcoholism heads the list of conditions that predispose to lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c008, section: etiology, statement: "Neurologic impairment, for example epilepsy or drug overdose, raises the risk of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c009, section: etiology, statement: "Necrotizing pneumonia is a cause of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c010, section: etiology, statement: "Bronchial obstruction is a cause of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c011, section: etiology, statement: "Infected pulmonary emboli are a cause of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c012, section: etiology, statement: "Penetrating trauma is a cause of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c013, section: etiology, statement: "Extension of infection from adjacent tissues is a cause of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c014, section: pathogenesis, statement: "An aspiration abscess first requires that anaerobes have multiplied in the mouth, as with periodontal disease or poor hygiene.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c015, section: pathogenesis, statement: "A second requirement is that the body cannot expel aspirated material because cough or tracheobronchial clearance is impaired.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c016, section: pathogenesis, statement: "At the tracheal bifurcation the right main bronchus is the one more nearly in line with the trachea, which accounts for right-sided predominance.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c017, section: pathogenesis, statement: "Actinomyces israelii, the usual pulmonary actinomycete, is a normal resident of the nose and mouth.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c018, section: pathogenesis, statement: "Aspirated mouth and throat secretions, or spread from an actinomycotic abscess in the liver or below the diaphragm, can bring actinomycetes into the lung.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c019, section: pathogenesis, statement: "Actinomyces looks like a fungus but is a gram-positive bacterium.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c020, section: gross, statement: "Lung abscesses typically measure 2 to 6 cm in diameter.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c021, section: gross, statement: "Several cavities occur in 10% to 20% of lung abscesses, usually after septic pulmonary emboli or a necrotizing pneumonia.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c022, section: gross, statement: "Lung abscesses are more often on the right than on the left.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c023, section: gross, statement: "The edge of an acute lung abscess is not sharply separated from the neighboring lung.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c024, section: gross, statement: "A young lung abscess has an inflamed, hemorrhagic rim.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c025, section: gross, statement: "As an abscess ages, fibrous tissue walls off its margin.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c026, section: gross, statement: "In pulmonary actinomycosis the lung shows a cluster of small abscesses that communicate with one another.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c027, section: gross, statement: "Sulfur granules are yellow specks visible to the eye, formed by club-ended filaments from the rim of a colony.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c028, section: micro, statement: "Acute lung abscesses contain abundant polymorphonuclear leukocytes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c029, section: micro, statement: "The number of macrophages and the amount of necrotic debris in a lung abscess vary with the age of the lesion.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c030, section: micro, statement: "Colonies of branching filaments lie in the pus-filled necrotic center of actinomycotic abscesses.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c031, section: micro, statement: "Granulomatous tissue forms the rim of actinomycotic abscesses.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c032, section: micro, statement: "Chronic Nocardia infection can add granulomatous features to the lung abscesses it causes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c033, section: micro, statement: "Nocardia filaments are fine and beaded, and most branches leave at right angles.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c034, section: ancillary, statement: "On routine H&E a lung abscess shows abundant neutrophils with necrotic debris.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c035, section: ancillary, statement: "Nocardia is seen best on a Gram stain or a Gomori methenamine silver stain.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c036, section: ancillary, statement: "Nocardia is weakly acid fast.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c037, section: ancillary, statement: "Actinomycosis colonies stain gram-positive and consist of branching filamentous bacteria.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c038, section: prognosis, statement: "Actinomycotic abscesses that reach the pleura may cause empyema or a bronchopulmonary fistula.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c039, section: prognosis, statement: "Actinomycotic abscesses may also invade the chest wall.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c040, section: differential, statement: "In pyogenic bacterial pneumonia the inflammation fills the alveoli, in a lobar or bronchopneumonic pattern.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c041, section: differential, statement: "Sulfur granules and granulomatous margins mark the many small interconnecting abscesses of actinomycosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c042, section: differential, statement: "Nocardia abscesses show fine beaded filaments whose branches mostly meet at right angles.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c043, section: differential, statement: "Gram and Gomori methenamine silver stains are the best ones for showing Nocardia.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c044, section: differential, statement: "Infection by Mycobacterium avium-intracellulare can give granulomas that may or may not be cavitated.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c045, section: differential, statement: "In Mycobacterium avium-intracellulare pneumonia, abundant acid-fast organisms are seen on a Ziehl-Neelsen stain.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c046, section: high-yield, statement: "Aspiration is the most common cause of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "713" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c047, section: high-yield, statement: "Alcoholism heads the list of conditions that predispose to lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c048, section: high-yield, statement: "Aspiration-related abscesses are typically polymicrobial infections with oropharyngeal anaerobes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c049, section: high-yield, statement: "Causes other than aspiration include septic emboli and bronchial obstruction.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c050, section: high-yield, statement: "Lung abscesses favor the right side over the left.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c051, section: high-yield, statement: "Abscesses with several cavities typically follow septic emboli or necrotizing pneumonia.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c052, section: high-yield, statement: "Actinomyces israelii causes multiple small interconnecting abscesses with sulfur granules.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c053, section: high-yield, statement: "Actinomycosis can extend to the pleura and chest wall, producing bronchopulmonary fistulas and empyema.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c054, section: high-yield, statement: "Gram or silver stains best show Nocardia, whose beaded filaments branch at right angles.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c055, section: traps, statement: "Aspiration-related lung abscesses are typically polymicrobial, not caused by a single organism.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c056, section: traps, statement: "Actinomycetes look like fungi, yet they are bacteria.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c057, section: traps, statement: "Nocardia is an opportunist that mostly strikes people with failing immune defenses, as in lymphoma.", sourceRef: { source: rubin-8e, chapter: "18", pages: "709" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c058, section: traps, statement: "Abscess after aspiration needs both a large oral anaerobic load and impaired cough or tracheobronchial clearance.", sourceRef: { source: rubin-8e, chapter: "18", pages: "714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: lung-abscess-c059, section: mnemonics, statement: "Right-sided predominance, aspiration, impaired cough or clearance and a neutrophil-rich necrotic cavity are the core features of lung abscess.", sourceRef: { source: rubin-8e, chapter: "18", pages: "713-714" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
