entity: dysplasia
claims:
  - claimId: dysplasia-c001
    section: definition
    statement: "Dysplastic epithelium loses the uniform size and shape of its cells and their orderly maturation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c002
    section: definition
    statement: "Under the microscope, dysplasia is what disturbed growth and maturation of an epithelium looks like."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c003
    section: definition
    statement: "Dysplasia is a precancerous stage and, in the cervix and the prostate for example, falls within the intraepithelial neoplasia spectrum."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c004
    section: definition
    statement: "In developmental pathology, dysplasia means abnormal histogenesis, a meaning distinct from precancerous epithelial dysplasia."
    sourceRef: { source: rubin-8e, chapter: "6", pages: "305" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c005
    section: etiology
    statement: "Dysplasia arises in settings of persistent injury, as metaplasia does."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c006
    section: etiology
    statement: "Dysplasia can arise in any epithelium."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c007
    section: etiology
    statement: "Actinic keratosis is sunlight-induced dysplasia of epidermal keratinocytes."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c008
    section: etiology
    statement: "Chronically inflamed colonic mucosa in ulcerative colitis can become dysplastic."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c009
    section: etiology
    statement: "HPV-infected cervical epithelium can become dysplastic."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c010
    section: etiology
    statement: "Metaplastic epithelia, e.g. a smoker's bronchus or Barrett mucosa, can become dysplastic."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c011
    section: etiology
    statement: "Adenomatous colorectal polyps are dysplastic by definition and usually precede colon carcinoma."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "823" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c012
    section: pathogenesis
    statement: "Normal squamous mucosa is graded by maturity: dividing basal cells with a large nucleus relative to their cytoplasm, flat fully mature surface cells with small nuclei, and intermediate layers at successive steps."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c013
    section: pathogenesis
    statement: "Dysplasia disrupts the ordered maturation sequence of the epithelium."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c014
    section: pathogenesis
    statement: "Persistent injury keeps cells dividing, and dysplasia takes shape in those dividing cells one mutation after another, along the route that also leads to cancer."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c015
    section: pathogenesis
    statement: "Each DNA replication round can introduce errors, so more cell divisions give more chances of mutation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c016
    section: pathogenesis
    statement: "The clone that comes to dominate descends from one cell whose mutation aided its growth or survival, so that its progeny outnumbered those of neighboring cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c017
    section: pathogenesis
    statement: "The expanding clone divides more, gains further mutations and progressively escapes normal growth control."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c018
    section: pathogenesis
    statement: "Control is only partly lost in dysplasia, so removing the cause can let the tissue return to normal."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c019
    section: pathogenesis
    statement: "Low-grade lesions correspond to early infection, with viral DNA kept outside the host chromosomes in many separate cells; a high-grade lesion follows when high-risk HPV inserts its DNA into the host genome and E6/E7 drive one clone to expand."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1031" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c020
    section: gross
    statement: "Colitis-associated dysplasia can be flat or raised; the raised form is termed DALM."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "818" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c021
    section: micro
    statement: "Dysplastic cells vary in size and shape."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c022
    section: micro
    statement: "Dysplastic nuclei are enlarged, irregular and hyperchromatic."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c023
    section: micro
    statement: "Dysplastic cells have a higher than normal nucleus-to-cytoplasm ratio."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c024
    section: micro
    statement: "In dysplasia mitoses occur far from the basal layer."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c025
    section: micro
    statement: "Dysplastic epithelium lacks normal polarity and shows disorderly arrangement without maturation from base to surface."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c026
    section: micro
    statement: "Low-grade adenoma dysplasia has slender dark cigar-shaped nuclei with mild stratification."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "823" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c027
    section: micro
    statement: "High-grade adenoma dysplasia shows complex, sometimes cribriform glands and more pleomorphic nuclei with conspicuous nucleoli."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "823" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c028
    section: micro
    statement: "Colonic dysplasia is split into low and high grade by the severity of cell and gland abnormalities."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "818" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c029
    section: micro
    statement: "Cervical and anal squamous dysplasia was traditionally graded mild, moderate or severe; since 2012 LAST (LSIL/HSIL) terminology covers all anogenital sites."
    sourceRef: { source: rubin-8e, chapter: "19, 24", pages: "833, 1031" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c030
    section: micro
    statement: "LSIL corresponds to CIN-1/mild dysplasia; HSIL covers CIN-2/moderate and CIN-3/severe dysplasia and carcinoma in situ."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c031
    section: micro
    statement: "Severe cervical dysplasia and cervical carcinoma in situ are hard to tell apart histologically."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c032
    section: clinical
    statement: "Atypical cells are present at the cervical surface even in low-grade lesions, so exfoliative cytology can detect them."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c033
    section: clinical
    statement: "Cytologic screening reduced cervical carcinoma by 50-85% in Western countries."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1030" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c034
    section: clinical
    statement: "Cervical SIL is mostly seen in women under 40, invasive cervical cancer mostly between 40 and 60."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1031" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c035
    section: clinical
    statement: "Barrett esophagus patients undergo surveillance endoscopy to detect dysplasia early."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "771" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c036
    section: clinical
    statement: "Dysplasia in IBD is sought actively: once the disease is established, most patients should have repeated surveillance colonoscopies with systematic biopsies."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "818" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-09
  - claimId: dysplasia-c037
    section: diagnosis
    statement: "Dysplasia is a morphologic diagnosis made on histology, and in the cervix also on cytologic smears."
    sourceRef: { source: rubin-8e, chapter: "1, 24", pages: "29, 1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c038
    section: diagnosis
    statement: "The basement membrane separates in situ lesions from invasive carcinoma, which can reach vessels."
    sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c039
    section: diagnosis
    statement: "If heavy inflammation prevents confirming or excluding dysplasia, the biopsy is reported as indefinite for dysplasia."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "818" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c040
    section: prognosis
    statement: "Dysplasia usually regresses when the stressor ends, e.g. smoking cessation or immune clearance of HPV-infected cervical cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c041
    section: prognosis
    statement: "Cervical low-grade lesions usually vanish without progressing; high-grade lesions tend to advance and are treated."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c042
    section: prognosis
    statement: "Severe dysplasia calls for action rather than observation: excision of the lesion or removal of the cause that sustains it."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c043
    section: prognosis
    statement: "High-grade dysplasia on biopsy in ulcerative colitis often leads to colectomy because of the high later cancer risk."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "818" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c044
    section: prognosis
    statement: "Polypectomy cures adenomas whose dysplasia is confined to the mucosa; high-grade lesions left in place may become invasive adenocarcinoma."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "823" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c045
    section: differential
    statement: "Metaplasia replaces one differentiated cell type with another; dysplasia may develop within metaplastic epithelium."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "27, 29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c046
    section: differential
    statement: "Hyperplasia is an increase in cell number, whereas dysplasia is defined by atypia and disordered maturation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "25, 29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c047
    section: differential
    statement: "Carcinoma in situ shows atypia from base to surface without maturation and an intact basement membrane; cervical CIN 3 groups severe dysplasia with carcinoma in situ."
    sourceRef: { source: rubin-8e, chapter: "5, 24", pages: "173, 1031" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c048
    section: differential
    statement: "Invasive carcinoma can metastasize because its cells, once past the basement membrane, lie in the stroma within reach of blood and lymphatic vessels."
    sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c049
    section: differential
    statement: "Intense inflammation can produce changes not reliably distinguishable from dysplasia."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "818" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c050
    section: high-yield
    statement: "Dysplasia is disordered epithelial growth and maturation and is precancerous."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c051
    section: high-yield
    statement: "Cytologic features of dysplasia: pleomorphism, enlarged hyperchromatic nuclei, high N/C ratio."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c052
    section: high-yield
    statement: "Architectural features of dysplasia: loss of polarity and maturation, suprabasal mitoses."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c053
    section: high-yield
    statement: "Dysplasia results from sequential mutations with clonal selection in proliferating cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c054
    section: high-yield
    statement: "Dysplasia is graded low vs high; cervical LSIL = CIN-1 and HSIL = CIN-2/3."
    sourceRef: { source: rubin-8e, chapter: "19, 24", pages: "818, 1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c055
    section: high-yield
    statement: "Dysplasia is not autonomous and can regress when the stimulus stops."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c056
    section: high-yield
    statement: "Carcinoma in situ sits above an intact basement membrane; invasion begins when it is breached."
    sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c057
    section: traps
    statement: "Dysplastic cells are not fully autonomous and the tissue can revert to normal."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c058
    section: traps
    statement: "Cervical LSIL commonly disappears and rarely progresses."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c059
    section: traps
    statement: "Dysplasia arises in glandular mucosa such as colon and in metaplastic epithelium such as Barrett esophagus, not only squamous epithelium."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c060
    section: traps
    statement: "Developmental dysplasia, e.g. renal dysplasia, reflects abnormal histogenesis/differentiation, not precancerous epithelial change."
    sourceRef: { source: rubin-8e, chapter: "6, 22", pages: "305, 921" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c061
    section: traps
    statement: "CIN-3 encompasses both severe dysplasia and carcinoma in situ, which look very similar."
    sourceRef: { source: rubin-8e, chapter: "1, 24", pages: "29, 1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c062
    section: traps
    statement: "Sarcomas and lymphomas lack an in situ stage because their cells of origin do not rest on a basement membrane."
    sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c063
    section: mnemonics
    statement: "Core dysplasia features: lost maturation/layering, atypical nuclei, high mitoses, pleomorphism."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c064
    section: mnemonics
    statement: "Low-grade cervical lesions tend to regress while high-grade lesions tend to progress."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1031" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dysplasia-c065
    section: etiology
    statement: "Tobacco and alcohol, which predispose to oral squamous cell carcinoma, are also causes of oral leukoplakia."
    sourceRef: { source: rubin-8e, chapter: "29", pages: "1305" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c066
    section: ancillary
    statement: "Dysplasia is examined on cervical smears, biopsies and loop excisions, on endoscopic biopsies in Barrett esophagus and chronic colitis, on polypectomy specimens and on biopsies of oral white or red patches."
    sourceRef: { source: rubin-8e, chapter: "19, 24, 29", pages: "771, 818, 823, 1032-1033, 1305" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c067
    section: ancillary
    statement: "Pap cytology only screens, but shed cells usually allow LSIL and HSIL to be separated by how abnormal their nuclei are and how mature their cytoplasm is."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1032" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c068
    section: ancillary
    statement: "An abnormal smear is followed by biopsy, because the full epithelial thickness, and so the definitive grade, is judged on histology."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1032-1033" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c069
    section: ancillary
    statement: "LEEP excises the whole transformation zone and can diagnose and treat in one step; alternatively, colposcopy aims biopsies at abnormal areas, HSIL typically looking mosaic or punctate."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1032-1033" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c070
    section: ancillary
    statement: "Dye spraying of the colonic mucosa at endoscopy (chromoendoscopy) may increase the dysplasia found by IBD surveillance biopsies."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "818" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c071
    section: ancillary
    statement: "On H&E one assesses maturation from base to surface, nuclear size and darkness relative to cytoplasm, the level of mitoses and basement membrane integrity."
    sourceRef: { source: rubin-8e, chapter: "1, 5", pages: "29, 173" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c072
    section: ancillary
    statement: "LSIL keeps an orderly basal layer with koilocytes (large wrinkled nucleus, clear halo) above it; in HSIL immature atypical cells from a disordered base occupy more of the thickness, and atypical mitoses may indicate aneuploidy."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1018, 1031-1033" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c073
    section: ancillary
    statement: "A polyp carcinoma is invasive only when neoplastic glands have passed beneath the muscularis mucosae; polypectomy on its own can be curative for a low-risk invasive carcinoma removed with an adequate basal margin."
    sourceRef: { source: rubin-8e, chapter: "19", pages: "823-824" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dysplasia-c074
    section: ancillary
    statement: "Lesions caused by oncogenic HPV typically overexpress p16, which p16 immunohistochemistry demonstrates in tissue."
