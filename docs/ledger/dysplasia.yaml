    section: prognosis
    statement: "Carcinogens act on a mucosal field: in field cancerization the oral mucosa can give rise to more than one SCC, at once or later, and an HPV-related field effect means vaginal or vulvar carcinoma may follow cervical disease, so follow-up is lifelong."
