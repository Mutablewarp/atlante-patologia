entity: peptic-ulcer-disease
claims:
  - { claimId: peptic-ulcer-disease-c001, section: definition, statement: "Gastric juice erodes a patch of mucosa, mainly in the proximal duodenum but also in the stomach or other small bowel.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c002, section: definition, statement: "Most ulcers lie in the distal stomach or proximal duodenum; rarely they arise in the esophagus or in a Meckel diverticulum with gastric-type tissue.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c003, section: definition, statement: "What gastric and duodenal ulcers have in common is gastric acid and H. pylori.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c004, section: definition, statement: "Age at peak incidence has shifted to 30-60 years.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c005, section: definition, statement: "Over three decades duodenal ulcers have become far less common.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c006, section: definition, statement: "Men are more often affected by duodenal ulcers, while gastric ulcers affect both sexes equally and are usually seen in middle age or later.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c007, section: etiology, statement: "The textbook says no one agent is responsible for peptic ulcers.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c008, section: etiology, statement: "The antrum of nearly every duodenal ulcer patient yields H. pylori.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c009, section: etiology, statement: "Few H. pylori carriers ever develop a duodenal ulcer, so infection by itself cannot account for the disease.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782-783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c010, section: etiology, statement: "Gastric ulcers without H. pylori, about one in four, probably sit on another kind of chronic gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c011, section: etiology, statement: "NSAIDs, aspirin included, are implicated in ulcers; aspirin contributes most to gastric ulcers but also to duodenal ones.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c012, section: etiology, statement: "Corticosteroids modestly increase ulcer risk when given in high doses over a long period.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c013, section: etiology, statement: "Smoking raises ulcer risk most for gastric ulcers, and also for duodenal ulcers.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c015, section: etiology, statement: "Ulcers at unusual sites, several at once and unresponsive to treatment, point to a gastrin-secreting neuroendocrine tumor in Zollinger-Ellison syndrome.", sourceRef: { source: rubin-8e, chapter: "19", pages: "787" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c018, section: pathogenesis, statement: "No ulcer can start or last without excess hydrochloric acid.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c019, section: pathogenesis, statement: "Therapies, medical or surgical, that cut acid output help ulcers heal.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c020, section: pathogenesis, statement: "Only about one third of ulcer patients oversecrete acid, although parietal cell mass in duodenal ulcer may reach twice normal.", sourceRef: { source: rubin-8e, chapter: "19", pages: "784" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c021, section: pathogenesis, statement: "Gastrin goes up and somatostatin goes down under the effect of cytokines made by inflammatory cells reacting to H. pylori.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c022, section: pathogenesis, statement: "H. pylori colonizing acid-induced patches of gastric-type lining in the duodenal bulb may make the lining easier to injure.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c023, section: pathogenesis, statement: "Treating H. pylori shortens duodenal ulcer healing time and reduces recurrences.", sourceRef: { source: rubin-8e, chapter: "19", pages: "783" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c025, section: pathogenesis, statement: "Before a gastric ulcer forms, H. pylori or chemical gastritis has nearly always injured the lining.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c026, section: pathogenesis, statement: "Gastric ulcer patients mostly secrete below-normal amounts of acid.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c027, section: pathogenesis, statement: "Acid diffusing back through the mucosa is one candidate mechanism for gastric ulcers.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c029, section: pathogenesis, statement: "Zollinger-Ellison syndrome floods the stomach with acid, yet the duodenum and jejunum ulcerate, seldom the stomach.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c030, section: gross, statement: "Ulcers favor two places: the lesser curvature, and the pylorus with the stomach and duodenum on either side of it.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c031, section: gross, statement: "A gastric ulcer is typically one lesion measuring less than 2 cm.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c032, section: gross, statement: "Greater-curvature ulcers are commonly tied to NSAIDs, while lesser-curvature ulcers often occur together with chronic gastritis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c033, section: gross, statement: "The margins tend to overhang, so the crater looks punched out.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c034, section: gross, statement: "Mucosal folds converge on a chronic peptic ulcer.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c035, section: gross, statement: "A chronic peptic ulcer has a flat rim and a gray, fibrin-covered clean floor.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c037, section: gross, statement: "Pyloric stenosis can follow when a prepyloric ulcer heals with heavy scarring.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c038, section: gross, statement: "A duodenal ulcer is usually single and close to the pylorus, on the front or back wall of the first duodenal segment (bulb).", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c039, section: gross, statement: "Two ulcers facing each other across both walls are called kissing ulcers and occur fairly often.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c040, section: micro, statement: "Histology does not separate gastric from duodenal ulcers.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c041, section: micro, statement: "The ulcer wall is stratified into four zones from surface to depth.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c042, section: micro, statement: "The surface zone is fibrinopurulent exudate.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c043, section: micro, statement: "Beneath it lies necrotic tissue.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c044, section: micro, statement: "Next comes granulation tissue.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c045, section: micro, statement: "The deepest zone is scar tissue with varying chronic inflammation.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c046, section: micro, statement: "Once healed, scar tissue replaces any muscle layers that the ulcer penetrated.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c047, section: micro, statement: "Marginal vessels frequently contain thrombi.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c048, section: micro, statement: "The mucosa at the edge shows mild hyperplasia.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c049, section: micro, statement: "In healing, a single sheet of epithelium resurfaces the defect.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c050, section: micro, statement: "A duodenal ulcer is usually accompanied by peptic duodenitis, with overgrown Brunner glands and gastric-type mucin cells.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c051, section: ancillary, statement: "Gastric ulcers should be sampled endoscopically at both the rim and the base.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c052, section: ancillary, statement: "The histology slide of an ulcer base is read as stacked layers, from surface exudate at the top to fibrous scar at the bottom.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785-786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c053, section: clinical, statement: "Gastric and duodenal ulcers are generally indistinguishable on history and physical examination.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c054, section: clinical, statement: "Classic duodenal ulcer pain is epigastric and comes 1-3 hours after eating or wakes the patient at night.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c055, section: clinical, statement: "Eating or taking an alkali relieves the typical duodenal ulcer pain.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c057, section: diagnosis, statement: "Grossly, an ulcerated gastric carcinoma and a chronic peptic ulcer can resemble each other.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c058, section: diagnosis, statement: "Sample the margin and the deepest part of the ulcer, since the central area usually gives only dead tissue.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c059, section: diagnosis, statement: "Iron-deficiency anemia or occult fecal blood may be the only clinical sign of a bleeding ulcer.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c060, section: prognosis, statement: "Perforation with peritonitis, obstruction and hemorrhage are the main complications.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c061, section: prognosis, statement: "Up to one fifth of patients bleed, which makes hemorrhage the commonest complication, and the bleeding is often occult.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c063, section: prognosis, statement: "About 5% of patients suffer perforation.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c064, section: prognosis, statement: "A third of perforated ulcers had given no earlier symptoms.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c065, section: prognosis, statement: "The anterior duodenal wall is the usual perforation site, and duodenal ulcers perforate more often than gastric ones.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c066, section: prognosis, statement: "Diffuse peritonitis and pneumoperitoneum are more likely when the perforation is anterior.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c067, section: prognosis, statement: "A perforated ulcer of the posterior stomach wall enters the lesser sac, which may confine inflammation.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c069, section: prognosis, statement: "Perforated gastric ulcers carry a mortality of 10-40%, two to four times that of perforated duodenal ulcers.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c070, section: prognosis, statement: "In adults ulcers are the leading cause of pyloric obstruction, although at most 10% of ulcer patients develop it.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c072, section: prognosis, statement: "Patients with one ulcer type are much more likely than chance to develop the other later.", sourceRef: { source: rubin-8e, chapter: "19", pages: "786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c073, section: differential, statement: "An ulcerated carcinoma, unlike a benign ulcer, has a raised border, lacks a clean fibrin floor and lacks radiating folds.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c074, section: differential, statement: "Zollinger-Ellison ulcers appear at unusual sites, often more than one, and fail treatment.", sourceRef: { source: rubin-8e, chapter: "19", pages: "787" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c075, section: differential, statement: "The tumor can be tiny and may arise in the antrum, the pancreas or the duodenum.", sourceRef: { source: rubin-8e, chapter: "19", pages: "787" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c076, section: differential, statement: "Reactive gastropathy is a hyperplastic mucosal reaction, usually due to NSAIDs, seen as corkscrew-like pits with little inflammation.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c077, section: high-yield, statement: "H. pylori is found in nearly all duodenal ulcer patients, but few carriers have the ulcer.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c078, section: high-yield, statement: "Ulcer base layers: fibrinopurulent exudate, necrosis, granulation tissue, fibrosis.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c079, section: high-yield, statement: "Gastric ulcers are biopsied at rim and base because the center is only necrotic.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c081, section: high-yield, statement: "Complications to remember are bleeding, perforation and pyloric obstruction.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785-786" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c082, section: high-yield, statement: "A gastrinoma causes multiple refractory ulcers at unusual sites in Zollinger-Ellison syndrome.", sourceRef: { source: rubin-8e, chapter: "19", pages: "787" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c083, section: traps, statement: "Few H. pylori carriers get a duodenal ulcer.", sourceRef: { source: rubin-8e, chapter: "19", pages: "782" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c085, section: traps, statement: "Gastric ulcer patients mostly have below-normal acid secretion.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c086, section: traps, statement: "The ulcer middle is mostly dead tissue, so rim and base are sampled.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: peptic-ulcer-disease-c088, section: mnemonics, statement: "The three main ulcer complications are hemorrhage, obstruction and perforation.", sourceRef: { source: rubin-8e, chapter: "19", pages: "785" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
