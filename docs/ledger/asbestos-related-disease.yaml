entity: asbestos-related-disease
claims:
  - { claimId: asbestos-related-disease-c001, section: definition, statement: "Inhaled asbestos causes both reactive scarring conditions and malignant tumors of the lung and pleura.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733-735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c002, section: definition, statement: "The silicate minerals grouped as asbestos all form thin fibers.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c003, section: definition, statement: "Scarring that spreads through the lung interstitium after asbestos fibers are inhaled is asbestosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c004, section: definition, statement: "Only heavy exposure, once common in mining and insulation, leads to asbestosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c005, section: etiology, statement: "Two mineral groups contain the six natural types of asbestos.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c006, section: etiology, statement: "Most of the asbestos sold commercially is chrysotile.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c007, section: etiology, statement: "Commercial use of the amphibole group was largely limited to amosite and crocidolite.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c008, section: etiology, statement: "Crocidolite and the other amphiboles produce disease much more readily than chrysotile, although every commercial form is linked to lung disease.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c009, section: etiology, statement: "Like the amphiboles, erionite causes disease; this fiber-forming zeolite is found in Turkey and nearby areas.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c010, section: etiology, statement: "Asbestos was widely used in construction materials and in vehicle brakes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c011, section: etiology, statement: "Mesothelioma can also affect non-workers, such as a spouse who washed the contaminated work clothes.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c012, section: etiology, statement: "Heavy workplace exposure, mainly to crocidolite and amosite, is the more frequent background of mesothelioma.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c013, section: pathogenesis, statement: "Fibers settle where alveolar ducts branch, deep in the lung, since they are thin even when long.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c014, section: pathogenesis, statement: "Macrophages take up only the smallest particles, while many bigger fibers pass through into the interstitium.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c015, section: pathogenesis, statement: "The earliest injury in the interstitium is an alveolitis that grows with the degree of exposure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c016, section: pathogenesis, statement: "Free fibers, which are fibrogenic themselves, and mediators released by activated macrophages together promote interstitial fibrosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c017, section: pathogenesis, statement: "Fibers possibly carried by lymphatics to the pleural space are presumed to provoke pleural plaques.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c018, section: gross, statement: "The lower lung zones are usually the most severely affected, and the disease is bilateral and diffuse.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c019, section: gross, statement: "Advanced asbestosis ends as a honeycomb lung.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c020, section: gross, statement: "Plaques have a pearly white color and a surface that is either smooth or nodular.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c021, section: gross, statement: "Plaques favor the diaphragm's dome and the low back and side of the parietal pleura.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c022, section: gross, statement: "Plaques can grow large and calcify, and they usually involve both sides, though not symmetrically.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c023, section: gross, statement: "Pleural folds several centimeters deep run into the lung in rounded atelectasis, where the pleura is fibrotic or plaque-bearing.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c024, section: gross, statement: "Rounded atelectasis is clinically benign.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c025, section: micro, statement: "Early scarring lies at the periphery of the acinus, around respiratory bronchioles and alveolar ducts.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c026, section: micro, statement: "Alveolar macrophages often engulf asbestos bodies, which lie in alveolar spaces or in bronchiolar walls.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c027, section: micro, statement: "Under light microscopy an asbestos body looks golden brown and beaded because iron and protein are deposited around a transparent, non-birefringent fiber.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c028, section: micro, statement: "Because one macrophage cannot take up the whole fiber, the cells wrap it in a coat of ferritin and other proteins.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c029, section: micro, statement: "The basket-weave look of a plaque comes from parallel narrow slits in dense, cell-free, hyaline fibrous tissue.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c030, section: ancillary, statement: "Under light microscopy, asbestosis is recognized by diffuse interstitial fibrosis together with asbestos bodies in the lung.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c031, section: ancillary, statement: "Prussian blue stain for iron reacts strongly with the coat of asbestos bodies.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c032, section: ancillary, statement: "Virtually every adult lung contains some asbestos bodies once autopsy tissue is digested and concentrated.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c033, section: clinical, statement: "Mild chronic airflow obstruction may accompany the restrictive defect of asbestosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c034, section: clinical, statement: "Pleural plaques occur 10 to 20 years after asbestos exposure.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c035, section: clinical, statement: "Many people with plaques at autopsy have no known asbestos exposure, and plaques are found in a sizable part of the general population.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c036, section: clinical, statement: "Within 10 years of first asbestos exposure, benign pleural effusion is often the lesion that occurs.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c037, section: clinical, statement: "Benign pleural effusion is seen in about 3% of asbestos-exposed workers.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c038, section: clinical, statement: "A decade or more usually passes after the initial exposure before diffuse pleural fibrosis is detected.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c039, section: clinical, statement: "Plaques do not predict asbestosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c040, section: clinical, statement: "Pleural plaques are not precursors of mesothelioma.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c041, section: diagnosis, statement: "Asbestosis requires diffuse interstitial fibrosis in the lung; asbestos bodies found by chance at autopsy do not suffice for the diagnosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c042, section: diagnosis, statement: "Benign asbestos pleural effusion is a diagnosis of exclusion: other causes must be absent and follow-up must show no malignant tumor, with an exposure history and an effusion documented by radiograph or thoracentesis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c043, section: diagnosis, statement: "Along the back of a lower lobe, rounded atelectasis typically shows on a chest film as a round or oval shadow based on the pleura.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c044, section: diagnosis, statement: "Asbestosis is diffuse scarring within the lung interstitium; diffuse pleural fibrosis is scarring confined to the pleura.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c045, section: prognosis, statement: "In later asbestosis, scarring is no longer limited to the peribronchiolar area.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c046, section: prognosis, statement: "Asbestos exposure is firmly established as a cause of malignant mesothelioma.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c047, section: prognosis, statement: "Smokers who work with asbestos get lung carcinoma up to 40 to 60 times as often as nonsmokers in the general population.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c048, section: prognosis, statement: "Evidence on lung cancer in asbestos workers who do not smoke is thin and cannot settle the question.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c049, section: prognosis, statement: "Best evidence linking asbestos to lung cancer comes from patients who also have asbestosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c050, section: differential, statement: "Macrophages full of carbon cluster beside respiratory bronchioles in the distal lung, forming many small scattered black dots (coal-dust macules).", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c051, section: differential, statement: "When coal dust is mixed with silica, the lung forms nodules of dust-filled macrophages in a scarred background (anthracosilicosis).", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c052, section: differential, statement: "Sarcoidosis-like noncaseating granulomas along pleura and bronchovascular bundles mark chronic berylliosis; a beryllium lymphocyte test helps tell it from sarcoidosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c053, section: differential, statement: "Farmer's lung from moldy hay is one example of the acute or chronic interstitial lung inflammation (hypersensitivity pneumonitis) that follows inhaled antigens.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c054, section: differential, statement: "Mesothelioma is a malignancy of the pleura that is linked to heavy asbestos exposure at work.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c055, section: high-yield, statement: "Asbestos bodies are golden brown and give an intense reaction to the Prussian blue iron stain.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c056, section: high-yield, statement: "Asbestosis requires diffuse interstitial fibrosis in addition to asbestos bodies.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c057, section: high-yield, statement: "Pleural plaques are mostly parietal, pearly white and cell-free, with a basket-weave hyaline texture.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c058, section: high-yield, statement: "Chrysotile is much less likely than the amphiboles, crocidolite above all, to cause disease.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c059, section: high-yield, statement: "Lung carcinoma incidence is vastly increased in asbestos workers who smoke.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c060, section: traps, statement: "A pleural plaque is not a precursor of mesothelioma.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c061, section: traps, statement: "Nearly every adult lung contains some asbestos bodies, so finding them alone does not prove asbestosis.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c062, section: traps, statement: "Crocidolite is far more likely than chrysotile to cause disease.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c063, section: traps, statement: "Reports of more lung cancer in nonsmoking asbestos workers rest on limited data, with no firm conclusion.", sourceRef: { source: rubin-8e, chapter: "18", pages: "735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c064, section: traps, statement: "Diffuse pleural fibrosis is limited to the pleura, whereas asbestosis is diffuse fibrosis of the lung interstitium.", sourceRef: { source: rubin-8e, chapter: "18", pages: "734" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: asbestos-related-disease-c065, section: mnemonics, statement: "Asbestos exposure is linked to mesothelioma, asbestosis, pleural plaques, lung carcinoma and benign pleural effusion.", sourceRef: { source: rubin-8e, chapter: "18", pages: "733-735" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
