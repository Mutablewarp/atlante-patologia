entity: myocarditis
claims:
  - {claimId: myocarditis-c001, section: definition, statement: "Myocarditis means inflammation of heart muscle with myocyte death, and ischemic heart disease is left out of the definition", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c002, section: definition, statement: "Many cases give no symptoms, so true incidence is hard to establish", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c003, section: definition, statement: "Any age can be affected, with the peak in childhood between 1 and 10 years", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c004, section: definition, statement: "Sudden heart failure in a previously healthy child, adolescent or young adult has few cardiac causes, myocarditis among them", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c005, section: definition, statement: "A severe case can culminate in sudden cardiac death, via arrhythmia or wide myocardial necrosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c006, section: etiology, statement: "Most myocarditis is labeled viral on indirect grounds unless a heart biopsy shows viral genomes", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c007, section: etiology, statement: "Western series of the late twentieth century mostly identified enteroviruses, above all coxsackievirus", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c008, section: etiology, statement: "Newer genome-detection methods have implicated H1N1 influenza and parvovirus B19 in viral myocarditis", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c009, section: etiology, statement: "Table 17-7 lists bacterial, rickettsial, fungal, protozoal and metazoan parasitic infections among the causes of myocarditis", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c010, section: etiology, statement: "Toxins released by diphtheria bacilli injure the heart and may cause fatal myocarditis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c011, section: etiology, statement: "The protozoan Trypanosoma cruzi causes Chagas disease, a frequent source of myocarditis in South America", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c012, section: etiology, statement: "Noninfectious causes include rheumatic fever and other immune-related diseases, drug reactions, radiation, sarcoidosis and uremia", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c013, section: etiology, statement: "Some myocarditis is idiopathic", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c014, section: etiology, statement: "Coxsackievirus and adenovirus cause most of the unusually frequent viral myocarditis in AIDS, while HIV-1 infection of myocytes plays a minor role", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c015, section: pathogenesis, statement: "Innate immune responses are activated at the very start, when virus gets into myocytes", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c016, section: pathogenesis, statement: "Children are often affected, possibly because the coxsackie-adenovirus receptor, through which coxsackievirus and adenovirus enter, is especially abundant in them", sourceRef: {source: rubin-8e, chapter: "17", pages: "674-675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c017, section: pathogenesis, statement: "Protease 2A of coxsackievirus degrades dystrophin, leaving myocytes permeable with weaker contraction; the virus requires this enzyme to replicate", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c018, section: pathogenesis, statement: "Cleavage of caspases by viral proteases is one way myocyte apoptosis gets activated", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c019, section: pathogenesis, statement: "Antibodies against viral proteins probably also target heart proteins through molecular mimicry, which worsens damage and contractile failure", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c020, section: pathogenesis, statement: "Minimal inflammation marks the early phase, in which myocytes degenerate and undergo apoptosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c021, section: pathogenesis, statement: "T cells, macrophages and NK cells gather at infected sites over days to weeks while infected myocytes release cytokines such as TNF-alpha, IL-1, IL-2 and IFN-gamma", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c022, section: pathogenesis, statement: "After T cells remove the virus, inflammation subsides, contraction recovers and fibrous scar replaces the necrotic areas", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c023, section: pathogenesis, statement: "Dilated cardiomyopathy is a possible outcome when viral clearance is poor or immune activation persists", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c024, section: pathogenesis, statement: "Parvovirus B19 infects cardiac endothelial cells and raises cytokine and adhesion-molecule levels; the endothelial injury may reduce local blood flow enough to cause ischemia", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c025, section: pathogenesis, statement: "Searches for an infectious source of sarcoidosis have failed, and immune dysregulation is the leading suspect for its unknown cause", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c026, section: pathogenesis, statement: "Giant cell myocarditis may be autoimmune, with dysregulated T lymphocytes", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c027, section: gross, statement: "At autopsy the heart in giant cell myocarditis is limp and dilated, and mural thrombi may be present", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c028, section: gross, statement: "Granulomas of sarcoidosis damage the myocardium most at the base of the interventricular septum", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c029, section: micro, statement: "Histology of viral myocarditis is mostly nonspecific and cannot be told from toxic myocarditis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c030, section: micro, statement: "T cells and macrophages infiltrate the interstitium in patches or diffusely during active acquired immunity", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c031, section: micro, statement: "Individual myocytes are often encircled by inflammatory cells", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c032, section: micro, statement: "Focal myocyte necrosis is seen", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c033, section: micro, statement: "Giant cells with several nuclei can also occur", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c034, section: micro, statement: "Fibroblasts proliferate and deposit collagen between myocytes as the process resolves", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c035, section: micro, statement: "Extensive necrosis can resemble an acute infarct, although neutrophils are uncommon", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c036, section: micro, statement: "Bacterial myocarditis shows multiple neutrophil-predominant foci; septic emboli, frequently from infective endocarditis, reach coronary vessels and form microabscesses", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c037, section: micro, statement: "Rickettsial infection often causes widespread vasculitis of small coronary vessels", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c038, section: micro, statement: "Fungal myocarditis mostly affects immunocompromised patients", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c039, section: micro, statement: "Toxoplasma parasites multiply in myocytes and evoke a focal inflammation containing neutrophils and eosinophils", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c040, section: micro, statement: "In Chagas disease parasites multiply in myocytes and the infiltrate is mostly macrophages, lymphocytes and plasma cells", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c041, section: micro, statement: "Hypersensitivity myocarditis has interstitial and perivascular inflammation like the viral form, with numerous eosinophils among the lymphocytes and plasma cells", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c042, section: micro, statement: "Even intense inflammation in hypersensitivity myocarditis typically comes without myocyte necrosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c043, section: micro, statement: "Severe cardiac sarcoidosis shows noncaseating granulomas in the myocardium and extensive myocyte loss", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c044, section: micro, statement: "In giant cell myocarditis, serpentine zones of necrotic myocardium are bordered by lymphocytes and by giant cells derived from macrophages", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c045, section: micro, statement: "Giant cells are plentiful in giant cell myocarditis, yet there are no granulomas", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c046, section: ancillary, statement: "A viral cause moves beyond circumstantial evidence only when special studies find viral genomes in heart biopsy tissue", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c047, section: ancillary, statement: "Biopsy-proven active viral myocarditis responded poorly in randomized trials of immunosuppression", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c048, section: ancillary, statement: "When biopsy lacks viral genomes but heart-directed autoantibodies keep being made, immunosuppression may work, at least briefly", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c049, section: ancillary, statement: "The type of inflammatory cell (lymphocytes, eosinophils, giant cells, granulomas) distinguishes the forms of myocarditis on histology", sourceRef: {source: rubin-8e, chapter: "17", pages: "675-676"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
  - {claimId: myocarditis-c050, section: clinical, statement: "Many viral cases cause no symptoms; where symptoms occur they usually begin some weeks after infection, when acquired immunity responds", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c051, section: clinical, statement: "Some patients die suddenly in the acute inflammatory phase, yet most recover from acute myocarditis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c052, section: clinical, statement: "In the United States a few percent of autopsies of sudden unexpected deaths in adults under 35 show myocarditis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c053, section: clinical, statement: "Hypersensitivity myocarditis usually causes no symptoms, so autopsy often finds it incidentally", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c054, section: clinical, statement: "Hypersensitivity myocarditis can give chest pain with ECG changes like acute ischemia, or occasionally fatal ventricular arrhythmias", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c055, section: clinical, statement: "One-quarter of sarcoidosis cases show some cardiac granulomas at autopsy", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c056, section: clinical, statement: "Fewer than 5% of sarcoidosis patients have cardiac symptoms", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c057, section: clinical, statement: "Cardiac sarcoidosis often causes bundle branch block or complete heart block because it damages the septal base, where major AV conduction tissue lies; serious ventricular tachyarrhythmias and sudden death also occur", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c058, section: clinical, statement: "Chagas disease is insect-borne and endemic to Latin America", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c059, section: clinical, statement: "Pericarditis accompanies myocarditis from most of the viruses that cause it", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c060, section: clinical, statement: "Giant cell myocarditis mostly occurs in adults in their third, fourth or fifth decade", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c061, section: prognosis, statement: "A minority of patients go on to chronic heart failure resembling dilated cardiomyopathy", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c062, section: prognosis, statement: "Chronic cardiomyopathy with heart failure and ventricular tachyarrhythmias develops in a third to half of Chagas patients", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c063, section: prognosis, statement: "Giant cell myocarditis is rapidly fatal, either through the heart failing or through a sudden fatal arrhythmia", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c064, section: prognosis, statement: "Cardiac transplantation may be needed in some patients with giant cell myocarditis, while long-term immunosuppression helps others", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c065, section: prognosis, statement: "Recurrence in transplanted hearts occurs in 25% of giant cell myocarditis cases", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c066, section: prognosis, statement: "Symptomatic hypersensitivity myocarditis is managed by withdrawing the offending drug and giving corticosteroids or immunosuppressive agents", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c067, section: differential, statement: "Viral myocarditis shows interstitial T-cell and macrophage infiltrates with focal myocyte necrosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c068, section: differential, statement: "Viral genome detection in heart biopsy is what establishes a viral cause", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c069, section: differential, statement: "Hypersensitivity myocarditis has an eosinophil-rich infiltrate without myocyte necrosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c070, section: differential, statement: "Hypersensitivity myocarditis is a reaction to drugs and shows numerous eosinophils on histology", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c071, section: differential, statement: "Giant cells are plentiful in giant cell myocarditis, yet there are no granulomas", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c072, section: differential, statement: "Giant cell myocarditis is distinguished by its histology", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c073, section: differential, statement: "Cardiac sarcoidosis shows noncaseating granulomas", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c074, section: differential, statement: "Cardiac sarcoidosis is recognized by its granulomas on histology", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c075, section: differential, statement: "The definition of myocarditis excludes ischemic heart disease", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c076, section: differential, statement: "Extensive necrosis in myocarditis can resemble an acute infarct histologically", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c077, section: high-yield, statement: "Myocarditis is myocardial inflammation with myocyte necrosis and is not ischemic in origin", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c078, section: high-yield, statement: "Viruses cause most myocarditis, and coxsackievirus and adenovirus enter through the coxsackie-adenovirus receptor", sourceRef: {source: rubin-8e, chapter: "17", pages: "674-675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c079, section: high-yield, statement: "Viral myocarditis shows nonspecific T-cell and macrophage infiltrates with focal myocyte necrosis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c080, section: high-yield, statement: "Hypersensitivity myocarditis has eosinophils without myocyte necrosis and is treated by stopping the drug", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c081, section: high-yield, statement: "Giant cell myocarditis has giant cells without granulomas, is rapidly fatal and recurs in transplanted hearts", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c082, section: high-yield, statement: "Sarcoid myocarditis has noncaseating granulomas, damages the septal base and causes heart block and ventricular tachyarrhythmias", sourceRef: {source: rubin-8e, chapter: "17", pages: "676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c083, section: high-yield, statement: "Chagas myocarditis is caused by Trypanosoma cruzi and is endemic to Latin America", sourceRef: {source: rubin-8e, chapter: "17", pages: "675-676"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c084, section: traps, statement: "Viruses are the commonest cause of myocarditis, but bacteria, parasites, drugs, immune disease and sarcoidosis also cause it", sourceRef: {source: rubin-8e, chapter: "17", pages: "674"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
  - {claimId: myocarditis-c085, section: traps, statement: "Neutrophils are uncommon in viral myocarditis but predominate in bacterial myocarditis", sourceRef: {source: rubin-8e, chapter: "17", pages: "675"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
