entity: invasion-and-metastasis
claims:
  - { claimId: invasion-and-metastasis-c001, section: definition, statement: "Invasion is a malignant tumor growing into surrounding tissue.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c002, section: definition, statement: "Metastasis is malignant cells settling at a distant site with no continuity with the primary tumor.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c003, section: definition, statement: "Surgery can usually remove the primary tumor, so invasion and distant spread cause most cancer deaths.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c004, section: definition, statement: "Invasion and metastasis lie behind over 90% of cancer deaths.", sourceRef: { source: rubin-8e, chapter: "5", pages: "195" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c005, section: definition, statement: "Carcinoma in situ is always curable: the basement membrane still holds the tumor inside the epithelium, so it has not invaded.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c007, section: definition, statement: "Cancers arising from cells without a basement membrane, such as hepatocytes, have no in situ stage.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c008, section: etiology, statement: "Signals released by the tumor's own cells and by neighboring non-tumor cells turn on EMT in tumor cells.", sourceRef: { source: rubin-8e, chapter: "5", pages: "196" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c011, section: etiology, statement: "Stromal cells recruited by the tumor help it invade further, so tumor and stroma reinforce each other.", sourceRef: { source: rubin-8e, chapter: "5", pages: "198" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c012, section: pathogenesis, statement: "Spread occurs in successive steps, each requiring changed behavior of tumor cells and of their neighboring cells.", sourceRef: { source: rubin-8e, chapter: "5", pages: "195" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c014, section: pathogenesis, statement: "The cascade runs from local escape through the basement membrane and connective tissue, via blood or lymph, to exit and micrometastasis in a new organ, then dormancy or growth.", sourceRef: { source: rubin-8e, chapter: "5", pages: "195-196" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c015, section: pathogenesis, statement: "In EMT epithelial cells detach from neighboring cells and become able to migrate through tissue.", sourceRef: { source: rubin-8e, chapter: "5", pages: "196" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c017, section: pathogenesis, statement: "Snail, Slug, Zeb1 and Twist are the key transcription factors that orchestrate EMT.", sourceRef: { source: rubin-8e, chapter: "5", pages: "196" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c018, section: pathogenesis, statement: "Losing E-cadherin, the glycoprotein that binds epithelial cells together, frees them to move; it is an important step of EMT, which is central to invasion and metastasis.", sourceRef: { source: rubin-8e, chapter: "5", pages: "196" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c019, section: pathogenesis, statement: "Metastases too small to detect are frequently present at diagnosis because EMT is often activated early.", sourceRef: { source: rubin-8e, chapter: "5", pages: "196" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c022, section: pathogenesis, statement: "In invasive cancers the MMP-TIMP balance is lost and the excess protease activity opens a path for the cells through the ECM.", sourceRef: { source: rubin-8e, chapter: "5", pages: "197" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c023, section: pathogenesis, statement: "TAMs release uPA, which converts plasminogen to plasmin; plasmin then helps degrade type IV collagen of the basement membrane.", sourceRef: { source: rubin-8e, chapter: "5", pages: "198" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c025, section: pathogenesis, statement: "Lymphatic capillaries have no basement membrane, so tumor cells penetrate them more easily than large lymphatic channels.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c026, section: pathogenesis, statement: "In the bloodstream cancer cells risk elimination by NK cells, shear stress and anoikis (apoptosis after loss of ECM anchors).", sourceRef: { source: rubin-8e, chapter: "5", pages: "198" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c027, section: pathogenesis, statement: "A platelet coat keeps NK cells from spotting and destroying circulating tumor cells.", sourceRef: { source: rubin-8e, chapter: "5", pages: "198" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c028, section: pathogenesis, statement: "Tumor cells exit the blood by adhering to the endothelium and crossing it, helped by increased endothelial permeability.", sourceRef: { source: rubin-8e, chapter: "5", pages: "199" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c029, section: pathogenesis, statement: "Tumor cells in the blood settle preferentially at niches that tumor-derived factors have prepared in advance; their exit is not random.", sourceRef: { source: rubin-8e, chapter: "5", pages: "199" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c030, section: pathogenesis, statement: "Bone marrow has a pre-existing niche next to osteoblasts (endosteal osteoblastic niche); disseminated tumor cells can displace hematopoietic stem cells from it.", sourceRef: { source: rubin-8e, chapter: "5", pages: "199" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c031, section: pathogenesis, statement: "Tumors can induce a new niche by remodeling the ECM, stimulating angiogenesis and recruiting stromal cells, including marrow-derived cells.", sourceRef: { source: rubin-8e, chapter: "5", pages: "199-200" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c032, section: pathogenesis, statement: "Only a tiny share of the tumor cells released into the blood ever founds a clinically important metastasis, so the process is highly wasteful.", sourceRef: { source: rubin-8e, chapter: "5", pages: "200" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c033, section: pathogenesis, statement: "Cancer stem cells are generally believed to be the only cells capable of founding metastases.", sourceRef: { source: rubin-8e, chapter: "5", pages: "200" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c034, section: pathogenesis, statement: "Four fates of a micrometastasis: proliferation, death, permanent dormancy, or dormancy followed by reactivation.", sourceRef: { source: rubin-8e, chapter: "5", pages: "200" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c035, section: pathogenesis, statement: "Dormant micrometastases keep low, balanced proliferation and cell death; dormancy is not suspended animation.", sourceRef: { source: rubin-8e, chapter: "5", pages: "201" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c037, section: pathogenesis, statement: "No distinguishing genetic alterations have been found between primary tumors and their metastases, so many metastatic traits appear epigenetic.", sourceRef: { source: rubin-8e, chapter: "5", pages: "200" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c038, section: gross, statement: "The colon proximal to an obstructing colon cancer is dilated.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c041, section: gross, statement: "Ovarian cancer seeding the peritoneal cavity leaves small metastatic nodules on the mesentery.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c042, section: gross, statement: "Tumor seeded in a body cavity grows as masses and may provoke effusions, such as malignant ascites, sometimes very large.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174-175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c043, section: gross, statement: "A lymph node with metastases can become many times larger than normal, even larger than the primary tumor.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c044, section: micro, statement: "In cervical carcinoma in situ the basement membrane keeps the tumor in the mucosa although squamous tumor cells occupy the full epithelial thickness.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c046, section: micro, statement: "Tumor cells reaching a regional node first settle in the marginal (subcapsular) sinuses and then spread throughout it.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c047, section: ancillary, statement: "CTCs are isolated from blood, less often marrow, using epithelial markers such as EpCAM and cytokeratins.", sourceRef: { source: rubin-8e, chapter: "5", pages: "198" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c048, section: ancillary, statement: "CTCs are used to estimate prognosis and to monitor tumors during treatment.", sourceRef: { source: rubin-8e, chapter: "5", pages: "198" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c050, section: clinical, statement: "In breast cancer the first metastases are almost always lymphatic, to regional nodes.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c051, section: clinical, statement: "Breast cancers of the lateral part generally go to axillary nodes, those of the medial part to internal mammary nodes in the thorax.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c052, section: clinical, statement: "The first clue to an abdominal cancer can be an enlarged lymph node above the clavicle (supraclavicular).", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c053, section: clinical, statement: "Because the testis arises in the abdomen, testicular cancers usually reach the periaortic nodes; the inguinal nodes drain the scrotum.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c054, section: clinical, statement: "Tumors of organs drained by systemic veins and the vena cava usually metastasize first to the lungs; those drained by the hepatic portal system, to the liver.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c055, section: clinical, statement: "Paget (1889): metastases form where the tumor cell (seed) and the organ's local environment (soil) suit each other.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c056, section: clinical, statement: "Bone draws metastases from breast, prostate and thyroid cancers (organ tropism); spleen and skeletal muscle are uncommon sites despite abundant blood flow.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c057, section: diagnosis, statement: "Staging reports detectable spread, using distant sites, node involvement, local growth and size.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c058, section: diagnosis, statement: "TNM: M = distant metastases, N = extent of regional node metastases, T = size and local extent of the primary.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c062, section: prognosis, statement: "Staging reflects actual behavior in the patient and so predicts the course better than grading; low-grade tumors may be very aggressive.", sourceRef: { source: rubin-8e, chapter: "5", pages: "175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c063, section: prognosis, statement: "Spread to regional lymph nodes strongly influences prognosis in breast cancer.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c064, section: prognosis, statement: "After resection, adjuvant therapy targets undetected micrometastases but is most effective against fast-dividing cells.", sourceRef: { source: rubin-8e, chapter: "5", pages: "202" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c066, section: differential, statement: "An in situ carcinoma remains inside the basement membrane and has not invaded.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c067, section: differential, statement: "Tumor cells spread through lymphatics, blood vessels and body cavities; lymphatic spread reaches the regional draining nodes first, as in breast cancer.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c068, section: differential, statement: "Capillaries and venules, not thick-walled vessels, are invaded, and venous drainage often sets the first target organ.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c069, section: differential, statement: "Cells shed from a tumor of a neighboring organ into the peritoneal or pleural space grow as masses and cause fluid.", sourceRef: { source: rubin-8e, chapter: "5", pages: "174-175" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
  - { claimId: invasion-and-metastasis-c070, section: mnemonics, statement: "Order of the cascade: detachment and matrix digestion, vessel entry, survival, exit, micrometastasis, then dormancy or growth.", sourceRef: { source: rubin-8e, chapter: "5", pages: "195-196" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-13 }
