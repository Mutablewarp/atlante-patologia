entity: lupus-nephritis
claims:
- { claimId: lupus-nephritis-c001, section: definition, statement: "Lupus nephritis is kidney inflammation from immune complex deposition in the glomeruli of patients with SLE.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c002, section: definition, statement: "Among the complications of SLE, nephritis is one of the most frequent.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c003, section: definition, statement: "Kidney involvement occurs in 70% of people with SLE.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c004, section: definition, statement: "Kidney disease is often what makes SLE most dangerous to health and life.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c005, section: etiology, statement: "Women of reproductive age are the group most often affected by SLE.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c006, section: etiology, statement: "Compared with white patients, Hispanic, Asian and Black patients generally have more severe SLE.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c007, section: etiology, statement: "In SLE, hyperactive B cells make autoantibodies against many antigens, nuclear ones such as DNA among them.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c008, section: etiology, statement: "When apoptosis is faulty and clearance slow, leftover chromatin can supply nuclear antigens.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c009, section: pathogenesis, statement: "Glomerular complexes can be delivered by the blood, assembled in situ, or arise by both routes.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c010, section: pathogenesis, statement: "High-avidity antibodies form complexes in the circulation, which settle in the mesangium and under the endothelium.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c011, section: pathogenesis, statement: "In the subepithelial zone, complexes form on the spot from antibodies of low affinity.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c012, section: pathogenesis, statement: "Charge attracts double-stranded DNA and nucleosomes to the basement membrane and mesangial matrix, where they can anchor complexes formed in place.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c013, section: pathogenesis, statement: "Inflammation begins when immune complexes in the glomerulus activate complement.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c014, section: pathogenesis, statement: "Compared with subendothelial immune complexes, mesangial ones provoke less inflammation.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c015, section: pathogenesis, statement: "Because subendothelial complexes are reachable by the inflammatory mediator systems of the blood, they are more likely to start inflammation.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c016, section: pathogenesis, statement: "Subepithelial complexes produce proteinuria, yet the glomerulus does not become overtly inflamed.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c017, section: pathogenesis, statement: "Outside the glomeruli, complexes lodge in the interstitium and around the tubules (including tubular basement membranes and interstitial vessel walls), which may explain the tubulointerstitial inflammation.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c018, section: micro, statement: "In class I, light microscopy shows no change because the complexes are confined to the mesangium.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c019, section: micro, statement: "In class II, the mesangium becomes hypercellular and its matrix expands to a varying degree, from complexes still confined to the mesangium.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c020, section: micro, statement: "In class III, subendothelial and mesangial complexes trigger inflammation and cell proliferation in fewer than 50% of glomeruli.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c021, section: micro, statement: "In class IV, more than half of the glomeruli carry the class III lesion.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c022, section: micro, statement: "Within class IV, IV-G denotes predominantly global glomerular involvement and IV-S predominantly segmental involvement.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c023, section: micro, statement: "Segmental necrosis is more prominent in class IV-S, which tends to have fewer glomerular complexes.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c024, section: micro, statement: "In class V most complexes sit on the subepithelial side.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c025, section: micro, statement: "Class V injury can occur together with class III or IV injury in the same patient.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c026, section: micro, statement: "Class VI is advanced chronic disease.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c027, section: ancillary, statement: "Renal biopsy specimens from lupus patients are examined to study the disease.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c028, section: ancillary, statement: "By immunofluorescence subendothelial deposits are granular or band-like, while subepithelial complexes are granular.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c029, section: ancillary, statement: "Nearly all cases carry C1q, C3, IgA and IgM alongside IgG, which is usually the strongest.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c030, section: ancillary, statement: "Over half of cases also stain granularly in tubular basement membranes and interstitial vessels.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c031, section: ancillary, statement: "On electron microscopy dense deposits occur under the epithelium, under the endothelium and in the mesangium.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c032, section: ancillary, statement: "Deposits in classes I and II lie mostly in the mesangium.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c033, section: ancillary, statement: "Subepithelial deposits are usually scattered in classes III and IV-G, which also have mesangial and subendothelial deposits.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c034, section: ancillary, statement: "Class V is marked by abundant subepithelial deposits.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c035, section: ancillary, statement: "Electron microscopy can detect mesangial immune complexes even in pure class V.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c036, section: ancillary, statement: "Tubuloreticular inclusions in endothelial cytoplasm, found by electron microscopy in 80% of cases, reflect high interferon levels.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c037, section: ancillary, statement: "Among renal diseases, tubuloreticular inclusions chiefly feature in lupus nephritis and HIV-associated nephropathy.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c038, section: clinical, statement: "Classes I and II present with mild hematuria and proteinuria.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c039, section: clinical, statement: "Class III presents with moderate nephritis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c040, section: clinical, statement: "Class IV presents with severe nephritis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c041, section: clinical, statement: "Class V presents with nephrotic syndrome.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c042, section: clinical, statement: "Class VI presents with chronic renal failure.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c043, section: clinical, statement: "The type of renal lesion determines the clinical picture and the prognosis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c044, section: clinical, statement: "Clinical manifestations change in parallel when lupus nephritis shifts to another class, which may happen over time and sometimes because of treatment.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943-944" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c045, section: diagnosis, statement: "Renal biopsy is used to diagnose lupus glomerulonephritis and to assess its category, activity and chronicity.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c046, section: diagnosis, statement: "Complement activation by glomerular immune complexes often causes hypocomplementemia.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c047, section: prognosis, statement: "Classes III and IV have the worst outcomes.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c048, section: prognosis, statement: "Therapy is most aggressive in classes III and IV, typically immunosuppressive drugs plus high-dose corticosteroids.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943-944" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c049, section: prognosis, statement: "ESRD develops within 5 years in fewer than 20% of class IV patients.", sourceRef: { source: rubin-8e, chapter: "22", pages: "944" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c050, section: differential, statement: "IgA nephropathy is diagnosed by mesangial IgA staining at least as intense as IgG or IgM.", sourceRef: { source: rubin-8e, chapter: "22", pages: "944" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c051, section: differential, statement: "C1q and C4 are absent from IgA deposits, which contain C3 and properdin.", sourceRef: { source: rubin-8e, chapter: "22", pages: "944" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c052, section: differential, statement: "C3 glomerulopathy typically lowers C3 while C4 stays normal.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c053, section: high-yield, statement: "Class III is focal (under 50% of glomeruli) and class IV is diffuse (over 50%).", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c054, section: high-yield, statement: "Class V is membranous with subepithelial deposits and presents with nephrotic syndrome.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c055, section: high-yield, statement: "Classes III and IV have the worst prognosis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c056, section: high-yield, statement: "Immunofluorescence typically shows IgG with IgA, IgM, C3 and C1q all present.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c057, section: high-yield, statement: "Endothelial tubuloreticular inclusions on electron microscopy reflect high interferon levels.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c058, section: high-yield, statement: "Subendothelial complexes drive inflammation and subepithelial complexes drive proteinuria.", sourceRef: { source: rubin-8e, chapter: "22", pages: "942" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c059, section: high-yield, statement: "The renal biopsy is used to assess activity and chronicity.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c060, section: traps, statement: "Class I shows no light-microscopy change but has mesangial immune complexes.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c061, section: traps, statement: "Class IV involves more than 50% of glomeruli, more than class III.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c062, section: traps, statement: "Lupus nephritis class can change over time, sometimes because of treatment.", sourceRef: { source: rubin-8e, chapter: "22", pages: "944" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c063, section: traps, statement: "Lupus deposits nearly always contain IgA and IgM as well as IgG, plus C3 and C1q.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c064, section: traps, statement: "Even pure class V has mesangial immune complexes.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
- { claimId: lupus-nephritis-c065, section: mnemonics, statement: "Classes I-II are mesangial, III-IV are proliferative and inflammatory, V is membranous, VI is advanced sclerosing.", sourceRef: { source: rubin-8e, chapter: "22", pages: "943" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
