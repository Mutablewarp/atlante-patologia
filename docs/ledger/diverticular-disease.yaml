entity: diverticular-disease
claims:
- {claimId: diverticular-disease-c001, section: definition, statement: "Diverticulitis is the inflammatory complication of diverticulosis, and the two together are called diverticular disease", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c002, section: definition, statement: "Diverticulosis is an acquired change in which the inner colonic layers breach the muscular coat", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c003, section: definition, statement: "Diverticulosis is frequent in Western countries but uncommon in the developing world, for example in Asia and Africa", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c004, section: etiology, statement: "Because the disease is distributed so unevenly worldwide, diet and lifestyle are thought to be major factors in diverticulosis", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c005, section: etiology, statement: "Meat and refined carbohydrates in the diet raise the risk of diverticular disease, while vegetarian or high-fiber diets lower it", sourceRef: {source: rubin-8e, chapter: "19", pages: "809"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c006, section: etiology, statement: "Diverticulosis of the small bowel arising unusually early is seen mainly in people with heritable connective tissue disorders such as Marfan and Ehlers-Danlos syndromes", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c007, section: pathogenesis, statement: "According to the fiber theory, a low-residue Western diet keeps the colon contracting, so intraluminal pressure rises", sourceRef: {source: rubin-8e, chapter: "19", pages: "809-810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c008, section: pathogenesis, statement: "Colonic mucosa and submucosa may herniate when the raised pressure is prolonged", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c009, section: pathogenesis, statement: "Besides raised pressure, wall defects are needed: where nutrient vessels penetrate, connective tissue clefts interrupt the circular muscle", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c010, section: pathogenesis, statement: "With age the connective tissue becomes less resilient, so older people withstand pressure less well", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c011, section: pathogenesis, statement: "Acute diverticulitis is thought to begin when retained stool irritates and obstructs a diverticulum", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c012, section: pathogenesis, statement: "In time an inflamed diverticulum can rupture", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c013, section: pathogenesis, statement: "After the acute episode, a chronic irritable bowel-like syndrome may develop, with abnormal motility and dysbiosis among the contributors", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c014, section: gross, statement: "Because only mucosa and submucosa cross the muscle layers, colonic diverticula are pseudodiverticula", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c015, section: gross, statement: "A pouch that contains the full thickness of the intestinal wall is a true diverticulum", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c016, section: gross, statement: "Almost all cases (95%) involve the sigmoid colon", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c017, section: gross, statement: "The cecum, like any other colonic segment, can be affected", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c018, section: gross, statement: "A colon may have only a few diverticula or hundreds", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c019, section: gross, statement: "Each diverticulum is a flask-shaped pouch with its mouth at the lumen and its body pushed out through the muscle layers", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c020, section: gross, statement: "Diverticula measure up to 1 cm", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c021, section: gross, statement: "Each diverticulum opens into the lumen through a neck whose length and caliber vary", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c022, section: gross, statement: "A colon with diverticula often has a thickened muscle coat", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c023, section: micro, statement: "The diverticular wall contains epithelium and submucosa because it continues the surface mucosa", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c024, section: micro, statement: "On microscopy, a break in the muscle lets mucosa with its muscularis mucosae, and submucosa, bulge out of the wall", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c025, section: micro, statement: "The inflammation of diverticulitis is located in the wall of the diverticulum", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c026, section: ancillary, statement: "On a routine histologic section a gap in the muscle layer shows mucosa and submucosa pushed through it", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c027, section: clinical, statement: "The large majority (at least 80%) of people with diverticulosis feel nothing", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c028, section: clinical, statement: "When diverticulosis causes symptoms, they are episodic colicky abdominal pain", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c029, section: clinical, statement: "Patients may have constipation, diarrhea, or sometimes both alternating", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c030, section: clinical, statement: "Flatulence is common", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c031, section: clinical, statement: "In older adults diverticula can cause heavy lower gastrointestinal bleeding that starts abruptly and without pain", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c032, section: clinical, statement: "Up to 5% of people with diverticulosis bleed", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c033, section: clinical, statement: "Chronic blood loss may cause anemia", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c034, section: clinical, statement: "Diverticulitis eventually complicates diverticulosis in 10% to 20% of patients", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c035, section: clinical, statement: "Persistent lower abdominal pain and fever are the most common symptoms of acute diverticulitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c036, section: clinical, statement: "The symptoms of acute diverticulitis usually occur after perforation", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c037, section: clinical, statement: "A change of bowel habit from diarrhea to constipation is frequent in acute diverticulitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c038, section: clinical, statement: "Most patients with acute diverticulitis are tender in the left lower quadrant, where a mass can often be felt", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c039, section: diagnosis, statement: "Leukocytosis is the rule in acute diverticulitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c040, section: prognosis, statement: "Perforation of an inflamed diverticular wall lets fecal bacteria escape into the tissue around the diverticulum", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c041, section: prognosis, statement: "The resulting abscess is usually confined by the pericolonic fat and the appendices epiploicae", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c042, section: prognosis, statement: "Generalized peritonitis is an infrequent consequence of perforation", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c043, section: prognosis, statement: "Fibrosis after repeated attacks can narrow the bowel lumen and cause obstruction", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c044, section: prognosis, statement: "A fistula can link the colon to a nearby organ such as the bladder or vagina", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c045, section: prognosis, statement: "Pylephlebitis and liver abscess are further possible complications", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c046, section: prognosis, statement: "Most acute episodes of diverticulitis settle with antibiotics and supportive care", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c047, section: prognosis, statement: "About 20% of patients with acute diverticulitis eventually need surgery", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c048, section: prognosis, statement: "Options to prevent new attacks include a high-fiber diet, mesalamine and periodic antibiotic courses", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c049, section: differential, statement: "In Crohn disease the bowel wall is usually inflamed through all its layers (transmural)", sourceRef: {source: rubin-8e, chapter: "19", pages: "811"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c050, section: differential, statement: "In Crohn disease inflamed segments are discontinuous, with apparently normal intestine between them", sourceRef: {source: rubin-8e, chapter: "19", pages: "811"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c051, section: high-yield, statement: "Colonic diverticula are false diverticula made of mucosa and submucosa alone", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c052, section: high-yield, statement: "The sigmoid colon is the site in 95% of cases", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c053, section: high-yield, statement: "Connective tissue weakened by age at vessel penetration sites gives way under the pressure raised by a low-fiber diet", sourceRef: {source: rubin-8e, chapter: "19", pages: "809-810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c054, section: high-yield, statement: "Most patients with diverticulosis are asymptomatic", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c055, section: high-yield, statement: "Diverticular bleeding is sudden and painless", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c056, section: high-yield, statement: "Diverticulitis can cause abscess, perforation, fistula and obstruction", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c057, section: high-yield, statement: "Acute diverticulitis shows lower abdominal pain, fever and leukocytosis, with left lower quadrant tenderness", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c058, section: traps, statement: "Colonic diverticula are pseudodiverticula, not true diverticula", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c059, section: traps, statement: "Diverticular bleeding is listed among the features of diverticulosis, and it is sudden and painless", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c060, section: traps, statement: "Diverticulitis brings persistent lower abdominal pain and fever", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c061, section: traps, statement: "Only 10% to 20% of patients with diverticulosis develop diverticulitis", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c062, section: mnemonics, statement: "Original mnemonic: mucosa and submucosa slip out through the muscle, making a false diverticulum (pseudodiverticulum)", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
- {claimId: diverticular-disease-c063, section: mnemonics, statement: "Original mnemonic for the complications of diverticulitis: fistula, abscess, perforation, obstruction", sourceRef: {source: rubin-8e, chapter: "19", pages: "810"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15}
