entity: infectious-and-chemical-esophagitis
claims:
  - { claimId: infectious-and-chemical-esophagitis-c001, section: definition, statement: "Infectious and chemical esophagitis are injuries of the esophageal lining from microbes, swallowed corrosives or pills, systemic disease, or medical treatment", sourceRef: { source: rubin-8e, chapter: "19", pages: "772-774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c002, section: definition, statement: "Among esophageal infections, Candida accounts for the largest share", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c003, section: definition, statement: "Candida infection in a patient with no known predisposing factor is unusual", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c004, section: etiology, statement: "Immunosuppression after organ transplantation, chemotherapy, or HIV/AIDS predisposes to Candida esophagitis", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c005, section: etiology, statement: "Inhaled or swallowed corticosteroids, antibiotic or acid-suppressive therapy, and diabetes also predispose to Candida esophagitis", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c006, section: etiology, statement: "Recipients of a bone marrow or solid organ transplant are the group in which herpes simplex type 1 esophagitis is most often seen", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c007, section: etiology, statement: "Herpetic esophagitis may occasionally occur in otherwise healthy people", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c008, section: etiology, statement: "In AIDS or transplant patients with very weak immunity, CMV in the esophagus usually signals infection elsewhere in the body too", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c009, section: etiology, statement: "In adults corrosive esophageal injury usually follows a suicide attempt, in children accidental poisoning", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c010, section: etiology, statement: "Cleaning solutions containing lye or sulfuric or hydrochloric acid can injure the esophagus", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c011, section: etiology, statement: "Pill esophagitis results from a medication contacting the mucosa", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c012, section: pathogenesis, statement: "Alkali liquefies all layers of the wall, a liquefactive necrosis in which membrane lipids are saponified", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c014, section: pathogenesis, statement: "Strong acid instantly coagulates tissue into an eschar that protects the deeper layers", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c016, section: pathogenesis, statement: "Drug-related esophageal injury usually results from direct chemical contact with the squamous lining, and capsules above all", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c018, section: pathogenesis, statement: "Epithelium is the usual HSV target; endothelial and stromal cells are the preferred CMV targets", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c020, section: pathogenesis, statement: "Dermolytic epidermolysis bullosa affects all squamous-lined organs, the esophagus among them", sourceRef: { source: rubin-8e, chapter: "19", pages: "773-774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c021, section: pathogenesis, statement: "The subepithelial blisters of bullous pemphigoid, in skin and esophagus, do not scar", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c022, section: pathogenesis, statement: "Esophagitis is also linked to erythema multiforme, Behcet syndrome, dermatitis herpetiformis and pemphigus vulgaris", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c023, section: pathogenesis, statement: "Graft-versus-host disease after bone marrow transplantation can involve the esophagus with lesions", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c024, section: pathogenesis, statement: "Esophagitis can follow external-beam radiotherapy given for thoracic cancer", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c026, section: gross, statement: "Candida esophagitis is characterized by white mucosal plaques", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c027, section: gross, statement: "Herpetic esophagitis can begin as plaques, small erosions or blisters", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c028, section: gross, statement: "In later herpetic esophagitis the typical lesion is a well-circumscribed ulcer", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c029, section: gross, statement: "Mucosal ulceration is common in CMV esophagitis", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c030, section: micro, statement: "Neutrophils in the squamous epithelium are typical of Candida esophagitis, but deep immunosuppression can make them disappear", sourceRef: { source: rubin-8e, chapter: "19", pages: "772-773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c031, section: micro, statement: "Yeast and pseudohyphae are found in necrotic squamous debris", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c032, section: micro, statement: "Herpes-infected epithelial cells at the ulcer edge carry either Cowdry A inclusions (pink, clear halo) or Cowdry B inclusions (ground-glass nuclei)", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c034, section: micro, statement: "Cells infected with CMV enlarge and show one large owl's-eye nuclear inclusion plus smaller cytoplasmic inclusions", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c035, section: micro, statement: "HSV-infected cells have intranuclear inclusions only", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c036, section: ancillary, statement: "On routine sections, neutrophils within squamous epithelium point to Candida esophagitis", sourceRef: { source: rubin-8e, chapter: "19", pages: "772-773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c037, section: ancillary, statement: "To see yeast and pseudohyphae in necrotic squamous debris, silver or PAS stains work best", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c038, section: diagnosis, statement: "HSV sits along the margin of the ulcer", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c039, section: diagnosis, statement: "CMV usually sits at the floor of the ulcer", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c040, section: clinical, statement: "Candida esophagitis usually presents with difficulty swallowing and severe swallowing pain", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c041, section: clinical, statement: "Herpetic esophagitis causes odynophagia", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c042, section: clinical, statement: "In dermolytic epidermolysis bullosa, swallowing is often difficult and painful, and blisters break down into oozing ulcers", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c043, section: clinical, statement: "Esophageal graft-versus-host disease may bring dysphagia, odynophagia and gastroesophageal reflux", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c044, section: prognosis, statement: "Squamous cell carcinoma is a much likelier late problem, for life, in survivors of caustic ingestion", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c045, section: prognosis, statement: "Liquid alkali almost always damages the esophagus severely", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c046, section: prognosis, statement: "Granular alkali causes severe complications in fewer than 25% of patients", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c047, section: prognosis, statement: "Severe esophageal injury affects half of patients after concentrated sulfuric or hydrochloric acid is swallowed", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c048, section: prognosis, statement: "In dermolytic epidermolysis bullosa, a stricture, if it forms, usually lies in the upper esophagus", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c049, section: prognosis, statement: "Irradiation of thoracic cancers can lead to esophageal stricture", sourceRef: { source: rubin-8e, chapter: "19", pages: "774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c050, section: differential, statement: "Candida esophagitis shows white plaques and neutrophils within the squamous epithelium", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c051, section: differential, statement: "Silver or PAS stains reveal Candida organisms", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c052, section: differential, statement: "Herpetic esophagitis shows sharply demarcated ulcers and inclusions in epithelial cells", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c053, section: differential, statement: "Herpetic inclusions are found in cells at the ulcer edge", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c054, section: differential, statement: "CMV esophagitis shows ulceration and infects endothelial and stromal cells", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c055, section: differential, statement: "CMV, with its owl's-eye inclusions, is usually located at the ulcer base", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c056, section: differential, statement: "In eosinophilic esophagitis the eosinophils are usually in the proximal or mid esophagus, and antireflux therapy does not help", sourceRef: { source: rubin-8e, chapter: "19", pages: "772" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c057, section: differential, statement: "Eosinophilic esophagitis shows increased intraepithelial eosinophils microscopically", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c058, section: high-yield, statement: "Candida gives white plaques, and silver or PAS shows yeasts and pseudohyphae", sourceRef: { source: rubin-8e, chapter: "19", pages: "772-773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c059, section: high-yield, statement: "HSV esophagitis shows ulcers with Cowdry A or B inclusions at the edge", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c060, section: high-yield, statement: "CMV is usually found at the ulcer base, with owl's-eye inclusions, in endothelial and stromal cells", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c061, section: high-yield, statement: "Alkalis cause liquefactive necrosis and strong acids cause coagulative necrosis", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c062, section: high-yield, statement: "People who survive caustic ingestion keep a permanently raised risk of squamous cell carcinoma", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c063, section: high-yield, statement: "Graft-versus-host disease, irradiation and epidermolysis bullosa can cause esophagitis", sourceRef: { source: rubin-8e, chapter: "19", pages: "773-774" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c064, section: traps, statement: "HSV inclusions are intranuclear only, whereas CMV cells carry cytoplasmic inclusions as well", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c065, section: traps, statement: "The eschar from strong acid limits the injury", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: infectious-and-chemical-esophagitis-c068, section: mnemonics, statement: "HSV lies along the margin of the ulcer and CMV at its floor", sourceRef: { source: rubin-8e, chapter: "19", pages: "773" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
