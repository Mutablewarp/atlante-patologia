entity: aortic-dissection
claims:
- {claimId: aortic-dissection-c001, section: definition, statement: "Blood dissects along the length of the aortic wall, forming a false lumen within it", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c002, section: definition, statement: "The aorta is the typical location, with the ascending segment affected most often, and its major branches can be drawn in too", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c003, section: definition, statement: "Type A thoracic dissection involves the ascending aorta only", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c004, section: definition, statement: "Type B thoracic dissection involves only the distal aorta", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c005, section: definition, statement: "Dissection occurs in as many as 1 of 400 autopsies", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c006, section: definition, statement: "Dissection is about three times as frequent in men as in women", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c007, section: definition, statement: "Dissection can occur at almost any age but peaks in the sixth and seventh decades", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c008, section: etiology, statement: "Nearly all patients with dissection have a history of hypertension", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c009, section: etiology, statement: "A bicuspid aortic valve, atherosclerosis and aortic root dilation of unknown cause go together with dissection", sourceRef: {source: rubin-8e, chapter: "16", pages: "626-627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c010, section: etiology, statement: "Some dissections occur with Marfan, Ehlers-Danlos or Loeys-Dietz syndrome or with filamin mutations", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c011, section: etiology, statement: "The fibrillin gene, coding for an extracellular matrix protein, carries the mutations identified in Marfan syndrome, a body-wide connective tissue disorder", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c012, section: etiology, statement: "Some patients have mutations in TGF-beta receptors 1 and 2, MYH11 or ACTA2", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c013, section: etiology, statement: "Normal aging brings a mild degree of medial fibrosis and patchy elastin loss in the aorta", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c014, section: etiology, statement: "Aortic medial necrosis can appear in Wilson disease after treatment with penicillamine, a drug that removes copper", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c015, section: pathogenesis, statement: "The usual underlying problem in dissection is a weak aortic media", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c016, section: pathogenesis, statement: "Cystic medial necrosis of Erdheim is the original name for focal loss of medial elastic and muscle fibers", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c017, section: pathogenesis, statement: "Why the medial layer degenerates is not clear", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c018, section: pathogenesis, statement: "Fibulin-5, which governs how elastic fibers are built, is lower in patients with thoracic dissection", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c019, section: pathogenesis, statement: "Smooth muscle cells secreting MMP-2 and its inhibitor abnormally may contribute", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c020, section: pathogenesis, statement: "In animals, copper deficiency impairs collagen cross-linking through lysyl oxidase and causes aortic dissection", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c021, section: pathogenesis, statement: "Feeding animals the lysyl oxidase inhibitor beta-aminopropionitrile has the same effect on the aorta", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c022, section: pathogenesis, statement: "Weak aortic connective tissue from one shared molecular defect may be the common thread", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c023, section: pathogenesis, statement: "What first starts the splitting of the media is disputed", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c024, section: pathogenesis, statement: "A crosswise tear through the intima and inner media is found in over 95% of cases", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c025, section: pathogenesis, statement: "Blood entering through the intimal tear dissects the media", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c026, section: pathogenesis, statement: "The tear may be secondary: bleeding from the vasa vasorum can strain the intima when cystic medial necrosis has weakened the media", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c027, section: gross, statement: "Most tears sit 1 to 2 cm over the aortic annulus, in the ascending aorta", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c028, section: gross, statement: "Within seconds the outer third of the wall is split off from the inner two thirds", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c029, section: gross, statement: "Arteries to the neck, kidneys, bowel and heart can be caught up too", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c030, section: gross, statement: "In the aorta opened lengthwise, a clot lies between the layers of the media", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c031, section: gross, statement: "A second tear downstream lets blood return to the lumen, giving a double-barreled aorta, in 5% to 10% of cases", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c032, section: gross, statement: "In about as many cases the false channel opens into a large artery, usually the iliac", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c033, section: micro, statement: "Metachromatic myxoid matrix fills spaces in the media where elastic and muscle fibers were lost in patches", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c034, section: micro, statement: "No true cysts exist; the apparent cysts are matrix pooled within the media", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c035, section: micro, statement: "In an atherosclerotic aorta, an elastic stain places the split in the outer third of the media", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c036, section: ancillary, statement: "An elastic stain shows the dissection plane within the media", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c037, section: ancillary, statement: "Aldehyde fuchsin staining reveals cystic medial necrosis through metachromatic pools in the wall", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c038, section: clinical, statement: "The typical complaint is a severe tearing sensation in the front of the chest, of sudden onset", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c039, section: clinical, statement: "The pain can be confused with an acute myocardial infarction", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c040, section: clinical, statement: "Patients often lose one or several arterial pulses", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c041, section: clinical, statement: "A murmur of aortic regurgitation is common", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c042, section: clinical, statement: "Hypertension is a frequent finding in dissection", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c043, section: clinical, statement: "Low blood pressure ominously suggests aortic rupture", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c044, section: clinical, statement: "Standard criteria identify tamponade and heart failure, which may complicate dissection", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c045, section: prognosis, statement: "Bleeding from the false channel into the pericardium or nearby spaces often kills because its outer wall is thin", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c046, section: prognosis, statement: "Without drug treatment of hypertension or surgery, 80% of patients were dead within 2 weeks", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c047, section: prognosis, statement: "Half of those surviving 2 weeks died within 3 months", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c048, section: prognosis, statement: "Overall mortality is now under 20%, owing to prompt surgery and control of hypertension", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c049, section: differential, statement: "In dissection, blood opens a second channel inside the arterial wall", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c050, section: differential, statement: "Dissection pain can be mistaken for a myocardial infarction", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c051, section: differential, statement: "Periarteritis and obliterative endarteritis of the ascending aortic vasa vasorum mark syphilitic aneurysm", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c052, section: differential, statement: "In syphilitic aortitis the tree-bark look of the intima comes from medial scars that sink below the surface", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c053, section: high-yield, statement: "Almost all dissection patients have a hypertension history", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c054, section: high-yield, statement: "Cystic medial necrosis is the classic medial lesion and its cysts are matrix pools", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c055, section: high-yield, statement: "Marfan (fibrillin gene), Ehlers-Danlos and Loeys-Dietz syndromes are specific associated disorders", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c056, section: high-yield, statement: "Type A involves the ascending aorta alone and type B only the distal aorta", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c057, section: high-yield, statement: "A transverse intimal tear is present in over 95% of cases, mostly in the ascending aorta", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c058, section: high-yield, statement: "Tearing chest pain is the classic presentation and can mimic myocardial infarction", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c059, section: high-yield, statement: "Hypotension suggests rupture", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c060, section: high-yield, statement: "Blood escaping the aorta, for example into the pericardium, is a frequent cause of death", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c061, section: high-yield, statement: "A double-barreled aorta forms in 5% to 10% of cases", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c062, section: high-yield, statement: "Overall mortality is under 20% with surgery and blood pressure control", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c063, section: traps, statement: "The cyst-like spaces are pools of matrix between medial cells", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c064, section: traps, statement: "A fall in blood pressure warns that the aorta may have ruptured", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c065, section: traps, statement: "Dissection can be mistaken for a heart attack", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c066, section: traps, statement: "Type A is ascending aorta alone; type B is distal aorta only", sourceRef: {source: rubin-8e, chapter: "16", pages: "626"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c067, section: traps, statement: "Mortality is now under 20% versus 80% at 2 weeks before treatment", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: aortic-dissection-c068, section: mnemonics, statement: "Tearing chest pain, loss of medial elastic fibers, ascending aorta in type A and hypotension signaling rupture are key features", sourceRef: {source: rubin-8e, chapter: "16", pages: "627"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
