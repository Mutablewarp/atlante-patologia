entity: giant-cell-arteritis
claims:
- {claimId: giant-cell-arteritis-c001, section: definition, statement: "The temporal artery is the usual target of this granulomatous inflammation of large arteries", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c002, section: definition, statement: "The aorta, its branches and other cranial arteries can be involved as well", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c003, section: definition, statement: "Aortic aneurysms and dissections are seen", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c004, section: definition, statement: "Among the vasculitides this is the commonest", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c005, section: definition, statement: "Cases before 50 are rare; the mean age at onset is near 70 years", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c006, section: definition, statement: "Incidence increases with advancing age", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c007, section: definition, statement: "Female predominance is slight", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c008, section: definition, statement: "Takayasu disease is a vasculitis of younger patients that involves the aorta and its branches, overlapping in vessel distribution", sourceRef: {source: rubin-8e, chapter: "16", pages: "620, 622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c009, section: definition, statement: "Typical Takayasu patients are under 30, and about 90% are women", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c010, section: etiology, statement: "The etiology of the disease is obscure", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c011, section: etiology, statement: "HLA-DR4 is an associated allele", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c012, section: etiology, statement: "Familial occurrence among first-degree relatives is a pointer to genetic factors", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c013, section: etiology, statement: "Takayasu arteritis has no known cause; autoimmunity is a proposed explanation", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c014, section: pathogenesis, statement: "Activated macrophages and CD4+ helper T cells are immunologic findings that point to an immune mechanism", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c015, section: pathogenesis, statement: "One specific ICAM-1 polymorphism is associated with the disease", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c016, section: pathogenesis, statement: "There are no B lymphocytes in the lesions", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c017, section: pathogenesis, statement: "MMPs that degrade the extracellular matrix come from macrophages at the intima-media junction", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c018, section: pathogenesis, statement: "Patients are ANCA-negative", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c019, section: pathogenesis, statement: "A relationship to rheumatoid diseases is plausible given the general muscle aching and the widespread distribution of the disease", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c020, section: gross, statement: "Nodular thickening makes involved arteries cordlike", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c021, section: gross, statement: "Thrombus may occlude the lumen, which is otherwise reduced to a slit", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c022, section: gross, statement: "In Takayasu arteritis the aortic wall is thick and carries scattered raised plaques in the intima", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c023, section: gross, statement: "Blood flow is often obstructed by localized stenosis or occlusion of aortic branches", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c024, section: gross, statement: "The term pulseless disease is sometimes used when the subclavian arteries are involved", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c025, section: gross, statement: "The distal thoracic and abdominal aorta often carry aneurysms of different sizes", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c026, section: micro, statement: "Inflammation in intima and media is granulomatous", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c027, section: micro, statement: "The infiltrate holds eosinophils and neutrophils in varying numbers together with macrophages, lymphocytes and plasma cells", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c028, section: micro, statement: "Giant cells are usually found near the internal elastic lamina", sourceRef: {source: rubin-8e, chapter: "16", pages: "620-621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c029, section: micro, statement: "Giant cell count is highly variable", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c030, section: micro, statement: "Foreign-body type and Langhans type giant cells both appear", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c031, section: micro, statement: "At foci of necrosis the internal elastic lamina is broken up and distorted", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c032, section: micro, statement: "In advanced lesions the elastica may be lost entirely", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c033, section: micro, statement: "Now and then giant cells contain elastic fragments", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c034, section: micro, statement: "Late stages are characterized by fibrotic media and prominent intimal thickening", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c035, section: micro, statement: "After a thrombus has obliterated the lumen, organization and recanalization occur", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c036, section: micro, statement: "Takayasu early phase: occasional Langhans cells among neutrophils and mononuclear cells, with acute inflammation of the entire wall", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c037, section: micro, statement: "Takayasu late phase: marked intimal proliferation with scarring", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c038, section: micro, statement: "Takayasu arteritis inflames the vasa vasorum in a pattern like syphilitic aortitis", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c039, section: micro, statement: "Superimposed atherosclerosis can conceal the primary process", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c040, section: ancillary, statement: "In a high-power temporal artery view the internal elastic lamina is fragmented and giant cells sit beside it", sourceRef: {source: rubin-8e, chapter: "16", pages: "620-621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c041, section: ancillary, statement: "Because lesions are patchy, a temporal artery biopsy misses the diagnosis in up to 40% of classic cases", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c042, section: clinical, statement: "Throbbing temporal pain and headache are the presenting features", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c043, section: clinical, statement: "Skin over the artery may be swollen, tender, reddened", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c044, section: clinical, statement: "Weight loss, fever and malaise can be the early systemic features", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c045, section: clinical, statement: "The shoulders and hips may ache or feel stiff", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c046, section: clinical, statement: "Close to half of patients report visual symptoms", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c047, section: clinical, statement: "Sometimes rapidly, transient vision loss can become permanent blindness, in one eye or both", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c048, section: clinical, statement: "Occasionally the disease causes gastrointestinal, CNS or myocardial infarcts, which may be lethal", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c049, section: clinical, statement: "Early Takayasu: dyspnea, visual disturbances and dizziness with constitutional symptoms; syncope only occasionally", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c050, section: clinical, statement: "Later in the disease the limbs can show claudication that comes and goes", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c051, section: clinical, statement: "A limb pulse can vanish, and blood pressure may become asymmetric between sides", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c052, section: clinical, statement: "Hypertension may be explained by renal artery stenosis or aortic coarctation", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c053, section: clinical, statement: "Congestive heart failure eventually affects most Takayasu patients", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c054, section: clinical, statement: "Total blindness is the severe end of Takayasu visual loss, with field defects at the mild end", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c055, section: diagnosis, statement: "Onset age is a discriminator against Takayasu disease and other vasculitides of younger people", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c056, section: prognosis, statement: "Most cases resolve on their own, and symptoms fade over 6 to 12 months", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c057, section: prognosis, statement: "Corticosteroids work strikingly well, and symptoms usually ease within days", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c058, section: prognosis, statement: "Corticosteroids work in the early phase of Takayasu arteritis", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c059, section: prognosis, statement: "Reconstructive surgery is required for advanced Takayasu lesions", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c060, section: differential, statement: "Elderly patients, temporal and other cranial arteries, granulomatous histology", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c061, section: differential, statement: "Temporal artery biopsy is the tissue sample but patchy disease can be missed", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c062, section: differential, statement: "Takayasu: young women, aorta and branches, pulse and blood pressure differences", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c063, section: differential, statement: "Age at onset points toward giant cell arteritis or Takayasu", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c064, section: differential, statement: "Microscopic polyangiitis involves only arterioles and the smallest arteries", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c065, section: differential, statement: "P-ANCA is strongly associated with microscopic polyarteritis", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c066, section: differential, statement: "GPA: glomerular disease together with granulomas in lungs, sinuses and nose", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c067, section: differential, statement: "ANCA testing is positive in more than 90% of GPA patients", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c068, section: high-yield, statement: "Large-vessel granulomatous arteritis, temporal artery typical, older patients", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c069, section: high-yield, statement: "Patchy skip lesions make a temporal artery biopsy non-diagnostic in up to 40% of classic cases", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c070, section: high-yield, statement: "Giant cells sit by the broken internal elastic lamina", sourceRef: {source: rubin-8e, chapter: "16", pages: "620-621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c071, section: high-yield, statement: "Vision loss can become permanent, whether one eye or both are affected", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c072, section: high-yield, statement: "Symptoms settle within days on corticosteroids", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c073, section: high-yield, statement: "Takayasu: young women, aorta and branches, pulseless disease with subclavian involvement", sourceRef: {source: rubin-8e, chapter: "16", pages: "622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c074, section: high-yield, statement: "No ANCA in giant cell arteritis", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c075, section: traps, statement: "Patchy inflammation can be missed by a biopsy even in a clinically classic patient", sourceRef: {source: rubin-8e, chapter: "16", pages: "621"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c076, section: traps, statement: "The aorta, its branches and other cranial arteries can be involved beyond the temporal artery", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c077, section: traps, statement: "Takayasu is a separate disease: young women, aorta-centered, versus older patients in giant cell arteritis", sourceRef: {source: rubin-8e, chapter: "16", pages: "620, 622"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c078, section: traps, statement: "ANCA-negative, so not an ANCA-associated vasculitis", sourceRef: {source: rubin-8e, chapter: "16", pages: "620"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: giant-cell-arteritis-c079, section: mnemonics, statement: "The mnemonic recaps earlier points: fragmented elastic lamina, narrowed lumen, visual loss, older age, quick steroid response", sourceRef: {source: rubin-8e, chapter: "16", pages: "620-621"}, status: verified, verifiedBy: agent, verifier: "fixer-agent", date: 2026-11-14}
