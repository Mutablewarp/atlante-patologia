entity: atherosclerosis
claims:
- {claimId: atherosclerosis-c001, section: definition, statement: "Over time the intima of large and medium-caliber arteries turns into a plaque of lipid and fibrous tissue infiltrated by inflammatory and smooth muscle cells", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c002, section: definition, statement: "As atheromas (plaques) grow over several decades, they narrow the lumen", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c003, section: definition, statement: "In Western countries over half of all deaths are traced to ischemic damage in heart, brain and limbs from atherosclerosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "599"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c004, section: etiology, statement: "Hypertension and smoking are major risk factors", sourceRef: {source: rubin-8e, chapter: "16", pages: "600, 607-608"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c005, section: etiology, statement: "Obesity and a strong family history add to the risk", sourceRef: {source: rubin-8e, chapter: "16", pages: "600, 608"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c006, section: etiology, statement: "Other risk factors build up over time, so age and male sex probably only mark myocardial infarction risk", sourceRef: {source: rubin-8e, chapter: "16", pages: "608"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c007, section: etiology, statement: "Because cholesterol travels in both atherogenic and antiatherogenic lipoproteins, total serum cholesterol is not a reliable predictor of risk", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c008, section: etiology, statement: "The more a person smokes, the more severe the coronary and aortic atherosclerosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c009, section: etiology, statement: "In people without homocystinuria, a mild rise in plasma homocysteine is an independent risk factor for atherosclerosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "608"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c010, section: etiology, statement: "A high Lp(a) level makes myocardial infarction and ischemic heart disease more likely", sourceRef: {source: rubin-8e, chapter: "16", pages: "608"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c011, section: etiology, statement: "Metabolic syndrome raises cardiovascular risk", sourceRef: {source: rubin-8e, chapter: "16", pages: "608"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c012, section: etiology, statement: "Mutations in the LDL receptor gene cause familial hypercholesterolemia, which brings premature atherosclerosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "610"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c013, section: etiology, statement: "The genetic contribution is polygenic, with many contributing variants; rare monogenic lipid disorders are the exception", sourceRef: {source: rubin-8e, chapter: "16", pages: "599-600"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c014, section: pathogenesis, statement: "Lesions start where wall shear is low and erratic, such as at arterial branches and bends", sourceRef: {source: rubin-8e, chapter: "16", pages: "600"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c015, section: pathogenesis, statement: "Endothelial injury, for instance from hypertension or diabetes (also abnormal flow or high cholesterol), allows LDL to bring lipid into the intima", sourceRef: {source: rubin-8e, chapter: "16", pages: "601"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c016, section: pathogenesis, statement: "Macrophages enter the intima after sticking to endothelium on which oxidized LDL has switched on adhesion molecules", sourceRef: {source: rubin-8e, chapter: "16", pages: "601"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c017, section: pathogenesis, statement: "Lipid-laden macrophages that die leave their fat behind in the wall", sourceRef: {source: rubin-8e, chapter: "16", pages: "601"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c018, section: pathogenesis, statement: "Growth factors from macrophages promote the build-up of smooth muscle cells in the lesion", sourceRef: {source: rubin-8e, chapter: "16", pages: "601"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c019, section: pathogenesis, statement: "T cells inside plaques suggest that oxidized LDL may be a target of the body's own immune response", sourceRef: {source: rubin-8e, chapter: "16", pages: "602-603"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c020, section: pathogenesis, statement: "Ischemic necrosis of the poorly nourished deep part of the thickened intima produces the central necrotic core", sourceRef: {source: rubin-8e, chapter: "16", pages: "602"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c021, section: pathogenesis, statement: "Platelet and macrophage angiogenic factors and the necrotic core drive growth of new vessels from the vasa vasorum into the plaque", sourceRef: {source: rubin-8e, chapter: "16", pages: "602"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c022, section: pathogenesis, statement: "Smooth muscle cells in the fibrous cap shield the lumen from the clot-promoting necrotic core", sourceRef: {source: rubin-8e, chapter: "16", pages: "602"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c023, section: pathogenesis, statement: "Outward remodeling of the wall preserves the lumen until the plaque fills about half of it", sourceRef: {source: rubin-8e, chapter: "16", pages: "602-603"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c024, section: pathogenesis, statement: "In the adaptation stage plaques are clinically silent, yet small ones can rupture", sourceRef: {source: rubin-8e, chapter: "16", pages: "603"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c025, section: gross, statement: "Fatty streaks occur in both children and adults as yellowish, barely raised stripes of lipid within the intima", sourceRef: {source: rubin-8e, chapter: "16", pages: "601, 603"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c026, section: gross, statement: "Adult disease is much more marked in the abdominal aorta, whereas streaks in children are frequent in the thoracic aorta", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c027, section: gross, statement: "Other factors decide whether a fatty streak, a likely precursor, turns into a clinically important plaque", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c028, section: gross, statement: "The intimal cell mass, a pale lipid-free thickening where arteries branch, is another candidate precursor of plaque", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c029, section: gross, statement: "A simple plaque is a raised yellowish patch of intima with crisp margins", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c030, section: gross, statement: "One-sided, rather than circumferential, plaques are common in coronary and cerebral arteries", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c031, section: gross, statement: "Late plaques coalesce into larger lesions in muscular arteries", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c032, section: gross, statement: "Severe atherosclerosis is most frequent in the abdominal aorta and iliac arteries, followed by the proximal coronary arteries", sourceRef: {source: rubin-8e, chapter: "16", pages: "606"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c033, section: micro, statement: "A foam cell of a fatty streak is a macrophage or a smooth muscle cell loaded with lipid, macrophages carrying the most", sourceRef: {source: rubin-8e, chapter: "16", pages: "603-604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c034, section: micro, statement: "Early plaques lie within the intima beneath the endothelium and hardly extend into the media", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c035, section: micro, statement: "The fibrous cap is mostly smooth muscle cells within connective tissue, with scattered immune cells and foam cells", sourceRef: {source: rubin-8e, chapter: "16", pages: "602, 604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c036, section: micro, statement: "Foreign-body giant cells and cholesterol crystals may accompany the necrotic debris of the core", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c037, section: micro, statement: "Healthy coronary arteries seldom show vessels sprouting from the vasa vasorum, while atherosclerotic plaques have plenty", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c038, section: micro, statement: "Calcification occurs in necrotic zones and can also affect other parts of the plaque", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c039, section: ancillary, statement: "Microscopic examination shows foam cells, a fibrous cap, a necrotic core and cholesterol clefts (cholesterol clefts are mentioned on page 602)", sourceRef: {source: rubin-8e, chapter: "16", pages: "602, 604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c040, section: ancillary, statement: "Hemosiderin-filled macrophages in a plaque mark where an earlier hemorrhage was cleared", sourceRef: {source: rubin-8e, chapter: "16", pages: "605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c041, section: ancillary, statement: "Cholesterol emboli lodge most often in the kidney, where they show as needle-like clefts", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c042, section: clinical, statement: "The consequences depend on how long the disease has lasted and on where the vessel lies and how big it is", sourceRef: {source: rubin-8e, chapter: "16", pages: "606"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c043, section: clinical, statement: "A clot on a plaque can abruptly plug a muscular artery and infarct the tissue it supplies", sourceRef: {source: rubin-8e, chapter: "16", pages: "606-607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c044, section: clinical, statement: "A kidney with renal artery stenosis atrophies; chronic ischemia from gradual narrowing atrophies any organ", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c045, section: diagnosis, statement: "LDL cholesterol is the value that mainly guides treatment decisions on lipids", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c046, section: diagnosis, statement: "Streptokinase or tissue plasminogen activator can dissolve certain occlusive thrombi", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c047, section: prognosis, statement: "A clot forms in the lumen after the cap tears, because the necrotic core, rich in tissue factor, is highly thrombogenic and meets the blood", sourceRef: {source: rubin-8e, chapter: "16", pages: "605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c048, section: prognosis, statement: "Rupture is associated with a thin fibrous cap and a large lipid core", sourceRef: {source: rubin-8e, chapter: "16", pages: "603, 605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c049, section: prognosis, statement: "Inflammation and reduced smooth muscle cells are also associated with plaque rupture", sourceRef: {source: rubin-8e, chapter: "16", pages: "603, 605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c050, section: prognosis, statement: "Stenosis under 50% is typical of most plaques that later rupture", sourceRef: {source: rubin-8e, chapter: "16", pages: "605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c051, section: prognosis, statement: "Pieces of a mural thrombus can embolize and lodge farther downstream in the vessel", sourceRef: {source: rubin-8e, chapter: "16", pages: "605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c052, section: prognosis, statement: "The plaque can enlarge and narrow the lumen more when its fragile new vessels bleed", sourceRef: {source: rubin-8e, chapter: "16", pages: "603, 605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c053, section: prognosis, statement: "Plaque calcification involves osteochondrocytic (osteoblast-like) differentiation", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c054, section: prognosis, statement: "Aneurysm formation is typical in the abdominal aorta, where a complicated lesion extending into the media weakens the wall", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c055, section: prognosis, statement: "Such an aneurysm may rupture, or thrombi inside it may embolize", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c056, section: prognosis, statement: "Atheromatous material shed by an ulcerated plaque can travel downstream as cholesterol emboli", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c057, section: prognosis, statement: "Within 3 to 6 months of a successful balloon angioplasty, 30% to 40% of the arteries restenose", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c058, section: prognosis, statement: "Restenosis results from intimal hyperplasia, in which smooth muscle cells multiply and deposit extracellular matrix", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c059, section: prognosis, statement: "Stents that release antiproliferative drugs hold back excess smooth muscle growth in the artery", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c060, section: differential, statement: "A fatty streak is a flat yellow intimal lesion with foam cells and occurs in children", sourceRef: {source: rubin-8e, chapter: "16", pages: "601, 603"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c061, section: differential, statement: "The intimal cell mass contains no lipid; smooth muscle and connective tissue form a pale thickening where arteries branch", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c062, section: differential, statement: "An aneurysm that complicates a plaque stems from collagen digestion by MMPs plus elastin loss that thins the wall", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c063, section: differential, statement: "A cholesterol embolus appears as needle-like spaces in a small artery blocked by debris from an ulcerated plaque", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c064, section: high-yield, statement: "A fatty streak with foam cells may precede a plaque that has a necrotic core and a fibrous cap", sourceRef: {source: rubin-8e, chapter: "16", pages: "602, 604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c065, section: high-yield, statement: "Oxidized LDL and macrophages drive early lesion formation", sourceRef: {source: rubin-8e, chapter: "16", pages: "601"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c066, section: high-yield, statement: "Remodeling hides the plaque until it occupies about half of the lumen", sourceRef: {source: rubin-8e, chapter: "16", pages: "603"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c067, section: high-yield, statement: "The abdominal aorta and iliac arteries are the most frequent sites of severe atherosclerosis", sourceRef: {source: rubin-8e, chapter: "16", pages: "606"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c068, section: high-yield, statement: "A thin cap and a large lipid core are associated with rupture", sourceRef: {source: rubin-8e, chapter: "16", pages: "605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c069, section: high-yield, statement: "Intimal hyperplasia leads to restenosis after angioplasty", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c070, section: high-yield, statement: "LDL cholesterol is the main value used to decide treatment", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c071, section: traps, statement: "Rupture mostly occurs on plaques that narrow the lumen by less than 50%", sourceRef: {source: rubin-8e, chapter: "16", pages: "605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c072, section: traps, statement: "A fatty streak probably precedes a plaque, but other factors determine whether it progresses", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c073, section: traps, statement: "Treatment decisions use LDL cholesterol because total cholesterol includes antiatherogenic lipoproteins", sourceRef: {source: rubin-8e, chapter: "16", pages: "607"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c074, section: traps, statement: "The abdominal aorta is affected much more than the thoracic aorta in adults", sourceRef: {source: rubin-8e, chapter: "16", pages: "604"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c075, section: traps, statement: "A clot forming on a ruptured plaque can suddenly block the artery", sourceRef: {source: rubin-8e, chapter: "16", pages: "603, 606"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
- {claimId: atherosclerosis-c076, section: mnemonics, statement: "Plaque evolution runs from fatty streak and oxidized LDL through adaptive remodeling to cap rupture with mural thrombus", sourceRef: {source: rubin-8e, chapter: "16", pages: "601-603, 605"}, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14}
