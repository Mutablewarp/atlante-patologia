entity: light-chain-cast-nephropathy
claims:
  - { claimId: light-chain-cast-nephropathy-c001, section: definition, statement: "Tubular casts and tubular cell damage define the disease; both are caused by monoclonal light chains passing into the urine.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c002, section: definition, statement: "Among myeloma patients it is the most frequent kidney disease, arising as a complication of the tumor.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c003, section: etiology, statement: "Four renal diseases can result from myeloma: cast nephropathy, AL amyloidosis, and deposition disease of light chains or of heavy chains.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c004, section: etiology, statement: "Which renal disease a patient develops depends on the structure of the light chain.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c005, section: etiology, statement: "Occasionally a patient shows several of these kidney diseases together.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c006, section: pathogenesis, statement: "Circulating light chains are filtered at the glomerulus.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c007, section: pathogenesis, statement: "Distal tubular cells secrete Tamm-Horsfall glycoprotein, and because urine is acidic the light chains bind it and aggregate into casts.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c008, section: pathogenesis, statement: "Casts obstruct tubules and free light chains are also toxic to tubular epithelium; both reduce renal function.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c009, section: micro, statement: "Casts pack the distal tubules and collecting ducts, looking solid and glass-like and staining deep pink with eosin.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c010, section: micro, statement: "Casts often break up, leaving jagged corners that give a crystal-like look.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c011, section: micro, statement: "Macrophages and multinucleated giant cells can gather around casts as a foreign-body reaction.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c012, section: micro, statement: "Tubular damage is usually accompanied by edema and chronic inflammation of the surrounding interstitium.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c013, section: micro, statement: "Tubular atrophy and interstitial fibrosis mark the lesions of longer duration.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c014, section: micro, statement: "Patchy calcification (nephrocalcinosis) is often found where the interstitium is scarred.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c015, section: ancillary, statement: "On light microscopy, casts are seen inside tubular lumina.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c016, section: ancillary, statement: "Antibody-based staining can detect immunoglobulin light chains and Tamm-Horsfall protein.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c017, section: clinical, statement: "The disease may appear as acute or chronic renal failure.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c018, section: clinical, statement: "Proteinuria is usually present but may stay below nephrotic range; most of it is light chain.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c019, section: diagnosis, statement: "With nephrotic-range protein loss in myeloma, cast nephropathy is less likely and AL amyloidosis or light-chain deposition disease fits better.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c020, section: prognosis, statement: "Long-standing injury leaves interstitial scarring and atrophic tubules.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c021, section: differential, statement: "In a myeloma patient, nephrotic-range proteinuria points to AL amyloidosis.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c022, section: differential, statement: "In a myeloma patient, nephrotic-range proteinuria points to light-chain deposition disease.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c023, section: differential, statement: "Cast nephropathy shows casts in distal tubules with fractures and giant cells.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c024, section: differential, statement: "Immunostaining for light chains and Tamm-Horsfall protein is available for cast nephropathy.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c025, section: high-yield, statement: "Cast nephropathy is the commonest kidney disease in multiple myeloma.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c026, section: high-yield, statement: "In acidic urine light chains bind Tamm-Horsfall protein and form casts in distal tubules.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c027, section: high-yield, statement: "Casts are fractured with sharp borders and can draw multinucleated giant cells.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c028, section: high-yield, statement: "Nephrotic-range proteinuria in myeloma points to AL amyloidosis or light-chain deposition disease.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c029, section: traps, statement: "Proteinuria in cast nephropathy is mainly light chains and not necessarily nephrotic-range.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c030, section: traps, statement: "Myeloma can produce four different kidney diseases, and several may coexist in one patient.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c031, section: traps, statement: "Besides obstruction by casts, free light chains are directly toxic to tubular epithelium.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: light-chain-cast-nephropathy-c032, section: mnemonics, statement: "Light chains in acidic urine attach to Tamm-Horsfall protein, forming casts that block tubules.", sourceRef: { source: rubin-8e, chapter: "22", pages: "963" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
