entity: salivary-gland-tumors
claims:
  - { claimId: salivary-gland-tumors-c001, section: definition, statement: "The commonest tumor of the salivary glands is the pleomorphic adenoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c002, section: definition, statement: "Pleomorphic adenoma is a benign proliferation with both epithelial and stromal elements.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c003, section: definition, statement: "Monomorphic adenomas, the second benign group, have no mesenchymal component; their epithelium is regular and mostly glandular.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c004, section: definition, statement: "Of malignant salivary tumors, 15% start in minor glands, 10% in the submandibular gland and the remaining 75% in the parotid.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c006, section: definition, statement: "Roughly one in two tumors of the intraoral minor salivary glands is a cancer.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1306" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c007, section: definition, statement: "Two-thirds of major salivary gland tumors are pleomorphic adenomas.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c008, section: etiology, statement: "Most patients with pleomorphic adenoma are women or middle-aged people.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c009, section: etiology, statement: "In rare cases a pleomorphic adenoma present for many years contains a carcinoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c010, section: pathogenesis, statement: "Reciprocal translocations involving 8q12 activate the PLAG1 gene in most pleomorphic adenomas.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c011, section: pathogenesis, statement: "A t(11;19) translocation, found in more than 60% of mucoepidermoid carcinomas, generates the MECT1-MAML2 fusion gene.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c012, section: pathogenesis, statement: "The fusion is thought to interfere with Notch pathway signaling in these cancers.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c013, section: pathogenesis, statement: "A t(6;9) translocation is a consistent finding in adenoid cystic carcinoma and joins the MYB proto-oncogene to the transcription factor NFIB.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1323" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c014, section: pathogenesis, statement: "The ETV6-NTRK3 fusion oncogene of secretory carcinoma results from a t(12;15) translocation.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c015, section: pathogenesis, statement: "Because the NTRK3 kinase of the fusion is always active, the cells survive and keep dividing.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c016, section: pathogenesis, statement: "Warthin tumor may start from salivary tissue trapped in parotid lymph nodes; its origin is uncertain.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c017, section: gross, statement: "Cut open, a parotid pleomorphic adenoma shows a shiny white surface and a sharp border.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c018, section: gross, statement: "Pleomorphic adenoma has a fibrous capsule, yet nodules of tumor push out through it into the surrounding gland.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c019, section: gross, statement: "Acinic cell carcinoma usually measures under 3 cm and is a round mass with a capsule, sometimes cystic.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c020, section: gross, statement: "Warthin tumor tends to be cystic, with papillae protruding into the cysts.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c021, section: micro, statement: "Myoepithelial cells are the main cell type of pleomorphic adenoma and sit in a cartilage- or mucus-like matrix, while ductal cells form tubules or small cysts.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c022, section: micro, statement: "Lymphoid tissue rich in germinal centers surrounds the oncocyte-lined cysts and papillae of Warthin tumor.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c024, section: micro, statement: "Mucoepidermoid carcinoma combines mucus-secreting cells with squamous-type cells and intermediate cells.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c025, section: micro, statement: "High-grade mucoepidermoid carcinoma has highly irregular cells and almost no glands, while low-grade tumors form cystic, duct-like spaces.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c026, section: micro, statement: "Small cells with scant cytoplasm build the solid, tubular or cribriform growth patterns of adenoid cystic carcinoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c027, section: micro, statement: "An adenoid cystic carcinoma is defined as high grade when more than 30% of it grows in a solid pattern.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c028, section: micro, statement: "The apparent cysts of the cribriform pattern are pseudocysts that hold basement membrane-like material.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c029, section: micro, statement: "Acinic cell carcinoma imitates the secretory cells of normal salivary acini and has abundant basophilic cytoplasm.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c031, section: ancillary, statement: "Eosinophilic material inside the ducts of pleomorphic adenoma stains with PAS.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c032, section: ancillary, statement: "FISH with MAML2 break-apart probes detects disruption of the MAML2 gene in mucoepidermoid carcinoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c033, section: clinical, statement: "Pleomorphic adenoma enlarges slowly without pain and feels smooth, firm and mobile.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c034, section: clinical, statement: "Most pleomorphic adenomas arise in the superficial lobe of the parotid, which is affected nine times as often as the submandibular gland.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c035, section: clinical, statement: "A lateral pharyngeal or tonsillar swelling can be a deep parotid pleomorphic adenoma that has grown into the parapharyngeal space.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c036, section: clinical, statement: "Sudden growth or new pain in a pleomorphic adenoma present for years raises suspicion of carcinoma ex pleomorphic adenoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c037, section: clinical, statement: "Curative surgery for pleomorphic adenoma can require resecting the facial nerve.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c038, section: clinical, statement: "In 15% of cases the clearly benign Warthin tumor of the parotid is bilateral.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c039, section: clinical, statement: "Warthin tumor stands alone among salivary gland tumors in affecting men more often than women.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c040, section: clinical, statement: "Of minor gland tumors 10% are mucoepidermoid carcinomas, as are 5-10% of major gland tumors.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c041, section: clinical, statement: "Mucoepidermoid carcinoma mostly affects adult women as a firm, painless swelling that enlarges slowly.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c042, section: clinical, statement: "Two-thirds of adenoid cystic carcinomas are in minor salivary glands, where they form 20% of tumors, compared with 5% of major gland tumors.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1323" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c043, section: clinical, statement: "Spread along perineural spaces explains why adenoid cystic carcinoma is often painful.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c045, section: clinical, statement: "Most secretory carcinomas begin in the parotid gland.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c046, section: diagnosis, statement: "Histology sets the grade: in mucoepidermoid carcinoma through the mix of cell types and spaces, and in adenoid cystic carcinoma through the proportion of solid growth.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322, 1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c047, section: prognosis, statement: "Tumor implanted or left behind at surgery, including nodules protruding past the capsule, causes recurrence of pleomorphic adenoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c048, section: prognosis, statement: "The prognosis is excellent when carcinoma ex pleomorphic adenoma remains within the capsule or invades no more than 1.5 mm beyond it.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c049, section: prognosis, statement: "Carcinoma ex pleomorphic adenoma that invades deeper than 1.5 mm is aggressive and has a poor prognosis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c050, section: prognosis, statement: "Regardless of the primary site, more than 90% of patients with mucoepidermoid carcinoma survive 5 years.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1323" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c051, section: prognosis, statement: "High-grade mucoepidermoid carcinoma has a much worse survival, 20% to 40%.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1323" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c052, section: prognosis, statement: "Grade dictates treatment of mucoepidermoid carcinoma: high-grade tumors need radiation therapy in addition to surgery, while low-grade tumors are treated surgically.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1323" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c053, section: prognosis, statement: "Despite spreading slowly, adenoid cystic carcinoma is found late and is hard to excise, so its long-term prognosis is poor.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c054, section: prognosis, statement: "About 15% of patients with high-grade adenoid cystic carcinoma are alive 5 years after diagnosis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c055, section: prognosis, statement: "With surgery, about 90% of patients with acinic cell carcinoma are alive at 5 years.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c056, section: prognosis, statement: "Local recurrence occurs in one-third of patients with acinic cell carcinoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c057, section: differential, statement: "In pleomorphic adenoma, epithelial cells are set in a cartilage-like or mucus-rich matrix.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c058, section: differential, statement: "Warthin tumor is dense lymphoid tissue enclosing gland-lined cystic spaces.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c059, section: differential, statement: "Mucoepidermoid carcinoma mixes mucus-producing and epidermoid cells with a third, intermediate type.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1323" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c060, section: differential, statement: "Adenoid cystic carcinoma grows in solid, tubular or cribriform patterns and infiltrates perineural spaces.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c061, section: differential, statement: "Acinic cell carcinoma has basophilic cells that mimic the gland's own secretory acini.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c062, section: differential, statement: "Secretory carcinoma resembles adenoid cystic carcinoma but has the t(12;15) ETV6-NTRK3 fusion.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c063, section: high-yield, statement: "Pleomorphic adenoma is the most common benign salivary gland tumor.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c064, section: high-yield, statement: "Roughly half of intraoral minor gland tumors are cancers.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1306" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c065, section: high-yield, statement: "Warthin tumor is the only salivary gland tumor more frequent in men.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c066, section: high-yield, statement: "MAML2 fusion characterizes mucoepidermoid carcinoma, MYB-NFIB adenoid cystic carcinoma and ETV6-NTRK3 secretory carcinoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322-1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c067, section: high-yield, statement: "Perineural infiltration by adenoid cystic carcinoma makes it often painful.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c068, section: high-yield, statement: "Curative surgery for pleomorphic adenoma can require resecting the facial nerve.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c069, section: traps, statement: "Pleomorphic adenoma, the older benign mixed tumor, is benign, and its neoplastic component is of epithelial origin.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c070, section: traps, statement: "A returning pleomorphic adenoma is usually tumor that grew back locally, not a malignant change.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1321" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c071, section: traps, statement: "Adenoid cystic carcinoma grows slowly but has a poor long-term prognosis.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c072, section: traps, statement: "Low-grade mucoepidermoid carcinoma can still give metastases.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1323" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
  - { claimId: salivary-gland-tumors-c073, section: mnemonics, statement: "MAML2 fusion goes with mucoepidermoid carcinoma, MYB-NFIB with cribriform adenoid cystic carcinoma and ETV6-NTRK3 with secretory carcinoma.", sourceRef: { source: rubin-8e, chapter: "29", pages: "1322-1324" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-15 }
