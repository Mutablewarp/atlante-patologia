entity: benign-vs-malignant-tumors
claims:
  - { claimId: benign-vs-malignant-tumors-c001, section: definition, statement: "A benign tumor stays at its site of origin, without crossing into neighboring tissue and without sending cells to distant organs.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c002, section: definition, statement: "A malignant tumor metastasizes, and its distant colonies keep growing and invading, as the primary tumor does locally.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c003, section: definition, statement: "Because benign and malignant refer to behavior and not to morphology, the label forecasts the tumor's eventual course and clinical outcome.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c004, section: definition, statement: "Benign tumors usually resemble their tissue of origin more than malignant ones do, which makes them better differentiated.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c005, section: etiology, statement: "Fully mature neurons and heart muscle cells never form tumors, because only cell types able to divide become neoplastic.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c006, section: etiology, statement: "Neoplastic disease becomes more common with advancing age.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c007, section: pathogenesis, statement: "Each cancer begins in a single cell in which genomic and gene-expression alterations accumulate.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c008, section: pathogenesis, statement: "Invasion and vascular or lymphatic spread appear late, after many cell generations have accumulated mutations that free the cancer from growth control.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c009, section: pathogenesis, statement: "An epithelial cancer stops being in situ once it penetrates the basement membrane beneath its epithelium.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c010, section: pathogenesis, statement: "Beyond the basement membrane the tumor involves blood and lymphatic vessels and can invade the surrounding tissue.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c011, section: gross, statement: "A malignant tumor that breaks out of its organ of origin can involve the adjacent tissues.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c012, section: gross, statement: "In colon adenocarcinoma the bowel upstream of the stricture is dilated, because the tumor narrows the lumen.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c013, section: gross, statement: "Ovarian cancer that has shed into the abdominal cavity can implant as small nodules on the mesentery.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c014, section: micro, statement: "Atypia measures how unlike normal tissue a tumor looks, and greater atypia generally goes with a more aggressive tumor.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c015, section: micro, statement: "Chondrosarcoma cells have odd shapes and uneven dark nuclei, while a benign chondroma looks almost like normal cartilage.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c016, section: micro, statement: "In pleomorphism the size and shape of cells and nuclei are not uniform.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c017, section: micro, statement: "In anaplastic cells the nucleus is enlarged compared with the amount of cytoplasm.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c018, section: micro, statement: "Anaplastic nuclei are hyperchromatic.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c019, section: micro, statement: "Anaplastic nuclei have prominent nucleoli and chromatin that forms coarse clumps.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c020, section: micro, statement: "Atypical mitotic figures go beyond the simple bipolar form.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c021, section: micro, statement: "Tumor giant cells and other bizarre cells can occur in anaplasia.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c022, section: micro, statement: "Many malignant tumors show an unusually large number of mitoses.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c023, section: micro, statement: "Leiomyosarcoma is one tumor in which a very small number of mitoses can already justify a diagnosis of malignancy.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c024, section: micro, statement: "In some situations a tumor is called malignant without obvious proliferative activity.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c025, section: micro, statement: "Malignant cells often grow without orderly architecture, in sheets or around vessels.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c026, section: micro, statement: "Ischemic necrosis can occur in some malignant tumors whose blood supply is compromised.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c027, section: micro, statement: "Tumor cells invading blood vessels or lymphatics in particular point toward malignancy.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c028, section: micro, statement: "In follicular thyroid cancer, finding local invasion is a key sign of malignancy.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c029, section: micro, statement: "A tumor that has metastasized is, for that reason, malignant.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c030, section: ancillary, statement: "The rules for calling a tumor benign or malignant are empirical, built on experience of how tumors behaved rather than on theory.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c031, section: ancillary, statement: "Antibody-based techniques and molecular studies are used to determine a tumor's cell lineage.", sourceRef: { source: rubin-8e, chapter: "5", pages: "172" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c032, section: ancillary, statement: "Cytokeratin immunostaining can show a carcinoma that H&E alone leaves unclear, as in a poorly differentiated bladder cancer metastasis.", sourceRef: { source: rubin-8e, chapter: "5", pages: "172" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c033, section: ancillary, statement: "In an unpigmented metastatic melanoma, S-100 expression still indicates melanocytic origin.", sourceRef: { source: rubin-8e, chapter: "5", pages: "172" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c034, section: ancillary, statement: "Marker studies now do almost all the work that electron microscopy once did in analyzing tumors.", sourceRef: { source: rubin-8e, chapter: "5", pages: "172" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c035, section: ancillary, statement: "Sarcomas and lymphomas typically lack the desmosomes and junctional complexes that electron microscopy can show in many carcinomas.", sourceRef: { source: rubin-8e, chapter: "5", pages: "172-173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c036, section: ancillary, statement: "Melanomas have melanosomes or premelanosomes on electron microscopy.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c037, section: clinical, statement: "In general the patient survives a benign tumor, whereas a malignant tumor can be fatal.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c038, section: clinical, statement: "A benign meningioma can kill through its location, by pressing on a vital structure of the brain.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c039, section: clinical, statement: "Even a tiny benign ependymoma of the third ventricle can kill through hydrocephalus caused by blocked cerebrospinal fluid flow.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c040, section: clinical, statement: "A left atrial myxoma, though benign, can cause sudden death by obstructing flow through the mitral valve.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c041, section: clinical, statement: "Rarely, a hormonally active insulinoma or pheochromocytoma can endanger life despite being benign, through abrupt hypoglycemia or a hypertensive crisis respectively.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c042, section: clinical, statement: "Some thyroid and prostate cancers are so indolent that they never threaten the patient's life.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c043, section: clinical, statement: "A skin basal cell carcinoma rarely metastasizes, though it can invade the structures beneath it.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c044, section: clinical, statement: "A locally spreading cervical carcinoma may block the ureters, an example of invasion damaging a neighboring organ.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c045, section: clinical, statement: "A lung cancer that erodes a vessel can cause massive hemorrhage, and one that penetrates a bronchus can cause a bronchopleural fistula.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c046, section: diagnosis, statement: "Some tumors defeat experienced pathologists and are classified only once the clinical outcome is known, while for most the call is easy or becomes secure with additional study.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c047, section: diagnosis, statement: "In many endocrine tumors, pancreatic islet cell tumors included, histology cannot predict spread, so only the presence or absence of metastasis shows the tumor's nature.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c048, section: diagnosis, statement: "In treated patients, blood PSA (prostate), CA 125 (ovary) and CEA (gastrointestinal tract) are tracked to catch progression or metastasis.", sourceRef: { source: rubin-8e, chapter: "5", pages: "172" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c049, section: diagnosis, statement: "Population screening with blood tumor products has had little success, although the same tests can help follow a known cancer.", sourceRef: { source: rubin-8e, chapter: "5", pages: "172" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c050, section: prognosis, statement: "Most cancer deaths are due to local invasion and distant spread.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c051, section: prognosis, statement: "The primary tumor can usually be removed by surgical resection and seldom kills the patient by itself.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c052, section: prognosis, statement: "Carcinomas in situ can always be cured, since they have not yet invaded.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c053, section: prognosis, statement: "Growth rate is expressed as doubling time, the time a tumor takes for its volume to become twice as large.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c054, section: prognosis, statement: "Hematologic and mesenchymal malignancies tend to grow faster than solid epithelial tumors.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c055, section: prognosis, statement: "Solid epithelial tumors typically double in about 2 to 4 months on average, but individual tumors vary widely.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c056, section: prognosis, statement: "Internal cancers are usually first detected at about 1 cm3, which means at least 30 doublings from a single starting cell, so they are already advanced when found.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c057, section: prognosis, statement: "Tumor doubling time tends to correlate with prognosis.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c058, section: prognosis, statement: "Mitotic activity ignores cell death and mitosis can be prolonged in cancer cells, so mitotic counts may not reflect overall growth.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c059, section: differential, statement: "In carcinoma in situ of the cervix, neoplastic cells run through every layer of the epithelium, but the basement membrane stops them from crossing into the tissue below.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c060, section: differential, statement: "Many fibrosarcomas look histologically milder than nodular fasciitis, which is a reactive process.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c061, section: differential, statement: "Pathology alone cannot always separate a well-differentiated endocrine adenocarcinoma from a benign adenoma.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c062, section: high-yield, statement: "Invasion and metastasis define malignancy, and a benign tumor can do neither.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c063, section: high-yield, statement: "Anaplasia, cell appearance far from the normal counterpart, is a feature of malignant tumors, whereas benign tumors are better differentiated.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170-171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c064, section: high-yield, statement: "Finding metastases proves that a tumor is malignant.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c065, section: high-yield, statement: "A tumor that is benign by behavior can still be deadly when it sits in a critical place.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c066, section: high-yield, statement: "Invasion and metastasis, not the primary tumor itself, cause most cancer deaths.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c067, section: high-yield, statement: "A carcinoma that has not penetrated the basement membrane is in situ and invariably curable.", sourceRef: { source: rubin-8e, chapter: "5", pages: "173" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c068, section: traps, statement: "The suffix oma does not guarantee a benign tumor: melanoma, for instance, is highly malignant.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c069, section: traps, statement: "Basal cell carcinoma has a malignant histologic look, yet it seldom spreads and does not endanger life.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c070, section: traps, statement: "A benign tumor in a critical location can be deadly.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c071, section: traps, statement: "Mitotic counts may not track overall tumor growth or doubling time, since mitosis can be prolonged and cell death is not counted.", sourceRef: { source: rubin-8e, chapter: "5", pages: "176" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c072, section: traps, statement: "In many endocrine tumors the microscopic picture cannot foretell spread, so behavior alone shows whether the tumor is benign or malignant.", sourceRef: { source: rubin-8e, chapter: "5", pages: "170" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
  - { claimId: benign-vs-malignant-tumors-c073, section: mnemonics, statement: "Features of malignancy covered on these pages: metastasis, atypia, invasion, disorganized growth, high mitotic activity and ischemic necrosis.", sourceRef: { source: rubin-8e, chapter: "5", pages: "171" }, status: verified, verifiedBy: agent, verifier: "independent-verifier-agent", date: 2026-11-14 }
