entity: dystrophic-calcification
claims:
  - claimId: dystrophic-calcification-c001
    section: definition
    statement: "Dystrophic calcification is extracellular deposition of calcium salts in injured or dead tissue."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c002
    section: definition
    statement: "The dystrophic form begins with local tissue injury, whereas metastatic calcification reflects a systemic calcium/phosphate disorder (hypercalcemia and/or hyperphosphatemia); serum calcium is typically normal in the dystrophic form."
    sourceRef: { source: rubin-8e, chapter: "1, 30", pages: "29-30, 1348" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c003
    section: definition
    statement: "The mineral deposited in dystrophic calcification is calcium hydroxyapatite, the same mineral that makes up bone and teeth."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1396" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c004
    section: definition
    statement: "Tumors and traumatized sites, like any other abnormal or damaged soft tissue, can undergo dystrophic calcification."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1348" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c005
    section: etiology
    statement: "Tuberculous lesions of the lung and lymph nodes calcify."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c006
    section: etiology
    statement: "Fat necrosis follows pancreatitis or trauma, with fatty acids precipitating with calcium; traumatic breast fat necrosis calcifies with time."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c007
    section: etiology
    statement: "Old renal infarcts, healed renal cortical necrosis and necrotic renal papillae undergo dystrophic calcification."
    sourceRef: { source: rubin-8e, chapter: "22", pages: "954-955, 962" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c008
    section: etiology
    statement: "In osteonecrosis the necrotic marrow shows dystrophic calcification."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1346-1347" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c009
    section: etiology
    statement: "Atherosclerotic coronary arteries become calcified."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c010
    section: etiology
    statement: "Calcific aortic stenosis arises on rheumatic valves, congenitally bicuspid valves and age-degenerated normal three-cusped aortic valves; mitral valves and the mitral annulus may also calcify."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "671" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c011
    section: etiology
    statement: "In Mönckeberg sclerosis the media of muscular arteries calcifies, typically in the limb arteries of older people."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "617" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c012
    section: etiology
    statement: "Rapid cell turnover in breast tumors can leave dying cells that calcify as small deposits."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c013
    section: etiology
    statement: "Some infections acquired before birth leave small calcified foci in the infant's brain."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c014
    section: etiology
    statement: "Soft tissues calcify more easily in body regions paralyzed by hemiplegia or quadriplegia."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1348" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c015
    section: pathogenesis
    statement: "A living cell keeps cytosolic calcium far below the extracellular level; once irreversibly injured it can no longer do so, and calcium flows in."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c016
    section: pathogenesis
    statement: "In injured cells the mitochondria are the only intracellular site where the accumulated calcium becomes visible."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c017
    section: pathogenesis
    statement: "Free fatty acids derived from the membrane lipids of dead cells capture calcium and serve as a nucleus for its precipitation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c018
    section: pathogenesis
    statement: "In fat necrosis lipases release fatty acids that bind calcium and precipitate as soaps."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39-40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c019
    section: pathogenesis
    statement: "Osteopontin and other proteins of normal bone formation may take part in dystrophic calcification, whose full mechanism is still not understood."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c020
    section: pathogenesis
    statement: "Aortic valve calcification is active: valve interstitial cells acquire osteoblast-like features and mineralize the matrix, with oxidized LDL and TGF-beta among the signals driving the change."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "671-672" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c021
    section: pathogenesis
    statement: "Calcific aortic stenosis is driven by turbulence of the blood crossing the valve, accumulated over many years."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "671" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c022
    section: gross
    statement: "To the touch, dystrophic calcium ranges from fine grains to hard, stony masses, and it is often visible to the naked eye."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c023
    section: gross
    statement: "Fat necrosis looks like irregular chalky white areas in adipose tissue."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c024
    section: gross
    statement: "In calcific aortic stenosis the cusp free edges are usually spared; the calcified nodules lie on the sinus side of each cusp, in its basal half."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "671" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c025
    section: gross
    statement: "Unlike rheumatic disease, degenerative calcific aortic stenosis leaves the commissures unfused."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "671" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c026
    section: gross
    statement: "Arteries with Mönckeberg medial sclerosis are hard and dilated."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "618" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c027
    section: micro
    statement: "Calcium deposits are amorphous and basophilic on routine staining."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c028
    section: micro
    statement: "Calcium soaps in fat necrosis appear at the edges of necrotic adipocyte islands among inflammatory cells."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c029
    section: micro
    statement: "Psammoma bodies are concentrically laminated, spherical calcific particles."
    sourceRef: { source: rubin-8e, chapter: "27", pages: "1217" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c030
    section: micro
    statement: "The psammoma bodies of papillary thyroid carcinoma form when tumor papillae calcify."
    sourceRef: { source: rubin-8e, chapter: "27", pages: "1217" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c031
    section: micro
    statement: "In Mönckeberg sclerosis dystrophic calcium forms rings in the media, the internal elastic lamina commonly calcifies in patches, and osseous metaplasia can develop."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "618" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c032
    section: ancillary
    statement: "Hematoxylin colors calcium deposits an intense blue."
    sourceRef: { source: rubin-8e, chapter: "22", pages: "965" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c033
    section: ancillary
    statement: "Von Kossa, a stain more specific for calcium than hematoxylin, turns the deposits black."
    sourceRef: { source: rubin-8e, chapter: "22", pages: "965" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c034
    section: clinical
    statement: "Calcified tuberculous foci in the lungs or lymph nodes may do no functional harm."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c035
    section: clinical
    statement: "Calcified mitral or aortic valves may fail to open fully and limit blood flow."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c036
    section: clinical
    statement: "Marked concentric left ventricular hypertrophy follows once aortic stenosis becomes severe; the valve usually becomes functionally significant after age 60."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "671-672" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c037
    section: clinical
    statement: "When coronary atheromas calcify, the oxygen supply of the myocardium may suffer."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c038
    section: clinical
    statement: "Mönckeberg sclerosis is usually harmless in clinical terms."
    sourceRef: { source: rubin-8e, chapter: "16", pages: "618" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c039
    section: clinical
    statement: "Breast fat necrosis presents as a hard mass that may mimic cancer, particularly once calcified (calcification point from ch1 p40)."
    sourceRef: { source: rubin-8e, chapter: "1, 25", pages: "40, 1077" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c040
    section: diagnosis
    statement: "Serum calcium is typically normal in dystrophic calcification; hypercalcemia or hyperphosphatemia suggests a metastatic process, which may coexist."
    sourceRef: { source: rubin-8e, chapter: "1, 30", pages: "29-30, 1348" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c041
    section: diagnosis
    statement: "Radiographically heterotopic calcification is irregular and amorphous and usually denser than bone, while bone has a spicular or trabecular pattern."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1348" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c042
    section: diagnosis
    statement: "Linear, branching calcifications on mammography can correspond to the calcified necrotic debris of comedo DCIS."
    sourceRef: { source: rubin-8e, chapter: "25", pages: "1089" }
    status: verified
    verifiedBy: agent
    verifier: "fixer-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c043
    section: diagnosis
    statement: "Calcium is basophilic on H&E and black with von Kossa."
    sourceRef: { source: rubin-8e, chapter: "22", pages: "965" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c044
    section: prognosis
    statement: "Dystrophic calcification can be functionally silent (tuberculous nodes) or can impair a structure that must be flexible (heart valves)."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c045
    section: prognosis
    statement: "Valve replacement gives excellent results as long as the ventricle can still recover; a hypertrophied left ventricle left untreated too long ends up dilated and failing."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "672" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c046
    section: prognosis
    statement: "Statins slow atherosclerosis but have not been shown to halt calcification of the aortic valve."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "672" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c047
    section: differential
    statement: "Metastatic calcification puts calcium into normal tissue, such as alveolar walls or the kidney, when the calcium-phosphate product rises (hypercalcemia or hyperphosphatemia), for example in chronic renal failure or primary hyperparathyroidism."
    sourceRef: { source: rubin-8e, chapter: "1, 30", pages: "30, 1348" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c048
    section: differential
    statement: "Calcium-containing stones grow when an organic nidus in the biliary or urinary tract gathers calcium from a fluid supersaturated with it."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "30" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c049
    section: differential
    statement: "Heterotopic ossification forms bone with a spicular or trabecular radiographic pattern."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1348" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c050
    section: high-yield
    statement: "Dystrophic calcification deposits calcium in damaged tissue with normal calcium metabolism."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29-30" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c051
    section: high-yield
    statement: "Membrane-derived fatty acids from dead cells bind calcium and seed precipitation."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c052
    section: high-yield
    statement: "Typical settings include tuberculosis, fat necrosis, atherosclerosis, heart valves, old infarcts and tumors."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29, 40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c053
    section: high-yield
    statement: "Calcium is basophilic on H&E and black with von Kossa."
    sourceRef: { source: rubin-8e, chapter: "22", pages: "965" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c054
    section: high-yield
    statement: "Psammoma bodies are concentrically laminated calcifications, classically found in papillary thyroid carcinoma."
    sourceRef: { source: rubin-8e, chapter: "27", pages: "1217" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c055
    section: high-yield
    statement: "Calcification of valves limits their flexibility, as in calcific aortic stenosis."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c056
    section: traps
    statement: "Metastatic, not dystrophic, calcification is defined by a systemic calcium/phosphate disorder (hypercalcemia and/or hyperphosphatemia)."
    sourceRef: { source: rubin-8e, chapter: "1, 30", pages: "29-30, 1348" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c057
    section: traps
    statement: "Metastatic calcification affects normal tissues whereas dystrophic needs injury."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "29-30" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c058
    section: traps
    statement: "Valvular calcification is an active cell-mediated process."
    sourceRef: { source: rubin-8e, chapter: "17", pages: "671-672" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c059
    section: traps
    statement: "Heterotopic calcification is amorphous on radiographs while heterotopic bone is trabecular."
    sourceRef: { source: rubin-8e, chapter: "30", pages: "1348" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c060
    section: traps
    statement: "Calcified fat necrosis of the breast can mimic a tumor."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "40" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c061
    section: mnemonics
    statement: "Original mnemonic restating that dystrophic calcification follows tissue damage with normal calcium, while metastatic follows deranged calcium/phosphate metabolism in healthy tissue."
    sourceRef: { source: rubin-8e, chapter: "1, 30", pages: "29-30, 1348" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c062
    section: mnemonics
    statement: "Original mnemonic restating the three classic psammoma body sites: papillary thyroid carcinoma (sourced here), serous ovarian carcinoma (see c063) and meningioma (see c064)."
    sourceRef: { source: rubin-8e, chapter: "27", pages: "1217" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c063
    section: micro
    statement: "Psammoma bodies are frequent in low-grade serous carcinoma of the ovary."
    sourceRef: { source: rubin-8e, chapter: "24", pages: "1061" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c064
    section: micro
    statement: "Meningiomas commonly contain psammoma bodies."
    sourceRef: { source: rubin-8e, chapter: "32", pages: "1513" }
    status: verified
    verifiedBy: agent
    verifier: "verifier-agent"
    date: 2026-11-03
  - claimId: dystrophic-calcification-c065
    section: ancillary
    statement: "Mammographic calcifications are sampled by targeted core needle biopsy; apart from carcinoma, the cores often show benign lesions such as sclerosing adenosis (which frequently calcifies) or columnar cell lesions."
    sourceRef: { source: rubin-8e, chapter: "25", pages: "1078, 1089" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c066
    section: ancillary
    statement: "Breast core biopsy specimens can be X-rayed, and the image shows the calcifications that the cores contain (Fig. 25-23A)."
    sourceRef: { source: rubin-8e, chapter: "25", pages: "1089" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c067
    section: ancillary
    statement: "Alizarin red is another calcium stain; like von Kossa, it brings out small or doubtful calcium deposits (shown in skin biopsies for calciphylaxis)."
    sourceRef: { source: rubin-8e, chapter: "22", pages: "965" }
    status: beyond-reference
    secondSource: { source: bahrani-2020, locator: "abstract (PubMed PMID 32604207), stated for skin biopsies in calciphylaxis; full text not read" }
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c068
    section: ancillary
    statement: "On electron microscopy the mitochondria of dead cells are swollen and calcified."
    sourceRef: { source: rubin-8e, chapter: "1", pages: "39" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
  - claimId: dystrophic-calcification-c069
    section: traps
    statement: "Renal infarcts and areas of cortical necrosis calcify in the dystrophic way, while the kidney of a hypercalcemic patient calcifies in the metastatic way (nephrocalcinosis)."
    sourceRef: { source: rubin-8e, chapter: "22", pages: "964" }
    status: verified
    verifiedBy: agent
    verifier: "independent-verifier-agent"
    date: 2026-11-09
