<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body spike viewer</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; }
  #stage { width: 100%; height: 100%; display: block; min-height: 0; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; align-items: center; }
  button { min-width: 44px; min-height: 44px; font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 6px; }
  button:focus-visible { outline: 3px solid #ad2c5b; outline-offset: 2px; }
</style>
</head>
<body>
<div class="bar">
  <button data-act="left" aria-label="Rotate left">&#8592;</button>
  <button data-act="right" aria-label="Rotate right">&#8594;</button>
  <button data-act="in" aria-label="Zoom in">+</button>
  <button data-act="out" aria-label="Zoom out">&minus;</button>
  <button data-act="reset">Reset</button>
  <span id="status" role="status">loading</span>
  <span id="fps"></span>
</div>
<canvas id="stage" aria-label="3D body spike"></canvas>
<script type="module" src="./main.js"></script>
</body>
</html>
